 SRC_la_action_help_button:0 "Action guide"
 SRC_la_action_help_open_tt:0 "View Northeast action rules and organisational cooperation."
 SRC_la_action_help_title:0 "Northeast Action Guide"
 SRC_la_action_help_close_tt:0 "Close the action guide."
 SRC_la_action_help_rules_tab:0 "Action rules"
 SRC_la_action_help_organisation_tab:0 "Cooperation"
 SRC_la_action_help_rules_body:0 "§YControl and roles§!\nSecure states build and replenish; contested states support combat; enemy states support organisation and sabotage.\nWorkers: equipment, industry and transport.\nUnderground: intelligence and contacts.\nGovernment: administration and recruitment.\nPeasants: manpower and rural supply.\nStudents: propaganda and political organisation.\nBusiness: procurement and transport.\n\n§YState traits§!\nIndustrial: workers x1.5, business x1.25.\nUrban: students x1.5, underground/business x1.25.\nBorder: peasants x1.5, underground x1.25.\nTransport: workers/underground/business x1.25.\nTrait bonuses cap at x1.75; cooperation is separate.\n\n§YCosts§!\nTooltips show actual costs and yields. Each action type shares a regional cooldown."
 SRC_la_action_help_organisation_body:0 "§YNetworks§!\nThe first action builds I; the second upgrades to II. I discounts workers/students by 10 PP and boosts enemy-area actions by 20%, or 25% for business. II opens three free operations, once each per state.\n\n§YAdministration§!\nField government becomes I after secure control. Public government gives II: peasants cost 10 PP less and yield 20% more. Secret committees improve networks and halve the first public government cost.\n\n§YCooperation§!\nYouth propaganda discounts underground/government by 10 PP for 60 days. Frontline propaganda boosts other actions by 10%. Student contacts shorten cooldowns to 30 days; new networks may wait only 15. Rural contacts boost network work by 10%.\n\n§YLimits§!\nOrganisation persists; temporary bonuses expire. Stability/war support grants are +0.5%, capped at four each. First-local propaganda rewards do not repeat."
