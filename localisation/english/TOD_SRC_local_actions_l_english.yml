 SRC_dongbei_activity_worker:0 "Worker action"
 SRC_dongbei_activity_worker_tt:0 "[SRC_la_worker_payload_tt]"
 SRC_dongbei_front_worker_src_tt:0 "Repair arsenals\nRifles [?SRC_local_worker_rifles|0], support equipment [?SRC_local_worker_support|0], army experience [?SRC_local_worker_xp|0]. 45 days of local factory/rail repair and military construction bonuses. Industrial states add 200 rifles and 10% factory repair.\n\nCost: £pol_power [?SRC_local_worker_cost|0]."
 SRC_dongbei_front_worker_gps_tt:0 "Workers' slowdown\n45 days of local GPS supply and railway repair penalties, plus factory disruption. A minor sabotage event has a 10% chance, or 15% in industrial states.\n\nCost: £pol_power [?SRC_local_worker_cost|0]."
 SRC_dongbei_front_worker_contested_tt:0 "Workers at the front\nRifles [?SRC_local_worker_rifles|0]. For 30 days the Red Army gains local attack and defence and reduced supply consumption.\n\nCost: £pol_power [?SRC_local_worker_cost|0]."
 SRC_dongbei_activity_underground:0 "Underground network"
 SRC_dongbei_activity_underground_tt:0 "[SRC_la_underground_payload_tt]"
 SRC_dongbei_front_underground_src_tt:0 "Hunt enemy agents\nEstablish permanent local contacts. For 45 days GPS monthly sabotage costs 25 instead of 15 PP and has a 5% instead of 10% success chance. Local reconnaissance and security improve.\n\nCost: £pol_power [?SRC_local_underground_cost|0]."
 SRC_dongbei_front_underground_gps_tt:0 "Build or upgrade the local underground network.\nCurrent level: [?SRC_local_network_level|0]/2.\n\nCost: £pol_power [?SRC_local_underground_cost|0]. Cooldown: [?SRC_local_underground_cooldown|0] days."
 SRC_dongbei_front_underground_contested_tt:0 "Frontline liaison\nFor 30 days GPS local defence and organisation recovery fall, while Red Army reconnaissance improves.\n\nCost: £pol_power [?SRC_local_underground_cost|0]."
 SRC_dongbei_activity_revgov:0 "Revolutionary government"
 SRC_dongbei_activity_revgov_tt:0 "[SRC_la_revgov_payload_tt]"
 SRC_dongbei_front_revgov_src_tt:0 "Revolutionary administration\nManpower [?SRC_local_revgov_manpower|0]; stability +0.5%, capped at four grants. Permanent level-II administration: peasant actions cost 10 PP less and yield 20% more. 70 days of local recruitment and supply. Prepared committees halve the first government action.\n\nCost: £pol_power [?SRC_local_revgov_cost|0]."
 SRC_dongbei_front_revgov_gps_tt:0 "Secret revolutionary committee\nPrepare a secret revolutionary committee. Underground work +20%; liberation creates provisional administration, temporary order and a one-time half-price government action.\n\nCost: £pol_power [?SRC_local_revgov_cost|0]."
 SRC_dongbei_front_revgov_contested_tt:0 "Field administration\nManpower [?SRC_local_revgov_manpower|0]; 30 days of local Red Army defence and recovery. Full control later converts the organisation into provisional administration without awarding manpower again.\n\nCost: £pol_power [?SRC_local_revgov_cost|0]."
 SRC_dongbei_activity_peasant:0 "Peasant action"
 SRC_dongbei_activity_peasant_tt:0 "[SRC_la_peasant_payload_tt]"
 SRC_dongbei_front_peasant_src_tt:0 "Rural mobilisation\nManpower [?SRC_local_peasant_manpower|0]; 45 days of reduced local supply consumption and increased recruitment. Border/agricultural states multiply base yields by 1.5.\n\nCost: £pol_power [?SRC_local_peasant_cost|0]."
 SRC_dongbei_front_peasant_gps_tt:0 "Rural contacts\nBuild lasting rural contacts: subsequent underground work +10%. Local GPS supply and recruitment fall for 45 days. No manpower is granted from enemy-held territory.\n\nCost: £pol_power [?SRC_local_peasant_cost|0]."
 SRC_dongbei_front_peasant_contested_tt:0 "Rural frontline support\n30 days of local Red Army defence, movement and reduced supply consumption.\n\nCost: £pol_power [?SRC_local_peasant_cost|0]."
 SRC_dongbei_activity_student:0 "Student action"
 SRC_dongbei_activity_student_tt:0 "[SRC_la_student_payload_tt]"
 SRC_dongbei_front_student_src_tt:0 "Youth propaganda\nNo manpower. Army experience [?SRC_local_student_xp|0]; first local propaganda may add [?SRC_local_student_political|0] wartime political organisation. War support +0.5%, capped at four grants. Local underground/government actions cost 10 PP less for 60 days.\n\nCost: £pol_power [?SRC_local_student_cost|0]."
 SRC_dongbei_front_student_gps_tt:0 "Student underground\nProvide army intelligence on GPS. For 60 days local underground actions have a 30-day cooldown; a recently begun upgrade can have its waiting period shortened to 15 days. Demonstration chance 10%, or 20% in cities.\n\nCost: £pol_power [?SRC_local_student_cost|0]."
 SRC_dongbei_front_student_contested_tt:0 "Frontline propaganda\n30 days of improved Red Army local recovery and reduced GPS recovery. Other contested actions in this state gain 10% effectiveness.\n\nCost: £pol_power [?SRC_local_student_cost|0]."
 SRC_dongbei_activity_business:0 "Business action"
 SRC_dongbei_activity_business_tt:0 "[SRC_la_business_payload_tt]"
 SRC_dongbei_front_business_src_tt:0 "Trade-route supply\nTrucks [?SRC_local_business_trucks|0], trains [?SRC_local_business_trains|0], support equipment [?SRC_local_business_support|0], rifles [?SRC_local_business_rifles|0]. Local supply improves for 60 days.\n\nCost: £pol_power [?SRC_local_business_cost|0]."
 SRC_dongbei_front_business_gps_tt:0 "Disrupt procurement\n45 days of local GPS supply and railway repair penalties and increased truck losses. An existing network strengthens the action by 25%.\n\nCost: £pol_power [?SRC_local_business_cost|0]."
 SRC_dongbei_front_business_contested_tt:0 "Secret transport\nTrucks [?SRC_local_business_trucks|0], support equipment [?SRC_local_business_support|0], rifles [?SRC_local_business_rifles|0]. For 30 days local supply consumption falls and reinforcement improves.\n\nCost: £pol_power [?SRC_local_business_cost|0]."
