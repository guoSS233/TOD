 SRC_improvised_revolutionary_force:0 "An Improvised Revolutionary Force"
 SRC_improvised_revolutionary_force_desc:0 "After the Liaoyang uprising, workers' pickets, insurgent soldiers and local revolutionary organisations gathered beneath the same red banner. Revolutionary fervour put weapons in their hands, but could not replace unified orders, regular drills or reliable supplies. Facing the Guandong forces, the Revolutionary Committee must forge these scattered formations into an army amid the fighting."
