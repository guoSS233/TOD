 WJP_parliament.1.t:0 "The Parliament Questions Cabinet Oversight"
 WJP_parliament.1.d:0 "Progressive Association leader Ozaki Hikotaro rises in the Alliance Parliament to ask how the civil bill will remain subject to legislative oversight. The Free Society warns that giving parliament a hand in administration could leave the cabinet unable to act swiftly. Every eye turns toward the ministers as they prepare their reply."
 WJP_parliament.1.a:0 "Publish an explanation and accept oversight"
 WJP_parliament.1.a_tt:0 "Progressive Association attitude: +1; Free Society attitude: -1. If the Minsei plan has matching Minsei budget backing, Progressive Association attitude gains an additional +2."
 WJP_parliament.1.b:0 "Insist on cabinet prerogatives"
 WJP_parliament.1.b_tt:0 "Party attitudes do not change."
 WJP_parliament.2.t:0 "Minority Parties Request Safeguards"
 WJP_parliament.2.d:0 "The minority parties want safeguards added to the bill. Daido Association leader Suzuki Mosaburo calls for stronger social provisions, while the National Renewal League asks parliament to oversee industrial policy. The cabinet can answer one side or leave the draft untouched and face the coming vote."
 WJP_parliament.2.a:0 "Add social safeguards"
 WJP_parliament.2.a_tt:0 "Daido Association attitude: +1."
 WJP_parliament.2.b:0 "Agree to an industrial oversight pact"
 WJP_parliament.2.b_tt:0 "National Renewal League attitude: +1. If the Kokumu plan has matching Kokumu budget backing, National Renewal League attitude gains an additional +1."
 WJP_parliament.2.c:0 "Keep the draft unchanged"
 WJP_parliament.2.c_tt:0 "Party attitudes do not change."
 WJP_parliament.100.t:0 "The Alliance Parliament Passes the Bill"
 WJP_parliament.100.d:0 "Speaker Kanichi Otake strikes the gavel and announces the end of the review. Voices in favor have carried the chamber, and the civil bill has passed. The cabinet gains a moment of breathing room as the parties turn to the political settlement that will follow."
 WJP_parliament.100.a:0 "The bill passes"
 WJP_parliament.101.t:0 "The Alliance Parliament Rejects the Bill"
 WJP_parliament.101.d:0 "Speaker Kanichi Otake announces the end of the review, but the chamber has found no common ground to support the bill. The civil bill has failed, leaving the cabinet to face renewed questions from the Alliance Parliament and its parties."
 WJP_parliament.101.a:0 "The bill fails"
