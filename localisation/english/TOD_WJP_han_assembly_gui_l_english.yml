 WJP_han_gui_intro:0 "After the Alliance was founded in 1868, its early economic crisis prompted the supreme central Han Assembly. It reviewed annual domain military and civil budgets and ruled on bills. Civil budgets and laws passed to the Alliance Parliament in 1892, but its influence endured.\n\nSatsuma, Choshu, Tosa and Hizen first shared power. Later, Satsuma and Choshu bought bankrupt minor domains during economic crises and became dominant. Their rivalry now defines the Assembly."
