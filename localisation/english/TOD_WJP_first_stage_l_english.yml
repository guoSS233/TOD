### West Japan Alliance: first year and parliament event chain ###
WJP_new_year_old_troubles_desc:0 "The new year begins with the same old pressures: the financial crisis, factional rivalries, and a demanding Alliance parliament."
WJP_han_assembly_election_desc:0 "The Han Assembly election will shape which domains lead the Alliance."
WJP_balance_bureaucratic_factions_desc:0 "Rival factions within the bureaucracy are pulling at Okubo Isari's cabinet."
WJP_contact_financial_world_desc:0 "The financial world holds resources needed for recovery and will expect the government to answer its interests."
WJP_closest_alliance_council_desc:0 "The Alliance parliament brings together parties with competing demands, and agreement will take work."
WJP_set_sail_desc:0 "The year's preparations are complete. The Alliance parliament can now consider how to answer the financial crisis."
WJP_first_stage_year_reward_tt:0 "Gain §Y100§! Political Power and receive a briefing on West Japan's political forces."
WJP_first_stage_han_reward_tt:0 "Unlock the West Japan Han Assembly decisions and receive a briefing on the domains."
WJP_first_stage_bureaucrats_reward_tt:0 "Gain §Y5%§! War Support and receive a briefing on the bureaucracy."
WJP_first_stage_finance_reward_tt:0 "Receive a briefing on the financial world."
WJP_first_stage_parties_reward_tt:0 "Receive a briefing on the political parties."
WJP_first_stage_set_sail_reward_tt:0 "Begin the Alliance parliament's annual economic agenda."

### New national spirits ###
WJP_model_regime:0 "A Model Regime of the East"
WJP_model_regime_desc:0 "The West Japan Alliance remains constrained by the Ming Empire's economic order."
WJP_han_politics:0 "Domain Politics"
WJP_han_politics_desc:0 "The Han Assembly is an important forum for the domains to coordinate and win support for their policies."
WJP_liberal_movement:0 "An Unwieldy Liberal Rights Movement"
WJP_liberal_movement_desc:0 "The liberal rights movement continues to grow, putting pressure on the government's political stability."
WJP_depression_recovery:0 "The Financial Crisis Persists"
WJP_depression_recovery_desc:0 "The financial crisis continues to constrain industrial efficiency, construction, and government stability."

### West Japan political briefings ###
WJP_politics.1.t:0 "West Japan's Four Political Forces"
WJP_politics.1.d:0 "The West Japan Alliance is shaped by the Han Assembly, the bureaucracy, the financial world, and the political parties. Last year's measures against the financial crisis steadied the government for a time, but they did not dispel suspicion between these forces. In the new year, each will bring its demands to the Alliance parliament and press Okubo Isari's cabinet to choose a course."
WJP_politics.1.a:0 "Let us see how they contend."
WJP_politics.1.effect:0 "Gain §Y5%§! Stability and replace the old dependency spirit with §YA Model Regime of the East§! (Consumer Goods: §R+10%§!; Daily Political Power: §R-0.5§!)."
WJP_politics.2.t:0 "The Domain Clique: One of the Four Political Forces"
WJP_politics.2.d:0 "The Han Assembly brings together representatives of West Japan's domains and is an important arena for deciding who leads the Alliance. The new year's agenda is about to begin, and the domains will continue to bargain over Alliance policy and influence in the Assembly."
WJP_politics.2.a:0 "The Assembly will continue to shape the Alliance."
WJP_politics.2.effect:0 "Replace the existing §YDomain Politics§! spirit with its new version (Political Power Gain: §G+7%§!), or gain it if absent."
WJP_politics.3.t:0 "The Bureaucracy: One of the Four Political Forces"
WJP_politics.3.d:0 "Civil servants across the ministries also shape the Alliance's course. The factions around Mitsuchi Chuzo and Yamazaki Tatsunosuke often differ with the group around Izawa Takio, Shidehara Kijuro, and Wakatsuki Reijiro. Okubo Isari must keep them working together."
WJP_politics.3.a:0 "The bureaucrats have plans of their own."
WJP_politics.4.t:0 "The Financial World: One of the Four Political Forces"
WJP_politics.4.d:0 "The financial world controls resources vital to the Alliance's economy. The crisis continues to weigh on production, and business leaders want the government to stabilize markets and restore confidence in investment. Recovery will take time; neither the financial world nor the government can escape the crisis at once."
WJP_politics.4.a:0 "We cannot do without the financial world."
WJP_politics.4.effect:0 "Replace the old spirit with §YThe Financial Crisis Persists§!: the production efficiency cap penalty falls to §R-28%§!, while the existing construction-speed and stability penalties remain."
WJP_politics.5.t:0 "The Parties: One of the Four Political Forces"
WJP_politics.5.d:0 "Political parties bring public demands into the Alliance parliament and make debate more forceful. The liberal rights movement and party competition continue to grow. The cabinet's ability to govern will be tested by how it answers these demands."
WJP_politics.5.a:0 "Party politics will not quiet down easily."
WJP_politics.5.effect:0 "Replace the existing §YUnwieldy Liberal Rights Movement§! spirit with its new version (Stability Factor: §R-2%§!), or gain it if absent."

### Alliance parliament economic events ###
WJP_economy.1.t:0 "The Treasury's Annual Report"
WJP_economy.1.d:0 "Although the West Japan Alliance began responding in 1934 to the Ming Empire's call to overcome the effects of the financial crisis, and adopted a series of equalization, price-stabilization, and rural-relief policies, the outlook remains poor. According to the Treasury's annual report, Japan's Taicang Index has fallen by thirty percent since 1932. When Treasury Minister Mitsuchi Chuzo presented the report to the Alliance parliament, sweat poured down his brow. ‘The Alliance Treasury has done everything it can to rescue the Alliance economy. Everything is moving toward steady improvement.’ Yet his remarks were nearly drowned out by jeers. No one attacked the Treasury more fiercely than Ozaki Hikotaro, president of the Progressive Association and known as the ‘God of Constitutional Government.’ During questioning, Ozaki fired off one challenge after another: ‘How much longer will the bureaucrats conceal the facts?’ ‘Has this government of bureaucratic autocracy become incapable of action?’ His words left the elder Mitsuchi struggling for an answer, and Speaker Ohtake Kanichi had to suspend the session."
WJP_economy.1.a:0 "The Treasury is in trouble."
WJP_economy.1.effect:0 "Alliance parliament seats change: Progressive Association §G+2§!; Free Society §R-2§!."
WJP_economy.2.t:0 "Two Economic Plans for the Alliance"
WJP_economy.2.d:0 "A new year has come, and Alliance officials have brought the cabinet two plans for answering the shortage of money. Nagai Ryutaro, speaking for the Minsei faction, presented his proposal to Okubo Isari and the Council of Senior Statesmen. He argues that the Alliance should continue fiscal austerity, negotiate with the Ming Empire for a modest increase in the yen's exchange rate against the dragon currency, and expand social protections for merchants and industrial workers to strengthen public finances. The plan clearly reflects the influence of the Progressive Association, which is close to Nagai's faction. The other proposal comes from Kuroda Hideo of the Kokumu faction. He wants to suspend austerity immediately, expand public spending through work relief, and shift attention away from urban business toward aid for rural communities. Both plans address real needs, but Japan's position is desperate. One must be chosen."
WJP_economy.2.minsei:0 "Nagai Ryutaro's plan is more practical."
WJP_economy.2.kokumu:0 "Kuroda Hideo's plan is bolder and more energetic."
WJP_economy.2.tt:0 "If you choose this plan, you must do everything possible to secure its passage in the Alliance parliament."
WJP_economy.3.t:0 "The Hiroshima Rice-Riot"
WJP_economy.3.d:0 "The financial crisis has once again worsened public order. In Hiroshima, some city residents, driven by high rice prices, stormed shops, beat their owners, and carried away sacks of rice. The police arrived to restore order, but the situation grew more volatile when crowds witnessed violent arrests. Residents poured into the streets to protest the shortage of money and the government's inaction. Carrying bamboo poles and clubs, they beat police officers and even set fire to some moneylenders' shops. Local domain troops have suppressed the unrest for now, but the event has already had an irreversible political impact."
WJP_economy.3.a:0 "Why should the poor make life harder for the poor?"
WJP_economy.3.effect:0 "Alliance parliament seats change: Free Society §R-3§!; Progressive Association, the National Renewal League, and the Daido Association each §G+1§!. Stability: §R-5%§!."
WJP_economy.4.t:0 "A New Year, A New Budget"
WJP_economy.4.d:0 "Under the West Japan Alliance charter, the Alliance parliament holds an election each year and decides the coming year's budget. In the 1935 Alliance parliamentary election, Free Society, the ally of bureaucratic autocracy, won a majority of seats; it has won a majority again this year. At the annual budget session, the two largest parties, Free Society and the Progressive Association, each put forward a proposal. Free Society's plan follows the Kokumu faction's line: a more aggressive budget and higher consumption taxes to fill the fiscal gap. The Progressive Association's plan follows its Six Principles: continue austerity and reduce wasteful real-estate infrastructure investment. The budget is important to overcoming the financial crisis, so the decision must be made carefully."
WJP_economy.4.kokumu:0 "Free Society's annual budget deserves consideration."
WJP_economy.4.minsei:0 "The Progressive Association's budget is the right choice."
WJP_economy.4.kokumu.effect:0 "Free Society §G+4§!, Progressive Association §R-2§!, National Renewal League §R-1§!, and Daido Association §R-1§!. The Kokumu economic plan receives budget backing."
WJP_economy.4.minsei.effect:0 "Progressive Association §G+3§!, Free Society §R-2§!, and National Renewal League §R-1§!. The Minsei economic plan receives budget backing."
WJP_economy.5.t:0 "The Bill Is Submitted for Deliberation"
WJP_economy.5.d:0 "Everything is ready; only the final step remains. The Alliance's future will be decided by a vote in the Alliance parliament."
WJP_economy.5.a:0 "Waiting for Godot…"
WJP_economy.5.effect:0 "The selected bill begins a 50-day review by the Alliance Parliament. At its end, it is voted on according to party attitudes."
