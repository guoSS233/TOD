 SRC_wartime_army_help_tt:0 "§YWartime army building§!\nOnly the current chapter's projects are shown. Complete enough core work and meet the time and construction requirements to receive a chapter event. Confirm that event to open the next chapter; unfinished earlier work then closes. Only one project may run at a time.\n\nChapter 1: 3 projects and 30 war days.\nChapter 2: 3 projects, 70 war days, and three construction values at 30.\nChapter 3: 3 projects, 110 war days, and an average of 45.\nChapter 4: establish one principal arrangement, 150 war days, and an average of 50.\nChapter 5: at least 2 permanent institutions, 150 war days, all four values at 55, and an average of 60. An institution raises its corresponding value to at least 55; usually 2 to 3 projects suffice.\n\nA principal arrangement is locked for 90 days. Chapters 1 to 4 require war with the Kwantung Pacification Commission; an unlocked chapter 5 may be completed after victory. Graduation records wartime traditions; postwar focuses determine the final military system."
 SRC_wartime_army_mechanism_desc:0 "Resolve the Red Army's practical wartime military problems through decisions, rather than directly choosing a future route. The army's future institutions will be shaped by the historical choices made during the war."
 SRC_wartime_army_stage_title:0 "§YCurrent Army-Building Status§!"
 SRC_wartime_army_command_title:0 "Command System"
 SRC_wartime_army_command_low:0 "Disordered"
 SRC_wartime_army_command_high:0 "Unified"
 SRC_wartime_army_training_title:0 "Military Training"
 SRC_wartime_army_training_low:0 "Militia"
 SRC_wartime_army_training_high:0 "Regular"
