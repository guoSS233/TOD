 SRC_wartime_army_supply_network:0 "Organise a Wartime Supply Network"
 SRC_wartime_army_supply_network_desc:0 "Coordinate factories, depots, and frontline routes into a sustainable wartime supply system."
 SRC_wartime_army_title:0 "Northeast Red Army: Wartime Army Building"
 SRC_wartime_army_records_title:0 "§YMeasures Taken§!"
