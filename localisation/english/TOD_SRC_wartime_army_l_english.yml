 SRC_wartime_army_status_dynamic:0 "[SRC_wartime_army_current_status]"
 SRC_wartime_army_status_initial:0 "§YAn Improvised Revolutionary Force§!\nAfter the Liaoyang uprising, the Northeast Red Army is made up of workers' pickets, insurgent soldiers, local revolutionary organisations, and a handful of military personnel. Their revolutionary zeal is high, but these disparate forces lack unified command, training, and organisation. The war forces the Revolutionary Committee to decide how this new army will be built."
 SRC_wartime_army_status_officer:0 "§YA Revolutionary Army under Regularisation§!\nMore personnel with military experience are entering the command structure. The Red Army is forming a modern military framework."
 SRC_wartime_army_status_party:0 "§YParty Organisation within the Army§!\nThe political work system has become an essential foundation for sustaining the Red Army."
 SRC_wartime_army_status_council:0 "§YA Mass Revolutionary Army§!\nWorkers' pickets and grassroots soldier organisations continue to retain considerable influence."
 SRC_wartime_army_status_officer_party:0 "§YA Revolutionary Army under Reorganisation§!\nMilitary command and political work are jointly forming the new army's framework."
 SRC_wartime_army_status_officer_council:0 "§YA Revolutionary Army of Discipline and Participation§!\nRegularisation and grassroots participation now shape the army together."
 SRC_wartime_army_status_party_council:0 "§YA Politically Mobilised Revolutionary Army§!\nParty organisation and soldier representatives jointly sustain the army's cohesion."
 SRC_wartime_army_status_mixed:0 "§YA Plural Revolutionary Army under Reorganisation§!\nOfficers, political cadres, and grassroots bodies all have a place in the army; their eventual institutional settlement remains unresolved."
 SRC_wartime_army_problems_title:0 "Current Military Problems"
 SRC_wartime_army_problem_command:0 "• No unified command system"
 SRC_wartime_army_problem_cadres:0 "• Shortage of grassroots cadres"
 SRC_wartime_army_problem_training:0 "• Insufficient recruit training"
 SRC_wartime_army_problem_political:0 "• Political work system not yet established"
 SRC_wartime_army_problem_soldiers:0 "• Soldier participation still needs integration"
 SRC_wartime_army_problem_clear:0 "• The main wartime army-building problems have received an initial response."
 SRC_wartime_army_precedent_title:0 "Wartime Precedents Already Established"
 SRC_wartime_army_officer_precedent:0 "• Insurgent officers have been retained in the command structure."
 SRC_wartime_army_commissar_precedent:0 "• Party representatives have entered everyday army work."
 SRC_wartime_army_council_precedent:0 "• Soldiers' representatives have become an accepted tradition."
 SRC_wartime_army_gain_retain_officers_tt:0 "Command §G+10§!; training §G+5§!"
 SRC_wartime_army_gain_party_cells_tt:0 "Political organisation §G+10§!; command §G+3§!"
