 SRC_wartime_army.7.t:0 "An Army at Last, of Sorts"
 SRC_wartime_army.7.d:0 "The chaos of the Liaoyang uprising is beginning to subside. Units have clearer identities, the front knows where to obtain orders and ammunition, and disparate armed groups have established basic links. They are beginning to act as the Northeast Red Army.\n\nYet organising these men is not the same as preparing them for modern war. Recruits continue to arrive, exposing new weaknesses in training, discipline, armament records and junior command. Emergency reorganisation has done its work. Now we must turn these people into soldiers."
 SRC_wartime_army.7.a:0 "Then let us begin with the basics."
 SRC_wartime_army.8.t:0 "Temporary Measures Cannot Last Forever"
 SRC_wartime_army.8.d:0 "At the start of the war, many arrangements existed only to meet an immediate crisis. Reorganisation, training and field warfare have now established principal wartime practices among officers, party representatives and soldiers' delegates.\n\nThousands of people fight within the same system. Personal authority, union habits and improvised coordination can no longer settle every issue. Headquarters, training, political organisation and supply must become permanent institutions, preserving the lessons of these months of war."
 SRC_wartime_army.8.a:0 "Turn wartime experience into institutions."
 SRC_wartime_army.5.d_professional:0 "$SRC_wartime_army.5.d$\n\n§YA professional military system has taken shape.§! Experienced officers, field staff and training institutions have made command and cooperation part of a lasting military framework. This wartime legacy will underpin postwar reform."
 SRC_wartime_army.5.d_party:0 "$SRC_wartime_army.5.d$\n\n§YA party organisational network has taken shape within the army.§! From the first representatives to grassroots political organisations, party mobilisation and coordination have become part of daily military life. This wartime legacy will underpin postwar reform."
 SRC_wartime_army.5.d_people:0 "$SRC_wartime_army.5.d$\n\n§YA tradition of grassroots military democracy has taken shape.§! Picket cadres, soldiers' representatives and frontline units have established practices of participation in military affairs. This wartime legacy will influence postwar reform."
