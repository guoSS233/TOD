 SRC_wartime_army.1.t:0 "Who Will Teach These Recruits?"
 SRC_wartime_army.1.d:0 "The crash courses have classrooms, a syllabus, and their first students, but not yet a settled body of instructors. Old officers possess systematic military knowledge, picket cadres understand where this army came from, and the party wants a unified and reliable selection system."
 SRC_wartime_army.1.a:0 "Draw upon experienced former officers."
 SRC_wartime_army.1.b:0 "Let cadres raised in the workers' pickets teach them."
 SRC_wartime_army.1.c:0 "Let the party select instructors centrally."
 SRC_wartime_army.1.a.tt:0 "Training §G+4§!; greatly strengthens professional officers"
 SRC_wartime_army.1.b.tt:0 "Training §G+2§!; political organisation §G+3§!; strengthens the mass-army tradition"
 SRC_wartime_army.1.c.tt:0 "Training §G+2§!; political organisation §G+4§!; strengthens central party leadership"
 SRC_wartime_army.2.t:0 "Beyond the Factories and Barricades"
 SRC_wartime_army.2.d:0 "In Liaoyang and Shenyang, workers familiar with factories, streets, and railway facilities could compensate for poor training. As the front moves into Liaobei and Jilin, large-unit manoeuvre, artillery coordination, and long-distance supply expose every weakness. The Northeast Red Army must become a field army."
 SRC_wartime_army.2.a:0 "We must learn to fight across the Northeast."
 SRC_wartime_army.3.t:0 "The Officer and the Picket Commander"
 SRC_wartime_army.3.d:0 "Staff work, instruction, political organisation and supply improvements have helped the Northeast Red Army adapt to field warfare beyond factories and barricades. Learning to organise and fight is no longer its only challenge.\n\nOne unit receives an order to abandon a position. Professional officers demand immediate compliance, while a former picket captain insists that the soldiers must first be consulted. The argument soon reaches beyond this position: who has the final say on the battlefield?\n\nWe must clarify authority among officers, party organisations and grassroots representatives, then turn the chosen approach into principal wartime practice."
 SRC_wartime_army.3.a:0 "Orders in battle must be obeyed immediately."
 SRC_wartime_army.3.b:0 "Grassroots representatives must join major military decisions."
 SRC_wartime_army.3.c:0 "Let the party representative mediate."
 SRC_wartime_army.3.a.tt:0 "Command §G+7§!; strengthens professional officers and reduces soldier autonomy"
 SRC_wartime_army.3.b.tt:0 "Political organisation §G+6§!; command §G+2§!; strengthens soldier autonomy"
 SRC_wartime_army.3.c.tt:0 "Political organisation §G+6§!; command §G+4§!; strengthens central party leadership"
 SRC_wartime_army.4.t:0 "Discontent in the Ranks"
 SRC_wartime_army.4.d:0 "Strengthening commanders has provoked resistance in units with strong representative traditions. Grassroots cadres fear that the revolutionary army is adopting the bureaucracy of the old forces."
 SRC_wartime_army.4.a:0 "Explain the necessity and uphold the order."
 SRC_wartime_army.5.t:0 "We Have an Army Now"
 SRC_wartime_army.5.d:0 "Months ago they were factory workers who had suddenly taken up rifles, soldiers who had turned their guns around, and underground organisers who barely knew one another. Designations, orders, supply, training, and political work now bind them together. The final system remains undecided, but the war has already created lasting traditions."
 SRC_wartime_army.5.a:0 "A professional military system has taken shape."
 SRC_wartime_army.5.b:0 "The party's organisational network has taken shape in the army."
 SRC_wartime_army.5.c:0 "A tradition of grassroots military democracy has taken shape."
 SRC_wartime_army.5.a.tt:0 "Gain the wartime tradition: §YA Professional Military System Has Taken Shape§!"
 SRC_wartime_army.5.b.tt:0 "Gain the wartime tradition: §YThe Party's Organisational Network in the Army§!"
 SRC_wartime_army.5.c.tt:0 "Gain the wartime tradition: §YA Tradition of Grassroots Military Democracy§!"
 SRC_wartime_army.6.t:0 "Friction during Military Reorganisation"
 SRC_wartime_army.6.d:0 "A new principal arrangement is replacing the previous command relationship. Officers, party representatives, grassroots cadres, and soldier delegates must redefine their responsibilities; orders and coordination will inevitably suffer during the transition."
 SRC_wartime_army.6.a:0 "Reorganisation takes time."
 SRC_wartime_army_status_integrated:0 "§YInitially Integrated Northeast Red Army§!\nThe uprising's disparate forces now share a basic common order. We can at least act like an army."
 SRC_wartime_army_status_formed:0 "§YFormed Northeast Red Army§!\nThe war is producing the Red Army's own officers, veterans, and organisational traditions."
 SRC_wartime_army_status_northeast_red_army:0 "§YNortheast Red Army§!\nThis is now a true army. Postwar reform will decide what kind of army it ultimately becomes."
 SRC_wartime_army_status_regular_final:0 "§YRevolutionary Regular Army§!\nProfessionalism, staff work, coordination, and logistics form the army's backbone."
 SRC_wartime_army_status_party_final:0 "§YArmy Led by the Party Banner§!\nPolitical cohesion and rapid organisational recovery sustain prolonged operations."
 SRC_wartime_army_status_people_final:0 "§YThe People in Arms§!\nMass mobilisation and resilience on core territory define the army."
