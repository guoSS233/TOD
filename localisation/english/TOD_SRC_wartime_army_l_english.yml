 SRC_wartime_army_gain_supply_network_tt:0 "Supply §G+12§!"
 SRC_wartime_army_work_available_tt:0 "No other army-building work is underway"
 SRC_wartime_army_mobilisation:0 "Soldier representatives organise mobilisation"
 SRC_initially_integrated_red_army:0 "Initially Integrated Northeast Red Army"
 SRC_initially_integrated_red_army_desc:0 "The workers' pickets, mutinous soldiers, and local revolutionary formations now share a basic command and training system. The Red Army can at least act like an army, though offensive operations, coordination, supply, and recruit training remain deficient."
 SRC_formed_northeast_red_army:0 "Formed Northeast Red Army"
 SRC_formed_northeast_red_army_desc:0 "War has produced the Northeast Red Army's own officers, veterans, and fighting traditions. Its fatal organisational weaknesses are largely under control, and the army is beginning to develop strengths of its own."
 SRC_northeast_red_army:0 "Northeast Red Army"
 SRC_northeast_red_army_desc:0 "The revolutionary formations born in the Liaoyang uprising have become a true army. Postwar reform must still determine its lasting institutional form, but the improvised force is now a thing of the past."
 SRC_revolutionary_regular_army:0 "Revolutionary Regular Army"
 SRC_revolutionary_regular_army_desc:0 "Professional officers, unified command, staff coordination, ranks, and regular logistics define this army. It relies not on endless manpower, but on employing its existing formations through carefully organised operations."
 SRC_party_led_army:0 "Army Led by the Party Banner"
 SRC_party_led_army_desc:0 "Party organisation reaches into daily military life, making political mobilisation, discipline, and common purpose the basis of sustained operations. It may not possess the most elegant staff system, but it is difficult to break and quick to recover."
 SRC_armed_people:0 "The People in Arms"
 SRC_armed_people_desc:0 "Mass organisations, soldiers' representatives, and local mobilisation networks form the army's foundation. It is less suited to intricate regular-war planning, but expands quickly, replaces losses, and shows extraordinary resilience on core territory."
 SRC_wartime_army_unify_designations:0 "Unify Revolutionary Unit Designations"
 SRC_wartime_army_unify_designations_desc:0 "Workers' pickets, mutinous battalions, and local forces still use separate names. Common designations are the first step toward formal command relationships."
 SRC_wartime_army_unify_designations_tt:0 "Command §G+8§!; training §G+2§!; army experience §G+5§!"
 SRC_wartime_army_crash_training_courses:0 "Open Crash Military Courses"
 SRC_wartime_army_crash_training_courses_desc:0 "Concentrate available military specialists and combat veterans to teach recruits the essentials of drill, marksmanship, and tactics."
 SRC_wartime_army_crash_training_courses_tt:0 "Training §G+10§!; decide who will serve as instructors when completed"
 SRC_wartime_army_temporary_discipline:0 "Draft Temporary Red Army Discipline"
 SRC_wartime_army_temporary_discipline_desc:0 "Requisition, prisoners, spoils, desertion, and abuse of civilians must all be governed by common rules."
 SRC_wartime_army_temporary_discipline_tt:0 "Political organisation §G+7§!; command §G+3§!; slightly reduces the organisation-recovery penalty"
 SRC_wartime_army_armament_registry:0 "Inventory Arms and Ammunition"
 SRC_wartime_army_armament_registry_desc:0 "Having rifles and knowing exactly how many rifles we have are two very different things."
 SRC_wartime_army_armament_registry_tt:0 "Supply §G+8§!; army attrition §G-3%§!"
 SRC_wartime_army_select_grassroots_cadres:0 "Select Cadres from the Workers' Pickets"
 SRC_wartime_army_select_grassroots_cadres_desc:0 "Cadres raised through combat and mass work know their soldiers, though training them takes time."
 SRC_wartime_army_select_grassroots_cadres_tt:0 "Training §G+6§!; political organisation §G+4§!; strengthens the mass-army tradition"
 SRC_wartime_army_select_grassroots_cadres_requirement_tt:0 "Soldier committees have been recognised, or political organisation is at least §Y35§!"
 SRC_wartime_army_expand_field_command:0 "Temporarily Expand Field Command"
 SRC_wartime_army_expand_field_command_desc:0 "Provide the expanding front with staff officers, signal personnel, and regional command organs."
 SRC_wartime_army_expand_field_command_tt:0 "Command §G+10§!; further reduces the planning-speed penalty; strengthens professional officers"
 SRC_wartime_army_expand_field_command_requirement_tt:0 "Insurgent officers have been retained, or command is at least §Y35§!"

 SRC_wartime_army_field_staff_office:0 "Establish a Field Staff Office"
 SRC_wartime_army_field_staff_office_desc:0 "Beyond familiar factories and barricades, large formations, artillery coordination, and long marches require a dedicated staff."
 SRC_wartime_army_field_staff_office_tt:0 "Command §G+12§!; training §G+3§!; strengthens professional officers. Refunds §G10§! political power when that tradition is already strong"
 SRC_wartime_army_veteran_training_units:0 "Form Veteran Training Units"
 SRC_wartime_army_veteran_training_units_desc:0 "Rotate veterans out of the line so wartime experience becomes the Red Army's own training system."
 SRC_wartime_army_veteran_training_units_tt:0 "Training §G+10§!; command §G+3§!; prior traditions influence the institutional outcome"
 SRC_wartime_army_veteran_training_units_requirement_tt:0 "The war has lasted at least §Y90 days§!"
 SRC_wartime_army_field_political_work:0 "Establish Battlefield Political Work"
 SRC_wartime_army_field_political_work_desc:0 "Political education, frontline propaganda, and grassroots organisation must follow the troops beyond Liaoyang."
 SRC_wartime_army_field_political_work_tt:0 "Political organisation §G+10§!; an additional §G+3§! if party representatives were assigned; strengthens central party leadership"
 SRC_wartime_army_local_initiative:0 "Grant Local Battlefield Initiative"
 SRC_wartime_army_local_initiative_desc:0 "Battlefield conditions change faster than telegrams from Liaoyang; junior units must be able to act on local circumstances."
 SRC_wartime_army_local_initiative_tt:0 "Command §G+4§!; training §G+4§!; strengthens grassroots initiative and soldier autonomy"
 SRC_wartime_army_field_repair_workshops:0 "Establish Field Repair Workshops"
 SRC_wartime_army_field_repair_workshops_desc:0 "Repair damaged and captured weapons near the front instead of relying entirely on rear-area factories."
 SRC_wartime_army_field_repair_workshops_tt:0 "Supply §G+10§!; army attrition §G-5%§!; equipment capture §G+5%§!"
 SRC_wartime_army_railway_priority:0 "Prioritise Military Railway Traffic"
 SRC_wartime_army_railway_priority_desc:0 "Giving scarce railway capacity to the army will inevitably displace civilian transport."
 SRC_wartime_army_railway_priority_tt:0 "Supply §G+8§!; supply consumption §G-2.5%§!; stability §R-1%§!"

 SRC_wartime_army_strengthen_commanders:0 "Strengthen Military Commanders"
 SRC_wartime_army_strengthen_commanders_desc:0 "Military commanders need authority to act without prolonged deliberation in a rapidly changing battle."
 SRC_wartime_army_strengthen_commanders_tt:0 "Command §G+12§!; training §G+5§!; greatly strengthens professional officers. Strong soldier autonomy may cause discontent"
 SRC_wartime_army_expand_party_network:0 "Extend Party Organisation into Line Units"
 SRC_wartime_army_expand_party_network_desc:0 "Build a stable relationship between political leadership and military action down to the grassroots level."
 SRC_wartime_army_expand_party_network_tt:0 "Political organisation §G+12§!; command §G+5§!; strengthens central party leadership. An additional §G+3§! political organisation at §Y60§!"
 SRC_wartime_army_expand_soldier_representatives:0 "Expand Grassroots Soldier Representation"
 SRC_wartime_army_expand_soldier_representatives_desc:0 "Extend soldier representation while retaining the military-democratic tradition of the uprising."
 SRC_wartime_army_expand_soldier_representatives_tt:0 "Political organisation §G+8§!; training §G+5§!; strengthens soldier autonomy and grants a 90-day mobilisation bonus with a planning cost"
 SRC_wartime_army_arrangement_already_current_tt:0 "This is not already the principal military arrangement currently in force"
 SRC_wartime_army_arrangement_cooldown_tt:0 "The current military arrangement must remain in force for §Y90 days§! before another reorganisation"
 SRC_wartime_army_arrangement_switch_cost_available_tt:0 "Changing an existing arrangement requires an additional £pol_power §Y20§! beyond the decision's base cost"
 SRC_wartime_army_arrangement_switch_cost_tt:0 "Changing the current arrangement costs an additional £pol_power §R20§!, causes §Y30 days§! of reorganisation friction, and reduces a relevant construction value"
 SRC_wartime_army_reestablish_commanders_tt:0 "Re-establish §YBattlefield Discretion for Military Commanders§! as the principal arrangement; first-adoption construction rewards are not repeated"
 SRC_wartime_army_reestablish_party_tt:0 "Re-establish §YParty Military-Political Coordination§! as the principal arrangement; first-adoption construction rewards are not repeated"
 SRC_wartime_army_reestablish_representatives_tt:0 "Re-establish §YGrassroots Soldier Participation§! as the principal arrangement; first-adoption construction rewards are not repeated"

 SRC_wartime_army_general_headquarters:0 "Establish the Northeast Red Army General Headquarters"
 SRC_wartime_army_general_headquarters_desc:0 "Unify temporary regional commands under a headquarters capable of directing the entire Northeast theatre."
 SRC_wartime_army_general_headquarters_tt:0 "Command §G+10§!; further reduces the planning-speed penalty; military traditions grant additional benefits; command is raised to at least §Y55§!"
 SRC_wartime_army_general_headquarters_requirement_tt:0 "Command is at least §Y55§!"
 SRC_wartime_army_permanent_training_system:0 "Establish a Permanent Training System"
 SRC_wartime_army_permanent_training_system_desc:0 "Combine crash courses and veteran training units into a system that does not depend on individual cadres."
 SRC_wartime_army_permanent_training_system_tt:0 "Training §G+10§!; training-time penalty §G-5%§!; training is raised to at least §Y55§!"
 SRC_wartime_army_permanent_training_system_requirement_tt:0 "Training is at least §Y50§!"
 SRC_wartime_army_complete_political_reorganisation:0 "Complete Political Reorganisation of the Army"
 SRC_wartime_army_complete_political_reorganisation_desc:0 "Turn wartime political practices into a formal system spanning every level of command."
 SRC_wartime_army_complete_political_reorganisation_tt:0 "Political organisation §G+10§!; organisation recovery §G+5%§!; political organisation is raised to at least §Y55§!"
 SRC_wartime_army_complete_political_reorganisation_requirement_tt:0 "Political organisation is at least §Y55§!"
 SRC_wartime_army_unified_supply_department:0 "Establish a Unified Supply Department"
 SRC_wartime_army_unified_supply_department_desc:0 "Unify depots, transport, procurement, and repair under a permanent supply authority."
 SRC_wartime_army_unified_supply_department_tt:0 "Supply §G+12§!; supply consumption §G-5%§!; controlling Liaobei grants an additional §G+2§! supply and equipment; supply is raised to at least §Y55§!"
 SRC_wartime_army_unified_supply_department_requirement_tt:0 "Supply is at least §Y50§!"

