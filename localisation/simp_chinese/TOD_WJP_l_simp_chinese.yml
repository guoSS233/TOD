WJP_han_inclination_choshu:0 "当前藩会倾向：长州"
WJP_han_inclination_choshu_desc:0 "藩会当前支持长州家族领导联盟。"
WJP_han_inclination_satsuma:0 "当前藩会倾向：萨摩"
WJP_han_inclination_satsuma_desc:0 "藩会当前支持萨摩家族领导联盟。"
WJP_han_assembly_economic_category:0 "经济决议"
WJP_han_assembly_general_category:0 "一般决议"
WJP_han_assembly_legislative_category:0 "西日本藩会"
WJP_han_assembly_domain_budget:0 "§S为各藩增加预算保留§!"
WJP_han_assembly_domain_budget_desc:0 "以整顿藩政为名拨出款项，人情做足，萨摩在诸藩的话语便重了几分。\n\n$WJP_han_assembly_current_support_tt$"
WJP_han_assembly_central_reserve:0 "§J增加联盟中央财政储备金§!"
WJP_han_assembly_central_reserve_desc:0 "从中央预备金里腾挪出一笔，暗中输往长州，换回他们在诸藩的表态。\n\n$WJP_han_assembly_current_support_tt$"
WJP_han_assembly_ship_plan:0 "§S准备新造船计划§!"
WJP_han_assembly_ship_plan_desc:0 "以造船与海防为议题联络诸藩，萨摩借着这份由头又添了几分分量。\n\n$WJP_han_assembly_current_support_tt$"
WJP_han_assembly_railway:0 "§J翻新联盟铁路§!"
WJP_han_assembly_railway_desc:0 "铁路的走向牵动各藩利害，长州借着勘线之机四处走动。\n\n$WJP_han_assembly_current_support_tt$"
WJP_han_assembly_mori_army_meeting:0 "§J毛利家会见各藩藩军§!"
WJP_han_assembly_mori_army_meeting_desc:0 "以操演为名召集长州系将校议事，军中的天平悄然倾斜。\n\n$WJP_han_assembly_current_support_tt$"
WJP_han_assembly_shimazu_navy_inspection:0 "§S岛津家视察联盟海军§!"
WJP_han_assembly_shimazu_navy_inspection_desc:0 "以检阅舰队为由巡视海口，萨摩的旗号在军港里格外显眼。\n\n$WJP_han_assembly_current_support_tt$"
WJP_han_assembly_audience_east_taikun:0 "§S觐见东日本大君§!"
WJP_han_assembly_audience_east_taikun_desc:0 "安排一次觐见，把萨摩的人情做到御前。\n\n$WJP_han_assembly_current_support_tt$"
WJP_han_assembly_audience_ming_envoy:0 "§J叩见大明帝国使臣§!"
WJP_han_assembly_audience_ming_envoy_desc:0 "借大明使节东来的机会，让长州出面周旋，风光尽归其手。\n\n$WJP_han_assembly_current_support_tt$"
WJP_han_assembly_leadership_resolution:0 "藩会主导权"
WJP_han_assembly_leadership_resolution_desc:0 "藩会主导权依各藩的支持决定。长州与萨摩各自固定拥有本藩的支持；双方支持相同时，维持当前藩会倾向。\n\n$WJP_han_gui_prediction$"
