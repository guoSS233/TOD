WJP_waiting_for_godot:0 "等待戈多"
WJP_waiting_for_godot_desc:0 "联盟议会开始审议法案，并非意味着高枕无忧，等待期间，还有很多的事情要做，我们不能轻易闲下来。"
WJP_art_of_politics:0 "政治的艺术"
WJP_art_of_politics_desc:0 "政治者，无非各派系势力平衡罢了，其精髓在于各派的妥协与平衡。不同的策略选择，将会有利于联盟的法案通过。"
WJP_broad_support:0 "支持者越多越好"
WJP_broad_support_desc:0 "联盟数十年的政治运行证明了，单一依靠某一政党会派进行执政是极为不妥的，唯有争取尽可能多的支持者，才能解决联盟如今的问题。"
WJP_free_society_strategy:0 "自由社更可靠"
WJP_free_society_strategy_desc:0 "如今的联盟议会，作为保守主义代表的自由社掌控着多数的席位，其对于大太政官政府的态度更为宽容，所以，保证单一依靠自由社，才是正确的策略。"
WJP_hiroshima_aftermath:0 "广岛事件善后"
WJP_hiroshima_aftermath_desc:0 "广岛抢米烧打事件是今年以来联盟因财荒引发的最大的恶性社会事件，而对广岛事件的善后处理，也极为考验本届大太政官政府的执政能力，若处理不妥，必然会对政府造成极为恶劣的社会影响。"
WJP_support_domain_troops:0 "支援地方藩兵"
WJP_support_domain_troops_desc:0 "地方藩兵作为各藩维稳镇爆的第一线，其在广岛事件中是地方警察系统瘫痪后出动面对民众的第一响应势力，支援地方藩兵意义重大，非立刻支援不可。"
WJP_central_relief_grain:0 "调用中央赈济粮"
WJP_central_relief_grain_desc:0 "广岛事件就本质而言，是由于财荒之下的国家赈济系统失控与居民收入过低导致的，若要善后，非中央出血不可，唯有调动中央赈济粮，保证均输平准，才能安抚愤怒的民众。"
WJP_steady_improvement:0 "稳中向好"
WJP_steady_improvement_desc:0 "虽然谈不上从根本上解决，但目前而言广岛事件已经平稳，联盟目前已然稳中向好。"
WJP_waiting_for_godot_reward_tt:0 "无额外效果。"
WJP_art_of_politics_reward_tt:0 "获得100政治点数。"
WJP_broad_support_reward_tt:0 "大同会、国民革新同盟和进步会态度各改善一档；自由社态度调整为中立。"
WJP_free_society_strategy_reward_tt:0 "大同会态度调整为极为反对；国民革新同盟和进步会态度各恶化一档；自由社态度改善一档。"
WJP_hiroshima_aftermath_reward_tt:0 "稳定度增加5%；大同会和进步会态度各改善一档。"
WJP_support_domain_troops_reward_tt:0 "财荒冲击的稳定度修正改为-9%；自由社和进步会态度各恶化一档。"
WJP_central_relief_grain_reward_tt:0 "财荒冲击的生产效率上限修正改为-28%；大同会和国民革新同盟态度各改善一档。"
WJP_steady_improvement_reward_tt:0 "大同会和国民革新同盟态度各改善一档；自由社和进步会态度各恶化一档。"
