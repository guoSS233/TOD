### 新一年：西日本联盟议会与事件链 ###
WJP_new_year_old_troubles_desc:0 "联盟建国六十五载，政治上麻烦的问题无非是在党人、藩阀、财界、官僚四者中周旋并往复循环，在一个被四种政治势力撕扯的国家，达成某种各方势力的平衡状态绝非易事，唯有妥善处理，才能行稳致远。"
WJP_han_assembly_election_desc:0 "所谓的藩会，是在《联盟宪章》中确立下来的协调各藩问题的议院，其前身“强藩会议”自联盟建国前便存在，是联盟历史最为悠久的议院，代表了日本的“政治四天王”之一的藩阀的利益，大久保内阁若要在四天王中先选择其一处理，非藩会莫属。"
WJP_balance_bureaucratic_factions_desc:0 "官僚们盘踞在省部中，与藩阀和联盟议会联系较深，为“政治四天王”之二，他们是联盟的行政基石，并且目前联盟深陷“钱荒”难以脱身，保证官僚派系的平衡，是保证内阁平稳度过的关键一招。"
WJP_contact_financial_world_desc:0 "财界，是联盟建立后发展起来的资本主义工商业代表势力，对经济发展有着重大意义，乃“政治四天王”之三，目前联盟深陷“钱荒”，政府的财政支出也需要财界的协力，若无财界，一切经济发展都是空话。"
WJP_closest_alliance_council_desc:0 "联盟议会，为民请命之民党人士之阵地，其背后也代表了作为“联盟四天王”之四的党人。他们手上握着联盟立法之大权，且对有司专制之政府态度较为恶劣，解决他们，要动点脑子。"
WJP_set_sail_desc:0 "一切准备就绪，现在，走进联盟的政治生活，在各方势力的纠缠中找出联盟的出路。"
WJP_first_stage_year_reward_tt:0 "获得§Y100§!点政治点数，并召开西日本的政治势力简报。"
WJP_first_stage_han_reward_tt:0 "解锁西日本藩会决议，并召开藩会简报。"
WJP_first_stage_bureaucrats_reward_tt:0 "获得§Y5%§!战争支持度，并召开官僚简报。"
WJP_first_stage_finance_reward_tt:0 "召开财界简报。"
WJP_first_stage_parties_reward_tt:0 "召开政党简报。"
WJP_first_stage_set_sail_reward_tt:0 "开启联盟议会的年度经济议程。"
### 新增国家精神 ###
WJP_model_regime:0 "东洋诸夏模范政权"
WJP_model_regime_desc:0 "西日本联盟仍受制于明帝国的经济秩序。"
WJP_han_politics:0 "藩阀政治"
WJP_han_politics_desc:0 "藩会是各藩协调利益、争取政策支持的重要场所。"
WJP_liberal_movement:0 "难以处理的自由民权运动"
WJP_liberal_movement_desc:0 "自由民权运动持续扩大，令政府难以维持政治稳定。"
WJP_depression_recovery:0 "财荒的冲击"
WJP_depression_recovery_desc:0 "财荒仍压制工业效率、建设速度与政府稳定。"
### 西日本政治简报 ###
WJP_politics.1.t:0 "西日本的“政治四天王”"
WJP_politics.1.d:0 "西日本联盟的政治局势由藩会、官僚、财界与政党共同塑造。旧年的财荒政策暂时稳住了政府，却没有消除各方之间的猜疑。新的一年里，四股力量都将把自己的主张带到联盟议会，要求大久保是利内阁作出选择。"
WJP_politics.1.a:0 "看看各方将如何角力。"
WJP_politics.1.effect:0 "获得§Y5%§!稳定度；以§Y东洋诸夏模范政权§!取代旧有的明帝国依附精神（消费品§R+10%§!；每日政治点数获取§R-0.5§!）。"
WJP_politics.2.t:0 "“政治四天王”之藩阀"
WJP_politics.2.d:0 "藩会汇集了西日本各藩的代表，是决定联盟内部领导权的重要场所。新一年的议程即将展开，各藩将继续围绕联盟政策与藩会主导权展开协商。"
WJP_politics.2.a:0 "藩会将继续决定联盟的方向。"
WJP_politics.2.effect:0 "将旧版§Y藩阀政治§!替换为新版（政治点数获取：§G+7%§!）；若原先没有则直接获得。"
WJP_politics.3.t:0 "“政治四天王”之官僚"
WJP_politics.3.d:0 "各省官僚同样影响着联盟的政策走向。三土忠造、山崎达之辅一派与伊泽多喜男、币原喜重郎、若槻礼次郎一派在内阁议程上时有分歧；大久保是利必须在这些派系之间维持合作。"
WJP_politics.3.a:0 "官僚也有自己的盘算。"
WJP_politics.4.t:0 "“政治四天王”之财界"
WJP_politics.4.d:0 "财界掌握着联盟经济的重要资源。财荒令生产效率持续承压，企业界要求政府稳定市场、重建投资信心；然而经济复苏仍需时间，财界与政府都无法立即摆脱危机的影响。"
WJP_politics.4.a:0 "财界的支持不可或缺。"
WJP_politics.4.effect:0 "以§Y缓和后的财荒冲击§!取代旧有精神：生产效率上限惩罚降至§R-28%§!，原有建设速度与稳定度惩罚保留。"
WJP_politics.5.t:0 "“政治四天王”之党人"
WJP_politics.5.d:0 "政党将民意带进联盟议会，也让联盟政府面对更激烈的公开辩论。自由民权运动与各党派的政治竞争仍在扩大；能否妥善回应这些诉求，将考验内阁的执政能力。"
WJP_politics.5.a:0 "党派政治不会轻易平息。"
WJP_politics.5.effect:0 "将旧版§Y难以处理的自由民权运动§!替换为新版（稳定度系数：§R-2%§!）；若原先没有则直接获得。"
### 联盟议会经济事件 ###
WJP_economy.1.t:0 "大藏省的年度财报"
WJP_economy.1.d:0 "尽管西日本联盟早在1934年便积极响应大明帝国“走出财荒影响”的号召，并采取了一系列均输平准、赈济农村的政策，经济状况依旧不容乐观。根据大藏省的年度财报，日本的太仓指数自1932年以来已经下降了三成。大久保是利内阁的大藏卿三土忠造向联盟议会汇报时，额头汗如雨下：“联盟大藏省……已竭尽全力挽救联盟经济……一切都在朝着稳中向好的局势发展……”但他的发言每每险些被嘘声打断。对大藏省攻击最激烈的，莫过于进步会总裁、素有“宪政之神”美誉的尾崎彦太郎。尾崎在议会质询时连珠炮似地发问：“官僚们还要掩盖经济事实多久？”“当前的有司专制政府是否已经失能？”言辞之激烈，令三土忠造难以招架，议会议长大竹贯一也不得不宣布休会。"
WJP_economy.1.a:0 "看来大藏省已经不好过了。"
WJP_economy.1.effect:0 "联盟议会席位变化：进步会§G+2§!，自由社§R-2§!。"
WJP_economy.2.t:0 "联盟的两种经济法案"
WJP_economy.2.d:0 "又到新的一年。为了更好地应对钱荒，联盟官僚向内阁提出了两种方案。代表“民政派”的永井柳太郎向大久保是利及重臣会议提出：联盟新一年应继续贯彻财政紧缩战略，同时与明帝国谈判，适当提高日元与龙币的兑换汇率，并加大对工商市民的社会保障，以增强政府的财政能力。这一方案显然受到与永井派系关系密切的进步会影响。另一方案由代表“国务派”的黑田英雄提出：立即暂停财政紧缩，改行积极的财政扩张、以工代赈，并减少对城市工商阶层的关注，转而救济农村。两派的方案都考虑到了实际情况；日本局势焦灼，必须择其一施行。"
WJP_economy.2.minsei:0 "永井柳太郎的民政派法案比较务实。"
WJP_economy.2.kokumu:0 "黑田英雄的国务派法案更大胆，也更有活力。"
WJP_economy.2.tt:0 "选择此计划后，必须竭尽全力使它在联盟议会获得通过。"
WJP_economy.3.t:0 "广岛抢米烧打事件"
WJP_economy.3.d:0 "钱荒造成的治安问题再度升级。广岛部分城市居民因米价过高而冲进米铺，殴打店主并抢走成袋的大米。警察到场维持秩序后，局势反而进一步激化；市民目睹警察暴力逮捕，群情激愤。大量市民走上街头，抗议钱荒以及政府的无所作为。他们手持竹竿、木棍殴打警察，甚至焚烧部分钱庄示威。当地藩兵已经出动并暂时平息局势，但这次事件已在政治上造成不可逆的影响。"
WJP_economy.3.a:0 "穷苦人何必为难穷苦人呢？"
WJP_economy.3.effect:0 "联盟议会席位变化：自由社§R-3§!，进步会、国民革新同盟和大同会各§G+1§!；稳定度§R-5%§!。"
WJP_economy.4.t:0 "新的一年，新的财政预算"
WJP_economy.4.d:0 "根据《西日本联盟宪章》，联盟议会每年召开一次联盟议会选举，并在议会上决定新一年的财政预算案。1935年联盟议会选举中，支持有司专制体制的自由社赢得了议会多数席位；今年，自由社也赢得了多数议席。年度预算审议开始后，自由社与进步会分别提出预算案。自由社的方案围绕国务派的方针，主张更激进的预算并提高消费税以填补税务缺口。进步会则依照其《进步会六大政纲》，主张继续紧缩财政，减少政府在低效房地产基建上的盲目投资。年度预算关系到联盟能否走出钱荒，必须谨慎决定。"
WJP_economy.4.kokumu:0 "自由社扩张预算值得考虑。"
WJP_economy.4.minsei:0 "进步会紧缩预算才是正确选择。"
WJP_economy.4.kokumu.effect:0 "自由社§G+4§!，进步会§R-2§!，国民革新同盟与大同会各§R-1§!；国务派法案将获得自由社扩张预算支持。"
WJP_economy.4.minsei.effect:0 "进步会§G+3§!，自由社§R-2§!，国民革新同盟§R-1§!；民政派法案将获得进步会紧缩预算支持。"
WJP_economy.5.t:0 "法案提交审议"
WJP_economy.5.d:0 "如今万事俱备，只差临门一脚。联盟的未来，将由联盟议会的投票决定。"
WJP_economy.5.a:0 "等待戈多……"
WJP_economy.5.effect:0 "所选法案已提交联盟议会，开始为期50天的审议。审议期满后，将按党派态度规则进行表决。"

