l_simp_chinese:
 SIC_politics_category:0 "四川三派共治"
 SIC_politics_category_desc:0 "武备系掌握军队，清政系联系地方社会，建制派维护旧有官署。中立来自彼此牵制，各派胜出后将立即接上原有政治路线。\n\n武备影响：[?SIC_politics_wubei|0]；清政影响：[?SIC_politics_qingzheng|0]；建制影响：[?SIC_politics_establishment|0]。\n共治已持续[?SIC_politics_months|0]个月。任一派影响达到§Y70§!且其他两派各不超过§Y55§!，即取得唯一主导权。未决满§Y6个月§!可寻求外部斡旋；合作可以改善治理。派系胜负不代表民生与工业自然改善。\n民众不满：[?SIC.minzhong|0]；工业危机：[?SIC.gongye|0]，两项越低越好。旧档按已完成路线保留主导权。"
 SIC_politics_coordination_meeting:0 "召开省政协调会议"
 SIC_politics_coordination_meeting_desc:0 "军饷、预算和运输民生每次轮换一个议题，每30天可召开一次，每次支付25政治点数。支持一派会增加其筹码并承担治理代价，折中有助恢复社会与工业，却要支付额外政治成本。"
 SIC_politics_coordination_meeting_tt:0 "依次讨论§Y军饷、预算、运输民生§!，每次提供三派方案和折中方案。决议后立即检查胜负；三个月内胜出将面对能力缺口。"
 SICPOL.meeting.closed:0 "局势已经改变，结束会议"
 SICPOL.ack:0 "按既定方向继续"
 SICPOL.retain:0 "保留败方人才，建立共同班底"
 SICPOL.exclude:0 "清退败方人员，独立执政"
 SIC_politics_retain_tt:0 "支付§Y50政治点数§!，民众不满和工业危机各下降§Y6§!；吸收败方人才后，能力缺口持续§Y90天§!。胜者仍掌握主导权。"
 SIC_politics_exclude_tt:0 "获得§Y50政治点数§!，民众不满上升§Y10§!、工业危机上升§Y8§!；排斥败方人才使能力缺口持续§Y365天§!。胜者仍掌握主导权。"
 SICPOL.1.t:0 "军饷之争"
 SICPOL.1.d:0 "三派折中，共担支出"
 SICPOL.1.a:0 "采纳武备系方案"
 SICPOL.1.a_tt:0 "武备影响增加18，清政影响减少6，建制影响减少4。优先补发军饷：获得8陆军经验，征集资源使民众不满上升6、工业危机上升3。决议后立即检查主导权。"
 SICPOL.1.b:0 "采纳清政系方案"
 SICPOL.1.b_tt:0 "武备影响减少6，清政影响增加18，建制影响减少4。坚持核验账册并减轻地方负担：民众不满下降4，延迟军队采购使工业危机上升5、战争支持度下降3%。决议后立即检查主导权。"
 SICPOL.1.c:0 "采纳建制派方案"
 SICPOL.1.c_tt:0 "武备影响减少4，清政影响减少4，建制影响增加22。按旧编制发放军饷：战争支持度增加3%，额外征收使民众不满与工业危机各上升4。决议后立即检查主导权。"
 SICPOL.1.d_tt:0 "武备影响增加3，清政影响增加3，建制影响增加3。分期发饷并联合审核：额外支付20政治点数，稳定度增加2%，民众不满下降4、工业危机下降3。决议后立即检查主导权。"
 SICPOL.2.t:0 "预算之争"
 SICPOL.2.d:0 "三派折中，共担支出"
 SICPOL.2.a:0 "采纳武备系方案"
 SICPOL.2.a_tt:0 "武备影响增加18，清政影响减少6，建制影响减少4。优先军工订单：额外支付10政治点数，工业危机下降5，压缩民用预算使民众不满上升7。决议后立即检查主导权。"
 SICPOL.2.b:0 "采纳清政系方案"
 SICPOL.2.b_tt:0 "武备影响减少6，清政影响增加18，建制影响减少4。整顿税制和商业账目：工业危机下降7，稽核与削减军费使民众不满上升3、战争支持度下降2%。决议后立即检查主导权。"
 SICPOL.2.c:0 "采纳建制派方案"
 SICPOL.2.c_tt:0 "武备影响减少4，清政影响减少4，建制影响增加22。保住官署旧额：获得25政治点数，民众不满上升2、工业危机上升5。决议后立即检查主导权。"
 SICPOL.2.d_tt:0 "武备影响增加3，清政影响增加3，建制影响增加3。公开预算并共担节支：额外支付25政治点数，民众不满下降3、工业危机下降5。决议后立即检查主导权。"
 SICPOL.3.t:0 "运输与民生之争"
 SICPOL.3.d:0 "三派折中，共担支出"
 SICPOL.3.a:0 "采纳武备系方案"
 SICPOL.3.a_tt:0 "武备影响增加18，清政影响减少6，建制影响减少4。军队接管运输枢纽：获得5陆军经验，工业危机下降4，征用民运使民众不满上升7。决议后立即检查主导权。"
 SICPOL.3.b:0 "采纳清政系方案"
 SICPOL.3.b_tt:0 "武备影响减少6，清政影响增加18，建制影响减少4。保障民生运输：民众不满下降7，压缩军用货运使工业危机上升2、战争支持度下降2%。决议后立即检查主导权。"
 SICPOL.3.c:0 "采纳建制派方案"
 SICPOL.3.c_tt:0 "武备影响减少4，清政影响减少4，建制影响增加22。恢复旧有保甲与路税：获得15政治点数，民众不满上升4、工业危机上升3。决议后立即检查主导权。"
 SICPOL.3.d_tt:0 "武备影响增加3，清政影响增加3，建制影响增加3。军民合办公路与救济：额外支付25政治点数，民众不满下降5、工业危机下降4。决议后立即检查主导权。"
 SICPOL.10.t:0 "武备系取得主导权"
 SICPOL.10.d:0 "武备系击破共治中的制衡，立即开启原有西南武备路线。军事主导并不会自动恢复社会与工业。"
 SIC_politics_wubei_capacity_gap:0 "武备执政的财政缺口"
 SIC_politics_wubei_capacity_gap_desc:0 "军队迅速取得主导权，却缺乏熟悉税赋、工业和地方社会的人员。能力缺口期间消费品工厂系数增加4%，建造速度下降10%。"
 SICPOL.20.t:0 "胜利来得太早：财政与社会协调不足"
 SICPOL.20.d:0 "军队迅速取得主导权，却缺乏熟悉税赋、工业和地方社会的人员。能力缺口期间消费品工厂系数增加4%，建造速度下降10%。三个月内的胜利没有留下充分磨合时间。保留败方的专业人员可以缩短能力缺口，却要付出政治成本；排斥他们会巩固班底，同时拉长缺口并恶化治理。"
 SICPOL.11.t:0 "清政系取得主导权"
 SICPOL.11.d:0 "清政系取得省政主导权，立即开启原有地方宪政试验。清政组织可邀请宋教仁，也可依靠本地人才继续推进。政治胜利本身不会消除社会不满。"
 SIC_politics_qingzheng_capacity_gap:0 "清政执政的执行缺口"
 SIC_politics_qingzheng_capacity_gap_desc:0 "文官和地方网络迅速取得主导权，却难以使军队服从新的行政指令。能力缺口期间陆军组织度下降7%，训练时间增加10%。"
 SICPOL.21.t:0 "胜利来得太早：军队执行不足"
 SICPOL.21.d:0 "文官和地方网络迅速取得主导权，却难以使军队服从新的行政指令。能力缺口期间陆军组织度下降7%，训练时间增加10%。三个月内的胜利没有留下充分磨合时间。保留败方的专业人员可以缩短能力缺口，却要付出政治成本；排斥他们会巩固班底，同时拉长缺口并恶化治理。"
 SICPOL.12.t:0 "建制派取得主导权"
 SICPOL.12.d:0 "建制派取得省政主导权，立即转入原有拥立正统与勤王方向。中立的共治阶段已经结束，地方动员仍需实际治理来支持。"
 SIC_politics_establishment_capacity_gap:0 "建制执政的动员缺口"
 SIC_politics_establishment_capacity_gap_desc:0 "旧官署迅速取得主导权，却缺少把命令变成社会动员的组织能力。能力缺口期间适役人口减少0.2个百分点，陆军恢复速率下降5%。"
 SICPOL.22.t:0 "胜利来得太早：动员不足"
 SICPOL.22.d:0 "旧官署迅速取得主导权，却缺少把命令变成社会动员的组织能力。能力缺口期间适役人口减少0.2个百分点，陆军恢复速率下降5%。三个月内的胜利没有留下充分磨合时间。保留败方的专业人员可以缩短能力缺口，却要付出政治成本；排斥他们会巩固班底，同时拉长缺口并恶化治理。"
