 FE_DIFFICULTY_VERY_EASY: "仓颉造字"
 FE_DIFFICULTY_VERY_EASY_TOOLTIP: "§L“昔者苍颉作书，而天雨粟，鬼夜哭。”§!"
 FE_DIFFICULTY_EASY: "愚公移山"
 FE_DIFFICULTY_EASY_TOOLTIP: "§L“子子孙孙无穷匮也，而山不加增，何苦而不平？”§!"
 FE_DIFFICULTY_NORMAL: "精卫填海"
 FE_DIFFICULTY_NORMAL_TOOLTIP: "§L“女娃游于东海，溺而不返，故为精卫。常衔西山之木石，以堙于东海。”§!"
 FE_DIFFICULTY_HARD: "女娲补天"
 FE_DIFFICULTY_HARD_TOOLTIP: "§L“于是女娲炼五色石以补苍天，断鳌足以立四极，杀黑龙以济冀州，积芦灰以止淫水。”§!"
 FE_DIFFICULTY_VERY_HARD: "盘古辟世"
 FE_DIFFICULTY_VERY_HARD_TOOLTIP: "§L“盘古之君，龙首蛇身，嘘为风雨，吹为雷电，开目为昼，闭目为夜。死后骨节为山林，体为江海，血为淮渎，毛发为草木。”§!"
