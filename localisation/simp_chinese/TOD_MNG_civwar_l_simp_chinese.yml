mingcivwar.1.t:0 "处理辽阳情况"
mingcivwar.1.d:0 "辽阳的大规模罢工已经影响到大明的内内外外，军火订单无法及时交货，各大农场的粮食运输极大减少，更恐怖的是辽阳的警察部队和大半个政府对顺天的命令越来越敷衍，军部提交的报告中甚至提及有正规军被叛贼渗透。经过大臣们的讨论，我们应该派遣一名专员到辽阳并宣布关外戒严，利用尚且忠于朝廷的部队镇压叛贼，但在镇压中我们会暂时关闭辽阳的工业区和主要的运输道路，这将给大明脆弱的经济雪上加霜。我们必须做个选择"
mingcivwar.1.a:0 "那不是让关外脱离朝廷自成一国？岂有此理！"
mingcivwar.1.b:0 "长痛不如短痛，去找一个适合的人吧"
mingcivwar.2.t:0 "辽阳崩溃"
mingcivwar.2.d:0 "我们希望中的恢复稳定的报告一直没有出现，相反辽阳的地方政府已经停止回答来自顺天的命令，而军部情报部门提交的报告显示大半个辽阳陷入了无政府状态，只有少部分忠于朝廷的军队还占据着靠近镇东府的几个基地，试图恢复秩序，但不论如何我们已经无力重新控制辽阳的工业区和兵工厂了。"
mingcivwar.2.a:0 "赤匪！你的妈妈的！"
mingcivwar.3.t:0 "第一步"
mingcivwar.3.d:0 "经过寻常的推心置腹，明争暗斗，找到了一位合适的人选，龙江省督军汤玉麟，我们应该尽快将他送至辽阳开始下一步工作"
mingcivwar.3.a:0 "面相真好啊，必是大忠臣"
mingcivwar.3.b:0 "朕有空也想去辽阳看看（跳转至关东司）"
mingcivwar.4.t:0 "第二步"
mingcivwar.4.d:0 "汤玉麟已经到达辽阳多日，叛贼的活动有所收敛，我们应该趁此机会扩大关东司的力量，目前关东司需要更多可用的部队和补给物资，尤其是燃油和保暖物资"
mingcivwar.4.a:0 "准了，让军部派出运输队吧"
mingcivwar.5.t:0 "第三步"
mingcivwar.5.d:0 "汤玉麟向我们报告他计划了一次大规模的行动以求重创或者根除关东地区的叛贼势力，报告显示汤玉麟的计划十分完善，唯一的问题是叛贼有可能从锦州方向逃入顺天，我们应该设置警戒线"
mingcivwar.5.a:0 "封锁锦州一带并宣布戒严"
mingcivwar.6.t:0 "南巡应天"
mingcivwar.6.d:0 "太子之前提出的一系列改革计划为他博得了大部分的民心，为了完善计划太子决定亲自前往顺天之外的地方去调查统计，第一站即是顺天"
mingcivwar.6.a:0 "希望他能认真干事"
mingcivwar.7.t:0 "太子到达应天"
mingcivwar.7.d:0 "应天官报以醒目的大标题《太子南巡到应天》庆贺太子到达应天开始巡视，许多民众涌上街头观看太子车队游行"
mingcivwar.7.a:0 "民心所向啊"
mingcivwar.8.t:0 ""
mingcivwar.8.d:0 ""
mingcivwar.8.a:0 ""
mingcivwar.9.t:0 "昌德皇帝病重"
mingcivwar.9.d:0 " 据可靠消息称，昌德皇帝的健康情况在太子遇刺后的数天内急转直下，似乎到了不可挽回的地步。这位年事已高的统治者显然清楚自己难以挺过今年。鉴于当前的社会政治形势严峻，昌德皇帝在五月份的御前会议上宣布由内阁首辅张维翰摄政的决定，自己则返回皇家医院接受治疗。年幼的继承人朱喜钲将被托付给颇具权势的庆王朱眷堔加以保护，以避免重蹈不久前的覆辙。"
mingcivwar.9.a:0 "希望昌德皇帝陛下能够转危为安。"
mingcivwar.10.t:0 "庆王返回西安"
mingcivwar.10.d:0 "继庆王朱眷堔在顺天接受昌德皇帝召见后，保护太孙朱喜钲的重任落在了他和内阁首辅张维翰的肩上。然而，老皇帝病重的消息已是路人皆知的事实。顺天朝堂内外的政治斗争已经趋于白热化，各方几乎是不择手段地争夺未来的政治遗产。\n就在日前，朱眷堔率领几名心腹以悄无声息的方式离开了顺天的沸腾坩埚，不久便返回西安，继续他在西北都督府的经略事业。西北目前的不稳定局势刻不容缓，亟待这位皇帝的代理人做出决断。"
mingcivwar.10.a:0 "没有人能隔岸观火，置身事外。"
mingcivwar.11.t:0 "顺天朝堂上的斗争"
mingcivwar.11.d:0 " 日前顺天朝堂上的斗争愈演愈烈，而内阁首辅张维翰今日的举动则震惊朝廷中外。他以摄政的权威名义在朝会上发布了昌德皇帝的诰令，指控武备系多名政要犯有“滔天大罪”，揭露其在庚午钱荒后结党营私、行贿受贿、徇私枉法、侵吞公私财产、失职渎职、泄露机密等十余项罪行，并当即撤去其所有职务。大量证据稍后被公布在明帝国官方报纸上。\n官方媒体宣称，锦衣卫受命组织了一场大规模搜捕行动，成功抓获了以xxx为首的犯罪分子。依据明帝国律法，审判工作正在以“前所未有”的速度展开，这些人的下场也“毫无疑问”将是死刑。据称，武备系其他官员目前陷入人人自危的恐慌当中。一场更大的政治危机正在酝酿之中。"
mingcivwar.11.a:0 "老虎苍蝇一起打！"
mingcivwar.12.t:0 "施荣系要求更多席位"
mingcivwar.12.d:0 " 就在不久前，施荣系媒体开始大规模为改选造势，并公开要求更多议会席位，这一行为得到太孙朱喜钲的支持。\n明帝国的议会格局最近发生了巨大改变，受到重大打击的武备系日渐式微，或难以重振势力。而立足江南的施荣系获得了太孙朱喜钲的青睐，其追求改革的进步态度也引起一定的社会反响。有专家媒体评论称，“后昌德时代”将是施荣系一展宏图的时代，而代表传统皇权的紫禁系将与施荣系合流。"
mingcivwar.12.a:0 "落井下石。"
mingcivwar.13.t:0 "施荣系要求获得同意"
mingcivwar.13.d:0 " 在太孙朱喜钲背书之下，明帝国最高立法机关发生了大规模改组，其中引人注目的是施荣系对更多席位的要求得到满足，成为仅次于紫禁系的议会第二大派系，影响力不可小觑。施肇基和荣德生今日的公开演讲中也难掩兴奋之情。武备系媒体则流露出失落与不满。似乎各方之间的矛盾有激化的趋势。"
mingcivwar.13.a:0 "欲速则不达。"
mingcivwar.14.t:0 "昌德皇帝驾崩，太孙继位"
mingcivwar.14.d:0 "1936年7月19日凌晨三点，昌德皇帝因病逝世，享年xx岁。作为明帝国近四十年的最高统治者，他的一生无疑为东亚乃至整个世界的历史写上了浓墨重彩的一笔。他也许不是最贤能的皇帝，却是那个引领明帝国平稳渡过战争与危机的向导。他竭力维持着朝堂内外的平衡，在对保守势力的妥协中推动有限的改革。他的死为一个时代画上了句号，明帝国之下的东亚秩序已有风雨飘摇之兆。\n在太子遇刺后，皇位的继承权交到了嫡长孙朱喜钲身上。年少有志的太孙在当天宣布继位，并宣布了新的年号——兴宪，取自《尚书·虞书·益稷》“率作兴事，慎乃宪”，寓意“振兴宪政”，表达了新皇帝对进一步改革的美好愿望。"
mingcivwar.14.a:0 "愿他一路走好。"
mingcivwar.15.t:0 "锦王不满"
mingcivwar.15.d:0 "皇帝太孙朱喜钲的继位显然不是所有人都乐于看到的。据锦衣卫可靠消息，皇位的另外一个有力竞争者，朱喜钲的堂叔，锦王朱镕坤，近日频繁与武备系议员来往，并且隐约在秘密场合表达出对兴宪皇帝合法性与能力的质疑。他的进一步企图还有待发觉。"
mingcivwar.15.a:0 "希望不再骨肉相残。"
mingcivwar.16.t:0 "武备系不满"
mingcivwar.16.d:0 "少帝与内阁首辅张维翰的激进手段引发了广泛的社会舆论反弹，而武备系的不满亦是溢于言表。继xxx案后接二连三的打击已让武备系成员颜面扫地，武备系在社会中声望一落千丈更加深了这种愤懑之情。有消息称，多名武备系议员近日频繁接触军方高层人士，暂时还不清楚其真正意图。也许，明帝国所要面对的坎坷还有很多。"
mingcivwar.16.a:0 "希望不再同室操戈。"
mingcivwar.17.t:0 "锦王与武备系串联"
mingcivwar.17.d:0 " 在一系列的政治地震和社会动荡后，各方势力已经开始半公开的串联。少帝树敌颇丰，自然也包括野心勃勃的锦王与心有芥蒂的武备系。在一次严格保密的会议上锦王朱镕坤向硕果仅存的武备系高层摊牌：他希望联合武备系发动政变，控制顺天军队在少帝前往皇陵祭拜先帝之时将其擒获，然后取代少帝登基为帝。\n据悉，锦王已经授意幕僚广泛搜集对自己有利的法理依据，并与武备系高层达成共识，允诺在紧急事态结束后赋予武备系更大的权力。"
mingcivwar.17.a:0 "静观其变。"
mingcivwar.18.t:0 "顺天兵变"
mingcivwar.18.d:0 "当顺天的百姓在1936年8月22日早晨醒来时，他们会惊恐地发现整个城市笼罩在死寂当中。数不清武备系卫戍部队从四面八方涌入京城，阻断了一切外出通道，切断电话电报线，并接管了发电厂与自来水厂等关键设施。顺天卫戍司令xxx宣布了军事管制。\n而事实上，这一天正是昌德皇帝的五七祭日。预谋已久的武备系部队冲入皇陵，控制了在场所有朝廷官员。锦王借武备系之口向天下宣布了名正言顺的理由：辅佐少帝的内阁首辅张维翰是不折不扣的奸佞小人，蒙蔽圣上视听，并且败坏朝政，冤枉忠臣；他们忍无可忍，只能选择兵谏，以挽救局势。不过，兴宪皇帝似乎并未露面，他的下落仍然不明。"
mingcivwar.18.a:0 "国家昏乱有忠臣。"

mingcivwar.21.t:0 "中传邸报上的争论"
mingcivwar.21.d:0 "自庚午钱荒爆发以来，时间已然过去了6年。尽管在朝廷采取的一系列有效措施之下，经济情况已经得到了有效好转，但仍存在发展动力不足、资金运转紧张等问题。针对这一现状，本报采访搜集了各方经济学者的言论主张，供大家批判探讨。\n陈辉祖：现下经济之困局，根源所在，在于朝中，疑神疑鬼，杞人忧天。于市场之作用，不予信任，履欲越俎代庖，横生枝节。试看往昔钱荒，哪次莫不依靠自由市场，枯木逢春？但得大众之耐心，以待工厂恢复生产，经济自会运转如常。文坛诸公，数言我等信玄由天，靠“无形之手”云云，便可两难自解，属无稽之谈，狂言妄语。然我朝早已革除旧俗，四民秩序更是无从谈起，为何不可信任我朝行商坐贾？（恼）\n转载自《经济情报》笔者刘大钧文：我向来是不喜与他人争辩的。然国朝之困局旷日持久，钱荒之难悬而未决，糜烂海内，正有燎原之势，经济始终未见起色。有同僚如光祖兄呼吁诸位试看市场规律之成效，恕我不敢苟同，今钱荒不止，海内沸腾，生民不得安坐，恐有民变而生。况今日之变乃积弊日久之结果，昔日工厂尚能以自我调节度过钱荒。如今积重难返，钱荒席卷各行各业，工厂停工无力复产，国民失业生计无着。此皆因国朝于行商之业，不闻不问，以致存货过剩，巨贾只知驱动机器将商品投入市场，却不知百姓生计并无改善，何来金银所购？困局之下，朝廷不督办，难道任由奸商胡整吗？"
mingcivwar.21.a:0 "所以谁说的对呢？"
mingcivwar.22.t:0 "御前会议(第一部分)"
mingcivwar.22.d:0 "辰时甫过，孔祥熙以生平罕见之速度，在紫禁城的石板路上飞奔，直奔议事院。路上行人稀少，他的心中不禁涌起一阵焦虑：“若非那罗刹女子作祟，我岂会晚起至此。今日乃开工首日，若迟到，我这顶乌纱帽恐将难保。陛下虽和蔼可亲，但对政务之要求极严。老天保佑，陛下他老人家还没睡醒，今天能晚些上朝。”\n孔祥熙尚未抵达议事堂之门，已闻门内传来激烈的争执之声。踏入院内，但见陈嘉谟面红耳赤，手指一名财政部官员，大声斥责：“贝祖诒我操你妈，你他妈一个举人出身，户部的一个六品小官，凭什么在这耀武扬威？说我要增加军费是不懂经济，居心不良？老子告诉你，你还没有资格在我面前谈爱国！论忠君报国，老子这条命早就在西洋死过几回的了！”\n言罢，陈嘉谟猛地扯下官服，露出身上斑斑伤痕，口中秽语连篇，直冲贝祖诒而去。贝祖诒措手不及，被陈嘉谟一脚踹倒在地。院内顿时乱作一团，有人试图劝解，有人呼唤卫兵维持秩序，更有数名与贝祖诒有隙的官员在旁喝彩助威。\n正当此时，太子威严之声如惊雷乍响：“是何人在此喧哗喝彩？”众人闻言，皆噤若寒蝉。太子举步走进院内，目光如炬地审视着未着上衣的陈嘉谟，冷然说道：“你要展示伤疤，夸耀战功？很好！那就让众人一睹为快，看看你是如何为大明、为陛下尽忠的。来人！把他架出去，让百官仔细瞻仰！”"
mingcivwar.22.a:0 "嘿，来的早不如来的巧。"
mingcivwar.23.t:0 "御前会议（第二部分）"
mingcivwar.23.d:0 "辰时一刻，参会诸公皆已入座，然陛下未至，会议未正式开启，场内渐有窃窃私语声起。张仁蠡凑至李国杰耳边，悄声言道：“陛下往日从未迟到，今日此时未来，怕是出事了吧？”李国杰闻之，面色骤变，急促言道：“你小子赶紧给我闭嘴，此言大逆不道，若被他人听见，你这乌纱帽还想戴吗？丢了官职事小，这可是要……”李国杰话音未落，皇帝便在侍女搀扶下，缓步进入议会厅内。\n昌德落座之后，轻启话筒，声音略显沙哑：“朕今日身体不适，让诸位久候了。”言罢，转向太子，嘱咐道：“镕寺，便由你来主持会议吧。”\n"
mingcivwar.23.a:0 "“儿臣接旨”"
mingcivwar.24.t:0 "御前会议（第三部分）"
mingcivwar.24.d:0 "“此次会议，是庚午钱荒以来举行的第六个财政总会。尽管我们不懈努力，第三年就有效控制了钱荒的蔓延，但此次钱荒却迟迟未能像以往那样顺利解决。诸位有什么想法，不妨畅所欲言。”太子坐在次席，道出了会议主题。\n陆军侍郎鲍贵卿立刻站起身来，进言道：“陛下，臣认为应增加军费开支，为军队更新装备。”昌德皇帝轻咳一声，太子见状，急忙打断鲍贵卿的话：“鲍侍郎，我们讨论的是经济问题，不是军队问题。没有具体方案，空谈有什么用？”鲍贵卿早有准备，随即离座，走到太子面前，双手递上一份议案：“殿下，臣已草拟了一份议案，请陛下与太子殿下过目。”\n少府王永江也站起身来，拱手道：“殿下，臣认为鲍侍郎的提议是一举两得之策。既能提升军队实力，又能为军工厂带来订单，刺激经济发展。”在王永江的引领下，众臣纷纷附和。然而，张仁蠡却发现昌德皇帝的脸色阴沉如水。\n昌德皇帝摆了摆手，声音略显疲惫：“朕身体不适，需稍作休息。杨度，你随朕来。”在众人搀扶下，昌德皇帝走进休息室。屏退左右后，他凝视着内阁首辅、紫禁系领袖杨度，轻声吩咐道：“你安排一下，把这个提案驳回。”杨度低头应诺：“是，陛下。”\n辰时末，会议继续进行，又有数位卿士提出新的议案。及至午时，会议结果呈至昌德皇帝御览。令昌德皇帝震惊的是，那份军备议案竟然得到了通过。\n"
mingcivwar.24.a:0 "他们是怎么敢的?!"
mingcivwar.24.xiaoguo:0 "增加20点武备系影响力，减少10点紫禁系影响力。"
mingcivwar.25.t:0 "晚宴之后"
mingcivwar.25.d:0 "【本报讯】据本埠消息，昌平侯于昨夜陛下宴请勋臣宿将之隙，面陈军旅忧虞，且再三强调军械更新之急迫。在场诸位勋贵亦群起附和，皆言军务之事关乎社稷安危。圣上在聆听诸位老将之谏言后，允准了扩充军费之议案。\n【本埠特讯】据本报特聘军事顾问剖析，该议案的通过将大幅改善目下的军备情况，助力军伍整饬，促进战力渐次提升。在今日最新之训示中，圣上明言：国之大事，在祀与戎。朝廷务须时刻惕厉，确保军旅战力与时俱进。\n当此世局动荡、列强争雄之秋，此决策足见陛下经文纬武之宏愿。吾辈窃谓，仰赖陛下之雄才与庙堂之睿断，我华夏大地必将四海晏清，社稷江山万年永昌。三军健儿亦当矢志报国，使金瓯永固、虎旅威扬。\n"
mingcivwar.25.a:0 "不如以退为进，引他们上钩......"
mingcivwar.26.t:0 "[Get_title_news_header]顺天日报[Get_title_news_pic]"
mingcivwar.26.d:0 "据本报消息，昌平侯于昨晚御宴之际，向圣上陈情，言及军旅战力忧患，且再三强调军械更新之急迫性。在场诸位勋贵亦纷纷附议，表达对军事事务之关切。幸得昌平侯等人苦心劝谏，陛下终允准扩充军费之议案。\n昌平侯身为皇家宗亲，素来心系国家安全，积极参与军事议题之讨论。在昨晚私宴之上，昌平侯向圣上坦陈己见，表达对军队战斗力之忧虑，并详尽阐述更新武器装备之紧迫性。在昌平侯劝谏之下，陛下审慎考量其建议，最终决定批准扩充军费议案。此举将为军队提供充裕之资金，用于更新武器装备，提升军队实力。陛下言，国家安全至关重要，必须时刻保持警惕，确保军队战斗力与时俱进。此次军费扩充议案之批准，将有力推动军队现代化建设，进一步提升国家整体安全水平。相关部门将密切配合，确保资金使用之透明度与效益，实现军队战斗力之持续提升。\n在国际形势风云变幻之际，这一决策彰显了陛下对国家安全和军事发展的高度重视。吾等有理由相信，在皇帝陛下的领导下，国家必将更加稳定，军队战斗力必将更加强大。\n本报将持续关注军事议案的后续进展。"
mingcivwar.26.a:0 "饵食已经放下，就等鱼儿上钩了"
mingcivwar.27.t:0 "锦衣卫的报告"
mingcivwar.27.d:0 "昌德皇帝展开锦衣卫递上的密报，一抹意味深长的笑浮现在脸上。这抹笑，熟悉他的人再清楚不过，每到此刻，便预示着一场腥风血雨将至。回首往昔，从登基之初推行的民权改革，到痛击大同会，再到欧战期间力压议会宣战，战后以党禁稳固朝堂，无一不是以这抹笑为开端。\n通过锦衣卫的调查，昌德皇帝确认了部分国企人员和官员与紫禁系存在不良行为，涉及一些高位官员。然而，他敏锐地察觉到，背后正在形成一个以武备系官员为核心的政治网络。这并非简单的拉帮结派，而是有人试图构建一个横跨军政商学各界的庞大网络。网络一旦形成，将直接威胁皇权，这正是昌德皇帝不容触碰的底线。"
mingcivwar.27.a:0 "是时候采取行动了！"
mingcivwar.28.t:0 "东巡出发"
mingcivwar.28.d:0 "经过太子秘书处为期一月的紧锣密鼓筹备之后，明帝国太子朱镕寺从顺天声势浩大地出发了。他勤于政务多年，时时注意政策的每个细节，对于政策的落实情况却少有耳闻。东巡出发时，正值顺天入夏，不知何时，燕山上滑落的一片阴云笼罩在了京师上空，在孟夏的暴雨中，火车鸣着笛朝着东南方向驶去。"
mingcivwar.28.a:0 "出发！"
mingcivwar.29.t:0 "到了天津卫"
mingcivwar.29.d:0 "东巡的第一站是天津，这座城市是大明的门户，也是太子东巡的重要一站。在历史上，天津有着独特的地位和重要性。它曾是大明北洋舰队的母港，也是大明近代工业的发源地之一。这里的地理位置十分优越，紧邻大海，是天然的良港，也是南北交通的重要枢纽。\n在太子的访问期间，他了解到了天津的最新发展情况。天津已经成为大明最重要的工业城市之一，拥有众多的工厂和现代化的基础设施。此外，天津的教育、文化和事业也得到了长足的发展。太子在天津城里转了转，劝业场的熙熙攘攘，海河上的舳舻千里，都给他留下了深刻的印象。有一天，他甚至去听了一晚上相声。"
mingcivwar.29.a:0 "介可真哏儿！"
mingcivwar.30.t:0 "辽阳工业区"
mingcivwar.30.d:0 "越辽水而东，入目便是关外雄镇 —— 辽阳。此地乃大明军械铸造之核心，亦为关东财赋之枢机。城垣内外，铁厂星罗棋布，高炉林立，铁水翻涌，映红半边云汉。太子朱荣寺见此情景心下暗赞。遂将大队人马留在住处修整，自身只着便装，混在往来商贾中，悄然入城。\n行至一处偏远街巷，目光扫过两侧售卖矿石的摊位，都是些精挑细选的上好焦炭与铁矿。他正端详，忽闻身后传来爽朗笑声：“公子可是行家？”回头望去，是个满脸炭灰、眼神精明的汉子，正挑着一担铁器走来。太子忙点头称是。\n那汉子叫张铁柱，是本地有名的铁匠，见太子对矿石颇有兴趣，热情邀请他去自家铺子细看。太子随他穿过几条小巷，来到一家挂有“张记铁铺”招牌的店前。推门而入，里面炉火正旺，伙计们锤打着烧得通红的铁坯，火星四溅。太子看得入神，竟忘了言语。\n待到用晚膳时，太子才想起此行目的，便向张铁柱打听辽阳这些年的变化。张铁柱边吃边讲，从庚午钱荒爆发时的萧条，到如今工厂逐步恢复，天南海北的工人再度齐聚于此。太子暗暗点头，又问起工人们的生活，张铁柱却敛了笑容，低声道：“这些年城市确实恢复了不少，可工人大多住的仍是破房子。要不俺还有些手艺出来开个小店，孩子念书都是奢望。”\n太子听后陷入了沉默，次日一早便直奔官营钢铁厂。厂内机器轰鸣，工人们在传送带旁忙碌，他混在人群里，留意着每个角落。出了工厂，他径直去了附近简陋的工人聚居区。低矮的房屋挤挤挨挨，污水横流，孩童们衣衫褴褛地在巷子里玩耍，一阵爽朗的童谣回荡在巷子中。\n"
mingcivwar.30.a:0 "“九门城门九丈高，里头日夜锻枪炮。官爷说咱功劳大，月饷换不来半斤糕！”"
mingcivwar.31.t:0 "镇东府刺杀事件"
mingcivwar.31.d:0 "太子朱镕寺轻车简从抵达镇东府后，马不停蹄地展开了密集的实地考察。他在多个府县间奔波，与当地官员、商贾和百姓促膝长谈，试图了解民生百态。然而，一路所见所闻如同一盆盆冷水泼在他的心上：尽管钱荒的阴霾已逐渐散去，百姓的生活有所好转，但距离往昔经济繁荣、市井熙攘的黄金时代，仍有不小的差距。不少地方的工商业尚未恢复元气，农田水利设施年久失修，民间消费疲软，这些都让他忧心忡忡。\n这日，筋疲力尽的太子返回镇东府城，准备稍作休整。刚刚走下站台，一名年轻的卫兵便如脱弦之箭般从队伍中冲出，手持匕首直扑太子。千钧一发之际，朱镕寺凭借着多年习武练就的敏锐反应侧身闪避，匕首贴着他的衣衫划过， “咔嚓” 一声没入身后的木柱，木屑四溅。\n四周瞬间爆发出一片惊呼，卫兵们如梦初醒，潮水般涌向刺客，转眼将那人压制在地，匕首也被远远踢飞。刺客被按得动弹不得，只能声嘶力竭地叫喊着什么，可因被死死掐住脖子，声音含混，吐字不清，只依稀能听见 “不公” “变革” 等只言片语。\n太子遇袭的消息很快传到昌德皇帝耳中，与之一道的还有年轻刺客的霞仪同产工会成员这一身份。\n"
mingcivwar.31.a:0 "该死！"
mingcivwar.32.t:0 "霞仪开展大规模清洗活动"
mingcivwar.32.d:0 "昌德皇帝虽然年事已高，但也容不得眼皮底下的藩属国如此僭越——刺杀太子，随即，数道命令从帝国宪政会传向霞仪统制国欧阳政府。一场大清洗即将拉开帷幕。\n行动开始的前两天，霞仪政府勾结当地贼寇，以“剿匪”的名义在玉龙府纠集军队。清洗当天凌晨，东方刚刚泛起鱼肚白，身着黑衣的刺客潜行在同产工会高层居住的街道中，一道又一道刺耳的尖叫声彻底打破了表面的平静。两个小时后，欧阳政府军彻底包围控制了这片区域，以“剿灭刺客”的名义对同产工会的聚集点展开全面搜捕，控制区内的工人纠察队被全部逮捕。随后几天，欧阳政府以“刺客外窜”的名义，对玉龙府周边的工人据点进行清剿。同产工会遭遇几近毁灭性打击，只有少数成员得以逃脱，他们在霞仪首都的多年经营毁于一旦。"
mingcivwar.32.a:0 "斩尽杀绝，绝不姑息"
mingcivwar.33.t:0 "南巡出发"
mingcivwar.33.d:0 "在经历东巡刺杀事件后，太子朱镕寺仍坚持他的南巡计划。在一番声势浩大地送行下，南巡的火车沿着铁路线飞驰而去，车轮转动起来，大明命运的齿轮也在此时转动起来。每到达沿线的一个重要城市，太子朱镕寺便会亲自走访，从流水线运转中的大工厂到普通工人的家中，从只剩下麦茬的稻田到东市西坊之中，他一步一步丈量着庚午年以来逐渐恢复的土地，憧憬着自己的国土能重新回到黄金时代。"
mingcivwar.33.a:0 "暴徒不过区区小事，岂有民生重要"
mingcivwar.33.xiaoguo:0 "增加5点紫禁系影响力"
mingcivwar.34.t:0 "正定暗流"
mingcivwar.34.d:0 "（颠簸几个时辰后，火车到达了正定府）\n正定府本地政商官员前来了不少人来迎接太子朱镕寺，太子听着布政使介绍一位位前来的政企要人，发觉其中不少名字都在锦衣卫的武备系名单上看过。\n在接下来的几天，太子朱镕寺在官员的陪同下巡视了诸多国营企业的工厂，进行了不少例行的慰问。在这一过程中，太子看到的是一座新兴的工业城市。高大的烟囱、繁忙的工厂、机器的轰鸣声，这些都是这个城市繁荣的标志。同时，他也实际了解到了国企一些制度的不足之处，并暗暗将之记下。\n但在民生、企业经营的问题之外，他也敏锐地感觉到了当地军政商关系的不寻常。在言谈举止中，一些政府官员和国企负责人似乎亲如一家人一样，并且当地官员中，军队复员的人员占比也要高于其他地区。\n"
mingcivwar.34.a:0 "华北武备系势力蔓延，理当警惕了"
mingcivwar.34.xiaoguo.a:0 "增加2点武备系影响力"
mingcivwar.34.b:0 "孤这就修书一封，请陛下即刻定夺"
mingcivwar.34.xiaoguo.b:0 "增加2点紫禁系影响力"
mingcivwar.35.t:0 "曲阜祭祀"
mingcivwar.35.d:0 "曲阜并不是重要的工农业之地，但太子朱镕寺认为其在南巡之路必不可少，称其如西方之耶路撒冷，乃儒家之圣地。太子离开正定后，先乘汽车到了沧州，又换乘津浦铁路抵达兖州府。次日一早，他与随行的几位官员一起乘车去了曲阜，代替昌德皇帝举行了皇族久违的孔圣祭祀。祭祀结束后，太子巡视了曲阜的明德中学堂，这也使他认识到了国民新式教育依旧有不少不足之处。\n在离开学校前，太子与一位老教师进行了深入的交流。这位教师虽然年事已高，但仍然坚持每天教授学生。他告诉太子，虽然生活艰辛，但他仍然坚持自己的信仰和价值观，为社会做出贡献。太子深受感动，表示将推动朝廷加强对教育的支持和帮助，改善学生们的学习条件。\n"
mingcivwar.35.a:0 "有教无类、因材施教"
mingcivwar.36.t:0 "徐州请愿"
mingcivwar.36.d:0 "刚到达徐州太子朱镕寺就对“五省通衢”有了更为深刻的感受，来往的火车川流不息，自庚午年以来商业不断恢复，物流量与日俱增。太子认为，徐州是华北地区经济与战略上的关键所在，在为了应对物流需求，铁路不断修建的当下，徐州的重要性与日俱增，它的发展是今后绝不可忽略的重点。\n离开当日，从森严的周边警备中忽然冲出了几个工人，远远地跪在车队前乞求面见太子。在得到太子的许可后，他们向太子陈述了自己拦驾诉冤的原因。\n原来他们几人是徐州的煤矿工人，之前因为被拖欠工资，所以他们一伙人试图通过工会来维护自身权利，但没曾想到被指责为赤色分子，为首的几人全部被警察抓了起来。他们希望太子能够查明真相，还他们一个公道。\n通过与他们的对话，太子才了解到徐州工人们真正的生活状况：这些煤矿和铁路工人夜以继日在环境恶劣的矿井或工厂中工作，微薄的薪资却仅仅是勉强糊口，有时还会遭到拖欠……\n在勒令当地大理院和提刑按察局务必严查此案后，太子送走了几位拦驾的工人，怀着复杂的心情离开了徐州。"
mingcivwar.36.a:0 "徐州地方......"
mingcivwar.36.xiaoguo.a:0 "减少1点紫禁系影响力，增加2点武备系影响力"
mingcivwar.37.t:0 "凤阳祭祖"
mingcivwar.37.d:0 "呼啸的火车停在了中都凤阳，早在南巡的公告发布之时，凤阳府就开始筹备祭祖活动，百年来，皇帝或太子“南巡”视察民情，必定会有祭祖环节，这也让最开始繁琐复杂的活动逐渐简化，尽管如此，筹备工作依旧持续了几天几夜。身着祭服的朱镕寺在身边的近臣及地方大员的陪同下，行三跪九叩之礼。"
mingcivwar.37.a:0 "天佑大明，国祚绵长"
mingcivwar.38.t:0 "应天巡礼"
mingcivwar.38.d:0 "穿过浦口车站，列车穿过浦口车站，缓缓经过大明工业奇迹之一——南京长江大桥。太子从车窗向远处眺望，内河航运的船队从江上静静驶过，跳动着大明南方的脉搏。太子南巡的下一站，便是大明在南方的陪都——南京应天府，这个昔日繁华的都市虽然历经风雨沧桑，但仍保持着独特的韵味。\n拜谒太祖和烈祖的陵寝后，太子出席了应天政商各界人士举办的盛大晚宴。席间他强调工商界于国计民生举足轻重，期许商人革故鼎新、诚信立业，商会则当发挥纽带作用，助力地方经济繁盛。举杯致谢时，太子感慨：“诸公尽忠国事，实为王朝鼎盛之基。”众人应和，举杯共饮。在宴席结束后，太子并没有第一时间前往住所休息。而是带着侍从，登上了南京皇城。\n在南京皇城的城墙上，太子远眺着夜幕降临的城市。夜晚南京变得更加迷人，灯火辉煌的景象让他心潮澎湃。他看到了紫金山和玄武湖在夜色中若隐若现，他看到了山上的树木和湖泊中的水草在微风中摇曳，他看到了高楼大厦的窗户上反射出的灯光，看到了车水马龙中的流光溢彩。这些现代的城市元素与古老的历史遗迹交相辉映，形成了一幅美丽的画面。\n看着眼前的一切，太子陷入了沉思。"
mingcivwar.38.a:0 "江南佳丽地，金陵帝王州"
mingcivwar.39.t:0 "太仓演讲"
mingcivwar.39.d:0 "太子于十月二十六日自应天乘船抵达太仓。这座由大明东洋贸易铸就的东南巨埠，虽经庚午钱荒重创，然根基未堕，气象犹存。次日，太子在太仓中心广场，登台向翘首以盼的万民发表演讲：\n“太仓的父老们！孤今日奉上谕、承祖德，代天子巡幸至此。见此名城，念及尔等世代辛劳，维系海疆商脉，拱卫东南财赋，心中不胜感念！特此，向太仓全城官绅军民，致以皇室深切的慰勉与期许！\n太仓，乃我皇明御海通商之咽喉，万国梯航所辐辏！数百年来，帆樯蔽日，聚四海之珍奇；机杼连宵，输寰宇之精粹；庠序传薪，育江左之菁华。此城之兴衰，关乎国计，系于民生，实为社稷东南之柱石！孤心甚重之！\n考诸史乘，太仓千年文脉，底蕴深湛。礼乐传家，风俗淳厚；技艺精湛，物产丰饶。能成今日煌煌气象，为皇明沟通两洋之窗口，所仰赖者，正是太仓父老，及汝等之先辈。汝等于惊涛骇浪中勇毅开拓，于世事变迁里锐意求新！此乃太仓之魂，亦为大明之幸！\n然！庚午之殇，创痛未愈。钱荒余波所及，民生多艰，怨声偶闻；世道未平，公义待申。此皆孤与朝廷所深悉、所切责、所亟欲匡正者也！‘民惟邦本，本固邦宁’，此乃圣训，亦是孤心！今日孤临此地，非为观瞻盛景，实为体察民瘼！孤在此宣告：朝廷与皇室，必与太仓父老休戚与共！凡利民之策，孤当力促；凡解困之举，孤必躬亲！吾辈同心戮力，定要渡过此难关，再造太仓之繁荣！\n诸君！国家之宏图，万民之福祉，非孤一人可担，亦非一姓之私！需赖我举国上下，君臣一体，官民同心，众志成城！只要吾辈精诚无间，团结一致，则纵有千难万险，何愁不能踏平坎坷，共赴通衢？！愿与诸君携手并肩，承先辈之余烈，开万世之太平，为大明的江山社稷，为吾等的子孙后代，共同缔造一个海晏河清、仓廪丰实、万民和乐之新乾坤！”/n\n“诸位乡亲父老，我代表皇室向各位致意。太仓名城，东洋贸易铸就，乃大明经济文脉所系。港通四海，工商辐辏，文教昌明，实为国之重镇。\n追溯往昔，太仓历史绵长，逾千载而光辉不减。此地文化底蕴深厚，民俗风情多姿多彩，美食佳肴更是享誉遐迩。作为大明窗口，正是仰赖诸公不避艰险，推陈出新，方有今日之气象。\n然庚午钱荒余波仍在，贫富差距、社会不公等问题亟待解决。身为皇族一员，我深知‘民为邦本'之义。愿与诸君一道努力，同甘共苦、共克时艰。\n诸位同胞，吾辈之未来，非一人之力所能成，需万众一心，同舟共济。愿吾等携手前行，共绘大明更加辉煌、繁荣、和谐之新篇章！”"
mingcivwar.39.a:0 "太子殿下，千岁，千岁，千千岁！"
mingcivwar.39.xiaoguo.a:0 "增加1点管学系影响力"
mingcivwar.40.t:0 "杭州故事"
mingcivwar.40.d:0 "离开太仓，下一站是浙江首府——杭州。杭城之行则轻松许多，太子得以从容领略杭城湖山胜景与人文韵致。泛舟西湖，登临六和塔，礼佛灵隐寺，但见湖光潋滟、塔影嶙峋、梵音袅袅，古都风雅尽收眼底。\n品龙井、尝醋鱼、啖酱鸭，太子对杭帮菜清雅本味赞不绝口：“此味不独在舌尖，更在千年烟雨间。”游湖时遇民间艺人聚演，剪纸窗花栩栩如生，苏绣山水若隐若现，水墨丹青间烟云满纸。太子驻足良久，亲赐银锞子勉励：“艺不绝，文脉方昌。”\n尽管在游览的同时，太子照例会见了一些杭州的商学代表和地方官员，但杭州之行还是令太子得到了有效的放松。在应天朝堂与臣僚们周旋积攒的疲惫，竟被湖畔茶烟与丝竹声声渐渐化开。\n"
mingcivwar.40.a:0 "风吹西湖好景多，雨打钱塘江山美"
mingcivwar.40.xiaoguo.a:0 "增加1点政学系影响力"
mingcivwar.41.t:0 "泉州会见海军老将"
mingcivwar.41.d:0 "舟抵泉州，此行下一站便是声名卓著的闽南海港。作为水师元老桑梓、侨胞祖根的海疆重镇，泉州军港自是太子南巡的必经之地。\n艨艟近港，早有整装水兵列队迎候，昂藏作仪仗之态。登岸后，太子与迎接的海军宿将一一握手，那些挂满功勋章的老者在介绍军港时，语调里仍激荡着破浪穿云的余勇。简明扼要介绍军港概况及日常操演后，太子赞许水师乃海疆屏藩，并承诺将持续关注水师发展。\n在会面结束后，致仕的靖海伯曹嘉祥邀请太子登临正驻训的“武夷山”号战列巡洋舰。甲板上铁甲生辉，舰炮林立，老将军亲指舰炮、鱼雷发射架等，逐一为太子讲解操演细节。暮色漫过军港时，太子一行回到了艉楼甲板，望着信号灯在艨艟间流转如星。那些关于蒸汽明轮、水雷营垒的讨论余音，正与晚潮拍舷声交融成新的潮音。摩挲着老将赠的罗盘，太子切实感受到了其中的重量。"
mingcivwar.41.a:0 "海军是国之利剑，您们皆是国之柱石"
mingcivwar.42.t:0 "参观广州证交所"
mingcivwar.42.d:0 "在太子南巡的旅程中，他终于踏上了广州这片繁荣的土地。作为天朝南疆的繁盛都会，这座永不夜眠的商埠正以钱庄林立的天际线迎接皇储——广州证券交易所的玻璃穹顶下不断变换的实时价格正编织着大明资本的经纬。\n踏入交易大厅那刻，恒温空调裹挟着茶水与墨香，却压不住场内此起彼伏的报价声。太子映入眼帘的尽是电报机、机械计算器嗒嗒作响的忙碌景象。交易员们或通过电报与海外客户沟通，或在大黑板上记录着最新的汇率与物价，忙碌而有序。\n穿过钢化玻璃廊道时，太子驻足端详两侧的荣誉墙，每块青铜铭牌都在诉说着大明资本的蜕变。当交易所总理介绍到各个企业的驻场代表时，太子忽然注意到角落里那位金发经纪人正用怀表校对时间，怀表指针与墙上的自鸣钟的毫厘之差，就可能影响到交易的成败。\n离别之际，广州证券交易所的所丞向太子赠送了一张昌德四十年印发的一百圆龙钞，牡丹花衬托下的皇极殿是那么熟悉，而又显得那么陌生，广州的腊月温暖如春，可太子不由得打了一个寒噤，他收起钞票，调整表情，向前来送行的官员们挥手致意，登上了返程的列车。"
mingcivwar.42.a:0 "资本的流动，将为需要的企业带去资金"
mingcivwar.43.t:0 "视察武汉三镇重建工作"
mingcivwar.43.d:0 "武汉三镇作为大明历史上与辽阳近乎同期开始建设的工业重镇，在整个工业史上都留下了浓墨重彩的一笔。但随着昌德四十三年（1930年）庚午钱荒的到来，整个大明的工业生产遭到了毁灭性的打击，武汉三镇更是祸不单行，同年的长江洪水为整个城市带来了灭顶之灾，大明帝国在天灾人祸之下焦头烂额，数十万人流离失所。这些事情至今已经过去了6年，随着大明经济逐渐走向复苏，昌德皇帝也在昌德四十八年（1935年）的财政会议上批准了武汉三镇新一轮的发展计划，希望重振这一华中的明珠。\n太子殿下视察了武汉各地的厂房开工情况、住房分配情况、市民基础生活设施建设情况等，对武汉各级政府提出了诸多要求。午间时刻，刚用完午膳的太子殿下对华中各界人士发表讲话，他表示武汉三镇未来将重新作为华中地区的经济引擎，带动整个华中经济迅速发展。"
mingcivwar.43.a:0 "只说西湖在帝都，武昌新又说东湖。"
mingcivwar.44.t:0 "太子督察四川救灾工作"
mingcivwar.44.d:0 "四川作为大明粮食的重要产地和新兴的工业开发区，是大明在庚午钱荒后少有的经济快速增长的地区。然而，随着四川爆发百年难遇的旱灾，导致粮食款收，百姓饥饿，甚至有流民逃荒的情况，四川的经济发展势头恐怕要夏然而止。为此，太子亲自来到成都，督察救灾工作的进行，确保四川能够在这次灾情后能够迅速恢复，作为新的经济增长点。\n太子在成都召见了四川巡抚、布政使、按察使等地方官员，询问了四川的灾情和救灾进展，以及四川的政治、经济、军事等方面的情况。太子对四川官员的工作表示了肯定，也提出了一些指示和建议。太子还表示，他将亲自前往灾区，视察民情，慰问百姓，分发救济物资，督促灾后重建。\n太子的南巡之行，受到了四川百姓的热烈欢迎和感激。四川百姓纷纷表示，太子的到来，让他们感受到了朝廷的恩德，也增强了他们的信心和勇气，他们相信，在大明朝廷的领导下，四川一定能够渡过难关，恢复生机。"
mingcivwar.44.a:0 "苍天保佑。"
mingcivwar.45.t:0 "太子视察西北军队"
mingcivwar.45.d:0 "中传社西安XXXX年X月X日讯作者：钟船生\n今日上午辰时，明帝国太子殿下抵达西安，开始了为期三天的西北视察之行。太子殿下一行受到了西北战区总司令蒋百里和陕西总督冯玉祥的热烈欢迎。太子殿下在机场发表了简短的讲话，高度赞扬了西北战区的辛勤工作和忠诚表现，鼓励西北人民狠抓实干、不懈奋斗，对西北人民的爱国热情表示衷心的感谢。\n太子殿下随后前往西北战区的近卫军驻地，亲自检阅多兵种的混成部队。太子殿下对西北战区训练表示满意，他高度赞扬了官兵们的昂扬斗志。太子殿下还与官兵们亲切交谈，询问他们的生活与工作情况，鼓励他们为捍卫国家统一而努力。\n太子殿下特别关注了西北战区列装的新型武器装备，如六十担军用运载车、“烛龙”铁甲轻战车、“精卫”双翼陆战、“金弯”双翼陆爆等，这些武器装备都是明帝国近年来在科技领域取得的重大成果，为西北战区提供了强大的战斗力。太子殿下详细了解了这些武器装备的性能，期待西北战区能更好发挥先进兵器的效能。\n太子殿下在检阅部队后，还观看了西北战区的一场军事演习。演习模拟了一场对抗外敌的战斗场景，展示了西北战区的协同作战和应变能力。太子殿下对演习的过程和结果表示满意，嘉奖了参加演习的官兵。\n据悉，太子殿下此次西北视察的目的是为了加强中央和西北的联系，促进西北的稳定发展，增进西北人民的信心福征，同时也是为了展示明帝国的强盛国力，对外传递和平合作的信号。太子殿下在接下来的两天里，还将继续参观西安的其他重要机构场所，与西北的各界人士深入沟通交流。"
mingcivwar.45.a:0 "哦，真威武啊！"
mingcivwar.45.xiaoguo.a:0 "增加3点交通系影响力"
mingcivwar.46.t:0 "开封黄河大桥"
mingcivwar.46.d:0 "作为南巡的最后一站，太子对于开封进行了一系列的走访考察，而他行程的最后，就是乘坐火车以缓慢的速度通过大明的工业标志之一——开封黄河大桥。\n然而意外总是在大家最松懈的时候到来，也许是一路的平安使得护卫放松了警备，也许是地方政府意外泄露了太子的形式。但当火车驶过大桥时，轰然一声巨响，桥梁坍塌，整个车身燃烧起熊熊火焰，现场顿时飞沙走石、云雾缭绕，尽管消防队伍以最快的速度到达，但处于爆炸正中的太子朱镕寺在爆炸的冲击力下，头破血流，当场身亡。"
mingcivwar.46.a:0 "太子！太子！！！！"
mingcivwar.46.xiaoguo.a:0 "减少7点紫禁系影响力"
mingcivwar.47.t:0 "搜捕通知："
mingcivwar.47.d:0 "昌德四十九年十二月二十日\n大明内务部急令\n各省巡抚、布政使、按察使、知府、知县钧鉴：\n本部于今日寅时接获河南巡抚急报：皇太子殿下自南巡归京，途经汴梁黄河铁桥时突遭暴徒预置炸药袭击，御体罹难。此变实为本朝五百余年未有之奇耻，对天子威权之公然冒犯，举国同愤。\n本部已即刻派遣钦命专员会同河南官府彻查此案。兹奉圣裁：无论主使者为谁，无论藏身何地，无论勾结何方，务须掘地三尺，尽诛逆贼。着令各省三司长官即刻进入紧急状态，严饬地方治安加强戒备，彻查一切可疑人等。\n各省知府以上官员、河南全省州县官须知：此案若不能限期破获，即为地方官守土失责。着即传檄所属军警部门，每日寅卯时分呈报治安动态；凡匿藏逆党、窝藏赃证者，与正犯同罪；能捕获首恶者，许以免罪自首并赐银千两。\n各交通部门须优先保障刑科专使递送证据之用，所有关口增强搜查等级，见有形迹可疑且不能验明身份者，一律缉拿。\n此令自颁行之日起，直隶、河南、山东三省戒严十五日。若有借机哄抢、散布流言者，许地方官便宜从事。望我大明臣工共鉴丹心，同扶国本，毋使逆贼阴谋得逞，毋负圣上宵衣旰食。\n大明内务部\n昌德四十九年十二月二十日\n"
mingcivwar.47.a:0 "任何邪恶，终将绳之以法！"
mingcivwar.48.t:0 "锦衣卫审讯报告："
mingcivwar.48.d:0 " 在昌德四十九年12月20日，大明帝国太子南巡途中遭遇不幸，铁路大桥上发生了爆炸事件。内务部立即展开了全国范围的调查和搜捕行动。以下是开封铁路大桥守桥工和开封铁路局局长被抓的经过：\n十二月廿一日\n内务部专员会同公安部等急赴事发地，拘押守桥工赵二狗。该犯供称仅司巡检之职，未见异状。然其失察之责难辞，遂羁押备讯。\n十二月廿二日\n复审赵犯，其供词多有矛盾。审讯官依律施以刑讯，犯人虽坚称无辜，然其神色多变，显有隐情。医官依例施救后续审，犯人终未吐实。\n十二月廿三日\n专员搜检铁路局，于局长钱如水办公室查获涂改之检修台账。钱犯被拘押途中，随从悉数被剪除。\n十二月廿四日\n钱犯供称台账由副手张彪负责，其对于相关内容并不知情。然其身为一局之长，失察之责难逃。北镇抚司比对账目，发现多处墨迹新旧不一，确证伪饰。\n十二月廿七日\n内务部查明，铁路局内确有以钱如水为首的犯罪集团，私相授受，虚报检修进度，为暴徒布设炸点提供便利。其行径实属罔顾国法，罪不容诛。\n十二月廿八日\n赵犯在审讯中气绝。经仵作检验，其死因系旧疾突发，与刑讯无涉。内务部依律定性“畏罪自缢”，已妥善处置其后事。\n正月初三\n内务部业已完成证据链拼接，钱如水等七名涉案人员罪证确凿，已押京师等待进一步处理。相关证物移交刑部备鞫，余党清剿仍在进行。\n"
mingcivwar.48.a:0 "继续严查（放弃查看其他审讯记录）"
mingcivwar.48.b:0 "了解职员审讯记录"
mingcivwar.48.c:0 "了解局长审讯记录"
mingcivwar.49.t:0 "职员审讯记录"
mingcivwar.49.d:0 "锦衣卫审讯实录摘录：\n审讯官甲（拍案）：“你到底什么时候说实话？”\n守桥工（瑟缩）：“我真没撒谎！当天我就是按规矩查桥，没见啥异常！”\n审讯官乙（逼近）：“少废话！你手上的火药怎么解释？”\n守桥工（慌乱）：“那是我之前拆可疑包裹炸的！当时就报了上去，您看我这伤...”\n审讯官甲：“刚才不还说没查出异常么？怎么又有可疑包裹了？”\n守桥工：这....这包裹也不是搜查桥梁时找到的呀，搜桥的时候确实..”\n审讯官乙（冷笑）：“编不圆了吧？是不是拿了刺客的钱，故意帮他们打掩护，甚至帮他们安放了炸弹？”\n守桥工：“大人明鉴！小的连刺客长什么样都不知道啊！”\n审讯官乙（踹翻凳子）：“谁信你这套！最后给你个机会，招不招？”\n守桥工（涕泪交加）：“我真是无辜的。你们不能这样对我，你们没有证据，你们不能.....”\n审讯官甲：“乱来？这是为保天子、为保大明！叛臣贼子就该死！”\n审讯官乙（招手）：“既然敬酒不吃吃罚酒——上家伙！帮这小子清醒清醒！今儿让你见识什么叫忠君！”\n附注：审讯至戌时三刻，犯人赵二狗因“抗拒实供”被施以常规章法，最终自承”受惑于乱党”。其供词已用朱砂捺印，呈大理院待核。"
mingcivwar.49.a:0 "继续严查（放弃查看其他审讯记录）"
mingcivwar.49.b:0 "了解局长审讯记录"
mingcivwar.50.t:0 "局长审讯记录"
mingcivwar.50.d:0 "审讯官丙（拍案）：“钱局长，大桥炸了您还能坐得住？知道什么还是趁早交代吧？”\n局长钱如水（昂首）：“本官尽责无虞，何来交代？我对朝廷的忠心天地可鉴！”\n审讯官丁（摔碎茶盏）：“少装清廉！你办公桌底那堆台账怎么解释？”\n钱局长（冷笑）：“什么台账？我怎么不知道自己还有什么台账？怕不是你们炮制出来诬陷忠良的！”\n审讯官丙：“事到如今还在这嘴硬？现在你是嫌疑犯！说，你跟刺客有没有勾连？”\n钱局长：“本官说过多少遍了——没有就是没有！”\n审讯官丁（点燃火折子）：“你最好还是配合一点，不然的话....”\n钱局长（啐唾沫）：“一群跳梁小丑！尔等滥权枉法！本官要写状告到御前！”\n审讯官丙（挥手）：“既然如此，那只好请钱大人再‘回忆回忆'了”\n\n附注：戌时四刻，犯人钱如水“松口招供”，承认曾收受“可疑账本”，但坚称不知情。其供词已捺血手印，待圣裁。"
mingcivwar.50.a:0 "继续严查"
mingcivwar.50.b:0 "了解职员审讯记录"
