mingcivwar.53.t:0 "[Get_title_news_header]转载纽约时报消息[Get_title_news_pic]"
mingcivwar.53.d:0 "大明帝国东宫变故，太子殿下遇刺身亡，昌德皇帝震怒。据本社线报，大明天子可能已锁定武备系在此事忠干系甚深。为整肃朝纲，昌德皇帝密遣锦衣卫与内务部精锐，对涉事将领展开暗中监视审讯，同时授意改革派彻查其兵权钱粮，以贪墨罪名瓦解其根基。\n通过此后御前会议上通过的一系列政治经济法案来看，昌德对于武备系的打击无疑是坚决的。相关法案对部分国企进行了改制，将武备系控制的一些重要的企业，改为股份制或合资制，引入民间和外国的资本和技术，削弱武备系的垄断和利益。\n昌德皇帝的这些举措，可能将引起了武备系的不满和反抗。据我社知名社评家，五星上将麦克阿瑟将军对此分析，其认为尽管大明皇帝是一位手腕老练的政治家，但武备系不会坐以待毙，大明朝局可能会出现动荡。后续具体内容，本社记者将会持续跟踪报道。"
mingcivwar.53.a:0 "洋人懂什么大明政治？"
mingcivwar.53.xiaoguo.a:0 "减少5点紫禁系影响力"
mingcivwar.54.t:0 "老陈的故事（第一部分）"
mingcivwar.54.d:0 "与同僚们打完猎，中午回到家中的老陈在日记上随手一写“今日无事发生”后，便在仆人的引导下，前去沐浴更衣。浴缸里昏昏欲睡的他被爆炸声惊起，紧接着听见引擎轰鸣与杂沓脚步声。赤身的老陈不及穿衣，只裹着浴巾冲到客厅，劈头骂道："哪个王八羔子敢把车开进我院子？！不知老子是市议员陈嘉墨吗？！"\n院中赫然停着辆新式警用装甲车，数十名持枪锦衣卫全副武装。老陈见状，赤裸跪在大理石地砖上，浴巾滑落也顾不得，结结巴巴问道："大人大人，小的……小的犯了何罪？"\n领头锦衣卫沉声道："你就是陈嘉谟？"”"
mingcivwar.54.a:0 "“正、正是在下”"
mingcivwar.55.t:0 "老陈的故事（第二部分）"
mingcivwar.55.d:0 "“我冤枉啊——”老陈双膝一软，直接跪在发霉的稻草堆前。当年在军营里横冲直撞的威风，早被退伍后的生意场磨掉七成，剩下的三成也被这群黑衣人吓得魂飞魄散。隔壁牢房断指的嚎哭声还在铁栏间回荡，每一声都像锉刀刮过他发颤的脊梁骨。\n“陈老爷何必喊冤？”左边的锦衣卫笑眯眯蹲下，漆黑的指甲在竹椅扶手上敲出笃笃声，“走私武器算一桩，卖枪给赤匪算一桩，赤匪拿枪打太子又算一桩——您瞧这罪状，十根手指都数不完。”昏黄油灯下，暗红麒麟纹的绸褂泛着冷光。\n“真不是我！我堂堂议员、正经商人，哪能干这种事？”老陈话音未落，另一名锦衣卫已把一沓纸摔在他脚边：“您自己招的！三天前刚签了指模。”老陈瞪圆眼睛——这真是见了鬼了，他在这老鼠横行的牢房关了七天，连审讯影子都没见着，又何谈什么招供呢？\n“我要打电话！找同乡联谊会！”老陈突然暴起，铁链哗啦作响。\n“省省吧！"两只铁钳般的手把他按回椅子，“皇上要你死，王永江也救不了你！”\n“等等！我要见我老婆！她可是冯国璋的亲侄女！”老陈突然抓住最后稻草，“我是他丈人！不，他是我丈人！我要见他！”话音未落，铁靴已踹在他后腰上。”"
mingcivwar.55.a:0 "除了大明列祖列宗谁都救不了你"
mingcivwar.56.t:0 "老陈的故事（第三部分）"
mingcivwar.56.d:0 "近日，河北任丘人士陈嘉谟因为涉嫌走私枪械与勾结赤匪被判处死刑。同时，他所私售枪支被追查到涉及太子刺杀案。目前此人已于菜市口靶场被执行枪毙。\n该人为大明直隶军区前陆军上将，退伍任河北任丘帆亭枪械制造有限公司董事长，多次当选任丘市议会议员，之所以做出这样伤天害理的犯罪行为，据刑部大理寺督察局联合调查委员会判断，是由于境外势力的鼓动与更上层社民党人活动网的共同工作导致的。在此，本报提醒诸位良民谨同产工会等极端势力渗透，拒绝金钱诱惑，莫被革命乱党民贼谎言所惑，营造一个更加和谐安全稳定的社会。\n在陈嘉谟被枪毙后，关于其背后势力网的调查仍在继续，本报将在下一期继续跟进官方的进一步调查。\n另，想知道你的邻居是否是同产工会分子吗？你的上司或校长是否会用德语写信？你的女友是否有偷偷套问你的情报？所有有关于辨别同产工会分子的有效干货！尽在本报生活版——《身边的赤匪》！！！"
mingcivwar.56.a:0 "给我也来一份"
mingcivwar.56.xiaoguo.a:0 "减少5点武备系影响力"
mingcivwar.57.t:0 "大明皇帝昏迷，太孙监国辅政"
mingcivwar.57.d:0 "大明皇帝自昌德四十九年冬至日太子殉国于黄河大桥之后，悲痛欲绝，身体日渐衰败，时常昏迷不醒，无法亲理朝政。昌德五十年三月初一，皇帝清醒之际，乃颁诏明谕：立太孙为皇嗣，令其监国摄政，付以社稷之重。并钦命内阁首辅杨度、庆王、陆军枢密使张开儒、海军枢密使萨镇冰等文武重臣为辅政班底，共襄机务，翊赞太孙。\n太孙年方二十有五，天资颖异，髫龄即遍览经史，洞悉中外情势。秉性开豁，乐近闾阎，素喜民间风物，故誉望素孚于朝野。据悉，太孙已经开始筹划一系列的改革措施，意在厘定官制、整饬度支、振兴百工，俾国政可应时变，国力足御海疆。/n\n太孙年方二十有五，自幼聪慧过人，博览群书，通晓内外事务。其性格开朗豁达，喜爱民间文化，亲近百姓。其治国之道，主张自由主义，尊重人权，推动改革开放，促进经济发展和社会进步。据悉，太孙已经开始筹划一系列的改革措施，旨在调整国家的政治体制和经济结构，以适应时代的变化和国际的竞争。"
mingcivwar.57.a:0 "这么说，咱经济要好转了？"
mingcivwar.57.xiaoguo.a:0 "增加1点管学系影响力"
mingcivwar.57.b:0 "啊，看来要变天了"
mingcivwar.57.xiaoguo.b:0 "增加1点紫禁系影响力"
mingcivwar.58.t:0 "改革，启动！"
mingcivwar.58.d:0 "“即日起推行新政。”太孙朱喜钲在监国诏书末尾落下一记朱批，印泥在洒金宣纸上洇开血色年轮。这是他生平首次握印批文，也是第一次将国运系于己身。指节因用力而泛白的刹那，他真正触碰到了权力的重量。\n一份份诏书从御前会议中发出，各项改革措施很快便在朝野上下引起了新一轮的风暴。支持者视其为救亡图存的曙光，反对者则视之为动摇根基的洪水。尽管内外议论纷纷，但并没有动摇这位年轻监国的变革之心。"
mingcivwar.58.a:0 "周虽旧邦、其命维新"
mingcivwar.59.t:0 "咨议院会议上的争论："
mingcivwar.59.d:0 "京师明堂议事厅。时值夏日，午后的天光透过高大的彩绘玻璃窗，在光洁的柚木地板上投下斑驳而略显燥热的光影。大厅穹顶高阔，雕梁画栋尽显朝廷气象，只是场内却弥漫着紧张的氛围。议员们按派系分坐长条议席，空气凝滞，唯有偶尔的咳嗽声和翻阅纸张的窸窣打破沉寂。议长席上，白发老者眉头微蹙，静待发言。\n清政系议员中，一位约莫四十许、目光锐利的男子，霍然起身。他整理了一下手中的稿件，声音洪亮而充满激情，回荡在空旷的大厅中：\n“诸公！今日所议变法，乃太孙殿下为社稷谋万世之基的根本大计！非为一己，非为一党，实为天下苍生！新政之要，在于正纲纪以儆效尤、清吏治以安黎庶、通民情以达天听！此非纸上空谈，实欲令权柄行于朗朗乾坤之下，使魍魉伎俩无所遁形！试问，” 他手臂猛地一挥，“阻挠新政者，所惧者何？无非固守祖制之利、惮于鼎新之艰，恐失其盘踞之位罢了！本席泣血叩请诸公，” 他环视全场，目光灼灼，“以天下公义为心，摒除门户私衷，共襄此维新盛举！”\n话音未落，紫禁系席位上，一位须发花白、身着御赐袍服的老议员愤然拍案而起，震得面前青瓷盖碗叮当作响。他面色涨红，手指微微颤抖地指向对方，声音带着压抑不住的愤怒：\n“好！好一篇慷慨激昂、蛊惑人心的策论！” 他冷笑一声，“说得比唱得还好听！本席倒要问个清楚明白——尔等口中的‘变法’，可是要虚置圣上，纵容群小党争？可是要开党禁之隙，引陛下钦定的大同逆党登堂入室，染指庙堂权柄？可是要尽弃列祖列宗之成宪，坏我大明五百年之法统？！” 他越说越激动，声音陡然拔高，“若果是如此狂悖之论！本席今日便在此立誓，拼却这性命不要，亦必伏阙死谏！” 他深吸一口气，强压怒火，换上一种近乎痛心疾首的语调：“诸公！岂不闻圣贤言‘治大国若烹小鲜’？变法非不可为，然当如履薄冰，循序而进，步步为营！若似尔等这般操切孟浪，罔顾根本，全盘推倒，” 他猛地一捶桌面，“那便是引天雷地火，自焚其身，终致天下汹汹，社稷倾危！尔等但知阿谀逢迎上意，博取虚名，全不虑江山根本、祖宗基业！长此以往，国事必溃于尔等清谈空论之徒手中！”/n\n紫禁系议员：“动听的口号谁不会喊？我倒要问问——这变法是要架空皇权、开放党禁吗？是要让大同会那些乱党堂而皇之进入议会吗？是要砸了大明祖制的招牌吗？如果是这样，我第一个反对！岂不闻治大国若烹小鲜？变法可以，但不能操之过急，不可大肆铺开，否则就是引火焚身！你们这些宵小只知道一味奉迎上意，朝局早晚败在你们这些空谈家手中！”"
mingcivwar.59.a:0 "民为邦本、本固邦宁"
