mingcivwar.61.t:0 "天朝经济周报"
mingcivwar.61.d:0 "自太孙殿下秉政以来，连续召开多次经济会议，系统擘画经济改革方略。太孙强调，各处官吏需深研中央经济工作会议精神，以激发市面活力、解放发展动力为要务，推促大明经济平稳高效发展。\n太孙指出，大明经济久罹保守封闭之困，致使效能低落。当放宽对外贸易限制，吸引更多商贾投资，同时鼓厉本土商号拓垦国际市场，提振产品品质与创制能力，增益外汇收益与国际竞逐力。目下官营资本垄断甚剧，经济活力受限。太孙主张裁减市面管制与税项审批，芟除壁垒，推促价格机制自由化，优化物力配置，激发市面革新活力，纾解国帑压力。\n民营工商业乃经济活力之枢纽。太孙提出，当以资佥贷付、税项优待等策励创业，优化官署服务体系，为民营工商业畅达发展铺平道路，提升经济多样性和雇工水平。针对官营企业效率低落、负累沉重之弊，太孙要求施行改组与出售，剥离非核心资财，裁汰冗余员额，推促部分官营企业向民营工商业转让，提升生产效能与市面竞逐力。\n太孙号召天朝体系诸邦减削贸易壁垒，秉持“开放包容、协力共赢”之念，共同应对经济困局。大明愿与诸邦打造共同发展平台，实现互利共赢。\n太孙坦言，此次经济改革关涉广泛利益调整，虽引发争议，然改革势在必行。他吁请各处官吏摒弃定式思维，敢于突破改革深水区，坚信大明经济未来光明可期。\n（本报将持续追踪太孙经济改革的实施进展）"
mingcivwar.61.a:0 "好好学习、天天向上"
mingcivwar.62.t:0 "昌德皇帝驾崩"
mingcivwar.62.d:0 "钦惟我朝太祖皇帝，承天景命，统一四海，子孙万世，永享太平。先皇昌德皇帝，承先启后，光大鸿业，五十载间，奠定天下，功盖万世。今驾崩在即，临终遗诏，以告天下：\n朕深承先祖遗泽，恭行昭穆遗训。自践祚以来，勤于政事，未尝懈怠。每夜秉烛，尽心于国，深爱子民，承天之祜。朕深知君主之道，非一人之功，实乃众臣之力。故于朕御宇之际，广纳贤良，任人以能；力行开化，以安民生；崇文尚武，以谐万邦。兴咨议、纳谏言、育工商、启民智，是故四海英才，咸聚于朝，共商天下大事。朝堂清明，百姓安居乐业，此乃大明之盛世，亦为开化之功业。思及天下苍生，朕甚感欣慰。\n自朕登基以来，奉守天命，续祀四纪，谨务实事，恩遍海内。奈何丙辰祸起，寰宇板荡；戊午事发，青丘陆沉。构兵英德，非朕本意。然华胄子孙，筚路蓝缕，一朝战起，罹难他乡；英人进逼，荼毒我民，惨状之至，目不忍睹。唯念早息兵燹，解民倒悬；爰举义旗，吊民伐罪。乃兴三军，挥纛而西；喋血三载，克止外患。赖我国民，各尽本分，忠义之臣舍生于外，孝节之士忘死于内。拒兵境外，赓延太平；华夷万邦，来朝于国。此非朕之幸，实天下之幸也。\n夫天下者，乃天下人之天下，非一人之天下也。自朕御极以来，时时以之自省。然岁月不居，人生苦短，今朕已年迈力衰，不能继续抚育万民。幸有皇太孙喜钲，人品贵重，才德兼备，仁明刚正，宜登大位，以勤民政。中外文武臣僚同心辅佐，以福我民。凡丧葬之仪，一如旧制勿异。布告天下，使明知朕意。"
mingcivwar.62.a:0 "待到换防完成，看看你们还能如何？"
mingcivwar.62.xiaoguo.a:0 "减少10点紫禁系影响力"
mingcivwar.63.t:0 "出镇西北，筹备换防"
mingcivwar.63.d:0 "大明帝国昌德五十年，先帝驾崩，太孙继位。这位年轻皇帝虽素有贤名，但仓促临朝，治下缺乏有力臂助，施政多赖首辅杨度与庆王襄助。特别是庆王，作为先帝的养子和少帝的长辈，多年来始终是皇室的中流砥柱，也是少帝最信赖的盟友。\n然而，少帝深知天下未靖，朝中仍有不满势力暗中窥伺皇位。为稳固江山，他决定对军队进行大规模换防，以防有人借军权作乱。为此，他特意任命庆王前往西北领兵，替换原驻顺天的守备部队。这一举措既是对庆王的信任，也是借其威望巩固西北边防，抵御外敌。\n庆王得到皇帝的旨意后，知道皇帝是对自己的信任和重用。他立刻整顿行装，带领自己的亲兵迅速向西北进发。到达西北后，庆王即刻着手安排军队的驻扎和训练，同时利用此前出镇西北的关系网络，迅速与当地的官员和民众打成一片。他在他的一系列措施之下，原本略显动荡的西北局势迅速稳定下来，也让皇帝对他更加信任和赞赏。"
mingcivwar.63.a:0 "待到换防完成，看看你们还能如何？"
mingcivwar.64.t:0 "卫国公府中的争论"
mingcivwar.64.d:0 "啪！\n卫国公一掌拍在案上，怒视着捂着脸的孙子，声音里带着不可置信：“你再说一遍？！”\n“我说，我支持陛下的军事改革！”青年咬牙说道，尽管脸上火辣辣的疼，但眼神坚定，“太孙的主张是对的，爷爷，军队现状已经积弊太深，不改不行了！”\n“好好好！”卫国公怒极反笑，“军校一毕业就翅膀硬了？你知道少帝的改革是要砍军费、缩军规模、动军队编制吗？！他要改指挥体系，把我们这些老将当绊脚石！你知不知道军队里勋贵遍地，稍有不慎就可能造成混乱？！”\n“爷爷，正因为问题太多才更要改！”青年打断他，“不改革，这些问题就会自己消失？任由那些既得利益者坐大，国家会更安全？您当年不也是在昌德爷登基时力挺改革？现在我支持陛下，恰恰是在继承您的意志！”\n“放肆！”卫国公猛地起身，案上茶碗应声碎裂，“你知道什么！当年改革是时势所迫，现在军队根基未稳，贸然动刀就是自毁长城！你以为几个学生娃能接得住？！”\n“爷爷，”青年也站直了身，“学生娃接不住，但老抱着过去不放，大明的未来呢？那些问题拖得越久，代价越大！您说尊重先烈，可先烈们流血牺牲，不就是为了让大明更好吗？！”\n屋内一时寂静，只听见两人急促的呼吸声。"
mingcivwar.64.a:0 "看着眼前的孙子，卫国公仿佛看到了当年的自己"
mingcivwar.65.t:0 "贼喊抓贼"
mingcivwar.65.d:0 " “出去！所有人快出去！”在老赵强忍睡意死盯着锅炉表的时候——这时大概已是子夜了——一句说话在他耳边炸响。老赵别过头去，只见来正准备来配送燃料的小李已经扔下手里的煤炭推车，迅速逃去了。几个穿着制服的汉子绕过落荒而逃的小李，诧异的看着依然纹丝不动的老赵。\n“快出去！”看上去为首的汉子一手指着正在夺门而出，差点被一把铲子绊倒的小李，一面蛮横地冲老赵吼道。\n“各位爷，我是看锅炉的，要擅自离职了，这锅炉恐怕……”\n“怎么，难不成怕锅炉炸了？这厂里有炸弹！你再不跑自己首先要被炸飞！”\n老赵双眼立马鼓得滚圆，僵在了地面上——不过他没僵太久很久——因为半分钟以后人就已经在门口了。\n“嘿嘿，瞧这老头儿。”汉子看着逃远的老赵，打了个手势。旁边的跟班变戏法似的掏出一个包袱，接着又麻利地把包袱塞进了锅炉底下。"
mingcivwar.65.a:0 "假作真时真亦假……"
mingcivwar.66.t:0 "少帝赴皇陵"
mingcivwar.66.d:0 "8月21日，皇帝陛下率领宗亲及百官前往皇陵，准备于次日吊念昌德皇帝的五七祭日。车队于下午五点出发，七点半前后到达皇陵住宿区域下榻，锦王等宗亲、部分勋贵文臣以及首都警备司正副司长随队伍前往皇陵。\n皇室宗亲大长公主朱镕霖此时正从朝鲜乘坐火车连夜赶往顺天，准备于第二天一早参加仪式。首都警备司直属卫队及孙殿英部，负责皇陵围安保工作。"
mingcivwar.66.a:0 "明日祭祀，告慰先帝"
mingcivwar.66.xiaoguo.a:0 "增加5点紫禁系影响力"
mingcivwar.67.t:0 "深夜惊梦"
mingcivwar.67.d:0 "就在老赵惊慌失措逃离发电站的当晚，驻扎在顺天府的实验性摩步军士兵们被一阵猛烈的号声惊起——上头发生了什么破事才会这个点叫他们起来？小战士不解地扣好衣服，加入排列有序冲出营房的队伍。\n在夜色苍穹的笼罩下，偌大的操场被几盏大功率探照灯照得雪白，第一时间穿戴整齐的士兵们列队立正，浑身上下被曝光得如雪人一般。\n“同袍们！”放音筒里传出响亮却模糊的声音，小战士认出这是彭总——他们的顶头上司，他只在刚刚入伍的时候听过他的演讲，“昔有周幽王烽火戏诸侯，再三假传烽火以致亡国。今天各位闻声而动，如同昔日诸侯闻烽火而动，我无端发令，如幽王戏弄诸侯——但是与幽王有所不同的是，一有号令，你们就必须有如今日一般到场！天道难测，灾祸潜行。国家危难不分昼夜，我们卫国铁军也要闻风而动，所以以后只要有听到信号，无论如何也要到场！””"
mingcivwar.67.a:0 "无事生非……？"
mingcivwar.68.t:0 "瞒天过海"
mingcivwar.68.d:0 "昌德生于海内无二之家，有不凡野心，其陵墓也是非同寻常——庞大的混凝土与木石建筑群构成了其寂静庞大的陵园，彰显着死者的权威——此时却已钟弦轰鸣，由身着五色朝服的庞大仪仗队缓缓前进，一切仪式皆如同这个王朝一样古老，今日是太孙来祭拜的日子。但这一热闹景象不是我们观察的重点，凡是帝王陵寝便有被盗之虞——但如果看守陵寝者自己就是贼人呢？\n陵园的主警卫室位于陵园中轴线大道的黄金地段，保证警卫可以随时抵达陵园的每一个犄角旮旯。“魁元怎么说？”在接踵响起的电话铃声与转盘声中，梅馨急忙问着他的副手——按照计划，今晚便是政变的最好时机——把那个不把武备系跟老勋贵放在眼里的毛头小子太孙给搞倒的政变。“孙总表示已经准备就绪，可以在今晚十点出动，”副手麻利地在人群中穿行着，“那我们也在晚上切断电话电报线喽。”“那是，”梅总嘿嘿一笑，背过身去面对着陵园的地图————"
mingcivwar.68.a:0 "这臭小子还以为一切在他掌控呐，嗐"
mingcivwar.68.xiaoguo.a:0 "增加2点武备系影响力"
mingcivwar.69.t:0 "勋贵，祭肉，雨"
mingcivwar.69.d:0 "“陛下，清洗武备系的事还得三思而行————” 潘江伯爵捏着筷子挑开糖醋酱的芡粉层，祭肉在盘子里晃出一圈油光。这种仪式饭局的油腻让他喉咙发紧，但贵族的克制让他没动声色，“锦衣卫盯着呢，真有异动早该有密报了。”\n少帝突然把酒杯往案上一蹾，琥珀色液体溅湿了伯爵的袖口：“舅爷咋这么胆小？” 青年皇帝的笑意里带着不耐，“武备系那帮酒囊饭袋？早被他们自己喝垮了！”\n“殿下...” 潘江伯爵喉结动了动，“就算如此，也得给勋贵们留条退路。您真当那些老将军会心甘情愿交出兵权？这里边的水很深....” 他瞥见少帝瞳孔里跳跃的烛火，突然明白这孩子根本没把反对声当回事。\n“退路？” 少帝扯了扯嘴角，“当年昌德爷改制时，您不也说要稳扎稳打？结果呢？” 他起身时带倒了酒架，铜盏叮当乱响，“现在该轮到他们交待了！” 青年皇帝的身影很快消失在屏风后，只留下被撞歪的祭肉盘，在案上投下破碎的阴影。"
mingcivwar.69.a:0 "望着皇孙远去的背影，伯爵长叹一口气"
mingcivwar.70.t:0 "顺天的雨"
mingcivwar.70.d:0 "顺天人家常于门口悬挂警察局——其实也不是刻意要挂的，也没人有这个闲工夫，只是警察局靠着每年几百万元的政府拨款，慢慢滋长起来的——到了下雨天，几个穿着藏青色制服的男人便在屋内攒动了起来。\n老梁在顺天警察总局工作廿年有奇了，这样的雨他已经见了不下万次。还有一个月退休的他现在只想伴着雨声欣赏局里忙碌的警员，等熬到了十一点再下班回家陪老婆孩子。\n“局座，”小赵——刚刚入职半个月不到的试用期警——奔到桌前，“出问题了——”\n “不会又是一楼马桶堵上了吧，都说了不要把厕纸扔——”\n“不是！”平日里胆小怕事的小赵突然发作，似乎真有什么急事一般，“我们联系不上皇陵的保安室了！”\n“叫通信员！立刻知会顺天局！”老梁腾的一下站了起来。其实此刻他心脏一阵抽搐，多年积攒的三高也似乎有发作的迹象，但他努力克制自己，不让警员们察觉到局长慌张的样子。"
mingcivwar.70.a:0 "窗外的雨越下越大了"
mingcivwar.71.t:0 "白陵蓝调"
mingcivwar.71.d:0 "夜色深沉，昌德皇陵的纯白佛塔在灯光映照下格外刺眼。推窗望去，四周尽陷无边黑暗，唯有那塔身在夜色中泛着冷光。\n“老潘，你觉得陛下如何？”鹅黄灯光下，压手杯的釉面流转着柔光，映照出刘复基略显严肃的神情。\n潘江漫不经心地搅着茶汤：“陛下英明，国之栋梁，怎么了？”\n刘复基突然嗤笑，端起茶杯将滚烫的茶水浇在茶宠上，紫砂金蝉顿时喷出串串水泡：“少给我来这套！咱对这小子什么态度，心里没数？”他像逗弄水泡的孩子般晃着茶杯，可眼神却透着中年人的冷厉。\n“这茶宠火候还差，”他用扳指叩了叩自己的金蝉，“得多泡泡老茶。”又挑着眉指向潘江的茶宠，“要我帮你浇泡普洱？”\n“不必不必，”潘江推了推茶盘，“我这老玩意儿虽年头久，可泥料太糙，还是不要献丑了……”话音未落，院外突然传来嘈杂声，紧接着噼里啪啦的枪声划破夜空。\n刘复基的警卫员撞开雕花门冲进来，带进一股火药味，茶几上的茶宠被震得东倒西歪。"
mingcivwar.71.a:0 "“大人，有人打过来了！”"
mingcivwar.72.t:0 "水晶"
mingcivwar.72.d:0 "雨越下越大了。\n在皇陵客房的窗户上挺立着一块防弹玻璃。镶嵌着木雕隔栏的两层层玻璃紧密地包裹一两层聚碳酸酯纤维，二十毫米厚的版体能够完美防御7.92mm口径的步枪子弹。千疮百孔的裂痕在苍白色的汽灯下犹如水晶一般华丽。\n被打碎的玻璃渣不太温柔地散落进这个良夜，在天空中扬起如廉价赛璐珞饰片一样。在玻璃旁边，人们来来往往——扣动扳机，击毙他人，抑或为他人所击毙——人很容易倒下，最终归为泥沙和虫豸，而河滩里细密的沙又被沾染着污渍的捞沙船抽出，制成了这块玻璃，所以说这是人类的一种逐渐完善似乎也不为过。\n人类是脆弱的，但他们左右历史的能力却远胜一块玻璃。此时，玻璃的生命结束了——一发狙击枪弹飞速穿过了它，终结了其防御袭击的使命。子弹钻出了一个喇叭形的缺口，在本已遍布裂纹的玻璃面上又留下了河网一般曲折的印记。但无论是子弹或者玻璃，它们只是历史的道具而已，最为重要的是——"
mingcivwar.72.a:0 "这发子弹打穿了玻璃，擦过了太孙的脸（太孙被俘）"
mingcivwar.72.b:0 "这发子弹打穿了玻璃，射中了太孙的头（太孙遇刺）"
mingcivwar.72.c:0 "这发子弹打穿了玻璃，然而房中已然空无一人（太孙出逃）"
mingcivwar.73.t:0 "抉择"
mingcivwar.73.d:0 "夜幕如墨，昌德皇陵的纯白佛塔在火光映照下诡异地发亮。少帝的车队在山道上颠簸而行，身后是冲天火光与此起彼伏的枪声，叛军的部队正从各方合围而来。\n少帝的侍卫长拿出了一张地图，指尖压在两条路线交汇处：“殿下，延庆方向有方振武的一个近卫师，此人乃先帝亲点嫡系，一定会保护您的安全，但山路崎岖需耗三个小时。”\n侍卫长顿了顿，又道：“另一个去处是沙河机场，刚刚通过您的紧急电台得知此地尚未陷落。这里相对较近，但有叛军摩托化部队沿温榆河推进。”怀表指针滴答作响，冷光映在他渗出冷汗的额头。\n少帝陷入了犹豫，他不知道该选择哪个方案。他看了看身边的人，他们都用期待的眼神看着他，等待着他的决定。他心里很清楚，他的选择可能会影响到他们的生死。\n他想了想，说道："
mingcivwar.73.a:0 "“去延庆火车站，我们去找方振武。”（太孙前往西北，暂时无效果）"
mingcivwar.73.b:0 "“去沙河机场，我们坐飞机离开。”（太孙前往应天）"
mingcivwar.74.t:0 "抵达"
mingcivwar.74.d:0 "沙河机场的空气中弥漫着硝烟和紧张的气息。政变部队从四面八方向机场逼近，与机场周围的守备部队展开了激烈的交火。机场内的飞机也被迫停止起降，只有几架飞机在跑道上疾驰，准备起飞。\n少帝在11点52分到达沙河机场，他的身边只有几名亲信侍卫。他见到了蔡司度和荣德生，作为自小陪在自己身边的老师，少帝第一次发现不知荣德生不知道何时起已然布满了白发。面对自己久未私下交谈的学生，荣德生也并未多说什么，双方简单地拥抱了一下，然后迅速上了飞机。他们没有时间多说，因为他们知道，政变部队已经快要包围机场了。\n少帝的飞机在11点56分开始起飞，但就在这时，政变部队的先头部队冲到了机场的大门。他们看到了飞机的尾翼，他们意识到了飞机的重要性。尽管他们不敢他们直接射击飞机，但他们选择向飞机周边开火，试图阻止飞机起飞。\n飞机的驾驶员是蔡司度的手下，他是一名经验丰富的飞行员。他不顾政变部队的攻击，全力加速，让飞机在跑道上冲刺。他知道，只要飞机能够离开地面，就能够摆脱政变部队的追击。他对着飞机的话筒说：“陛下，请系好安全带，我们马上就要起飞了。”"
mingcivwar.74.a:0 "起飞！"
mingcivwar.75.t:0 "忠义"
mingcivwar.75.d:0 "少帝蜷缩在飞机后坐，指节因过度用力而泛白。引擎的轰鸣与舱外的爆炸声交织成死亡奏鸣，他望着舷窗外翻滚的火球，喉间溢出憔悴的音节："朕的性命...就托付予你了。"\n机头昂起的刹那，起落架离地时带起一串青烟。少帝俯瞰沙河机场，政变部队的旗帜在机场中招展，守军的残影仍在燃烧，蔡司度与荣德生的身影却渐渐模糊。\n机翼划开夜幕时，蔡司度嘶哑的广播声穿透枪林弹雨，在整个机场响起：“各位听着！此刻升空之机乃陛下座驾！尔等莫要自误！”防爆玻璃外，叛军的机枪已经对准飞机，却在听到广播后迟疑地停下了动作。当少帝的座机冲破云层时，整个顺天城的枪声好似都停顿了一秒。\n广播室内，荣德生的手指旋紧广播旋钮，充耳不闻窗外火光。他用被血浸透的指尖叩击广播台，重复着："放下武器……停止谋逆……"。直到广播中传来一阵枪响后，沙河机场才彻底归于死寂。"
mingcivwar.75.a:0 "江东弟子今犹在，卷土重来未可知！"
mingcivwar.75.b:0 "该死，怎么让这小子跑了！"
mingcivwar.76.t:0 "设立关东招抚司"
mingcivwar.76.d:0 "辽阳时报，1937年1月1日\n大明帝国太子遇刺身亡皇帝昌德陛下手谕成立关东招抚司\n去岁十二月二十日，我朝储君在河南开封黄河铁桥南端遭遇暴徒狙击，所乘专列第四车厢轰然爆裂，太子殿下与扈从官弁二十七人罹难。此为本朝立国以来最惨烈之皇族蒙难事件，举国同悲。太子殿下素以忧国恤民事躬行实践，舆情归心，实为昌德陛下之股肱，讵料横遭毒手，朝野莫不扼腕。\n据内务部急报，凶徒作案手法疑似关东赤匪所为。近年“同产工会”假托新学煽乱，以暴力推翻圣朝为目标，屡在辽东、吉林等地策动变乱，焚毁衙门商铺，戕害良民无数。此次列车爆破案经军机处密查，疑与该逆党渗透中原铁路系统有关。\n值此国难之际，昌德陛下宵衣旰食，特降手谕设立关东招抚司，钦令前辽东镇守使、陆军检阅使署参议汤玉麟为钦差督办。汤座系欧战勋臣，深谙关外地理人情，昨夜抵京受命时即誓师：“臣虽驽钝，誓以颅血湔雪东宫血仇，务使逆党伏锧阙前！”现关东招抚司已调集关东军特务营、辽阳宪兵队及各地警备队，搜剿给地赤匪巢穴。\n本报获悉，关东地区各界今晨集会声讨暴行，地方商团、工协、学生联合会等民间组织均通电效忠阙廷。辽阳总商会急捐五十万银圆充作招抚司经费，吉林宗委会召宗教人士为太子殿下祈福。各界人士咸称：此次圣断英明，汤座威望素著，当能廓清关外逆氛。赤祸一日不靖，民心一日不宁，誓与叛党周旋到底，以慰东宫在天之灵！/n"
mingcivwar.76.a:0 "忠！诚！"
mingcivwar.76.b:0 "势必完成，扫清一切动乱势力！"
mingcivwar.77.t:0 "设立华南招抚司"
mingcivwar.77.d:0 "大明帝国昌德四十九年（1936年）12月20日，太子在南巡结束乘火车回京经过河南开封铁路大桥时，遭到不明人士的炸弹袭击，身受重伤，不治身亡。经过内务部的调查后，发现刺杀太子的凶手可能与大同会有关。大同会作为老牌极端分子，长期潜伏在国民中宣传极端共和思想，谋求颠覆帝制。内务部认为，大同会也是利用太子南巡的机会，策划了这次暗杀，意图挑起内乱，破坏国家统一。\n为绝后患，朝廷仿照关东先例，在广州设立华南招抚使司，钦命陆军上将李准为钦差大臣。这位曾平定广州米乱、潮汕民变的铁腕人物，到任次日便签发《戡乱十二条》：凡窝藏逆党者与正犯同罪，举报属实者赏万元。宪兵、密探、税警三支队伍在珠江口至梅关古道一线张网以待，连日来已有二十八名可疑分子在宵禁时分被拘押。\n悬赏布告张贴次日，两广密探已逮捕大同会成员四十七人，另有五百余人因嫌疑受到拘押。然华南招抚司能否完成任务，太子遇刺真相应何时方能昭雪，李督宪仍能深切感到肩头的千钧重担。"
mingcivwar.77.a:0 "忠！诚！"
mingcivwar.77.b:0 "势必完成，扫清一切动乱势力！"
mingcivwar.78.t:0 "西北都督府成立"
mingcivwar.78.d:0 "明昌德五十年八月二十一日夜，先帝三子锦王于顺天府骤起甲变，兵锋直指宫阙内阁，翌日晨即矫诏废黜少帝。这一消息震惊全国，西北边陲的庆王尤为震怒。作为先帝四子、少帝叔父，他连夜召集西北文武官员与士绅代表，决定以勤王为名在西北起兵反对政变，成立西北都督府，以维护少帝的大明正统。\n“锦逆叛乱乃不孝于先帝、不仁于陛下、不忠于大明、不义于天下。其篡位弑忠、欺民叛祖，人神共愤。吾辈岂能坐视苟安、同流合污？当奋起讨逆、护正统、卫社稷、保圣驾！身为大明子民、先帝旧臣，必以忠勇荡寇，重光山河！\n即设西北都督府总摄军政，誓师勤王！望诸君同心戮力，共赴国难！西北军民英豪当执锐披坚，虽九死而不旋踵，必教逆贼授首，复我大明乾坤！”"
mingcivwar.78.a:0 "奉天靖难，讨逆诛贼！"
mingcivwar.78.b:0 "胡言乱语，这是对于朝廷的背叛！"
mingcivwar.79.t:0 "七省联合自保"
mingcivwar.79.d:0 "顺天惊变急报传至应天后，咨议院魁首兼管学系主事张静江星夜联络江南诸省。苏、浙、皖三省闻风响应，唯鄂省都指挥使蒋翊武接武备系密电后按兵未动，严令本省兵马不得擅调。经两昼夜权衡，最终通电附议。湘赣两省的电报最初如泥牛入海，但次日清晨忽传拥戴电文。至八月二十四日，七省要员会盟应天，张静江当众宣读《讨逆檄文》，指斥武备系勾结锦王祸乱朝纲，宣告七省临时联合政府成立，传檄天下共赴国难。\n虽然七省临时宣布联合，但各省之间存在着较大的分歧，江苏、浙江、安徽是管学系的基本盘，湖北的蒋翊武和萧耀南被认为和武备系有千丝万缕的联系，而江西与湖南则一直受到大同会的渗透，甚至有消息称两省的军政人物中有不少都是大同会的同情者。\n张静江面对七省现在的情况也无可奈何，光咨议院里的议员尚且争吵不休，更何况是这广袤的七省大地。"
mingcivwar.79.a:0 "该死，这些管学系乱贼！"
mingcivwar.79.b:0 "南朝四百八十寺 多少楼台烟雨中"
mingcivwar.80.t:0 "西南变局"
mingcivwar.80.d:0 "大明昌德五十年8月21日，西南都督病逝，各省军政要员在举行隆重葬礼的同时，陷入权力真空的隐忧。这位掌控西南十余年的统帅，生前凭借出色的能力维持了西南稳定，其逝世使各方势力暗潮涌动。\n正当西南等待中央任命新都督时，顺天突发政变。紧急会议上，多数将领主张捍卫中央正统，认为支持政变将导致国家分裂并诱发外患。在军方的强力支持下，紧急会议推举战功显赫的蔡锷出任都督，由其火速组建西南都督府接管军政事务。\n然而，并不是所有人都对西南都督府的成立表示满意和赞同。四川方面，一些不满蔡锷就任都督的军政首领，认为蔡锷是一个独裁者，成立西南都督府是为了控制西南的权力和资源，违背了民主和自由的原则，背叛了西南人民的意愿和利益。他们在成都宣布成立川藏临时政府，作为西南都督府的对立面，声称代表四川和西藏的军政事务。"
mingcivwar.80.a:0 "西南也乱了"
mingcivwar.80.b:0 "南天兵起，护国卫民"
mingcivwar.80.c:0 "天府之国，民主为先"
mingcivwar.81.t:0 "漠北中立"
mingcivwar.81.d:0 "顺天兵变的消息传来后，漠北地方军政要员宣布召开紧急会议商讨举措。经过各方紧急磋商后，决议对于时下局势宣告中立，不卷入内地乱局。"
mingcivwar.81.a:0 "坐保塞北，护民一方"
mingcivwar.81.b:0 "哎，为之奈何？"
mingcivwar.82.t:0 "海外自治"
mingcivwar.82.d:0 "面对大明内部分裂的乱局，大明各个海外领土宣布地方自治，等待大明国内局势明朗后再进行进一步表态。"
mingcivwar.82.a:0 "商路通衢，黄金水道"
mingcivwar.82.b:0 "吕宋自治"
mingcivwar.82.c:0 "海外各地、联盟自保"
mingcivwar.82.d:0 "都是逆贼，不奉正统"
mingcivwar.83.t:0 "新皇登基"
mingcivwar.83.d:0 "大明帝国昌德五十年八月二十八日，锦王在紫禁城太和殿举行了隆重的登基大典，宣布自己继承昌德皇帝帝位，成为了大明帝国的新皇帝。登基大典由武备系的首领们亲自主持，各地的文武百官、军队将领、贵族大臣、部分外国使节等都参加了盛大的仪式，向新皇帝表示了忠诚和敬意。新皇帝在太和殿上发表了就职演说，宣布了新的帝国政府的成立。\n新政府进行了一系列政策调整和人事变动。许多在伪帝时期受到不公正待遇的军政元老纷纷得到平反，重新回到政府效力。新政府政策方向以加强国防、巩固经济以及维护国家的统—稳定为重点。新皇帝还表示，他将继承老皇帝的遗志，维护大明帝国的尊严和荣耀，面对大明各地发生的叛乱，其将采取一切手段尽快戡平内乱，以铁血和武力来捍卫大明百姓的生命与财产安全！"
mingcivwar.83.a:0 "拨乱反正，正本清源"
mingcivwar.85.t:0 "东延铁路通车"
mingcivwar.85.d:0 "《陕西日报》：今晨卯时三刻，随着交通部专员凌鸿勋挥动令旗，首列蒸汽机车“青龙号”自东胜卫鸣笛启程。历时五载修筑的东胜-延安铁路全线贯通，标志着河套地区与关中之间的铁路网体系顺利联通。\n此线北起河套重镇东胜卫，南抵延绥咽喉延安府，全长五百公里，穿毛乌素沙地、越无定河谷，设榆溪、横山、绥德等十二座车站。工部特聘法兰西工程师施耐德称：“全线采用钢制复合轨，遇沙筑堤、逢水架桥，整个工程有着极高的技术含量。”\n值此盛事，延安府万人空巷。老驿卒赵大勇抚轨叹道：“往昔要想坐火车去东胜要不然绕道宁夏，要不就要走山西，如今可真是便利多了。”\n据交通部透露，西北地区的铁路系统下一步将开通更多民用支线。目前相关项目的集资和规划工作正在逐步展开，本报将为大家持续跟进后续内容。\n（随报附《陕甘铁路全图》及客货运价目表）\n"
mingcivwar.85.a:0 "这可谓是当代秦直道呀！！"



mingcivwar.1001.t:0 "锦王统一大明"
mingcivwar.1001.d:0 "随着最后一块舆图的碎片被补全，顺天政府完成了帝国的统一。皇天无亲，惟德是辅；民心无常，惟惠之怀，在这场对抗废帝失德乱政，波澜壮阔的拨乱反正中，帝国的柱石们以其敏锐的政治嗅觉、老辣的手腕、对时机极其精准的把握和对帝国无与伦比的忠诚，毅然挺身而出，辅佐定武帝驱逐废帝、扫清六合，力挽狂澜地战胜了那些异端邪说，正本清源，成功捍卫并重塑了大明的无上荣光。\n此刻，战争的硝烟虽逐渐散去，各地秩序正在强势力量下有序恢复，但已被彻底激活的战争机器却并未就此停转。帝国的重新统一并非终点，而是新征程的起点。尊严只在剑锋之上，真理必在大炮射程之内。顺天的中枢正将目光投向更广阔的世界，帝国的掌舵人已在高悬的坤舆全图前，为忠诚而勇敢的军官与士兵寻找战旗下一个所指的方向。"
mingcivwar.1001.a:0 "大明万岁！"
mingcivwar.1002.t:0 "太孙统一大明"
mingcivwar.1002.d:0 "应天的街头，战争带来的阴霾一扫而空，欢乐与喜悦成了主旋律，年轻的学子们自发上街举行胜利游行，店铺外也都摆上了庆祝光复的广告牌，年轻的天子终于在他忠实可靠的臣民的帮助下，重新扫平天下，恢复了大明的统一。\n应天乃至整个帝国的百姓都松了一口气，他们厌倦了战争与动荡，渴望一个稳定、可预期的未来。于是，才有了眼前这洋溢街头的欢乐气氛。人们庆祝的，不仅仅是一场军事胜利或权斗的终结，更是一种制度的胜利——它证明即便遭遇种种意外带来的曲折，大明帝国最终仍能依靠其内在的韧性与纠错能力，回归正轨，凝聚共识。\n周虽旧邦，其命维新！古老的帝国通过一场虚惊，再次确认并强化了其走向君宪共治的新使命。所有人都相信，在年轻而开明的天子带领下，一个真正的新时代即将开启！"
mingcivwar.1002.a:0 "大明万岁！"
mingcivwar.1003.t:0 "庆王统一大明"
mingcivwar.1003.d:0 "这场席卷大明帝国的内战胜负已分，最终执掌天下的权柄，竟归属一向被视为边陲之地的西北都督府——然而这一切并非“秦中自古帝王州”的宿命之谈，而是西北军以铮铮铁骨、满腔热血和不畏死的决心，一寸山河一寸血，硬生生打出来的胜利！\n如今烽火暂熄，硝烟渐散，战争留下的疮痍正在缓慢愈合，但我们深知，需要修复的远不止被战争破坏的城垣房舍、田畴道路，更是长久以来异端邪说如野草般蔓延，侵蚀人心，以致世风日下，道德不古。周公制礼作乐，颁度量，而天下大服，要治理好这个庞大的国家，更要整顿那些伤风败俗人心不古的社会现状。\n这绝非一朝一夕可成之功，更非仅靠律令条文所能奏效。所幸，我们有忠诚敢战之军为天下垂范！军队肃然，则民心可望；风教既行，则天下可！\n致君尧舜上，再使风俗淳！"
mingcivwar.1003.a:0 "大明万岁!"
mingcivwar.1004.t:0 "红军统一中国"
mingcivwar.1004.d:0 "硝烟渐息，红军在几方势力激烈的角逐中取得了最后的胜利。一个崭新的国家，一种前所未有的政体，在经历了漫长而残酷的斗争后，终于出现在了这片古老的土地上！\n但这不是革命的结束，这只是革命的一个阶段，雄关漫道真如铁，而今迈步从头越！在取得全国性的胜利后，同产工会的征程仍旧没有结束更不会停止。被剥削被压迫的阶级（无产阶级），如果不同时使整个社会一劳永逸地摆脱一切剥削、压迫以及阶级差别和阶级斗争，就不能使自己从进行剥削和统治的那个阶级（资产阶级）的奴役下解放出来。\n要善于打碎一个旧世界，更要善于建设一个新世界，同产工会未来的任务艰巨而重大，前路也只能通过自己的实践不断摸索。但他们相信，将来的环球，必是赤旗的世界！\n全世界无产者联合起来！"
mingcivwar.1004.a:0 "革命万岁！"
mingcivwar.1005.t:0 "大同主义统一中国"
mingcivwar.1005.d:0 "共和军赢得了最终胜利，在大同会的引领下，这个国家实现了重新统一。在这片刚被战火洗礼的古老土地上，共和国——一个崭新而前所未有的政体，正如一颗深埋的古莲种子，承载着千年文明的积淀，以顽强的生命力与青春的朝气，破土绽放。\n这远非终点，而是迈向大同社会的第一步。年轻的共和国即将面临更为严峻的考验：比如如何建设这个国家，又比如，如何强化自身建设。然而，他们终究踏出了这一步——在无数同志与先烈的牺牲奠基之下，他们终于完成了这漫长征程中最为微小、却也最为关键的一步。如今，他们有了机会将理想照进现实，让大同的理念生根发芽，遍植于每一个华夏子孙的内心。\n推翻腐朽的大明，只是顺应历史车轮的必然；而今后，他们将用自己的行动书写历史的方向！共和的种子已然苏醒，必将以不可阻挡之势，破浪擎天！"
mingcivwar.1005.a:0 "共和万岁！"










mingcivwar.666.t:0 "[Get_title_news_header]大明太子遇刺[Get_title_news_pic]"
mingcivwar.666.d:0 "在一次例行的外出游行中，太子乘坐的敞篷车在周王府御街停下，太子本人站起来向民众挥手致敬时一个刺客快速冲出人群用中文高喊：“这是为了虾夷的同志们！去死吧刽子手！”随即对太子连开三枪，太子胸部中两枪，在急救车到来前因失血过多及窒息死在了随从怀中。年迈的皇帝听闻太子遇刺痛哭流涕，身体情况愈发恶化"
mingcivwar.666.a:0 "吾皇万岁万岁万万岁"
mingcivwar.666.b:0 "大明太子死了，那今天的晚饭吃什么呢"

