l_simp_chinese:
LOADING_TIP_0: "对于我们来说，生活中必须有，也应该有某种人生信仰，它偶尔用一句话、一场梦、一种表情或一个事件向我们传递一种令人振奋的消息。\n--蒙哥马利"
LOADING_TIP_1: "半蟾临渭滨，碧落映长星。谶纬犹惝恍，参商若鹡鸰。\n--《夏夜有感》朱眷深"
LOADING_TIP_2: "劳动者的组织性、纪律性、坚毅精神以及同全世界劳动者的团结一致，是取得最后胜利的保证。\n--列宁"
LOADING_TIP_3: "我过去和现在都看到，几乎所有的工人都在受苦。这种痛苦引起我心中的共鸣，使我排除一切阻碍而和工人们一起，为了他们的解放而斗争……\n--菲利克斯·捷尔任斯基"
LOADING_TIP_4: "不管一切如何，你仍然要平静和愉快。生活就是这样，我们也必须对待生活，要勇敢、无畏、含着笑容地--不管一切如何。\n--罗莎·卢森堡"
LOADING_TIP_5: "你们知道，什么是我的力量所在吗？那就是我从不顾惜自己，我坚信我做的一切是正确的，我愿为我的事业献身。\n--捷尔任斯基"
LOADING_TIP_6: "要么获得完全独立、要么彻底走向死亡，这应该成为渴望解放之人不可放弃的理念。\n--穆斯塔法.凯末尔"
LOADING_TIP_7: "一个国家无论多富裕，若其不完全独立的话，这样他们在文明世界的人眼里最多也就是一个仆人的地位。\n--穆斯塔法.凯末尔"
LOADING_TIP_8: "当我们迷茫，不知道何事可为，此时此刻，去妄即真。当我们迷茫，不知道何处可去。此时此刻，真正的旅行刚刚启程。\n--纳齐姆.希克梅特"
LOADING_TIP_9: "生命诚可贵，爱情价更高，若为自由故，两者皆可抛。\n--裴多菲"
LOADING_TIP_10: "自由是自治之基础，而公正与爱国则是自由的根本。\n--科苏特·拉约什"
LOADING_TIP_11: "车辚辚，马萧萧，行人弓箭各在腰。\n耶娘妻子走相送，尘埃不见咸阳桥。\n--杜甫《兵车行》"
LOADING_TIP_12: "天下兴亡，匹夫有责\n--顾炎武"
LOADING_TIP_13: "为天地立心，为生民立命，为往圣继绝学，为万世开太平\n--张载"
LOADING_TIP_14: "只要再多走一小步，仿佛是向同一方向迈的一小步，真理便会变成错误。\n--列宁"
LOADING_TIP_15: "要有耐心和勇气，我们还要活下去，我们还要经历惊天动地的事呢\n--罗莎·卢森堡"
LOADING_TIP_16: "人命？浅川根本就没拿你们当人！\n--小林多喜二《蟹工船》"
LOADING_TIP_17: "存者且偷生，死者长已矣！\n--《石壕吏》杜甫"
LOADING_TIP_18: "滋尔多士，为民前锋，以建共和，以进大同。\n--黄兴（tod）"
LOADING_TIP_19: "大同主义，其本质在于消灭阶级差异，而非弥合阶级斗争。\n--董必武（tod）"
LOADING_TIP_20: "总为浮云能蔽日，长安不见使人愁。\n--李白"
LOADING_TIP_21: "封侯非我意，但愿海波平\n--戚继光"
LOADING_TIP_22: "砍头不要紧，只要主义真，杀了夏明翰，还有后来人\n--夏明翰"
LOADING_TIP_23: "天下为公会有期\n--柳亚子"
LOADING_TIP_24: "革命尚未成功，同志仍需努力\n--孙文"
LOADING_TIP_25: "天变不足畏，祖宗不足法，人言不足恤\n--王安石"
LOADING_TIP_26: "故常以为二千年来之政，秦政也，皆大盗也；二千年来之学，荀学也，皆乡愿也。惟大盗利用乡愿，惟乡愿工媚大盗，二者交相资，而罔不托之于孔。执托者之大盗乡愿而责所托之孔，又乌能知孔哉！\n--谭嗣同"
LOADING_TIP_27: "问渠那得清如许，为有源头活水来\n--朱熹"
LOADING_TIP_28: "壮志饥餐胡虏肉，笑谈渴饮匈奴血\n--岳飞"
LOADING_TIP_29: "苟利国家生死以，岂因祸福避趋之。\n--林则徐"
LOADING_TIP_30: "同产主义的红旗在全中国在全东方在全世界遍插起来！\n--邓中夏（tod)"
LOADING_TIP_31: "中国一日不得自由独立，我们的责任未尽，就是说，我们的奋斗不停止。\n--邓中夏"
LOADING_TIP_32: "整军有待赴京日， 重振朝纲江山固\n--李自成"
LOADING_TIP_33: "人类一切努力的目的在于获得幸福。\n--罗伯特·欧文"
LOADING_TIP_34: "愿公无以刍荛陶渔之见而弃忽之也。古人甚好察此言耳。\n--李贽"
LOADING_TIP_35: "循此苦旅，直抵群星。\n--拉丁谚语"
LOADING_TIP_36: "代议政体者，封建之变相。其上置贵族院，非承封建者弗为也。民主之国，虽代以元老，蜕化而形犹在。其在下院，周礼有外朝询庶民，虑非家至而人见之也。亦当选其得民者，以叩帝阍。\n--章太炎"
LOADING_TIP_37: "存者且偷生，死者长已矣！\n--《石壕吏》杜甫"
LOADING_TIP_38: "为有牺牲多壮志，敢教日月换新天。\n--毛润之"
LOADING_TIP_39: "知者不惑，仁者不忧，勇者不惧。\n--《论语·子罕》"
LOADING_TIP_40: "大陆山河若破碎，巢覆完卵难为功。\n--梁启超"
LOADING_TIP_41: "为政以德，譬如北辰，居其所而众星共之。\n--《论语·为政篇》"
LOADING_TIP_42: "硕鼠硕鼠，无食我黍！三岁贯女，莫我肯顾。逝将去女，适彼乐土。\n--《魏风·硕鼠》"  
LOADING_TIP_43: "惟贤惟德，能服于人。\n--刘备"
LOADING_TIP_44: "谁有铁拳，谁有面包\n--路易·奥古斯特·布朗基"
LOADING_TIP_45: "世界上没有任何事物，能迫使我们屈服，哪怕是毒药，哪怕是创伤，哪怕是魔鬼，哪怕是流放！\n--卡尔.李卜克内西"
LOADING_TIP_46: "社会革命的生机勃勃的原始力量不可阻挡的增长是社会发展的自然规律，对于它来说失败意味着激励。一次又一次的失败将把他们引向胜利。\n--卡尔.李卜克内西"
LOADING_TIP_47: "斯巴达克--它是无产阶级革命的火焰和精神、灵魂和心脏、意志和行动。\n--卡尔.李卜克内西"
LOADING_TIP_48: "在争取人类进步的斗争中，任何一种力量不论多么微小都是不可缺少的。\n--奥古斯特.倍倍尔"
LOADING_TIP_49: "每一个人越是热情洋溢地、富于牺牲精神地沿着已经指明的道路前进，最后的胜利就越是伟大。\n--奥古斯特.倍倍尔"
LOADING_TIP_50: "社会主义社会的本质在于大多数劳动群众不再是被统治者，而是自己的全部政治和经济生活的主人，并且在有意识的，自由的自决中领导着全部生活。\n--罗莎.卢森堡"
LOADING_TIP_51: "工人阶级的解放必须是工人阶级自己的事业。\n--罗莎.卢森堡"
LOADING_TIP_52: "万里关山睡梦中，今朝始洗眼朦胧。\n云头齐拥剑门上，峰势欲随江水东。\n楚客初来询物俗，蜀人从古足英雄。\n卧龙跃马今安在？极目天边意未穷。.\n--曾国藩"
LOADING_TIP_53: "我独自一人，不靠奇技淫巧，征服了莱茵河的建筑设计。\n--来自内莱塔尼亚林茨的建筑师"
LOADING_TIP_54: "西北有高楼，上与浮云齐。交疏结绮窗，阿阁三重阶。上有弦歌声，音响一何悲！谁能为此曲，无乃杞梁妻。\n--《古诗十九首·西北有高楼》"
LOADING_TIP_55: "宝祚延庥万国欢，景星拱极五云端。海波澄碧春辉丽，旌节花间集凤鸾。\n--明帝国国歌《皇明颂》"
LOADING_TIP_56: "人活一口气，难得拼一回。生死路一条，聚散酒一杯。\n--《浩浩乾坤》"
LOADING_TIP_57: "敌人不是骂我们“洪水猛兽”吗，我就叫“洪水”！\n--武元博"
LOADING_TIP_58: "人类的整个生命离不开三个论点：斗争产生一切，美德寓于流血之中，领袖是首要的、决定性的。\n--奥托·冯·俾斯麦"
LOADING_TIP_59: "世界上变革的最强推动力不是统治群众的科学认识，而是赋予群众以力量的狂热，有时甚至是驱赶民众向前的歇斯底里。\n--奥托·冯·俾斯麦"
LOADING_TIP_60: "金銮红旗犹可畏，不及失控顾自然，看吾生入草本界。\n--罗塔·林托恩-奥曼"
LOADING_TIP_61: "这不是一个梦想和幻想的时代，这是一个钢铁的时代，钢一般的意志和铁一般的精神将引导人们走向胜利的捷径。\n--奥斯瓦尔德·莫斯利"
LOADING_TIP_62: "近来之东西历史确为可证，以一碟奶油将老虎变为病猫乃无稽之谈。\n--顾维钧"
LOADING_TIP_63: "要想迷恋今日之法兰西，就必须痛恨她当下的模样。\n--夏尔·莫拉斯"
LOADING_TIP_64: "我知道我们周边的邻国都对建立联邦的想法愈加冷淡，但总有一天你会看到他们会为寻求避难之处而挤破脑袋。\n--米兰·霍查"
LOADING_TIP_65: "若为真理与人民，舍得一身千万剐。\n--尤柳·马纽"
LOADING_TIP_66: "上九曰：“亢龙有悔。”\n--《周易》"
LOADING_TIP_67: "子曰：“贵而无位，高而无民，贤人在下位而无辅，是以动而有悔也。”\n--《周易》"
LOADING_TIP_68: "要消灭一个民族，首先瓦解它的文化；要瓦解它的文化，首先先消灭承载它的语言；要消灭这种语言，首先先从他们的学校里下手。\n--奥托·冯·俾斯麦"
LOADING_TIP_69: "我曾和你们一同走过光辉的岁月。而在这黑暗的日子里，我也将与你们同在，寸步不离。请陪在我身旁，因为斗争尚未止息。为了法兰西！\n--菲利普·贝当"
LOADING_TIP_70: "我能奉献的无他，只有热血、辛劳、眼泪与汗水!\n--罗塔·林托恩-奥曼"
LOADING_TIP_71: "中国如今是希腊，湖南当作斯巴达，中国将为德意志，湖南当作普鲁士。诸君诸君慎如此，莫言事急空流涕。若道中华国果亡，除非湖南人尽死！\n--杨度"
LOADING_TIP_72: "此间一切庞大若荒野，群狼环伺，因而叫我们去战斗，无论男人还是女人。\n--罗塔·林托恩-奥曼"
LOADING_TIP_73: "一门百发百中的大炮抵得上一百门百发一中的大炮。\n--萨镇冰在南海海战后感慨"
LOADING_TIP_74: "年轻的国家总能打赢吗？\n--海明威"
LOADING_TIP_75: "我只要现在一路顺着水流飘下去，就能回到澳大利亚。\n--墨尔本难民"
LOADING_TIP_76: "昔我往矣，杨柳依依。今我来思，雨雪霏霏。\n行道迟迟，载渴载饥。我心伤悲，莫知我哀！\n--《小雅·采薇》"
LOADING_TIP_77: "历史是绝对无的象征的世界，在那里我们要看到世界史中中国的永远的历史！\n--《兴夏论》序言"
LOADING_TIP_78: "那美好的仗，我已经打过了；该跑的路程，我已经跑尽了\n--维多利亚女皇"
LOADING_TIP_79: "志士仁人，无求生以害仁，有杀身以成仁。\n--《孟子》"
LOADING_TIP_80: "民为重，社稷次之，君为轻\n--《孟子》"
LOADING_TIP_81: "或待民以宽厚，或致民于死地。民固因小怨而怀忌，临大仇则惴惴\n--尼科洛·马基雅维里"
LOADING_TIP_82: "神州天下之时事日渐紧迫，欧洲列强至今仍试图在中土南洋攫取自身的利益。中土是诸夏的中土，诸夏有解决自身问题的权利。\n--《泛华夏主义》"
LOADING_TIP_83: "唯女子与小人为难养也，近之则不孙，远之则怨。\n--《论语》"
LOADING_TIP_84: "民强国弱，民弱国强。故有道之国，务在弱民。\n--《商君书》"
LOADING_TIP_85: "故王者之政，使民怯于邑斗，而勇于寇战。民习以力攻难，故轻死。\n--《商君书》"
LOADING_TIP_86: "中国的盛衰兴亡不过是王朝更替而已，并没有什么稀奇的。中国自尧舜以来的主义即有着民主的精神，民主革命不过传统思想之发扬罢了。\n--《论民主》日本大同会社论"
LOADING_TIP_87: "以天下论者，必循天下之公，天下非夷狄盗逆之所可私，而抑非一姓之私也。\n--王夫之"
LOADING_TIP_88: "宪政不行，症结实在君主。望君主自发立宪束权，无异于求其割肉饲鹰，自断手脚，何其可笑？\n--刘人熙（tod)"
LOADING_TIP_89: "废除君主，力行共和，平均地权，消灭压迫！\n--激进大同党人孙文（tod)"
LOADING_TIP_90: "工作是我的一切，我生来就是为了工作。即使我身后什么也没有留下，即使我所有的业绩全部毁灭。\n-- 拿破仑·波拿巴"
LOADING_TIP_91: "理所应当之事大肆宣扬，反失去力量。化解他人之利益主张比急于追求本身利益更重要，别无他求，收益反大。\n--克莱门斯·梅特涅"
LOADING_TIP_92: "只有劳动才是价值的普遍尺度和正确尺度。\n--亚当·斯密"
LOADING_TIP_93: "文明意味着压抑，我们即需要遵从，也需要满足本能，而两者之间存在着冲突。\n--西格蒙德·弗洛伊德"
LOADING_TIP_94: "你敢姓赵，你配姓赵？\n--《阿Q正传》"
LOADING_TIP_95: "大道之行也，天下为公，选贤举能，讲信修睦\n--《礼记》"
LOADING_TIP_96: "我希望上帝宽恕我的诸多罪行，因为我是在力图为我的人民做好事\n--彼得一世"
LOADING_TIP_97: "秦之所以获罪于万世者，私已而已矣。斥秦之私，而欲私其子孙以长存，又岂天下之大公哉？\n--王夫之"
LOADING_TIP_98: "周公吐哺，天下归心\n--曹操"
LOADING_TIP_99: "居庙堂之高则忧其民；处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰：“先天下之忧而忧，后天下之乐而乐”乎。\n--范仲淹"
LOADING_TIP_100: "我们没有选择，我们只能等待。\n--《大宪章》"
LOADING_TIP_101: "勤尊君王，攘斥外夷。\n--尊皇攘夷社"
LOADING_TIP_102: "战争并非为军人之名誉心而战，亦非为资本家之利益而战，实为尊王攘夷论之国民精神所推动。\n--尊皇攘夷社"
LOADING_TIP_103: "不承继个人主义的进化即无民主社会主义，不承继帝国主义的进化即无世界性的大同主义。\n--尊皇攘夷社"
LOADING_TIP_104: "如果这(解放被西洋压迫之民族)也是侵略主义、军国主义的话，帝国应当在全世界无产阶级的欢呼声里将其作为黄金之冠戴在头上加冕。\n--尊皇攘夷社"
LOADING_TIP_105: "仓廪实而知礼节，衣食足而知荣辱。\n--《管子·牧民》"
LOADING_TIP_106: "思想本身没有丝毫危险的性质，只有愚暗与虚伪是顶危险的东西，只有禁止思想是顶危险的行为。\n--李大钊"
LOADING_TIP_107: "争你们个人的自由，便是为国家争自由！争你们自己的人格，便是为国家争人格！自由平等的国家不是一群奴才建造得起来的！\n--胡适"
LOADING_TIP_108: "我们爱的是人民拿出爱国心抵抗被人压迫的国家，不是政府利用人民爱国心压迫别人的国家。我们爱的是国家为人民谋幸福的国家，不是人民为国家做牺牲的国家。\n--陈独秀"
LOADING_TIP_109: "圣人之为治法也，随时而变义，时移而法亦移.\n--康有为"
LOADING_TIP_110: "古者以天下为主，君为客；凡君之所毕世而经营者，为天下也。今也以君为主，天下为客；凡天下之无地而得安宁者，为君也。\n--黄宗羲"
LOADING_TIP_111: "我向来是支持大同主义的，工农当然可以起义，我们也可以武力镇压嘛。\n--某西南土司（TOD）"
LOADING_TIP_112: "如果我是底层工农，我当然会支持起义，但我作为帝国官员，我只能动刀了。\n--某西南土司(TOD)"






