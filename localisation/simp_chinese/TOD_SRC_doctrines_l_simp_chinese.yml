 SUBDOCTRINE_SRC_REVOLUTIONARY_MANEUVER:0 "革命机动作战"
 SUBDOCTRINE_SRC_REVOLUTIONARY_MANEUVER_DESC:0 "革命军的机动不是单纯的行军速度，而是组织方式。分散发动、迅速集中、瓦解敌军和连续转移构成了红军争夺战役主动权的基本循环。"
