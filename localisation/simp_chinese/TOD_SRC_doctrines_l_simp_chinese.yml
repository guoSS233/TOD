 SUBDOCTRINE_SRC_PEOPLE_ARSENAL_SUPPORT:0 "人民兵工与野战支援"
 SUBDOCTRINE_SRC_PEOPLE_ARSENAL_SUPPORT_DESC:0 "根据地的军工条件无法同旧帝国的兵工厂相比，但工厂委员会、修械所、缴获武器、工兵作业和野战转运体系能让有限的火力被持续投入关键方向，并帮助正规红军在复杂地形中保持推进能力。"
