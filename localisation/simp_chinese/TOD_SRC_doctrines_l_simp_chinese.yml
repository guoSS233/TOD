 SUBDOCTRINE_SRC_RED_MOBILE_COLUMNS:0 "红军机动支队"
 SUBDOCTRINE_SRC_RED_MOBILE_COLUMNS_DESC:0 "红军暂时无法依赖庞大的装甲集群，但侦察骑兵、缴获战车和摩托化小队足以承担穿插、追击和局部突破任务。它们不是独立的钢铁洪流，而是步兵战役的尖刀。"
