 GRAND_DOCTRINE_SRC_REVOLUTIONARY_WARFARE:0 "工农红军革命战争"
 GRAND_DOCTRINE_SRC_REVOLUTIONARY_WARFARE_DESC:0 "革命战争理论并非旧式军队条令的简单改写，而是东北红军在根据地斗争、工农武装和正规化建设之间摸索出的作战体系。它要求军队扎根群众，以政治工作维持士气和纪律，以兵工修械、战地转运和地方组织弥补补给不足，并在敌强我弱的条件下灵活运用分散发动、连续机动、敌军瓦解与集中突击。红军不追求单纯的阵地消耗，而是通过组织力、主动权和战役节奏把局部胜利积累为革命战争的全局优势。"

 SUBDOCTRINE_SRC_RED_ARMY_ORGANIZATION:0 "工农红军组织法"
 SUBDOCTRINE_SRC_RED_ARMY_ORGANIZATION_DESC:0 "东北红军不能照搬旧军队的营房制度。它必须从工人纠察队、投诚部队和前线骨干中生长出新的组织方式，让政治可靠性、战斗经验和基层主动性共同支撑一支真正的革命军队。"
