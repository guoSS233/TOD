l_simp_chinese:
 ROC_allied_parties_category:0 "革命友党合作"
 ROC_allied_parties_category_desc:0 "工会、农会与工商组织可参与生产、互助和信用协商；中央预算与经济路线由部长统筹三派议定。"
 ROC_allied_project_busy_tt:0 "当前没有正在实施的革命友党合作项目。"
 ROC_allied_meeting_consultation_tt:0 "协商使革委会左翼与右翼激进度各下降2个百分点。"
 ROC_allied_worker_coordination:0 "工人协同生产"
 ROC_allied_worker_coordination_end_tt:0 "公有方向待落实+3；左派好感+12、右派−4；合作成果另使左、右派各+5，中派+1。"
 ROC_allied_worker_coordination_desc:0 "工会代表要求参与排产，厂方担心责任不清；双方就生产安排展开协商。"
 ROC_allied_rural_cooperation:0 "农村互助试点"
 ROC_allied_rural_cooperation_end_tt:0 "公有方向待落实+2；左派好感+12、右派−4；合作成果另使左、右派各+5，中派+1。"
 ROC_allied_rural_cooperation_desc:0 "农会提出水利与互助需求，县乡核实土地和人手，再讨论优先修渠还是组织互助。"
 ROC_allied_labor_arbitration:0 "劳资仲裁规则"
 ROC_allied_labor_arbitration_end_tt:0 "大同党左、右派好感各+5，中派+1。"
 ROC_allied_labor_arbitration_desc:0 "工人代表要求保障条款落实，企业担忧仲裁成本；劳资双方共同拟订适用范围与执行办法。"
 ROC_allied_parties_meeting_desc:0 "广州会议汇集工会、农会、劳资双方与商会代表，分别讨论生产协作、农村互助、仲裁规则与工商信用；中央预算和经济路线由部长召集三派协商。"
 ROC_allied_parties_meeting_workers:0 "先议工人参与生产"
 ROC_allied_parties_meeting_rural:0 "先议农村互助试点"
 ROC_allied_parties_meeting_consultation:0 "先议跨党议事规则"
 ROC_allied_commercial_credit:0 "工商信用协商"
 ROC_allied_commercial_credit_desc:0 "自由大同盟与工商界商议信用、采购付款和融资，帮助小生产者缓解周转压力。"
 ROC_allied_commercial_credit_end_tt:0 "市场方向待落实−2；右派好感+8、左派−8；合作成果另使左、右派各+5，中派+1。"
