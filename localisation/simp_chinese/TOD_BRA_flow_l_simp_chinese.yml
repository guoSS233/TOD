 TOD_BRA.2001.t:0 "纳塔尔共产主义企图"
 TOD_BRA.2001.d:0 "巴西东北部纳塔尔港，一群自称“人民解放阵线”的激进分子突然占领了市政厅和无线电台，宣布建立“纳塔尔苏维埃”。他们通过广播号召工人起义。里约热内卢朝野震动。"
 TOD_BRA.2001.a:0 "该死的赤匪！"
 TOD_BRA.2002.t:0 "纳塔尔共产主义企图2"
 TOD_BRA.2002.d:0 "杜特拉将军率领联邦军队迅速包围了纳塔尔。叛军试图巷战，但在政府军的炮火和谈判攻势下，大部分暴乱分子投降。少数死硬分子逃入丛林，但已不成气候。"
 TOD_BRA.2002.a:0 "杜特拉将军成功包围了他们"
 TOD_BRA.2003.t:0 "波帕扬会议"
 TOD_BRA.2003.d:0 "埃塞奎博危机的阴影尚未散去，巴西与大哥伦比亚在考卡山谷省首府波帕扬举行高层会晤。巴西外交部长与大哥伦比亚外交部长签署《波帕扬协定》，正式确立两国“战略伙伴关系”。\n\n协定核心内容：双方承诺在对方遭受第三方军事攻击时提供支持，开放军事基地供对方使用，协调对泛道山联盟的政策立场，并推动两国经济一体化。巴西和哥伦比亚的关系源远流长，但在过去几十年间，因巴拉圭战争中的立场分歧以及各自内部问题，两国关系始终未能真正走近。如今，面对泛道山联盟的迅速扩张，巴西与哥伦比亚感到前所未有的战略压力。\n\n波帕扬会议在极其低调的氛围中召开，但与会者的级别暴露了其重要性。消息泄露后，布宜诺斯艾利斯的流亡报纸以“南美自由的新希望”为标题报道此事，而岭兰府的官方媒体则保持了谨慎的沉默。"
 TOD_BRA.2003.a:0 "哥伦比亚与巴西将站在一起"
 TOD_BRA.2004.t:0 "哥伦比亚-巴西对南华自由邦宣战"
 TOD_BRA.2004.d:0 "波帕扬会议结束两个月后，巴西与大哥伦比亚的联合军事行动正式拉开序幕。1940年2月14日，巴西以“南华自由邦庇护危害巴西稳定的势力”为名，大哥伦比亚以“历史权利”为由，两国同时向南华自由邦宣战。\n\n埃塞奎博地区争端由此升级为区域性战争。南华自由邦无力单独抵抗两个强国的联合进攻，其武装力量仅有数千人，缺乏重型装备。唯一的希望在于泛道山联盟的反应，但此时大明帝国内战已全面爆发，天朝体系名存实亡，泛道山联盟能否跨越整个南美洲去支援一个尚未正式加入联盟的半华人邦国，仍然是一个巨大的问号。"
 TOD_BRA.2004.a:0 "速战速决"