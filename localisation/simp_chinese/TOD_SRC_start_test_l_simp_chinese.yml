 TOD_SRC_start_test_category:0 "东北红军：开局测试"
 TOD_SRC_start_test_category_desc:0 "在大明开局选择一种事件组合，立即生成关东招抚司和东北红军，并切换为东北红军。每局只能选择一次；测试另一组合请重新开局。红军最初已有辽北，两种起义成功分支最终均拥有七州。无需开启调试模式。"
 TOD_SRC_start_test_captured_suppressed:0 "攻克沈阳＋镇压起义（5州）"
 TOD_SRC_start_test_captured_suppressed_desc:0 "立即切换到东北红军。领土：辽西、辽中、辽南、辽北、通辽。部队、国策和起义结果沿用对应事件效果。每局只能选择一次。"
 TOD_SRC_start_test_captured_suppressed_tooltip:0 "生成关东招抚司及东北红军，红军获得辽西、辽中、辽南、辽北、通辽，并切换为东北红军。"
