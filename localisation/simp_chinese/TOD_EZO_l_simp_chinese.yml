EZO_OYANG_LIYUAN:0 "欧阳立袁"
EZO_OYANG_LIYUAN_desc_leader:0 "欧阳立袁，至和十九年（西历1886年）出生于湖南浏阳一个书香门第。昌德十八年（1905年），16岁的他以湖南第一名考入燕京大学堂经济院，并在三年内修完了全部课程。毕业后，他在旁人艳羡的目光中被破格推荐进入财政部，开始自己的官场生活。\n然而，顺天的官场如潜龙之渊，即使是出众如他也没在这里面混个明白。昌德二十七年（1914年），他自求外派，登上了前往函馆的轮船。彼时的霞仪主政者徐宝山是行伍出身，整个政府班子也缺乏专业人才，整个霞仪处于高度繁荣和高度混乱并存的尴尬状态。作为为数不多懂得经济的官员，他在霞仪找回了属于自己的节奏，在得到徐宝山的赏识后平步青云。六年后，他挤掉竞争对手，成为霞仪统制国财户厅厅长。此后，随着徐宝山的健康状况一天天恶化，他开始逐步接手整个统制国的治理。\n1926年底，徐宝山因风寒染疾逝世，年仅四十岁的欧阳立袁通过评议会选举继任统制国统制。作为徐宝山政治上的门生，他延续了自己老上司的风格，选择垂拱而治，对经济活动减少了干预，鼓吹自由放任和自由竞争。而霞仪统制国的经济繁荣也似乎看不到头——雄心勃勃的他甚至有了多余的钱财，推进全民福利计划来赎买更多国民的支持。\n然而,经济危机让这一切都化为泡影。作为独立性最低的统制国，霞仪根本无力招架，仅仅勉强维持了社会稳定。激进力量的不断发展和海军越来越大的不满让他焦头烂额，但这一次，可能再没有一个坚强的军人顶在前面帮助他渡过难关了。"
