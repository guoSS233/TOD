 ROC_central_economy.6.c_tt:0 "问责压力+15、右派好感−15；有在建工程时暂停14日。"

 ROC_central_economy.7.t:0 "部长席前的五份履历"
 ROC_central_economy.7.desc:0 "辞呈已经生效，秘书处把五份履历按姓氏排好，放在部长席前。每一份都用同样的红头纸、同样的楷体，只在“擅长事项”那一栏各写各的：合作社信用与城乡采购、乡村调查与技术推广、统一账目与公共投资审计、工会协商与生产协定、自耕农与民间投资。五个人都愿意接这份差事，也都在履历背面附了同一句：“服从中央安排”。秘书处另贴了一张便条：谁先上任，谁先接管本届未完工程和履职账。\n\n会前，大同党中派代表在任命理由上补了“合作信用与农技调查”，大同党左派代表添上“公共审计和工会参与”，大同党右派代表则在旁注中坚持“私人契约与小农信贷不能空着”。三个人都把各自的政策优先写进同一张推荐表，谁也没写“指定路线”四个字；表尾的备注栏里，是秘书长用铅笔写的一行小字：任命归中央，路线归部长。推荐理由也须随同备案，不能只留人名。\n\n新部长接手的不是一张白纸。正在施工的项目、实测进度、目标差额和本届剩余日数都留在原处，继任者要从同一份会议记录继续履职，连那份被退回的季度公报，也还压在本届施政计划下面。五份履历都能进入任命程序，也都会撞上不同的预算与权限争论；而部长来自哪条路线，并不会自动决定谈判桌上哪一方先赢。秘书处把五份履历重新码齐，等会议主席先开口。"
