 ROC_central_economy.1.t:0 "会签栏还是空的"
 ROC_central_economy.1.d:0 "财政处在会签表左侧盖满了章，右边的三格签名栏空着，像一扇没上闩的门。秘书长把表放进红头文件夹，封面印着“传阅”两个烫金字；会议主持人盯着这两个字多看了一眼，因为楼下印刷厂送来的校样上，标题排的是“中央一致支持[ROOT.ROC_ce_project_name]”。\n\n主持人问大同党中派的财政处处长，“传阅”和“批准”是不是一回事。处长不慌不忙翻出《会签办法》，用指尖点着第三条：按规程，会签栏签的是“已阅”，不是“同意”；拨款另以出纳凭证作准。也就是说，这三支笔落下去，工程未必能开工，签名的责任却已经落在纸上。处长补了一句：“这办法不是我定的，我只是照办。”\n\n大同党右派代表把承包条款压在价格上限那一页上，语气像替别人着想：“既然只是传阅，就把承包条款和价格上限一并传下去，省得回头再补签。”大同党左派代表没碰那页，只把工资核算单推到正中：“传阅可以，工人查账的席位也请一并传。”两个人各说各的，都催主持人先把文件传起来；监督席要席位，拨款要凭证，会签还要每派认自己的责任。\n\n秘书长把校样和《会签办法》并排摆在主持人面前，问是先按“支持”印发，还是先把监督席和拨款凭证补齐。主持人把三支笔搁在文件夹上，没有立即作答。油印机还在吐纸，送来的校样上，标题比空着的签名栏响亮得多。"
