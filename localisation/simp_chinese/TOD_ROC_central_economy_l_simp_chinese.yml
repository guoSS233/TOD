 ROC_central_economy.5.c_tt:0 "部长辞职并触发继任任命；现有工程进度与本届剩余任期由继任者承接。"

 ROC_central_economy.6.t:0 "摘要上的“已经完成”"
 ROC_central_economy.6.d:0 "阶段摘要见报一个月，报纸仍把那项工程印成“已经完成”。审计员带着现场照片和送货单走进经济部会议室：照片里设备还裹着防水布，签收单写的是“材料已到”，摘要上的栏目却叫“工程已交付”。三张纸摆在一起，连秘书长也找不到一句话能把它们说成同一件事。补正通知送到经办处，签收栏却一连空着。\n\n大同党右派代表先把原始账册摊开，要求公开摘要的每一处删节。曾经替这份口径说过话的大同党中派代表没有坐下，只站在门边问，谁批准把“收到”改成“完成”；他把自己上周签过的说明抽走，交给秘书长收回档案。经办员说自己只按秘书处模板填表，秘书处说模板照着部长办公室的摘要做。支持过这份声明的人，正一个接一个把自己的名字从页边划掉。\n\n审计员把送货单交给会议主持人，上面的日期早于任何一次现场验收。大同党左派代表没要求处分谁，只问工资和安全记录为什么也被塞进同一页宣传摘要。报社记者在走廊等一份更正稿，印刷车已经停在院门外；记者隔着玻璃递来截稿通知，标题栏还空着一整块。更正需要另拨协调经费；把口径推给经办人，工人不会因此认下那份摘要。秘书长抽出一张空白校样，把照片和账册分别压住两角，问主持人：今晚读者看到的，是旧标题，还是更正稿？署名写办公室，还是写您？"
