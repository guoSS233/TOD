 ROC_ce_policy_queues_tt:0 "部长办法与通用政策分别记账。部长待落实：[?ROC_ma_policy_pending|+0]；通用待落实：[?ROC_ce_policy_pending|+0]。采用另一位部长的施政办法时，会撤下前任未落实的部长安排；同一部长重复选择不累加。通用政策、已落实经济轴和工程进度保留。每月最多落实一点，部长办法优先，之后处理通用政策。晏阳初的混合经济回调取决于当前已落实结构。"
