l_simp_chinese:
 ROC_economic_administration:0 "中央经济施政"
 ROC_economic_administration_desc:0 "部长管理预算、工程与任期；大同党左、中、右派协商影响经济施政，革命委员会各派议程也会推动或拖延部长。委员会议程另见革命委员会分类。"

 ROC_ce_industry_project:0 "筹办实业"
 ROC_ce_industry_project_desc:0 "城里订单催着机器厂扩产，设备却跟不上。筹办实业要补的是机床与工位，把厂房和账目都立起来，竣工后能接的订单才算有着落，机器转起来才算开工。"
 ROC_ce_agriculture_project:0 "兴修农田"
 ROC_ce_agriculture_project_desc:0 "各县的灌渠年久失修，旱涝都只能看天吃饭。兴修农田先把水引到地里，田埂修稳、渠道疏通，农民心里才落得下这一季的指望，工程修好才算数。"
 ROC_ce_transport_project:0 "疏通商路"
 ROC_ce_transport_project_desc:0 "县际的商路时通时断，粮、货、工人都堵在半道上。疏通商路先把桥和路修利索，货走得动，账和人才走得动，修路的钱不能只花在报喜上。"
 ROC_ce_budget_negotiation:0 "中央预算协商"
 ROC_ce_budget_negotiation_desc:0 "新拨款挤了公共服务的预算。左派要民生项目先保，中派要照已许的诺拨付；部长得跟两边谈出个缓压的办法，谁都别想一毛不拔地过关。"
 ROC_ce_personnel_negotiation:0 "中央人事协商"
 ROC_ce_personnel_negotiation_desc:0 "工会要在施工核账里占个座，部门主管怕出了事没人背锅。部长得跟左派把人选和交接责任谈妥，谁签字谁担责，先得写明白，别出了岔子推给旁人。"
 ROC_ce_policy_negotiation:0 "中央路线协商"
 ROC_ce_policy_negotiation_desc:0 "旧采购规程把公营订单和民间供货混在一张表里。三派围着审批的边界重新划线，右派要经营的空间，左派要公费采购笔笔可追，部长得把线画得两边都肯认。"
 ROC_ce_project_available_tt:0 "部长任期有效、施政已启动且无待处理会议、继任安排或在建项目，并有符合条件的核心州，方可开工。"
