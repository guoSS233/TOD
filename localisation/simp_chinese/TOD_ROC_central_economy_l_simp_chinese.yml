 ROC_central_economy.5.a_tt:0 "花费25政治点数；问责压力−20、左派与右派好感各+10；有在建工程时暂停7日。"
 ROC_central_economy.5.b:0 "以一次支出换取缓议"
 ROC_central_economy.5.b_tt:0 "花费40政治点数；本届仅一次跳过下一季度问责，不清除目标差额或实绩债务；问责压力−15。"
