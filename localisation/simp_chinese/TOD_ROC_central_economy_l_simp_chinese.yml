 ROC_ce_structure_tiers_tt:0 "经济结构轴：负值为市场化，正值为公有化；轴值在-25至+25之间（含边界）为混合档。\n市场化一档（轴值低于-25且不低于-50）：建造速度+5%、地方资源+3%、研究速度+2%。\n市场化二档（轴值低于-50且不低于-75）：建造速度+8%、地方资源+5%、研究速度+4%、战争支持系数-3%。\n市场化三档（轴值低于-75（最低-100））：建造速度+12%、地方资源+8%、研究速度+6%、战争支持系数-6%；地区建设决议施工时长×1.5。\n混合档（轴值在-25至+25之间，含边界）：稳定度系数+3%、政治点数获取系数+5%。\n公有化一档（轴值高于+25且不超过+50）：军工产出+5%。\n公有化二档（轴值高于+50且不超过+75）：军工产出+8%、生产效率上限+3%、效率增长+3%、稳定度系数-3%。\n公有化三档（轴值高于+75（最高+100））：军工产出+12%、生产效率上限+5%、效率增长+5%、稳定度系数-6%；地区建设决议政治点数花费×1.5。地区建设倍率不影响中央统筹工程速度或成本。"
