 ROC_central_economy.2.t:0 "请柬与工地之间"
 ROC_central_economy.2.d:0 "开工伊始，宣传部送来一沓典礼请柬，受邀名单头一栏写着经济部，席卡上的姓名却空着，落款是未经经济部确认的宣传组。翻到附页，工程期限、受益人数和“完工后开放参观”都已排好，像一桌没等客人落座就端上来的菜。后台的布景板，也早把[ROOT.ROC_ce_project_name]排成了中央施政的样板。\n\n经济部秘书从信封底抽出那张被订书钉压住的技术附件，纸角一撕，最要紧的工期说明正好被钉孔穿过，缺了半行字。附件上写“预计进场”的设备，在新闻稿里已经成了“已经交付”；宣传部主任解释，记者只带得走一页摘要，细则太长会耽误版面。秘书问他，缺的那半行字，是谁决定不用补的。\n\n大同党左派代表指着请柬问，工资与安全条款会不会也上台念；主任答不上来，因为合同副本还在财政处没取回，工地上的工头还等着批来的协调款，工时册也夹在那叠文件里。大同党右派代表把附件逐行核对，只说“交付”和“进场”差着日子，差一天，报纸上就多一天冤枉账。两个人要经济部在台上先替哪一页作保，各不相让。大同党中派把党纲夹进预算单，要求核清用途再定口径；秘书长提醒，这也得占用工期。\n\n报馆记者已在门外备好纸笔，主持人的话序也排妥。秘书拿着两张纸站在幕布边——一张写着“已经交付”，一张写着“预计进场”。催场的隔着布景小声喊：照哪张念？厅里主持人试话筒的声音已经传过来。"
 ROC_central_economy.2.a:0 "为已印的承诺拨协调款"
 ROC_central_economy.2.a_tt:0 "花费15政治点数；左派好感+15。"
 ROC_central_economy.2.b:0 "先按党纲核对用途"
 ROC_central_economy.2.b_tt:0 "有在建工程时暂停7日；中派好感+15、右派好感−5。"
 ROC_central_economy.2.c:0 "只按到场的实物进度发布"
 ROC_central_economy.2.c_tt:0 "右派好感+10、中派好感−5。"

 ROC_central_economy.3.t:0 "同一台设备，三个日子"
 ROC_central_economy.3.d:0 "工程处按安装完成计日子，财政处按付款凭证计日子，秘书处要发的联合声明，则把发布日期直接当成竣工日。三套口径都盖着公章，也都能在各自的表格里找到一行依据。经济部会议主持人把[ROOT.ROC_ce_project_name]的清单铺开，同一批设备在第一本册子里是“已安装”，在第二本里是“待核销”，在第三本里已经变成“服务开始”。三本并排，像三份互不相识的文件，却写的是同一件事。\n\n工程师把几张沾泥的验收单递过来，解释有的部件已经固定却没接通，有的付款已批、货还压在仓库；现场和账本之间，隔着一段谁也没写清楚的时间。秘书长翻出上周的收件簿，经济部在末页盖过“收到材料”的章，秘书处却把这枚章当成了联合声明的署名依据。墨迹没变，文件的用途一夜之间变了样。\n\n大同党右派代表带来一份独立测量草案，主张尚未试运行的部分就留在“未完成”栏，谁也别替机器说它已经转起来。大同党左派代表要先把工资与安全相关的验收记录公开，说没有那一页，任何竣工日都是写给报馆看的。两个人争的其实不是那几台设备，而是这张声明该叫“现场实况”，还是该叫“公文摘要”。大同党中派则希望先发阶段摘要，让中央对外有一份统一说法，再把查出的差异补进附注。\n\n印刷机在隔壁空转。主持人把红笔横放在实测清单与声明之间，要秘书处先标出三种日期各自的来源。秘书长翻到一页空白纪要，问：标题要不要先撤下来？"
 ROC_central_economy.3.a:0 "独立实测后再签声明"
 ROC_central_economy.3.a_tt:0 "右派好感+15、问责压力−8；尚无验收规则时，有在建工程则暂停7日。"
 ROC_central_economy.3.b:0 "先把交付物列进阶段摘要"
 ROC_central_economy.3.b_tt:0 "不增加实绩或工程实测；30日后启动查核；中派好感+10、问责压力+5。"
 ROC_central_economy.3.c:0 "按实物口径复核"
 ROC_central_economy.3.c_tt:0 "未来90日施工速度−0.15/日；左派好感+8、右派好感−10。"

 ROC_central_economy.4.t:0 "从柜底回来的旧约"
 ROC_central_economy.4.d:0 "财政处盘点旧档案，文件柜最底一层掉出一份碳纸复写本，纸边发黄，印泥却还辨得清。大同党右派代表认出那是上一轮预算协定，页脚有前任经济部长的签名，旁边一行手写批注：若新工程挤占原拨款，须先向中央说明改期理由。而在档案目录里，这份协定早被登记成“副本遗失”。\n\n会议主持人翻到背面，监察席位、支付日期、复核责任一条条写得清清楚楚，唯独没写钱不够时哪一项可以延期。秘书长去查目录，登记“遗失”的那位经办人已经调离，只留下一句批注：“原件在，副本缺。”主持人问，原件既然在，副本怎么会缺；没有人接话，只有档案柜的门轻轻晃了一下。\n\n大同党右派代表没有提高声音，只问拨款顺序为什么变了，签约时承诺的公开期限却没人改；大同党左派代表随后进门，带来公共服务部门的采购清单，说旧约有签字不假，可若所有款项都按旧顺序先付，新的保障计划就只能停在纸面。大同党中派代表把两份文件并排放平，说不先替谁，先把改期权限厘清。三个人把同一张预算表推向主持人，手指停在不同的栏位。\n\n账上并没有一笔可以凭空挪出的余款。主持人把复写本压在新预算的红封面上，透出另一页签字的影子。秘书长提醒，公开承诺一旦改期，往后的中央协商都会先问这次改了什么、由谁批准。电话在窗边接连响起，催的都是拨款何时落地。主持人取出印章，在新预算上方停了片刻，没有落下去；秘书长问，今天按旧日期办，还是把改期的名字写进记录？"
 ROC_central_economy.4.a:0 "按旧协定先兑拨款"
 ROC_central_economy.4.a_tt:0 "花费25政治点数；右派好感+15、左派−5，问责压力−5。"
 ROC_central_economy.4.b:0 "重排中央预算优先次序"
 ROC_central_economy.4.b_tt:0 "有在建工程时暂停10日；左派好感+25、右派−15。"
 ROC_central_economy.4.c:0 "旧约暂存，五日后议"
 ROC_central_economy.4.c_tt:0 "有在建工程时暂停5日；中派、右派好感各−10，问责压力+10。"

 ROC_central_economy.5.t:0 "连着被退回的季度公报"
 ROC_central_economy.5.d:0 "两份季度公报被连着退回，红笔圈出的空栏一页多过一页。秘书长把退回的公报压在本届施政计划上，开会时，桌边已经坐着大同党中派代表和大同党左派代表。他们没有争下一笔预算该归谁，而是各自带来一份责任清单；两份清单的签字栏几乎都空着，却都用铅笔在旁边标着“请部长办公室确认”。\n\n财政官员说付款按经济部批示拨出，工程处说设备采购按财政核定执行，主管部门则称验收日期由经济部在会议上确认。每个人都递上一封旧公函，证明自己早提醒过风险。会议主持人逐页看过去：提醒写得都很充分，措辞客气，日期齐全，唯独没有一句写清该由谁处理这些提醒。提醒的是风险，处理风险的人，却从未在任何一页上被指定过。\n\n大同党右派代表把一份风险清单放到桌边，要求把合同责任写进纪要；大同党左派代表翻开工资清册，说工人不该替部门间的推诿承担延期。秘书长没有催谁签字，只从公文夹里取出一页尚未填写的辞呈格式，又在旁边摆上一张新的责任表——一张供任职者提出辞职，另一张要求每个部门写明负责人和期限。两张纸都留着签名栏。整改要另拨款，若有在建工程还得暂缓施工；缓议只推迟下一次问责，欠下的实绩仍在账上。秘书把笔帽拔下，放在两份文件之间，轻声问：这两份，都先留在桌上吗？主持人仍等各部门表态，电话铃在门外又响了一回。"
