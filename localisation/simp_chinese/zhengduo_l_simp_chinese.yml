zhengduo.1.t:0 "两淮争夺：开始"
zhengduo.1.d:0 "两淮地区处于南北交通的要道之上，尽管随着淮河夺淮之后逐渐衰落，但仍旧是兵家必争之地。对于南方政权而言，正所谓收江必守淮，如果丧失两淮，那么即便坐拥长江天险也无异于待毙自守。对于北方政权而言，两淮尽丧则中原腹地大开，无险可守。\n随着顺天事变的结束，全国上下处于一片混乱之中。尽管两淮地区的军队倾向于武备系，但在传统上又受到应天地区的管控与影响，而且锦王事实上的叛逆行为也使得当地军队与政府官员犹豫不定。\n如今南北两方各自拥兵，两淮地区夹在中间也势必要做出选择。"
zhengduo.1.a:0 "进击两淮！"
zhengduo.2.t:0 "两淮争夺：结束"
zhengduo.2.d:0 "经过数月的争夺，两淮地区的局部冲突终于告一段落，尽管顺天与应天政权对立的情况没有改变，但两个政权各自面临的危机也使得双方无力在该地区做出进一步的突破。\n这几个月的冲突给两淮地区的人们带来了深重的苦难，无论是野心家的野望还是卫道士的坚守，都像镰刀一样收割着无辜者的生命。\n不过显而易见的是，这次冲突的结束是未来更大规模冲突的一次预演，未来的两淮地区将燃起更大规模的战火。但无论如何，至少在现在的两淮地区重新获得了和平与宁静。"
zhengduo.2.a:0 "尘埃落定"
