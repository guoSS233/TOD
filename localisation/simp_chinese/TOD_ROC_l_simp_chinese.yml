ROC_SRC_decision_hetan_1:0 "组建联合政府"
ROC_SRC_deciosion_hetan_start_ca:0 "组建联合政府"
ROC_SRC_decision_hetan_start:0 "召开和平统一大会"
ROC_SRC_hetan_event.2.t:0 "向共和军发出邀请，召开和平统一大会"
ROC_SRC_hetan_event.2.d:0 "　　随着国内主要反动势力已基本肃清，与其它革命力量商讨和平合并、共建统一新生政府的议题被提上日程。现在应当向各革命力量发出邀请，共商国是。"
ROC_SRC_hetan_event.2.a:0 "发出邀请"
ROC_SRC_hetan_event.3.t:0 "红军发来谈判邀请"
ROC_SRC_hetan_event.3.d:0 "　　日前，红军所派外交专员已抵沈阳，其参与和平统一大会之郑重邀约，亦已正式呈递。念及先前盟约之谊，顺应全国渴求和平统一之澎湃民望，我辈自当慨然赴会，昭示立场于国民之前！"
ROC_SRC_hetan_event.3.a:0 "共商国是"
ROC_SRC_hetan_event.4.t:0 "向红军发出邀请，召开和平统一大会"
ROC_SRC_hetan_event.4.d:0 "　　日前，南方共和政府所派外交专员已抵沈阳，其参与和平统一大会之郑重邀约，亦已正式呈递。念及先前盟约之谊，顺应全国渴求和平统一之澎湃民望，我辈自当慨然赴会，昭示立场于国民之前！"
ROC_SRC_hetan_event.4.a:0 "共商国是"
ROC_SRC_hetan_event.5.t:0 "共和军发来谈判邀请"
ROC_SRC_hetan_event.5.d:0 "　　日前，南方共和政府所派外交专员已抵沈阳，其参与和平统一大会之郑重邀约，亦已正式呈递。念及先前盟约之谊，顺应全国渴求和平统一之澎湃民望，我辈自当慨然赴会，昭示立场于国民之前！"
ROC_SRC_hetan_event.5.a:0 "共商国是"
ROC_SRC_hetan_event.6.t:0 "联合政府？"
ROC_SRC_hetan_event.6.d:0 "　　和平统一、组建联合政府的第一步，首要需要解决的便是这一政府的组织原则问题——能否接受其他政治会社对政府进行权力分享？这种分享并非是其他小党那样更多处于一种“参政地位”，而是一个切实会寻求权力与席位的政治力量。放弃自身完全主导，而接受一个未来的“联合政府”，是谈判双方必须要解决的先决问题，也是一切谈判的前提。"
ROC_SRC_hetan_event.6.a:0 "革命若成，岂能在乎一党之利益？"
ROC_SRC_hetan_event.6.b:0 "我们不能把革命的未来寄托于他人之手。"
ROC_SRC_hetan_event.7.t:0 "新生革命政府委员会政府组成模式"
ROC_SRC_hetan_event.7.d:0 "　　尽管我们在建立一个联合政府的问题上已经形成了共识，但具体内部的权力分配上，我们还需要对更多细节进行划分。在未来联合政府基于“大选”形成的政府架构中，我们可以事先达成部分议案，以保证第一阶段的政府能够顺利发展。我们当然可以基于目前的势力对比而提出要求，但适度的让步，将增加我们的舆论支持。"
ROC_SRC_hetan_event.7.a:0 "一党主导、一党辅助，各党参政"
ROC_SRC_hetan_event.7.b:0 "两党合作，多党参政（偏向我方）"
ROC_SRC_hetan_event.7.c:0 "两党合作，多党参政"
ROC_SRC_hetan_event.7.e:0 "不对未来政府框架进行限制，阳光参政、公平竞选"
ROC_SRC_hetan_event.8.t:0 "[hetan_SRC_ROC_fachuguo]就“政府组织形式”向我们发出提案"
hetan_SRC_ROC_fachuguo_SRC:0 "同产工会"
hetan_SRC_ROC_fachuguo_ROC:0 "大同会"
ROC_SRC_hetan_event.8.d:0 "　　由于[hetan_SRC_ROC_fachuguo]在政治方面处于优势地位，因此其掌握了首轮提案权在政治问题上，[hetan_SRC_ROC_fachuguo]方面向我们提出了解决方案。他们希望在新政府中处于主导地位。如果我们同意这一要求，则共和国的第一届政府将由[hetan_SRC_ROC_fachuguo]主导产生。"
ROC_SRC_hetan_event.8.a:0 "同意"
ROC_SRC_hetan_event.8.b:0 "拒绝"
ROC_SRC_hetan_event.9.t:0 "[hetan_SRC_ROC_fachuguo]就“政府组织形式”向我们发出提案"
ROC_SRC_hetan_event.9.d:0 "　　在政治问题上，[hetan_SRC_ROC_fachuguo]向我们提出了解决方案。他们希望在新政府中处于优势地位。如果我们同意这一要求，则共和国的第一届政府中[hetan_SRC_ROC_fachuguo]将占据优势。"
ROC_SRC_hetan_event.9.a:0 "同意"
ROC_SRC_hetan_event.9.b:0 "拒绝"
ROC_SRC_hetan_event.10.t:0 "[hetan_SRC_ROC_fachuguo]就“政府组织形式”向我们发出提案"
ROC_SRC_hetan_event.10.d:0 "　　在政治问题上，[hetan_SRC_ROC_fachuguo]方面向我们提出方案。他们希望新政府由大同、同产两党联合执政。若接受此条件，新共和国首届政府内两党力量将呈均势格局。"
ROC_SRC_hetan_event.10.a:0 "同意"
ROC_SRC_hetan_event.10.b:0 "拒绝"
ROC_SRC_hetan_event.11.t:0 "[hetan_SRC_ROC_fachuguo]就“政府组织形式”向我们发出提案"
ROC_SRC_hetan_event.11.d:0 "　　在政治问题上，[hetan_SRC_ROC_fachuguo]方面向我们提出方案。他们希望不对未来的首届政府框架做出限制。若接受此条件，新共和国首届政府将取决于之后召开的全国大选结果。"
ROC_SRC_hetan_event.11.a:0 "同意"
ROC_SRC_hetan_event.11.b:0 "拒绝"
ROC_SRC_hetan_event.12.t:0 "地方政府"
ROC_SRC_hetan_event.12.d:0 "　　在确立了未来中央的架构之后，我们下一步需要解决的便是地方政府的问题。不论是共和军还是红军，我们双方都已然在各自的控制区内建立起了相应的政府框架。作为政治层面的劣势方，我们组织的地方政府存续时间，将是一个需要重点的问题。"
ROC_SRC_hetan_event.12.a:0 "各地地方政府将维持到首届大选的2个月之后，再行逐步解散"
ROC_SRC_hetan_event.12.b:0 "地方政府将持续1-2年，给予地方适应新生政府的时间"
ROC_SRC_hetan_event.12.c:0 "地方政府将持续3-5年，以保证革命经济制度相融合"
ROC_SRC_hetan_event.12.e:0 "鉴于我们双方都实行了三三制政府，可以在当下便尝试融合"
ROC_SRC_hetan_event.13.t:0 "[hetan_SRC_ROC_fachuguo]就“地方参政”向我们发出提案"
ROC_SRC_hetan_event.13.d:0 "　　[hetan_SRC_ROC_difangshijian]"
hetan_SRC_ROC_difangshijian_2m:0 "鉴于我们在一轮政治议案中的主导地位，地方问题的议案转由[hetan_SRC_ROC_fachuguo]进行提出。作为新生政府中的劣势方，他们希望“各地地方政府将维持到首届大选的2个月之后，再行逐步解散”。"
hetan_SRC_ROC_difangshijian_1y:0 "鉴于我们在一轮议案中的主导地位，地方问题的议案转由[hetan_SRC_ROC_fachuguo]进行提出。作为新生政府中的劣势方，他们希望“地方政府将持续1-2年，给予地方适应新生政府的时间”。"
hetan_SRC_ROC_difangshijian_3y:0 "鉴于我们在一轮议案中的主导地位，地方问题的议案转由[hetan_SRC_ROC_fachuguo]进行提出。作为新生政府中的劣势方，他们希望“地方政府将持续3-5年，以保证革命经济制度相融合”。"
hetan_SRC_ROC_difangshijian_33:0 "鉴于我们在一轮议案中的主导地位，地方问题的议案转由[hetan_SRC_ROC_fachuguo]进行提出。作为新生政府中的劣势方，他们希望“鉴于我们双方都实行了三三制政府，可以在当下便尝试融合”。"
ROC_SRC_hetan_event.13.a:0 "同意"
ROC_SRC_hetan_event.13.b:0 "拒绝"
ROC_SRC_hetan_event.14.t:0 "军队整编"
ROC_SRC_hetan_event.14.d:0 "　　在革命战争期间，革命军队的数量得到了极大的扩编。随着国内的革命战争暂时告一段落，在战后对军队缩编就成为我们必须解决的一个问题。"
ROC_SRC_hetan_event.14.a:0 "整编后，我方与对方部队比例为8：3"
ROC_SRC_hetan_event.14.b:0 "整编后，我方与对方部队比例为7：4"
ROC_SRC_hetan_event.14.c:0 "整编后，我方与对方部队比例为1：1"
ROC_SRC_hetan_event.15.t:0 "[hetan_SRC_ROC_fachuguo]向我们发出军队整编提案"
ROC_SRC_hetan_event.15.d:0 "　　在军队整编问题上，[hetan_SRC_ROC_fachuguo]方面向我们提出了解决方案。他们希望“整编后，我方与对方部队比例为[hetan_SRC_ROC_junduibili]"
hetan_SRC_ROC_junduibili_83:0 "3:8"
hetan_SRC_ROC_junduibili_74:0 "4:7"
hetan_SRC_ROC_junduibili_11:0 "1:1"
ROC_SRC_hetan_event.15.a:0 "同意"
ROC_SRC_hetan_event.15.b:0 "拒绝"
ROC_SRC_hetan_event.15.c:0 "同意"
ROC_SRC_hetan_event.15.e:0 "拒绝"
ROC_SRC_hetan_event.15.f:0 "同意"
ROC_SRC_hetan_event.16.t:0 "军队政治问题"
ROC_SRC_hetan_event.16.d:0 "　　在共和军和红军的队伍中，都设立有党的组织机构。不论政委和还是党代表，都为革命军队的建设工作起到了巨大的作用。但随着双方谈判工作深入，我们究竟该如何处理军队的政治问题？"
ROC_SRC_hetan_event.16.a:0 "军队国家化"
ROC_SRC_hetan_event.16.b:0 "解散各个军队中的党组织，统一军队的政治工作，设立统一的政治委员"
ROC_SRC_hetan_event.16.c:0 "编修统一的《军事政治》手册，统一宣传口径即可"
ROC_SRC_hetan_event.16.e:0 "事已至此，先维持局面吧"
ROC_SRC_hetan_event.17.t:0 "[hetan_SRC_ROC_fachuguo]就“军队政治问题”向我们发出提案"
ROC_SRC_hetan_event.17.d:0 "　　[hetan_SRC_ROC_junduizhengzhi]"
hetan_SRC_ROC_junduizhengzhi_guojiahua:0 "鉴于我们在一轮军事议案中的主导地位，军队政治的议案转由[hetan_SRC_ROC_fachuguo]进行提出。作为军事层面的劣势方，他们希望采取“军队国家化”的方式统合军队。"
hetan_SRC_ROC_junduizhengzhi_zhengzhiweiyuan:0 "鉴于我们在一轮军事议案中的主导地位，“军队政治”的相关议案转由[hetan_SRC_ROC_fachuguo]进行提出。作为军事层面的劣势方，他们希望采取“解散各个军队中的党组织，统一军队的政治工作，设立统一的政治委员”的方式统合军队。"
hetan_SRC_ROC_junduizhengzhi_junshishouce:0 "鉴于我们在一轮军事议案中的主导地位，“军队政治”的相关议案由[hetan_SRC_ROC_fachuguo]进行提出。作为军事层面的劣势方，他们希望采取“编修统一的《军事政治》手册，统一宣传口径”的方式统合军队。"
hetan_SRC_ROC_junduizhengzhi_weichixianzhuang:0 "鉴于我们在一轮军事议案中的主导地位，“军队政治”的相关议案转由共和军进行提出。作为军事层面的劣势方，他们希望在军队组织方面“暂时维持现状”，短时间内不要进行大规模改动。"
ROC_SRC_hetan_event.17.a:0 "同意"
ROC_SRC_hetan_event.17.b:0 "拒绝"
ROC_SRC_hetan_event.17.c:0 "同意"
ROC_SRC_hetan_event.17.e:0 "拒绝"
ROC_SRC_hetan_event.17.f:0 "同意"
ROC_SRC_hetan_event.17.g:0 "拒绝"
ROC_SRC_hetan_event.17.h:0 "同意"
ROC_SRC_hetan_event.18.t:0 "向大同社会进行过渡"
ROC_SRC_hetan_event.18.d:0 "　　大同社会是大同会与同产工会的共同目标，但在“如何向大同社会进行过渡”的核心议题上，双方仍存在不小的分歧。新生政府如何应对这一经济领域的根本性问题，是必须做出的关键抉择。"
ROC_SRC_hetan_event.18.a:0 "市场经济和私有制将继续存在较长的时间"
ROC_SRC_hetan_event.18.b:0 "市场经济和私有制将得到一段时间的保留"
ROC_SRC_hetan_event.18.c:0 "加速向计划经济和公有制过渡"
ROC_SRC_hetan_event.18.e:0 "立即着手向计划经济和公有制过渡"
ROC_SRC_hetan_event.19.t:0 "[hetan_SRC_ROC_fachuguo]就经济问题向我们发出提案"
ROC_SRC_hetan_event.19.d:0 "　　[hetan_SRC_ROC_jingjiguodu]"
ROC_SRC_hetan_event.19.a:0 "同意"
ROC_SRC_hetan_event.19.b:0 "拒绝"
ROC_SRC_hetan_event.19.c:0 "同意"
ROC_SRC_hetan_event.19.e:0 "拒绝"
ROC_SRC_hetan_event.19.f:0 "同意"
ROC_SRC_hetan_event.19.g:0 "拒绝"
ROC_SRC_hetan_event.19.h:0 "同意"
hetan_SRC_ROC_jingjiguodu_changqi:0 "大同社会是大同会与同产工会的共同目标，在“如何向大同社会进行过渡”的核心议题上，[hetan_SRC_ROC_fachuguo]向我们发出了提案。他们希望“市场经济和私有制将继续存在较长的时间”。"
hetan_SRC_ROC_jingjiguodu_baoliu:0 "大同社会是大同会与同产工会的共同目标，在“如何向大同社会进行过渡”的核心议题上，[hetan_SRC_ROC_fachuguo]向我们发出了提案。他们希望“市场经济和私有制将得到一段时间的保留”。"
hetan_SRC_ROC_jingjiguodu_guodu:0 "大同社会是大同会与同产工会的共同目标，在“如何向大同社会进行过渡”的核心议题上，[hetan_SRC_ROC_fachuguo]向我们发出了提案。他们希望“加速向计划经济和公有制过渡”。"
hetan_SRC_ROC_jingjiguodu_jiasu:0 "大同社会是大同会与同产工会的共同目标，在“如何向大同社会进行过渡”的核心议题上，[hetan_SRC_ROC_fachuguo]向我们发出了提案。他们希望“立即向计划经济和公有制过渡”。"
ROC_SRC_hetan_event.20.t:0 "改造手段"
ROC_SRC_hetan_event.20.d:0 "　　在确立了向大同社会过渡的总基调之后，我们下一步是需要考虑改制经济的具体手段了。我们主张："
ROC_SRC_hetan_event.20.a:0 "出资赎买，进而实现被改造企业的国营化"
ROC_SRC_hetan_event.20.b:0 "通过经济手段“扶公抑私”，推动对应行业的国营化"
ROC_SRC_hetan_event.20.c:0 "强制公私合营被改造企业"
ROC_SRC_hetan_event.20.e:0 "强制无偿征收被改造企业"
ROC_SRC_hetan_event.21.t:0 "[hetan_SRC_ROC_fachuguo]就经济改造问题提出方案"
ROC_SRC_hetan_event.21.d:0 "　　[hetan_SRC_ROC_jingjishouduan]"
hetan_SRC_ROC_jingjishouduan_shumai:0 "由于在首轮经济议题上我们处于优势，因此该轮议案由[hetan_SRC_ROC_fachuguo]进行提出。在具体的经济改造方案上，他们主张“出资赎买，进而实现被改造企业的国营化”"
hetan_SRC_ROC_jingjishouduan_fugongyisi:0 "由于在首轮经济议题上我们处于优势，因此该轮议案由[hetan_SRC_ROC_fachuguo]进行提出。在具体的经济改造方案上，他们主张“通过经济手段‘扶公抑私’，推动对应行业的国营化”"
hetan_SRC_ROC_jingjishouduan_qiangzhihebing:0 "由于在首轮经济议题上我们处于优势，因此该轮议案由[hetan_SRC_ROC_fachuguo]进行提出。在具体的经济改造方案上，他们主张“强制公私合营被改造企业”"
hetan_SRC_ROC_jingjishouduan_zhengshou:0 "由于在首轮经济议题上我们处于优势，因此该轮议案由[hetan_SRC_ROC_fachuguo]进行提出。在具体的经济改造方案上，他们主张“强制无偿征收被改造企业”。"
