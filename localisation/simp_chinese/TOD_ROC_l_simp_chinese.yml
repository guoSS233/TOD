 ROC_minister_agenda.11.t:0 "一册信用账引出的坏账争执"
 ROC_minister_agenda.11.d:0 "于树德走进部长办公室时，一份油印好的会议纪要已经躺在桌上，末页写着“经全体一致同意核销西关合作社灾年欠款”，日期和签字栏却都空着。他把纪要举起来，问财政处副科长：“这会还没开，纪要怎么先印好了？”副科长欠了欠身：“只是起草件。棉花合同这周就要交货，怕散会时手忙脚乱，先拟个框架放着。”于树德翻到第二页，“核销”二字下面还留着一行小注：其余款项，可按“核定口径”再行斟酌。\n\n大同党中派把核账权握在财政处，既怕一笔核销毁了合作社信用，也怕替商户垫款的先例落到自己头上。于树德若先行核销，就得挤掉中派的复核权限，借它的信誉背书；让合作社和商户共同重算，则多一轮会签，却把责任放回三方都看得见的账上。暂缓收回旧债能保住中派口径，春耕办法还得等下轮审议。\n\n合作社的女账房随后进来，把借粮簿、赊购簿、欠款清单三册并排摆开：“三本账，谷斗、布匹、银元三种记法，本来就对不上。”她翻到一处：“这三笔早还清的银元，被记到另一家分号头上去了。”于树德问副科长：“那棉花这一笔，先垫谁的钱？”副科长答得很快：“垫款不在既有会计权限之内，得另议。”于树德又追一句：“另议要议几天？”副科长低头道：“总要先把口径核清。”\n\n于树德把纪要轻轻推回原处：“既然核销已经写进纪要，那这字谁签？”副科长不接，只说“为保护拨款信誉，宜缓不宜急”。于树德转向女账房：“账对不清，棉花进不来，合作社明天拿什么开工？”她没回答，只把一叠被水浸坏的收条摆出来，背面还压着县库赈粮章。副科长盯着那枚章，半天才挤出一句：“章是真的，账未必作数。”屋里静下来，纪要末页那张空白签字栏，反倒成了最显眼的东西。"
 ROC_minister_agenda.11.a:0 "先核销灾年坏账"
 ROC_minister_agenda.11.b:0 "三方重算账目"
 ROC_minister_agenda.11.c:0 "暂缓收回旧债"
 ROC_minister_agenda.12.t:0 "滞在码头的城乡采购单"
 ROC_minister_agenda.12.d:0 "两份采购单叠在于树德桌上：省立医院催米、布、油，机器厂催工装布，都盖着加急章。运输科长站在一旁，说船脚费按新核的口径加了两成。于树德问：“稻谷早熟，照旧价交，再扣这两成运费，农户还落得下种子钱吗？”运输科长答：“运费有运费的算法，不在采购价里。”于树德没接，只把医院只剩十天口粮的电报推到对方面前。\n\n码头两船稻米已经到岸，却没人肯签仓储责任。商会代表被叫进来，说米行只认合同价，签收等于认了仓储损耗，所以两边都压着不签。于树德问：“那雨淋一夜，算谁的？”商会代表赔笑：“仓储费按章另计，没签收，就还没起算。”于树德点点头：“所以这米就一直在码头上淋着，谁都不着急。”对方没敢接话。\n\n在中央经济会议，大同党中派经手城乡采购审查，既想保住统一口径，也承担先行付款的签字责任。于树德若按新价先卸粮，就绕过它手里的审核，货能先动，中派却要替新价格担责；改由合作社分月结算，买卖双方多一张可追索的公账，左右两边都能留住协商席位，只是要重新对单。搁置签收能保住旧口径，价目单便要留待下一轮。\n\n于树德抽出运费表，指着两处一模一样的印章问：“这两笔运费，哪笔是实数？”商会代表怔了一下：“其中一笔，只是当初的预估。”于树德合上采购单：“医院的口粮一天天少，农户的谷子一天天陈，船上的米一天天淋。价格、运费、损耗，三样都悬着，就都等这第一笔签收。”他把电报重新推回运输科长面前：“先去把船卸了，还是先把账签了，总得有个先后。”"
 ROC_minister_agenda.12.a:0 "按新价先卸粮"
 ROC_minister_agenda.12.b:0 "分月结算采购"
