  ROC_idea_zhudatonghuizhizongzhu:0 "诸大同会之宗主"
  ROC_idea_zhudatonghuizhizongzhu_desc:0 "大同会国际成立于世纪之初，是大同会本土区大分裂后的直接产物。在大同会分裂以后，大同会激进派渐渐掌握了在国际社会中大同主义思潮的发言权，大同会国际建立意在协调海外大同党支部的活动，但是海外支部有长期独立发展的历史传统，所以海外的同志们还不大买广州的帐。"
