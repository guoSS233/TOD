 ROC_ma_story.404.t:0 "拦下来的奖金"
 ROC_ma_story.404.d:0 "工人代表与检验员已拦下不合格轴承，返工工时也补进记录，坏件没有混入交货。厂长向中央报喜时，却被工会问住：上月奖金按旧产量预发，如今部分轴承需要返工，财务打算从所有工人的下月工资里扣回差额。厂长解释：“我们奖励的是合格生产，现在只是把奖励算准。”\n\n检验员指出，不合格是尺寸偏差，原因可能是旧量具误差，并非每个工人操作失当；返工也耗了工时。厂长则担心奖金全部照发会占用检修经费，下一批订单更难按期交货。大同党左派要求保护认真验货的人，中派主张依已确认的合格数量结算、暂缓确定追偿对象；右派供货商希望中央说明交期，免得零件买家误以为所有轴承都有问题。\n\n工会内部也有分歧：熟练工希望奖励质量，临时工担心把返工工资与奖金混算后，自己只会承担扣款。班组长提出单列返工工时，由厂方和工会共同核定补偿，再讨论预发奖金；财务回答，这比在工资单上画一条减号麻烦得多。秘书问：“要是下次没人敢拦次品，您准备在哪张表上画那条减号？”\n\n中央采购代表拿来一封客户来信，并非催着把坏件送走，而是要求说明合格批次何日可交。厂长看完，承认可以按已验合格件分批交付，但要求复核费用由中央承担。工会代表说，愿让有经验的工人协助复核，却不能要求他们下班后免费守在返修台前。\n\n陈赞贤请双方保留拦截结果和返工记录，商定工时、奖金与检修费的承担次序。厂长建议先公布“质量合格率改善”；秘书递上工人代表写的另一句话：“这次发现了毛病，也留下了愿意说的人。”采购代表看过后说，客户大概更愿意相信第二句。"
