 ROC_minister_agenda.22.t:0 "谁来决定播种的那一天"
 ROC_minister_agenda.22.d:0 "推广处长把省农务厅印好的公告放在晏阳初桌上，说播种日期已经定了，月底统一，各县照此报产量。晏阳初问：“北江能灌水，山坡村的渠通了吗？”处长答：“渠工在赶，问题不大。”晏阳初翻开发芽记录：“这两袋种子受潮结块，也照发？”处长笑了：“这正是要请示的——公告已经印了，改口，上一季的宣传账就难看了。”\n\n女农技员被叫进来，把修渠工人的签名册摊开：“按公告的日期，水根本供不到山坡村。”她停了一下，又说：“我不反对统一播种，只是日期得往后让一让。”处长立刻接话：“要改可以，得中央先认这一季的宣传支出，再补一份复测的差旅费。”\n\n中央农事示范的播种公告已发，大同党中派守着统一口径；先验种再发，虽然能让推广安排先往前走，却须撤回原公告，让经手宣传的人在更正栏签字。按旧公告等水渠修完，口径得以保留，部长的日程也跟着空转；分县试种则允许各县拿证据，其他两派都可参与复核，只是还要多等一轮会签。\n\n晏阳初把公告和签名册并排放着：“按期照单播种，坏种只有一半能出芽，播下去是赌；先验种再发，种子就得先停着，农民会说我们只会填表；分县先试再比，又得先认一笔复核的差旅费。”他问女农技员：“照你看，哪条路能先动？”她没正面答：“先把水修通，比什么都强。”处长低声补一句：“水要钱，钱要批，批要开会。”"
 ROC_minister_agenda.22.a:0 "验种后再发放"
