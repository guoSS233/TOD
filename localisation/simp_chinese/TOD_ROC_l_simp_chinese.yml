 ROC_minister_agenda.42.t:0 "赶交货的夜班生产协定"
 ROC_minister_agenda.42.d:0 "泵机订单催得紧，采购科只拨了半数铜料，仓库里却堆着民用水厂等着的轴承。陈赞贤问厂长：“铜料不够，夜班排满就赶得及？”厂长答：“排满夜班，还是能按期交货，保住全厂岗位。”陈赞贤又问：“加班费按什么算？”厂长说：“眼下还是普通班次，回头再补。”\n\n女工把一只报废轴承放到桌上：“上周这台泵，轴承尺寸不合格，整台报废，生产报表里还记作完成产量。”陈赞贤拿起来看，编号属旧仓库，领料日期和仓库封条对不上。厂长忙说：“盘点的疏漏，回头我查。夜班的事，我支持——只要工资和工时先写进一张表，工人签字，厂里照办。”\n\n中央经济会议上的大同党左派工会代表要求工人看过工时和验收条款后再签；抢在争议消解前签夜班协议，虽然可以先推动施政，却压缩了本派代表的商议时间。分批排产把验收纳入公共监督，给中派留出复核权，左派则要容忍先行妥协；暂缓复核可以保住原有会签程序，部长的日程却要延后。\n\n陈赞贤看着他：“你先前不肯签，现在又肯了，还附了条件。”厂长笑：“早签早开机，对大家都好。”陈赞贤把原料清单、工会意见、违约条款并排摆好：“继续开这会，机器停在半成品上，订单要丢；现在开机，夜班和质量的事就压到工人头上；把会签缩成备案，生产委员会就只剩一枚空章。”他问女工：“这张表，你敢签吗？”女工说：“表里没写由谁验收，签了也白签。”"
 ROC_minister_agenda.42.a:0 "签订夜班生产协定"
