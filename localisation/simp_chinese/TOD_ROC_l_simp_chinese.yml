  ROC_idea_minzhongduidatonglixiangrenkedu_A:0 "民众对大同理想的认可度（低）"
  ROC_idea_minzhongduidatonglixiangrenkedu_B:0 "民众对大同理想的认可度（中）"
  ROC_idea_minzhongduidatonglixiangrenkedu_C:0 "民众对大同理想的认可度（高）"
  ROC_idea_minzhongduidatonglixiangrenkedu_A_desc:0 "群众对于大同主义和共和思想还不甚了解，大B革命事业刚刚处于起步，我们应该通过各种渠道宣传我们的主张，让大同之风席卷万里！"
  ROC_idea_minzhongduidatonglixiangrenkedu_B_desc:0 "群众对于我们的大同主义理想有着初步的了解，但依旧不少人对此持观望那个态度。我们应该用行动来证明大同主义，从而获得更多民众的支持"
  ROC_idea_minzhongduidatonglixiangrenkedu_C_desc:0 "随着革命者们的不懈努力，大同之花已然在社会上扎根。天下为公不只是一句口号，革命政党为民众，民众对我爱护又欢喜！"
  ROC_idea_datongdangdequanwei:0 "大同党的权威"
  ROC_idea_guimochuchengdezuzhi:0 "规模初成的组织"
  ROC_idea_guimochuchengdezuzhi_desc:0 "组织问题为吾党生存和发展之一个最重要的问题。在基层党建工作中，要努力做到一个支部就是一座堡垒，一名党员就是一面旗帜！"
  ROC_idea_dangdaibiaozhizhu:0 "党代表制度"
  ROC_idea_dangdaibiaozhizhu_desc:0 "我们的原则是党指挥枪，而决不容许枪指挥党！"
  ROC_idea_datongdangdequanwei_desc:0 "作为共和主义和大同主义忠实的践行者，大同党对共和军政策任何的变动都会影响各政团和民众的态度，更会影响党内思想与党员对大同主义的忠诚。我们知道纯粹的理想主义者只有自杀一条路，但不是理想主义者的人还有什么实现梦想的权利？做好你的取舍。"
