 ROC_ma_yu_1_decision_desc:0 "旧借粮还挂在大账上，春耕赊购被它绊着开不了张。先核销、暂缓收回，或叫合作社和商号共同重算，三派各有一本账，于树德要的是先把账目摆平。"
