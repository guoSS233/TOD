 #leader
 ROC_characters_kelin:"柯麟"
 ROC_characters_kelin_desc_leader:0 "柯麟于1901年生于广东省海丰县的一个商人家庭。于昌德二十七年（1916）秋考入海丰中学。时值一战爆发，明政府为参加一战采取了一系列“民主化”措施，社会政治氛围转向宽松。大同会借此机会，通过成立白手套会社、加强理论宣传、增设基层组织等各种方式积极开展活动，扩大自身影响力。在这种情况下，柯麟在海丰中学加入了大同党的基层组织。昌德三十年（1919），柯麟进入由大同会控制的广东公立医科专门学校就读。在学习之余，柯麟还积极参与了一系列大同会的相关工作，并受到了校长孙文先生的赏识，在大同会组织内部逐渐升迁。在一战结束后，原本宽松的政治环境急转直下，明国不仅重归战前专制体制，而且发布“党禁”，对于帝国宪政会意外各类政治会社积极打压，大同会更是首当其冲。在两广总督李准迫害下，大同会广州支部大量成员被迫分散到其他支部的控制区。柯麟却选择留下来与李准做斗争。柯麟留守广州支部，与各方势力周旋，并施行大同会组织改革，大力推动华南大同主义农会的发展。期间最重要的成就是他与同产工会的秘密合作，于昌德四十二年（1931年）与大明同产工会共同发动反抗明帝国战后专制统治的第一次大型公开罢工——省安大罢工。大罢工给了钱荒中的明帝国沉重一击，间接影响了昌德四十三年（1932年）的大选。柯麟借此次大罢工的胜利，在大同会内平步青云。在孙文先生的大力支持之下，其在同一年成为广州支部的主负责人兼改革委员会主任。在党魁黄兴逝世后的党宪危机中，柯麟力战众元老，以召开大同会全会的新形式，结束传统政治模式，成为第一位民主选举产生的大同会总理。在柯麟总理的领导下，大同会开始进行了一系列增强政党组织结构、加强党中央领导的改革。时至今日，七年改革即将完成，但面对着前所未有的大变局，他能否发挥好大同会应有的力量？"
 ROC_characters_dongbiwu:"董必武"
 ROC_characters_dongbiwu_desc_leader:0 "董必武生于湖北黄安的一个教师家庭，其出生的至和19年（1886年）正值明俄战争的白热化阶段，与之相伴的还有轰轰烈烈的大同民权运动。随着昌德皇帝上位并推行一系列民主化改革，大明迎来了史无前例的宽松环境，董必武便是在这样的环境下成长起来。\n昌德十四年（1901年），董必武刚升入高中便加入了大同会的外围青年组织，开始参与部分社会活动。然而，两年后的大同会大分裂以及昌德十六年武昌大同案的爆发，使大同会遭受重创，大量成员或被捕或退会，社会风气也随之变得压抑。可在这种危机时刻，董必武却逆流而上，向组织提交了入会申请书，正式成为大同会员。他在申请书中写道：“触于眼帘，即市井萧条，民气沮丧，沉郁惨淡，人以幸生苟免为心”，并决心改变这一切。\n昌德十七年（1904年），董必武考入顺天师范大学，毕业后到天津任教。凭借出色能力，他得到天津支部负责人景廷宾的赏识，成为大同会北方地区的工作骨干。作为教师，他积极传播大同主义，与同志一起重建北方组织。在他的影响下，众多青年加入大同会，投身民权运动。\n在昌德四十年的天津支部改选中，董必武得到了大量基层代表的支持，顺利接任了天津局书记的职务。在董必武的领带下，大同会天津支部积极与同产工会、民主团体等各方力量合作，组织了多次工运、农运和学潮，在大明的心脏处掀起了斗争的高潮。\n作为大同会左派领袖人物，董必武虽一直支持大同会中央的改革，但他对组织建设和革命工作有着自己的见解。随着社会矛盾日益激化，也许这些主张将走向台前，指引大同会通往更加光明的未来。"
 ROC_characters_huangyanpei:"黄炎培"
 ROC_characters_huangyanpei_desc_leader:0 "黄炎培出生于至和十一年（1878年），自幼在太仓府长大。在享受大明提供的丰富教育资源和优渥物质条件的同时，他广泛接触了新式思想和海外先进的观点。22岁那年，他进入南洋公学深造。昌德十三年（1900年），已满怀抱负的黄炎培与恩师蔡元培等志同道合之士共同发起成立了中华教育会，矢志推动大明社会的变革。在积极参与各类活动的过程中，黄炎培结识了众多大同会会员，并在师长的引荐下，怀着对大同理想的热忱加入了大同会，立志为这一伟大理想不懈奋斗。\n武昌大同案发生后，大同会的组织工作被迫转入地下。因黄炎培长期以中华教育会名义开展活动，未受通缉令直接影响，所以成为当时江南地区大同会活动开展的关键人物之一。他不负众望，以中华教育会工作为掩护积极开展活动，暗中恢复大同会在江浙地区的组织架构。昌德三十年，他又通过成立中华职业教育社，助力大同会向工农群体拓展组织。\n欧战民主时期，帝国为争取民意放宽了政治会社组建条件，许多地区的大同会员借此机会成立大量民间会社组织，大同会部分活动得以披上合法外衣。这既为大同会重回地方咨议局参政创造了条件，也被大同会长江临时委员会用作对抗中央决议的掩护。尽管黄炎培不认同长江临时委员会的做法，但他还是利用此时机积极扩充大同会力量。借助成立的外围会社组织，他不断吸引新同志加入大同会。在此过程中，黄炎培逐渐成长为大同会的重要领袖之一。虽然后来朝廷重开党禁使这项工作遭遇阻碍，但庚午钱荒的出现，又促使越来越多的人倒向大同会。\n在社会矛盾愈发严重的当下，黄炎培能否把握好机会，让民主的大同之光照耀四方呢？"
