ROC_idea_ChenYouren_desc:0 "陈友仁（1878—），祖籍广东顺德，生于英属特立尼达，著名外交家、政治家，大同会重要领导人之一。早年旅居海外，精通多国语言与国际法，曾任英国律师，1902年放弃外籍归返大明，投身大同运动。\n陈友仁初以“外交奇才”闻名于大同会内，昌德朝中期任大同会长江局对外联络部负责人，主持华中地区对外宣传与国际联络事务。他凭借娴熟的外交手腕与语言优势，多次代表大同会秘密接触欧洲左翼组织与反殖民力量，为大同会争取国际声援与物资渠道。欧战期间，曾协助协调大同会与法国、俄国部分革命团体的联络，试图为大明民主运动寻求外部突破。\n1930年“庚午钱荒”爆发后，陈友仁积极参与长江局组织的工运与学运，并在“珍珠桥惨案”后力主强化地下斗争与国际曝光双线并进策略。1933年大明政府收紧舆论管控后，他转入半地下状态，继续以“大同主义民主促进会”名义开展合法外交活动，实则负责大同会与海外支部的联络协调。\n1936年时，陈友仁仍担任长江局对外联络部主要负责人，在党内被视为“国际派”代表人物之一。其人以睿智敏锐、擅操英法西多国语言著称，虽未曾入阁拜相，然实为大同会外交战线不可或缺之支柱。"
ROC_idea_ChuFucheng_desc:0 "褚辅成（1873—），字慧僧，浙江嘉兴人，著名政治家、法律家，大同会创会元老及组织工作重要领导人。早年投身宪政运动，后转为大同主义者，历任大同会中央常委、组织部负责人、中央监察委员会委员等职，是党内颇具声望的实务派与稳健派代表。\n褚辅成早年受新民主义思潮影响，主张立宪改良。至和二年（1869年）大同会于武汉成立之初，他即参与创党工作，并于早期负责浙江及苏南地区支部建设。因其出色的组织协调能力与务实作风，在大同会内迅速崭露头角，先后出任组织部要职及中央常委，主导党员发展、地方支部建立与纪律监督工作，是大同会从松散同盟转向近代政党组织形态的关键推手之一。\n在“太仓叩阙”（1887年）及后续议会斗争时期，褚辅成主张以合法方式扩大咨议院影响力，推动政治改革；但在昌德朝后期大同会遭受镇压、被迫转型之际，他亦支持黄兴所推动的“先锋化改革”，参与建立民主集中制原则下的地下组织体系。1907年大同会全会后，他出任中央监察委员会委员，致力于整肃党内纪律、抑制宗派主义，尤在协调长江局、华北局等地方与中央关系方面发挥重要作用。\n1930年代庚午钱荒期间，褚辅成主张在扩大群众动员的同时保持组织隐蔽性，避免过度激化斗争，与柯麟、黄兴等人共同稳住了大同会本土大区的基本盘。至1936年，他仍担任中央监察委员会委员及组织部高级顾问，虽因年高渐离一线，仍被党内尊为“褚公”，视作组织建设与党内监督的权威人物。"
ROC_idea_YuShude_desc:0 "于树德（1894—），字永滋，直隶静海人，著名经济学家、社会活动家，大同会财务工作的重要奠基人之一。早年就读于顺天大学经济系，毕业后投身大同运动，以精于财计、善理粮款著称，长期主持大同会财务系统工作。\n于树德于昌德朝中期加入大同会，以其专业经济背景迅速获得重用，历任大同会广州中央委员会财务部负责人、中央监察委员会候补委员等职。在“庚午钱荒”（1930年）期间，他协助阮啸仙建立系统化财务制度，稳定党内资金流转，并通过秘密渠道为罢工、农运提供经费支持，在许多地区推进了经济型合作社的成立。\n1936年时，于树德仍担任大同会中央财务部核心领导职务，主持党内资金调度、海外汇款接收与地下经济网络维护工作，其人以严谨克制、沉默务实著称，虽少公开露面，然实为维系大同会生存与斗争的重要支柱。"
ROC_idea_YanYangchu_desc:0 "晏阳初（1890—），字东升，四川巴中人，知名平民教育家、乡村建设实践家，大同会华北局农村工作核心领导人之一。早年就读于四川大学，在校期间受景教社会福音思想与近代教育理论影响，毕业后立志“除文盲、作新民”，投身农村教育与基层改造事业。\n晏阳初于昌德朝初期加入大同会，以其独特的平民教育理念与实践经验受到重视，历任大同会华北局农会负责人、教育促进委员会主任等职。在华北农村工作中，他提出“除愚、除贫、除弱、除私”四大教育方针，组织识字运动、农业改良与合作社实验，将大同主义的基层动员与平民教育紧密结合。\n1930年“庚午钱荒”期间，晏阳初在河北、山东等地推动“以教代赈”，通过兴办乡学、农技传习所稳定民心，为大同会在华北乡村赢得广泛支持。1936年时，他仍主持华北局农会工作，并兼任大同会中央农村政策顾问，其人以谦和务实、深植乡土著称，被农民称为“晏先生”，是大同会群众路线与农村工作的关键代表。"
ROC_idea_RuanXiaoxian_desc:0 "阮啸仙（1897—），字瑞宗，广东河源人，工人运动领袖、大同会早期组织家与财务工作重要负责人。少时家贫，早年投身工人运动，后系统接受大同主义理论，成为大同会华南地区工运与财经工作的核心骨干。\n阮啸仙于欧战时期加入大同会，凭借卓越的组织能力与务实作风迅速崛起，长期担任大同会中央财务部主要负责人，并多次兼任工人部、联络部要职。在“庚午钱荒”（1930年）期间，他构建起大同会秘密财经网络，统筹海外捐助、地下资金流转与罢工经费调配，为组织渡过经济危机提供坚实保障。\n1933年，他参与领导“省安大罢工”，并主持后勤调度，展现出不畏艰险、缜密沉稳的斗争风格。1936年时，阮啸仙仍居中央财务部核心领导岗位，并兼任华南地区工农运动协调人，持续为大同会各类活动提供资金与物资支持。"
ROC_idea_ChenZanxian_desc:0 "陈赞贤（1896—），江西南康人，工人运动组织者、大同会华北地区财务工作与地下经济战线重要负责人。早年投身工运，精于组织与筹款，后加入大同会，长期主持华北局财务工作，是党内兼具务实作风与坚定信念的经济干部。\n陈赞贤于昌德朝中期加入大同会，以其严谨细致、善于筹款的特性获重用，历任大同会华北局财务部负责人、北方经济协调委员会委员等职。在华北工作期间，他建立起覆盖京津、河北、山西等地的秘密资金网络，通过商会掩护、侨汇渠道等多种方式为党组织输送经费，保障了华北地区工运、学运及宣传活动的持续开展。\n1930年“庚午钱荒”爆发后，陈赞贤积极协调民间互助基金与党内经费调配，在维持地下组织运转的同时也适度支援社会救济工作，为大同党在北方赢得民意基础做出重要贡献。"
ROC_idea_XiaoZheng_desc:0 "萧铮（1904—），字鹏飞，浙江永嘉人，大同会土地问题专家、农村经济学家，大同会土地改革与乡村政策核心制定者之一。早年留学应天大学农业经济系，毕业后投身农村调查与土地制度研究，以数据详实、政策务实著称。\n萧铮于昌德朝后期加入大同会，凭借其专业的土地经济背景迅速获得重用，历任大同会中央农村政策研究室主任、土地改革委员会常务委员等职。主持起草《土地改革暂行条例》《佃权保障与土地分配办法》等多份纲领文件，提出“耕者有其田”“分步赎买”“合作社经营”等政策主张，为大同会农村工作提供理论依据与实施路径。\n1930年“庚午钱荒”期间，他深入江南、华北等地开展田野调查，撰写《农村经济崩溃与土地集中报告》，揭示土地兼并之弊，推动大同会将土地改革列为核心斗争议题。"
ROC_idea_FangShengdong_desc:0 "方声洞（1886—1962），字震明，福建侯官人，大同运动地下工作专家、情报系统奠基人之一，大同会调查工作与安全体系核心领导人。早年习警务与密查之术，精于反侦、策反与情报网络构建，后投身大同运动，成为党内安全与调查工作的实际负责人。\n方声洞于昌德朝初期加入大同会，凭借其隐秘战线专长迅速获重用，历任大同会调查部负责人、中央监察委员会安全事务委员、华南局保密工作总指挥等职。他主导建立大同会内部监察与反渗透机制，构建覆盖沿海城市与海外据点的情报网络，在“战后党禁”及“省安大罢工”中多次挽救组织于危局。\n1930年“庚午钱荒”期间，方声洞强化地下工作纪律，严查内奸、整顿组织，保障了大同会在高压环境下的存续与发展。其主持情报系统改造与干部培训工作期间，为大同会培养大批保密与调查专业人才。"
ROC_idea_DongBiwu_desc:0 "董必武生于湖北黄安的一个教师家庭，其出生的至和19年（1886年）正值明俄战争的白热化阶段，与之相伴的还有轰轰烈烈的大同民权运动。随着昌德皇帝上位并推行一系列民主化改革，大明迎来了史无前例的宽松环境，董必武便是在这样的环境下成长起来。"
ROC_idea_HuangYanpei_desc:0 "黄炎培出生于至和十一年（1878年），自幼在太仓府长大。在享受大明提供的丰富教育资源和优渥物质条件的同时，他广泛接触了新式思想和海外先进的观点。22岁那年，他进入南洋公学深造。昌德十三年（1900年），已满怀抱负的黄炎培与恩师蔡元培等志同道合之士共同发起成立了中华教育会，矢志推动大明社会的变革。在积极参与各类活动的过程中，黄炎培结识了众多大同会会员，并在师长的引荐下，怀着对大同理想的热忱加入了大同会，立志为这一伟大理想不懈奋斗。"
ROC_idea_XiaMinghan:0 "夏明翰（1900—），字仲云，湖南衡阳人，农运工作重要领导人、大同会农村政策与基层动员专家。早年就读于湖南师范学堂，受新民主义与大同思想影响，投身乡村教育与社会改造，后成为大同会华中地区农运工作的核心骨干。\n夏明翰于昌德朝中期加入大同会，凭借其对农村社会的深刻理解与务实作风获得重用，历任大同会华中局农会负责人、中央农村工作委员会委员等职。他长期主持湖南、湖北等地的农会组织与佃农权益保障工作，推动减租减息、合作社试点与农村识字运动，将经济斗争与基层政权建设相结合。\n在1930年“庚午钱荒”期间，夏明翰积极组织互助社与平粜运动，缓解农村饥荒，并在湘鄂多地成功领导抗租抗税斗争，为大同会赢得广大农民支持。他持续推动土地改革与乡村治理试点，参与制定《农村合作社条例》与《佃权保障法》，被誉为“农运实干家”。"
ROC_idea_DaiLi_desc:0 "戴笠（1897—），字雨农，浙江江山人，地下工作与情报系统重要骨干，大同会安全保卫与特别行动工作负责人。早年习警务与侦缉之术，精于密查、策反与情报分析，后因不满朝廷腐败与社会不公，投身大同运动，成为党内秘密战线核心干部。\n戴笠于昌德朝中期加入大同会，凭借其情报专长与组织能力迅速获重用，历任大同会调查部特别行动科负责人、华东区地下工作总指挥、中央保卫委员会委员等职。他主导建立大同会内部反渗透体系与秘密交通线，多次在朝廷镇压前夕转移骨干、销毁机密，保全组织力量。在“庚午钱荒”（1930年）期间，他通过潜伏渠道获取朝廷经济部署情报，为大同会工运、农斗争取主动。"
ROC_zhangxiaozhun_commander_desc:0 "张孝准（1881—），字韵农，湖南长沙人，大明军事教育家、军事理论家，大同会军事工作与陆军军官培养体系重要奠基人。早年就读于顺天武学（后改组为顺天陆大），后前往德国普鲁陆军大学进修，精通近代军事理论与参谋业务，归国后投身军界，后因认同大同理念而秘密加入组织。\n张孝准于欧战中大放异彩，凭借其军事专业背景与教育经验获明廷重用，历任华南军区参谋、华南陆军军官学校校长、中央军事教育委员会委员等职。他主持改建华南陆军军官学校，引入现代军事课程与政治教育并重的培养模式，并暗中为大同会输送大批兼具军事技能与政治觉悟的骨干军官。\n在广州起义之后，张孝准继续主持军校工作并参与制定大同会武装斗争纲领，提出“政治建军、群众路线、灵活战术”三大原则，深刻影响大同会军事理论与实践。"
ROC_zhangshaozeng_commander_desc:0 "张绍曾（1879—），字敬舆，直隶大城人，大明军事家、大同运动秘密战线重要领导者，大同会潜伏工作与军运事务核心负责人。早年毕业于顺天陆军大学，后留学日本陆军士官学校，归国后长期任职于大明新军系统，官至协统（旅长），深得朝廷信任。\n张绍曾于昌德朝初期秘密加入大同会，凭借其军中地位与人脉资源，成为大同会在明廷陆军内部最高级别潜伏者之一。在大同会内先后担任军事部特别联络员、华北局军运工作总指挥、中央军事委员等职。他利用职务之便，多次向大同会传递朝廷剿抚部署、军力调配及情报，并在“党禁搜捕”期间成功掩护大批同志转移。\n直至广州起义前，张绍曾仍以明军高级将领身份为掩护，持续为大同会提供军事机密与物资渠道，并秘密发展军中进步军官加入组织。"
ROC_dengkeng_commander_desc:0 "邓铿（1886—），字仲元，广东梅县人，大明军事家、特种行动专家，大同会潜伏体系中的战术执行与应急响应核心人物。早年毕业于广东陆军讲武堂，善袭扰、爆破与敌后破坏，后受大同理念感召秘密加入组织，长期以明军军官身份为掩护，主导多项高危特别行动。\n邓铿于昌德朝中期加入大同会，凭借其战术素养与果敢作风被委以重任，历任大同会军事部特别行动组负责人、华南敌后工作队指挥、中央应急行动委员会委员等职。与张绍曾侧重高层情报与战略掩护不同，邓铿专注战术层级，多次直接参与营救被捕同志、破坏朝廷镇压设施、截获锦衣卫密件等行动，以“快、准、狠”著称。\n在1930年“庚午钱荒”期间，他率小队成功炸毁广州两处明君物资仓库，延缓镇压行动；1933年“省安大罢工”中，他暗中维持工人纠察队秩序，阻挠明军突入抓捕。转任华南陆军大学任教后，他转入更深度潜伏状态，专注于培养特种行动人才，并为大同会编写《敌后袭扰手册》《应急撤离规程》等实战教材。"
