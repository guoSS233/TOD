 ROC_minister_agenda.31.t:0 "两栏预算上的同一笔石料款"
 ROC_minister_agenda.31.d:0 "阮啸仙把中央财政处的季度支出册翻到中间一页，指着同一段县道：“这一栏赈灾修路列了一次石料款，那一栏军需运输又列了一次，签收人还是同一位已经调走的工务员。”财政科长凑近看了看，说：“分栏是会计的习惯，两笔用途不同，未必是重复。”阮啸仙问：“那石料到底铺在哪了？”科长答：“用途明细，账册上没有，得查原始单据。”\n\n仓库管理员被叫进来，翻出领料单，手有点抖：“这张是后来补开的。”阮啸仙接过来，见日期比道路验收章还晚，却比工务员的调职令早。“补开？谁让补的？”管理员不敢看科长：“原来那张，说找不到了。”阮啸仙又问财政科长：“口头调拨，有字据吗？”科长答：“命令来自一个已经撤销的临时委员会，如今没人能签字确认。”\n\n在中央经济财政会议的预算审计中，大同党左派推举的预算监察人员也参与过这两笔拨款。公开票据追责能尽快查清账目、缓和问责，却要调查本派推举的签字人，阮啸仙得付出他们的信任；封存后将涉款列入公共账目复核，中派可以继续主持审查，左派则失去当场追责的机会。只追回重复款可护住现有经手人，总账却要拖回下一轮。\n\n阮啸仙把支出册和领料单并排摆好，说：“账上两笔，仓库一张单，日期还排在验收之后、调职之前。这中间的署名，谁的位置，谁就担这份责。”财政科长退后半步，只道：“账册可以封存，待查；也可以只把重复的那一笔追回来。”阮啸仙没接这个茬，只说：“水泥还在雨里受潮，验收记录却写了两份，一份说可用，一份说报废。”"
 ROC_minister_agenda.31.a:0 "公开票据追责"
 ROC_minister_agenda.31.b:0 "先封存账册"
 ROC_minister_agenda.31.c:0 "只追回重复款"
 ROC_minister_agenda.32.t:0 "盖章验收单与欠薪条"
 ROC_minister_agenda.32.d:0 "省建设科送来的年度决算里，三座桥、两条县道、一段堤防都列了验收款，唯独没有工人的领薪清册。阮啸仙问承包行代表：“桥只立了桥墩，怎么报告上写全部交付？”代表苦笑：“尾款一直不到账，我们只能停。”阮啸仙又抽出一张照片：“那这座桥的料，怎么挪去修了临时码头？”代表低了头：“码头急，先借，日后补。”\n\n工头随后递上一叠按了手印的欠薪条，最早一张已两个月。阮啸仙问承包行：“县里既已盖章，领款怎么被退了回来，理由只写‘手续不合’？”代表把退回单推过来：“我也想知道哪里不合，章是县里自己盖的。”财政处这时递上工程章的登记簿：“章是真章，可签字验收那天，经办人正在省城开会，人根本没到工地。”\n\n中央决算审核会上，大同党左派的工会代表既想替工人讨账，也担心查验收时牵出自己推举的负责人。阮啸仙若先替欠薪立凭证并公开签收链条，问责能先有交代，本派支持却会折损；分项核销让中派保住复核位置，也把公共工程账纳入统一审计，只是每个条目都要重签。沿用旧章可以保住经手人，账册仍须送回补签。\n\n阮啸仙把决算、欠薪条、登记簿并排摆好：“章是真的，人不在场；款没到位，工却没完；材料挪了，账还挂着。”他问财政处：“这枚真章盖下去，账面上的‘交付’二字，该谁认？”财政处半晌道：“可以分项核，已完的结，未完的缓；也可以先按既有验收继续走。”阮啸仙没接，只把欠薪条最上面那张翻过来，让手印朝上：“工钱拖了两个月，渡口只剩几日燃料，账要结，人也要给个说法。”"
