ROC_SRC_hetan_event.1000.t:0 "[hetan_SRC_ROC_fachuguo]同意了我们的提议"
ROC_SRC_hetan_event.1000.d:0 "　　针对我们提出来的议案，[hetan_SRC_ROC_fachuguo]方面也表示了同意，最终议案成功通过，这说明我们距离和平统一更进一步。"
ROC_SRC_hetan_event.1000.a:0 "太棒了"
ROC_SRC_hetan_event.1001.t:0 "[hetan_SRC_ROC_fachuguo]拒绝了我们的提议"
ROC_SRC_hetan_event.1001.d:0 "　　[hetan_SRC_ROC_fachuguo]单方面拒绝了我们的提案，最终议案成功通过。很明显的是，这件事情撕裂了我们和[hetan_SRC_ROC_fachuguo]之间的信任。"
ROC_SRC_hetan_event.1001.a:0 "可惜"
