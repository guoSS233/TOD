 ROC_central_economy.3.b_tt:0 "不增加实绩或工程实测；30日后启动查核；中派好感+10、问责压力+5。"
 ROC_central_economy.3.c:0 "按实物口径复核"
 ROC_central_economy.3.c_tt:0 "未来90日施工速度−0.15/日；左派好感+8、右派好感−10。"
 ROC_central_economy.4.t:0 "从柜底回来的旧约"
 ROC_central_economy.4.d:0 "财政处盘点旧档案，文件柜最底一层掉出一份碳纸复写本，纸边发黄，印泥却还辨得清。大同党右派代表认出那是上一轮预算协定，页脚有前任经济部长的签名，旁边一行手写批注：若新工程挤占原拨款，须先向中央说明改期理由。而在档案目录里，这份协定早被登记成“副本遗失”。\n\n会议主持人翻到背面，监察席位、支付日期、复核责任一条条写得清清楚楚，唯独没写钱不够时哪一项可以延期。秘书长去查目录，登记“遗失”的那位经办人已经调离，只留下一句批注：“原件在，副本缺。”主持人问，原件既然在，副本怎么会缺；没有人接话，只有档案柜的门轻轻晃了一下。\n\n大同党右派代表没有提高声音，只问拨款顺序为什么变了，签约时承诺的公开期限却没人改；大同党左派代表随后进门，带来公共服务部门的采购清单，说旧约有签字不假，可若所有款项都按旧顺序先付，新的保障计划就只能停在纸面。大同党中派代表把两份文件并排放平，说不先替谁，先把改期权限厘清。三个人把同一张预算表推向主持人，手指停在不同的栏位。\n\n账上并没有一笔可以凭空挪出的余款。主持人把复写本压在新预算的红封面上，透出另一页签字的影子。秘书长提醒，公开承诺一旦改期，往后的中央协商都会先问这次改了什么、由谁批准。电话在窗边接连响起，催的都是拨款何时落地。主持人取出印章，在新预算上方停了片刻，没有落下去；秘书长问，今天按旧日期办，还是把改期的名字写进记录？"
 ROC_central_economy.4.a:0 "按旧协定先兑拨款"
 ROC_central_economy.4.a_tt:0 "花费25政治点数；右派好感+15、左派−5，问责压力−5。"
 ROC_central_economy.4.b:0 "重排中央预算优先次序"
 ROC_central_economy.4.b_tt:0 "有在建工程时暂停10日；左派好感+25、右派−15。"
 ROC_central_economy.4.c:0 "旧约暂存，五日后议"
 ROC_central_economy.4.c_tt:0 "有在建工程时暂停5日；中派、右派好感各−10，问责压力+10。"
 ROC_central_economy.5.t:0 "连着被退回的季度公报"
 ROC_central_economy.5.d:0 "两份季度公报被连着退回，红笔圈出的空栏一页多过一页。秘书长把退回的公报压在本届施政计划上，开会时，桌边已经坐着大同党中派代表和大同党左派代表。他们没有争下一笔预算该归谁，而是各自带来一份责任清单；两份清单的签字栏几乎都空着，却都用铅笔在旁边标着“请部长办公室确认”。\n\n财政官员说付款按经济部批示拨出，工程处说设备采购按财政核定执行，主管部门则称验收日期由经济部在会议上确认。每个人都递上一封旧公函，证明自己早提醒过风险。会议主持人逐页看过去：提醒写得都很充分，措辞客气，日期齐全，唯独没有一句写清该由谁处理这些提醒。提醒的是风险，处理风险的人，却从未在任何一页上被指定过。\n\n大同党右派代表把一份风险清单放到桌边，要求把合同责任写进纪要；大同党左派代表翻开工资清册，说工人不该替部门间的推诿承担延期。秘书长没有催谁签字，只从公文夹里取出一页尚未填写的辞呈格式，又在旁边摆上一张新的责任表——一张供任职者提出辞职，另一张要求每个部门写明负责人和期限。两张纸都留着签名栏。整改要另拨款，若有在建工程还得暂缓施工；缓议只推迟下一次问责，欠下的实绩仍在账上。秘书把笔帽拔下，放在两份文件之间，轻声问：这两份，都先留在桌上吗？主持人仍等各部门表态，电话铃在门外又响了一回。"
 ROC_central_economy.5.a:0 "拨款整改，暂停施工"
 ROC_central_economy.5.a_tt:0 "花费25政治点数；问责压力−20、左派与右派好感各+10；有在建工程时暂停7日。"
 ROC_central_economy.5.b:0 "以一次支出换取缓议"
 ROC_central_economy.5.b_tt:0 "花费40政治点数；本届仅一次跳过下一季度问责，不清除目标差额或实绩债务；问责压力−15。"
 ROC_central_economy.5.c:0 "辞去部长职务，由中央另任"
 ROC_central_economy.5.c_tt:0 "部长辞职并触发继任任命；现有工程进度与本届剩余任期由继任者承接。"
 ROC_central_economy.6.t:0 "摘要上的“已经完成”"
 ROC_central_economy.6.d:0 "阶段摘要见报一个月，报纸仍把那项工程印成“已经完成”。审计员带着现场照片和送货单走进经济部会议室：照片里设备还裹着防水布，签收单写的是“材料已到”，摘要上的栏目却叫“工程已交付”。三张纸摆在一起，连秘书长也找不到一句话能把它们说成同一件事。补正通知送到经办处，签收栏却一连空着。\n\n大同党右派代表先把原始账册摊开，要求公开摘要的每一处删节。曾经替这份口径说过话的大同党中派代表没有坐下，只站在门边问，谁批准把“收到”改成“完成”；他把自己上周签过的说明抽走，交给秘书长收回档案。经办员说自己只按秘书处模板填表，秘书处说模板照着部长办公室的摘要做。支持过这份声明的人，正一个接一个把自己的名字从页边划掉。\n\n审计员把送货单交给会议主持人，上面的日期早于任何一次现场验收。大同党左派代表没要求处分谁，只问工资和安全记录为什么也被塞进同一页宣传摘要。报社记者在走廊等一份更正稿，印刷车已经停在院门外；记者隔着玻璃递来截稿通知，标题栏还空着一整块。更正需要另拨协调经费；把口径推给经办人，工人不会因此认下那份摘要。秘书长抽出一张空白校样，把照片和账册分别压住两角，问主持人：今晚读者看到的，是旧标题，还是更正稿？署名写办公室，还是写您？"
 ROC_central_economy.6.a:0 "公开账册，更正摘要"
 ROC_central_economy.6.a_tt:0 "花费25政治点数；右派好感+15、中派−5，问责压力−10。"
 ROC_central_economy.6.b:0 "把口径问题推给经办员"
 ROC_central_economy.6.b_tt:0 "稳定度−2个百分点；左派好感−15、问责压力+10。"
 ROC_central_economy.6.c:0 "暂不公开，先拖一拖"
 ROC_central_economy.6.c_tt:0 "问责压力+15、右派好感−15；有在建工程时暂停14日。"
 ROC_central_economy.7.t:0 "部长席前的五份履历"
 ROC_central_economy.7.desc:0 "辞呈已经生效，秘书处把五份履历按姓氏排好，放在部长席前。每一份都用同样的红头纸、同样的楷体，只在“擅长事项”那一栏各写各的：合作社信用与城乡采购、乡村调查与技术推广、统一账目与公共投资审计、工会协商与生产协定、自耕农与民间投资。五个人都愿意接这份差事，也都在履历背面附了同一句：“服从中央安排”。秘书处另贴了一张便条：谁先上任，谁先接管本届未完工程和履职账。\n\n会前，大同党中派代表在任命理由上补了“合作信用与农技调查”，大同党左派代表添上“公共审计和工会参与”，大同党右派代表则在旁注中坚持“私人契约与小农信贷不能空着”。三个人都把各自的政策优先写进同一张推荐表，谁也没写“指定路线”四个字；表尾的备注栏里，是秘书长用铅笔写的一行小字：任命归中央，路线归部长。推荐理由也须随同备案，不能只留人名。\n\n新部长接手的不是一张白纸。正在施工的项目、实测进度、目标差额和本届剩余日数都留在原处，继任者要从同一份会议记录继续履职，连那份被退回的季度公报，也还压在本届施政计划下面。五份履历都能进入任命程序，也都会撞上不同的预算与权限争论；而部长来自哪条路线，并不会自动决定谈判桌上哪一方先赢。秘书处把五份履历重新码齐，等会议主席先开口。"
