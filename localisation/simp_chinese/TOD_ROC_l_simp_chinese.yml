 ROC_ma_story.306.t:0 "回执从何而来"
 ROC_ma_story.306.d:0 "欠薪数额与付款时限已经确认，分项拨付名单也送到中央。财政处长却请阮啸仙批准一项补充办法：款到地方后，须先收齐工人签收回执，才能向经办人拨付。部长问：“人还没收到钱，回执从哪里来？”处长说：“这是预先准备，确保付款后不会遗漏。”\n\n工人代表解释，已确认的工资不容重新争论，难处是修渠队分散在几处工地，部分人赶不及在同一天回来。承包代表担心先把钱交给临时经办人，若有人冒领，追回来又会影响材料供应；他愿意核对名单，却不愿替财政处保管整笔现金。大同党中派赞成加强凭据，左派要求在期限内先给工人实际领款的办法。\n\n财政人员提出按现有程序逐批通知，回执齐一批就拨一批，免得增加支出，但中央得等各地逐次回报；也可以增派经办员，按确认名单分点发放、当场签收，费用要从部里另拨。工人代表建议允许本人委托领款，附两名见证人；财政处担心见证责任难认，要求工会也承担复核，而工会代表提醒，自己的名册并不包括全部临时工。\n\n秘书打开财政处发来的样本，发现上面写着“本人已领清”，签名栏却留在拨款审批栏之前。处长解释，表格排列只是印刷方便。阮啸仙请他在样本上签字，证明自己已经收到下季度薪金。处长忙摆手：“我还没有收到。”秘书点头：“工人也是这么想的。”会议一时安静，连承包代表都把准备好的担保说明折了起来。\n\n部长要求各处保留已确定的欠薪和付款期限，再决定经办、见证与拨款先后。处长收回样表，许诺印一份新的；工人代表请他别忘了给领款人留存一联。秘书说，这样财政处至少能收到两份安心，一份留在卷里，一份真正到工人手里。"
