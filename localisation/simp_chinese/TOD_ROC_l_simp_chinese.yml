 ROC_focus.2.t: "共和武装"
 ROC_focus.2.d: "随着广州革命政权的成立，首要之务便是建立一支真正属于人民的革命武装。目前，我方军事力量主要由农协、工协纠察队、军校学生及起义部队组成。这些同志虽怀有满腔革命热忱，但缺乏统一编制与指挥体系，亟待整训。当务之急，须将各路武装加以整编，建立集中统一的指挥机构，以先进的编制整训部队，方能为革命事业奠定坚实基础。"
 ROC_focus.2.a: "胜敌一筹的士气、领导有方和训练有素是制胜的法宝。"
