  guangzhouqiyi:0 "广州起义"
  guangzhouqiyi_desc:0 "历经战士们的浴血奋战，如今广州城已然掌握在我们大同会人手中。宣告大明王朝终结丧钟已然敲响，我们理当再接再励，粉碎暴政，解放华南！"
  zujiangonghewuzhuang:0 "组建共和武装"
  zujiangonghewuzhuang_desc:0 "虽然历史上常说“得民心者得天下”，但大同会深知，在革命的道路上，武装力量的作用同样不可忽视。随着华南革命的烈火熊熊燃烧，是时候建立一支正规的革命武装了。我们要用坚定的意志和锋利的刺刀，捍卫那朵在凛冬中绽放的大同之花，确保革命的胜利果实不被侵犯。这不仅是对民心的有力回应，更是对革命理想的坚定追求。"
  cedongnanyangjianduicanyugeming:0 "策动南洋舰队参与革命"
  cedongnanyangjianduicanyugeming_desc:0 "为了增强革命力量的整体实力，我们精心策划并成功策动了南洋舰队加入革命的行列。这一重要举措不仅将极大地提升我们在海上的作战能力，同时也标志着革命力量在海空领域迈出了坚实的一步。"
  banbugonghelinshixianfa:0 "颁布共和临时宪法"
  banbugonghelinshixianfa_desc:0 "共和临时宪法的颁布，是国家政治生活中的一件大事。它不仅为国家的未来发展提供了坚实的法治保障，更彰显了国家对民主、自由、平等、公正等价值观的坚定追求。这部宪法是人民革命意志的结晶，有效规范了革命时期的政府运转和司法体系。"
  gaizaojingjidezhunbei:0 "改造经济的准备"
  gaizaojingjidezhunbei_desc:0 "如果南洋是大明的聚宝盆，那么广府就是大明控制这个聚宝盆的关键。作为大明的金融业与轻工业的中心之一，以广府为中心的华南经济结构错综复杂，从地租经济、农场经济，到宗族企业、合作企业，各式各样的公司和产业分布在这篇繁荣的土地上。如何处理华南的经济，使之适应大同主义的社会经济理想，是我们新生政府面临的当务之急。"
  weidashijiandekaishi:0 "伟大实践的开始"
  weidashijiandekaishi_desc:0 "大同主义理想中，包含了许多改革社会经济、开展阶级斗争的内容。有些人将之当作自己毕生奋斗的目标，也有人将之视为叛经离道歪理邪说。事实胜于雄辩，我们会用自己的实践证明大同社会并非是空想。在经委会的指导下，大同之花必将在岭南绽放！"
  tudigaige:0 "土地改革"
  tudigaige_desc:0 "土地问题是困扰神州大地千百年的顽疾，尽管工业化似乎带来了别样的出路，但却仍然难以从根本上解决问题。随着大同经济改革的展开，土地问题也随之摆在了经委会的各位成员面前。是选择坚决贯彻“耕者有其田”的大同理想，还是利用岭南地区特殊的农业经济结构？我们需要做出选择。"
  shanghuinongchanggaizhi:0 "商会农场改制"
  shanghuinongchanggaizhi_desc:0 "相较于其他工商业领域，在农业领域彻底废除剥削经济结构是大同会社会改造的重中之重。在这一问题上，即使是与我们配合密切的各大商会下属农场也不例外。我们对于农业体系的规划应该以各类国营、私营农场为中心，通过“公私合营”等方式逐步转变农业领域的生产资料所有制性质。而对于商会农场的改造工作，将成为我们行动的开始！"
  luoshipingjundiquan:0 "落实平均地权"
  luoshipingjundiquan_desc:0 "尽管华南领域的农业生产结构有利于我们进一步推行农业生产的集约化，但是以经济手段强行推进农场的铺开与土地兼并无异，也并不符合我们此前对于农民们的宣传。对于现行的各大农场我们当然会加以保留。但在这些土地之外，我们将坚决落实“平均地权”的理论将地主的土地重新分配。粉碎旧有的剥削土地经济，实现耕者有其田！"
  zhengheyouxiuzhishifenzi:0 "整合优秀知识分子"
  zhengheyouxiuzhishifenzi_desc:0 "相较于其他势力，大同会与知识分子在很早之前就有着密切的联系。也正是在知识分子群体地支持下，我们才得以实行以“民促会”为核心的一系列商业计划。如今随着革命之火燃遍华南，我们应当进一步发扬自身重视知识分子的传统，吸纳更多知识分子为革命事业而服务。"
  gulixueshuziyou:0 "鼓励学术自由"
  gulixueshuziyou_desc:0 "学术研究离不开自由的学术环境。尽管我们提出了革命学术化的主张，但其目的在于解决学阀和学术垄断等问题，而非限制学者们的科研内容。革命政府将消除帝国时期的各种学术禁令，在学术革命中，实现真正意义上的学术自由！"
  jieguanguanyinggongcheng:0 "接管官营工厂"
  jieguanguanyinggongcheng_desc:0 "大明帝国在华南拥有着不少官营企业，尽管不如东北华北那样规模庞大，但依旧是一笔不可小觑的产业。革命政府要想在经济领域拥有足够话语，就需要快速接管这些“反动逆产”，唯有如此才能保证华南地区经济实现平稳过渡。"
  lianheshanghuishili:0 "联合商会势力"
  lianheshanghuishili_desc:0 "当前革命形势不容乐观。为推进既定的革命目标，政府需主动构建工商界统一战线。尽管他们中的许多人作为大资产阶级，在过去可能曾极力抵制革命，但历史的洪流总是充满变数。若他们愿意转变观念，为革命提供必要的物资与资金支持，我们应持开放的态度，选择与他们携手合作。"
  kuodamincuhuifanwei:0 "扩大“民促会”范围"
  kuodamincuhuifanwei_desc:0 "民生产业促进会作为大同会重要外围组织，长期以来为革命事业提供了大量资金与帮助，其产权改造机制已成为革命经济战线的枢纽节点。鉴于当前革命形势演变，适度调整其准入机制，吸纳特定垄断性大型企业参与，或可成为争取工商界支持的有效路径。"
  shijianjiezhiziben:0 "践行节制资本"
  shijianjiezhiziben_desc:0 "世界的现代化发展中，资本是推动社会发展的重要力量，但其过度扩张和盲目追求利润也随之带来一系列问题。正因如此，在大同理论诞生之初，就形成了节制资本的相关认识。尽管我们不会在短时间内消灭民营资本和市场经济，但确保关键领域的企业国有化，以及逐步推进公私合营范围，将是大同会不可动摇的政策。尽管过程曲折，但我们将坚定不移地向没有剥削的大同世界迈进！"
  qianghuagonghuiquanli:0 "强化工会权力"
  qianghuagonghuiquanli_desc:0 "工会作为劳动者的重要代表和维护者，其权力的强化对于构建推动生产发展、维护劳动者权益具有重要意义。政府应当帮助工会不断拓展其职能范围，积极参与企业管理、决策和监督等环节。同时，工会还应建立健全参与渠道，鼓励会员积极参与工会活动，提高工会工作的透明度和民主性。"
  luoshisishichengongzuozhi: "落实四时辰工作制度"
  luoshisishichengongzuozhi_desc: "四时辰劳动，四时辰休息，还有四时辰属于自己！"
  guangzhougemingweiyuanhui:0 "广州革命委员会"
  guangzhougemingweiyuanhui_desc:0 "广州革命委员会成立后，迅速建立了完整的组织架构，涵盖领导与执行机构。其核心职能包括领导本地革命运动、组织武装起义及推动民主改革。为确保革命性质，仅允许经审核的革命组织加入。目前，委员会已邀请劳动会与同产工会参与新政府筹建工作。相信在各方共同的努力下，新生的革命统一战线定能将革命之火燃遍天下！"
  huisheyuzhengfu:0 "会社与政府"
  huisheyuzhengfu_desc:0 "在委员会政治架构中，大同会与政府的关系密切而微妙。政府作为委员会授权的执行机构，负责行政管理与政策执行。大同会作为委员会中的第一大会社，可以通过影响委员会决策来间接影响政府的工作。同时，政府中的许多位置也由大同会出身的公务员担任。"
  kuozhangshengyihuiquanli:0 "扩张省议会权力"
  kuozhangshengyihuiquanli_desc:0 "在当前的政治架构中，省议会作为地方民主的代表机构，其在政策制定、监督政府行为以及反映民众意愿方面扮演着重要的角色。然而，随着社会的不断发展和治理需求的增加，原有的省议会权利体系已经无法满足现代治理的需要。正是在这样的背景下，促使我们重新审视并扩张省议会的权利。"
  zaiyiyangdiguanxi:0 "再议央地关系"
  zaiyiyangdiguanxi_desc:0 "中央与地方的关系一直是政治体制中的核心议题。这种关系不仅涉及到权力的分配和运作，还直接关系到国家的发展和稳定。随着时代的变迁和社会的发展，央地关系也经历了多次的调整和变革。在当前的社会背景下，对央地关系进行再议，具有深远的意义。"
  qianghuaxianjiminzhu:0 "强化县级民主"
  qianghuaxianjiminzhu_desc:0 "在革命政府的新一轮政治架构中，县级民主得到了进一步的强化。为了确保政策的透明度和公正性，大同会积极推动县级民主制度建设，鼓励民众参与地方治理。通过定期举行民主选举，县级议会代表由民众直接选举产生，确保政府代表民意。相较于强化省级议会的权限，强县弱省的民主方式有利于强化革命政府的集中领导，同时实现基层民主的不断发展。"
  zhongyangjiquanzhizhengfu:0 "中央集权制政府"
  zhongyangjiquanzhizhengfu_desc:0 "中央集权制民主政府是一种独特的政治体制，它巧妙地融合了中央集权的高效决策与民主政府的民众参与。这种体制旨在确保国家权力的高度集中与统一，同时又不失民众的参与和表达。在中央集权制民主政府中，民众通过选举产生的代表参与国家事务的决策过程。这些代表来自不同的社会阶层和地区，他们代表着民众的利益和诉求，确保政策的制定更加公正、透明和符合民意。"
  junzhengxunzhengyuxianzheng:0 "军政、训政与宪政"
  junzhengxunzhengyuxianzheng_desc:0 "军政、训政与宪政构成完整的革命三段论，分别对应革命的不同阶段与核心任务。从军事主导的政权初创，到民众动员的政治教育，再到宪政框架下的民主治理。通过阶段性改革，最终迈向大同主义的理想社会。"
  tongyizhonghua:0 "统一中华"
  tongyizhonghua_desc:0 "是时候扫清各大割据势力，一同中华了！"
  jisuiyuxi:0 "击碎玉玺"
  jisuiyuxi_desc:0 "寡助之至，亲戚畔之。封建君主内阋于墙，为夺私利而内战不休，却连累天下百姓。自当吊民伐罪，彻底击碎压在万千百姓身上的“玉玺”！"
  xibeigongfa:0 "西北攻伐"
  xibeigongfa_desc:0 "威天下不以兵革之利。西北兵马强盛善战，冠绝当世，然其为争雄与天下，肆意榨取民脂民膏。如今民怨已起，海内鼎沸，纵使兵戈再强，也难抵御千万武装起来的人民！"
  zhaokaidatonghuijinjiquanhui:0 "大同会紧急全会"
  zhaokaidatonghuijinjiquanhui_desc:0 "大同会紧急全会的召开在严峻革命形势下尤为关键。随着革命斗争的深入，各种矛盾和问题逐渐凸显，形势日益复杂多变。大同会作为革命的核心力量，必须及时把握形势变化，作出科学决策，以应对各种挑战和考验。"
  zhaokaidatpnghuiguojihuiyi:0 "召开大同会国际会议"
  zhaokaidatpnghuiguojihuiyi_desc:0 "在当前国际形势错综复杂、革命斗争风起云涌的大背景下，召开大同会国际会议具有深远的意义和战略召开价值。这次全会不仅是对当前革命形势的深入分析和研讨，更是对未来革命战略和方针的全面部署和规划。"
  laizizhouraodezhichi:0 "来自周饶的支持"
  laizizhouraodezhichi_desc:0 "周饶，作为南洋大同主义者的核心，自古以来便是革命热情与理想的沃土。这片土地孕育了一批又一批为大同理想而奋斗的志士仁人，他们不仅在当地革命中扮演着重要的角色，更是本土革命中不可或缺的力量。"
  yuyanzhoufangmianzhankaihezuo:0 "与炎州方面展开合作"
  yuyanzhoufangmianzhankaihezuo_desc:0 "炎州，不仅是北美大同力量的核心聚集地，更是我们革命事业的重要支援对象。炎州以其强大的经济实力，无疑为我们的革命事业注入了强大的动力。在这片富饶的土地上，当地的大同主义者通过不断的努力与探索，积累了丰富的资源和财富。这些资源和财富不仅为我们提供了坚实的物质基础，更为我们提供了广阔的发展空间。"
  zhichilvsonggemingweiyuanhui:0 "支援吕宋革命委员会"
  zhichilvsonggemingweiyuanhui_desc:0 "支援吕宋革命委员会，是我们革命事业中的一项重要任务。吕宋作为本土与南洋革命的核心阵地，始终是战略关注焦点。吕宋革命委员会作为这一阵地的领导核心，肩负着组织动员群众、推翻旧制度的重任。唯有提供坚实支持，才能确保其有效履行职责，在吕宋点燃大同之火"
  zhichidatongdangsichuanzhibu:0 "支持大同党四川支部"
  zhichidatongdangsichuanzhibu_desc:0 "支持大同党四川支部，对于巩固和发展本土革命事业具有深远的意义。四川，作为中国的西南重镇，地理位置重要，人民力量雄厚，是大同党在全国范围内的重要据点之一大同党四川支部在这里扎根生长，以坚定的信念和不懈的努力，为中华的革命事业贡献着重要力量。"
  lianluomanlejiazhibu:0 "联络满剌加支部"
  lianluomanlejiazhibu_desc:0 "满勒加，这个位于南洋的重要港口城市，不仅地理位置优越，更是革命力量在南洋的重要据点。作为革命浪潮的重要地区，当地大同会在这里发挥着举足轻重的作用，他们与本土革命力量紧密合作，共同为推翻旧有制度、实现人民解放而努力奋斗。"
  lianluochangjianglinshiweiyuanhuizuopai:0 "联络长江临时委员会左派"
  lianluochangjianglinshiweiyuanhuizuopai_desc:0 "大同会革命正如火如荼地展开，长江临时委员会作为大同会的重要地方支部，在这一变革中扮演着举足轻重的角色。为了更好地推动革命的进程，加强内部团结与协作显得尤为重要。相较于一项与中央关系不睦的右派，以武汉为根据的左派无疑是我们更好接触的对象。"
  lianluochangjianglinshiweiyuanhuiyoupai:0 "联络长江临时委员会右派"
  lianluochangjianglinshiweiyuanhuiyoupai_desc:0 "尽管在此前的多次大同总会上，长江临时委员会右派都与我们的改革方针针锋相对。但其依旧是会社内乃至国内不可小觑的力量。如今革命的烈火已然点起，不论之前我们存在怎样的分歧，现在都应该携手并进，让大同之花开遍四野！"
  lianluoxinangonghepai:0 "联络西南的共和派"
  lianluoxinangonghepai_desc:0 "西南共和包含了许多组织，除了残存的大同会支部成员外，还包括其他共和主义者以及劳动会成员。如今西南局势动荡不堪，我们应当积极联络和支援西南共和派，从而保证我们北伐之时无后顾之忧。"
  chongzujicengdangzibu:0 "重组基层党支部"
  chongzujicengdangzibu_desc:0 "自武汉大同案以来，大同会的支部四散自立，历经多位总理却始终无法再实现真正意义的重整组织。如今借着革命的春风，我们必须要重组基层党支部，以为我们的革命提供真正坚实群众基础。"
  xinjunshiweiyuanhui:0 "新军事委员"
  xinjunshiweiyuanhui_desc:0 "革命战争推进之际，现有大同会军事部门已难适配扩大的战局需求。需立即组建军事委员会，吸纳各革命会社精锐人才，构建统一指挥中枢。此举旨在优化军事指挥体系，整合革命力量，确保行动协同性。新委员会将成为战略枢纽，以专业架构保障战场决策高效执行，同时凝聚各方理论，为革命胜利奠定坚实基础。"
  zhenduixingzhanshuyantao:0 "针对性战术研讨"
  zhenduixingzhanshuyantao_desc:0 "随着华南革命的烽火连天，七省联合的势力日益显现，成为了我们大同会革命道路上的一大挑战。为了更有效地应对这一复杂局面，我们必须对七省联合的军事策略进行深入研讨，制定出针对性的战术。"
  fadondihoujijindatongdangren:0 "发动敌后激进大同党人"
  fadondihoujijindatongdangren_desc:0 "随着华南革命的持续发展，七省联合对我们的革命事业构成了巨大的威胁。为突破当前困局，我方决定实施纵深破袭战略，派遣精干力量潜入长江流域，联络当地大同会骨干力量，协同实施武装暴动与破袭行动。"
  gemingzhihuoranbiandongnan:0 "革命之火燃遍东南"
  gemingzhihuoranbiandongnan_desc:0 "革命之火已经点燃，东南大地上的儿女们，让我们团结起来，共同投身于这场伟大的革命中。让我们用热血和生命，捍卫自由、平等、大同的理念，为了我们的家园和人民的幸福而努力奋斗！向七省联合宣战，我们将不畏艰险，勇往直前，直到最后的胜利！"
  zhaoxiangmingtingpanjun:0 "招降明廷叛军"
  zhaoxiangmingtingpanjun_desc:0 "随着革命之火的熊熊燃烧，明廷的统治已经岌岌可危。许多明廷的士兵和将领，在看清了明廷的腐败和无能后，选择背弃旧主，投身于革命的洪流中。然而，仍有一部分明廷的叛军，仍在负隅顽抗，执迷不悟。为了加速革命的胜利，我们决定向这些叛军发出招降的号召。"
  jiujunduizaijiaoyu:0 "旧军队再教育"
  jiujunduizaijiaoyu_desc:0 "对于那些曾经服务于旧军队的士兵们，单纯的招降并不足以使他们真正融入革命的大家庭。他们长期受到旧军队的思想和制度的熏陶，对于新的革命理念和制度需要一个适应和接受的过程。因此，我们决定启动一项针对旧军队士兵的再教育计划，旨在帮助他们转变思想，真正站在革命的一边"
  jianlidangdaibiaozhidu:0 "建立军队党代表制度"
  jianlidangdaibiaozhidu_desc:0 "军队作为革命的重要力量，必须有一个坚强的领导核心来确保军队始终走在正确的道路上。为了进一步加强党对军队的领导，确保军队始终与人民和革命保持一致，大同会决定在军队中建立党代表制度。党代表将作为党的代表，深入军队各级单位，与官兵们密切联系，了解他们的思想动态和实际需求，传达党的声音，引导他们坚定革命信念，积极投身到革命斗争中去。"
  gaibiannonghuibudui:0 "改编农会部队"
  gaibiannonghuibudui_desc:0 "农会部队作为革命的重要力量，必须得到改编和提升，以更好地适应革命斗争的需要。为了更好地发挥农会部队的作用，大同会决定对其进行改编。们将对农会部队进行系统的军事训练，加强官兵们的纪律观念，提高他们的作战技能。我们还将加强农会部队的思想政治工作，引导官兵们坚定革命信念，增强革命意识。使他们明确革命的目标和意义，激发他们为革命事业奋斗的热情和动力。"
  xishougongrenwuzhuang:0 "吸收工人武装"
  xishougongrenwuzhuang_desc:0 "工人武装作为革命的重要力量，必须得到充分的重视和整合。为了加强革命的统一战线，大同会决定积极吸收工人武装，共同为革命事业贡献力量。吸收工人武装，不仅可以壮大革命力量，还可以为革命事业注入新的活力和动力。"
  jiaqiangjunshixunlian:0 "加强军事训练"
  jiaqiangjunshixunlian_desc:0 "军事训练是提升战斗力、确保胜利的核心要务，必须被置于革命战略的首要位置。为此，军事委员会决定全面加强军事训练，通过战术推演、体能极限测试与战场模拟，铸就一支纪律如铁、意志如钢的革命军队。"
  gonghejunzhengguihua:0 "共和军正规化"
  gonghejunzhengguihua_desc:0 "共和军正规化建设是提升战斗力、彰显革命精神的关键。需优化组织结构，建立严格管理体系，明确指挥层级，确保高效传令与执行。同时健全纪律与规章制度，对违纪行为严肃问责，以铁的纪律保障军队秩序，为革命胜利奠定坚实基础。"
  zhangshaozengdehuopaolinian:0 "火力覆盖"
  zhangshaozengdehuopaolinian_desc:0 "张绍曾将军对火炮运用有独到见解与理论研究。他强调火炮精准度与火力集中原则，认为火炮不仅是战场毁灭性武器，更是胜负关键因素。其战术主张在多次战役中验证了集中火力撕裂防线、瘫痪敌纵深节点的实战价值。"
  dengkengdebubingzuozhanlilun:0 "步兵作战"
  dengkengdebubingzuozhanlilun_desc:0 "以邓铿为代表的一部分将领强调步兵在作战中的核心地位。他们致力于完善步兵战术体系，通过战场模拟与实战经验总结，为革命军提供科学指导，确保部队在复杂战场环境中保持战术优势与执行力。"
  qiulingshiyingxunlian:0 "丘陵适应训练"
  qiulingshiyingxunlian_desc:0 "东南多丘陵，丘陵地带的地形多变、地势险峻，对步兵部队的机动性、战术运用和官兵的体能都提出了更高的要求。因此，他主张通过系统的丘陵适应训练，使步兵部队能够在这种特殊地形中迅速适应、灵活行动，并发挥出最大的战斗力。"
  bubingwuqigengxin:0 "步兵武器更新"
  bubingwuqigengxin_desc:0 "随着科技的发展，新型的步兵武器具有更高的精度、更强的火力和更远的射程。这些先进武器不仅能够提高步兵部队的作战效能，还能降低官兵的伤亡率。因此，他主张积极引进和研发先进的步兵武器，以替代老旧、落后的装备。"
  qianghuatezhongzuozhan:0 "强化特种作战"
  qianghuatezhongzuozhan_desc:0 "特种作战具有高度的灵活性和隐蔽性，能够在关键时刻发挥关键作用。应当加强特种作战人员的选拔和培训，确保他们具备卓越的身体素质、战术素养和心理素质。同时，还需要注重特种作战装备的研发和更新，以满足特种作战人员在高强度、高风险任务中的需求。"
  xiandaihuadesanbingzuozhanlinian:0 "现代化的散兵作战理念"
  xiandaihuadesanbingzuozhanlinian_desc:0 "现代化的散兵作战理念是一种灵活、机动且高度适应性的战斗方式。现代化的散兵作战理念中，散兵不再仅仅是乌合之众，而是被视为一个具有严谨作风与纪律的作战单位。他们接受专业的训练，具备高超的射击技能，能够在复杂多变的战场环境中迅速适应并作出反应。同时，散兵也注重与其他军种的协同作战，以发挥最大的战斗力。"
  qingnianfeixingyuanweiyuanhui:0 "青年飞行员委员会"
  qingnianfeixingyuanweiyuanhui_desc:0 "青年飞行员委员会是一个充满活力和创新精神的团队，致力于推动青年飞行员的培养和发展。该委员会由一群热衷于航空事业的年轻人组成，他们具备卓越的专业素养和领导才能，致力于为青年飞行员提供一个优质的成长平台。作为大同会的外围组织，其本身为共和空军提供了第一批飞行员种子。"
  kaochajiujunguan:0 "考察旧军官"
  kaochajiujunguan_desc:0 "在构建革命空军的过程中，教官的来源是至关重要的。为了确保革命空军的专业性和战斗力，我们深入考察了明帝国旧空军军官。这些军官在明帝国的空军体系中积累了丰富的经验和知识，他们的加入将为我们的革命空军注入新的活力和专业性。"
  tibagemingganbu:0 "提拔革命干部"
  tibagemingganbu_desc:0 "我们重视共和空军军官的选拔工作，通过严格的考核和面试，挑选出那些具备专业素养、忠诚于革命事业的革命空军干部。他们的飞行经验可能不够丰富，但基本熟悉空军的组织架构和战术运用，更重要的是其本身革命意志是经过多次考验的，这对于我们快速构建一支高效的革命空军具有重要意义。"
  kuodahangxiaozhaosheng:0 "扩大航校招生"
  kuodahangxiaozhaosheng_desc:0 "为适应空军快速发展需求，我们决定扩大航校招生规模，吸引更多青年才俊。在适度放宽年龄学历门槛的同时，将强化招生监管，确保学员具备基本文化与身体素质，为飞行训练筑牢基础，为革命空军持续注入新鲜血液。"
  chenglihangxiaozhuanjiazu:0 "成立航校专家组"
  chenglihangxiaozhuanjiazu_desc:0 "为了进一步提升革命空军航校的教学质量，培养更多优秀的飞行员，我们将成立航校专家组。这一举措旨在汇聚业内精英，为航校的教学、管理和科研提供强有力的专业支持。专家组将由国内外知名航空专家、资深飞行教官和军事战略家组成。他们将在航校的教学体系、课程设置、训练方法等方面提供宝贵的建议和意见，确保航校的教学质量和水平达到行业领先水平。"
  kuojianjichang:0 "扩建机场"
  kuojianjichang_desc:0 "为了适应革命空军日益壮大的规模和日益频繁的作战需求，我们决定全面启动机场扩建工程。此次扩建工程将全面提升机场的容纳能力和保障水平，为空军部队提供更为坚实的后勤保障。扩建工程将涵盖跑道、停机坪等多个关键设施的建设和改造。我们将对跑道进行加长和加固，以满足更多机型的起降需求。同时，停机坪也将进行扩建，以容纳更多战机的停放和维护。"
  hangtianqijianzaochu_desc:0 "革命政府将成立航空器监造处，确保空军航空器质量与安全。该机构将全面监督设计、制造、试验环节，严格遵循国家标准，把控制造过程与性能标准。同时，监造处将与国内外知名制造商及研究机构合作，引进先进技术与管理经验，推动航空器制造水平持续提升，为革命空军提供可靠装备保障。"
  hangtianqijianzaochu:0 "航空器监造处"
  kongzhonghouqinxian:0 "空中后勤线"
  kongzhonghouqinxian_desc:0 "为了确保空中作战的持续性与高效性，革命空军正全力打造一条高效、可靠的空中后勤线。这条后勤线将为作战部队提供及时的物资补给、装备维修和医疗救助等关键保障，确保他们在执行任务时能够始终保持最佳状态。"
  zhengbiangeminghaijun:0 "整编革命海军"
  zhengbiangeminghaijun_desc:0 "为了全面提升革命海军的战斗力和综合实力，我们决定进行全面整编。此次整编旨在优化海军的组织结构，提高指挥效率，同时加强装备更新和人员培训，确保革命海军成为一支强大的海上劲旅。"
  geminghaijundefazhanfangxiang:0 "革命海军的发展方向"
  geminghaijundefazhanfangxiang_desc:0 "随着国内外形势的深刻变化，革命海军肩负着更为重要的历史使命。为确保国家海洋权益和海上安全，革命海军必须明确其发展方向，不断提升综合战斗力。"
  linjianzhangdehaihanglilun:0 "海航理论"
  linjianzhangdehaihanglilun_desc:0 "林建章作为海军航空战略领军人物，以其为代表的海航理论在军事领域有着极大的影响力。相关理论认为航母是未来海战核心，主张通过舰载机远程打击与灵活战术压制敌方海上力量，构筑空中霸权保障海洋安全。他们强调航母集成海空陆作战力量，形成强大综合战力，这种理论为现代海战提供了全新的战术框架。"
  guoyingnongcyunongyegonghui:0 "国营农场与农业工会"
  guoyingnongcyunongyegonghui_desc:0 "大规模机械化农业生产是农业发展的未来，也是我们实践大同理想的必由之路。相较于其他地区，岭南地区的农业大生产程度无疑是最高的，连片的国、私农场构建起有别于其他地区商品经济农业体系。在之前改制的基础上，我们将通过国营农场和农业工会，彻底控制华南地区的农业生产，为我们的革命事业提供坚实的物质基础！"
  tuidongnongyehezuoshefazhan:0 "推动农业合作社发展"
  tuidongnongyehezuoshefazhan_desc:0 "我们开展土地改革，给农民分配土地并非是为了回归小农经济。在限制土地交易，预防土地兼并的基础上，大同会还制定了系统的农业合作化计划。通过政府的资金、政策和技术扶持，以合作化的方式将原本松散的自耕农们组织起来，迈向华南农业的明天！"
  tuidongxiangcunjiansheyundong:0 "推动乡村建设运动"
  tuidongxiangcunjiansheyundong_desc:0 "“乡村建设运动”是对大同会推行的一系列农业农村改革政策的统称，而其中的核心便是第一个“农业五年计划”。其中包含了从乡村基础设施、农业育种、化肥引入、粮食销售等众多措施，每一项都需要仰赖革命政府的扶持。尽管我们目前正处于革命的关键过程，但是如果能分出部分经力量来推进乡村建设运动，那么解放出的农民一定能成为我们革命事业最重要的助力！"
  kuojianguangzhoudaxue:0 "扩建广州大学"
  kuojianguangzhoudaxue_desc:0 "广州的高校体系历来是大同会经营的重点，许多高校都在“大同禁令”时期对于大同会成员伸出了援手。在革命政府的新一轮建设规划中，我们将从扩建广州大学开始，推动岭南教育研究体系更上一层楼！"
  huaxiafazhanzhanlue_desc:0 "华夏发展方略，是著名大同理论家孙文领衔编纂的大同会政治、经济、文化建设草案。《华夏发展方略》作为国家繁荣与进步的全面指导，旨在为国家制定一套系统、科学、可持续的发展规划。它不仅仅关注经济增长，更注重文化进步、农工权益、社会平等等多个方面。为了实现这一目标，我们需要从以下几个方面来充实和完善华夏发展方略。"
  huaxiafazhanzhanlue:0 "华夏发展方略"
  datongzhuyizaisikao:0 "大同主义再思考"
  datongzhuyizaisikao_desc:0 "随着革命连战连捷，我们统治的区域愈发广大，革命的实践也愈发深入。面对革命实践所带来的反馈，都要求我们必须走出原本思想混乱的局面，真正确立起我们在革命和未来执政时期的总路线，以团结我们的革命力量，为其指明未来的方向。"
  disanjiedatonghuiquanhui:0 "第三届大同会全会"
  disanjiedatonghuiquanhui_desc:0 "革命即将胜利了！我们是时候召开新一届大同会全会，决定我们的未来了！"
  qinglianghuapaobing:0 "轻量化炮兵理论"
  qinglianghuapaobing_desc:0 "轻量化炮兵理论提出，传统炮兵因笨重与移动缓慢难以适应现代战场需求。该理论核心在于平衡灵活机动与火力压制，主张炮兵需具备快速部署能力，同时保持强大火力覆盖。理论强调战场布局中应合理配置轻量化炮兵部队，使其能迅速占领有利地形，并在关键时刻实施精准火力打击，以实现战术纵深突破与战场主动权争夺。"
  huopaojishugexin:0 "火炮技术革新"
  huopaojishugexin_desc:0 "作为火炮作战的专家，张绍曾对于火炮技术的革新持有极高的热忱和独到的见解。他深知，在革命战争中，火炮技术的先进与否直接关系到战争的胜负。因此，他致力于推动火炮技术的不断创新和升级。"
  yuanjulihuoliyazhi:0 "远距离火力压制"
  yuanjulihuoliyazhi_desc:0 "远距离火力压制不仅是远程射击，更是需要精密策划与执行的战术艺术。该理论强调，准确掌握敌方部署与动态是选择压制时机与目标的前提，因此要求炮兵部队与侦察部队紧密协作，实时获取战场情报，以优化火力决策。这种结合技术精度与情报支持的战术，能够最大化火力效能，同时减少资源浪费与误伤风险。"
  jizhidehuoli:0 "极致的火力"
  jizhidehuoli_desc:0 "火力的持续性和压制性是火炮使用的关键，通过密集的炮火覆盖和连续的射击，使敌方无法抬头，从而牢牢掌握战场的主动权。为了实现极致的火力，需要引进和研发先进的火炮和弹药，提高射击的射程、精度和威力。应当注重炮兵部队的训练和配合，通过严格的训练和实战演练，培养出一支具备高超射击技艺和协同作战能力的炮兵队伍。"
  jiangxianyundezhuangjialilun:0 "装甲理论"
  jiangxianyundezhuangjialilun_desc:0 "蒋先云，这位杰出的军事战略家，对于装甲力量的运用和发展有着独到的见解和前瞻性的理论。他深刻认识到，装甲部队作为现代战争的重要力量，其独特的机动性和火力优势能够为战争胜负带来决定性的影响。"
  zujianxinshizhuangjia:0 "组建新式装甲部队"
  zujianxinshizhuangjia_desc:0 "组建新式装甲部队将是革命军事力量转型的关键一步，对于提升整体战斗力、实现战争胜利具有决定性的作用。\n新式装甲部队应以现代战争的需求为导向，注重装备的先进性和作战的灵活性。要引进和研发具有世界先进水平的装甲车辆，包括主战战车、装甲输送车、自行火炮等，确保部队在火力、机动和防护等方面都具备显著优势。"
  zhuangjiajishuyanjiu:0 "装甲技术研究"
  zhuangjiajishuyanjiu_desc:0 "装甲技术研究需聚焦前沿技术突破，鼓励军民融合研发新型装甲材料与高精度武器装备，提升装甲部队生存力与打击效能。研发过程须以实战需求为核心，通过与一线部队协同优化，建立战场反馈机制，确保技术成果能在复杂战场环境中实现效能最大化。"
  kuaisutujin:0 "快速突进"
  kuaisutujin_desc:0 "快速突进战术的核心在于迅速突破敌方的防线，打乱其战略部署，制造敌方的混乱和恐慌。他强调，通过快速而灵活的机动，可以迅速占领敌方的重要目标和战略要地，从而掌握战场的主动权。"
  zhengmianxiangdi:0 "正面向敌"
  zhengmianxiangdi_desc:0 "正面向敌不仅是一种战术选择，更是一种信心和决心的体现。在战场上以强大的正面攻势直接对抗敌人，用火力和机动性压制敌方的反击，迅速取得战场上的优势。正面向敌需要强大的装甲和准确的判断，只有在充分了解敌方实力和意图的基础上，才能制定出有效的战术和策略。"
  peixunshifeiyuan:0 "培训试飞员"
  peixunshifeiyuan_desc:0 "随着革命空军装备的不断更新和升级，对试飞员的需求也日益迫切。为了确保新装备的性能得到全面检验，同时培养一批高素质的试飞员，我们决定全面启动试飞员培训计划。该计划将针对有志于成为试飞员的年轻飞行员展开，通过系统的理论学习和实践操作，使他们掌握试飞的基本原理、技术要求和操作规程。"
  kongjundazhongduiyanxi:0 "空军大中队演习"
  kongjundazhongduiyanxi_desc:0 "为了检验和提高革命空军大中队的协同作战能力，一场规模空前的联合演习今日盛大展开。此次演习旨在模拟实战环境，全面检验空军大中队在各种复杂条件下的作战能力和应变能力。演习中，各大中队将按照实战要求，展开空中进攻、防空作战、侦察支援等多个科目的演练。参演人员将全力以赴，紧密协作，确保演习的顺利进行。"
  hailujiezaiwomentiankongzhixia:0 "海陆皆在我们天空之下"
  hailujiezaiwomentiankongzhixia_desc:0 "辽阔的天空之下，每一寸革命热土都在革命空间的守护之中。战机翱翔天际，巡视陆海全域，确保人民的利益不受侵犯。让敌人深知革命空军无可匹敌，我们将以必胜的决心，为人民的安宁而战。"
  haijunzuozhanmoshigexin:0 "海军作战模式革新"
  haijunzuozhanmoshigexin_desc:0 "随着科技发展与战争形态演变，航母凭借独特战略地位成为海军作战模式革新的核心。航母编队通过舰载机远程打击、快速机动与灵活战术，整合空海陆作战力量，形成多维立体作战体系。通过与潜艇、驱逐舰及特战分队协同作战，实现对敌方海上力量的高效压制，确保复杂战场环境下的制海权争夺优势。这种新式作战框架为现代海军提供了全新的战术演进路径。"
  haijunhangkonmgdafazhan:0 "海军航空大发展"
  haijunhangkonmgdafazhan_desc:0 "海军航空力量正成为未来海战的关键角色，其全面发展体现在舰载机升级及航母等海上平台的建造运用。这些装备拓展了海军作战空间并增强了空中支援能力，覆盖远程打击、近空防御及侦察巡逻等多维需求，为海军提供全方位的作战支持，成为现代海战体系的核心支柱。"
  shengjitianjihangmu:0 "升级“天级”航母"
  shengjitianjihangmu_desc:0 "随着科技突破与海军战略不断深化，"天级"航母正迎来全面升级的历史性时刻。升级将聚焦舰载机更新换代与舰体结构优化，新型舰载机将具备更强作战能力与更远作战半径，为编队提供强大空中支援。舰体结构优化将提升航母的稳定性和机动性，确保复杂海况下的作战能力。"
  yangshuzhuangdejujiangouxiang_desc:0 "杨树庄作为海军战略思想的重要人物，以其为代表的海军军官提出了以战列舰为作战核心的“巨舰构想”。他们主张打造庞大坚固的战列舰，装备强大火炮与坚固装甲，以无与伦比的火力和防御力成为海上无敌力量。其理论强调战列舰的历史地位与战略价值不可忽视，通过升级与改进，使其在未来海战中发挥重要作用，确保国家在海洋领域的绝对优势。"
  yangshuzhuangdejujiangouxiang:0 "巨舰构想"
  zunzhongshijiedazhanjingyan:0 "尊重世界大战的经验"
  zunzhongshijiedazhanjingyan_desc:0 "在上一次世界大战中，战列舰作为海上战争的基石，凭借强大火力与坚固装甲，取得了杰出的战争成果。因此，以战列舰为核心重建舰队，不仅是对历史的尊重，更是应对未来挑战的明智选择。为实现这一目标，需集中资源强化战列舰设计与建造能力，同时提升舰队其他舰艇的协同作战能力，确保整体战力在复杂海战环境中保持优势。"
  dajianyujupao:0 "大炮与巨舰"
  dajianyujupao_desc:0 "大炮与巨舰作为海上力量的基石，自古以来便是捍卫国家海洋权益的重要象征，彰显国家实力与威严。在新式海战时代，传统巨舰通过模块化改造与精准火力投送，持续为国家海洋战略提供硬实力支撑。它们依然是维护海洋权益、保障海上通道安全的中坚力量。"
  shejixinshanjizhanliejian:0 "设计新“山级”战列舰"
  shejixinshanjizhanliejian_desc:0 "随着各类新技术的突破，我们也将尝试设计全新“山级”战列舰。该战列舰融合经典设计与新型技术，以坚固舰体搭载新型主炮与副炮，具备更强的远程打击能力。同时配备多层防御体系，确保复杂战场环境中的绝对优势。作为海上力量的中坚，其模块化设计可快速适应新式作战需求，为国家海洋战略提供硬实力支撑。"
  kuojianhaijunjidi:0 "扩建海军基地"
  kuojianhaijunjidi_desc:0 "随着国家海洋战略的深入实施，扩建海军基地已成为一项紧迫而重要的任务。海军基地不仅是海军力量的聚集地，更是国家海洋战略的重要支撑点。通过扩建海军基地，我们能够进一步提升海军的作战能力和战略威慑力，确保国家海洋权益的安全与稳定。"
  datonggemingzhihuakaibiansihai:0 "大同革命之花开遍四海"
  datonggemingzhihuakaibiansihai_desc:0 "随着大同革命的浪潮汹涌澎湃，海军的力量如同革命之花一般，开遍四海，绽放全球。海军，作为国家的海上长城，承载着保卫海洋领土、维护海洋权益的重任，在海军的护航下，革命之花将在全球绽放得更加灿烂！"
  bashuzhiguo:0 "巴蜀之国"
  bashuzhiguo_desc:0 "固国不以山溪之险，山川之利难当革命浪潮。"
  hengsaoxinan:0 "横扫西南"
  hengsaoxinan_desc:0 "域民不以封疆之界。革命之火，暴政虽在远在西南亦当除之。"
  dongbeiwenti:0 "东北问题"
  dongbeiwenti_desc:0 "关外万里沃土，不知谁主沉浮？"
  gemingdetongzhi:0 "革命的同志"
  gemingdetongzhi_desc:0 "掌控关外的是我们的革命同志——同产工会的武装。时至今日，我们应当积极与其开展联络，共同粉碎关内的反动势力，实现人民解放！"
  yueguoshanhaiguan_desc:0 "关外的反动势力镇压了我们的革命同志，但革命之火却并不会因此熄灭。如今革命烈火再度烧向山海关外，这些反动军队又该如何自处呢？"
  yueguoshanhaiguan:0 "越过山海关"
  jiefangmobei:0 "解放漠北"
  jiefangmobei_desc:0 "大同之花开于塞上！"
  zhonghuayongyuangonghe:0 "中华永远共和！"
  zhonghuayongyuangonghe_desc:0 "独裁暴君终将被彻底扫进历史的的垃圾堆，而在玉玺残骸之上重新建起的，将是属于人民的“共和”之印！"
