 ROC_minister_agenda.51.t:0 "灌溉沟究竟属于谁"
 ROC_minister_agenda.51.d:0 "萧铮把新税册和县图并排摊开，指着那条灌溉沟：“县图上，这沟划给了祠产，几户实际耕作的，倒成了无地户。”测绘员答：“沿用的是旧图，沟线一直这么画。”萧铮又翻出地主那张旧契：“只写‘沟北三亩’，连四至都没有，这契怎么认？”测绘员说：“旧契归旧契，图归图，两下不一致，只能按图。”\n\n中央经济会议里，大同党右派中维护产权的商户和地主担心暂停催税会削弱现有凭证的权威；萧铮若按下暂停令，就借用了本派的信用，即便得到部分支持，也要承受更多反对。村社共同校图给中派一个复核位置，让市场方向的办法继续待议，但右派得容忍县档之外的凭据进入卷宗。沿用县档则保住原先程序，争议留待下一轮。\n\n一位寡妇带来一张保存十年的水费收据，背面盖着县公所的旧编号。测绘员对着旧底图一查，脸色变了：“这编号对应的是洪水前的老沟线，现在这张县图，抄错了。”地主代理人起身：“代缴水费，不等于承认耕作权。”萧铮没接，只问测绘员：“复测要几天？经费还剩多少？”对方答：“测绘队只剩一天食宿，财政处又催着这个月评完税。”\n\n萧铮把旧契、收据、县图收拢：“现在停征，县库修渠款会断；只认印章最齐的那份契约，小农既失地又失信用；可每张私人收据都能改产权，地籍就稳不住。”地主代理人插话：“县档是既有的，改动牵连太广。”萧铮看着那张旧编号：“旧编号只能证明地图画错过一条沟，那片田最后归谁，不靠一张收据说了算，也不靠一张图说了算。”"
