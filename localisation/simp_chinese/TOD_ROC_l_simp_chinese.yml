 ROC_ma_story.502.t:0 "名册以外的座位"
 ROC_ma_story.502.d:0 "耕作者登记已经完成，所有权与实际耕作分栏，佃户和女户主都在册中。中央信贷评议会准备增设耕作者席位，递来的候选名单却被退回：评议会说只有产权人能证明信用，税务处却早已凭同一份耕作记录寄出了缴费通知。萧铮问：“登记足以让人缴费，为何不足以让人坐下说话？”\n\n大同党中派代表说，缴费与评议属于不同程序，不能把入册直接当成贷款担保。左派代表同意两者不同，但指出席位只是讨论资格，并不会自动给候选人发贷款。右派代表内部也有分歧：小农希望有熟悉耕作的人参与讨论，部分地主则担心佃户在评议会上提出租约问题，让产权争议混入信贷审查。\n\n秘书把评议会章程读到“代表应熟悉借贷实际情况”时，银行代表提出，熟悉田地不等于熟悉借贷。女户主候选人的书面陈述随即被念出来：她曾按期偿还农具款，担保人为合作社，借据却登记在亡夫名下。银行代表承认她知道怎样还钱，但仍希望先核清谁对借据负责。\n\n财政处提出沿用原席位，等候选资格说明统一后再议补选，不影响已有登记；补充查验借据和耕作记录则要拨人手，也会让评议会更快听到新登记者的意见。中派代表建议让税务、信贷和农务人员共同复核候选资格，但不愿承诺每一笔费用都由中央承担。\n\n萧铮请各方把税务处使用登记的依据和评议会退回名单的理由写在同一份会议记录里。秘书问，候选人能否收到记录副本；银行代表说自然可以。她又问能否请候选人对记录提出意见。代表停了一会儿，答：“如果只是意见，而不是评议，应该可以。”"
