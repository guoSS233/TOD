 ROC_ma_story.104.t:0 "验收章的午休"
 ROC_ma_story.104.d:0 "货到款清的办法已经实行：验收单、仓单和付款日期对齐，无争议货款依约支付，争议批次另行复核。医院收到首批稻米后，中央采购科却把一只印章锁进柜子，宣布“保管人午休，下午才能确认是否存在争议”。于树德问，米既已验收，为何还需要确认；科长答：“正因为验收很顺利，我们才更需要确认。”\n\n秘书查明，这枚章本来只供争议批次使用。采购科把它盖在所有单据背面，就能以“待确认”为由控制付款次序。合作社账房说，无争议款项按新办法已经陆续到了，但第二批粮的搬运工还等着结钱；船行代表也不想推翻新规，只担心每批货都被拉进争议程序。\n\n大同党中派财政代表劝部长照章继续付清已确认款项，采购科的问题留待例行检查，省得几个处争权拖住其他事务。左派代表希望社员与采购科共同复核争议货物，免得章只往付款一边盖；右派商户则愿意出人协助，却要求中央对临时垫款有明确时限。各方都赞成不耽误医院吃饭，对谁决定“耽误”却各有看法。\n\n科长提出一个更妥当的办法：凡无争议者，先请采购科证明无争议；凡有争议者，更应请采购科证明有争议。秘书翻出部长上月签过的实施细则，念到“经仓库与收货方核验即付”便停下，问：“您的证明排在什么地方？”科长接过细则，恭敬地指出两段之间有一条足够盖章的空白。\n\n于树德请保管印章的人提前结束午休，把柜子打开。柜里除了章，还有一摞已经付清的收据，采购科正准备为它们补盖“付款前确认”章。医院代表笑着说，若此章真能回到付款之前，能否顺便把上周欠的饭也送回来。科长这才答应，先听部长说明争议复核究竟归谁。"
