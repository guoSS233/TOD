 ROC_focus_sanpai_desc:0 "广州革命委员会是广州革命政府的最高统治机构。大同会居于主导地位，众多革命友党共同参与，围绕政府组织、施政纲领与革命进程展开议事。各方在共同目标下维系联合，也借议程、质询与表决争取自身主张。经济部长的方案须面对这一权力中枢的审视；会场上的妥协与阻挠，往往决定政令能否落地。"

