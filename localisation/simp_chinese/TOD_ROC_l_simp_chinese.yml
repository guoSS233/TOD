 ROC_ma_story.304.t:0 "照片的资格"
 ROC_ma_story.304.d:0 "中央核查组已经去过工地，记录了未完护栏、材料与欠薪，正式审计员也在报告上签了字。阮啸仙准备据此安排后续审查，工务处却递来一份异议：照片由借调人员拍摄，不应作为正式审计材料。“报告签字的人有资格，”处长客气地说，“按快门的人未必有。”\n\n核查组负责人解释，借调的工头熟悉工地，负责指认照片位置；正式审计员在场核验并签字。工务处并非否认护栏缺失，而是担心照片未经注明日期，无法证明缺失发生在哪个付款节点。这个疑问有实际意义：若缺口是在核定之后被洪水冲坏，承包商和工人的责任就不同。\n\n大同党左派监督人员要求把现场材料交给追责小组，不让资格争执拖住工人领款；中派主张先核照片拍摄日期，免得错误指控损害整个审计。右派承包代表支持核查，但指出自己的旧领料单上也有日期错误，若所有证据都按同一缺陷排除，工程处的付款凭据也得重审。处长立即说，财政凭据与照片性质不同。\n\n秘书从卷宗里抽出核查当日的出差单，上面盖着工务处印章，注明“陪同拍照并指认工程位置”。原来处长的副手也在现场。处长解释，他的副手只是陪同，并未负责看护栏。核查组负责人忍不住说：“他确实没有看护栏，一直在提醒我们不要踩湿鞋。”秘书请处长确认，陪同的资格是否也需要一份证书。\n\n阮啸仙把已经核实的现场结果保留下来，请各方商议照片补证、工地复核和追责权限。处长同意先核日期，提出由本处保管底片；工头问若底片在工务处，审计员能否随时借阅。处长说当然可以，申请表他已经带来了，只是借阅理由须由工务处先行解释。"
