  ROC_decision_bop_left_fcsyqy_desc:0 "民营企业申请定向信贷，采购款迟迟未到账。大同党三派代表在中央会议上争论信贷担保、职工监督和坏账责任。"
  ROC_decision_bop_left_jqmysc_desc:0 "民生产业促进会提交工艺改进与设备清单。三派代表围绕技术收益如何分配、公共投入如何核验交锋。"
  ROC_decision_bop_left_clgq_desc:0 "数家国营单位重复采购、长期亏损，裁并牵涉工人安置与公共服务。三派争论节省的资金投向何处、由谁决定。"
  ROC_decision_bop_right_qhgh_desc:0 "工会要求参与国企排产和安全监督，厂方担心停产责任无人承担。三派须划清职工查账权限与生产指挥边界。"
  ROC_decision_bop_right_ssjm_desc:0 "数家国营工厂请求减税更新设备，财政处担心收入缺口扩大。三派就减税对象、采购公开和验收标准交涉。"
  ROC_decision_bop_right_sqgyh_desc:0 "重点产业寻求民间资本扩产。三派围绕经营权、工人监督与投资风险分担争论合作条件。"
