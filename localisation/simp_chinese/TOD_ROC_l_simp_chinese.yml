 ROC_ma_story.506.t:0 "交接箱里的春耕"
 ROC_ma_story.506.d:0 "更正后的地籍和贷款文书已经发出，农户收到的是具体答复，不再只是等待复核的回条。中央财政处却提前准备起部长交接清单：有些文书要求后续核验，有些贷款约定春耕前答复补充材料，清单只写了“移交下届”。萧铮问：“移交的是材料，还是办完材料的责任？”秘书说，表上只留了一个箱子的编号。\n\n大同党中派代表希望按程序逐件核交，避免现任部长替未来预算作出无凭据的许诺；左派担心等交接完毕，农户错过买种子的日子。右派内部也不一致：小农代表希望期限写明，银行代表支持交接，却要求区分已确认贷款和仍需补件的申请，免得一句“全部照办”使未核实的担保也被视为已经批准。\n\n秘书拆开一份已经送达的更正文书：沟线已改，借款人还需补交合作社担保人的确认。财政处把它放进“已答复”箱，农务厅却把同一件事列为“待办”。两处都没有错；若只移交箱子，继任人很可能以为事情已经办完。萧铮请经办人把下一步、期限和负责处室写在同一页，而不是重发一张更正证明。\n\n财政代表说，逐件写清需要人手，赶办急件还要动用现有的差旅经费。银行建议由其统一通知借款人，但要求农务厅先核担保；农务厅希望银行同时告知可能的补件期限。左派代表要求把有明确时限的答复先列出来，中派则坚持未获批准的支出不得伪装成承诺。争执之中，秘书把箱子的钥匙放在桌上，提醒大家钥匙本身不会答复任何人。\n\n萧铮要求保留已经发出的文书，并请各方区分已批准事项、待补材料与尚待预算的请求。银行代表终于同意在通知中写明联系人，农务厅也答应提供耕作记录。秘书重新贴好交接标签，在“箱号”旁添了一栏：“下次应由谁回信。”"
 ROC_ma_story.506.a:0 "交接急件先办，余项逐项核交"
