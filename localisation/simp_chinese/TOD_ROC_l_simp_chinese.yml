 ROC_ma_story.301.t:0 "退回哪一栏"
 ROC_ma_story.301.d:0 "重复列支的石料款已经稽核清楚：救灾修路和军需运输用的是同一批材料，不能各报一遍。阮啸仙刚向中央会议报告结果，财政处便送来两份请款书，分别要求把多列出的额度退还自己。“账已经对了，”处长解释，“现在只剩下谁有权使用对出来的钱。”\n\n军需代表说，运输道路仍要养护，若额度退给救灾，下一批粮车就无钱雇人修路。救灾人员则指出，最初是救灾预算垫付石料，附近村民等着修堤，额度回到原处才说得过去。大同党左派的工会代表支持及时公开责任，但提醒部长，救灾一栏的经手人也是左派推举的；要查明来龙去脉，就不能只问军需处。\n\n中派财政代表提出，把重复额度先列作待分配余额，等下季一并审议。这样不用推翻已经确认的稽核结果，却会让两个地方继续为同一笔钱排队。右派中的运输商会建议优先维持道路，愿意按原合同运粮；商会并不否认救灾需要，但警告说修路款若断，空着的仓库不能替运粮的人领工资。\n\n秘书打开两份请款书，发现财政处已在每份末页预印“经部长批准”，差的只是哪一份拿去盖章。处长解释：“无论部长选哪一边，我们都替您省了一次誊写。”阮啸仙请他再印第三份，把各处曾经批准重复列支的签名列进去。处长有些为难：“那样就不只是分配问题了。”部长答：“原来这笔钱会自己填两次表，确实值得单独表扬。”\n\n会议最后讨论的是，保留已核结果的同时，由谁承担后续支出与解释。秘书抱走两份请款书时，处长追出来说，希望部长至少先确定纸张应列在哪一栏。秘书答：“这次只有一份纸，您尽管放心。”"
