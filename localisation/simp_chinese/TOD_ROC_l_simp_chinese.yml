 ROC_ma_story.504.t:0 "布告旁的小字"
 ROC_ma_story.504.d:0 "贷款资格、担保、期限和利率已经公开，合作社也按章登记借还。银行随后发出一份办理说明，在“实耕”旁补了“家庭主要劳动力持续在场”。中央农务厅收到询问：外出做短工的女户主是否因此不能申请？说明没有明说排除谁，柜台却开始要求所有人提供额外证明。\n\n银行经理辩解，这项说明是为判断还款能力，并非修改公开资格。大同党左派代表指出，临时外出挣钱也可能是还款来源；中派代表同意原承诺应继续执行，却担心未经核验便认定每个申请都能偿还，会让担保责任落到合作社。右派小农代表要求中央说清，证明耕作与证明人始终留在田里究竟是不是一回事。\n\n秘书找来一份已办妥贷款的卷宗：借款人农忙时耕地，农闲替人修船，按期还了第一笔。经理承认她符合条件，但说柜台需要统一说明，不能靠每位职员自行判断。萧铮问：“既然她符合，为什么说明让她再证明自己没有离开过？”经理回答，说明的本意是防止有人只借他人的名字申请。\n\n这个担忧并非无端。合作社会计提议核对耕作记录与实际担保，发现冒名再复核，而不把额外证明压到所有人头上。财政处说抽查要差旅费，还要约定谁答复被拖延的申请；银行则要求中央承担解释口径不清造成的工作量。各方都不想撤回已公开的贷款条款，争的是能否用一张解释单改变人们进入柜台的条件。\n\n萧铮请秘书把已公布的资格放在解释单上面，让经办人员先读原文，再读补充说明。经理问这是否意味着说明无效；部长说，它至少不能大过原文。秘书把两页订好，故意让资格那页露出边角，银行代表看了看，说这次装订倒很方便。"
