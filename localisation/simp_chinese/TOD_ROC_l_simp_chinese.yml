ROC_pingheng.9999.d:0 "第二个“三年经济建设”时期已经顺利完成，经济整体实现了显著增长。社会经济的各个方面正持续向大同社会迈进，随之而来的新一轮建设需求已经摆在面前。接下来应当实行什么样的经济政策，是我们必须作出决定的问题。"
