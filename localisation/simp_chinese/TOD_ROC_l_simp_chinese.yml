 ROC_characters_lizhun: "李准"
 ROC_characters_lizhun_desc_leader: "李准是少数以海军身份转任陆军，最终升迁至一方军区都督的人。除了其杰出的能力之外，其对于皇室无语伦比的中心可能也在这一过程中起到了重要作用。在欧战之后，朝廷一改后明建立以来反对因言获罪的传统，推行了十分严格的党禁政策。通过采取秘密审讯、刑讯逼供、株连亲人等一系列残忍的手段，对于包括大同会和同产工会在内的许多反对势力进行了残酷的镇压。但这些残酷的政策，也导致许多官员在执行过程中存在故意放水的现象。但在一众官员中，李准严格地执行了相关地政策法令，并且凭借着杰出的相关政绩效果迅速得到朝廷的欣赏，并一路做到了华南军区大都督的位置。"
