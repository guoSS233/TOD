 ROC_minister_agenda.21.t:0 "被洪水改写的县界图"
 ROC_minister_agenda.21.d:0 "投影灯下，晏阳初把北江的地亩图和一张航测草图叠在一起，两边的田埂水沟对不齐。他问测绘队负责人：“这底图是哪一年的？”负责人答：“前年的航测草图，洪水改了沟，一直没拨钱复测。”晏阳初又问农务厅官员：“税按哪张图寄出去的？”对方说：“按新图寄的，已经到农户手里了，有一户小农的贷款还跟着面积涨了。”\n\n中央县级调查开始后，大同党中派主持核税，冻结争议税册须撤回已发的通知，经手人要在更正栏签字认错；晏阳初借走的是他们多年积下的信用。测绘员、农户和县署共同校图，既能提供退税证据，也给产权主张留下复核凭据，只是复测队还得重新走完沟界。继续沿用旧图，核税程序便不必改动，争议则留待下轮。\n\n晏阳初把两张图并排，指着中间那道错开的沟线：“图上是水田，实地是沙地；图上是这家，实地是那家。这税，收谁？”农务厅官员赔着笑：“图册是既有的，一时半会儿改不了。”测绘队负责人补了一句：“要复测，得有人、有钱，还要有上面的令。”两人都不说钱从哪来。\n\n这时一份旧档案被送进来：一份洪水前的测绘工作底稿，边上标着北江旧沟的走向。测绘员对着底图一查，脸色变了：“这道标记，对应的是洪水前的老沟线，现在这张县图抄错了。”晏阳初问农务厅：“那已经寄出去的税册，按错的图收，退是不退？”对方支吾道：“税册一旦签发，改动牵连太大。”晏阳初把底稿压在图上，没再说话。"
 ROC_minister_agenda.21.a:0 "冻结争议田税"
