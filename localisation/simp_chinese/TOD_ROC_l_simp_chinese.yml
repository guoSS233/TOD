  ROC_custom_xinjunshiweiyuanhui:0 "解锁§Y初步构建防线§!决议\n解锁§Y派遣政工干部到农村§!决议"
  ROC_custom_zhenduixingzhanshuyantao:0 "解锁§Y在关键地区重点布防§!决议\n解锁§Y增进对敌人的了解§!决议\n解锁§Y采取机动作战§!决议"
  ROC_custom_fadondihoujijindatongdangren:0 "解锁§Y推进边界§!决议\n解锁§Y殊死防御§!决议\n解锁§Y快速建立党组织§!决议\n解锁§Y发动敌后党组织、农会§!决议"
  ROC_custom_gemingzhihuoranbiandongnan:0 "解锁§Y对七省宣战§!决议"
