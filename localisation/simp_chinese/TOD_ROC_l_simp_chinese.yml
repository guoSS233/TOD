ROC_pingheng.9998.t:0 "第二次经济大会"
ROC_pingheng.9998.d:0 "随着第一个“三年经济建设”时期圆满完成，我们在收获一系列经济建设成果的同时，也清晰地察觉到原有经济建设中浮现出的若干问题。究竟是继续沿用此前的经济建设路线，还是对经济建设的相关布局进行新的调整？我们必须依据客观实际的需要，谨慎地作出抉择。"
