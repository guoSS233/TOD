 ROC_ma_story.102.t:0 "空着的签名栏"
 ROC_ma_story.102.d:0 "“一社一本账”已经实行，借粮、采购和运脚终于能在同一页上互相找到。财政处长把样册送进于树德办公室，指着最末一栏说：“这是我们特意留下的空格，将来无论发生什么，都有地方记。”于树德问：“经手人为何也空着？”处长答：“我们还没有规定谁有资格往里面写。”\n\n合作社女账房解释，统一表格没有问题，麻烦在新颁的填报细则：中央采购科可以改货价，财政处可以改运费，社员却只能在月底领取誊清本。一次转运多出来的装卸费，三个处都能改，出了差错却由合作社签收人担责。她把原始票据留在手里，并请部长不要把一本好账变成一本只有上头能翻的账。\n\n大同党中派的代表坚持，由财政处抽查最能保证各社口径一致；右派商户担心抽查变成事先批准，船只就要在码头多等几天。左派代表则支持各社选会计互查，但愿意支付的只有人情，不包括会计出门时耽误的工钱。谁都赞成把名字填上，谁都希望另一个部门先负责任。\n\n秘书拿出一页刚收到的统一本，指给众人看：运脚一栏被改了两次，旁边分别盖着采购科和财政处的校对章，原数已经看不见。处长解释：“这是为了避免重复记录。”秘书回答：“我们省下了一行字，却多出了两位可以改字的人。”于树德请他读出两个章各自承担的责任，细则上只有盖章的办法。\n\n处长建议把解释权交给财政处，允许社员查阅原页；账房担心修改仍由中央说了算。于树德请秘书记下，也记录社员推举会计互查的意见。她可以忍受中央多开一次会，却不愿下个月再为别人改过的数字签自己的名字。"
