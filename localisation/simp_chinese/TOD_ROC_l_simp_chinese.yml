ROC_SRC_hetan_event.8888.t:0 "谈判破裂"
ROC_SRC_hetan_event.8888.d:0 "　　由于在多个问题上无法达成一致，会议进程迟迟难以推进，最终谈判宣告破裂。随着双方代表各自离去，海内外各界人士怀着紧张的心情观望着下一步发展。也许只有战争，才能决定神州大地的未来。"
ROC_SRC_hetan_event.8888.a:0 "战争还在继续"
ROC_SRC_hetan_event.22.t:0 "谈判顺利结束"
ROC_SRC_hetan_event.22.d:0 "　　经过多轮谈判磋商，红军、共和军双方最终达成一致。随着《和平建国协定》的签署，和平统一的曙光降临在这片土地上！"
ROC_SRC_hetan_event.22.a:0 "中华永远共和！"
ROC_SRC_hetan_junshi_fenqi:0 "双方分歧：[?hetan_ROC_SRC_var_fenqi]"
ROC_SRC_hetan_event.2000.t:0 "地方权力收归中央"
ROC_SRC_hetan_event.2000.d:0 "　　当初根据约定，双方的地方政府将会存在一段时间作为新的统一政权的过渡。如今已经到了协议规定的期限了，中央将逐渐收回地方政府的自治权力，并在地方进行新的政府选举与任命。"
ROC_SRC_hetan_event.2000.a:0 "理应如此"
