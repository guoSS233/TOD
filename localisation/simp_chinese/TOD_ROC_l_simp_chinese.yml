 ROC_central_economy.2.c_tt:0 "右派好感+10、中派好感−5。"
 ROC_central_economy.3.t:0 "同一台设备，三个日子"
 ROC_central_economy.3.d:0 "工程处按安装完成计日子，财政处按付款凭证计日子，秘书处要发的联合声明，则把发布日期直接当成竣工日。三套口径都盖着公章，也都能在各自的表格里找到一行依据。经济部会议主持人把[ROOT.ROC_ce_project_name]的清单铺开，同一批设备在第一本册子里是“已安装”，在第二本里是“待核销”，在第三本里已经变成“服务开始”。三本并排，像三份互不相识的文件，却写的是同一件事。\n\n工程师把几张沾泥的验收单递过来，解释有的部件已经固定却没接通，有的付款已批、货还压在仓库；现场和账本之间，隔着一段谁也没写清楚的时间。秘书长翻出上周的收件簿，经济部在末页盖过“收到材料”的章，秘书处却把这枚章当成了联合声明的署名依据。墨迹没变，文件的用途一夜之间变了样。\n\n大同党右派代表带来一份独立测量草案，主张尚未试运行的部分就留在“未完成”栏，谁也别替机器说它已经转起来。大同党左派代表要先把工资与安全相关的验收记录公开，说没有那一页，任何竣工日都是写给报馆看的。两个人争的其实不是那几台设备，而是这张声明该叫“现场实况”，还是该叫“公文摘要”。大同党中派则希望先发阶段摘要，让中央对外有一份统一说法，再把查出的差异补进附注。\n\n印刷机在隔壁空转。主持人把红笔横放在实测清单与声明之间，要秘书处先标出三种日期各自的来源。秘书长翻到一页空白纪要，问：标题要不要先撤下来？"
 ROC_central_economy.3.a:0 "独立实测后再签声明"
 ROC_central_economy.3.a_tt:0 "右派好感+15、问责压力−8；尚无验收规则时，有在建工程则暂停7日。"
