 ROC_ma_story.202.t:0 "会走路的田亩"
 ROC_ma_story.202.d:0 "“田亩有数”的分项登记已经完成，水田、旱地和荒坡分开，实际耕作者也有自己的栏目。中央统计处来领册时，却只借走汇总页。晏阳初问：“后面关于耕作者的记录呢？”统计员答：“总数会走路，名字走得慢。我们先把走得快的送去开会。”\n\n大同党中派准备以总数安排来年调查经费；左派代表希望耕作者能查阅自己的记录，免得只有户主的名字进中央报告。右派代表支持登记结果，却担心把每户租约细节一并公布后，债主拿去催款，受影响的恰是原本就缺信用的小农。三方的共同意见是要保护农户，只是对谁能看见哪一页各有算盘。\n\n秘书把一封申请递给部长：一位耕作者想用登记证明自己实际种地，却被告知不能查个人页，理由是中央尚未决定公开范围。与此同时，某处已经引用汇总数字拟定征收估算。晏阳初请统计员解释，既然名字不能走路，数字怎么先抵达了税务会议？统计员答：“数字属于统计，姓名属于档案；两个部门各走各的。”\n\n一位调查员提出，可让申请人核对本人记录，对外只发布分类总数；若中央另拨人手，还可逐户发给可携带的摘录。财政代表赞成摘录，却问费用由谁出；中派同僚建议先按现有总表办理、个人查询排到下一轮，以免预算会为了几本册子停下。左派代表听见“几本”，请秘书念出等待查询的人数，桌旁的椅子一下都坐直了。\n\n晏阳初把问题交回中央：已完成的登记不能因为争议被抹掉，而访问、证明和保密各需有人负责。统计员小心地问，能否在报告里继续称“田亩有数”。部长说当然可以，不过下次请把有数的人也算进去。秘书于是将申请人的名字写上发言名单，省得它再次被留在汇总页后面。"
