 ROC_econ_yu_pilot:0 "合作社信贷试点"
 ROC_econ_yu_pilot_desc:0 "由合作社信用作保，给村镇小生产者放种苗、农具贷款，先试试成员互相盯着、风险大家摊。互助网与市场信贷并行，能否让乡村资金少靠那几家商号，也关系着于树德路线在会上的分量。"
 ROC_econ_yu_expansion:0 "城乡合作采购网"
 ROC_econ_yu_expansion_desc:0 "把信贷试点铺成城乡合作的采购网，用稳当的订单把乡村生产接到城里消费上。合作社议价的底气大了，城乡经营者也得接更紧的供销协作，账要一起算。"
 ROC_econ_yan_pilot:0 "县级乡村调查"
 ROC_econ_yan_pilot_desc:0 "在县里开展调查，核清土地状况、识字需求和基层技术底子，为乡建定策找实地依据。调查还会把各地最急的事摆出来，财政怎么投、民间怎么参与，都经得起下村一问。"
 ROC_econ_yan_expansion:0 "乡建技术推广"
 ROC_econ_yan_expansion_desc:0 "照调查结果推广农技与基层训练，把乡建路线上公的私的机构接起来。范围铺多大、资源怎么分，得顾全各地，也检验晏阳初在会上争取的施政空间。"
 ROC_econ_ruan_pilot:0 "国营账目清查"
 ROC_econ_ruan_pilot_desc:0 "清查国营单位的收入、采购与债务，先试一套统一账册，把公共部门到底进多少出多少弄清楚。审计给后面怎么投钱垫底，也把国营的效率和责任端到会上。"
 ROC_econ_ruan_expansion:0 "统一预算与公共投资审计"
 ROC_econ_ruan_expansion_desc:0 "把清查结果并进预算与公共投资审计，卡住重复建设和没凭据的开销。审计决定哪些项目能拿到公款，也逼各派把扶持这个、不扶持那个的道理说清楚。"
 ROC_econ_chen_pilot:0 "工厂劳资委员会"
 ROC_econ_chen_pilot_desc:0 "在工厂立起劳资委员会，先试生产协商、工资账公开与安全监督。工人代表进了管理程序，工会算是有了一席之地；厂方照旧盯着生产的指挥权和协商的界限。"
 ROC_econ_chen_expansion:0 "产业工会生产协定"
 ROC_econ_chen_expansion_desc:0 "沿已开的工会路子，把劳资委员会的经验写进产业工会的生产协定。职工要参与、生产要安排，两头能否兼顾，决定工会的话能不能在更大的产业里作数。"
 ROC_econ_xiao_pilot:0 "地籍与自耕农信贷"
 ROC_econ_xiao_pilot_desc:0 "核对地籍、试办自耕农信贷，让小农凭一份说得清的权利借到本钱。地是谁的、贷怎么放，这两样怎么定，关系到市场化扶助与土地公平能不能并排放。"
 ROC_econ_xiao_expansion:0 "农产品流通与民间投资"
 ROC_econ_xiao_expansion_desc:0 "把信贷经验接上市场路子，改善农货流通，给小生产者开一条拿民间投资的门。自耕农的销路与融资宽了，可资本进乡村的边界，还得到会上划清楚。"
 ROC_econ_appoint_yu:0 "任命于树德"
 ROC_econ_appoint_yan:0 "任命晏阳初"
 ROC_econ_appoint_ruan:0 "任命阮啸仙"
 ROC_econ_appoint_chen:0 "任命陈赞贤"
 ROC_econ_appoint_xiao:0 "任命萧铮"
 ROC_econ_building_contribution_tt:0 "有效部长任期内，每90日首次完成普通建设决议，履职实绩+3。"
 ROC_econ_compromise_available_tt:0 "三派竞赛仍在进行，且对应派别的议程任务仍活跃。"
 ROC_decision_nongcunjianshe_desc:0 "依土地改革方案改善村镇生活条件，让制度承诺落实到农户日常。乡建资源投向哪里，也关系会议如何回应农村基层的诉求。"
 ROC_decision_minshengjianshe_desc:0 "扩展城市民生产能与公共服务，使产业增长回应市民就业和生活需求。对公共资源的安排也将体现会议是否优先顾及社会建设。"
 ROC_decision_junshijianshe_desc:0 "扩展当地军工生产设施，补充国防工业能力。军工需求会与民生产业和公共建设争取有限资源，优先次序仍须由会议协调。"
 ROC_decision_kuojiangangkou_desc:0 "改善港口设施与沿海运输，便利区域货物流通并支持生产扩展。港口投资将连接公共建设与市场往来，各派仍需协调其受益方向。"
 ROC_decision_bop_jingjidahui_desc:0 "部长与大同党左中右三派先协商预算顺序、权限和执行责任；行业利益方只核实项目成本与技术条件，财政和主管部门再逐项核账会签。会议记录和审计结果统一归入中央经济施政总览。"

