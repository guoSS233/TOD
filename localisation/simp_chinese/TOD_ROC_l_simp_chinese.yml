 ROC_ma_story.305.t:0 "公告之后"
 ROC_ma_story.305.d:0 "中央预算已经公开，工程超支和未兑工资都列入可供基层查阅的责任清单。公告贴出三天，财政处、工务厅和报馆又各印了一份说明：数字来自同一份预算，对石料款何时支付却有三种说法。阮啸仙问：“公开的数字没有变，为何读者反倒不知道该向谁问？”财政处长答：“这证明大家都重视解释。”\n\n工务厅的说明附有施工进度，能告诉工人材料何时到场，却省略了欠薪；财政处的版本保留欠薪，解释的付款日期却是拨给承包行的日期。报馆记者把两份并排刊出，读者来信问：钱已拨出，为何工头还没给工人？大同党左派支持公开差异，中派担心各处抢着回答会把预算会议变成争吵，右派商户则忧虑未注明日期的旧说明损害按期付款的承包商。\n\n财政处长建议由本处统一答复，各处保留原意见。这样口径整齐，却多一道手续。秘书提出保留原公告，注明修正日期及资料来源，让各处负责人接受公开质询；筹备质询要占用下一次施政会议。处长觉得太费纸，记者说读者已经替中央多印了好几张。\n\n正在争执时，工务员送来一张补充表，证实某批石料虽已付款，尚有一部分没有运抵。处长说：“这不影响原预算的真实性。”工人代表回答：“我们也没有怀疑数字，只想知道明天有没有料做工。”阮啸仙请秘书把问题抄下，问工务厅能否直接答。厅代表刚开口，处长便提醒他，按照拟议中的统一答复办法，此刻应先向财政处申请。\n\n部长请他把申请手续写进说明，也把预计答复日期写上。记者问，是否可以把这段对话刊出；处长迟疑片刻说，理论上可以，但需要统一口径。秘书向记者递过一张已经公开的预算：“数字在这里，解释的人还在商量怎样介绍自己。”"
