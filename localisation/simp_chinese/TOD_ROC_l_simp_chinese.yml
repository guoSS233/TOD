  ROC_idea_zhonghuagonghezhenyingdebaolei_A_21:0 "中华共和阵营的堡垒"
  ROC_idea_zhonghuagonghezhenyingdebaolei_A_1_desc:0 "华南是中国资本主义的发源地，是最早走向现代化的地方。人民知识水平普遍较高。在几百年的先进思潮滋养下，共和主义的政治团体，学生会，独立工会在华南各地开花。而大同党在几百年的斗争中逐渐脱颖而出，成为共和主义运动的代表。大同党不会背弃共和主义者的梦想，但也不允许任何团体篡夺他的地位！"
