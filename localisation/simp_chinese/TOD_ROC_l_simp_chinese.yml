gemingweiyuanhui:0 "革命委员会"
gemingweiyuanhui_desc:0 "自广州革命爆发以来，大同会积极倡导各革命会社投身于新生共和政府的建设洪流。广州革命委员会应运而生，为各党派提供了共商国是、协同行动的平台。这一模式巧妙统合了各方革命势力，形成了独具特色的权力架构。"
youyilianmeng:0 "右翼联盟"
youyilianmeng_desc:0 "在新生的革命政府架构中，诸多自由主义政党、部分进步企业家、商会团体代表及前政府开明人士被纳入其中，共同组成革命委员会的右派力量。这些成员大多秉持稳健立场，主张以循序渐进的温和革命路径推进变革，在革命进程中尤为注重维持社会秩序的相对稳定。"
ziyoudatongmeng:0 "自由大同盟"
ziyoudatongmeng_desc:0 "随着革命进程的不断发展，在中华民主同盟的牵头下，革委会内部的右派人士建立了自由大同盟。该同盟旨在联合国内一切热爱自由、追求民主的人士，鼓励成员积极参与政治活动，为实现国家的自由民主而努力。其在联席会议是上指出，只有通过广泛的合作，才能在复杂的国内外形势下推进革命发展。"
jingjihuanjingfanglue:0 "经济缓进方略"
jingjihuanjingfanglue_desc:0 "鉴于革命政权现下经济基础相对薄弱，自由大同盟提出经济缓进方略。主张巩固农业根基，有计划地发展工业，循序渐进实现经济可持续增长，为社会进步奠定坚实物质基础。"
yaoqiubaozhangminqiquanyi:0 "要求保障民企利益"
yaoqiubaozhangminqiquanyi_desc:0 "鉴于民营企业在经济发展中的重要作用，特此吁请革命委员会采取切实可行之措施，以保障民营企业之合法权益。建议制定公正合理之政策法规，确保民营企业在市场准入、税收及融资等方面享有与国企同等之待遇。同时，应加强市场监管，防范不正当竞争行为，以免民营企业因恶性竞争而遭受经济损失，甚至陷入生产困境，难以维系日常运营。"
huanhexiangcundouzheng:0 "缓和乡村斗争"
huanhexiangcundouzheng_desc:0 "自由大同盟提议缓和乡村斗争，反对过度激化的阶级对抗，倡导以和平、协商的方式解决乡村矛盾。我们主张通过发展乡村经济、改善农民生活条件，来化解社会不满情绪，凝聚乡村发展共识，为乡村振兴创造和谐稳定的环境，进而保障国家粮食安全与社会长治久安。"
tuidongnongcunjingjihuazhuanxiang:0 "推动农会经济化转向"
tuidongnongcunjingjihuazhuanxiang_desc:0 "我们主张引导农会从单纯的政治组织向经济服务组织转变，注重为农民提供生产技术指导、农产品销售等经济服务。这有助于提升农民生产积极性与经济效益，增强农会自身可持续发展能力，更好地服务于乡村振兴战略，促进农业现代化发展。"
tudiliuzhuanziyouhua:0 "提案土地流转权"
tudiliuzhuanziyouhua_desc:0 "鉴于现代农业发展的需要，我们右翼联盟向革命委员会提交土地流转权提案。主张赋予农民土地流转权，在保障土地公有制的基础上，允许土地使用权依法、自愿、有偿流转。这有利于促进土地资源的合理配置，提高农业生产效率，推动农业规模化、集约化经营，同时拓宽农民增收渠道，激发农村经济活力，为实现农业革新奠定基础。"
gemingtongyizhanxian:0 "革命统一战线"
gemingtongyizhanxian_desc:0 "革命统一战线，乃凝聚各方革命力量之关键纽带。在这风云变幻之时代，唯有各党派、各阶层摒弃成见，携手并肩，方能汇聚磅礴伟力。其象征着革命志士们心向一处、力往一使，为民族独立、国家复兴而共赴征程，此实乃革命胜利之希望所在！"
qianghuazhengzhituanjie:0 "强化政治团结"
qianghuazhengzhituanjie_desc:0 "政治团结是革命事业稳固前行的基石。在革命委员会中，强化政治团结意味着各党派以共同理想为指引，在思想与行动上保持高度一致。这种团结非表面敷衍，而是源于对革命目标的深刻认同，是风雨同舟、砥砺前行的坚定决心。"
jijicanzhengyizheng:0 "积极参政议政"
jijicanzhengyizheng_desc:0 "参政议政是民主革命的活力源泉。各党派积极投身其中，依托各自的力量为革命事业建言献策。每一份提案、每一次讨论，都饱含着对革命前途的关切，是民主精神在革命进程中的生动彰显。"
xiezhugongyegaizao:0 "协助工业改造"
xiezhugongyegaizao_desc:0 "工业乃国家经济之命脉，协助工业改造意义深远。各党派发挥自身优势，助力工业所有制改造，是消除减少阶级压迫、为民众谋福祉的担当之举。这不仅关乎产业发展，更关乎我们的革命政权能否在时代浪潮中站稳脚跟、蓬勃发展。"
xiezhunongyegaizao:0 "协助农业改造"
xiezhunongyegaizao_desc:0 "农业作为立国之本，其改造关乎国计民生。各党派投身农业改造，助力传统农业向现代化转型，是对广大农民福祉的深切关怀，也是稳固革命根基的重要举措。田野间的每一份耕耘，都寄托着对国家未来的美好期许。"
luoshixinjingjifa:0 "落实新经济法"
luoshixinjingjifa_desc:0 "新经济法是适应时代发展的经济良方。各党派积极推动其落实，旨在构建公平有序的经济秩序，激发市场活力。这一过程不仅是政策的执行，更是为国家经济长远发展筑牢制度根基，意义重大而深远。"
zhichisansanzhizhengfu:0 "支持三三制政府"
zhichisansanzhizhengfu_desc:0 "三三制政府是民主政治的创新实践。通过将部分政府席位开放给革命友党与进步人士，该制度打破党派界限，广纳贤才，体现了民主、平等、包容的精神。通过支持三三制政府，我们得以让各阶层的声音得到倾听，共同书写革命民主的新篇章。"
jicengjibuhezuo:0 "基层支部合作"
jicengjibuhezuo_desc:0 "基层支部是革命力量的根基所在。各党派基层支部加强合作，扎根群众，服务民众，将统一战线的理念落实到最基层。这是脚踏实地的行动，是革命事业在基层开花结果的保障。"
tuijinkuadanghezuo:0 "推进跨党工作"
tuijinkuadanghezuo_desc:0 "推进跨党工作打破党派壁垒，促进人才与智慧的流通融合。各党派成员在跨党工作中相互学习、协同合作，是实现革命力量深度整合、提升整体效能的重要举措。"
yazhifenliezhuyi:0 "压制分裂主义"
yazhifenliezhuyi_desc:0 "分裂主义乃革命事业之大敌。各党派坚定立场，共同压制分裂主义，是实现革命理想、建设革命政权的必然之举。唯有坚决抵制分裂，方能维护革命阵营的团结稳定，守护革命成果。"
zuoyilianmeng:0 "左翼联盟"
zuoyilianmeng_desc:0 "在新生的革命政府架构中，诸多自由主义政党、部分进步企业家、商会团体代表及前政府开明人士被纳入其中，共同组成革命委员会的右派力量。这些成员大多秉持稳健立场，主张以循序渐进的温和革命路径推进变革，在革命进程中尤为注重维持社会秩序的相对稳定"
lianluogemingyoudang:0 "联络革命友党"
lianluogemingyoudang_desc:0 " 以同产工会为核心，劳动党、中华工党、社会党、总工协等左翼革命力量长期以来都是大同会开展革命活动的盟友。随着广州革命局势趋于稳定，我们这些传统革命友党之间，也开始了彼此的联络工作，试图进一步影响未来地革命方向。"
tuijinsuoyouzhigeming:0 "推进所有制革命"
tuijinsuoyouzhigeming_desc:0 "所有制革命是对资本主义生产关系的根本变革，通过立法手段逐步将矿山、工厂、交通等关键产业收归国有或集体所有，建立工人监督委员会参与企业管理。政策强调生产资料公有制的优越性，主张消灭剥削阶级，将经济命脉纳入革命政权掌控，为计划经济体制的建立奠定基础，从根本上重塑社会财富分配结构。"
jiakuaigongsiheyingjincheng:0 "加快公私合营进程"
jiakuaigongsiheyingjincheng_desc:0 "加快公私合营进程是过渡时期的经济整合策略，通过政府主导的资本重组，将私营企业纳入国家资本主义轨道。政策要求资本家以股份形式参与企业管理，同时派遣革命干部监督生产，确保利润流向服务于工业化与民生改善。此举既能利用私营部门的技术与经验，又能逐步消解资本特权，为全面公有制改革积累实践经验。"
jianadaqiyejiaruhui:0 "接纳大企业家入会"
jianadaqiyejiaruhui_desc:0 " 右翼联盟考虑到大企业家群体掌握着丰富的经济资源与社会影响力，我们向革命委员会提议，应积极接纳大企业家入会。这不仅有助于汇聚各方力量，增强革命阵营的综合实力，还能充分发挥大企业家在经济发展中的引领作用，为国家经济建设提供有力支持，促进产业繁荣与社会进步。"
tiyihuifuguangjiaosuo:0 "提议恢复广交所"
tiyihuifuguangjiaosuo_desc:0 "广州证券交易所，昔日乃金融之枢纽，今因革命而废。我自由大同盟特此提议，恢复其运作，以活跃金融市场，促进资本流通。此举不仅有利于经济发展，更彰显我共和政府之开放与包容。"
gemingziyouhua:0 "革命自由化"
gemingziyouhua_desc:0 "我们自由大同盟认为，革命应在秩序的框架内推进，保障公民在革命进程中的基本权利与自由，反对以革命为名实行专制与压迫。通过建立开放、透明、包容的革命机制，鼓励多元思想交流碰撞，充分调动社会各界参与革命发展的积极性，实现革命与自由的有机结合，构建一个民主、自由、和谐的开化社会。"
xuanyangzhengzhiminzhu:0 "宣扬“政治民主”"
xuanyangzhengzhiminzhu_desc:0 "主张通过教育宣传、舆论引导等方式，在全社会普及民主意识，倡导公民有序参与政治生活。强调民主选举、民主决策、民主监督等环节的重要性，推动政治体制不断完善，实现人民当家作主，为国家的政治稳定与社会进步提供坚实的民意基础。"
yaoqiusuxingxianzheng:0 "要求速行宪政"
yaoqiusuxingxianzheng_desc:0 "鉴于国家政治稳定与长治久安的需要，我方现向革命委员会提出速行宪政的要求。主张尽快制定并实施宪法，确立国家的基本政治制度与公民的基本权利义务，以宪法保障民主、法治与人权，规范政府权力运行，为国家的政治生活提供根本遵循。"
fangkuanzudangshenhe:0 "放宽组党审核"
fangkuanzudangshenhe_desc:0 "造革命委员成立之处，便对于参政政党的组建做出了明确的限制，各路反革命、保守派政党均被取缔。但鉴于政治多元化发展趋势，右翼联盟向革命委员会提议放宽组党审核。主张降低政党成立的门槛，简化审核程序，允许更多具有合法诉求的政治团体自由组党参政。这有利于促进政治竞争，推动革命民主政治建设。"
zhiyidatonghui:0 "质疑大同会地位"
zhiyidatonghui_desc:0 "自由大同盟对大同会目前在革命委员会中的特殊地位表示质疑。认为其权力与影响力缺乏充分的民意基础与合法性论证，有悖于民主平等原则。现向革命委员会提议，应重新审视大同会的地位与作用，倡导各政治力量在平等、公正的基础上参与国家事务决策，确保政治权力的合理分配与制衡，维护革命阵营的团结与稳定。"
lunliuzuozhuang:0 "轮流坐庄"
lunliuzuozhuang_desc:0 "为实现政治权力的公平分配与良性互动，右翼联盟提出“轮流坐庄”的提议。建议革命委员会各党派按照一定规则，定期轮换执政与在野角色。这有助于避免权力过度集中，防止党派利益固化，促进各党派之间的相互监督与制衡，充分调动各方积极性，共同推动革命进程，实现政治清明与社会和谐。"
peihekaizhanqunzhongyundong:0 "配合开展群众运动"
peihekaizhanqunzhongyundong_desc:0 "群众运动是革命力量的源泉。各党派配合开展群众运动，深入基层，倾听民众心声，动员广大群众投身革命洪流。这是与民众血脉相连的实践，是将革命理想转化为全民行动的关键路径。"
qianghuahezuoxuanchuan:0 "强化合作宣传"
qianghuahezuoxuanchuan_desc:0 "合作宣传是传递革命理念、凝聚共识的重要途径。各党派通过多种形式，向民众宣扬统一战线的价值与意义，让团结协作的精神深入人心。每一次宣传，都是在点燃革命的火种，照亮前行的道路。"
yantaogeminglilun:0 "研讨革命理论"
yantaogeminglilun_desc:0 "革命理论是行动的指南。各党派共同研讨革命理论，在思想的碰撞中探寻真理，完善革命纲领。这一过程充满智慧的火花，是对革命事业的深度思考与精心谋划，意义非凡。"
yongbaogemingweiyuanhuizhengzhi:0 "拥抱革命委员会政治"
yongbaogemingweiyuanhuizhengzhi_desc:0 "革命委员会政治是凝聚各方力量的核心架构。各党派拥抱革命委员会政治，是对革命道路的坚定选择，彰显了团结一心、共谋发展的决心。这一政治体系为革命事业提供坚实的制度保障。"
jingchenghezuo:0 "精诚合作!"
jingchenghezuo_desc:0 "精诚合作是革命胜利的不二法门。在革命征程中，各党派唯有以赤诚之心相待，携手并肩，方能战胜重重艰难险阻。这种合作是基于共同理想的坚守，是对人民命运的担当。"
qianghuagonghuigemingxing:0 "强化工会革命性"
qianghuagonghuigemingxing_desc:0 "经会议商议后，我们将在将工会从经济互助组织转化为阶级斗争的前沿阵地。政策要求工会组织军事化训练、政治理论学习，赋予其罢工权、参与企业决策及组建工人纠察队的权力。通过清除工会内的改良主义势力，树立 “一切权力归工会” 的口号，使其成为动员工人阶级参与政权建设、监督资本家与官僚的核心力量。"
queligongyouzhijingjizhutidiwei:0 "确立公有制经济主体地位"
queligongyouzhijingjizhutidiwei_desc:0 "确立公有制经济主体地位是革命政权的经济纲领核心，通过宪法立法明确全民所有制与集体所有制的主导地位，限制私有制经济规模。政策要求逐步淘汰个体小农经济与城市小资产阶级，将资源分配、生产计划纳入中央集权体系，建立从农村合作社到国营企业的全链条公有制经济网络。"
tudigaigejijinhua:0 "土地改革激进化"
tudigaigejijinhua_desc:0 "我们主张对封建土地所有制进行暴力清算，直接剥夺地主土地与财产，按人口平均分配给无地农民，并帮助 “贫农” 主导“地方农会”。政策鼓励农民自发组织批斗会，对反抗者实施肉体消灭，旨在通过阶级仇恨动员农村革命力量，彻底摧毁旧统治阶级的经济基础。"
weichinonghuiwuzhuang:0 "维持农会武装"
weichinonghuiwuzhuang_desc:0 "在土地改革的浪潮中，农会作为基层革命力量的核心，其武装化成为巩固成果的关键。通过整合地方民兵与赤卫队，农会武装不仅承担着镇压地主反扑的任务，更成为输送兵员、维持乡村秩序的重要支柱。尽管此举可能引发地方士绅的激烈反弹，但稳定的农村控制网络将为后续工业化提供坚实基础。随着武装力量的制度化，农会逐渐从自发组织转变为革命政权的神经末梢，在防范反革命渗透的同时，也为未来的军事动员埋下伏笔。"
kuodanongcunhezuosheguimo:0 "扩大农村合作社规模"
kuodanongcunhezuosheguimo_desc:0 "为应对分散小农经济的低效与脆弱，革命政权将合作社模式作为农业现代化的突破口。通过整合土地、农具与劳动力，合作社实现了规模化生产与资源共享，既提高了粮食产量，又削弱了传统地主阶层的经济影响力。政府通过技术扶持与低息贷款推动合作社扩张，使农民在集体劳动中逐渐接受社会主义理念。这一政策不仅缓解了粮食短缺问题，更在潜移默化中重塑了农村社会结构，为后续的集体化运动铺平了道路。"
gemingjijinhua:0 "革命激进化"
gemingjijinhua_desc:0 "温和改革已无法应对日益尖锐的阶级矛盾！城市资产阶级的怠工破坏、乡村富农的粮食囤积、知识界的 “自由派” 杂音，正像蛀虫般啃噬革命根基。我方现向革命委员会提议进行“红色整肃”：没收工商业主超额资产、在农村开展 “查阶级、挖蛀虫” 运动，坚决镇压任何反抗集体化的行为；关闭所有传播资产阶级思想的刊物与沙龙。这是一场涤荡旧世界的暴风骤雨 —— 唯有让鲜血染红镰刀锤头，才能让无产阶级专政在烈火中得到淬炼。"
youxiangongnongquanyi:0 "优先工农权益"
youxiangongnongquanyi_desc:0 "革命的本质是劳动者对剥削者的全面专政！我们将向革命委员会提案颁布《工农权益保障法》：在工厂设立工人监督委员会，强制实行八小时工作制与最低工资标准；在农村推行 “耕者有其田” 的彻底土改，将地主庄园改建为集体农场。同时，工农子弟将优先获得教育与医疗资源，工人纠察队与农会将被赋予司法监督权。当产业工人成为工厂的主人，当贫农协会的决议超越一切旧法，当 “劳工神圣” 的标语取代资产阶级的霓虹灯，这场革命才算真正夺回了属于创造者的尊严。"
zhengduogeminglingdaoquan:0 "争夺革命领导权"
zhengduogeminglingdaoquan_desc:0 "革命委员会内的 “温和派” 正试图将革命引入改良主义歧途！他们空谈 “阶级调和”，鼓吹 “渐进改革”，却忘了资产阶级的屠刀从未远离。革命派必须立即行动起来，在各个领域开展，尝试确保革命方向的正确。这场领导权的争夺不仅是路线之争，更是关乎革命生死存亡的决战。"
xianqililunlunzhan:0 "掀起理论论战"
xianqililunlunzhan_desc:0 "思想混乱是革命最大的敌人！为肃清改良主义资产阶级意识形态流毒，我们将在革命政府内外开战大规模地理论研讨活动，在理论上战胜哪些懦弱的右派分子！"
dajixiuzhengfenzi:0 "打击修正分子"
dajixiuzhengfenzi_desc:0 "时至今日，以大同会为代表的广州革命中心已然走向了改良主义的修正道路。我们必须积极采取行动，在军事、政治、经济等各种领域增加自身的影响力，通过各种方式同这些修正立场和观点开展斗争。"
jixugeming:0 "继续革命"
jixugeming_desc:0 "革命不是请客吃饭，而是一个阶级推翻另一个阶级的持续斗争！即便旧制度的大厦已轰然倒塌，资产阶级的思想残渣仍在腐蚀新社会的肌体。如果曾经的革命盟友抱有“到站下车”地想法，那么我们将接过革命的大旗，带领广大人民群众继续前进！这是一场没有终点的远征 —— 唯有让革命的火焰永远燃烧，才能确保人民的红旗永不褪色。"
