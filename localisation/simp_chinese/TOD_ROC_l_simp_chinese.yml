#事件
  ROC_focus.20.t:0 "解放应天"
  ROC_focus.20.d:0 "伴随着墨梅旗在应天咨议院的屋顶冉冉升起，江南地区持续上千年的专制秩序在这一刻轰然坍塌。革命军队迈着整齐的步伐入城时，应天的市民们或是列于道路两旁欢庆解放，或是躲在房屋中用好奇与畏惧的眼神审视着这个新生政权。但不论不同人士如何感受，这所明王朝的南都终究落入革命政权之手。随着政府机构与社会团体陆续迁入，大同主义改革的轮廓开始显现——从土地清丈到工商业合作社试点，变革的齿轮已悄然咬合。"
  ROC_focus.20.a:0 "金陵王气黯然收"
  ROC_focus.21.t:0 "兴师北伐"
  ROC_focus.21.d:0 "中国人民一切困苦之根源，在专制暴政之荼毒，及其豢养之门阀、军阀之横暴；人民之唯一出路，在建设一真正之统一国民政府。今挥师北伐，旨在荡涤国内外反动专制之逆流。待克敌制胜，必以革命政府之威权扫除反革命残余，俾人民获解放而自主。\n冀望平素认同大同主义及政纲之同胞，将昔日之精神共鸣化为今日之行动支持，赞助革命，共赴国难。如此则专制之厦将倾而速崩，统一之基可固而永奠，共和革命之曙光必指日可待！\n大同主义革命成功万岁！\n中国人民自由解放万岁！\n共和革命军万岁！"
  ROC_focus.21.a:0 "兹尔多士，为民先锋。以建共和，以进大同！"
  ROC_focus.22.t:0 "解放顺天"
  ROC_focus.22.d:0 "晨雾未散，永定门箭楼已换上墨梅旗。共和军先头部队踏入正阳门时，城墙上的晨露尚且未干。负责接管的第三纵队在棋盘街列队，军靴踏过石板的声响惊醒了蜷缩在廊下的小贩，那些人揉着眼睛，看见士兵们正小心绕开地摊上的果篮。\n“严禁驻扎庙宇学宫。”参谋长在宣武门箭楼上展开布告，墨迹未干的十二条安民告示陆续被粘贴到各处路口。新成立临时城市管理委员会，接管了原政府的办公机构。委员会宣布暂时冻结物价，向市场投放储备粮，平抑粮价。穿灰布大衣的军医在琉璃厂支起白帐篷，药箱上摆着搪瓷盆和蓝药水，为战乱中受伤的市民提供免费义诊。\n城南菜户营的炊烟重新升起时，共和军的测绘队已在景山制高点架起经纬仪。那些扛着三脚架的士兵经过琉璃瓦时，会驻足望向紫禁城角楼——那里悬着的半面旗帜，正随着鼓楼方向飘来的晨风，悄然变换着褶皱的方向。"
  ROC_focus.22.a:0 "好像变了很多，又好像什么都没变"
  ROC_start.1.t:0 "一、黄埔之夜"
  ROC_start.1.d:0 "1937年8月22日\n尽管武备系千方百计地掩盖真相，顺天兵变的消息还是传遍了大江南北。远在岭南的广州也发生了政治地震，暗流涌动。\n蓄谋已久的总督李准和他的党羽正在磨刀霍霍，列出长长的搜捕名单，准备趁着全国大乱的天赐良机将大同党斩草除根。而大同会广州支部审时度势，也为发动总起义跃跃欲试。\n广东的前方风谲云诡，可有人指点迷津？"
  ROC_start.1.a:0 "结束酷热之夏，打响革命第一枪！"
  ROC_start.2.t:0 "二、广州兴师"
  ROC_start.2.d:0 "1938年8月30日\n据可靠消息称，黄埔军校中忠于大同会的军校生已经与大同党主力合流，在起义中扮演着重要角色。大批广州卫戍部队早在起义前就被大同党领导下的“新文学社”和“士兵俱乐部”渗透得无孔不入，其倒戈也在情理之中。数日之内，广州附近的重要节点均已被大同党革命军所控制，东莞、惠州等地的大同党起义也此起彼伏，两广总督府已经独木难支，疲于应付。\n就在不久前，广州城总起义将革命的火焰燃遍了全城，革命军与总督府卫队展开激烈的巷战，前者得到了城中工人的鼎力相助，迅速朝总督府院邸推进。已成瓮中捉鳖的总督李准负隅顽抗，但仅仅只能阻滞大同党革命军前进的步伐。\n当革命军的炮火席卷总督府时，李准抛弃了他的部下，炸开院邸后墙乘小舟落荒而逃。不久，梅花旗插上了观音山巅。"
  ROC_start.2.a:0 "广州起义成功了！"
  ROC_start.3.t:0 "三、黄埔誓师"
  ROC_start.3.d:0 "1937年8月31日\n就在大同党革命军朝广东其余地区开进的同时，大同党中央要员和指挥官们在黄埔军校齐聚一堂，召开会议讨论下一步计划。\n梅花旗取代龙旗在这座久负盛名的军官摇篮四处飘扬，追捕刽子手李准的行动众望所归地成为了首要目标。大同党只有铲除了这个代表旧帝国的官僚及其走狗，才能避免伪明死灰复燃。与会各方代表共同起草了誓言，并在随后的誓师大会中慷慨陈词，声称要“克服一切困难争取最后的胜利”。\n尽管热情高涨，眼下追捕李准的行动方向仍然需要拍板定案。"
  ROC_start.3.a:0 "往湛厦线走，誓捕李准！"
  ROC_start.4.t:0 "四、李准肇庆树大旗"
  ROC_start.4.d:0 "1937年9月5日\n署名:黄明\n   今滋粤逆号“大同”者，本草寇之流，虺蜴之辈，性非良顺，智实浅陋，横行四处，乱窜上下，自以为体恤民情，权能通天，炙手可热，翻云覆雨;实则常怀祸国殃民之心，每行蝇营狗苟之事，荼毒九州数载，牵连海外诸藩，剥离骨肉，敲骨吸髓，蛇蚺迷心，豺狼成性，近狎邪僻，残害忠良，杀姊屠兄，弑君鸩母;豺臂狼臀不足尽其凶，而谤豺狼也；尨眉猋皮不足显其佞，而辱犬类也;奸伪发指，淫鸷惊心;人神之所同嫉，天地之所不容。犹复包藏祸心，窥窃神器，假托先圣名义，篡改祖宗道法，暗布异端邪说，以乱耳目;蛊惑淳良百姓，以谋私利;须知:三人成虎，万沫淹城，众口铄金，积毁销骨;若纵粤逆妖术于不顾，置粤逆迷言若罔闻，则燕啄皇孙，知汉祚之将尽；似龙漦帝后，识夏庭之遽衰。\n    殊不知北辰不改，阊阖永固，皇明国祚，绵延六颐，既承天命，又通人和;海晏河清，效尧舜之垂范;时和岁丰，续虞唐之遗风;放眼当下，则南连星洲，北尽紫宫，东连沧海，西越葱岭;仁泽青丘周饶襟肘之域，威震泰西昆仑向化之地;入则有志士连袍，深明大义，毁家纾难，献策朝廷;出则拥铁骑成群，赤胆忠心，勠力御贼。区区螳臂，难当业业四牡;渺渺蚍蜉，怎撼荡荡”冥灵？朗朗乾坤，令粤逆无处藏也;煌煌赤日，使粤逆无所避也。其肉虽苦，人人得而啖之；其骨虽污，人人得而烹之！天下知其害颇深，竟至妇孺恶其败纪，翁妪望其坏纲。独夫民贼，不知天高地厚;腐草荧光，何比碧落曦舒？奈何粤逆未明察己明，难衡量其力，虽再三劝晓，怀柔绥靖，终离经叛道，铤而走险，是可忍孰不可忍！\n幸得直威将军李直绳，本皇明旧臣，公侯冢子。奉先帝之成业，荷本朝之厚恩。是用气愤风云，志安社稷。因天下之失望，顺宇内之推心，爰举义旗，以清妖孽。巨舶伏浪，甲车碾飙。海陵红粟，仓储之积靡穷；江浦黄旗，匡复之功何远？赤帜树于牙帐，高纛立于行帷，班声动而北风起，铳气冲而南斗平。喑呜则山岳崩颓，叱吒则风云变色。以此制敌，何敌不摧；以此图功，何功不克！\n    呜呼！粤逆衅稔恶盈，萧斧之诛犹少，罄竹难书，擢发难数。是故不得不下此文，彰其咎愆，亟平粤逆，与民安宁。公等或家传汉爵，或地协周亲，或膺重寄于爪牙，或受顾命于宣室。言犹在耳，忠岂忘心？一抔之土未干，六尺之孤何托？倘能转祸为福，送往事居，共立勤王之勋，无废旧君之命，凡诸爵赏，同指山河。若其眷恋穷城，徘徊歧路，坐昧先几之兆，必贻后至之诛。试看来日之九州，竟是何人之天下！移檄省府，咸使知闻。\n　大明华南招抚司\n昌德50年9月5日"
  ROC_start.4.a:0 "这帮反动分子文采还是不错嘛！"
  ROC_start.5.t:0 "五、李总督兵败佛冈县"
  ROC_start.5.d:0 "（1937年9月20日）\n——机密—— \n大同会中央:\n伪明两广总督李准窜至肇庆后旬内纠集部属、民团等计约四万人，前日行至佛冈县境为我革命军所阻击，止步不前。\n敌恃器械精良，数量庞大，向我阵地连番冲击十余次，遗尸甚众，仍未得手。驻守佛冈县之学生军虽初出茅庐、经验不足，却以高涨之革命热情弥补缺漏，面对数倍于我之敌军坚守阵地达两日之久，为我后续部队跟进追击争取时机。\n今晨我军主力既至，配合阻击部队内外夹击，李军斗志全无，溃不成军，阵前起义七千余人，伤亡两万余人，其余业已四散奔逃，或匿于乡间。另据可靠情报称，敌酋李准为心腹接应，连夜向东出逃，亟需加紧追捕。\n东路军前线指挥部\n9月15日"
  ROC_start.5.a:0 "挥师东进。"
  ROC_start.6.t:0 "六、宝安港党人施连环计"
  ROC_start.6.d:0 "（1937年9月30日）\n张冲站在宝安海事局的阳台上，吸着烟凝视着熙熙攘攘的港口。身后的小陈盯着局长室墙上的华南铁路时间表和轮船时刻表，不停计算着。\n“李准现在该在惠州府附近，宝安线的冲突让列车晚点了。这样看，他只能去——厦门。”\n“要是他到了厦门港，那就前功尽弃了。”\n“为什么不能请求沿线农会拦截列车搜查？”\n“他手上有应天的机密和华南诸省官名册，一旦打草惊蛇，材料就完蛋了。”\n“那我们就坐着看他去厦门？”\n“会有人护送他到达目的地，不过不是明军，而是我们。”\n“哈？！”\n“小陈你知道庞统巧授连环计的故事吧。李准现在就是曹操，我们里面一人要做蒋干，一人要做庞统。一计累敌，一计攻敌。”\n“累敌是要摆脱护送他的明军，那么攻敌莫不是......杀人？这还是得一起动手么！”\n“嗨，朽木不可雕！你按照我布置的去做就行！现在带着梅队出发去厦门火车站。搞快点。”\n“老师你呢？”\n张冲冲上去给小陈一记老拳。\n“卧槽，老师你！”\n“我现在要提前出发，完成计划的第一步。下一次你见到我，我就是锦衣卫北镇抚司的张逆副司长了。给你这一拳是为了提醒你不要太惊讶以至于下不去手。”\n张冲头也不回的冲出办公室，不久楼下传来引擎轰鸣和咒骂声。"
  ROC_start.6.a:0 "什么双面间谍，还入戏如此之快！"
  ROC_start.7.t:0 "七、厦门港总督坐艄"
  ROC_start.7.d:0 "（1937年10月5日）\n当两广总督李准心有余悸地登上“雪枫五号”货船时，他仍然在瑟瑟发抖。曾经不可一世的张扬举止不得不掩盖在一套陈旧的船长制服下，只是为了换取一张前往宝岛台湾的船票。回想起前些日子，他一夜白头的脸上显示出颓废与疲惫。从炸开总督院邸后墙那一刻起，他一路上舍弃了太多，金银财宝，古玩字画，甚至是自己的四房妻妾和子女——为了不引人注目，他们都在进入福建境内时与他分别。现在跟随他的，只有自己最忠诚的贴身侍卫两人。\n他顾不上与厦门当地的残余官绅联系，尽管李准曾经给予过他们无数好处，这些忘恩负义之辈现在却是唯恐避之不及。要不是手下打点妥当，预先准备了几套变装，他还真说不准会不会变成瓮中之鳖。毕竟如今的厦门已经充斥着大同党了。\n“水手长呢，干什么去啦？怎么还不组织水手起锚？”李准按捺不住急迫的心情，朝着舰桥里大吼大叫，却无人应答。\n然而接下来发生的事情却出乎他的意料，整个厦门的水手和港口工人在大同会工协组织下罢工，“雪枫五号”的船员也不例外。群情激愤的水手们拒绝执行“船长”李准的命令，并以数量优势将大副等人抛入海中。李准慌不择路，抱着机密文件包登上栈桥，却被闻讯赶来的工人推进了厦门湾苦涩的海水里。"
  ROC_start.7.a:0 "大局已定。"
  ROC_start.8.t:0 "八、李总督淡水城被捕【新闻】"
  ROC_start.8.d:0 "（1937年9月22日）\n（大同社台湾淡水 某月某日 电）本报援引相关方面消息，昨日晚十一时许，走投无路的伪明两广总督、华南招抚司大臣李准孤身一人向淡水城革命军自首。经多方取证核实，革命军确认此人为李准无误，并随即押送广州，等待进一步处理。\n据在场人员称，李准当时蓬头垢面，衣衫褴褛，面色枯槁，步履蹒跚，在营地门口被卫兵拦下盘问时坚称自己是两广总督，最终被移交给政治保卫局相关人员。李准在口头供词中声称自己“近日罹患伤寒”并“缺衣少食”，加之“众叛亲离”，不得已“弃暗投明”，希望有关方面“妥善对待”自己和家人。李准还强调自己“并无油水可捞”，随身携带之机密文件均在“颠沛流离”中损失殆尽，仅有的有效信息需要自己面见大同党高层时才肯“开诚布公”。最后，李准再三申明自己愿意听从大同党革命军处置，但对于朝廷的“忠诚”“始 终如一”。\n对于李准的合理需求，革命军相关方面已经尽可能给予满足。大同党广州中央委员会主席柯麟今晨发言公开了这一消息，并劝告伪明在逃官僚效仿李准尽早自首，争取宽大处理，尚能以体面方式获得改造机会。"
  ROC_start.8.a:0 "好好改造，重新做人"
  ROC_start.9.t:0 "七、中务局追逃火车站【新闻】"
  ROC_start.9.d:0 "（1937年10月5日）\n（大同社福建厦门 9月24日 电）本报讯，昨日晚七时许，伪明两广总督李准携卫队窜至厦门城郊，被农会工作人员发现并曝光其行踪，革命军随即展开行动。鉴于当前厦门局势尚不明朗，中务局决定派遣乔装打扮的梅营前往厦门控制各交通要点。\n今日凌晨一时许，李准及其卫队果然现身火车站，遭到早有准备的梅营迎头痛击，损失惨重。城内其余梅营部队随即赶到，彻底消灭了李准卫队走狗。令人唏嘘的是，在清扫战场和俘虏辨识中并未发现李准身影。有俘虏供称，激战中李准已经被炸得死无全尸。也有消息称，李准被接应人员救下，已经逃之夭夭。以上消息的真伪尚待调查。"
  ROC_start.9.a:0 "这些反动派真是死心不改"
  ROC_start.10.t:0 "八、赣州城农协出击"
  ROC_start.10.d:0 "（1937年11月5日）\n——绝密—— \n大同会中央:\n近日中务局与江西农协取得联系，确认此前“xx计划”正在有序进行。伪明总督李准在“厦门参将”张云鹏（实则为大同会人卧底张冲）保护下已至赣州境内，农协自卫队员在巡逻中发现了李准行踪，并大胆出击。李准和仅有的几个贴身侍卫在张冲同志的掩护下逃脱，而张冲同志被农协“逮捕”，关押于唐江镇某处仓库中。\n张冲同志以崇高的革命精神和顽强的革命意志，忍受了农协长达两天的严刑拷打，没有暴露他的真实身份。他同时以巧妙的方式将自己的位置告诉李准。李及其侍卫随后前来营救，农协在中务局的安排下故意减少了防备，张冲同志被李准救下。中务局业已确认其前进路线，或于一周内沿赣江北上抵吉安县境内。\n中务局\n某年某月某日"
  ROC_start.10.a:0 "隐秘战线同志们的付出不容忘记！"
  ROC_start.11.t:0 "十一、李总督井冈山尽忠"
  ROC_start.11.d:0 "（1937年11月20日）\n夜已经深了，井冈山区寒气逼人，几乎要把骨髓渗透。摇曳的篝火光将两个人影投射在山洞墙壁上。李准，这个曾经不可一世的两广总督，现在则因高烧裹在破烂的大衣中连连呻吟。他本来因声色犬马掏空了身子，身上几处擦伤也早已感染，又在经过遂川时落水着凉，终于到了无可挽回的地步。\n李准两眼鼓大，汩汩的汗水沿着额头淌下，一会却又像筛糠一样浑身发抖。他的面前像幻灯片似的浮现起前半生的片断，又看见自己的亲朋好友逐渐离他远去。他在官场中陷害的同僚和他逼死的老百姓一个个登场，潮水般的怒吼将他淹没在恐惧之中。\n他忽然从幻觉中挣脱，耳边只有劈里啪啦的柴火爆裂，以及洞穴外农协队员漫山遍野的招降声。身边没有三妻四妾，也没有贴身侍卫，有的只是那个遍体鳞伤的厦门参将，张云鹏。\n“哈哈哈……到此为止了，”李准知道自己大限将至，“你我都插翅难逃。”\n张云鹏没有说话，只是颤抖着点起一根卷烟。\n“可悲啊……到头来只有你一人还在身边。那么多人……都背叛了我。”\n片刻的沉寂过后，一个油纸密封袋出现在了张云鹏的面前。"
  ROC_start.11.a:0 "李帅放心，我一定会保护好名册！"
  ROC_focus.3.t:0 "一、改革前景（1）"
  ROC_focus.3.d:0 "在华南，这个大明的古老领地，经济不平等问题早已根深蒂固。自大明立国之初，农业作为国家基石，一直是国家经济的主导。然而，随着时间的推移，工业化进程的加速，以及朝廷内部权力斗争的加剧，华南地区的经济状况逐渐呈现出不均衡的发展态势。\n农业是华南经济的基石。自耕农们在这片肥沃的土地上辛勤劳作，依赖自然的恩赐，每年都有稳定的收成。然而，随着工业化的发展，海外廉价农产品的涌入，大量自耕农因无法适应新的经济环境而陷入困境。\n与此同时，一些有远见的农场主开始尝试现代化的农业经营模式。他们引进先进的农业技术，发展大规模的农场，通过精明的投资和商业运作，逐渐积累起巨额财富。这些农场逐渐成为华南农业的新生力量，带来了显著的经济效益。然而，农业的变革并未惠及所有人。失去土地的农民被迫进入城市寻找工作，他们在城市中饱受贫困和剥削，成为了钱荒下的牺牲品。"
  ROC_focus.3.a:0 "了解工业、金融情况"
  ROC_focus.23.t:0 "二、改革前景（2）"
  ROC_focus.23.d:0 "工业方面，华南地区已初具规模。新的工厂如雨后春笋般涌现，生产的产品琳琅满目。然而，这些工厂大多集中在城市地区，而农村地区的工业基础仍然薄弱。这种工业布局的不均衡也加剧了城乡之间的经济差距。同时，由于技术落后和管理不善，许多工厂的生产效率低下，导致工人工资普遍偏低，生活水平难以提升。工人们的工作条件恶劣，工资低下，生活困苦。同时，工厂的扩张也造成了严重的环境污染，影响了当地居民的生活质量。\n金融业方面的问题在华南地区尤为显著。作为大明金融行业的核心区域，广州城金融业繁荣昌盛，汇聚了众多大型银行和金融机构。同时，广东作为大明掌控南洋贸易的要塞，握有得天独厚的资源和市场优势。但遗憾的是，这些资源和市场的分配并不均衡。一部分大型企业和富商巨贾通过与南洋各国的紧密贸易联系，迅速累积了惊人的财富。银行机构在南洋贸易中扮演着举足轻重的角色，为大明与南洋各国的商贸往来提供了强有力的金融保障。\n然而与此形成鲜明对比的是，小企业家与生产者却由于资源和信息的匮乏，难以直接涉足远洋贸易。即便偶尔获得贸易机会，小生产者们也常因资金短缺而无法有效扩大经营规模。他们往往被迫求助于高利贷以解燃眉之急，这无疑给他们的经济状况雪上加霜，进一步加剧了社会贫富差距。\n面对华南复杂的经济政治和社会局面，大同主义者必须立刻采取行动，通过实践让大同之花再华南之地处处绽放。"
  ROC_focus.23.a:0 "珠水遗痕归逝浪，大同新契续尧天。"
  ROC_focus.4.t:0 "集约化经营"
  ROC_focus.4.d:0 "经过委员会内部的激烈争论，大同会最终决定采取集约化生产的农业改革路线点。他们计划依托已经接管的国营农场和商会下属农场，进行改制试点。其目标很明确：让农业工人逐渐接管这些农场，并以此作为蓝本，在华南地区推广农业集约化生产方式。只有让工人拥有更多的自主权和参与决策的机会，才能真正提高生产效率和改善工人的生活水平。\n这个决定在大同会内部引起了激烈的争论。一些保守的委员担心，让农业工人接管农场可能会导致生产的混乱和效率的降低，因为工人们缺乏专业知识和经验。他们认为农场的经营应该由专业的农业专家来负责，而不是让普通工人来管理。但这些质疑都没有影响大同会中央推行集约化改革的决心。\n为了打消农场主的疑虑，大同会提供了一系列保障措施：对愿意交出经营权的农场主给予经济补偿；承诺在一定期限内，农场收益的一部分将用于支持他们的转型和再发展；同时，对于那些在农业领域有专长和贡献的农场主，将聘请他们作为农业顾问或技术指导，继续发挥他们的专业才能。"
  ROC_focus.4.a:0 "农业改制，道阻且长"
  ROC_focus.24.t:0 "农业改革方案"
  ROC_focus.24.d:0 "经前期筹备，改制试点业已启动。大同会先期对国营农场及商会属地展开详尽调研，发现既有生产模式存在管理松散、资源浪费、效率低糜等弊病。据此制定四项核心改革举措：\n1、工人能力建设：实施农业技能与管理知识培训计划，系统教授作物栽培、病虫防治、成本核算等实用技术，辅以农场经营模拟演练。此举既提升工人专业素养，亦强化其岗位责任感。\n2、生产流程优化：在工人参与下制定分季生产规划，引入标准化作业流程，确保灌溉、施肥、收获等环节衔接紧凑，资源利用效率显著提升。\n3、资源配置调整：建立动态资源调配机制，依据土壤肥力与市场需求调整种植结构，牲畜饲养与农具使用实现集中统筹，单位产出较试点前提高27%。\n4、参与式治理架构：创设工人议事会制度，赋予基层劳动者生产计划表决权与收益分配建议权，形成“技术专家+工人代表”的双轨决策体系。\n试点运行三个月来，农业工人已实质掌握经营自主权，依据市场行情自主调整种植品类。在充分协商与利益保障框架下，试点农场主均签署过渡协议，23名原经营者受聘为技术顾问，实现改制进程的平稳推进。后续将依循"试点-总结-推广"三段式路径，在珠三角地区逐步推开集约化生产模式。"
  ROC_focus.24.a:0 "集约化生产势在必行！"
  ROC_focus.25.t:0 "大同会农场改制干部日记（1）"
  ROC_focus.25.d:0 "XXXX年XX月XX日  晴 \n今日抵陈家庄第十日。余自任职农会以来，虽久涉乡野，然对集约化经营模式实属生疏。故入庄之初，未敢轻举妄动，先以数日奔走田垄，察地势、访佃户、问稼穑，方略窥此间经营之弊。\n陈家庄主陈大富者，实为乡里霸主。其占膏腴千顷，拥半机械之农具，然经营之法仍守旧制，佃户租额高至七成，佃农终岁辛劳仅得温饱。今大同会命余改制，欲以工人合股、机器耕作之法革故鼎新，实为救弊之举。\n上午再访陈宅，冀以利弊晓之。熟料此人面露愠色，竟以"聚众滋事"相斥，甚至扬言召团丁护院。其顽固如此，令人扼腕。\n午后转而与佃农商议。余见众佃虽口称改制”凶吉难料”，然目中皆有希冀之光。遂以改制细则告之：凡入社者，按股得分红；愿学机耕者，由农会供技师指导；愿离田者，由农会资路费并荐工。众闻之，虽未尽信，然已有三五愿试者。\n晚间独坐油灯下，细思今日周旋。陈氏之拒，佃农之疑，皆在意料之中。然观佃户老张握茧之手紧攥传单，知人心思变，只待破局之人。\n改革之事，如垦荆棘荒原，非一朝一夕之功。然余既受命于危难，自当以愚公移山之志，掘此顽石。明日当再访东村李家，闻其佃户中有通晓水利者，或可为机灌之用。"
  ROC_focus.25.a:0 "加油！"
  ROC_focus.26.t:0 "大同会农场改制干部日记（2）"
  ROC_focus.26.d:0 "XXXX年XX月XX日 晴 \n今日陈家庄改制终有破局之举。连日唇枪舌剑，困局难解，我决意以行动破局。晨光熹微时分，我率一队支持改制之农工，浩浩荡荡直趋农场机械仓库。\n仓门紧闭如铁桶，陈大富爪牙环立，手执木棍阻挠。我挺身而出，朗声宣读《广州共和政府农场改制条例》第十一条：“凡国营及私营农场，均有义务配合技术革新，违者予以处罚。”此乃共和政府新颁之法，虽乡野多不知，然法理凛然，不容置疑。\n僵持良久，农工群众渐次聚拢，黑压压围了半圈。我见时机已至，振臂高呼：“诸位乡亲！这铁犁旧耙锈蚀多年，再不换新，明年春荒如何度？”话音未落，人群里已有人应和：“说得在理！”\n仓门终破，锈蚀斑驳之农机尽入眼底。我当即分派机修匠人，拆卸换件，调试引擎。老张头握着崭新犁铧，眼眶发红：“这物件比俺孙子年纪还小，但可比那老牛快当！”\n午后风云突变，陈大富煽动闹事，二十余人持标语游行于场院，呼喊驱逐农户。我欲晓之以理，却被扔了满脸泥浆。情急之下，支持改制之农工自发列队，与闹事者对峙。推搡间，余被撞倒，额角磕破血流如注。\n正当局势升级之际，警笛骤响——县警备队闻讯赶来，鸣枪示警。队长厉声喝止：“改制系政府要务，聚众滋事者以扰乱治安论处！”一时间闹事者四散。\n卧榻包扎时，老李头送来一碗姜汤："张书记，今儿个才算见着真改制！"我握着粗瓷碗，望着窗外余晖染红的稻田，忽觉这满头包扎的绷带，倒像是缠上的勋章。"
  ROC_focus.26.a:0 "加油！"
  ROC_focus.27.t:0 "大同会农场改制干部日记（3）"
  ROC_focus.27.d:0 "XXXX年XX月XX日 晴\n今晨陈家庄的空气弥漫着紧张的氛围。经过月余的拉锯，陈大富公审大会终于在村广场举行。\n卯时刚过，广场上已聚满黑压压的人群。农人们裹着草笠，手攥竹烟杆，目光齐刷刷投向临时搭起的杉木审判台。陈大富被两名持枪警卫押上台时，青布长衫已被汗浸透，蜡黄的脸色与发青的嘴唇形成诡异反差，唯有眼中那股狠戾劲儿还在作祟。\n审判官宣读罪状时，我数次瞥见台下老张头攥紧的拳头在发抖——"阻碍改制""威胁村民""煽动闹事"，每一条罪名落下，人群便爆发出雷鸣般的喝彩。当念到"私设钱庄盘剥佃农"时，竟有农妇突然冲出人群，将一篮子烂菜叶摔在陈大富脚边。\n陈大富在庭上嘶吼辩解，可那声音在群众的怒吼中显得如此微弱。当判决书宣读完毕——“长期监禁，没收财产”，广场上爆发出震耳欲聋的欢呼。老李头热泪纵横地抓住我的袖口：“张书记，这下俺家春荒有粮了！”\n目送陈大富被架上囚车时，我注意到他残存的倨傲终于崩塌，双腿发软竟需要警卫搀扶。这个曾经骑在百姓头上的土皇帝，此刻像被抽去脊梁的蛇。\n夜色渐浓，广场上的篝火仍在燃烧。农人们围着火堆教彼此开拖拉机，孩子们举着烤红薯追逐嬉闹。我坐在审判台残木上，望着火光映亮的笑脸，忽然想起父亲临终前的话：“儿啊，这世道总要变个样。”\n我得赶在天亮前写完这份报告——广州来的技术员一早就会到达，他带来的不仅是改良稻种，还有这方土地上新生的希望。"
  ROC_focus.27.a:0 "善恶到头终有报"
  ROC_focus.5.t:0 "大同会土地改革决议纪要"
  ROC_focus.5.d:0 "经内部审慎讨论，大同会决议推行土地改革与农业合作化运动。此次土改旨在打破地主垄断，将土地从传统佃租体系中解放，按户均分给无地或少地农民。此举既可提高耕作效率，增加粮食供应，亦能缩小贫富差距，为合作化奠定基础。\n部分成员对此决议持保留意见，主要担忧包括：农民可能不接受新分配标准，或缺乏成立合作社的资源与能力；保守势力与地主阶层可能强烈反对；当前革命形势虽有好转，但贸然推行土改可能引发社会动荡，甚至影响革命武装力量的稳定。\n但大同会中央最终依旧决议将土地革命进行到底！他们深信，推行土地改革和农业合作化是解放农民、推动农村发展的必经之路。这一改革不仅能显著提升农业生产效率和农民收入，更是实现“平均地权”这一崇高目标的关键步骤。"
  ROC_focus.5.a:0 "平均地权，耕者有其田"
  ROC_focus.28.t:0 "土地改革—合作化农业改革方案"
  ROC_focus.28.d:0 "在大同会的积极推动下，土地改革运动在华南各地逐步展开。为实现“平均地权”的政纲，大同会精心制定了一系列具有针对性的土地改革措施:\n一、清查田亩：派专员实地丈量田地，详细记录土地归属、使用情况和人口依赖关系，为合理分配土地提供依据，确保每户百姓都有地可种。\n二、按户分田：根据每户人口数量和劳动力情况，制定公平的土地分配标准。以"耕者有其田"为原则，按户发放土地证，确保每户农民都能获得足够养家糊口的土地。\n三、禁止私卖：为防止土地过度集中，明令禁止土地私下买卖。土地归公有，由政府按登记情况统一分配，杜绝土地兼并现象。\n四、厘定田规：颁布《田土章程》，明确永久拥有土地和需要缴税土地的区别，严格保障租种土地的权利，确保土地利用符合国家和民众利益，避免土地抛荒和粮食短缺问题。\n五、合股耕种：鼓励农民成立合作社，由政府提供种子、农具等支持，并聘请技术人员巡回指导。通过合作的力量兴修水利、改良种畜，推动农业经营逐渐走向规模化和集约化。\n六、设立监查：选拔监督人员和当地农民组成监督机构，每年巡查土地分配、农业生产、农民生计等方面的情况。年底提交相应报告，根据实际情况调整政策。\n此六项措施，旨在清除华南土地制度的弊端，革除租佃剥削，引导农业从租佃制向合作社转变，促进农村经济的发展和社会进步。"
  ROC_focus.28.a:0 "土地改革势在必行！"
  ROC_focus.29.t:0 "农会干部日记：土地改革与农业合作化进程（一）"
  ROC_focus.29.d:0 "日期：XXXX年XX月XX日\n今日抵海陆丰某村，此地久为地方乡绅盘踞。彼等凭借田土资源，对佃农残酷盘剥，租额高至七成，农人终岁辛劳仅得温饱。因反动势力根深蒂固，革命前农会组织屡建屡散。目睹村民困苦，众人义愤填膺，决心采取行动改变这里的现状。\n午后即召集地主训话，宣读政府土改政令。闻“土地改革”的政策后，态度立刻变得愤怒起来。其中为首的一位地主粗鲁地反驳道：“这些地都是我祖辈留下的，你们凭啥要改？”我深吸一口气，正色道：“各位，现在不是你们说算的时候了！革命政府的新政策下来了，就是要让种地的人有地种，实现耕者有其田！”\n地主老财气得脸都绿了，可也明白形势不对劲了。我复劝他：“这改地是为了大家好，不是冲着谁来的。要是负隅顽抗的话，政府可要采取强制手段了！”交锋之际，村民渐次聚拢，黑压压围了半圈。\n与地主对话间，我察觉他直哆嗦，那份恐惧藏都藏不住。他心里头怕是明白过来了，这革命的潮流挡不住，不跟着走就得被碾过去。夜色渐浓，村民纷纷前来问这问那，余等忙到后半夜。虽困得不行，可看着大伙儿那热切的眼神，心里头也踏实。明天还得接着干，把这土改的事儿给大伙儿办利索了。"
  ROC_focus.29.a:0 "世界大潮，浩浩汤汤，顺之者昌，逆之者亡。"
  ROC_focus.30.t:0 "农会干部日记：土地改革与农业合作化进程（二）"
  ROC_focus.30.d:0 "日期：XXXX年XX月XX日\n今晨与农会同志在海丰某村召开村民大会，会场正中悬挂“实现耕者有其田”巨幅标语，特意传唤本地田主列席。数日奔走呼号，终见村民精神振奋，一改往昔佝偻之态，人人目光炯炯如燃炬。会议刚开始，就有位大胆的农民勇站了起来，直指田主刘锡光：“刘地主！你收租那么狠，我们连饭都吃不饱。可怜我家女儿，去年岭南大旱时，被活活饿死了！我跪在你门前求你施舍些粮食救命，竟被你生生打了出来！”听到这番话，会场上一片骚动，其他农民也开始纷纷表达自己的不满和愤怒。\n我见乡亲们泪眼婆娑又怒目圆睁，心如刀绞。那些地主则面色如土，却敢怒不敢言。我起身高呼：“各位父老兄弟！今日控诉已由农会登记造册，我们共和政府一定秉公处置！自今日起，正式推行土地改革，让乡亲们再不受田租盘剥！”\n话音方落，掌声雷动，欢呼声直冲云霄。村民们相拥而泣，老农们跪地叩首，村童在人丛中欢跃蹦跳，整个村庄沉浸在解放的狂喜中。余见数位白发苍苍的老佃农老泪纵横：“总算等到这一天了！”\n在场的地主们大多脸色较为难看，尽管有一些地主当场表示愿意无条件交出土地，配合一切改革工作，但大部分地主则选择了沉默不语。\n在会后，几位地主暗中找上了我们，表示他们在政府中有自己的门路，试图通过这层关系让我们在改革中网开一面，但都被我们一一回绝。据赤卫队员密报，部分乡绅已在暗中收罗土枪鸟铳，企图武力抗改。我等商议后决定加强夜间巡逻，对负隅顽抗者必施霹雳手段，决不让反动逆流死灰复燃！"
  ROC_focus.30.a:0 "实现耕者有其田！"
  ROC_focus.31.t:0 "农会干部日记：土地改革与农业合作化进程（三）"
  ROC_focus.31.d:0 "日期：XXXX年XX月XX日\n此前土地分配工作已基本就绪，我们的工作也进入新阶段。在今晨召开的农民大会上，我们宣布将成立农业合作社。会场悬挂“团结生产 共谋温饱”横幅，农会特地从汕头调来两台拖拉机以及十吨新式化肥作实物展示。\n宣讲时，我详细讲解“集体耕作、收益共享”的运作模式，强调政府三年免税扶持政策。七旬老农陈阿狗当场质疑：“种果蔬能顶过粮食？”技术员小李随即展示了收购价格对比图表，会场顿时响起私语声。待说到合作社可统一购种、抗灾保险时，人群开始骚动，最终三十七户当场签署入社协议，占全村农户七成。\n最打动大伙的试技术员张木生的发言：“往年单家独户种一亩田，累死累活收三百斤。如今大伙合力开垦抛荒坡地，拖拉机一晌耕完十亩田！”此语甫毕，掌声震得会场屋檐泥灰簌簌直落。年轻后生们围住拖拉机摸个不停，争着报名参加农机培训队。\n令人意外的是，原地主陈锦堂混在人群最后。被我撞见后，他青衫下摆浸着泥水，额角沁满细汗。我含笑招手道：“陈先生既已分田归公，合作社自是来者不拒。”他挠着谢顶的脑袋连声称谢，那副神情倒像新科举子初见主考官。余暗忖，这等转化需假以时日，但今日能让反动分子低头认政，已是不小胜利。"
  ROC_focus.31.a:0 "农业合作化的浪潮席卷华南！"
  ROC_focus.7.t:0 "节制资本"
  ROC_focus.7.d:0 "在国企，以皇权为代表的官僚资本集团长期垄断中国经济命脉，巧取豪夺，盘剥百姓。庚午钱荒期间，商贾宁可焚毁囤积货物，也不愿缓解饥民遍野的惨状，为维护既得利益竟不惜以市场崩溃为代价，致使民生疾苦如雪覆霜。\n如今，为遏制资本逐利无度，巩固新生政权经济主导权，我们当施行资本节制方略，逐步推进生产资料公有化改革。相信经过同志们的不屑努力，终将实现经济主权归于人民，发展红利惠及苍生。同志们，唯有持之以恒，方能铸就一个无剥削、无压迫的大同世界！"
  ROC_focus.7.a:0 "大同主义万岁！"
  ROC_focus.6.t:0 "联合商会"
  ROC_focus.6.d:0 "自后明以来，商业逐渐兴盛，商会以其强大的经济实力登上了政治舞台。这些商会拥有雄厚资本，经营范围遍及生产生活方方面面，对经济社会有着重要作用。\n在商会中，许多人都或多或少地对封建专制有所不满，并一定程度上支持大同主义。我们可以争取商会的支持，以壮大革命力量，促进华南社会稳定。"
  ROC_focus.6.a:0 "共同打倒封建专制！"
  ROC_focus.32.t:0 "扩大“民生产业促进会”范围"
  ROC_focus.32.d:0 "民生产业促进会，作为以大同会企业为基石的关键企业组织，其在前革命时期扮演着至关重要的角色。大同会凭借自身掌握的先进生产技术，向那些愿意加入“民促会”的中小型企业提供宝贵的援助和支持。作为回报，这些企业被要求允许工人组建工会，并在生产过程中改善工人的劳动条件，确保他们的权益得到保障。\n过去，大型垄断企业因其在经济中的主导地位，被视为革命后需要拆分和重组的对象，因此被排除在“民促会”之外。然而，随着时代的变迁和革命形势的发展，我们或许需要重新审视这一立场。适度放宽入会标准，允许一些大型垄断企业加入“民促会”，可能会为我们带来更多的资源和支持，从而更好地推动革命进程。"
  ROC_focus.32.a:0 "民生就是社会一切活动中的原动力"
  ROC_focus.8.t:0 "《大同日报》“委员会政治”"
  ROC_focus.8.d:0 "今天，广州革命委员会首次大会在省府隆重召开。各合法党派代表齐聚一堂，围绕革命议题展开深入讨论。会议由大同会总理柯麟主持，他开宗明义地指出当前革命的紧迫性与重要性。劳动会代表随后发言，强调工人阶级在革命中的关键作用，并提出通过组织工人起义与罢工等方式加速革命进程。同产工会代表亦表示支持，提议加强与其他革命组织的联络，协同策划并组织起义行动。\n讨论中，代表们达成共识：革命不仅是政治斗争，更是思想和文化的斗争。为此，决议加强革命理念的宣传与教育，提升民众的革命意识与觉悟。同时，强调军事准备的重要性，确保起义行动具备足够武装力量支持。\n大同会作为主导力量，提出具体行动计划：建议成立革命指挥部，统一指挥起义行动；并加强与农民、学生等社会力量的联络，构建广泛的革命统一战线。代表们还就革命可能面临的困难展开深入讨论，提出应对策略，表示无论遭遇何种挑战，都将坚定信念、勇往直前，为革命胜利不懈奋斗。\n此次会议的成功召开，标志着广州地区革命运动迈入新阶段，为未来的胜利奠定了坚实基础。"
  ROC_focus.8.a:0 "这就是革命民主么？"
  ROC_focus.9.t:0 "会政关系再讨论"
  ROC_focus.9.d:0 "中央执行委员会的例行会议上，大同会的各部门委员齐聚一堂。伴随着“会社组织与政府关系”这一议题的讨论深入，会场的氛围也逐渐升温。中央派代表林文率先发言，主张通过直接委派干部进入地方政府，确保政策执行的一致性。他强调：“必须维持大同会对行政体系的主导权，只有依托我们的干部群体，才能保障理念执行不走样。”\n组织部部长谭平山则提出不同看法：“单纯依靠大同会会员可能造成人才结构的固化。应该建立公开选拔机制，吸纳更多的专业人才。”他建议通过竞争性考试选拔基层公务员，各个行政岗位对其他政治会社和无党派人士一视同仁。\n双方各执一词时，一直静听的孙文缓缓起身，此时已经年逾古稀的他，依旧拖着病体出席了这次会议。“也许可以找一个平衡点，一定比例的行政干部由我们大同会员担任，其他的岗位则开放给友党及社会大众。这样既保持战略方向，又能巩固统一战线。”\n这个提议似乎得到了大家的认可，会议室内的气氛逐渐缓和下来。代表们开始围绕着这个提议展开讨论，希望能够找到一个既能维护大同会的领导地位又能确保政府独立运作的解决方案。"
  ROC_focus.9.a:0 "“三三制”的公务员任免方案，也许可以暂时平衡现实与理想"
  ROC_focus.33.t:0 "革命政府公务员选拔条例（1)"
  ROC_focus.33.d:0 "第一章 总则\n第一条 为了确保革命政府公务员的忠诚性、能力和对新政治制度的认同，特制定本选拔条例。\n第二条 公务员选拔应遵循公正、公平、公开的原则，确保选拔过程的透明度和广泛代表性。\n第二章 选拔机构\n第三条 设立革命政府公务员选拔委员会，由大同会和其他革命会社的代表组成，负责组织和监督公务员的选拔工作。\n第四条 选拔委员会负责制定公务员选拔的标准和程序，确保选拔工作的科学性和公正性。\n第三章 选拔条件\n第五条 公务员候选人应具备以下基本条件：\n忠诚于革命政府和新政治制度；\n具备良好的政治觉悟和道德品质；\n具备相应的工作能力和专业背景；\n无不良政治记录和社会信用。\n第六条公务员候选人应通过严格的考核和面试，评估其领导才能、政策理解能力和群众工作能力等。"
  ROC_focus.33.a:0 "【下一页】"
  ROC_focus.34.t:0 "革命政府公务员选拔条例（2)"
  ROC_focus.34.d:0 "第四章 选拔程序\n第七条 公务员选拔程序包括以下几个环节：\n候选人报名与资格审查；\n考核与面试；\n政治背景与忠诚度审查；\n选拔委员会综合评估；\n政府任命与调配。\n第八条 候选人报名与资格审查由选拔委员会负责，确保报名者符合基本条件。\n第九条 考核与面试环节应注重候选人的实际工作经验和对社会问题的深刻认识。\n第十条 政治背景与忠诚度审查由专门的审查机构负责，确保候选人不会对新政权构成威胁。\n第十一条 选拔委员会根据考核、面试和审查结果，对候选人进行综合评估，并提出建议名单。\n第十二条 革命政府根据选拔委员会的建议，对公务员进行任命和调配。\n第五章 公务员管理\n第十三条 建立完善的公务员评估和晋升机制，对公务员的工作表现和能力进行定期评估，并根据评估结果进行晋升或调整。\n第十四条 公务员应严格遵守工作纪律和职业道德，为革命政府的稳定和发展贡献力量。\n第六章 附则\n第十五条 本选拔条例自发布之日起生效，由革命政府负责解释和修订。\n第十六条 本选拔条例的最终解释权归革命政府所有。"
  ROC_focus.34.a:0 "选拔人民公仆"
  ROC_focus.10.t:0 "省议院会议"
  ROC_focus.10.d:0 "初秋的阳光斜斜切过议会大厦的拱形窗棂，在橡木地板上投下几何光影。议员们陆续就座时，记录员正在分发印有政策草案的文件。钟声刚落，农业区代表就操着浓重口音开口：“咱省得先保农业啊，现在气候变化搞得多难种地，市场价又老波动。要不政府多收点余粮，别让农民白搭工夫？”\n“工业也得跟上啊！”城市选区的中年议员立刻接话，“现在咱省的财政自主权多了，得赶紧投到工业上，不然企业都被邻省挖完了。”他晃了晃手里的数据表，“去年纺织厂外迁的那事儿，大家还没忘吧？”\n议长钢笔尖在速记本上沙沙作响，偶尔抬头交换眼色确认时间。等双方争得面红耳赤时，他轻叩木槌：“诸位建言都关乎民生根本。”待嘈杂声稍歇，他推了黑框眼镜：“要不这样，先成立个专项委员会，把农业补贴和工业发展两条线串起来？”\n窗外梧桐叶影在墙壁摇曳，议员们开始围绕执行细则讨论。暖壶和文件夹在桌上传递，有人扯着嗓子问预算，有人低头计算指标，钢笔碰撞纸张的窸窣声里，政策框架渐渐浮出水面。"
  ROC_focus.10.a:0 "施权聚力绘宏图，旧制再添照万家"
  ROC_focus.11.t:0 "县委员会工作报告（1）"
  ROC_focus.11.d:0 "一、工作综述\n自大同会革命胜利以来，本县作为新政权核心区域，肩负重建与巩固之双重任务。兹将近期工作情形禀明如下：\n二、既成事功\n（一）土改推进\n实行"耕者有田"政策，均分土地六万余亩，惠及农户三千余户。修建机耕路七十二条、水渠四十三道，初步改善农业生产条件。开办夜校十七所，培训基层干部百余人，群众政治觉悟显著提升。\n（二）宣传鼓动\n组建宣讲团十二支，巡回播讲革命方略，印发《大同会政策问答》五万份。组织“工农解放”文艺队，编演新戏《分田记》，累计演出八十七场，观众逾十万人次。\n（三）秩序整饬\n建立乡级治安队四十二支，破获反动分子破坏案件二十三起。推行"群众监督牌"制度，设立举报箱八十余处，查处贪腐分子七人，有效整肃吏治。\n三、阙失与匡正\n（一）现存问题\n部分山区土改因地形复杂推进迟缓，个别村落出现田亩分配争议；东部矿区宣传工作覆盖不足，矿工对新政策认知尚浅。\n（二）改进方略\n派遣工作组深入实地勘察，实行“一村一策”调整方案；增派宣传队进驻矿区，编印《矿工政策简明读本》一万份，以实物演示阐释政策要点。"
  ROC_focus.11.a:0 "下一页"
  ROC_focus.35.t:0 "县委员会工作报告（2）"
  ROC_focus.35.d:0 "四、未来规划\n（一）深化土改\n完成剩余山区土地确权工作，推行农业合作社试点五处，组织春耕生产互助队二十支。\n（二）宣传创新\n建立广播室九处，购置留声机三十台，录制革命歌曲与政策宣讲唱片；开设"工农通讯员"培训班，培养基层宣传骨干百人。\n（三）经济建设\n设立手工业合作社基金五万元，扶持传统织造业技术革新；规划矿区至县城货运专线，降低物资流通成本百分之十五。\n五、结语\n本县委员会当秉持“实事求是”精神，继续推行政策落实。虽前路多艰，然有民众支持，定能克难奋进。望全体同志保持革命韧性，以扎实工作巩固胜利果实，向着"大同世界"目标稳步迈进。"
  ROC_focus.35.a:0 "大同未竟，奋斗不息"
  ROC_focus.12.t:0 "革命三段论"
  ROC_focus.12.d:0 "专制时代，人民之精神与身体，皆受桎梏，而不能解放。故虽有为国民利害着想，献身以谋革命者，国民不惟不知助之，且从而非笑与漠视之，此事之必然者也。虽欲为国民之向导，然独行而无与从，虽欲为国民之前锋，然深入而无与继续。故从事革命者于破坏敌人之势力外，不能不兼注意国民建设能力之养成，此革命方略之所以为必要也。余之革命方略，规定革命进行之时期为三：第一为军政时期，第二为训政时期，第三为宪政时期。第一为破坏时期，在此时期内，施行军法，以革命军担任打破皇帝之专制，扫除官僚之腐败，改革风俗之恶习等。第二为过渡时期，在此时期内，施行约法，建设地方自治，促进民权发达......宪法制定，总统议员举出后，革命政府当归政于民选总统，而训政时期于以告终。第三为建设完成时期，在此时期施以宪政......此宪政时期，即建设告竣之时，而革命收功之日也。革命方略大要如此。果能循此行之，则不但专制馀毒，涤除净尽，国民权利，完全确实，而国员建设之能力，亦必稳健而无虞。何效有政客之播弄，与军人之横行哉！故革命主义，必有待于革命方略，而后得以完全贯彻也。\n————《中华革命史》节选"
  ROC_focus.12.a:0 "此革命方略为荡涤旧污，促进新治，所必要之历程，不容一缺者也"
  ROC_focus.19.t:0 "利用名单"
  ROC_focus.19.d:0 "广州城东大同会会军驻扎处，刚刚因部队扩编而升任营长的刘贺，此时正与自己的副官闲谈着。谈至兴起时，突然间几个臂上带着军法处袖章的士兵冲入营帐中，迅速将刘贺和其副官控制了起来。\n“干什么！干什么？！你们凭什么抓我？”\n面对刘贺愤怒的视线，军法处的士兵中走出一人，从腰间取出逮捕令后朗声道：\n“刘营长，您涉嫌反革命罪，目前已经被取消一切职务。这是军法处开具的逮捕令，请你跟我们走一趟吧。”\n......\n类似的事情几乎发生在了共和军治下的军、政、商等各个领域，各地的抓捕情报源源不断地汇集而来，最后集中到大同会中央特别行动科的办公室中。\n“......综上，包括张云鹏同志提供名单上的成员在内，特科搜查到的敌特已经全部落网。下一步工作还请方科长指示。”\n听着身边副官的汇报，方声洞缓缓地放下了手中的文件，紧绷数天的面孔上终于露出了一丝释然的神情。\n“好的，情况我都了解了。这段时间高强度行动，特科的同志们都辛苦了，你也下去好好休息吧。”"
  ROC_focus.19.a:0 "道阻且长呀。"
  ROC_focus.36.t:0 "旧军队再教育"
  ROC_focus.36.d:0 "随着革命战线的推进，大同会逐渐洞察到单纯招降旧军士兵的局限性——这些长期受封建军制浸淫的武装人员，需经系统思想改造才能真正认同革命理念。为此，大同会计划在军中开展思想教育工作，分三阶段实施：首先派遣政工教员深入营区，以理论宣讲、英雄事迹分享和宣扬革命前景等方式来影响广大官兵；继而组织军事训练与劳动实践，让士兵在行动中体悟革命纪律性与集体主义；最后通过定期召开的组织生活会，帮助其完成从当兵拿饷到革命战士的身份转化。\n整个改造过程依托军中的政委体系展开，鼓励战士们积极表达观点。依托这种方式，既消解了旧军人员对新政权的本能抵触，也为军队武装注入了真正的革命思想。"
  ROC_focus.36.a:0 "浪子回头金不换"
  ROC_focus.37.t:0 "南洋舰队的联络"
  ROC_focus.37.d:0 "南洋舰队在革命转折点上作出关键抉择：这支曾捍卫海疆的海军力量，通过通电宣布投效广州革命政府，完成从旧制到新生的蜕变。在长时间的秘密联络和策划下，革命力量在南洋舰队中悄然蔓延。随着广州革命的消息传来，南洋舰队的官兵们再也无法忍受旧有体制的束缚和压迫。他们毅然决然地选择了起义，通电全国，宣布加入广州革命政府。\n革命政府迅速派遣代表团登舰接洽，双方围绕军事协同与舰队改造展开实质性谈判。最终协议明确：南洋舰队将以独立建制编入革命武装，同时保留指挥体系过渡期。官兵承诺效忠革命，参与护航、封锁及海上作战任务，为革命根据地提供海上屏障。\n此次易帜不仅补全了革命力量的海权短板，更以“武装起义”的范式为后续争取其他旧军提供了实践蓝本。当最后一艘战列舰在桅杆升起共和旗时，甲板上响起的军乐声，已不再是帝国的余音。"
  ROC_focus.37.a:0 "得道者多助，失道者寡助"
  ROC_focus.1.t:0 "海军部的争论"
  ROC_focus.1.d:0 "海军部会议室内，此时正围绕革命海军的未来走向展开激烈论战。以林建章为首的航空派力推航母战略，主张制空权将主导未来海战，航母编队凭借舰载机可实施超视距打击，打破传统线列战术束缚。\n对面杨树庄等传统派针锋相对，坚持战列舰仍是海上霸权基石。他们援引世界大战的经验证明，重炮群与装甲带构成的战列舰，在舰队决战中具备无可替代的威慑力，其存在本身就是国家工业实力的具象化体现。\n这场争论在海军部内引起了广泛的关注和讨论。双方的观点各有合理之处，也各自拥有一定的支持者。争论的焦点不仅在于航母与战列舰的优劣比较，更在于如何根据国家的战略需求和海军的实际情况，做出最为明智的选择。"
  ROC_focus.1.a:0 "杨树庄的战列舰理论在一战中证明了自身(解锁§Y巨剑构想§!)"
  ROC_focus.1.b:0 "林建章的海航论是海战的未来(解锁§Y海航理论§!)"
  ROC_focus.18.t:0 "大同主义再思考"
  ROC_focus.18.d:0 "大同主义作为一个理论、一种思想，从其诞生之处便蕴含了多种不同的主张。从龚自珍、陶澍到陈兰彬、谭继洵，再到黄兴、孙文、景廷宾、章炳麟，历代学者与革命家皆将理想寄托于“大同”这一美好愿景。尽管学术发展与东西方交流推动了其经济观、历史观、社会观的科学化，但理论内部的分歧并未因此消弭，反而愈发复杂。\n随着大同主义革命实践的推进，会内仁人志士得以将理想付诸实践，并在现实中调整理论框架。当大同革命在这片土地渐趋高潮，如何选择适合的“大同主义”路径以改造国家，已成为亟待解答的革命议题。"
  ROC_focus.18.a:0 "向大同主义社会进军！"
  ROC_focus.18.b:0 "逐步向大同主义过渡"
  ROC_focus.18.c:0 "向大同主义过渡终究是个缓慢的过程"
  ROC_focus.38.t:0 "第三届大同会全会"
  ROC_focus.38.d:0 "随着革命局势渐趋明朗，大同会第三届全国代表大会如期在首都召开。来自各个省份及海外支部推选代表们穿越千山万水，将沾着黄土与海盐的选票带入会场。\n作为党史上规模空前的权力交接节点，本次会议将选举出新一届的中央执行委员会与政治局成员，进而最终确定未来的革命路线。是在既有框架内渐进改革，还是推行彻底的社会重组，代表们即将在党章修正案的字斟句酌间，作出影响国家命运的历史抉择。"
  ROC_focus.38.a:0 "董必武总理带领我们迈向大同社会"
  ROC_focus.38.b:0 "柯麟总理的革命蓝图仍将继续"
  ROC_focus.38.c:0 "黄炎培总理将推动改革"
  ROC_focus.14.t:0 "筹划紧急全会召开"
  ROC_focus.14.d:0 "广州起义摧毁了明帝国在岭南地区的统治，然而这一切只是一个开始，我们的革命政权仍旧处在危机之中。尽管现在并非大同会例行的全国会议时间，但出于巩固华南革命成果，推动全国革命发展的形式需要，大同会中央决定在广州召开紧急会议，对于当今国内革命形式。"
  ROC_focus.14.a:0 "向本土大区各个支部发出邀请"
  ROC_focus.14.b:0 "了解大同会本土大区情况"
  ROC_datong.1.t:0 "大同会本土大区情况"
  ROC_datong.1.d:0 "大同会本土大区涵盖中央及华北局、西南局、星洲局、长江革命委员会、吕宋革命委员会等地方组织。相较于海外支部，本土地方支部理论上自主性较低，理应受中央更多约束。但实际情况却不然——1903年中央遭明廷重创后，各级组织陷入瘫痪，地方支部被迫自行其是，长江局甚至全面掌控了该地区大同会的人事、财政与决策权。\n尽管中央在数年后于广州重建，但各地支部早已形成各自为政的山头格局，元气大伤的中央只能默认这一局面。自黄兴总理起，中央便试图加强领导权，柯麟总理改组后更对支部权力多次调整。这些举措虽强化了中央权威，却加剧了与右派据点长江局的矛盾，即便同属左翼的西南局、华北局，与中央亦有分歧，各派斗争令内部矛盾愈发激化。\n如今革命形势发展，如何协调地方局关系、整合力量推动革命，已成为大同会亟待解决的难题。"
  ROC_datong.1.a:0 "向本土大区各支部发出邀请"
  ROC_datong.2.t:0 "会议召开"
  ROC_datong.2.d:0 "大同会紧急全会在广州前咨议局召开，柯麟总理亲自主持了这次会议。中央委员陈天华在开幕致辞中强调了当前国内战争大规模爆发的严峻形势，并指出此次会议对于大同会未来的重要性。\n除了中央局的人员外，来自本土大区的各个支部代表也受邀参加了会议。然而，由于战争的影响，许多支部无法派遣足够的代表前来参会，多数支部只能派遣联络员出席。天津支部作为唯一的大举南下的支部，各级代表与支部书记均参加了会议。\n在为期一周的会议中，与会代表就当前形势、组织发展、战略部署等议题进行了深入的讨论和表决。最终，会议做出了以下重要决策：\n1.以华南为革命重心，加强在该地区的组织建设和宣传工作，推动华南地区成为反帝反封建的革命中心。\n2.加大对农民和工人等基层群众的宣传和组织工作，利用当地媒体、学校和社区进行反帝的宣传教育，旨在提高群众的觉悟，扩大革命的影响力。\n3.加强与国内外进步组织和团体的联系与合作，共同反对帝制与剥削。\n4.优化财务和资源筹集的问题，确定了筹集资金和物资的途径和方法，以确保大同会的各项活动能够得到充分的支持和保障。\n大同会紧急全会的成功召开，为大同会未来的发展指明了方向，也为华南地区的革命斗争注入了新的活力。"
  ROC_datong.2.a:0 "革命尚未成功，同志仍需努力！"
  ROC_focus.16.t:0 "周饶的支持"
  ROC_focus.16.d:0 "今日，一支来自周饶的志愿军抵达广州。自广州起义以来，梅花旗高扬，共和军声名远播，引发世界各国高度关注。周饶作为南半球大同主义的桥头堡，始终矢志不渝地推动大同主义的理想实现。此次派遣志愿军赴华南，正是与志同道合的同志们并肩奋斗之举。这支部队由经验丰富的战士组成，将与共和军携手，共同对抗明帝国的反动势力。"
  ROC_focus.16.a:0 "欢迎周饶的同志！"
  ROC_focus.15.t:0 "大同会国际大会"
  ROC_focus.15.d:0 "东方革命者的大同会国际大会。来自中国本部的大同会，以及极北、炎州、青丘、榜格剌、煌原、道山、周饶、兰芳、大越、日本、朝鲜、霞仪、琉球等海外局的代表们，齐聚一堂，共商革命大计，大同会总理柯麟进行了开幕仪式的致辞。\n会议伊始，中国本部的代表首先发言。他声音铿锵有力，谈及国内的社会矛盾，指出贫富差距、封建残余以及军阀混战是当前的主要难题。他呼吁国际大同会中的执政国家，能为本土的革命起义提供资金和策略上的援助，以推动国内的革命进程，只有内外合力，才能打破桎梏，实现真正的大同社会。"
  ROC_focus.15.a:0 "大同之花，绽放岭南"
  ROC_datong.3.t:0 "北美大区呼吁关注北美革命"
  ROC_datong.3.d:0 "下一个会期进行讨论的是北美洲革命问题。极北局代表首先发言，指出极北地区自然环境严酷、生活条件恶劣，强调唯有革命才能根本改变现状。他请求国际大同会提供物资与技术支持，协助当地开展武装斗争。\n炎州局代表以金门的社会状况为例，指出尽管大同会在炎州执政，但内部路线争端与大资产阶级影响力仍严重掣肘改革进程。他揭露右派与资本势力勾结导致社会矛盾激化，同时外部帝国主义干涉威胁着民众安全。代表呼吁国际大同会在意识形态和外交层面提供支持，并承诺炎州将追加资金支援全球的革命事业。\n青丘局的代表聚焦于本土的社会问题，特别是原住民以及东西方移民的权利和土地问题。他强调，只有实现民族平等和土地公正分配，才能真正推动革命的进程。青丘希望大同国际能够通过决议与第三国际展开深入合作，这也有利于北美地区的整体革命力量发展。"
  ROC_datong.3.a:0 "新启之地，革命之光！"
  ROC_datong.4.t:0 "天竺大区希望大同国际支援武装革命"
  ROC_datong.4.d:0 "下一个会期，国际会议集中讨论天竺大区的相关问题，在会上榜格剌局代表详细阐述了当地的贫困和压迫情况，并介绍了当地游击队开展的武装活动：\n“我们正在进行着艰苦的革命斗争，但缺乏必要的资金和物资支持。国际大同会的援助对于我们来说至关重要，它不仅能帮助我们解决眼前的困难，更能为我们指明革命的方向。”"
  ROC_datong.4.a:0 "星星之火，可以燎原！"
  ROC_datong.4.b:0 "对不起，我们暂时无能为力"
  ROC_datong.5.t:0 "南美大区强调当地革命的独特性"
  ROC_datong.5.d:0 "南美大区会议上，煌原局代表率先分享了与大资产阶级联合执政的经验，称其为掌握政权的有效路径。然而，该策略引发了部分与会者的质疑，他们担忧此类妥协可能阻碍大同主义改革，滑向修正主义，甚至放弃革命初衷。面对这些质疑，煌原局代表坚称，南美洲拥有独特的历史背景和社会环境，尤其是在强大的军事贵族和外部压力下，激进的革命手段难以获得当地民众的支持。他呼吁与会者尊重并理解煌原局的实际情况和选择。\n道山局代表未多言，而是通过历史遗迹和民众生活照片的展示，直观呈现殖民遗产与社会困境。从四方王国（印加王国）的城址到殖民压迫痕迹，再到当代贫民窟写照。这些无声的证据，诉说着殖民时代的残酷和压迫，以及后殖民时代四方王国贵族们生活的纸醉金迷。\n道山局的代表通过这一方式，表达了他们对于国际大同会宣传和组织支持的迫切需求。他们渴借助国际的力量，唤醒民众的革命意识，共同为推翻旧的压迫体制而奋斗。"
  ROC_datong.5.a:0 "煌原自有国情在此呀！"
  ROC_datong.6.t:0 "南洋大区聚焦兰芳革命"
  ROC_datong.6.d:0 "在南洋大区的讨论会期上，首先发言的是兰芳局代表。代表着重指出，工农群体虽为南洋社会立命之本，却长期遭受严重的削剥压迫。贫富悬殊、田土纷争、非人劳役——此三座大山正压垮劳苦大众。兰芳局虽积极争取工农权益，力促社会改革，然效果有限。尽管已联合南洋数家革命团体，但革命力量依旧严重不足，为此他们急需大同国际的支持和援助。\n为了更具体地展现他们所面临的挑战和斗争，兰芳局代表还分享了一系列斗争纪要。他们不仅努力提高民众的意识，还通过工运、学运等各种方式组织民众对抗反动政府。\n周饶局代表随后发言，表明愿为兰芳斗争提供提供必要的援助、资金和物资。在此基础上，周饶代表还表示将关注本土的革命事业。他们认为，只有通过全面的社会变革，才能真正实现平等与繁荣。为此，他们呼吁国际大同会加强与其他局的合作，共同推动南洋地区的革命与进步。"
  ROC_datong.6.a:0 "临冬梅花绽，烈火燃南洋!"
  ROC_datong.7.t:0 "中南大区与王室合作"
  ROC_datong.7.d:0 "在中南大区的讨论会期中，大越局代表深入剖析当地的革命历史与现实格局，着重指出与安南王室构建协作关系的战略价值。他强调革命进程需遵循客观规律，必须以时间积累、战略定力和持续行动稳步推进。\n针对安南王室议题，代表提出务实的合作框架：若其能接纳大同主义核心理念、主动支持改革，并切实保障工农阶层基本权益，那么大越局并不主张与其彻底为敌。他援引历史事例说明，早年大同党人在危难之际曾获王室庇护，这种政治互信传统为当下合作提供了历史依据，且这种联合将有效拓展大同主义在中南半岛的传播范围。\n针对当前的革命局势，大越局代表认为，中南大区正处于一个至关重要的历史节点。虽然革命取得了一些明显的成果，但仍面临着许多挑战和困难。他强调了革命的复杂性和长期性，呼吁各方应携手合作，共同推动革命不断向前发展。"
  ROC_datong.7.a:0 "同志仍需努力"
  ROC_datong.8.t:0 "东洋大区再燃革命烽火（1）"
  ROC_datong.8.d:0 "东洋大区的发言会议上，革命的火药味愈发浓重。首先发言的是日本代表，他一开始便深入阐述了东日本正在进行的土地改革等一系列重大举措。日本局代表以充满希望的口吻表示，这些改革不仅是为了东日本的未来，更是对整个东洋革命走向的一次重要考验。他强调，土地改革的推进，旨在打破旧有的不平等结构，确保资源的公平分配，从而奠定一个更加公正、繁荣的社会基础。\n在谈及东日本的改革与统一战争时，日本局代表的立场坚定而明确。他表示，将不遗余力地支持东日本的改革与统一努力，助力其人民摆脱束缚，走向真正的自由和解放。他的话语中透露出对东日本人民的深厚情感和对革命的坚定信念。"
  ROC_datong.8.a:0 "接下来"
  ROC_datong.9.t:0 "东洋大区再燃革命烽火（2）"
  ROC_datong.9.d:0 "随后，朝鲜局代表以充满激情的言辞阐述了朝鲜对革命的坚定追求。他强调了革命对于实现社会平等和人民自由的重要性，并表示朝鲜局将不遗余力地推动朝鲜的革命事业。朝鲜局代表呼吁所有追求自由、平等和公正的力量团结起来，共同为朝鲜的革命事业奋斗。他同时希望大同国际的其他伙伴能够关注并支持朝鲜的革命事业。\n琉球局代表在会议上以坚定的声音表达了对琉球独立和人民自由的追求。他强调了革命对于作为小国的琉球的重要性，并表示尽管局势艰难，但琉球局将坚定不移地推动琉球的革命事业。琉球局代表呼吁所有追求自由、平等和公正的力量共同为琉球的革命事业奋斗，并希望大同国际的其他伙伴能够给予支持和帮助。\n最后，霞仪局代表以深思熟虑的态度阐述了霞仪地区对根本性变革和名分确认的追求。他强调了革命对于霞仪地区进步和发展的重要性，并表示霞仪局将不遗余力地推动霞仪的革命事业。霞仪局代表呼吁所有追求进步、变革和公正的力量共同为霞仪的革命事业奋斗，并希望东洋大区的其他伙伴能够关注并支持霞仪的革命努力。"
  ROC_datong.9.a:0 "东风起处旌旗展，革命豪情破浪空。"
  ROC_focus.13.t:0 "临时制宪会议"
  ROC_focus.13.d:0 "随着革命政权在华东六省站稳脚跟，制度建设需同步推进。经柯麟总理召集，中华革命委员会决定于下月初召开“临时制宪会议”。来自各行政区的民选代表与各界委员将共同起草首部宪法草案，确保革命政权的治理框架建立在民主的基础之上。人民代表将通过革命获得的权力，制定出这篇土地上第一部真正维护人民权益、代表人民利益的宪法！"
  ROC_focus.13.a:0 "共和政府的制度建设，才刚刚启程"
  ROC_focus.17.t:0 "建设基层党组织"
  ROC_focus.17.d:0 "黄兴总理改革确立的基层党支部结构，是大同会组织工作的核心基石。作为组织架构的基本单元，所有党员均编入基层党部，定期开展组织生活会。基层支部的活动涵盖批评与自我批评、民主评议及组织决议的执行监督等各方面。这种制度设计确保政策指令能穿透层级直达末端，同时通过群众路线反馈基层实情。\n随着我们革命事业向北不断推进，是时候在全国范围内重建我们的基层党组织，让大同之风再度在全国刮起了。"
  ROC_focus.17.a:0 "为民先锋！"
