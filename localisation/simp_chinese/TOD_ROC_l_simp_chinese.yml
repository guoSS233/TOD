 ROC_minister_agenda.41.t:0 "工资册上的设备折旧费"
 ROC_minister_agenda.41.d:0 "陈赞贤把机器厂的工资册抄本摊开，连续三个月的夜班栏里都扣了“设备折旧费”，可厂方总账上找不到对应的支出。他问技术主任：“钱扣了，账上却没有，这笔折旧去了哪？”技术主任答：“都买了防护罩和电线，安全基金早就花完了。”陈赞贤抽出工会记录：“工人只同意从利润里拨安全款，谁同意从工资里扣？”主任说：“工资核算有厂里的既有办法。”\n\n中央经济会议上，大同党左派的工会希望先厘清事故责任再发钱，不愿让补发变成免查的收据。陈赞贤若先决定补发，就越过了本派代表坚持的复核次序，能尽快稳定局面，却得承担他们的不满；联合查票留给中派签审位置，也让工厂账并入公共核验，代价是再等一轮会签。先保订单能安抚担心停工的工人，部长的复核案仍得排队。\n\n工头站在门边，忽然插了一句：“防护罩，是出了事故才装上的。”陈赞贤让他进来细说。话没讲完，一封医院报告送到：受伤学徒的医药费，是从工资扣款里付的，账上却记在工厂公用支出。陈赞贤把报告举到技术主任面前：“你们说这笔钱用在设备上，那学徒的医药费，怎么也算设备折旧？”主任退了一步：“账目归会计，口径我不清楚。”\n\n陈赞贤把工资册、工伤报告、订单期限并排摆好：“现在补发，零件采购款会出缺口；等审计查完，第二班可能集体不开机；只让厂方自己写说明，事故责任又会被同一本账盖住。”他问技术主任：“先保订单，还是先保人？”主任没答，只说：“订单是省里下的，期限紧，耽误不得。”门口采购科又探头催开机，陈赞贤没回头。"
 ROC_minister_agenda.41.a:0 "补发扣下工资"
 ROC_minister_agenda.41.b:0 "联合核对凭证"
