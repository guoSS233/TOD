ROC_legislation_outcome_sector_tabled:0 "项目技术材料尚未齐备，暂缓办理"
ROC_legislation.105.t:0 "项目材料尚未齐备"
 ROC_legislation.105.d:0 "《[ROOT.ROC_bill_last_name]》的项目成本和承接责任仍未形成书面材料。中央代表还在协商预算顺序与监督权限，项目方只在副本上签收，未认领具体手续；财政处无法确定拨款口径，主管部门也没有可执行的交接单。案卷暂缓归档，待中央约定与技术材料分别补齐后再重新提报。"
 ROC_legislation.105.a:0 "记下缺席的签名，暂存方案"
