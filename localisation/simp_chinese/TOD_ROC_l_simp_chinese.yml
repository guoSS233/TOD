 ROC_ma_story.505.t:0 "价目表走不到的路"
 ROC_ma_story.505.d:0 "集市价目、称重规则和收购扣费已经公布，农户在摊前可以比较报价。中央接到的新问题却发生在到集之前：几家收购行按明价买谷，合同里另列“等船费”和“加急运费”，有的货等了许久才到码头，农户拿到的净款仍难比较。商会代表说，路程与水位不同，运费当然不能一律相同。\n\n萧铮承认运费有差别，请他解释为何同一条船的两张报价，一张写短途、一张写加急。代表答，前者是距离，后者是服务；农会代表问，两种服务能否同时到达。大同党左派要求把扣费和到货日期讲清，中派担心中央替商会逐笔定价会使会签拥塞；右派中的小商户也希望公开费用，却反对把所有延误都算作商人的恶意。\n\n运输员带来一份水位记录：有一日确实不能行船，另一天却因仓库只安排一次卸货而错过了潮汐。两种延误都记在“等船费”里，农户无法看出差异。商会代表愿意协助分类，但提醒部长，如果中央要求在报价时写死全部运期，遇到洪水时买卖双方仍要重谈。\n\n秘书提出把已公布的价目继续挂在集市，同时请收购行列出预计运费、扣费理由和到集日期；变更时留一份通知给卖方。财政处问印单费用由谁出，商会代表认为应由各行自担，却担心有人故意少写费用抢生意。农会则要求有一处可以申诉，否则通知只会多出一张农户看不懂的纸。\n\n萧铮让各方带着实际合同继续议，不把迟船与欺诈混为一谈，也不让“行市”两个字代替说明。散会时秘书收到商会寄来的价目表，印得很大，运费说明却另附一张小纸。她请商会代表试着从门口读出来；代表看了半天，走近后才说：“看来这笔印刷费还有改进的余地。”"
