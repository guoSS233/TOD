 ROC_ma_story.405.t:0 "验收人的轮次"
 ROC_ma_story.405.d:0 "共同验收制度已经实行，工人代表和检验员签认了首批合格货。下一批订单换了新工序，原代表中有人要回车间带班，工会请中央商定补选与培训。厂方经理建议直接沿用原名单：“既然第一批通过，证明原来的人已经很合适。”带班师傅答：“我可以继续签字，只是白天要先把自己分成两个人。”\n\n年轻工人熟悉新机器，老技工能听出轴承异响，两边都希望有人参加；工会领导倾向由各车间推选，厂方则担心刚上岗的人看不懂量具。大同党左派支持代表由工人选出，但其内部也有人担忧任期太短使验收责任无人追究。中派主张保留现有代表，等下一轮统一培训；右派厂商希望标准和签字人稳定，以便对交货负责。\n\n检验员提出，共同验收的程序不能变，但可让老技工与新工人轮换，或将补选提名交给车间。经理担心中央少了审定权，资格争议会转到部长头上，又问学习时误掉的产量算谁的；工会代表说，若只让工人在休息日学习，名单上看似人人有资格，实际能来的只有不用照顾家里的人。培训的工时和替班的钱，还要在中央预算里找到位置。\n\n秘书拆开一封来自车间的意见书，里面附有两位候选人的签名：一位老技工请求暂时退到候补，一位年轻工人愿意跟班学习。经理看后说：“他们倒是自己安排好了。”秘书提醒，候补名单还要经理批准，而经理原来的意见是名单不必变。经理笑了：“我只是怕变化影响稳定。”老技工说：“您先替我上今晚的班，我就能保证稳定。”\n\n陈赞贤请各方讨论怎样补选、谁来培训以及培训时间由谁支付。共同验收不会因有人换班而停止，首批代表也愿意带新人；他们需要的只是有人在中央承认，学会看一件合格货，和签下一张合格单一样要花时间。"
