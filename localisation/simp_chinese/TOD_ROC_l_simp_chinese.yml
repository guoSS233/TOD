  ROC_gonghe:0 "共和军国策树"
  ROC:0 "华南招抚司国策树"
  ROC_custom_datong_is_NOT:0 "大同叛匪罢了"
  ROC_custom_datong_is_YES:0 "广州的梅花开了"
  banbutongjiling:0 "颁布通缉令"
  banbutongjiling_desc:0 "遵照朝廷指令，我司将迅速部署，对区域内大同会的激进成员实施抓捕行动。针对首要乱党分子，我司已明确定立“通缉名单”，并诚挚呼吁社会各界人士鼎力相助，提供有效线索者，我们将予以丰厚物质奖励。"
  zhenduixingsoubu:0 "针对性搜捕"
  zhenduixingsoubu_desc:0 "学校、工厂和所谓的“合法农会”是大同逆党主要活跃的场所，许多“工农组织”往往处于合法与非法的灰色地带。正因为如此，贸然扩大打击范围将极有可能扰乱生产秩序，引发工农阶层的强烈反应，所以以往政府在此类搜捕行动中往往采取谨慎态度。然而，然而，此次他们的行动已然彻底越过红线。即便面临可能对经济生产造成的不利影响，我们也誓将彻底清除所有与大同逆党有染的组织，绝不姑息，以维护社会的稳定与正义！"
  yazhikangyixuesheng:0 "压制抗议学生"
  yazhikangyixuesheng_desc:0 "尽管我们已然准备了相应预案，但学生抗议的规模还是超出了我们的预期，以广大、保大为代表的华南高校学生迅速行动起来，反对我们突入学校、逮捕学生的行为。这些高校学生不少来自权贵家庭，尽管我们此次是奉皇命开展搜捕，但如果不能妥善处理，依旧有可能酿出大患。"
  dajinonghuibaotu:0 "打击农会暴徒"
  dajinonghuibaotu_desc:0 "在远离城市的辽阔乡村地带，亦是大同叛党隐匿的温床。他们巧言令色，迷惑乡间百姓，暗中策划，组织起农会以作掩护，企图在乡野间悄然壮大其势力。我方已立誓要根除这股叛逆之祸，相较于城市，在农村即使有些过火也并不大碍。秉持“宁肯错杀一千，绝不放过一个”的原则，是时候让这些乡巴佬尝尝朝廷铁拳的厉害了！"
  baozhenggongchangshengchan:0 "保证工厂生产"
  baozhenggongchangshengchan_desc:0 "随着搜捕深入到工业领域，许多工厂的工会干部和技术人员被带走审讯，各大企业内部一时人心惶惶。部分调查人员向我们上报了这一情况，并指出大同逆党有可能凭此生事。他们的担忧不无道理，我们应该出台相应的配套政策，在打击大同逆党的同时，保证工业生产的正常进行，从经济方面对大同逆党的支持者釜底抽薪......前提是，这些底层牛马懂得配合。"
  kaizhanyulunxuanchuan:0 "开展舆论宣传"
  kaizhanyulunxuanchuan_desc:0 "在各项搜捕行动外，我们同样应该注意舆论宣传。如今市面上悄然流行着许多大同会的小册子，尽管我方三令五申严禁民间传阅，但各地搜剿的册子却反而越来越多。也许我们应该换个思路，凭借强大的宣传机器向民众进一步揭露大同逆党的丑恶行径，让民众自发地支持我们"
  choubeijunshijieyan:0 "筹备军事戒严"
  choubeijunshijieyan_desc:0 "我们潜藏在大同会内部地间谍刚刚送来消息，大同逆党居然在我们的军队中渗透了不少人员！尽管我们目前还尚未取得具体地人员名单，但继续放任各支军队随意活动无疑是危险的。我们可以通过筹备军事戒严地名义对于各个军队进行协调部署，等到特工下一步消息传来，便可以将这些军中逆贼一网打尽！"
  ROC_custom_tudigaige:0 "解锁§Y乡村建设§!决议"
  ROC_custom_tuidongxiangcunjiansheyundong:0 "§Y乡村建设§!决议花费§Y减半§!"
