 ROC_minister_agenda.52.t:0 "抵押田契还是公开秤价"
 ROC_minister_agenda.52.d:0 "萧铮把县信贷处的贷款名单和集市收购价单并排摆开，问信贷员：“农具贷凭什么作保？”信贷员答：“按规矩，要有田契。”萧铮指指名单上几户妇女：“她们实际种着地，怎么因契约上写的是亲属名字，就被划到门外？”信贷员说：“名单按契约核的，这也是既有口径。”\n\n一位女农户把两只秤砣放到桌上：“收购行的秤，我拿去验了，这一只少称半斤。”萧铮问：“秤具你们封存过没有？”信贷员摇头：“封存不归我们，县里也没下这个权。”话没落，又查出信贷名单把一块地主田误列成了小农自耕地。这时银行电报到了，催着本周交担保，否则改向大商号放款。\n\n在中央经济会议上，大同党右派担心不用田契担保会使信贷合同难以追偿，萧铮改用合作社担保，即便赢得部分支持，还是会动用本派的信誉。公开利率和秤价给中派共同审查的依据，也为市场方向的办法留出空间；重新核实借款名单就要等一轮。按旧田契处理则保住右派的现成规则，未列入的农户仍要等下一次议程。\n\n萧铮把地籍图、贷款条款、抽检结果收拢：“只护着田契，秋粮还是会被低价收走；只盯着秤价，农具贷款照样落到地主名下；全交给合作社担保，坏账就都堆到合作社头上。”信贷员低声：“担保要是交不出，银行的时限就过了。”萧铮问女农户：“这秤，还有第二把吗？”她说：“有，另一把，我还没舍得拿出来。”"
