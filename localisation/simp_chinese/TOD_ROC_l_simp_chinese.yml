ROC_pingheng.42.t:0 "革命稳健派"
ROC_pingheng.42.d:0 "广州革命委员会初立，百端待举。在新生共和政府的架构内，一股不容忽视的力量正悄然凝聚，外界将之称为“革委会右派”。其成员包括诸多秉持稳健理念的自由主义政党（如中华民主同盟、自由党）、部分进步企业家、商会代表，以及认同共和的前政府开明人士。在革命委员会的日常运作与重大议题讨论中，右派的声音日益清晰。他们视自身为革命洪流中的“压舱石”与“建设者”，致力于在理想与现实、变革与稳定之间寻求可行平衡点，确保新生的共和国行稳致远。这一务实立场，正吸引着越来越多担忧社会失序、渴望安定发展的民众与精英的关注。"
ROC_pingheng.42.b:0 "所谓的“革命稳健派”？"
ROC_pingheng.43.t:0 "自由大同盟成立"
ROC_pingheng.43.d:0 "革命委员会成立未久，暗流涌动。面对复杂的局势与委员会内外的纷争，“革命稳健派”深感单打独斗的局限。这一日，在中华民主同盟领袖杨杏佛的寓所书房内，气氛格外凝重。煤油灯下，围坐着自由党的罗隆基、几位颇具声望的商会会长，以及数位学界名流。\n杨杏佛放下手中的茶盏，环视众人，语气恳切：“诸位同道，革命虽成，前路维艰。激进思潮汹涌，秩序根基动摇。我等秉持自由民主、尊重法治与私产之念，若不能精诚团结，凝聚更广之力，何以守护革命之真义？我提议，我们应摒弃门户之见，成立一个更广泛的联盟——‘自由大同盟’！”\n罗隆基率先颔首：“杨公所言极是！自由党全力支持。大同盟正当其时，需让工商市民知晓，稳健改革方能保民生、固国本。” 杨仲绰等商会代表们也纷纷附议，忧心忡忡地谈论着市场的不安。学界人士则强调法治与思想自由的重要性。\n倡议迅速得到响应。数日后，“自由大同盟”宣告成立的消息在广州城传开。成立伊始，同盟便展现出蓬勃活力。在胡鄂公等人的推动下，政治沙龙在报馆、会馆接连举办，各界人士济济一堂，热烈讨论着“秩序下的自由”、“法治保障的民主”、“渐进革命”这些同盟的核心理念。街头，同盟成员正向市民分发新刊印的《自由之声》，上面清晰阐述着他们的主张：呼吁制定保护产权的法律、建立独立的司法体系、保障言论出版自由、推动稳健的经济发展政策。"
ROC_pingheng.43.b:0 "这就行动起来了？"
ROC_pingheng.1.t:0 "经济缓进方略"
ROC_pingheng.1.d:0 "“诸位同仁，”林汉达的声音不高，却清晰有力，在略显嘈杂的议事厅内压下了一片低语，“革命功成，百废待兴，诚然可喜。然观我新生政权之经济根基，实如久病初愈之躯，虚弱不堪。当此之时，冒进犹如饮鸩止渴！”他环视全场，加重了语气，“我自由大同盟，今日正式提请审议《经济缓进方略》。”\n他展开文稿，指尖划过重点：“方略首重者，巩固农业根基！诸君试想，经战火蹂躏之农村，凋敝之农民，岂能再经折腾？稳定之农业生产，乃民生之基石、社稷之定盘星！故我主张，当务之急：修复水利沟渠，调拨农具良种，切实减轻农税徭役——务使耕者有其利，仓廪渐丰盈，确保百姓饭碗无虞，此乃稳定之基！” 他注意到几位来自农业府县的代表微微颔首。\n“然仅有农桑，不足以言复兴。”林汉达话锋一转，“在此稳固根基之上，方谈有计划地发展工业。此‘计划’非昔日官府僵化之指令，”他特意停顿，扫过几位前官员代表，“而是审慎规划产业布局，优先发展关乎国计民生、且我辈尚具条件之基础工业——能源、交通、纺织，乃重中之重！绝不可好高骛远，遍地开花。”他语气坚决，“发展之道，在于循序渐进！须依据我之资源、技术、市场实情，一步一印。尤须注重推广技术、培育人才、积累资本，此三者乃工业根基，断不可虚浮！”\n林汉达合上文稿，目光炯炯地望向主席台与在座委员：“同盟嘱我强调，此方略之终极所求，在于实现经济之可持续增长！唯有根基扎实、步伐稳健之增长，方能真正累积起支撑社会进步、改善民生乃至实现我等宏愿之坚实物质基础！”他言辞恳切，“恳请委员会采纳此方略。切莫因一时急切，致经济失衡、资源空耗、民心浮动。”\n话音落下，议事厅内陷入片刻沉寂，随即响起一片低沉的议论声。"
ROC_pingheng.1.a:0 "言之有理，经济建设确实不可操之过急"
ROC_pingheng.1.b:0 "北方尚待解放，经济建设不等人呀！"
ROC_pingheng.2.t:0 "请愿书"
ROC_pingheng.2.d:0 "“徐老，您看看，”张启元指着桌上几份公文复印件，声音带着压抑的愤怒，“这新出的‘物资调配令’，明面上说一视同仁，可实际批给国营厂的棉花配额是我们的三倍！税收减免政策也是，国企能缓缴半年，我们这些私营的，差一天都罚得倾家荡产！这叫我们怎么活？这跟革命前那些衙门卡脖子有什么两样？”他猛地灌了口凉茶，试图压下火气。\n李慕华叹了口气，将那份初稿推向徐傅霖：“张老板的困境并非个例。徐先生，我们商会连日来收到的诉苦信堆积如山。市场准入处处是玻璃门，融资更是难如登天，银行一听是私企，利率高得吓死人不说，还要求抵押祖宅！更别提那些恶性竞争了——外省来的劣质布匹在本地倾销，价格低得离谱，我们本地工坊正经做生意的，成本都收不回！”他指着文件上一行字，“您看，这里写的‘遭受不应有的经济损失，甚至陷入生产困境，难以维系日常运营’，绝非危言耸听，是每天都在发生的事实。”\n徐傅霖面色严肃，手指划过文件上“要求保障民企利益”的标题，以及下方列出的具体条款：打破所有制藩篱、确保市场准入、税收、融资的完全平等；加强监管，严打价格倾销、欺诈和地方保护等恶性竞争。他沉声道：“张老板的遭遇，李会长反映的问题，我们一定予以重视。”\n自由大同盟内部经反复调研讨论，一致认定：当此百业待举、财政吃紧之际，民营工商业实乃恢复经济活力、创造就业、贡献税收之命脉！ 其生存发展，直接关乎新生革命政权经济根基之稳固！ 基于此共识，大同盟迅即起草报告，并再向商界征询意见。\n徐傅霖执笔点向报告结尾：“保护民企，绝非偏袒资本，实为保护市场经济之活水源头，保护万千工人及其家眷生计！” 他目光坚定：“提案的最终目标，在于营造公平、透明、法治化之环境，使民营资本敢投愿营。唯此，方能激活市场，促进复苏，为共和政府提供稳定财税与就业，巩固革命成果！”\n“说得好！”李慕华击掌，眼中燃起希望，“这份吁请书，字字句句都说到我们心坎里了。陈先生，何时能递上去？”\n“明日一早，我将亲自呈交革命委员会秘书处。”徐傅霖将吁请书郑重收进公文包，深色的布料在灯光下显得格外肃穆，“如果不是您们及时反馈，我们都不知道经济出了这么大的问题。希望能敲响警钟，促使委员会认真审视现行政策。”\n徐傅霖的身影消失在暮色中的石板路上，张启元望着窗外星星点点的灯火，喃喃道：“但愿…真能有点用吧。”"
ROC_pingheng.2.a:0 "言之有理，确实应当保障民企权益"
ROC_pingheng.2.b:0 "公有企业承担社会职责，必须在税收等方面予以优惠"
ROC_pingheng.3.t:0 "邀请商界人士入会"
ROC_pingheng.3.d:0 "广州革命委员会一间侧厅，窗外木棉盛开。自由党领袖罗隆基与华南商会会长杨仲绰对坐品茗，茶烟袅袅。桌上摊着几份标注着岭南知名实业家名字的卷宗。\n“努生兄，”杨仲绰轻叩桌面，指向卷宗，“你看，陈氏航运、南洋烟草、广生隆机器厂…这些大实业家，手中握着实实在在的船队、工厂、销路，还有遍布商界的脉脉温情（人脉）。革命虽成，然百废待兴，经济实力、产业根基，光靠口号填不饱肚子啊。”\n罗隆基颔首，目光深邃：“正是此理。仲绰兄，我自由大同盟向委员会提议积极吸纳此辈入会，绝非权宜之计。其掌握之资源与影响力，实乃增强我革命阵营综合实力之关键。” 他端起茶盏，语气转沉，“革命非仅破坏，更需建设。欲图产业繁荣、社会进步，非借重彼等在经济发展中之引领作用不可。 让他们入会，非为妥协，实为汇聚各方力量，为国家经济建设注入强援！”\n杨仲绰抚须微笑：“然也。彼等亦需稳定环境施展拳脚，与我等追求秩序、渐进之理念多有契合。若能将其财富、经验、人脉，转化为国家建设之有力支持，则共和之基更为稳固。此议，当力促委员会通过。” 两人对视，眼中皆是对未来的期许。这份名单，即将成为革命委员会内部一份分量不轻的提案。"
ROC_pingheng.3.a:0 "批准入会"
ROC_pingheng.3.b:0 "革委会怎么能允许大资本家加入？"
ROC_pingheng.4.t:0 "广州证券交易所"
ROC_pingheng.4.d:0 "自由大同盟代表徐永祚将一份提案轻轻推到桌子中央，封面上清晰地印着：《关于恢复广州证券交易所运作之提议》。他声音不高，却字字清晰：“麦考利先生，老周，今日请二位来，是想听听你们对这份提议的看法。广州证券交易所，昔日本埠金融之枢纽，血脉所在。”\n老周的眼睛瞬间亮了起来，手指猛地攥紧了印章盒：“徐先生！您…您是说真的？那地方，革命后就再没听到铜锣响、报价声了！多少老伙计，一身本事都荒废了！”他声音有些发颤。\n麦考利先生拿起提案，金丝眼镜后的目光锐利地扫过内容，眉头微蹙：“徐先生，恕我直言。革命之后，市面萧条，人心未定。此时重启交易所，风险几何？资金何来？信心何在？即使这个议案最终得到通过，又怎么恢复其运作，促进资本流通？ 愿景虽好，谈何容易！”他放下文件，语气带着职业性的怀疑。\n徐永祚迎向两人的目光，沉稳回应：“正因经济亟待发展，才需此一剂强心针！昔日枢纽废弃，犹如断我经济血脉。 恢复广交所，并非简单重启。”他指向提案细则，“我们提议重建规则，严控风险，吸引侨资、民资乃至寻求稳健回报的游资入市。让债券有处可售，让优质企业有路可募资。金融活了，实业才能兴！”\n他身体微微前倾，语气恳切而坚定：“此举更深意在于，向外界昭示我新生共和政府之开放与包容！ 我们并非要扼杀市场，而是要建立规范、透明、有活力的现代金融秩序。这，是经济复苏不可或缺的一环！恳请二位，以专业眼光，斧正此议。”\n老周激动地点头，仿佛已经听到那久违的开市锣声。麦考利先生沉吟片刻，终于拿起笔，在提案上仔细勾画起来：“细节…需要再斟酌。但，徐先生，这个方向…或许值得一试。” 窗外，珠江上的汽笛长鸣。"
ROC_pingheng.4.a:0 "退一步进两步，批准设立！"
ROC_pingheng.4.b:0 "金融市场与海外牵涉太深，暂不宜恢复"
ROC_pingheng.5.t:0 "乡村矛盾缓和化"
ROC_pingheng.5.d:0 "眼看冲突一触即发，几个年轻佃农霍然起身，有人抄起了带来的锄头柄！甘乃光猛地跨前一步，张开双臂，声音洪亮却带着安抚的力量：“各位父老乡亲！都静一静！锄头能砸烂东西，砸不出活路，更砸不出饱饭！”他目光扫过激愤的佃农和惊惶的地主。\n“今日我来，不是为煽风点火，是受政府之托，为求一条和平协商的活路！”甘乃光语气恳切，“过度激化的斗争，只会让田地荒芜，村子凋敝，大家玉石俱焚！ 林老爷，您也看到了，这年景，硬收租，真能收齐？佃户活不下去，明年谁来种您的地？您的‘祖宗规矩’能变出谷子来？”\n他转向阿生和佃户们：“乡亲们的苦，本盟深知！但打砸抢烧，除了泄愤，能解长久之困？我们主张，是发展乡村经济，改善大家伙的日子！” 他拿出几份文书，“同盟正设法筹办‘青苗贷’，助大家度过眼下的饥荒；联络省城商行，试行‘保底价’收购桑蚕、土产；还要推动疏浚河道，兴修小型水利，抗旱防涝！这些事，需要村里上下同心，合力才能办成！”\n甘乃光走到中间，目光炯炯：“今日就请林老爷开个口子，今年租子，按收成实情，协商个大家都能喘口气的数，如何？政府担保，助您家货栈拓展销路，抵充些损失。只要田地不荒，人心不散，乡村有了和谐稳定的环境，振兴才有指望，大家才能长久有饭吃，国家粮仓也才安稳！ 这，才是真正的长治久安之道！”\n阿生紧握的拳头松开了些，眼神中的怒火被一丝迟疑取代。林老爷盯着甘乃光手中的“保底价”文书，又看看群情汹汹的佃户，拄着拐杖的手指关节捏得发白，最终，艰难地点了点头：“……就…就依甘先生的意思，坐下来…谈吧。” 村公所内，那根绷紧的弦，似乎终于微微松弛了一寸。"
ROC_pingheng.5.a:0 "也不失为一种解决之法，林家毕竟是烈士之家。"
ROC_pingheng.5.b:0 "胡闹，这不是在动摇土地改革吗？！"
ROC_pingheng.6.t:0 "农协经济组织化"
ROC_pingheng.6.d:0 "赵连芳拿起一粒霉谷，用力捻碎：“老耿叔的痛，大勇兄弟的急，我都懂。可威风不能当饭吃！土地改革只是第一步。田分到手了，谷子种出来了，烂在手里，卖不出好价，乡亲们照样饿肚子，这革命成果能算稳固？” 他目光扫过两人。\n“自由大同盟这次来，就是要帮农协‘换换筋骨’！” 赵连芳语气坚定，“农协不能只当个喊口号的政治组织，得变成实打实给大伙儿谋福利的经济服务组织！” 他翻开带来的计划书。\n“看这里：第一，生产技术指导。 同盟联系了省农校，马上派技术员下来，教大家选良种、用新肥、防虫害！田里增产了，口袋才能鼓！”\n“第二，农产品销售！” 他指着霉谷，“再不能让大伙儿被粮贩子欺负！农协牵头，直接跟城里米行、纱厂签‘包销合同’，定好保底价，有多少收多少！像这桑蚕、花生，都能找好出路！农协就负责组织运输、把关质量、谈价钱，抽一点管理费维持运转，这叫增强自身可持续发展能力！”\n赵老耿浑浊的眼睛亮了起来：“真…真能这样？那敢情好！”\n孙大勇直起身，将信将疑：“这…这能行？农协干这个？之前不都是带着咱们斗争地主、军事训练吗？”\n“怎么不行？”赵连芳拍拍他的肩，“帮乡亲们把谷子卖出好价钱，不比空喊口号更得人心？农协有了钱，就能买新农具给大家用，请更好的先生来教技术！这才是真正服务于乡村振兴！让大伙儿看到种田有奔头，生产积极性高了，田越种越好，日子越过越旺，这才是农业发展的正路子！大勇，你年轻力壮，组织运输队、学新技术，不正是你的用武之地？”\n孙大勇看着赵老耿期盼的眼神，又看看桌上发霉的谷子，抱着的胳膊慢慢放了下来，眼神中的桀骜渐渐被一种新的、务实的光彩取代。他抓起一把谷子，用力搓了搓：“…那，这霉谷子，还能补救吗？” 赵连芳笑了：“走，先带我去仓库看看！” 农协大院里，那尘封已久的算盘，似乎终于要拨响新的算珠。"
ROC_pingheng.6.a:0 "带领农民致富，这是好事呀"
ROC_pingheng.6.b:0 "农协还是要保持斗争性"
ROC_pingheng.44.t:0 "土地流转（1）"
ROC_pingheng.44.d:0 "省城革命委员会农林处一间略显拥挤的办公室。窗外是灰蒙蒙的天，室内弥漫着旧文件和陈年茶叶的味道。一张铺着绿呢台布的长桌旁，坐着几位神色各异的委员。桌上摊开一份标题醒目的文件：《关于依法、自愿、有偿流转土地使用权之提案》。\n农运出身的干部李焕生眉头紧锁，手指无意识地敲着桌面，语气带着审视：“甘代表，这‘土地流转权’…听着新鲜。革命刚分了田，人人有地种，这‘流转’起来，会不会…走了回头路？那些刚翻了身的佃户，会不会又没了地？”\n甘乃光微微颔首，理解对方的顾虑：“李同志问到了关键。我自由大同盟提案的核心，是在“耕者有其田”的基础下进行的。我们主张赋予农民的，是土地使用权依法、自愿、有偿流转的权利。” 他特意加重了“依法”、“自愿”、“有偿”三个词。\n他转向赵老耿，语气温和却清晰：“老耿叔，您家的情况我了解。两个儿子去省城做工了，家里就老两口和儿媳妇，十亩地种不过来，好些田都只种了一半，荒草长得比苗高。您累得直不起腰，收成还赶不上别人精心伺候的五亩地，是吧？去年那场雨，您家麦子来不及收，霉了不少，心疼啊。”\n赵老耿眼圈一红，连连点头：“是…是这么个理儿！” "
ROC_pingheng.44.a:0 "可…可这地是命根子啊…"
ROC_pingheng.7.t:0 "土地流转（2）"
ROC_pingheng.7.d:0 "“流转，不是卖地！”甘乃光斩钉截铁，“是如果您自愿，可以把种不过来的地，依法租给像隔壁村老王家那样劳力足、会种田、想多种几亩的能手。您收合理的租金，这叫有偿。您家轻松了，有了活钱，老王多种了地，收成更好，交的公粮也多了！国家粮仓更满，这叫合理配置土地，提高生产效率！”\n他环视众人：“农业发展，需要规模，需要集约！零敲碎打，抗不了灾，用不了新农具新技术。土地在会种田、愿种田的人手里流转起来，才能形成规模，引进良种机械，降低成本，提高农业生产的效率与效益！对流转出土地的乡亲，租金是增收渠道；对流入土地的，规模经营是致富路。土地活了，整个农村经济才有活力！这，才是为农业革新打下的实在根基！”\n李焕生紧锁的眉头稍稍舒展，陷入了沉思。赵老耿浑浊的眼睛里，那层厚厚的忧虑似乎被撬开了一道缝，透出一点微弱的光。他喃喃地问：“…真…真能这样？地还是我的…根？” 甘乃光肯定地点头：“地是集体的根，您流转的是种地的权利和收益。白纸黑字的合同，农会监督，政府保障。”办公室内，只有窗外隐约的车马声和文件翻动的沙沙声。"
ROC_pingheng.7.a:0 "土地流转确实是经济发展的必由之路"
ROC_pingheng.7.b:0 "这才不是农业发展的正道！！"
ROC_pingheng.8.t:0 "“自由”专题讨论会"
ROC_pingheng.8.d:0 "岭南大学一间高敞却显陈旧的阶梯教室人头攒动。窗外火红的木棉开得正盛，室内气氛却异常凝重。一条“革命与自由”的横幅下，挤满了学生、教师、记者、小店主，还有几位穿工装的工人。空气闷热，混杂着汗味、油墨味和焦灼的期待。\n现场的讨论迅速升温。青年工人代表黄志强站在过道里，激动地挥舞着拳头，嗓音沙哑：“自由？现在谈什么自由！反动派还没抓干净！工厂里还有捣乱分子！不靠铁的纪律和集中力量，怎么站稳脚跟？反对专制？现在就得用专制的力量扫清障碍！”\n大学教授苏文清推了推眼镜，声音清晰但不高：“黄同志，革命的目的是再造一个专制牢笼吗？保障老百姓的基本权利和自由，这才是革命的根基！若以革命之名行压制之实，与旧政府何异？我们反对的，正是这种借革命之名的专制压迫！”\n小商铺主沈老板擦着汗，焦急地插话：“各位先生！大道理我不懂！我就知道，现在街上动不动就查抄封店，也没个明白说法！我小本买卖，经不起折腾！这‘革命’，能不能定下清楚规矩？让人安心做点生意？”他的话道出了许多普通市民的心声。\n眼看几方人马怒目相视，场面要失控。杨杏佛快步走到讲台中央，用力敲了敲桌子，声音洪亮而恳切：“诸位！请静一静！自由大同盟今天开这个会，不是要大家分裂，就是要搭建一个开放、透明的台子，让不同的想法能在这里交流碰撞！黄同志的警惕，苏教授的担忧，沈老板的难处，都是革命路上实实在在的声音！”\n他目光扫过全场：“革命，必须在秩序的框架里推进！这秩序，不是用来压人的，是用来保障的——保障黄同志安全说话的权利，保障苏教授自由思考的空间，保障沈老板安心做生意的指望！革命和自由，绝不是死对头！”\n杨杏佛轻叹道：“我们坚信，只有建立起开放、透明、包容的革命机制，让不同立场在规则下辩论，而不是在街头斗狠，才能真正调动起工人、学者、商人、农民各界参与革命的积极性！让大家看到革命带来的不光是砸烂旧世界，更是建立一个民主、自由、和谐的新社会的希望！这希望，需要每个人的声音，也需要一个能装下这些声音的秩序！”"
ROC_pingheng.8.a:0 "说得好！"
ROC_pingheng.8.b:0 "什么谬论？"
ROC_pingheng.9.t:0 "培养公民意识"
ROC_pingheng.9.d:0 "讲台上方，“民主与公民”讲习班的横幅下，教授苏文清手持一份《地方自治章程》草案，额角微汗，目光却炯炯有神。\n阿强忍不住举手，声音带着年轻人特有的锐利：“苏先生！总说‘民主选举’重要。可我们工人大字不识几个，怎么选？选上去的人，真能替我们说话？别又是换汤不换药！” 他的话像块石头投入水面。赵老爷慢悠悠接口：“阿强小友话糙理不糙。老夫也忧心，若人人皆可议政监督，恐失章法。古语云‘民可使由之，不可使知之’，骤然放开，易生民粹，反伤稳定根基。” 后排的陈婶怯生生地小声问：“俺…俺就想知道，铺子前那破路几年了，该找谁？找过保长没用！这‘民主监督’，能让管事儿的听听俺们声儿不？”\n面对提问，苏文清笑容温和而坚定：“阿强问得尖锐！扫盲与知情权，正是我们办讲习、做宣传的意义所在！让大家明白手中一票的分量，认识候选人，知晓民主选举赋予我们选择真正代表的权利。”\n他转向赵老爷，态度尊重：“赵老，旧时‘不可使知之’的观念，实为束缚。民主决策，非无序喧哗，需有规则支撑—— 如何提案、辩论、表决。这些规则本身，就在推动政治体制不断完善，让不同声音在框架内表达协商，寻求共识，方能避免独断或民粹。”\n最后，他看向陈婶，语气恳切：“陈婶的烦恼，正是民主监督的日常体现！公民有序参与政治生活， 不止于投票。发现问题，通过代表、报章、正当渠道反映，督促官员解决，这就是监督！让管事者知民意、担其责。这才是人民当家作主的真义——有权知晓、评判、问责！”"
ROC_pingheng.9.b:0 "我们才是国家的主人？"
ROC_pingheng.10.t:0 "速行宪政？"
ROC_pingheng.10.d:0 "革命委员会所在的旧省议会大楼走廊里，午后阳光透过高窗，在磨得发亮的水磨石地面上投下斜长的光影。空气中弥漫着旧文件、灰尘和一种无形的焦躁。自由党党魁罗隆基腋下夹着一份厚厚的文件袋，步履匆匆，额角渗着细汗，在略显空旷的走廊里格外清晰。迎面走来的民盟代表徐傅霖，两人目光交汇，无需多言，徐傅霖便默契地转身同行。\n“不能再拖了，徐老！”罗隆基压低声音，语气却斩钉截铁，“看看这局势！街头集会口号各异，报章笔战莫衷一是，工商界观望不前，连农会都有人问‘这革命后的天，到底啥规矩？’ 国家政治稳定与长治久安，亟须一个根本的锚！” 他用力拍了拍文件袋，“这就是我们今日正式提交的《速行宪政请愿书》！”\n他们在一间挂着“法制组”木牌的办公室前停下。门开着，里面一位身着半旧工装、头发花白的李处长正揉着太阳穴，看着桌上堆积如山的卷宗。罗隆基大步走入，将请愿书郑重放在李处长面前最显眼的位置：“李处长，我方现向革命委员会提出速行宪政的要求！”\n李处长抬眼，带着一丝疲惫地审视：“速行？努生兄，革命战争正在进行，千头万绪，一部宪法岂是朝夕可成？制定并实施宪法，兹事体大，需反复研讨，慎之又慎啊…”\n“正因兹事体大，才需根本大法定乾坤！”徐傅霖上前一步，声音沉着有力，“无宪则国本不立！速行之意，非草率，乃刻不容缓！ 当务之急，是尽快确立国家的基本政治制度与公民的基本权利义务！ 让万民皆知，革命所为何来？政府权力边界何在？我辈公民权利何存？唯有一部至高无上的宪法，方能保障民主、法治与人权！” 他指着窗外隐约传来的游行口号声，“民心思定，更思明！若长久无法可依、无章可循，今日之希望，恐成明日之怨望！”\n罗隆基紧接着说：“李处长，规范政府权力运行，是宪法的天职！ 革命委员会今日掌权，若无宪法约束，他日如何确保权力不被滥用？如何取信于民？宪法，正是为国家的政治生活提供根本遵循！ 它如同一部清晰的地图，指引国家航向，亦如坚固的堤坝，约束权力洪流。速行宪政，非为束缚革命，实为巩固革命成果、奠定万世太平之基！ 此刻不行，更待何时？” \n办公室内一时寂静，只有文件袋在桌面上投下的厚重阴影，以及窗外城市隐约的脉搏。李处长的手指无意识地摩挲着请愿书粗糙的封面，那沉甸甸的分量，仿佛压在了每个人的心头。日光西斜，长长的影子在走廊里交织，仿佛预示着这关乎共和国根基的抉择，已避无可避地推到了历史的台前。"
ROC_pingheng.10.a:0 "那就加快宪政进城吧"
ROC_pingheng.10.b:0 "操之过急，反而适得其反"
ROC_pingheng.11.t:0 "要求放宽组党审核"
ROC_pingheng.11.d:0 "革命委员会会议厅外的走廊，高大的拱窗透进午后的阳光，在磨石地板上投下斑驳光影，却驱不散空气中无形的凝重。刚结束一场激烈辩论的委员们三三两两散开，低声交谈着。自由大同盟代表林汉达正被几位面色严肃的委员围着，他手中那份《政党注册条例修正案》提案显得格外醒目。\n“林代表，革命委员会成立之初，取缔反革命、保守派政党，那是为大局稳定！” 一位鬓角花白的老委员，手指几乎要点到提案封面上，声音低沉却带着压力，“此刻放宽组党审核？ 门槛一降，程序一简，泥沙俱下怎么办？那些被取缔势力的残渣余孽，换个名头就能堂而皇之登堂入室的话！这革命成果，还要不要了？”\n林汉达迎着对方审视的目光，语气坚定：“张委员，您的担忧同盟理解。但革命非一日之功，政治多元化已是时代趋势。” 他扬了扬手中的提案，“我们并非要放弃原则！审核依然存在，核心是区分敌我、明辨诉求是否合法。降低的是不必要的繁文缛节，简化的是冗长拖沓的程序。 关键是要为那些真正扎根于民、有合法诉求的政治团体开一扇门，让他们能自由组党参政！”\n他环视周围几位倾听的委员，声音提高了几分：“诸位试想，工人有工人的诉求，教员有教员的关切，商界有商界的想法。若只因成立一个真正代表他们的政党门槛过高、程序繁复，便将他们拒于体制门外，其呼声只能沦为街谈巷议，甚至走向偏激！这难道有利于团结？允许更多团体在规则内发声、竞争，恰恰能促进健康的政治竞争！ 让不同理念在议政厅里辩论，好过在街头巷尾对立！”\n这时，一位穿着朴素政府工装、戴眼镜的年轻人，抱着一叠厚厚的材料匆匆走过，听到争论不禁停下脚步，眼中带着期盼。林汉达注意到他，微微颔首示意，继续说道：“这绝非削弱革命，而是推动革命民主政治走向成熟的建设！ 一个更有活力、更具代表性的政治格局，方能真正夯实革命民主政治的根基！ 与其严防死守，不如打开窗户，让新鲜空气进来，在阳光下检验真金！”\n走廊尽头的登记处门口，隐约可见两三个小心翼翼探头探脑的身影，似乎在观望这里的讨论结果。"
ROC_pingheng.11.a:0 "放宽限制，确实是该做出改变了"
ROC_pingheng.11.b:0 "革命优先，自由之敌，不配拥有自由"
ROC_pingheng.12.t:0 "大同会地位合法性？"
ROC_pingheng.12.d:0 "革命委员会临时会议厅内，午后的阳光斜照在长条会议桌光滑的漆面上，映出几道刺眼的光斑，却未能驱散空气中无形的滞重。议程过半，自由大同盟代表储安平缓缓起身。他深吸一口气，目光扫过主位上面色沉静的大同会代表，声音清晰而平稳地打破了沉寂：\n“诸位同仁，值此革命建设之关键时刻，同盟有一事，如鲠在喉，不吐不快。” 他顿了顿，感受到数道目光瞬间聚焦，有探究，有审视，也有隐隐的不悦。“我们深切认同大同会在革命初期的卓越贡献与领导地位。然时移世易，革命委员会乃新生共和国之核心议政机构，代表全体国民之公意。”\n他话锋一转，语气渐重：“自由大同盟对大同会目前在此架构中的特殊地位表示深切质疑。 其超越其他党派之权力与影响力，缺乏充分的民意基础与合法性论证。 试问，此特殊地位由何赋予？是经全体国民票选？还是由革命委员会各党派代表共同授权？抑或仅源于历史功勋？” 他的声音不高，却字字敲打在寂静的厅堂内，一位身着笔挺军装的委员脸色微沉，手指无意识地敲击着桌面。\n“此等特殊化，” 储安平环视全场，目光坦荡，“实则有悖于我等共同信奉之民主平等原则！ 革命之目的，非为建立新特权，而在破除一切不平等之枷锁。若革命之核心机构内部尚存此等未经理性审视之特权，何以昭示天下公义？”\n储安平举起手中的建议书：“基于此，同盟正式向革命委员会提议： 应重新审视大同会之地位与作用！ 我们倡导——所有认同共和、投身革命之政治力量，无论大小新旧，均应在平等、公正之基础上参与国家事务决策！” 他的声音带着不容置疑的力量，“唯有如此，方能确保政治权力的合理分配与制衡， 防止权力独揽之弊端，从根本上维护革命阵营的团结与长远稳定！ 革命之伟力，在于团结，而团结之基石，在于平等！此乃同盟肺腑之言，望诸位同志三思！”\n话音落下，会议厅内一片死寂。主位上，大同会总理柯麟的面容依旧平静无波，只是眼神深处掠过一丝难以察觉的波澜。几位委员下意识地交换着眼神，有的眉头紧锁，有的若有所思。储安平坦然坐下，那份建议书静静躺在桌上。窗外阳光刺眼，厅内却仿佛有一场无声的巨浪，正冲击着这座象征着新生与旧影的权力殿堂。"
ROC_pingheng.12.a:0 "适当对其妥协"
ROC_pingheng.12.b:0 "你去看看楼外的黄花岗烈士纪念碑，再和我谈合法性"
ROC_pingheng.13.t:0 "茶馆闲谈"
ROC_pingheng.13.d:0 "午后的阳光透过满洲窗花，在红木圆桌上投下斑驳光影，茶香氤氲，人声鼎沸。自由大同盟的甘乃光正与几位小党派代表和一位相熟的报馆主笔品茗。\n邻桌的喧闹声忽然吸引了他们注意。几位穿着半新长衫的教员正激烈争论着什么，声音渐高。其中一位情绪激动地拍着桌子：“…大同会的人把持了教育局三年！我们提了多少次改良教材的建议，石沉大海！新式教育推行举步维艰，他们只顾安插自己人！”\n另一位叹气接话：“何止教育？工务、税政…哪样不是他们说了算？我们这些边缘小党，连个提案通道都难找，遑论参与决策？这‘革命委员会’，名不副实！”\n甘乃光放下茶盅，目光与同桌的社会党代表方明远、民主促进会理事郑振铎交换了一下。方明远低声道：“甘兄，此等怨言，近来街谈巷议中愈盛了。长此以往，人心岂不涣散？”\n甘乃光微微颔首，转向邻桌，声音温和却清晰：“几位先生所言，切中时弊。革命功成，非一家一党之功。若权力长期固守一处，则活力渐失，弊端丛生。譬如这茶壶，”他指了指桌上正被伙计续水的紫砂壶，“若总由一人执壶，难免手酸懈怠，茶水也易凉涩。”\n邻桌教员们疑惑地望过来。报馆主笔饶有兴致地问：“哦？甘先生有何高见？”\n甘乃光拿起茶盘里几个空的小茶杯，依次摆开：“我们自由大同盟，近来正草拟一份‘轮流坐庄’的提议。 核心便是：革命委员会各党派，应依循公平规则，定期轮换执掌关键部门。” 他将几个茶杯象征性地轮流推到一个“主位”上。\n“此议何益？”一位教员追问。\n“益处有三。”甘乃光从容道，“其一，避免权力过度集中于一党之手，防止其利益盘根错节、尾大不掉。今日教育之困，便是前车之鉴。其二，”他指向被轮换下来的茶杯，“在野之党，非赋闲也，其责在监督！ 紧盯施政疏漏，提出更优方案，此乃相互制衡、促进自省之良方。 其三，”他目光扫过方明远、孙婉清，“此制一出，各党无论大小，皆知轮替有望，参政有门，自当奋发有为，贡献才智，而非徒作壁上观或怨天尤人！此乃充分调动各方积极性之道！”\n郑振铎眼睛一亮，接口道：“甘先生之意，是让各党在良性互动中竞争，进而推动革命进程？”\n“正是！”甘乃光肯定道，“流水不腐，户枢不蠹。唯有权力如活水流转，方能涤荡积弊，带来政治清明，最终达到社会和谐稳定。 一个依靠规则轮替，而非依赖历史功勋或个人威望的机制，方是革命政权长治久安之基！”\n邻桌的争论声早已平息，几位教员若有所思。楼下街市熙攘，报童的叫卖声隐约传来。一位年长的教员端起茶杯，对着甘乃光的方向遥遥一举：“甘先生此论，如醍醐灌顶。这‘轮流坐庄’…听着新鲜，细想之下，却似一剂疏通淤塞的良药啊。”"
ROC_pingheng.13.b:0 "有趣的想法"
ROC_pingheng.45.t:0 "轮流坐庄？"
ROC_pingheng.45.d:0 "革命委员会议事厅内，深红色的地毯吸去了大部分脚步声，只余下纸张翻动的细碎声响和偶尔的轻咳。窗外暮色渐沉，议事桌上方的吊灯投下略显昏黄的光晕，映照着委员们疲惫或沉思的脸。议程行将结束，自由大同盟代表杨杏佛却并未如常整理文件。他站起身，将一份装帧朴素的提案——《委员会执政轮替机制草案》——轻轻推到光滑的漆面长桌中央。那轻微的滑动声，在突然安静下来的大厅里异常清晰。\n“诸位同仁，”杨杏佛的声音不高，却字字清晰，目光扫过主位上不动声色的柯麟，也掠过几位面露倦意或困惑的委员，“值此革命建设步入深水之际，自由大同盟特此提出一项关乎委员会长远健康与活力的根本性建议。”他指尖点着提案标题，“我们称之为‘职务轮转’。”\n资深委员李振邦眉头立刻锁紧，手指下意识地敲击桌面：“杨老，大同会领导革命披荆斩棘，方有今日局面。值此百废待兴、强敌环伺之时，谈‘轮替’，岂非动摇革命，分散力量？”他的质疑引来几声低沉的附和。\n杨杏佛微微颔首，态度谦和却立场坚定：“李委员忧心效率，同盟深以为然。然，革命伟业非一蹴而就，亦非一党一派可永承其重。‘职务轮转’之核心，在于实现政治权力的公平分配与良性互动。”他环视全场，尤其在几位小党派代表脸上稍作停留，“我们主张，各党派依循共同议定之规则，定期轮换执政与在野之角色。 此举绝非削弱领导力，恰恰是为防止权力过度集中于一隅，避免特定党派利益随之板结固化！”\n坐在角落的青年党代表，原本低头记录的笔尖猛地一顿。杨杏佛捕捉到这一变化，声音愈发恳切：“此乃更高层次之团结！它促使各党超越门户之见，在平等公正的规则下，以政策优劣相较量，以民心向背定输赢。唯有如此，政治方可趋清明，社会方有望达致真正和谐与稳定。一个依靠制度活力而非个人或单一团体威权的委员会，才是革命火种得以永续、共和国基业得以长青的最坚实保障！”"
ROC_pingheng.45.a:0 "我们肯定会推行宪政选举，但不是现在"
ROC_pingheng.45.b:0 "这是在逼宫？"
ROC_pingheng.46.t:0 "离别"
ROC_pingheng.46.d:0 "省城西隅，自由大同盟总部那栋不起眼的灰色小楼前，空气凝重得能拧出水。午后阳光刺眼，却驱不散门廊下聚集人群心头的寒意。几辆蒙着帆布的卡车静静停在路边，工人们沉默而迅速地搬运着成箱的文件、卷宗和一架沉重的油印机，动作间带着一种近乎悲壮的决绝。\n杨杏佛站在门廊的石阶上，深色长衫纤尘不染，目光平静地扫过眼前：几位同盟核心成员面色沉郁，紧抿着唇；几位闻讯赶来的小商贩和报馆记者，神情混杂着惊愕与探询；街角，两个穿着工装、显然是受命“关注”此地的汉子，抱着胳膊，眼神警惕。\n同盟法律顾问章世钊拿着一个牛皮纸信封，走到陈伯钧身边，低声道：“杏佛，最后一份公文副本归档了。致革命委员会的正式退出声明，半小时前已送达秘书处签收。” 他的声音不高，却清晰地传开。\n杨杏佛摆了摆手，没有看那信封，目光投向街对面革命委员会那栋巍峨气派的衙门大楼。这时，印刷厂的老周气喘吁吁地跑来，手里攥着刚出炉还带着热气的几张校样：“杨先生！您看！他们…他们还是把‘制衡’那段全删了！通篇都是‘顾全大局’、‘服从领导’！” 校样上，刺目的红笔删改痕迹触目惊心。\n杨杏佛接过校样，只瞥了一眼，嘴角掠过一丝极淡的、近乎苦涩的笑意。他没有愤怒，只是将校样轻轻折好，递给章世钊： “存档吧。这，就是答案了。”\n杨杏佛转向众人，声音不高，却异常清晰，穿透了搬运的声响和远处的车马喧嚣：“诸君，数月来，我们于体制之内，力陈权力制衡之要，倡导公平轮替之制，寻求不同声音在规则下的共存共荣。然，所提之议案，或束之高阁，或被删改阉割，革委会内之民主原则，已成镜花水月。”\n他顿了顿，目光扫过同盟成员疲惫的面孔：“继续留在这个徒有其表的委员会，非但不能践行吾辈理念，反使吾等成为粉饰专断、固化特权之帮闲！道不同，不相为谋。今日退出，非为分裂革命，实为守护革命应有之精神内核——自由、民主与制衡！”\n他最后看了一眼那栋象征着权力的大楼，语气决然：“吾等将以在野之身，持独立之志，继续为民众之权利、为政治之清明、为真正之共和宪政鼓与呼！ 这栋楼里的灯火，照不亮我们前行的路了。路，在自己脚下。” 说罢，他转身，第一个迈步走下石阶。\n与此同时，在革命委员会顶层那扇宽大的落地窗前，柯麟凭窗而立，默默注视着楼下渐行渐远的人群。他手中端着一杯早已凉透的茶，良久，才低低叹出一句："
ROC_pingheng.46.a:0 "可民主这条路，不是只有你们指的方向才能走通"
ROC_pingheng.47.t:0 "统一战线万岁！（1）"
ROC_pingheng.47.d:0 "广州咨议大厅内，褪色的龙纹凿井下，长条桌旁坐满了人。工装沾着油污的代表、裤腿还卷着泥点的农会骨干，以及神色各异的党派人士挤在一起。空气里弥漫着汗味、劣质烟草味，还有一种压抑不住的、带着焦灼的兴奋。大同会委员邓演达站在上首，背后是一面新挂上、墨迹犹未干透的“联合奋斗”横幅。\n“诸位同志！”邓演达的声音不高，却像块石头投入水面，压住了厅内嘈杂的议论声。他环视着一张张或热切、或犹疑、或疲惫的脸，“广州城头是换了旗帜，可革命的路还长得很！”他手掌猛地拍在桌面上，震得几个粗瓷茶杯叮当作响，“北边是龙旗未倒的朝廷，还有各自为政的督军！靠我们大同会一家？靠你们农会？靠哪一派哪一党单打独斗？能把这天翻过来，能实现天下的解放么？”他停顿了一下，目光锐利，“不能！”\n靠近桌尾，一个头发花白、脸庞黝黑的老农会代表颤巍巍站了起来，粗布褂子洗得发白。他操着浓重的客家口音：“邓委员讲得在理！过去那帮地主老爷，就爱挑唆我们泥腿子和工友斗，和城里人斗！打得头破血流，好处全让他们占了去！”他粗糙的手掌在空中用力一挥，“如今土改正在进行，工友帮我们修水车、造农具，这才叫一条心！北伐打那狗日的朝廷，算我老黄一份！我们农会的后生仔，也绝不是孬种！”他话音未落，角落里几个同样穿着短打的汉子就用力鼓起掌来，掌声沉闷却透着股实诚劲儿。\n另一边，一个戴着圆框眼镜、穿着半旧长衫的中年人推了推镜架，他是《岭海报》的主笔。“摒弃前嫌，共赴国难！此乃当前唯一出路。”他的声音清朗，带着读书人的腔调，“知识界同仁，自当以笔为戈，口诛笔伐，揭露反动政府之腐朽，宣扬联合战线之大义！唯有精诚团结，统一战线，方是我共和革命之坦途！”他的话引来一阵附和的点头和低语。\n角落里，一个穿着藏青色绸布大襟、手指保养得宜的纺织厂老板清了清嗓子，显得有些局促。“这个……鄙人也表个态。”他斟酌着词句，“我们实业界同仁，这些年深受朝廷苛捐杂税、洋货倾销之苦，工厂时开时停，工友生计维艰……”"
ROC_pingheng.47.a:0 "他话还没说完，就被一个突兀的声音打断了。"
ROC_pingheng.27.t:0 "统一战线万岁！（2）"
ROC_pingheng.27.d:0 "“说得好听！你们这些大老板，还不是吸工人的血汗钱！”一个穿着工装、袖子上沾着机油渍的年轻工人猛地站起来，脸涨得通红，“联合？怎么联合？分了田，我们工人拥护！可你们厂里那点工钱，那十几小时的工，还有那些工头……”\n“后生仔！现在说这些做乜嘢！”老农会代表黄伯急忙出声，想拉住他。\n“安静！都安静！”邓演达的声音再次响起，比刚才更高了几分，带着不容置疑的权威。他看向那个激动的年轻工人，又转向一脸尴尬的厂主，最后扫视全场。“矛盾，一直都存在！过去有，现在有，将来也会有！农友和工友有各自的苦处，实业家有他们的难处！但现在最大的矛盾是什么？是头顶上那压得人喘不过气的天！是外面那些想重新骑在我们头上的豺狼！”他手指重重敲着桌面，“我们今天坐在这里，不是来算细账的！农会的地要保住，工友的日子要改善，工厂要开下去，靠什么？靠我们在这里内斗？还是靠我们联合起来，先把那最大的敌人掀翻？”\n他深吸一口气，放缓了语气，但目光依旧灼灼：“统一战线，不是抹杀矛盾，是分清主次，是求同存异！农会、工会、商会、学界，还有我们大同会，力量拧成一股绳！我们革委会，就做那穿针引线的！先把这旧天捅破了，才有地方建我们大同的新世界！这位老板，”他看向纺织厂主，“你说深受其害，那就拿出行动来！支持北伐，保障军需，改善工友待遇，让大家看到你联合的诚意！这位工友，”他又看向年轻工人，“你的诉求，工会记下了！等打倒了朝廷，我们坐下来，一条条掰扯清楚！现在，枪口要一致对外！”\n厅内安静下来，只有粗重的呼吸声。年轻工人抿着嘴，慢慢坐了回去，眼神依旧倔强，但没再说话。厂主擦了擦额角的汗，连连点头：“是，是，邓委员教训的是…鄙人…一定尽力，一定尽力！”\n邓演达看着众人各异的神情，知道这联合之路绝不会平坦。他最后沉声道：“路难走，也得走！为了农友不再饿肚子，为了工友不再卖命换不饱饭，为了孩子们有书读，为了这天下，不再是朱家或者哪个皇帝的私产！”"
ROC_pingheng.27.a:0 "“联合奋斗，改天换地！就从今日，从此地开始！”"
ROC_pingheng.28.t:0 "广州革命纪念碑落成"
ROC_pingheng.28.d:0 "【本报广州专讯】昨晨七时正，薄雾氤氲黄花岗畔。革命委员会诸公于烈士陵园隆重举行广州起义纪念碑揭幕盛典。花岗碑体巍然矗立，高逾九丈二尺八寸，通体素朴未镌只字，唯青铜基座环嵌浮雕带，气象森严。\n大同会总理柯麟、革命军事委员张孝准、邓铿、同产工会代表陈赞贤、中华民主同盟代表杨杏佛、华南商会会长杨仲绰等各界贤达联袂莅止，观礼市民千余屏息伫立。雾霭四合间但闻松涛呜咽，忽有军号破空，素绢飘落处，青铜浮雕峥嵘毕现。\n据悉，此碑经革命委员会文化组三易其稿，延请岭南建筑学会名匠陈其沛先生精心督造。基座浮雕重现丁丑年秋，工界、农界、商界、学界、军界万众一心，共举义旗之场景。\n典礼简约而庄穆，历三刻钟礼成。碑前白菊层叠如山，大同会老会员林文君抚碑泣曰："此非石刻，乃志士热血所凝也！"礼毕即开放民众瞻仰，陵园管理处特备素菊千束，供谒者追怀先烈。\n谒碑须知\n一、开放时刻：卯时至酉时（6：00-18：00）\n二、惠阳青石阶廿四级，老弱者可由东侧坡道缓行\n三、浮雕禁触抚，免损铜胎珐琅\n四、衣冠务整肃，喧哗宜戒止"
ROC_pingheng.28.a:0 "浩气长存！"
ROC_pingheng.29.t:0 "珠江畔的晨间对话"
ROC_pingheng.29.d:0 "清晨的珠江雾气弥漫，社会党青年委员陈启明攥着油印的《民生日报》，在海关大楼石阶下拦住农协干部张铁生：“老张，后天的议政听证会，你们农协代表名单还没报！”\n张铁生肩头还沾着稻屑，把扁担往青石板上一顿：“陈委员，田里正赶插晚稻秧，哪有空陪老爷们磨嘴皮子？”几个过路的码头工人闻言放缓脚步。\n陈启明抖开报纸第三版，上边的标题赫然是《新垦区农械租赁补贴草案》。“磨嘴皮子？”他指尖点着新闻配图——图中戴斗笠的老农正对着话筒发言：“看见没？上月听证会上，顺德农会代表提议的农械补贴，昨天财政司已经立项了！”\n榕树荫里摆茶摊的王伯探过头来：“后生，这事当真？我们村那沙田要能租到拖拉机……”陈启明顺势把报纸塞进老人手里：“您老记得去区公所登记需求，这次补贴就是农民代表参政争来的！”\n张铁生绷紧的脸松动几分，陈启明趁机挽住他胳膊往江边渡口走：“知道你为什么一直当不上干部？”他忽然抓起张铁生结茧的右手举高，“这双手能打土豪分田地，可建设新社会光靠拳头不够——得让政策听见咱们的声音！”\n渡轮鸣笛声中，陈启明从公文包抽出听证会议程表：“水利组今天讨论北江堤防加固，你们村去年淹的三十亩地……”张铁生猛地抢过文件，对着晨光眯眼细看，突然朝船工大喊：“老钟！掉头回农会！叫上阿珍她们把淹田照片找出来！”\n陈启明望着渡轮劈开的浪痕，钢笔尖在提案补充栏写下：建议增设农灾听证旁听席——"
ROC_pingheng.29.a:0 "提案人：张铁生。"
ROC_pingheng.30.t:0 "纺织厂改制"
ROC_pingheng.30.d:0 "广安纺织厂锅炉房的蒸汽漫过斑驳砖墙时，大同会经济干事李世璋正踩着满地棉絮穿过车间。他在第三排织机前停步，望向老女工阿英龟裂的手：“婆婆，这铁梭子还咬手吗？”\n“有时候会故障，但比我们小时候可强多了。”阿英伸出残缺的右手，无名指与尾指处皱缩的断疤显得格外刺目——十二岁那年，失控的织机卷走了她两根手指。\n“李同志，新式织机月底就到！”劳动党技术员周清扬拍着刚卸箱的纺机样品，齿轮油味混进棉尘，“这新机器好呀，不仅加装了防护罩，断线自停，产能还能提升两成。”他扳动安全阀示范，铁梭温顺地停在距布面半寸处。\n角落突然爆出的争吵声打断了二人的对话。民盟法律顾问闵刚侯举着账册，正与绸缎商陈老板对峙：“陈先生，您这厂子多项内容不达标，特别是工人权益方面。按《工改条例》第四款，政府有权注资改组！”账册翻到泛黄页——童工抚恤金栏竟贴着“自愿捐资”字条。\n锅炉汽笛长鸣中，双方聚到褪色的“万锭日纺”匾额下。李世璋将股权书摊在纺锭箱上：“按照改制的新方案：政府注资后占股三成，工会持三成作职工福利，您本人可以暂时保留四成，但是需要设立专项的安全基金。”他忽然掀开陈老板袖口，露出小臂的烫疤：“您当年也是熬过锅炉房的，真要子孙接着遭罪？”\n陈老板摩挲着伤疤陷入迟疑，窗外忽然响起稚嫩的童声。原来是学生宣传队举着“废止童工”木牌走过厂门，他们口中呼喊着废止童工、儿童上学等口号。片刻的沉默后，陈老板猛地抓过钢笔，在股权转让书上飞速地签下了名字。\n闵刚侯抽出法律文书时，一页《童工禁令》飘落织机。阿英残缺的右手拾起纸张，那长满厚茧的手指轻抚过上边的文字，"
ROC_pingheng.30.a:0 "最终落在了“十四岁以下禁入车间”的字样上"
ROC_pingheng.31.t:0 "农业改造方案"
ROC_pingheng.31.d:0 "粤北山地，当地政府特委的水利设施改造计划正稳步推进。大同会干部丘金踩着湿滑的田埂走向碉楼。当地陈氏宗族族长陈伯蹲在龙骨水车旁，指着干裂的晚稻田苦笑道：“丘同志，您那‘合作社’能通龙王？再好的章程也顶不住大旱呀！”\n“旱灾也有法子治的！”劳动党技术员梁瑞生拍着柴油抽水机外壳，油污的工装卷到肘部，“这铁家伙能把江水抽上基围。只要在靠内地的水道上筑闸蓄水，旱时咱们就能用水。”他摇动曲柄示范，皮带轮带动帆布水带哗哗吐水。民盟水利专员何季常突然插话：“闸口选址我有现成图纸——之前明廷治河局勘测的那个河口还能用！”他展开的蓝图泛着霉斑，红铅笔圈住一处河湾。\n“就是咱们现在人手不够，陈伯您在这十里八乡威望高，如果您带头入社的话，咱这水闸能赶在秋汛前完工，明年就能种双季稻！”丘金将合作社章程推到陈伯面前：“您放心，您家二十亩田入社，秋收后是按稻谷或者售价分成的。”\n陈伯思考之际，窗外忽传来锣响，几个中年农民揪着青年阿强闯进来：“这小子偷截我们水渠！”阿强不满地争辩道：“是你们先偷用我家的水的！”大伙一时间推搡起来。\n“都住手！”丘金猛地站起身，强力地将双方分开，“看看！为这点水打得头破血流？！”他怒视着依旧对峙着的众人道：“当年革命是为谁争水？如今革命成了，反倒自家咬自家？”几人一时间都低头不语，半晌后，陈伯主动开口道：“今年年景不好，正是大家齐心协力的时候，我愿意入社！”那几个农民对视片刻，打头的黑脸汉子瓮声道：“陈伯入社，我也入！”其余人纷纷点头。\n半月后秋汛来临，新筑的水闸升起杉木闸板。陈伯蹲在合作社抽水机旁，看着柴油机带动帆布带将江水汩汩送进田沟。"
ROC_pingheng.31.a:0 "这东西还真是管用呀！"
ROC_pingheng.32.t:0 "落实新经济法案"
ROC_pingheng.32.d:0 "在广州西关大屋的酸枝木长桌上，《新经济法》草案稳稳地压住了那本泛黄的“华南民生纺织厂”股权书。厂长张启明轻轻推了推鼻梁上那副金丝眼镜，语气中带着一丝忧虑：“李干事，政府推行《新经济法》，我作为民盟的会员，当然是全力支持的。只是这经济政策今天改一点、明天改一点，我们这些当年加入民生产业促进会的老革命企业，各项权益是否还……”\n“这您完全可以放心。”大同会经济干事李世璋从公文包中取出一份《民生产业促进会新规》，轻轻放在张启明面前，“这是民促会配套出台的新规。只要成员企业积极配合改制，改善工人待遇，技术方面的优惠依然会延续。政府推行新法，是为了更好地促进企业发展，而不是给企业添麻烦。”\n他翻开新规，指着其中一条说道：“比如这一条——企业采购合作社农产品，享市价九折。”接着，他又翻到补充协议道：“贵厂若签这单，今年纱锭原料，遂溪合作社能够为您全包！”\n张启明接过新规，仔细查看条款。他看到合同中明确写着：只要华南民生纺织厂按照新法要求保障工人权益、支持工会成立，就能享受到一系列优惠政策，包括技术培训、设备升级补贴以及原材料采购优惠等。张启明微微点头，这些优惠措施对他的企业来说无疑是雪中送炭。\n“那我这老革命企业，岂不是更有优势了？”张启明脸上露出一丝笑意，语气中带着几分欣慰。\n“话也不能这么说。”李世璋微微一笑，语气平和而坚定，“政府推行新法，是为了扶持各类配合改制、改善工人待遇的企业。无论什么企业，只要按照新法要求行事、配合改制，政府自然会予以支持。”\n张启明沉吟片刻，最终拿起笔，"
ROC_pingheng.32.a:0 "在合同上签下了自己的名字。"
ROC_pingheng.33.t:0 "【党内纪要】民盟常务会议实录"
ROC_pingheng.33.d:0 "广州东山民盟总部会议室\n杨杏佛（民盟中央常委）：\n（缓缓展开《三三制政府实施纲要》）这份文件大家都传阅过了。我的意见很明确——凡标注“专业技术岗”的职位，民盟要主动推荐合格人才。（轻轻敲击着人事名册）特别是教育、卫生、建设这些民生部门，我们在学术界的人脉优势必须用起来。\n徐傅霖（民盟秘书长）：\n杨老说到要害了。（轻轻推过名单册）岭南大学农科教授陈焕镛，上月刚加入我们民盟。此人在植物学研究方面有着极深的造诣，我建议推荐他任农业厅技正。\n储安平（民盟副主席）：\n（递过档案袋）更紧要的是基层技术岗。（抽出图纸）省营纺织厂总工程师空缺好几个月了，岭南大学梁焯勋教授改良的自动织袜机已获专利，此等人才该荐任实职！\n徐永祚（民盟副主席）：\n三三制的要义在“各尽其才”。刚才诸位推荐的人选都已经记录了下来，这些同志都是各自领域的佼佼者，他们的加入将帮助共和政府更好地发展。希望我民盟能再接再厉，积极参与到政府工作中，为民主和繁荣贡献更多的力量。\n记录员批注：\n会议决议：\n首批推荐27人赴三三制岗位（名单见附件）"
ROC_pingheng.33.a:0 "建立任职盟员季度述职制度，由杨杏佛同志主理人才举荐委员会"
ROC_pingheng.34.t:0 "基层支部合作"
ROC_pingheng.34.d:0 "粤北连县山区，连日阴雨绵绵，阳光难觅。在临时搭建的工棚内，一张泛黄的水利图铺在条凳上，四角用粗瓷碗压着。大同会委员丘金卷起沾满红土的裤腿，炭笔在图纸上划过：“溢洪道改走东坳吧，能少占几户民田。那边老秦家的桃林已经麻烦国平去谈了。”\n“不行，东坳岩层酥，遇暴雨可能会塌的！”同产工会代表周文雍指着调查报告轻叹道，“农会还是会建议加固西坡，不行的话多叫些人来，我们包伙食。”\n“但账上支不出更多的钱粮了，”民盟出身的干事郭世长合上硬壳账簿，他长满厚茧的双手，此时正噼啪拨着算盘，“如果改走东坳的，省下的移民费应该够买石材补强，清远石场的负责人是民盟会员，价格应该能给到最低。”\n话音刚落，社会党党员袁国平便撩开草帘进来，斗笠滴着水：“东坳那边谈妥了。老秦家愿让出他家的那片果园。”他解下腰间布包，倒出几颗干瘪的野山桃，“秦老汉给的，说等蓄了水，过几年请你们吃新鲜桃。”丘金捏起山桃闻了闻，酸甜气混着石灰味。“周同志，咱们明天去东坳探岩层。”\n“成！一早就去。”周文雍应道。\n数日后，晨雾未散，东坳上响起锤钎声。周文雍带人用石料加固渠道，郭世长清点新到的石灰包。袁国平引着秦老汉到坝基：“水渠从这起坡，对面就是您家的新桃林。”老汉旱烟杆敲敲青石：“成！”\n雨丝迷蒙中，运送石料的队伍在泥路上拖出长痕。穿草鞋的农人、戴藤盔的学生、扛灰袋的商会帮工连成一线。河渠修成的当日，秦老汉将第一桶水泼进渠沟，黄浊的水流滚过新砌石槽，冲向坡下的河道。\n欢呼声里，雨点又砸了下来。丘金抹了把脸，"
ROC_pingheng.34.a:0 "咸涩的不知是雨水还是汗。"
ROC_pingheng.35.t:0 "跨党合作"
ROC_pingheng.35.d:0 "政府办公厅会议室，大同会委员谭平山推开厚重的木门，看到罗志儒和李良正站在桌前低声讨论。“谭主任，您来得正好，”罗志儒指着眼前的法律草案道，“我们经济组发现，农税新政草案里关于小商贩的条款，可能和刚颁布的《市场促进条例》有冲突。按流程，这该提给法制组徐委员，还是直接列入下周联席审议？”\n李良点了点头：“沈组长提得及时。按机制，涉及法规交叉的，应由办公厅协调相关组别开小范围‘预研会’，厘清问题后再提交革委会。避免大会争论细节，提高效率。”他转向周秘书，“小周，麻烦记一下，下午协调经济组、法制组开个预研会。”\n“明白，李委员！”周秘书迅速在登记簿上记录。\n下午的“预研会”略显紧张。罗志儒直言小商贩条款可能造成的实际困难，李良则坚持法规的严肃性。双方据理力争，场上的气氛一时间有点紧张。谭平山适时引导道：“双方的担忧都是有道理的，能否在细则上找空间？比如设定过渡期、分级执行标准？” 经过一个多小时的讨论，一个初步的修改方向达成。\n几天后，在宽敞的革委会会议室里，罗志儒代表宣传组汇报修订后的联合宣讲草案。他详细说明了各组反馈如何被吸纳：经济组优化了财政支持路径，法制组明确了法律边界。最终，工作组的议案得到了顺利通过，将作为最终方案下发执行。\n散会后，谭平山、罗志儒、李良和周秘书留在会议室。谭平山看着窗外渐暗的天色，感慨道：“这一个月，磕磕绊绊不少。刚开始，大家习惯性只找‘自己人’，流程也走得生疏。”他指着桌上那份盖着革命委员会大印的定稿文件，“但好在最后大家还是磨合好了，怎么样，和其他党派分子一起工作没有那么困难吧？”\n罗志儒微笑道：“确实。以前在自己党派内部，想法容易趋同。在这里，李委员的较真，反而逼我们把问题想得更透。”\n李良也难得露出笑意："
ROC_pingheng.35.a:0 "凡事就怕认真"
ROC_pingheng.36.t:0 "压制分裂主义"
ROC_pingheng.36.d:0 "革命既已成功，诸公自当团结一心，共同致力于国计民生。如今，革命委员会已正式运行，理应与各团体同仁携手并肩，全心全意为人民服务。\n当前，各参政党派内部正逐步形成共识，主张积极配合大同会领导，共同推进大团结、大联合的政治局面。我们坚信，唯有坚持团结、避免分裂，才能使革命事业行稳致远。各党派一致认为，应当在思想和行动上与大同会保持高度一致，共同维护统一战线的团结和稳定。\n一些同志提出应加强内部协调、统一言论基调，并建立相应机制以遏制分裂倾向，这是具有建设性的意见。我们将在坚持原则的基础上，通过民主协商和制度化的方式，不断增强各党派之间的互信与合作。"
ROC_pingheng.36.a:0 "要团结，不要分裂"
ROC_pingheng.48.t:0 "保价卖粮(1)"
ROC_pingheng.48.d:0 "深秋的夕阳给粤北石坪村的晒谷场铺上一层金色，本该是丰收的喜悦，空气中却弥漫着焦躁和愁苦。金灿灿的稻谷堆成小山，村民们蹲坐在自家谷堆旁，唉声叹气。大同会的丘金、民盟的郭世长和农协的孙大勇站在场中央。\n“乡亲们！”丘金的声音打破了沉闷，“看着这满场的好谷子，大家伙儿脸上咋没个笑模样？心里憋屈，是不是？”他指向王茂生身边堆得高高的谷垛。\n“丘委员，这哪是憋屈？这是窝囊！”王茂生重重地磕了下烟锅，“辛辛苦苦干一年，风里雨里伺候着，好容易盼来个好收成！可你瞅瞅，”他抓起一把饱满的稻谷，“粮贩子一来，压价压得比陈年谷子还贱！说什么‘今年到处丰收’、‘城里米行不收’！呸！分明是串通好了，欺负咱们没门路！”\n“就是！”阿水嫂猛地站起来，指着远处村口，“那几个黑心贩子还在那晃悠呢！早上给三元一担，晌午就变两块八！再等两天，怕不是连本钱都收不回！家里等着钱买盐、扯布、给娃交学费呢！这谷子堆着，心焦啊！”她的话像火星掉进干草堆，瞬间点燃了村民们的怨气。\n“是啊！去年也是这么被坑的！”“辛苦半年，换不来几斤盐钱！”“公家管不管这事啊？”\n孙大勇捏紧拳头，黝黑的脸上满是愤慨：“茂生叔，阿水嫂，乡亲们！这口气，咱不能就这么咽下去！村委会、农协为何成立？就是不能让咱们农民兄弟的劳动成果，最后便宜了这些奸商！”他转向丘金和周文雍，“丘委员，周同志，政府得给咱撑腰！”\n丘金点点头，神情严肃：“大家伙儿的苦，政府知道！革命不是光喊口号，是要实打实解决咱老百姓的难处！今天这‘保价会’，就是来解决这‘谷贱伤农’的！”\n他示意郭世长说话。郭世长上前几步，声音清晰沉稳：“乡亲们，我是民盟的郭世长。咱不能光骂粮贩子黑心，得想办法！我们民盟联系了省城的‘民生米行’和‘工人消费合作社’。他们愿意收购咱们的好谷子，而且，”他提高音量，拿出一份草拟的合同，“保底价！ 三块五一担！白纸黑字写清楚，有多少收多少！”"
ROC_pingheng.48.a:0 "“三块五？！”"
ROC_pingheng.37.t:0 "保价卖粮(2)"
ROC_pingheng.37.d:0 "人群一阵骚动，不少人眼睛亮了起来。这比粮贩子出的最高价还高不少！\n“真的假的？”“民生米行？靠得住吗？”“路那么远，运费咋算？别最后赚的还不够路费！”\n周文雍耐心解释：“大家放心！合同是民盟担保签的。至于运输，”他看向孙大勇和农协的几位骨干，“这正是需要我们大家伙儿一起使劲的地方！不能光指望政府，得靠咱自己组织起来！”\n孙大勇立刻接过话头，充满干劲：“对！农协牵头，咱们组织运输队！栓柱，你们几个后生仔力气大，会赶车，算主力！各家按卖谷子的多少摊一点运费，农协统一安排车辆，集中运到省城码头交货点！这样运费摊薄了，效率高了，谷子也能卖上保底好价钱！”\n“这法子行！”栓柱兴奋地搓着手，“比单打独斗强多了！我报名！”\n丘金走到人群中笑道：“乡亲们，看到了吗？这就是群众运动的力量！政府、会社都会帮助大家，但最核心的力量，是咱们自己！是咱们愿意联合起来，自己组织运输队！自己守护自己的劳动成果！没有大家伙儿齐心合力，这保底价再好，谷子也变不成活钱！”\n他环视一张张被希望点燃的脸：“王茂生叔，您是长辈，您看，咱清泉村的各位有没有这个骨气和能耐，把这‘保价粮’顺顺当当运出去，把该得的钱挣回来？”\n王茂生看着跃跃欲试的栓柱，看着满脸期盼的阿水嫂，再看看周围乡亲们眼中重新燃起的光。他慢慢站起身，脸上深刻的皱纹似乎也舒展了些：“为了口粮，为了仔们…干！清泉村的叔伯兄弟，不能让人看衰了！老头子我，还能帮着看秤、记账！”\n“干！组织运输队！”"
ROC_pingheng.37.a:0 "“算我家一份！”"
ROC_pingheng.38.t:0 "画报展"
ROC_pingheng.38.d:0 "上午的阳光透过陈氏宗祠高大的雕花木窗，暖暖地洒在正厅。往日肃穆的祠堂，此刻被一面面精心布置的展板填满，空气中飘着新印刷品的油墨香和淡淡的布匹味道。正上方，悬挂着一幅醒目的隶书横幅：“同心同德，共建新连山！” 落款处，并列着大同会、民盟、同产工会等多个党派的徽记。\n陈老族长拄着拐杖，站在横幅下，声音洪亮：“各位叔伯兄弟，婶母姊妹！今日祠堂不做祭祀，不议族事，开的是个新鲜展览——‘画报’展！这墙上的画、字、照片，是政府把咱们取得的成果、攒下的经验，整合在一起，摆出来给大家看看！”\n乡民们好奇地围拢过来。李校长身着半旧长衫，走到第一块展板前，指着上面大同会提供的“互助组春耕”照片：“大家看这张！去年粮食大丰收，粮价被那帮奸商压得极低。可咱们县北的几个村，农协的兄弟牵头，民盟干事帮着协调收购事宜。大伙联合起来，你帮我运，我帮你扛，硬是把我们的粮食卖了个好价钱！这叫什么？”他顿了顿，“这就叫众人拾柴火焰高！”\n他又指向旁边民盟提供的“联合修渠”的实物布样：“再看这个！东头那条老水渠，年年修年年垮。去年夏天，农协出面，大同会支援了些水泥，后生们组织青壮劳力，各村的乡亲都出了工！渠修好了，桑田有水了，这不，”他拿起一块光洁的布，“合作社的茧子织成布，卖了好价钱，家家有份！这又说明啥？心往一处想、劲往一处使，黄土也能变成金！”\n几个老农凑近细看照片和布样，低声议论：“是哩，去年修渠我也去了…”“这布摸着是比自家织的匀实。”\n走到同产主义青年团提供的展板前，是几幅生动的“扫盲夜校”和“卫生宣传”漫画。李校长指着画上围坐学习的男女老少和宣讲卫生知识的青年：“识字明理，身体康健，这是咱们过好日子的根基！这些事，靠一个团体忙不过来。大家看，教书的先生、组织活动的后生、参与学习的乡亲，缺了哪一环都不成！”\n一位带着孩子的年轻媳妇看着“卫生宣传”漫画上画的洗手防病，小声对孩子说："
ROC_pingheng.38.a:0 "“看，阿妈教你的，画上都有人教呢。”"
ROC_pingheng.39.t:0 "理论研讨会"
ROC_pingheng.39.d:0 "岭南初冬，寒意渐浓。农民部办公室内暖气微热，房顶电灯明亮，映照着几张专注的面孔，讨论已持续数小时。\n谭平山轻点《问题报告》：“同志们，报告反映的问题很尖锐。一些地区‘平均地权’、试点扩大合作社后，出现‘吃大锅饭’的苗头，出工不出力，甚至抛荒。这背离了革命初衷！”\n农协顾问薛暮桥接话：“谭委员说到根子上了！光喊‘耕者有其田’不够！农民分了地，但一家一户，抗灾能力弱，买不起新式农具，技术也跟不上。结果呢？地还是种不好！我们农协在基层看得清楚，‘合作社’才是出路！但怎么合作？是强推集体农庄，还是发展自愿互助组？这需要理论给个说法，不能摸着石头过河，让农民吃亏！”他拿起一份农协的调研手稿，上面密密麻麻记录着具体案例。\n经济学教授方显廷认真翻阅着调查报告，半晌后轻声道：“薛主任的担忧非常现实。革命理论要求土地所有权归集体，这是公平的基石。但使用权、经营权、收益权是否可以、以及如何赋予个人或者小集体？赋予到什么程度？这关系到农民是土地的主人，还是仅仅是被动的劳动者？这个‘权责’的框架不厘清，实践必然混乱。”\n谭平山陷入沉思：“方教授提出的观点很有启发性。”他转向薛暮桥，“如果继续维持目前的这种小规模‘合作社’，能否解决这一问题？”\n薛暮桥点头，但仍有疑虑：“合作社是好，但规模小，力量有限。遇到大工程、新技术推广，还是抓瞎。而且，怎么防止互助组内部变成新的‘小地主’和‘长工’？理论不把路标树清楚，好经也会被念歪！”\n“这正是关键！”方显廷说，“我们能否搭建出一种‘多层次’的合作结构？比如在土地所有权归集体的前提下，基础生产单位可以是家庭或小型合作社；同时，在更高层级，由大集体统筹大型水利、农技推广、供销合作等事务，并为底层单位提供帮助……”\n陈思齐飞快地记录着，忍不住插话：“那……农民在高级社的集体事务里，有没有发言权？怎么保证集体不会变成新的‘衙门’，瞎指挥？”\n“问得好！”谭平山赞许地看向年轻人，“这就是民主机制必须融入合作社之中的原因！我们要搞的高级社，必须包含自下而上的决策参与和监督渠道，”"
ROC_pingheng.39.a:0 "确保合作社真正服务于人民，而不是相反。"
ROC_pingheng.40.t:0 "拥抱革命委员会政治"
ROC_pingheng.40.d:0 "“…保皇派与保守势力正在暗中串联，囤积居奇者、金融投机客与前朝军僚也彼此呼应。值此之际，我们更应坚定团结在革命委员会周围，与大同会同心同德，凝聚最广泛的社会力量，坚决维护来之不易的革命局面。”柯麟审阅着面前的文件，神情肃穆。作为大同会中央委员会主席、东南沿海革命力量的核心领导人，他深感在革命委员会新体制之下，自己肩负着对各参政党派与全体人民的责任与承诺。\n自六卅大罢工的慷慨激昂至庚午钱荒的沉着应对，短短数年间，历史的车轮滚滚向前。华夏大地正由议场走向战场，由分歧走向统一。新赛里斯的命运，由人民共同书写，她的儿女以热血与信念绘就团结奋进的篇章。此时此刻，任何的犹疑与动摇都是对革命的背离、对人民信任的辜负。\n柯麟提起毛笔，在纸面上写下明晰的指示。依照程序，该指令仍需经革命委员会集体审议，并与各友党开展民主协商后方可实施。但在当前严峻复杂的形势下，各参政团体已高度共识，坚决拥护大同会的领导，共同捍卫团结大局。正如柯麟所说：“团结是我们最可靠的武器。”"
ROC_pingheng.40.a:0 "同心同德，共克时艰"
ROC_pingheng.41.t:0 "精诚合作"
ROC_pingheng.41.d:0 "清晨，阳光照进大礼堂，广州革命委员会的各派首脑已经聚集在此。经过数月的拉扯、争吵与改造，革命委员会终于以完全的中道团结战胜了或左或右、或激进或保守的分裂风险，成统一、完整且进步的革命阵线。另一方面，大同会与各个友党之间的合作关系也在分分合合之后趋于稳定，几个党派先后根据精诚合作的原则做出了本党的组织调整和宣传调整。\n对于大联合的形成，广州《民报》盛赞其为“坚韧、稳定之革命首脑部”，实实在在地向某些希望革命委员会分崩离析的人或势力泼了一盆冷水。接下来，革命委员会必将同舟共济，直到最后的胜利或死亡。\n讲台上方，一条崭新的横幅悬挂在礼堂的房梁处，其崭新的工整字迹正如革命委员会精诚合作的光明前途：肝胆相照、荣辱与共、搁置矛盾、一心革命。\n柯麟望向众人，他清了清嗓子，脑海中不禁浮现出周朝古籍《尚书》当中所记载的一句话，那是武王伐纣誓师时意气风发的表现，当时的伐纣联军会盟孟津、挥师朝歌，这与今天的场景多么相像："
ROC_pingheng.41.a:0 "“受有亿兆夷人，离心离德；予有乱臣十人，同心同德。”"
ROC_pingheng.49.t:0 "勿忘过往"
ROC_pingheng.49.d:0 "各位可还记得武昌大同案？曾经的大同会秉持“开门主义”，吸收了太多投机分子，也因此酿就了这样的惨案。现如今，我们好不容易点燃了革命的火种，但我们的政府中却仍旧混杂着右派分子，我们怎么能保证他们不会像忠君大同会一样背叛我们呢？\n有人也许会质疑，当初的左派不也出走组建了同产工会吗？同产工会的出走是因为对大同会的无力和混乱失望，而非他们情愿分裂。现如今，我们重新组建了联盟，为了避免旧事重演，我们应当即刻着手组建左派的联盟，将反动分子排除在外，拒绝开门主义，继续大同会的革命！"
ROC_pingheng.49.a:0 "同志们，勿忘1901！"
ROC_pingheng.50.t:0 "革命再聚首"
ROC_pingheng.50.d:0 "今天，以同产工会为核心的诸多左翼政党在广州召开革命同盟会议，大同会作为革命委员会的领导政党，也受邀参加了此次会议。在会上，大同会重申了其立场，承诺将继续遵循1922年《大同——同产宣言》的精神，坚定地维护革命政党间的团结。\n会议期间，同产工会的成员对新政府框架中的右派力量提出了质疑。大同会对此作出回应，明确表示政府将始终保持其革命性。同产工会的代表随后提出了他们的革命远景，包括推动土地改革、农村合作化以及公私合营进程。他们强调愿与各左翼政党携手合作，共同推进革命发展，将真正的“天下大同”理想在这片土地上实现。\n尽管可能仍有人心存疑虑，但左翼同盟已经开始采取行动，着手扩大各左翼政党在新政府中的影响力，并为实现实质性的变革做准备。"
ROC_pingheng.50.a:0 "让我们拭目以待。"
ROC_pingheng.14.t:0 "革命第一步"
ROC_pingheng.14.d:0 "在革命同盟会议召开后，左翼联盟即刻向革命委员会提出了所有制革命的一系列法案。左翼联盟的成员们先是对现在缓慢的革命进程提出了批评，并痛斥反动势力的诸多罪恶，最后提出了一系列立法规划，势必以革命立法消灭剥削。\n在这一系列的法案提出后，委员会内的右派们便开始了他们的攻击，斥责这些都是小孩子的幻想，会撕裂革命政府，会让革命在混乱中崩塌。但左翼联盟并不打算就此让步，而是要坚定地推行这场所有制的革命。为此，革命委员会必须做出选择，该如何处理这些法案呢？"
ROC_pingheng.14.a:0 "让我们推行这些革命举措"
ROC_pingheng.14.b:0 "天真的幻想，否决"
ROC_pingheng.15.t:0 "企业中的革命（2）"
ROC_pingheng.15.d:0 "潮湿晨雾笼罩议会大厦时，大同会总部收到了提案的副本。中执委会议室内，檀木会议桌中央的铜制地球仪蒙着薄灰，萧铮的钢笔尖在提案扉页悬停许久，最终在 “全盘接管重工业” 字样旁划出刺眼红线：“诸位，广州商会刚联名给‘国际民生产业促进会’递交了请愿书，此刻动这些企业，无异于在火药桶上跳舞。”\n“可我们已经站在火药桶上了！” 陈赞贤突然扯松领口，露出脖颈处罢工留下的弹痕旧伤，“我们的目标是革命，是为工农大众谋福祉。革命不是请客吃饭，不攥住经济命脉，明天资本家就能让整座城市停电停水！” 他的皮鞋重重碾过地板，扬起的尘埃在光束中翻腾。\n柯麟始终沉默地翻阅文件，目光在密密麻麻地红色批注上来回游移。窗外突然炸响的闷雷惊得众人一颤，他合上文件夹，金属搭扣发出清脆咔嗒声：“是福是祸，尚未可知。但可以确定的是，不论怎么选择，这都将是一场硬仗。” 雨滴敲打玻璃窗，在他镜片上晕开无数细碎光斑，“但历史从来不会等待犹豫不决的人 —— 准备战斗吧。”"
ROC_pingheng.15.a:0 "不继续推动公私合营，哪来的所有制革命？"
ROC_pingheng.15.b:0 "现在还不是惹恼企业家的时候，再等等吧"
ROC_pingheng.51.t:0 "企业中的革命（1）"
ROC_pingheng.51.d:0 "暮色如刀，斜斜劈开百叶窗，在斑驳的长会议桌上投下冷硬光影。左派联盟成员们围坐环形会议桌前，争论声此起彼伏，划破潮湿凝滞的空气。有人指间香烟明明灭灭，烟灰簌簌落在褪色桌布上，无人在意。\n劳动党代表夏曦突然起身，木质椅腿刮擦地面发出刺耳声响。他胸前红星徽章随动作轻晃，眼底跳动着灼热的火焰：“各位不觉得我们现在的企业中依然充满了不公和剥削吗？既然革命委员会的法案已提上日程，就该加快企业革命进程，把经济命脉攥在手里！” 他猛地将手中的《工人劳动情况调查报告》拍在桌子上，“不能让企业继续当绞肉机，必须改造成人民的机器！”\n会议室陷入短暂死寂。社会党代表李铭轻轻敲击着桌面上地文件，镜片后的目光满是迟疑：“夏同志，右派在议会的弹劾案还悬在头顶。上周《工商日报》头版刚刊登‘警惕激进主义’的社论，现在强行推进……” 他的声音很快被反对声浪吞没。​\n“非要等豺狼亮出獠牙才举枪？” 工党代表韩恢拍案而起，褪色的工装在灯光下泛着青白，“这帮资本家中，一些人当年可没少帮助明廷压榨我们！难道现在交一笔款项，就摇身一变成为可靠的革命同志了？” 他的怒吼如火星，瞬间点燃了与会成员的情绪，会议室里顿时声浪滔天。\n角落里，傅秉常等几位大同会代表相互对视，都从彼此的眼底看到了不安。革命需要经济变革，但此刻强行推进，只怕会让本就脆弱的工商界倒向右派。这种进退两难的焦灼，恰似他手中那枚时快时慢的旧怀表，永远卡在尴尬刻度。"
ROC_pingheng.51.a:0 "持中守正，又何其难？"
ROC_pingheng.16.t:0 "一切权力归工会！"
ROC_pingheng.16.d:0 "“一切权力归工会！”\n一张显眼的大字报被贴在工会的门口，正由新来的革命干部激情洋溢地讲给工人们听。\n“军事化训练，政治理论学习……听讲之后的事会越来越多啊。”\n“点啊，嫌麻烦啊？”\n“如果真系好似佢得讲的，又可以罢工又可以参与决策，仲可以拎枪监督班老板同当官的，我开心都嚟唔切啦，点会嫌麻烦。就系话‘一切权力’……到底有几‘一切’啫。”\n“横掂对我得工人有好的啩？”\n两个工人小声交流着，干部还在前面认真地讲解着，更多的细节被将给了工人们。\n“工人兄弟们，只有得到你们的支持，大家齐齐参与，权力才可以真正落到工会同工人手上！”"
ROC_pingheng.16.a:0 "动员工人，权归工人"
ROC_pingheng.16.b:0 "顾全大局，要求工会行动缓和化!"
ROC_pingheng.17.t:0 "从法律开始"
ROC_pingheng.17.d:0 "在公私合营和工会动员开始后，陈赞贤进一步提出将公有制写进法律中的要求。陈赞贤认为，必须要把公有制为主体这一经济政策写进法律当中，才能进一步展开革命，才会更有利于我们未来的工作。\n总体来说，现在确实是将这一点写入法律的好时机。公私合营正稳步进行着，工人们的热情也越发高涨，在这个时候顺势动员工会们联合提出请求，将公有制经济的主体地位写到法律中，哪怕企业主们和右派分子不同意，想必也会忌惮工人们的力量而做出让步。\n还是说，因为这样可能会打击企业主的积极性，要暂时推迟这样的明文宣战？"
ROC_pingheng.17.a:0 "我们还缺这一步吗？明确写入法律！"
ROC_pingheng.17.b:0 "少安毋躁，写入法律的事什么时候都能做"
ROC_pingheng.18.t:0 "动员被压迫者"
ROC_pingheng.18.d:0 "“农民兄弟！现在已经唔系旧社会啦，大家要大胆同过去嘅压迫算账！难道农民就活该受苦咩？就活该俾地主剥削咩！”\n农协的成员在慷慨激昂地鼓动着农民们，但农民们看起来还是有所顾虑，有些疑虑和担忧地看着他。\n“大家唔用担心，今次所有活动都系政府支持嘅！我哋政府、大同会、农协，全部都会支持大家批斗！有乜嘢疑虑即管讲，我哋都会同大家解答！”\n“我哋抢返啲地之后，会唔会俾人报复啊？”\n“当然唔会！我哋鼓励大家对反抗嘅地主实行肉体消灭，呢啲系地主应得嘅！”\n“噉样会唔会太过分啊？有啲地主以前对我哋都几好……”\n“各位，如果佢真系好人，就会自动配合我哋嘅工作，因为只有配合我哋，先至系对佢自己好，真正对我哋农民兄弟好！更何况，我哋系希望大家自主组织批斗会嘅，如果佢系好人，大家就唔使批斗佢啦！呢啲都系交俾农民兄弟自己判断，唔系我哋逼大家用暴力㗎！”\n农民们面面相觑，事情确是如此，如果说是让恶人罪有应得，那谁会不愿意呢？"
ROC_pingheng.18.a:0 "让农民们自己做出决断"
ROC_pingheng.18.b:0 "开展公审、依法判决、反对私刑"
ROC_pingheng.19.t:0 "武装到基层"
ROC_pingheng.19.d:0 "随着乡村农运规模持续扩大，农民群众投身批斗与清算的行动日益频繁。地主士绅阶层的抵触情绪逐渐加剧，却因失去基层掌控力而难以有效制衡。但随着运动逐渐突破原有界限，部分地区的斗争矛头开始指向支持革命政权的进步士绅群体，甚至出现农协与 "进步民团" 爆发武装冲突的状况。右派认为这是革命走向瓦解的信号，大声疾呼要中止土地改革，重复着“糟的很”。但左派联盟们并不打算就这样让步。农协方面摆出了诸多数据，证明农民们为政府带来的支持，这些乡绅、农业资本家的反扑远远不及农民们为革命带来的好处。\n夏明翰在革命委员会中大声疾呼：“同志们，如果我们现在停下，就既会失去农民对我们的信任，又无法让地主对我们的印象有所改观。我们真正的革命基本盘是劳动者，是工农群众，不是地主和乡绅群体，不要功亏一篑啊！”"
ROC_pingheng.19.a:0 "夏明翰同志说的没错，我们的核心是农民，绝不能放弃农协武装！"
ROC_pingheng.19.b:0 "可是进步士绅对于革命同样……"
ROC_pingheng.20.t:0 "趁热打铁"
ROC_pingheng.20.d:0 "在革命委员会的会议上，夏明翰带着振奋的心情汇报了农村经济改革的进展。他指出：“我们的农村改革已取得显著成效，赢得了农民的信任与支持。当下，我们应顺势而为，扩大农村合作社规模，以此为契机推动公有制经济的扩展，并促进生产力的提升。”\n左派联盟的成员们对此大多表示认同，认为这是巩固和扩大革命成果的关键举措。然而，也有部分成员持审慎态度，他们担心在经验不足的情况下贸然扩大合作社，一旦遭遇挫折，可能会影响已获得的农民支持，甚至削弱我们与农民阶级的联系。\n会议的讨论逐渐聚焦于一个问题：是应当更加谨慎地推进合作化，确保每一步都坚实稳妥；还是应当抓住当前的有利时机，大胆扩大合作社规模，加速推进公有制经济的发展？"
ROC_pingheng.20.a:0 "趁热打铁，扩大合作社"
ROC_pingheng.20.b:0 "谨慎一点吧"
ROC_pingheng.21.t:0 "添柴"
ROC_pingheng.21.d:0 "左派联盟向革命委员会提交了一份极具冲击力的提案，建议发起一场名为“革命整肃”的行动，核心是用强制手段打击大、中资产阶级，同时清理革命阵营内的动摇分子。左派联盟认为，虽然过去的改革缓解了社会和经济矛盾，但反动势力的基础并未被动摇。许多反动和投机分子仍隐藏在革命队伍中。在当前形势下，实施整肃措施不仅必要，而且是推动革命深入发展的有利时机。\n这一提案在各派系间引发了激烈争议，右派的反对声浪尤为强烈。他们指责左翼各党试图借机推动派系斗争，还警告这样的行动将严重冲击共和政府的经济根基。那些曾作为革命合作伙伴的“民生产业促进会”企业，也将在此次行动中受到波及，其中不乏一些自大同会成立以来，便为其提供资金支持的企业。\n革命之火熊熊燃烧，如今到了决定是否再添一把柴的时刻。"
ROC_pingheng.21.a:0 "已经没什么好怕的了，让革命继续吧！"
ROC_pingheng.21.b:0 "都停下来！我们做的太过火了！"
ROC_pingheng.22.t:0 "将理想落到实处"
ROC_pingheng.22.d:0 "在和右派撕破脸之后，左派联盟终于可以毫无顾忌地提出真正符合工农权益的提案了。共同向革命委员会提出了颁布《工农权益保障法》的提案。这一提案涉及工农权益相关的各个方面，从劳动时长到工资标准，从农协权力再到教育资源，从各个方面都将工农权益的优先级提到了最高级。这一提案同样得到了大同会内部陈赞贤、夏明翰等委员的支持。\n这是一个真正为了工农的提案，为了实现工农全面对剥削者实施专政的提案。同时，这法案也有一个问题，就是真正去落实这些要花费的人力物力问题。有些成员认为这些当然是要落实的，但我们现在真的有这样的实力吗？"
ROC_pingheng.22.a:0 "只有做了才知道"
ROC_pingheng.22.b:0 "步子不要迈太大"
ROC_pingheng.23.t:0 "《关于左翼联盟秘密集会之密报》"
ROC_pingheng.23.d:0 "近日，我处侦获关键情报，左翼联盟部分政党于暗处召开联席会议，图谋篡夺革命领导权。此次集会，左翼联盟各党暗中联合，其行迹隐秘，然终被我方耳目侦知。\n会中，左翼联盟对当前局势作出所谓 “深入分析”，大肆宣扬其过往在工农权益及所有制变革方面所作之 “贡献”，妄图以此为借口，扩张其在革命阵营中的影响力。彼等宣称工农阶级已然掌握武装，革命情绪高涨，若起事必获无产阶级积极响应。此论调实为夸大其词，意在煽动激进情绪，为其夺权图谋制造声势。\n会议还妄指共和政府内部存在明面右派与 “温和派” 两股敌对势力，并将斗争矛头直指我会。左翼联盟声称，从这两股势力手中夺取革命领导权，乃是其未来行动之首要目标。其言辞激烈，对我大同会及共和政府多有诋毁，全然不顾革命阵营团结一致之大局。\n经密谋商议，左翼联盟决心在理论、权力及组织架构等关键领域发起挑战，企图全面夺权。其行径已严重破坏革命阵营之稳定，若任其发展，必将对共和政府之权威与革命成果造成难以估量之损害。\n综上所述，大同会情报处建议革命委员会对此事予以高度重视，严密监控左翼联盟之动态，防范其极端行径对革命事业造成不利影响。同时，应加强革命阵营内部之团结与协作，巩固共和政府之稳定，确保革命沿着正确道路稳步前行。\n大同会情报处敬呈"
ROC_pingheng.23.a:0 "开展谈话，维护统一战线！"
ROC_pingheng.23.b:0 "他们到底想要干什么？"
ROC_pingheng.24.t:0 "理论领域的战争"
ROC_pingheng.24.d:0 "这段时间，各党派的报纸特别活跃。一派刚刚发出一篇理论文章，敌对派系便会即刻发出新的文章来攻击反驳，虽然有时候论战会变成不那么体面的争吵，但毫无疑问的是，左派在这方面比右派下的功夫越多，同时在普通工农当中的宣传也要更多一些。而这些正是左派联盟的目的：统一思想，肃清流毒。\n政府内外正进行着一场激烈的思想斗争，而胜者将得到更多人的认可。"
ROC_pingheng.24.a:0 "让氛围缓和下来！"
ROC_pingheng.24.b:0 "真理越辩越明！"
ROC_pingheng.25.t:0 "羊城工运"
ROC_pingheng.25.d:0 "当荔枝湾的晨雾还未散去，荔香楼二楼的雕花窗棂已透出昏黄的煤油灯光。大同会广东省党部执行委员何羽道捏着雪茄的手指微微发颤，烟灰簌簌落在《广州工人运动简报》上 —— 第三页用红笔圈着的 “粤汉铁路机务段工人自行成立监察委员会” 字样，像道渗血的伤口。\n“执委们请看，” 他用镇纸敲了敲桌面，声音里带着克制的烦躁，“短短三天，全市已有七个工厂出现‘工人自治小组’，他们绕过党部劳工部，直接向厂方提出‘参与管理财务’‘废除工头制’的要求。” 窗外传来卖马蹄糕的梆子声，他突然提高嗓门，“这不是简单的劳资纠纷，是有人在借‘革命激进主义’破坏共和政府根基！”\n会议室里响起此起彼伏的翻动文件声。宣传部长林默之清了清嗓子，目光停在简报末段：“据内线报告，同产工会的骨干这几日频繁出入纺织厂女工宿舍，他们散发的《告工友书》里公然质疑‘改良路线的妥协性’。” 他抽出张油印传单，“你们听听这措辞：‘所谓统一战线只知讨好资本阶级，全然不顾工人的手上还沾着机油和血汗！’这符合事实么？这是赤裸裸的煽动！”\n突然，木门被推开，秘书抱着卷宗匆匆进来：“执委，西濠口缫丝厂出事了。女工们扣押了账房先生，要求厂方公开近三年的利润分成明细。” 何羽道的雪茄猛地戳进烟灰缸，火星溅在桌布上烧出焦洞。财政委员张恪宸皱眉道：“公开账目倒也没什么，但现在正值和南洋企业洽谈订单的关键期，若让这些‘自治委员会’闹大，兰芳周饶的企业还敢和我们签订单么？年前从国营农场和各个合作社收上来的棉纱又怎么处理？我看要不把官司打到革委会去得了！”\n寂静中，资历最深的监委王伯年轻叩茶盖，发出清越的声响：“诸位莫要慌了阵脚。几年前省港大罢工，我们靠什么顺利组织起各地零散的工人组织的？” 他环视众人，“一是承认部分合理诉求，二是将工会纳入党部指导体系。如今这些所谓‘自治组织’，本质是缺乏政治经验的工人在盲目效仿苏俄模式。” 他从皮包里取出草拟的《劳工调解条例修正案》，“我们不妨主动出招：下周召开生产协调大会，由党部牵头成立‘工人福利审议会’，允许每个大厂派两名工人代表参与 —— 当然，代表需经党部审查。”\n何羽道盯着修正案上 “党部指导” 的加粗字样，指尖摩挲着下巴上的胡茬。楼下传来挑夫的号子声，混着荔湾艇仔粥的香气。他突然想起三年前在汉口，自己站在罢工工人中间振臂高呼的场景，那时的口号声似乎还在耳膜震荡。但此刻，当他看见张恪宸正在给周饶、兰芳的企业代表写请柬，听见林默之在吩咐修改明天见报的社论标题，那些声音突然变得遥远而模糊。"
ROC_pingheng.25.a:0 "也许，我们可以有别的解决办法？"
ROC_pingheng.25.b:0 "只能如此了"
ROC_pingheng.52.t:0 "走的更远"
ROC_pingheng.52.d:0 "“伯年兄，你的方案有道理，但我觉得我们可以走得更远一些。” 何羽道的声音打破了沉默，他放下雪茄，拿起修正案，“我们不仅要承认工人的合理诉求，还要在政府内部推动更积极的改革。这些工人自治小组的出现，说明他们渴望更多地参与和权利。我们不能简单地压制，而应该引导他们，让他们成为革命的有力支持者。”他环视会议室，看到一些年轻的委员眼中闪过一丝兴奋，而几位年长的委员则面露忧虑。“我们可以在政府内部成立一个专门的工人事务委员会，由总工会和各厂的工会代表组成。这个委员会将负责协调工人与厂方的关系，以确保工人的声音能够被听到。”\n宣传部长林默之微微皱眉，沉思片刻后说道：“这个想法不错，但我们需要谨慎行事。我们不能让这个委员会成为激进分子的工具。”\n何羽道点头表示同意：“当然，我们会严格审查委员会成员的资格，确保他们只作为工人代表活动。”\n一直没有作声的工人部委员林坊突然开口道：“我同意老陈的提议。我们不能让工人失望，否则他们会转向其他力量。我们必须在维护革命秩序的同时，给予工人更多的权利和保障。”\n经过一番激烈的讨论，最终，广州市党部通过了有利于工人权益的决议。该议案不仅承认了工人自治小组的合法性。虽然一些年长的委员对此心存疑虑，并表示将上报上级政府等待决议，但何羽道坚信中央会做出相同的选择。\n几天后，广州市党部宣布成立工人事务委员会，在传统工会之外负责协调工人与厂方的关系，推动工人福利的改善。何羽道站在荔香楼的窗前，看着街道上穿着蓝布衫的工人正排队领取免费的夜校课本，远处纺织厂的烟囱冒出淡灰色的烟。他摸出怀表，指针指向七点十五分 —— 再过半小时，他将在省党部扩大会议上宣读《关于妥善处理工人诉求的若干意见》。看了看手中的烟，他最终还是没有选择点燃它，而是拿起了在武汉时一个工友送他的手套……"
ROC_pingheng.52.a:0 "大步流星地朝门外走去。"
ROC_pingheng.53.t:0 "福利调和"
ROC_pingheng.53.d:0 "“就按伯年兄的方案办，” 何羽道抓起钢笔在文件上签了字，墨迹在 “维护革命秩序” 的末尾洇开小团阴影。\n“还要加一条：严禁任何未经党部批准的工人组织擅自行动。另外……” 王伯年顿了顿，目光扫过窗外正在贴 “拥护改良新政” 标语的支部干事，“通知各区支部，下周开始各地的‘工人夜校’，教材用新修订的《大同主义劳工读本》。”何羽道闻言愣了片刻，但最终还是选择了沉默。\n晨光终于漫过珠江，荔香楼的茶客们开始陆续上楼。何羽道站在窗前，看着街道上穿着蓝布衫的工人正排队领取免费的夜校课本，远处纺织厂的烟囱冒出淡灰色的烟。他摸出怀表，指针指向七点十五分 —— 再过半小时，他将在省党部扩大会议上宣读《关于妥善处理工人诉求的若干意见》。楼下的报童突然大声叫卖：“号外！政府允诺改善劳工待遇！” 他转身时，看见会议桌上的雪茄烟蒂仍在冒烟……"
ROC_pingheng.53.a:0 "像颗即将熄灭的火星。"
ROC_pingheng.26.t:0 "多个左翼政党宣布退出共和革命政府"
ROC_pingheng.26.d:0 "今日清晨，以同产工会为首的多个左翼政党召开联席会议，宣布退出共和革命政府。他们指责大同会已偏离革命的初衷，沦为修正主义的代表，再也无法引领革命走向深入。\n“我们曾寄希望于联合政府，以为各党派能求同存异，共赴国难。”同产工会的代表站起身，语气中带着一丝无奈与惋惜，“但如今看来，我们的理想不过是一场泡影。大同会为了所谓的‘稳定’，一再妥协，将工农的诉求抛诸脑后。”\n“革命的道路上，容不得半点退缩！”劳动会代表夏曦紧随其后，目光炯炯，“我们退出，是为了给真正的革命让路。我们相信，只有彻底推翻旧有的经济基础，建立全新的社会秩序，才能实现真正的公平与正义。”\n会场外，消息如长了翅膀般迅速传开。市民们聚集在政府大楼前，或交头接耳，或高声争论。有人手持标语，表达对左翼政党的支持；也有人面露忧色，担心这将引发政治动荡。媒体记者们更是围堵在各党派代表的周围，长枪短炮闪烁，记录下这历史性的时刻。"
ROC_pingheng.26.a:0 "何以至此？"
ROC_pingheng.54.t:0 "抉择"
ROC_pingheng.54.d:0 "政府内部，大同会成员紧急召开会议，商讨对策。面对左翼政党的退出和指责，中执委的成员们显得既愤怒又无奈。一些人主张强硬回击，指责左翼政党的行为是“分裂革命”；另一些人则呼吁保持冷静，尝试通过对话解决问题。\n“他们这是在逼宫！”一位大同会成员拍案而起，“退出就退出，难道我们还求着他们不成？”\n“话不能这么说。”董必武沉声道，“左翼政党的退出，可能会削弱革命政府的合法性。我们必须尽快稳定局势，否则各路反革命势力会乘虚而入。”\n“难道就任由他们这么诋毁政府吗？我看……”\n看着眼前争论不休的委员们，柯麟忽然感到一阵力不从心。革委会最终走到今天分裂的局面，又何尝不是大同会内部派系分歧、观点对立的投影呢？思虑至此，柯麟长叹一声道："
ROC_pingheng.54.a:0 "天要下雨，娘要嫁人，随他们去吧"
ROC_pingheng.9997.t:0 "第一次经济大会"
ROC_pingheng.9997.d:0 "随着革命政府的成立，破旧立新、改造旧经济体制，进而向“大同”理想迈进，已成为当前经济工作的核心命题。眼下，政府内部正激荡着多股思潮：有人主张疾风骤雨式的全面变革，有人坚持循序渐进的温和改良。究竟由谁执掌经济部，将直接决定未来一段时间的经济建设方向。"
