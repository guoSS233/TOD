### ideas ###
ROK_Republic_flag:0 "共和旗帜"
ROK_Republic_flag_desc:0 "随着革命进程的推进，我们已然成为全国共和派的旗帜！让革新之风，吹遍三千里河山！"
ROK_Revolutionary_army:0 "共和军队"
ROK_Revolutionary_army_desc:0 "我们的军队来源复杂，除了少数职业军人外，大多是来自于农会、工会的非武装人员。如何有效整合这支革命斗志高昂，但作战意志不足的军队，是我们的当务之急。"
ROK_United_revolution:0 "联合革命"
ROK_United_revolution_desc:0 "新生的革命政府是朝鲜大同会与同产工会合作的产物，让我们携手共进，推翻反压在朝鲜人民身上的三座大山！"

### leaders desc ###
ROK_Li_Donghui:0 "李东辉"
ROK_Li_Donghui_desc_leader:0 "李东辉，至和六年（1873年）出生于朝鲜咸镜道，出身贫苦地区的他自小便立志要改变社会。在清津汉文学堂求学期间，李东辉积极投身社会活动，后加入朝鲜大同会，并参与多项大同会开展的社会改造项目。1902年大分裂时，他响应谭嗣同、杨锐、金子名的号召退出大同会，另组朝鲜同产工会。作为新生的朝鲜同产工会的核心人物，李东辉当选为工人部部长。任职期间，他积极组织工人运动，推动社会变革。1910年，因矿主克扣工资及工作环境恶劣，他领导了咸镜道煤矿工人的罢工。李东辉秘密联络工人，最终成功发动罢工。在罢工期间，他发表多场演讲，激励工人坚持斗争，争取应得权益。最终，资方在压力下让步，最终工人工资并改善了工作环境。凭借这些斗争，李东辉在朝鲜同产工会中的地位日益巩固。1919年，他当选为工会执委会主席，开始全面领导工农运动。大同会在孙文北上期间，李东辉积极进行斡旋，最终顺利促成了《同产—大同联合宣言》颁布。1932年，在铁路工人大罢工期间，李东辉指导同产工会带领工人抗议铁路修建中的工资拖欠、施工安全等问题。在同产工会的组织下，工人们在铁路沿线集结，发起了大规模的抗议罢工活动。尽管期间遭遇军警的多次镇压，但朝鲜的工人们并没有屈服，各类罢工运动愈演愈烈。最终出于稳定社会局面的考虑，朝鲜国铁局被迫出面谈判，满足了工人们的合理诉求。但在工运平息后，朝鲜当局对于同产工会采取了严厉的打击搜查措施，李东辉本人也被迫暂时出走海外。但随着1936年以来，朝鲜的社会局势愈发动荡，李东辉选择盯着严密的搜查暗中回国，与千千万万饱受压迫的朝鲜劳动人民一起，争取他们美好的明天。"

