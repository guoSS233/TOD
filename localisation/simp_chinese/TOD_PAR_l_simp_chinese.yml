PAR_Francis_CoAntonio_Lopez_V:0 "佩洛斯三世"
### 巴拉圭流程事件 ###
TOD_PAR.1.t:0 "王国政府大选"
TOD_PAR.1.d:0 "巴拉圭联合王国的大选如期举行。红党与蓝党争斗多年，此次选举更是白热化。投票站前排起长队，人们用选票表达对未来道路的选择。最终，计票结果出来了。"
TOD_PAR.1.a:0 "蓝党赢得大选"
TOD_PAR.1.b:0 "红党赢得大选"
TOD_PAR.2.t:0 "佩洛斯三世去世"
TOD_PAR.2.d:0 "亚松森王宫的钟声在黎明时分敲响，缓慢、沉重，一共七十响，每一响代表老国王生命中的一年。佩洛斯三世薨。对于大多数巴拉圭人来说，老国王的存在如同土地本身，从未想过他会离开。\n\n他继承王位时，巴拉圭刚从三国同盟战争的废墟中站立起来。而他离世时，巴拉圭已是南锥体举足轻重的力量，与南道山、四方一同缔造了泛道山协约。他的名字与战后重建、土地改革、亚松森至蒙得维的亚铁路、王国工业化以及与南道山的不渝友谊紧紧缠绕。"
TOD_PAR.2.a:0 "我们希望那个大胡子的老国王回来"
TOD_PAR.3.t:0 "种植园丑闻"
TOD_PAR.3.d:0 "一份来自联合果品公司内部的文件被泄露给《岭兰府每日新闻》。文件显示，该公司在巴拉圭和南道山北部的种植园长期压榨劳工、贿赂地方官员、甚至雇佣武装暴力驱赶抗议的农民。舆论哗然，反对派在资政院猛烈抨击政府与“五大公司”的勾结。武盤照总统表态，要求司法部门介入调查。"
TOD_PAR.3.a:0 "这帮公司狗该消停些了"
TOD_PAR.4.t:0 "巴拉圭针对公司调查"
TOD_PAR.4.d:0 "巴拉圭司法部门与南道山经济特别行动科联合展开调查，突袭了联合果品公司在亚松森及北部种植园地区的办事处。大量账册、合同和内部通讯被查封。在压力面前，公司高层同意进行内部整顿，承诺改善劳工待遇，并解雇涉案的几名地区经理。巴拉圭公众对政府的果断行动表示满意，但也有人担心这只是一场“表演”。"
TOD_PAR.4.a:0 "调查暂告一段落"

### 巴拉圭国家精神 ###
PAR_red_blue_conflict:0 "红蓝大战"
PAR_red_blue_conflict_desc:0 "红党与蓝党的长期争斗撕扯着王国政治，政府必须先让这场无休止的党争落幕。"
PAR_blue_party_victory:0 "蓝党大胜利"
PAR_blue_party_victory_desc:0 "蓝党赢得了大选，王国政府得以在相对稳定的议会秩序中继续施政。"
PAR_red_party_victory:0 "红党大胜利"
PAR_red_party_victory_desc:0 "红党赢得了大选，其支持者期待一个更加果断、强硬的王国政府。"
PAR_aging_king:0 "辞暮国王"
PAR_aging_king_desc:0 "年迈的佩洛斯三世仍是王国团结的象征，但衰老已经让继承问题成为亚松森无法回避的阴影。"
PAR_Pelos_IV:0 "佩洛斯四世"
PAR_Eusebio_Ayala_Bordenave:0 "尤塞维奥·阿亚拉·博尔登纳韦"
PAR_Rafael_Franco_Ojeda:0 "拉斐尔·佛朗哥·奥赫达"
### 泛道山协约通知 ###
TOD_PAR.100.t:0 "泛道山协约"
TOD_PAR.100.d:0 "南道山煌原共和国、四方王国与巴拉圭联合王国已经正式签署《泛道山协约》。从今日起，三国将以共同防务、外交协调与军事合作为基础，组成泛道山世界的正式联盟。"
TOD_PAR.100.a:0 "胜利者的联盟"