### 国策描述 ###
STG_xinhuangshangwei:0 "新皇上位"
STG_xinhuangshangwei_desc:0 "奉先帝遗诏，本王继承大统！"
STG_yingduiluanju:0 "应对乱局"
STG_yingduiluanju_desc:0 "顺天事变后，各地叛乱蜂起，然而其中对我们威胁最大的，无疑是手握西北强军的庆王集团。我们必须立刻着手准备，为即将到来的西北作战打好基础。"
STG_xibeikanluan:0 "西北戡乱"
STG_xibeikanluan_desc:0 "随着时局的演变，我们与西北方面的战争已是势在必行，无法回避。此刻，是时候展现我们直隶军的威武之姿，让他们领略一下我们强大的实力了！"
STG_sugongpodi:0 "速攻破敌"
STG_sugongpodi_desc:0 "如今全国局势混乱，我们无暇与西北军纠缠过多。当务之急，乃是趁西北方面尚未稳固之际，迅速发动攻击，一举攻破敌军防线。只要我们顺利拿下关中这一工业重地，失去支撑的西北军便注定走向败亡。我们必须集中力量，迅速行动，以最小的代价取得最大的胜利。"
STG_jixiehuazuozhan:0 "机械化作战"
STG_jixiehuazuozhan_desc:0 "若想迅速突破敌方战线，我们必须摒弃欧战时期堑壕、步兵与重炮结合的陈旧战法。我们的军事学家所提出的“机械化”作战理念，或许将成为我们与西北方面决战的胜负关键。"
STG_huanghehuizhan:0 "组织黄河会战"
STG_huanghehuizhan_desc:0 "渡河！渡河！渡河！"
STG_fangshouyibo:0 "放手一搏"
STG_fangshouyibo_desc:0 "我们将全力调度所有产能与物资，不遗余力，务必在即将到来的会战中一举击溃西北军主力，彻底扭转战局"
STG.1.tt:0 "§R如果没有达成战略目标，会对朝廷权威造成恐怖的后果······§"
STG_yijingzhidong:0 "以静制动"
STG_yijingzhidong_desc:0 "西北强军并非浪得虚名，庆王本人军事才能也不容小觑。相较于盲目追求速生，也许我们刻意利用西北经济潜力有限的劣势，先通过防守挫其锐气。待到敌人显示出疲态后，在进行防守反击。"
STG_huolifugai:0 "火力覆盖"
STG_huolifugai_desc:0 "火炮在防守中的战略地位已在无数战场上得到确凿验证。若想据守险要，抵御敌军锋芒，依赖强大的火力支援无疑是一个明智的选择。我们将充分利用火炮的威力，构建坚不可摧的防线，确保敌军难以突破我们的阵地。"
STG_huanghefangxian:0 "加固黄河防线"
STG_huanghefangxian_desc:0 "黄河虽非长江那般天堑，然在战争中亦能发挥举足轻重的作用。我们必须进一步巩固此前仓促构筑的黄河防线，确保其坚如磐石，以保卫我们华北腹地的安宁。"
STG_fangshoufanji:0 "防守反击"
STG_fangshoufanji_desc:0 "一鼓作气，再而衰，三而竭，彼竭我盈，故克之。如今西北军气势已衰，是时候有我们来组织会战，转守为攻了！"
STG_fangshoufanji_xiaoguo:0 "会战： \n组织度: §G+5.0%§! \n陆军攻击: §G+10.0%§!  \n计划上限: §G+10.0%§!"
STG_zhengzhixuanchuan:0 "政治宣传"
STG_zhengzhixuanchuan_desc:0 "当今圣上承先帝遗诏登基，本是名正言顺。然因乱党妖言惑众，致使百姓士卒心生疑虑。为澄清视听，稳定民心，我们应积极展开政治宣传，以正视听，帮助百姓摆脱错误认知，共同拥护朝廷，维护国家安定。"
STG_fenhualalong:0 "分化拉拢"
STG_fenhualalong_desc:0 "西北都督府中有众多将士、士绅及官员，实则均为庆王乱党所裹挟，他们本心并无与朝廷为敌之意。我们应当积极联络、拉拢这些人士，运用各种策略，助其脱离困境，避免沦为庆王集团与朝廷对抗的牺牲品。如此，不仅能减少战场上的敌对力量，更能彰显朝廷的宽宏大量与仁爱之心，赢得更多民心支持。"
STG_yindangongshi:0 "银弹攻势"
STG_yindangongshi_desc:0 "随着庆王倡乱，西北的工业和经济产能大多倾斜向了军事领域，然即便如此，其军队薪资仍远逊于我军，尤在军官待遇上表现明显。如果我们能够善用手中的财富，也许能够在一些领域实现“不战而屈人之兵”。"
STG_chongshenfatong:0 "重申法统"
STG_chongshenfatong_desc:0 "如今西北庆王乱党已然覆灭，我们已经一统关内的北方大地。陛下将亲临祭坛，昭告天地，重申自己乃大明唯一的合法天子，以彰显皇权正统，昭示天下必将归一。此举必将激励万民，共襄盛举，开创国家新的辉煌篇章。"
STG_shengchanzhanbeihua:0 "生产战备化"
STG_shengchanzhanbeihua_desc:0 "随着战争降临，我们的生产方向也必须随之进行调整。通过生产战备化的方式，我们将集中更多产能投入到军事领域，我们天下一统的战略提供坚实的后盾。"
STG_shengchanzhanbeihua_xiaoguo:0 "戒严令： \n民用工厂转军用工厂花费: §G-30.0%§! \n "
STG_banbujingjijunshifaling:0 "颁布紧急军事法令"
STG_banbujingjijunshifaling_desc:0 "特别之时行特别之法，暂累吾民一年。"
STG_banbujingjijunshifaling_xiaoguo:0 "戒严令： \n有经验士兵损失: §G-30.0%§! \n适役人口: §G20.0%§! \n"
STG_lalonggejushili:0 "拉拢割据势力"
STG_lalonggejushili_desc:0 "地方割据势力尽管存在犯上作乱的情况，但如今局面下并不是追究相关问题的时候。只要愿意支持中央政府，我们就可以对于过往一切既往不咎！"
STG_gulixibeijun:0 "孤立西北军"
STG_gulixibeijun_desc:0 "我们将运用外交手段，坚决孤立西北军，切断其获取外部援助的一切可能，使其陷入孤立无援的境地。"
STG_zannanweiju:0 "暂渡危局"
STG_zannanweiju_desc:0 "经过顺天事变，天下局势骤变，各地叛乱频发，乱党逆臣相继揭竿而起，使得局势的混乱程度远超出我们的预想。然而，在各派势力的齐心合力之下，华北地区已经大致被朝廷掌控，时局终于得以勉强稳定，呈现出了一丝安宁的曙光。"
STG_shuntianjinjidahui:0 "顺天紧急大会"
STG_shuntianjinjidahui_desc:0 "随着顺天朝廷逐步回归正轨，是时候让曾经发起顺天事变的各派力量共聚一堂，围坐在谈判桌前，共同为这个新生政权的未来绘制蓝图、制定规划了。"
STG_quanlizaipinghen:0 "权利再平衡"
STG_quanlizaipinghen_desc:0 "诸公卿皆明理识大体，深谙国家之重要，愿以和为贵，各退一步，以共克时艰，共度朝廷之危局，朕心甚慰！"
STG_wubeijueqi:0 "武备崛起"
STG_wubeijueqi_desc:0 "大会的结果为武备系集团掌权，我们将把国家重新带上正规！"
STG_xujunlilun:0 "虚君理论"
STG_xujunlilun_desc:0 "在大明帝国中，虚君理论得到了一定的实践与体现。皇帝虽为国家元首，但实际政治权力掌握在内阁与议会等机构手中。这些机构负责处理国家事务、制定政策、监督官员等，确保国家政治稳定与发展。然而，随着历史的演进与社会的变迁，虚君理论也面临着新的挑战与调整。如何在维护皇明荣光的同时，实现政治权力的平衡与制约，仍是大明帝国需要不断探索与解决的问题。"
STG_xujunlilun_xiaoguo:0 "铁血王侯： \稳定度: §G5.0%§! \n每日政治点数: §G10.0%§! \n生产效率上限: §R-5.0%§!"
STG_tiaoxuanhezuozhe:0 "挑选宪政会合作者"
STG_tiaoxuanhezuozhe_desc:0 "挑选宪政会合作者，乃是顺天新政府在推进宪政改革过程中的关键步骤。在顺天事变后，旧有的动乱力量被扫出政坛，但国家尚且处于风雨飘摇之中。正因如此，我们更应该发挥咨议会和内阁应有之作用，来快速稳定大明政局。\n在这一过程中，与宪政会的剩余力量开展合作是不可避免的事情。只是在这之中仍需要审慎而明智，确保选择的合作伙伴既具备足够的政治智慧与才能，又能够忠诚于皇明与国家的利益。"
STG_wubeiduda:0 "武备独大"
STG_wubeiduda_desc:0 "在新生的咨议院席位和政府构成中，要实现武备系独大的局面，无疑是一项既具挑战又充满策略性的任务。咨议会作为顺天政府的重要决策机构，其席位分配直接关系到各方势力的政治影响力。因此，要在咨议会中确保武备系的绝对优势，需要精心策划和实施一系列策略。"
#STG_wubeiduda_xiaoguo:0 "统制之道： \n稳定度: §R-5.0%§! \n建造速度: §G5.0%§!"
STG_chongqizizhengyuan:0 "重启咨议院"
STG_chongqizizhengyuan_desc:0 "历经了漫长而细致的前期准备工作，如今，重启咨议院的时机已经成熟。我们必须把握这一关键节点，迅速行动，通过武备系擅长的议会政治策略来争取更多的权力，以制衡政府中日益膨胀的勋贵团体和那位野心勃勃的陛下。"
STG_queliyihuizhengzhi:0 "确立议会政治"
STG_queliyihuizhengzhi_desc:0 "在过往的岁月里，咨议会的权力一直处于相对较小的状态，这无疑与武备系的期望和利益相悖。咨议会作为国家的重要政治机构，其权力的大小直接关系到各方势力的政治地位和影响力。在当前的政治格局下，咨议会的权力偏小，不仅无法充分发挥其应有的作用，更在一定程度上削弱了武备系在国家政治生活中的影响力和话语权。\n如今，随着我们武备系成功控制了新生政府的整体局面，是时候对权力结构进行调整，以更加符合我们的利益和需求。为此，我们必须赋予咨议院更大的权限，让其在国家政治生活中发挥更加重要的作用。这不仅是对咨议院地位的提升，更是对武备系权力的有力保障。"
STG_xunguijinjitequan:0 "勋贵经济特权"
STG_xunguijinjitequan_desc:0 "在政治舞台上对勋贵势力进行压制的同时，我们也需在经济领域为他们提供适当的补偿，以平衡政治举措可能带来的冲击。通过赋予这些勋贵将领一定的经济特权，我们不仅能够有效地拉拢那些野心较小的势力，还能够减少改革进程中的阻力，确保我们的政治目标能够平稳实现。"
STG_xunguijinjitequan_xiaoguo:0 "统制之道： \n生活消费品工厂系数: §R10.0%§! \n建造速度: §G10.0%§! \n工厂产出: §G10.0%§!"
STG_tibayixinhui:0 "提拔一心会"
STG_tibayixinhui_desc:0 "作为武备系军官依托军校所秘密形成的军中结社，一心会在我们发动顺天事变的过程中起到了重要的作用。在新生的顺天政府中，其同样是武备系控制军队的重要手段。尽管一心会中不乏一些激进分子，但如果我们想要甩开勋贵控制军队，那么提拔一心会成员就是我们唯一的选择。"
STG_tibayixinhui_xiaoguo:0 "忠勇可嘉：  \n增援率: §G6.0%§! \n陆军师速度: §G10.0%§! \n"
STG_xinjiuhezuo:0 "新旧合作"
STG_xinjiuhezuo_desc:0 "旧勋贵将领中不乏识时务者，也并不是所有将领都对于政治报以热情。在提拔一心会的同时，我们同样应该吸纳和重用部分老将，以实现军队中的新旧合作。"
STG_xinjiuhezuo_xiaoguo:0 "忠勇可嘉：  \n生活消费品工厂系数: §R5.0%§! \n生产效率增长: §G15.0%§! \n"
STG_mingshenganjiang:0 "明升暗降"
STG_mingshenganjiang_desc:0 "在处理不配合政策的军政人物时，武备系作为文明势力，应避免过激行动。一种更佳的处理方式是给予他们尊重与荣誉，使其退出具体事务，这既体现了我们的包容与智慧，也能减少阻力，为新一代领导人创造稳定环境。这种策略有助于树立武备系良好形象，增强国家凝聚力。"
STG_mingshenganjiang_xiaoguo:0 "统制之道：  \n生活消费品工厂系数: §G-5.0%§! \n"
STG_xinshumiyuan:0 "新枢密院"
STG_xinshumiyuan_desc:0 "枢密院，作为掌控国家军事大权的至高殿堂，历经数百年风雨，内部权力结构早已盘根错节。在经历了一系列军政结构调整之后，如今正是对其进行深刻变革的契机。是时候打破固有的权力格局，重塑这个帝国军事的核心。我们将以更加清晰、高效的军事指挥体系为目标，优化权力配置，确保决策迅速而精准。"
STG_xinshumiyuan_xiaoguo:0 "忠勇可嘉：  \n§Y军用工厂§!建造速度: §G20.0%§! \n"
STG_tibajingjiguanliao:0 "提拔经济官僚"
STG_tibajingjiguanliao_desc:0 "经济官僚在武备系中占据重要地位，他们是帝国经济的坚强支柱，为国家的工业化和克服经济困境做出了巨大贡献。然而，在过去权力制衡的框架下，他们往往未能获得应有的提拔和认可，内阁中的要职大多被行政与事务官僚所占据。这种局面不仅限制了经济官僚的发挥，也阻碍了国家经济的进一步发展。\n如今，随着新政的开启，我们有必要纠正这一历史性的错误。经济官僚的提拔和重用应成为新政的重要议题。他们丰富的经济知识、敏锐的市场洞察力和卓越的领导才能，将为国家的经济发展注入新的活力。"
STG_tibajingjiguanliao_xiaoguo:0 "统制之道：  \n§Y民用工厂§!建造速度: §G10.0%§! \n"
STG_difangzhengqiguanxi:0 "地方政企关系"
STG_difangzhengqiguanxi_desc:0 "地方政府与国企之间的关系一直是国家经济发展的核心议题。两者之间的紧密合作与协调对于推动地区经济繁荣、实现国家战略目标具有举足轻重的地位。我们应当积极推进地方政企合作，促进经济发展。"
STG_difangzhengqiguanxi_xiaoguo:0 "统制之道：  \n§Y基础设施§!建造速度: §G10.0%§! \n§Y铁路§!建造速度: §G10.0%§! \n"
STG_guoqilongduantexufa:0 "国企特许垄断法"
STG_guoqilongduantexufa_desc:0 "国企特许垄断法是一项重要的法律制度，旨在规范国有企业在特定领域的垄断行为，确保市场经济的公平竞争和健康发展。该法律明确了国有企业在某些关键行业和领域的特许经营地位，有助于我们更好地控制国内经济。"
STG_guoqilongduantexufa_xiaoguo:0 "统制之道：  \n科研速度: §R-5.0%§! \n工厂产出: §G10.0%§! \n"
STG_shenhuadiaorenjizhi:0 "深化政商官员调任机制"
STG_shenhuadiaorenjizhi_desc:0 "深化政商官员调任机制是提升国家治理效能和推动经济社会发展的重要举措。通过优化政商官员的调任流程和管理制度，可以更好地实现人才资源的合理配置和高效利用。同时也有助于我们武备系可以将企业领域积累的人才，以更快捷地方式调入政府内部进行活动。"
STG_shenhuadiaorenjizhi_xiaoguo:0 "统制之道：  \n政治顾问花费: §G-15.0%§! \n征兵法令花费: §G-15.0%§! \n经济法案花费: §G-15.0%§!  \n贸易法案花费: §G-15.0%§!"
STG_banbuxinxianfa:0 "颁布新宪法"
STG_banbuxinxianfa_desc:0 "宪法是国家根本大法。在过去的时代，我们始终未能实现王在法下真正宪政化改革。如今，我们是时候颁布一部可以规范皇帝权力的法律，迈出宪政化的关键一步！"
STG_minzhishehui:0 "“民治社会”"
STG_minzhishehui_desc:0 "民治社会，作为一种理想的社会治理模式，强调民众不仅是社会的主体，更是治理的核心参与者。尽管在短期内，由于各种复杂的社会、文化和历史原因，我们可能无法让每一个民众都直接参与政治决策，但这并不妨碍我们依托民治理论，为自己的政权统治赋予坚实的合法性。"
STG_minzhishehui_xiaoguo:0 "统制之道：  \n每日获得的政治点数: §G10.0%§! \n"
STG_qianghuazhongyangjiquan:0 "强化中央集权"
STG_qianghuazhongyangjiquan_desc:0 "中央集权，乃国家之根本，社稷之柱石。自古以来，中国之政治体制，均以中央集权为核心。然而，时移世易，今日之中国，面临内忧外患，中央集权之弱化已显而易见。地方势力割据，各自为政，国家之政策难以贯彻始终，国家之资源难以统一调配，国家之统一与稳定岌岌可危。故强化中央集权，已成为当务之急。首要之务，在于加强中央政府之权威与职能。中央政府当握有决策之权，统筹国家之资源，推动各项事业发展。\n——《顺天日报》"
STG_neigejiguanhua:0 "内阁最高权力机关化"
STG_neigejiguanhua_desc:0 "在当前政治架构中，内阁作为政府的执行核心，其地位与职责至关重要。然而，时局变迁与社会进步要求我们对内阁的角色与定位进行重新审视。为此，我们提出“内阁最高权力机关化”的理念，旨在将内阁塑造为国家的最高决策与权力机关，从而确保国家治理的高效与稳健。"
STG_xuanchuanminde:0 "宣传民德"
STG_xuanchuanminde_desc:0 "弘扬民德，旨在传承与发扬民间优秀的道德传统，如尊老爱幼、诚实守信、勤劳节俭等。这些美德不仅是中华民族的精神财富，更是现代社会文明的基石。通过广泛宣传，我们能够激发人们内心深处的道德情感，引导其积极向上、崇德向善。只有在广泛宣传民德的基础上，才有可能真正推动社会进步。"
STG_xuanchuanminde_xiaoguo:0 "统制之道：  \n党派支持度对稳定度修正: §G20.0%§! \n"
STG_gaigexianbingjigou:0 "改革宪兵机构"
STG_gaigexianbingjigou_desc:0 "在当前复杂多变的安全环境中，宪兵机构作为国家安全的重要力量，其重要性日益凸显。为更好地应对各类安全挑战，我们亟需对宪兵机构进行全面而深入的改革。这包括更新装备、提升技术水平，以及加强人员的专业培训和素质提升。通过引入先进的科技手段和管理理念，我们能够大幅提升宪兵机构的作战能力和应对复杂局面的水平。"
STG_gaigexianbingjigou_xiaoguo:0 "忠勇可嘉：  \n抵抗下降速度: §G10.0%§! \n"
STG_jiaqiangaiguojiaoyu:0 "加强爱国教育"
STG_jiaqiangaiguojiaoyu_desc:0 "本朝太祖自太祖以来，注重培养子民之爱国情感，以维系万民之团结与国家之昌盛。然时移世易，今日之天下实乃大争之世，爱国教育之重要性愈发凸显。故当朝之士，当以强化爱国教育为己任，砥砺民族气节，弘扬中夏精神。"
STG_jiaqiangaiguojiaoyu_xiaoguo:0 "忠勇可嘉：  \n抵抗下降速度: §G10.0%§! \n主动性: §G5.0%§! \n"
STG_gaishanminsheng:0 "改善民生"
STG_gaishanminsheng_desc:0 "民为邦本，本固邦宁。尽管大同乱党和那群宪政知识分子将之鼓吹为民众为国家之主，但在我们看来，民生问题才是民本的实质。为此，新政府将出台一系列政策，来改善亿兆中夏子民的生活情况，真正实现以民为本。"
STG_chutaifanbagongfa:0 "出台反罢工法"
STG_chutaifanbagongfa_desc:0 "要想改善民生，首先需要不断扩大生产规模，这就使得我们必须限制那些“欲壑难平”的乱党们的罢工行为。出台反罢工法案，可以震慑宵小，让广大劳动者真正实现为国生产，为民劳作。"
STG_weihujingjizhixu:0 "维护经济秩序"
STG_weihujingjizhixu_desc:0 "经济秩序，作为社会发展的重要基石，其稳固与否直接关系到国家的繁荣与稳定。在当前世界经济错综复杂、市场竞争日益激烈的背景下，维护天朝体系下的经济秩序显得尤为重要。"
STG_junxianzhiguo:0 "君宪治国"
STG_junxianzhiguo_desc:0 "君宪治国，作为一种政治理念，旨在将君主制与宪政原则相结合，以实现国家的稳定与发展。在君宪治国的框架下，君主作为国家元首，承载着国家的象征与统一。然而，君主的权力并非无限，而是受到宪法和法律的明确限制。"
STG_shengxinduduan:0 "圣心独断"
STG_shengxinduduan_desc:0 "利用武备系和勋贵团体的间隙，锦王及其心腹成为了顺天大会的最终胜利者！"
STG_mihepaiximaodun:0 "弥合派系矛盾"
STG_mihepaiximaodun_desc:0 "吵吵闹闹的朝廷可不是陛下想要的，必须要让两派里一些贪得无厌的人闭嘴，免得他们再生事端，徒增矛盾。"
STG_fenhuawubeixi:0 "分化武备系"
STG_fenhuawubeixi_desc:0 "显然，陛下手下的“贤良”并不是那么团结，运用陛下的权威，平衡各派系时也将武备系里的忠诚之士转化为陛下的亲信，而非武备系的骨干。"
#STG_fenhuawubeixi_xiaoguo:0 "乾纲独断：  \n稳定度: §G5.0%§! \n每日获得的政治点数: §G10.0%§! \n"
STG_lianluoxianzhenghui:0 "联络残余宪政会人士"
STG_lianluoxianzhenghui_desc:0 "为显皇威浩荡，施予君恩，宪政会中终于朝廷，愿意为陛下发声的议员将得到优待，这也将是我朝德政的典范。"
STG_renmingjingjiguanliao:0 "任命经济官僚"
STG_renmingjingjiguanliao_desc:0 "当下经济形势混乱，陛下将钦点几位可靠的专业人士整顿经济，为我们的战争机器打好基础。"
STG_renmingjingjiguanliao_xiaoguo:0 "乾纲独断：  \n生活消费品工厂系数: §G-10.0%§! \n生产效率增长: §G5.0%§! \n"
STG_chuliyijianzhe:0 "处理异见者"
STG_chuliyijianzhe_desc:0 "处理逆党，乃维护皇明荣光之必要手段。然而，处理之道，亦需审慎与智慧。皇明以仁德治天下，对于逆贼，当以明正典刑，但亦需秉持公正与审慎。"
STG_chuliyijianzhe_xiaoguo:0 "乾纲独断：  \n每日获得的政治点数: §G5.0%§! \n适役人口: §R-10.0%§! \n"
STG_tiaozhengzhengfujigou:0 "调整政府机构"
STG_tiaozhengzhengfujigou_desc:0 "当朝陛下文武双全，雄心勃勃，他急切的想要开启自己的王道征途。因此，精力旺盛的陛下准备亲自下场，指导朝廷的工作，行太祖故事。"
STG_quebaoxunguiliyi:0 "确保勋贵特殊利益"
STG_quebaoxunguiliyi_desc:0 "勋贵中鱼龙混杂，既有能臣也有混吃等死的蠢货。不过，他们对朝廷的忠诚是毋庸置疑的，陛下也决定给予一些恩惠笼络他们。"
#STG_quebaoxunguiliyi_xiaoguo:0 "绝对支持：  \n稳定度: §G5.0%§! \n陆军师组织度: §G3.0%§! \n"
STG_tibayixin:0 "提拔一心会"
STG_tibayixin_desc:0 "这帮朝气蓬勃的新型军官深受陛下的青睐，陛下决定进一步激发他们的狂热情绪，为大明帝国的军队带来新的生命力。"
STG_tibayixin_xiaoguo:0 "绝对支持：  \n补给消耗: §R5.0%§! \n陆军师攻击: §G10.0%§! \n"
STG_peiyangtianzidixi:0 "培养天子嫡系"
STG_peiyangtianzidixi_desc:0 "天子门生，无上光荣！"
STG_zujianxinzijinxi:0 "组建新紫禁系"
STG_zujianxinzijinxi_desc:0 "昔日，几任先帝都以紫禁系为臂膀掌控整个帝国，然而，昌德皇帝却遭到了紫禁系中一些贼人的背叛。为吸取教训，陛下决定亲自甄别，组建自己的紫禁系。"
STG_gaizuzizhengyuan:0 "改组咨议院"
STG_gaizuzizhengyuan_desc:0 "咨议院将被改组为陛下的顾问机构，他们只能围绕陛下的意志思考，而非在国家大事上指手画脚。"
STG_gaizuzizhengyuan_xiaoguo:0 "绝对支持：  \n每日获得的政治点数: §G10.0%§! \n最大指挥点数提高: §G20§! \n"
STG_baituopaixizhigu:0 "摆脱派系桎梏"
STG_baituopaixizhigu_desc:0 "现在，陛下对于清郎忠诚的朝廷感到前所未有的满意，听话的臣子和政府机构才是天子的门廷该有的样子"
STG_jichengtongzhijingji:0 "继承统制经济思想"
STG_jichengtongzhijingji_desc:0 "统制经济学派的思想与陛下的某些设想不谋而合，只需要加以改进，以陛下的口吻执行，就可以推广全国，共享繁荣。"
STG_jichengtongzhijingji_xiaoguo:0 "乾纲独断：  \n§Y民用工厂§!建造速度: §G10.0%§! \n补给中心建造速度: §R20.0%§! \n""
STG_chenglijingweihui:0 "成立经委会"
STG_chenglijingweihui_desc:0 "经委会将是服务于统制经济推广的机构，将经济命脉紧握在朝廷手中，达到“宫有制”的境界。"
STG_chenglijingweihui_xiaoguo:0 "乾纲独断：  \n生活消费品工厂系数: §G-5.0%§! \n"
STG_qianghuagongshanghezuo:0 "强化工商合作"
STG_qianghuagongshanghezuo_desc:0 "工商界的名流将会组织起来协同合作，为天朝创造更多财富。"
STG_shelijingjizhuanyuan:0 "设立经济专员"
STG_shelijingjizhuanyuan_desc:0 "经济统制监察权，便宜行事，犹如君王亲临——朱镕坤"
STG_shelijingjizhuanyuan_xiaoguo:0 "乾纲独断：  \n战略资源获取效率: §G10.0%§! \n"
STG_luoshigongzuozhi:0 "确保五时辰工作制落实"
STG_luoshigongzuozhi_desc:0 "为了平息该死的罢工，朝廷决定做出一些让步，给这些工人一点甜头，既有利于稳定，也能增强这帮家伙的积极性，为朝廷赚得美名。"
STG_luoshigongzuozhi_xiaoguo:0 "乾纲独断：  \n工厂产出: §R-5.0%§! \n生产效率增长: §G10.0%§! \n生产效率上限: §G10.0%§! \n"
STG_huangmingyuxianfa:0 "皇命和宪法"
STG_huangmingyuxianfa_desc:0 "宪法往往是法制现代化的重要标志，甚至在天朝圈子里许多统制国都视其为国之根本。然而，在大明，宪法只能是用来宣扬天子的权威和陛下无可置疑的天命。宪法将成为我们维护天命的重要工具。"
STG_huangmingyuxianfa_xiaoguo:0 "绝对支持：  \n每日获得的政治点数: §G5.0%§! \n组织度: §G3.0%§! \n"
STG_fensuiminzhuxianzhi:0 "粉碎“民主”限制"
STG_fensuiminzhuxianzhi_desc:0 "早在亲王时期，陛下就十分厌恶宪政会那些叽叽喳喳乱叫的议员，他们的低效给帝国带来了巨大的政治灾难，因此，移除“民主”的限制势在必行，不能被那些繁文缛节束缚了天子的手脚。"
STG_fensuiminzhuxianzhi_xiaoguo:0 "绝对支持：  \n战争对稳定度惩罚修正: §G-30.0%§! \n"
STG_xiandaijunzhuzhi:0 "现代君主制"
STG_xiandaijunzhuzhi_desc:0 "当朝天子所提出的全新执政纲领已得以践行，更加强化君主制和天命的权威，现代化的君主制将激励每一个忠于国家，忠于天子的勇士！"
STG_xiandaijunzhuzhi_xiaoguo:0 "绝对支持：  \n陆军师核心领土攻击: §G5.0%§! \n陆军师核心领土防御: §G5.0%§! \n动员速度: §G40.0%§! \n"
STG_fulizhengce:0 "福利政策"
STG_fulizhengce_desc:0 "为了得到民众更广泛的认可，朝廷以陛下的名义通过了一些保障百姓基本生活的福利法案。不仅是陛下乐施仁政的体现，也可以告诉世人不是只有那些宪政会的议员才配提“心系人民”，凸显陛下的治国雄才。"
STG_fulizhengce_xiaoguo:0 "仁德施政：  \n生活消费品工厂系数: §G-5.0%§! \n党派支持度对稳定度修正: §G5.0%§! \n"
STG_minxinsuoxiang:0 "民心所向"
STG_minxinsuoxiang_desc:0 "我是陛下的狗！———京城某黄发口技从业者"
STG_minxinsuoxiang_xiaoguo:0 "仁德施政：  \n党派支持度对稳定度修正: §G5.0%§! \n"
STG_shoumingyutianjishouyongchang:0 "受命于天，既寿永昌"
STG_shoumingyutianjishouyongchang_desc:0 "大明，天下无敌啊！"
STG_xunguizhangquan:0 "勋贵掌权"
STG_xunguizhangquan_desc:0 "大会的结果为勋贵集团掌权，我们将以铁与血重新整合这个国家！"
STG_lianluocanyushili:0 "联络宪政会的残余势力"
STG_lianluocanyushili_desc:0 "尽管这些宪政老爷成事不足败事有余，但用来装点门面，改善我朝形象还是有点用的。收拢其中愿意服从我们的残余分子为我们所用"
STG_zhengzhihuaping:0 "政治花瓶"
STG_zhengzhihuaping_desc:0 "军国大事只需要朝廷的精英去办就是了，咨议会和政府只需为我朝柱石提供支持就行了。"
STG_jiakongzizhengyuan:0 "架空咨议院"
STG_jiakongzizhengyuan_desc:0 "尽管我们并不想和那些宪政分子分享多少权力，但咨议院作为先帝们的政治遗产，不可轻言废弃，而是要正确知道，加以运用。"
STG_yuwubeixixietiao:0 "与武备系的权力协调"
STG_yuwubeixixietiao_desc:0 "武备系中也有不少忠贞贤臣，对于其中的积极分子，应当给予奖励，兑现我们当初的承诺。"
STG_yuwubeixixietiao_xiaoguo:0 ""军政团结：  \n稳定度: §G10.0%§! \n每日获得的政治点数: §G5.0%§! \n经济法案花费: §G-20.0%§! \n"
STG_hezuogongrong:0 "合作共荣"
STG_hezuogongrong_desc:0 "现在，两大人马各司其职，团结和谐，共同为重整朝纲，维系天命贡献自己的力量。"
STG_hezuogongrong_xiaoguo:0 "军政团结：  \n稳定度: §G10.0%§! \n每日获得的政治点数: §G5.0%§! \n经济法案花费: §G-10.0%§! \n"
STG_fuquanshumiyuan:0 "赋权枢密院"
STG_fuquanshumiyuan_desc:0 "结合以往的经验和故纸堆里的“诤言”，一个新的协调全局，统一调度的枢密院将会成立。"
STG_fuquanshumiyuan_xiaoguo:0 "武人秉政：  \n最大指挥点数提高: §G25§! \n陆军经验增长: §G5.0%§! \n"
STG_junwenzhuanhua:0 "军官、文官转化"
STG_junwenzhuanhua_desc:0 "朝廷经历了如此大的人事变动后，帝国的文官系统陷入了人员短缺的窘境。身为朝廷精英，自当要做到上马为将，下马治政，为君父分忧。"
STG_junwenzhuanhua_xiaoguo:0 "武人秉政：  \n指挥官花费: §G-20.0%§! \n动员速度: §G10.0%§! \n"
STG_wurenneige:0 "武人内阁"
STG_wurenneige_desc:0 "武夫当国，国祚永延！"
