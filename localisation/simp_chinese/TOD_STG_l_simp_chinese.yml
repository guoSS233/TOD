STG_liberal_democracy_party:0 "咨议院（政学系）"
STG_consociationalism_party:0 "咨议院（清政系）"
STG_social_democrat_party:0 "大同会华北局"
STG_agroindustrial_socialism_party:0 "华北总农会"
STG_moderate_socialism_party:0 "大同会华北局"
