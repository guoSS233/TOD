TOD_STG.79.t:0 "书房中的思考（1）"
TOD_STG.79.d:0 "蓬莱侯府书房，吴佩孚身着一件半新不旧的长衫，坐在书桌后读着《孟子》，读到“世衰道微，邪说暴行有作，臣弑其君者有之，子弑其父者有之。孔子惧，作《春秋》。《春秋》，天子之事也。是故孔子曰：‘知我者其惟《春秋》乎！罪我者其惟《春秋》乎！’”时，不禁掩卷长叹。\n他不是只会打仗的武夫，他也读过书聆听过圣人之言，可是他更喜欢的一句话是“了却君王天下事,赢得生前身后名”。他少年时，正值明俄开战，学院的夫子们便时常在课业之余给他们讲些时事开拓眼界。他极爱听这一节，边听边想，当初宋金之战、宋元之战，金元不过一蛮夷异族，尚且致使神州陆沉，那罗刹呢？若是有一天罗刹有一雄主，举兵数十万进攻大明，该如何是好？宋朝的读书人，书读的极好，文章做的极好，可是金兵南下，徽钦北狩赵构南渡，中原父老南望王师终究魂蚀骨销。再后来蒙元崛起，最终，连半壁江山都保不得了，那些所谓法统如何、道统如何、这一章句该当何解的先贤之论，也大都随着崖山之劫……"
TOD_STG.79.a:0 "没入了历史的尘埃。"
TOD_STG.80.t:0 "书房中的思考（2）"
TOD_STG.80.d:0 "吴佩孚不知道如果没有太祖高皇帝，神州丧于外敌数百年之久会如何？自己还会有圣贤书可读吗？汉人可还能记得自己的祖先吗？怕是连这发髻和衣冠都保不住了，汉儿尽作胡儿语，却向城头骂汉人！他想了很久该当如何，最终决定投笔从戎。他要用自己的剑守卫大明的领土！\n他从基层干起，九死一生挣得蓬莱侯的爵位。时至今日，英俄这些大明曾经的大敌早已却悲哀地发现，当战争来临时，他可以替大明遮挡风雨，当战争结束后，他就是大明的风雨。废帝如此想、那些只会聒噪的文人这么想、如今，就连锦王和武备系也这么想了。\n可是他没有退路，也不能退，如今大明板荡，如果不能尽快消灭逆党，后果不堪设想，天知道广府的大同会会和他们臭味相投的异国“同志”达成什么损害天朝的协议？至于南京的太孙和他身边的管学系，他们如果价格合适，大概可以把天朝的国之重器尽数卖与洋人。他没有时间去协调和勾兑了，他必须得立刻建立一个高效的体制，然后消灭逆党，让大明请重新恢复他的无上荣光！\n想到这，他终于下定了决心，既然武备系谈不拢，那就先不谈了，他用手拿起电话，拨号给了自己的政务秘书，"
TOD_STG.80.a:0 "“枢密院的细则你们敲定好了吗？”"
TOD_STG.81.t:0 "校内闲谈（1）"
TOD_STG.81.d:0 "顺天的某所恢复宁静的学校里，下了课的学生们结伴往食堂走着，一个戴着围巾的男生神秘地给旁边的女生讲着故事，“……吕雉死前告诫吕产吕禄不要为自己送葬，不要去皇陵！可是吕禄吕产毕竟年轻没有听从。后来周勃、陈平等私下密谋策划，设计让上将军吕禄交出了兵权。周勃、陈平通过典掌皇帝符节的襄平侯纪通获得兵符，诈称皇帝敕命太尉统领北军。周勃进入北军军中，号令“拥戴吕氏的袒露右肩，拥戴刘氏的袒露左肩！”。大家纷纷袒露左肩，呼声震天。周勃顺利地将北军控制。接着，陈平再让周勃协助刘章控制南军，并严守军门。下令平阳侯曹窋转告禁军卫尉不准吕产进入殿门，周勃命令朱虚侯刘章率兵千人以进宫护卫皇帝为名，伺机捕杀了统率南军的吕产。”\n女生一直低头听着，脸上渐渐浮起一丝笑意，待男生讲完一节，仰起脸笑问道，“学长，你说的周勃是哪里人啊。”\n男生闻言有些发愣，摸了摸下巴，“啊？周勃当然是沛县人啊。”\n“哦？是吗？不是山东人？”\n“嗨，我说你问这个干嘛，不许恶意联想啊。”\n“哪里恶意联想了，我这是地理学的不好找师兄你请教嘛。”女生狡黠一笑，“话说安刘氏者必勃也，周勃真是大汉的国之柱石啊，帮助刘邦夺取天下讨平诸国……”"
TOD_STG.81.a:0 "后来又平定诛吕扶保大汉社稷。"
TOD_STG.82.t:0 "校内闲谈（2）"
TOD_STG.82.d:0 "“那的确是扶保，惠帝愣是有好几个假儿子，没有周勃陈平，大汉可如何是好？”男生此时一副一本正经的样子，仿佛他真的相信一般，说完之后他又故意做出仿佛意识到了什么的样子，“你最好真的在说大汉。”\n女生被逗的咯咯笑了起来，笑够了之后开口问道，“可是学长你说，当初在刘邦面前诋毁陈平最起劲的就是周勃，说人家是小人，还造谣人家盗嫂，你说这孟光几时接了梁鸿案啊？”\n“学妹啊，你忘了“天下熙熙，皆为利来；天下攘攘，皆为利往”，周勃做寿，陈平送了五百金祝寿，两个人亲亲热热喝了一顿酒，从此就是合作共荣的好战友了嘛，你看，周勃被文帝刁难，不还是陈平打的圆场。”\n“真的是圆场吗？”\n“以今度之，想当然耳。至少报纸上的信息，双方还没有什么矛盾而且合作的不错吧。”男生整理了一下自己的围巾接着说到，“你看新发布的内阁名单，别的都是虚的，权力的分配可是实实在在的。”\n“也对，我看那几个职位实权也不小，双方看来谈的不错。”女生若有所思的点了点头，“况且总不能再上演一次……那也太……”"
TOD_STG.82.a:0 "“是啊，我们一向以和为贵”"
TOD_STG.83.t:0 "御前议政"
TOD_STG.83.d:0 "春意初绽，御前议政会议在太和殿召开。百官列席，气氛庄重。定武帝朱镕坤踞坐龙椅，目光如电，扫视群臣。勋贵元老吴佩孚位列首席，身姿挺拔，气度沉稳。\n会议过半，吴佩孚出列，拱手道：“陛下，臣奉旨梳理朝堂人事，经数月考察甄别，已拟妥一批官员任免名单。”他徐徐展开奏折，朗声读道：“原直隶巡抚白坚武，政绩斐然，拟升任内阁大学士；山海关指挥使董政国，治军严明，拟调任京师卫戍司令……”\n定武帝微微颔首，待吴佩孚读罢，淡然道：“吴卿操劳多时，辛苦。不过，朕近来也留意到几位卿家表现不俗。”他稍作停顿，目光掠过吏政部尚书吴景濂。\n吴佩孚心下一凛，面上却不动声色：“陛下察纳四方，臣等惭愧。不知陛下心中有何人选？”他微微前倾，似是倾听。\n定武帝轻咳一声，慢悠悠道：“吴景濂在吏政部多年，经他手的官员任免，少有差错。朕想将他调任内阁大学士，以彰其功。”\n吴佩孚暗思吴景濂向来行事稳健，若入内阁，于他掌控人事并无妨碍。便拱手道：“陛下圣明，吴尚书干练稳健，调任内阁实至名归。臣即刻依旨办理。”\n定武帝微微一笑，又道：“财政部尚书张国淦，操持钱粮，算无遗策，朕欲令其接任吏政部尚书。”此言一出，吴佩孚眉头微蹙。张国淦理财虽精，却与吴佩孚在赋税政策上多有分歧，若是调任吏政部的话……\n他稍作沉吟，笑道：“陛下圣明，张尚书理财确有一手。只是吏政部尚书一职，需统筹全国吏政事务，张尚书毕竟未在吏政部工作过……陛下如欲要拔擢信任吏政部尚书，可从吏部的几位侍郎里挑选”说罢，从袖中取出另一份资料。\n定武帝接过资料，浏览片刻，抬眼道：“张卿能力出众，又得朕信任。吴卿不妨再仔细斟酌。”\n吴佩孚心知此刻不宜强推己意，便顺势附和：“陛下所言极是。臣即刻安排张尚书熟悉吏政部事务，待交接完毕，即可上任。”待议程过半，定武帝轻咳一声，道：“今日所议人事，甚为重要。吴卿，卿等所拟名单，还需再打磨几日。待朕与诸位爱卿仔细商讨后，再行定夺。”吴佩孚闻之，拱手应道："
TOD_STG.83.a:0 "“臣谨遵圣旨，力求尽善尽美。”"
TOD_STG.84.t:0 "《大明政治调研报告》（1）"
TOD_STG.84.d:0 "法兰西某所大学，学生们三三两两地坐在教室中，聚精会神的听着课，时不时的记着笔记，希望自己的努力可以让自己按时毕业。\n“我们所述之‘共和’来自于希腊语“Πολιτεία”。”教授说着在黑板上写下了这个词，“被西塞罗翻译为拉丁语词汇‘res publica’意思是‘公共事务’或者说‘人民事务’，意味着一个政治权力通过其代表由公众（人民）掌权的国家。”\n“当然，在历史中，共和制的情形有许多种，我们将在今后的章节中为大家详细介绍，此外，近年来，随着我们与明国某些学者的交流增多，我们了解到了他们对于共和，他们也叫他‘天下为公’的理解，这一部分，以及他们最近的实践，我们将作为本课程的补充内容为大家介绍。当然，大家如果感兴趣的话，课程论文也可以选择这个主题。”\n“斯迪克多先生，请问你有什么疑问吗？”教授看到了坐在第三排的一个男生举起了手。\n“教授，我刚刚听到了您在解释“Πολιτεία”和“δημοκρατία”的区别，我在明国交流的时候听到他们对共和，我是说‘共和’这个词所对应的中文的另一种解释，在中国的周王朝时期，国人赶走了他们的国王，随即由两位贵族联合执政，请问这是否可以称为一种共和制。”\n“很好的问题，斯迪克多先生，关于这个问题我不打算直接给各位答案，希望各位讨论一下，以加深我们对于这一课的理解。”"
TOD_STG.84.a:0 "东方的共和？"
TOD_STG.85.t:0 "《大明政治调研报告》（2）"
TOD_STG.85.d:0 "“很好，我们结束了本课程的全部学习，很神奇，我们所学习的概念与知识贯穿了数千年，并且不断变化，他不是单一的不断前进，但尼罗河也不会倒流，他就像波浪一样，是不断起伏前进的。”教授翻过了最后一篇讲义，“当然，先生们女士们，不要着急离开教室，我们毕竟不活在柏拉图或者西塞罗的时代，我们再来讲一些和这个时代有关的案例。”\n“明国最近的巨变相信各位同学们已经有所了解，那么同学们认为现在的顺天政府是一个怎样的政体呢？”教授停顿了一下，将讨论留给了在座的学生。\n学生的讨论十分激烈，有人认为是君主制，也有人认为是二元君主制，在认为是邦联制的学生被不懂幽默的同学们奇怪的盯着最终尴尬闭嘴之外，大家对讨论有了一个基本共识。\n“大家都同意这个结论吗？”\n“我不同意大家的观点，事实上我认为顺天政府的制度应该是共和制，”一个金发的男孩有些犹豫的打断了他们，在同学们的低语中他继续说道，“我问过斯迪克多，他说明国的政局并不完全由他表面上的官员和统治者掌控，在政变后，真正掌握政权的是一些所谓的“元老”们 ，皇帝的产生也是由元老们通过某种方式推选的，同时他们也有“咨议会”。我认为明国更接近于威尼斯共和国。”\n“很有意思的观点”教授的眼中流露出了赞许的目光，“我今天最后举的这个例子是希望大家在今后的学习和研究中能够记住，我们虽然是某一专业的学生，但是去认知世界只靠着一个学科的知识是远远不够的，我们要扩展自己的眼界，要更加全面的了解我们的所研究的国家，而不是拘泥于某一种形式，某一个名词并以此沾沾自喜……”\n“两个名字相同的事物可能相互对立，而……”"
TOD_STG.85.a:0 "“两个名字毫无关系的事物可能有着共同的内核。”"
TOD_STG.86.t:0 "精诚团结（1）"
TOD_STG.86.d:0 "太和殿的大朝会之上，看着一片和谐的臣子们，定武帝朱镕坤不易察觉的皱了皱眉，他虽然不像哥哥一样自小接受帝王教育，但也不至于天真到认为外敌当前，所以朝廷的衮衮诸公就会团结起来共赴国难。他们没有继续像顺天大会一样吵闹不休，那自然是有人已经替他们统一了思想。朱镕坤猜度着“为自己分忧”的臣子是谁，下意识的摩挲起袍袖边缘精致的绣文。\n虽然提出议案的人出身不同背景复杂，但是背后的忠臣是谁并不难猜，谁得利最多，那大概谁就是这些这些话的主人了。朱镕坤心中已经大致有了一个答案，高处不胜寒，他坐上这个位置，才明白了当初父皇的不易。\n在座的亲信自然也感受到了不对，向他投来了询问的眼神，定武帝微微摇摇了头，示意大家不必出头。杨永泰的眼神有些焦急，定武帝却不再看他，以免自己再受影响。定武帝强迫自己把精力转回了议案上，仔细的听着臣子们对于时局的构想。他决定先看看形势，可惜杨永泰却不是懂得韬光养晦之人，见议案无人反对，便自己站出来质疑。杨滔滔不绝巧舌如簧，将不少提议者驳的哑口无言……"
TOD_STG.86.a:0 "但毕竟双拳难敌四手，很快便落入下风。"
TOD_STG.87.t:0 "精诚团结（2）"
TOD_STG.87.d:0 "定武帝努力集中精力，却不可避免地想起了多年前，也是这样的一个冬天，自己微服出行，在某个小饭庄“偶遇”吃着火锅的吴佩孚和他的几个部下，自己不由分说地坐下加入其中，几轮酒就把原本绷着的众人喝的开始和自己勾肩搭背谈天说地。后来的很多年，他都有在隆冬请相熟军官吃涮锅的习惯，少则几人，多则十几人，并非只是为了笼络人心，更是他在这一方天地中难得的一份放松。可惜，如今再无人敢和他同锅而食了，以免惹“染指”之嫌。\n吴佩孚坐在离朱镕坤最近的几个位置上，看着新帝努力强作平静却越来越快地揉搓着袖边，暗暗一叹，虽然早有预料，但他之前仍旧心存君臣相得的幻想。奈何勋贵们也是被胜利冲昏了头脑，做得有些过了。当今天子更是个大权独揽的性子，怎么可能不作他想？这是提议还是示威？\n“既然诸卿意见纷杂，这几项事就三日后再议吧。”定武帝特意在纷杂上加了重音，随即结束了这场御前会议，暂时搁置了这几项提案。\n宫巷上，落后于众人几步的张寿镛用只有两人能听到声音轻问徐世昌，“你说蓬莱侯他们是何用意？”\n“想要陛下做圣主明君罢了。”\n“何谓圣主？”"
TOD_STG.87.a:0 "“聖者，声也，言闻声知情。”"
TOD_STG.88.t:0 "沂州府新制（1）"
TOD_STG.88.d:0 "沂州府的直属办事处，自大乱后一向冷清，今日却热闹非凡。仔细观察的话可以发现，来往的人群里不乏脸上略带胆怯和窘迫者，显然，他们并不常常来此“肃穆”之地。一个身着短褐的男子好不容易排到了小吏面前，勾着腰挤出一个笑脸，恭敬地将一张纸递给了小吏。小吏没有抬眼，接过纸张一看随即将纸还给男子，“第三项写的不对，重填吧，下一个。”男子听言有些着急，“大人，您上次没说这个不对啊，我这已经改了第三回了，我下午还要回县，您能不能告诉我到底怎么填，您能不能通融通融。”说着变戏法般从他并不宽大的袖子里变出了一个信封，压在申报书下再次推回小吏手底下。\n“快拿回去，你把我当什么人了！你这就是不合格，并非我故意为难与你，别再纠缠了，后面还那么多人等着办事呢。”\n男子悻悻收回了手，并不热的天气里竟是生生急出了一脑门的汗，他就是个卖布料的小老板，因为当过几年兵为人又热心所以被邻里推为了水龙队的队长，他哪里弄的明白这些东西。\n本来这东西官府也不深管，但上月兰陵县县令催粮太过，为了立威逼死了一个农妇，这在大明本也算不得什么大事，何况现在是非常时期。可事情坏就坏在农妇家成年的儿子有五个，娘家更是六七个兄弟，十几个内侄，抓着催粮人一顿好打，催粮官被抬回去当天就咽了气。知县也是个不省事的，闻之大怒，随即派人缉拿闹事者。可闹事者怎会束手就擒？恰逢县令把兵都派去抓人，乡里和村里一直对催粮不满的人趁机联系了城里的水龙队，趁夜点燃县衙，借救火之机攻了进去……"
TOD_STG.88.a:0 "把县令砍了。"
TOD_STG.89.t:0 "沂州府新制（2）"
TOD_STG.89.d:0 "此事自然是惊动了省府和中央，在平乱之后把知府批了个狗血喷头。要不是他在朝中有人，恐怕早就收拾铺盖走人了。痛定思痛之后，朝廷得出的结论有二：其一官府管的太宽了，都是管学系堕落的自由化思想的错；其二，县令们都是成事不足败事有余的废物，所以要求他们这些乡勇街约水龙队全都要到知府登记统一管理。\n男子想着事没注意撞到了一个戴眼镜的人身上，他正要道歉，却听到对方先开口了，“老兄需要帮忙吗？我看老兄急得满头是汗，这申报手续确实复杂，小弟可以代劳一二。”\n“先生润笔几何？”男子自然知道这代办们揽活不是免费的。\n“20龙元您看如何？您晚上滞留于此住店吃嚼都是花销，不如把这钱花在我这，您也好落得省心。”\n“行，那就烦请先生，先生尽快。”\n眼镜男子干活倒的确利索，不出一个时辰，手续办完，文件交割明白，男子道谢之后就回家了。到了中午，趁着休息时间，戴眼镜的男子转出办事处，回到不远处的家中。妻子见他回来，把早已准备好的饭菜端上来，自己也坐下挟了一筷子肉炒豆橛子放到碗里，“我哥哥今天托人跟我说，最近朝廷管的严，你要小心，不要和人家起冲突，最近也不要去他府上。”\n戴眼镜的男子点点头表示自己知道了。"
TOD_STG.89.a:0 "“管的严是好事。”"
TOD_STG.90.t:0 "内阁全武行（1）"
TOD_STG.90.d:0 "顺天的深秋，细雨如丝，却被寒风裹挟得凛冽刺骨。内阁值班室的年轻秘书们望着窗外那无休无止的雨幕，个个焦躁不安。他们时不时地瞥向会议室紧闭的大门，心中默默催促着议程尽快结束。终于，一个面白须净的年轻人按捺不住，起身找到负责会务的柳绵，央求她再去续茶。\n柳绵自然明白这些秘书们等得心焦，想让她去看看情况——毕竟谁不想早点回家呢？不过，伸手不打笑脸人，更何况是前途无量的年轻人。“等不及了就推我去出头，你们也不害臊？”她打趣道。那年轻人连忙陪笑：“不害臊，不害臊。您去是职责所在，我们要去的话……”尹涪扬头指指会议室，“要是被那些性急的部长们抓到偷听军机大事，可担当不起。”柳绵看了看座钟，时间倒也差不多了，于是点点头，带着组里其他人走向会议室。\n柳绵走到会议室门口，正打算轻轻叩门，突然一声闷响——会议室的门被砸开，一个烟灰缸径直飞出，落在她的脚边。好在大门挡了大半力道，她才没受伤。所有人的目光都被吸引了过来。众人尚未回神，内阁会议室中，一道矫健身影自长案后跃出，径直扑向对面。内阁成员们看得很清楚，那正是新任的军事参赞孙传芳，此刻他如同野兽般扑向施从滨，而施从滨便是先前投掷烟灰缸之人。\n“施从滨，你个老东西还敢拿烟灰缸砸我！”孙传芳一个健步冲到施从滨面前，揪住他的脖领子，挥拳便打，“你也就这点本事了！”\n话音未落，拳头便要落在施从滨的脑门上。好在施从滨也是行伍出身，略一偏头，躲开了这当头一击，只是眼角还是挨了一下。\n施从滨本就气得不轻，如今挨了孙传芳一拳，不禁气血上涌。他老夫聊发少年狂，伸手也揪住孙传芳的领子，想要还击。可他毕竟快七十岁了，哪里是孙传芳的对手，几下就被按在地上。"
TOD_STG.90.a:0 "这就是武人内阁？"
TOD_STG.90.b:0 "殿前武斗，大明传统罢了"
TOD_STG.91.t:0 "内阁全武行（2）"
TOD_STG.91.d:0 "这时，“刚刚”反应过来的众人也不敢再看热闹了。张其锽和董政国迅速上前架住孙传芳，而刘玉春则快步上前，将施从滨从地上扶起。孙传芳怒火未消，在挣扎中甚至带得张其锽一个趔趄，眼看便是要再度动手。\n“都别打了，大明内阁难道是土匪老巢吗？！”吴佩孚的怒喝如晴天霹雳，瞬间震慑了全场。他大步流星地走到孙传芳和施从滨中间，双手一分，将二人强行拉开。孙传芳还想挣扎，吴佩孚却似铁塔般挡住他，怒目而视：“孙传芳，你这是做什么！内阁是议政之地，不是你泄愤的擂台！”孙传芳被他这一喝，终于清醒了几分，但仍怒气冲冲，甩开张其锽的手，叉腰而立，大口喘着粗气。\n施从滨被同僚扶起，调整好衣衫，却也不甘示弱，指着孙传芳骂道：“你这莽夫，逞一时之勇，成何体统！”\n吴佩孚随即将矛头转向施从滨：“施大人，您是长辈，何必与他一般见识！有不满会议桌上说不清吗？”在吴佩孚的训斥下，二人情绪逐渐平息。会议室里，众人纷纷谴责这种不理智的行为，会议也因此中断，众人散去，留下一片狼藉。"
TOD_STG.91.a:0 "有话还是要好好说嘛"
TOD_STG.92.t:0 "风月鉴第三版"
TOD_STG.92.d:0 "近日内阁之大臣施从滨眼角似有淤青，报界同仁询之，则曰为其幼孙所伤，然本报细查之下，恐其中另有隐情。\n实内阁会议之时，有会务名柳青者年方二九，肌肤莹润手若柔荑，施色胆包天，言语轻佻，孙见之不屑，以正言弹之。施恼羞成怒，以茶壶扔掷孙传芳，孙躲避不及，满头茶叶实为狼狈。孙气急，以手揪施从滨领，重殴三拳，施躲避不及，以致眼角淤青。"
TOD_STG.92.a:0 "权当消遣罢了"
