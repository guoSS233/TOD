TOD_STG.2.t:0 "历代帝王庙"
TOD_STG.2.d:0 "他在镜前正冠时，铜镜映出的仍是那张熟悉的面孔，锦王，他现在是天子了。\n局势如乌云压顶，他虽登临帝位，却只掌控华北一隅。政变时失踪的太孙、不肯同行的二哥、远赴西地的大姐，还有在西安暗中筹谋的四弟，这些曾经的亲人，如今都与他反目成仇。大哥意外去世时，他心中复杂难明，既有亲人逝去的哀伤，也有终于有机会染指皇位的欣喜。曾经的大哥，是那个温润可靠的长兄，文武双全的太子，朝堂上下无人不喜欢他。如果他还在，自己决计不会走到今天这一步吧。\n他起身，阳光透过窗帘洒在他身侧，目光落在帝王庙内几十个帝王神位上，轻叹一声。昌德帝已入太庙，他却未曾前往，他很清楚老头子不会庇佑他的。父亲更喜欢大哥的儿子，可那小子成不了气候，跑得再远也只会自取灭亡。\n朱荣坤不愿再多想侄子，转而看向三皇五帝与其他立下伟业的先贤，虔诚祈祷。他并非只为自己起兵，而是要用自己的方式，从逆臣乱党和四夷手中拯救大明，拯救天下，哪怕付出必要代价。愿各位先贤庇佑天朝革命！\n祭告完毕，他走出庙宇，脱下皇袍，换上军装。夕阳西下，影子被拉得很长。眼见朱镕坤现身，在一旁等候良久的商震急忙上前道：“陛下，按照您的吩咐，各位将军已经在枢密院等候。”\n待朱荣坤抵达枢密院，讨论已然进行了一段时间，眼见天子到来，大家纷纷起身行礼。他脱下大衣，目光扫过在场将领，最后落在吴佩孚略显苍老的面孔上，轻声道"
TOD_STG.2.a:0 "“蓬莱侯，继续吧。”"
TOD_STG.3.t:0 "西北靖难？"
TOD_STG.3.d:0 "“西北的叛匪已经拥立锦王为兵马统领，声称是要“清君侧”......”内阁会议上，作报告的廷臣将西北的乱局禀报到了御前。“难不成他还想行“靖难”之事吗？他们拿什么质疑朕，西北军的那帮跳粱小丑吗？”朱镕坤震声到。“万岁息怒。”王永江移步上前。“此事虽震动天听，但也不过尔尔，西北诸军与地方士绅关系紧密，然各地域利益诉求却各不相同，加之边军虽为精锐然军资匮乏，不可久继。若吾等上下一心，京营破敌并非难事。”朱镕坤微微一笑，他从未将西北的那群丘八放在眼里，那帮匹夫自诩精锐而将京营视作腐化朽木，这回一定要给他们一点颜色瞧瞧。优势在我，不言自明。"
TOD_STG.3.a:0 "我做如下部署......"
TOD_STG.4.t:0 "战争部署"
TOD_STG.4.d:0 "蓬莱侯吴佩孚为谋克敌制胜，深析时局，特上戡乱纲要：\n一、顺天为天朝声望所系，当借其名以震天下。南方七省联军势单力薄，不足为患，然两广之大同会实为劲敌。若能戡定西北，则余者皆可传檄而定。彼时，我军海陆并进、空地协同，步步为营，对垒大同逆匪，定能稳操胜券。\n二、关东乃富庶之地，纵不能归附或拉拢，亦当确保其中立，断不可让其落入赤匪之手。漠北地处塞外，生存艰难。即便我方储备有限，亦当施以援手。若其能固边疆且倾向我方，遣精锐奇袭西北，或可收奇效。\n三、用兵西北，当速战速决。全面动员戡乱，人力、物力皆向西北前线倾斜。黄河沿线皆可渡河，待我军渡河后，定能荡平庆逆。\n姜登选大体赞同吴佩孚之策，然主张以守代攻。如此可充分动员华北国力，避免过早耗尽实力。华北国力强盛，足以应对外变。待庆逆士气衰减，西北之患自可平定。"
TOD_STG.4.a:0 "神旌乃顾，递行天讨"
TOD_STG.4.b:0 "一鼓作气，再而衰，三而竭"
TOD_STG.5.t:0 "新朝气象"
TOD_STG.5.d:0 "顺天城内，老八爷在胡同口打了一碗豆汁，一口下去露出了享受的神情。“咱老顺天就得早上来这一口，地道！”喝完了豆汁，擦了下嘴角，正瞧见拉车的祥子路过。跨步上前：“小祥呀，送我去茶馆。我几天没看见那几个老伙计了。”\n“哟，老爷。您前几日不是说要天下大乱了，顺天又要过兵灾了，自个要待在胡同里看老朱家打生打死吗。”\n“你不要胡说啊，我早就是当今圣上的忠实臣民了，你看这顺天城一副太平景象。哪有一点乱样子，圣上定能一扫诸逆，四海归一！”\n“八爷，您高明！这就送您过去。”\n茶馆内，熙熙攘攘如同往日，店小二摆出笑脸，不断迎客同时竖起耳朵打听茶客们的发言，一有异样就上去劝诸位爷莫谈国事。“这戒严令一解开，顺天城还是那个顺天城。正是圣明天子在上，才有的气象！”余下各位老茶客纷纷附和，店小二上前劝道：“八爷，欢迎您老再次光临。您看这样今天第一回茶就免钱了，您老就多谈谈玉春楼的趣事，诸位爷没见着您都闲得慌呐。”"
TOD_STG.5.a:0 "一切如常"
TOD_STG.6.t:0 "顺天紧急大会召开"
TOD_STG.6.d:0 "顺天事变余波渐趋平息后，京师周边五州戒严令陆续解除，新生政权暂时摆脱军事危机威胁。与此同时，顺天政府的内部矛盾开始显现。作为一个临时拼凑起来的同盟，其中各方势力的力量对比、实际诉求都不尽相同，发生摩擦在所难免。\n尽管西北与东南已然举旗反叛，预想中的全国宾服并未实现。但战争的阴云之下，统治集团内部的矛盾却依旧在不断升温。不同派系间的裂痕日渐扩大，在部分地区已显著影响施政效能。\n为弥合内部裂隙并应对顺天事变后的困局，新任天子以“精诚团结”为号召，在顺天咨议院召开政府紧急会议。"
TOD_STG.6.a:0 "是时候坐下来谈谈了"
TOD_STG.7.t:0 "大会开幕"
TOD_STG.7.d:0 "随着顺天紧急大会的召开，各方实权派系的代表齐聚京城朝堂，就顺天政权的未来展开密集磋商。在天子的刻意授意下，不少中级军官也作为代表被邀请到了会场曾经作为咨议院开会场所的明堂，如今少了几分文人的附庸风雅，多了几分武人的豪迈洒脱。\n东西南北的各种土话在武将们大嗓门的加持之下回荡在会场内，不时还能听到几句夹杂着粗口的方言。部分武备系或是高级勋贵出身的政客尽管对于这种乱糟糟的环境并不适应，但也只能姑且听之任之。\n就在这么一番热闹的情景之下，顺天紧急大会正式拉开了序幕。"
TOD_STG.7.a:0 "开幕！"
TOD_STG.8.t:0 "政治架构的调整"
TOD_STG.8.d:0 "顺天紧急大会的第一项议程，便是废止少帝此前颁发的诸多混乱政令。自从少帝贸然推行一系列激进措施后，朝廷的权力架构与施政秩序陷入紊乱。尽管顺天事变后这些政策已被仓促叫停，但其造成的后果如同裂隙，仍在官员间引发信任危机，也让朝廷治理的基础摇摇欲坠。\n但具体如何改善现状，与会代表却难以达成共识。勋贵们主张采取非常措施，在戡平各地叛乱的过程中，在各地临时设立“军管委员会”，依靠武装力量稳定政局；而武备系则主张恢复旧制，在地方管理上依旧仰赖官僚体系和咨议院，通过这种方式拨乱反正，从而更好地强化自身正统性。"
TOD_STG.8.a:0 "武备系提出的理念得到落实"
TOD_STG.8.b:0 "勋贵们的构想赢得了更多人的支持"
TOD_STG.8.c:0 "议程陷入了僵局……"
TOD_STG.9.t:0 "军事权力再分配"
TOD_STG.9.d:0 "会议的第二个议题主要围绕军权展开。随着各地叛军势力举起反旗，朝廷各地的军事压力与日俱增。为了应对日益复杂的战场形势，究竟该以怎样的军事指挥体系进行作战成为摆在朝廷面前亟待解决的又一问题。\n在这一点上，武备系与勋贵之间依旧存在分歧。武备系主张大力起用新锐将领，尤其是顺天事变中表现突出的一心会成员。这些将领熟悉机械化和陆空协同作战，能够适应当前作战需求。\n与之相对的，勋贵集团则更看重军事传统的延续，倾向于依赖经验丰富、参加过欧战的老将。他们认为老将的作战经验和军中威望是战胜敌人的关键，同时重用老将有助于稳定军队，确保其对朝廷的忠诚。"
TOD_STG.9.a:0 "一心会的将官得到提拔"
TOD_STG.9.b:0 "老将们依旧牢牢把持军中权力"
TOD_STG.9.c:0 "议程陷入了僵局……"
TOD_STG.10.t:0 "人事升迁调动"
TOD_STG.10.d:0 "会议的最后一个重要议题是人事升迁调动相关的内容。顺天事变后，许多抗拒新朝的逆党遭到逮捕或处决，这使得大量岗位出现了空缺，严重影响了朝廷的活动。如何分配这些空缺的岗位，使朝廷恢复到正常运转，同样是会议需要解决的问题。"
TOD_STG.10.a:0 "武备系推荐的人选得到更多任用"
TOD_STG.10.b:0 "勋贵们得到了更多位置"
TOD_STG.10.c:0 "议程陷入了僵局……"
TOD_STG.11.t:0 "大会结果"
TOD_STG.11.d:0 "随着各项议题的陆续结束，顺天紧急大会也逐渐步入尾声。在整个会议的进程中，各派代表唇枪舌剑，用尽各种办法来为自身派系争取更多的权益。不少人反复强调己方在“顺天事变”中做出的贡献和付出，有人甚至干脆扯开了衣服，向大伙展示身上的枪伤，以此证明自己在事变中的英勇表现。\n尽管各派均不愿轻易在核心利益上作出让步，但面对内忧外患的严峻局势，最终不得不在权衡利弊后达成有限妥协。经过连续十余日的折冲樽俎，与会各方最终在明堂的穹顶下达成临时的权力分配框架："
TOD_STG.11.a:0 "武备系赢得了会议主导权，成为此次顺天事变的最终赢家"
TOD_STG.11.b:0 "勋贵们掌握了会议的节奏，在利益分配中拿到了多数"
TOD_STG.11.c:0 "利用各派的分歧，天子最终取得了优势地位！"
TOD_STG.12.t:0 "夜宴"
TOD_STG.12.d:0 "深夜，蓬莱侯府内灯火通明，人声嘈杂。蓬莱侯吴佩孚高坐主位之上，姿态从容。\n在座的却无勋贵名将等府上常客，反而是自顺天事变后便备受冷落的宪政会议员。这些平日少有机会踏足侯府的议员们，今夜却齐聚于此。他们或低声交谈，或默然沉思，侯府内气氛既庄重又微妙。\n吴佩孚起身，环视一周，清了清嗓子，开口道：“诸位议员，今夜将诸位请来，是有一桩要紧事相商。”\n众人目光皆聚焦于他，吴佩孚微微一顿，继续道：“顺天事变后，咨议院一时受到了冷落，诸位想必心中都有苦楚。而我们勋贵这边，虽然手握军权，但在朝堂之上，仍有许多掣肘。如今这天下，风云变幻，各方势力角力激烈。我思来想去，觉得诸位议员不妨与我们携手合作。诸位在政治领域有经验、有影响，我们则是在军中得到广泛的支持。双方若能精诚合作，定能在这乱局之中，为诸位寻得一席之地，也能让我们在朝堂之上更加稳固。不知诸位意下如何？”\n议员们闻言，面面相觑，眼中皆露出思索之色。片刻后，有议员出言询问合作细节，吴佩孚则不紧不慢地从袖中取出一份早已准备好的合作计划……"
TOD_STG.12.a:0 "打天下易、治天下难"
TOD_STG.13.t:0 "政治花瓶"
TOD_STG.13.d:0 "“昔者周公朝诸侯于明堂之位：天子负斧依南乡而立；三公，中阶之前，北面东上。诸侯之位，阼阶之东，西面北上。诸伯之国，西阶之西，东面北上。诸子之国，门东，北面东上。诸男之国，门西，北面东上。九夷之国，东门之外，西面北上。八蛮之国，南门之外，北面东上。六戎之国，西门之外，东面南上。五狄之国，北门之外，南面东上。九采之国，应门之外，北面东上。四塞，世告至。此周公明堂之位也。明堂也者，明诸侯之尊卑也。”\n所谓斧依便是屏风，屏风，言可以屏障风矣。屏风不仅可以挡住风雨，同样也可以遮住一些不该让人看到的东西，转而示以屏风上华美的文饰，来彰显当屏风而立的天子之威仪。\n明堂如此，朝堂自然也是如此，虽然国家在国之柱石的掌控下运转十分良好，但是总该看上去更体面些，挡住愚夫和固守旧制者的唇枪舌剑。所以勋贵们不仅没有打算彻底废除咨议院，反而觉得应该“扩大”其职权，鼓励他们多多听取民意，不至于有尸位素餐的哀叹。只是那些复杂的军国重事，就不必议员们多费心了。毕竟，大明一向是一个善于倾听民意的国家。"
TOD_STG.13.a:0 "如今，明堂里有了一面新的屏风了！"
TOD_STG.14.t:0 "大明咨议院议员充实的一天（1）"
TOD_STG.14.d:0 "海澄坐在咨议院议员的办公室里，感觉自己的生活从未有此充实过。英明神武的锦王，啊不，现在已经是陛下了，登基之后积极提升调整咨议院的权力，鼓励议员们积极参政议政。在陛下“天下兴亡，匹夫有责”的口号下，各类议案和公文材料被成批次地发给了咨议院，拜此所赐，他现在桌子上堆满了各种文件、信件。\n他拆开一封书信，见“海公亲启”字样，便让秘书拆阅并代笔回复。接着，他拿起一份公文，发现是学子与校方因食堂菜品质量与涨价问题引发的争议。他本想递给秘书，但又想过把宋景濂的瘾，于是提笔开始从自己读书的时候如何不易写起，劝学子和校方互相体谅，努力克服共度时艰，艰难困苦玉汝于成。\n后面的文件也都是大同小异，忙到午餐时间海澄还没处理完一半，可是年度的决算案已经送到他面前了。"
TOD_STG.14.a:0 "总算来了件大事"
TOD_STG.15.t:0 "大明咨议院议员充实的一天（2）"
TOD_STG.15.d:0 "海澄一向觉得废寝忘食不应该，身体发肤受之父母，怎么能这么损害？于是他准时离开了办公室，去享受他四菜一汤定例，国家如今不太平嘛，再奢侈就过分了。\n胭脂鹅脯配上油泼茼蒿颜色相映成趣，海澄胃口大开，又拿了些竹叶青小口抿着，一时飘飘然起来。看着时间差不多了，海澄把银耳双鸽汤喝完，开始了自己的饭后散步。\n回到办公室的海澄昏昏欲睡，但为了大明，他自然不能做这种尸位素餐之事，于是他打开了书箧，然后恼怒地看向了秘书“你怎么在这里放了怎么这么多文件？哪个是决算案？”\n秘书委屈地抬头望向他，“海议员，这里都是决算案，内阁的文件中说了，以前朝廷总是轻视咨议院，轻视民众，决算案往往百般掩藏，不说明细节，如今新朝自不同于旧日，自然要有所不同。”\n海澄发出了近乎哀鸣地抱怨，“往年的决算就够长的了，现在长了三倍不止，还有一堆专业术语，这可怎么看得完！”\n秘书小心地望向海澄，“或许，我可以帮您总结一下？毕竟您的事情多，您还有更重要的事情做，不能把时间都浪费在看这些文件上。”\n海澄揉了揉眉头，犹豫了一会儿后，看着这个刚调来没多久的秘书，“伯羽，你去读一下，写个总结出来，我明天看。”\n叫作伯羽的秘书眼里透露出一丝笑意，“好的，议员。”"
TOD_STG.15.a:0 "这朝廷安排的秘书，办事就是利落呀"
TOD_STG.16.t:0 "美酒"
TOD_STG.16.d:0 "“它必须说谎，必须自觉地、蓄意地说谎，渴求于猎物，打扮得五彩缤纷，自身就是面具，自身就成了猎物。”\n蓬莱侯府上正在进行着一场盛大的酒会，或者说应该叫酒会吧。亮如白昼的侯府花厅内三五成群的坐着武备系的议员和勋贵，一边品着杯中美酒，一边看着主人为他们精心准备的“节目”，一群栗色头发赤着脚身着白裙的少女，在花厅延出去的戏台上，轻唱着他们未必听得懂的歌曲。虽然有些暴发之人已经有些面红耳热松了松领子，但在座的大部分人还是能把持住自己，仍旧正襟危坐，偶尔还对歌词点评两句。\n侯府的主人则是在人群中穿梭寒暄，叮嘱每一位客人一定要尽情享用这一切。终于，在一阵阵像战场上一样，对于目标的试探后，他停在了阎锡山的面前，“百川兄，今日这酒喝得可还舒心？”阎锡山但笑不语，眼睛不看吴佩孚却看向舞台，此时那些来自普罗旺斯的女孩已经离开了舞台，如今在上面登台唱戏的，是大明最好的昆腔班子。\n吴佩孚并不恼怒，换了个话题，“小儿顽皮，最近找了个英吉利的调酒师来府上，日日酣饮，十分不成体统，我本欲训斥他，不想英夷虽然不善庖厨，在这饮酒之道上，倒是颇有研究。我叫他出来，给百川兄表演一二。”话音刚落，人群中就闪出了一名西装革履的使者打扮的年轻人。他托着银盘，上面摆放着一排瓶瓶罐罐，来到吴阎二人面前停下，先用银夹取出几块冰块放进雪克壶，又加了一些琥珀色的液体，最后倒在酒杯中奉给二人。\n吴佩孚左手拿起酒杯，向阎锡山致意，“英夷这酒出了名的辛辣，我一向觉得不是人喝的，可是用冰块和苦橙调味，遮盖住那股辛辣劲，味道反而出奇的好，阎兄也试试。”阎锡山听着吴佩孚这别有深意的话若有所思，迟疑了片刻后，还是拿起了酒杯，小口的抿了起来，“吴兄这酒的确难得，不知道是什么方子，我回去也让府上的人试试？”\n吴佩孚脸上的笑意此时终于真切了三分，从袖中拿出了一份方子："
TOD_STG.16.a:0 "只是上面的比例并非如何调制一杯酒，而是如何勾兑这个国家。"
TOD_STG.17.t:0 "转任地方"
TOD_STG.17.d:0 "“李靖质兼文武，出将入相，才当为一代楷模啊……”董政国苦口婆心地劝着自己的老部下，不得已从几千年前的唐朝翻出例子来教育曾经的老部下。\n部下自然也知道他说的自然没错，哪怕乡野之人看两出戏也知道出将入相。姜太公“维师尚父，时为鹰扬”便是既为武王执掌朝政，又做军队统帅，吊民伐罪。李靖出将入相，虽然为了避嫌恂恂似不能语，但也是尚书省长官之一。只是大明毕竟不是大唐，文武分野实在久了，大家平时井水不犯河水，其实互相是看不起的，让他脱掉军装和那些文官们打机锋逗闷子，他实在是不耐烦。\n董政国见软得不行，绷起脸来教训道，“这是命令，打仗的时候让你们去进攻知道服从命令，现在让你们转业成文官，也是命令，和打仗一样，都是为了我大明山河永存！”\n“可打仗是打仗，我不进攻谁去进攻？大明又不缺想做官的文人，何必让我去和他们消遣？”\n“想做官的文人自然多，可你看看他们将我大明治理成何等样子？引诱悖逆庶人（指少帝）弑杀祖父，在各地纵容乱党横行，现在让你们去做文官，正是为了拯救我大明于水火之中！”\n这样的场景发生在无数老长官与部下之间，最终，第一批经过培训的上百名军官离开部队，转职为文官，补充了顺天之变后混乱的大明政府，让它重新运转起来。"
TOD_STG.17.a:0 "以观成效"
TOD_STG.18.t:0 "定武元年，南阳府小吏孙兴的日记"
TOD_STG.18.d:0 "晨雾未散，知府衙门的铜号已响了三遍。我蹲在账房后院抄写军械清单时，听见赵将军的马靴踏在青石板上的声响由远及近。那些从边城追随而来的校尉们，又在前堂把税粮账册叠成小山。老李头说将军昨夜在帅帐旁支了行军床，今早起来眼睛像两把霜刃。\n辰时，知府大人召见各乡里正。我偷瞄见赵将军把《练兵实纪》当镇纸压在案头，蘸着狼毫在税单上画圈。他忽然抬头问：“春耕前，税款能收齐几成？” 老张头抖着手回话时，将军的指关节反复叩击在案上，“去年蠲免的三成税款，本官要你们在一个月内补足。”窗外传来鹁鸪凄切的叫声，我看见陈县丞偷偷捏紧了拳头。\n午时，知府衙门后门卸下两车新式火铳。我数着账册时，听见外头有人急切地赶来报道——南阳府出现了部分逃民。但出乎意料的是赵将军并未动怒，只是轻轻摆了摆手，让那人报信的人退下了。\n戌时，将军府的油灯亮到三更。我捧着加急的军械拨款单，见赵将军正用火漆封一封军报。他忽然问：“孙三郎，你当过兵？”我扑通跪下，额头撞在冰凉的地砖上。将军没再说话，只是把刚写好的手令递给我，“传令给税务司，胆敢庇护逃户者，与逃户同罪。”\n亥时，我数着抽屉里攒了两年的龙元。外头风声裹着断续的号子，像有人在哭。"
TOD_STG.18.a:0 "赵将军确实不同于以往的那些知府，反腐、征税都是雷厉风行"
TOD_STG.19.t:0 "垂拱而治"
TOD_STG.19.d:0 "一个国家历史足够长的好处之一，就是当你想要实行什么新的制度的时候，总是可以从典籍中找到一些依据，来证明自己只是效仿古之贤者，而非离经叛道的狂徒。\n比如这次，勋贵们就翻出来了《谏太宗十思疏》来证明自己的行为是忧国忧民的忠君之举。\n“总此十思，弘兹九德，简能而任之，择善而从之。则智者尽其谋，勇者竭其力，仁者播其惠，信者效其忠。文武争驰，君臣无事，可以尽豫游之乐，可以养松乔之寿，鸣琴垂拱，不言而化。何必劳神苦思，代下司职，役聪明之耳目，亏无为之大道哉！”\n皇帝陛下不应为帝国的琐事所困扰，忠诚的臣子本就应该为君分忧，替皇帝陛下解决他所担忧的一切！"
TOD_STG.19.a:0 "惇信明义，崇德报功，垂拱而天下治！"
TOD_STG.20.t:0 "“莫谈国事”"
TOD_STG.20.d:0 "陈八爷站在院子里，和家里的一只鹦鹉大眼瞪小眼，倒不是陈八爷要把鹦鹉当鹰熬，而是他最近实在闲得无聊。茶馆里一说些什么伙计就上来劝阻，常常打断他指点江山的兴致，他也实在不耐烦去。想约几个老友出门尝尝新菜色，老赵这几天不知为何总是联系不上，无聊之下只能逗鹦鹉说话了。\n老陈给鹦鹉加了些水，然后就听得大门咣当一声打开了，几个穿着制服的人走了进来，“你叫陈段？”“是，是，几位有什么贵干？”“跟我们走一趟”说着拉起老陈就出门了。\n老陈浑浑噩噩间来到了警察局，被扔进了一间昏暗的监室，老陈把自己半辈子干过的坏事都想了一个遍，他觉得给夫子茶杯里下泻药应该也算不上什么大的罪过吧？\n终于，监室的门被推开了，两个警察推门而入，坐在了老陈对面的位置上，“别害怕，今天找你来是找你核实一些问题，你要如实回答”“是是，我一定知无不言。”老陈头点得如同小鸡啄米一般。\n“听说你常在裕泰茶馆喝茶是吗？还常常高谈阔论？”\n“是，小人是喜欢在他家喝茶，但小人一向小心谨慎，并不敢胡言乱语。”\n“老实一点，别耍小聪明！茶馆里的人可不是这么说的！”主要审讯的警察重重地拍了一下桌子怒喝道。\n“是是，我是爱议论议论国，可我对大明之心日月可鉴啊！我是想让他好啊！”老陈被吓出了哭音，也乱了方寸，说了更不该说的话出来。\n两位警察闻言相互对视一眼，“还说你不敢胡言乱语？大明难道不好？”\n老陈此时也意识到自己说了什么，直接瘫在了椅子上。\n虽然老陈觉得自己完了，但大明毕竟政治清明，爱民如子。两位警察并没有为难老陈，他们很亲切地和老陈交流了一天，推心置腹地指出了老陈思想中不足的地方，老陈感激之下写出了一份讲述自己思想转变过程的文件，然后就如常回到了家中。"
TOD_STG.20.a:0 "不教而诛谓之虐，我大明绝不如此！"
TOD_STG.21.t:0 "茶馆展演（1）"
TOD_STG.21.d:0 "顺天的茶馆最近重新开业了，当然，表演的内容要改一改，以前那些受管学系堕落腐化的自由派思想的内容自然是不许再讲，要以文化人，宣扬忠孝节悌之义。虽然有人疑惑没有管学系时大家爱听的也是汪大尹火烧宝莲寺，但在国家安全法案的监督下，这些人很快纠正了自己错误的思想。\n茶馆内说书先生正在绘声绘色地描述着肚兜上的赤色鸳鸯，台下稀稀落落地坐着几个老头也是聚精会神地听着，门口有一个门房不时张望着什么，远远看到几个警察来了之后掀开门帘对里面的伙计使着颜色，伙计也是聪明立刻跑进内场，“来了来了。”台上的先生依旧老神在在，把桌子上的话本塞进袖子，摸出一本皇明宝训来。\n“话说那洪武二年正月哪，太祖爷摆开仪仗驾临奉天门，招来元朝的旧臣，就问他们哪，“这元朝是怎么丢了江山的呢？”。这元朝的旧臣哪一来是羞，二来呢也怕，他们怕什么呢？怕太祖高皇帝给他们杀喽，你想他们作为汉人给胡虏做狗腿子，太祖现在驱逐胡虏了，他们能不怕吗？这帮人啊你看看我，我看看你，都不说话，但你不说话也不行啊，那太祖爷在那看着了，有个叫马翼的就出来说，“元有天下，以宽得之，亦以宽失之。”哎，你听不懂对吧，听不懂就对了，这马翼他是个文人，他的意思是什么呢，就是啊元朝对百姓太好了，所以啊没管住老百姓，才亡了国。太祖爷一听这个急了呀，就说“你说对老百姓好能的天下，那是真的，但你说因为宽仁失去天下，那你就是胡扯了。你元朝那治理百姓是宽仁吗？你那是宽纵，放纵那些地方豪强控制政事百般虐民，再加上你们这些臣子和君王都不学好，骄奢淫逸，什么都不干，什么都不管，这才亡了国，怎么能说是宽仁的错。圣王的道理，宽仁是对的，……”"
TOD_STG.21.a:0 "但不能宽纵，更不能什么都不管！"
TOD_STG.22.t:0 "茶馆展演（2）"
TOD_STG.22.d:0 "“好！大抵圣王之道，宽而有制，不以废弃为宽；简而有节，不以任易为简。施之适中，则无弊矣。”刚刚在一群人簇拥之下走进茶馆的文人打扮的中年男子放下茶杯喝了声彩，“这才是我大明的茶馆该说的东西，先生可有功名？”\n“小人姓李名胜，是xx年的进士。”自打中年男子进来李胜便已看出他应该不是普通人，想着自己心里那一点年少时的野望，才有了刚刚那一段现挂。\n“既然有举人功名，在这里说书太可惜了，你明天去宣传部报道吧。”说着对身边的秘书吩咐，“你给他一份出入函，别让人家以为他是骗子。”\n中年男人说完这句话便走了，只留李胜在那里发懵，不过他也不惊奇，他说这段书，便是揣测着如今朝廷加强中央集权的行为而作，只是没想到有如此机遇罢了。"
TOD_STG.22.a:0 "普天之下，莫非王土！"
TOD_STG.23.t:0 "例行检查："
TOD_STG.23.d:0 "夕阳西下，京城褪去了白日“万国衣冠拜冕旒”的恢宏，光影斑驳间令行走其中的人无端觉得阴森。行人纷纷归家之际，京城宣武门外的龙源楼迎来了几个不速之客。倚在一边偷懒的门房一见便知来者身份不一般，急忙立起身子，几步向前，“见过几位老爷，不知几位老爷有何贵干？”\n“郑潇在这里吗？”为首的御史直入主题。\n“郑……郑大人确实在里头。正在雅座和朋友们聚会。”听闻此言几人也不废话，直接便让店员带路。有两人直奔雅座而去，还有两人则让老板把此间的餐单拿来查看。\n直奔雅座的锦衣卫来到名为“清平乐”的雅座门前，推门而入，便见桌子上摆着一盘不剩几块的糟鹅掌、一盘玉环瑶柱、一份吃了一半的松鼠鳜鱼，和一份清炒翡翠虾，每个人的面前还摆着一个小汤盅，看来这饭大概是吃得差不多。\n御史微微点头，向主座上的郑潇一拱手，“扰了郑大人雅兴，敢问郑大人这几位客人是何姓名？今日因何聚餐啊？”郑潇本有几分惊诧，听得此言突然反应过来什么，不仅减了怒容，还急忙立起身，“下官今日在这里宴请同学叙旧。”接着便介绍几位同学姓谁名谁、有无官职、以何为生、家住何处。旁边的另一个御史在一旁记下了这场宴饮的菜色与参加人员，落笔写完，两人向郑潇一拱手，告辞而去。\n郑潇立在门前看二人离开后，这才坐回原位。旁边一个白脸长须的男子开口道，“怪不得郑兄你如此小心，一点规格不敢逾越，朝廷这下是真的要厉行肃贪了？”\n郑潇苦笑，“你没看赵司长都被枪毙了？哪里不是来真的，今日我们闲聚还不知道是不是罪过呢！”“我看也不是坏事，这些蛀虫早该清理清理了，没按太祖爷立的规矩就已经是仁慈了。要我说查查酒宴怎么了？为官本来本就不该结党营私，这是从源头上杜绝。”他虽然这么高声说着，但却用眼神警告在座诸位小心隔墙有耳。众人也很快明白了他们的意思，纷纷附和起来。"
TOD_STG.23.a:0 "“要我说，这种监管就该多搞。”"
TOD_STG.24.t:0 "战时经济会议（1）"
TOD_STG.24.d:0 "大明顺天府府衙后堂，一群衣冠楚楚的企业家们正坐在椅子上焦躁不安，有人想要站起来出去走走，就被一旁的锦衣卫礼貌地请回原处。\n终于，请他们来这里的主人顺天府尹终于出现了，“让列为久等了，最近国事艰难，实在是抽不出身。今天请各位有事要请各位帮忙。”\n沉默了半晌，坐在左首的宋满看实在无人接话，不得不硬着头皮问道：“不知大人有何事需要我们帮忙？”\n“本官想替大明恳求各位共赴国难，如今大明西伪跳梁、宁逆逞凶，前线的将士没有子弹怎么御敌？可这子弹，也不能从地底下长出来啊！故此我恳求各位，将工厂暂时交于国家经营，共克时艰，日后宇内澄清之际，国家必然不会忘了你们的功劳！”说着，府尹示意秘书分发征收名单。\n底下的企业家们虽然早有预期，但看见名单还是内心一紧。虽说是暂时交于国家经营，但这经营着经营着，怕就成了朝廷的囊中之物了，可是若不答应……看着一旁的锦衣卫，这事恐怕还由不得他们拒绝。"
TOD_STG.24.a:0 "来者不善，善者不来"
TOD_STG.25.t:0 "战时经济会议（2）"
TOD_STG.25.d:0 "“大人，我们全家就指着这几个厂子过活，您就行行好，留一两个厂子给我们吧。”一个微胖的男子站出来，向顺天府尹苦苦哀求。\n“哦，是藤香罐头厂的刘老板吧。”顺天府尹脸上仍挂着笑，翻着手里的小册子，“刘老板也会缺钱？前线战士嘴里挣得还不够？上一次国防部订单，你做罐头只花了三成不到，是吧？怎么，还是不够花？”\n“大人明鉴，小人没有，小人没有啊！”\n“有没有锦衣卫会调查清楚，你现在先跟他们去调查吧。”\n老刘被锦衣卫带走了，刚刚跃跃欲试的老板纷纷坐回了位置上。\n“各位还有什么困难吗？有的话都可以说说。”顺天府尹诚恳地望向了众人。\n“没，没有了……”\n长辛店外，几辆卡车停下，训练有素的军人跳下车，分别把守工厂出入口，一队绕厂巡逻，另一队直接进入工厂。工厂方面显然早已接到了通知，主任略带憔悴地站在车间门口，一个秘书模样的人抱着盒子站在他旁边。\n“根据大明战时紧急条例，你的工厂被征用了，这是知情同意书，你签一下吧。”为首的军人把一张纸递到了厂主面前。\n主任从怀里拿出笔，颤颤巍巍地签着自己的名字，“是，这是工厂的所有印鉴，请老总查验。”\n旁边的秘书打开箱子给对方查验。核对无误之后，为首的军人开口道："
TOD_STG.25.a:0 "“可以了，你们可以离开军队的工厂了。”"
TOD_STG.26.t:0 "新仪器"
TOD_STG.26.d:0 "大明财政部今天运来了一些新鲜玩意儿，这东西不大，和电报机长的差不多，但是键盘是一列列的数字。工人们端着箱子进进出出，办公室里的文员们则忙里偷闲，小声讨论起来。\n“哎，咱啥时候这么有钱了？这是瑞典产的最新式的手摇计算机啊，财政部终于舍得买了？”一个小职员满脸兴奋地和同事咕着。\n“不知道，希望能真让咱们用，我是受够了那个能当我爹的计算机了，又麻烦又难用，每次摇它我都感觉自己不是在算数，是去练臂力去了。”同事没那么兴奋，反而因为想起了一些久远的回忆而有些痛苦。\n箱子堆在办公室的一角没有人去动，毕竟没有上级的通知最好就什么都不要干，这是在大明官场生存的一个好习惯。下午，办公室诸人终于等到了一纸通知，告诉他们财政部采购了一批新型手摇计算机，（一名职员表示，如果我是盲人的话，这个消息真是十分有用），要各部门组织学习使用方法，争取尽快学会并将在三日后进行相关知识问答考核。\n“大明朝一项以勤俭清廉著称，从太祖高皇帝起便要求宴请只许四菜一汤，为的便是减少公务支出，与民生机，至于其他公务用品，也一向是能省则省，如今为何采购这么一批机器呢？”一个约莫60岁上下须发已有些发白的老者问着传达这个信息的小组长。\n“哦，开会时是这样传达的，咱们最近又要统计各工厂产能，又要编制相关的生产指标，最近时间紧任务重，不能再把时间都浪费在计算上了，以后每组配备一台计算机。”小组长头都没抬，整理着手里的纸张，拿出红铅笔开始核对手里的数据，“圣人还说过工欲善其事，必先利其器呢。”"
TOD_STG.26.a:0 "“有了这些东西，我们制定生产指标的速度肯定能大大加快了！”"
TOD_STG.27.t:0 "军工经济改良（1）"
TOD_STG.27.d:0 "蓬莱侯府的书房外，侍奉的下人们屏气凝神，眼观鼻，鼻观心，一点大气都不敢出，会客室里，这个国家真正的治理者们齐聚一堂，讨论着接下来大明王朝的走向。\n一个青衫男子歪着身一只胳膊撑在太师椅的扶手上，和周围的正襟危坐的军人做派的诸人形成了鲜明的对比。他拿着一份数据，解释着目前的困难，不过看样子这些武夫们大概率也没听懂他到底在说什么。\n“顺天的大街上，一个愁眉苦脸的男子，一边走路一边自言自语道，油盐没有，铁钉没有，布料也没有……”这时旁边走过来一个看起来像是警察的人，用手捂住他的嘴对他说：“别说了，不要命了？，您要是再这样诋毁大明，我就要拿手枪柄敲你的脑袋了！”那个男子看了看便衣警察，继续自言自语：“看吧，连子弹也没有……”青衫男子讲了个笑话，试图活跃一下气氛，在座的将军里有的直接笑出了声，“据我所知这是最近顺天警察里最流行的笑话。”\n“也不是笑话，毕竟物资紧张，我们最近的确减少给警察们配备的子弹，甚至有的地方，两个警察共用一把枪。”一个黝黑面庞的将军开口了，说完觉得意犹未尽，又补充了句“不知道谁想的馊主意，两个人公用一把枪，第三个人负责保管子弹，美其名曰节省子弹。”\n“是啊，武备系的人把军工产业看作自己的地盘，谁也不许动，可是他们倒是干活啊，现在军队在打仗，没有子弹怎么打。让他们提高产能他们就推说工人不够积极，不肯好好干活。可我们就算架机枪督……”"
TOD_STG.27.a:0 "我们也得有机枪吧？"
TOD_STG.28.t:0 "军工经济改良（2）"
TOD_STG.28.d:0 "“不是工人的事，武备系好日子过太久了，国有企业管理者任人唯亲惯了，你懂不懂军事不重要，懂不懂生产也没关系，会喝酒会说话才重要，和这么一群酒囊饭袋在一起，怎么能干好军工企业！”\n新勋贵的核心人物们你一言我一语，忧心忡忡地讨论着国家，包含着浓浓的家国情怀，对这个国家的食利者和蛀虫们施以谴责。\n吴佩孚坐在上首听着众人的抱怨有些烦了，“这些今后再说，先说现在怎么办吧？”\n“要我说，就把军工厂也管制起来，把那些蠢货都换下去，他们管不好的事我们来管！”刘玉春看着眼前的各类报告，略带愤懑地说道。\n“这不现实，我们刚刚缓和了和武备系的关系，现在交恶实属不智”身着青衫的张其锽开口反驳。\n“那你说怎么办？就不管就这么看着？”\n“当然不是，我们不好撤换武备系的人，但谁说一个工厂只能有一个厂长呢？我们可以把我们的专业人士派去作为主管技术的厂长嘛。”\n“那武备系就能答应了？”\n“他们会的。”"
TOD_STG.28.a:0 "吴佩孚的开口结束了这场讨论"
TOD_STG.29.t:0 "弹性工时（1）"
TOD_STG.29.d:0 "已近午时，嘈杂的工厂里工人们似乎还在忙碌地工作着，但心思显然已经不在这上了，都在心里盘算着午饭时间早点来，终于可以歇一歇了。\n终于，工头看了看他那块已经满是油污的手表，告诉大伙可以吃饭了，可就在这时，厂房里进来了几个不速之客——领头的是接管他们工厂的那位军爷，后面还带着几个文员模样的人，手里面拿着一摞纸，不知道要干什么。\n“各位兄弟先等一等，就占用你们一会儿时间，有个好消息要告诉大家！”为首的军官挥手止住想要走出厂房的工人，“朝廷最近正是多事之秋，可是也没忘记百姓疾苦，知道各个工厂的工人都忙得不行，所以决定实行弹性工时，在原则上，你们只要可以完成工作任务，就不必非要定时定点上下班！”\n“啊？还有这好事？”“朝廷转性子了？”底下的工人们窃窃私语了起来，不过都有些雀跃。\n“张军爷，你说的是真的吗？”有工人大着胆子问了一句。\n“当然是真的，圣上御笔朱批岂会有假？我这不就带人来统计大家今天的上工时长了吗？”张穰指了指后面的几个文员笑着回答，“不过，朝廷为各位想，各位也要为朝廷想，如今西逆跳梁，各位要勠力为国啊。行了，我也不说了，别耽误了你们吃饭；大家填问卷吧，按心意填就行。”\n工人们惊喜过望，排起队，纷纷开始跟文员登记想上工的时长。"
TOD_STG.29.a:0 "我也来！"
TOD_STG.30.t:0 "弹性工时（2）"
TOD_STG.30.d:0 "朝廷终于干了件人事，弹性工时真好，看我下午工作一个时辰就回家。”一个年轻的小伙子跃跃欲试兴奋地冲同伴说，“小赵，你今天打算工作多长时间？别干那么久了，身体重要。”\n“柳，柳哥，我家里人口多，老娘还病着，我打算多干点，也好给老娘买点肉补补身子。”\n“小柳啊，你年轻经事少，可别这么写啊。说是想一天干几个时辰就干几个时辰？有这好事？我大明朝的太阳从西边出来了？”一个相对年长的老工人拉住了小柳，苦口婆心地劝道。\n小柳不以为意，老工人也只能摇摇头叹了口气离开了。文员很快登记完了工人们下午的工作时长，大家也各自散去吃饭。\n下午上工后，陆续有工人被叫进厂长张穰的办公室，出来时都垂头丧气。小柳见状疑惑，但也未多想，只管做手头的活。没想到一会儿，工头来找他了，让他去找张军爷一趟，他虽然奇怪，但觉得这可以趁机摸摸鱼也不错。\n小柳磨蹭着过去，进门就听张穰质问道：“你就是柳羽对吧？怎么下午只想工作两个时辰呢？年轻人，正是好好干的年纪啊！”\n“啊？不是可以自主决定工作时长吗？而且我一定能完成指标，不会让厂子吃亏的。”张穰严肃起了面孔，“我说你们这些年轻人，一个个的光想着现在快活！你不好好工作攒钱，以后怎么娶妻生子？谁找你？看看人家小赵！这才是忠孝之人！你再好好想想吧！”\n“我，我……”\n“你多想想吧，要知道现在是紧急状态，工厂工作量很大，积极的人也很多，你要是实在不太适应高强度工作，可以试试去一些轻松的地方工作。”\n小柳就算再迟钝也明白这是“爱干干不干滚”的文雅说法，虽然他觉得这种被迫自愿的滋味并不好受，但他也的确不想失去这份工作，无奈之下，他最终开口道：“张军爷，我，我不懂事，写着玩的，肯定该干多长时间干多长时间啊，该加班我也能加的。”\n张穰满意地点点头。"
TOD_STG.30.a:0 "“这才对嘛，工人要多为国家想！”"
TOD_STG.31.t:0 "引入民营经济（1）"
TOD_STG.31.d:0 "吴佩孚最近的日子过得并不舒心。他出身军旅，自然知道战争就是一只吞噬资源和生命的巨兽，可是以前的他只需要打仗就好了，这些问题是朝廷衮衮诸公的工作。不当家不知柴米贵，看着前方一份份要求补充物资的电报，他只觉得太阳穴一跳一跳地，他把办法都想尽了，就差在工厂架上机枪督工了。\n好在，他不是一个人处理这些事务，他还有忠实能干的同僚们，所以他约了范旭东，想和这位“专业人士”谈谈，听听他有什么办法。\n正思忖间，秘书进来向他说范旭东已经到了，两人见礼后，分宾主坐下，吴佩孚也没再客套，直入主题，询问范旭东对最近的军需生产怎么看。\n吴佩孚知道自己不用给范旭东介绍情况，毕竟吴佩孚收到的每一份电报都会转他一份。范旭东自然也是一个头两个大，犹豫了片刻，范旭东缓缓开口，“我有一个想法，出我之口入玉帅之耳，如果玉帅觉得不妥，权当我说的是疯话。”\n吴佩孚咧嘴一乐，“有什么疯话不疯话的，再不想想办法的话……”"
TOD_STG.31.a:0 "我就要被这一封封电报逼疯了。"
TOD_STG.32.t:0 "引入民营经济（2）"
TOD_STG.32.d:0 "范旭东见状略略放下心来，“我们，我们是否可以加快恢复一些民营企业的生产呢？很多物资并非只有朝廷控制下的工厂可以生产的，比如医疗物资、罐头还有一些武器需要的配件，民营企业只需要对产线稍做改造就可以生产。”\n吴佩孚低头沉思了一会儿，“武备系的老爷们闲散惯了，我们虽然已经想了办法整顿，但毕竟需要时间，让民营企业参与倒也不是不行。”\n范旭东听见吴佩孚同意自己的想法并无多少喜色，“只是武备系能同意我们动他们的禁脔吗？”他自然记得那一场惊心动魄的起因，那日的血色他如今想来都仍旧心惊，他不想成为那血色中的一片。\n“无妨，如今西逆跳梁，阎老西还是分得清轻重缓急的，等战事过去再让他们把吃的吐出来就是了。”\n范旭东揣测吴佩孚说的他们是谁，继续开口“还有一个问题，这些民营企业主多与管学系过从甚密，他们会愿意和我们合作吗？”\n吴佩孚被范旭东这略带书生气的发问逗笑了，“他们要是那么忠诚于管学系，大可以去诏狱陪他们嘛。天下熙熙，皆为利来；天下攘攘，皆为利往。这些商人连祖国都沒有，你觉得他们会对那几个打算搞乱国家的管学系不离不弃？这样，你让我们之前收拢的那几个管学系的旧人放出风去……”"
TOD_STG.32.a:0 "自然有爱国企业家为大明分忧"
TOD_STG.33.t:0 "《顺天日报》"
TOD_STG.33.d:0 "【本埠讯】今日蓬莱侯吴佩孚于帅府接见天津工商代表团，晤谈良久。各界翘楚齐聚一堂，就民营经济发展所遭种种困境，共探应对良策。吴帅悉心垂询各业经营实况，工商界贤达亦据实以陈，双方推心置腹，砥砺前行之志相契相合。\n会后旋即签署一系列合作备忘录，涵盖金融输血、税赋宽减、物资产销对接等关键议题。与会诸公皆显振奋，矢志与各界贤达同力协契。蓬莱侯吴佩孚亲自主持座谈会，全面部署提振民营经济相关行动，各界贤达踊跃建言，工商界翘楚也积极呼应。\n工商界代表在会后受访时表示：“蒙吴帅垂念工商艰难，我等深感振奋。当下国运攸关，民营经济亦当扛起使命，与各界贤达同力协契，为决胜之年添砖加瓦。”吴佩孚则勉励诸商：“实业兴邦，商人天职。望诸君鼓足干劲，共克时艰，为决胜之年折桂夺魁！”"
TOD_STG.33.a:0 "这是要对国企引入某种竞争机制？"
TOD_STG.34.t:0 "皇明荣光（1）"
TOD_STG.34.d:0 "夜幕笼罩了华北大地，赵睿走在街上，围巾护住了嘴，也让呼出的热气在眼前形成了一层白雾。\n街上已经没有多少人了，就连卖熟梨糕的摊主，也因为天气寒冷又客流稀少想要早些收摊回家，赵睿快步走到摊前，“老板，给我来一份熟梨糕。”\n“做不了您呢，您看，我这炉子灭了”老板摆摆手，“您要是爱吃，明天早点来，我给您多放料，我先走了您嘞。”\n赵睿拉住老板，“我这不是爱吃吗？您看我多买点还不行吗？不让老板您白点炉子。”老板是生意人，刚刚说炉子灭了只是觉得不值当的，如今见赵睿多买，这炉子也就立刻烧了起来。也是该老板挣钱，这一会儿的功夫又遇到了几个下班的归人，看见冒着白气与香甜的小铺也不免心动，一时小铺竟然排起长队来。\n回到家里，赵睿摘下帽子和脱了棉衣，搭在一旁的椅子上，就看见妻子坐在昏暗的油灯旁，正做着针线。\n“睿哥回来了？小娟有点发烧已经睡了，你小声点，别吵醒她，我给你热饭去。”妻子端上一个油腻而斑驳的搪瓷盆走到灶台，里面依稀可见是白菜和粉条，上面浮着的白色动物油脂证明，这里还是有些荤腥的。\n趁这个机会，赵睿来到了母亲床前，“妈，我回来了。”倚在床上的老人睁开了眼睛，“睿儿回来了，外面冷吧？”赵睿憨憨一笑，“妈，我不冷，我给您带熟梨糕回来了，您趁热吃。”赵睿说着坐在床边，把熟梨糕递到母亲手边。“你又花着冤枉钱，妈都多大岁数了？留着给小蕊吃吧。”老太太虽然嘴里埋怨，但眼神里满是慈爱。"
TOD_STG.34.a:0 "“没事，妈您赶紧吃吧，小娟也有。”"
TOD_STG.35.t:0 "皇明荣光（2）"
TOD_STG.35.d:0 "就在这个时候，女儿的声音突然传来，“爸爸回来了，外面冷不冷呀，你让我背的《梁惠王上》我背下来了！我背给你听！”女孩儿说着就要从床上跳下来，赵睿急忙制止了她，让她盖好被子，自己过来听。\n他坐在女儿床边，听着女儿流利地背诵着：“五亩之宅，树之以桑，五十者可以衣帛矣；鸡豚狗彘之畜，无失其时，七十者可以食肉矣；百亩之田，勿夺其时，数口之家可以无饥矣；谨庠序之教，申之以孝悌之义，颁白者不负戴于道路矣。七十者衣帛食肉，黎民不饥不寒，然而不王者，未之有也！”\n女儿背完睁着一双明亮眸子期待地看着他，他故意假装不知道想逗逗女儿，可看女儿瘪嘴又立刻不忍，“爹没忘咱俩的约定，看这是什么？”他拿出熟梨糕递给女儿，女儿欢呼雀跃地谢谢他，然后拿起来一个就想放进嘴里，可是又想起了什么，“爹，你也吃。”说着就把说里的那块递到他的嘴边。赵睿笑着说自己不喜欢这些甜食，女儿却一副不信的样子，这么好吃的东西怎么会有人不爱吃？\n赵睿几句话哄住了女儿，来到了餐桌边，妻子已经给他热好了两个窝头和一个白面馒头，他坐在餐桌旁，看着妻子端来白菜炖粉条，给自己斟上一杯二锅头，把最后一份熟梨糕递给妻子，“你也再吃口，我刚买的。”妻子的反应和母亲一样，埋怨赵睿不该乱花钱，又说留给孩子吃。“我一个人吃饭也无聊，你就行行好，再陪我吃口呗。”赵睿拉住了妻子，半耍无赖地把她哄到饭桌旁。\n看着妻子仍然有些不舍得吃，赵睿继续说道，“最近活多，我们也涨工钱了，我再多干一个时辰，工钱能有以前的两倍了，不差这点吃的。”\n“真的？”\n“是啊，而且也不拖欠了。”\n“那你挣钱也不易，你怎么还多干一个时辰？”\n“多干一个时辰有钱拿啊，厂里新来的小书生说的什么要提高积极性，说我们只要保质保量干满五个时辰，再多干的时辰工钱翻倍。”\n“那你也别太累了，别把自己累坏了。”"
TOD_STG.35.a:0 "“知道知道，放心吧，这日子，会越来越好的！”"
TOD_STG.36.t:0 "枢密院规划（1）"
TOD_STG.36.d:0 "在之前的顺天大会中，大量一心会的新锐军官获得了提拔，枢密院也随之摆脱了过去的陈旧气息。随着这批年轻军官的加入，枢密院展现出了新的活力，一系列新式的操演方案与作战计划开始逐步被提出和实施，为军事行动带来了更多的创新和变革。\n这些新方案和计划引入了时下先进的军事理念，融入了机械化作战和陆空协同等新型作战模式。通过这些调整，枢密院在制定战略时能够更全面地利用各种作战资源，为应对日益变动的复杂战局奠定了基础。"
TOD_STG.36.a:0 "穷则变、变则通、通则久"
TOD_STG.37.t:0 "枢密院规划（2）"
TOD_STG.37.d:0 "在先前的顺天大会中，勋贵的地位得以巩固。随着早前在少帝改革期间被免职的将领们重归岗位，枢密院重新找回了昔日的威严。在这些资深将领的主导下，那些曾被破坏的帝国军事传统逐渐得以恢复，各级军官们因改革而产生的迷茫与不安也随之平息。\n在这一过程中，一系列新的整军命令也陆续颁布，众多经验丰富、能力突出的将领获得晋升。凭借这些人事调整与军事命令的实施，枢密院对各级军队的指挥调度变得更加高效、有序，从而为后续扫平地方叛乱势力构筑了稳固的根基。这些将领凭借深厚的阅历和专业素养，在各自的岗位上发挥了重要作用，进一步提升了军队的整体战斗力。"
TOD_STG.37.a:0 "以不变，应万变"
TOD_STG.38.t:0 "枢密院规划（3）"
TOD_STG.38.d:0 "先前的顺天大会未就军事议题达成共识。但随着全国各地烽烟四起，我们面临的军事压力持续加剧，形势愈发紧迫。当务之急是确立一条切实的军事调整路线，从而帮助军队摆脱目前的混乱态势。\n各军事派系需暂时搁置分歧，依据战场实际需求，共同商讨出切实可行的改革方案。这不仅关乎军队战斗力的提升，更关乎国家的稳定与存续。我们需从战略层面审视军事改革，整合资源，优化指挥体系，提高军队的适应性和灵活性。"
TOD_STG.38.a:0 "穷则变、变则通、通则久"
TOD_STG.38.b:0 "以不变，应万变"
TOD_STG.39.t:0 "枢密院的思考"
TOD_STG.39.d:0 "随着装甲战车在前线战场大规模投入，关于其性能标准的争论迅速升温。枢密院内部对此大致形成两派观点：一派强调产量的重要性，主张通过集中生产实现数量优势，以此在战场上形成压倒性规模；另一派则坚持质量优先，认为应重点提升战车的火力、装甲防护和机动性能等关键指标，力求在技术层面超越对手，凭借代差优势取得胜利。\n在战局日益复杂的当下，如何抉择战车发展路线成为关键问题。质与量，究竟哪种路线才更能适应未来的战车作战呢？"
TOD_STG.39.a:0 "以质取胜！"
TOD_STG.39.b:0 "以量取胜！"
TOD_STG.40.t:0 "选拔勋贵子弟"
TOD_STG.40.d:0 "最近京城人的饭后消遣是讨论哪家公侯家又上演三国志了，老子打着儿子投军，然后太太上演一哭二闹三上吊。据说平阳侯家尤为精彩，平阳侯脸上甚至添了一条抓痕，不过据他自己说是在花园里没看路，被树枝挂了面皮。今天这场大戏唱到了乌有侯（因为我想不好取啥名）家，可是这唱法却有些不同。\n邬铭坐在上首，看着夫人刘氏毫无仪态地坐在一堆行李上，拽着儿子的衣袖不肯放下。邬幸，邬铭的儿子，跪在刘氏面前，泪流满面却眼神坚定。\n“我不让你去！这京城哪家勋贵家的孩子去了？你怎么就非得抛下母亲，去投那劳什子新军！”刘氏哭得鬓发都不稳了，发钗掉在地上，仿佛给这场大戏敲鼓助威。\n“母亲，投新军是为国效力，如今大明风雨飘摇，我平阳侯府世受国恩，怎能尸位素餐一味享乐？”邬幸眼里也全是不舍和纠结，躲避着不敢看母亲的眼睛。\n“是啊夫人，幸儿这是懂事了，别人家的纨绔打着也不肯吃苦，幸儿自己肯去，这是好事啊！”邬铭忍不住开口，想要安慰老妻。\n显然他的安慰没有什么作用，听完这话，刘夫人哭得更厉害了，“什么好事！我半辈子就养下这么一个儿子！你如今让他去从军？那刀枪无眼啊！我的幸儿若是有个三长两短，我跟你这个没良心的老东西没完！”\n“夫人，幸儿去了也是先去军校，不会直接把他送上战场的。”\n“你看现在朝廷这四处用兵，幸儿能读多长时间的书？况且你还有脸说？人家孩子就算去，去的也是虚职镀金，你倒好，你要干什么？把孩子送去军校，然后让他去打仗？你到底有没有良心？你是不是在外面养了小的，看我们母子碍眼了！”\n邬铭被骂得闭了嘴，无奈地坐在上首，闭目不语，刘氏则开始了进一步的行动，把行李一件件拆开，扔在地上，不许邬幸走。"
TOD_STG.40.a:0 "平阳侯府的大戏也不知如何收场。"
TOD_STG.41.t:0 "消弭内忧（1）"
TOD_STG.41.d:0 "顺天的一家澡堂里，污浊的水里有几个精瘦的汉子靠着池子倚着，不时往肩上撩撩水，享受着难得的休息。休息得差不多了终于感到有些饿了，众人从澡堂里起了身，擦干净身子，穿好衣服去了对过的二荤铺吃饭。\n几个人进店坐下，一个约莫三十岁的男子走到灶台前对老板说，给我们炒一份软溜肉片，一份焦溜饹馇，一份干炸丸子，再打二斤酒，再拼一份下酒的菜。\n伙计接过钱，“好嘞，您几位先坐会儿，今儿人多。”\n热菜还没上来，几个人就着果仁喝酒，顺便扯闲篇解闷。\n“哎呀，真舒坦，早上可累死我了，大冷天的卸煤，还不敢多穿怕弄一身的灰，吹得我骨头缝都疼，这一泡可好多了。”\n“你就念佛去吧，我今儿倒是没卸煤，给什么学堂搬仪器去了，那玩儿意又让我们轻拿轻放，又让我们半天卸完，我可去他三舅妈的吧。”\n“他们又能上学了？不是说……”一个工人小声地说着，还有些心虚的扫了扫四周。“老秦你怕啥呀，这有啥不能说的，一个月之前就陆续复课了，这帮孩子也是可怜，估计吓够呛。”\n“这帮学生吃饱了撑的，活该，他们那么激烈能不……我听我工友说那个什么什么会，记不清了，在南边搞的什么土地改革……”"
TOD_STG.41.a:0 "可激进了，真是吓人。"
TOD_STG.42.t:0 "消弭内忧（2）"
TOD_STG.42.d:0 "“行了行了，老齐别说了，这和咱们有什么关系，咱就是抗大包的命谁来都一样，别说了。”秦治更害怕了，开口打断了齐期的长篇大论。\n店里的角落坐着的一个学生打扮的男生自然也是听到了这番话，略带愤怒地站起了身，似乎想要和齐期等人去理论，对面的女生却拉住了他，一双杏目中满是埋怨，“你怎么又这么气性大？他们说让他们说去！”\n“他们怎么能那么说……那能怪学长他们吗？”\n“不管有什么事都该依法守法，有什么事不能通过正常的渠道反应吗？”\n“正常渠道反应可得有用啊，我给海议员写信他回答的倒是挺好，然后呢？学校的廪食还是没法吃，我还得出来包饭。”\n“国家刚刚安定，咱们也得体谅国家啊，别生气啦，来吃个煎饺。”女生笑着把一颗煎饺喂到了男生的嘴边，男生脸一红，还想说什么早就忘到了脑后，“我们好好读书就好啦，我可不想秋哥你出什么意外。”"
TOD_STG.42.a:0 "盛世如所愿，何敢再为辞？"
TOD_STG.43.t:0 "联系四川"
TOD_STG.43.d:0 "巴蜀之地自顺天事变以降，局势紊乱，成都各方势力皆不能握全川之柄。今朝野议政之际，有识者皆言川中军政各派与我方渊源深厚，或可借力定策，以定蜀地。枢密院权衡利弊，拟遣密使入川，分携致川中诸将，晓以大义，明示顺天乃定鼎之基。虽未必强求川军出师襄助，然若能促其与庆逆绝交，亦为当务之急。\n况川地山河险固，粮秣充盈，倘若坐观成败，一旦中原鼎革，而川中仍与庆逆为伍，则祸患无穷。是故当趁乱世之机，以诚意结川中豪杰，或以封疆许之，或以兵械援之，令其知顺天乃民心所向。纵使川军不能北伐，亦当闭关自守，拒庆逆之策。如此则国朝可断庆逆一臂，而川地亦能免于刀兵之祸。待时局稍定，再图川中归心。"
TOD_STG.43.a:0 "敬候佳音"
TOD_STG.44.t:0 "四川回复"
TOD_STG.44.d:0 ""
TOD_STG.44.a:0 ""
TOD_STG.45.t:0 "四川同意"
TOD_STG.45.d:0 "捷音骤至，川中当局已允我方所请。成都方面复函称，愿与我方通力协作，即日起筹备与庆逆断交事宜。此行圆满达成所愿，全赖诸君谋定后动、折冲樽俎。川地山川形胜，粮秣充盈，若能弃暗投明，实乃中原之福。如今既得蜀中响应，南北声势可连成一片。庆逆势蹙，川陕联络一旦断绝，其根基必受重创。此乃大局之转机，亦是我方苦心孤诣之果。当速将此情通报各处，慰勉前方使团不辱使命，复议后续策应方略。"
TOD_STG.45.a:0 "好！"
TOD_STG.46.t:0 "四川拒绝"
TOD_STG.46.d:0 "川中复函，拒绝我方所请。成都政府明确申明，无意对西安一方采取禁运等掣肘举措，亦不愿在庆逆问题上有所动作。此诚为棘手之事，蜀中联络本是我方孤立逆党之关键，今既遭拒，南北声势难以连成一片。枢密院权衡利弊，当速思对策。川地粮秣充盈，若其继续向西安输送物资，庆逆根基必更稳固。我方虽谋定后动，然成都方面不予配合，后续方略恐需调整。\n川中既不肯对西安施压，我方亦当示以诚意，缓和两厢关系，待时局变化，再寻契机促其与庆逆断交。"
TOD_STG.46.a:0 "该死！"
TOD_STG.47.t:0 "拉拢漠北都司"
TOD_STG.47.d:0 "自顺天事变以降，岭北都司便盘踞塞外，坐视中原鼎沸，对朝野间与庆逆之争袖手旁观。今枢密院思虑再三，拟遣岭北督军徐树铮之挚友曾毓隽，偕其子徐道邻，率使团前往和林商议靖乱大计。此次遣使和林，旨在晓以利害，促其明辨局势。徐督军素怀雄心壮志，若能以大义相劝，以利害相陈，或可使其审时度势，弃暗投明。若岭北能与庆逆断交，我方亦可应允日后在军资、地盘等方面给予支持。此乃权宜之计，却可解当前燃眉之急，为中原大势争取转机。"
TOD_STG.47.a:0 "敬候佳音"
TOD_STG.48.t:0 "漠北回复"
TOD_STG.48.d:0 ""
TOD_STG.48.a:0 ""
TOD_STG.49.t:0 "漠北同意"
TOD_STG.49.d:0 "捷报传来，和林之行大功告成。漠北当局之徐树铮，已允与我方协同步调，与庆逆断交。此次遣使，曾毓隽与徐道邻不辱使命，往返驰骤，终得正果。徐督军素负时望，其决断自是高瞻远瞩。今既允弃暗投明，漠北军卒便可不再为庆逆张目。岭北屏障稳固，中原腹背之虞大减。枢密院筹谋良久，今得此佳音，大局可期。当传令各处，嘉奖使团之功，再图下一步方略。"
TOD_STG.49.a:0 "好！"
TOD_STG.50.t:0 "漠北拒绝"
TOD_STG.50.d:0 "漠北当局复函，称暂难依我方所请。徐督军虽表通好之意，然明确申明无意针对西安一方采取禁运等压制手段。枢密院复盘和林之行，始料未及漠北持此态度，料其考量北方局势均衡，不愿轻启边衅以授庆逆可乘之隙。今既如此，岭北运输线仍可顺畅，庆逆虽东进受阻，却亦能借道漠北获取补给。枢密院权衡利弊，暂议按兵不动，先稳住漠北现有态势，再图后手。徐督军既不肯对西安施压，我方亦当示以诚意，缓和两厢关系，待时局变化，再寻契机促其与庆逆断交。"
TOD_STG.50.a:0 "该死！"
TOD_STG.51.t:0 "联系西南"
TOD_STG.51.d:0 "滇地蔡公松坡坐镇西南，素以名将著称，麾下士卒皆为国朝精锐之师。诸多将领曾在欧战及天竺战场立下战功，闻名遐迩。然蔡公虽有大志，与我方却隔山水之遥。若能以利相诱，或可说服其与庆逆决裂，达成临时合作关系。当前之际，当遣使者携厚礼前往昆明，向蔡公陈以利弊。告知其庆逆终难持久，天下大势所趋，顺之者昌，逆之者亡。若蔡公能与庆逆断交，我方可助其巩固滇地，扩充实力。\n如此一来，西南可暂安，中原战局亦能缓和。待时机成熟，再图滇地归附，共襄盛举。滇地山河险要，民风剽悍，若能与我方携手，实乃天下之幸。"
TOD_STG.51.a:0 "敬候佳音"
TOD_STG.52.t:0 "西南回复"
TOD_STG.52.d:0 ""
TOD_STG.52.a:0 ""
TOD_STG.53.t:0 "西南同意"
TOD_STG.53.d:0 "捷音传至，昆明之蔡公松坡允诺与我方协同步调，断然绝庆。此次出使滇地，往返驰骤，终得正果。蔡公素负时望，麾下精兵劲卒，今既允断庆，滇中门户可期稳固。枢密院得悉此情，嘉勉使团不辱使命。蔡公既允断交，滇中粮秣器械不再资庆，南北声势渐成合围之势。当速传令使团，稳住滇中现有态势，再图后续策应方略。"
TOD_STG.53.a:0 好！
TOD_STG.54.t:0 "西南拒绝"
TOD_STG.54.d:0 "西南滇地之蔡锷，复函拒我所请。其言辞恳切，然立场分明，无意对西安一方施以禁运等掣肘之举。蔡松坡此举，或虑滇陕关系恶化，引致边疆不稳；或恐树敌过多，致庆逆寻机报复。然滇黔联络本是我方孤立逆党之关键，今既遭拒，南北声势难以连成一片。我方虽谋定后动，然滇中不予配合，后续方略恐需调整。\n当务之急，为先稳住滇中现有态势，再图后续。待时局变化，再寻契机促其断庆，以期南北同心，共驱逆党。"
TOD_STG.54.a:0 "该死！"
