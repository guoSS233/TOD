TOD_STG.79.t:0 "书房中的思考（1）"
TOD_STG.79.d:0 "蓬莱侯府书房，吴佩孚身着一件半新不旧的长衫，坐在书桌后读着《孟子》，读到“世衰道微，邪说暴行有作，臣弑其君者有之，子弑其父者有之。孔子惧，作《春秋》。《春秋》，天子之事也。是故孔子曰：‘知我者其惟《春秋》乎！罪我者其惟《春秋》乎！’”时，不禁掩卷长叹。\n他不是只会打仗的武夫，他也读过书聆听过圣人之言，可是他更喜欢的一句话是“了却君王天下事,赢得生前身后名”。他少年时，正值明俄开战，学院的夫子们便时常在课业之余给他们讲些时事开拓眼界。他极爱听这一节，边听边想，当初宋金之战、宋元之战，金元不过一蛮夷异族，尚且致使神州陆沉，那罗刹呢？若是有一天罗刹有一雄主，举兵数十万进攻大明，该如何是好？宋朝的读书人，书读的极好，文章做的极好，可是金兵南下，徽钦北狩赵构南渡，中原父老南望王师终究魂蚀骨销。再后来蒙元崛起，最终，连半壁江山都保不得了，那些所谓法统如何、道统如何、这一章句该当何解的先贤之论，也大都随着崖山之劫……"
TOD_STG.79.a:0 "没入了历史的尘埃。"
TOD_STG.80.t:0 "书房中的思考（2）"
TOD_STG.80.d:0 "吴佩孚不知道如果没有太祖高皇帝，神州丧于外敌数百年之久会如何？自己还会有圣贤书可读吗？汉人可还能记得自己的祖先吗？怕是连这发髻和衣冠都保不住了，汉儿尽作胡儿语，却向城头骂汉人！他想了很久该当如何，最终决定投笔从戎。他要用自己的剑守卫大明的领土！\n他从基层干起，九死一生挣得蓬莱侯的爵位。时至今日，英俄这些大明曾经的大敌早已却悲哀地发现，当战争来临时，他可以替大明遮挡风雨，当战争结束后，他就是大明的风雨。废帝如此想、那些只会聒噪的文人这么想、如今，就连锦王和武备系也这么想了。\n可是他没有退路，也不能退，如今大明板荡，如果不能尽快消灭逆党，后果不堪设想，天知道广府的大同会会和他们臭味相投的异国“同志”达成什么损害天朝的协议？至于南京的太孙和他身边的管学系，他们如果价格合适，大概可以把天朝的国之重器尽数卖与洋人。他没有时间去协调和勾兑了，他必须得立刻建立一个高效的体制，然后消灭逆党，让大明请重新恢复他的无上荣光！\n想到这，他终于下定了决心，既然武备系谈不拢，那就先不谈了，他用手拿起电话，拨号给了自己的政务秘书，"
TOD_STG.80.a:0 "“枢密院的细则你们敲定好了吗？”"
TOD_STG.81.t:0 "校内闲谈（1）"
TOD_STG.81.d:0 "顺天的某所恢复宁静的学校里，下了课的学生们结伴往食堂走着，一个戴着围巾的男生神秘地给旁边的女生讲着故事，“……吕雉死前告诫吕产吕禄不要为自己送葬，不要去皇陵！可是吕禄吕产毕竟年轻没有听从。后来周勃、陈平等私下密谋策划，设计让上将军吕禄交出了兵权。周勃、陈平通过典掌皇帝符节的襄平侯纪通获得兵符，诈称皇帝敕命太尉统领北军。周勃进入北军军中，号令“拥戴吕氏的袒露右肩，拥戴刘氏的袒露左肩！”。大家纷纷袒露左肩，呼声震天。周勃顺利地将北军控制。接着，陈平再让周勃协助刘章控制南军，并严守军门。下令平阳侯曹窋转告禁军卫尉不准吕产进入殿门，周勃命令朱虚侯刘章率兵千人以进宫护卫皇帝为名，伺机捕杀了统率南军的吕产。”\n女生一直低头听着，脸上渐渐浮起一丝笑意，待男生讲完一节，仰起脸笑问道，“学长，你说的周勃是哪里人啊。”\n男生闻言有些发愣，摸了摸下巴，“啊？周勃当然是沛县人啊。”\n“哦？是吗？不是山东人？”\n“嗨，我说你问这个干嘛，不许恶意联想啊。”\n“哪里恶意联想了，我这是地理学的不好找师兄你请教嘛。”女生狡黠一笑，“话说安刘氏者必勃也，周勃真是大汉的国之柱石啊，帮助刘邦夺取天下讨平诸国……”"
TOD_STG.81.a:0 "后来又平定诛吕扶保大汉社稷。"
TOD_STG.82.t:0 "校内闲谈（2）"
TOD_STG.82.d:0 "“那的确是扶保，惠帝愣是有好几个假儿子，没有周勃陈平，大汉可如何是好？”男生此时一副一本正经的样子，仿佛他真的相信一般，说完之后他又故意做出仿佛意识到了什么的样子，“你最好真的在说大汉。”\n女生被逗的咯咯笑了起来，笑够了之后开口问道，“可是学长你说，当初在刘邦面前诋毁陈平最起劲的就是周勃，说人家是小人，还造谣人家盗嫂，你说这孟光几时接了梁鸿案啊？”\n“学妹啊，你忘了“天下熙熙，皆为利来；天下攘攘，皆为利往”，周勃做寿，陈平送了五百金祝寿，两个人亲亲热热喝了一顿酒，从此就是合作共荣的好战友了嘛，你看，周勃被文帝刁难，不还是陈平打的圆场。”\n“真的是圆场吗？”\n“以今度之，想当然耳。至少报纸上的信息，双方还没有什么矛盾而且合作的不错吧。”男生整理了一下自己的围巾接着说到，“你看新发布的内阁名单，别的都是虚的，权力的分配可是实实在在的。”\n“也对，我看那几个职位实权也不小，双方看来谈的不错。”女生若有所思的点了点头，“况且总不能再上演一次……那也太……”"
TOD_STG.82.a:0 "“是啊，我们一向以和为贵”"
TOD_STG.83.t:0 "御前议政"
TOD_STG.83.d:0 "春意初绽，御前议政会议在太和殿召开。百官列席，气氛庄重。定武帝朱镕坤踞坐龙椅，目光如电，扫视群臣。勋贵元老吴佩孚位列首席，身姿挺拔，气度沉稳。\n会议过半，吴佩孚出列，拱手道：“陛下，臣奉旨梳理朝堂人事，经数月考察甄别，已拟妥一批官员任免名单。”他徐徐展开奏折，朗声读道：“原直隶巡抚白坚武，政绩斐然，拟升任内阁大学士；山海关指挥使董政国，治军严明，拟调任京师卫戍司令……”\n定武帝微微颔首，待吴佩孚读罢，淡然道：“吴卿操劳多时，辛苦。不过，朕近来也留意到几位卿家表现不俗。”他稍作停顿，目光掠过吏政部尚书吴景濂。\n吴佩孚心下一凛，面上却不动声色：“陛下察纳四方，臣等惭愧。不知陛下心中有何人选？”他微微前倾，似是倾听。\n定武帝轻咳一声，慢悠悠道：“吴景濂在吏政部多年，经他手的官员任免，少有差错。朕想将他调任内阁大学士，以彰其功。”\n吴佩孚暗思吴景濂向来行事稳健，若入内阁，于他掌控人事并无妨碍。便拱手道：“陛下圣明，吴尚书干练稳健，调任内阁实至名归。臣即刻依旨办理。”\n定武帝微微一笑，又道：“财政部尚书张国淦，操持钱粮，算无遗策，朕欲令其接任吏政部尚书。”此言一出，吴佩孚眉头微蹙。张国淦理财虽精，却与吴佩孚在赋税政策上多有分歧，若是调任吏政部的话……\n他稍作沉吟，笑道：“陛下圣明，张尚书理财确有一手。只是吏政部尚书一职，需统筹全国吏政事务，张尚书毕竟未在吏政部工作过……陛下如欲要拔擢信任吏政部尚书，可从吏部的几位侍郎里挑选”说罢，从袖中取出另一份资料。\n定武帝接过资料，浏览片刻，抬眼道：“张卿能力出众，又得朕信任。吴卿不妨再仔细斟酌。”\n吴佩孚心知此刻不宜强推己意，便顺势附和：“陛下所言极是。臣即刻安排张尚书熟悉吏政部事务，待交接完毕，即可上任。”待议程过半，定武帝轻咳一声，道：“今日所议人事，甚为重要。吴卿，卿等所拟名单，还需再打磨几日。待朕与诸位爱卿仔细商讨后，再行定夺。”吴佩孚闻之，拱手应道："
TOD_STG.83.a:0 "“臣谨遵圣旨，力求尽善尽美。”"
TOD_STG.84.t:0 "《大明政治调研报告》（1）"
TOD_STG.84.d:0 "法兰西某所大学，学生们三三两两地坐在教室中，聚精会神的听着课，时不时的记着笔记，希望自己的努力可以让自己按时毕业。\n“我们所述之‘共和’来自于希腊语“Πολιτεία”。”教授说着在黑板上写下了这个词，“被西塞罗翻译为拉丁语词汇‘res publica’意思是‘公共事务’或者说‘人民事务’，意味着一个政治权力通过其代表由公众（人民）掌权的国家。”\n“当然，在历史中，共和制的情形有许多种，我们将在今后的章节中为大家详细介绍，此外，近年来，随着我们与明国某些学者的交流增多，我们了解到了他们对于共和，他们也叫他‘天下为公’的理解，这一部分，以及他们最近的实践，我们将作为本课程的补充内容为大家介绍。当然，大家如果感兴趣的话，课程论文也可以选择这个主题。”\n“斯迪克多先生，请问你有什么疑问吗？”教授看到了坐在第三排的一个男生举起了手。\n“教授，我刚刚听到了您在解释“Πολιτεία”和“δημοκρατία”的区别，我在明国交流的时候听到他们对共和，我是说‘共和’这个词所对应的中文的另一种解释，在中国的周王朝时期，国人赶走了他们的国王，随即由两位贵族联合执政，请问这是否可以称为一种共和制。”\n“很好的问题，斯迪克多先生，关于这个问题我不打算直接给各位答案，希望各位讨论一下，以加深我们对于这一课的理解。”"
TOD_STG.84.a:0 "东方的共和？"
TOD_STG.85.t:0 "《大明政治调研报告》（2）"
TOD_STG.85.d:0 "“很好，我们结束了本课程的全部学习，很神奇，我们所学习的概念与知识贯穿了数千年，并且不断变化，他不是单一的不断前进，但尼罗河也不会倒流，他就像波浪一样，是不断起伏前进的。”教授翻过了最后一篇讲义，“当然，先生们女士们，不要着急离开教室，我们毕竟不活在柏拉图或者西塞罗的时代，我们再来讲一些和这个时代有关的案例。”\n“明国最近的巨变相信各位同学们已经有所了解，那么同学们认为现在的顺天政府是一个怎样的政体呢？”教授停顿了一下，将讨论留给了在座的学生。\n学生的讨论十分激烈，有人认为是君主制，也有人认为是二元君主制，在认为是邦联制的学生被不懂幽默的同学们奇怪的盯着最终尴尬闭嘴之外，大家对讨论有了一个基本共识。\n“大家都同意这个结论吗？”\n“我不同意大家的观点，事实上我认为顺天政府的制度应该是共和制，”一个金发的男孩有些犹豫的打断了他们，在同学们的低语中他继续说道，“我问过斯迪克多，他说明国的政局并不完全由他表面上的官员和统治者掌控，在政变后，真正掌握政权的是一些所谓的“元老”们 ，皇帝的产生也是由元老们通过某种方式推选的，同时他们也有“咨议会”。我认为明国更接近于威尼斯共和国。”\n“很有意思的观点”教授的眼中流露出了赞许的目光，“我今天最后举的这个例子是希望大家在今后的学习和研究中能够记住，我们虽然是某一专业的学生，但是去认知世界只靠着一个学科的知识是远远不够的，我们要扩展自己的眼界，要更加全面的了解我们的所研究的国家，而不是拘泥于某一种形式，某一个名词并以此沾沾自喜……”\n“两个名字相同的事物可能相互对立，而……”"
TOD_STG.85.a:0 "“两个名字毫无关系的事物可能有着共同的内核。”"
TOD_STG.86.t:0 "精诚团结（1）"
TOD_STG.86.d:0 "太和殿的大朝会之上，看着一片和谐的臣子们，定武帝朱镕坤不易察觉的皱了皱眉，他虽然不像哥哥一样自小接受帝王教育，但也不至于天真到认为外敌当前，所以朝廷的衮衮诸公就会团结起来共赴国难。他们没有继续像顺天大会一样吵闹不休，那自然是有人已经替他们统一了思想。朱镕坤猜度着“为自己分忧”的臣子是谁，下意识的摩挲起袍袖边缘精致的绣文。\n虽然提出议案的人出身不同背景复杂，但是背后的忠臣是谁并不难猜，谁得利最多，那大概谁就是这些这些话的主人了。朱镕坤心中已经大致有了一个答案，高处不胜寒，他坐上这个位置，才明白了当初父皇的不易。\n在座的亲信自然也感受到了不对，向他投来了询问的眼神，定武帝微微摇摇了头，示意大家不必出头。杨永泰的眼神有些焦急，定武帝却不再看他，以免自己再受影响。定武帝强迫自己把精力转回了议案上，仔细的听着臣子们对于时局的构想。他决定先看看形势，可惜杨永泰却不是懂得韬光养晦之人，见议案无人反对，便自己站出来质疑。杨滔滔不绝巧舌如簧，将不少提议者驳的哑口无言……"
TOD_STG.86.a:0 "但毕竟双拳难敌四手，很快便落入下风。"
TOD_STG.87.t:0 "精诚团结（2）"
TOD_STG.87.d:0 "定武帝努力集中精力，却不可避免地想起了多年前，也是这样的一个冬天，自己微服出行，在某个小饭庄“偶遇”吃着火锅的吴佩孚和他的几个部下，自己不由分说地坐下加入其中，几轮酒就把原本绷着的众人喝的开始和自己勾肩搭背谈天说地。后来的很多年，他都有在隆冬请相熟军官吃涮锅的习惯，少则几人，多则十几人，并非只是为了笼络人心，更是他在这一方天地中难得的一份放松。可惜，如今再无人敢和他同锅而食了，以免惹“染指”之嫌。\n吴佩孚坐在离朱镕坤最近的几个位置上，看着新帝努力强作平静却越来越快地揉搓着袖边，暗暗一叹，虽然早有预料，但他之前仍旧心存君臣相得的幻想。奈何勋贵们也是被胜利冲昏了头脑，做得有些过了。当今天子更是个大权独揽的性子，怎么可能不作他想？这是提议还是示威？\n“既然诸卿意见纷杂，这几项事就三日后再议吧。”定武帝特意在纷杂上加了重音，随即结束了这场御前会议，暂时搁置了这几项提案。\n宫巷上，落后于众人几步的张寿镛用只有两人能听到声音轻问徐世昌，“你说蓬莱侯他们是何用意？”\n“想要陛下做圣主明君罢了。”\n“何谓圣主？”"
TOD_STG.87.a:0 "“聖者，声也，言闻声知情。”"
TOD_STG.88.t:0 "沂州府新制（1）"
TOD_STG.88.d:0 "沂州府的直属办事处，自大乱后一向冷清，今日却热闹非凡。仔细观察的话可以发现，来往的人群里不乏脸上略带胆怯和窘迫者，显然，他们并不常常来此“肃穆”之地。一个身着短褐的男子好不容易排到了小吏面前，勾着腰挤出一个笑脸，恭敬地将一张纸递给了小吏。小吏没有抬眼，接过纸张一看随即将纸还给男子，“第三项写的不对，重填吧，下一个。”男子听言有些着急，“大人，您上次没说这个不对啊，我这已经改了第三回了，我下午还要回县，您能不能告诉我到底怎么填，您能不能通融通融。”说着变戏法般从他并不宽大的袖子里变出了一个信封，压在申报书下再次推回小吏手底下。\n“快拿回去，你把我当什么人了！你这就是不合格，并非我故意为难与你，别再纠缠了，后面还那么多人等着办事呢。”\n男子悻悻收回了手，并不热的天气里竟是生生急出了一脑门的汗，他就是个卖布料的小老板，因为当过几年兵为人又热心所以被邻里推为了水龙队的队长，他哪里弄的明白这些东西。\n本来这东西官府也不深管，但上月兰陵县县令催粮太过，为了立威逼死了一个农妇，这在大明本也算不得什么大事，何况现在是非常时期。可事情坏就坏在农妇家成年的儿子有五个，娘家更是六七个兄弟，十几个内侄，抓着催粮人一顿好打，催粮官被抬回去当天就咽了气。知县也是个不省事的，闻之大怒，随即派人缉拿闹事者。可闹事者怎会束手就擒？恰逢县令把兵都派去抓人，乡里和村里一直对催粮不满的人趁机联系了城里的水龙队，趁夜点燃县衙，借救火之机攻了进去……"
TOD_STG.88.a:0 "把县令砍了。"
TOD_STG.89.t:0 "沂州府新制（2）"
TOD_STG.89.d:0 "此事自然是惊动了省府和中央，在平乱之后把知府批了个狗血喷头。要不是他在朝中有人，恐怕早就收拾铺盖走人了。痛定思痛之后，朝廷得出的结论有二：其一官府管的太宽了，都是管学系堕落的自由化思想的错；其二，县令们都是成事不足败事有余的废物，所以要求他们这些乡勇街约水龙队全都要到知府登记统一管理。\n男子想着事没注意撞到了一个戴眼镜的人身上，他正要道歉，却听到对方先开口了，“老兄需要帮忙吗？我看老兄急得满头是汗，这申报手续确实复杂，小弟可以代劳一二。”\n“先生润笔几何？”男子自然知道这代办们揽活不是免费的。\n“20龙元您看如何？您晚上滞留于此住店吃嚼都是花销，不如把这钱花在我这，您也好落得省心。”\n“行，那就烦请先生，先生尽快。”\n眼镜男子干活倒的确利索，不出一个时辰，手续办完，文件交割明白，男子道谢之后就回家了。到了中午，趁着休息时间，戴眼镜的男子转出办事处，回到不远处的家中。妻子见他回来，把早已准备好的饭菜端上来，自己也坐下挟了一筷子肉炒豆橛子放到碗里，“我哥哥今天托人跟我说，最近朝廷管的严，你要小心，不要和人家起冲突，最近也不要去他府上。”\n戴眼镜的男子点点头表示自己知道了。"
TOD_STG.89.a:0 "“管的严是好事。”"
TOD_STG.90.t:0 "内阁全武行（1）"
TOD_STG.90.d:0 "顺天的深秋，细雨如丝，却被寒风裹挟得凛冽刺骨。内阁值班室的年轻秘书们望着窗外那无休无止的雨幕，个个焦躁不安。他们时不时地瞥向会议室紧闭的大门，心中默默催促着议程尽快结束。终于，一个面白须净的年轻人按捺不住，起身找到负责会务的柳绵，央求她再去续茶。\n柳绵自然明白这些秘书们等得心焦，想让她去看看情况——毕竟谁不想早点回家呢？不过，伸手不打笑脸人，更何况是前途无量的年轻人。“等不及了就推我去出头，你们也不害臊？”她打趣道。那年轻人连忙陪笑：“不害臊，不害臊。您去是职责所在，我们要去的话……”尹涪扬头指指会议室，“要是被那些性急的部长们抓到偷听军机大事，可担当不起。”柳绵看了看座钟，时间倒也差不多了，于是点点头，带着组里其他人走向会议室。\n柳绵走到会议室门口，正打算轻轻叩门，突然一声闷响——会议室的门被砸开，一个烟灰缸径直飞出，落在她的脚边。好在大门挡了大半力道，她才没受伤。所有人的目光都被吸引了过来。众人尚未回神，内阁会议室中，一道矫健身影自长案后跃出，径直扑向对面。内阁成员们看得很清楚，那正是新任的军事参赞孙传芳，此刻他如同野兽般扑向施从滨，而施从滨便是先前投掷烟灰缸之人。\n“施从滨，你个老东西还敢拿烟灰缸砸我！”孙传芳一个健步冲到施从滨面前，揪住他的脖领子，挥拳便打，“你也就这点本事了！”\n话音未落，拳头便要落在施从滨的脑门上。好在施从滨也是行伍出身，略一偏头，躲开了这当头一击，只是眼角还是挨了一下。\n施从滨本就气得不轻，如今挨了孙传芳一拳，不禁气血上涌。他老夫聊发少年狂，伸手也揪住孙传芳的领子，想要还击。可他毕竟快七十岁了，哪里是孙传芳的对手，几下就被按在地上。"
TOD_STG.90.a:0 "这就是武人内阁？"
TOD_STG.90.b:0 "殿前武斗，大明传统罢了"
TOD_STG.91.t:0 "内阁全武行（2）"
TOD_STG.91.d:0 "这时，“刚刚”反应过来的众人也不敢再看热闹了。张其锽和董政国迅速上前架住孙传芳，而刘玉春则快步上前，将施从滨从地上扶起。孙传芳怒火未消，在挣扎中甚至带得张其锽一个趔趄，眼看便是要再度动手。\n“都别打了，大明内阁难道是土匪老巢吗？！”吴佩孚的怒喝如晴天霹雳，瞬间震慑了全场。他大步流星地走到孙传芳和施从滨中间，双手一分，将二人强行拉开。孙传芳还想挣扎，吴佩孚却似铁塔般挡住他，怒目而视：“孙传芳，你这是做什么！内阁是议政之地，不是你泄愤的擂台！”孙传芳被他这一喝，终于清醒了几分，但仍怒气冲冲，甩开张其锽的手，叉腰而立，大口喘着粗气。\n施从滨被同僚扶起，调整好衣衫，却也不甘示弱，指着孙传芳骂道：“你这莽夫，逞一时之勇，成何体统！”\n吴佩孚随即将矛头转向施从滨：“施大人，您是长辈，何必与他一般见识！有不满会议桌上说不清吗？”在吴佩孚的训斥下，二人情绪逐渐平息。会议室里，众人纷纷谴责这种不理智的行为，会议也因此中断，众人散去，留下一片狼藉。"
TOD_STG.91.a:0 "有话还是要好好说嘛"
TOD_STG.92.t:0 "风月鉴第三版"
TOD_STG.92.d:0 "近日内阁之大臣施从滨眼角似有淤青，报界同仁询之，则曰为其幼孙所伤，然本报细查之下，恐其中另有隐情。\n实内阁会议之时，有会务名柳青者年方二九，肌肤莹润手若柔荑，施色胆包天，言语轻佻，孙见之不屑，以正言弹之。施恼羞成怒，以茶壶扔掷孙传芳，孙躲避不及，满头茶叶实为狼狈。孙气急，以手揪施从滨领，重殴三拳，施躲避不及，以致眼角淤青。"
TOD_STG.92.a:0 "权当消遣罢了"
TOD_STG.93.t:0 "圣心独断"
TOD_STG.93.d:0 "吵吵嚷嚷的顺天大会结束后，朱镕坤回到了自己日常办公之处，他坐在那张随着自己一起搬来的巨型地图前，却没有像以前一样静下心来。他揉了揉眉头闭目假寐，可白天大会的情景却更加清晰的出现在他眼前。武备系的慷慨陈词、新勋贵的老成谋国，无非都是为他们攫取利益的行为披上一层华丽的外衣，如同他们身上的官服一样。那些如同恶狗争食般的面孔，伴随着他们今日的言行犹如恶鬼般扭曲着向心下越发烦躁的朱镕坤逼近，他猛地睁开了眼睛，重新将目光投向了地图。\n好在，他们二者的纷争不休，让自己有了分化拉拢的机会，虽然可厌，但对自己来说，正是收回权力定于一尊的好机会。他并非刻薄寡恩之辈，也明白他们忠于大明，愿意将大明的教化遍施四方，才会随自己行非常之事，只是这忠心中掺杂着一些私心罢了。他不求自己的身边全是无偏无私的贤者，论大功者，不录小过，举大美者，不疵细瑕。没有人不会犯错，也没有人不会有私心，自己做为天子，只需好好引导他们，防微于前，让他们能大明效忠的同时保住自己的富贵荣华，君臣一心重铸大明荣光。\n群臣时不时利令智昏，需要君父不时加以提醒和约束，万民则从来人云亦云，看不清真相，虽然几十年来一直有乱党鼓吹应赋权与民，但这无异于将孩童置于烈马之上，他们抓不住缰绳，也无法控制这匹烈马，最终的结果便是皇明荣光不再，国家分崩离析，百姓自己也要遍尝战乱之祸，流离之苦。乱党们看上去痛心疾首，然而毫无办法。\n朱镕坤将目光从地图上移开，轻叹了一口气，自己一向反对乱党们的邪说，早已成为他们口中冥顽不灵之辈，如今行非常之举，怕是很多本来支持自己的人，都认为自己是犯上作乱之徒，然而周公诛管蔡而周室安，季友鸠叔牙而鲁国宁。他不后悔也不愧疚。"
TOD_STG.93.a:0 "受国之垢，是谓社稷主；受国不祥，是为天下王"
TOD_STG.94.t:0 "约谈蓬莱侯"
TOD_STG.94.d:0 "顺天街面上恢复了热闹，虽然变乱过去不久，但是勋贵们家家摆酒的喜气还是让百姓们沾了些去。有人哭便有人笑，顺天城里从来不缺这样的戏码，日子总还是要过。喜气沾的的多了，很多言语也便随着送货的小贩、帮忙的力夫甚至手艺好的大师傅从高门飘进了民间。有好事者，甚至模仿护官符作“蓬莱有仙山，汉武遣使献”之语。这些话语自然通过有心无心之人的言语也传进了朱镕坤的耳朵里，所以他邀请仙山，啊不蓬莱侯小叙一番。\n吴佩孚坐在武英殿的椅子上有些心急，虽然陛下没来，但他也不敢太过放松，只能正襟危坐，这个滋味对于已过不惑之年的他来说并不好受。好在这个时间没有持续太久，在他开始胡思乱想的时候，一抹明黄色伴随着唱名，定武帝终于出现在了他的面前，他如临大赦般的急忙起身行礼，趁机活动一下自己已经有些酸痛的身体。\n朱镕坤含笑扶住吴佩孚，将吴佩孚送回座位坐下，吴佩孚对朱镕坤如此“礼遇”颇有些手足无措，赶忙打算站起，却被朱镕坤用力按回，“子玉太拘谨了，你我君臣相识多年，不必如此。”\n吴佩孚见此无法，只得恢复之前的坐姿，“不知陛下召臣何事。”话一出口他便自知失言，不知是定武帝的举动还是等候的焦急让吴佩孚失去了一贯的沉稳，在定武帝开口前便出言询问。\n好在定武帝并未以此为忤，仍旧带着笑，“国家新定，朕最近遇到一件难事，想请子玉为朕参谋参谋。”说着，将手里一份简报递给了吴佩孚。\n吴佩孚看着简报上充满想象力和文采的路边社故事选，头上开始冒汗，他大概已经知道今天定武帝邀请自己到底是所为何事了，“这，陛下，臣绝无……”\n“朕知道，子玉一向恭谨，不会口出此言，这都是坊间好事之人的挑唆罢了。朕只是感慨，朕读史书的时候常常好奇，为何很多君主会被蒙蔽，自断肱骨，如今看来，君臣相知何其之难啊。”朱镕坤出言安抚，但脸上的表情却逐渐转为严肃，“臣子做了高官之后难免得意忘形，不断触犯国法，韩信、彭越遭到杀戮，难道只是汉高祖的过失吗？国家最重要的事情，只有奖赏与处罚。分外的恩惠，不能给得太多，要严格要求自己，别做后悔不及的事。”\n“是，臣一定谨身自修。”吴佩孚的嘴唇颤抖着想说什么，但最终也只挤出这干巴巴的几个字。\n“朕就知道这事找子玉参谋一定能成，相信有子玉这个楷模在，勋贵们都会效仿的，”笑意重新回到了朱镕坤的脸上，\n“对吧”"
TOD_STG.94.a:0 "“自然，为人臣者，忠也。”"
TOD_STG.95.t:0 "整顿军事"
TOD_STG.95.d:0 "乾清宫中，定武帝盯着一份电报，面色沉的几乎要滴出水来，电报上的日期是三天前，标着急电，可是他今天才接到这份极为重要的电报。好消息是，战事并未因此被耽误，坏消息是，战事没有被耽误的原因是已经有忠良之士替自己做了决定。 定武帝禁握着电报，强忍住将它团成一团的冲动，本能地想要叫进来自己的枢要秘书（机要秘书）臭骂一顿，他知道，拖延敷衍是这些人的常态了，永远是卡着时间上交文件，自己一向懒得深管，如今居然胡闹到贻误军机了，但随即他放弃了这个念头。这封电报出现的时间太巧了，它恰好在命令发出前出现在了自己的桌子上，却又刚好让自己除了同意外别无其他选择，除非自己不顾前方军务执意反对。定武帝不相信这是一个秘书或是几个人能完成的，显然，这是一场精心的试探，那么会是谁在背后呢？定武帝的心里已经大概有了答案。 \n把手中已经握出折痕的文件放下，定武帝长出了一口气，一边一寸一寸的将电报重新抚平，一边思索着对策。待到完全心平静气下来，他才叫进了自己的秘书，让他召蒋雁行前来，自己要和他商讨一下情报系统改革的事情。 \n定武帝自然不会和蒋雁行商讨什么情报系统改革，而是让他去调查一下这封电报背后的猫腻。\n“锦衣卫中一向各方势力鱼龙混杂，如今形势复杂，”定武帝拍了拍蒋雁行，叹了口气“朕也不敢全然相信，国事艰难，他们还是如此视军务如儿戏，借此弄权，唉，如今全靠宾臣你了。”\n“臣必不负陛下重托！”蒋雁行看着虽然不再年轻但仍然如同初遇时一样热血沸腾又忧国忧民的定武帝坚定地点了点头，士为知己者死，陛下如此重托，自己绝不可以辜负！\n调查进行地很顺利，毕竟所有人都认为这件事已经过去，有一二头脑清醒者，也认为定武帝是迁怒于情报系统，打算借此机会火中取栗。\n就在所有人聚焦于情报系统的人事调动之时，一份令人震惊的“升迁令”，定武帝的机要秘书，荣升“战争伤亡将士褒奖与抚恤事务处置使”。\n此时如梦初醒的各方势力才明白定武帝又使用了一个他惯常喜欢的战术——声东击西，可就在各方或为之前的行为惴惴不安，或为失去一个盟友感到惋惜时，定武帝又做出了一个出人意料的举动—真的调整情报机构的结构。\n看着为自己的行为不断惊疑猜测的臣僚们，定武帝非常满意。他不喜欢让臣下揣测圣意，君臣之间应当坦诚相待。"
TOD_STG.95.a:0 "他们只需要做自己让他们做的就好了。"
TOD_STG.96.t:0 "庙堂之高"
TOD_STG.96.d:0 "“你一个小辈，你懂什么？开始对军队的事情指手画脚起来了？我打仗的时候你还吃奶呢！”\n定武帝登基后的第一次御前会议上，各方人马在经历“团结”的顺天大会憋了一肚子气后，又一次聚在一起商讨事件，并不长的间隔没有解决各派利益上的矛盾，棘手的各项事务反而加剧了冲突，憋了一肚子气的众人很快便由相对拘谨的陈述意见变成了热烈交流。在孔祥熙对勋贵们提出来的加紧提升产能以剿灭乱党的要求表示，“哪里慢了？这么多年都是很有效率，不要睁着眼睛乱说，国企很难的……有时候找找自己原因，这么长时间战线没有变，有没有认真平乱”之后，曹锟终于再也忍不住了，跳出来劈头盖脸一通痛骂。\n可惜开会这种东西就像打仗，空有一腔孤勇是不行的，总要讲些策略。曹锟骂的是爽了，但却并没有什么道理，无非摆资历，因此很快便被武备系抓住了话头，周学熙用眼神示意也想出头的后辈稍安勿躁，待到曹锟坐下才站起来缓缓开口道，“仲珊这话就不对了，韩昌黎有言，生乎吾前，其闻道也固先乎吾，吾从而师之；生乎吾后，其闻道也亦先乎吾，吾从而师之。吾师道也，夫庸知其年之先后生于吾乎？是故无贵无贱，无长无少，道之所存，师之所存也。”周学熙顿了顿，看曹锟没有反应，接着像是想起什么一样，补充了一句，“怎么？仲珊那些清客们连这都没给仲珊讲过吗？”\n曹锟年少家境微寒，少即失学，当过几年小贩随即投军，几经生死挣得功名利禄以后也请了不少先生为自己讲授文数知识，近年来年纪渐长更添了写字作画修身养性的习惯。但他毕竟不是周学熙这样从小家学渊源的人，一时没有反应过来，此时见周学熙拿着这点当面嘲讽，不禁气的面皮紫涨，“周学熙你说事便说事，不要扯这些有的没的。这些满口之乎者也没有半点用！”\n定武帝眼见两个白发老头越吵越欢不便直接斥责，只得出言圆场，“有话好好说……”\n一语未毕，失了分寸的周学熙认为这是定武帝有意偏向自己，随即站起来继续嘲讽，“仲珊观点真是新奇啊，韩昌黎只会知乎者也？韩昌黎为裴晋公出谋划策从平淮西。我请问仲珊，军队打算什么时候光复中都呢？”\n“凭是谁，就算姜子牙转世遇到一群什么也生产不了只会叫嚷的废物也是打不赢仗的！军队没有子弹拿什么和叛军打仗？靠烧火棍？复三代之治血流漂橹吗？”曹锟接连丢脸也被嘲讽上了头，不顾旁边吴佩孚的几次暗示，站起来指着周学熙鼻子大骂。\n“够了！”定武帝一声怒喝从桌后站起了身，过于激动的动作甚至推倒了桌子，“今天会议是让你们议事，不是让你们吵架来的！周学熙、曹锟忿争御前，各自闭门悔过去罢！”\n定武帝的怒吼让周学熙的理智回了笼，意识到自己失态，随即领旨谢罪准备退下，曹锟却仍不肯低头，直直站在那里不肯答话。\n定武帝的怒气更甚，“曹锟，你没听到朕的话吗？”\n吴佩孚见此情景不得不硬着头皮出来打圆场，“陛下息怒，曹仲珊他年老糊涂，陛下不要……”\n“年老糊涂，倒的确是个不错的理由，”定武帝冷哼一声，“那便回家养病吧，病好之前不必视事了。”\n御前大会至此自然是开不下去了，留下众人目瞪口呆，品咂着定武帝这没加期限的思过和养病之旨。\n定武帝强忍着怒气开口，“朕知道你们有的人平时比他们吵的更欢，这个觉得自己吃了亏，那个也忿忿不平，可是国家百废待兴，朝廷天天吵吵嚷嚷纷争不休成何体统？朕希望你们都以他们两个为鉴，放下派系之见戮力同心。”"
TOD_STG.96.a:0 "不要以私废公后悔不及。"
TOD_STG.97.t:0 "分化拉拢（1）——任命与谈话"
TOD_STG.97.d:0 "“矛盾双方在一定条件下相互转化”\n定武帝大概没有听过也不会愿意听乱党理论中的这句话，但其中蕴含的道理他如今大概感觉到了。在他还是锦王的时候，武备系是他驱逐废帝、拯救大明最有力的帮手，而如今，他似乎理解为什么武备系作为国之栋梁，为大明渡过危机贡献良多，可父皇仍旧要提防他们了。他没有像废帝一样抽掉自己坐着的椅子的兴趣，但现在椅子开始说话了，他也不得不处理一二。\n杨永泰的献策在他的脑海不断重复，“而今对武备系之策，无非分化拉拢四个字，武备系中大多为忠良之士，只是废帝威逼太过，才不得不结党自保，如今陛下拨乱反正，只要让他们各归其位，发挥自己所长，他们自然会忠君爱国。陛下给的富贵荣华难道不比阎锡山、王永江许诺的来的踏实？”\n杨永泰说的自然是对的，但是实行起来则没那么简单，他又是个不容于人的性子，这事便只好定武帝亲自来干。好在等了多日，机会总算是来了。\n“伯颂来了，坐。”定武帝摆手让张寿镛坐下，“伯颂的条陈我看了，没有什么问题，你放手去做便是。”\n张寿镛今日面圣本来有些惴惴不安，定武帝上次发作勋贵和武备系的场景他还记忆犹新。本来以为定武帝之前找借口让周学熙回家思过，这次是要敲打自己了，如今定武帝和颜悦色反而让他有些手足无措。\n“朕今天叫你来，还有一事，周缉之现在无法视事，可是实业部的事不能一直让两个侍郎扛着，”定武帝仿佛没看出张寿镛的异常，继续说道，“况且战事紧张，工造部和实业部若是不能及时协调也对战事不利，朕思来想去，不如伯颂你将实业部的差事一并担起来。”\n“陛下，这……”张寿镛震惊地站起了身，下意识地想要拒绝，他自然明白这是定武帝的拉拢，但是接受这个拉拢，那就意味着得罪自己的同僚，尤其是……关系亲密的那些，“臣才疏学浅，恐怕难以担此大任。”\n“朕知道伯颂你的担忧，”定武帝笑了笑，“伯颂觉得朕为何要让缉之回家闭门思过？是为了防备武备系？朕说过，朕想做的是天下的天子，不管是谁，只要一心为国，有真才实学，朕都愿意任用。”\n定武帝顿了顿，双眼望向张寿镛，“伯颂觉得，是朋友之义重要，还是国家大义重要呢？伯颂是工造部的尚书，你是最清楚情况的，我大明如今的军需生产可能布威于万邦？国有企业的效率可能支撑起“垦殖拓业”之需？”\n张寿镛沉默了，当然不是所有武备系都相信那套“布大明之威于天下开化万邦”的说法，大部分人无非是为了自己的禄位罢了 但他相信。汉家自有制度，本以霸王道杂之，如今的大争之世，岂是坐谈自由之时？如今钱荒持续已久，唯一的办法就是以国家统制兼以舰炮开路，强行为大明的产品找到他们的应有的去处，如此方可舒缓百姓之苦。但是陛下说的没错，真正的阻碍是管学系吗？现在没有管学系了，他的抱负就能实现了？他想起了这几个月以来国有企业的表现，不禁摇头苦笑，他们永远有的是难处。\n张寿镛没有说话，但定武帝知道，自己的目的已经达到了。"
TOD_STG.97.a:0 "有了张寿镛这个兼管实业的工造部尚书，后面的事情就好办了。"
TOD_STG.98.t:0 "分化拉拢（2）——内心挣扎"
TOD_STG.98.d:0 "张寿镛将修复了一半的孤本小心放在案上，闭目片刻站起身来，开始用一块细密的棉布轻轻擦拭着一个墨烟冻石鼎，享受着难得的安闲，开战以来本就事务繁忙的工造部更忙了，他又事实上担起了实业部的工作，几乎没有一时一刻是得空的，但这份安闲很快也被打破了。\n“伯颂好雅兴啊。”陶湘从门外大步跨进书房，“你还有心思侍弄这些东西。”\n“时时勤拂拭，莫使有尘埃，万事万物都一样，不是可以一蹴而就的，自然要时时打理。”张寿镛请陶湘坐下，亲手为他倒了一杯清茶，“兰泉说对吗？”\n“五祖因为这首偈语认为神秀‘只到门前’，为何拿它做了修身之道？”\n“如何不说五祖虽然如此认为，但仍旧让众人依此念诵，概因六祖之悟乃是天资聪慧之人的顿悟，普通人自然要时时勤谨，免入恶道。”\n两人的机锋打的差不多了，陶湘也知道张寿镛恐怕已经对自己想说之事有所耳闻索性直言，“罢了，说点俗世的事情，最近有些老友来找我，想让我好好执行陛下的政策，最好使出十二分的力气。”\n“那兰泉认为应该如何？”张寿镛并没有答话，反而端起了茶杯，氤氲的热气让陶湘看不清他的眼神。\n“我没答应他们，”陶湘顿了顿，“但也没拒绝，说实话我不知道该如何做，所以才来找你。”\n“哦，这是为何？”\n“天网恢恢，疏而不漏，我若是答应了他们，恐怕祸事不远，”陶湘的神色有些复杂，不知道他的“老友们”费尽心机，如今作何感想，“可若是不答应，岂不是成了忘恩负义之人。”\n陶湘的最后几个字几乎轻不可闻，张寿镛便全当没有听到，“兰泉兄，你们到底要争到什么时候呢？和勋贵们争斗不休的教训还不够吗？当时非要寸步不让，如今呢？还要一错再错吗？”\n“可是，他们说，皮之不存，毛将焉附。如今不争，那以后，还会有我们的一席之地了吗？”\n“无偏无党，王道荡荡；无党无偏，王道平平，你扪心自问，难道纵容臣子肆意妄为干扰朝政便是对的？”张寿镛放下茶杯站了起来，“陛下对武备系多加约束是真的，可陛下想当的是天下人的皇帝，你不以派系之见行事，陛下自不会以派系之见看待你，”"
TOD_STG.98.a:0 "兰泉，你好好想想吧。"
TOD_STG.99.t:0 "诗会（1）——举行"
TOD_STG.99.d:0 "徐世昌的府上今日迎来了一班“贵客”，应徐世昌之邀，前来开一场“诗会”。到场之人有的迫于交情，有的对变乱仍心有余悸，当然本就有意攀附之人也不在少数，总之，自变乱之后被冷落多时的咨议员们竟有大半在此。\n“今天人来得倒齐整，往常就是咨议院开会也凑不齐这么多人。”傅增湘站在一张圆桌旁，略带嘲讽地对一个相熟的议员调侃，“徐世昌还真是好人缘。”\n“徐老书画向来是一绝，大概诸位同仁都想一睹风采吧。”相熟的议员并不想接话，人在屋檐下不得不低头，况且徐邀请他们的拜贴言辞谦恭备至，今日待客也毫无骄矜之色，自己一个后辈何苦跟着傅增湘嚼舌。\n“遐庵干什么呢？今天说好了联诗作句，你这个大才子躲在这里，不肯上前是吧？”徐世昌仿佛没听到傅增湘的嘲讽，伸手携上叶恭绰，便往书案那边走，另一只手拉上了傅增湘“来，润沅也来。”\n“别别别，徐老快饶了我罢，今日如此多的同僚，我才疏学浅，别让我丢人了，等到诸位联完我来拜读还差不多。”叶恭绰虽然这么说，却也没推辞，跟随徐世昌和傅增湘来到了大案前。\n傅增湘不情不愿地站在案前，定眼观看，一下子看到了不少熟悉的面孔。恽毓鼎的儿子恽宝惠是个比他更妙的妙人，向来有诗才，又一向自命不凡，自然不会放过这个出头的机会，和其他几个壮心不已的议员生生将联句变为颂圣。傅增湘微微一笑，开口对徐世昌道，“我原来不知恽议员他们竟有如此文笔，宣传部失了如此干员真是一大憾事。”\n徐世昌笑而不语，转向叶恭绰，“遐庵最近画竹如何啊？”\n“大概有所长进，遐庵最近肉吃的都少了，看来是得了其中真意。”傅增湘继续出言调侃，顺便暗讽变乱之后咨议员生计都艰难起来，坐在案边伏案记录联句的古耕虞年纪轻，尚无这些老头子的城府，实在忍不住了，丢掉毛笔拍案而笑，他这一笑不打紧，带的其他本就强忍的人也都笑了起来。\n“长进不敢当，徐老若是不嫌我打搅，我改日上门讨教。”叶恭绰待众人笑得差不多了才开口回答。\n“改日干什么？今天你便不愿意讨教？况且”徐世昌佯作怒意，话锋一转，似是不经意般的说出了他今日诗会的真正目的，“咨议院就要重启，你们都要忙起来了，那里还有时间陪我这个老头子作画？”\n此话一出，整个花厅里的目光都聚集到了徐世昌处，叶德辉心急又自恃资历，直接开口询问道，“陛下要重启宪政会？”\n“是，陛下圣明烛照，之前的非常之举只不过是为了肃清奸党，如今朝局渐稳，咨议院自然要重启，让国家忠良为国效力啊。”\n在场的人闻听此言各有所思，徐世昌却不再管他们，叫上叶恭绰，提笔开始作画，不多时，一幅松竹图便已完成，叶恭绰题诗其上，待到落款时徐世昌却将笔递给了傅增湘，“润沅一向善作跋文，今日盛事就拜托你记叙其上了。”\n傅增湘迟疑片刻还是拿起了笔，有伶俐者随即高呼三绝，徐老画绝，沅叔跋绝，遐庵诗绝。\n叶恭绰听着恭维心下苦笑，他想他大概知道了何为“疾风知劲草”。"
TOD_STG.99.a:0 "没有立场，自然永远胜利。"
TOD_STG.100.t:0 "诗会（2）——召对"
TOD_STG.100.d:0 "数日后\n\n“徐爱卿诗会办的如何？”定武帝和徐世昌讨论完军国大事，神经放松下来，便想起自己交给他去办的这一步闲棋。\n“蒙陛下圣恩，诗会宾主尽欢。”徐世昌和定武帝间随意惯了，倒喜欢时不时用颂圣之词开开玩笑。\n“哦，那我大明的诸位贤良可有佳作？”\n“自然是有的，这是当日联句之作，陛下若是闲暇了可以解闷。”徐世昌说着从自己的一堆文件里抽出一个册子，打算交给定武帝。\n“这就不必了，朕真得了闲，不如去靶场转一圈，强过看这些官样文章。”定武帝看着厚厚的集子摆了摆手，"
TOD_STG.100.a:0 "“他们若真的有心，便在庙堂阡陌多为君父分忧吧。”"
TOD_STG.101.t:0 "校园闲谈"
TOD_STG.101.d:0 "顺天的某处校园里，已是午休时间，学生们从教学楼里鱼贯而出，三两结对地在路上走着，间或一两个男生骑着自行车从中疾驰而过，时不时掀起惊呼。 \n一个儒生打扮的男子却着人流走进了红砖砌成的两层小楼里，左转进了第二间教室，“宜山啊，怎么还不走，忘了咱们前天约好的了？” \n“没忘没忘，稍等我一下，咱们去尝尝杏花楼的新菜色。”带着眼镜的男子整理了一下手中的教案，将它塞进公文包里，然后向着教室门口的男子走去，“又让览之你等我了，之前……那事耽误了些时日，我的教学计划有些紧。” \n“没事不急，不过你还打算赶赶进度，我是彻底放弃了，就这样吧。” 罗观澜摆摆手。\n两人并肩走出了教学楼，向着校门走去，陈宜山沉默地走着，罗观澜耐不住沉寂，主动找起了话题，“你看昨天的顺天日报了嘛？”\n“看了，正常嘛，新朝自然要有新气象”陈宜山压低了声音，“看来衮衮诸公们恐怕要作茧自缚了。” \n“此话怎讲？”\n“海昏侯在位不足一月，却干了一千多件荒唐事，多亏了霍光联合群臣匡扶朝政，才有了孝宣中兴，可是，然后呢？”\n“啊？名单不会骗人，先不说新的几个紧要部门的任命，昨天当今任命的那几个经济顾问，这不明显是对武备系格外看重，刘大钧可是一直替他们鼓吹？”\n“罗兄有所不知，刘大钧是一直在宣扬国家应该调控经济，但他是统计部门为数不多真的在干活的人，对于工业的真实状况，他恐怕是最了解的几个人之一了。至于张素民，他这些年除了统制经济的理论研究之外一直深耕华北地区的经济状况统计。”陈宜山推推眼镜，“如果真的相信武备系，和他们描绘的前景，何必重用这两个人？”\n罗观澜似有所思，陈宜山便也没再说下去，不时有学生对二人打招呼，二人一边含笑回礼，一边加快脚步。\n“唉，我还是不适应。”陈宜山揉了揉笑的快僵了的脸，“这些孩子太有礼貌了。”\n“尊师重教，这是理所应当的，你习惯了就好了。”罗观澜笑了笑，“不过同时任命的还有吴鼎昌和徐堪，据此就说不信任似乎有些偏颇，还有其他端倪吗？”\n“实业部，他们虽然没有人员变动，但是他们最近签发的文件，是张寿镛署名。”\n“你不说我的确没意识到，那便说的通了，二桃杀三士。”罗览之恍然大悟，“不过这样也好，经济官员一定要懂经济，武备系突然接手交通系留下的空缺难免放肆，这样下去本来就陷于钱荒的经济不知何时才能好转。”\n“可惜了……”陈宜山以微不可闻的声音叹息一声，转而换上笑脸，“不说这些了，走吃饭去。”"
TOD_STG.101.a:0 "人生识字忧患始"
TOD_STG.102.t:0 "处理异见者"
TOD_STG.102.d:0 "偏殿里，定武帝坐在主位上，带着眼镜，仔细浏览着手里的名单，底下的几个心腹智囊神态各异，不难看出，他们刚刚恐怕有一场并不和谐的争论。\n “徐公说的对，死者不可再生，用法务在宽简，这个名单上的人，还是太多了。”定武帝放下了名单，“很多人与其说是乱党，不如说是与武备系政见不合罢了。”定武帝在登基之前对他们深恶痛绝，如今却多了一份怜悯，毕竟他现在是天子而非只是武备系与勋贵的共主了。\n “大明怎么能有这么多的乱党，”杨永泰幽幽一叹，“武备系的脑子是被什么……”\n“大概是觉得除恶务尽吧，也是忠心为国。”定武帝没有让杨永泰发表完他的“高见”，“不过畅卿说的对，这么多人还是太过了。”他自然知道大明没有这么多乱党，退一万步讲，就算真的有这么多乱党，也不能这么说。\n拿起红蓝铅笔在纸上慎重地打了几个圈，朱容坤把纸递给了徐世昌，“就这些吧，剩下的人若是愿意公开悔罪也可宽恕开释，若是不愿意的话……就先好生关着。”\n圈出名字的只是淡淡的红圈却无端地刺目，徐世昌不知为何有些害怕拿着这张纸，赶紧放到桌上与几位同僚一起看。\n“陛下宽仁，无知附逆者若还有廉耻之心便应洗心革面，只是还有一事，杨度他曾是国之重臣，若一并枪决，是否……令其自尽？”徐世昌犹豫着开口。\n“内阁首辅矫诏篡逆便不能杀了？这是何道理？”杨永泰出口便咄咄逼人，徐世昌饶是好脾气此时也难免在面上带出一二。\n“国家毕竟有八议，徐老说的也没错。”张寿镛连忙出来打圆场，“不过毕竟是谋逆大罪，太过宽大，如何震慑宵小？”\n定武帝低头沉思，他并非嗜杀之人，也知道杨度说得上年高德劭忠心耿耿，只可惜这份忠心，不是针对自己的。但即使如此，若是废帝当初顺利就擒，他也愿意放杨度，甚至这份名单上所有人一条生路，来展示天子仁慈，但可惜···\n他嘲弄地笑了笑，废帝时常将自由平等挂在嘴边，可是看起来在他看来他自己的命还是比他这些拥趸们昂贵的多嘛，他自己跑的倒是快，可怜荣德生、杨度、陈济棠一个个丢了性命。\n“国家有八议是念在他们对国家的贡献，杨度毒杀父皇，任是再大的功劳也无法抵此大恶，何况德政自父皇而出，和杨度有什么关系？”"
TOD_STG.102.a:0 "刑罚不可驰于国，笞捶不得废于家"
TOD_STG.103.t:0 "提拔嫡系"
TOD_STG.103.d:0 "夜很深了，但定武帝的秘书室内仍亮着灯，不同种类的笔在纸上勾画的声音中，工作人员们伏案奋笔疾书。自即位以来，定武帝就对政府机构和人员不断进行调整，对于不符合自己心意的官员，能换则换，暂时无法更换的人，便借由国家处于应急状态，设立一个新的委员会，绕过他们执行自己的意志。\n这样一来，权力自然更加集中于定武帝之手，但权力的集中也带来了工作量的集中，饶是定武帝精力旺盛也常常觉得吃不消，好在秘书室在新机要秘书的协调之下工作效率大大提高，为君父分忧不少。\n“嗯，还有什么紧急的文件吗，没有的话，”机要秘书放下笔，出声询问自已正在伏案阅读的同事“先把这些进呈御览？”\n“等等等等，我这里还需要稍稍调整一下。”负责外交方面的秘书急的直接站起身摇手。\n“没事，别急，你先弄。”机要秘书抬手看了看表，“时间还来得及。”\n外交秘书重重叹了口气坐下，继续和自己的两个秘书一起与赶鸭子上架的工作人员翻译出的不太像人话的国书作斗争。\n机要秘书正要回到自己的位置上，就看到门帘被掀开了，定武帝在几个随从的跟随下走了进来。秘书室里所有的人自然全都站了起来，定武帝摆手，“都坐，我就是来看看大家。这段日子事情多，你们也辛苦了。”\n这话一出，秘书室的气氛一下子放松了不少，毕竟经历了上次的事件之后，很多人仍然心有余悸，但见到定武帝如此和颜悦色，悬着的心也放了下来。\n“嚯，这文件这么多啊，”走到军事秘书的桌前，看着几乎要挡住军事秘书的纸山，定武帝不禁惊呼，仿佛要求每个部门必须上交日报并非是他。\n“是，这些日子……军务比较繁忙。”军事秘书小心斟酌着用语。\n定武帝看出了军事秘书的紧张，拉过他的手拍了两下以示安慰，环视了一下其他几张桌子，对所有人笑笑，“看来大家的工作量都不小啊，怎么样，还适应吗？”\n“陛下宵衣旰食不辞辛劳，臣等怎能懈怠叫苦？”在机要秘书的带头下，不少人出声附和。\n“君子终日乾乾，夕惕若厉，无咎嘛，说到吃，朕那天看你们熬到半夜就是靠茶水撑着，这样可不行，太伤身体了，”朱容坤一边说着一边对着随从招手，“叫尚膳监给你们准备了些宵夜茶点，你们饿了垫一下。”\n定武帝说着，随从们就已经把制作相当精良的茶点摆在了秘书室用来摆放杂物的桌子上，但是秘书们却没有动，仍保持着静聆圣训的姿态。\n“都吃啊，边吃边说，”定武帝见状更加温和，“不必因为朕在就拘束。”有了定武帝发话，众人自然纷纷拿一块茶点放在手里，人群里一个眼睛有些发红的小秘书拿起一块茶点之后顿了顿又拿了一块，走到定武帝面前，“陛下也吃。”\n定武帝先是一怔，笑了笑接过来，“你们还有其他什么困难也都说，别自己撑着。”"
TOD_STG.103.a:0 "定武帝如同一个老父亲一般叮嘱着自己年轻的臣子们。"
TOD_STG.104.t:0 "忠诚的内阁"
TOD_STG.104.d:0 "顺天某所恢复宁静的学校里，下了课的学生们结伴往食堂走着，一个带着围巾的男生和一个穿着浅蓝色比甲的女生并肩走在校园里，女生转头看向男生，“学长，你最近又读什么书了？能给我讲讲嘛？”\n“读书？最近的确没读什么，数学分析着实不好学，我今天卯时便起了说去自习，结果到那里发现座位都快坐满了。不过闲暇时倒是看了个笑话，给你分享一下？”\n“好啊好啊，我就爱听故事。”如果不注意那抹坏笑的话，女生的眼神还是很真诚的。\n“本朝成化年间内阁有三人：万安，啊，他不用说了，刘吉阴险刻薄，天天结党营私，刘翊比前两位好点，但也性格急躁，而且这么一个相对好一些的阁臣，也终于被前两位挤走了。这三位见到了宪宗就只会两件事，磕头和口喊万岁，所以当时的人们都叫他们纸糊三阁老。”男生说完停了一下，“对了，学妹你猜刘吉为什么叫刘棉花？”\n“因为性子绵？不对，”女生下意识的一击掌，“我知道了，因为耐弹对吧？我记得这位没少被弹劾，想笼络言官没成功然后恼羞成怒把人家抓起来。”\n“是这样，阁臣已经如此“出类”了，六部则更加“拔萃”，什么事都处理不了，只是一味签署文件，虽然他们不擅政务，可他们还用于内斗。吏部尚书尹曼和刘翊一伙，万安和彭华是一伙的，再加上刘吉，时不时按照排列组合来一场争斗，当时的人们也没放过他们，给了一个泥塑六尚书的称号，正好和纸糊三阁老相对。”\n“哈哈哈哈哈哈，六部尚书还是十六部尚书？”\n“我数学不好，数不清啊。”\n“唉，哪怕是从太仓扣阙算起的努力，就这么……”女生脸上的戏谑之色消失了，“置内阁，视同仆人，设百官，视同仇寇，咨议院的议员说抓便抓，说杀便杀，授权柄于幸臣，以独治治天下，将大明视作一人伟业之机器……”\n“这话可不兴瞎说，今时不同往日了，有些话不要总挂在嘴边。”男生没有让女生继续说下去，伸手捂住女生的嘴，做完这一切之后，他似乎意识到了自己的失态，于是后撤一步，“抱歉我失态了，咱们之间说说当然无所谓，但是……还是谨慎为妙。”\n两人一同陷入了沉默，缓步走在校园的小路上，"
TOD_STG.104.a:0 "不知要去向何方。"
TOD_STG.105.t:0 "执行陛下的战争经济学"
TOD_STG.105.d:0 "“在军事上取得胜利收复逆贼之广大土地后，可以扩大我之经济基础。然事实上，凡此给养筹措之法，概不足解决因战事波及、交通断绝所致之困难——如民食、畜粮、原料、成品、半成品等物资之匮乏。盖此类物资，实为吾国生产消费及经济组织之命脉所系。且战事非一日之功，故亟宜筹谋根本对策，其要义无外如下：其一，国内现有之生产消费组织，应一律以新法经营，并尽力发明替代品，以补原料断绝之缺；其二，现有人工生产方式，应设法提高其工作效率；其三，工厂生产数量与国民生活状况，必须适应骤然缩小之生存范围；其四，军事所需之各项物品，务期源源不绝供应。”\n“因战局推移，国内经济情势剧变，凡生产机关，咸有急遽改组之必要。当战端初启之际，尤以赶制大宗军需品及保全本岁农事收种二端为最亟。至若专营输出之商行，或仰赖敌属原料之厂肆，则应严加限制。凡此新兴事功，俱属战时枢要，亟当戮力筹维。”\n“至国内所储军用原料之不能自增产出者，应即收归国营。其施行程序，首以「征用」为始——一经征用，原主不得擅自转售或私制。至若普通原料，概行登记稽核，非至紧缺不予充公；惟关系军需之紧缺物资，则须尽数缴存政府，以备军用。然征用举措恐致民用困匮，亟宜特设「民生配给处」，专司民用物资调配之责。该处须体念时艰，兼筹并顾，务使军需民用各得其宜。”\n“视欧战之前鉴，恐战端初启，首蒙其害者即为失业问题，盖因战端一起，国内精壮工役即被征召以为后备补充，国民经济顿感劳力被夺之苦。当此之时，所遗国内丁壮正宜尽数驱使，以增生产效能。然实际情状殊异于是——动辄数十万众立时离厂，栖遑无所归，竟至求业无门。此种现象虽部分固属难免，然揆厥缘由，实多因厂方擅行苛限，或无故停工所致。”\n“此事关涉工人切身利害，复系国家生产命脉，政府亟应专设职司以解失业之困，尤须切合战时非常之需。当设‘全国劳动力管理委员会’,所司之责非惟统筹调度而已，遇有紧急情势，更当径行调集工众，直遣赴事或配属田间收种，或征调筑造炮台，或补益陆海军制造局暨附属工厂之劳作。为激扬工界精神、增益生产效能，下列措置宜酌量施行:限制各厂每日工时至多十小时，严禁加工及深夜劳作，减轻失业压力，对失业工人酌予赈济。”\n“虽我朝将士素娴训练，器械精良远迈逆党，破敌当在指顾，然《孙子》有云：‘不尽知用兵之害者，则不能尽知用兵之利’故战事延宕之虞不可不深虑焉。今以百万丁壮悉充行伍，军需耗用复与日俱增，国内男工必致不敷周用。反观女工，则因产业限入之故，恒有浮冗之虞。”"
TOD_STG.105.a:0 "当此之时，亟宜预筹女工替代男工之策，以备非常之需。"
TOD_STG.106.t:0 "无可置疑的三军统帅"
TOD_STG.106.d:0 "“因此，一位君主除了战争及其规章制度和训练之外，不应该有其他的目标、其他任何的思想，也不应该把其他任何事情作为他的技艺，因为这是发号施令者应当关注的唯一技艺。它的效力不仅能够使那些凭出身成为君主的人维持地位，而且多次使那些平民运道的人跃居君主之位；反之，我们则看到，君主一旦考虑安逸享乐甚于整军经武，就会失去他们的国家。导致你失去国家的头一个原因就是忽略了这种技艺，而使你获取国家的原因就是你精通这种技艺。”\n定武帝用铅笔在这段话的下面重重地画上了几道横线，几乎要穿透纸张。锦衣卫给他的呈报他都看过，自然知道如今民间流传的玩笑话说他“恨不得管到每挺机枪”，以及这个笑话的来源。\n\n他倒是愿意有忠良之士，可以割政分机，然而就如同这个笑话不来自旧紫禁系或者管学系的攻击，那些曾经他站在一起的人，也未必还是……不说也罢，但他不是刻薄寡恩之人，新提拔的青年军官也需要逐步替换，为了不在这个过程中出乱子，他不得不亲力亲为。\n惇信明义，崇德报功，垂拱而天下治，这的确是圣人之言，然而……"
TOD_STG.106.a:0 "在这之前，武王一样要“左杖黄钺，右秉白旄”来指挥将士。"
TOD_STG.107.t:0 "确保勋贵特殊利益（1）——探病"
TOD_STG.107.d:0 "一辆明显是经过特殊改装的轿车上，定武帝微闭着眼，回忆着自己这趟出行的由来。\n曹锟和周学熙因为争吵不休被他赶回家思过，他本意是让他们不要再勇于私斗要戮力同心，可无奈他想象力丰富的臣子们不作此想。看着他手里接到的举报勋贵一些所谓不法行为的密奏或是直接建议他清理勋贵的建言，定武帝知道自己不得不做点什么了。\n定武帝始终不明白为什么废帝坚持认为可以一边喊着“平等”“自由”“民主”之类的口号歧视有大功于大明的勋贵和其他元老重臣，一边心安理得的呆在皇帝的位置上。所以他并不对夺取这个侄子的皇位有什么愧疚，自己只是满足他的愿望罢了，为什么他不开心呢？小孩子的心思真是难懂啊。\n周武定业，胙茅土于子弟；汉高受命，誓带砺于功臣。岂止重亲贤之地,崇其礼物;抑亦固磐石之基,寄以籓垣。勋贵们本就是皇权最好的屏障和助手，虽然他们之中不乏甚至说很多无能之辈，但是那又如何呢？选取其中有能力者任用便是。至于剩下的人，他们的父辈祖辈为大明浴血厮杀时，难道是为了让他们还像自己一样拼杀的？\n定武帝又想起了那份令人头疼的检举勋贵们“不法行为”的建言，曹锟不知道从谁那听说检举的名单上有他，这下是真的病倒在家了。\n伴随着定武帝的胡思乱想，轿车也很快行驶到了曹锟家的门前，定武帝走下轿车，已经接到通知的曹锟家人早就等在门前，站在其中的吴佩孚则显得尤为瞩目。\n“子玉也在啊？”定武帝笑笑，携起吴佩孚一只手，“来，和朕一起去看看曹老。”\n半倚在床上的曹锟明显努力换了一套体面的衣服面圣，至于他想站起来迎接这件事则被定武帝眼疾手快地制止住了。\n“仲珊这病怎么越养越重了？”定武帝坐在曹锟的床边，“朕还等着你病好了为朕分忧呢。”\n“臣，臣糊涂，但臣对陛下之心可鉴日月，”定武帝的话明显触动了曹锟的伤心之处，说着说着竟痛哭起来，“臣也只是对几个找份生计糊口的亲戚帮扶一把，并没有不法之事啊……”\n“朕知道，朕知道”定武帝伸手轻拍曹锟以示安慰，如果不考虑两个人年龄差距，倒的确是一副君臣和睦之景，“国家本就对勋贵们有优待制度，无非是废帝轻佻无视这个条例，我即位以来事务繁忙也没空管这件事，倒让宵小钻了空子。”\n“陛下圣明！是，是臣想差了……”曹锟的声音仍带着哭腔，却轻松了不少。\n“那就好好养病，别胡思乱想，子玉常来看曹老也要多劝啊，”定武帝调整坐姿看向二人，“你们的功绩大明不会忘，朕更不会忘记，只要在朝廷法度之内的事情，不必理会宵小之言。”"
TOD_STG.107.a:0 "“陛下圣明！”"
TOD_STG.108.t:0 "勋贵特殊利益（2）——修改"
TOD_STG.108.d:0 "蔡成勋坐在自己的办公桌后，盯着手里的一份方案陷入了回忆，那是三天前的御前会议，他小心翼翼地提出了想要就武器制造问题直接和工造部联络而不是次次都要通过内阁的请求，出乎意料地是，定武帝对此不仅没有严加限制，反而打算将之形成定制，让兵务部和工造部一起拿个章程出来。\n蔡成勋揉了揉眉头，定武帝一向精力旺盛事必躬亲，最近又致力于收拢权力，一下子如此放权，着实让他心中有些惴惴不安，不过思及前一段时间定武帝的行事风格，对了，前一段的行事作风！蔡成勋的头脑一下子清明了，章程是自己提出，但同不同意自然是定武帝决定，这放权恐怕既是信任也是一种考验，自己最好还是不要越轨。\n思及于此，蔡成勋叫来了自己的秘书，“你把这份章程再检查一番，有无疏漏，尤其要加上对于来往文件要逐份抄送内阁与秘书室这两件事，改完之后再交还工造部，看看他们还有什么异议吗？”\n拿到被修改后章程的张寿镛会心一笑，轻轻倚在了椅背上，谁说勋贵们都是武人什么也不懂的？这不是很擅长此道吗？仔细阅读一遍没有什么问题之后，张寿镛颇为愉快地签上了自己龙飞凤舞的签名。不过想想最近几次会议定武帝的打算，蔡成勋其实是多虑了，陛下是颇为亲力亲为，但现在已经有了新的办法更好的掌控朝政。\n工造部的速度快的出奇，下午便将签署过的章程交还，让本来已经习惯了和他们扯皮的蔡成勋甚至有点不适应。希望以后别的事也能这么痛快，不用再天天听那些书生哭穷，蔡成勋如是想。"
TOD_STG.108.a:0 "这也是一种高效吧"
TOD_STG.109.t:0 "重用一心会"
TOD_STG.109.d:0 "顺天东城的某个小酒馆里，伙计移着柜台打着瞌睡，无奈被旁边高呼的声音吵醒，打烊的时间早就过了，但他却不敢驱逐这几个客人，甚至不敢去劝他们早些回家。京城最近不乏鸡犬升天摆酒设宴的人，因是暴发新荣，最是好面子。这几个人一看便是武官，自己才不愿去触这个霉头。只是，这声音怎么听着不对，刚刚还是笑呢？\n“张兄，你说，我们到底做了什么！”一个国字脸的男子突然带着哭腔嘶吼起来，“他们告诉我们，说是为了大明的荣光为了天朝所以要驱逐废帝，所以我们才把脑袋别在裤腰带上干这一场！可是现在呢？现在呢！他们只是为了他们的名位罢了，没有一个人真的想着大明啊，咳咳……”\n“你，你别太难过，这不是，”已经喝的醉眼朦胧的赵磊努力地想安慰国字脸的男子，却发现自己什么也说不出来，“会好……”\n“率土分崩，生民之命，几于泯灭……”席上又有人被感染了情绪，“我们想要阻止那帮蠢货为了满足自己的私欲残害国家，可是现在，哎，大明何时才能重新归为一统啊，那些该死的统制国，大明对他们还不够好吗？如今大明只是稍稍衰落便一个个藏不住他们的不臣之心了！”\n“呵，当初我们说这些人只听得懂枪炮，乱党们说什么来着？说什么他们也都是天朝之民，应当‘远人不服，则修文德以来之’，现在呢？‘今不取，后世必为子孙忧’！”一个刚刚从桌子上爬起来的军官听到这话，也加入了讨论，说到生气时，一拳砸在桌上，这下好了，本来已经喝趴下的几个人全都醒来了，就在哭声和骂声越发大起来的时候，一道声音从他们的身后响了起来，“别哭了，这么大人了，不嫌丢人？”\n这一声断喝让众人彻底清醒了，无他，原来在他们沉浸在天下板荡的悲痛中时，定武帝不知何时来到了这个小酒馆，而这声断喝，自然也是他发出的。\n军人的本能让几个本来都喝的摇摇晃晃的军官立刻挺直了身子，对着定武帝敬了一个军礼，刚刚发言过的几个人尤为不安，低着头不敢直视定武帝。定武帝也没有说什么，只是走到了他们之中，“不用低头，你们说的对，如今国家现在陷于动荡，没有什么可避讳的，是我当初太仁慈了。”\n“陛下，我们不是这个意思，这和您无关啊，要不是……”\n“受国之垢，是谓社稷主，朕既然是天子，怎么能诿过于下？但朕不害怕，朕一点也不担心！”定武帝的目光陡然坚定了起来，“现在的情势再危急，有当初中祖情况危急？有当初烈祖境况困难？大明从来不是一帆风顺的，但哪次大风大浪大明没有撑过来？反而是那些和大明做对的蛮夷外邦、跳梁乱臣，一个个都消失在历史的长河里！何况和二位祖宗比起来，朕还有你们呢！所以朕不怕，朕相信有你们在，逆贼一定授首，那些不听话的统制国，也早晚要再沐天朝教化！”\n“陛下！臣等为了天朝荣光，赴汤蹈火，九死不悔！”泪水重新溢满了这些仍旧年轻的军人的眼眶，在气氛的烘托下，不断重复着这句话。\n而从定武帝一进门便被侍卫请到门外的小伙计，也终于倚着柱子……"
TOD_STG.109.a:0 "解脱的进入了梦乡。"
TOD_STG.110.t:0 "为国效忠"
TOD_STG.110.d:0 "“云存，你疯了吗？”梁栋拽着口中叫做“云存”的青年的袖子，震惊地盯着他，“你要去给锦逆卖命？”\n“梁兄慎言，我只是想要为国效力，参加天子所设特科罢了。”范云存不动声色地从梁栋手里拽出了自己被拽皱的袖子。\n“你忘了咱们的老师和同学们了吗？你现在去给朝廷卖命，如何对得起他们？就算你不想他们，你自己的理想呢？是谁说的要为了生民立命的？是谁说的希望有一日，这天下每个人都可以按照自己希望的方式生活的？”\n“我正是想要真正做到这一点才去的。”范云存的声音一如既往的平静而温和，但听在梁栋的耳朵里却如惊雷一般，他宁可范云存是为了名利才寻找晋身之机，也好过认为给暴君卖命是拯救黎民苍生。\n“我听不懂，云存，我听不懂，难道给锦逆当狗便能拯救苍生了？”不可置信和愤怒冲昏了梁栋的头脑让他有些口不择言，“你想要荣华富贵就直说嘛，何必打一个冠冕堂皇的旗号？大明延续几百年，禄蠹何其之多，多你一个也不丢人！”\n“否则呢？靠和你们一样？每天坐在学堂里清谈？时不时去个山清水秀的地方游玩一番，美其名曰考察民情，或者找个地方教教工人读书，满足一下自己的慈善之心？你当他们是什么？和你在街上捡条流浪狗有区别吗？”范云存脸上露出一丝嘲讽，“也对，你看我不就是走狗嘛。你不会觉得你们看到的真是什么所谓的民间疾苦吧？”\n“我，我不是故意的，云存你……”梁栋意识到了自己的失言，他试图通过语言挽回，然而矛盾已经被激化了。“不必如此，我的确是为了功名利禄，”范云存一直平和的脸上突然闪过了一丝带着癫狂的狠厉，“我和你们不一样，我父亲就是个普通的工人，他起早贪黑的干活把我送进了学堂，老师不喜欢我，我就拼命读书，可我名列前茅老师却更加生气，时不时借口责难，将我罚出教室。我家住在城外，每天都要提前一个时辰起床走去学堂，我便在路上记诵经史，幸好苍天不负……”\n“是，我知道，云存你……”\n“你不知道！你们都说我不合群，只喜欢读书，你们或附庸风雅去琉璃厂淘换清雅之物，或去郊野满足自己那可怜的同情心。可我只知道我每周末都要去大栅栏等些装卸的活，否则我下周便要没饭吃了，”范云存说出这段话怒气稍减，“我也真的喜欢读书，我也想看看这个世界本该是什么样子的，我也希望这个世界真的能像那些小册子上写的那样……”\n“所以我们要去争取它啊！”梁栋看到范云存情绪缓和急切地继续劝阻他。“那些鼓吹自由放任的人不是上台了吗？你看他们这并不算长的掌权期干得如何呢？”范云存冷笑，“那些愚蠢的政策除了让我父亲失业之外我没看到任何成效。我们可以自由的选择去死，他们可以自由的让能力和品行都不如我的人获得我一辈子都得不到的工作。”气氛陷入了死一般的沉默，梁栋无言以对，范云存也垂头不知在想什么。\n“你真的想好了吗？锦逆并非是真的……他只是暂时需要稳定他的反动统治所以才表现的求贤若渴啊。”\n“没什么可后悔的，我当然知道没有什么明君圣主，哪有什么爱民？‘可畏非民？’早就写在书里的道理罢了。”范云存的眼神重新复杂起来，“可这，是我唯一有可能实现自己抱负改变这个世界的机会了。”"
TOD_STG.110.a:0 "混乱是阶梯。"
TOD_STG.111.t:0 "请教"
TOD_STG.111.d:0 "颇为精致的书房内，徐世昌看了看了座钟，算算时间还充足，随手拿起一份《大明实闻》读了起来，但没读两行就有点后悔这个行为“据笔者观察，自顺天政变以来，紫禁系之势力一蹶不振，且议员多为政变政府所逮捕，而武备系诸辈似有与虎谋皮之危。据知情人士透露，徐世昌聚拢政学、交通等派系之残留，似有与前者争锋之势……”\n显然根据报纸的措辞就可以看出这不是什么能在大明公开出版的东西，但大明不能干的事情很多，也不是事事都管的过来，所以这份小报虽然几遭封禁，甚至几任主编不知所踪，但是居然一直办到了现在。至于为什么它是非法出版物而徐世昌却能堂而皇之的阅读，那自然是因为为大明效力不得不读，至少，在他犯些什么别的错误之前都是如此。\n“实闻的水平是越来越差了，”徐世昌摇头轻叹，“以前他们可是几乎事事切中实情的。”他最近的确是在联合一帮咨议院的旧人，但是想和武备系争锋的却绝非自己，而是当今陛下，甚至连自己收拢人员的名单都是定武帝圈定好的，自己只是招徕罢了。\n徐世昌一向不喜欢与人纷争，而且毕竟上了年纪精神有些不济，如今却被架到了火上。当然，他自然可以不干，但是杨永泰的步步紧逼却让他实在咽不下这口气。他知道杨畅卿一向恃才傲物，又自认是陛下心腹，此次政变有大功于社稷，可是定武帝登基后却是把许多重要事务交给了自己，心中难免不平。他为了避免矛盾激化也一直有所忍让，不想杨畅卿不仅不领情，还当自己软弱，越发放肆起来，不仅几次出言不逊，还在自己的手底下安插眼线以期拿到什么把柄好弹劾自己，自己再退，难道退到告老还乡吗？算算时间差不多了，徐世昌合上《实闻》，准备进宫面圣，毕竟舞台已经准备好，马上要唱一场大戏，一些工作也要收收尾了。\n“徐师进展如何？”定武帝在徐世昌面前难得显露本性，没等徐世昌见礼便有些急切地发问。徐世昌有些好笑，他第一次见到定武帝时定武帝便是这样一个性子，后来虽然世事变迁，定武帝也磨出来一份好脾气，但私底下还是如此。\n“陛下宽厚仁慈，咨议院诸公自然能明白陛下的苦心，愿意为王前驱，虽有一两个一时转不过弯来也无碍大局。”\n“多亏徐师了。”"
TOD_STG.111.a:0 "否则朕还真不知道怎么和这些夫子们打交道。"
TOD_STG.112.t:0 "改组咨议院（1）"
TOD_STG.112.d:0 "议事堂里，早早来到的王永江敏锐地发现今天的位置多了起来，联想起近日情势，心中不免泛起一丝不安，定武帝这是打算引入其他派系制衡武备系？还是打算扩大勋贵的话语权？但多年磨练出的修为还是让他不动声色缓步走到座位坐下，故作轻松地和旁边的吴佩孚寒暄起来。\n“今天这议事堂拥挤不少啊，好久没这么热闹了……”王永江没有继续往下讲，只是把探寻的目光投向吴佩孚。\n“议事堂的人数本就没有定制嘛，现在是特殊时期，需要参会的人多些也属正常。”吴佩孚没有接话，王永江也没有从他的脸上读出什么得意之色，心下一时更是惊疑不定。\n随着到会的人员愈来愈多，王永江的疑问也越发大了起来，有一些咨议院旧人他尚可理解，为什么还有两个他记忆中已经被锦衣卫武装监护的咨议员？他们什么时候被放出来的？\n定武帝的出现打断了王永江的思考，会议按时开始，几个议程依序讨论，并没有什么变故，新增加的参会人员们也没有对自己的议题跳出来加以责难，王永江心下稍安，只是，他们是不是安静的过头了？\n会议按部就班的推进到结束，就在王永江认为会议已经快结束时，定武帝的话语如同惊雷一般炸开在了他的耳边。\n“众位爱卿稍等，还有一项议程因为时间较紧所以没来得及写进议程中，不过也不是什么大事，但朕看今日时辰尚早，是否把这事一并解决了吧。”定武帝的话语虽然是商量的语气，但显然没打算允许任何人拒绝。\n这当然不符合议事的定例，但定武帝本身也不是个拘于定例之人。王永江知道，这个所谓的因为时间紧没有加进议程的小事，恐怕才是这场会议真正的重点。\n“这是有关咨议院改组问题的提案，诸位可以看一下，当然为了节省时间……”"
TOD_STG.112.a:0 "只看摘要部分也可以。"
TOD_STG.113.t:0 "改组咨议院（2）"
TOD_STG.113.d:0 "提案很长，但中心意思却十分明确，咨议院既然叫咨议院，那么就不应该是高坐庙堂袖手清谈还对国家大事横加指责的机构，而应该是为君父群策群力、提供战略建议的地方，而唯有如此，宪政会才能真正正常、健康、积极地参与朝政，为重塑大明荣光贡献属于自己的力量。\n“陛下……这似有不妥，咨议院是国家定制”陆徵祥看没有其他人打算提出异议，不得不硬着头皮开口，“自太仓扣阙以来，咨议院之制运行已久深入人心，如今贸然改制，恐怕将使人心不安啊，臣，望陛下三思。”\n“子欣多虑了，无非是咨议院功能的小小调整罢了，况且就算是改制，大明自太祖肇建皇极，所行改制之事不可胜数，难道都使人心不安？况且，”张寿镛咬咬牙站起来，眼神却有些躲闪，“咨议院本身不也是改制产生？不是也深入人心了？不是也没如子欣所言使人心不安？”\n“陛下，咨议院乃顺应民心所建，如今既然要改制，是否也应该……缓缓而为，以便征询民意……”王永江见状明白了为何定武帝今日提出如此议题，武备系早已被分化，如今不过是把事情挑明罢了，也好掐灭武备系借用咨议院限制定武帝的打算，但他仍不愿意就此投降，抓住了自己都不愿相信的民意，希图争取时间找到对策。\n“陆爱卿说得对，所以这次会议朕特意邀请了咨议院的诸位，大家共同商议。”定武帝仍旧带着笑，看在王永江的眼中却有些可怖，“来，大家都说说嘛。\n在几位新人的相继表态下，武备系彻底绝望了，这些人的风骨呢？他们不是挺大义凛然的吗？怎么现在不维护民权了？陆徵祥还想开口，王永江却用眼神制止了他，周学熙回家思过遥遥无期，张寿镛显然是成了天子心腹，武备系不能再折损人手了。\n“凡举事必循法以动，变法者因时而化，陛下说的对，宪政会的确需要随现实需要调整功能”王永江站起身低头应是，不知为何，他想起了这句话的作者。"
TOD_STG.113.a:0 "吕不韦"
TOD_STG.114.t:0 "结党营私？（1）——疑心"
TOD_STG.114.d:0 "定武帝坐在坤舆全图前回忆着每一个地区的地形地貌，想象着在这些地方应该如何排兵布阵，将敌方困入死境。这对他来说并非是一种劳神，反而是一种消遣，尤其是在他长久地被困于顺天这一方天地之中时。在基本收拢了权力、重新构造出属于自己的忠心的紫禁系、重新拥有了一个至少看上去清朗的朝堂之后，他终于敢放松下来，重新拾起自己这个爱好了。\n朱镕坤似乎回到了自己在北美接连奏凯的时候，那时的他还不到三十岁，一心想着守卫天朝荣光，向一直为自己急躁性格担忧的父皇证明，自己也是好样的！所以他多次以身犯险，向所有人证明了不是因为他是大明的皇子所以才坐在这个位置上，而是因为他的确的是一个天生的军事家。\n他的确得到了昌德帝的认可，只是不是父亲对儿子，而是君主对于臣子的认可。所以昌德帝以他是皇子不应与大臣争夺功劳为由，没有给予他任何嘉奖与提升，反而解除了他的职务，只是以“特所钟爱”为名将他留在了顺天。\n顺天这座皇城困住了他十余年最好的时光，击碎了他父慈子孝的幻想，也逐渐磨平了他急躁的性格。在这些漫长而又琐碎的日子里，他为数不多的消遣便是读书、看地图和与那些青年军官们一起吃火锅。\n徐世昌和杨永泰都曾经劝过他应该避嫌，然而他却没有采纳，一来是，他一直相信，这些年轻有为又充满理想的年轻人，才会是实现自己抱负最有力的帮手，二来是，他一向如此，突然转变反而会让昌德皇帝起疑，为了让自己的父皇对自己保留那么最后一点的父子之念，定武帝决定保持这个性格外露的“坏毛病”。\n所以他讨厌被约束，讨厌那种无力感，当意识到自己登基不久武备系就企图架空自己，勋贵们也有些搞不清位置的时候，他决定用自己的方式让他们学会如何当好一个臣子，如今看来，他们学习的还是很好的。\n定武帝站起身，灯光将他的阴影投射到了坤舆全图上，他伸出手一寸一寸地抚摸着大明的山河，！"
TOD_STG.114.a:0 "那些逆党们，也很快会学会的"
TOD_STG.115.t:0 "结党营私？（2）——拉拢"
TOD_STG.115.d:0 "“陛下，徐世昌借各种诗会宴席拉拢咨议员旧人，有同胶漆，张寿镛则拉拢一大批武备系的负责人，还借着职务之便和勋贵勾兑。陛下好不容易收拢的权力，难道就要这么看着他们再结党营私吗？”虽然大部分人都对如今的朝堂很是满意，但也有人是不满的，比如杨永泰。\n定武帝微微摇了摇头，他当然对杨永泰和徐世昌的官司一清二楚，只是没想到又添了张寿镛。他本不打算干涉，毕竟这对他并无什么坏处，然而杨永泰是他的旧臣，对他登基有大功，他不愿意杨永泰就这么与诸臣为敌，把自己变成众矢之的。“畅卿，你坐，”定武帝的表情严肃了起来，“张伯颂去拉拢那些国有企业负责人是朕让的，也是你当初献策的，怎么现在又不支持了呢？”\n“我……”定武帝在杨永泰面前一向随意，更是很少如此严肃地和他说话，杨永泰一时竟觉得有些陌生，“可是过犹不及，臣当初的意思是……”\n“畅卿啊，朕知道，你是一片忠心，不怕立于险地，所以才和朕说这些话，”定武帝并没有点破杨永泰的心思，反而替他圆了过来，“可是治理天下需要广求俊杰，博访英贤，连隐僻鄙陋之处的人，都要想方设法寻找出来。只要是有用之才，不论他的出身，不论他以前为谁效力，都不应因此心存成见。”\n杨永泰的神色不定，低着头不愿说话，他一向自视甚高，但自从定武帝登基以来，却对徐张等人多有重用，他虽然也明白定武帝对自己更为信赖，然而看着别人登台唱戏，他心中难免不服。\n“畅卿你几次当面和徐世昌冲突，张寿镛都给你打圆场，他若不是一片奉公之心，何必如此做？你这样朕如何托重任于你？”定武帝长叹一声，终于还是说出了杨永泰最不平之事，“朕知道你一向以孤臣自勉，可朕不愿你做孤臣，孤臣以死报君，然而君主却也少了一个真心辅弼之人，长久而言，难道不是国家的损失吗？你为朕出谋划策一心为国已经得罪了不少人，何必再和伯颂他们起无谓的冲突？你有阁揆职能也要有阁揆之量啊。”"
TOD_STG.115.a:0 "“臣，必不负陛下！”"
TOD_STG.116.t:0 "《第一期经济建设原则》"
TOD_STG.116.d:0 "朕惟经国大猷，首重民生。兹参酌列圣垂训，特颁经济建设要旨：凡实业之兴，当依宪章所定方略，以计画性之自由经济渐成统制经济之制。其经营法度，须恪守改善民生之宗旨，广励民营；至若外资之用，必本平等互惠之谊，于无损国体及国策施行之际，循诸途而纳之。务使企业自由振作经济，终竟建设大业。其要端如下：\n一、 大明实业开发当分二途：（甲）民营事业；（乙）官营事业。\n二、 经济建设总纲之下，为便分工协作，经济事业依例厘定：\n（甲）官营独办事业类目不宜过繁，含：\n一、驿传电讯；\n二、军器制所；\n三、宝源局（铸币）；\n四、干道铁路、航空；\n五、大型水利电厂等。\n（乙）非指定官营之业，悉听民力自营。\n（丙）凡民资难逮或关国本之业，如大矿、炼钢厂并航空等，官府仍得专营，或允民资、夷资合股。\n（丁）官民洋合股事业，概行公司规制。官府除依法行监理权外，其司务、度支、人事之权，依持股例行使。\n（戊）官府所营事业，除（甲）项独办者外，无论专营或合营，凡具商贾性质者，与民业权责同视。\n三、 民营要业创设，须经有司依建设总纲核验（着意厂址、产能、数额、品类、股券发行等项）。合于工建方略之民营，当特予奖掖资助，授以技术、转运之便，俾其依计、成事。\n四、 华洋合股事业，其洋股比例不拘定数。公司职守除总董外，管事之选亦不限于华籍。\n五、 经有司核验合于国策者，官业可由主衙洽借洋债或招洋资；民业亦得自商，呈报有司备案。\n六、 洋人在华独营之业，悉遵天朝律例。特种事业须特许者，当先呈验，由朕敕准施行。\n七、 职官不得营其辖制之业。现行律例若有牴牾本条者，着资政院厘正更张，以适时用。"
TOD_STG.116.a:0 "照章办理"
TOD_STG.117.t:0 "改组经济部门"
TOD_STG.117.d:0 "“我原则上同意这个方案，然而按照国家定制，以及出于便于统筹协调的考虑，这项议程应该由少府设立专门机构进而实行。”王永江努力压制着自己的怒火，尽量用平和地语气表达了自己的意见。他觉得有些可笑，如果定武帝觉得自己碍眼，让自己也回家养病就是，何必再弄个经委会出来架空自己，现在连统筹国有企业的职能都打算换个名头拿走了，那还留着少府何用？\n“少府乃是平日管理国有企业的机构，然而如今是特殊时期，生产需求以及联络要求不同往日，自然应该由经委会协调管理。”刘大钧有理有据地反驳了王永江的观点，“少府当然也要参与其中，但这不是少府一个部门可以单独做到的。”\n今天这场协调会在座的众人皆浸淫官场多年，自然明白刘大钧话语里的取巧之意，特殊时期而非战争时期，那么经委会存在多长时间，恐怕就取决于定武帝希望它存在多长时间了。\n“国家现在处于战争时期事务繁忙，的确需要协调，但那难道是一个委员会便可以解决的吗？”王永江见刘大钧出头反驳火气更大，“这不是让沟通机制更加低效了吗？”\n“哎，岷源，有话好好说，别急嘛，”一直沉默的新任经济部长轻声出言提醒，“陛下设立经委会便是为了保障统制经济的发展。”\n王永江不能继续发言了，无可奈何之下将目光投向了范旭东，希望他能争辩一二。范旭东和王永江共事多年，之前也关系不错，然而如今情势，范旭东只能假装看不见王永江的眼神。王永江脸带嘲讽的笑笑，合上了钢笔，索性靠在了椅背上。\n“如果此项没有异议了，那我们讨论下一项，关于涉及国家管制企业的如何收归国家管控问题。”\n王永江没有再继续听下去，他知道自己的意见并不重要了。他想起了数月前的那个夜晚，他涌起的那个惊世骇俗念头。他也年轻过，也曾经接触过学生间流转的小册子，也曾经思考过，这天下，为何一定要有一个皇帝。\n可是渐渐的，他发现那些小册子解释不了一个问题，资源永远有限，如果不去争取如果不去开拓，如何让天朝保持强大，如何让万民安乐？他们宁可去怜悯万里之外可能根本不存在的“同志”，也不愿意看看眼前哀哀待死的饿殍！\n可是天子不一定是皇帝，天朝为何不能共和？天视自我民视，天听自我民听！真正热爱这个国家的有识之士引导人民，代替他们治理这个国家，难道不是复三代之治？他会用自己的方式维护天朝的荣光，还万民以安康！\n当然，这一切本来都只会是年少时的梦想罢了，在他登上他能实现自己理想的路上，他做了太多妥协、经历了太多的困难，他早已意识到了大明这只巨兽的可怖之处。\n直到，那一天，一个他期待已久又始终不敢想的机会来到了，他看到了武备系众人脸上的恐惧与贪婪，而这两项情感，是最容易让一个人做出最疯狂的举动的。明君是民主最大的阻碍，现在，他消失了。\n如果，没有定武帝的话。一子之差，定武帝如同本能般地抓住了这个间隙掌控了权力，又极为小心地一点一点分化拉拢，生生围死了武备系的棋局。\n“王少府，王少府？”秘书打断了他的沉思，"
TOD_STG.117.a:0 "“会议结束了。”"
TOD_STG.118.t:0 "工商工作会议"
TOD_STG.118.d:0 "实业部的会场里，自变乱以来一直如同惊弓之鸟的企业主们终于重新有机会出现在顺天朝廷的正式会议上，虽然还不知今日邀请他们前来开会是为了什么，但是看工作人员的态度以及会议的规格，至少应该不会是什么祸事。\n“让大家久等了，我有些事情耽搁了，今日这场会议是为了商讨战时经济的问题，”张寿镛急匆匆地赶到了会场，冲着众人歉意一笑，“国家如今形势紧张，经济状况也十分堪忧，因此必须加以协调，保证生产销售的每个环节都不出乱子，而这，需要各位的齐心协力才能做到，所以要请各位前来，说说自己目前经营有什么困难，政府是否能提供帮助，或者是否能够通过企业间的合作解决。”\n虽然刚刚已经有些猜测，但听到张寿镛的介绍之后企业主们还是有些惊喜。毕竟他们听到加以协调的时候已经做好了企业被没收或强征的准备，现在却问他们有什么困难，这实在是有点不符合他们对于定武帝以及他所崇尚的“统制”经济的印象。\n“其实也没什么困难，就是巧妇难为无米之炊，”张寿镛看没人敢先开口说话，便示意古耕虞引出话题，“现在时局……艰难，很多原材料运不过来，没有原材料，自然无从开工。”\n古耕虞语气颇为随意，让在场众人也放松了下来，但大多数人仍旧犹豫不太愿意发言，坐在不太起眼位置的吕庄咬了咬牙，开口问道，“朝廷能不能给我们提供一些贷款？如今局面稳定了不少，原材料也逐步在恢复供应，可是之前的影响毕竟还在，现在我们的资金实在短缺。”\n吕庄的企业在被邀请来的名流里算不上大，家底也相对薄弱，如今他的企业资金链岌岌可危，就算供应上了原材料也没钱组织生产，虽然他也觉得自己这有得寸进尺之嫌，但是为了保住自己的工厂，他还是决定硬着头皮问问。\n“是啊，没有资金，购买原材料和给工人发工资的钱都不够，发不起工资工人自然罢工，罢工又必然影响生产，如此恶性循环。”见吕庄开口，其他一些相同情况的企业主也纷纷开口附和。\n“这的确是个问题，不过贷款的话如果符合规定，倒是可以通过实业部联系银行帮各位解决，还有什么问题吗？”张寿镛用笔在本子上记下了这一点继续问道。\n“国家能帮我们把销路解决了吗？”沈海此话一出在场众人都笑了起来，沈海也有些不好意思，“我跟他们几位不一样，他们的产品造出来就有人买，可我的货品本就积压，现在成本又在极速上升，光贷款也解决不了资金链的问题，还是需要把商品卖出去。”\n“这话说的在理，”张寿镛看向了商业的几个代表，“虽然说在商言商，但是多个朋友多条路嘛，各位有办法帮沈老板解决一下吗？以后时局好了，沈老板自然也给各位行方便。”\n会议在良好的开头下又持续了很久，在张寿镛的调解以及现实因素的压力下，不少工厂之间、企业与商业之间当场就达成了协议，还有一些也有了意愿可以商谈。当然，最重要的是，他给了企业希望，而信心对市场来说，才是最为珍贵的事物。"
TOD_STG.118.a:0 "这种会以后应该多开！"
TOD_STG.119.t:0 "设立经济专员（1）——生产效率"
TOD_STG.119.d:0 "“你是说，在原材料分配、资金供给都远超私人企业的情况下，有些国营企业的效率还是和私人企业持平甚至比私人企业还低？”定武帝有些恨铁不成钢地发问。\n“至少在数据上看来，是这样的。”刘大钧低下了头，谨慎地对定武帝的问题作出了回答，毕竟这和他的经济理论实在有些“小小”的差距。\n前一段时日在组织工商业合作时，经委会借着帮企业解决困难这个契机，在范旭东和张寿镛的协助下对华北地区的企业生产情况做了一个简略的摸排，然后就得到了这个意料之外情理之中的结果。\n“还有什么其他问题吗？”定武帝努力地压制着自己的怒火，让自己尽量以比较平静的语气说出这句话。\n“恐怕账目上也普遍存在问题，但如果想具体确定还需要仔细审计。”张素民呈上了另一份文件。\n“他们怎么敢的！”定武帝翻看着手里的文件只觉得气血上涌，“有这样的国有企业，怎么能够搞好经济？”\n定武帝此话一出坐在底下的几个臣子神色各异，范旭东有些坐立不安，张寿镛的表情则尤为精彩，这话他听过——在废帝的御前会议上。当初他只觉得寒心，武备系有大功于国，废帝却将积年而来的经济问题全都推到他们身上，没有武备系劝昌德帝介入欧战传播国威，怎么会有战后的经济繁荣？怎么就不说说那些私有企业的无序生产？可是这几个月来他天天和国有企业扯皮，今天又看到了这样一份数据，唉，真是太不争气了。\n“不能再让他们这么下去了，必须要想办法管一管。”定武帝注意到了臣子的异常，意识到自己刚刚失言，“国有企业一向是国家经济的柱石，若是运营不好，怎么能带动国家经济？”\n“臣刚刚所言是比较严重的几个例子，实际上大部分的国企，还是能够……达到正常运行标准的。”刘大钧看定武帝肯定国有企业的作用也急忙出言转圜。\n“陛下说的对，国有企业的乱象必须整改，应该不时派遣专门人员进行全方面的监察和审计，”范旭东说到这叹了口气“然而……国有企业与官员之间常常互相调任，又有许多同年同乡之谊盘根错节，想要觅得合适人选实属不易。”\n“那就换一批新人，”范旭东自己提出这个建议倒是省了定武帝不少事，沉思了一会儿他开口说道，“之前为了填补政府空缺恩科新招了不少的候补官员正在熟悉政务，正好给他们一个实际演练的机会……”"
TOD_STG.119.a:0 "也好看看他们的能力到底几何。"
TOD_STG.120.t:0 "设立经济专员（2）——直隶电力公司"
TOD_STG.120.d:0 "范云存等人到直隶电力公司的时候，魏定兴已经领着自己的两位副手站在办公楼的门前等候了很久了，看见到他们过来，魏定兴微笑着快走两步上前，双方互相作揖行礼完毕，魏定兴便引着他们进入了企业的会议室坐下。\n魏定兴与范云存印象中的国企负责人形象大相径庭，五十岁上下的他并不大腹便便反而有些清癯。和一直在高校任教临时被借调来带领范云存这一队人马的陈主任比起来，魏定兴反而更像个书生。\n“各位舟车劳顿一路辛苦了，我已经接到上面下发的通知了，国有企业接受监察理所应当，我们”魏定兴笑了笑，看向两个副手，“一定尽力配合各位工作。”\n“那真是太好了！”陈宜山如释重负般地长出了一口气，也没有多加寒暄，反而介绍起了自己的情况，“我之前一直在大学教书，如今临时被充此职，一时真的毫无头绪，若是能有各位配合，那的确能事半功倍。”\n“那是自然，那是自然，企业的账目以及历年来的生产情况我都已经交代过了，各位可以随时检查，如果还有什么需要配合的，您也尽管说。”\n陈宜山微笑点了点头，心里却早已起了波澜，魏定兴如此从容不迫，那只有两个可能，一是他的确奉公守法，二就是早有预备。可据他来之前拿到的数据显示，XX企业的账目虽然没有太大问题，效益也说得过去，但是在此次的摸排里和其他同类企业的运营情况横向对比便可以看出，直隶电力公司的利润低的有些可怕。那答案便十分清楚了，恐怕这一次，自己是碰上一个硬茬口了。\n“陈主任，那我先带您们参观一下企业？”魏定兴见陈宜山没有说话，主动提出带他们去熟悉一下企业。\n“啊？现在就去？”陈宜山故意做出一番懵懂之态。\n“国家如今处于紧急状态，自然要争分夺秒，”魏定兴的表情严肃起来，“各位所来不也是为了国企效率一事？”\n参观企业自然无甚话说，生产线上井井有条，魏定兴业务也颇为熟练，陈宜山他们的问题几乎个个信手拈来，还能时不时引经据典和陈宜山唱和两句，一天下来竟是宾主尽欢。\n\n亲自送走了陈宜山一行人，魏定兴只觉得精疲力尽，倚坐在自己的办公椅上，偏偏此时办公室的门被敲响了，他的副手常宁走了进来。\n“你们记得最近一定谨慎行事，有什么异常第一时间汇报给我，千万不要大意！”魏定兴双目微闭，对常宁吩咐道。\n“啊？这不就是几个小书生吗？有什么可怕的？”常宁的声音十分豪放，“我看连那个陈主任都没到30岁，还跟个小孩似的。”\n“企业定的报纸都是摆设是吧，你们能不能读读啊？朝廷已经乱起来了，我们英明神武的陛下这是要”魏定兴气的从椅子上站了起来，做了一个劈砍的动作，“我们一个不谨慎，就是万劫不复！”\n“这……可陛下不是一向倚重武备系吗？”常宁有些转不过弯来。"
TOD_STG.120.a:0 "“看重武备系的，是锦王殿下。”"
TOD_STG.121.t:0 "设立经济专员（3）——狗急跳墙"
TOD_STG.121.d:0 "“实英，你们干的好啊！”此时的陈宜山再无半点天真烂漫之态，眼中闪烁的精光就仿佛看到猎物的捕手，“张会计同意协助我们的调查？”\n“是，云存用咱们推算的数据诈了他一下，并暗示他已经有人透露了他们的秘密，”孟实英一笑，“张会计不想当替罪羊，于是承认我们的猜测没错，我们拿到的账目是他们精心……编制出来的，真正的收支则另有记录。”\n“那他人现在哪里？”陈宜山突然想到了什么，“武备系的力量在此地盘根错节，你们这两天和张会计接触频繁，他们不可能没有发觉，要小心他们杀人灭口！”\n“云存想到这一点了，所以跟着他一起去取证据，打发我先回来回报。”\n“这样不妥，云存一个人势单力薄，要是张会计起了什么不好的心思可怎么办？”陈宜山有些担忧地说道，“实英这样，你辛苦些，立刻去找云存，别让他一个人单独行动。”\n“嘶，是我大意了，我这就去找云存。”孟实英闻听此言悚然一惊，连连称是就打算出发。\n“等等，我还有一件事交代你，”陈宜山想了想，起身附在孟实英的耳边低语了几句，看着孟实英震惊地眼神，陈宜山摆摆手，“你不要往外说，只是怕你和云存在厂区联系不上我们。”\n孟实英连房间都没回就急匆匆地出门了，陈宜山则整理了一下目前的线索，打算和其他人开个会，讨论一下证据拿到之后的工作分配。然而还没等他去叫人，已经有组员闯进了他的办公室：\n“陈主任，陈主任，不好了，外面有一群工人把咱们的办公区域围起来了！”\n“啊？什么？他们为什么要围咱们？”\n“我听他们嚷嚷什么咱们是管学系的余孽，要关停电厂让工人失业……”组员说完了自己也觉得这话过于离奇，于是小声补充了一句，“我们什么时候成管学系了……”\n陈宜山敏锐地察觉了事情的反常之处，他们这么多天从未说过什么关停工厂之事，和工人的接触也仅限于问一问生活状况，今天这场风波，来的实在是有些蹊跷。管学系？是了，自己和魏定兴闲聊时曾经提过师门，恐怕他就是依此兴起的波澜。\n“警察呢？来了吗？”\n“来倒是来了，但是被工人拦在了外面。”"
TOD_STG.121.a:0 "大明的警察什么时候这么温和了？"
TOD_STG.122.t:0 "设立经济专员（4）——逼上梁山？"
TOD_STG.122.d:0 "“小范专员，听我句劝，和我们合作吧，你才二十多岁未来还长着呢，何必，浪费在这个地方？”张会计拿着一把手枪对着范云存的脑袋循循善诱道。\n“张会计你这是要干什么？”范云存想了很多种可能，也想过张会计的投诚可能是陷阱，但是如今这个局面的确出乎他的意料。\n“跟你聊聊合作的事，很不幸，专员组的驻地可能要发生一些事情，但是一个活口都没有的话，上面难免觉得蹊跷，”张会计叹了口气，接着说道“所以我们需要一个能帮我们证明，这真的是一场意外的幸存者。”\n“你不会觉得我们死在这里，就不会有下一组人来了吧？”范云存忍不住冷笑一声，“下一次来的，可就不知道是谁了！我劝你们趁着大错还未铸成，赶紧放弃这个念头！”\n“那是当然，但如果是管学系余孽混进专员组，破坏国企生产引起工人罢工，虽然警方极力抢救但终究只抢救出一位幸存者，那陛下还是不会怪我们的吧？”张会计注视着范云存，“陛下派专员巡查国有企业是为了提升效率而不是关停它的对吧？毕竟陛下……不是废帝。”\n张会计的意思很明白，定武帝当然可以巡查这些企业也可以撤换负责人，但他不能在没有任何证据的情况下，因为几个被国企罢工工人杀害的“管学系”大肆抓捕国企人员，那样无异于自毁根基。\n“砰”就在范云存思考的对策时，张会计身后的门被撞开了，趁着张会计转身的功夫，范云存一个猛扑将他压倒在地，张会计随即击发手枪，所幸因为他身体失去平衡，没有一发命中，范云存则一个手刃将张会计劈晕了过去。\n“实英是你？”范云存此时才看清来者是谁。\n“云存你没事吧，出大事了，直电他们要狗急跳墙，陈主任他们都被……”孟实英刚刚目睹了范云存这一套惊险的操作，此时刚刚反应过来，连忙将自己的来意说明。\n“都被罢工工人围起来了对吧，”范云存接上了孟实英的下半句，然后指了指地上的张会计，“他刚才都和我说了。我们先离开这，这件事参与者很多，张会计这一路不可能只有他一个人。”\n两人一边小心地从这处郊区的隐蔽处撤离，一边交换着情报，原来孟实英刚一出门便发现一群工人们聚拢专员组驻地四周，他心道不对，想要回去提醒陈宜山，又想到那不过是自投罗网，于是加紧找到范云存，想让他拿个主意。\n范云存皱着眉头听孟实英将信息说完，沉思了一会儿道，"
TOD_STG.122.a:0 "“快，我们去最近的铁路沿线！”"
TOD_STG.123.t:0 "设立经济专员（5）——沆瀣一气"
TOD_STG.123.d:0 "晚来天欲雪，能饮一杯无？\n夏军看着窗外阴沉下来的天色，期待着下班前不要再来什么任务，这样自己便可以买上二三斤酱牛肉，打上一斤散白，回到家里美美地喝上一顿，去一去一天的寒气。然而天不遂人愿，离下班还有一刻钟的时候，队长突然叫住了他，告诉他有紧急任务。\n夏军暗暗骂娘但也不觉得奇怪，他们管片时不时便有刁民闹事，没一刻是安生的，下班前来任务已经是常态了。\n“老夏你去叫下其他的弟兄，让他们都赶紧穿戴齐整拿好装备，赶紧集合”刘队长一边说着一边整理着自己的着装，“哦对了，留小李和老赵头看家就行。”\n夏军倒吸了一口冷气，“刘头儿，这么大阵仗，这是怎么了？”\n“直电的工人们闹起来了，”刘队长叹了口气，“这不，隔壁所赵队的人手不够用，让咱们去支援。”\n夏军等人来到现场时，远远见到被包围在工人之中的陈宜山在几个强壮组员的保护下裹着纱布，仍旧站在工人面前努力解释着什么。\n“怎么样，工人们的情绪安抚下来了吗？”当地的白知府火急火燎地赶到了现场，转头看向一旁的刘赵二人。\n“暂时还没有，我们也不敢太过逼迫，工人们之前推搡中还把陈主任给摔着了，我们怕逼的急了他们做出什么不明智的举动来。”\n“该死，魏定兴人呢？他怎么还没来？”白知府想到之前魏定兴找到自己说的那些话，不禁心里一咯噔，他到底要干什么？\n魏定兴坐在自己的汽车里，看着渐晚的天色和工人们为了照明点起的火把，紧张混合着兴奋让他的脸上浮现出癫狂之色。有时在政治漩涡里，有时仁慈才是最大的残忍，可惜了这些工人，如果不是白惕生畏首畏尾，自己是不希望牵扯他们的……他轻叹一声，走下汽车，来到了白惕生的身边。\n“老魏，你到底要干什么！”白惕生咬着牙低声质问魏定兴，“你是要把我们全害死才甘心吗？”\n“从专员组来的那天，我们就全完了，”魏定兴嘲讽地一笑，“我现在在救你们。”\n伴随着魏定兴的如谶语一般的劝说，一道火舌从不远处的聚集中窜了起来，照亮了已经暗下去的夜空。\n“快，快给我救火！”白惕生急忙招呼身边的两个队长，却被魏定兴拦了下来。\n“安时，你觉得你现在把他们救出来就没事了吗，你还看不明白吗？真以为是锦王登基就万事大吉了吗？朝廷的刀如今哪一时不砍在武备系的身上？无非是换成了钝刀子拉肉罢了！日割月削何时是个尽头？”\n“别说了别说了，我就当没听见今天这番话！”白惕生吓得恨不得捂上自己的耳朵。\n“你已经听见了，”魏定兴冷冷一笑，“你觉得第一批专员组首先就来了直电，难道是因为直电运转良好，应该被树立为榜样吗？你该不会不知道那些本来应该用于更新设备提升效率的钱去哪了吧？”\n魏定兴的步步逼近白惕生，他的低语犹如一颗颗炸弹，逐渐打开了白惕生的心理防线。看着越发颤抖起来的白惕生，魏定兴发出了最后一击，“你说，杀鸡儆猴的鸡需要几只呢？”"
TOD_STG.123.a:0 "“救火的事还是要慎重，不能进一步激化工人们的情绪了”"
TOD_STG.124.t:0 "设立经济专员（6）——弹压"
TOD_STG.124.d:0 "“军队来了！军队来了！”金珩看着出现在视野里的大明龙旗第一次情真意切地感到了激动。\n天黑以后工人们的情绪越发激动，不知何处的响起的枪声则彻底点燃了工人的愤怒，陈宜山的劝说再也没有了用处。愤怒的工人们直接和专员组动起了手，陈宜山身上又添新伤，在他身边保护他的几个组员也个个挂彩，不得不放弃劝导退入楼里堵上唯一的出入口拖延时间。工人们一时无法攻破他们早就加固的大门，愤怒之下居然在大楼外堆放燃料，放起了一把火，情形一下子变成了物理上的十万火急。\n“希望是我们的人，”陈宜山因为受伤声音有些虚弱，“否则恐怕今天就要交代在这里了。”\n万幸的是，陈宜山的祈祷成了真，来者的确是范云存请来的驻军，他为了补贴家用去卸车的习惯帮了大忙，扒上火车对他来说并不困难，借着运煤的火车，两人很快赶到了陈宜山嘱咐孟实英的可信的驻军的地盘，见到了驻地在此的李军。李军在向上级简略报告拿到合法调令后，随即整队出发。\n“所有人立刻放下武器，”军队劝降的声音远远响起，“立刻退回厂区，不要做无谓的抵抗……”\n看着大明的龙旗，白知府的此时已经有些站不稳了，旁边的警察队伍本就是以为是来弹压工人骚乱，见此情形自然放下了武器。在警告后撤离的工人正在逃窜，上了头仍在围堵大楼的工人则遭遇了第一轮射击，很快开始成溃散之态。一部分军队开始救火，另一部分则继续向前推进。\n魏定兴和白惕生看着四面八方围过来的军队放弃了逃跑的想法，很快和其他一些官员一起被“请”到了李军的临时指挥部保护了起来，政府几乎为之一空。但好在现在是战时状态，军队也有军管预案，总算有条不紊地接管了整个城市的秩序。\n一夜的紧张就这么过去，第二天的街道上恢复了往日或者说比往日更加宁静，仿佛昨夜这里无事发生。"
TOD_STG.124.a:0 "太阳照常升起"
TOD_STG.125.t:0 "设立经济专员（7）——提审"
TOD_STG.125.d:0 "时隔半月，陈宜山再次见到了魏定兴，本就清癯的魏定兴此时几乎脱了相，头发白了大半，最为触目惊心的是他脸上几乎深可见骨的伤痕。制造出那么大的动静，他的案子早就不是经济问题了，之前提审他的一直是锦衣卫的人，但直电的事也需要他配合，所以今日陈宜山被允许一起参与询问。\n“我再问你一遍，为什么要挑唆工人暴乱！背后有无指使！”锦衣卫的负责人沉声开口，“你的同党都招了，你再硬抗有什么用！”\n“那既然如此，大人用他们的口供结案便好，若是问我的话，我没有挑唆工人，工人也没有暴乱，”魏定兴极度虚弱但仍然堪堪保持着风骨，话未说完，他看见了陈宜山，笑了笑加了一句，“不过是见到管学系的余孽扰乱生产所以一时激愤。我没有尽到劝导之责，的确有错。”\n“住嘴，现在在说你的事！不要东拉西扯！陈主任是陛下亲自任命的专员组主任，不是什么管学系余孽！”锦衣卫的负责人拍案断喝。\n“那最好不是！”魏定兴的脸上此时居然有了一番忧国忧民之色，“我在直电干了二十多年了，我决不允许临时投机的管学系的宵小破坏它的生产，阻碍大明剿灭诸逆！”\n“的确，魏负责人你是拿直电当家啊，”陈宜山听到投机二字无名火起，冷冷开口反驳，“所以就可以把直电的利润转到自己家对吧，你自己看看账目，你也好意思说为国？到底是谁在破坏生产？你们该用来维护设备引进新技术的资金都用到哪里去了？”\n“新设备和新技术我们当然注意到了，但国家正处于钱荒状态，工人失业率本就居高不下，再引进新技术和新设备，难道再大批量裁员生生让他们去死吗？如果不裁员，为何不等经济好转，引进更新的设备？”魏定兴越发义正辞严起来，说到动情处，"
TOD_STG.125.a:0 "熬刑都没吭过一声的他眼里居然溢出了两滴泪水。"
TOD_STG.126.t:0 "设立经济专员（8）——争辩"
TOD_STG.126.d:0 "“说得好，那这笔钱呢？为什么没有体现在你们的账目里？”陈宜山打断了这个感人的场景。\n“我说了啊，经济状况不好，企业运转需要钱，自然成本变高！”\n“那你这成本也太高了，和同类企业比起来，他们在没有各种优惠政策的情况下，成本只有你的一半！”\n“你看，又是这一套管学系的理论，他们的成本当然低，毕竟他们在亏损的时候只需要降低工资或者干脆裁掉工人就好了，我们呢？哪次钱荒不是国有企业吸纳工人给他们一条活路？”魏定兴这话说的的确理直气壮，他的确算不上清廉，但是对工人算的上不错，否则他的唆使也没人会听，“你们在这里指手画脚当然容易，可我希望你们想想，那是几千个活生生的人，是几千个家庭的顶梁柱！”\n“说得好，所以你就教唆他们围攻专员组驻地是吧！你考虑过他们和他们的家庭吗？”陈宜山拍案而起，“还有你的那些安全事故，都是怎么发生的？那些该用来保证安全生产的资金又进了谁的腰包了？\n“我们的经营管理的确存在失误，不过人非圣贤，难道都要吹毛求疵？那干脆把所有国有企业都关停算了！”魏定兴的气势弱了下来，嘟嘟囔囔的为自己辩解。\n“如果你们干得好，大明的经济蒸蒸日上，会有人对统制经济对国有企业不满吗？到底是谁在破坏陛下提出的统制经济大计？”陈宜山目光紧盯魏定兴，说出了诛心之语“所以你们，才是大明最大的蛀虫和阻碍！”\n“哈哈哈……大明最大的蛀虫是我们吗？我们就算再贪，一年才能拿多少钱啊？比得起一场小小战争的开支吗？一场战争的开支又能占的上国家一年开支的多少呢？天子富有四海，不论是开疆拓土布威万方，还是各项民生开支，究其根本为的都是什么？自己视国家如私产，却要求官员廉洁奉公毫无私心，这天下最大的蛀虫到底是谁！”\n“堵上他的嘴！”锦衣卫负责人拍案大喝，然后压抑着怒火转向挑起争论的陈宜山，"
TOD_STG.126.a:0 "“陈主任也先出去吧，记住，你今天什么也没听到！”"
TOD_STG.127.t:0 "设立经济专员（9）——为之奈何？"
TOD_STG.127.d:0 "玉泰茶楼，一间被长期包下的包间里，隐隐地传出了争吵之声。\n“孔祥熙！魏定兴的事你怎么能这么干？他是为了谁才豁出去性命的？”王永江愤怒地盯着孔祥熙质问，随即有些凄然的看向在座的众人，“不论如何，把他打成大同会的，也不该是我们啊！”\n“为了谁豁出去性命？他给我们找了多大的麻烦？谁让他自作主张搞出了这么大的动静？不把他打成大同会，那你说我应该在陛下那里如何交代？”孔祥熙也毫不示弱，王永江本来也只是武备系的重人之一，现在他职权被架空，手下几员大将又连番折损，说话自然不再像以前一样举足轻重。\n“交代了又能如何？魏定兴事做的是偏激了些，可是他说的难道没有道理？”鲍贵卿觉得孔祥熙是在揣着明白装糊涂，“如果武备系人人都如他一般，我们何至于被逼至此？”\n“这是什么谬论？”朱启钤不耐烦地打断了鲍贵卿的话，“陛下只不过是巡查一下国企，其他几个有问题的企业负责人陛下如何了吗？无非退休了事罢了。他倒好，自作主张挑唆工人暴乱火烧专员组的驻地，现在事情不可收拾了，要我们为了他一个人的愚蠢行为一起买单吗？”\n“魏定兴的经济问题是怎么来的？他自己才拿了多少？武备系活动人脉的钱一大半是他和那几个被逼退休的负责人拿的！”陆徵祥开口撕破了在场诸人冠冕堂皇的面具，“现在你们……脑袋一缩，把他们卖了，以后我们还如何服人？”\n“你们早就不能服人了！你们知道这次镇压暴乱的军队是谁吗？是李军。”看着众人迷惑的眼神朱启钤补充到，“是一个一心会的狂热分子！你们要是真能服人，别让他出兵啊！若是坐实了专员组里有管学系的余孽，陛下自然不能……责怪我们。”\n在场之人自然都明白朱启钤的言外之意，若是陈宜山他们真死在了那场火中，那武备系自然有发挥空间，毕竟陈宜山确实背景复杂，可如今情形……众人不约而同地看向了一直沉默在一边的姜登选，想让他说说到底怎么回事，然而姜登选对此却只能报以苦笑。\n“天色晚了，各位明日还有公务，”周学熙开口打破了现场的沉默，"
TOD_STG.127.a:0 "“我们散了吧”"
TOD_STG.128.t:0 "设立经济专员（10）——使功不如使过"
TOD_STG.128.d:0 "“魏定兴本人依旧没有招供，不过我大明的忠良提供了不少证明魏定兴是‘大同会’乱党的证据，”杨永泰将一叠文件递给了定武帝，略带嘲讽地补充到，“少了我们不少麻烦。”\n“畅卿你说，如果把这些文件拿去和魏定兴对质，他会招供吗？”定武帝轻轻吐出这句话时面上竟然浮现出一丝愉悦之色，杨永泰没来由的打了个冷颤，一时间不知该说些什么。\n“算了，真问出什么也是麻烦。”好在定武帝也没打算真让杨永泰回答，很快放弃了这个想法。\n“陛下打算就这么轻轻放过武备系了吗？武备系好盘算，把魏定兴打成大同会，就想撇清楚自己的干系……”\n“畅卿你觉得魏定兴这个人如何呢？”定武帝没有回答杨永泰，而是反问了他一个看似无关的问题。\n“是大逆，也是疯子，但……的确是个能人，”杨永泰有些感慨，“他能在给武备系提供了大笔的活动资金的情况下维持工厂正常运营，账目如果不是专员组细查也看不出问题，居然还能挤出钱来给工人些小恩小惠。”\n“士别三日当刮目相看，畅卿也懂得惜才了，”定武帝语气略带调侃，“但他不是疯子，你说这样一个有能之人被武备系弃若敝履，那其他人还会如此给武备系卖命吗？”\n玉泰茶楼的争吵当然已经在希望成为天子心腹的忠贞之士的禀告下传到了定武帝的耳中，不过定武帝并不打算据此再做些什么了。围城必阙，如今武备系的众人既然在教化之下重新明白了作为臣子的本分，那不妨以观后效。倒是这种巡查，让他了解了不少地方上的情况，以后应该多搞。\n“可是制造出出这么大的动静，真的是魏定兴一个小小直电的负责人能做到的吗？如果……”杨永泰自然明白定武帝的言外之意，魏定兴是武备系难得的聪明人，看出了他和定武帝的香肠战术所以希望拼死一搏，然而如果这么想的不止他呢？\n“唉，你说得对，他们这些聪明才智要是用在正途上，国家经济何至于此啊！”定武帝长叹一声叫进了自己的秘书，"
TOD_STG.128.a:0 "“让蒋雁行来见朕。”"
TOD_STG.129.t:0 "处置罢工（1）——议事"
TOD_STG.129.d:0 "议事堂里的气氛有些凝固，自开战以来，虽然定武帝用尽了手段，但是经济上的困难仍旧十分棘手，开战并没有像很多人预期的那样立即解决很大一部分失业问题，甚至因为中小企业陷入困境，造成了更多失业，剩下的工人则不得不承担以前更多人力完成的工作量。在岗的工人不堪重负，失业的工人无以为生，二者交叠之下，华北地区开始出现了此起彼伏的罢工，规模也是越来越大，让顺天政府本就艰难的经济雪上加霜。\n“这帮刁民，无法无天了！国家正处于危急状态，他们居然敢罢工要挟！”孔祥熙的恼怒也并非全是因为拜入天子门庭的表忠心，“我就不明白了，既然他们认为日子过不下去，那就应该更努力的工作啊，国家已经给了他们一份工作，为什么就是不肯好好干呢！”\n“他们认为一天工作六个时辰甚至以上是人体无法支持的，要求落实五时辰工作制，就如我们之前颁布的条例说的那样。”范旭东看了看孔祥熙，想了想还是咽下了后半句不那么美妙的话语。\n“工人的要求也并非无理，只是现在处于紧急时期，加班赶工无法避免啊，”徐世昌叹了口气，“答应了他们的要求，军需怎么办？”\n“我看还是要让他们吃点苦头，否则这帮人是不会怕的！”吴鼎昌此言一出引来了不少人的附和。\n讨论暂时停止了，不少目光悄悄窥探向了御座上的定武帝，然而定武帝对此并没有表现出多大的兴趣，“还有卿家有什么想法吗？”\n“其实答应工人的要求，未必就会干扰军需供应，”罗敦伟起身解释，“现在的问题并非是工人短缺引起，而是资源配置不够平衡物资运转不够流畅所致，为今之计是保证企业正常运转，吸纳工人进入工厂工作，因此工人的要求对于目前的经济状况来说，和我们的目的实际上是一致的。”\n“可是如此一来，企业又当如何维持生存？”\n“实际上，工人罢工所带来的经济损失，并不比他们提高一些工人待遇来的小，我们可以“晓之以理”，再对愿意实行之企业尽力给予一些支持，比如生产原料的供应之类的，为了生产持续，他们会做出正确的选择的。”张素民为罗敦伟的话进行了补充，至于如何通过晓之以理让企业主们抑制自己逐利的本质，实在不行可以让他们去和监狱里的管学系学习一下嘛。\n“伯颂他们前些日子邀请了不少工商业的名流商讨工商合作事宜，如今看来，效果还是不错的，朕看这个法子也可以推而广之，将那些中小企业一并纳入这个范围，也给他们寻一条活路。”定武帝顿了顿，“劳企之合作，合则两成，分则两亡，既然如今他们无法自行达成一致……”"
TOD_STG.129.a:0 "自然应该由朝廷进行调停"
TOD_STG.130.t:0 "处置罢工（2）——调查"
TOD_STG.130.d:0 "不要开枪\n“宾臣，你接着查，这次罢工的背后到底是谁在异动，但只查一查便好，不论是何方势力都先不要动，”只有亲信们参与的小范围会议上，定武帝站在舆图前，开始对他们部署真正的计划，“伯颂你协同经委会让工人和企业坐下来谈判，只要不十分过分的要求都可以适当让步，务必尽快达成协议。”\n“陛下，这是？”张寿镛有些惊疑地望向定武帝，定武帝最近表现出的宽容与他一贯风格相反，现在看来是事出有因。\n“宾臣你给大家介绍一下情况。”\n“根据目前的情报，华北当前罢工的背后是有组织和联络的，互为援助彼此呼应，这不是工人自发组织能做到的。”蒋雁行起身开始介绍情况，“但背后的组织者我们暂时还在继续调查。”\n“同产工会？还是大同会？”杨永泰若有所思，随即想到了一种更可怕的可能，“不会是？他们又要故伎重施？”\n杨永泰没有明说，但在场的人都知道他在指谁，毕竟有先太子前车之鉴，虽然二者看上去深仇大恨，但也并非没有这种可能性。\n“现在还不清楚，然而事久生变，要尽快安抚那些工人，给他们些甜头，让这些人没有煽动的借口。”定武帝努力抑制着自己的怒火。\n“是，臣一定尽快促成复工。”\n“对了，要多派些人手看住重要的军工企业，防止有人浑水摸鱼，一旦发现行为不轨者格杀勿论”杨永泰似乎想到了什么，“还要勒令现场处置的人员，不到万不得已，不，是严禁开枪。”"
TOD_STG.130.a:0 "“畅卿说的对。”"
TOD_STG.131.t:0 "处置罢工（3）——眼见为实"
TOD_STG.131.d:0 "“在家要听奶奶的话，不要调皮啊。”鲁海摸了摸儿子的头。他的背影逐渐消失在儿子和母亲的视线内，愁容重新爬上了他的脸庞，直到不久前，他都是只是一个普通工人，然而在罢工热潮中，他年轻不怕事，又行事正直，阴差阳错竟成了和朝廷以及企业谈判的代表之一。\n谈判的过程比他想象的要顺利的多，没有他印象中的顽固不化的企业主和帮助他们威胁工人的官老爷，朝廷的人只是在他们和企业争执不下的时候提供一个折衷方案，大多数时候甚至会帮他们说些话。\n他甚至觉得这不是他认识的大明了，直到一个和颜悦色的中年男子找到他询问，是否知道代表中乱党成员都有哪些。\n鲁海没读过什么书，也不懂得什么主义，然而他知道那些工友是为了他们在争取权利，自己不能也不应该出卖他们。出乎意料的是，在得到否定的答复后，男子没有说什么便走了。然而，大明真的会这么好说话吗？\n“你让我找的好苦啊！”正在他沉思时，一个牵着一个小女孩的女人突然扑了上来，抓住他的胳膊不放，随即开始一把鼻涕一把泪的哭诉，“你这个没良心的，把我和孩子仍在外面不顾死活！”\n鲁海愣在当场，他根本不认识这个女人，对她说的更是一头雾水，“这位大姐，你认错人了，我不认识你啊。”\n“什么不认识我！你腻歪了我，也不要孩子了吗！”女人哭的更大声了，“各位路过的人给我评评理啊，我的命怎么这么苦啊！”\n女人声情并茂的表演让周围的行人纷纷驻足侧目，鲁海急忙辩解，正纠缠时，突然几个壮汉从小巷里走了出来。\n“嫂子嫂子，你和大哥的事咱们回家说，家丑不可外扬啊！”几个人边说边把鲁海拽住，鲁海向周围的人求助却收效甚微，逐渐被几人拽入了小巷打晕过去，失去了意识。\n一艘不大的货船上，胡贵抬头看看天上的残月，狠狠地吸了一口烟，“开始干活了！”\n几个大汉闻言开始动了起来，双手被反绑套着头套的周海被连拖带拽地拽上了甲板。"
TOD_STG.131.a:0 "“扑通”一声，一切归于沉寂。"
TOD_STG.132.t:0 "处置罢工（4）——人言"
TOD_STG.132.d:0 "二荤铺里，一个约莫三十来岁的男子走到灶台前对老板说，给我们炒一份软溜肉片，一份焦溜饹馇，一份干炸丸子，再打二斤酒，拼一份下酒的菜。 伙计接过钱，“好嘞，您几位先坐会儿，今儿人多。” 热菜还没上来，几个人就着果仁喝酒，顺便扯闲篇解闷。\n“哎，你们看看，风月鉴说的鲁代表的事。”\n“看了，不知道真的假的，不过那小寡妇还挺好看。”齐期的脸上带着一丝不明意味的笑。\n“可我听说我朋友说，他平时是个挺正直的人。”秦志打断了齐期的话，“应该不会……”\n“那谁知道，财帛动人心，况且他本身工资不多，又要在外面养……”\n“行啦，和咱们有什么关系，人不都这样，人家啊，这是本事！”\n一张报纸静静地躺在桌子中央，“本报讯：前日《实闻》所述失踪之鲁代表，似并非为人所害，据知情人士，其失踪前曾为一打扮入时之女子所拦，痛斥其负心，其情凄惨之状为路人所怜，鲁亦颇为所动，其工友亦言，活动所用之经费与账目所差甚远，又言，其母性情古怪，待儿媳十分严苛，以致其妻早逝。其相好之女子别居，或因于此。以此观之，其“失踪之事”盖儿女之情耳。"
TOD_STG.132.a:0 "引人深思"
TOD_STG.133.t:0 "宪政（1）——新解释？旧解释？"
TOD_STG.133.d:0 "“徐老，这是何意啊！”傅增湘拿着一叠文件，他的声音不知是因为愤怒还是恐惧有些发颤，“陛下已然圣心独断，朝廷诸部台阁均为陛下辅弼而已，何必再为此事？”\n“陛下一向觉得宪法某些条款所言于君道不合，理应修改，只是即位之初诸事繁忙，故而一直没有着手，然而名不正则言不顺，如今逆党多以此为由攻击陛下，因此需要稍加修改以正视听。”徐世昌耐心解释，然而其中之意却很明显，定武帝早有此意，如今让徐世昌他们通风，无非只是走个过场。\n在场诸人里不少神色黯淡，也有不少则怒火中烧，定武帝好盘算，先改组咨议院，再修改宪法，如今咨议院就算反对也无法掀起什么风浪了，毕竟咨议院现在的功能是为定武帝提供建议，建议么，那听与不听自然是定武帝决定。\n“恐怕此案并非稍加修改，陛下所修条款乃是先帝钦定咨议院通过颁行万民的，法者，国家所以布大信于天下，怎么能如此儿戏！”一个年老的议员站起来反驳，引来不少附和之声。\n“有些不明真相者，不知从什么渠道，看了这些歪理邪说，四处传播搅乱人心，故而陛下觉得不得不加以修改解释，以安万民之心。”徐世昌看似是在继续解释，实际则是在对刚刚附和的人表明，有些事朝廷并非不知只是不愿追究罢了，但如果他们还是不愿配合的话，那紧急状态下的法案还在持续生效。\n“宪法乃是国之根本，以正君道明臣职，就算修改，也应该经有司所拟，交由咨议院审议通过，怎么能……”\n“此言差矣，宪，法也，言圣王法天以立教于下。宪法是用来彰显我大明之天命，天子之厚德，以垂宪万民的，那么不论修改与否，自然应由陛下决断。”恽宝惠站起身打断了老议员的发言。\n“你这是在偷换概念！”孙奎刚刚并没有附和老议员，但他一向看不起恽宝惠的做派，如今看他如此摇尾乞怜更是气血上涌，不禁拍案而起指着他的鼻子怒骂。\n“这里是咨议院，不是那些蛮夷小邦的议会，孙议员，注意言行。”徐世昌的话还没说完，几个一直在角落的锦衣卫就走到了孙奎的面前把他扭出了咨议院。\n咨议院中一时鸦雀无声，很多人逐渐回忆起当初同僚被带走的恐惧，刚刚附和老议员的人更是有几个颤抖起来。而一直没有说话的武备系议员们则有些幸灾乐祸，定武帝上台后的一系列拉拢与安抚某种程度上给了这些人一种错觉，或者说，虚幻的心理安慰，让他们觉得可以通过妥协来保全一部分权力，然而如果他们熟悉定武帝的话，就会知道，这无非又是定武帝的一次火力侦察罢了。\n“各位还有什么疑义吗？”"
TOD_STG.133.a:0 "不敢有，不敢有。"
TOD_STG.134.t:0 "宪政（2）——让人言？不让人言？"
TOD_STG.134.d:0 "“这些人是疯了吗？谁给他们的胆子？让他们敢如此妄议君父？”定武帝将一份《实闻》掷在了桌子上。\n呈上这份报纸的赵裕见定武帝勃然大怒有些忐忑，而出主意的陈焕章则更是不安。因为让定武帝生气的报纸并非是应天、西安或者其他敌对势力的，而是顺天甚至说就是定武帝自己的。\n陈焕章也是不久前才知道，一向以品评时事发掘真相著称，连总编辑都被抓了好几任的《大明实闻》，实际上是由大明皇帝私人出资助的，用来引导舆论，以及，给某些危险分子一个可控的发生渠道。然而由于先帝驾崩仓促，废帝又笃信不应钳制舆论，加上定武帝拨乱反正，《实闻》的总编辑赵裕被定武帝纳入了通缉名单，一时间处境十分尴尬。待到赵裕联系上陈焕章说明情况时，《实闻》全体已经几个月没有发工资了。\n陈焕章急忙将此禀报了定武帝，定武帝其实也不知道这是否属实，然而陈焕章的一番话打动了定武帝“不论是否属实，各方势力一向通过实闻放出消息操控舆论，陛下不妨籍此‘体察民情，辨别忠奸’”。\n是便有了《大明实闻》在定武帝的允许下刊登痛斥他“妄操独治”的文章，进而引来了不少人的响应，逐渐露骨到今天这篇直接痛斥他独夫民贼的独家文章，当然，其中最为危险的部分已经被赵裕以保护作者的借口修改了。\n定武帝冷静下来也注意到两人神色变化，意识到自己失了态，“朕失态了，子丰干的不错，你放心去干就是。”\n“臣多谢陛下不怪罪臣冒犯皇威。”赵裕仍旧低头敛容，既然不清楚定武帝到底是什么性子，那就便先不要多说。\n定武帝虽然不再暴怒但余火未消，也实在懒得纠缠这些事，吩咐赵裕继续收集文章陈焕章组织反击之后便让两人退下。拿着赵裕呈上的名单和几个重要之人的稿件扫了一眼，不出意料，有好几个自己熟悉的名字，他一向觉得这些人只有口舌之能不足为虑，即位以来又忙于军务和平衡各方势力，故而多有宽纵。虽然紧急状态下对于言论自然是有诸多限制，但迫于人力有限，也始终处于睁一眼闭一眼的状态，没想到自己的宽纵居然让他们得寸进尺了。儒以文乱法，侠以武犯禁，而人主兼礼之，此所以乱也。"
TOD_STG.134.a:0 "看来是时候再整顿一下咨议院了！"
TOD_STG.135.t:0 "宪政（3）——子产不毁乡校……"
TOD_STG.135.d:0 "咨议院高高悬挂的龙旗因大门打开带来的气流搅动猎猎作响，平时为了彰显庄重与威严的红金配色此时便显得有些可怖了，一队训练有素的锦衣卫走了进来，径直走向了早已圈定好的几个议员的席位。\n“你们这是要干什么？这里是咨议院！”钟刚中见锦衣卫光明正大冲进咨议院，而同僚竟然因为惜身甚至没人敢于站出来指责，不禁又气又悲。\n在大明抓几个议员当然不是什么大事，但是出于维护双方的体面以及彰显对于咨议院的重视，抓捕一般都是秘密进行，极少当众抓人，更不会像这样冲进咨议院直接带走。定武帝也知道这个惯例，然而他的目的便是震慑咨议院诸人以及打碎咨议院本不该有的神圣性。\n“打扰各位了，我们是根据此前颁布的紧急时期国家安全条例，抓捕涉及串通敌伪的乱党。”领头的锦衣卫负责人倒也客气，微微欠身行礼。\n此语一出本来还有些窃窃私语的会场瞬间安静下来，其实在场诸人也不是没有心理准备。因为反对修改宪法，咨议院不少人动了起来，他们能做的事有限，因此便想到了大明实闻，希图用舆论让定武帝妥协，然而效果十分有限，更糟糕的是，这个举动恐怕让定武帝注意到了这份小报，几天前《大明实闻》被查封了，看来一些筹划此事的人恐怕已经暴露了。\n“子年，回到席位上吧……”钟刚中还想说些什么，却被傅增湘拦住，傅增湘想说些什么却也说不出来，只得以哀求之色请他慎言。傅增湘有些后悔，若是自己当初没有接受徐世昌的延揽，如今也不必如此为难了。定武帝的恩德可不是好消受的，若是钟刚中真说出什么惊人之语，那自己恐怕也……\n傅钟二人正拉扯间，就见到咨议院的大门又一次被推开了，从配置及仪仗来看，应该是传旨的队伍，为首的使者则是定武帝的政务秘书。在众人的惊讶疑惑之中，政务秘书开始宣读定武帝的诏书：\n“夫宪政之设，本在通民隐而佐宸枢；咨议所司，原为达群情而裨国政。然尔诸臣，溺党私而忘公义，挟门户以扰天听。攻讦之声震于朝堂，倾轧之迹深于鼎镬。郑驿纷争，徒效蜗角蛮触；萧墙构衅，竟欲啮蚀甘泉，坐误军国机要，几倾社稷栋梁。  \n当此危局，岂容因循故纸？临兹巨变，安可拘守陈规？咨议旧制，本备顾问于清光；国是维新，当擢良谟于紫闼。自今伊始，当研几析理，穷经国之渊薮；稽古揆今，献治安之药石。凡有惑视听者，皆以乱制论罪。”"
TOD_STG.135.a:0 "那这还是咨议院吗？"
TOD_STG.136.t:0 "宪政（4）——匹夫一怒……"
TOD_STG.136.d:0 "京郊，一组车队正平稳行驶在公路上，定武帝坐在车中翻看着讲稿，不时勾勾画画。今天是陆军大学的毕业典礼，定武帝将会出席演讲并对优秀毕业生进行褒奖，以激励这些青年军官们为国效力。他没把这当成公务，反而觉得是浮生偷得半日闲，终于能干点自己喜欢的事情了。\n然而他的好心情并没有持续太久，巨大的爆炸声和气浪让他突然失去了平衡，他下意识地护住了自己的头部，然后只觉得天旋地转，待到反应过来时，他已经被惯性甩到了翻倒的轿车的一边。\n很明显，有人安放了炸药要刺杀定武帝，但是起爆的时间大概没有掌握好，爆炸的中心并不是定武帝所在的位置，他的座驾也足够结实没有太大变形，定武帝除了因为车辆翻倒有些擦伤外，并无大碍。此时已经反应过来的随行人员们急忙过来试图将定武帝从车中救援出来，并按照平时的训练围在定武帝身边，防止周围有隐藏的其他刺客。然而意想不到的状况发生了，围拢过来的人群中，一个年轻的侍卫突然拔出了自己的手枪，对着定武帝开始射击。\n定武帝此时刚刚被从车中拉出来，几乎是依靠本能地进行闪躲，然而刺客的距离太近了，就在千钧一发之际，一个年轻的身影直接扑到了定武帝的身上，替他挡住了致命的一发子弹。定武帝清醒过来，他急忙蹲下身，并向着汽车处移动寻求掩护，贴身的几个随从则用身体将定武帝死死护住。开枪的侍卫又连发几枪但已经无济于事了，很快就被反应过来的人群控制住。\n“陛下，陛下没事吧，”从车队其他位置看到情况的蔡成勋等人气喘吁吁地赶了过来。\n“朕没事。\n定武帝神情十分复杂，脱掉了自己的外套，蹲下身覆在了为了掩护他毙命的秘书的身上，亲自用手帕擦净了死者脸上的血污。随行的人员见到定武帝如此神色自然也不敢说什么，各自分散去清点死伤者以及请求支援。\n“陛下，今天的行程是否……”蔡成勋小心翼翼的看向定武帝。\n“今天的日程安排继续！”定武帝的语气十分平静，但眼神里的愤怒却是抑制不住的。\n“陛下这太危险了，如果再有刺客，那……”一直沉默的杨永泰开口劝道。\n“没有国家大事因为这些宵小退让的道理！”定武帝斩钉截铁，没给任何人反驳的机会，“你们清点一下死伤者，朕要亲自感谢他们，然后咱们就去陆大！”\n京中的支援不多时便赶到了现场，定武帝带着一行人对着牺牲者三鞠躬，又亲自将死者遗体送上汽车。目送运送死者和救治伤者的车辆离开后，定武帝的车队重新向着陆大的方向驶去。\n陆大的会场里，毕业生们仍旧坚持不愿离去，而更多的到消息的学生，也纷纷在校方的纵容下来到了席位上。\n终于，在漫长而煎熬的等待后，定武帝坚定英毅的身影出现在了他们面前，会场中爆发出了山呼海啸般的呼声，"
TOD_STG.136.a:0 "“万岁！”"
TOD_STG.137.t:0 "忠君报国（1）——治学治校"
TOD_STG.137.d:0 "“你们不知道，那是我这辈子第一次见到这么壮观的场景，整个陆军大学几乎所有的学生全跑去了，老师们拦不住也不想拦，”严子才看着两个表弟羡慕的神色，越发眉飞色舞起来，“我们人挤着人，都想亲眼确认陛下没事，等到陛下进入会场的时候，都不用组织，终于放下心的大家一起自发山呼万岁。”\n“这也太惊险了，刺杀计划环环相扣，陛下真是有天命啊！”林崇轲听得入了迷，待到严子才讲完击节赞叹，“苍天保佑！”\n“也不光是天命，陛下若是不宽以待下，谢秘书也不会以死相报啊。”严子才又回忆起了那一天在激动的人群里听到的消息，“我们在会场等了陛下很久也是因为陛下在致敬死伤者，还亲自把伤者送上了救援的车辆。陛下如此抚慰下情，臣下们自然愿效死力。”\n“唉，我真羡慕表哥你啊，舅舅那么开明，你说投军便投军，我爹就是个老顽固，”林崇丘叹了口气，“我还得在这个破学校读这个破书，老师们全是一帮反贼，之前每天上课都是管学系那一套，现在不敢明目张胆地说了，就开始阴阳怪气。我就不明白了，陛下怎么他们了，诋毁陛下对他们有什么好处吗？”\n“还有这种事？”严子才虽然也就二十五岁，但常年待在军中对这些了解的确不多。\n“还有？这种事多了，我哥他们还算好的，我们学校一群自由平等爱好者，一边说着自由平等，一边不许我们反驳他们对大明的污蔑之词，”林崇轲年纪小性子也急，提起这事便给自己气的够呛，“言论自由，但仅限于他们自由，我们说什么他们就攻击我们保守，一起孤立我们。”\n“唉，还是抓的少了啊，陛下就是太仁慈了！”严子才叹了口气给两个表弟斟上酒，“拿着大明的钱还要诋毁大明，真就是一边下跪一边用讨饭的碗砸朝廷的头。”\n“其实也没多少人支持他们，当初管学系在的时候他们的日子过得好，自然怀念，但又不是所有人的日子过的都好，”林崇丘毕竟比林崇轲大上几岁，倒没那么生气，“实际上就那几个闹的欢，自从陛下登基后以铁腕手段整治过学风之后，大部分人还是安分读书，不参与这些乱七八糟的事的。”\n“你说你们反驳他们对陛下的污蔑之词？”严子才突然想到了什么看向林崇轲问道，“你们是零散的回击还是也有社团？”\n“我们当然也有社团啊，还有一些人不在社团里，但也时不时也参与我们的活动和讨论，这帮人怕被那群疯子纠缠上打入另册，我不怕，我就要和他们对抗到底！”\n“来来来，我们的小战士辛苦了，快吃个虾，”林崇轲尚带稚气的面庞配上热血的话语让林崇丘有些好笑，随手夹了一个虾安抚，出于礼节又夹了一个给严子才，“表哥你也吃。”\n“崇轲是对的，一味容忍退让更会助长这些逆贼的嚣张气焰，”严子才没有管碗里的虾，"
TOD_STG.137.a:0 "“我倒是有个想法，不知道崇轲你们打算试试吗？”"
TOD_STG.138.t:0 "忠君报国（2）——邀请"
TOD_STG.138.d:0 "“哦对了，还有件小事得商量一下”定武帝突然叫住了已经在收拾东西的几个心腹，“顺天航空大学的学生上书说想让朕也去参加他们的毕业典礼，朕看他们言辞恳切，要不就破例参加一下？”\n坐在下首的徐世昌等人早已经习惯了定武帝时不时增加议事议程的习惯，放下已经收拾好的文件，坐回了位置上。然而几个人谁都没有开口，定武帝和高校间那激烈的交流他们是知道的，让定武帝去顺天航空大学？这到底是谁想出来的？\n“陛下，这似乎不太符合定制？顺天航空大学的级别您亲自去观礼，是否……”徐世昌斟酌着开口打破了沉默。\n“所以是破例嘛，朕自登基以来，还没有参加过这些学校的观礼呢，既然这些学子愿意邀请朕，朕也不打算让他们失望。”\n“陛下，这是否……有些危险”之前定武帝遇刺时杨永泰也在现场，当时的惊心动魄让他至今有些心悸。杨永泰的话在场几人也都同意，这帮学生最是热血，谁知道会干些什么，可要是安排一队人看着学生，那还不如不去呢……\n“这有何危险啊？”定武帝看徐杨两人居然难得的统一了意见，略一思忖，心中也大致有了些猜测，见无人应答便半开玩笑道，“怎么？大明的学政部只擅长培养一批反对大明的学生吗？”\n“那自然不是，只是之前清政和管学系在此势力颇深，一时难以肃清。”\n“这不是也有忠诚于我大明的学生吗？”定武帝笑了笑，“清政和管学系之前一手遮天，这些孩子们备受打压，如今逆党成擒，朕要是惧怕宵小作祟不去观礼……”"
TOD_STG.138.a:0 "岂不是让他们寒心？"
TOD_STG.139.t:0 "忠君报国（3）——办事"
TOD_STG.139.d:0 "陶兰泉坐在傅增湘的书房里，细细观赏着傅增湘新挂上的古画，嘴角露出了一抹不易察觉的微笑，“沅叔，你上次那个条幅那么好，怎么撤了？”\n傅增湘瞥了他一眼，“怎么，这画不好看？”\n“那倒没有，只是上次赏玩没看够罢了，你什么时候再把它挂出来？”\n“恐怕挂不出来了，那条幅挂在这里格格不入，我已经烧了。”傅增湘懒得再打机锋，颇有些心灰意冷地吐出了这句话。\n“沅叔，这是怎么了？陶兰泉见傅增湘脸色不对也严肃了起来。\n“顺天航空大学有一群学生，不知道想起来了什么，想请陛下去顺天航空大学观礼。”傅增湘苦笑起来，“徐世昌让我去和校方交涉，希望把这件事办的漂亮一些。”\n“陛下愿意观礼，通知他们准备就是，现在还派你去协商，已经是极尽尊重了，”陶湘有些不明白傅增湘为何苦笑，“这有什么难处吗？”\n“一纸诏令下去高校自然要遵从，然而他们一向对陛下……有偏见，陛下……尊师重教也不愿与他们再增冲突，”傅增湘说到尊师重教四个字的时候下意识地闭上了双眼，“可是你知道陛下是如何尊师重教的，他们能老实从命吗？”\n傅增湘不禁抱怨起来，徐世昌说自己在士林有名望，所以让自己去交涉，他没有名望吗？无非是不想被讥讽。虽然如此想，但傅增湘也不敢推托，他早早接受了定武帝的橄榄枝，显然定武帝招揽他们不是为了让他们反对自己的，可之前修宪风波时他第一个站出来质问，后来又没有及时阻止钟刚中，他实在是不敢再有违皇命了。\n“嗨，这事啊，”陶湘不禁觉得有些好笑，“管学系不是都在监狱里了吗？你先去和校方谈谈嘛。”\n“我也带几个锦衣卫去和他们聊聊？”傅增湘嗤笑出声，“那需要我去吗？”\n“用不着如此，顺天航空大学也得考虑他们明年的拨款和招生，对吧？”陶湘摇了摇头，“况且我记得恩考选调他们也有不少人参加吧，你倒不必视他们如虎。”\n“读书应该是为了明理开智，如今却对他们以利益诱之，长此以往学风怎么可能良好？”傅增湘长叹一口气，“未得志之时已萌贪饕；既得志之后，咨其掊克，惟以金多为荣，不以行秽为辱，屡玷白简，恬然自如，虽有清议，置之不恤。”"
TOD_STG.139.a:0 "“那这样沅叔，要不你把这差事推了？”"
TOD_STG.140.t:0 "现代君主制（4）——具是君恩"
TOD_STG.140.d:0 "傅增湘忐忑不安地跟在定武帝的身后，只希望今天不用再看见锦衣卫。或许是因为协商颇为顺利，定武帝颇为罕见的主动让步，表示自己只是观礼不必强制学生出席。但愿定武帝看到稀稀落落的会场后别忘记这是他自己同意的。\n心中实在不安之下，他便借着看看是否妥当的借口让友人引着他先行来到了会场。然后他发现自己的担心颇为没有必要，不管出于什么原因，会场内座无虚席，整个学校的学生到了个七七八八，甚至还有人在增设座位，明显是有不少预计之外的参加者。\n随着预定的时间临近，会场逐渐安静下来。定武帝的出场自然不会像在陆军大学那样得到山呼海啸的欢迎，但既然定武帝表示连出席都不强制，也就更不会纠结这些。\n典礼一切进行的十分正常，定武帝遵守了自己的承诺，没有将此变成皇权的表演秀，甚至发言都很简短。似乎并不是他固执地坚持打破惯例要来X大观礼，反而只是履行一项正常的公务一般。\n当定武帝一行步出会场时，傅增湘长舒了一口气，终于结束了，还好没有他想象中稀疏的现场或者激烈的冲突。随即开始为自己的如释重负感到羞耻，他说不好自己作何感受，庆幸太过无耻悲哀却更无立场，只得化作一声未能发出的叹息。\n嘈杂声打破了傅增湘的纠结，他抬头观瞧不禁心里一紧，在定武帝的必经之路上，一群学生打出了追求自由的标语。徐世昌回头埋怨地看了他一眼，杨永泰的目光则更加露骨，他本应恐惧却不知为何双眼只是盯在那稀稀落落的几个学生身上，虽千万人吾往矣。\n在众人各异的神色中，定武帝挥退了打算驱逐学生的工作人员，"
TOD_STG.140.a:0 "“享受你们的自由”"
TOD_STG.141.t:0 "现代君主制（5）——君民一心，亲如一家"
TOD_STG.141.d:0 "陆军大学的操场上，虽然是休息时间，但仍然可见年轻的军官们三五一组的进行操练。定武帝来到严子才面前时，他正在一群看热闹不嫌事大的同袍们的围观里，吊在单杠上和吕涛较劲。\n“严子才，你最近长本事了啊！”围观的学生们转头去看，才发现是定武帝圣驾到来。\n众人习以为常地围向了定武帝，被点名的严子才则立刻从单杠上跳下来，敬过军礼后老老实实地站在了定武帝面前。\n“几天不见，你是越来越有本事了啊，”定武帝虽然作色发怒，但语气却明显是笑骂，“你表弟那个鬼主意，是你给他出的吧？”\n“是，”严子才的脸上露出一丝不好意思，“陛下知道了？”\n“你说呢？朕大费周折的去观礼，总得见见邀请朕的人吧。”定武帝想起了林崇轲见到他时的激动又忍不住笑了出来，他当时费了半天劲才让这孩子能正常说话。\n“唉，这小子命真好。”严子才小声嘀咕。\n“你先别说他命好，你先跟我说说，你怎么想的这个主意，”定武帝喝止了严子才转移话题的打算，“你知道为了你这个鬼主意，多少夫子磨破了嘴皮子吗？”\n围观的学生们发出了一阵低笑，他们自然都见过定武帝口中的夫子，毕竟徐杨二人时常需要劝谏定武帝不要把时间过多浪费在陆大操场，想想他们和学校的老顽固们交涉，那真是太令人开心了。\n“报告，陛下说过要学会主动出击，”严子才故作正式的敬了个军礼，“进攻就是最好的防守，我就是给他讲了讲兵法！”\n“哈哈哈哈哈哈哈”定武帝被严子才逗的笑出了声，一手指着他却说不出话来。\n“我看这是打不过人家，回家告状了。”围观的人群里却有胆大者做出了评价。这评价倒也贴切林崇轲这的确就是打不过人家，回家找家长告状，难得的是“家长”还愿意搭理他。\n“报告陛下，我知道错了，”严子才再次敬了一个军礼，“下次我保证让他自己打，不许这么丢人了。”\n“哎，这就不对了，兵法还说过‘凡战者，以正合，以奇胜’”定武帝笑着拉过严子才整理了一下他因为运动有些歪扭的领口，“能协同作战，单打独斗干什么？”"
TOD_STG.141.a:0 "陛下说的是呀！！"
TOD_STG.142.t:0 "社会福利（1）——安抚人心"
TOD_STG.142.d:0 "李宣倜又一次走在宫巷中不禁感慨万千，几个月的时间让他彻底明白了什么是世事无常，从骤居高位再到突然跌落，个中滋味也只有他自己知道了。如果没有……就好了，他努力把这些没用的思绪赶出了自己的头脑，开始重新熟悉自己的方案以及其中的每一个细节。\n宫巷的路并不长，他很快被引到了定武帝接见臣属的地方，传召的消息来的很快，让他略略松了口气，安定下心神，走入殿中，面对定武帝站定，郑重地行了一个大礼。\n“朕看到你的上奏了，想听你具体说说。”定武帝将手里的文件处理完放下，看向仍旧跪着的李宣倜，“起来吧。”\n“臣谢陛下，臣以为陛下应当广施仁政，尽快出台一些法案改善百姓生活，减少战争对百姓生活的影响……”李宣倜正欲继续往下说却被定武帝打断了。\n“广施仁政自然是应该的，然而如今国家正处于紧急状态下，军需日急，难免暂苦吾民，尽快结束战争，才是爱民之举。”定武帝有些不以为然，然而还是让李宣倜继续说了下去。\n“陛下，正是因为国家处于紧急时期，才必需尽快安抚民心，将士在前线浴血拼杀捐躯抗节，所忧虑者不过父母妻儿，若是黎民陷于饥寒，那恐怕于士气也绝非好事。”\n“爱卿是说很多军属家庭无以为继？”定武帝的神色严肃了起来，十五从军征他是读过的，难道如今大明的将士将士也沦落至此？\n“情况恐怕不容乐观，自开战以来，物价虽几经平抑但仍在上涨，士兵若是正常领取薪资，那么家中尚可维持，可若是受伤退役或牺牲，光靠抚恤金一家人很难为继。”李宣倜为定武帝解释了抚恤金的具体数额与物价指数，中间夹杂了一些实例，他这个“战争伤亡将士褒奖与抚恤事务处置使”显然是没有什么事情做的，也就有了许多亲自接待遗属的时间，自然有不少令人闻之落泪的见闻。\n“唉，国事艰难，朕对不起这些为国效力的将士啊，抚恤的事，你带人……”\n“陛下，抚恤只是一时之计，根本还在于保障民生，在不影响战局的情况下减轻百姓的负担。”李宣倜见定武帝对此仍然没什么兴趣，于是换了一个角度，“咨议院诸公常常自命‘为民请命’。德政实出自天子，他们却借此为名蛊惑百姓、隔绝上下，都是因为法案提出往往来自咨议院。如今陛下已经让咨议院回到了它该有的位置上，自然应该让百姓看到陛下的爱民之心，沐浴天子盛德，以激励将士提升人心。”\n定武帝思索了片刻，望向李宣倜，“那依爱卿看来，应当如何？”\n“臣认为如今之计当妥善安置伤残军人，给生活难以为继的失业人群提供最基础的补助，催缴军需过于急促之地应给予补偿政策，对于如今世面紧缺之物资拨付一些用于缓解民用压力……”"
TOD_STG.142.a:0 "“你说的有理”"
TOD_STG.143.t:0 "社会福利（2）——老兵"
TOD_STG.143.d:0 "定武帝在李宣倜的引导下，来到了丘木家的院子，推开吱吱作响的大门后屋内只有一片漆黑。随行的工作人员连忙想去将灯点上，却发现屋中没有任何可供照明的器物，好在有机灵者，随即提出去找周围的邻居借些蜡烛。\n定武帝摸黑缓步向半躺在床上的老人走去，顺便责怪随行的工作人员，“快把门关上，别吹到老人家。”\n早有人告诉了床上的老人来者是陛下，本就激动无比的老者此时更是痛哭流涕，“陛下，草民叩见陛下……”说罢几乎医学奇迹一般地想从床上爬下来给定武帝行礼，被身边怕他自己把自己折腾散架的侍从拉住。\n定武帝看着瘦的已如骷髅一般的老者，心里十分不是滋味了，脱下了自己的大氅给老者盖在身上。被搀扶回床上的老人兴奋异常，向定武帝和他身边的吴佩孚敬了一个军礼，“没想到陛下还能记着我们！”\n“丘伯家世代从军满门忠烈，本人是参与过明俄战争的老兵，曾经几次负伤，大儿子战死于欧战，但他还是把小儿子送去了军队，前两天传来消息，也殁身于军中……”李宣倜讲述的这段光辉的经历和眼前这个枯瘦的老者重合时，定武帝深深地吸了一口气，大明的荣光来自于这些军人的牺牲，可是战争过后，又有多少人记得他们？\n“老人家，您今年多大啦？什么时候从军的？”定武帝实在不知说什么，便找了一个标准的问话打开话题。\n“我今年68了，十五岁上我就投了军，二十岁那年，我就跟着X将军去打俄国鬼子了！”床榻上的老人眼中闪出了一丝光芒，随即开始絮絮叨叨自己以及儿子的从军经历，说到两个儿子，他混浊的眼眸里光亮又消失了，涌出了一行浊泪，“当初老大没了，他们都劝我别让小儿子当兵了，可我老丘家没有孬种，老二他也是好样的，就该打那些乱臣贼子……”\n说话间，出去借蜡烛的工作人员回来了，点上蜡烛，屋里总算有了些光亮，丘老伯的模样也就更清晰了，定武帝端详着老人的模样，声音带上了些哽咽，“满门忠烈，大明对不起你们啊！您家里还有什么人吗？谁照顾您生活？”\n“我还有个孙子，上午去卸货了，我让他别去了，可这孩子说最近给钱多非得去。”\n“李宣倜，”定武帝转身吩咐，“以后丘老伯的赡养由抚恤委员会负责，还要统计其他类似的情况，都一定要照顾到位！”\n在丘老伯的依依不舍里，定武帝最后对着他回敬了一个军礼，缓步走出了这个几乎一片荒芜的院子，李宣倜则落后几步安排人帮丘老伯拾掇屋子补充一些基本的生活物资。周围居住着的百姓已经在故意散播的消息下挤在了门前，希望一睹圣容，工作人员也得到了不要阻拦的指令，于是放任他们靠近定武帝。\n定武帝免了这些百姓的行礼，一面沿着小路走向车驾，一面询问那些较为大胆靠上前来的老百姓生计如何。杨永泰看着拥挤的人群，又看看把大氅留给丘老伯的定武帝，有些担忧地开口道，“陛下，龙体重要，天气太冷了，您快回车驾上吧。”\n“朕穿着这么厚实的衣服还冷，百姓们穿的那么单薄就不冷了吗？”定武帝摆了摆手，“朕没事。”\n“谢谢陛下呀，给我们卖那么便宜的炭。”一个颤巍巍的白发老妪拽着定武帝的手止不住的道谢。老妇人口中的便宜的炭是顺天政府最近以定武帝的名义颁布的几项福利政策之一，保证在战争造成的物价飞涨之下，不至于因为缺乏取暖之物冻死人……至少不能比往常多冻死太多。\n“唉，朕对不起朕的子民啊，七十者衣帛食肉，黎民不饥不寒……”说到黎民不饥不寒时，一行热泪从定武帝的脸上滚下，"
TOD_STG.143.a:0 "“你们受苦了……”"
TOD_STG.144.t:0 "民意（1）——汹汹民意"
TOD_STG.144.d:0 "杏花楼门口，几个师傅一字排开，拿干净的抹布按着冻羊肉切片，师傅的刀工极为熟练，老板会做生意，选用的肉也好，一时间竟引来不少往来者驻足观看。\n叶秋和方瑾很少见这种表演，不禁被吸引住了，看着酒楼里冒出的热气，两人也有点意动，旁边的伙计见此急忙上前，将还在犹豫的两人让进酒楼。酒楼一共分三层，一层是散座，二层三层则是雅座，伙计鉴貌观人，也知道这两个学生没钱去楼上点菜，便将二人引到了一楼的一处僻静处坐下。\n“哎，你们听说了吗，最近又抓了一批议员，啊不，乱党。”隔壁桌的几个壮汉围着一个锅子，一边吃肉一边喝酒，此时已是半醉，嘴里便开始把不住门了。\n“早该抓抓了，这帮人对国家有什么用？天天就会搁那说说说，也没见他们管过我的死活。”钱羽恨恨说完，抓起白酒一杯下肚，又夹了一片羊肉蘸满麻酱送入口中，以掩盖劣质白酒的辛辣。\n“毕竟是议员啊，大明朝多少年不这么干了。”对面的男子四处看看，压低了声音才敢说出来。\n“议员怎么了？咱们有资格去投票了？”张硕打断了他的话，“那些议员们光会给那些良心喂了狗的工厂主说话，幸亏陛下拨乱反正，就这样，还得被他们变着法地诋毁，真是让人不寒而栗。”\n叶秋坐在一旁听的只觉得气血上涌，不顾方瑾的劝阻，冷冷开口嘲讽，“还真是爱国志士，大明的战士要是都像诸位一样忠心，那何愁乱党不灭啊，这么忠心，怎么不去投军啊？”\n坐在旁边的四人虽然听不懂王之爪牙是什么，但也能听出来这是在嘲讽，脾气火爆的钱羽一拳砸在了桌子上，“怎么了？不该忠心吗？你连你的国家都不爱，你还能爱什么？爱你旁边那个小妞儿？”\n“你嘴巴给我放干净点！”叶秋腾的站了起来。\n“我说什么了？我说错了吗？没有前线战士的浴血拼杀，你能在战乱里护住你旁边那姑娘？”钱羽足足身高八尺，站起来犹如一座铁塔一般，“陛下登基了，给我们和工厂协调了工资，还出台了不少福利政策，不必那些只会喊着爱民，什么也干不成的收了乱党龙元替他们说话的文人要强？”\n“那些议员他们也是为民请命啊！”叶秋有些口不择言，急得旁边的方瑾使劲拉他的袖子想让他不要再说了。\n“什么为民请命？不过是替养着他们的企业主摇旗呐喊罢了！为民请命怎么没见他们为我们说话啊？五时辰工作制怎么还是陛下亲自推动才落实的？”张硕也站起身走了过来，加入了这场争端。\n“那不是一个国家应该做到的最基础的保障吗？”叶秋真不知道这是什么逻辑，做该做的事什么时候成为恩赐了？\n“陛下自登基以来虽然事务繁忙，但总可见到亲自体察下情的新闻，你说议员们是代民请命传达下情，那他们又何时真正去关心过那些不能投票的百姓？”一个花白胡子的老者出言打断了叶秋的质疑。\n在陈焕章的建议下，定武帝此前只着单衣慰问百姓的事情并没有见报，反而是在宣传部的推波助澜下，以口口相传的方式让大部分人相信这是一条秘闻而非廷的宣传材料，达到的效果竟出乎意料的好，老者今日的发言，便是从此而来。\n“行啦行啦，跟这学生娃计较啊，”眼见气氛越发紧张，刚刚引起话题的男子也有些担忧，赶紧打起了圆场，“他们从小娇生惯养，哪里吃过什么苦楚，跟他计较什么啊。”\n“是啊是啊，咱来这酒楼是来吃饭的，生这么大的气干什么？”被两人争吵吸引了目光的众人也纷纷劝了起来。\n众人劝回了张硕和钱羽，叶秋也被方瑾拉着坐下，透过已经烧开的火锅冒出的热气，"
TOD_STG.144.a:0 "他只觉得眼前的世界变得扭曲而诡异。"
TOD_STG.145.t:0 "民意（2）——人心似水，民动如烟"
TOD_STG.145.d:0 "“释堪立了大功，”定武帝看向恭敬地站在自己面前李宣倜连连赞叹，“这次的法案效果如此之好，你功不可没啊。”\n“臣不敢居功，”李宣倜做出了一副诚惶诚恐的表情，然而定武帝还是捕捉到了他眼中闪过的惊喜。李宣倜自上次随同定武帝慰问军属之后，见到定武帝对自己的态度没有什么变化，以为自己最后的努力也失败了，如今见定武帝如此褒奖实在是喜出望外。\n“你身处闲职，仍能如此奉忠为国，自然当得起这份夸赞，”定武帝这话的确出自真心，李宣倜给他的一系列建议帮他争取了不少民心，也解决了他不小的麻烦，就连那些自诩为民的文人也失去了鼓噪的土壤，安静了许多。\n“臣，臣辜负陛下重恩铸成大错，本当尽力弥补，怎敢玩忽懈怠尸位素餐……”\n“朕知道你只是碍于情面受人所托，”定武帝摇了摇头，脸上带出了一丝惋惜，“为什么不为自己辩白呢？”\n“陛下对臣委以重任，臣却遇事糊涂、辜负圣恩，几乎陷陛下于险境，臣不敢辩解，臣罪该万死。”李宣倜从一开口便已跪在了地上，此时说完这一番谢罪之词早已是涕泗横流。\n定武帝俯视着李宣倜神色十分复杂，李宣倜出身清流但却投身军旅，在北美战场上与他相识，并很快成为了无话不谈的好友，后来定武帝被困京城的日子里，李宣倜也是定武帝府上的常客，通过自己文武两途的朋友为定武帝争取了不少的支持和同情者。\n“你的确糊涂，朕以为你我相交多年，君臣相得无人可比，所以将最心腹之事委托与你，你却耽于所谓朋友之义！难道朕与你就没有朋友之义吗？”定武帝作色发怒，却话里话外透露着惋惜。\n“臣……糊涂……”李宣倜长伏于地痛哭不已。\n“可你是朕的生平故人，朕实在不忍心就这么废弃，”定武帝的话锋一转，“朕既然没有处罚那些教……请托你的人，又怎能只处罚你呢？民政部自变乱以来一直缺一个干才主事，朕想让你挑起这个大梁。”\n李宣倜下意识地抬起头震惊地望向定武帝，民政部的侍郎之职是满员的，定武帝此意便是要让自己主政民政部，大悲大喜之间，李宣倜一时竟然说不出话来。\n“起来吧，朕仔细看了你的条陈，每一个数据和提议都是费了心思做的，并没有因为身处逆境便意志消沉以私废公。”定武帝走到李宣倜身边，将他扶了起来，“你在民政部的位置上也要继续如此。”"
TOD_STG.145.a:0 "秦穆饮盗马，楚客报绝缨"
TOD_STG.146.t:0 "受命于天，既寿永昌"
TOD_STG.146.d:0 "定武帝站在巨幅舆图前，看着前线告捷的电报，他并没有感到激动，却感叹着今日终于能睡个好觉了。从废帝逃窜以来，他无数次从梦中惊醒，没有父亲或者兄长苍白的魂魄，只是梦到了那支离破碎的大明山河。他一生最大的愿望便是以枪炮将大明的教化传播于寰宇之中，然而不完美的执行和不必要的仁慈，让他放走了最不该放走的祸首，大明陷入板荡黎庶苦于战火，那些统制国也纷纷起了不该有的妄想。\n不论是北美战场上以自己为饵的兵行险招，还是顺天之变的孤注一掷，他从来没有怕过什么，他足够的自信也足够的勇敢，自信自己不会失败，也不怕面对最惨烈的结局。除了，亲手肢解大明的恐惧，随着战事的焦灼，不安和负罪感与日俱增，让他几乎不敢面对。\n可他朱镕坤不是只会逃避的懦夫和废物，他把自己投入更多的公务之中，用近乎自虐的方式进行着他自己都不承认的隐秘的赎罪。只要他还活着，大明就绝不会分崩离析，他会用此生恢复大明的荣光！\n终于，终于，前线的捷报传来，他终于可以稍稍安心，终于可以放下一点对于大明的愧疚。他并没有去太庙告祭，因为他不知道该和昌德帝说什么，他怕昌德帝的幽影怒斥他轻浮急躁毁坏大明根基，又怕昌德帝拿到那用血亲的骸骨写成的电报连魂魄都气的发抖，更怕自己忍不住在昌德帝的逼问之下说出那些隐秘，让昌德帝陷入和自己一样的负罪地狱。所以他只是站在这副陪伴自己多年的舆图之前，把这些苦乐这些誓言默默述说给山河。\n经天纬地之君，纂业承基之主，不该也不会为了手足相残而痛悔终生，功大过微，德未以之亏，他做的一切，是为了拯救黎民于水火，是为了大明山河永在！是为了日月永照华夏！"
TOD_STG.146.a:0 "为了全天下的未来"
TOD_STG.147.t:0 "抗议游行"
TOD_STG.147.d:0 "刘三这些天在茶馆二楼，耳朵里灌满了各种他学过却早不敢喊的调调。什么“反对专制政府”，什么“落实立宪体制”。这些词儿，打从他进了工厂当工人，就觉得八竿子打不着，快忘到后脑勺了。也不知道这些学生突然发什么疯，这几天突然就上街闹了起来，还有愈演愈烈之势。他心里跟明镜似的：就算祖坟真冒了青烟，让他捞个官儿当当，这些话更是打死也不能往外蹦，得死死憋在肚子里。只是瞅着楼下吵吵嚷嚷的学生娃们，他心里还是冷不丁冒出个念头：“难道我们小民真有做主的一天？”\n正瞧热闹呢，冷不防不知哪个旮旯里炸出一嗓子，那口音一听就是南边来的，连“天下归公，能者居之！”这种话都嚷出来了。紧跟着又有人吼：“保圣主，兴中国！”。好家伙！这下可捅了马蜂窝，也不知道几伙人登时扭成了麻花，拳头、砖块、茶碗盖满天飞。刘三赶紧“哐当”一声拉下窗户，把那些“飞来横祸”挡在外头。\n他不满地嘟囔：“哪路来的南蛮子？闹得沸反盈天，大热天的窗都开不了！”对面的工友伸过头来问：“你咋听出是南边的？”刘三一撇嘴：“你听谁把‘之’念成‘击’？得，再灌两碗茶，缓缓神儿再回。”一碗茶还没下肚，外面响起了尖利的哨子声。又闷头喝了两碗，底下听着是消停了。刘三拍拍屁股站起来：“走喽走喽，家里婆娘还等着呢。”\n茶馆外头的学生全不见了，街上看着要重新热闹起来。但那砖缝里淌着的血，新鲜得刺眼。流血那位显然是个健康的青年人，血不多，但在砖缝里流淌的很快，一条血线就要流到茶馆门边的砖缝了。刘三和工友把脸偏到另一侧，赶忙避开那道刺目的红线，一溜烟绕开，快步走远了。"
TOD_STG.147.a:0 "大道有经有权，有常有变"
TOD_STG.148.t:0 "朝议国体"
TOD_STG.148.d:0 "殿内檀香袅袅，却驱不散紧绷的气氛。定武帝端坐御座，目光扫过阶下肃立的群臣，缓缓抛出议题：“近来舆论汹汹，多有非议朝政者。众卿以为，当如何处置？”言罢，他目光越过商震，落在蒋雁行身上，“前日拘押的那个学联头目…叫什么？”\n侍立一旁的杨永泰躬身答：“陛下，是董毓华。”\n定武帝略一点头，转向商震与靳云鹏：“商卿、靳卿，你二人说说。”\n靳云鹏率先出列，声如洪钟：“陛下！此等狂生，实乃‘士林之蠹’，祸乱根本！空谈误国，罔顾时艰。观其言行悖逆，几与大同乱党无异！然……”他话锋稍顿，“值此多事之秋，纵为首恶，臣亦斗胆恳请陛下法外施仁，暂予羁押即可。古训云‘民惟邦本，本固邦宁’，赦免余众，正可安民心，固国本。”\n商震沉稳上前，深施一礼：“陛下，臣以为此事源于学子不明我朝体制。”他抬眼，目光沉稳，“我朝议会内阁各司其职，运转有常，正合‘垂拱而治，群贤辅弼’之古义。学子们不明民主之理，妄称‘专制’、‘独裁’……”他稍作停顿，加重语气，“陛下圣明烛照，臣等万死难报。为应时局，臣冒死进言：请陛下宣布恢复咨议院运行，专理庶务，务求高效；届时广开言路，非议自消。陛下天纵英明，必能统御群伦，再现三代圣治之隆！”\n定武帝静听片刻，缓缓开口，声音威严：“朕观此象，乃士林不靖之乱，当警谕天下。此辈学子，虽读书识字，却不解‘和而不同’之真义。其行止，‘群聚肆言，若八珍之具，犹弃于地也’，非但无理服人，反效市井斗殴，岂是‘君子之争，当以道义’？”他目光扫过勋贵与商震，“然，国朝素以开明为尚，言者无罪。此事，朕意已决，涉案学生，俱赦不问。”随即，语气转沉：“靳卿忠心体国，可依所议办理。商卿所陈恢复‘咨议院’及监察诸事，颇合时宜，下去拟个详章，明晨呈览。”"
TOD_STG.148.a:0 "经与常固一定之规则，权与变则与世为转移"
TOD_STG.149.t:0 "拉拢旧臣（1）"
TOD_STG.149.d:0 "距离前太子遇刺已过去一年多，大明政局堪称风云突变。曾经如日中天、作为皇权直属力量的紫禁系，在顺天事变后于权力桌面上被一扫而空，黯然退场。权力真空甫一出现，便被台面上那些“衣冠禽兽”般的派系迅速瓜分殆尽。然而，紫禁系终究不是无根浮萍，时至今日仍有部分大员自矜身份，不愿屈就接受招揽。\n一日午后，在王永江那间陈设古朴的书房内，武备系的核心干将们齐聚一堂。檀香袅袅，却驱不散空气中无形的凝重。\n陆徵祥坐在太师椅上，指尖无意识地、一遍遍描摹着手中那只精美宣德瓷杯的釉面纹路，目光深邃，仿佛在杯壁上寻找着答案。半晌，他打破沉默，声音低沉：“紫禁系这棵大树是倒了，可还有些老根盘踞着，不肯挪窝啊。”\n姜登选坐在他对面，腰杆笔直，闻言眉头紧锁，手指在扶手上敲了敲，发出笃笃的轻响：“慕韩兄所言极是。这些人架子端得比天高。可问题是，”他身体微微前倾，目光扫过在座诸人，“我们怎么拉拢？就算真有才学的老人肯放下身段来，朝廷里，我们又能给他们什么位置？总不能空口白话，靠个‘共襄盛举’就让人家俯首吧？” 他的语气带着一丝不易察觉的焦躁。\n王永江坐在主位，闻言手指在光滑的紫檀桌面上轻轻叩击了几下，发出沉稳的节奏。“登选兄的顾虑在理。”他慢条斯理地开口，声音不高却带着分量，“管学系那帮人，死的死，逃的逃，留下多少紧要位置？内阁各部、各地长官，甚至大理院，都空着一大片！我们的人经营企业是把好手，可治国理政、钱粮度支、礼仪教化，这些精细活，一时半刻上哪找那么多合适的人填上去？总不能真让那些勋贵武夫占了便宜吧。他顿了顿，语气斩钉截铁，“眼下，朝廷最缺的，就是一批真正懂行、能稳住局面的文官！这些人，就在那些食古不化的老顽固里。”\n陆徵祥放下瓷杯，点头赞同：“岷源（王永江字）兄看得透彻。文官要拉，武备也不能松懈。如今地方上匪患未靖，新募之兵良莠不齐。最好还是提拔赏赐一番地方省军。”"
TOD_STG.149.a:0 "双管齐下，方能稳固根基"
TOD_STG.150.t:0 "拉拢旧臣（2）"
TOD_STG.150.d:0 "“省军？” 姜登选立刻摇头，语气不容置疑，“省军地方色彩太重，不可过度重用，到时地方势力坐大，后患无穷！此事不必再议。” 他挺直腰背，显出军人的决断，“明日我便在枢密院提出议案，派王靖国、李服膺、李仙洲火速前往山西，督办地方防务整饬事宜。退役老兵的复员安置，也需他们一手抓起来，务必妥帖，不能寒了将士的心。” 他目光转向一旁静听的周学熙，“至于文官事务，缉之（周学熙字）兄，想必心中已有人选了吧？”\n周学熙一直摩挲着茶杯盖，闻言抬起头，眼中精光一闪：“人选自然是有。明日，我便亲自登门，去拜访孙宝琦和汪大燮。孙慕韩（孙宝琦字）久历外务，熟悉洋务；汪伯唐（汪大燮字）在清流中素有清望，且通晓新政。这二位老哥若能点头，一则可解燃眉之急，二则能起示范之效。自然，”他话锋一转，带着一丝谨慎，“人心难测，若此路走不通，我们也得备好退路。至于其他人，如那桐、世续之流，要么是铁了心做遗老，要么是胃口太大，我们开不出那般高价码，况且年岁也确实太高了，恐不堪繁剧。”\n“备选之事，交给我。” 坐在角落的曹汝霖忽然开口，声音不高却透着自信。他看向王永江，嘴角噙着一丝若有若无的笑意，“不过，岷源兄，这次怕是要你大出血了。招揽贤才，尤其是这些眼高于顶的老爷子，光靠嘴皮子可不行。”\n王永江大手一挥，显得极为爽快：“润田（曹汝霖字）放心，钱资不是问题！只要能解朝廷之忧，花多少都值当！” 他话锋一转，目光锐利地看向曹汝霖，“只是，你要找的人，我大概也猜得到几分。若真把实职要缺给了那些人，”他微微摇头，语气带着深沉的忧虑，“恐怕非但不能解困，反而是抱薪救火，徒增掣肘，于眼下这千疮百孔的局面有害无益啊。”\n曹汝霖闻言，脸上那抹自信的笑意反而更深了，他轻轻抚平袖口，从容道：“岷源兄多虑了。谁说一定要给实职？虚衔荣宠，门生故旧，总有能打动他们的东西。至于抱薪救火？呵，这火怎么烧，烧多大，自有控火之人。这其中的分寸拿捏，”他微微一顿，眼中闪过一丝精芒，“便看我的本事了。”\n密谈持续良久，窗外的日影已悄然西斜。直至厅角那座沉重的西洋座钟“铛…铛…”连敲十二响，浑厚的钟声在寂静的书房里回荡。周学熙、曹汝霖率先起身告辞。姜登选也霍然站起，显然并无留下用饭的打算。\n王永江送至书房门口，拱手道：“诸位，时局艰难，百废待兴，正是用人之际，时不我待啊！今日就不虚留诸位用饭了，一切以大事为重！”"
TOD_STG.150.a:0 "一切，都是为了大明！"
TOD_STG.151.t:0 "武备系谋划——入局"
TOD_STG.151.d:0 "顺天朝廷的权力格局正经历深刻变化。武备系官员的比重与权位持续攀升，而咨议院自昌德皇帝时代起，已悄然从一个象征“君臣共治”的摆设，逐步向实质议会转型。至高无上的皇权在缓慢而痛苦的萎缩中退让。尽管武备系在“顺天之变”后，凭借一战大博弈的胜利再度壮大，但其力量无法像掌控麾下工厂般左右咨议院。在议院内，他们只能联合倾向军方的议员及地方实力派系，勉强维持着脆弱的优势。这优势如履薄冰，一场突发危机或一次关键投票的失利，便可能使其土崩瓦解。\n朝堂之上，武备系与旧勋贵集团、定武帝一系人马的摩擦日益尖锐，尤其在财政拨款、企业管理及地方政策等议题上。部分曾属“紫禁系”的重量级元老转向支持武备系，稍稍缓解了其压力，但困局远未打破。自上次大战以来，武备系确为维系大明的中流砥柱。一座座工厂拔地而起，订单雪片般飞落，灯火通明的车间昼夜不息，将战争所需精准送达每一支军队……\n王永江忆起那烈火烹油的辉煌，不禁轻叹一声，复又埋首案牍——他正竭力将大明从钱荒泥潭中拖出。地方横征暴敛、寅吃卯粮的乱象已被他强力压制，财政状况确有起色。然而，这如同打了强心针的经济，若无类似上次大战的机遇，恐难逃流星坠地的命运。至于定武帝与勋贵们豢养的那些“经济官僚”，在王永江眼中，个个是擅发债款与增印钱币的“好手”，只配去西北给“庆逆”当顾问——他们定能加速其败亡。王永江手下公文批阅如飞，心中却早已将那班成事不足败事有余的“同仁”骂得体无完肤。武备系核心成员来自天南海北，耳濡目染之下，他此刻的腹诽倒也兼收并蓄，颇具“大国气象”。\n正当王永江心头火起，手下动作却愈发迅疾之时，曹汝霖推门而入：“岷源兄，蓬莱侯同意会面了。”王永江合上最后一份卷宗，暂将纷繁政务抛却。武备系迫在眉睫的困局，才是当务之急。他随即起身，与曹汝霖同乘轿车赴宴。\n车厢内，王永江对曹汝霖道：“润田，老姜正忙于整顿晋、豫、冀、鲁军务，无法抽身。稍后，就仰仗你与子兴（陆徵祥）了。”他言下之意，是希望曹、陆二人主导与地方军头的谈判周旋。\n曹汝霖正色道：“岷源兄言重了。我等同心戮力，共扶大明而已！”\n陆徵祥亦含笑补道：“事变之后，若非岷源兄力挽狂澜，经济岂能暂得喘息？此番谈判，倘有伤及财政复苏之让步，还望你严加把关。”\n王永江颔首应允。几人又低声议了几句，轿车已驶入目的地。车窗外的暮色渐沉，一场关乎权力版图的暗战，即将在觥筹交错间拉开帷幕。"
TOD_STG.151.a:0 "该见见老朋友了！"
TOD_STG.152.t:0 "武备系谋划——合作"
TOD_STG.152.d:0 "夜幕为顺天府笼上了一层厚重的面纱，位于城东的“鸿宾楼”主楼内却灯火通明，恍如白昼。华北大地上数得着的地方话事人、军官显要济济一堂，将宴会厅挤得水泄不通。水晶吊灯下，银餐具与将星肩章交相辉映，空气中弥漫着雪茄烟与权谋的气息。\n王永江与吴佩孚坐在西侧的沉香木雕花椅上，看似闲适地品着明前龙井。利益交割在陆荣廷、曹士杰等人的推杯换盏间悄然完成。作为纵横政坛数十年的老手，王永江早已熟谙这般场面，正欲照例说些场面话，却被吴佩孚抢先截住了话头。\n“岷源兄，有话直说罢！”吴佩孚转动着手中的青瓷茶盏，眼底精光乍现，“你我都是半截入土的人了，撑死还能操劳个三五年。可往后的棋局，怕是由不得咱们执子了。你年岁比我还长，莫非还参不透？”\n王永江指节猝然攥得发白，茶汤在盏中荡开涟漪：“子玉啊子玉，我只觉荒唐。纵使今日侥幸平定诸逆，莫说大明气数将尽，只怕天下倾覆就在眼前！”话音未落，两行清泪竟从老人沟壑纵横的面颊滑落，在紫缎朝服上洇开深痕。\n看着王永江这副做派，吴佩孚却是笑了起来。“我看你是忧劳过甚，竟生出宇宙之悲了！”他倏然敛了笑意，指尖重重叩在黄花梨案几上，“勋贵与国同休的道理，我比谁都明白。今日拟任的名单——大多是朝廷新锐。”\n当王永江接过那册用工楷写就的议员名簿时，枯瘦的手指微微发颤。他猛地抬头欲言，却再度被吴佩孚截断：“怎么？这些人不合意？”\n“太合意了……”王永江喃喃道，纸页在指尖沙沙作响，“竟比我亲自遴选还要周全。”\n“姜登选若是见到军官名录，怕是要乐得开坛畅饮。”吴佩孚噙着笑抿了口茶，眼见对方眉间疑云未散，便倾身压低嗓音，“勋贵们总算想通了——只要大明还在，他们的既得利益就能保全。哪怕龙椅上换个人，根基也不会动摇。有些时候，要进三步，须得先退一步。”见王永江目光如炬，他又轻笑补充：“当然，这是我劝服他们的说辞。”\n王永江沉默半晌后，重重拍了拍吴佩孚的肩。之后这饭也顾不得吃了，大步流星地往外走去，竟哼起年轻时熟悉的关外小调，佝偻的脊背挺得笔直，恍若重返壮年。吴佩孚目送着老友渐行渐远的身影，抬头时正撞见墙上相框里曹锟早年英姿勃发的肖像，不由摇头失笑。窗外更鼓声穿廊而过，惊碎了满室灯火通明的幻梦。"
TOD_STG.152.a:0 "老骥伏枥，志在千里"
TOD_STG.153.t:0 "重启咨议院"
TOD_STG.153.d:0 "“诸公，”王永江的声音不高，却带着穿透炭火噼啪声的沉劲，“顺天的尘埃勉强落定，但天下板荡，勋贵们盘踞要津，一个个都瞪着眼；陛下……”他顿了顿，指尖无意识地叩了叩案沿，“雄才大略，志在乾坤独断。我等若不能搭起个稳固的制度架子，今日这场拨乱反正，到头来不过是替明日的更大乱局，写下个序章罢了。”\n“岷源兄所言极是！”周学熙猛地一拍案，紫檀木桌面发出闷响“陛下岂是甘居人下的？那天子虚名困不住他！如今不过是手里没银子、没粮草，军队也还没攥瓷实罢了。若咱们眼睁睁看着他勾连勋贵，一点点把行政权、经济权都啃过去，等他羽翼丰满……”话没说完，他的拳头已攥得死紧，指节泛白，像是在用力掐灭某个可怕的念头。\n阎锡山斜倚在圈椅里，他吐了口烟圈，看着那团白雾慢悠悠散开，才抬眼扫过众人，喉间滚出一声：“嗯，是这个理儿。凡事预则立，不预则废。”\n周学熙往前凑了半步，急切地想把话递到每个人耳里，袍摆不经意间扫过炉边的铜铲，“当啷”一声轻响，倒像是给这话加了个注脚。“伯川公一语中的！”他的声音带着些微不易察的激动，“要我说，最好的限制，就是咨议院。尽早把它重启了，有三大好处：其一，正名。咱们武备系行的这些事，在外人看来总有几分‘非常’，重启咨议院，就能告诉天下，咱才是宪政的真捍卫者，所做的一切都是为了拨乱反正；其二，限权。那些勋贵不是总说自己‘老成谋国’？陛下不是标榜‘勤政爱民’？那就让民之代表——咨议院来管着他们！咱们在咨议院占着多数，辩论也好，表决也罢，都能用民意当幌子，钳住他们的野心，省得他们瞎折腾害了国家；其三，卸力。民间那些清流议论、百姓请愿，都引到咨议院去辩，让议员们去应付，咱们就能专心干实事，少受些干扰。”\n“重启咨议院？”姜登选霍然起身，他眉头拧成个疙瘩，语气里满是警惕，“那些旧议员岂不是又有了戏台？万一他们和……或是勋贵勾搭上，里应外合，那不是更麻烦？”\n “登选顾虑得是。”王永江缓缓开口，声音里透着沉稳，“但重启，不代表照老样子来。代表资格，咱们审核；议程，咱们来定；规则，更是咱们说了算。他们不是想登上舞台吗？可以。但得按咱们划的道儿走，在咱们搭的框架里。”\n阎锡山拍了拍衣襟上并不存在的灰，语气斩钉截铁：“对就这么办！赶紧着手准备，挑些听话的、懂事的当议员，把重启咨议院这事，当成‘顺应民心、重建宪政’的头一桩德政来办。要大张旗鼓地办，让天下人都明白，武备系才是宪政最大的捍卫者！”\n王永江微微摆手，他的声音轻了些，“百川兄，用词得讲究些。不是‘听话懂事’……”"
TOD_STG.153.a:0 "“是‘可靠的、能为国效力’的议员罢了。”"
TOD_STG.154.t:0 "确立议会政治"
TOD_STG.154.d:0 "王永江指尖轻叩桌面，目光扫过在座的武备系核心，声音里带着一丝不易察的舒展：“诸公，咨议院我们已经重启了。如今，那些老朋友们暂时要在议会厅里和我们慢慢协商了——你们瞧，前日工造部的铁路预算案，若没咱们议员附议，他们就是磨破嘴皮也通不过。”他顿了顿，指尖点在“宪政”二字上，“这就是法理的好处，比个人威望、比刀枪剑戟都持久，能把权力的边界框得明明白白。”\n“岷源说得是！但这还差得远！眼下的咨议院，活像前朝那裱糊匠糊的纸房子，看着光鲜，实则一戳就破。”李纯的脸上也浮现一丝欣慰，“预算案我们能审，可陛下一句‘军需紧急’，就能硬推下去；内阁任命如此郑重之事，这么些年也是一笔说不清的糊涂账；至于立法，大法立不起来，小法推得磕磕绊绊——这样的咨议院，哪里能满足现在的实际需要？”\n周学熙早攥着份草案在手里，此刻顺势往案中一推，纸张滑动的轻响在堂内格外清晰：“秀山兄这话，说到了根上。”他起身将草案分发给众人，指尖点着“权力来源”一条，“以前的咨议院为啥不行？就因为宪法给它扣着‘咨议’的帽子，骨子里还是君权说了算。条文写得含含糊糊，处处被君权牵着鼻子走。如今要把这根本改过来——逐步让权力从‘君授’变成‘民授’，明明白白确立‘议会中心’！”\n阎锡山捏着草案的手指在“议会否决权”那页停了停，“嗯……这些条款是对症，但步子是不是太急了？”他抬眼扫过众人，“他们能眼睁睁看着权力被分走？这要是逼急了，怕是要出大乱子。”\n王永江嘴角勾起一抹冷峭，“伯川兄的顾虑在理，所以不能蛮干。其一，打‘民心’牌。通过我们影响的报纸，大声疾呼：唯有强大的议会，才能代表‘民意’监督，我们要捍卫太仓扣阙以来的宪政成果， 其二，打‘效率’牌。告诉民众，当前政出多门，行政效率低下，必须需要结束这种混乱，统一政令，高效集中国家力量用于战争。 其三，分化瓦解。勋贵也非铁板一块，有些人更看重实利而非虚权。我们可以许诺，在新的权力架构下，保障他们的部分既得利益，换取他们不要被……迷惑。”\n“说得对！”周学熙接过话头，“要让陛下明白，他要是肆意妄为，就是不顾万民之心，就是跟‘大明法统’……”"
TOD_STG.154.a:0 "“天子者，有道则人推而为主，无道则人弃而不用，诚可畏也”"
TOD_STG.155.t:0 "勋贵经济特权"
TOD_STG.155.d:0 "阎锡山拿着铁钎翻动烤架上的全羊，油滴在火炭上溅起阵阵火星。吴佩孚抱着胳膊坐在马扎上，目光跟着阎锡山手里的割肉刀打转。\n“看见没，子玉？”阎锡山用刀尖敲了敲烤得焦黄的羊肋，“这羊就得整只烤才香——要是你砍一条腿，我卸半扇肉，最后谁都吃不上热乎的。”\n吴佩孚笑笑没有接茬，“你还是好好看着炉子，别被手里的刀割了手。”\n“那不会，”阎锡山削下薄薄一片里脊肉递过去，“先尝尝火候。带兵的人，还是得围着火堆说话实在。”\n两人就着半瓶汾酒吃了几口肉，阎锡山突然用刀尖划向羊腿：“这后腿肉最厚实，得留给冲在最前面的弟兄。”刀锋一转又点向羊排，“这肋条上的活肉，该给能打硬仗的。”\n吴佩孚啐掉一根骨头：“百川啊，你是跟曹公一样养了堆清客？忘了咱们怎么说话了吗？直说吧。”\n“简单。”阎锡山把割肉刀插进案板，“子玉，你说咱们当初打生打死是为了什么？不就是为了封妻荫子，为了后代不必像咱们一样！”\n“百川倒是实在，”吴佩孚叹息一声，请君暂上凌烟阁，若个书生万户侯，五十州重要吗？对大部分人来讲，无非是以命搏功名的晋身之机罢了。\n见吴佩孚神色黯淡，阎锡山觉得可能自己开价少了些突然抓起辣椒面撒在肉上：“子玉觉得多少好呢？咱们得相忍为国，你知道，现在乱党跳梁，还有……虎视眈眈……”\n夜风卷着炭灰打旋，吴佩孚盯着滋滋冒油的羊腿突然笑了：“百川，你当年和我雪夜烤肉，可是能把半生不熟的塞别人碗里。”\n“现在熟了。”阎锡山斩下整条羊腿咚地放进吴佩孚盘子里，“这肉还是要大家一起吃才香。”\n吴佩孚抓起羊腿啃了一口，油顺着指缝往下滴，犹如在为什么悲泣：“废帝废除的勋贵经济特权……”\n“废帝的法令自然无效，”阎锡山举起酒瓶，“而且我看应该增加，经济命脉在咱们自己的子弟手里面，才安心啊……”"
TOD_STG.155.a:0 "肉怎么分不重要，重要的是谁拿着分肉的刀"
TOD_STG.156.t:0 "提拔一心会（1）——砸场"
TOD_STG.156.d:0 "顺天东城的小酒馆里，煤油灯的光晕被穿堂风搅得忽明忽暗。伙计趴在柜台上打盹，后颈的寒毛却猛地竖了起来——隔壁桌的喧哗陡然变了调，先前的醉笑混着哭腔炸开，像钝刀劈在朽木上。\n“我们到底做了什么！”国字脸的武官猛地拍向桌面，粗瓷酒碗“哐当”撞在木缝里，酒液溅在他虬结的青筋上。他眼前浮现出顺天城头的血污，想起临行前被塞进怀里的家信，喉结滚得像吞了火炭：“说好为了大明荣光，结果呢？他们忙着内斗，谁管过前线弟兄的尸骨埋在哪！”\n“别、别这样……”赵磊攥着酒壶想劝，却被对方一把挥开。锡壶砸在土墙上映出个浅坑，酒液顺着墙缝渗进黑黢黢的砖缝，像道淌不完的血。\n“率土分崩啊……”穿灰布军服的人忽然踹翻条凳，凳腿在地上刮出刺耳的声响，“当初老子挥刀砍向乱党的时候，以为砍的是祸根……”\n“率土分崩，生民之命，几于泯灭……”刚从桌上爬起来的军官突然掀翻桌子，碗碟碎成星子扎进泥地，“那些统制国的狗东西，大明对他们还不够好吗？如今大明只是稍稍衰落便一个个藏不住他们的不臣之心了”他抄起墙角的酒坛狠狠砸向梁柱，陶片混着浊酒泼了满墙，“‘修文德以来之’？我看该用炮弹给他们上上课！”\n这话像火星落进火药桶。国字脸的武官猛地掀翻邻桌，木桌撞在酒架上，成排的空酒瓶哗啦啦坠地，碎玻璃在油灯下闪着冷光。赵磊想拦，却被人推得撞向柜台，算盘珠子滚落一地，混着伙计的惊呼声滚到脚边。\n伙计抱着头缩在柜台底下，听着桌椅断裂声、瓷器碎裂声、醉汉的怒骂声混在一处。直到天边泛起鱼肚白，晨光从破窗棂里钻进来，才照见满地狼藉：断腿的桌子压着碎酒坛，墙上的酒渍像片深色的血，而那几个武官早已不知去向，只有门槛边落着半块带齿痕的木牌——"
TOD_STG.156.a:0 "正是酒馆门口那块写着“太白遗风”的匾额。"
TOD_STG.157.t:0 "提拔一心会（2）——训斥"
TOD_STG.157.d:0 "天刚蒙蒙亮，顺天军营的议事厅里便弥漫着呛人的烟味。姜登选背着手站在窗前，指节因用力而泛白——窗纸上还沾着昨夜被风卷来的酒气，像在无声控诉那几个军官的荒唐。\n“啪！”一叠卷宗狠狠砸在案上，国字脸的武官猛地抬头，撞见姜登选眼里的冰碴。“你们在东城酒馆做的‘好事’，现在整个顺天都传遍了！”姜登选的声音像淬了冰，“军人的手是握枪杆子的，不是砸老百姓家当的！”\n赵磊攥紧衣角，喉结滚动：“我们……”\n“气不过就能毁了人家的铺子？”姜登选猛地转身，目光扫过垂头的几人，“那店主一家三口就靠这酒馆过活，你们砸的不是桌椅，是人家的活路！”他指着门口，“现在就去给店主道歉赔罪，赔偿人家的损失！少一个子儿，我亲自扒了你们的军装！”\n几人低着头往外走，国字脸的武官走到门口时忽然停步：“姜督都，我们知错，但……”\n“但什么？”姜登选冷笑，“觉得委屈？觉得为国愤怒就有理了？”他从卷宗里抽出张纸，“这是店主替你们美言，说你们砸店时还念叨着‘不能让大明完了’——要不是看在这句，你们现在已经在军法处待着了！”\n“知道为什么不军法处置你们吗？”姜登选话锋一转，“因为你们眼里的火，不是为自己烧的。”他转过身，目光柔和了些，“但军人的火，该烧在战场上，不是烧在酒馆里。”\n穿灰布军服的人猛地抬头：“姜督都……”\n“新组建的部队缺乏有经验的主官，你们几个，明天就去报道。”见几人愣住，他沉声道，“记住你们砸店的荒唐，更要记住喊‘大明不能完’的真心。”\n刚刚被骂都没什么波澜的几个人怔住了，只是定定地看着姜登选。\n“大明终究需要的，还是你们这些年轻人，看你们能不能守住初心。”姜登选走到他面前，拍了拍他的肩，"
TOD_STG.157.a:0 "“别让我失望，更别让那些等着大明复兴的人失望。”"
TOD_STG.158.t:0 "开展合作"
TOD_STG.158.d:0 "暮色漫进阎锡山宅邸的书房时，茶烟正绕着棋盘上的残局打转。姜登选捏着枚黑子悬在半空，指腹碾过冰凉的石面：“近来前线传报，总说辎重跟不上，倒像是老马拖了新车。”\n 阎锡山执壶的手顿了顿，碧螺春的热气模糊了他的眉眼：“老马识途啊。当年咱们跟洋人周旋，靠的不就是老马识途？”他将茶杯推过去，“新驹是烈，可没经过磨合，容易惊了阵脚。”\n“惊阵脚总好过原地打转。”姜登选落下棋子，黑子撞在棋盘上发出脆响，“现在是战争时期，阵前换马虽险，总比被拖垮强。有些缰绳，早该交到能攥紧的人手里。”\n阎锡山笑了笑，指尖叩着桌面数起子来：“赵括当年也攥得紧。年轻人手里的枪是利，可不知什么时候该收一收，到头来反倒伤了自己人。”他忽然话锋一转，“府里那对青花瓶，还是万历的物件，看着瓷薄易碎，可经得住百年风雨——你说要是换个新窑的，能扛住去年那场地震？”\n姜登选的指节在膝盖上磕了磕：“瓶是瓶，人是人。瓶碎了能粘，战局拖不起。”\n“可架瓶子的架子不能动啊。”阎锡山慢悠悠地落了枚白子，“架子要是松了，别说新瓶旧瓶，连摆瓶子的案子都得塌。”他抬眼望过去，目光在对方紧绷的肩线停了停，“靴底还没沾过血，就想抢着掌旗——你拦不住，也得让他们看看旗上的字号是谁家的。”\n书房静了片刻，只有漏壶滴答作响。姜登选忽然抓起两枚棋子，一枚黑子一枚白子，指尖将它们碾得相撞：“那就让老马领着路，新驹在前头蹚。”他把黑子按在棋盘中央，“核心的阵地，得让能扛枪的站着。”\n“这话在理。”阎锡山颔首，亲自续上茶水，“吴子玉前几天请我去他府上听一个洋人的班子唱戏，说是又梦见当年峥嵘了，不如让他们在帐里参详参详，年轻人在前面冲，也算两全。”\n姜登选望着棋盘上犬牙交错的黑白子，忽然笑了：“就依百川的意思。只是得说好了，缰绳不能攥死，该松的时候得松，该紧的时候——”\n“自然得由能攥住的人说了算。”阎锡山接过话头，将最后一枚白子落在星位，"
TOD_STG.158.a:0 "“棋局嘛，总得有新子入局，才见得热闹。”"
TOD_STG.159.t:0 "明升暗降"
TOD_STG.159.d:0 "阎锡山的书房里弥漫着陈年普洱的醇厚香气，姜登选端起茶盏，指尖沾着的墨迹在白瓷杯沿洇出浅痕——那是刚从前线战报上拓下来的地名，墨迹未干，像还在渗血。\n姜登选没动茶盏，指尖在案上的战报边缘划着圈——那纸上“伤亡惨重”四个字被血水浸得发暗，“前线的军报，不是打不过，是指挥的将领搞不懂我们好不容易给他们配备的最新型的火炮，干脆放在库房里不用，他到底是怎么想的？这些年一点长进都没有？”\n “年轻人是懂得新玩意儿，”阎锡山将茶盏推过去，热气在两人之间凝成白雾，“可猛张飞也得有老黄忠压阵。当年赵括要是肯听廉颇几句劝，长平之战何至于……”\n“那是两码事！”姜登选猛地打断，指节在简报上戳出轻响，“廉颇虽老，尚能披甲上马！现在营里那些‘老黄忠’，技战术水平都不如陆大的学生，却占着主将的位置，这不是经验，是误命！”\n阎锡山的竹箸在茶瓯里顿了顿，水花溅在桌面：“冯老腰上那道刀疤……”\n“刀疤不能当令箭用！”姜登选的声音沉得像冰，“这是渎职是误国！这没有什么可商量的——这种错，犯一次就要死千把人！那都是我大明的好儿郎啊！”\n书房里静了片刻，只有炭火爆裂的轻响。阎锡山忽然从书架上抽出本蓝布封皮的册子，指着某一页：“那就让他们也做‘一代楷模’吧，朝堂和军中有的是空位子，容得下他们安身。”\n姜登选端起茶盏，水汽模糊了眉眼：“也不能让他们太过没面子，毕竟也是为大明浴血拼杀过的老将。”\n“自然，”阎锡山颔首，“就叫‘顾问’，让他们穿戴着旧朝服，去新兵营讲几堂课——让娃娃们知道，老辈的荣光，不是靠占着位置熬出来的。”\n茶盏相碰时发出清脆的响，两人都没再说话。烛芯爆出个火星，照亮案上并排放着的两本兵书——左边是线装的《孙子兵法》，边角磨得发白；右边是精装的《战争论》，书脊还闪着新漆的光。\n炉烟卷着茶香漫出窗棂，院里的老松枝被雪压得微弯，却透着股不肯折的劲。姜登选看着案上的简报，忽然伸手将“伤亡”二字用朱笔圈住……"
TOD_STG.159.a:0 "又在旁边添了个小小的“迁”字。"
TOD_STG.160.t:0 "新枢密院 "
TOD_STG.160.d:0 "阎锡山府上的西花厅暖阁里，炭火烧得正旺，却驱不散案上摊开的《枢密院改组草案》带来的滞涩。“眼下前线战事胶着，可枢密院议事还在沿用十年前的章程，枢密院的结构更是跟”王永江指向旁边的根雕木凳，声音平稳如案上的青瓷笔洗，“这根雕一般，奇形怪状、叠床架屋，必须加以整顿。”\n他话音刚落，主位上的阎锡山便放下茶盏，黄铜盖碗磕在紫檀木案上，发出闷响。“岷源兄这话不妥。”阎锡山的山西口音里带着不容置疑的沉，“现在是战时！指挥系统最忌朝令夕改——那些老臣虽有些守旧，却打了三十年仗，临阵换将，不怕乱了军心？”\n暖阁里霎时静了，只有炭火爆出的火星轻响。鲍贵卿捻着胡须低头喝茶，眼角的余光却扫过姜登选——两人都清楚，王永江提议的“新人”里，自然有他二人或者他们的旧部，真要通过，他们在枢密院的话语权便又重一分。只是这时，他们便不好说话了，因此只好沉默以待。\n“百川兄过虑了。”陆徵祥忽然开口，“我在欧洲见过他们的总参谋部，一半是四十岁以下的军官，照样指挥得井井有条。”他拿起草案，在“技术顾问”条目下画了道线，“伯颂说，洛阳厂的新炮要配弹道计算器，可枢密院里没人看得懂参数——这样的指挥，才真会误事。”\n“误事？”阎锡山冷笑一声，从怀里掏出份电报稿拍在案上，“前日防线告急，是老枢密使当机立断才转危为安。”\n陆徵祥还想争辩，王永江却抬手按住他，转向阎锡山：“百川兄说的经验，我们留着——老枢密使是国之勋贵，也是我们的压舱石，谁也没说把他换了，只是精简一下指挥结构，梳理一下指挥链条，添些能算清炮弹射程、看懂航空照片的人，帮着把经验变成实实在在的部署，有何不可？”他将一份名册推过去，“你看这几位，百川兄觉得不能胜任此职吗？”\n阎锡山的手指在名册上敲了半晌，慢悠悠开口：“依我看，可先添五人试试水，若真有用，再逐步增员。”\n这便是答应了，散会时，姜登选特意跟王永江走在最后，雪光映着两人的影子，他忽然低声道：“岷源，我就知道，你的性子值得……”"
TOD_STG.160.a:0 "“所恃知己肝胆相照”"
TOD_STG.161.t:0 "王永江入阁"
TOD_STG.161.d:0 "玉泰茶楼的包间里檀香袅袅。李纯捧着汝窑茶杯，用杯盖轻轻拨弄着浮叶，仿佛不经意地开口，“我大明的将士英勇善战，廓清寰宇指日可待。然而治国终非仅恃兵戈。内阁诸公，或长于行政，或娴于典章，但是对于经济事务，终究隔了一层。”李纯轻轻叹息一声，倒真是一副忧国忧民之色，“如今国家处于紧急状态，钱荒又一直未能完全缓解，正需要一些真正懂经济的人进入枢要，掌此国脉所系。”\n他顿了顿，目光扫过全场，最后落在王永江身上，后者正低头专注地看着自己茶杯中竖立的茶梗，似乎那里面藏着复兴经济的妙策。\n“秀山说的是啊，名不正则言不顺，言不顺则事不成。岷源之才，囿于少府一隅，实在是屈就了。许多事，非阁臣之位，难以协调。譬如与兵务部协调军需生产优先级，与地方督抚交涉原料调配，有个阁僚的身份，行事效率岂可同日而语？”周学熙将“效率”二字咬得略重，这是在点醒所有人，这是为了大家的共同利益。\n鲍贵卿听到兵务部便也开口，“的确如此，虽说兵务部有我在，蔡成勋也不为难我们，但毕竟缺一个名头，我看咨议院也该干点活了。由他们提议，推举一位真通经济、能办实事之人入阁，专司统筹，以解倒悬。譬如……岷源，便是最佳人选。唯有如此，名正言顺，政令方能通达无阻。”\n“的确是这样，只是……我这心里实在没底。少府这一大摊子，千头万绪，全赖岷源兄坐镇方能井井有条。他若高升，这一时半会儿，哪里找得到合适的人接手？别忘了，还有……虎视眈眈呢！”姜登选脸上一副忧虑之色，用最同意的语气表达着自己最怀疑的态度。\n王永江闻言终于放下了茶杯，他环视众人，最终看向了姜登选，“现在国家危急，我辈不能不挺身而出，如今经济是一方面，军事是另一方面，我大明将士自然是敢效死力，但是该改革的地方必须改革，这样才能尽快平乱扫逆，还百姓以安乐，超六，你说呢”王永江说的话似乎和之前的讨论没什么关系，但在场的人明白，这才是最大的关系。\n“我是个粗人，不懂这些，我就会打仗，总之一切为了大明好就行。”姜登选豪放一笑，将手中茶水一饮而尽，仿佛那是甘醇一般。\n数日后，一份措辞恭谨、引据充分的咨议院议案送至御前，但中心意思十分简单，咨议院希望推荐王永江入阁。朱镕坤沉默良久，最终提起朱笔，在奏疏上龙飞凤舞地题下“可”字，"
TOD_STG.161.a:0 "“民心可畏啊！”"
TOD_STG.162.t:0 "政企合作"
TOD_STG.162.d:0 "白惕生坐在后院石案前翻检文书，案上的茶盏结了层薄茶垢。魏定兴大步迈进来，靴底碾过落叶的声响惊得白惕生抬头。\n“振邦来是为这个吧，”他捏起一份待批的征地计划，纸角被指腹磨得起了毛，“上月你说要改输电线路，拆了三家民房；这月又要占河滩，说是要埋电缆。我这签批的手，倒比你烧锅炉还烫。”\n魏定兴往石凳上一坐，落叶飘在他肩头也不拂：“安时这是嗔怪我来得勤了？你当我愿意跑？前儿军列运设备，常子安那小子笨手笨脚，差点把变压器型号填错了。我寻思着，这事还得您亲自过目才放心——您是我的父母官，我在您地界上办厂，哪敢越雷池一步？”\n白惕生哼了声，拿起案上的文件翻得哗哗响：“别跟我来这套。上年你为了架临时线路，把城西的老槐树锯了，说是‘应急特办’；今天又要拆这么多民房，说是‘军电统筹’，这已经快入冬了，我上哪安置这些居民去？”\n“安时，我也是没办法呀，国家现在前线正紧张，军需制造需要大量用电，我也是没办法呀，要是平常也能慢慢来，或者尽量绕开民房规划，可是现在上面三天一个急电，”魏定兴的神色此时是真有了几分憔悴，“你看你行行好，帮帮我呗？”\n“我看你要不这样，你跟我去府衙，把我的官印拿走，你之后有什么要求你自己盖章就是，”白惕生说着还真站起身拉着魏定兴要走，“你最好把我知府的差事一并管了，你看怎么样？”\n“真行吗？安时兄？”魏定兴看着被将了一军的白惕生一笑，“你瞧这章程，‘政企协同’四个字是明晃晃的。前儿给前线送的那批绝缘线，您让工房连夜校验，这才是‘高效协同’的楷模。”他忽然压低声音，从怀里掏出张图纸，上面用红笔标着三个红点，“实不相瞒，我其实有更长远的规划，大明的工业化速度未来必定越来越快，用电量也一定会极速增长，我们与其一期一期的征地，不如……”\n“你想的很好，不必再想了，”白惕生看着图纸上被圈住的地区，忽然抓起茶盏往石案上一墩，茶水溅在章程的“民务”二字上。“好一个‘照章办事’。”他抓起朱笔，在待批文件上重重签下名字，墨汁透过纸背，在垫着的旧账册上洇出个深色的圆，倒像枚没盖正的官印。\n魏定兴拿起文件时，见白惕生正对着盆枯了的兰草出神。他知道这位父母官心里的滋味，然而一时的剧痛总好过半死不活的折磨，为了那些工厂外等待工作的工人和他们的家庭，他们总要牺牲些什么，但这一切都是为了大明高速发展……"
TOD_STG.162.a:0 "为了最终让百姓安居乐业！"
TOD_STG.163.t:0 "国企特许垄断法"
TOD_STG.163.d:0 "一、禁限录品类及准入规制 所谓禁限录者，分禁止与准许二类。凡属禁止之业，商民不得进入，官府依法不予批核，拒发各类文书；准许之业，州县须明示法律依据、技术规范、许可条件、办理期限，制定颁布准入章程，令商民依章合规进入；至于录外之行业、领域、营生，皆可依法平等进入。其未设禁止或许可而仅以备案管理者，不得假借备案之名行许可之实。\n二、禁限录管辖范围 禁限录详载大明境内禁止或须经官府特许方可投资经营之行业、领域、营生。若夫通行全民之政策、非关投资经营之管理、准入后监管、备案事项、职业资格认证、专涉外商之规章，及江河源头、自然保护区、饮用水源地等特定区域之治理政策，皆不列入此录，各依专门法律施行。\n三、禁限录法律依据 录中所载准入政策，必以法律、内阁决议或地方法规为本。遇非常时期，内阁得授权特定区域调整准入政策，从其规定。施行期间，为防范重大经济风险，经内阁核准，主管部门可采取临时准入措施。为维护公序良俗、保障公共利益，主管部门应依法调整文化及相关新兴行业准入政策。\n四、禁限录统合要义 凡依制编纂之全国性准入类目录，统归禁限录管辖。产业结构调整指导目录、政府核准投资项目目录，并入此录；地方若有细则规定，从其约定。各类目录修订时，若增设准入政策或附加条件，须呈报内阁批准，不得另设具有准入性质之禁止目录。\n五、禁限录与他法关联 海内外商民统一遵循此录，外国投资者另遵《外商准入禁限录》；外籍服务提供者跨境提供服务者，另守《跨境服务贸易禁限录》。若我国所缔结国际公约、双边多边条约另有规定者，从特别法。涉及跨境河流水利、水电站、电网、输气管网及界河工程、远洋科考等事务，须咨询外事部门。\n六、准入规范化要旨 施行禁限录时，须统筹“证照”管理，统一商事登记，使经营范围登记与准入禁限、企业经营许可相衔接，强化商民信息归集共享，建立服务商民全流程制度，持续提升办事便利度与可预期性。\n七、信用承诺要义 商民以承诺获取许可而未履行者，撤销其原许可，列入失信记录并共享信息，依法惩处失信行为。其抗拒司法裁判、屡教不改、造成重大损失者及相关责任人，依法定期限禁止进入市场行业。\n八、综合监管要旨 各级官府依职责严查违法准入行为，依法实施准入后监管，实现事前事中事后全覆盖，杜绝监管盲区，推动构建政府监管、企业自觉、行业自律、社会监督四方协同治理之格局。"
TOD_STG.163.a:0 "其各类详细名目俱附录于后"
TOD_STG.164.t:0 "新人"
TOD_STG.164.d:0 "顺天初雪微融，工造部衙门内暖意盎然。新任右侍郎魏定兴步履轻快，清癯的脸上却焕发着多年未有的神采。王岷源和他们的那些豪情壮志，终于不再是水中月镜中花，开始有了生根发芽的可能。\n推开尚书值房，张寿镛（伯颂）热情起身：“振邦！可算来了！直电在你手里扭亏为盈，产能革新，阁老们赞不绝口！国家正陷于危机正需要你这样的人才！”\n魏定兴摆手，目光炯炯：“伯颂兄过誉。些许成绩，是为国尽责的本分。如今能与兄台并肩，为‘布威万邦’之宏图效力，方是魏某之志！” “为国尽责”、“宏图”几字，他说得格外郑重。\n寒暄间，张寿镛道：“给你配了个得力助手。” 他唤道：“云存。”\n范云山推开门，身姿挺拔如松。“尚书，侍郎。” 声音清朗，目光澄澈而专注。\n“范云存，算学精熟，是不可多得的干才。” 张寿镛介绍。\n“范…云存？” 魏定兴语气温和，“好名字。云程发轫，存乎实干。伯颂兄慧眼。”\n工造部事务繁忙，两人也没多虚礼，从张寿镛处告辞出来，魏定兴在范云存的引导下往自己的办公之所走去，眼前这个年轻人的那份锐气，和引导自己时尽力掩藏袖口磨损的小心——像极了当年初入直电，怀揣“实业报国”热忱、却因出身微寒而倍加努力的自己。相信账本上的数字就该分毫不差，相信效率至上，相信技术可以涤荡污浊。\n“云存，好好干，堂堂正正做人，以实绩立身！”魏定兴鬼使神差的把心中所想说了出来。\n范云存一怔，深深一揖：“下官谨记侍郎教诲！定当洁身自好，慎思笃行，竭尽所能，不负厚望！”\n张寿镛亦含笑点头。窗外，雪后初霁的阳光，穿过铅云，洒在工造部院落的积雪上，映出一片清亮。魏定兴接过范云存递来的第一份待批文件——一份关于新式机床引进的预算草案。他拿起笔，神色郑重，仿佛手中握着的……"
TOD_STG.164.a:0 "是新世界的蓝图。"
TOD_STG.165.t:0 "新宪法"
TOD_STG.165.d:0 "咨议院议事堂的龙旗微微飘动，表决结果已经在长案上摊开了。没有意外的哗然，只有一种近乎凝滞的安静，随后被压抑了数十年的气息轰然冲破——武备系的议员们不约而同地挺直了脊梁，指尖在案上微微发颤。\n“赞成票二百零三，反对票七十三。”书记员的声音平稳无波，仿佛在念一份早已定稿的军工厂报表。谭延闿握着木槌的手停在半空，竟然微微有些颤抖。\n堂内立时便炸开了山呼海啸般的掌声，有的议员们几乎是跳着站起来的。陈敬棠手里的钢笔“啪”地掉在案上，他顾不上去捡，一把抓住邻座仇曾诒的胳膊，指节捏得发白：“过了……真的过了！”他鬓角的白发在灯光下泛着银光，眼里却亮得像年轻时在学堂偷偷读《民约论》的夜晚。\n萧振瀛缓缓合上手里的草案，纸页间夹着的半张泛黄的旧报纸掉了出来。那是一份多年前的《顺天公报》，上面刊登着他与十几位同窗联名的文章，标题被红笔圈着：“请立宪法，以束君权”。当年他们把文章贴在学堂的墙上，第二天就被勒令撕去，领头的学长至今不知埋骨何处。“你看，”他把报纸推给邻座议员的，声音里带着不易察觉的哽咽，“那时候有多少人笑咱们是痴儿。”\n谭延闿终于落下木槌，一声闷响，像极了军工厂里锻铁的最后一锤。他拿起那份被无数只手摸过的草案，封面上的“大明新宪法”五个字，墨迹已有些发暗——那是武备系用鲜血与烈火锻造出的颜色。\n“散会吧。”他声音不高，却清晰地传到每个角落。\n议员们起身时，脚步声格外齐整，像列队走过厂区的工人。萧振瀛把旧报纸仔细折好，塞进怀表夹层——怀表内侧刻着的“君宪”二字，终于不用再对着月光偷偷擦拭。\n谭延闿抬头望向宫墙的方向，手里的草案沉甸甸的——那不是突然降临的惊喜，是他们用几十年的车床声、枪膛焰、一锤一凿锻成的结果。 灯火在咨议院的窗棂上明明灭灭，像极了那些年他们在暗处点燃的火把。夙愿成真的激动，从不是骤雨般的喧哗，而是长河归海般的沉静——终于，到岸了。\n三日后，谭延闿将草案呈到定武帝面前，低声道：“此乃民意所归，望陛下……”\n定武帝下意识地想要摩挲袖口，却又立即将抬了一半的手指转向打开草案，指尖划过“天子诏令需经内阁副署方能生效”的条款，忽然抬头一笑：“组庵觉得，津钢减薪的工匠，算不算‘民意’里的民？”\n谭延闿一怔，刚要答话，却见定武帝双手阖上新宪法，"
TOD_STG.165.a:0 "“天视自我民视，天听自我民听，朕必以此自警。”"
TOD_STG.166.t:0 "注重工艺革新"
TOD_STG.166.d:0 "工造部的铜炉刚添了新炭，魏定兴却把一份机床说明书拍在了会议案上，纸页上的齿轮图谱被他圈得密密麻麻，“为了供应军需，这几家国有企业，必须换这批精密镗床。”\n魏定兴拿出几页纸，上面标着新旧设备的效率对比：“新机床的误差能控制在发丝粗细，加工速度是旧设备的三倍。若换了这批设备，炮弹的引信精度能提高五成，前线的将士就少些哑弹的风险。”\n案前的同僚们却炸开了锅。工造部主事刘启元抖着花白胡子：“魏大人，这机床一台抵得上一个厂的工匠的一年的工钱了！旧设备修修还能用，何必花这冤枉钱？你看这账，买十台机床的银子，够给这三个厂工人发三年工资了。”\n“你省下来的钱，真能发到工人手里吗？”魏定兴冷哼一声，范云存捧着个铁皮盒走上前，打开盒盖，里面是堆长短不一的废铁屑，“这是津钢上周的废品。旧车床车出来的炮栓，十件里三件卡壳，光是回炉重炼的铁水，就够买半台新机床了。前儿我去津钢，见个老师傅蹲在废料堆里哭，他儿子为了赶工，被飞出来的铁屑崩瞎了眼。咱们总说‘为国效力’，但不能让工人们拿命填啊！”\n刘启元还想争辩，张寿镛却抬手按住了他，捻着胡须沉吟：“工人不易，可资金是道坎——内阁刚给前线拨了军饷，库里实在空了。”\n“钱的事，让各厂自己想办法解决一部分，剩下的我来想办法。”魏定兴抓起那份说明书，"
TOD_STG.166.a:0 "“我去找王阁老，他是财神爷，总能有法子的。”"
TOD_STG.167.t:0 "增加军购订单"
TOD_STG.167.d:0 "铜壶煮着的雨前龙井泛着热气，却压不住案上摊开的军工厂名册。鲍贵卿捏着茶盏的手指重重叩了叩桌面，青花盏沿磕出轻响：“前儿看了前线的战报，摩托化纵队的故障率快到三成了——唐山重型机械的那批新发动机，必须加订五百台。”\n姜登选已伸手在名册上圈出“洛阳军需工程总务部”：“霆九说得在理。洛阳的榴弹炮，性能远超旧款，却总说产能跟不上。依我看，再拨三成钢料，让他们把生产线扩一倍——炮弹落得快，弟兄们的伤亡就能少一半。”\n “扩产不止是为了前线。”周学熙缓缓开口，“譬如吧，景山机车的坦克底盘，用的是咱们自己炼的特种钢，每多造一台，就能带动三家铁厂、五家机械厂开工。大同的重型飞机厂缺铆工，保定的飞机设计局缺绘图员——把订单砸下去，技工学校就能扩招，那些失业的年轻人有了活计，地方上的安稳就多一分。”\n众人说的激动，孔祥熙却叹气：“你们倒说得轻巧。唐山的发动机一台要要多少钱？——这单子铺开，没有几百万龙元撑不住。现在那里都要花钱，国库的底子怕是要露出来了。”\n鲍贵卿忽然笑了，往孔祥熙面前推了杯茶：“庸之兄这话就见外了——你这理财的本事，还能弄不来钱？”\n姜登选跟着点头：“再说了，这些厂子都是国之根本。唐山的总办是早年讲武堂的同窗，洛阳的账房先生是王永江兄的门生——新技术引进了，设备更新了，以后上交的利润也能多了，不能只看眼前一时嘛。”\n鲍贵卿抓起茶壶，给众人续上茶：“就这么定了。唐山的发动机、洛阳的火炮、景山的坦克、保定和大同的飞机——三天后把细则报给工造部，魏定兴那边正盯着国企革新，正好让他把新技术的验收标准定得严些。”\n窗外的阳光斜斜照进来，落在名册上那些密密麻麻的红圈上。铜壶里的水又开了，蒸汽氤氲中，没人提那些厂子的负责人都是谁，只说“前线需要”“工人要吃饭”，仿佛那些即将轰鸣的机床，真的只为硝烟和炊烟而转。只有案角那只被茶渍浸黑的算盘……"
TOD_STG.167.a:0 "还在无声地算着一笔笔明暗交织的账。"
TOD_STG.168.t:0 "发展实体经济"
TOD_STG.168.d:0 "议事堂的铜炉刚添了新炭，暖意却抵不过案上摊开的账册带来的争执。吴鼎昌将《钱荒缓解草案》拍在中央，厚重账册的边角磕出轻响：“上月华北十三家纱厂停摆，七成是因为资金短缺，钱活了，工厂才能转。”\n旁边的徐堪看魏定兴要开口，立即接过话头，“达铨说得在理，钱荒持续了这么久，光管控生产不是办法，我们还是得在货币政策上想想办法。但增发得有节制，否则米价跟着飞涨，工人手里的钱更不值钱。”\n“节制？”魏定兴被将了一军口气也不太好，案上的《机床革新清单》被带得滑出半寸，“徐主事怕是没见过工厂停摆的样子。”他抓起洛阳军需厂的报表往案中一推，“上个月缺特种钢，车间停了三天，两百多个工人蹲在厂门口等着开工——光靠印票子填不上料缺口，得有实打实的设备、原料，这才是根本。”\n“振邦兄这话未免绝对。”周学熙悠悠开口，“洛阳的炮管要钢料，河间的农具厂也要铁——军工得顾，民生也不能放。你看这名录上的纺织厂，若能换上新织布机，工人有活干，市面自然活络，老百姓也不至于连衣服都不好买”\n他话音刚落，财政部的张寿镛便点头：“缉之说得对。货币是活水，实业是良田，水多了涝，田旱了死。”他指着案上的产销图，“就像唐山机械厂，既造军用车床，也产农用犁铧——两者本就该相辅相成。”\n会议在张寿镛的总结声中收尾，案上的炭火烧得正旺，映得众人的影子在墙上晃了晃。散会后，张寿镛抱着文件夹往回廊走，魏定兴快步跟上，两人的身影在暮色里拉得很长，聊的无非是如何让新设备更快落地、怎样平衡军工与民生的产能，风卷着雪沫子掠过檐角，两个人之间的距离……"
TOD_STG.168.a:0 "倒是真的更近了些。"
TOD_STG.169.t:0 "加定军用机床"
TOD_STG.169.d:0 "玉泰茶楼的后堂被炭火烘得暖意融融，铜壶里的雨前龙井滚出细泡，却冲不散案上军工厂名册的油墨味。鲍贵卿刚点完唐山机械厂的发动机订单，坐在末席的魏定兴忽然欠了欠身，清癯的脸上带着疲惫。\n“诸位，”他将一份《机床缺口清单》推到中央，纸页上“洛阳军需——高精度镗床20台”“景山机车——坦克炮塔铣床15台”的字样被红笔勾得醒目，“这是军工国企这几日递上来的急报。洛阳厂说，旧机床车出来的炮管膛线误差快到半毫米了，根本配不上新炮弹；景山的工头更急，说再没有新铣床，坦克底盘的装甲板都得靠手工打磨——扩产的话，这些设备必须先补上。”\n周学熙端着茶盏的手顿了顿，嘴角牵起一丝无奈的笑：“振邦兄这话说到点子上了。前几年去唐山机械厂，见他们还在用端和年间的蒸汽锤，我说该换电动的，他们支支吾吾说‘能凑合用’。现在倒好，全攒到一块儿要换新的，是等着咱们一次性掏家底呢？”\n“也行，这样正好用最新的了。”姜登选不用管钱的事自然心态也放松，“听说那玩意儿精度能到发丝，正好让洛阳的炮管打得比准星还直——总不能让弟兄们拿着带毛刺的炮弹上战场。”\n他话音未落，孔祥熙再也无法忍受这些人了，“超六你站着说话不腰疼！这单子上的数加起来，够给前线三个师换冬装了！我是管不了这个账了，你们谁能管谁管吧。”\n众人一时沉默，只有铜壶的水咕嘟作响。王永江推了推眼镜，慢悠悠开口：“庸之兄莫急，钱的事我来想办法。还是前方的战事重要，耽误什么都不能耽误了军需呀！”\n话虽应得爽快，他指尖却在“利润”二字上暗暗发力，把纸页戳出个小坑。这些厂子上交利润属实不高，怎么连换机床的成本都覆盖不了，大明每年的军售款……洛阳厂去年报的“设备维护费”就有五万龙元，真用到机器上了吗？景山机车的账册更是糊涂，光“杂项开支”就占了三成利润——长此以往，怎么能成？\n“还是岷源有办法！”鲍贵卿笑着打圆场，给王永江续上茶，“那就这么定了，三天后让工造部把设备参数报给财政部，贷款的事就拜托岷源了。”\n魏定兴起身告辞时，王永江还在对着账册出神……"
TOD_STG.169.a:0 "指尖在“洛阳军需”的名字上反复摩挲。"
TOD_STG.170.t:0 "扩建电报网"
TOD_STG.170.d:0 "暴雨像鞭子似的抽在临时搭起的木架上，发出噼啪脆响。李铁山抹了把脸上的雨水，把手里的瓷绝缘子往电线杆上按——瓷片上的冰碴子硌得手心生疼，他哈出的白气刚冒出来就被风吹散了。\n“都快点！”工头老张举着马灯在泥地里跺脚，灯芯的光在雨幕里晃成一团昏黄，“上头的命令，天亮前必须铺好！明早六点，前线的战报要从这儿过——误了时辰，谁也别想好过！”\n三十多个工人像被赶的牲口，在齐膝的泥浆里挪动。李铁山的徒弟小柱子才十五，背着一卷沉甸甸的铜线，深一脚浅一脚地跟在后面，草鞋早就被泥水泡透，每走一步都像拖着块铅。“师傅，这线太沉了……”他喘着粗气喊，声音被雨声吞掉一半。\n“沉也得扛！”李铁山吼回去，嗓子眼里全是泥腥味。昨天后半夜被砸门叫醒时，他还以为是抓壮丁的——老张举着张盖着红印的纸，说这是“军用电报网紧急工程”，每人发了三个杂面馒头，就把他们从热被窝里拽到了这荒郊野岭。\n雨越下越大，电线杆在泥里摇摇晃晃，像随时会栽下来。有个叫王老三的老工人没抓稳，从梯子上滑下来，腰撞在石头上，疼得直抽气。李铁山刚要过去扶，老张的马灯就照了过来：“磨蹭什么？监工的人就在后面跟着呢！”\n众人顺着灯光往后看，隐约见辆黑色轿车陷在泥里，车窗里透出点昏黄的光——听说那是工造部派来的监工，手里捏着怀表，一分一秒地掐着时间。\n“把绳子给我！”李铁山咬着牙爬上梯子，雨水顺着额角流进眼里，涩得他睁不开眼。他摸出怀里的铜接线端子，冻得发僵的手指怎么也拧不紧螺丝，急得直骂娘。小柱子在下面举着马灯，忽然“哎哟”一声——灯被风吹灭了，黑暗里只听见他摸索着找火石的动静。\n“废物！”老张的骂声混着雨声砸过来，“点不着灯就用手摸！这线接不上，咱们就是通敌的乱党！”\n王老三挣扎着爬起来，从怀里掏出个用油纸包着的火折子，抖着手吹了半天才亮。微弱的光线下，李铁山看见他后腰的衣服渗出血来，在泥水里晕开一小片暗红。\n后半夜雨小了些，天边泛起鱼肚白时，最后一截线终于接好了。李铁山瘫在泥地里，看着电流计上的指针轻轻跳动，忽然笑出声——这声音穿过雨雾，倒像是远处兵工厂的汽笛声。\n老张举着电报稿跑过来，声音里带着兴奋：“通了！前线的捷报传过来了！”他把稿子往众人面前晃，“上头说了，每人多发五个龙元的绩效费！”\n小柱子摸着口袋里还没凉透的馒头，忽然问：“师傅，这电报线能传家信吗？我想告诉我娘，我没被抓壮丁，是在修正经事。”"
TOD_STG.170.a:0 "“儿行千里母担忧”"
TOD_STG.171.t:0 "鼓励降本增效 "
TOD_STG.171.d:0 "王永江把陈宜山呈交的《国企效能调查报告》拍在案上时，指节因用力而发白。报表上的数字像扎眼的铁锈——洛阳军需厂的镗床利用率不足三成，却报了八成的维护费；唐山机械厂的新发动机合格率刚过六成，账上的“原料损耗”却比私营厂商高了四倍；最离谱的是大同飞机厂，去年采购的铆钉，竟有一半在仓库里锈成了废铁。\n“效率低成这样，利润能不亏？”他声音发沉，“还有吗？你们蹲了三个月，就查出这些？”\n陈宜山递上一叠附页，里面是工人的口述记录和仓库的实拍照片：“自然不止这些，洛阳厂的高层把检修机床的钱挪去盖了私宅，唐山的账房先生和原料商勾结，每吨钢料多报百分之三十的成本——”\n王永江猛地起身，绕着案几踱步，年初为了给洛阳厂换机床，他硬着头皮向德华洋行贷了款，本以为能看见起色，没想到竟是这副光景。“查！给我往深里查！”他一拳砸在案上，“管他是谁的门生故吏，只要损公肥私，一律拿下！”\n消息传到财政部时，孔祥熙正在算新一批军购的账。他捏着张泛黄的纸找到王永江，纸页上是魏定兴在直电当厂长时的记录：“岷源兄，你要查旧账？为赶工绕过招标，私下采购德国变压器；虚报工人数量冒领工资，还有这，为了提升效率，快入冬了拆了一百来家民房，你说这些，是不是应该重罚？哦对了，之前管少府的人，是不是也该追一个失职之责？”\n王永江的脸色霎时沉了。魏定兴是少有的能吏，他账目的问题还不都是填了武备系这些人的活动经费，去年还以一厂之力供上了百分之二十的电力缺口，现在孔祥熙翻出这些旧账，明摆着是要挟。\n没等他开口，魏定兴竟自己找上门来，“王岷源，直电的旧账我认。挪用公款是真，私下采购也是真，为了提升产能，拆了几十家民房更赖不掉。要罚要办，我绝无二话。”王永江看着他眼里的红血丝，长长的叹了口气。\n三日后的武备系会议上，鲍贵卿把各厂的问题清单摔在中央：“洛阳的工头、唐山的账房，必须查！”\n孔祥熙刚要开口，被姜登选按住：“庸之兄，振邦的事是特例——他挪用的钱，你知道都进了哪里，怎么要细细究来吗？”\n“既往不咎，但得立规矩。从下月起，各厂每月报三样东西：设备利用率、原料损耗率、工人实发饷银——少一样，管事的就别干了。”周学熙见姜登选压制住了孔祥熙的气焰，随即说出了以后的要求 。\n王永江最后拍板，声音斩钉截铁：“旧账掀过，但谁要是再给国企丢人，武备系的刀口可也不只向外！”"
TOD_STG.171.a:0 "众人尽皆应声称是"
TOD_STG.172.t:0 "整顿朝廷秩序"
TOD_STG.172.d:0 "夕阳西下，京城褪去了白日“万国衣冠拜冕旒”的恢弘，光影斑驳间，数百年的积淀竟令行走其中的人无端觉得阴森。行人纷纷归家之际，京城宣武门外的龙源楼迎来了几个不速之客。倚在一边偷懒的门房一见便知来者身份不一般，急忙立起身子，几步向前，“见过几位老爷，不知几位老爷有何贵干？”\n“郑潇在这里吗？”为首的御史直入主题。\n“郑……郑大人确实在里头。正在雅座和朋友们聚会。”听闻此言几人也不废话，直接便让店员带路。有两人直奔雅座而去，还有两人则让老板把此间的餐单拿来查看。\n直奔雅座的锦衣卫来到名为“清平乐”的雅座门前，推门而入，便见桌子上摆着一盘不剩几块的糟鹅掌、一盘玉环瑶柱、一份吃了一半的松鼠鳜鱼，和一份清炒翡翠虾，每个人的面前还摆着一个小汤盅，看来这饭大概是吃的差不多。\n御史微微点头，向主座上的郑潇一拱手，“扰了郑大人雅兴，敢问郑大人这几位客人是何姓名？今日因何聚餐啊？”郑潇本有几分惊诧，听得此言突然反应过来什么，不仅减了怒容，还急忙立起身，“下官今日在这里宴请同学叙旧。”接着便介绍几位同学姓谁名谁、有无官职、以何为生、家住何处。旁边的另一个御史在一旁记下了这场宴饮的菜色与参加人员，落笔写完，两人向郑潇一拱手，告辞而去。\n郑潇立在门前看二人离开后，这才坐回原位。旁边一个白脸长须的男子开口道，“怪不得郑兄你如此小心，一点规格不敢逾越，朝廷这下是真的要整顿秩序了？”\n郑潇苦笑，“你没看赵司长都被枪毙了？哪里不是来真的，今日我们闲聚还不知道是不是罪过呢！”“我看也不是坏事，这些蛀虫早该清理清理了，没按太祖爷立的规矩就已经是仁慈了。要我说查查酒宴怎么了？为官本来本就不该结党营私，这时从源头上杜绝。”他虽然这么高声说着，但却用眼神警告在座诸位小心隔墙有耳。"
TOD_STG.172.a:0 "众人也很快明白了他们的意思，纷纷附和起来。"
TOD_STG.173.t:0 "民治社会"
TOD_STG.173.d:0 "案上的《新宪法》副本泛着冷光。王永江将“民治”二字圈得重重的，笔尖几乎戳破纸页：“从下月起，各地都要发放‘民治’的宣讲文，报纸要开专栏，讲讲‘百姓如何参与国家事务’——哪怕现在做不到，声势得先造起来。”\n姜登选刚端起的茶盏顿在半空，眉峰拧成个疙瘩：“岷源这是最近看了什么南方的报纸？”\n“我没那个兴致，但是为了我们英明神武的陛下。”王永江带着一丝揶揄目光扫过在座的武备系众人，“新宪法陛下是签了字，可诸位别忘了，他能痛快答应，是因为咱们握着军工厂、掌着军费和军队。如果有一天……”\n周学熙推了推眼镜，镜片后的眼睛里满是不解：“可陛下连‘天子诏令需经内阁副署方能生效’都认了，还能有什么异动？”\n“异动？多了去了。”鲍贵卿忽然开口，手指在膝头无意识地敲着，“组庵没跟你说？他接过宪法的时候就问减薪工人算不算民，他又没什么事务，便天天表演亲民，京城的几个贫民区快被他转遍了。”\n暖阁里霎时静了，不过也不出人意料，定武帝一向野心勃勃，这么快甘拜下风实在不是他的风格。\n“所以我们才更要注重民意”鲍贵卿目光落在案上的《新宪法》上，“陛下签了字，咱们自然应该把‘民治’喊得比谁都响。真到他想反悔时，百姓先不答应——这才是咱们要的。”\n阎锡山放下香烟，眉头皱得像太行山的褶皱：“可是给百姓这么大‘自由’，是不是放得太宽了？他们能把握的住吗？”\n周学熙一笑，“这个好办，在短期内，由于各种复杂的社会、文化和历史原因，我们当然无法让每一个民众都直接参与政治决策，相信百姓是会理解这一点的，民治，总要一步一步来嘛，这是一个漫长但不得不忍受的过程。”\n“火车也是自由的，但只要铺好了铁轨，”陆徵祥看看仍旧迷惑的阎锡山作出了比喻，"
TOD_STG.173.a:0 "“他一样会沿着行走！”"
TOD_STG.174.t:0 "加强中央集权"
TOD_STG.174.d:0 "王永江的书房里里，铜炉的火燃得有气无力，王永江将一份卷宗推到案中，纸页上的“兰陵县民变”五个字被墨汁浸得发乌。\n“上月兰陵县出了桩事。”他声音沉得像压着雪，“县令催粮催得急，把个农妇逼死了。本不是什么大事——这年月，饿死人的村子都有。偏这农妇家五个儿子，娘家六个兄弟，十几个内侄，抄起锄头就把催粮官活活打死了。”\n案上的茶盏轻轻晃动，姜登选皱眉道：“这刁民也忒大胆了。”\n“大胆的在后头。”王永江翻开卷宗，里面夹着几张潦草的供词，“知县派衙役去抓人，那些人就躲进了村。巧的是，附近几个早被催粮逼得喘不过气的村子，不知怎么勾搭上城里的水龙队——夜里放了把火，借着救火的由头冲进去，把知县给砍了。”\n周学熙推了推眼镜，指尖在供词上划过“水龙队”三个字：“水龙队是救火的，怎么会掺和这个？”\n“领头的是个退伍兵，”王永江抬眼狠狠地锤了一下桌子，“最要命的是，知府怕担责任，始终没有上报，闹得几个县沸反盈天了才被驻军发现，还差点误了前线大事。”\n“所以症结就在这里——地方官各自为政，出了乱子先想着瞒，。”陆徵祥微微一叹，“自景隆以来，中央对地方的掌控便时松时紧，如今国家板荡，县令敢私调衙役，知府敢压下民变不报——如果现在不整顿由着他们，长此以往，恐怕重蹈覆辙啊。”\n“故强化中央集权，乃当务之急。”周学熙的声音陡然提高，“首要之务，在于加强中央政府之权威与职能。中央政府当握有决策之权，统筹国家之资源，推动各项事业发展，否则统制经济的规划，都是建立在流沙之上，根本无法推行。”\n“权力这东西，分出去容易，收回来？不怕闹出乱子？”\n“趁着现在只是个苗头，难对付也得对付。”王永江接过话头，，“兰陵县的农妇死了，是一家的事；可军粮断了，是前线十万弟兄的事。中央握不住权，今天是兰陵，明天就可能是洛阳、是唐山。”\n炭炉彻底熄了，议事堂里的寒气漫上来。众人散时，兰陵县民变的卷宗留在案上——那纸上的血迹与墨迹混在一起，"
TOD_STG.174.a:0 "倒像是给新政策，洇开了一片沉甸甸的底色。"
TOD_STG.175.t:0 "内阁实权"
TOD_STG.175.d:0 "时值深冬，窗外飘着细密的雪花，玉泰茶楼的雅间里却暖融融的。红木茶几上摆着一把紫砂壶，茶烟轻轻缭绕。王永江慢慢放下茶盏，先开了口，声音低沉又清晰：“现在的政局，陛下虽说坐在那个位置上，但幸而权力早就被约法限制住了。咨议院的各位，也只能负责推选内阁成员。可国家诸事繁杂的，好多事都等着重新兴办，要是政令非要一层层协商，甚至政出多门，那效率实在太过低下。”\n“岷源说得太对了。现在乱党还没平定，军事和外交上的事都需要快速决断。咨议院讨论事情，常常是议论来议论去，做成的没几件，遇到事就互相推卸责任，白白耽误时机。”朱启钤一叹，“内阁既然承担着行政的全部责任，要是没有相应的决策权，那就名不副实，怎么正常运转呢？”\n“不仅如此，虽说宪法已经说了天子诏令未经内阁副署不得生效，但我们这位陛下……”李纯用手指指了指天，“和先帝一样，还是在试图用各种办法绕开内阁，去办他想干的事”\n姜登选坐在窗边，看着邀请他来的这三位也知道了他们想干什么“三位阁老既然都想好了，安排咨议院提法案便是，我这一个武夫也不懂啊！”\n朱启钤从公文包里拿出一份文件，摊在桌上，神色郑重地说：“我的意思是，应该推动‘内阁权力法定化’，明确规定内阁是最高行政决策机关。凡是涉及预算决算、缔结条约、任免官吏、军政大计等事项，都由国务会议商议决定后施行。”\n“那枢密院呢？”姜登选也懒得绕圈子了，放下一直捧在手里的茶盏，“也归各位阁老管？”\n“不知三军之事而同三军之政，则军士惑矣；不知三军之权而同三军之任，则军士疑矣。军事指挥自然应该交给军事专家，”王永江亲手替他续上了些开水，“但是必要的沟通是有必要的，我看，设置一个联席会议？"
TOD_STG.175.a:0 "“为了大明”"
TOD_STG.176.t:0 "宣传民德"
TOD_STG.176.d:0 "王永江捏着份《新宪法》副本，指尖在“公民权利”一章反复摩挲。“光有这纸章程，成不了共和。”他忽然开口，声音打破了议事堂的沉寂，“就像给了百姓钥匙，却没教他们怎么开锁——最后要么把锁砸了，要么把钥匙丢了。”\n姜登选往炉里添了块炭，火星噼啪溅起：“岷源这话在理。前几日去军营看看，旁边有来拾柴的百姓争抢不已，一个大小伙子直接把个老太太推了个跟头，还要打老人家，人心不古啊，不讲规矩，真把权力交到他们手里，还不知道要闹出什么乱子。”\n“所以得先立民德。”周学熙推了推眼镜，从袖中抽出份《民德宣讲纲目》，“我拟了几条：尊老爱幼、诚实守信、勤劳节俭……这些本是民间的老理儿，只是知易行难，就说洛阳厂的原料商，去年以次充好，差点毁了一批炮管——若商家有诚信，工人有勤谨，何至于此？ \n“乡约里一直有‘每月讲善’的规矩，哪家出了孝子、哪个是义商，都写在村口的碑上。现在咱们办报纸、开讲堂，也该把这些拾起来。”鲍贵卿看向孔祥熙，“庸之兄管着财政，拨点银子印些年画、编些唱本，让戏班子也唱唱这些，比光念宪法条文管用。”\n“是，唐山厂的老工匠，一辈子琢磨怎么把机床调得更准，这就是勤劳；大同飞机厂的账房，一分钱的料都不敢多报，这就是诚信——把这些人的故事讲出去，比讲大道理有用。”\n姜登选拍了拍案：“就这么办！让工造部把各厂的‘模范工匠’报上来，民政部收集民间的孝子义商，都登在报纸上。再让学堂里的先生，每天给孩子讲一段——十年二十年过去，总能把这民德立起来。”\n“印年画、编唱本花不了几个钱。我怕的是……”孔祥熙难得没跟钱玩命，“百姓学了这些，要是反过来盯着咱们，怎么办？”\n“那自然……”一直沉默的周学熙一笑，"
TOD_STG.176.a:0 "“应当以身作则。”"
TOD_STG.177.t:0 "改革宪兵机构"
TOD_STG.177.d:0 "枢密院的会议室里，姜登选敲了敲“宪兵营地”的标记：“前日军械库丢了二十发炮弹，宪兵查了三天，连个脚印都没摸着——就凭他们腰里那能当他们爹的手枪，能防住谁？”\n阎锡山手里的香烟明灭不定：“超六说的是。之前有上报兵痞赌钱打死人，宪兵去了竟被围着起哄——连自家人都管不住，还谈什么？”他磕了磕烟灰，“这宪兵机构，得改得能镇住场子才行。”\n商震忽然铺开一张《宪兵规程》：“我在欧洲见他们的宪兵，腰里别着转轮手枪，手里拿着手铐，管的就是军中铁序。”他指着“军纪督查”条目，“咱们的宪兵现在还在练队列，哪懂查赌、审案？得让军械局给配新家伙——至少得有连发枪、手铐，还得有摩托车，不然遇着劫道的，光靠两条腿追？”\n李纯摸着下巴点头，指尖在“战俘审讯”几个字上划过：“前几日抓了个敌营的探子，宪兵审了两天没问出东西，还是工造部的翻译官看出他手势不对——可见不光要练枪，还得教他们识字、学外语、懂审讯技巧。”他顿了顿，“戍守京城的宪兵更得严，上次丰台驻军哨兵擅离职守，宪兵竟没发现——真要出了岔子，谁担得起？”\n“说得对，不光是装备，还有管理。现在的宪兵队，队长说的算，查案凭心情，记功靠关系——就像没装铁轨的火车，跑着跑着就偏了。你看人家怎么管：查案得两人以上同去，供词要双方签字画押，连没收的赃款都得当日登记入库，队长碰都碰不到——这才叫规矩。”\n“纯如兄说到了根上。”姜登选将马鞭往案上一搁，“更新装备是其次，先得让他们明白自己是干什么的。维系军纪不是站岗，是要敢掀军官的桌子查贪腐，敢锁闹事的兵痞送军法处。不如先试点——给宪兵配二十支新式步枪，再挑十个识字的兵，专管军粮押运和营地纪律，三个月后看成效。”\n油灯的光渐渐斜了，案上的规程被众人的手指翻得卷了边。姜登选最后拍板，声音透着不容置疑的劲：“就这么定了——军械局下月起拨发新式装备，宪兵是军中铁律，手里的家伙得硬，脑子里的规矩得清，才能让弟兄们服，让外人怕。”"
TOD_STG.177.a:0 "“严肃军纪”"
TOD_STG.178.t:0 "加强爱国教育"
TOD_STG.178.d:0 "顺天的茶馆最近重新开业了，当然，表演的内容要改一改，以前那些受管学系堕落腐化的自由派思想的内容自然是不许再讲，要以文化人，要讲爱国精神。虽然有人疑惑没有管学系时大家爱听的也是汪大尹火烧宝莲寺，但这些人很快纠正了自己错误的思想。\n茶馆内说书先生正在绘声绘色地描述着肚兜上的赤色鸳鸯，台下稀稀落落地坐着几个老头也是聚精会神地听着，门口的门房忽然直了直腰——街对面停下辆黑色轿车，下来个中年男人手指间夹着的烟卷燃得很慢，一看便知是常出入公署的人物。\n门房慌忙掀帘，伙计正端着茶壶往内场跑，差点撞在那人身上。“先生里面请，刚沏的龙井。”伙计堆着笑，眼角却瞟向台上——说书先生刚把《皇明宝训》往桌上一放，见这阵仗，又不动声色地塞回了袖中。\n“这一日，平壤城外大雪漫天，真个是“大雪飘飘似鹅毛”，陈明忠带着他那队炮兵，踩着没过膝盖的积雪，总算赶到了大营。人未解甲，马未卸鞍，就有亲兵来传：“李将军有请！””\n“您道这李将军是谁？正是辽东总兵李如松，那可是能征惯战的老将！大帐之内，烛火通明，各路将领分列两旁，个个盔明甲亮。陈明忠品级最低，往角落里一站，活像个插班生。可他心里头啊，早跟揣了团火似的——想当年，他读张载的“横渠四句”，读到“为生民立命，为万世开太平”，直拍着桌子叹：“当效文成公！”元虏祸乱中原的旧事，他听老人们讲过无数遍，所以他扔了圣贤书，承袭父职学开炮，气得老师骂他“贪功弃道”。可他心里有数：能保家卫国的，才是真学问！”\n“就见陈明忠的炮兵阵地上，黑黝黝的炮口直指平壤城头。他改造的炮架能转得更灵，算的弹道分毫不差——“轰！轰！”几声巨响，城头的敌楼应声倒塌，砖石乱飞！那火力，那准头，把旁边的老将都看直了眼：“乖乖！这陈书生，玩炮比咱玩刀还熟！””\n城破之后，李如松摆开庆功宴。酒过三巡，就听角落里有人拍着桌子唱上了：“严风吹霜海草凋，筋干精坚胡马骄……”\n李如松在上首听得大笑：“陈将军这是唱的哪出？好个激昂！”\n陈明忠“噌”地站起来，拱手朗声道：“末将从前只在书里读卫霍故事，今日亲历此役，才知‘封狼居胥’不是虚言！我大明将士，就该有这等气概！”\n满帐将领轰然叫好！您说这陈明忠，到底是弃了圣人言，还是把圣人言刻进了骨子里？依我看呐，能保国安民的，便是最好的“往圣绝学”！这正是： \n书生投笔赴戎机，一炮轰开平壤西。莫道书中无壮志，疆场才是好文题！\n台下的老头们愣了愣，随即跟着叫好。那中年男人端起茶盏，眼尾的余光瞥见先生翻开的话本上，“保家卫国”四个字用朱笔描得极深，“这才是我大明的茶馆该说的东西，先生可有功名？”\n“小人姓李名胜，是昌德40年的进士。”自打中年男子进来李胜便已看出他应该不是普通人，想着自己心里那一点年少时的野望，才有了刚刚那一段现挂。\n“既然有举人功名，在这里说书太可惜了，你明天去宣传部报道吧。”说着对身边的秘书吩咐，"
TOD_STG.178.a:0 "“你给他一份出入函，别让人家以为他是骗子。”"
TOD_STG.179.t:0 "改善民生"
TOD_STG.179.d:0 "铜炉里的雨前龙井泡得淡了，王永江推过一叠卷宗，纸页上“山东旱灾”“直隶流民”的字样洇着墨痕，“前几日振邦去唐山厂巡查，见厂外窝棚里住了二十多家流民，大冬天还穿着单衣。”他声音沉得像压着雪，“有个孩子冻得发僵，手里还攥着半块冻硬的窝头——咱们造炮造枪的银子流水似的花，总不能让百姓冻饿而死，至少，不能比往年多冻死太多吧。”\n朱启钤心里想着魏定兴怎么不回直电看看那一百多户被他拆了民房的百姓脸上直抽抽，“也不用唐山，就在顺天，这天子脚下，地铁里的流民又多了一倍，我看再这么下去可以直接给地铁站设县衙了，民心是水，能载舟，亦能覆舟，咱们总得让百姓有口饭吃。”\n这二人你一言我一语，姜登选却只是捻着胡须喝茶。这些民生琐事，既不关乎军工厂的产能，也不涉及前线的战事，他听着只觉得遥远，偶尔应一声“岷源兄说得是”，心思早飘到了洛阳厂新炮试射的事上。\n“诸位这是闲得慌？”孔祥熙嘴角撇出几分不屑，“百姓日子过得太舒坦，谁还愿意去兵工厂当苦工？谁还肯去前线卖命？饿其体肤才能使其奋进，古往今来都是这个理。”\n 这话一出，连一直沉默的周学熙都皱起了眉：“庸之兄这话就错了。”他放下茶盏，语气带着难得的严肃，“前几日洛阳厂的工人闹罢工，就因家里孩子没粮吃——你让他们饿着肚子造炮弹，能造出好东西？得让他们觉得，跟着咱们干，日子能有盼头。”\n孔祥熙忽然压低声音：“莫非是宫里那位又有动静？想用民生收买人心？”\n “他也没这个钱啊，还以为是先帝年间呢？”谭延闿忽然开口，他刚从咨议院回来，袍角还沾着霜，“但咨议院里，有几个议员正拿着流民的事做文章，说咱们‘只知扩军，不顾民生’。”他敲了敲案上的《议案记录》，“钱是咱们拿的，事是咱们在办，凭什么让他们拿去当政绩？得让老百姓明白，谁才是真的对他们好”"
TOD_STG.179.a:0 "言之有理"
TOD_STG.180.t:0 "出台反罢工法"
TOD_STG.180.d:0 "会议的气氛有些凝固，自开战以来，虽然武备系用尽了手段，但是经济上的困难仍旧十分棘手，开战并没有像很多人预期的那样立即解决很大一部分失业问题，甚至因为中小企业陷入困境，造成了更多失业，国企也无力吸纳如此多的工人，剩下的工人则不得不承担以前更多人力完成的工作量。在岗的工人不堪重负，失业的工人无以为生，二者交叠之下，华北地区开始出现了此起彼伏的罢工，规模也是越来越大，让顺天政府本就艰难的经济雪上加霜。\n“这帮刁民，无法无天了！国家正处于危急状态，他们居然敢罢工要挟！”孔祥熙怒吼出来，“我就不明白了，既然他们认为日子过不下去，那就应该更努力的工作啊，国家已经给了他们一份工作，为什么就是不肯好好干呢！”\n“他们认为一天工作六个时辰甚至以上是人体无法支持的，并且希望工资不至于让一家人饿死。”李纯看了看孔祥熙，想了想还是咽下了后半句不那么美妙的话语。\n“工人的要求也并非无理，只是现在处于紧急时期，加班赶工无法避免啊，”魏定兴叹了口气，“答应了他们的要求，军需怎么办？”\n朱启钤捏着份《华北罢工简报》，指尖在“唐山机床厂——罢工三日，零件断供”的字样上反复摩挲，“扩大生产，得有安稳的生产秩序。现在这些罢工的，今天停机床，明天堵铁路，军需订单堆成山，工厂却开不了工——再这么闹下去，前线的枪都得卡壳。”他将一份《反罢工法案草案》推到案中，“依我看，得先立规矩：严禁战时罢工，违者按妨碍军务论处。把这股邪气压下去，生产才能走上正轨。”\n“立法案？”魏定兴皱起眉，“上个月天津纺织厂罢工，就是因为工头把日工时加到七个时辰，还扣了半个月工钱——真要硬压，怕是要出更大的乱子。”\n姜登选“啪”地拍了下桌子：“敢在战争期间罢工，这已经不是一般的工人了！必须要出重拳！”\n孔祥熙立刻附和：“超六兄说得对！我看这法案还得加一条：罢工期间，工厂有权另雇工人，原有工人一律除名——断了他们的后路，看谁还敢折腾！”\n“息怒息怒，二位，”王永江温和笑笑安抚了一下姜登选，“咱们刚修了宪法，现在就像以前一样直接镇压，太不体面了，还是桂辛的法子好，咱们通过咨议院通过个法案，彻底整顿一下这些欲壑难填的破坏分子。”"
TOD_STG.180.a:0 "依法办事嘛"
TOD_STG.181.t:0 "维护经济秩序（1）——新人新气象"
TOD_STG.181.d:0 "知府衙门后院，白惕生正悠闲地赏玩着一盆新得的兰花，幕僚轻手轻脚地进来，递上一张名帖，“直隶电力常总办来了，说是有急事求见。”\n白惕生捻须的手一顿，眉头立刻皱了起来。他与魏定兴私交不错，两人皆文人出身，偶尔还能品茗对弈，谈谈诗书。但对这个新上任的常宁，白惕生是打心眼里厌恶。此人是纯粹的武夫，性格暴烈，言语粗鄙，开口便是“军国大事”、“武备系体面”，仿佛天下人都该为他们无偿牺牲。\n“这煞星……准没好事。”白惕生心中不豫，却不敢不见，魏定兴如今高升工部，常宁是他的心腹，以后前途恐怕也不可小觑。\n“请他去二堂花厅吧。”白惕生整理了一下衣冠，无奈地叹了口气。\n花厅内，常宁根本没坐，像头焦躁的熊罴一样来回踱步，见白惕生进来，只是随意拱了拱手，算是见礼。\n“白府台，闲话俺老常也不多说了，有桩事，你得帮兄弟摆平！”常宁开门见山，直接将那份报价单塞到白惕生手里，“你看看！顺昌矿务，报的这是什么狗屁价钱！这煤是金子做的还是银子炼的？”\n白惕生接过单据，快速扫了一眼，心中已有数。顺昌的报价确实偏高，但如今战事连绵成本激增，煤价普涨也是实情。这报价虽不厚道，但还在市场波动的范围内，远未到离谱的地步。\n他沉吟着，试图委婉解释：“常总办息怒。如今时局艰难，物料腾贵，顺昌那边或许也有他们的难处……”\n“狗屁的难处！”常宁毫不客气地打断他，声音又提高了八度，“我看就是奸商习性！瞅准了厂子里急等煤下锅，坐地起价！白府台，这事你不能不管！这可不是我老常一个人的事，这关系到直隶电力的生产，进而关系到军工作坊的供电！耽误了前线的军械供应，这责任，他顺昌担待得起吗！”\n一顶天大的帽子直接扣了下来。\n常宁逼近一步，压低了些声音：“白知府，上面刚下来了《关于整顿市场秩序指导意见》，您得替我们做主啊！”\n白惕生脸色微沉，他心中苦笑，这常宁啥时候学会看文件了？不仅是要借他的官威压价，更是手把手教他怎么去恐吓对方，但看着常宁那双透着悍戾和不达目的誓不罢休的眼睛，所有拒绝的话都堵在了喉咙里，和魏定兴还有道理可讲，和常宁嘛……\n白惕生深吸一口气，“子安言重了。维护市场公允，本就是我分内之责。这样吧，我后天请顺昌公司问询情况，总要晓之以理，让他们顾全大局，体谅朝廷的难处。”\n他这话说得依旧含蓄，但常宁听懂了。他要的就是这个“问询”的态度。\n“好！有府台大人这句话，俺就放心了！”常宁脸上终于露出笑容，重重一拍白惕生的肩膀，拍得白惕生一个趔趄。"
TOD_STG.181.a:0 "“回头我做东，请大人喝酒！”"
TOD_STG.182.t:0 "维护经济秩序（2）——市场秩序"
TOD_STG.182.d:0 "顺昌公司的老板赵泽有些忐忑地走进了知府衙门的二堂。他不知这位素来还算讲理的白府台为何突然相召，心中隐隐有些不安。\n“赵老板，请坐。”白惕生脸上挂着程式化的笑容，示意对方坐下，又让人上了茶。“今日请东家过来，是有件事，想与您商议一二。”\n“府台大人有事尽管吩咐，小人岂敢当‘商议’二字。”赵德明连忙躬身，态度谦卑。\n白惕生沉吟片刻，指尖在茶几上轻轻敲了敲，似乎斟酌着用词。“是这样。近日呢，朝廷对地方大宗物资交易，尤其是涉及军工供应的，督办得格外严厉。三令五申，要严格落实《关于整顿市场秩序指导意见》，严禁囤积居奇、哄抬物价，确保军需民生稳定。”\n赵泽心里咯噔一下，似乎摸到了一点门道，脸上的笑容有些僵硬：“是是是，朝廷法令，小人一向是严格遵守的……”\n“赵老板自然是守法的良商。”白惕生打断他，语气依旧平和，但眼神却锐利了几分，“所以也只是循例问询一下。贵号近日与直隶电力的燃煤交易，这报价……”\n“有劳府台大人亲自垂询……是在下糊涂！只是这报价，最近成本激增，我实在是……”赵泽的表情比哭都难看，武备系执掌大权后，经济政策对他们这些私人企业主尤其是他这种矿业公司尤为不利，他的成本上涨了两成，给直电的报价已经几乎没有利润了，只是维持资金流转罢了。\n“哦，对了，近来朝廷对工矿安全也极为重视，尤其是矿难事故，追责极其严厉。顺昌矿上用工想必也是完全依照《工矿管理则例》的吧？”白惕生说起了一个看似无关的话题，“不过我相信赵老板，历年税审您一向账目清晰，安全资金肯定都用在了实处。”\n这番话，语气温和，甚至带着几分“关切”，但字字句句都像锤子一样砸在赵泽的心口。查账？他的账目怎么可能完全清白无瑕？查安全用工？天下的矿场，包括那些国有企业，真要按死条文去卡，没有一个能完全达标！知府大人这哪里是“问询”和“关切”，分明是精准地点在了他的死穴上。\n当日下午，一份盖着顺昌公司新印章的补充报价函就被快马送到了直隶电力总办办公室。单价较之前降低了足足一成。"
TOD_STG.182.a:0 "有形的大手还是挺有力的嘛"
TOD_STG.183.t:0 "君宪治国"
TOD_STG.183.d:0 "此刻，咨议院议长谭延闿正站在御座之前，声音平稳却蕴含着不容抗拒的力量，宣读着《大明帝国宪法修正案》的最终文本：\n“……天子乃大明帝国之象征，统而不治。国之政事，依宪法及法律，由内阁及咨议院负其全责。司法权独立，以宪法为至高准绳……此乃万世不易之典，四海共遵之法。”\n每一个字都像一把钝刀，缓慢而坚定地削去皇帝手中真实的权柄，只留下一顶沉重的、光芒万丈的、却是纯粹象征性的王冠。\n朱镕坤坐在那冰冷的、雕满龙纹的紫檀木宝座上，距离模糊了他的视线，同样也让他的面目在臣僚眼中变得遥远。\n他听着那些条款，那些他曾经嗤之以鼻、认为是“乱党邪说”的词汇——宪法、内阁责任制、司法独立——如今却成了将他封印于神坛之上的律法。\n恍惚间，他透过那些臣僚的瞳孔，仿佛看到的不是自己的倒影，而是另一个身影——那个被他斥为“轻佻”、喊着“自由民主”却最终仓皇逃窜的废帝——他的侄子。\n他曾经的雄心壮志——重铸大明荣光，做一个真正的“天下王”——似乎在这一刻被彻底掏空了内涵，只剩下一个华丽的空壳。\n他没有去看文件的内容，他知道那毫无意义。他只是缓缓地伸出手，拿起那方沉重的玉玺，在无数道目光的注视下，精准而无力地，盖在了那份决定帝国未来命运的文件上。\n朱镕坤的脸上看不出喜怒。他只是缓缓地、极其缓慢地，将目光从臣子眼中那虚幻的少帝幻影上移开，重新聚焦于现实。\n咚”的一声轻响。\n象征着旧时代的终结，也宣告了一个由武备系主导、在君主立宪外壳下的新时代，正式开启。"
TOD_STG.183.a:0 "可爱非君？可畏非民？"
TOD_STG.184.t:0 "巫马案（一）"
TOD_STG.184.d:0 "顺天航空大学的学生巫马一雄最近算是惹了祸事，因为他这特殊的名字，加上平日几句时不时冒出的“忠诚！”、“攘夷”的言论，就被相关部门暗暗盯上，暗加监控，更不幸的是，他还的确有一个至交好友梁栋出身交通系家庭，诸多牵强线索竟拼凑出“暗通西逆”的骇人罪名。\n巫马的同窗挚友林崇轲虽平日与巫马在治国方略上时有争论，但深知其为人热诚、绝无非分之想。眼见好友蒙冤系狱，林崇轲求告无门，情急之下竟做出惊人之举——他连夜伏案疾书，将一纸辩冤陈情书通过重重阻碍，竟最终递至定武帝面前。信中言辞恳切，力陈巫马之冤，更直言“陛下乃天下之主，万民之望，岂能坐视学子蒙冤而不语？”\n定武帝朱镕坤得此书，略一沉吟，便觉此事可为。他正苦于武备系势大，皇权日益被“宪政”之名架空，此举正可收揽人心。他当即提笔，给相关部门去信表示自己的关切。\n然而，他的关切并没有得到想要的结果，反而等来了李纯，李纯神色恭谨却语气坚决：“陛下，臣等听闻陛下欲过问巫马一案。陛下仁德，体恤学子，臣等无比感佩。然司法独立，乃宪法所定。天子垂拱而治，不行具体政务，尤不宜直接干预司法个案，此乃宪政之要义，亦为天下法统所系，臣请陛下……”\n定武帝的脸色忽青忽白。他目光扫过眼前这位武备系的元老，知其态度已是整个内阁乃至咨议院的态度。他深知，这纸手谕即便发出，也必将被内阁以“副署权”驳回，徒增笑柄。\n“……秀山所言，甚合宪理。是朕一时情急，欠考虑了。”"
TOD_STG.184.a:0 "“此事……便依律法办理吧。”"
TOD_STG.185.t:0 "巫马案（二）"
TOD_STG.185.d:0 "本报讯： 顺天城近日一桩学案，颇能照见当下之怪现状。航空大学学生巫马一雄，忽以涉嫌“暗通西逆”之莫名罪名被拘。其同窗林崇轲，救友心切，竟行险招，一纸辩冤书直递大内，期冀直达天听。\n据悉，锦王殿下览书后，竟真个提笔，欲下一道“详查”之手谕。此乃久违之举动，若在昔年，便是天恩浩荡，冤狱立解。然今时不同往日，李秀山一番“司法独立”、“天子垂拱”的大道理，竟将锦王的“慈心仁念”，生生堵了回去。陛下之御笔，终未能越宪法之雷池一步。 可见我大明宪政，成绩斐然，竟已能约束天子于宫阙之内，诚为可喜可贺之进步！只是陛下这番“市恩”未成，反讨了个没趣，其窘迫之态，想来不负顺天政变时的意气风发！\n呜呼！锦王欲做圣主明君而不可得，岂不哀哉？然此哀，尚不及巫马生所蒙之冤其万一！\n其罪状之离奇，足以令人喷饭。内务部诸位老爷，竟似初开蒙之幼童，见“巫马”此等上古正姓（孔门七十二贤巫马施之后裔），竟觉眼生，疑是舶来之物，怀疑其与北石等人有所关联，遂定为“通西”之铁证！此等见识，何其卓绝！ 若依此例，那姓“姬”、姓“姜”的上古遗民，岂非个个都成了千年之前便通外的疑犯？武备系诸公，整日价叫嚷“实业救国”、“军事现代化”，却连本国之家谱姓牒都未曾读通，一味只知抓人办案，扩权营私。其所谓“合情合理”者，原来就是不读书、不看报，全凭一知半解胡乱攻击嘲讽哉？\n究其根本，巫马生之真罪，岂在“巫马”？分明在其有一“交通系”之好友耳！当局扫清余孽，乃行“爱屋及乌”之策，凡与旧派有瓜葛者，皆可成为表功之勋绩。故而捕风捉影，指鹿为马，无所不用其极。司法独立之精神，恰成了他们党同伐异之漂亮外壳。\n此一幕闹剧，庙堂之上，定武帝无视宪法，直接干预司法；衙署之内，官僚不学无术，胡乱抓人。上下失据，丑态毕露。我大明之“中兴”，莫非就系于此等人物与行径之上乎？\n目前巫马一雄仍陷囹圄，法律程序缓慢如蜗行。学界友人虽愤慨，然慑于当局之威，多敢怒不敢言。\n本报谨按： 宪政之妙用，竟在于既能堵天子之口，又能护官僚之短。一部宪法，两种妙用，武备诸公，诚乃懂法的妙人！"
TOD_STG.185.a:0 "然则，法律若仅为权势之玩物，则今日能困君于九重，安知他日不能陷你我于绝境！"
TOD_STG.186.t:0 "粉墨春秋"
TOD_STG.186.d:0 "本报讯 连日来，京中广和楼戏院门前车马如龙，掌声如潮。全本新排《打金枝》在此连演三日，座无虚席，一时蔚为风潮。此剧虽为旧戏，然经名家重整词曲、精心排演，更显庄重典雅，尤以“绑子上殿”一折，情真意切，感人至深，观者无不击节赞叹。\n名须生杨小楼饰演的郭子仪，甫一登台便是一段铿锵念白：\n“臣虽犬马功微，然不敢忘人臣之本。子仪每战必先，非为爵禄，实为社稷！”\n声如洪钟，气贯长虹，将一位功高盖世却谦谨守礼的贤臣形象，演绎得淋漓尽致。其子郭暧醉打金枝，郭子仪闻讯震怒，当即缚子入宫，跪伏阶前，泣声道：\n“臣教子无方，罪该万死！”\n其身段凝重，声情并茂，满座为之动容。\n而唐代宗则由名净角金少山饰演，帝王气度雍容大度。见郭子仪跪地请罪，他含笑上前，亲手扶起，朗声道：\n“贤臣何罪之有？小儿女闺房之争，岂足以损君臣之义！”\n又慨然道：\n“朕与卿共天下，非卿不足以安大唐！”\n言罢赐酒赐座，君臣对饮，一派雍和气象。台上丝竹悠扬，台下掌声雷动。\n戏散之后，观众犹自徘徊不去，纷纷议论。一位须发皆白的老翁拊掌叹道：\n“唐时有郭令公这般忠贞之臣，代宗这般明睿之君，何愁天下不宁？今人观此，更当思齐！”\n更有戏评家张兰德撰文称：\n“此剧重排，非惟艺事之盛，更见教化之功。杨小楼之郭子仪，刚毅中见谦抑；金少山之唐代宗，威严中见宽仁。二人对手戏丝丝入扣，可谓珠联璧合。”"
