STG_eryuanjunzhu:0 "二元君主"
STG_eryuanjunzhu_desc:0 "现在朝廷的组织架构整顿已经基本完成，我们终于要接近众正盈朝的境界，搭建起给中央诸贤发挥的舞台，皇帝陛下将不再为帝国的琐事所困扰，他忠诚的臣子会解决一切。"
STG_eryuanjunzhu_xiaoguo:0 "一心会：  \n每日获得的政治点数: §G1.0%§! \n陆军组织度回复: §R-5.0%§! \n勋贵：  \n每日获得的政治点数: §G1.0%§! \n适役人口: §G10.0%§! \n陆军师核心领土攻击: §G3.0%§! \n陆军师核心领土防御: §G3.0%§! \n"
STG_guojiaanquanfaan:0 "国家安全法案"
STG_guojiaanquanfaan_desc:0 "乱嚼舌根，祸乱朝政的危险分子必须被除掉，我们将通过这项安全法案，为消灭那些不稳定因素提供助力"
STG_jiquanguojiajiqi:0 "集权国家机器"
STG_jiquanguojiajiqi_desc:0 "普天之下，莫非王土，帝国的一切都必须置于勋贵们的掌控下，这样才能更好的为帝国大业服务，绵延国祚。"
STG_jiquanguojiajiqi_xiaoguo:0 "重建中央威权：  \n当地最大工厂数: §G10.0%§! \n"
STG_jiaqiangdifanglingdao:0 "加强地方领导"
STG_jiaqiangdifanglingdao_desc:0 "同样，为了传达朝廷的意志，我们要提高地方长官的权威，遍施朝廷恩威，君父恩泽。"
STG_jiaqiangdifanglingdao_xiaoguo:0 "重建中央威权：  \n每日获得的政治点数: §R-0.1§! \n党派支持度对稳定度修正: §G15.0%§! \n"
STG_jianguanchangtaihua:0 "监管常态化"
STG_jianguanchangtaihua_desc:0 "腐化问题是每一个中原王朝所苦恼的问题。大明已立朝数百年，积弊自然也不少，作奸犯科之事时有发生。因此为了防止虫豸作祟，祸害朝政，常态化的监管来震慑宵小是有必要的。"
STG_jianguanchangtaihua_xiaoguo:0 "重建中央威权：  \n战略资源获取效率: §G10.0§! \n建造速度: §G5.0%§! \n"
STG_xiaomineiyou:0 "消弭内忧"
STG_xiaomineiyou_desc:0 "在我们的努力之下政通人和，百废俱兴，我们重整帝国，恢复荣光的伟业已经没有了内部的阻碍了。"
STG_yuanlaoyizheng:0 "元老议政"
STG_yuanlaoyizheng_desc:0 "勋贵们的治国智慧是朝廷宝贵的财富，这些理念都是为了大明，为了陛下。元老们将组织会议对国家大事进行深入讨论。"
STG_yuanlaoyizheng_xiaoguo:0 "重建中央威权：  \n建造速度: §G5.0%§! \n"
STG_shengzhumingjun:0 "“圣主明君”"
STG_shengzhumingjun_desc:0 "合格的天子应当作为国家的精神领袖，指引国家的前进方向。而具体的各项事务，交由各位臣子处理即可。相信在圣主明君和各位国之柱石的共同努力之下，大明一定能走向更好的未来。"
STG_junshihuachanye:0 "军事化产业"
STG_junshihuachanye_desc:0 "面对前线紧张激烈的战事，我们必须立即采取行动，将一些民用工厂转型为军用生产，以确保前线士兵的军需供给得到充分满足。这样的调整至关重要，将能够极大提升军备的生产效率，为前线将士提供更为充足和高质量的武器与装备，从而增强我军的战斗力，为赢得战争胜利奠定坚实基础。"
STG_jingjijiegouzhongxinhua:0 "经济结构中心化"
STG_jingjijiegouzhongxinhua_desc:0 "在朝廷的明确和集中指导下，工厂的生产活动将得到更为精准和高效的引导，从而显著提升生产效率，为国家的经济发展和军事建设做出更大贡献。"
STG_jingjijiegouzhongxinhua_xiaoguo:0 "重建中央威权：  \n生产效率保持: §G10.0§! \n工厂产出: §G10.0%§! \n"
STG_jungongjingjigailiang:0 "军工经济改良"
STG_jungongjingjigailiang_desc:0 "朝廷的军工产业已经形成了相对完整的体系，然而目前却主要由武备系的官僚所主导和控制。为了提升军工企业的效率和战斗力，我们有必要对这些旧有的军工生产体系进行全面的改良和升级。是时候引入真正具备军事才能和专业知识的人才来管理这些军工企业了，以确保它们能够更好地服务于国家的军事需求，为国家的繁荣和安全贡献力量。"
STG_yinruminyingzhiheng:0 "引入民营经济制衡"
STG_yinruminyingzhiheng_desc:0 "日用品生产也是勋贵投资的重要方向，市场非常广阔，也能很好平衡我们的经济，增加我们的收入。更重要的是，与民营经济者合作，也有助于我们在财政上摆脱对于管学系的依赖。"
STG_yinruminyingzhiheng_xiaoguo:0 "重建中央威权：  \n补给消耗: §G-50.0§! \n缺乏战略资源惩罚: §G10.0%§! \n"
STG_tanxinggongshi:0 "弹性工时"
STG_tanxinggongshi_desc:0 "在应对突发状况和敌袭的紧急关头，一套灵活且高效的生产时间管理体系不仅能显著降低潜在损失，更能在逆境中创造出令人惊喜的额外收获。这种管理体系能够迅速调整生产节奏，确保资源得到最大化利用，从而帮助我们度过苦难时期。相信劳工们一定能理解我们的。"
STG_tanxinggongshi_xiaoguo:0 "重建中央威权：  \n生产效率上限: §G5.0%§! \n"
STG_huangmingrongguang:0 "皇明荣光"
STG_huangmingrongguang_desc:0 "日月同辉，群星宿卫，此乃大明帝国繁荣昌盛之象征。皇明之下，百姓安居乐业，国家昌盛富强，正如日月交相辉映，照亮万里江山。"
STG_huangmingrongguang_xiaoguo:0 "重建中央威权：  \n生活消费品工厂系数: §G-15.0§! \n正当化战争目标所需时间: §G-20.0%§! \n"
STG_shumiyuanguihua:0 "枢密院规划"
STG_shumiyuanguihua_desc:0 "作为朝廷的最高军事机构，枢密院的未来该如何规划是我们首先需要解决的问题。"
STG_yixinhuigaigefangan:0 "一心会改革方案"
STG_yixinhuigaigefangan_desc:0 "在枢密院的规划中，一心会的改革主张占据了上风！我们将积极扫除积弊，开始改革！"
STG_gaigeshumiyuan:0 "改革枢密院"
STG_gaigeshumiyuan_desc:0 "枢密院当前的重重弊病已经不能适应于当前的大争之世，依托朝廷的威势施加权威无疑是坐吃山空。低效率的指挥和交错的裙带关系都是我们革新的大敌，而帝国的勋贵也难辞其咎，若要改革则免不了冲突。先帝的军事革新，尽管有效改善了帝国军队的作战能力，但却并未能根除各类军中顽疾。我们定不会重蹈覆辙并实现我们的理想。"
STG_gaigeshumiyuan_xiaoguo:0 "新枢密院：  \n步兵单位编成花费: §G-30.0%§! \n"
STG_shapanxiaozu:0 "沙盘推演和测绘小组"
STG_shapanxiaozu_desc:0 "我们的目标是重建天命权威，剿灭全国叛匪，而全国地形各异，战场形势也变化万千。实现对可能的情况进行推演有助于我们开发合适的陆军学说指导我们的指挥工作。"
STG_shapanxiaozu_xiaoguo:0 "新枢密院：  \n陆军学说花费: §G-5.0%§! \n"
STG_junyanzongzhihuibu:0 "军演总指挥部"
STG_junyanzongzhihuibu_desc:0 "开展适时军演能够实践我们最新的研究成果，也能锻炼我们的士兵。"
STG_jianbingxiaoying:0 "尖兵效应"
STG_jianbingxiaoying_desc:0 "军队中除了理论扎实的参谋，还有战术能力顶尖的强力士兵，着重发挥他们的标杆效应能够塑造军中良好的陆军传统，便于我们将更多的精锐力量集中使用。"
STG_jianbingxiaoying_xiaoguo:0 "新枢密院：  \n特种攻击: §G5.0%§! \n特种防御: §G5.0%§! \n"
STG_kaifayasuoshipin:0 "开发压缩食品"
STG_kaifayasuoshipin_desc:0 "体积小，高热量的食品更适用于我们即将开展的特种活动，这也能有效降低补给压力，增强军队的续航能力。"
STG_kaifayasuoshipin_xiaoguo:0 "新枢密院：  \n携行补给: §G48小时§! \n包围惩罚: §G-5.0%§! \n"
STG_tibajicengshibing:0 "提拔基层士官"
STG_tibajicengshibing_desc:0 "帝国枢密院决定挑选精英士官组成若干个小组，给予各组长极大的自主权以便于开展特种行动，当然，各小组之间的协同训练也是必不可少的科目。"
STG_tibajicengshibing_xiaoguo:0 "新枢密院：  \n特种部队容量上限乘数: §G10.0%§! \n入侵准备速度: §G-20.0%§! \n"
STG_zhongshizonghenengli:0 "重视综合支援能力"
STG_zhongshizonghenengli_desc:0 "在传统观念中技术兵种并未得到严格的划分和独立重组，为了提升技术兵种质量和增强各连队的支援能力，我们应该对支援做更深层次的细化工作。"
STG_qianghuagongchengbing:0 "强化工程兵团"
STG_qianghuagongchengbing_desc:0 "在我们有志之士的探索下面对多变的战场地形我们有了新的探索方案，更大更强的工兵团队将将为天兵的推进拓平道路！"
STG_qianghuagongchengbing_xiaoguo:0 "新枢密院：  \n支援装备花费: §G-10.0%§! \n"
STG_jingzhunhuolitoushe:0 "精准火力投射"
STG_jingzhunhuolitoushe_desc:0 "强大的火力一直都是直隶军队的招牌，不过现在我们手中控制的资源不如先前，在保持原有火力规模的同时我们也应当考虑如何精准的投射火力以提高我们的效率。"
STG_jingzhunhuolitoushe_xiaoguo:0 "新枢密院：  \n炮兵攻击: §G5.0%§! \n"
STG_zhanchangwanhuatong:0 "战场万花筒"
STG_zhanchangwanhuatong_desc:0 "最新型的优势火力学说实践已小有所成，若要增强各支援单位在战场上的效用，也许我们还可以实验更多的方案。"
STG_jizhongyidian:0 "集中一点，登峰造极"
STG_jizhongyidian_desc:0 "在宽大的战线对峙中，打破平衡却只需要一个突破口。在一心会中，许多才华横溢的同僚都都信奉着“集中一点，登峰造极”的战争理念，显然，装甲单位是他们心中的理想答案。"
STG_jizhongyidian_xiaoguo:0 "新枢密院：  \n装甲速度: §G10.0%§! \n己方战场宽度: §G10.0%§! \n"
STG_zhiliangzhibian:0 "质量之辩"
STG_zhiliangzhibian_desc:0 "战时对于装备的质量平衡一向是热点问题，军工部门所追求的高质量与前线极高的损耗量相矛盾。尽管很难衡量利弊，但也必须做出抉择。"
STG_mokuaihuazujian:0 "模块化组件"
STG_mokuaihuazujian_desc:0 "配件的模块化设计不仅能便于对装甲单位的整修，也便于我们改造装备，将最新式的武器投入战场，随时随地提升战力。"
STG_mokuaihuazujian_xiaoguo:0 "新枢密院：  \n装备改装花费: §G-10.0%§! \n中型坦克单位模块化设计花费: §G-40.0%§! \n"
STG_zhengdunjunqiju:0 "整顿军器局"
STG_zhengdunjunqiju_desc:0 "在混乱之下，军器局的生产工作趋于废驰，整顿工作和加大投资势在必行……当然，借机塞入一些我们的自己人也是必要的工作。"
STG_zhengdunjunqiju_xiaoguo:0 ""
STG_diguojungongkuojianjihua:0 "帝国军工扩建计划"
STG_diguojungongkuojianjihua_desc:0 "划拨新的场地扩大生产规模，来喂饱我们的战争机器！"
STG_diguojungongkuojianjihua_xiaoguo:0 "帝国军工总署：  \n§Y军用工厂§!建造速度: §G10.0%§! \n"
STG_zongjiejingyan:0 "总结经验"
STG_zongjiejingyan_desc:0 "过往的生产经验反复积累，反复应用，不断总结，有利于军工企业的长远发展，不断革新，大明重生于鼎革之中，利器也自然孕育自此。"
STG_junbeizaikuozhang:0 "军备再扩张"
STG_junbeizaikuozhang_desc:0 "平叛工作已经初见成效，我们从叛贼那拿了帝国的资产，现在要专注于他们的修复，让他们在此为我们所用，奉献于重塑帝国天命的伟大事业当中去。"
STG_junbeizaikuozhang_xiaoguo:0 "帝国军工总署：  \n§Y军用工厂§!建造速度: §G10.0%§! \n"
STG_zunzhongxunguiyijian:0 "尊重勋贵意见"
STG_zunzhongxunguiyijian_desc:0 "在枢密院的规划中，勋贵老成持重的主张占据了上风！我们将继续发挥光荣的传统。"
STG_huigujingyingchuantong:0 "回顾京营传统"
STG_huigujingyingchuantong_desc:0 "自太祖开始，京营便代表着帝国最精锐的力量。虽然中途有所腐化，难承大任。但随着烈祖复振国朝，京营再一次恢复了往日的权威。在这漫长的建军历史中京营积累的丰厚军事底蕴是帝国宝贵的财富。我们应当回顾这些优良的传统，用于我们今日军制的改良。"
STG_huigujingyingchuantong_xiaoguo:0 "京营：  \n陆军经验增长: §G5.0%§! \n有经验的士兵的损失: §G-5.0%§! \n"
STG_tuanjiedeguizhoumen:0 "团结协作的贵胄们"
STG_tuanjiedeguizhoumen_desc:0 "归功于帝国勋贵的通力协作，我们已经完全掌握了朝廷，现在除了利益分配，一些小小的分歧也应当弥合，使我们的各个成员不生嫌隙，团结一致。"
STG_tuanjiedeguizhoumen_xiaoguo:0 "京营：  \n每日指挥点数增长: §G25.0%§! \n"
STG_zhenglijundui:0 "整理军队"
STG_zhenglijundui_desc:0 "面对当下混乱的时局，我们要做到划清编制，统一指挥，统一意见才能为接下来的军制革新打好铺垫，开一个好头。"
STG_zhenglijundui_xiaoguo:0 "军政集团的内部冲突：  \n计划加成上限: §G20.0%§! \n"
STG_xuanbaxunguizidi:0 "选拔勋贵子弟"
STG_xuanbaxunguizidi_desc:0 "勋贵作为帝国中的重要力量，他们与国同休，命运相连，以优秀的勋贵子弟作为建军基石可以铸牢军队的忠诚之魂。在外人眼中勋贵子弟多为纨绔难堪大用，但经我等挖掘定能寻得将门世家的耀眼新星。"
STG_xuanbaxunguizidi_xiaoguo:0 "京营：  \n每日获得的政治点数: §G10.0%§! \n授勋花费: §G-33.0%§! \n陆军师核心领土攻击: §G5.0%§! \n陆军师核心领土防御: §G5.0%§! \n"
STG_shendingjunxiaocaodian:0 "审定军校操典"
STG_shendingjunxiaocaodian_desc:0 "为适应战时速成培训，我们应当对操典进行修改，使其更加简单实用，更快的培养出基层军官填充到前线。"
STG_jinrugouzhong:0 "尽入彀中"
STG_jinrugouzhong_desc:0 "至此，我们已经初步达成了指挥团队的整理，能够对紧急情况做出快速反应。但若是要革除弊病，收揽人才，我们仍旧有很长的一段路要走。更深化的军事人才改革理应提上议程，让天下人才加入到我们的行伍中来。"
STG_touziqingwuqikaifa:0 "投资轻武器开发"
STG_touziqingwuqikaifa_desc:0 "人手一杆枪是建军的基本要求，而用一把好枪武装我们的士兵则是战场上取胜的关键。大明的火器革新从未停止，保持这一传统，加大投资是有必要的。"
STG_qietinglongyin:0 "且听龙吟"
STG_qietinglongyin_desc:0 "显然，强大的火力才是军队应真正追求的。战场上的一切不利都源于火力的不足。让敌人为重炮的怒吼而震颤才是理想的效果。"
STG_qietinglongyin_xiaoguo:0 "京营：  \n炮兵攻击: §G5.0%§! \n"
STG_hunbianzhuangjiabudui:0 "混编装甲部队"
STG_hunbianzhuangjiabudui_desc:0 "将装甲打散编入各部队作为支援单位协助步兵推进，这能极大的提高我们的作战能力。"
STG_zhenghejunxieshengchanjigou:0 "整合军械生产机构"
STG_zhenghejunxieshengchanjigou_desc:0 ""
STG_jiangcongzhongyu:0 "将从中御"
STG_jiangcongzhongyu_desc:0 "众所周知，我们的陛下晓畅军事，遍览全国地理。除开贤臣能将的帮助，陛下的才能也应有舞台得到充分的发挥，将陛下的伟大计划贯彻到军队当中是众将的重要任务。"
STG_jiangcongzhongyu_xiaoguo:0 "京营：  \n计划速度: §G-10.0%§! \n计划加成上限: §G20.0%§! \n"
STG_changtongtieluyunshu:0 "畅通铁路运输"
STG_changtongtieluyunshu_desc:0 "三军未动，粮草先行，在现代作战中铁路的运输决定军队的上限，若是不能保障后勤，再勇猛的士兵也会被给养不足所困。"
STG_guanshuzhongjunsixiang:0 "灌输忠君思想"
STG_guanshuzhongjunsixiang_desc:0 "大明的军队自然要服从陛下的号令，委派我们的监军在军队里传达陛下的意志，教化士兵，灌输忠君爱国的思想，这将是掌控军队的关键。"
STG_guanshuzhongjunsixiang_xiaoguo:0 "京营：  \n投降界限: §G10.0%§! \n陆军师组织度: §G20.0%§! \n"








### ideas ###
STG_rendimaodun:0 "紧张的人地矛盾"
STG_rendimaodun_desc:0 "华北地区紧张的人地矛盾虽然为工业化提供了充足的劳动力，但也抑制了当地产业的进一步发展。"
STG_jingjizhengce:0 "王永江的经济政策"
STG_jingjizhengce_desc:0 "庚午钱荒爆发以来，作为武备系领袖的王永江提出了一系列经济政策建议，试图令大明走出困局。这些经济政策通过扶持公私企业、出台优惠政策等各种方式，有效地减少了失业人口，维持了社会稳定，一定程度上缓解了大明的经济问题。但政策伴随着的高昂财政支出，也带来了严重的经济负担。"
STG_yixinhui:0 "一心会"
STG_yixinhui_desc:0 "作为武备系自军校体系中建立的秘密组织，一心会长期以来吸纳了许多年轻军官加入其中。作为年轻人，他们大多怀着一腔热血试图改变错误的现状，这些力量也在顺天事变中起到了关键作用。但随着我们政权开始走向台前，这些一腔热血也许会显得有些冲动过头了。"
STG_junzhengjituan:0 "军政集团的内部冲突"
STG_junzhengjituan_desc:0 "顺天政府各方走到一起，主要是因为他们有共同的政治敌人——朱喜钲。随着顺天事变后军政集团走向台前，各方的矛盾也逐渐体现了出来，如果不能有效平衡各方矛盾，也许......	"
STG_xungui:0 "勋贵"
STG_xungui_desc:0 "顺天的政变离不开勋贵们的支持，里面夹杂着经天纬地的英雄人物，也不缺少尸餐素位的虫豸。"
STG_yindangongshi:0 "银弹攻势"
STG_yindangongshi_desc:0 "上兵伐谋，其次伐交。关西士卒耐苦战，却不胜利诱，我部坐拥齐鲁膏腴之地，当以己之长，攻彼之短！"
STG_bujidaijia:0 "不计代价"
STG_bujidaijia_desc:0 "不惜一切代价，快速拿下西安！"
STG_jingyingzhinu:0 "京营之威"
STG_jingyingzhinu_desc:0 "坛成车毂帝亲扶，匣里吴钩玉辘轳。\n持节尽监诸校尉，请缨还系五单于。\n期门昼静团牙戟，画室秋严下虎符。\n却忆华容旧司马，孝皇频按九边图。"
STG_qianzhiqianxian_1:0 "钳制前线"
STG_qianzhiqianxian_2:0 "钳制前线"
STG_qianzhiqianxian_1_desc:0 "孙子兵法曰“用兵之法，十则围之，五则攻之，倍则分之，敌则能战之，少则能逃之，不若则能避之。”今庆王势大，不可强攻，当效法曹刿固守以弱其士气，以待攻守异形。"
STG_qianzhiqianxian_2_desc:0 "孙子兵法曰“用兵之法，十则围之，五则攻之，倍则分之，敌则能战之，少则能逃之，不若则能避之。”今庆王势大，不可强攻，当效法曹刿固守以弱其士气，以待攻守异形。"
STG_yinpiaodadaduyou:0 "银票大大滴有"
STG_yinpiaodadaduyou_desc:0 "有钱能使鬼推磨嘛！"
STG_jieyanling:0 "戒严令"
STG_jieyanling_desc:0 "非常之时当用非常之法，暂累吾民一年矣。"
STG_bafuhuanglong:0 "坝缚黄龙"
STG_bafuhuanglong_desc:0 "组织会战，强攻渡河！"
STG_jinying:0 "全面动员的京营"
STG_jinying_desc:0 "禁卫军，作为国家的精锐之师，其中不乏专门驻守顺天府、守护京师安宁的英勇部队，因此在民间享有“京营”的尊称。尽管这支部队并非我们的嫡系力量，但在当前西北军凌厉攻势的紧迫形势下，我们别无选择，必须全面启用这支战斗力超群的队伍以应对当前的挑战！"
STG_minzhupaimian:0 "民主牌面"
STG_minzhupaimian_desc:0 "工商士绅是朝廷栋梁，国家支柱，保留他们发声的渠道还是有必要的，毕竟我们可是“民主政权”。"
STG_wurenbingzheng:0 "武人秉政"
STG_wurenbingzheng_desc:0 "当国家面临外患内忧，文治不足以安定四方，便须倚重武人的忠诚与勇武，以确保国家长治久安。此时正值三千年未有之大变局，华夏欲争雄于世，需行非常之法，武人秉政，正当其时！"
STG_qiangangduduan:0 "乾纲独断"
STG_qiangangduduan_desc:0 "且夫俭节仁义之人立于朝，则荒肆之乐辍矣；谏说论理之臣间于侧，则流漫之志诎矣；烈士死节之行显于世，则淫康之虞废矣。故明主能外此三者，而独操主术以制听从之臣，而修其明法，故身尊而势重也。凡贤主者，必将能拂世磨俗，而废其所恶，立其所欲，故生则有尊重之势，死则有贤明之谥也。是以明君独断，故权不在臣也。然后能灭仁义之途，掩驰说之口，困烈士之行，塞聪揜明，内独视听，故外不可倾以仁义烈士之行，而内不可夺以谏说忿争之辩。故能荦然独行恣睢之心而莫之敢逆。若此然后可谓能明申、韩之术，而修商君之法。法修术明而天下乱者，未之闻也。"
STG_jueduizhichi:0 "绝对支持"
STG_jueduizhichi_desc:0 "天下之事无大小皆决于上！天无二日，我心中只有陛下一个太阳！"
STG_rendeshizheng:0 "仁德施政"
STG_rendeshizheng_desc:0 "五亩之宅，树之以桑，五十者可以衣帛矣。鸡豚狗彘之畜，无失其时，七十者可以食肉矣。百亩之田，勿夺其时，数口之家可以无饥矣；谨庠序之教，申之以孝悌之义，颁白者不负戴于道路矣。七十者衣帛食肉，黎民不饥不寒，然而不王者，未之有也。"
STG_chongjianzhongyangweiquan:0 "重建中央威权"
STG_chongjianzhongyangweiquan_desc:0 "溥天之下，莫非王土；率土之滨，莫非王臣。如今天下分崩离析，当务之急便是建立起中央权威，以重塑天下秩序。"
STG_bengkuidetianming:0 "崩溃的天命"
STG_bengkuidetianming_desc:0 "前线失利，人心惶惶。人们都在谈论着北齐亡于北周，高氏身死族灭，我军还能打赢这场战争么？"
STG_tianmingzaiwo:0 "天命在我"
STG_tianmingzaiwo_desc:0 "西北庆逆已灭，国家法统重光，其余诸侯不过冢中枯骨尔，天命在我！"
STG_tongzhizhidao:0 "统制之道"
STG_tongzhizhidao_desc:0 "“有大人之事，有小人之事。且一人之身而百工之所为备，如必自为而后用之，是率天下而路也。故曰，或劳心，或劳力；劳心者治人，劳力者治于人；治于人者食人，治人者食于人；天下之通义也。”统制之道，便在其中。"
STG_zhongyongkejia:0 "忠勇可嘉"
STG_zhongyongkejia_desc:0 "昔年岳鹏举曾言：“文臣不爱钱，武臣不惜死，天下太平矣。”然如今军中贪腐横行、庸人当道，已到了不得不彻底肃清积弊、革故鼎新之时。“一心会”成员一心为国，忠勇可嘉，理当成为我们改革的重要助力！"
STG_jingying:0 "京营"
STG_cangcuyingzhan:0 "仓促应战"


###人物描述###
STG_zhu_rongkun:0 "朱镕坤"
POLITICS_STG_zhu_rongkun_DESC:0 "朱镕坤，昌德皇帝的第三子，出生于1893年。自幼年起，他便展露锋芒，不同于其他皇子们的柔弱和文雅，他更倾向于英武豪气，怀揣着从军报国的理想。\n他的成绩一直名列前茅，无论是文还是武，都显示出他的才华横溢。然而，由于他心气浮躁，缺乏沉稳和深思熟虑，再加上庶出的身份，使得其一直未能得到父皇的青睐，也未被视为皇位继承人的合适人选。朱镕坤的封地在锦州，但他的心从未真正留在那里。他更愿意在京城中，与朝中勋贵和武备系军官们交往密切。在他们的熏陶下，他对军事战略有了更深入的了解，也对国家的安危有了更深刻的认识。\n在直隶陆军大学学习期间，他结识了越来越多的志同道合之士，他们共同探讨军事理论，研究战争策略。朱镕坤的才华和机智使他在这个群体中脱颖而出，赢得了同窗们的敬重和钦佩。一战期间，朱镕坤以军官身份被派往北美战场。在那里，他展现出杰出的指挥才能和英勇无畏的精神。他与东北军的部分将官建立了深厚的友谊，这些关系也为他日后的政治生涯奠定了基础。\n由于他的庶子身份，一战结束后，他被留在京城，过着闲赋的生活。尽管如此，他从未放弃对军事的热情和研究。\n朱镕坤的兴趣不仅限于军事战略。他对地图有着近乎痴迷的热爱。家中收藏有一份皇明坤舆全图以及大量的军事指挥地图。他对全国的地形地貌了如指掌，能够准确地分析各地的军事战略意义。这份对地理的热爱使他在军事指挥中更具优势。\n性格上，朱镕坤是一个典型的大明军人。他主张以武力征服世界，进一步拓展天朝体系的影响力。他对西北军持轻视态度，认为他们缺乏战争经验和战略眼光。相反，他将进一步控制南洋视为首要任务，认为那里拥有丰富的资源和战略要地。\n朱镕坤支持高度的集权和专制，认为这样可以确保国家的稳定和发展。在他眼中，整个帝国应该是一部巨大的战争机器，不断对外扩张疆土，维护天朝的荣耀和尊严。"
