TOD_STG.59.t:0 "联系关东"
TOD_STG.59.d:0 "自赤匪于辽阳倡乱以来，关东大地生灵涂炭，战火连绵不绝。关东招抚司内忧外患交困，亟须外界援手。若我方能施以援救，或可促其弃暗投明，与庆逆断交。关东地域广袤，物产丰饶，乃兵家必争之地。招抚司若得我方支持，当能稳固局势，恢复秩序。我方可先遣使团携厚礼，赴沈阳与其商议合作事宜。晓之以利害，陈以大义，使其知晓顺应大势，方为长久之计。"
TOD_STG.59.a:0 "敬候佳音"
TOD_STG.60.t:0 "关东回复"
TOD_STG.60.d:0 ""
TOD_STG.60.a:0 ""
TOD_STG.61.t:0 "关东同意"
TOD_STG.61.d:0 "捷音传至，关东方面既纳我方之请，愿协同联手，绝庆逆往来。此行关东，往来折冲，幸不辱使命，得关东诸将应允，此乃大功。关东地域广袤，工业发达，若其与庆逆断交，其势力必将受阻。枢密院当速传令各处，嘉勉前方使团不辱使命，再议后续策应方略。"
TOD_STG.61.a:0 "好！"
TOD_STG.62.t:0 "关东拒绝"
TOD_STG.62.d:0 "关东方面复函，婉拒我方所请。其于函中申明，无意对西安一方采取禁运等掣肘举措。枢密院权衡利弊，料其考量或因北方局势未稳，亦或忌惮庆逆余威。今既遭拒，中原腹背之虞难消。关东地区经济发达，资源丰富，若其继续向西安输送物资，庆逆势力必将更难撼动。我方当倍加警惕，以防庆逆借关东之力，图谋中原。同时，亦需与关东方面保持沟通，陈以利弊，晓以大义，争取其在关键时刻能为我方所用。"
TOD_STG.62.a:0 "该死！"
TOD_STG.63.t:0 "施压四川"
TOD_STG.63.d:0 "今我方戡平庆逆之乱，中原大局渐趋稳固。然而川蜀之地仍徘徊于顺逆之间，其势甚为暧昧。此时若不行非常之举，何以定天下之志？枢密院当机立断，拟发通牒于成都，严令其向顺天天子宣誓效忠。此非徒恃武力威压，实乃顺应天命人心。"
TOD_STG.63.a:0 "看看他们如何回复"
TOD_STG.64.t:0 "四川回复"
TOD_STG.64.d:0 ""
TOD_STG.64.a:0 ""
TOD_STG.65.t:0 "四川同意"
TOD_STG.65.d:0 "四川临时政府已接受我方所请，大局渐趋稳固，戡平乱局之期可望矣。"
TOD_STG.65.a:0 "好！"
TOD_STG.66.t:0 "四川拒绝"
TOD_STG.66.d:0 " 四川临时政府拒绝我方所请，至此和平商议之路已绝，看来唯有诉诸武力，方能解此乱局矣。"
TOD_STG.66.a:0 "敬酒不吃吃罚酒！"
