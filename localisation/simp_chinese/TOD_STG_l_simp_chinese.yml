TOD_STG.67.d:0 "今我方戡平庆逆之乱，中原大局渐趋稳固。然而岭北都司仍徘徊于顺逆之间，其势甚为暧昧。此时若不行非常之举，何以定天下之志？枢密院当机立断，拟发通牒于岭北，严令其向顺天天子宣誓效忠。此非徒恃武力威压，实乃顺应天命人心。"
TOD_STG.67.a:0 "看看他们如何回复"
