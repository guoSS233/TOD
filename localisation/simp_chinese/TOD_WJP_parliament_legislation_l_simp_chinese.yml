 WJP_parliament.1.t:0 "联盟议会质询内阁监督"
 WJP_parliament.1.d:0 "进步会领袖尾崎彦太郎在联盟议会提出质询，要求内阁说明民政法案将如何接受议会监督。自由社担心，若把行政事务交由议会掣肘，内阁将难以迅速行事。众议员们把目光投向内阁席，等待一场足以影响法案走向的答复。"
 WJP_parliament.1.a:0 "公开说明并接受监督"
 WJP_parliament.1.a_tt:0 "进步会态度 +1，自由社态度 -1。若民政派方案已获得民政派预算支持，进步会态度额外 +2。"
 WJP_parliament.1.b:0 "坚持内阁权限"
 WJP_parliament.1.b_tt:0 "党派态度不变。"
 WJP_parliament.2.t:0 "少数党派要求保障条款"
 WJP_parliament.2.d:0 "少数党派要求为法案补上保障。大同会领袖铃木茂三郎主张写入社会保障条款；国民革新同盟则希望工业政策受议会监督。内阁可以回应其中一方，也可以维持原稿，把最后的决定留给未来的议会表决。"
 WJP_parliament.2.a:0 "加入社会保障条款"
 WJP_parliament.2.a_tt:0 "大同会态度 +1。"
 WJP_parliament.2.b:0 "同意工业监督协议"
 WJP_parliament.2.b_tt:0 "国民革新同盟态度 +1。若国务派方案已获得国务派预算支持，国民革新同盟态度额外 +1。"
 WJP_parliament.2.c:0 "维持法案原稿"
 WJP_parliament.2.c_tt:0 "党派态度不变。"
 WJP_parliament.100.t:0 "联盟议会通过法案"
 WJP_parliament.100.d:0 "议长大竹贯一敲响议长槌，宣布审议结束。议会内支持法案的声音压过了反对意见，民政法案获得通过，内阁也暂时稳住了局势。各党派的目光随即转向这项法案将如何改变联盟的政治安排。"
 WJP_parliament.100.a:0 "法案正式通过"
 WJP_parliament.101.t:0 "联盟议会否决法案"
 WJP_parliament.101.d:0 "议长大竹贯一宣布审议结束后，议场依然没有形成足以支撑法案的共识。民政法案未能通过，内阁必须带着这场挫折继续面对联盟议会与各党派的质询，也让后续协商更加艰难。"
 WJP_parliament.101.a:0 "法案未能通过"
