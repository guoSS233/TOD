 ROC_ma_story.105.t:0 "谁的损耗"
 ROC_ma_story.105.d:0 "供销核账已经完成第一轮，补贴、损耗和虚报各有底册，已确认的赊欠不再转嫁给农户。财政处送来一份漂亮的汇总：损耗两成，责任尚待确定。于树德指着同一批粮问：“损耗究竟是雨淋的，还是运费算重了？”处长答：“分得这么细，就不方便汇总了。”\n\n合作社代表解释，核账时发现一批货确实受潮，另一批却是承运行先垫了转船费。前者要找保管责任，后者若统称损耗，合作社下季能借到的本钱也会跟着缩水。大同党右派商户不反对认真实运费，但担心中央按统一比例分摊亏损，小船行会为大仓库的霉粮买单。\n\n左派农会代表提出由社员参与核销，也担心让商社先解释运费会偏向经营者；财政处长认为，中央拨了补贴，就应由财政处决定哪些损耗可以承认。他带来一份“暂定损耗标准”，连受潮粮的赔付办法也写好。于树德问：“这是为核账制定标准，还是等核完才用标准把结果改掉？”处长答：“标准当然适用于一切已经核清的情况。”\n\n秘书将其中一张运货单交给处长，上面有他本人批准的紧急转船指令。若运费也算损耗，按新标准他负责的预算就不必补款；若单独列为运费，中央便要从别的支出里腾出钱来。处长看过后说，这只是“会计归类”，并不涉及处长个人。农会代表很客气地表示，既然与个人无关，他签个名应当不难。\n\n于树德没有撤销核账结果，而是请财政处说明下一季亏空由谁接住。商社代表愿先解释运费，请财政公开复核；农会则要求社员也能参与，免得标准只照顾经营者。处长听完说，财政处愿意保管各方意见。秘书将转船指令抄给所有代表：“这次大家都带回去，就不必只等一处来保管了。”"
