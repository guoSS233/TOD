 ROC_ma_story.401.t:0 "扣款的去处"
 ROC_ma_story.401.d:0 "工资核看已经完成：所谓“设备折旧费”确从工人工资中扣除，工人并未同意，款项去处也已列入中央复核记录。厂方代表来见陈赞贤时，带了一只崭新的防护罩：“钱并没有白花，工人也受了益。”工会代表答：“我们当然要防护罩，但要先知道它为何由受保护的人自费买下。”\n\n厂方会计解释，设备出了故障，临时购置安全用品时厂里没有现款；扣工资是错误的，可若全部立即退还，下一批维修材料便没有着落。大同党左派工会要求尽快补发，工人已经替工厂垫付太久；中派财政代表提醒，中央代垫可以解急，却须说明后续由谁归还。右派厂商关心企业信用，也不愿一纸扣款告示被当成以后转嫁成本的依据。\n\n工人代表拿出当初的安全会议记录：大家确曾同意优先安装护罩，但会议结论是从厂方经营款中支付，并非从工资扣除。会计认为那时厂里无钱，临时挪用是不得已；秘书请他读出通知上的“临时”二字。会计找了很久才承认没有写。秘书说：“难怪工人以为那是永久的，厂方却以为他们永久同意。”\n\n厂方提出从后续收入分期补还，工会担心期限太松；财政处建议先留存已核结果、限期报清偿计划，以免先动用公共预算。陈赞贤问工会代表，若工厂维修中断，工人是否接受暂调班次。代表想了一会儿，说不能把安全费再扣回工资，但愿意同厂方讨论怎样安排轮班和维修。“我们要的是安全，也要活干。”\n\n部长请各方把资金来源和付款次序说清，并要求新通知把工人当事人列进去。厂方代表临走前问，护罩能否先留在机器上。工会代表替部长回答：“留着。把它搬回财政处，并不能把我们的工钱搬回来。”"
