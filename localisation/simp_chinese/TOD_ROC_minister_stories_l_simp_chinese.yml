 ROC_ma_story.206.t:0 "水车的价钱"
 ROC_ma_story.206.d:0 "试田收获后，农技员与农户已经把水车、水费和额外工时记进下一季计划。计划送到中央财政处，却被退回一页：水车列为设备，踏水的人列为“自愿劳动”，费用栏因而是零。晏阳初问财政代表：“他们确实自愿上水车吗？”代表答：“计划里没有雇工款，我们只好认为他们自愿。”\n\n调查员请来参加试田的农户，她说四人轮班踏水，一人缺席就得有人补上；工时已经记清，但种粮的人不能因此多出一天。大同党左派主张在中央预算中补列劳动报酬，右派中的小农代表并不反对付款，却担心统一费率过高，使不用水车的村子替用水车的村子出钱。中派则坚持先把各县计划纳入同一预算程序，避免一处获补便处处照搬。\n\n财政处说，若按上年预算总额分配，已经记录的工时仍可保留，只是各县需在原额度内自己调剂；拨追加款可以及早安排劳力，却要挤占另一项推广差旅。另一个办法是由财政处和农户共同复核实际用途后分配补助，既保留中央审查，也要在现有批次内安排农户核验。谁都没有要求把水车从计划里删掉，争的是谁为它转动时消耗的力气付钱。\n\n秘书搬出一只手摇计算器，按记录算出每亩所需的轮班日数。财政代表赞叹：“这样的数字最有说服力。”农户问：“算账的人要不要工钱？”代表说当然要；她又问：“那为什么踏水的人可以不算？”代表解释计算器属于中央设备，水车则属于生产工具。秘书替他把话记下，郑重注明：中央设备不必自己踩。\n\n晏阳初请各方决定经费的来源与核验方式。散会时，农户问那台计算器是否也能算雨季；秘书说不能，但它至少承认手柄得有人摇。财政代表听见，表示愿意再看一遍工时栏目，只请部长不要把“自愿劳动”四个字印到明年的预算封面上。"
