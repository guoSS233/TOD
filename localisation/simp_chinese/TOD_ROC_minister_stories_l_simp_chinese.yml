 ROC_ma_story.501.t:0 "临时的红圈"
 ROC_ma_story.501.d:0 "田界、租约与水费凭据的复核制度已经建成，申诉材料也送交中央。一次党团听证上，一位大同党右派代表举起盖有复核章的地界表，要求银行将它当作永久产权证。萧铮提醒他，表上写着“临时复核”，代表笑道：“既然印了章，银行总要相信中央。”\n\n代表并非没有理由：小农要借钱，银行常嫌凭据不够完整；有一张中央认可的地界表，至少能让人进门。但左派代表指出，有些表只核定洪水后的沟线，租约和实际耕作争议还在复核，若立刻当作产权证，佃户的申诉就会被一枚红章挡在门外。中派代表担心两种解释传到各县，反而让银行谁的证据都不敢认。\n\n秘书取出印发时附带的说明，说明写得很清楚：复核结果可以作为继续办理的材料，不自动裁决所有权。听证代表问，为何银行柜台看到的只有表，没有说明。印刷承办人回答，说明比表大一张纸，装订时容易露出来。“所以您把多出来的部分裁掉了？”萧铮问。承办人说，为了统一规格，只好把整张说明另放。\n\n右派中另一位小农代表站起来，表示愿意接受更明确的正式复核，但不能等所有争议都结束才让银行看材料。财政人员提醒，加快复核需要差旅和审核经费；若先按现有说明纠正误读，复核制度仍可运行，只是各处对材料能作何用途，还得逐一答复。\n\n萧铮请秘书将那张被另放的说明重新送给听证各方，也请银行带回去。他没有把临时表说成废纸，更不肯让它顶替产权裁决。散会时，承办人问下次能否把说明印得小些；小农代表答：“可以，只要银行看得见，农户也看得见。”"
