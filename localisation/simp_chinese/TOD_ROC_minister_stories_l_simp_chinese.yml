 ROC_ma_story.203.t:0 "地图上的雨季"
 ROC_ma_story.203.d:0 "县情地图已经制成，中央农业计划也承认山地与河谷可以调整农时。推广处却在会议桌上放了一枚新印章：“例外核准。”处长说，只要先申请，县里仍可依地图变更播种日。“申请由谁批准？”晏阳初问。“自然是订统一日程的本处，”处长答，“否则例外怎么知道自己例外？”\n\n农技员展示两县记录：河谷的水已到渠口，山坡的雨季却迟了半月。地图把差异画得明白，地方也照此安排了耕作；现下争论的是复测费由谁出，以及县站能否先备案、由中央抽核。大同党右派担心层层核准耽误农时，中派则怕没有中央逐件复核，各县用“水情不同”任意改写目标。\n\n左派代表要求把农户经验写进复测，不能只看县站报告；财政处听说要请当地人参加，立刻问补贴标准。农技员答，若不付误工钱，愿意来的人就只能是离田最远的人。处长笑道：“这说明他们比较有时间研究农业。”秘书接上一句：“也比较有时间替忙着种地的人决定日期。”\n\n财政处随后呈上一张统一日程，空白处标着“各县可调整”，旁边附了三道会签栏。处长解释，三处并行会签，仍照原定日程办完。晏阳初问：“三处若按时交来相反的意见，谁向县里解释？”处长建议由中央统一答复；农技员则希望县站先备案，中央再抽核，免得每次调整都由三处决定。\n\n会议争到傍晚，窗外果然下了雨。处长说：“您看，气候变化难测，正需要统一管理。”秘书把窗户关上，答：“雨先进来了，申请书还在桌上。”众人这才回到预算上：若要各县按地图修订日期，测量、备案和抽查都得有人承担，哪一样先办，便决定谁先让出自己的时间。"
