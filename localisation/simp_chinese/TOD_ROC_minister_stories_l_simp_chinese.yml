 ROC_ma_story.402.t:0 "夜班以外的两小时"
 ROC_ma_story.402.d:0 "夜班约定已经签定，班次、加班补贴和工伤责任都有了明确条款。新排班最初照约执行，直到一批急件催到厂门，厂方建议工人每晚多留两小时，却称这段时间是“交接”，不算夜班。陈赞贤问：“交接做什么？”车间主任答：“把未完的活做完，让下一班接得顺一点。”\n\n工会代表说，正常交接确需时间，但这两小时要开机器、搬铜料，不能只因改了名字就不付补贴。厂方拿出订单，解释若完全依旧排班，交期将错过，客户还可能把下一笔订单转走。大同党左派支持工人按约领取补贴，中派建议先让现有班次照常、额外时数另行核定；右派供应商提醒，推迟交货也会让依赖订单的小厂跟着停工。\n\n秘书查阅已签协定，发现增加工时须由工会与厂方商定，并注明报酬；里面没有禁止交接，也没有把开机叫作交接。厂方代表指出，逐班会签可能赶不上今晚开工。工会代表也承认，不能让所有工人停在车间等一份新通知，但要求先确认多出的工时算工时，并由厂方说明补贴从哪一笔支出。\n\n主任提出让工人自愿留下，事后再按个人表现酌情补贴。工会代表问：“若我们自愿留下，不自愿领钱，可以吗？”主任说当然没有人会这样做。秘书翻开上月排班表：“这上面确实没有人签过同意，财务却已经把补贴预算削了一半。”主任解释，削减是为了鼓励车间提高效率，不是鼓励工人不要补贴。\n\n陈赞贤让原约继续生效，请双方讨论急件的临时安排与付款保证。散会时，主任问临时协议可否叫“交接办法”；工会代表说名称随意，只请把钟点写上。秘书补了一句：“写在钟面以外也行，只要财务看得见。”"
