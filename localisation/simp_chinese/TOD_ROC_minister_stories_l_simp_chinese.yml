 ROC_ma_story_completion_tt:0 "首次正常完成每项自动施政国策后，将触发对应的中央交涉事件。"
 ROC_ma_story_archive:0 "此事归档，不再追办"
 ROC_ma_story_archive_tt:0 "此事件已失效，仅作归档，不改变资源、派系好感、实绩、问责或施政日程。"
 ROC_ma_story.101.t:0 "借粮之后"
 ROC_ma_story.101.d:0 "灾年借粮的双重登记已经核清，赈济归赈济、社员借款归借款。于树德刚请中央财政处依照新信用簿拨付周转粮，副科长便送来一份贺词：“恭喜部长，旧账既清，以后便没有旧账了。”秘书低声提醒，合作社还等着中央补回当初代垫的粮款。副科长笑道：“那是新账，正好不在贺词管辖之内。”\n\n大同党中派的财政代表主张先照核定数字续借，补偿留待下季预算；如此不必另批经费，也不会妨碍粮车上路。合作社账房却带来下一季的赊购单：垫出去的本钱少一截，能借出去的种粮便少一截。她并不要求再免已经确认的借款，只请中央说清楚，当初替官仓垫的部分由谁填回。\n\n左派农会代表提议派人与合作社逐户复核，再拨一笔周转金；右派的米商赞成先供粮，却不愿让农会参与商社之间的信用核验。“若每一张借据都要多一道公章，”他说，“大家会很信任公章，只是不再敢借粮。”财政代表立刻表示，这足以证明全由财政处掌管最为稳妥。\n\n于树德问：“财政处肯替各社确认垫款，也肯替它们担下一季的亏空吗？”副科长答：“我们只负责认账，不负责赔账。”秘书于是找出财政处刚拟好的拨粮附则，里面却写着由财政处决定每社可借的数额。女账房忍不住问：“不负责赔，为何先要管我们怎样借？”\n\n副科长十分客气地解释，那叫“维护信用的一致性”。于树德接过附则，请他把这句话念给等在门口的社员听。门外有人问，若中央确定了借粮上限，田里的播种时节是否也会统一；副科长开始认真考虑，贺词是否应该先收回去。"
