 ROC_ma_story.103.t:0 "午饭与船脚"
 ROC_ma_story.103.d:0 "城乡采买合同已签，农产价款、运费与交期都列得清清楚楚。第一船米按约送到省城医院，却赶上码头临时加收夜间卸货费。采购科长拿着合同请于树德主持公道：“合同没有夜间一栏，因此这笔钱不存在。”秘书说：“医院的午饭倒是存在，锅里还能撑两天。”\n\n医院代表急着验收，合作社女账房却说，合同规定的粮价已经付出，额外船脚若都由社员承担，下一批米就凑不齐；船行也不愿白干，夜里装卸要另雇人，并非凭空涨价。大同党右派商户主张尊重合同，先按原价交货，让新费用下次商谈；左派代表反问，这一批货的额外劳力难道可以留到下次再吃饭？\n\n财政处建议从采购预备费垫付，代价是挪走医院预备采购布料的钱。采购科长立即表示，这笔钱“理论上仍属于医院”，只是在布料报销之前暂借给船行。医院代表听懂了：“那病人可以穿着理论上的床单睡觉吗？”科长很有礼貌地说，财政处并不负责决定病人穿什么。\n\n于树德请秘书拆开另一封急件。里面是一份分月支付的提议：第一笔按合同结算，新增运脚经核实后由各方分担。合作社可以先收回一部分本钱，船行也能给搬运工发工钱，但财政处需增加复核人员，补付款按既有支付批次办理。右派代表承认这比重签全部合同快，却要求明确今后不能把一次垫付当作永久先例。\n\n正说到先例，医院送来午餐菜单，米饭后面加了一句“数量视到货而定”。于树德请科长把菜单附在合同解释书后：“中央决定由谁先承担船脚，也请写明谁为这句话负责。”科长看了看自己的公文袋，忽然想起采购预备费其实还有一张空白调拨单。"
 ROC_ma_story.103.a:0 "照合同先供医院，附费留待商议"
