 ROC_ma_story.406.t:0 "新机旁的旧班"
 ROC_ma_story.406.d:0 "来年的检修、轮班和备件预算已经议定，工厂也按计划准备保养旧机床。一家设备商此时递来新机报价，称可由旧机改装，工时会减少。厂长带着报价来见陈赞贤：“这不改变检修计划，只是让计划有一个更好的结果。”班组长看过说明后问，改装期间谁操作、谁学习，报价单上却没有这两行。\n\n厂方承认新机未必省下全部人手，老工人熟悉的修理方法也可能不再适用。设备商答应派人讲解，但只负责机器交付时的示范，之后的培训由厂里自行安排。大同党左派工会要求明确岗位与工资，中派财政代表坚持已核定的备件款不能随便挪走；右派商户提醒，若培训迟迟不定，供应商也不能无限期保留报价。\n\n工人代表并不一概反对改装。有人怕失去岗位，也有人希望减轻长年摇机的负担；他们要求轮班学习时仍有收入，不能让工人自己承担停机的时间。厂方希望用现有维修班带新人，维修班长却指出，新机学习与旧机检修撞在同一周，两头同时开工，先前议好的保养就会落空。\n\n秘书发现设备商的报价附了一份“节省人工”说明，计算时把所有工人都算成已熟练操作新机，却没有算学习时数。设备商解释，培训完成后确实能达到那个数。班组长说：“那交货当天我们就算培训完成，机器也算已经会自己修了。”设备商没有生气，提出可延长讲解时间，但需另付师傅的食宿。\n\n陈赞贤请厂方、工会和财政处讨论经费与岗位承诺，原先议定的检修、轮班和备件继续照办。临走时厂长问部长是否支持新机器；部长请他把同样的问题问一遍下周值夜班的维修工，再把回答附在报价后面。厂长这次拿走的不只有报价单，还有一张空白培训计划。"
