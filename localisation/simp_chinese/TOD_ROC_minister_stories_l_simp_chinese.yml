 ROC_ma_story.302.t:0 "编号的解释权"
 ROC_ma_story.302.d:0 "“银钱有据”实施后，每笔拨款都有统一编号、经手人和验收日期。阮啸仙翻阅第一批新凭证时，发现编号都找得到，财政处却另发一张解释单：任何机关引用凭证，须先取得本处对编号的说明。秘书问：“若只是确认哪天发的钱呢？”科长说：“日期也是编号的一部分，当然需要解释。”\n\n工务员带来一项实际麻烦：一笔紧急石料运费的凭证完整，但他要查验收日期，先得等财政处复函，工地便不能安排下一次卸料。老会计承认统一编号使追款容易得多，却担心解释权集中后，原始记录虽在，外人仍看不见。大同党中派认为财政处最懂分类，可以减少互相矛盾的解释；左派的预算监督人员则要求把更正理由一并开放查阅。\n\n右派商户代表并不想让所有人随意改动凭证。承包商凭编号结算，若每个部门各说各话，银行会把日期当成争议，迟迟不肯兑票。他支持保留统一解释，却希望答复有期限。科长欣然同意：“我们一向及时处理，只是及时的定义，需要由我们及时研究。”秘书记下这句，请他也给“研究”编个号。\n\n正在争论时，办事员送来一份更正通知：验收日期原本误写了月份，编号未变，原记录和更正理由都已保存。财政处却只肯发出更正后的摘录，因为解释单没有规定谁能索取旧记录。阮啸仙问科长：“规定是为了让钱有据，还是让处长有机会解释为何别人看不见据？”科长答，公开原记录可能使读者对财政产生误解。\n\n部长请他将这种可能与工地等款的损失写进纪要。会末，科长建议成立说明小组，自己担任召集人；老会计表示可以，但每次说明须附原文。科长问，原文是否也需要解释。秘书把凭证递过去：“您先解释这一张，大家就知道要不要成立小组了。”"
