 ROC_ma_story.204.t:0 "亩产的脚注"
 ROC_ma_story.204.d:0 "试田已按水量、发芽和工时完成验证，农技员与农户确认的记录也送到了中央。宣传处却提前印好一张大布告：“亩产可增一倍。”下面的脚注极小，写着“在水量和劳力充足时”。晏阳初请处长把脚注念给所有人听，处长念到一半停住：“部长，字太小了。”\n\n大同党中派主张先沿用已印的布告，但要各县按现有记录另订推广办法；为了不让宣传口径和各地条件相撞，推广处还须依次重排讲解与会签，部长的下一段施政日程难免推迟。左派农会希望工时与水费和产量一样醒目，否则农户会把额外劳力误当作白送；右派商户则提醒，若一味强调成本，真正适合水条件的农户也可能不敢试。\n\n农技员拿出试田收成：一块田多用了水车，另一块因为种子受潮少出苗。两组数据都已测过，并非要重做试验。问题在于中央愿不愿意拨钱，让推广人员按不同条件解释结果，还是把讲解交由农户与技术员共同商定。财政处代表赞成准确，却提醒印刷费已经花过，重编讲义还会挤掉下月差旅预算。\n\n秘书请宣传处看一看布告背面，那是印刷厂留下的校样：大标题下原有一行与正文同样大的“水与工时须先核算”，后来被缩成脚注。处长不慌不忙地解释：“为了让百姓更容易看见我们的成果。”秘书问：“成果若离开条件还能成立，为什么需要试田？”处长说，当然需要，尤其需要一张能印上布告的试田。\n\n晏阳初将样张交回去：“数字可以宣传，条件也要让人看见。请各处商量谁负责讲清，别让农户替我们的省字费付水费。”处长应允再找印刷厂，随即问可否把部长的原话写成更短的标题。农技员说：“可以，叫‘水不是免费的’。”这一次，连财政处都认为应当用大字。"
