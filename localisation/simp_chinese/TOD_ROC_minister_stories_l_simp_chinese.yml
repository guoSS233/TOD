 ROC_ma_story.303.t:0 "完工与完账"
 ROC_ma_story.303.d:0 "决算已经过账，工程实物、承包款和欠薪分别列明，中央也确认了各方责任。财政处请阮啸仙签发一份“决算完成”的通报，承包行则送来一封感谢信，称工程结算“至此无遗留事项”。部长让秘书把欠薪附表放在信旁：“附表上还有人没拿到工钱，信是不是少了一页？”\n\n承包行代表说，欠薪数额并无争议，但尾款到手后还须支付材料商；若立即把全部余款先拨工资，下一处工程的石料信用就断了。工人代表同样有理：他们垫了两个月力气，不可能再用感谢信买米。大同党左派支持优先付工资，中派担心中央替承包行垫付会形成不易控制的先例，右派商户则要求明确以后付款的顺序。\n\n财政处建议先按已过账的决算继续办理，让承包行在限期内自筹欠薪；部长日程因此要等承包方回报。另拨周转经费可以先解决工人的急用，但会从别的预算中腾钱；安排工资与材料债权共同核对，能让双方都看见偿付顺序，却要求工人代表接受多一轮手续。\n\n秘书读出过账附件里的一项条款：承包行领取尾款须递交工资支付计划，而计划上只有“按财力逐步支付”。财政代表说，这六个字符合约定，因为约定没有规定逐步的步长。工人代表问，能否按同样办法交房租；承包行代表立刻回答，房东不会接受。秘书于是把这句也记进纪要，作为对支付计划的解释。\n\n阮啸仙没有退回已经完成的决算，而是要求各处拿出可执行的清偿次序，并注明预算由谁承担。承包行收回感谢信时问，可否只删掉“无遗留事项”；部长说可以，再加上工人能拿到钱的日期，这封信就有读者了。"
