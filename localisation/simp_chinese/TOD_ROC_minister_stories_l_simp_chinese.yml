 ROC_ma_story.205.t:0 "谁来讲第二遍"
 ROC_ma_story.205.d:0 "农技示范已经推广，第一批农技员和农户共同记录的发芽率、工时与收成陆续返回中央。推广处长据此向晏阳初请求增加编制：“第一遍讲清了，说明第二遍更应由我们讲。”农技员反问，既然记录是和农户一起做的，为什么下一轮讲解名单上没有他们？处长答：“名单是管理人员名单，听众当然不在上面。”\n\n县站送来的记录显示，同一办法在水足的地块有效，在缺水处需要调整；农户愿意继续记数，却担心报表只收好看的结果。大同党左派代表希望农技员带队并支付误工，保证参与的人能发言。中派代表担心技术员直接向中央报数，会绕开推广处既定的汇总程序；右派中的商户与乡村经营者愿意协办，但要求讲义不要把不同经营方式一概判为落后。\n\n财政处提出折中：由推广处继续按章分发讲义，各县自行安排后续答疑，不另增经费。这样现有示范可以继续，技术员却要等下一轮会签才能出门。若中央拨费让农技员直接带队，处里能更快拿到实际困难，也会分走推广处的人事和复核权限；若请乡村商社协办，讲解费用可由地方分担，但商社可能优先服务熟悉的客户。\n\n秘书拿出一份推广处准备寄出的讲义，最后一页写着“如有疑问，请咨询原讲解员”，而原讲解员的差旅申请刚被该处退回。处长解释：“我们鼓励提问，并未保证有人回答。”农户代表认真问：“那我该把问题寄到哪里？”处长说可以寄中央；秘书接道：“信送到之前，秧苗恐怕已经替我们回答了。”\n\n晏阳初请处长先讨论第二轮经费与报告权，不必为第一轮究竟算谁的成绩再排座次。处长提出让技术员保留头衔。农技员说头衔可以留下，只请把讲义最后一页改成真的能找到人；这次连处长也承认，空着的椅子不太适合做示范。"
