 ROC_ma_story.403.t:0 "厂门外的协定"
 ROC_ma_story.403.d:0 "工厂委员会已经签妥原料、质量、工资和交期的厂内协定，车间也依此排班。第二批铜料将到时，供应商送来一张新运输估期：因河道水浅，船可能晚两天。厂方希望委员会在原协定之外签补充安排，把延误直接记作“不可预见”，工会则问工人等料时的工资由谁承担。\n\n供应商并非厂内协定的签署方，他愿按合同运货，却不愿担保水位。工头说，缺料时仍可检修机器，但原计划的工资和交货日没有给这种调班留余地。大同党左派坚持工人不能为河水负责；中派建议先照现有协定运行，等运输日期明确再会签补充条款。右派商户代表提醒，要求小船行赔偿全部停工损失，会让它以后不敢接单。\n\n厂方代表提出由中央出面协调船行，尽早确定到货日期；这要额外动用人手，但能让车间先安排检修。工会提出厂方为等待工时提供保证，再与供应商另议分担。会计问保证金从哪里来，厂长答可以先借维修预算；班组长听后摇头：“维修预算都借给等料，等到料了拿什么修机器？”\n\n秘书读出厂方准备的补充条款：原料迟到时，交期相应顺延；工资“仍按既有办法处理”。工会代表问既有办法是哪一本，秘书找到三份，一份规定正常上工，一份规定机器停转，还有一份只写“另行协商”。厂长笑道：“正因办法很齐，我们才不必再写。”陈赞贤请他选一本，厂长却说还要看具体情况。\n\n部长没有要求重签已经生效的厂内协定，而是请各方把厂门外的运输风险和厂门内的工资责任接起来。散会时船行来电，水位已经上涨，能提前一天到。工会代表说这是好消息；秘书提醒，电话没有写明明天的水位，也不会替任何人发工资。"
