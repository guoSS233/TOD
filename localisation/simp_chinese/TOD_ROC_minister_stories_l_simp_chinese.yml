 ROC_ma_story.106.t:0 "村口的回执"
 ROC_ma_story.106.d:0 "于树德推动的年终结算已经到村口：无争议款项照名单发放，争议款另列，不再挡住整批账。中央会议上，财政处长郑重宣布这一成绩，并请部长批准把“发放完毕”印进总结。秘书问：“能否加上‘按名单’三个字？”处长欣然同意，直到她递来另一张名单：几位社员因为外出运货，款已送到村口，却还没有本人回执。\n\n合作社账房说，款并未丢失，钱暂由经办人保管；只是仓里肥料等着结款，社员也要拿现钱备种，不能无限期等人回来。财政处担心托领后再有人持旧凭证来讨，右派商户则担心中央为追求速度，要求商社替所有人担保。双方都承认已发出的款有效，争的是未领款项怎样在不撤回成果的情况下交到本人手中。\n\n大同党左派代表建议由合作社经办、农会见证，允许受托人凭据领款；中派代表宁愿增加财政人员，逐户核验后直接交付。“直达当然好，”账房说，“可我们的船已经到村口，您的核验员还在等差旅费。”财政处长答：“请放心，差旅费归差旅费，发款归发款。”\n\n于树德请秘书念出报告最后一段：中央财政处既声明不接管合作社发放，又要求所有回执先送本处批准。处长解释，这是为了统一保存凭据。秘书问：“存档必须在领款之前吗？”他想了想说：“从档案安全讲，是的。”门外等待的运货社员听见这句，向账房借了笔，准备先给自己的回执写一份保管申请。\n\n于树德让人把总结改成“已到村口，继续核实领取”，又请各方说清谁能经办、谁来见证，以及下一批凭据的费用从何处出。处长犹豫了一会儿，终于收回原先那份写着全部完毕的贺词：“部长，看来这次我们至少可以庆祝钱真的到了。”"
 ROC_ma_story.106.a:0 "照名单继续发，未领款留凭据"
