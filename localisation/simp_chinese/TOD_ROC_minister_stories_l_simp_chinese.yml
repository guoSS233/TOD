 ROC_ma_story.503.t:0 "贷款的第二道门"
 ROC_ma_story.503.d:0 "按实耕面积办理的小农信贷已经推行，第一批借款人按新办法领到了农具款。中央部务会收到下一批申请时，银行要求把最终审批集中到本行：农务人员负责证明耕作，坏账却由银行承担，因此放款条件应由出钱的人解释。萧铮问：“解释能不能改变已经公布的申请资格？”银行代表答：“我们只解释风险，不解释资格。”\n\n农务厅拿出两份申请：耕作面积都经核实，一户有合作社担保，另一户愿以收成分期偿还。银行认为前者更容易追偿，后者若遇旱灾就须展期。农务人员并不否认风险，却担心银行借解释之名，把有地契的人排在前面。大同党右派中的小农代表支持继续按实耕办理，另一位商界代表则警告，不能要求银行承担损失，却不给它审查还款能力的权利。\n\n左派代表建议公开拒贷理由，让农户知道差在哪里；中派提出农务核亩、银行核还款，再由中央共同复核争议。银行经理担心三方轮流审阅会赶不上春耕，农务厅同样不愿把自己的核查变成银行决定后的装饰。秘书提醒，若每一处都称自己只负责解释，申请人收到的可能是一封很长的信，却不知道该去哪里补材料。\n\n会议中途，银行送来已获贷款的一户还款记录：第一期按约偿还，但收成日期与银行催款日相差半月。经理愿调整日期；农务人员提出牵头复核被拒申请，仍由银行审查还款能力。经理说耕作记录须先由银行确认。秘书念了一遍农务厅出具记录的手续，经理表示确认仍是必要的。\n\n萧铮请双方保留已办理的贷款和申请资格，再商议审核、复核与答复期限。散会前，小农代表问谁负责告诉借款人结果。秘书说名单上写着两处负责通知；代表松了口气，直到她补充：“两处都在等对方先发第一封信。”"
