 ROC_ma_story.201.t:0 "调查不是判决"
 ROC_ma_story.201.d:0 "下乡问田结束后，调查员将田界、租约与水源的口述和实地记录送回中央，供各方复查。晏阳初还没来得及脱下沾泥的鞋，秘书便递来一份大同党左派拟好的宣传单：“调查证明，所有旧租约都有问题。”他又收到右派的函，要求把同一份调查作为旧契有效的证明。两边拿的是同一本册子，结论却像在两个省种出来的。\n\n调查员解释，记录中有佃户提供的水费收据，也有地主代理人出示的租契；有些田界经过双方确认，另一些还留着异议。把它们当正式裁决，会让尚未解决的争端失去复核机会。财政处代表却看见另一种用途：“既然已调查，今后各处要引用，最好先经本处审核，以免出现数字不统一。”\n\n农会代表担忧，审核权交给财政处，耕作者想看自己的记录也得等一纸批复。商户代表不反对公开调查，但有人正在用个别租约推断整个地区的信用状况，若未经辨别便登报，小农反而更难借到钱。中派代表听完，提议将记录全部收存，待统一解释写好再给各方；秘书提醒，写解释的人若不能商定，这个“待”就没有期限。\n\n晏阳初请调查员举一个例子。她讲到一条被洪水改道的渠：村民按新水路分摊修渠费，旧契却仍按老沟线写租额。旧契存在，新水路也存在；调查只能证明两件事，不能替人决定第三件。财政代表立即说：“那我们不妨规定，只引用能证明一件事的材料。”秘书递上一支笔，请他先把洪水划到契约之外。\n\n部长决定让会议讨论记录的使用权、复核人手与公布范围，而非重新下乡证明调查做过。临散会，左派代表收回宣传单，右派代表也改了函稿；财政代表留下，询问是否可以先成立一个材料解释处。晏阳初答应把他的建议记下来，也请他带来解释处的预算。"
