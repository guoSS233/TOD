 SRC_inner_circle_category:0 "中央军事委员会"
 SRC_inner_circle_category_desc:0 "东北革命大会后，可从八名陆军干部中任命两人，并分别任命一名海军和空军干部进入中央军事委员会。成员提供常驻加成，并定期主持专属工作。"
 SRC_inner_circle_appoint_xu:0 "任命徐向前"
 SRC_inner_circle_appoint_xu_desc:0 "任命徐向前进入中央军事委员会，推动政委制。须先完成§Y提拔革命将领§!。消耗50政治点数。"
 SRC_inner_circle_appoint_lan:0 "任命蓝天蔚"
 SRC_inner_circle_appoint_lan_desc:0 "任命蓝天蔚进入中央军事委员会，推动军事一长制。消耗50政治点数。"
 SRC_inner_circle_appoint_guan:0 "任命关向应"
 SRC_inner_circle_appoint_guan_desc:0 "任命关向应进入中央军事委员会，推动士兵委员会。消耗50政治点数。"
 SRC_inner_circle_appoint_dong:0 "任命董振堂"
 SRC_inner_circle_appoint_dong_desc:0 "任命董振堂进入中央军事委员会，推动政委制。消耗50政治点数。"
 SRC_inner_circle_appoint_zhao:0 "任命赵尚志"
 SRC_inner_circle_appoint_zhao_desc:0 "任命赵尚志进入中央军事委员会，推动军事一长制。消耗50政治点数。"
 SRC_inner_circle_appoint_yang:0 "任命杨靖宇"
 SRC_inner_circle_appoint_yang_desc:0 "任命杨靖宇进入中央军事委员会，推动士兵委员会。须先完成§Y提拔革命将领§!。消耗50政治点数。"
 SRC_inner_circle_appoint_xu_fanting:0 "任命续范亭"
 SRC_inner_circle_appoint_xu_fanting_desc:0 "任命续范亭进入中央军事委员会的陆军席位，推动军事改革。消耗50政治点数。"
 SRC_inner_circle_appoint_he_changgong:0 "任命何长工"
 SRC_inner_circle_appoint_he_changgong_desc:0 "任命何长工进入中央军事委员会的陆军席位，推动军事改革。消耗50政治点数。"
 SRC_inner_circle_appoint_zeng_yiding:0 "任命曾以鼎"
 SRC_inner_circle_appoint_zeng_yiding_desc:0 "任命曾以鼎进入中央军事委员会的海军席位。消耗50政治点数。"
 SRC_inner_circle_appoint_liu_yun:0 "任命刘云"
 SRC_inner_circle_appoint_liu_yun_desc:0 "任命刘云进入中央军事委员会的空军席位。消耗50政治点数。"
 SRC_inner_circle_xu:0 "中央军事委员会：政委制"
 SRC_inner_circle_xu_desc:0 "徐向前负责把政治工作与基层组织嵌入红军。"
 SRC_inner_circle_lan:0 "中央军事委员会：军事一长制"
 SRC_inner_circle_lan_desc:0 "蓝天蔚强调清晰统一的指挥链与职业军官训练。"
 SRC_inner_circle_guan:0 "中央军事委员会：士兵委员会"
 SRC_inner_circle_guan_desc:0 "关向应倡导士兵参与军队管理与战地讨论。"
 SRC_inner_circle_dong:0 "中央军事委员会：政委制"
 SRC_inner_circle_dong_desc:0 "董振堂负责巩固部队的政治工作与纪律。"
 SRC_inner_circle_zhao:0 "中央军事委员会：军事一长制"
 SRC_inner_circle_zhao_desc:0 "赵尚志推动统一的军事指挥与作战训练。"
 SRC_inner_circle_yang:0 "中央军事委员会：士兵委员会"
 SRC_inner_circle_yang_desc:0 "杨靖宇组织士兵参与部队建设与基层动员。"
 SRC_inner_circle_xu_fanting:0 "中央军事委员会：军事改革"
 SRC_inner_circle_xu_fanting_desc:0 "续范亭推动部队整训与基层军事改革。"
 SRC_inner_circle_he_changgong:0 "中央军事委员会：军事改革"
 SRC_inner_circle_he_changgong_desc:0 "何长工推进军官培养与作战组织改革。"
 SRC_inner_circle_zeng_yiding:0 "中央军事委员会：海军建设"
 SRC_inner_circle_zeng_yiding_desc:0 "曾以鼎负责海军训练与舰队组织。"
 SRC_inner_circle_liu_yun:0 "中央军事委员会：空军建设"
 SRC_inner_circle_liu_yun_desc:0 "刘云负责空军训练与作战协调。"
 SRC_inner_circle.1.t:0 "调整中央军事委员会"
 SRC_inner_circle.1.d:0 "中央军事委员会的两席陆军席位均已有人选。新任命的干部将接替哪一席？被替换者的中央军事委员会加成将终止。"
 SRC_inner_circle.1.a:0 "替换第一席"
 SRC_inner_circle.1.b:0 "替换第二席"
