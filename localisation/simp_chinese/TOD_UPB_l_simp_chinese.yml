### 四方王国流程事件 ###
TOD_UPB.1.t:0 "国王与内阁发生重大分歧"
TOD_UPB.1.d:0 "年轻的萨帕·印卡·图帕克·阿马鲁六世自继位以来，便对四方王国根深蒂固的“传统公社”制度，也就是艾柳制，心怀不满。在他看来，这种以血缘地缘为纽带的集体耕作、平均分配模式，虽维系了四方遗风，却严重束缚了农业生产力，使王国始终无法像南道山那样实现农产品商品化。\n\n今日，国王在央城王宫召集内阁全体会议，突然宣布两项重大决定：废除艾柳公社的土地集体所有权，将土地分割为家庭私有农场，允许自由买卖、抵押，并引入南道山资本进行现代化改造；逐步收回三个苏尤的自治权，由中央直接任命行政长官，取消当地贵族传统的司法和税收特权。\n\n“四方必须走出古代的阴影。”国王在会议上如此宣称。然而，内阁迅速分裂。以首相为首的传统贵族派强烈反对，认为此举将摧毁印加文明的根基，引发全国性的叛乱，而部分年轻大臣则支持国王。双方争执不下，最终国王拂袖而去，留下一道谕令：“改革势在必行，诸位自决。”"
TOD_UPB.1.a:0 "这位年轻的国王在想什么呢？"
TOD_UPB.2.t:0 "国王的权力"
TOD_UPB.2.d:0 "自5月2日“改革宣言”以来，四方王国的朝堂便陷入僵局。以首相为首的传统贵族派内阁，虽未公开抗命，却以研究、协调、咨询传统领袖等各种名义拖延执行国王的艾柳解体指令。一个多月过去，改革试点毫无进展。萨帕·印卡·图帕克·阿马鲁六世耐心耗尽。\n\n今日清晨，国王在库斯科王宫正式签署诏书：当内阁与君主就国家重大事务产生不可调和的分歧，且内阁行为明显阻碍国家发展时，君主有权解散内阁，重新任命。诏书随即送达内阁会议厅。首相带领全体大臣入宫请愿，试图说服国王收回成命。国王拒绝接见，只通过宫廷大管家传达口谕：“改革不能再等。诸位大臣可体面辞职，或由诏书解职。”\n\n下午三时，内阁正式解散。国王任命临时国务会议接管各部事务，并宣布三个月内重新组阁。"
TOD_UPB.2.a:0 "萨帕·印卡·图帕克·阿马鲁六世万岁！"
TOD_UPB.3.t:0 "哥伦比亚炮击厄瓜多尔地区"
TOD_UPB.3.d:0 "自1940年2月14日哥巴联军对南华自由邦宣战以来，南美大陆的局势急剧升温。泛道山联盟虽未正式参战，但通过派遣军事顾问、提供武器装备等方式向南华自由邦提供支持。这种灰色地带介入使大哥伦比亚深感威胁。\n\n波哥大方面认为必须将战争范围限定在埃塞奎博地区，不能任由四方王国在背后从容完成动员。于是，1940年3月2日凌晨，大哥伦比亚炮兵部队越过边境，向四方王国南部边境城镇昆卡地区进行猛烈炮击。炮弹划破夜空，在黎明前的黑暗中炸开成片火光。昆卡郊外的边防哨所首当其冲，紧接着是通往厄瓜多尔省会方向的公路与通讯设施。\n\n据不完全统计，炮击造成数十名四方王国军民伤亡。据四方王国知情人士透露，消息传至央城王宫时，萨帕·印卡·图帕克·阿马鲁六世正在与大臣们讨论边境增兵计划。"
TOD_UPB.3.a:0 "是可忍，孰不可忍？"

### 四方王国国家精神 ###
UPB_backward_reform:0 "回首改革"
UPB_backward_reform_desc:0 "四方王国的改革长期停留在回望传统与修补旧制之间，难以真正突破艾柳制与地方贵族自治的束缚。"
UPB_emerging_reform:0 "新兴改革"
UPB_emerging_reform_desc:0 "国王已经公开宣告改革方向。土地私有化、现代化农业和中央集权将成为四方王国新的政治议题。"
UPB_questioned_king:0 "饱受质疑的国王"
UPB_questioned_king_desc:0 "年轻的萨帕·印卡拥有王冠，却尚未完全拥有朝堂与地方贵族的信任。"
### 泛道山协约通知 ###
TOD_UPB.100.t:0 "泛道山协约"
TOD_UPB.100.d:0 "南道山煌原共和国、四方王国与巴拉圭联合王国已经正式签署《泛道山协约》。从今日起，三国将以共同防务、外交协调与军事合作为基础，组成泛道山世界的正式联盟。"
TOD_UPB.100.a:0 "胜利者的联盟"