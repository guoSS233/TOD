 ROC_econ_term_review:0 "本届施政审议"
 ROC_econ_term_review_desc:0 "第三年收官前，财政处得把本届的账、履职的差额和没兑现的承诺逐笔核清。对账归对账，工程修到哪一步仍照实测算，不靠纸面上多写几笔过关。"
 ROC_econ_review_available_tt:0 "本届已进入收官阶段，尚未进行施政审议，且当前没有其他施政项目在办。"
 ROC_econ_help_center_tt:0 "大同党中派好感+1。"
