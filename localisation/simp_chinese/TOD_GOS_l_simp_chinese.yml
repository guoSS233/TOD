GOS_focus.2.t: "应天临时中央政府正式接管七省政务"
GOS_focus.2.d: "抵达应天后，皇帝久久不能平静。父亲的遇刺，爷爷的逝世，叔叔的背叛还历历在目，但他来不及完成先帝的祭典，更来不及为牺牲的忠臣和士兵哀悼，皇帝立即开始整合新的中央政府。所幸，乱党和叛匪在江南实力薄弱，中央很快便对七省全境进行了实际控制。\n即使皇帝及中央尽力稳定局势，陆军也在整顿训练，各省仍人心惶惶，地方局势仍不十分明朗。"
GOS_focus.2.a: "王师北定中原日，家祭无忘告乃翁！"
GOS_focus.1.t: "粤逆北犯"
GOS_focus.1.d: "据湘赣浙三省军政要员呈报，粤逆伪政权近日发布“檄文”，公然宣称北犯意图，其所属部队已悍然越境进犯，向我边防部队发起军事挑衅。目前与粤逆接壤之区域均已进入战时管制状态，但前线现有部署已显捉襟见肘，难以有效遏制敌方全面攻势。当务之急，应即刻统筹各省兵力，实施战略反制，以雷霆之势挫败南方逆党之侵略图谋，进而伺机剿灭粤逆。\n"
GOS_focus.1.a: "防守反击！"
GOS_focus.3.t: "联合大同党右派"
GOS_focus.3.d: "大同党在七省内，尤其是赣南，湘南，颇有势力。与割据华南的大同党左派不同，以长江局为首的右派暂时并未反对政府，我们可以“以同治同”，制衡所谓“共和军”。\n为加强与大同党右派的联系和利用，皇帝任命大同党右派领导人物胡厥文为经济部长。胡厥文一直在大同党拥有较大影响力。此次任命或许能动摇叛匪的决心，使其内部分裂，而大同会右派的参与也会深刻地改变临时政府的政局和经济政策。"
GOS_focus.3.a: "王者不却众庶，故能明其德。"
GOS_focus.4.t: "《动员戡乱时期临时条款》通过"
GOS_focus.4.d: "自先帝驾崩已过去四个月，现在一心会乱党造反，大同党和同产工会逆民起事，为应对此“危急存亡之秋”。皇帝决定制定《临时条款》（地位高于宪法），以在特殊时期缩减程序，快速反应，加快军政效率。\n同时，为了让临时政府在七省站稳脚跟，争取更广泛的支持。皇帝决定邀请社会贤达人士，和军政要员参加谘议局，以集中民智，反映民意。"
GOS_focus.4.a: "法与时转则治，法与世宜则有功。"
GOS_focus.5.t: "应天内阁完成组阁"
GOS_focus.5.d: "新的中央谘议局刚建成，内阁人选的提名和各派系的内部会议就紧锣密鼓地开始了。皇帝与张静江、萧耀南、胡厥文等各派系的代表人物也私下进行了会见。在充分协调各方意见，平衡各方力量后，确定了内阁的内定人选。在一场“协商好了”的选举后，原内定人员顺利成为了真正的内阁成员。\n内阁作为皇帝的左膀右臂，将为皇帝分担政务，出谋划策，扶大厦之将倾，挽狂澜于既倒。"
GOS_focus.5.a: "今政务繁多，非内阁莫能助朕也。"
GOS_focus.6.t: "张静江大展手脚"
GOS_focus.6.d: "张静江作为管学系的应天话事人，七省联合政府的建立者之一，应天内阁的新首辅，是皇帝在政治上最为倚重的人物。张静江支持皇帝的自由主义经济政策，和扩大人民政治权利的政治思想，是兴宪皇帝天然的政治盟友。\n兴宪皇帝虽然自身经验不足，但懂得用人之术，他将许多权力下放内阁，仅在重要问题上做出决策，并制定指导方针；而张静江一丝不苟地履行皇帝的意志，凭借他老练的政治手段和交错复杂的关系网，将国家治理得有条不紊。"
GOS_focus.6.a: "叹诸葛亮兴汉失败，望张静江复明成功。"
GOS_focus.7.t: "七省经济恢复"
GOS_focus.7.d: "尽管在战争状态中，七省经济一度再次进入低谷，但在由内阁领导的政府的努力下，七省经济快速恢复，为统一大业奠定了坚实的基础。\n江南物产丰饶，人民勤劳，在自由放任的政策下，市场活力不断增强。同时，皇帝选贤与能，放政于内阁，内阁成员恪尽职守，得到工商各业人士广泛拥护。"
GOS_focus.7.a: "何必劳神苦思，代下司职，役聪明之耳目，亏无为之大道哉？"
GOS_focus.8.t: "民生是战后重建的重点问题"
GOS_focus.8.d: " 自从兴宪皇帝抵宁以来，实行自由民主的制度，大力恢复经济，向南剿灭反对君主制的逆匪，向北征讨篡位的叛贼朱榕坤，并使关中的西北都督府归附，百姓无不箪食壶浆以迎王师，各地割据势力也纷纷表示臣服。\n现今天下大势已定，虽然华夏一统，重振大明的胜利曙光就在眼前，但是持久的高烈度总体战使百姓朝不保夕，流离失所，处于水深火热之中。我们应在加紧统一全国，令诸藩亲服的同时，适度削减军费占比，救济灾民，以安定社会。"
GOS_focus.8.a: "载舟覆舟，所宜深慎。"
GOS_focus.9.t: "以新民主造新大明"
GOS_focus.9.d: "自秦一统六国以来，皇帝一直拥有着至高无上的大权。时代车轮滚滚向前，天命也并非亘古不变。在我朝，皇帝专制制度早已体现出种种弊端。顺天者昌，逆天者亡。兴宪皇帝体察社会民情，不顾重重阻拦，提倡自由民主，以保全大明。\n戡乱时期即将结束， 皇帝决定趁此天下大定之良机，推行代议制，让各地选民选出地方谘议院议员，层层向上，最终选出全国谘议院议员。全国谘议院将成为最高权力机关，掌管行政，军事，司法权力。"
GOS_focus.9.a: "上有天命攸归之德，下效周召共和之事。"
GOS_focus.10.t: "圣贤天子、垂拱而治"
GOS_focus.10.d: "在数月准备和高度紧张的交接后，权力平稳地过渡到了谘议院手中，全国上下无处不在欢呼真正民主的到来。皇帝虽仍是名义上的国家元首，掌握大理寺，枢密院，内阁等国家机关的最高决策权，任命权，但他宣布除非大明受到严重威胁，皇帝将不会使用这些权力干涉政局。\n为表示彻底让渡权力的决心，避免专制复辟。皇帝及家眷搬至顺天西郊的皇家园林居住，将原皇城留作各中央机构办公及公众游览之用。自此，两千多年的皇帝专制历史彻底结束了。"
GOS_focus.10.a: "跳出朝堂外，不在是非中。"
GOS_focus.999.t: "应天政府要求我们臣服"
GOS_focus.999.d: "随着应天政府重回华北之后，应天政府开始要求各地归附。但尽管应天政府如今风头正盛，但他们的那个皇帝被废前的所作所为让各地可是印象深刻，我们对他本人充满怀疑，尤其是军队方面。"
GOS_focus.999.a: "算了，无可奈何"
GOS_focus.999.b: "呸，无德之人"
GOS_focus.11.t:0 "口中食"
GOS_focus.11.d:0 "应天城南，夫子庙旁的米市，这几日的气氛便如那秦淮河上的阴云，沉闷得让人喘不过气。自打顺变惊变后，粮价便如脱缰的野马，一日三变。米铺掌柜老王头，每日开张都心惊肉跳，生怕一夜之间，手里的存粮就化成了废纸，或是成了百姓口中“囤积居奇”的罪证。\n“王掌柜，今日米价咋样啊？”来者是街坊张大妈，提着空空如也的米袋，脸上满是愁容。\n王掌柜长叹一声，正欲开口，忽闻街口传来一阵铜锣响。只见几名身着新制服的官员，正在张贴一张黄纸布告。人群迅速围拢过去，但听一位先生高声念道：\n“奉七省联合政府令：为安民心，稳市价，即日起由江南银行发行‘安民券’，凡持券者可按官定之价，专门兑换米粮布匹各种生活用品。各商户须明码标价，不得擅自浮动，违者以通敌论处，严惩不贷！”\n布告一出，人群中先是片刻死寂，继而爆发出嗡嗡的议论声。王掌柜挤进去一看，只见布告上白纸黑字，不但书写了安民卷各种用途，还将龙元与安民卷的兑率亦标得清清楚楚。他悬了半月的心，终于“咯噔”一下，落回了肚里。再看张大妈，脸上愁云已散，怕是也正盘算着去银行换几张“安民券”。\n午后，阳光穿透云层，洒在秦淮河上，波光粼粼。米市的人流恢复了往日的秩序，虽仍有忧色，却不再是那末日将至的恐慌。王掌柜坐在柜台后，拨着算盘，心中暗道："
GOS_focus.11.a:0 "这世道，总算还有个能主事的人。"
GOS_focus.12.t:0 "七省联合政府颁布《紧急经济动员法案》"
GOS_focus.12.d:0 "今日，七省联合政府正式颁布《紧急经济动员法案》，宣告管辖境内所有省份即刻进入战时经济状态，以应对北方逆党所带来的严峻挑战。此举标志着南方的经济重心将从民生恢复全面转向军事生产。\n政府首脑张静江在公告中严正指出：“北方逆党窃据神器，倒行逆施，国祚悬于一线。我等非为苟且偏安，实为光复北望。为毕此全功，吾辈唯有万众一心，整合南七省之人力物力，以举国之力，方可克定祸乱。”\n法案规定，即日起，政府将对钢铁、化工、机械制造等关键产业实行全面统制，所有生产计划须服从于“七省联合军事委员会”的统一调配。大量的民用工厂将被要求在限期内完成改造，以满足战争需求。昔日织造锦绣绸缎之纺纱厂，今奉命转产军用帆布与绷带；生产摩登家具之木工作坊，则须改造以制造枪托与弹药箱。\n此法案一经公布，立刻在社会各界引起强烈反响。以江浙财团为首的工商界领袖纷纷通电响应。上海总商会会长公开表示：“皮之不存，毛将焉附？值此国难，吾辈商贾自当毁家纾难，全力支持政府北伐大业。”《金陵时报》等主流报章亦发表社论，称此乃“以短期阵痛换取长治久安”之必要之举，号召全体国民共赴国难，为最终的胜利贡献自己的力量。\n自此，南国的经济引擎已然转向，庞大的民用工业机器正被重塑为一架战争机器，其轰鸣声预示着一场国家命运的战争，已然无可避免。"
GOS_focus.12.a:0 "一切为了光复河山！"
GOS_focus.13.t:0 "新居"
GOS_focus.13.d:0 "难民营，曾是李根生一家五口的噩梦。从皖北一路逃难至应天，他们栖身于清凉山脚下用油布和破木板搭成的窝棚里，每日唯一的指望，就是那碗能照出人影的稀粥。\n半月前，营地里来了政府的干事，他们带来的不是施舍，而是一份招工启事。政府要修缮城墙，疏浚内秦淮河，急需人手。凡愿出工者，每日管两顿干饭，工程结束，可凭工分优先分得在清凉山附近新建的“保障住房”。\n“自己动手，挣个家回来！”这句朴素的口号，点燃了李根生麻木的心。他第一个报了名，成了筑城队的一员。\n一个月后，当李根生领到那把刻着编号的钥匙，打开“保障住房”——一排排整齐的二层板房中的一间时，他的手都在颤抖。房子不大，却是木结构，有窗有门，能遮风挡雨。妻子在屋里抹着眼泪，孩子们则在新床上兴奋地打滚。\n屋外，昔日的难地友邻们，如今都成了街坊。晚饭时分，家家户户飘出饭菜的香气。李根生坐在门口，看着不远处还在施工的工地，虽浑身酸痛，心中却无比踏实。这间屋，是他一锤一铲，亲手为家人挣回来的安稳。"
GOS_focus.13.a:0 "睡着踏实"
GOS_focus.14.t:0 "雄舰"
GOS_focus.14.d:0 "江阴，要塞炮台下的江南造船厂，呈现出一派热火朝天的景象。在新建成的二号船坞里，一座巨大的钢铁骨架正在成形。\n船坞四周，巨大的吊臂如钢铁巨人之臂，将一块块厚重的钢板精准地吊运至船台。数以千计的工人，在工程师的指挥下，进行着切割、焊接、铆接。飞溅的焊花，如同黑夜中的星辰，点亮了工人们布满汗水的脸庞。铆钉枪的“哒哒”声，与长江的涛声，汇成了一曲激昂的交响。\n总工程师郑清廉，正拿着图纸，与几位年轻的技术员激烈地讨论着锅炉的安放位置。他推了推老花镜，指着图纸上的一个细节，不容置疑地说道：“此处的管线布局必须优化！此乃战舰之命脉，分毫差错不得！我们要造的，不是只能在内河里摆样子的铁壳船，而是能去大海之上，与逆党舰队一较高下的真正利剑！”\n夕阳西下，将整座船坞染成一片金红。那巨大的钢铁龙骨，在晚霞的映衬下，宛如一条蓄势待发的巨龙脊梁，静静地伏在长江之畔。"
GOS_focus.14.a:0 "轰鸣钢铁"
GOS_focus.15.t:0 "海上生命线"
GOS_focus.15.d:0 "今日，七省联合政府于应天咨议院，向中外庄严宣告《海洋生命线宣言》。宣言直指北方锦逆封锁陆路之危局，强调广阔海洋将是维系南方经济、并最终实现国家光复的战略命脉。\n首脑张静江慷慨陈词：“锦王之流，不过据有形之陆路，而我等，则拥无垠之海洋。长江东去，百川归海，此天意昭昭，示我以生路。故今日我等宣告，凡我七省治下之港口、航运、船坞，皆为国家之资产，须统一调度，戮力同心，以保我海上运输之畅通！”\n据本报记者了解，联合政府已紧急向江南、福州等各大造船厂下达了一批新式运输船的订单，并成立了“联合航运护航司令部”，旨在协调海军与商船队，保护自南洋至东瀛的黄金航道。此举获得了江浙财团及海外华商的热烈响应，上海招商局、宁波虞洽卿等航运巨头已率先承诺，将旗下船只优先用于运输政府指定的战略物资。\n为贯彻宣言，联合政府已向江南、福州各大船厂下达首批新式运输船订单，并组建“联合航运护航司令部”，以协调海军与商船队，确保自南洋至东瀛的黄金航道安全。此举获得江浙财团及海外华商热烈响应，上海招商局、宁波虞洽卿等航源巨头已率先承诺，将旗下船只优先用于转运战略物资。\n此宣言极大提振了南方民心士气，亦引起国际社会高度关注。一位不愿透露姓名的法国外交官向本报表示：“无论谁控制了长江口，他都将是这片土地上不可忽视的力量。”"
GOS_focus.15.a:0 "千帆竞过"
GOS_focus.16.t:0 "生计"
GOS_focus.16.d:0 "王秀英是鄂北国棉七厂的一名挡车女工。自从时局动荡，厂子接到军令，不再生产柔软的细棉布，转而织造厚重粗糙的军用帆布后，她的工作时间更长了，机器的轰鸣也仿佛要将人的骨头震散。每天下工，拖着疲惫的身躯回到家里，最让她揪心的，就是日渐消瘦的丈夫和一双儿女。\n战争，对她这样的普通人家来说，最直接的感受便是物价飞涨。米缸见底的速度越来越快，丈夫微薄的薪水，在黑市商人贪婪的目光中，也换不来几样东西。\n然而，这个星期，情况似乎有了变化。\n发薪日，除了钱款，管事还给每个工人发了一本小册子，上面印着“国民生活配给证”。管事说，这是联合政府的新章程，凡在军工厂做工的，凭此证每月可按平价购买定量的米、面、油、盐，甚至还有几尺布。\n王秀英半信半疑，揣着册子来到指定的食品供应部。当她真的用低廉的价格，将沉甸甸的米袋和一小罐清亮的菜籽油领到手中时，眼眶一热，泪水差点涌了出来。这不再是遥不可及的奢侈，而是握在手中的安稳。\n晚上，一家人围着饭桌，吃上了久违的干饭。丈夫一边扒着饭，一边感慨：“政府还记挂着我们这些老百姓，这日子，就有盼头。你在厂里好好做，多织一尺布，前方的兄弟们就多一分力气。”\n王秀英点点头，她不懂什么国家大义，但她知道，这本小小的配给证，让她和她的家，与这场遥远的战争，紧紧地联系在了一起。它不仅保证了自家的生计，更如一双温暖的手，抚平了她心中对于未来的惶恐。"
GOS_focus.16.a:0 "一饭一粟，皆是国本。"
GOS_focus.17.t:0 "黑色洪流"
GOS_focus.17.d:0 "当战争的阴影笼罩神州，一条无形的战线，已在赣西的崇山峻岭中悄然开辟。这里，是七省工业的“衣食”所系——萍乡煤矿。自联合政府颁布《资源自给紧急条例》以来，这座拥有数十年历史的煤都，正爆发出前所未有的能量。\n记者在安源矿区看到，原本部分停产的旧矿井已被重新加固并投入使用，无数新的矿道正向着地底深处延伸。铁路线上，新铺设的枕木还散发着桐油的气味，满载“乌金”的列车昼夜不息，形成一股黑色的洪流，奔涌向全国各地的钢铁厂与兵工厂。\n从萍乡到大冶，从水口山到德兴铜矿，一场轰轰烈烈的资源开采运动正在南国大地全面展开。它或许没有正面战场那般惊天动地，却以同样坚韧不拔的意志，筑起最坚实的基石。"
GOS_focus.17.a:0 "炉火不熄，则国祚不坠。"
GOS_focus.18.t:0 "甲兵"
GOS_focus.18.d:0 "哈瓦斯通讯社\n应天电\n今日，应天七省联合政府正式颁布了《国防工业紧急法案》，一份被国际观察家普遍认为将深刻重塑远东地区力量格局的纲领性文件。该法案以空前强硬的姿态，宣告国家权力将对经济运行进行全面干预和主导，其核心目标只有一个：将政府辖区内的整个工业体系进行系统性重组，使其转变为一台纯粹内战服务的高效战争机器。\n根据法案文本，政府将设立一个名为“战时工业委员会”的强力机构。该委员会被授予了几乎不受限制的权力，包括但不限于征用现有民用企业、强制其转产军事物资，以及规划和建设新的军工设施。从纺织厂到精密机械作坊，大量私营和公营企业将被纳入国家统一的战时生产计划之中，接受统一调配。为确保转型顺利，法案承诺将提供巨额的财政补贴和先进的技术支持，以克服转型过程中的技术壁垒和资金短缺问题。其短期目标极为明确：迅速提升步枪、火炮、弹药等基础装备的产能，并为重型武器的增产奠定基础。"
GOS_focus.18.a:0 "远东的政治版图上，战争的阴云正变得前所未有的浓厚"
GOS_focus.19.t:0 "后浪"
GOS_focus.19.d:0 "厂里的老人儿都说，王师傅的耳朵是厂里最准的量具。一台机器哪个零件松了，哪个轴承该上油了，他光听声响就能辨出个八九不离十。几十年来，厂里的生产线就靠着他和一群老师傅们的手艺维持着。那是一种充满了油污、汗水与金铁交鸣的旧日喧嚣，虽显杂乱，却也自有一套沿袭已久的章法。\n然而，这份章法，在从应天大学学成归来的少东家，如今的厂长助理陈子轩眼中，却成了效率低下的同义词。他带回了江南最新的流水线作业图纸，主张对整个生产流程进行彻底革命。但他的提议，在老师傅们的疑虑与财务账房的白眼中，被束之高阁。\n转机，随着一纸来自应天的公文而来。\n政府颁布了《战时工业技术升级条例》，鼓励各厂引进新技术，并承诺提供大笔低息贷款与技术支持。陈子轩的图纸，终于得以从抽屉中重见天日。\n起初，厂里怨声载道。老师傅们习惯了从头到尾包办一支枪的制造，如今却被要求日复一日地重复拧紧同一颗螺丝的枯燥工序。他们抱怨新机器“娇贵”，不如手里的老伙计皮实。王师傅更是整日黑着脸，在车间里踱步，仿佛在审视一个不肖的闯入者。\n直到第一个月底盘点。\n当账房先生用颤抖的声音报出当月的步枪产量——几乎是旧生产线的三倍，且次品率不足旧时的一半时，整个车间陷入了死寂。王师傅默默地从生产线末端拿起一支崭新的步枪，拉动枪栓，机件滑动的声音清脆而顺畅，严丝合缝。他抚摸着光滑的枪身，那不再是他亲手打磨的、带有个人印记的作品，而是一件冰冷、精准、无可挑剔的完美杀器。\n他走到正记录着数据的陈子轩身边，沉默了半晌，才从牙缝里挤出一句话：“小陈，这机器……明天，教教我怎么用呗。”\n窗外，夕阳正为这片工业区镀上金边。旧时代的喧嚣正在远去，一种更沉稳、更有力的脉动，正从这片土地的心脏响起。"
GOS_focus.19.a:0 "长江后浪推前浪，一代新人换旧人"
GOS_focus.20.t:0 "海外粮商"
GOS_focus.20.d:0 "应天府下关码头， 江风裹挟着水汽与号子声。千帆竞渡，樯橹如林，卸货的挑夫在跳板间穿梭如蚁。粮政局的朱漆告示牌前人头攒动，白纸黑字赫然写着：“奉朝廷政令：即日起，准允持证海外粮商运销洋米入境，以济民食，平抑市价。”\n消息像长了翅膀。入夜，城里“丰泰”、“裕昌”几家大粮行的掌柜们，竟提着灯笼，深一脚浅一脚地赶到码头。几艘挂着“兰芳公司”旗号的铁壳货轮刚泊稳，掌柜们便围着船上卸下的米样打转，手指捻着米粒，凑近鼻尖细闻。\n“啧，南洋米成色新，一担码头价才七块。” “丰泰”的李掌柜掐着算盘，珠子噼啪作响，眉心拧成了疙瘩，“比咱仓里压着的江南陈米还低两块！这价砸下来…” 他猛回头，压低嗓子对身后账房吩咐：“明早开市，所有标米，一律降一块五！再捂着，那几千担陈米真得喂老鼠了！”\n码头灯火通明，苦力们喊着号子，将印着外文的麻袋垒成小山。一个穿灰布学生装的青年，借着汽灯的光，大声为不识字的船工和力夫念着告示细则：“…凡入港外米，须经粮政局查验司取样验看，米质须合上等，颗粒饱满，掺杂沙石、霉变逾一成者，整船扣罚！ 违者依《粮政则例》严惩不贷！” 旁边一位挎着空篮的老妪，听着连连点头，双手合十喃喃：“菩萨保佑…官家管得严就好，米价落了，锅里有得煮，日子就有盼头。”\n三日后，南京三山门米市。 各家米行的水牌上，斗大的米价数字悄然改写，挂牌价比旬前统跌了一成有余。买米的百姓排成长龙，神色间少了往年的焦躁惶然，队伍井然。粮政局衙门前，又贴出黄榜新告：“…外米完税后，须按总量三成，以平价（限市价九折）售予各省常平仓，储为春荒赈济、平粜之用。”\n几位南洋粮商刚在查验司签完单子，聚在茶棚下商议。虽被抽走三成平价米，利润薄了些，但看着告示上“济民”二字，又瞧着码头井然有序的装卸和米市平稳的人流，为首的陈老板呷了口茶，对同伴点头道：“还是这应天的衙门做事有章法，不像是广州那边闹得工商各界人心晃晃，听说不少企业都被查处了，我可不敢过去。朝廷这便薄利是薄利，可好歹是能解决咱们粮食销路！”"
GOS_focus.20.a:0 "生意嘛，图个稳当长久。"
GOS_focus.21.t:0 "农业补贴计划"
GOS_focus.21.d:0 "苏州府吴江县衙前， 一张簇新的朱砂红告示贴在八字墙显眼处，墨迹未干：“奉省府令：推行‘春耕贷’。凡本县自有田不足三亩之小户，经乡公所核验确系耕种者，每亩水田可贷安民券贰圆，秋收后按原额归还，免收利息。另配发新式肥田粉，助增产增收。”\n消息像灶膛里的火星，一夜就传遍了四乡八里。佃户周老四天蒙蒙亮就挑着空箩筐赶到衙门口，怀里紧紧揣着那张按着红手印的佃耕契约（注：佃户无地契，此为租约证明），冻得通红的指关节攥得发白。衙门口已排起长队，多是和他一样的短衫草鞋。\n轮到周老四，书办仔细核对了契约上的姓名、田亩数和东家名字，又让乡公所派来的保正画了押。手续办妥，一个衙役便从钱箱里数出四张一元面额的安民券，“啪”地一声拍在周老四粗糙的手心里。另一名差役又递过一个沉甸甸的牛皮纸包：“喏，肥田粉，省里弄来的新品，照着单子上写的法子使，别糟蹋了！”\n周老四捧着银元和纸包，咧开干裂的嘴唇，露出黄牙：“嘿！官家贴钱又贴肥！这下…这下敢把东头那两亩孬地也翻成双季稻试试！” 他浑浊的眼睛里闪着光，仿佛已经看到金黄的稻浪。\n旁边几个穿着半新绸棉袄的小地主，抄着手在一旁看，脸色却不太好看。其中一个捻着山羊胡，低声对同伴嘀咕：“张兄，瞧见没？只贷给这些泥腿子佃户，没我们这些业主的份！钱和肥都给了他们，秋后要是他们腰杆硬了，嫌租子重，撂挑子不干，或是把力气都使在自己租的地上，咱自家那几十亩雇工种的田，谁来精心伺候？收成怕是要打折扣！”\n这时，身着青色官袍的县知事踱步出来，像是听到了议论，扬声对众人道：“诸位乡绅父老！省府钧令，此贷专为扶持耕作维生之小户，解其春耕燃眉之急。然！” 他话锋一转，“凡有田业主，若愿与承佃户立约，于今岁夏、秋两季各减原租额一成，经县府备案，亦可按减租田亩数，同领此新式肥田粉！ 此乃两利之举，望诸君思之。”\n这消息比寒风传得还快。没过两日，村里几户有些头脸的地主家门前，果然也贴出了盖着私章、墨迹新鲜的“减租告示”，写明所减田亩与期限。佃户们聚在告示前，识字的大声念着，不识字的踮脚看那鲜红的印章，脸上露出难得的笑意，互相拍着肩膀：“减一成租！还能白得官家的肥！东家这回…算是做了件明白事！”"
GOS_focus.21.a:0 "还是陛下圣明！"
GOS_focus.22.t:0 "消费？"
GOS_focus.22.d:0 "太仓城隍庙东侧的“利民国货商场”开张半月，青砖门脸上那条“实业互助，利通城乡”的布幌子格外显眼。 商场里人声嗡嗡，货架分门别类：苏州“瑞蚨祥”的本色府绸码得齐整，景德镇窑口新出的青花粗瓷碗摞成宝塔，崇明“大生纱厂”织的十二磅细布卷得饱满。最引人驻足的是那白底红字的价牌——许多货品的标价，比城里老字号同等货色还低个七八分。\n交通银行的见习襄理赵文清，趁着休沐日陪未婚妻淑仪置办嫁妆。淑仪抚着一匹靛蓝底印玉兰花的松江细布，有些迟疑：“这花样是雅致，就怕料子不经穿？”柜台后穿着灰布短褂的伙计阿福，立刻抽出一尺布头，双手用力一扽：“小姐您听这声响！这是南通新纱配改良织机出的料子，经纬密实。您放心，用‘固色蓝’染的，莫说十水，三伏天晒它个把月，这玉兰花也不带走样的！价钱嘛，”他指着价签，“比‘老丰泰’上月进的同款还便宜一角二呢！”赵文清摸了摸刚领的薪水袋里几块银元的棱角，又见淑仪眼中喜爱，便道：“好，就它了，扯足一身旗袍料！”付钱时，他瞥见旁边货架上挂着的藏青直贡呢料子，想起母亲那件磨出毛边的旧袄，对阿福补了一句：“劳驾，这藏青的呢子再剪六尺。”\n商场二楼西头，叮叮当当响个不停。 这里是“旧物折新处”。两条长桌拼成的柜台上，堆着豁了口的铁锅、瘪了肚的铜壶、锈死的旧剪子。两个老师傅戴着花镜，用小锤敲敲打打，估着成色斤两。南街铁匠铺的周师傅提溜着个漏了底的旧铁壶来。老师傅拎起来掂掂，又弹指听个响：“老周，壶是正经生铁，可惜穿了洞。算你一角五吧！再添三角整，这把‘张小泉’新打的桑刀拿走，包管好用！”周师傅麻利地数出零钱，接过油纸包好的沉甸甸新刀，转身对相熟的箍桶匠老吴笑道：“老吴，瞧见没？这路数才叫通！我这破壶回炉，成了好铁料；铁厂收了料，打成新刀卖商场；商场得了旧铁，折了钱给我；我少花几个钱，得了新家什使唤！这钱啊、铁啊、东西啊，转起来了，大家伙儿碗里就都有热乎饭！”\n月末盘账，利民国货商场的流水让账房先生吃了一惊：一月间竟走货一万八千余件！ 太仓商会为此专开了评议会。管总务的孙理事翻着报表，对在座的商董们分析：\n“咱们商场销得快，工厂那边订单就稳，工人的工钱有着落。工人拿了工钱，转头又能来商场买东西，或是拿旧物来换新。还有那回收的旧铁旧铜，供给铁厂钢厂，又省了矿料钱……”"
GOS_focus.22.a:0 "通过朝廷指导下的适当让利，最终顺利扩张了内需"
GOS_focus.23.t:0 "小康社会"
GOS_focus.23.d:0 "杭州西湖白堤尽头，柳浪闻莺牌坊旁，那间摆了二十年的“王记字画茶”摊，檐下新挂出一块杉木板，上书三个朴拙的墨字：“小康茶”。 摊主王老汉正用抹布擦拭着几张斑驳的竹桌。茶摊虽旧，今日却透着点新鲜气。\n几个熟客刚坐下，就瞅见了新招牌。绸庄账房先生打趣道：“老王，你这‘小康茶’是个什么讲究？莫不是要发达了？”老王提着铜壶过来冲茶，咧嘴一笑，指着旁边柱子上新贴的、盖着杭州府大印的告示：“诸位先生请看，托省里新政的福！上月府衙的差爷来宣示：凡我等月入不足三十块龙元的小铺子、挑担营生，准予‘免税’（免征营业税）、‘免厘’（免征货物过境税）！ 这不，”他回身指了指茶炉旁挂着的小黑板，“以前一碗龙井茶末子泡的粗茶卖八文，如今，只卖六文！咱也学学那大铺子，图个走量，细水长流！”\n午后日头偏西， 三四个摇橹的船娘收了工，结伴到老王摊上歇脚。她们利索地从腰间束着的布褡裢里掏出铜钱，一人要了一碗茶。“王伯，今儿水烧得滚！”一个年长些的船娘呷了口热茶，抹了把汗，声音带着喜气，“今年春蚕争气，茧行收价也高，比去年足足涨了两成！东家说了，下月工钱也给我们添点！”旁边年轻点的船娘接口：“可不是！昨天路过‘张小泉’，瞧见把新剪子，咬咬牙买下了，剪桑叶利索多了！”老王听着，又给她们的粗瓷碗里续上滚水，脸上的皱纹都舒展开了：“好啊！你们手头活泛了，我这茶摊子也跟着沾光，多卖几碗‘小康茶’！”\n华灯初上， 湖面画舫的丝竹声隐隐飘来，游人渐密。老王开始收摊，将条凳一张张摞起。他捧出那个油光发亮的旧钱罐，“哗啦”一声将里面的铜钱、龙元倒在桌上，就着摊头马灯的光，一枚枚细细点数。数完两遍，他摸出个小账本，用指甲在“四月廿三”那行划了个勾，又在月尾合计栏里添了个数。昏黄的灯光下，老王嘴角微微扬起——这个月茶钱，刨去买炭、茶叶的本，净落竟有三十二元，比上月整整多出五元！\n他收拾妥当，推着小车路过堤边仍在卖糖粥的徐婆摊子。徐婆正给一个书生模样的青年盛粥。老王停下脚步，从怀里摸出两个温热的铜板，轻轻放在徐婆的粥桶盖上：“老姐姐，来碗赤豆粥，给孙子明早当点心。”徐婆笑着应了。老王捧着粥碗，看着湖面星星点点的灯火，对徐婆低声说：“徐阿婆，你看这光景。生意虽是小本，可官府免了咱的捐厘，咱就能把茶卖便宜些；喝茶的船娘、街坊们，茧子卖了好价，手头松快了，也舍得花几文钱歇个脚、说说话；我这儿多卖几碗，你那儿也能多熬一桶粥… 这日子啊，就像那湖里的水，看着平静，底下有活水在淌……”"
GOS_focus.23.a:0 "慢慢地，大家碗里就都能见着点油星，暖和起来了。"
GOS_focus.24.t:0 "队伍清理（1）"
GOS_focus.24.d:0 "兴宪元年， 北方的烽烟早已遮蔽了顺天府的上空，应天枢密院仓促设于应天旧贡院。昔日的科举圣地，朱漆剥落，号舍阴冷，如今弥漫着硝烟与桐油混杂的气息，往来皆是戎装人影。兴宪帝圣驾南巡以来，肃杀之气便笼罩了这座临时帅府。\n清晨寒风凛冽，贡院至公堂前的空场上，黑压压站满了从各防区抽调而来的军官与士官骨干。应天新任陆军枢密使施承志，身着笔挺的灰呢军装，披着大氅，登上临时搭建的木台。他未持讲稿，目光如鹰隼般扫过台下肃立的军人，声音穿透冷空气：\n“诸君！ 顺天已陷于逆乱，朝廷蒙尘！我江南膏腴之地，亿万生民之安危，此刻系于诸君肩头！ 求援无门，外寇环伺，我七省子弟，唯有奋起！” 他猛地挥拳，斩钉截铁，“护国！救民！ 此四字，便是吾辈今日之血誓！家国存亡，在此一举！”\n“护国救民！护国救民！” 台下数千喉咙爆发出山呼海啸般的回应，声浪震得贡院古柏上的残雪簌簌落下，血气在寒风中蒸腾。\n口号余音未散，审查的铁幕已然拉开。 司令部朱漆大门外，迅速排起了沉默的长龙。气氛由激昂转为凝重压抑。每个士兵、士官、军官，都需先向门岗文书递交一份详尽的履历表，墨迹犹新，显然是临时赶写。随后，被依次引入贡院深处一间间临时征用的号舍教室。\n教室内景象森然。 昔日考生伏案的狭长条桌依旧，只是桌后坐着的不再是考官，而是面无表情、身着深色制服的审查官。桌上仅一盏嘶嘶作响的汽灯，投下惨白晃动的光圈，将审查官半张脸隐于阴影，也将受审者的表情照得无所遁形。空气里弥漫着劣质煤油味和旧纸张的霉味。\n审查官翻开厚重的名册，核对姓名、部队番号。问话极其简短，却字字如刀：\n“籍贯？”\n“江北淮安府。”\n“嗯。”审查官眼皮未抬，笔尖在名册上划过，发出沙沙声。短暂的死寂后，下一个问题如冰锥刺来：\n“锦王逆党，你在顺天时，认得其中谁人？”\n语气平淡，却带着不容置疑的威压。被问者或坦然作答，或眼神闪烁。凡应答稍有迟疑、言语含混不清者，立刻有两名持枪宪兵自角落阴影中无声上前，一左一右夹住胳膊，低喝一声：“带走！” 不由分说便被押往贡院深处那排门窗紧闭、戒备森严的厢房进行“复问”。那里偶尔传出的厉声喝问或短暂沉默，都让外面排队的人心头发紧。"
GOS_focus.24.a:0 "紧张"
GOS_focus.25.t:0 "队伍清理（2）"
GOS_focus.25.d:0 "排长赵均胜站在队列中，掌心沁出冷汗。 他是顺天士官学院出身，履历光鲜，本不该如此忐忑。但三年前在顺天，作为优秀学员代表，他曾站在观礼台上，近距离目睹过锦王参与的阅兵场面——这本是荣誉，此刻却成了催命符。\n果然，当他报出籍贯和部队，那致命的问题落下：“锦王逆党，认得谁？” 赵得胜试图解释当时只是观礼，并非锦王亲信。但审查官只冷冷追问：“台上台下？距离几何？可曾交谈？” 赵得胜的辩解在对方审视的目光下显得苍白无力，言语间不免带了丝慌乱。\n“带下去！” 冰冷的命令响起。赵均胜被宪兵带出教室，穿过回廊，径直押到贡院中央空旷的操场上。寒风卷着沙砾抽打在脸上。几百名正在操练或等待审查的士兵被勒令列队肃立。\n一名高级军官走到赵均胜面前，目光如电：“顺天士官学院，赵均胜！顺天锦逆阅兵观礼，知情不报，立场存疑！依《战时整肃条例》，褫夺军职！” 话音未落，两名宪兵上前，“嗤啦”两声，粗暴地将他肩章上的铜星扯下！那代表着他数年奋斗的徽章滚落在冰冷的泥地上。\n赵均胜浑身一震，脸色瞬间惨白如纸。他死死咬住下唇，不敢发出一丝声音，更不敢抬头看周围同袍的目光。耻辱与恐惧如冰水浇头。他只能死死盯着自己脚上那双洗得发白、大脚趾处已磨出破洞的旧布鞋，仿佛要将地面看穿。那破洞，此刻像一个无声的嘲笑。\n十天，贡院灯火彻夜不熄。 审查如巨大的磨盘，冷酷地碾过七省联军初聚的庞大人马。最终，三百二十名军官（多为与北方有旧或背景存疑者）、三千多名名士兵（多为籍贯敏感或履历不清者）被甄别剔除，押送后方另行“管训”。空出的职位，迅速由应天、苏州、杭州三地紧急征召、受过基础训练的民兵骨干填补。\n新兵入伍当晚，没有激昂的训话，没有分发武器。 在依旧阴冷的号舍里，他们领到的第一件物品，是一方折叠整齐的、用粗糙红布缝制的臂章。展开，上面用浓墨工整地写着四个大字：“护国救民”。新兵们默默地将这方沉甸甸的红布箍在左臂上。昏黄的灯光下，那抹红色并不鲜艳，却异常醒目，像一道无声的烙印，也像一句用血写成的誓言，沉甸甸地压在每个人的心头。"
GOS_focus.25.a:0 "贡院的夜，更深了。"
GOS_focus.26.t:0 "破格提拔"
GOS_focus.26.d:0 "应天武庙前的石狮子，今日颈项间垂了簇新的红绸，沉默地映着天光，仿佛凝固的火焰在庄严的门前燃烧。\n蹄声叩响青石，由远及近，五骑并辔而来。当先者邱清泉，不过三十二岁年纪，眉宇间凝着霜雪般的锐气。身后四骑，孙立人、宋希濂、廖耀湘、戴安澜，皆在而立之年，身姿挺拔如松，目光锐利如鹰。昔日应天陆军大学同窗，十载光阴，倏忽而过；如今重聚，竟已是帝国新锐之将，蒙兴宪帝破格亲授少将军阶。\n武庙前偌大校场，已搭起高台。台上，兴宪帝一身戎装，目光如炬，扫视着台下肃立的军阵。当邱清泉诸人踏着坚实的步伐拾级而上时，皇帝亲自将沉甸甸的将印一一捧出，郑重托付于每人掌中。金印在日色下流转着沉郁的光泽，无声诉说着千钧之责。最后，皇帝的目光缓缓扫过五张年轻而坚毅的面庞，声如金石交击：“克复旧都，重整江山，还赖诸君努力！”\n台下骤然爆发的掌声，如疾风骤雨般涌起。队列前排的老兵们，黝黑枯瘦的手掌拍得格外用力，眼中蓄满浑浊的泪水——那是烽烟里熬出的认同。后排那些新募的士兵，大多初次目睹如此威严场景，个个圆睁双目，喉结上下滚动着，胸膛里鼓荡着前所未有的灼热气流。原来当兵打仗，并非只为一口军粮。皇帝封赏、破格提拔竟不只是戏文中的故事，而是能真实发生在自己身边的事。\n仪式已毕，五将按剑肃立台前，崭新的少将肩章在秋阳下熠熠生辉，红绸衬得那肩章愈发鲜亮如血。邱清泉目光沉静如水，缓缓掠过台下无数仰望着的年轻脸庞。无数双眼中映着台上将星的光芒，那光芒灼灼，分明映照出年轻生命被唤醒的某种庄严渴望——"
GOS_focus.26.a:0 "仿佛种子在裂开冻土前，已听见了春天雷霆的召唤。"
GOS_focus.27.t:0 "新式军事理论"
GOS_focus.27.d:0 "新枢密院后角那座不起眼的灰楼，灯火已持续燃烧了七十二小时。来自军方将领与应天陆军大学的教官们，正会同参谋本部人员制定江淮防线的纵深防御计划。\n楼内烟雾缭绕，烟蒂在锡盘里堆成了小山。宽大的橡木桌上铺着1:100000的江淮水系图，上面布满了参谋们的标记——蓝色铅笔勾勒的预备阵地，红色标注的火力支撑点，黑色虚线连接的补给线路。旁边的文件架上整齐排列着部队编制表、装备清单和交通网络图，详细到每个步兵团的实际员额、马克沁机枪配属数量、甚至各段公路的雨季通行能力。\n魏国公徐绍桢的军事思想明显影响了规划。他坚持要建立梯次防御体系，强调利用江淮水网构建反坦克障碍，还详细规定了各支撑点间的火力协同方案。这位参加过欧战凡尔登战役的老将，甚至亲自校对了多个大型工事的位置。\n经过多天的连续作业，《江淮防御实施纲要》终于定稿。窗外，启明星正落向应天府古老的城墙。新的一天即将来临，而灰楼里的这些人知道，他们刚刚为了应天政权绘制了生存的蓝图。\n打印机开始作响，一份份副本将被装订成册，由专人护送，奔赴战云密布的前线。战争尚未全面爆发，但在这座不起眼的灰楼里……"
GOS_focus.27.a:0 "他们已打响了第一枪。"

