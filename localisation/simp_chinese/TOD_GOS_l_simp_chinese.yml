### GUI ###
 #天子内阁派系
  GOS_gui_tzngpx_dth_name_text:"大同会"
  GOS_gui_tzngpx_gxx_name_text:"管学系"
  GOS_gui_tzngpx_jd_name_text:"军队"

  GOS_gui_tzngpx_dth_tooltip_text:"自1901年忠君大同会（管学系）背叛，大同会前后两次大分裂以来，大同主义运动在全国范围内都受到了严重的打击。在这一背景下，大同党长江革命委员会建立了起来。历经政府的多次打击和几番起落，长江革命委员会依旧屹立。并且通过农会、卫星政党等各种方式不断拓展着自己的影响力。\n如今，长江七省地区的农会已然基本为大同会控制，各地的独立工会多受大同主义的影响，城市小资产阶级和知识分子也多为大同会的忠实拥趸。"
  GOS_gui_tzngpx_gxx_tooltip_text:"管学系本是大同会中的维新主义者，以大企业主、金融家和大商人为主。1901年，大同会维新派宣布脱离大同会，成立新政党——忠君大同会。在昌德的改革之下，许多原本封闭的商业领域进一步向民营企业开放，他们在朝廷的支持下也进一步将触角深入海外更加广袤的市场之中。\n如今，管学系的主要支持者是金融资产阶级、大中资产阶级、知识分子、小商品生产经营者与跨国贸易企业，是七省议会中最大的政治派系。 "
  GOS_gui_tzngpx_jd_tooltip_text:"军队是七省联合的军事保障，他们其中的大部分将官并无明显的政治倾向和派系立场，这也为七省宽松的议会政治提供了武力支持。然而，混乱的内战局面使得政权越来越以来仰赖军队。\n随着时间推移，军队中的部分将领也开始渴求政治权力，试图将他们的军事优势逐步转变政治力量。"

