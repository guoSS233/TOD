 #工业
  GOS_focus_13:"发挥金融手段"
  GOS_focus_13_desc:"庚午钱荒以来稍有回复的经济状态已然被新的全国内战撕裂了，大量生产贸易遭到断绝。在这危难关头，我们应该发挥自身金融中心的优势，通过一系列金融手段快速稳定治下的物价。帮助百姓和企业的生产生活回到正规。"
  GOS_focus_14:"经济动员"
  GOS_focus_14_desc:"战争的阴影正悄然逼近，尽管我们迫切渴望即刻投身到平定北方叛乱的斗争之中，然而，江南地区松散的政治格局与经济现状显然无法即时支撑起战争的庞大需求。当务之急，在于迅速转换至战时体制，实现经济资源的有效整合与全面的战时动员。"
  GOS_focus_15:"基础建设" 
  GOS_focus_15_desc:"战争的浩劫导致无数百姓一夜之间陷入赤贫，只能无助地期盼政府的援助。然而，单纯的救济犹如杯水车薪，难以从根本上解决问题。因此，我们应当积极推行以工代赈等多种措施，在加速基础设施建设的同时，为百姓创造充足的就业机会，让他们通过自己的双手重建家园，重拾生活的希望。" 
  GOS_focus_16:"船舶制造"
  GOS_focus_16_desc:"要想荡平四方乱党、逆贼，我们便不能缺少一只规模庞大的海军队伍。这无论是助力我们收复海外领土，抑或是保证海外补给路线的畅通都是十分重要的。正因如此，新一轮船坞及配套设施的建设工作已然被提上日程。"
  GOS_focus_17:"海上运输"
  GOS_focus_17_desc:"现代战争绝非仅限于军事力量的简单较量，它更是两个政权综合国力的深度比拼。正因如此，确保海上运输线的畅通无阻，将成为我们在未来战争中赢得胜利的战略基石与生命线！"
  GOS_focus_18:"保障战时民生"
  GOS_focus_18_desc:"战时的经济生产工作诚然充满艰辛与挑战，但我们绝不能因此背弃对百姓的庄严承诺。在动员百姓积极参与军事生产的同时，我们亦需全力保障他们的基本生活需求，确保战时经济能够维持在一个良性循环的轨道上，让每一位国民都能在为国奉献的同时，也能感受到国家的关怀与温暖。"
  GOS_focus_19:"扩大资源开采"
  GOS_focus_19_desc:"战争给我们的生产体系带来了前所未有的巨大压力，特别是在原材料的供应方面，我们几乎难以在自身控制区域以外获取到各类急需的矿物资源。同时，海外产品的流入也遭受了重重阻碍，对于当前的生产需求而言，这些外来物资只是杯水车薪，难以缓解根本问题。正因如此，我们必须坚定不移地走自力更生的道路，加大对自身控制区域内资源的开采力度，扩大开采规模，以顽强的毅力与决心，共同度过这段黎明前最为艰难的黑暗时期。"
  GOS_focus_20:"建设军事产业"
  GOS_focus_20_desc:"战争的临近迫使我们必须将社会各领域的生产力量凝聚起来，全力服务于军事生产的需要。为此，我们将着手对当前产业结构进行深度调整，通过新建工厂、扩建生产线等一系列举措，大幅提升军事产业在国民经济中的比重。我们的目标是，为前线部队提供充足而高质量的军事装备与物资，确保他们在战场上拥有优势，从而赢得最终的胜利。"
  GOS_focus_21:"改良生产线"
  GOS_focus_21_desc:"欧战后许多生产技术都迎来了更新换代，但派系博弈以及复杂的审核机制使得这些新技术没法快速应用到各类企业之中。现在在政府的大力支持下，各类新式技术将快速上马，这必将使得我们的企业生产迎来新一轮提升。"
  GOS_focus_22:"农产品进口"
  GOS_focus_22_desc:"江浙、湖广的地区的农业生产大多以种植经济作物为主，这在富裕了当地农民的同时，也使得该地区的粮食自给率相对较低。如今全国内战局势严峻，如果想要保证控制区域的粮价，我们就应当积极增加农产品进口，从而为我们的统治提供最基础的物质条件。"
  GOS_focus_23:"稳固农本"
  GOS_focus_23_desc:"进口粮食之外，保证本地经济作物的销售也是我们需要做的事。本地农业高度市场化带来巨大利润的同时也伴随着极大的风险，也是一旦产品销路受阻，那么大量农民就将面临破产，生计无门。正因如此，我们政府必须为这种新式“农本”找到出路。"
  GOS_focus_24:"拓展内需"
  GOS_focus_24_desc:"长期以来，广大勤劳的民众是世间绝大部分财富的创造者，然而，他们实际所得却微乎其微。这种现状不仅加剧了贫富差距的鸿沟，还迫使众多企业面临产品销售的困境，不得不依赖海外市场寻求出路，这一局面亟待扭转。为此，我们决心提升劳动者在初次收入分配中的比重，确保他们能够获得更为丰厚的报酬及更多的个人时间，以此激发国内消费需求，从而从根本上摆脱以往不健康的经济模式，迈向更加稳健的发展道路。"
  GOS_focus_25:"重现富饶之明"
  GOS_focus_25_desc:"尽管往昔的战争与苦难在这片土地上镌刻了无数沉痛的记忆，但随着大规模经济建设的蓬勃开展与改革的深入实施，民众的生活状况正经历着前所未有的快速改善。市场上琳琅满目的商品、百姓手中日益鼓胀的钱包、以及相对稳定的物价水平，无一不昭示着一个强大而繁荣的大明正在崛起，焕发着新的生机与活力。"



 #海军
    GOS_focus_60:"帝国舰队"
    GOS_focus_60_desc:"作为应天临时中央，我们接管了原大明海军枢密院在江苏，浙江布置的海军，还有东洋舰队驻扎在港口内的舰船。且不管其它势力有何态度或是动作，我们都应当以最快的速度，将帝国的舰队整编起来。"
    GOS_focus_40:"保护商船"
    GOS_focus_40_desc:"在和平年代，太仓府曾经是东南沿海地区乃至整个太平洋的贸易中心之一，万国商旅纷至沓来，发达的经济也是它被单列为直辖府的重要原因。如今反贼叛臣窃据顺天，华夏九州战火纷飞，但愿我们仍能在东南这一隅保境安民，维持经济与贸易活动，以不算多的舰船，保护通向世界的生命线。"
    GOS_focus_41:"新式海军"
    GOS_focus_41_desc:"漫长而曲折的海岸线曾经是我们对外交流的优势，但在当下，这些不设防的海岸就如同柔软的腹部暴露在敌人面前。帝国海军迂腐的指挥体系已经不再适合现状，我们必须改革海军的指挥体制，更新舰船与飞机，为接下来的战事做好准备。"
    GOS_focus_42:"海上平台"
    GOS_focus_42_desc:"虽然现在放眼全球，航空母舰的数量屈指可数，但可以预料的是，在不远的将来，这种兼具机动性与打击能力的新式舰船必将会改变海上作战的方式，而我们，应该走在时代前面。"
    GOS_focus_43:"昔日荣耀"
    GOS_focus_43_desc:"说来可笑，大明立国至今二十九位皇帝，向往海洋与海权者比比皆是，亲眼见过海洋的却寥寥无几。海洋对于他们来说，究竟是太庙祭祀时向先祖供奉的牲醴，还是案头放着的几封久久得不到回复的奏疏？对我们来说，海洋又是什么，是渔民的生生所资，商人的丝绸之路，还是一望无际的领土？"
    GOS_focus_44:"海上要塞"
    GOS_focus_44_desc:"大明海军的战列舰是以山脉命名的。五岳撑起了大明子民的脊梁，而兴安岭，天山与昆仑巍峨耸立，筑起了牢不可破的坚城。即使经过了昌德皇帝驾崩后这几年内的混乱，大明的海军仍几乎维持了完整的编制和良好的组织度，海上的要塞，一如往日守护着大明万里的海疆。"
    GOS_focus_45:"战斗群"
    GOS_focus_45_desc:"战斗群并非只是几支舰队编制的合并，而是在一个更大的指挥体系下各舰队的协同编组。只有各种舰船互相配合，海军才能在广阔的洋面上保持对敌人的打击能力。当舰载战斗机一架接一架起飞时，“遮天蔽日”这个词将会具象在敌人的头顶上。"
    GOS_focus_46:"海军陆战队"
    GOS_focus_46_desc:"陆军仅能施威于境内，擢武于边疆，山川之阻，有难色焉；不若海军之可守我海港，航彼领湾。二者相合，当抢滩敌阵，克之不意，惟赖是焉。"
    GOS_focus_47:"大舰队"
    GOS_focus_47_desc:"舰队的规模极大影响了其作战的能力，过小而分散的编队可能被逐个击破，而过大的舰队又存在着隐蔽性、机动性不足等弊病。毕竟鱼与熊掌不可兼得，我们也应该做一些取舍。"
    GOS_focus_48:"太仓造船厂"
    GOS_focus_48_desc:"永乐年间，郑和曾经在太仓刘家港集结船队，浩浩荡荡地航向西洋。时至今日，太仓仍然是大明东南海岸线上的一颗璀璨明珠。在当下的非常之时，太仓将建设新的造船厂，为应天舰队提供维修服务及后勤保障，以维护东海上的和平。"
    GOS_focus_49:"杭州造船厂"
    GOS_focus_49_desc:"杭州人口繁多，物产繁盛，经济发达，自隋唐起便是江南地区的经济重镇。近代以来，充足的劳动力支撑了工业的发展，烟囱林立，厂房鳞次栉比。庚午钱荒后，杭州的工人境况虽然好过东北，但失业流离者仍不在少数，朝廷内部各派系的掣肘让工人的就业问题一直不能落到实处。建立杭州造船厂，既能补充我们舰队的船只，也能为默默舔舐伤口的杭州注入新的活力。"
    GOS_focus_50:"海上霸主"
    GOS_focus_50_desc:"大明帝国的海军从英国和俄国舷侧夺过了大洋的控制，史书上记载的三宣六慰更是昭示着大明海军曾经的辉煌。时过境迁，孔夫子手中的书本已经卷了边，琴已经锈了弦，“鱼跃于渊”，大明是时候重新握住宝剑，将视线重新投向海洋了。"

 #空军
    GOS_focus_51:"重视航空兵"
    GOS_focus_51_desc:"昌德十七年，世界上第一架飞机在太仓试飞成功，并在随后的世界大战中，逐渐体现了它独特的作用。我们应将目光投向蓝天，以争取战场上的“制高点”。"
    GOS_focus_52:"组建空军"
    GOS_focus_52_desc:"汉口的荆楚高速飞行器研究所已经准备完毕，我们将整合昌德年间的飞机，选拔优秀的飞行员，组建独立的空军部队，以翱翔的姿态恢复大明的河山！"
    GOS_focus_53:"轰炸任务"
    GOS_focus_53_desc:"“中尉，恭喜你成为一名远爆甲型战略轰炸机组乘员！这是一份光荣的任务，只要飞满25架次，你就可以提前退役回家了。大明日月在上，祝你好运。”"
    GOS_focus_54:"支援任务"
    GOS_focus_54_desc:"“徐州地方，历代大规模征战五十余次…”“快别说了，再耽误下去就要延误战机了！”徐州府作为重要的南北交通枢纽，此刻正遭受叛军的大规模进攻，面对这种局势，我们应将轻型飞机投入战场，以高屋建瓴之势支援地面部队的防御。"
    GOS_focus_55:"抢夺天空"
    GOS_focus_55_desc:"天空属于大明！江南之地常是阴雨连连，这正是我们的截击机行动的好时机。借着对地形和天气状况的熟悉，我们将夺回制空权，扫清大明子民头上的阴霾。"
    GOS_focus_56:"雷霆打击"
    GOS_focus_56_desc:"“昭昭若日月之明，离离如星辰之行”人们总是用这句话形容美好的品德，后来也有人这么形容大明的强盛。不过当天上落下的凝固汽油弹照亮夜空，光芒遮住星辰的时候，人们却总是忙着躲避，几乎不会想起这句话。"
    GOS_focus_57:"沙场雷霆"
    GOS_focus_57_desc:"“北纬35度28分，东经0度59分（顺天太和殿为本初子午线），第二‘淮阴勇士’步兵师进攻受阻，请求空中支援！”我们的近距支援机将以雷霆击碎黑暗，在天空中开辟新的战场，减轻陆军在前线的压力。"
    GOS_focus_58:"空军学院"
    GOS_focus_58_desc:"嫦娥的神话虚无缥缈，但陶成道的事迹确凿地载于史册，华夏民族对天空的向往在我明一朝达到了前所未有的高度。作为万户的后人们，“效法羲和驭天马，志在长空牧群星”永远是我们的梦想。想必，这个梦想会随着婺州空军学院的建立，距离成为现实更进一步吧。"
    GOS_focus_59:"天空霸主"
    GOS_focus_59_desc:"从冯九如的第一架飞机，到翱翔在天的“穷奇”“金鸾”与“白泽”战机，大明的航空事业经历了许多风雨。不论是世界大战还是政变与内战，什么都不能阻挡大明张开他的双翼。而如今，到了“鸢飞戾天”的时候了。"

