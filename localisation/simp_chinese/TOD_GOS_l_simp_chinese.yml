### 国策 ###
 #政治
  #少帝线
    GOS_focus_0:"初到应天"
    GOS_focus_0_desc:"在顺天政变中，陛下顺利地从一众逆贼布置的天罗地网中脱困而出，抵达了他忠实的的应天！在这里，陛下将开始他全新的统治！皇帝陛下万岁！大明万岁！"
    GOS_focus_1:"南方新朝廷"
    GOS_focus_1_desc:"相较于北方的顺天府齐备的各项机关，应天这个南方陪都早已名存实亡多年，许多部门仅余一个空架子。要想顺利让这个备用运转起来，我们需要着手开展的工作还有很多。"
    GOS_focus_2:"新立宪"
    GOS_focus_2_desc:"皇帝陛下正是因为一心为民、推动改革，损害了勋贵集团、国资集团的利益，才遭到了北方那些无耻逆贼的背叛。但这些困难不能动摇陛下改革的决心，应天政权初立，当务之急便是颁布新的宪法，以向天下彰显革新之决心！"
    GOS_focus_3:"天子内阁"
    GOS_focus_3_desc:"南方政府和议会中政治派系林立，观点主张驳杂，想要真正动员和发挥这江南财税之地的力量，还需要陛下亲自出马。以改革者的形象聚拢人心，在不同派系间调和仲裁，建立真正的天子内阁。"
    GOS_focus_4:"首辅治国"
    GOS_focus_4_desc:"相较于此前叠床架屋、相互制衡的政治结构，陛下已然决定进一步放权给首辅主导下的内阁进行治理。此举虽在一定程度上激起了保守势力与军方的微词，却赢得了广大民众的热烈拥护与坚定支持！"
    GOS_focus_5:"庶民之治"
    GOS_focus_5_desc:"“民为贵，社稷次之，君为轻”这一民本思想，自古以来便深深植根于中国的政治愿景。及至近世，龚自珍、魏源等杰出思想家更是将其精髓进一步提炼升华，孕育出“民主思想”的萌芽。今日之大明，已非昔日仅为士绅阶层所独享的大明，而是亿万苍生共同拥有的大明。因此，传统的选举藩篱亟需逐步拆除，让每一位大明子民，无论贵贱，皆能平等地踏入民主政治的殿堂，共襄国是。"
    GOS_focus_6:"安稳民生"
    GOS_focus_6_desc:"管子曾言“仓廪实而知礼节，衣食足而知荣辱”。无论什么样的改革，民生保障都是大家进行政治参与的前提。正因如此，我们应该积极制定响应的福利保障，来使大明子民远离贫困的困扰，逐步走出庚午钱荒的阴影。也许这十分困难，但千里之行始于足下！"
    GOS_focus_7:"民主大一统"
    GOS_focus_7_desc:"民主绝非仅限于少数人的奢侈品，而是应当毫无偏袒地惠及大明国土上的每一位百姓。正因如此，我们绝不能容忍专制与独裁的毒瘤在这片神州大地上继续肆虐。重塑这片土地上的民主秩序，实现真正的民主大一统，其时代必然到来，且势不可挡！"
    GOS_focus_8:"虚位天子"
    GOS_focus_8_desc:"“致君尧舜上，再使民风纯”是中国一直以来的政治理想，但真正实践确实寥寥无几。毕竟自古君主崇申、韩者多，敬孔、孟者少。但时至今日，我们终于迎来了一位愿意赋权于民、垂拱而治的尧舜之君！"

