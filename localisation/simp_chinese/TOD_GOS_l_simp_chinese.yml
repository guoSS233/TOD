### 决议组 ###
    GOS_decision_l_0:"debug决议"
    GOS_decision_l_1_jjms:"紧急经济模式"
    GOS_decision_l_1_jjms_desc:"§Y当前危机度：§![?VAR_GOS_jjms_wjd]"
    GOS_decision_l_2_tzngpx:"天子内阁派系"
    GOS_decision_l_2_tzngpx_desc:"朱喜钲陛下避祸江南以来积极联系各方派系，一面在尝试促成大同会与管学系的和解，一面又在尝试拉拢军队。但目前的形势并不乐观，陛下在顺天监国期间打压勋贵的行为触犯到了军队将领的利益，而大同会又对陛下的诚意充满怀疑，随着战争在全国蔓延，陛下所采取的措施又势必会引起大同会的不满。"
    GOS_decision_l_3_fn:"咨议院法案"
    GOS_decision_l_3_fn_desc:"咨议院是大明自昌德朝以来非政府官员参政议政的机构，尽管其权力有限，但在大明政治生活中却有着举足轻重的地位。朱喜钲陛下对于宪政的接受态度使得他要借助咨议院来平衡各方势力，进而推行他的政治抱负，而大同会与管学系也都希望通过法案的制定来实现自己的政治目标。同时由于是战时，尽管原则上军队在咨议院没有代表存在，但军队对咨议院的影响依旧不可小觑。"
    GOS_decision_l_4_jsjy:"军事决议"
    GOS_tooltip_fn_dgxf_all:"完成上述所有法案的制定后，才能通过帝国宪法"
