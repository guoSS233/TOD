  #少帝
    GOS_focus_205:"军队审查"
    GOS_focus_205_desc:"“顺天城的变乱引燃了北方的战火，江南的子弟们，组织起来，保卫你们的故乡不受战火的摧残！”张静江在演讲中如是说到，而为了实现这点，必须对军队从上到下进行严格的审查，以肃清其中包藏祸心的武备系分子与蠢蠢欲动的乱党。"
    GOS_focus_206:"军校人才"
    GOS_focus_206_desc:"“惟楚有才，于斯为盛”东南地区作为大明的半壁江山，理应人才济济。我们必须建立自己的军事学院，培育出自己的军官队伍，方能承担起保境安民，北上剿灭乱臣贼子，克复中原的重大责任。"
    GOS_focus_207:"新式理论"
    GOS_focus_207_desc:"世界大战过后，庚午钱荒的到来使得大明的军事理论几无长进。国家动荡之际，正是江东子弟们施展才干的时机，钟山军事学院将成为东南地区军事理论研究的中心，我们相信，军队的战斗力一定会大有改观。"
    GOS_focus_208:"注重火力"
    GOS_focus_208_desc:"古人曾言“守江必守淮”，面对顺天伪政府的军事压力，我们应当以更加集中、强力的火炮支援步兵的防御，这是应天府的命令，务必守住淮河防线。"
    GOS_focus_209:"参谋部改革"
    GOS_focus_209_desc:"“闻道有先后，术业有专攻”，现代战争的信息强度，早已不是几位将领在前线便能一目了然的了。我们需要效率更高，指挥更迅速的总参谋部，为前线下达更明确的作战指示，以提高我军的战斗力，减少将士们的伤亡。"
    GOS_focus_210:"战车设计"
    GOS_focus_210_desc:"中华民族的历史，是一部战争与和平的史诗。早在十六国时期，我们的前辈便发明了世界上第一种履带式车辆——四轮缠辋车。而如今面对山河破碎的局面，我们不得不以战争换取和平，农用拖拉机与三轮牵引车都将会改装后投入前线，保卫大明的半壁江山。“其车三千，如霆如雷”我们将在襄阳建立湖广机车总装厂，与原有的火炮厂配合，制造出自己的铁甲战车。"
    GOS_focus_211:"统一装备标准"
    GOS_focus_211_desc:"世界大战结束后，昌德皇帝曾下诏进行第二次军队改革，即昌德四十年军改。但庚午钱荒的到来破坏了设想中完美的安排，装备的更新因为拨款的紧张被迫终止，而作为地方驻军的省防旅，装备冗杂落后的问题尤为突出。不过我们暂时是不需要向顺天上缴赋税了，这些财政盈余，将被充作军费，用来统一我们的步兵装备标准。"
    GOS_focus_212:"侦察作战"
    GOS_focus_212_desc:"“知己知彼，百战不殆”孙子的智慧直到现在仍闪烁着独特的光芒，伪顺天政府掌握着各省驻军和布防的资料，这对我们是不可忽视的威胁。不过好在，我们将要建立侦查部队，在战场上，于细节之处探得敌军的虚实，为我军提供战略支援。"
    GOS_focus_213:"战火南来"
    GOS_focus_213_desc:"大同会分子窃据广州富饶之地，以他们的歪理邪说，妄图扭曲民主与和平的真谛。而作为大明的正统朝廷，我们坚决不会允许此等乱臣贼子的存在！ "
    GOS_focus_214:"战时经验"
    GOS_focus_214_desc:"大明的安定似乎让很多人忘了一个道理，那就是枪炮声中才能成长出真正的战士。而如今不幸的是，内战的炮火正在撕裂我们的家乡，从工厂中的工人，乡间的农民，学校中的学生们，到应天府中的大小官员，都要从这硝烟中学到些新的本事了。"
    GOS_focus_215:"吸纳共和军战术"
    GOS_focus_215_desc:"岭南地区，重峦叠嶂，山岭交错，地形之复杂远非江南可比。根据我们情报人员的报告，或许正因如此，大同党在夺取广东军权后迅速打散了原有的陆军编制，转而注重部队的灵活性与机动性。收复岭南地区时，希望我们的军队也能注意到这点。"
    GOS_focus_216:"军备革新"
    GOS_focus_216_desc:"长久的太平岁月让我们的枪炮都在武库中落了灰，如今遭逢战事，即使是保养一新，也终究无法直接对阵时代。是时候革新我们的军备，用更好更新的武器来武装大明的士兵了。 "
    GOS_focus_217:"组织防线"
    GOS_focus_217_desc:"松弛的防备曾经给了乱党与叛臣可乘之机，而如今，既然年轻的陛下亲自坐镇应天指挥大局，那么，我们必然不会让那些妄图颠覆大明的人再前进一步！"
    GOS_focus_218:"针对作战"
    GOS_focus_218_desc:"“夫钝兵挫锐，屈力殚货，则诸侯乘其弊而起，虽有智者不能善其后矣”，对顺天的战争急不得，但对广州的战争拖不得，我们必须找到军事上的突破点，尽快平定相对位于战略后方的岭南之变。"
    GOS_focus_219:"战时征募"
    GOS_focus_219_desc:"“苦一苦百姓，骂名我来担。”"
    GOS_focus_220:"北定中原"
    GOS_focus_220_desc:"方今河、洛、关、陕，虽有数雄，假伪号以济私，恃有众以要君。\n此兴义兵，上为祖宗保社稷之兴，下为大明解黔首之苦，务期肃清叛贼，同享太平之乐。\n师不再举，时不再来，布告遐迩，咸使闻知。"
    GOS_focus_221:"组建新军事工业集团"
    GOS_focus_221_desc:"全国的军事工业布局，离不开早年间武备系在朝中或明或暗的操纵，在他们的安排之下，大明各省都呈现出产业单一化的趋势，主要兵器的制造也集中在为数不多的重镇之中。如今四海板荡，我们应当重新整合当前辖区内的军工产业，至于合不合理，那至少是国家统一之后再考虑的事情了。"
    GOS_focus_222:"加大装备研发投入"
    GOS_focus_222_desc:"“工欲善其事，必先利其器”，枪械的破旧与战车的缺乏严重限制了我们的战斗力。我们必须加强基础技术研发和本地装备产业化推广，全力支持兵器研究所的装备研发项目。"
    GOS_focus_223:"加强保密机制"
    GOS_focus_223_desc:"飞鸽传书和鱼传尺素的时代早已过去，在无线电成为军队主流通讯手段的当下，顺着电报线传递的明文电码就如同在街上裸奔一样显眼。为了保护己方的军情消息，一种种繁复的加密方式被各国相继发明出来，各式各样的情报部门也如雨后春笋般涌现出来。作为大明的一部分，我们原本是不需要这样的机构的，但是现在，情况发生了一些变化。"
    GOS_focus_224:"核研究"
    GOS_focus_224_desc:"如果说有什么是可以改变当前战争模式的武器，那么核子武器应当是当下独一无二的选项。根据理论家们的推测，其爆炸的所造成的伤害足以彻底抹平一座城市，如果我们能够最先实现核武研究，那么胜利的天平就将彻底倒向我们。"
    GOS_focus_225:"导弹研究"
    GOS_focus_225_desc:"作为一种此前从未出现过的武器，导弹的概念在最初被军事格物所被提出时，受到了一众老牌学者的反对。但在时任所长的大力支持下，该设想最终还是得以成功立项，并已经产生了可观的研究成果。"
    GOS_focus_226:"旧厂房现代化改造"
    GOS_focus_226_desc:"自庚午年钱荒以来，众多企业一直在生死边缘苦苦挣扎，对于它们而言，厂房升级和技术革新似乎成了遥不可及的梦想。而今，得益于政府的积极引领与慷慨补贴，这些企业终于迎来了转机，将着手对陈旧的厂房实施现代化改造工程，以期能够顺应日益扩大的现代生产需求。"
    GOS_focus_227:"扩招技术人员"
    GOS_focus_227_desc:"在整个生产环节中，技术人员无疑在其中扮演了最为重要的角色。想要实现生产体系的革新，生产规模的扩大，就需要我们对于各个领域的技术人员进行扩招。其所依托的，正是这些年来日益发展的职业教育体系。"
    GOS_focus_228:"企业制度改革"
    GOS_focus_228_desc:"旧有的企业制度纵然对于员工的压榨十分严酷，但生产却是相对低效的。顺天大学毕业的管理学大师提出，可以通过高效的管理体制，在降低工人劳动时长的同时提升劳动效率，从而进一步提高我们的军工生产能力。"
    GOS_focus_229:"构筑防线"
    GOS_focus_229_desc:"面对北方强大的军事压力，我们在战事初期或许很难取得决定性的突破，但既然如此，或许我们也能让北边的同胞们无法从我们这里取得突破。"
    GOS_focus_230:"战术反制"
    GOS_focus_230_desc:"“上兵伐谋，其次伐交，其次伐兵，其下攻城。”西北军只不过是边防军区在政治上扩大化的体现，另外锦王对大明的忠诚也无可厚非，因此朝廷仍能保留用政治手段解决问题的可能性；但顺天方面伪帝朱镕坤窃据大位，是对当今天子正统性的极大挑战，况且他手中还掌握着最为精锐的京营部队，这都使我们需要认真地将对顺天与西北军的打算分开来考虑。"
    GOS_focus_231:"扩大动员"
    GOS_focus_231_desc:"内战开始多久了？这一代大明青年的安定生活，到底还要多久才能到来？陛下认为，我们必须进一步扩大动员规模，为即将到来的决战做好准备。"
    GOS_focus_232:"舆论攻势"
    GOS_focus_232_desc:"自始至终，没有人能回答出来，大明的千千万万百姓们到底是怎么被，又是因为什么被牵涉进这场莫名其妙的内战的。是的，我们不能，不过更加确定的是，顺天的伪朝廷会比我们更加不能回答这个问题。"
    GOS_focus_233:"策反军官"
    GOS_focus_233_desc:"随着战线的逐渐北移，顺天朝廷的一些军官们似乎开始重新考虑自己作为大明官员应尽的职责了，这正是我们进行策反的好时机。我们会将俘虏的军官遣送回北方，希望他们能认清自己的立场，为真正的大明效力。"
    GOS_focus_234:"渗透作战"
    GOS_focus_234_desc:"旷日持久的内战与顺天朝廷的苛政终于激起了人民的愤怒，而照目前的形势，只要一点火星，这股力量就可以为我们所用了。"
    GOS_focus_235:"殊死一搏"
    GOS_focus_235_desc:"“保南疆日月，复洪武雄风；铸铁血山河，开万世新天！”"
    GOS_focus_236:"诏令天下"
    GOS_focus_236_desc:"奉天承运皇帝，诏曰：\n朕绍天明命，扫清中原，诛伪朝之逆党，复社稷于正朔。\n念尔西北、西南、东北诸省臣民，或困于胁从，或蔽于奸佞，朕心恻然。\n今特颁恩旨：凡弃刃归诚者，罪止首恶，余皆赦宥；\n边陲州县，免赋三年，官吏留任如旧，惟改奉（年号）正朔；\n其有豪猾乘乱虐民者，许军民缚献，以正刑典。\n天命在躬，岂容裂土？然朕视天下如赤子，但使输诚效顺，必保尔田庐安宁。\n布告四方，咸使闻知。\n钦此\n（年号）某年某月朔日"



