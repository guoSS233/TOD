l_simp_chinese:
 WJP_han_gui_intro:0 "藩会创设于1868年西日本联盟成立之后，是为应对联盟初期经济危机而召开的最高中央议政机关。最初负责协调、审议各藩年度军事与民政预算，并裁决各类法案。1892年联盟议会开设后，民政预算与民政法案的裁决权被分出，但藩会仍保有巨大的影响力。\n\n早期藩会由萨摩、长州、土佐、肥前四藩共治。此后的经济危机中，萨摩与长州通过收购破产小藩扩张势力，逐渐取得主导地位。今日藩会的议程，也围绕萨长两巨头的角逐展开。"
