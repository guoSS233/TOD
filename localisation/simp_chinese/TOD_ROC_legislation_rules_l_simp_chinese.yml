l_simp_chinese:
 ROC_bill_submit:0 "提交本届经济施政议案"
 ROC_bill_submit_desc:0 "提出§Y[ROC_bill_next_name]§!。中央党代表协商预算顺序、权限与监督安排；本案再核对项目成本和执行条件，由财政、主管部门会签。取得批文后仍须点击原项目实施。\n\n当前案卷：§Y[ROOT.ROC_bill_name]§!；[ROOT.ROC_bill_stage_text]。办理条件：[ROOT.ROC_bill_readiness_text]；[ROOT.ROC_bill_days_text]。最近结果：[ROOT.ROC_bill_outcome_text]。"
 ROC_bill_submit_available_tt:0 "须有在任部长、有效经济任期和可提案项目；无大会或请辞待办、其他施政或未执行批文。试点余任期至少104日，扩建至少194日并满足原政策条件；备有15政治点，距上次提交至少90日。"
 ROC_bill_submit_tt:0 "花费§Y15政治点§!提交§Y[ROC_bill_next_name]§!，交涉最长45日，两阶段弹窗各7日。提交间隔90日；交涉不提前产生项目收益。"
 ROC_bill_approval_required_tt:0 "须持有本项目专属、尚未消费的有效行政批文。批文不代付实施费用，不提前启动90/180日项目；部长、任期及原实施条件变化会令批文失效。审批按本案行政准备度和项目材料办理，中央党派态度及委员会政治议程不会替代这两项条件。"
 ROC_bill_materials_tt:0 "花费§Y10政治点§!核实项目成本：技术材料+1，行政预算准备+2。对应政策基础使两层各+1。于树德、陈赞贤、萧铮试点与全部扩建需2点技术材料，晏阳初、阮啸仙试点需1点；不足则暂缓本案。当前项目材料[?ROC_bill_economic_support|0]／所需[?ROC_bill_sector_requirement|0]。"
 ROC_bill_signatures_tt:0 "花费§Y20政治点§!议定项目保障：技术材料+2，行政执行保障+1。对应政策基础使两层各+1；项目材料达到本案要求才进入会签。预算与权限的中央协商另行进行。当前项目材料[?ROC_bill_economic_support|0]／所需[?ROC_bill_sector_requirement|0]。"
 ROC_bill_party_tt:0 "按既有政策授权办理，无额外准备费用；对应政策基础使技术材料和行政准备各+1。项目技术材料仍须达到本案要求，否则暂缓办理。当前技术材料[?ROC_bill_economic_support|0]／所需[?ROC_bill_sector_requirement|0]。"
 ROC_bill_vote_tt:0 "财政核账与部门会签：试点准备门槛2，扩建3；任期第二/第三阶段执行经验+1，180日审计监督使门槛+1。行政准备达标则免费取得批文，否则搁置。准备[?ROC_bill_support|0]／门槛[?ROC_bill_requirement|0]；项目技术材料[?ROC_bill_economic_support|0]。"
 ROC_bill_conditional_tt:0 "项目技术材料至少2、行政准备至少门槛减1且备有20政治点：花费§Y20政治点§!取得附条件批文，留下§Y180日审计监督§!，后案行政门槛+1。项目收益与原工期保留。"
 ROC_bill_force_tt:0 "项目材料至少2且行政准备至少门槛减1，强推花费§Y20政治点§!、稳定度§R−2个百分点§!并取得批文。否则花费§R30政治点、3个百分点稳定度§!，审计监督180日，项目失败。中央党派态度和委员会议程不替代本案门槛。"
 ROC_bill_withdraw_tt:0 "撤回本案，无追加处罚。已花政治点不退，90日提案间隔继续计算。"
 ROC_bill_cooperation_available_tt:0 "既有合作保留原收益与180日记录；合作记录不替代项目材料、中央预算协商或部门会签。"
 ROC_bill_basis_present_tt:0 "§G对应政策已有实施基础：技术材料与行政准备各+1。§!"
 ROC_bill_basis_absent_tt:0 "§Y缺少对应政策的实施基础；可核实成本或议定项目保障。§!"
 ROC_bill_stale_close:0 "此案已失效，收起文件。"
 ROC_bill_stale_close_tt:0 "仅关闭过期文件，不改变当前其他议案、政治点或稳定度。"

