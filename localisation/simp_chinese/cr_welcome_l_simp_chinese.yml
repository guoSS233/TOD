 welcome_body_tt_11: "　　欢迎游玩§3亢龙有悔§! §!\n\n　　本MOD是由来自中国的钢铁雄心4玩家制作的架空历史向MOD，“亢龙有悔”世界线旨在描绘一个“不同地走向近代”的世界图景，全球化、工业化与思想进步建立在东西方文明的“平等”交流往来之上，现代化的范式定义不再限于西方语境；其中，作为“钢铁雄心4”的模组，开局时间设定在1936年。彼时世界主要被20世纪初“世界大战”的两个最大赢家——明帝国和法兰西王国所建立的两大国际政治体系所统治；失败者和被压迫者则与体系若即若离，蛰伏发展，等待时机；数场革命接踵而至，或是不幸在多方绞杀下失败，抑或在不屈的人民保护下连绵不绝。历经大战后的黄金年代，人们憧憬着永恒的和平与繁荣，帝国则谋划着如何享用瓜分的蛋糕。无数人相信，经济和政治上的“小小挫折”难以阻止飞驰的文明列车，一两场“钱荒”或“萧条”只是暂时的停顿，而在此之后又将是一个崭新的时代。直至1936年，两条巨龙已飞跃层层天险，登临亘古未有的巅峰。但巅峰之下不散的阴云，正在孕育变革的力量。究竟是是克服危机，再造辉煌；抑或盛极而衰，神器更易，关键正在此时。\n\n　　§R本版本仅供测试体验，用以收集玩家的反馈，不代表正式版的实际效果。本mod在代码、文案和图像制作中使用了AI进行辅助创作，请各位玩家注意甄别。§!\n\n　　§C打开音乐播放器内置电台，确认ui大小（用户界面缩放）为1.0×，关闭debug模式，以获得最佳游戏体验。§!\n\n　　特别鸣谢：CR制作组（提供了很多帮助，包括你现在看到的这个开局面板）、AOR制作组（提供了报纸界面的GUI）、霜泽图书馆\n\n\n\n　　如果想参与模组的讨论、加入模组制作，或者提前了解未发布的内容，可以加入我们的§GQQ群：707607655§!。"
 welcome_body_tt_41: "　　目前版本可供游玩的内容主要大明内战的相关势力。其中\n           §R红军§!\n           §O共和军§!\n           §Y顺天政府§!\n           §G七省联合§!\n　　为可玩程度程度相对较高的势力。\n           §g关东司§!\n           §3四川§!\n           §5西北军§!\n           的可完成度相对次之。西南都督府、岭北都司则尚无可玩内容。 \n游玩路线指引：\n　　§R红军§!：红军需要各位玩家在1937年1月1日的事件中，选择切换到关东招抚司，之后可通过事件在红军起义后扮演红军进行游玩。\n　　§O共和军§!：共和军需要各位玩家在1937年2月1日的事件中，选择切换到华南招抚司，之后可通过系列事件，变身共和军进行游玩。\n七省联合、顺天政府、关东司、四川、西北军：\n　　以上势力需要各位玩家在对应的事件中，选择扮演对应势力即可。"

###大明########################
 welcome_body_tt_31_MNG: "1936年的大明政坛风云诡谲，咨议局内宪政会各大派系之间因庚午钱荒而造成的分歧愈演愈烈，并且有向着政府官员蔓延的趋势。想要顺利解决大明面临的问题，就必须对于大明朝堂上的各个派系有所了解。\n\n\n"

#################################################
welcome_body_tt_21: "我们不知道历史具体从何处发生了偏转，也许是更加成功的宋代变法，也许是元时愈发繁盛的海外贸易，也许是什么更加久远的历史细节。但不论具体什么原因，自太祖收服方国珍、陈友定等闽浙军阀以来，就十分重视中土与海外的商贸事宜，通过各种政治经济手段试图重整元代的海外贸易体系。在明帝国将蒙元重新驱赶回草原并予以重创后，朝廷进一步将各类贸易活动制度化、规范化，设立了一系列机构管理海外贸易。\n在永乐皇帝从太祖手中接过大明江山以后，除了加强对北疆东北的经略外，也进一步加强对海外的经略。庞大的下西洋舰队过后，一处处据点相继在台湾、吕宋、旧港等地建立起来。由于大明本土和欧洲对香料贸易的旺盛需求，在与欧洲人的商业竞争中，明国海商也尝试着在南洋一些地区开辟热带种植园，逐步发展为一些小型殖民地。\n历经仁宣英宪孝五朝的经营，大明在武宗年间迎来极盛，北扼鞑靼，西走瓦剌，东拓镇东，南控交趾，大明的商船穿行于东西贸易的航道之上，与远西的来客、天方的船主共同谱写出大航海的壮阔史诗。但随着贸易兴盛一同带来的，还有商品经济对于传统的社会结构的破坏。\n自万历以来，各地民变就开始此起彼伏地发生，明军对于起义军虽然无往不利，然而一个地区的叛乱往往是在多路会剿之后便马上死灰复燃。而到了天启年间，农民军更是已经遍及中原，甚至时常能隔断南北交通，而朝廷对此无能为力，只得命令各地兴办军备，设立军镇严防死守，同时调集大军多路不断追剿。然而各地农民军却在围剿之中不断壮大。天启二十一年二月，农民军攻破北京，熹宗自缢于煤山。天下大乱，各方势力割据一方，农民起义军虽有气吞中原之势，然而闯王高迎祥的意外离世使得本就派系林立的义军走向分裂，各地的军阀你方唱罢我登台。应天的皇帝没有一丝权威，监国的名号不断在各家之间辗转，尽管名头尚存，但大明朝已然名存实亡……\n随着出身底层却雄才伟略的烈祖朱企銮崛起，这场逐鹿中原的大戏终于落入尾声，烈祖于乙未年（1655）称帝于应天，年号大定，宣告再造大明重建社稷。被后世史学家称为“后明”的时代开始了。尽管烈祖本人宣称自身承袭明祚，但后明事实上已然成为了一个全新的王朝。\n长年的战争导致了许多的变化，比如燧发枪的普及、新式战术与西式棱堡体系的引进；比如朝廷不得不更依赖于商会来筹措资金，对于国内外贸易更加重视；比如科学技术的蓬勃发展，新兴思想的快速传播等等。借助这些力量，后明数代君主顺利建立起了一个统合中夏、辐射万邦的巨型帝国。大明天兵所到之处，不论是西域土扈特、北疆罗刹，还是南洋荷兰人、天竺英吉利，尽皆败于大明的兵锋之下。大明取得了此前历朝历代未能企及的文治武功。\n但在南征北战的赫赫武功，不断革新的煌煌文治之下，是悄然裂变的社会格局。经济作物的种植、手工工坊对于乡村纺织的逐步取代都使得城乡以来的经济联系更加紧密。各类技术的革新、生产资料的聚集以及庞大的海内外市场，更是使得许多城镇士绅们逐渐掌握了胜过土地士绅的力量。而自然经济崩解所产生的源源不断的流民也不断地动摇着帝国根基，正如前明万历以来的乱局，自端宗开始数十年的农民暴动与市民民变正是对于这种变化的回应。\n幸而天意不绝皇明，降圣祖于明室继承大统。圣祖景隆皇帝即位以来平乱局、革弊俗、行新政、兴工业，开言路、重教育。一系列改革举措使得大明一扫旧时颓唐之气，拉开了持续百年的“景至昌大改革”的序幕。其搭建的国有企业经济体制更是使万民一直受益至当下，是大明工业化的重要柱石。改士子议政的乡校为咨议局，也使得大明民众的不满情绪有了一个合法的表达渠道，为此后昌德皇帝的选举化改革打下了基础。除此之外，圣祖做的事还有很多，科举革新、教育推广、技术传播、对抗外夷、经略海外……他接手的是一个矛盾严重、千疮百孔的大明；而当他离开时，大明已然成为了一个有一定工业基础的近代国家。\n此后又经至和、昌德两朝，尽管其间部分政策有所反复，但在百姓们的不断抗争和皇帝官员的锐意改革之下，大明还是磕磕绊绊地走入了现代。咨议会中，峨冠博带的政客们侃侃而谈着江山社稷、万民福祉；政事堂内，手握重权的阁老督抚们商谈决定着大明的军国机要、国家未来；高楼大厦中，昼夜不眠的市民白领为了“体面生活”俯首于文件图纸之间；工厂阡陌内，汗流浃背的工人农民依旧为了生计艰苦奔波。\n金融的狂欢、火车的飞驰、现代社会的一切随着交通与资本在这土地上狂突猛进。然而，江浙沿海城市的纸醉金迷似乎与万里之外的西北乡村生活并无太大关联。这是一片内燃机与牛马驴骡，资本与封建，乡土与城镇，传统与现代共存的土地，这是最好的时代，这也是最坏的时代，欢迎来到亢龙有悔的世界，欢迎来到——1936年的大明！"

