 welcome_body_tt_11: "　　欢迎游玩§R Celestialreich: §3天兆之国§! §!\n\n　　本MOD是由来自中国的钢铁雄心4玩家制作的架空历史向MOD，包含了许多大胆的设想：§Y基于甲午战争而改变的东亚格局、列宁没有遇刺的苏联、苟延残喘的葡巴帝国、受列强严重干涉的西班牙内战、建立永久共和国联盟的美利坚……§!这些设想有的已经实装在了游戏里，有的还没有§Y（真的在做了！）§!。无论如何，我们都希望您能在接下来的游戏旅途里玩的开心！\n\n　　§R本版本仅供测试体验，用以收集玩家的反馈，不代表正式版的实际效果。§!\n\n　　§C打开音乐播放器内置电台，确认ui大小（用户界面缩放）为1.0×，关闭debug模式，以获得最佳游戏体验。§!\n\n\n\n　　§R注意：§!本MOD面向对§Y钢铁雄心4§!原版已经厌倦了的、对游戏具有一定理解水平的老玩家，对§Y游戏AI§!进行了不同程度的§R增强§!。若您是刚接触§Y钢铁雄心4§!的新玩家或轻量的休闲玩家，为了您的游戏体验，请酌情§G降低§!游戏难度。\n\n\n\n　　特别鸣谢：Yard1（提供了[AUS.GetNameWithFlag]的gui饼图代码）、LoveSnow（提供了AI方面的支持）、哲尔格（提供了文案、地图方面的帮助）、ZhiZhong_（授权整合了“核心领土显示”MOD）、NekawaH\n\n\n\n　　§YP.S.§!如果想参与模组的讨论、加入模组制作，或者提前了解未发布的内容，可以加入我们的§GQQ群：288418842§!。"
 welcome_body_tt_41: "　　百科全书、苏顾、阿列夫十八、洺、X-23、Säkkijärven polkka、菜鸟-色雷斯老农民、ra、鸭鸭什么都不知道、饶漱石、UMI、言生、兵卒无河、西北义和团、箜篌、ID莫愁、金田所、深渊漫步者、浅梦、Elysicot、五月星河、维齐尔、小雨、小梅、列兵、五啊五啊五、白黎、华莎、鱼饼、红色大闸蟹、猫饼堡、银鱼、Veni-Veni-Veni-Mi-Fili、Formosa-Libertad、Yoshino-TG、h9043、CMBullyMe、HeterogenKaiser、谢尔盖、涡轮消息、液态硅晶尤里卡、奶昔、雕之陨、亚拥\n\n　　§Y代码：§!阿列夫十八、深渊漫步者、五月星河、维齐尔、白黎、华莎、红色大闸蟹、猫饼堡、谢尔盖、亚拥\n\n　　§Y策划：§!苏顾、阿列夫十八、洺、X-23、Säkkijärven polkka、鸭鸭什么都不知道、UMI、言生、兵卒无河、西北义和团、箜篌、ID莫愁、金田所、深渊漫步者、浅梦、Elysicot、白黎、华莎、猫饼堡\n\n　　§Y文案：§!苏顾、阿列夫十八、洺、X-23、Säkkijärven polkka、菜鸟-色雷斯老农民、ra、鸭鸭什么都不知道、饶漱石、UMI、言生、兵卒无河、西北义和团、箜篌、ID莫愁、金田所、Elysicot、小雨、小梅、列兵、五啊五啊五、猫饼堡、亚拥\n\n　　§Y美工：§!阿列夫十八、饶漱石、西北义和团、白黎、华莎、鱼饼、涡轮消息、液态硅晶尤里卡、奶昔\n\n　　§Y资料官：§!菜鸟-色雷斯老农民\n\n　　§Y宣发：§!阿列夫十八、洺、言生\n\n　　§Y翻译：§!猫饼堡、银鱼、Veni-Veni-Veni-Mi-Fili、Formosa-Libertad、Yoshino-TG、h9043、CMBullyMe、HeterogenKaiser、雕之陨\n　　至此，感谢以上全体成员的付出，也感谢你们的游玩！"

###大明########################
 welcome_body_tt_31_MNG: "1936年的大明政坛风云诡谲，咨议局内宪政会各大派系之间因庚午钱荒而造成的分歧愈演愈烈，并且有向着政府官员蔓延的趋势。想要顺利解决大明面临的问题，就必须对于大明朝堂上的各个派系有所了解。\n\n\n"

#################################################
 welcome_body_tt_21: "历经历史的潮起潮落，大明朝这艘巨舰奇迹般地航行到了1936年，并成为了以泛夏地区为核心、势力辐射半个世界的超级霸主。南道山的金属矿产、周饶大陆的织物牛羊、中南半岛的蔗糖粮食、炎州日朝的初级工业品、波斯天方的石油、南洋兰芳的棕榈橡胶……来自各方的货物产品在天朝体系下分配交换，赤底金龙旗飘扬在四海八荒。一战的胜利更是使得大明站在整个世界的顶点，沐浴着历朝历代未能企及的巨大荣光。\n然而万国来朝、举世瞩目的背后，同样隐藏着巨大的危机。庚午钱荒的爆发重创了大明的政治经济，匮乏的经费造成军队作战能力的不断下滑，咨议局中各大派系对抗撕裂日趋严重。在体系之外，工协农协等社会组织趁朝廷无暇顾及之际迅速壮大，大同会、同产工会等反叛势力也不断采取各种活动企图颠覆朝廷，各类罢工抗议活动在全国范围内层出不穷。\n所幸，伟大的昌德陛下作为舵手依旧牢牢地把控着大明这艘巨舰的行驶。这位御极天下接近半百之久的天子身体依旧硬朗，而太子殿下更是成长为了杰出的接班人，文韬武略皆有所成，亲厚百姓的行事作风更是使得其深受万民爱戴。各路宵小只得藏匿于暗处苟延残喘，待到庚午钱荒的余波散去便将自行消亡！\n我们不知道历史具体从何处发生了偏转，也许是更加成功的宋代变法，也许是元时愈发繁盛的海外贸易，也许是什么更加久远的历史细节。但不论具体什么原因，自太祖收服方国珍、陈友定等闽浙军阀以来，就十分重视中土与海外的商贸事宜，通过各种政治经济手段试图重整元代的海外贸易体系。在明帝国将蒙元重新驱赶回草原并予以重创后，朝廷进一步将各类贸易活动制度化、规范化，设立了一系列机构管理海外贸易。\n在永乐皇帝从太祖手中接过大明江山以后，除了加强对北疆东北的经略外，也进一步加强对海外的经略。庞大的下西洋舰队过后，一处处据点相继在台湾、吕宋、旧港等地建立起来。由于大明本土和欧洲对香料贸易的旺盛需求，在与欧洲人的商业竞争中，明国海商也尝试着在南洋一些地区开辟热带种植园，逐步发展为一些小型殖民地。\n历经仁宣英宪孝五朝的经营，大明在武宗年间迎来极盛，北扼鞑靼，西走瓦剌，东拓镇东，南控交趾，大明的商船穿行于东西贸易的航道之上，与远西的来客、天方的船主共同谱写出大航海的壮阔史诗。但随着贸易兴盛一同带来的，还有商品经济对于传统的社会结构的破坏。\n自万历以来，各地民变就开始此起彼伏地发生，明军对于起义军虽然无往不利，然而一个地区的叛乱往往是在多路会剿之后便马上死灰复燃。而到了天启年间，农民军更是已经遍及中原，甚至时常能隔断南北交通，而朝廷对此无能为力，只得命令各地兴办军备，设立军镇严防死守，同时调集大军多路不断追剿。然而各地农民军却在围剿之中不断壮大。天启二十一年二月，农民军攻破北京，熹宗自缢于煤山。天下大乱，各方势力割据一方，农民起义军虽有气吞中原之势，然而闯王高迎祥的意外离世使得本就派系林立的义军走向分裂，各地的军阀你方唱罢我登台。应天的皇帝没有一丝权威，监国的名号不断在各家之间辗转，尽管名头尚存，但大明朝已然名存实亡……\n随着出身底层却雄才伟略的烈祖朱企銮崛起，这场逐鹿中原的大戏终于落入尾声，烈祖于乙未年（1655）称帝于应天，年号大定，宣告再造大明重建社稷。各外藩国纷纷来朝，青丘、炎洲二地也以外藩礼节来贺，明廷也默认了这种行为。被后世史学家称为“后明”的时代开始了（与此相对应的则是自洪武元年至天启二十一年的“前明”）。尽管烈祖本人宣称自身承袭明祚，但后明事实上已然成为了一个全新的王朝。\n长年的战争导致了许多的变化，比如燧发枪的普及、新式战术与西式棱堡体系的引进；比如朝廷不得不更依赖于商会来筹措资金，对于国内外贸易更加重视；比如科学技术的蓬勃发展，新兴思想的快速传播等等。借助这些力量，后明数代君主顺利建立起了一个统合中夏、辐射万邦的巨型帝国。大明天兵所到之处，不论是西域土扈特、北疆罗刹，还是南洋荷兰人、天竺英吉利，尽皆败于大明的兵锋之下。大明取得了此前历朝历代未能企及的文治武功。\n但在南征北战的赫赫武功，不断革新的煌煌文治之下，是悄然裂变的社会格局。经济作物的种植、手工工坊对于乡村纺织的逐步取代都使得城乡以来的经济联系更加紧密。各类技术的革新、生产资料的聚集以及庞大的海内外市场，更是使得许多城镇士绅们逐渐掌握了胜过土地士绅的力量。而自然经济崩解所产生的源源不断的流民也不断地动摇着帝国根基，正如前明万历以来的乱局，自端宗开始数十年的农民暴动与市民民变正是对于这种变化的回应。\n幸而天意不绝皇明，降圣祖于明室继承大统。圣祖景隆皇帝即位以来平乱局、革弊俗、行新政、兴工业，开言路、重教育。一系列改革举措使得大明一扫旧时颓唐之气，拉开了持续百年的“景至昌大改革”的序幕。其搭建的国有企业经济体制更是使万民一直受益至当下，是大明工业化的重要柱石。改士子议政的乡校为咨议局，也使得大明民众的不满情绪有了一个合法的表达渠道，为此后昌德皇帝的选举化改革打下了基础。除此之外，圣祖做的事还有很多，科举革新、教育推广、技术传播、对抗外夷、经略海外……他接手的是一个矛盾严重、千疮百孔的大明；而当他离开时，大明已然成为了一个有一定工业基础的近代国家。\n此后又经至和、昌德两朝，尽管其间部分政策有所反复，但在百姓们的不断抗争和皇帝官员的锐意改革之下，大明还是磕磕绊绊地走入了现代。咨议会中，峨冠博带的政客们侃侃而谈着江山社稷、万民福祉；政事堂内，手握重权的阁老督抚们商谈决定着大明的军国机要、国家未来；高楼大厦中，昼夜不眠的市民白领为了“体面生活”俯首于文件图纸之间；工厂阡陌内，汗流浃背的工人农民依旧为了生计艰苦奔波。\n金融的狂欢、火车的飞驰、现代社会的一切随着交通与资本在这土地上狂突猛进。然而，江浙沿海城市的纸醉金迷似乎与万里之外的西北乡村生活并无太大关联。这是一片内燃机与牛马驴骡，资本与封建，乡土与城镇，传统与现代共存的土地，这是最好的时代，这也是最坏的时代，欢迎来到亢龙有悔的世界，欢迎来到——1936年的大明！"

