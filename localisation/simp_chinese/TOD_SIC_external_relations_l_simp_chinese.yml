 SICEXT.90.t:0 "外部接洽作废"
 SICEXT.90.d:0 "接洽未在六十天内完成，或因战争、对方消失、共治斡旋时革命政权建立以及四川政治方向改变而失效。没有强行签署协议；省内政策仍可继续。"
