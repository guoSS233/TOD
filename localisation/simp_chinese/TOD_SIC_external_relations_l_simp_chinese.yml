 SICEXT.1.t:0 "宋教仁与地方清政系"
 SICEXT.1.d:0 "清政系已取得主导权。有人提议邀请宋教仁入川，以他的议会政治经验协助地方宪政。邀请需经本人及明政府同意；若他已经退出政坛、身居明国执政之位、明国消失或彼此交战，则由本地人才继续主持。到来与否均不影响既有改革道路。"
 SICEXT.1.a:0 "默认邀请宋教仁协助清政（由明方决定）"
 SICEXT.1.b:0 "由地方清政人才继续改革"
 SICEXT.2.t:0 "四川邀请宋教仁"
 SICEXT.2.d:0 "四川清政系希望宋教仁入川协助议会与宪政建设。明政府可以允许他自愿赴川，也可以保留这位政治人物。允许赴川将真实转移宋教仁的国家归属，不会产生另一位宋教仁。"
 SICEXT.2.a:0 "同意宋教仁自愿入川"
 SICEXT.2.b:0 "拒绝，宋教仁继续留明"
 SICEXT.3.t:0 "宋教仁抵达四川"
 SICEXT.3.d:0 "宋教仁已获准入川，并出任自由民主派领袖。他将协助地方清政系推进议会建设：获得35政治点数，宪政进度增加3。地方改革仍由四川的既有制度继续实施。"
 SICEXT.3.a:0 "共同推进四川宪政"
 SICEXT.4.t:0 "地方清政人才继续执政"
 SICEXT.4.d:0 "宋教仁没有入川。清政系将依靠本地人才推进预算公开、责任内阁和宪法建设，既有国策与改革决议继续开放。"
 SICEXT.4.a:0 "继续地方宪政建设"
 SICEXT.10.t:0 "四川提出政治协定"
 SICEXT.10.d:0 "四川希望与我方商议政治协定。我们可表示支持、要求更大的省内政策让步，或拒绝。最终仍由四川确认。确认后我方支付25政治点数，附加条件时支付40政治点数；四川的民众不满和工业危机将各下降5。"
 SICEXT.10.a:0 "愿意支持，交由四川确认"
 SICEXT.10.b:0 "支持，但要求政策让步"
 SICEXT.10.c:0 "不接受提议／接洽已失效"
 SICEXT.11.t:0 "七省回复四川"
 SICEXT.11.d:0 "七省愿意支持。四川获得25政治点数，建制派影响增加8；民众不满与工业危机各下降5。双方签署互不侵犯约，七省成为唯一政治伙伴；四川停止对七省的制宪通牒。四川可确认，也可放弃。"
 SICEXT.11.conditional:0 "七省附加了条件：四川须让出部分军事政策主动权，支付40政治点数，战争支持度减少2%，武备影响减少5，建制派影响增加15。宪政进度减少5。民众不满与工业危机仍各下降5。双方签署互不侵犯约，七省成为唯一政治伙伴；四川停止对七省的制宪通牒。四川可接受或拒绝。"
 SICEXT.11.a:0 "确认回复所列条件"
 SICEXT.11.b:0 "拒绝条件／结束失效接洽"
 SICEXT.12.t:0 "七省拒绝接洽"
 SICEXT.12.d:0 "七省拒绝了四川的请求。不会签署协议或发放援助，四川可以继续省内政策，亦可接洽另一方。"
 SICEXT.12.a:0 "继续四川自己的道路"
