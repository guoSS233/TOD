l_simp_chinese:
 SIC_external_category:0 "外部联系与省内妥协"
 SIC_external_category_desc:0 "清政取得主导权后，可与七省或共和军商议政治协定；三派共治持续至少六个月，也可请求有限援助与斡旋。每个对象、每种用途只能接洽一次，且一次只处理一项提议。六十天内未完成的接洽作废。政治协定只能选择一个伙伴；普通斡旋不会自动结盟。"
 SIC_external_contact_GOS_political:0 "向七省商议清政政治协定"
 SIC_external_contact_GOS_political_desc:0 "花费35政治点数提出一次请求。需双方存在、未互相交战且能自主决策；清政政治协议还要求没有与另一对象的互不侵犯约及正在计时的对其制宪通牒。对方可支持、附加条件或拒绝，四川仍可拒绝回包。所有结算限于原来的政治状态和六十日内。"
 SIC_external_GOS_political_terms_tt:0 "支持改善民众不满与工业危机各5点，并增加建制派影响8点、政治点数25。若接受附加条件，改为建制派影响增加15、武备影响减少5、政治点数减少40、战争支持度减少2%。签署互不侵犯约、记为唯一政治伙伴并停止对伙伴的制宪通牒。附条件时宪政进度减少5。对方承担25政治点数；附条件时承担40点。"
