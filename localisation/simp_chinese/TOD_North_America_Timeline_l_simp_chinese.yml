l_simp_chinese:

 TOD_NA_ATLANTIC_ALLIANCE:0 "大西洋联盟"

 north_america.hidden.a:0 " "

 north_america.1.t:0 "马歇尔就任美国总统"
 north_america.1.d:0 "1936年1月20日，乔治·卡特利特·马歇尔在费城正式宣誓就任美利坚合众国第三十二任总统。自1920年联邦军以“恢复国家统一”为名接管政权以来，美国已连续十六年处于军人政府的直接统治之下。马歇尔在就职演说中强调“纪律与秩序高于一切”，并宣布将加速推进铁路与军工现代化。路易斯安那外交部未予置评，但边境驻军的戒备状态并未放松。欧洲各国对此反应冷淡，而伦敦方面则谨慎表示“期待与新政府保持务实合作”。"
 north_america.1.a:0 "他们还有完没完？"
 north_america.1.b:0 "强权依然统治着美利坚"

 north_america.2.t:0 "新奥尔良股市崩盘"
 north_america.2.d:0 "1936年2月4日，新奥尔良证券交易所开盘即遭恐慌性抛售，蓝筹股在短短数小时内暴跌32%，创下路易斯安那建国以来最大单日跌幅。银行挤兑潮迅速蔓延至巴吞鲁日、阿莱斯城和圣路易斯。经济部长紧急出面安抚市场，但投资者信心已荡然无存。自1934年以来勉强维持的执政联盟——自由党、联邦前进党与左翼行动党的脆弱合作——正面临解体风险。反对党纷纷借机发难，议会一片哗然，不信任动议已在酝酿之中。总理府至今保持沉默。\n\n这场经济灾难无疑是对全世界低迷经济的又一次重击，但由于路易斯安那的政治影响力和经济总量在全球范围内尚没有明王朝那么大，或许最严重的影响也将仅限于美洲。"
 north_america.2.a:0 "全完了，我们全完了。"
 north_america.2.b:0 "我们的机遇已经在地平线上了"
 north_america.2.c:0 "那我们的生意怎么办？"
 north_america.2.e:0 "看来北美即将变天了"

 north_america.3.t:0 "路易斯安那陷入暴力抗议浪潮"
 north_america.3.d:0 "1936年7月29日，自2月股市崩盘以来政府推出的所有经济纾困措施被正式宣告失败。失业率攀升至27%，银行倒闭潮已波及十二个州。在总理府与左翼行动党达成妥协后，政府宣布将实施一项激进的经济干预方案：对主要工业实行临时国有化、设立国家就业工程局以吸纳失业人口、并对高收入阶层征收紧急财富税。然而这一系列措施虽然部分平息民怨，但彻底点燃了右翼积蓄已久的怒火。从新奥尔良到阿莱斯城，从圣路易斯到丹佛，全国各大城市爆发了右翼大规模抗议活动，反对政府的“社会主义行径”。部分极左翼分子也上街进行反抗议，暴力冲突层出不穷，警方已无法维持基本秩序。"
 north_america.3.a:0 "现在到底该怎么办"
 north_america.3.b:0 "路易斯安那在燃烧"

 north_america.4.t:0 "路易斯安那陷入暴力抗议浪潮"
 north_america.4.d:0 "1936年7月29日，自2月股市崩盘以来政府推出的所有经济纾困措施被正式宣告失败。失业率攀升至27%，银行倒闭潮已波及十二个州。在总理府与联邦前进党达成妥协后，政府宣布将转向财政保守主义路线：削减公共开支、平衡预算、降低企业税率以刺激投资，同时呼吁国民“团结忍耐、共渡难关”。然而这一系列措施非但未能平息民怨，反而彻底点燃了积蓄已久的怒火。从新奥尔良到阿莱斯城，从圣路易斯到丹佛，全国各大城市爆发了工人大规模抗议活动和大罢工。极左与极右翼团体在街头展开暴力冲突，警方已无法维持基本秩序。"

 north_america.5.t:0 "路易斯安那政府垮台！"
 north_america.5.d:0 "1936年8月12日，阿莱斯城传来消息。路易斯安那军队最高指挥部发表声明，称“在当前的宪政危机下，军队无法在缺乏合法政治授权的情况下参与国内治安行动”，实质上拒绝了现政府要求军队镇压街头抗议的请求。同日上午，执政联盟伙伴——联邦前进党与左翼行动党——相继宣布退出由自由党领导的联合政府，彻底剥夺了总理执政的议会基础。当天下午，众议院以230票赞成、70票反对的压倒性多数通过了对总理的不信任案。总理随即被迫辞职。在军方协调下，一个由各党派代表组成的临时看守政府宣告成立，并宣布将于9月17日举行全国大选，试图以最快速度恢复宪政秩序。"
 north_america.5.a:0 "也许一切还尚有希望"
 north_america.5.b:0 "他们的宪政传统难道要靠军队维持吗？"

 north_america.6.t:0 "美国完全掌控南方"
 north_america.6.d:0 "1936年8月22日，正当路易斯安那深陷政治危机之际，美国国会以惊人的速度通过了两项重要法案：一为结束南方军事分管、正式将南方各州纳入联邦行政体系的《统一重建法案》；另一则为授权总统以“行政接管”名义收复迈阿密港的决议案，美方称迈阿密为“美国佛罗里达领土不可分割的一部分”。路易斯安那驻军当天即进入戒备状态，双方军队在迈阿密以北的比斯坎湾沿线形成对峙，阿莱斯城临时看守政府发出紧急照会，称此举“严重侵犯路易斯安那主权”。\n\n然而仅仅一天之后，由于政局混乱加上路国军队高层不愿与美国发生大规模冲突，驻迈阿密守军便开始大规模海上撤离。数千名士兵和大量军用物资在未发一枪的情况下登船驶往巴吞鲁日。迈阿密市政厅于当晚升起美国国旗。华盛顿方面宣称这是“美国主权恢复的第一步”，而临时看守政府对此未作公开评论。"
 north_america.6.a:0 "美国佬看到了我们的软弱！"
 north_america.6.b:0 "虚弱的巨人让步了"
 north_america.6.c:0 "战后秩序逐渐走向崩塌"

 north_america.7.t:0 "路易斯安那极右翼政变流产"
 north_america.7.d:0 "1936年9月4日，北美统合党领导人约翰·史密斯在部分基层军官的支持下，于阿莱斯城郊区发动了一场名为“民族救亡进军”的政变行动。数日前他公开谴责临时看守政府“向华盛顿出卖国家利益”，号召支持者武装起来“恢复国家的脊梁”。然而这支向首都进发的队伍在城外检查站遭到忠于政府的军队以机枪扫射，队伍随即溃散。数名极右翼高层被当场逮捕，史密斯本人在混乱中向西逃窜，据报已越过边界进入犹他国境内。总理府随后发表简短声明，称“任何以暴力颠覆宪政秩序的行为都将遭到坚决回击”。"
 north_america.7.a:0 "他们不过是一群跳梁小丑"
 north_america.7.b:0 "或许他们重新走上了正轨"

 north_america.8.t:0 "人民阵线赢得路易斯安那大选"
 north_america.8.d:0 "1936年9月17日，路易斯安那全国大选在紧张气氛中如期举行。尽管一些支持北美统合党的基层军官在此前发动了未遂政变，但选举过程基本平稳。受政变丑闻波及，由路易斯安那人民合作阵线与联邦前进党组成的保守主义右翼联盟得票率大幅下滑，大量选民倒向左翼阵营。最终，由左翼行动党与路易斯安那社会主义工党组成的人民阵线以压倒性优势赢得众议院多数席位，成功组建左翼联合政府。新总理拉福莱特在胜选演说中承诺“将权力归还给人民”，并宣布将推出一项全面的经济振兴计划，包括重启国有化议程、扩大社会福利体系、大规模公共工程以创造就业机会、以及通过政府主导的产业政策刺激工农业复苏。在外交上，新政府誓言对美国采取强硬立场，明确拒绝承认华盛顿对迈阿密地区的单方面吞并，称其为“赤裸裸的侵略行径”。"
 north_america.8.a:0 "向左转！"
 north_america.8.b:0 "路易斯安那的堕落由此可见"
 north_america.8.c:0 "又一个社会主义国家？在北美？"

 north_america.9.t:0 "英美结成大西洋联盟"
 north_america.9.d:0 "1937年4月20日，华盛顿与伦敦在费城正式签署《美英共同防御协定》，宣布建立全面军事同盟关系。根据协定，两国将在北大西洋与北美大陆实行联合防务部署，共享海军基地与军事技术，并承诺“任何一方遭受攻击时另一方将予以全力支援”。舆论普遍认为，此举是两国对战后秩序不满的直接回应。在上次大战中兵戎相见的英美终于在对战后秩序的不满中走到了一起，英美双方在声明中未点名路易斯安那，但明确表示“决不允许任何势力破坏北美地区的既有秩序”。路易斯安那外交部当晚发表声明，称该协定“将严重加剧地区紧张”，并呼吁国际社会警惕“失败国家对战后秩序的挑衅”。"
 north_america.9.a:0 "昂撒人最终还是走到了一起"

 north_america.10.t:0 "法路防守联盟成立"
 north_america.10.d:0 "1937年5月20日，路易斯安那总理与法兰西共和国总理在巴黎签署《法路共同防御协定》，宣布建立全面的军事与政治同盟关系。双方承诺共同捍卫第一次北美战争后确立的西半球秩序，反对任何外部势力以武力改变现有边界。法国方面明确表示支持路易斯安那在迈阿密问题上的立场，并宣布将加强在加勒比海地区的军事存在。路易斯安那总理在签字仪式上表示：“我们与法国有着三百年的历史纽带，今日我们再次站在一起，抵御任何试图破坏我们共同安全的势力。”分析认为，此举旨在抗衡一个月前成立的英美军事同盟。"
 north_america.10.a:0 "老同盟重回旧路"

 north_america.11.t:0 "路易斯安那转向德国"
 north_america.11.d:0 "1937年5月20日，阿莱斯城传出惊人消息。在与法国就大西洋防务与殖民地权益问题谈判破裂后，路易斯安那社会主义工党成功说服左翼行动党，将外交方向转向欧洲另一极。路易斯安那政府当天宣布与德国及共产国际阵营签署《社会主义团结协定》，正式加入社会主义阵营。新协议承诺路易斯安那将推行彻底的工业国有化与土地改革，并接受来自社会主义国家的军事与经济援助。路易斯安那总理在声明中表示：“我们选择站在人类进步的一边，而不是帝国主义战争的边缘。”英美法各国对此表示强烈抗议。"
 north_america.11.a:0 "可他们不是“温和派”吗？"

 north_america.12.t:0 "路易斯安那宣布独立面对挑战"
 north_america.12.d:0 "1937年5月20日，路易斯安那总理在阿莱斯城发表全国讲话，宣布在与法国和德国阵营的谈判均未能达成共识后，路易斯安那将选择一条独立的道路：既不加入任何军事同盟，也不寻求外部大国的保护。总理表示：“路易斯安那共和国三百年来的生存从未依靠过任何外国势力的施舍。我们将依靠自己的力量保卫每一寸土地，依靠人民的团结度过每一次危机。”讲话同时宣布将立即启动一项紧急国防现代化计划，包括扩大陆军规模、加速海军建设，并鼓励本土军工产业发展。舆论普遍认为，这是一场高风险赌博。"
 north_america.12.a:0 "让我们看看孤立会带来什么"

 north_america.13.t:0 "第六次北美战争爆发"
 north_america.13.d:0 "1939年12月1日，美国在没有发出最后通牒的情况下，对路易斯安那共和国全面宣战，并发动了自第五次北美战争以来最大规模的地面进攻。\n\n阿莱斯城紧急召开国会会议，总理在讲话中痛斥美国的“赤裸裸侵略行径”，并宣布全国进入战争状态。由于路易斯安那此前没有与德法任何一方达成同盟条约，此次战争注定将是一场孤军奋战。总统签署了总动员令，号召全体国民“为保卫三百年的自由而战”。"
 north_america.13.a:0 "为三百年的自由而战"
 north_america.13.b:0 "统一北美的时候到了"
 north_america.13.c:0 "北美再次陷入战火"

 north_america.50.t:0 "加勒比的抉择"
 north_america.50.d:0 "第六次北美战争爆发后，加勒比联邦立刻成为美路双方争取的对象。路易斯安那海军仍在群岛和港口中保有长期影响，美国则以南方与迈阿密的行政接管为筹码，要求加勒比当局不要站在阿莱斯城一边。议会必须在战争扩大前作出决定。"
 north_america.50.a:0 "站在路易斯安那一边"
 north_america.50.b:0 "向美国靠拢"
