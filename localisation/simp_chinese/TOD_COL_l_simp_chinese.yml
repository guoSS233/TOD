### 大哥伦比亚事件 ###
VEN_east_colombia_transition_government:0 "东哥伦比亚临时过渡政府"
VEN_east_colombia_transition_government_DEF:0 "东哥伦比亚临时过渡政府"
VEN_east_colombia_transition_government_ADJ:0 "东哥伦比亚"
revenge_alliance:0 "复仇同盟"
TOD_COL.1.t:0 "大哥伦比亚-法兰西谈判"
TOD_COL.1.d:0 "大哥伦比亚当局就东哥伦比亚问题向法兰西政府开启外交谈判。东哥伦比亚地区自上次战争以来便一直处于法兰西王国的军事管制之下，由法国驻卡宴总督府直接管辖。然而，大哥伦比亚共和国从未放弃对该地区的主权声索。随着泛道山体系的崛起和南美局势的微妙变化，波哥大当局终于下定决心，向巴黎正式提出外交照会，要求就东哥伦比亚的最终地位问题开启谈判。\n\n“历史的天平正在转动，”大哥伦比亚外交部长在国会宣布，“我们不能永远容忍法国三色旗在我们宣称的领土上空飘扬。”巴黎方面起初保持沉默。但出乎意料的是，法兰西外交部最终回应：同意谈判。消息传来，波哥大一片欢腾。"
TOD_COL.1.a:0 "法兰西同意谈判"
TOD_COL.2.t:0 "波哥大会谈"
TOD_COL.2.d:0 "法兰西代表团抵达波哥大，就东哥伦比亚军管区的未来进行谈判。大哥伦比亚的诉求十分明确：法国撤出东哥伦比亚，将该地区的行政管理权完整移交。作为补偿，波哥大愿意承认法国在加勒比海诸岛的主权，并允许法国资本继续参与东哥伦比亚的矿产与林业开发。\n\n谈判初期陷入僵局。法国代表坚持，东哥伦比亚是法兰西帝国在美洲的战略支点，不能轻易放弃。然而，另一则消息从巴黎传来：大明帝国在南大西洋的军事演习正在升级。在此背景下，维持一块隔着大西洋的军管区变得愈发昂贵且危险。"
TOD_COL.2.a:0 "再见，高卢人"
TOD_COL.3.t:0 "东哥伦比亚公投"
TOD_COL.3.d:0 "东哥伦比亚就是否回归问题开启公投。临时过渡政府成立四个多月后，关于东哥伦比亚最终归属的公投如期举行。这是大哥伦比亚政府与巴黎之间达成的承诺：让当地居民以投票表达意愿。\n\n投票日，从圣菲波哥大逃难而来的东哥伦比亚家族后裔，与长期生活在热带雨林中的混血农民、黄金矿工、橡胶采集者一同走向投票站。支持回归的海报贴满了街头，反对者则在教堂门口低声祈祷。公投结果在次日清晨公布：赞成回归的比例高达72%，反对票集中在少数边境城镇。\n\n“东哥伦比亚回归祖国怀抱！”大哥伦比亚总统在波哥大总统府阳台上宣布时，眼含热泪。而法国巴黎方面则平静地发表声明：“尊重公投结果。”东哥伦比亚——这个被法国军管了数十年的地区，终于在地图上重新染上大哥伦比亚的颜色。"
TOD_COL.3.a:0 "东哥伦比亚回归祖国怀抱"
TOD_COL.4.t:0 "波帕扬会议"
TOD_COL.4.d:0 "埃塞奎博危机的阴影尚未散去，大哥伦比亚与巴西在考卡山谷省首府波帕扬举行高层会晤。巴西外交部长与大哥伦比亚外交部长签署《波帕扬协定》，正式确立两国“战略伙伴关系”。\n\n协定核心内容：双方承诺在对方遭受第三方军事攻击时提供支持，开放军事基地供对方使用，协调对泛道山联盟的政策立场，并推动两国经济一体化。面对泛道山联盟的迅速扩张——南道山主导的联盟已涵盖四方王国、巴拉圭联合王国，并正在向南华自由邦施加影响力——巴西与哥伦比亚感到前所未有的战略压力。\n\n波帕扬会议在极其低调的氛围中召开，但与会者的级别暴露了其重要性。消息泄露后，布宜诺斯艾利斯的流亡报纸以“南美自由的新希望”为标题报道此事，而岭兰府的官方媒体则保持了谨慎的沉默。"
TOD_COL.4.a:0 "哥伦比亚与巴西将站在一起"
TOD_COL.5.t:0 "哥伦比亚-巴西对南华自由邦宣战"
TOD_COL.5.d:0 "波帕扬会议结束两个月后，大哥伦比亚与巴西的联合军事行动正式拉开序幕。1940年2月14日，大哥伦比亚以“历史权利”为由，巴西以“南华自由邦庇护危害巴西稳定的势力”为名，两国同时向南华自由邦宣战。\n\n埃塞奎博地区争端由此升级为区域性战争。南华自由邦无力单独抵抗两个强国的联合进攻，其武装力量仅有数千人，缺乏重型装备。唯一的希望在于泛道山联盟的反应——但此时大明帝国内战已全面爆发，天朝体系名存实亡，泛道山联盟能否跨越整个南美洲去支援一个尚未正式加入联盟的半华人邦国，仍然是一个巨大的问号。"
TOD_COL.5.a:0 "我们必须对四方王国方向的异动保持警惕"
TOD_COL.6.t:0 "哥伦比亚炮击厄瓜多尔地区"
TOD_COL.6.d:0 "自1940年2月14日哥巴联军对南华自由邦宣战以来，南美大陆的局势急剧升温。泛道山联盟虽未正式参战，但通过派遣军事顾问、提供武器装备等方式向南华自由邦提供支持。这种“灰色地带”介入使大哥伦比亚深感威胁——其西翼与四方王国接壤的边境线上，四方王国军队正在集结。\n\n波哥大方面认为必须将战争范围限定在埃塞奎博地区，不能任由四方王国在背后从容完成动员。于是，1940年3月2日凌晨，大哥伦比亚炮兵部队越过边境，向四方王国南部边境城镇昆卡地区进行猛烈炮击。炮弹划破夜空，在黎明前的黑暗中炸开成片火光。昆卡郊外的边防哨所首当其冲，紧接着是通往厄瓜多尔省会方向的公路与通讯设施。\n\n据不完全统计，炮击造成数十名四方王国军民伤亡。据四方王国知情人士透露，消息传至央城王宫时，萨帕·印卡·图卡·阿玛鲁六世正在与大臣们讨论边境增兵计划。"
TOD_COL.6.a:0 "道山的战火燃起依然无法避免"
