 ROC_committee_gui_focus_name_none:0 "无待议国策"
 ROC_committee.1.t:0 "秘书处的补正要求"
 ROC_committee.1.d:0 "几家未能列案的会社代表联名递上一份异议，反对[ROOT.ROC_committee_objection_target_name]继续占用会期。他们在纸上写得很客气：不是反对这条路线本身，只是担心发言席次一旦按现在的样子固定下来，提案方会把自己的路线一点点变成默认议程，别人再想开口，就只剩下旁听的位置。落款处没有大同党任何一派的章，只有三枚会社的印章并排盖着，印泥还新，像刚从前门递进来。\n\n秘书处接过去，没有谈路线，只谈程序。干事翻出议事规则，用铅笔在“送达顺序”和“审阅期限”两个词下面各划一道线，说这两项还没确认，按规程应当先补齐会议记录，再谈排案。路线之争就这样被改写成一桩程序复核：没有人反对议程本身，人人都只反对议程还没有被正确送达。会议室里谁也没有提高声音，纸页翻动得比争论还响。\n\n提案方代表坐在长桌另一端，说会期已经排定，重排等于让别的派别插队。会社代表不接这句话，只请秘书处把“补正”二字写进记录。秘书把空白纪要推到主席团面前，问是先给程序处留时间，还是请主席书面答复后再定复会。两页纸都摊在桌上，谁也没有先落笔；主席手里的茶杯放下又端起，终究没说话。会务处的人已经在门口核对下次会期的空档。"
 ROC_committee.1.a:0 "给程序处留出补正时间"
 ROC_committee.1.b:0 "主席书面答复并重排会期"
 ROC_committee.2.t:0 "迟迟未归档的意见书"
 ROC_committee.2.d:0 "未能列案的会社代表把一份少数派意见书递进秘书处，签名栏挤着十几家的名字。意见书写得直白：[ROOT.ROC_committee_objection_target_name]持续占用会期，把土地、工会和地方自治这些本可提上来的议题一次次挤到会尾，长此以往，他们在委员会里的实际席位就只剩一个空号。这封信没有一句提到大同党，只谈席次和会期，末尾却写得比正文更硬：先记录异议，再继续推进。\n\n秘书处收下信，干事当面点了签名，还客气地谢了一句，随后把信夹进“会前未登记”的卷宗。会前未登记，按《议事须知》第七条只能归档，不能排入本次议程。会社代表问，异议为什么不能先记录再推进；干事答，记录要等归档完成，归档要等会前登记，会前登记又已经错过了。一句话绕成一个圆，信纸在卷宗里躺得稳稳的。\n\n会社代表不肯走，请秘书处至少把“已收未议”四个字写进当次记录。秘书把记录本翻到新页，笔尖停住，说这一栏要不要写、写什么，得等主席先定。主席还没来，会务处的人先把会议名签换了，把上次休会的日期压在新日期下面。反对声和意见书一样，被收下，也被搁下；只有那本记录本还摊着，空着四格。门外又有别的会社递进一沓纸，干事照旧接过去，夹进卷宗。"
 ROC_committee.2.a:0 "给秘书处留出归档时间"
 ROC_committee.2.b:0 "主席答复，安排复会"
 ROC_committee.3.t:0 "临时休会与那张单子"
 ROC_committee.3.d:0 "几家未能列案的会社代表在会场上站了起来，反对[ROOT.ROC_committee_objection_target_name]继续占用会期，要求重排代表席次、保障提案权。他们不是大同党的人，只是在委员会里拿不到列案资格的会社；措辞仍旧是委员会里的那套客气话：不是要拦谁的议程，只是要一个能开口的位置。提案方代表没有让出哪怕一分钟的发言时间，只把讲稿又翻过一页，页角被攥得起了皱。\n\n主席团内部起了争执：一方主张按原定顺序继续，一方主张先回应会社。两边的理由都写在议事规则的同一条里，只是各挑各的半句念。秘书站在两排座位之间，把议事钟按停，宣布临时休会，理由是会议程序需要重新核对。他没有说核对什么，也没有说核对多久；复会的时间，写在他手里那张会务处的单子上，而那张单子还没有填日期。\n\n会社代表收拾起桌上的纸笔，提案方代表也合上讲稿。两边都以为休会只是几分钟的事，会务处却把会场的门一扇扇拉开，让茶水和走廊把这场争执稀释掉。主席在台上低声问秘书，下次会期空档在哪里；秘书翻开登记本，只答了一句：程序没核完，会期就没法定。门外的时钟响过一声，没有人去拨。会社代表在门口回头，看见自己的异议还压在主席团那摞文件的最下面。"
 ROC_committee.3.a:0 "给程序补正留时间"
 ROC_committee.3.b:0 "主席答复，即安排复会"
