 ROC_legislation.11.t:0 "担保人尚未签字"
 ROC_legislation.11.d:0 "于树德把《[ROOT.ROC_bill_name]》与逾期账本摆在桌上。劳动党中央代表先问，若款项拨给收购商，合作社和工人能否查到账目；合作社担保人则拒绝替商号欠款兜底，工商信贷代表催问秋粮收购款何时拨付。争议落在坏账、周转额度和担保上限。于树德要求财政经办核实借款去向，再请中央代表把预算顺序与监督权限写入纪要；行业双方只签认借款和付款事实，未谈妥的授权不能送财政会签。"
 ROC_legislation.11.a:0 "核对逾期借款与收购价格"
 ROC_legislation.11.b:0 "约定担保上限与逾期复核"
 ROC_legislation.11.c:0 "依既有信贷政策办理"
 ROC_legislation.12.t:0 "预算条款齐备，签字仍未到齐"
 ROC_legislation.12.desc:0 "《[ROOT.ROC_bill_name]》已取得项目方签收，财政处却把付款凭证退回：担保清单没有坏账核销负责人，收购商号也未确认垫付款日期。于树德要求把拨款节点、逾期复核和担保上限并成一张会签单。劳动党中央代表要先写明合作社的核账权限，中华民主同盟代表则追问商号垫款何时偿还；合作社代表只愿签认成员名单。财政经办在“谁先盖章”一栏互相退件，中央的预算与权限还没有定稿。"
 ROC_legislation.12.a:0 "依会签材料正式办理"
 ROC_legislation.12.b:0 "附复核期限后有条件办理"
 ROC_legislation.12.c:0 "强令部门照原案执行"
 ROC_legislation.12.d:0 "撤回方案，重新核验材料"

 ROC_legislation.21.t:0 "表格上没有这一栏"
 ROC_legislation.21.d:0 "晏阳初把县里三份申请摊开：有人要夜校，有人修路，还有人等农业技术员，预算却只有一笔。社会党中央代表问，财政是否愿意优先保障乡村教育与生产条件；中华民主同盟代表追问各县如何公开排序。经办员递上受益人数、路程和可用人手的调查表，晏阳初要求县乡承办方核实工期与验收责任。基层只提供事实，拨款顺序和监督权限仍待中央代表谈妥。"
 ROC_legislation.21.a:0 "逐县核对需求、工期与预算"
 ROC_legislation.21.b:0 "先定承办县并签清执行责任"
 ROC_legislation.21.c:0 "依既有乡建政策继续办理"
 ROC_legislation.22.t:0 "县里签了字，省厅还在退件"
 ROC_legislation.22.desc:0 "县表列出夜校、道路和农技员三项需求，省财政只批了一个总数。晏阳初要求把拨款顺序、施工期限和验收责任分别写明；县里愿意认领工程，却等不到配套款。社会党中央代表要给学校和农技项目留出预算，中华民主同盟代表坚持先公布各县的排序依据。经办员把表格从教育科退到建设科，再退回财政处，理由总是缺一枚前置签章；基层愿意承担工期，中央却还没有确认谁能调整预算。"
 ROC_legislation.22.a:0 "依预算和承办单正式办理"
 ROC_legislation.22.b:0 "附分期验收与预算复核办理"
 ROC_legislation.22.c:0 "强令各部门按原案执行"
 ROC_legislation.22.d:0 "撤回方案，重访争议县"

 ROC_legislation.31.t:0 "请先证明账目可以审查"
 ROC_legislation.31.d:0 "阮啸仙核对《[ROOT.ROC_bill_name]》时发现仓库实存、采购未到货和工厂欠款各有一套账。劳动党中央代表要求工人监督席能查阅急件支出，社会党代表追问公共采购的优先次序；经营者则催着先放急件，财务处要求每张票据注明用途。阮啸仙允许急件凭据先行、事后复核，并把库存、欠款、工期分列。经营者只接受有期限的核销安排，中央代表还须把查账权限和预算边界写进纪要，成本审查才可进入会签。"
 ROC_legislation.31.a:0 "核实库存、采购与欠款凭证"
 ROC_legislation.31.b:0 "签明急件交接和复核期限"
 ROC_legislation.31.c:0 "依现有国营审计政策办理"
 ROC_legislation.32.t:0 "账本在几个处室之间来回传递"
 ROC_legislation.32.desc:0 "阮啸仙的清册列出仓库存量、未到货采购与工厂欠款。工业处只交复印件，说原始票据还在采购科；采购科又称未验收前不能入账。社会党中央代表要求公开采购与欠款的核对顺序，劳动党代表提出让工人监督席查看急件记录。阮把调阅权限、急件凭证和复核责任并进会签表。审计员不肯替厂方承担停产责任，厂方也不签空白停拨单；财政人员把“由谁复核”留作待办，中央席位的授权也尚未落笔。"
 ROC_legislation.32.a:0 "依账册和凭证正式办理"
 ROC_legislation.32.b:0 "附独立复核期限办理"
 ROC_legislation.32.c:0 "强令部门照原案执行"
 ROC_legislation.32.d:0 "撤回方案，另行整理凭证"

 ROC_legislation.41.t:0 "厂门内外的协商"
 ROC_legislation.41.d:0 "陈赞贤召集厂方与劳动保障代表核对管理权限。劳动党中央代表要求在生产协定中写入工人查阅安全记录的席位，中华民主同盟代表则问谁对停机决定和事故复核负责。工人要求看账，经营者担心出了事故却无人承担停产责任。陈赞贤把参与权拆成查阅、建议和共同确认，逐项写清责任；厂方只肯先开放安全账，中央预算和监督权限仍需两位代表协商。"
 ROC_legislation.41.a:0 "核对生产安全与事故责任"
 ROC_legislation.41.b:0 "签明查阅权限和复核期限"
 ROC_legislation.41.c:0 "依现有职工参与政策办理"
 ROC_legislation.42.t:0 "生产单和责任表都要盖章"
 ROC_legislation.42.desc:0 "厂方已开放安全账，工人代表要求把事故记录纳入生产计划。陈赞贤将查阅范围、停机决定和事故责任逐项写进执行单。劳动党中央代表愿意争取工人监督席，却要求部长说明所需经费；中华民主同盟代表坚持先限定可查资料和责任期限。工业处担心签字就要对停产负责，劳动保障署又因缺厂方负责人签名把表格退回。生产线照常运转，中央协定和责任栏都还空着。"
 ROC_legislation.42.a:0 "依安全记录和责任单正式办理"
 ROC_legislation.42.b:0 "附查阅范围与复核期限办理"
 ROC_legislation.42.c:0 "强令部门按原案扩大参与"
 ROC_legislation.42.d:0 "撤回方案，重拟厂务权限"

 ROC_legislation.51.t:0 "旧契约与新登记"
 ROC_legislation.51.d:0 "萧铮把地籍草图、旧契约和商号借据摆到桌上。社会党中央代表要求保障无清晰契据农户的春耕周转，中华民主同盟代表则希望保留小农取得民间信用的渠道。登记员不愿把界址不清的农户列入，商号担心冻结旧债会断掉周转。萧铮要求先复核地界、确认债务，再另列临时信用期限；农户与商号只签认各自的地权和借款事实，预算与监督条件仍须由中央代表谈定。"
 ROC_legislation.51.a:0 "核实界址、旧债与春耕信用"
 ROC_legislation.51.b:0 "约定核界期限和过渡信用"
 ROC_legislation.51.c:0 "依现有土地登记政策办理"
 ROC_legislation.52.t:0 "地籍与旧债，哪一科先落笔"
 ROC_legislation.52.desc:0 "萧铮把地籍图、旧契和春耕借据摊在登记窗口。地政科不肯登记界址不清的地块，信用社要求先确认旧债归属才续贷；农户担心核界期间错过播种，商号拒绝无限期缓还。社会党中央代表要求把复核期限写入保障条款，中华民主同盟代表希望信用渠道不因核界全部停摆。萧铮将界址复核、旧债确认和临时信用拆成三个签字栏，财政与地政经办只负责核验材料，中央预算和责任约定仍未签定。"
 ROC_legislation.52.a:0 "依地籍与债务核验正式办理"
 ROC_legislation.52.b:0 "附权属复核期限办理"
 ROC_legislation.52.c:0 "强令部门按原案扩大登记"
 ROC_legislation.52.d:0 "撤回方案，重核无契农户"

 ROC_legislation.101.t:0 "批文与执行单一并签发"
 ROC_legislation.101.d:0 "财政处已核定预算，主管部门在执行单上写明拨款节点与验收责任，项目代表也收到了会签副本。秘书将《[ROOT.ROC_bill_last_name]》的批文交回部长：准予办理，不等于项目已经开工。部长可据此安排实施，但仍须返回中央经济施政决议栏点击原项目并支付原实施费用。采购差价和工期变化仍应及时报账，执行责任归主管部门。"
 ROC_legislation.101.a:0 "收录决议并关闭通知"
 ROC_legislation.102.t:0 "批文附上核账与监督条件"
 ROC_legislation.102.d:0 "《[ROOT.ROC_bill_last_name]》获附监督条件的办理批文，随附核账期限与专项监督单。财政处列明拨款节点，主管部门须留存票据并定期报送，项目代表可按安排查阅执行记录。批文只允许部长安排后续实施，项目尚未启动；仍须返回中央经济施政决议栏点击原项目并支付原实施费用。行政手续完成，实施责任仍在部长与主管部门。"
 ROC_legislation.102.a:0 "收录条件并关闭通知"
 ROC_legislation.103.t:0 "材料尚不足以办理"
 ROC_legislation.103.d:0 "《[ROOT.ROC_bill_last_name]》未达到正式办理条件。成本核验、执行责任或部门签章仍有缺项，财政处暂不拨款。经办员把缺件清单退回提案组，要求补足后重新送核；案卷暂存待办，不视为正式否决。"
 ROC_legislation.103.a:0 "登记搁置并关闭通知"
 ROC_legislation.104.t:0 "强推原案引来审计追责"
 ROC_legislation.104.d:0 "部长坚持按原方案先行，主管部门虽接到指令，预算处却无法确认资金口径，项目办也没有明确验收人。报表互相矛盾后，审计人员暂停新拨款并追查签字责任。专项监督单被送回部长办公室；原想赶快开工，反让各部添了补账与说明的工作。"
 ROC_legislation.104.a:0 "登记反噬结果并关闭通知"

ROC_legislation_readiness_sector:0 "项目技术材料 [?ROC_bill_economic_support|0]/[?ROC_bill_sector_requirement|0]；行政准备 [?ROC_bill_support|0]/[?ROC_bill_requirement|0]。项目方核实成本与执行条件，中央预算和权限另行协商。"

ROC_legislation_outcome_sector_tabled:0 "项目技术材料尚未齐备，暂缓办理"

ROC_legislation.105.t:0 "项目材料尚未齐备"

 ROC_legislation.105.d:0 "《[ROOT.ROC_bill_last_name]》的项目成本和承接责任仍未形成书面材料。中央代表还在协商预算顺序与监督权限，项目方只在副本上签收，未认领具体手续；财政处无法确定拨款口径，主管部门也没有可执行的交接单。案卷暂缓归档，待中央约定与技术材料分别补齐后再重新提报。"

 ROC_legislation.105.a:0 "记下缺席的签名，暂存方案"

ROC_legislation_readiness_guarantee:0 "行政准备接近门槛，但项目技术材料未达附条件办理要求。技术材料 [?ROC_bill_economic_support|0]/2；行政准备 [?ROC_bill_support|0]/[?ROC_bill_requirement|0]。"
