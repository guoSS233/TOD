### leaders desc ###
### 拉普拉塔事件 ###
TOD_ARG.1.t:0 "胡斯托总统遇刺"
TOD_ARG.1.d:0 "胡斯托在布宜诺斯艾利斯出席军事检阅时，被一名伪装成记者的刺客近距离枪杀。刺客身份不明，但现场搜出疑似德国的宣传品。\n\n胡斯托之死使本就脆弱的拉普拉塔政局彻底崩溃。各省考迪罗纷纷宣布自治，各地激进分子走上街头，中央政府对外省的控制几乎在一夜之间瓦解。"
TOD_ARG.1.a:0 "拉普拉塔完了"
TOD_ARG.2.t:0 "拉普拉塔危机"
TOD_ARG.2.d:0 "胡斯托遇刺后的拉普拉塔联合省陷入极度混乱。激进民族主义派系上台，他们认定南道山和巴拉圭是刺杀事件的幕后黑手，并指控两国长期经济殖民拉普拉塔。\n\n在民众狂热的反道山情绪下，临时军政府宣布全国总动员，誓言收复被南道山控制的失地。战争阴云笼罩拉普拉塔河两岸。"
TOD_ARG.2.a:0 "宁做一日雄狮，不做百年羔羊"

### 拉普拉塔国家精神 ###
ARG_dishonest_decade:0 "不诚信的十年"
ARG_dishonest_decade_desc:0 "腐败、选举操纵与军政勾结掏空了拉普拉塔联合省的公共信任。国家仍维持着表面秩序，但所有人都知道这套秩序已经开始腐烂。"
ARG_extremist_currents:0 "极端思想横流"
ARG_extremist_currents_desc:0 "中央权威衰落后，街头政治、秘密会社和激进民族主义宣传在各省迅速蔓延。它们还没有形成稳定政权，却已经足以撕裂国家。"
ARG_extremist_politics:0 "极端思想政治"
ARG_extremist_politics_desc:0 "激进民族主义派系已经把街头怒火变成国家路线。所有妥协都被视作背叛，所有外部威胁都被解释为民族复兴的理由。"
ARG_sharpen_bayonets:0 "磨亮刺刀"
ARG_sharpen_bayonets_desc:0 "军队正在混乱中重整，军官团要求恢复纪律、重建威慑，并为即将到来的边境危机做准备。"
ARG_drawn_bayonets:0 "亮出刺刀"
ARG_drawn_bayonets_desc:0 "拉普拉塔不再只是备战。军政府已经公开把战争作为解决国家危机的唯一道路，刺刀被举到民众面前，也被指向北方。"
