### leaders ###

POLITICS_MAKINO_NOBUAKI_DESC:0 "大久保是利，西日本重臣核心人物大久保利通次子，自至和十三年（1880年）进入外务省，历任大明使馆馆员、驻法国公使；先后担任文部卿、外务卿，属于大久保利通-伊藤博文派系重臣。1909年大久保利通去世之后，大久保是利被藩会讨论后敕选进入重臣会议，成为重臣集团核心人物。\n昌德卅四年（1921年），小大久保首次被提名为大太政官，并因成功处理第一次米骚动得到了政界美名，而后长期在“重臣会议”中扮演核心角色，参与了原田熊雄和清浦奎吾两次太政官拥立运动。\n昌德卌七年（1934年），作为处理“财荒”的最后底牌，小大久保再次被重臣会议提名，组建新一届大太政官内阁，如今的小大久保无疑是在走钢丝，众议院的合作者：自由社和国民革新同盟在众议院第一大党进步会的攻势下独木难支，而省部官僚内的三土忠造-前田米藏派系与伊泽多喜男-币原喜重郎-若槻礼次郎的派系冲突也让他头疼，但可以肯定的是，小大久保稍有不慎，他和他的大太政官内阁将陷入万劫不复......,或许他能找到好的方法来平衡本士企业家和明国财团之间的关系，抑或是让躁动分子安静一些。好在他自上任以来就在西日本各大势力之间斡旋，推出了一系列政策，一定程度上缓解了钱荒对西日本造成的恶劣影响。假以时日，他相信自己能够带领西日本走出危机的阴影，为这里重新带回繁荣与富足。"


### ideas ###
WJP_slave_of_dragon:0 "东洋诸夏模范政权"
WJP_slave_of_dragon_desc:0 "作为东洋诸夏“开化事业”的模范政权，西日本联盟长期以来自觉以天朝为文明轴心，持续而积极地朝“天朝秩序”靠拢。其在典章制度、礼仪规范、文教风气与外交辞令上多方取法天朝，以“开化”自任、以“模范”自居。\n在区域交往与秩序想象中，西日本的做法也取得了天朝在政治、经济方面的一系列优惠政策，从而以“半步统制国”的身份，获得了天朝东洋秩序中的特殊地位。"
WJP_depression_strike:0 "财荒的冲击"
WJP_depression_strike_desc:0 "我们直到今天都没能摆脱财荒的冲击，物价飞涨、通货膨胀、失业还有那些大财团的所作所为使西日本的人民苦不堪言。"
WJP_rice_unrest:0 "米骚动的阴影"
WJP_rice_unrest_desc:0 "我国现在不能实现粮食自给，只有仰仗南洋的航运和贸易才能保证勉强供应。我们需要对长时间荒废的农业发展做出一些调整。"
WJP_tunhuojuqi:0 "囤货居奇"
WJP_tunhuojuqi_desc:0 "为了牟取暴利，诸多西日本企业正在大肆收购各种商品并将其囤积起来。我们并不知道什么时候他们才能靠这些囤积起来的商品获取到高额利润，我们只知道他们的行为已经让我们本不健康的经济愈发雪上加霜，这样的行为必须被制止。"
WJP_difficult_civil_rights_movement:0 "难以处理的自由民权运动"
WJP_difficult_civil_rights_movement_desc:0 "自由民权运动产生于自“征长战争”之后的二十年，由于初期太政官制度下的各公卿选举由省部参议决定，城市市民阶级或者中小地主并没有任何的参政空间，于是乎以“召开国会”、“实现宪政常道”为目的的自由民权运动逐渐兴起，而党人与政党也在此时产生，虽然自1890年代的立宪和自由社转向以来自由民权运动一直在不断软化，但依然难以应付。"
WJP_difficult_civil_rights_movement_jiyusha_tt:0 "众议院机制：自由社影响力§G+5%§!"
WJP_difficult_civil_rights_movement_shinpokai_tt:0 "众议院机制：进步会影响力§G+5%§!"
WJP_hanbatsu_politics:0 "藩阀政治"
WJP_hanbatsu_politics_desc:0 "在征长战争结束后，西日本各个藩爆发了严重的经济危机，为了渡过难关，以萨长土肥为首的四藩选择召开“强藩会议”建立西日本联盟以渡过难关，在强藩会议召开后，藩阀作为政治巨头的地位就已经在实际上被确定下来，而1893年立宪敲定藩会和重臣会议确定后，藩阀这个政治集团的地位被以法律的方式确定下来。\n藩会始终不是一个平等的议会，萨摩、长洲两个大藩在藩会有着绝对意义上的影响力，围绕这两个藩的藩会主导权的争夺与其他小藩的分分合合，一直是藩会的不变主题。"
WJP_domain_soldier_system:0 "藩兵体制"
WJP_domain_soldier_system_desc:0 "“藩兵制”是自征长战争结束后在第一届强藩会议中确定的，在藩兵体制下，各藩在承担联盟统一的海军军费责任的同时，对于陆军的军事建设则是各藩在遵守统一编制并接受联盟政府装备提供的前提下自负盈亏。在过去民权运动高度暴力化，土族叛乱层出不穷的情况下，这种体制还可堪一用，但到了1936年，这种体制已经落后于时代，而长期使用藩兵体制也导致我国军事建设以及军队战斗力水平远远落后于周边国家。"
WJP_overseas_japanese_in_sanchen:0 "拥抱三辰的侨民"
WJP_overseas_japanese_in_sanchen_desc:0 "在西日本，对于大商人和财团而言，商机是巨大的。而对于底层人民而言，希望是渺茫的。面对着我国孱弱不堪的现状，许多人才选择了背井离乡，前往生活水平更好的大明和兰芳去谋生。"
WJP_sino_japanese_defense_treaty:0 "《顺天和约》"
WJP_sino_japanese_defense_treaty_desc:0 "《顺天和约》是征长战争后，在大明帝国的调停下，江户幕府与西日本联盟双方在顺天签订的停战和约。根据《和约》，双方必须彼此交好，不得擅自开战。同时需限制军队规模，双方都不得保留规模过、水平足以影响东洋和平的军队。"

