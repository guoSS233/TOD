CAM_shenfa_leader_desc: "自高棉亡国以来，高棉民族主义一直都是大大小小各类政党所打出的旗号之一。然而他们的主张却大相径庭，因此很长一段时间里极端民族主义者们并没能形成一股稳定的统治力量，导致中间派一直是高棉复国力量的主旋律。然而自庚午财荒以来，高棉人对于温和路线彻底的失望了。此时，沈法加入了人民社会党，并在几年内以他强大的号召力团结并整合了若干民族主义政党，形成了如今的人民社会同盟。1933年民社盟在金边暴动被镇压，尽管直接复国的尝试遭到了失败，但却极大地煽动了又一波的民族主义浪潮。得益于此，民社盟的支持者大幅增加，他们又将带领高棉走向何方呢？"
