 shanxi_province_state: "§Y山西省§!"
 shanxi_province_state_desc: "§Y表里山河 太行锁钥§!\n山西东倚太行，西临黄河，自古便有表里山河之称。前明宣德至正统年间，随着漠南卫所体系完善，山西成为大明经营塞上的后方基地，经济、战略地位日益凸显，晋商也借此兴起。但与之相对的，是日益严峻的人地矛盾问题。尽管朝廷试图通过移民政策缓解农业困境，但成效有限。\n这一局面至景隆朝中祖改制才得到改变，山西因矿产丰富被明廷重视，煤炭、冶金产业逐步发展，迎来了新一轮的高潮。官营工厂设立使煤炭、钢铁工业复苏，东北、南方的开发也为山西提供了市场。时至今日，山西依托丰富的自然资源依旧维持着经济的增长，但地区发展不平衡，严重的城乡差异等问题，依旧固着在三晋大地之上。"
 shandong_province_state: "§Y山东省§!"
 shandong_province_state_desc: "§Y齐音鲁韵 稷下新风§!\n自秦汉以来，齐鲁大地一直是北方经济文化重镇。在京杭大运河修通后，南来北往的车船货物更是塑造了繁华的沿河城镇。但随着黄河改道以及“祯祥民乱”的爆发，山东的内陆经济不可避免的受到冲击。在这一背景下，环渤海地区的海运规模迅速攀升，随着胶东-辽东-朝鲜的区域贸易愈发频繁，胶东地区凭借海运和远洋贸易崭露头角，成为新的经济增长点。这种情况一直持续到十九世纪“黄淮海治理工程”的展开才得到转变。伴随着北段大运河的重新疏通与铁路的铺设，山东西部诸府开始复苏。在新技术的加持下，一座座工厂与企业在齐鲁大地上拔地而起，以残酷的方式将部分人群拉入到现代生活之中。胶州、济南的街头，报馆与学堂林立，继承了稷下学宫传统的知识分子，正以自己的方式推动着这片土地的发展。"
 anhui_province_state: "§Y安徽省§!"
 anhui_province_state_desc: "§Y江淮三分 八皖无梦§!\n当南直隶不复存在，如何处置这样大一片直辖区域，成了朝堂上的烫手山芋。直至“肥瘦相配，珠玉在侧”的御笔朱批落下，一切方才尘埃落定，二府二省的格局由此成型。不过，比起璀璨的江苏，安徽显然暗淡了许多。且不论相对滞后的发展和一到皖北就无比拥挤的南下车厢，省会安庆也已经落后，称不上一座大城市——太平府和中都凤阳都有更加繁荣的经济、更加繁华的城市建设。\n这样的境况里，如果问一个安徽人，它的中心在哪，多半回答会是“应天”。每到夜晚，皖北和大别山的市镇便逐渐进入了休眠，唯有自应天府向西南和西北的两串玉带，指示出它和这座留都之间的巨大关联。整个安徽的人才和财富，经由京沪铁路和滚滚长江，源源不断向着大明的第一个首都涌去，而它，只能无力地摆摆手。"
 zhejiang_province_state: "§Y浙江省§!"
 zhejiang_province_state_desc: "§Y下三上八 之江潮起§!\n西湖的烟雨朦胧在这里成为过去式，山川之间的氤氲之息也已不再。古时宁静的生活日渐远去，现在的浙江已经成为了“精明”“忙碌”的代名词，城市里的人潮，永远在快速的流动，绝少有人会为了金钱外的事务驻足。\n从这里走出的行商，牢牢控制了长三角地区的货运贸易，“苏湖货郎半归浙”的说法获得了举国认可。最让他们声名远播的，莫过于在二十年前的世界大战中牵线搭桥，为饱受困扰的意大利送去粮食和枪炮，让这个国家挺过了最难熬的时光。\n然而想要寻得一番宁静，倒也不是难事。离开钱塘潮起的平原，走向山区，这里依然是相对闭塞的土地——依然有不少山民还像过去那样劳作谋生。也许你会对这样的生活心向往之，萌生隐居的想法；不过若你没有那些在莫干山开馆的大佬们丰厚的资财，恐怕也只能在灰头土脸后，悻悻离去。"
 fujian_province_state: "§Y福建省§!"
 fujian_province_state_desc: "§Y八闽山峦 千叠潮声§!\n武夷山与雁荡山将福建与富庶的江南地区隔绝开来，“八山一水一分田”的地形条件，则和这不便的陆上交通一起，为这里博得了一个“兵家不争之地”的名号。但这贫瘠的土地和面前广阔的海洋也为福建先民带来了一种新的发展方式。早在文明诞生之前，福建的先民们便乘着独木舟从平潭出发，在南岛之间开枝散叶；有宋以来，千石远洋船的风帆在指南针的领航下，从泉州航向西洋，将武夷丘陵上的各色茶叶换成滚滚的金银；我朝台湾设省之后，厦门更是成为了通九译之番邦的远近贸易之都会。在可见的未来，福建必将劈波斩浪，闯出属于自己的一片湛蓝海洋。"
 sichuan_province_state: "§Y四川省§!"
 sichuan_province_state_desc: "§Y群山环隔 天府之国§!\n四川，地理环境得天独厚，人文场域迥乎不同；从五丁开山到李冰治水，这座群山环抱的西南盆地流传着无数佳话。四川盆地特有的紫色土壤哺育了繁荣的农业经济，温和湿润的气候亦使人口不断增加。17世纪，四川作为烈祖北伐、再造大明的关键后方，为全国统一与经济恢复作出巨大作用；18-19世纪，四川省借助深厚的产业基础和丰富的劳动力条件，成为明帝国在现代化道路上狂飙的重要引擎，并成为工业化、城镇化的示范省份。时至20世纪，四川省的人口密度再创新高，城市与工厂正在不断向自然进军，极高回报率吸引农民踊跃投身经济作物栽培，全面电气化与铁路网成为四川最新的成就。此起彼伏的地质、气象灾害没有击倒顽强的四川人民，他们以无上的决心与毅力将四川打造为当之无愧的“天府之国”。\n[xibeiideologies]"
 guizhou_province_state: "§Y贵州省§!"
 guizhou_province_state_desc: "§Y贵山黔水 瀑秀茶香§!\n贵州承宣布政使司设立于永乐十一年，是前明一十四省中最晚形成的一个。在长达六个甲子的改土归流运动中，贵州从深山中的不化之地走出，逐渐接纳了中原的文化和科学。永贞年间的西南大移民又极大充实了贵州的人口，在一封都察院御史提交的报告中，贵州“‘汉土民夷，比屋而居……与内地气象无异。”尽管地形崎岖，但贵州丰富的矿产还是吸引了诸多商人前来设厂开矿，也一并促进了基础设施的建设。一般认为，景隆十七年，贵阳、安顺、遵义三处军民府的改制，是贵州迈入近代的标志。百年后的现在，干线公路、铁路与日益完善的电报网络，正令这个曾经土司林立的省份焕发新生。"
 yunnan_province_state: "§Y云南省§!"
 yunnan_province_state_desc: "§Y苍山洱海 彩云之南§!\n自古以来，云南与中原的联结便深植于华夏文明脉络。汉习楼船、唐标铁柱、宋挥玉斧、元跨革囊，每一则史典皆为西南与中原冲突交融的生动注脚。自明廷挥师入滇、平定梁王政权后，云南历史掀开崭新篇章。在腾越八关的烽火照映下，大明军队数度南征，荡平割据势力，将云南铸造成控御西南的战略要冲。十九世纪中后期，暹罗、缅甸相继归附，西南边防压力渐次舒缓。中南半岛与滇缅铁路的贯通，更使云南与外界的联结实现跨越式提升。这条钢铁走廊纵贯中南半岛，衔接印度洋与南洋海域，为云南贸易开创空前格局：滇地茶叶、药材、矿产等特产，经滇缅铁路源源不断输往榜格剌、暹罗，再转贩至西洋诸国；中南半岛与印度的棉布、香料等商品亦循此通道涌入云南，催生出蓬勃的经济活力。时至今日，这片南中故土正以开化的姿态串联起西南边疆，依托全新的生产方式，云南已然成为中华文明辐射中南、远及天竺的关键枢纽。"
 qinghai_province_state: "§Y青海省§!"
 qinghai_province_state_desc: "§Y高原草场 三江之源§!\n青海省，地处青藏高原东北部，地域辽阔，地形复杂多样，山脉、盆地、河流交错分布。自邓愈率军深入昆仑以来，这片土地便进入了大明的统治之下。依托于规模庞大的茶马贸易，青陕之间的政治、经济联系日趋紧密。\n景隆朝以后，随着大明中央政权的稳定和经济的发展，青海地区也迎来了新的机遇。朝廷推行改制，注重边疆地区的开发与治理，青海的经济得到了一定程度的发展。畜牧业依然是青海的主要经济支柱，牦牛、藏绵羊等畜种为当地提供了丰富的畜产品，也成为了大明军队的重要物资来源。在《西北开发法案》的大力支持下，青海的矿产资源也开始得到初步开发，金、银、铜等矿产的开采为当地经济注入了新的活力。到了20世纪，尽管青海作为西北要地得到了多轮开发扶持，但整体工业水平仍较为低下，官营工厂尽管改变了当地的部分社会面貌，但其带来的的种种弊病同样深刻影响着这片土地。草场上的悠悠牧歌与与工厂中的滚滚浓烟，将带领这片高原故土走向何方呢？"
 gansu_province_state: "§Y甘肃省§!"
 gansu_province_state_desc: "§Y河陇古道 羲轩桑梓§!\n世界屋脊之下，季节性的冰山融雪为笔，勾勒出蜿蜒千里的河西走廊。这条细细的通路，背靠巍巍高原、面朝茫茫戈壁，是连接明帝国腹地与西域的咽喉要道，亦是沿途数百万人民赖以生存的生命线。17世纪前，甘肃犹治于陕西布政使司，星罗棋布的实土卫所则捍卫长城的安全；18-19世纪，随着明帝国克复西域，甘肃完成了由军事缓冲区向经济连接带的转变，亦得以独立建省；时至20世纪，玉门油田、西域铁路和宁夏府的灌溉农业深深滋润着甘肃一省的发展。从昔日贫穷落后的偏远一隅，到如今的塞上江南，进取的甘肃人民实现了历史性跨越。\n[xibeiideologies]"
 liaodong_province_state: "§Y辽宁省§!"
 liaodong_province_state_desc: "§Y海云山川，千突戟排§!\n自秦开拓地，辽东便是无可争议的汉人地带。然而，苦寒的气候，泥泞的沼泽都限制了人口的进一步流入。直到19世纪以前，这里都是人烟稀少的边塞之地—— 直至工业革命。 辽东广阔的土地从未迎来过如此的青睐：移民的洪流从山东和河北兴起，地下的铁矿和煤矿得到发掘，崭新的州府县城被划设建立。相对内地更科学的开发规划和不断涌现的工作机会，使得这里成了一片安居的乐土，这里的商品透过营口和金州，还有津辽铁路，源源不断输送向中华圈的各个角落。省会辽阳府，更是凭借强大的钢铁工业和衍生出的机械制造业和军工业，在一百年内就成为了仅次于顺天的华北第二大城市。 不过工业化浪潮带来的污染，让城市的天空经常灰蒙蒙的；拥挤的工人聚集区缺乏足够的社会服务，饱受卫生、治安和教育问题困扰；甚至于随着人口的增长，农村的土地矛盾也开始恶化了。但是，所有人都相信辽东奇迹的延续——至少这片土地，已经展现了超乎寻常的可能性。"
 jilin_province_state: "§Y吉林省§!"
 jilin_province_state_desc: "§Y神山巍峨 帝国粮仓§!\n吉林省，这片地处大明东北腹心的广袤地域，自古以来便以冰雪覆盖、山川壮美而闻名。长白山巍峨耸立，松花江奔腾不息，广袤的黑土地蕴藏着无尽潜力。永乐年间，明廷于此设立造船厂与军民府，鼓励移民屯垦。对当地土司卫所的改土归流，贯穿两明五百年岁月。此时期的吉林虽是大明羁縻统治东北的核心区域，然其经济社会发展仍显滞后。\n吉林的真正崛起始于19世纪中叶。随着大明工业革命的推进，吉林丰富的煤铁资源被大规模开发，吸引了大量来自山东、河北等地的移民。为支持东北开发，明廷在当地修建了多条铁路，使吉林的煤炭和铁矿资源能够便捷地开发利用。伴随铁路而来的人口与资本，让这片冰封已久的土地焕发出全新生机。在新式农机的助力下，松辽、三江平原的沼泽湿地逐渐变为肥沃的良田，新式官营农场的生产模式也在此孕育发展。20 世纪初，吉林逐渐成为大明重要的工业与农业基地，车辆、农机、电器等新兴制造业在吉林蓬勃发展，吉林市、长春市等城市崛起为区域经济中心。正是凭借人民的不懈努力，往昔的冰天雪地终成今日的北国乐土。"
 heilongjiang_province_state: "§Y黑龙江省§!"
 heilongjiang_province_state_desc: "§Y黑水故地 林海雪原§!\n黑龙江这一词汇最早以”黑水”的名称出现在汉文史料中。永乐年间，明廷在黑龙江设立奴儿干都司，加强了对当地的 控制与开发。后明之初，明俄围绕黑龙江流域的博弈以大明的胜利而告终，出于稳固边防的目的，明廷依托外兴安岭与黑龙江布置哨卡，派驻军队。然而，苦寒的气候与广袤的林海湿地限制了人口的流入，使得这片土地长期处于开发的边缘。\n19 世纪中叶，边疆建省浪潮中，黑龙江省正式建制。随着东北铁路网的延伸与大东洋贸易规模的不断扩张，黑龙江的航运体系得以深度开发。凭借丰饶的自然资源，黑龙江省成为大东洋贸易中举足轻重的原材料供给地，经济面貌为之一新。至十九世纪末、二十世纪初，鉴于大明对粮食需求的与日俱增，黑龙江的大规模垦荒上升为国家重要战略。官营垦荒团进驻后，黑龙江两岸的荒原渐次化作金色稻田。内地迁来的农民虽对 “农业工人” 这一全新身份尚感困惑，却也在林场与农庄中开启了以微薄工资维系生计的劳作生涯。"
 taiwan_province_state: "§Y台湾省§!"
 taiwan_province_state_desc: "§Y宝岛明珠 海疆要地§!\n早在宋元鼎革之际，便有不少东南省份的居民前往宝岛开荒避难。明太祖降伏陈友定控制福建后，于此设立了澎湖宣慰司，控制管辖全岛。在随后的经略过程中，有逐渐于岛上开设府县，设立羁縻土司"
 mongolia_province_state: "§Y岭北省§!"
 mongolia_province_state_desc: "§Y大漠瀚海 岭北风光§!\n岭北省，居于漠北高原之脊，北倚狼居胥山，南接大宁之边，西临和林，东瞰龙江上游。大漠孤烟与草原长风在此交汇，黑水（克鲁伦河）自狼居胥山麓发源，蜿蜒西折，似银练穿云，滋养两岸丰美草滩，勾勒出牧猎交织的苍莽画卷。\n昔日明军北伐，曾在此筑库伦、设都司，旌旗猎猎，铁骑纵横，勒石燕然之遗响犹存；岭北各族来往，皆于此驻牧生息，毡帐万顶，牛羊蔽野，传唱着草原部落的雄浑长歌。\n今日的岭北，仍承袭“风吹草低见牛羊”的古老牧歌。夏季，千里牧场绿浪翻涌，骏马嘶鸣；冬季，雪覆高原，驼铃悠远。朝廷延续屯垦戍边旧制，划四季牧场、立军马苑，岁出良骥以实边骑。近代更凭黑水峡谷之煤铁，兴小冶、开炭窑，炉火映红夜幕，为这片高寒之地添一缕工业星火。"
 xiyu_province_state: "§Y西域省§!"
 xiyu_province_state_desc: "§Y机会之地 潜力无穷§!\n西域，无数梦想家魂牵梦萦之地，亦为无数传奇人物粉墨登场的舞台。千百年来，围绕这块水草丰美、资源丰厚的宝地，合作与冲突的戏剧交相上演，交织的昔日之影已然为亚细亚之心遮上一层神秘的面纱。曾一度见证中原王朝几度沉浮，西域仍与腹地藕断丝连；四次明俄战争之后，重建于17世纪的西域都护府仍是明帝国西北前线的坚固屏障；从汉唐的筚路蓝缕，到明帝国的苦心经营，中华文化深深铭刻在天山南北的社会之中。时至20世纪，西域发现的宝藏仅是冰山一角。承蒙各族人民的不懈努力，西域的发展成就蔚为大观，这片土地充满无穷契机。\n[xibeiideologies]"
 tibet_province_state: "§Y乌斯藏省§!"
 tibet_province_state_desc: "§Y高原圣域 藏传法王§!\n乌斯藏，这里是藏传佛教的虔诚信仰之地，寺庙的金顶在阳光下熠熠生辉，转经筒的低吟浅唱回荡在山谷之间，僧侣们的诵经声与雪山上的风声交织成一首永恒的赞歌。乌斯藏的政治图景与地貌一样层次分明，番汉官制在此纵横交织。居于僧俗权力顶端的乌斯藏会议，由乌斯藏巡抚与藏地七王共同引领。这套始于永乐朝的治理架构，经数代完善更显完备 —— 除番汉共议的传统外，金瓶掣签制度成为重要纽带，在活佛转世等重大事宜中维系着中央权威与地方信仰的和谐。各族官员如拧结的牦牛绳，在联席会议中维系地域平衡：他们熟知彼此仪轨禁忌，以协商化解文化差异。从卫藏的寺庙群落，到康巴的茶马古道，这套 “汉官掌纲、藏王辅治、金瓶定序” 的治理体系，如稳固的经幡柱扎根高原。当阳光掠过布达拉宫的红墙，金顶下的转经道上，朝圣者与巡视的汉藏官员擦肩而过 —— 一连串长头的背后，是帝国的律令在维护着边疆。"
 liaoxi_province_state: "§Y大宁省§!"
 liaoxi_province_state_desc: "§Y沙草相交 潢水穿山§!\n大宁省，地处大兴安岭南麓以东的漠东腹地，西接开平，东通辽东，北望龙江，南屏中原。燕山山脉层峦叠嶂、纵贯南北；潢水蜿蜒流转，穿山越原，似玉带镶嵌于茫茫绿野之间，润泽着广袤的农田与牧场，哺育出农牧交错的独特风貌。闻名遐迩的木兰围场，曾见证多位天子御驾巡狩、旌旗蔽日的赫赫威仪，至今犹回荡着帝国初创时期的雄健余韵。\n而今的大宁，虽不复当年北边重镇的肃杀之气，却依旧延续着农牧并举、兵民一体的深厚传统。平原地区麦黍连畴，推行轮作；丘陵草场牛羊遍野，牧歌悠长。朝廷亦在此广设马场，牧养军马，补给北疆。近代以来，更依托山川蕴藏，兴冶铁、采煤炭，虽规模有限，却为边地经济注入了新的生机。"
 chahar_province_state: "§Y开平府§!"
 chahar_province_state_desc: "§Y坝上绿野 北疆锁钥§!\n开平府，位于大兴安岭以西的漠南地区，地处华北平原与漠北高原的过渡地带，自古便是中原王朝与北方游牧对抗、交流、融合的前沿阵地。洪武时为了巩固北方边疆，明廷在元上都开平设立卫所，派遣兵马屯种戍守，招抚蒙古部族，逐步形成了后世开平府的前身。\n后明立国后对于开平依旧高度重视。在平息藩乱后，高宗在开平组织蒙古各部开展会盟，由此进一步加强了明廷对于漠北的控制与影响。开平、应昌串联起的会盟大道，也使得开平府成为沟通漠北与内地的纽带。中祖改制后，开平由于特殊的政治地位被设立为直辖府，当地的矿产资源等也得到开发。延至二十世纪，京张铁路支线迤逦北伸，穿草原、越丘壑，直抵塞北，汽笛长鸣惊破千年荒寂。每值会盟之期，蒙旗王公乘汽车而至，皮毛商携良种牲畜赴市，地质队负仪器入山探矿，牧场内推广试种牧草。昔日金戈铁马之战场，今成农牧工矿并兴之重镇。开平于塞北风沙中静立如碑，见证这古老帝国向近代的踉跄转型，亦在时代洪流中勾勒出传统与新生交织的塞上长卷。"
 dongsheng_province_state: "§Y朔方省§!"
 dongsheng_province_state_desc: "§Y塞上江南 天苍野芒§!\n 古语云：“黄河百害，唯利一套”。作为黄河的精华部分之一，大明对于这里的经略始于山西行都司的设立。在宣德封贡，边患暂息后，山西行都司沿河设立的众多边堡墩台便成为人口日益富集的所在。北去商客，南来牧民在此地聚集贸易居住，而成化年间增设的部分卫所，则更是为河套的和平安定提供了军事层面的支持。后明建立之后，对于河套卫所进行了进一步整顿，部分府县设立的同时，对于牧民草场的划分也得到了更加有效的推行与落实。在景隆朝的边疆设省运动中，朔方一词被皇帝从故纸堆中看中，立压学士们推荐的“东胜”成为省份之名。在随之而来的工业化浪潮中，朔方更多以一种不温不火的状态推进着经济的发展。在当地人的戏称中，省府衙门每日放在治河植树的心思都要比经济发上多。\n从最开始的牛马驼队，到如今飞驰而过得火车，一代代百姓用双手改变着这片土地。秦音晋语回荡在大河两岸、阴山南北，继续谱写着属于朔方这片土地的故事与传奇。"
 xikang_province_state: "§Y西康省§!"
 xikang_province_state_desc: "§Y经筒轮转 茶马古道§!\n西康省地处青藏高原边缘，历来是土司聚集之地。河谷间，部族百姓垦田务农；高原上，羊毛织就的氆氇柔韧厚实，带着草甸气息流入市集，换得生活所需；青稞酿成的美酒，经商贾之手辗转流通，既为山民换来盐茶；高原特有的草药珍馐，亦引得远方行商翻越雪山，寻觅这方深藏的宝藏。作为明廷在青藏高原推进 “改土归流” 的设省成果，西康省凝结着大明治理藏地的智慧与心血。明廷有意扶持下，以西康二王为代表的汉藏混血地方豪族，成为支撑西康施政的关键力量，为缺乏根基的流官提供了诸多助力。而废除农奴制的尝试，更寄托着大明番汉混一、“开化高原” 的宏大愿景。\n只是随着改制的推进，预想中天翻地覆的变革并未如期而至。西康的百姓仍在这片土地上续写着自己的生活：尽管有些人随商队外出谋生，将西康的信仰与风情播撒到大明各地；但更多的人还是选择留守雪山脚下，用双手守护着祖祖辈辈相传的家园。时代的开化之风似乎给这片古老的高原冻土带来了改变，又仿佛一切仍留存着往昔的底色。"
 chongqing_province_state: "§Y重庆府§!"
 chongqing_province_state_desc: "§Y山城雾锁 渝水东行§!\n重庆府，作为蜀中门户之一，其扼守于长江与嘉陵江之交汇处，地势险要，山水交融，自古便有“巴渝之地”之称。此地气候湿润多雾，然土地肥沃，物产丰饶，为西南重镇。烈祖定统年间，重庆府因战乱波及较小，经济基础得以保全，为其后续发展奠定根基。景隆朝以后，重庆府迎来经济发展的黄金时期。朝廷推行改制，注重经济建设，重庆府凭借其独特的地理位置和丰富的资源，迅速崛起为西南地区的重要经济中心。长江沿岸的码头贸易兴盛，各地特产在此集散，转销西南各地。本地的盐业、纺织业等手工业也蓬勃发展。20世纪初，随着大明工业化的推进，重庆府的工业基础逐步建立。官营工厂的设立，使得重庆府的钢铁、机械制造等产业初具规模。民间资本也积极参与，私人作坊和小工厂如雨后春笋般涌现，工业产值逐年攀升。虽然因地处偏远，其工业化程度虽不及沿海地区，却在西南地区独树一帜。城市面貌日新月异，商业繁荣，人口密集，文化教育事业也蓬勃发展。在这颗西南明珠的带动下，新兴资本正逐渐涌入天府之国，改造这篇古老的土地。"
 taicang_province_state: "§Y太仓府§!"
 taicang_province_state_desc: "§Y太仓稊米，大海浮萍§!\n从14世纪到现在，这座城市从没有衰落下去过，从一个县城，到一座府城，再到闻名遐迩的世界名城，它经历了其他地区惹人艳羡的跨越。东西两洋的货物在这里荟萃，整个长江流域的人才和货品都汇集在这小小的地方，浏家和吴淞的繁忙一如既往是它的底色。不过，今时太仓真正引以为傲的是它林立的工厂和繁华的街市，新仓街高大的电气牌坊更是这座城市特立独行的象征。和橱窗里琳琅满目的商品一样，这里的住民也丰富多样：各色人等怀揣着各异的心思走进太仓，或纯粹或混杂的善恶在这里激荡碰撞。既然没有谁能完全预测自己的新一天，那不如在生活这张厕纸上涂抹一通。幸运的是，这一团集各种繁杂于一身的城市，尽管遇到了一些小小的波折，依然在人声鼎沸中稳步向前，这就足够了。"
 baoan_province_state: "§Y宝安府§!"
 baoan_province_state_desc: "§Y港通万国 为天下先§!\n宝安府，踞珠江口东岸，负山面海，控虎门之咽喉，望零丁之浩渺。自宋设市舶、明开海禁，帆樯鳞集，番舶鳞次，犀象香药与丝瓷茶叶于此交汇，千年商脉由此绵延。\n其地背倚莲花诸峰，冈峦如屏；前临伶仃洋，潮汐吞吐。东江、珠江诸水汇于湾内，港阔水深，天然良泊。昔日“屯门戍”烽火犹存，今则万顿巨轮泊于钢铁码头，汽笛长鸣，取代昔日樯橹之声。\n近代以降，宝安以“更化”先机，得风气之先：蒸汽轮机之轰鸣与银行银号之算盘交响，新式工厂沿港湾星列，缫丝、机器、造船、火器诸业并举；证券交易所昼夜灯火，龙钱与外币同流。华商、洋行、船东、买办麇集，电报、铁路、保险、报馆纷起，遂成帝国南方金融与制造的双重核心。"
 shuntian_province_state: "§Y顺天府§!"
 shuntian_province_state_desc: "§Y北辰星拱 京华烟云§!\n顺天府，这座古老而充满活力的城市，宛如大明帝国跳动的心脏，每一次脉动都牵动着整个国家的节奏。它不是一块铁板一块，而更像是一局未下完的棋，四四方方的城池是棋盘，而那些最顶尖的政治高手就在这里对弈，每一招每一式，稍有不慎就会满盘皆输。\n这里是权力的中心，是整个大明的神经中枢。内阁、六部、枢密院、咨议院、大理院……这些名字在顺天府交织成一张错综复杂的权力网，捕捉着帝国的每一次呼吸。这里没有真正的寂静时刻，即使夜深人静，官邸中的灯火依旧通明，文官武将穿梭其间，或为边境的战事，或为东南的税赋，或为朝堂的人事更迭。每一扇门后都可能藏着改天换地的密谋与决策。那些看似古板的建筑，实则是大明帝国的每一根神经末梢都在此汇聚，将皇帝的旨意、朝廷的律法传遍大江南北。\n顺天府的建筑群就如同凝固的历史。紫禁城的宫墙虽红得庄重，却难掩岁月冲刷出的痕迹；午门的脊兽依旧威严，但瓦缝间顽强生长的野草，似乎在诉说着权力背后被遗忘的故事。这座城市的每一砖一瓦都承载着过去的辉煌与沧桑，见证着大明从初创到鼎盛的每一步。而今，它们静静矗立，守护着这座城市的历史与记忆。"
 zhendong_province_state: "§Y镇东省§!"
 zhendong_province_state_desc: "§Y北海腹心 遥系东洋§!\n镇东省是大明东北边疆的重镇，其省会镇东府（海参崴）倚陆傍海，背靠广袤的关东腹地，面向浩瀚的大东洋，是大明控遏北大东洋的重要门户。镇东省南起金角湾，北到旧奴儿干都司治所奴儿干城，辖区涵盖速平江与黑龙江下游以东直至海滨的广袤地域，地貌多变，既有三江平原延伸而来的肥沃黑土田野，亦有巍峨连绵的西河大岭横亘其间，山林茂密、矿藏潜蕴，更拥有曲折漫长的海岸线与众多天然港口，自然资源极为丰饶。\n全省经济以渔业、航海业与边贸为三大支柱。沿岸渔场盛产鳕、鲑、海参，渔民依时而作，所获除供本地，亦腌制晾晒，循驿道或海路南销关内。依托日益繁荣的大东洋贸易，各种商品在此集散，促进了当地经济繁荣。镇东商帮依托海贸，北上库页岛、东渡鲸海，直至远航至北美洲西岸，将毛皮、木材、药材等物产运回中土，又将大明瓷器、丝绸、茶叶乃至铁器输往异域，络绎不绝。这片土地不以农桑见长，却以枢纽之姿、舟楫之利，在大明北疆经营中占据独特地位，更为帝国经略大东洋、抚驭东洋诸国之前沿重镇。"
 xingzhou_province_state: "§Y星洲府§!"
 xingzhou_province_state_desc: "§Y黄金水道 南洋明珠§!\n没有什么比南洋明珠更适合形容这座城市。它曾经是巫人苏丹避居的堡垒，曾经是荷兰人重要的贸易据点，曾经是英国人虎视南洋的核心抓手，不论是谁都将它视若己出，按照自己的想法倾力打造。\n1880年代的战乱后，中国皇帝的特使颁布了恩典：为了建设它，不计其数的真金白银在这座城市倾倒。至1895年，他的儿子又仁慈地将其作为帝国的第五个直辖府，生怕它陷入和西岸五府的争斗；一支广西部队也驻扎进来，为城市提供最坚实的保护。\n而在世界大战中，这座城市又扮演了无与伦比的角色：在帝国中立时，不论欧洲的列强如何大打出手，它们的子民在这里也必须和颜悦色地从同一个供货商接下产品；在帝国出击时，这座城市彻夜不眠，向世界各地的战线输送武器弹药和医疗用品，或者是应急口粮。\n当然，这座城市和本土那些最华丽的城市别无二致，充满着铜臭味和脚步声——除了随处可见的棕榈树和腊月里也潮湿的天气在提醒你，这里是南洋的心脏。"
 manlajia_province_state: "§Y满剌加省§!"
 manlajia_province_state_desc: "§Y南海乡梓 两洋通衢§!\n自郑和下西洋以来，满剌加就因其独特的战略位置，受到了中原王朝的关照。自大明皇帝赐予满剌加领主与暹罗王同等的地位以来，这里的发展与中华帝国的联系愈发紧密。尽管欧洲人一度主导这里，但中国人始终未曾远离。\n1820年代开始，闽粤华人向满剌加省地区移民的步伐加快。随着人口的增加，南洋当地的人地矛盾日渐尖锐，巫人与汉人两大移民族群对于土地的争夺日渐激烈。以海岸城镇为据点的英国人对此乐见其成，游走于各大势力之间攫取暴利——直到华人会党们与本土的官僚们达成合作。\n满剌加独立国的诞生，实际上只是一种过渡；1890年代，明帝国吞并独立国后，以客家人为主的华人移民或是自愿，或是顺应官方的意愿来到这里。有关当局根据实际情况，以最初的习惯线为依据，将柔佛素丹国故地加入进来，整合形成了现在的满剌加省。不同于大多数省份，这里保留了独立国时期为了用于区分汉人和巫人的聚居区设立的垦拓分界线，不仅是用来彰显皇帝的仁慈之心，它的挪动也是为了更加便利的控制。\n而这片土地也从不辜负它的开拓者们。到1910年代，西岸五府——槟州府、怡保府、巴生府、满剌加府和新山府成为了整个南洋的工业中心，连带着新生的省份成为了帝国财政的新供应者。\n世界大战之后，随着各路思潮的流入，柔佛苏丹和彭亨苏丹的后人逐渐活跃起来，他们利用明帝国对巫人事实上不平等的政策，逐步将当地的巫族拉入自己的阵营。而在另一边的繁华城镇和田野乡间，闽南人、潮汕人和广府人、四邑人总是争斗不止。客家人和广西兵有时居中调停，有时渔翁得利。帝国在南洋的统治逐渐陷入困境，但身处膏腴之地的达官显贵们，却还悠闲地在从熙高地上躲避着来自低地的酷热。"
 lvsong_province_state: "§Y吕宋省§!"
 lvsong_province_state_desc: "椰风蕉雨 炎海要津\n吕宋省，孤悬南洋万顷碧波之中，北隔吕宋海峡与台湾相望，南扼苏禄海咽喉，东濒太平洋浩渺，西接南海通衢。主岛吕宋，山脉纵贯，马荣火山青烟常起；吕宋河自北而南，像翡翠缎带缠绕椰林蕉影，冲积出膏腴平原，孕育稻蔗两熟、果香四季。\n前明时期屡次下西洋，在此置吕宋宣慰司，旌旗映日，舳舻千里；后设吕宋千户所，筑吕宋城，移民屯田，遂为帝国南洋首镇。近世以来，吕宋以更化新政为契机，广植甘蔗、烟草，糖寮、烤烟厂星罗棋布；又开金铜诸矿，机船往来，黑烟与椰风并起。吕宋港帆樯云集，诸多公司于此设东洋总行，龙钱流通，百货辐辏，遂成帝国东洋贸易之枢纽、万邦商旅之津梁。\n若登马荣山巅而望，翠岛如屏，碧海若镜；朝晖夕阴之间，古炮台与蒸汽船并立，诉说这片热土由海贸前哨迈向海疆雄藩的今日新章。"