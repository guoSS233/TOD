 yingtian_province_state: "§Y应天府§!"
 yingtian_province_state_desc: "§Y六朝繁华，虎踞龙盘§!\n紫金山巍峨，扬子江浩荡，这便是应天的底色。十四世纪至今的几百年来，它作为龙兴的都城、恢复的前哨、普通话的来源地享有着极其重要的地位。\n和太仓相比，这座留都处处都透露着它的威严。里外三重城墙护卫着它的陆上安全；幕府山、紫金山和栖霞山上的巨炮守护着江面的宁静；即使繁华的街市上，也不乏身着正装正在休假的军士和高级官员。每逢重要年份，国家主办的祭祀大典更是能让这座城市一夜间变成龙旗的海洋。\n当然，这里也有另一番都会光景。透过威严的城楼，四通八达的轨道网伸向城市每个角落；聆听鼓楼的晨钟，聚集在新街口的高楼群争相往天空滋长；就连工厂的烟雾也是五颜六色的。也许每个来客都对这座城市的气度印象深刻，但“居应天，大不易”才是他们心底真正的共识。"
 guangdong_province_state: "§Y广东省§!"
 guangdong_province_state_desc: "§Y岭海雄藩 粤侨枢机§!\n自南宋经济中心南移完成后，广东凭借背靠南岭、面向南洋的地理优势，成为了长江之外又一耀眼的明星。早在1636年，广州的部分城镇便开始试行股票交易，这一创新举措开创了大明金融行业的先河。作为南洋货物的重要集散地，广州不仅拥有庞大的资金流动，还吸引了数以万计的内地人在此登上巨轮，前往南洋与美洲，寻求新的发展机会。\n广东的工业发展同样迅速，繁多的货物与充足的劳动力使其成为近代工业的重要发源地之一。林立的工厂生产的各类商品远销至青丘与南道山等地。金融与工业的交织，使岭南地区对东方乃至全球贸易体系产生了深远影响。当地人常以幽默的口吻说，在广州证交所每天的开盘仪式上，出现的外国人数量，可能比在天朝大会上还要多。这种特殊的政治与经济地位，也使得广东巡抚的位置成为了南方最为抢手的一块山芋，几乎是入阁前钦定的最后一块地方跳板。"
 guangxi_province_state: "§Y广西省§!"
 guangxi_province_state_desc: "§Y青罗玉簪 七里香桂§!\n广西一直以其秀丽的山水闻名全国，“千里江山如画，万井笙歌不夜”的意境，不知牵动着多少文人雅士的心弦；但木樨代桂，博得该省简称的故事，却仍不为大众所知。除了山水，广西还是全国的军事要地，镇南雄关守卫着帝国的南陲，也是与安南交往的重要通道；而彪悍的民风，也使得广西一直是大明重要的兵源地之一。近年来，桂籍军官的身影遍及大明海外的各处军队，从东非都司到周饶、炎州，到处都可以看到他们的身影。"
 hebei_province_state: "§Y河北省§!"
 hebei_province_state_desc: "§Y千里关山 京畿屏拱§!\n河北省主要可以分为截然不同的两个部分——华北平原与塞上高原以燕山为界，使它成为唯一兼具高原、山地、丘陵、平原、湖泊和海滨的省份。随着鞑靼，瓦剌等陆续归附，曾经作为边防的长城早已成了顺天郊外的风景名胜。省会天津作为顺天的指定出海口，近代以来已经从一个普通的运河渡口发展为了北方经济中心，正如太宗在天之灵护佑大明。滦州府的煤矿有着大明工业摇篮的美誉，在更远的地方，白洋九十九淀的芦苇荡与一马平川的宣化草原，与金黄灿烂的华北麦田，众星捧月般托起了顺天的辉煌。"
 henan_province_state: "§Y河南省§!"
 henan_province_state_desc: "§Y九州中土 沃野丰穰§!\n河南古称豫州，在商周及更之前的古代，此处曾经森林茂密，象群遍布。随着气候的变化，森林逐渐南移，农田，城市与工厂则逐渐取而代之，构成了如今的河南省。作为传统意义上的中原之地，河南人口繁多，物产丰盛，在昌德年间，河南的人口更是突破了三千万大关。省会开封府在近几十年中抖落了身上的麦穗，极尽繁华之能事——马道街上的银行和鼓楼街上的商场，电灯彻夜通明。而在陇海铁路与顺广铁路的交汇处，从铁路工业开始，到面粉与电灯，郑州自开封府析置以来也在努力跟上自己的步伐。北邙的烟雨历经千年，如今落到了我们这一代人身上；至于面朝黄土背朝天的农民们吃不吃得起凤凰台大米，本来也不是省府里的大人们该操心的事情了。"
 hubei_province_state: "§Y湖北省§!"
 hubei_province_state_desc: "§Y荆楚故地 江汉新章§!\n湖北省由原湖广省分置北部而来，大体位于洞庭湖以北的地区。在华夏民族向南发展的过程中，湖北向来承担着重要的角色。从南北朝及宋元对峙时的烽烟前线，到明朝立国之后逐渐形成的“湖广熟，天下足”地位，洞庭湖平原上沉甸甸的稻穗，无声地歌颂着明帝国的富足。景隆以来，位于江汉合流之地的汉口州成为了重要的货物集散地，进而催生了重工业的磅礴发展，其中汉阳铁厂与汉阳兵工厂更是享誉大明。而在长江对岸的省会武昌府，华中工学院与武昌大学的莘莘学子正跃跃欲试，准备投入到国家的建设中去。武汉长江大桥上的列车与桥下轮渡的鸣笛声，构成了湖北的新乐章。吃过一碗热干面，就该过江去上工了。"
 hunan_province_state: "§Y湖南省§!"
 hunan_province_state_desc: "§Y锦绣潇湘 岳麓风华§!\n湖南由湖广分治南疆而来，地处洞庭之南。作为烈祖皇帝的故乡，湖南地区的发展长期以来受到了朝廷的扶持。作为湘湖经世学派重地的岳麓书院，更是诞生了一大批优秀的学者和官僚。和湖北广袤的平原不同，湖南的地形破碎复杂，湘江，沅江，资江，澧水切割出错落有致的山峦，而正是在这山峦之中，诞生了别具特色的文化风格。描述湘西风土人文的小说《边城》，蝉联了数年的畅销榜首，在广大读者的心中塑造了一个桃花源般的境地。在顺广线与湘黔线的交汇点，省府长沙汇聚了南来北往的行旅。曾经依赖湘水滋养而兴盛的工商百业，在技术的推动下，如今正焕发出新的活力与创造力。"
 jiangsu_province_state: "§Y江苏省§!"
 jiangsu_province_state_desc: "§Y吴韵汉风 南秀北雄§!\n江苏之名，来自于“江淮各处承宣布政使司”和“苏松等处承宣布政使司”。一直以来，它是一个颇有争议的概念，这个省的人心“和煎饼果子里的馅料一样纷繁多样”，从中官和胶辽话，再到淮官和吴话，彼此不通的方言俨然隔离了彼此；若是聚集在同处，他们不得不使用各种腔调的普通话协同工作。直到建省的指令下达，生活在这里的人们才发现他们必须听从同一位封疆大吏的号令。不过这并不妨碍它成为全国最发达的地区之一，这里的产出抵得上好几个西部省的总和。\n但是，它也有独属的烦心事。各州府有时候并不喜欢铁瓮城的省政府对着它们指手画脚，它们多多少少对于“大镇江主义”有着自己的抵触情绪——毕竟有了应天府和太仓府，还不够吗？"
 jiangxi_province_state: "§Y江西省§!"
 jiangxi_province_state_desc: "§Y山环水绕 物华天宝§!\n江西之名，源于唐玄宗时所设的江南西道。虽然三面环山，仅在北部鄱阳湖方向交通较为便利，但千年以来，江西的物产一直源源不断地输出到全国各地。迪化百姓家中的瓷器，每三件中便有一件来自江西饶州，顺天案头的脐橙，千家万户电灯中的钨丝，无一不彰显了江西的物华天宝、经济昌明。明朝立国后的诸多战乱之中，较为封闭的地理环境，总能使江西成为南方的一片乐土。无数文人学士自这片土地上走出，将自身经世致用的理想书写在中华大地上。但在工业化的浪潮之下，江州的琵琶声似乎也逐渐被湖上轮船的汽笛声所掩盖了。 "
 shaanxi_province_state: "§Y陕西省§!"
 shaanxi_province_state_desc: "§Y山河旧影 古国新旦§!\n陕西关中地区在宋代以前长期是中华的政治重心，肥沃的渭河平原孕育了繁荣的农业经济与政治文明。但随着气候与环境的剧变，陕西一度沦为人间炼狱，随着前明的灭亡而陷入连年的纷争动乱。烈祖克勤克仁，再得天命；陕西终于渡过了最漫长的黑夜，成为17-19世纪明帝国向西北扩张的坚实后盾与思想革新的重要堡垒。时至20世纪，古老的陕西已是旧貌新颜，关陇总督与陕西巡抚从“十三朝古都”、超级都会西安发号施令，将强有力的触角伸向从河套至汉中的广阔区域。现代化的道路坎坷崎岖，不屈的陕西人民用双手缔造了西北的奇迹。\n[xibeiideologies]"
 xibeiideologies_socialism:0 "如今，农会、工会、公社等形形色色的群众组织雨后春笋般涌现，越来越多的[xibei]人民投身于解放世界和自己的事业。"
 xibeiideologies_democracy:0 "如今，谘议局、地方议会和代议制选举已遍布[xibei]省全境，民主对于[xibei]人民已不再是一个陌生词语。"
 xibeiideologies_conservative:0 "如今，强有力的政府试图牢牢控制着[xibei]省的方方面面，以其独有的政治范式赋予[xibei]前景新的内涵。"
 xibei_shanxi:"陕西"
