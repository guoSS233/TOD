###人物描述###
POLITICS_RUS_Mikhail_IV_DESC:0 "“荣耀啊，我们的俄罗斯沙皇，主赐予我们沙皇！”随着1920年革命后的混乱不堪，以及布尔什维克起义军队的威胁，保皇思想在俄罗斯传统势力中的影响又高涨了起来。随着尼古拉二世一家遇害，保皇派在西伯利亚拥立了革命时在外理事而躲过一劫的米哈伊尔大公为沙皇，大公随后承诺民主立宪改革，团结了社会革命党和立宪民主党的温和势力，又默认了各白军领袖的事实独立权力，保证了各军的忠诚。随后白军组成了相对统一的集体，击败了混乱不堪的布尔什维克军队，沙皇米哈伊尔四世取回了罗曼诺夫家族的天命。"

###ideas###
RUS_shuailuodezhongyangzhengfu:0 "衰落的中央政府"
RUS_shuailuodezhongyangzhengfu_desc:0 "为了打赢国内战争，沙皇对地方实力派妥协巨大，并在内战胜利后地方组成了各路军队派系控制的军区。无论是地方政治还是经济，在圣彼得堡城内的中央政府控制都极其有限。\n§Y（这个民族精神将在政局稳定后逐渐削除）§"
RUS.1.tt:0 "§R在国内政局稳定之前，我们不能更改我们的任何法案§"
RUS_weimibuzhendejingji:0 "萎靡不振的经济"
RUS_weimibuzhendejingji_desc:0 "我国多年的经济成果伴随着一战中途的失败和惨烈的国内战争，几乎灰飞烟灭。在几年的短暂恢复后，又遭到了庚午财荒的影响，导致重新下落，复杂的国内环境和外部合作的不成功使得执政的统一党对此也无能为力。\n§Y（在政局稳定到一定程度后可以进行经济改革）§"
RUS_fenliedejundui:0 "分裂的军队"
RUS_fenliedejundui_desc:0 "尽管我国在内战后在军事进步创新中取得了一些进展，然而政治的不稳定与军方各派的分歧导致难以确定一套标准的军事发展战略，这是对军事发展非常有害的。"
RUS_fuchouzhuyi:0 "俄罗斯复仇主义"
RUS_fuchouzhuyi_desc:0 "俄罗斯在大战中付出了鲜血和汗水，结果不仅什么也没有得到，反而失去了我们本来就拥有的土地，这一切不会就此作罢。等到时机成熟，无论是巴黎的背叛者，还是柏林和安卡拉的赤匪，乃至东方的大明皇帝，都会感受到俄罗斯人的怒火。\n§R（随着复仇的实现， 这个民族精神将会发生变化）§"


### 国家 ###
RUS:0 "俄罗斯"

TODRussia.1.t:0 "俄罗斯的开局大选"
TODRussia.1.d:0 "帝俄需要在新政府与旧秩序之间作出选择。此次大选将决定接下来数年的国家方向。"
TODRussia.1.a:0 "保守派胜出"
TODRussia.1.b:0 "自由派胜出"
TODRussia.1.c:0 "社会民主派胜出"
TODRussia.1.e:0 "由强人维持秩序"
TODRussia.1.f:0 "建立国家法团主义政权"
TODRussia.1.g:0 "革命派掌权"

TODRussia.2.t:0 "整合西部总督区"
TODRussia.2.d:0 "中央政府开始整合西部和西伯利亚总督区，为帝俄重新建立统一的行政体系。"
TODRussia.2.a:0 "恢复中央统治"
TODRussia.3.t:0 "远东与草原总督区"
TODRussia.3.d:0 "大明内战后的局势给了帝俄处理远东与草原总督区的机会。"
TODRussia.3.a:0 "整合东方边疆"
TODRussia.4.t:0 "高加索革命战争"
TODRussia.4.d:0 "高加索的革命势力正在结成红色阵线。高加索总督区必须立即采取行动。"
TODRussia.4.a:0 "镇压革命"
TODRussia.5.t:0 "第一次冬季战争"
TODRussia.5.d:0 "北欧局势暂时稳定后，帝俄向芬兰提出领土要求。谈判失败，冬季战争即将开始。"
TODRussia.5.a:0 "夺取芬兰湾与卡累利阿"
TODRussia.6.t:0 "俄罗斯革命战争"
TODRussia.6.d:0 "苏俄革命政府已经准备好向帝俄发动战争，俄罗斯的统一将通过内战决定。"
TODRussia.6.a:0 "迎接挑战"
TODRussia.7.t:0 "东墙战争"
TODRussia.7.d:0 "东欧国家组成的东墙阻碍了俄罗斯向西扩张。帝俄决定打破这道屏障。"
TODRussia.7.a:0 "发动东欧战争"
TODRussia.8.t:0 "中欧战争"
TODRussia.8.d:0 "如果德国在欧洲大陆继续扩张，俄罗斯将不得不把战争推进到中欧。"
TODRussia.8.a:0 "向德国宣战"
TODRussia.9.t:0 "苏俄介入中欧"
TODRussia.9.d:0 "苏俄选择支持德国对抗法国，欧洲的革命战争进入新的阶段。"
TODRussia.9.a:0 "支援德国"
TODRussia.10.t:0 "俄罗斯—法国战争"
TODRussia.10.d:0 "德法战争的结果已经改变欧洲力量平衡，俄罗斯与法国之间的冲突无法再被避免。"
TODRussia.10.a:0 "向法国宣战"
