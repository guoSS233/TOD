 SRC_la_action_help_button:0 "行动说明"
 SRC_la_action_help_open_tt:0 "查看东北局行动规则与组织协同。"
 SRC_la_action_help_title:0 "东北局行动说明"
 SRC_la_action_help_close_tt:0 "关闭行动说明。"
 SRC_la_action_help_rules_tab:0 "行动规则"
 SRC_la_action_help_organisation_tab:0 "组织协同"
 SRC_la_action_help_rules_body:0 "§Y控制状态§!\n稳定区建设与补充，争夺区支援战斗，敌占区组织与破坏。完整占领也算稳定控制。\n\n§Y六类行动§!\n工人：军械、工业、交通。地下：情报、联络网。\n政府：行政、征募。农民：人力、乡村补给。\n学生：宣传、政治组织。工商：采购、运输。\n\n§Y州特色倍率§!\n工业：工人×1.5，工商×1.25。\n城市：学生×1.5，地下与工商×1.25。\n边境：农民×1.5，地下×1.25。\n交通/前线：工人、地下、工商×1.25。\n农业区适合动员；州特色最高×1.75，组织协同另计。\n\n§Y费用与冷却§!\n行动提示显示折扣后的花费与实际收益。\n同类行动共用东北局冷却；战斗支援只作用于本州。"
 SRC_la_action_help_organisation_body:0 "§Y地下网络§!\n敌占区首次行动建立Ⅰ级，再次升为Ⅱ级。\nⅠ级：工人、学生各减10政治点；敌后效果+20%，工商+25%。Ⅱ级开放三项免费行动，每州各限一次。\n\n§Y革命行政§!\n战地政权稳定后转为行政Ⅰ。公开政府建立Ⅱ级，使农民减10政治点、收益+20%。\n秘密委员会增强地下工作；解放后提供接管秩序，首次公开政府行动半价。\n\n§Y宣传与联络§!\n青年宣传使地下、政府各减10政治点，持续60天；战地宣传使其他前线行动增强10%。\n学生联络使地下冷却降至30天，近期新建网络可将等待缩至15天。乡村联络使地下工作增强10%。\n\n§Y奖励限制§!\n网络与行政保留，临时加成到期结束。\n稳定度、战争支持每次+0.5%，各最多4次。首次当地宣传的建军奖励不重复。"
