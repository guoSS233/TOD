 SRC_la_admin_strong:0 "Ⅱ·常设行政"
 SRC_la_admin_weak:0 "Ⅰ·临时行政"
 SRC_la_admin_none:0 "尚未建立"
 SRC_la_no_target_tt:0 "请先在东北前线地图选中我方、GPS控制或正在争夺的州。"
 SRC_la_network_complete:0 "网络已成形"
 SRC_la_network_upgrade:0 "升级地下网络"
 SRC_local_network_operations:0 "东北敌后行动"
 SRC_local_network_operations_desc:0 "地下网络Ⅱ使当地组织有能力执行精密的敌后行动。每州的三项行动各限一次，已包含在网络经营投入中，无须追加政治点。"
 SRC_local_network_rail:0 "破坏铁路"
 SRC_local_network_rail_desc:0 "对[FROM.GetName]的运输设施进行一次有计划的破坏，造成0.5级基础设施损伤，并降低GPS本州补给15%、铁路修复25%，持续30天。每州仅一次。"
 SRC_local_network_intel:0 "传递驻军情报"
 SRC_local_network_intel_desc:0 "传递[FROM.GetName]的驻军部署，取得对GPS陆军情报+5，并降低GPS本州防御10%、组织恢复10%，持续30天。每州仅一次。"
 SRC_local_network_reception:0 "接应前线"
 SRC_local_network_reception_desc:0 "让[FROM.GetName]的地下组织接应我方攻势。我方在本州攻击+10%、补给消耗-10%，持续30天。每州仅一次；请在发动攻势前使用。"
 SRC_la_liberation_order:0 "革命接管秩序"
 SRC_la_liberation_order_desc:0 "事先筹建的秘密革命委员会正在帮助接管新解放的地区，维持行政连续与社会秩序。"
 SRC_la_admin_recovery_modifier:0 "革命行政的恢复能力"
 SRC_la_student_protest_modifier:0 "学生示威与地下宣传"
 SRC_la_rail_sabotage_modifier:0 "运输设施遭到破坏"
 SRC_la_garrison_intel_modifier:0 "驻军部署已经泄露"
 SRC_la_front_reception_modifier:0 "地下组织接应前线"
 SRC_local_actions.1.t:0 "工厂与交通线上的怠工"
 SRC_local_actions.1.d:0 "[event_target:SRC_local_action_state.GetName]的地下工人组织借怠工掩护实施了一次轻度破坏。车辆和机器没有被彻底摧毁，但招抚司必须抽出人手修复受损设施。持续的罢工与运输压力，正在让这条战线的后方变得不再可靠。"
 SRC_local_actions.1.a:0 "把压力维持下去。"
 SRC_local_actions.2.t:0 "青年走上街头"
 SRC_local_actions.2.d:0 "[event_target:SRC_local_action_state.GetName]的学生联络员组织了一场示威，并趁招抚司调动警备力量时传递了新的驻军情报。宣传品开始进入学校和街区，这次行动还将额外牵制当地敌军十天。"
 SRC_local_actions.2.a:0 "让消息传到前线。"
 SRC_local_actions.3.t:0 "后方的敌方暗线"
 SRC_local_actions.3.d:0 "招抚司派出的破坏人员损伤了[event_target:SRC_local_action_state.GetName]的交通设施。损失不大，但提醒我们：建立后方不只是修建仓库和招募人员。当地地下联络网与清查行动，可以提高敌方破坏的代价，并降低类似事件的成功机会。"
 SRC_local_actions.3.a:0 "加强后方联络和清查。"
