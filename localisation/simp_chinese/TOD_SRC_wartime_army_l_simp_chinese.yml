 SRC_wartime_army_record_supply:0 "§G已组织军需网络§!"
 SRC_wartime_army_help_tt:0 "§Y战时建军§!\n当前阶段只开放本阶段措施；完成足够多的工作并满足时间与建设条件后，必定弹出章节事件，确认后才进入下一阶段。未完成的旧阶段措施随后关闭；不要求清空决议池。同一时间只能进行一项工作。\n\n第一阶段：完成3项，战争达到30天。\n第二阶段：完成3项，战争达到70天，至少三项建设达到30。\n第三阶段：完成3项，战争达到110天，平均建设达到45。\n第四阶段：确立一种主要军制，战争达到150天，平均建设达到50。\n第五阶段：完成至少2项常设机构建设，战争达到150天，四项建设均达到55且平均达到60。常设机构能将对应短板至少补齐至55，通常需要2至3项。\n\n第四阶段同时只能实行一种主要军制，确立后90天内不能改制。第一至第四阶段限于对关东招抚司的战争；已经开放的第五阶段可以战后完成。毕业事件记录战时传统，最终军制仍由战后国策确立。"
 SRC_wartime_army_mechanism_desc:0 "玩家通过决议解决战争期间红军面临的实际军事问题，而非直接选择未来路线。未来军事制度将由战争中的历史选择塑造。"
 SRC_wartime_army_stage_title:0 "§Y当前军队建设状态§!"
 SRC_wartime_army_command_title:0 "指挥体系"
 SRC_wartime_army_command_low:0 "混乱"
 SRC_wartime_army_command_high:0 "统一"
