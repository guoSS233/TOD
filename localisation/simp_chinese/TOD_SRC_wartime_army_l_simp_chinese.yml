 SRC_wartime_army_training_low:0 "民兵"
 SRC_wartime_army_training_high:0 "正规"
 SRC_wartime_army_political_title:0 "政治组织"
 SRC_wartime_army_political_low:0 "薄弱"
 SRC_wartime_army_political_high:0 "成熟"
 SRC_wartime_army_supply_title:0 "军需体系"
 SRC_wartime_army_supply_low:0 "临时"
 SRC_wartime_army_supply_high:0 "完善"
 SRC_wartime_army_status_dynamic:0 "[SRC_wartime_army_current_status]"
 SRC_wartime_army_status_initial:0 "§Y仓促组成的革命武装§!\n辽阳起义后，东北红军由工人纠察队、起义士兵、地方革命组织以及少量军事人员共同组成。虽然这些部队拥有高度革命热情，但不同来源的武装缺乏统一指挥、训练体系和组织方式。战争迫使革命委员会必须决定如何建设这支新军。"
 SRC_wartime_army_status_officer:0 "§Y正在正规化的革命军队§!\n越来越多具有军事经验的人员进入指挥体系。红军正在形成现代军事结构。"
 SRC_wartime_army_status_party:0 "§Y党组织深入军队§!\n政治工作体系成为维系红军的重要基础。"
 SRC_wartime_army_status_council:0 "§Y群众性革命军队§!\n工人纠察队和基层士兵组织仍然保持较大影响。"
 SRC_wartime_army_status_officer_party:0 "§Y整编中的革命军§!\n军事指挥与政治工作正共同塑造新军的骨架。"
 SRC_wartime_army_status_officer_council:0 "§Y纪律与群众并行的革命军§!\n正规化努力与基层参与正在同时影响部队。"
 SRC_wartime_army_status_party_council:0 "§Y政治动员型革命军§!\n党组织与基层代表共同维系军队的凝聚力。"
 SRC_wartime_army_status_mixed:0 "§Y多元整编的革命军§!\n军官、政治干部与基层组织都已成为军队的一部分；战后如何统一制度，将是新的难题。"
 SRC_wartime_army_problems_title:0 "当前军事问题"
 SRC_wartime_army_problem_command:0 "• 统一指挥体系尚未建立"
