 SRC_wartime_army.1.t:0 "谁来教这些新兵？"
 SRC_wartime_army.1.d:0 "速成军事训练班已经有了场地、课程和第一批学员，但最关键的问题仍未解决：究竟由谁来担任教员？旧军官拥有系统的军事知识，工纠干部了解这支军队从何而来，党组织则希望建立统一可靠的教员选拔制度。"
 SRC_wartime_army.1.a:0 "抽调有经验的旧军官。"
 SRC_wartime_army.1.b:0 "让战斗中成长起来的工纠干部负责。"
 SRC_wartime_army.1.c:0 "由党组织统一选拔教员。"
 SRC_wartime_army.1.a.tt:0 "军事训练 §G+4§!；大幅强化职业军官影响"
 SRC_wartime_army.1.b.tt:0 "军事训练 §G+2§!，政治组织 §G+3§!；强化群众武装传统"
 SRC_wartime_army.1.c.tt:0 "军事训练 §G+2§!，政治组织 §G+4§!；强化党的集中领导"
 SRC_wartime_army.2.t:0 "走出工厂与街垒"
 SRC_wartime_army.2.d:0 "在辽阳和沈阳，熟悉工厂、街区和铁路设施的工人武装还能依靠地形与热情弥补训练不足。但随着战线向辽北和吉林推进，大部队调动、火炮协同和长距离补给的问题开始不断暴露。东北红军必须从一支城市起义军转变为真正的野战军。"
 SRC_wartime_army.2.a:0 "我们必须学会在广阔的东北作战。"
 SRC_wartime_army.3.t:0 "军官和纠察队长"
 SRC_wartime_army.3.d:0 "经过前一阶段的参谋建设、教导、政治工作与后勤整顿，东北红军已经开始适应离开工厂和街垒的野战。如何组织起来、如何在开阔战场作战，不再是唯一的问题。\n\n某部接到撤出阵地的命令。专业军官要求立即执行，工纠队出身的基层负责人则坚持应先向士兵代表说明情况。争执很快超出了这一个阵地：战场上究竟谁有权作出最后决定？\n\n我们必须明确军官、党组织与基层代表之间的权力关系，并将选定的办法落实为主要战时惯例。"
 SRC_wartime_army.3.a:0 "战场上的命令必须立即执行。"
 SRC_wartime_army.3.b:0 "基层代表应参与重大军事决定。"
 SRC_wartime_army.3.c:0 "让党代表负责协调。"
 SRC_wartime_army.3.a.tt:0 "指挥体系 §G+7§!；强化职业军官影响，并削弱士兵自治"
 SRC_wartime_army.3.b.tt:0 "政治组织 §G+6§!，指挥体系 §G+2§!；强化士兵自治"
 SRC_wartime_army.3.c.tt:0 "政治组织 §G+6§!，指挥体系 §G+4§!；强化党的集中领导"
 SRC_wartime_army.4.t:0 "基层部队的不满"
 SRC_wartime_army.4.d:0 "加强军事主官权限的命令在一些保留强烈代表会传统的部队中引发了抵触。基层干部认为，革命军队正在重新染上旧军队的官僚习气。"
 SRC_wartime_army.4.a:0 "派人说明形势，维持命令。"
 SRC_wartime_army.5.t:0 "我们已经有了一支军队"
 SRC_wartime_army.5.d:0 "几个月前，他们还是辽阳工厂里临时拿起枪的人、突然倒戈的士兵和互不熟悉的地下工作者。如今，番号、军令、军需、训练与政治工作已经把这些人连接起来。东北红军的最终制度尚未确定，但战争已经留下了无法抹去的传统。"
 SRC_wartime_army.5.a:0 "专业军事体系已经形成。"
 SRC_wartime_army.5.b:0 "军中党的组织网络已经形成。"
 SRC_wartime_army.5.c:0 "基层军事民主传统已经形成。"
 SRC_wartime_army.5.a.tt:0 "获得战时传统：§Y专业军事体系已经形成§!"
 SRC_wartime_army.5.b.tt:0 "获得战时传统：§Y军中党的组织网络§!"
 SRC_wartime_army.5.c.tt:0 "获得战时传统：§Y基层军事民主传统§!"
 SRC_wartime_army.6.t:0 "军制改组中的摩擦"
 SRC_wartime_army.6.d:0 "新的主要军制安排正在取代此前的指挥关系。军官、党代表、基层干部和士兵代表都需要重新确认自身职责；在这段磨合期内，命令传递和部队协同不可避免地受到影响。"
 SRC_wartime_army.6.a:0 "改组需要时间。"
 SRC_wartime_army_status_integrated:0 "§Y初步整合的东北红军§!\n各类起义武装已经建立起基本的共同秩序。我们至少已经像一支军队那样行动。"
 SRC_wartime_army_status_formed:0 "§Y成型的东北红军§!\n战火正在制造属于东北红军自己的军官、老兵和组织传统。"
 SRC_wartime_army_status_northeast_red_army:0 "§Y东北红军§!\n这已经是一支真正的军队；战后改革将决定它最终成为怎样的军队。"
 SRC_wartime_army_status_regular_final:0 "§Y革命的正规军§!\n专业、参谋、协同和后勤构成了军队的骨架。"
 SRC_wartime_army_status_party_final:0 "§Y党旗引领的军队§!\n政治凝聚和组织恢复能力使部队能够持续作战。"
 SRC_wartime_army_status_people_final:0 "§Y武装起来的人民§!\n群众动员和核心地区的韧性成为军队最鲜明的特征。"
