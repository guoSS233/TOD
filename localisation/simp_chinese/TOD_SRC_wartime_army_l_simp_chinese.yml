 SRC_wartime_army_officer_precedent:0 "• 留任了起义军官，军事经验进入指挥体系。"
 SRC_wartime_army_commissar_precedent:0 "• 派驻了党代表，政治工作进入部队日常。"
 SRC_wartime_army_council_precedent:0 "• 承认了士兵代表会，基层参与成为传统。"
