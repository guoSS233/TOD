 SRC_wartime_army_mobilisation:0 "士兵代表协助动员"
 SRC_initially_integrated_red_army:0 "初步整合的东北红军"
 SRC_initially_integrated_red_army_desc:0 "来自工纠队、起义士兵和地方革命组织的武装已经建立起最基本的指挥与训练秩序。红军至少已经像一支军队那样行动，但主动进攻、协同、补给和新兵训练仍有明显缺陷。"
 SRC_formed_northeast_red_army:0 "成型的东北红军"
 SRC_formed_northeast_red_army_desc:0 "战争锻造了属于东北红军自己的军官、老兵和作战传统。过去那些致命的组织问题已大体得到控制，这支军队开始从解决先天缺陷转向形成自身特色。"
 SRC_northeast_red_army:0 "东北红军"
 SRC_northeast_red_army_desc:0 "辽阳起义中诞生的各类革命武装已经被建设成一支真正的军队。它仍需要在战后改革中确定长久的制度形态，但仓促起义留下的问题已经成为历史。"
 SRC_revolutionary_regular_army:0 "革命的正规军"
 SRC_revolutionary_regular_army_desc:0 "职业军官、统一指挥、参谋协同、军衔制度和正规后勤共同塑造了这支军队。它不依赖无穷无尽的兵员，而依靠专业组织把已有部队投入精心筹划的战役。"
 SRC_party_led_army:0 "党旗引领的军队"
 SRC_party_led_army_desc:0 "党组织深入部队日常，使政治动员、组织纪律和共同信念成为军队持续作战的基础。这未必是参谋体系最精密的军队，却是一支难以被击溃、能够迅速恢复的军队。"
 SRC_armed_people:0 "武装起来的人民"
 SRC_armed_people_desc:0 "广泛的群众武装、基层代表和地方动员网络构成了军队的根基。它不擅长繁复精密的正规战计划，却能够迅速扩充、补充损失，并在核心地区展现惊人的韧性。"
 SRC_wartime_army_unify_designations:0 "统一各部番号"
 SRC_wartime_army_unify_designations_desc:0 "工纠队、起义营和地方武装仍沿用不同名称。统一番号是建立正式指挥关系的第一步。"
 SRC_wartime_army_unify_designations_tt:0 "指挥体系 §G+8§!，军事训练 §G+2§!，陆军经验 §G+5§!"
 SRC_wartime_army_crash_training_courses:0 "开办速成军事训练班"
 SRC_wartime_army_crash_training_courses_desc:0 "集中现有军事人才和战斗骨干，用最短时间补上新兵最基本的队列、射击和战术课程。"
 SRC_wartime_army_crash_training_courses_tt:0 "军事训练 §G+10§!，完成后决定由谁担任教员"
 SRC_wartime_army_temporary_discipline:0 "制定红军临时军纪"
 SRC_wartime_army_temporary_discipline_desc:0 "征用、俘虏处理、战利品归属、临阵脱逃和扰民行为都必须有统一规则。"
 SRC_wartime_army_temporary_discipline_tt:0 "政治组织 §G+7§!，指挥体系 §G+3§!，组织恢复惩罚得到小幅缓解"
 SRC_wartime_army_armament_registry:0 "清点军械与弹药"
 SRC_wartime_army_armament_registry_desc:0 "有枪和知道自己究竟有多少枪，是完全不同的两件事。"
 SRC_wartime_army_armament_registry_tt:0 "军需体系 §G+8§!，陆军损耗 §G-3%§!"
 SRC_wartime_army_select_grassroots_cadres:0 "从工纠队中选拔基层干部"
 SRC_wartime_army_select_grassroots_cadres_desc:0 "从战斗和群众工作中成长起来的工纠骨干更熟悉自己的战士，虽然培养他们需要更多时间。"
 SRC_wartime_army_select_grassroots_cadres_tt:0 "军事训练 §G+6§!，政治组织 §G+4§!；强化群众武装传统"
 SRC_wartime_army_select_grassroots_cadres_requirement_tt:0 "已经承认§Y士兵代表会§!，或者政治组织达到§Y35§!"
 SRC_wartime_army_expand_field_command:0 "临时扩充前线指挥机关"
 SRC_wartime_army_expand_field_command_desc:0 "为不断扩大的战线补充参谋、通讯人员和分区指挥机关。"
 SRC_wartime_army_expand_field_command_tt:0 "指挥体系 §G+10§!，计划速度惩罚进一步缓解；强化职业军官影响"
 SRC_wartime_army_expand_field_command_requirement_tt:0 "已经留任§Y起义军官§!，或者指挥体系达到§Y35§!"

 SRC_wartime_army_field_staff_office:0 "成立战地参谋处"
 SRC_wartime_army_field_staff_office_desc:0 "离开熟悉的工厂和街垒后，大部队调动、火炮协同和长距离行军需要专门的参谋机关。"
 SRC_wartime_army_field_staff_office_tt:0 "指挥体系 §G+12§!，军事训练 §G+3§!；强化职业军官影响。职业军官传统较强时返还§G10§!政治点"
 SRC_wartime_army_veteran_training_units:0 "组建老兵教导队"
 SRC_wartime_army_veteran_training_units_desc:0 "把前线老兵轮换到教导队，使战争经验成为红军自己的训练制度。"
 SRC_wartime_army_veteran_training_units_tt:0 "军事训练 §G+10§!，指挥体系 §G+3§!；根据此前传统影响军制倾向"
 SRC_wartime_army_veteran_training_units_requirement_tt:0 "战争已经持续§Y90日§!"
 SRC_wartime_army_field_political_work:0 "建立战地政治工作制度"
 SRC_wartime_army_field_political_work_desc:0 "让政治教育、战地宣传和基层组织跟随部队，而不是留在辽阳的办公室里。"
 SRC_wartime_army_field_political_work_tt:0 "政治组织 §G+10§!；已经派驻党代表时额外 §G+3§!，强化党的集中领导"
 SRC_wartime_army_local_initiative:0 "赋予基层单位临机权"
 SRC_wartime_army_local_initiative_desc:0 "战场变化远快于辽阳委员会的电报，基层部队必须能够根据实际情况自行决定行动。"
 SRC_wartime_army_local_initiative_tt:0 "指挥体系 §G+4§!，军事训练 §G+4§!；强化基层主动性与士兵自治"
 SRC_wartime_army_field_repair_workshops:0 "建立前线修械所"
 SRC_wartime_army_field_repair_workshops_desc:0 "在前线修复损坏和缴获的武器，减少对辽阳后方工厂的完全依赖。"
 SRC_wartime_army_field_repair_workshops_tt:0 "军需体系 §G+10§!，陆军损耗 §G-5%§!，装备缴获 §G+5%§!"
 SRC_wartime_army_railway_priority:0 "铁路优先军运"
 SRC_wartime_army_railway_priority_desc:0 "把有限的铁路运力优先交给军队，将不可避免地挤压民用运输。"
 SRC_wartime_army_railway_priority_tt:0 "军需体系 §G+8§!，补给消耗 §G-2.5%§!，稳定度 §R-1%§!"

 SRC_wartime_army_strengthen_commanders:0 "加强军事主官权限"
 SRC_wartime_army_strengthen_commanders_desc:0 "在瞬息万变的战场上，军事主官必须拥有不受冗长讨论干扰的决定权。"
 SRC_wartime_army_strengthen_commanders_tt:0 "指挥体系 §G+12§!，军事训练 §G+5§!；职业军官影响大幅提高。士兵自治较强时可能引发不满"
 SRC_wartime_army_expand_party_network:0 "扩大党组织进入基层部队"
 SRC_wartime_army_expand_party_network_desc:0 "把党的组织网络延伸至基层部队，使政治领导与军事行动形成稳定联系。"
 SRC_wartime_army_expand_party_network_tt:0 "政治组织 §G+12§!，指挥体系 §G+5§!；强化党的集中领导。政治组织达到§Y60§!时额外 §G+3§!"
 SRC_wartime_army_expand_soldier_representatives:0 "扩大基层军人代表制度"
 SRC_wartime_army_expand_soldier_representatives_desc:0 "让士兵代表进入更多基层单位，在扩大动员能力的同时保留起义时代的军事民主传统。"
 SRC_wartime_army_expand_soldier_representatives_tt:0 "政治组织 §G+8§!，军事训练 §G+5§!；强化士兵自治，并获得90日动员增益与计划度代价"
 SRC_wartime_army_arrangement_already_current_tt:0 "该项制度当前不是正在实行的主要军制安排"
 SRC_wartime_army_arrangement_cooldown_tt:0 "当前军制安排已经稳定，必须等待§Y90日§!后才能再次改制"
 SRC_wartime_army_arrangement_switch_cost_available_tt:0 "改制时需要在决议基础花费之外额外支付£pol_power §Y20§!"
 SRC_wartime_army_arrangement_switch_cost_tt:0 "由于正在改变现行军制，额外花费£pol_power §R20§!；军队将经历§Y30日§!整编摩擦，并损失少量相关建设水平"
 SRC_wartime_army_reestablish_commanders_tt:0 "重新将§Y军事主官临机处置权§!确立为当前主要军制；不会重复获得首次建设奖励"
 SRC_wartime_army_reestablish_party_tt:0 "重新将§Y党代表军政协调权§!确立为当前主要军制；不会重复获得首次建设奖励"
 SRC_wartime_army_reestablish_representatives_tt:0 "重新将§Y基层士兵代表参与权§!确立为当前主要军制；不会重复获得首次建设奖励"

 SRC_wartime_army_general_headquarters:0 "建立东北红军总司令部"
 SRC_wartime_army_general_headquarters_desc:0 "把临时的分区指挥机关整合为能够统筹整个东北战场的总司令部。"
 SRC_wartime_army_general_headquarters_tt:0 "指挥体系 §G+10§!，计划速度惩罚进一步缓解；不同军制传统会带来额外收益；指挥体系最低提高至§Y55§!"
 SRC_wartime_army_general_headquarters_requirement_tt:0 "指挥体系达到§Y55§!"
 SRC_wartime_army_permanent_training_system:0 "建立常设教导体系"
 SRC_wartime_army_permanent_training_system_desc:0 "把速成班和老兵教导队整合为不依赖个别干部的常设训练体系。"
 SRC_wartime_army_permanent_training_system_tt:0 "军事训练 §G+10§!，训练时间惩罚 §G-5%§!；军事训练最低提高至§Y55§!"
 SRC_wartime_army_permanent_training_system_requirement_tt:0 "军事训练达到§Y50§!"
 SRC_wartime_army_complete_political_reorganisation:0 "完成军队政治组织整编"
 SRC_wartime_army_complete_political_reorganisation_desc:0 "把战争中形成的政治工作惯例整理为覆盖各级部队的正式制度。"
 SRC_wartime_army_complete_political_reorganisation_tt:0 "政治组织 §G+10§!，组织恢复 §G+5%§!；政治组织最低提高至§Y55§!"
 SRC_wartime_army_complete_political_reorganisation_requirement_tt:0 "政治组织达到§Y55§!"
 SRC_wartime_army_unified_supply_department:0 "建立统一军需总处"
 SRC_wartime_army_unified_supply_department_desc:0 "统一仓库、运输、采购和修械机构，使军需工作摆脱临时调拨。"
