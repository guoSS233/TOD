 SRC_wartime_army_retain_officers:0 "留任起义军官"
 SRC_wartime_army_retain_officers_desc:0 "保留拥有实战经验的起义军官，提升部队正规化程度。"
 SRC_wartime_army_party_cells:0 "派驻党代表"
 SRC_wartime_army_party_cells_desc:0 "向部队派驻党代表，建立政治工作和支部体系。"
 SRC_wartime_army_soldier_committee:0 "承认士兵代表会"
 SRC_wartime_army_soldier_committee_desc:0 "承认士兵代表参与部队管理，扩大基层动员能力。"
 SRC_wartime_army_supply_network:0 "组织战时军需网络"
 SRC_wartime_army_supply_network_desc:0 "整合工厂、仓库与前线运输线，建立可持续的战时军需调配体系。"
 SRC_wartime_army_category:0 "东北红军战时建军"
 SRC_wartime_army_title:0 "东北红军战时建军"
 SRC_wartime_army_records_title:0 "§Y已采取的措施§!"
 SRC_wartime_army_record_officers_tt:0 "§Y已留任起义军官§!\n指挥体系 §G+10§!，军事训练 §G+5§!"
 SRC_wartime_army_record_party_tt:0 "§Y已派驻党代表§!\n政治组织 §G+10§!，指挥体系 §G+3§!"
 SRC_wartime_army_record_council_tt:0 "§Y已承认士兵代表会§!\n政治组织 §G+8§!，军事训练 §G+2§!；动员速度 §G+15%§!，持续 §Y30天§!"
