 SRC_wartime_army.7.t:0 "总算有了个军队的样子"
 SRC_wartime_army.7.d:0 "辽阳起义最初的混乱正在消退。番号开始明确，前线开始知道该向谁领取命令和弹药，各支武装之间也建立起最基本的联络。那些曾经各自为战的人，终于开始以东北红军的名义行动。\n\n但“能够组织起来”并不等于“能够打现代战争”。随着新兵不断涌入，训练、军纪、军械登记和基层指挥暴露出了新的问题。我们已经解决了眼前最紧迫的整顿工作，现在必须真正把这些人训练成士兵。"
 SRC_wartime_army.7.a:0 "那么，就从最基础的开始。"
 SRC_wartime_army.8.t:0 "临时办法不能永远临时下去"
 SRC_wartime_army.8.d:0 "战争开始时，许多制度只是为了应付眼前危机而建立。经过整顿、训练和野战的考验，军官、党代表与基层代表之间已经形成了主要的战时惯例，军令与组织也有了相对稳定的秩序。\n\n如今，成千上万的人在同一套体系下作战，那些曾经可以靠个人威望、工会习惯或临时协调解决的问题，必须被写进常设制度。总司令部、教导体系、政治组织和军需机构，应该把这几个月的战争经验变成可以持续运作的军队。"
 SRC_wartime_army.8.a:0 "把战争经验写进制度。"
 SRC_wartime_army.5.d_professional:0 "$SRC_wartime_army.5.d$\n\n§Y专业军事体系已经形成。§!起义军官、战地参谋与教导机构的经验被纳入了常设制度。命令、训练与协同开始依靠一套可以传承的军事体系运转。战争留下的这份遗产，将成为战后军事改革的重要基础。"
 SRC_wartime_army.5.d_party:0 "$SRC_wartime_army.5.d$\n\n§Y军中党的组织网络已经形成。§!从最初派驻的党代表到覆盖基层部队的政治组织，党在动员、协调与维系部队秩序中的作用已经成为军队的日常。战争留下的这份遗产，将成为战后军事改革的重要基础。"
 SRC_wartime_army.5.d_people:0 "$SRC_wartime_army.5.d$\n\n§Y基层军事民主传统已经形成。§!工纠队干部、士兵代表与前线基层单位，在战争中逐渐建立起参与军事事务的惯例。群众武装的经验被保存为这支军队自己的传统，并将影响战后的军事改革。"
