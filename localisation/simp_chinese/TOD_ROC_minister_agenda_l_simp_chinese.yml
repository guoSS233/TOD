 ROC_minister_agenda.22.t:0 "谁来决定播种的那一天"
 ROC_minister_agenda.22.d:0 "推广处长把省农务厅印好的公告放在晏阳初桌上，说播种日期已经定了，月底统一，各县照此报产量。晏阳初问：“北江能灌水，山坡村的渠通了吗？”处长答：“渠工在赶，问题不大。”晏阳初翻开发芽记录：“这两袋种子受潮结块，也照发？”处长笑了：“这正是要请示的——公告已经印了，改口，上一季的宣传账就难看了。”\n\n女农技员被叫进来，把修渠工人的签名册摊开：“按公告的日期，水根本供不到山坡村。”她停了一下，又说：“我不反对统一播种，只是日期得往后让一让。”处长立刻接话：“要改可以，得中央先认这一季的宣传支出，再补一份复测的差旅费。”\n\n中央农事示范的播种公告已发，大同党中派守着统一口径；先验种再发，虽然能让推广安排先往前走，却须撤回原公告，让经手宣传的人在更正栏签字。按旧公告等水渠修完，口径得以保留，部长的日程也跟着空转；分县试种则允许各县拿证据，其他两派都可参与复核，只是还要多等一轮会签。\n\n晏阳初把公告和签名册并排放着：“按期照单播种，坏种只有一半能出芽，播下去是赌；先验种再发，种子就得先停着，农民会说我们只会填表；分县先试再比，又得先认一笔复核的差旅费。”他问女农技员：“照你看，哪条路能先动？”她没正面答：“先把水修通，比什么都强。”处长低声补一句：“水要钱，钱要批，批要开会。”"
 ROC_minister_agenda.22.a:0 "验种后再发放"
 ROC_minister_agenda.22.b:0 "分县试种复核"
 ROC_minister_agenda.22.c:0 "暂缓修订公告"
 ROC_minister_agenda.31.t:0 "两栏预算上的同一笔石料款"
 ROC_minister_agenda.31.d:0 "阮啸仙把中央财政处的季度支出册翻到中间一页，指着同一段县道：“这一栏赈灾修路列了一次石料款，那一栏军需运输又列了一次，签收人还是同一位已经调走的工务员。”财政科长凑近看了看，说：“分栏是会计的习惯，两笔用途不同，未必是重复。”阮啸仙问：“那石料到底铺在哪了？”科长答：“用途明细，账册上没有，得查原始单据。”\n\n仓库管理员被叫进来，翻出领料单，手有点抖：“这张是后来补开的。”阮啸仙接过来，见日期比道路验收章还晚，却比工务员的调职令早。“补开？谁让补的？”管理员不敢看科长：“原来那张，说找不到了。”阮啸仙又问财政科长：“口头调拨，有字据吗？”科长答：“命令来自一个已经撤销的临时委员会，如今没人能签字确认。”\n\n在中央经济财政会议的预算审计中，大同党左派推举的预算监察人员也参与过这两笔拨款。公开票据追责能尽快查清账目、缓和问责，却要调查本派推举的签字人，阮啸仙得付出他们的信任；封存后将涉款列入公共账目复核，中派可以继续主持审查，左派则失去当场追责的机会。只追回重复款可护住现有经手人，总账却要拖回下一轮。\n\n阮啸仙把支出册和领料单并排摆好，说：“账上两笔，仓库一张单，日期还排在验收之后、调职之前。这中间的署名，谁的位置，谁就担这份责。”财政科长退后半步，只道：“账册可以封存，待查；也可以只把重复的那一笔追回来。”阮啸仙没接这个茬，只说：“水泥还在雨里受潮，验收记录却写了两份，一份说可用，一份说报废。”"
 ROC_minister_agenda.31.a:0 "公开票据追责"
 ROC_minister_agenda.31.b:0 "先封存账册"
 ROC_minister_agenda.31.c:0 "只追回重复款"
 ROC_minister_agenda.32.t:0 "盖章验收单与欠薪条"
 ROC_minister_agenda.32.d:0 "省建设科送来的年度决算里，三座桥、两条县道、一段堤防都列了验收款，唯独没有工人的领薪清册。阮啸仙问承包行代表：“桥只立了桥墩，怎么报告上写全部交付？”代表苦笑：“尾款一直不到账，我们只能停。”阮啸仙又抽出一张照片：“那这座桥的料，怎么挪去修了临时码头？”代表低了头：“码头急，先借，日后补。”\n\n工头随后递上一叠按了手印的欠薪条，最早一张已两个月。阮啸仙问承包行：“县里既已盖章，领款怎么被退了回来，理由只写‘手续不合’？”代表把退回单推过来：“我也想知道哪里不合，章是县里自己盖的。”财政处这时递上工程章的登记簿：“章是真章，可签字验收那天，经办人正在省城开会，人根本没到工地。”\n\n中央决算审核会上，大同党左派的工会代表既想替工人讨账，也担心查验收时牵出自己推举的负责人。阮啸仙若先替欠薪立凭证并公开签收链条，问责能先有交代，本派支持却会折损；分项核销让中派保住复核位置，也把公共工程账纳入统一审计，只是每个条目都要重签。沿用旧章可以保住经手人，账册仍须送回补签。\n\n阮啸仙把决算、欠薪条、登记簿并排摆好：“章是真的，人不在场；款没到位，工却没完；材料挪了，账还挂着。”他问财政处：“这枚真章盖下去，账面上的‘交付’二字，该谁认？”财政处半晌道：“可以分项核，已完的结，未完的缓；也可以先按既有验收继续走。”阮啸仙没接，只把欠薪条最上面那张翻过来，让手印朝上：“工钱拖了两个月，渡口只剩几日燃料，账要结，人也要给个说法。”"
 ROC_minister_agenda.32.a:0 "先补工人欠薪"
 ROC_minister_agenda.32.b:0 "分项核销决算"
 ROC_minister_agenda.32.c:0 "沿用验收章"
 ROC_minister_agenda.41.t:0 "工资册上的设备折旧费"
 ROC_minister_agenda.41.d:0 "陈赞贤把机器厂的工资册抄本摊开，连续三个月的夜班栏里都扣了“设备折旧费”，可厂方总账上找不到对应的支出。他问技术主任：“钱扣了，账上却没有，这笔折旧去了哪？”技术主任答：“都买了防护罩和电线，安全基金早就花完了。”陈赞贤抽出工会记录：“工人只同意从利润里拨安全款，谁同意从工资里扣？”主任说：“工资核算有厂里的既有办法。”\n\n中央经济会议上，大同党左派的工会希望先厘清事故责任再发钱，不愿让补发变成免查的收据。陈赞贤若先决定补发，就越过了本派代表坚持的复核次序，能尽快稳定局面，却得承担他们的不满；联合查票留给中派签审位置，也让工厂账并入公共核验，代价是再等一轮会签。先保订单能安抚担心停工的工人，部长的复核案仍得排队。\n\n工头站在门边，忽然插了一句：“防护罩，是出了事故才装上的。”陈赞贤让他进来细说。话没讲完，一封医院报告送到：受伤学徒的医药费，是从工资扣款里付的，账上却记在工厂公用支出。陈赞贤把报告举到技术主任面前：“你们说这笔钱用在设备上，那学徒的医药费，怎么也算设备折旧？”主任退了一步：“账目归会计，口径我不清楚。”\n\n陈赞贤把工资册、工伤报告、订单期限并排摆好：“现在补发，零件采购款会出缺口；等审计查完，第二班可能集体不开机；只让厂方自己写说明，事故责任又会被同一本账盖住。”他问技术主任：“先保订单，还是先保人？”主任没答，只说：“订单是省里下的，期限紧，耽误不得。”门口采购科又探头催开机，陈赞贤没回头。"
 ROC_minister_agenda.41.a:0 "补发扣下工资"
 ROC_minister_agenda.41.b:0 "联合核对凭证"
 ROC_minister_agenda.41.c:0 "保住订单，复核缓办"
 ROC_minister_agenda.42.t:0 "赶交货的夜班生产协定"
 ROC_minister_agenda.42.d:0 "泵机订单催得紧，采购科只拨了半数铜料，仓库里却堆着民用水厂等着的轴承。陈赞贤问厂长：“铜料不够，夜班排满就赶得及？”厂长答：“排满夜班，还是能按期交货，保住全厂岗位。”陈赞贤又问：“加班费按什么算？”厂长说：“眼下还是普通班次，回头再补。”\n\n女工把一只报废轴承放到桌上：“上周这台泵，轴承尺寸不合格，整台报废，生产报表里还记作完成产量。”陈赞贤拿起来看，编号属旧仓库，领料日期和仓库封条对不上。厂长忙说：“盘点的疏漏，回头我查。夜班的事，我支持——只要工资和工时先写进一张表，工人签字，厂里照办。”\n\n中央经济会议上的大同党左派工会代表要求工人看过工时和验收条款后再签；抢在争议消解前签夜班协议，虽然可以先推动施政，却压缩了本派代表的商议时间。分批排产把验收纳入公共监督，给中派留出复核权，左派则要容忍先行妥协；暂缓复核可以保住原有会签程序，部长的日程却要延后。\n\n陈赞贤看着他：“你先前不肯签，现在又肯了，还附了条件。”厂长笑：“早签早开机，对大家都好。”陈赞贤把原料清单、工会意见、违约条款并排摆好：“继续开这会，机器停在半成品上，订单要丢；现在开机，夜班和质量的事就压到工人头上；把会签缩成备案，生产委员会就只剩一枚空章。”他问女工：“这张表，你敢签吗？”女工说：“表里没写由谁验收，签了也白签。”"
 ROC_minister_agenda.42.a:0 "签订夜班生产协定"
 ROC_minister_agenda.42.b:0 "分批排产会签"
 ROC_minister_agenda.42.c:0 "暂缓复核生产协定"
 ROC_minister_agenda.51.t:0 "灌溉沟究竟属于谁"
 ROC_minister_agenda.51.d:0 "萧铮把新税册和县图并排摊开，指着那条灌溉沟：“县图上，这沟划给了祠产，几户实际耕作的，倒成了无地户。”测绘员答：“沿用的是旧图，沟线一直这么画。”萧铮又翻出地主那张旧契：“只写‘沟北三亩’，连四至都没有，这契怎么认？”测绘员说：“旧契归旧契，图归图，两下不一致，只能按图。”\n\n中央经济会议里，大同党右派中维护产权的商户和地主担心暂停催税会削弱现有凭证的权威；萧铮若按下暂停令，就借用了本派的信用，即便得到部分支持，也要承受更多反对。村社共同校图给中派一个复核位置，让市场方向的办法继续待议，但右派得容忍县档之外的凭据进入卷宗。沿用县档则保住原先程序，争议留待下一轮。\n\n一位寡妇带来一张保存十年的水费收据，背面盖着县公所的旧编号。测绘员对着旧底图一查，脸色变了：“这编号对应的是洪水前的老沟线，现在这张县图，抄错了。”地主代理人起身：“代缴水费，不等于承认耕作权。”萧铮没接，只问测绘员：“复测要几天？经费还剩多少？”对方答：“测绘队只剩一天食宿，财政处又催着这个月评完税。”\n\n萧铮把旧契、收据、县图收拢：“现在停征，县库修渠款会断；只认印章最齐的那份契约，小农既失地又失信用；可每张私人收据都能改产权，地籍就稳不住。”地主代理人插话：“县档是既有的，改动牵连太广。”萧铮看着那张旧编号：“旧编号只能证明地图画错过一条沟，那片田最后归谁，不靠一张收据说了算，也不靠一张图说了算。”"
 ROC_minister_agenda.51.a:0 "暂缓争议田催税"
 ROC_minister_agenda.51.b:0 "村社共同校图"
 ROC_minister_agenda.51.c:0 "沿用县档记录"
 ROC_minister_agenda.52.t:0 "抵押田契还是公开秤价"
 ROC_minister_agenda.52.d:0 "萧铮把县信贷处的贷款名单和集市收购价单并排摆开，问信贷员：“农具贷凭什么作保？”信贷员答：“按规矩，要有田契。”萧铮指指名单上几户妇女：“她们实际种着地，怎么因契约上写的是亲属名字，就被划到门外？”信贷员说：“名单按契约核的，这也是既有口径。”\n\n一位女农户把两只秤砣放到桌上：“收购行的秤，我拿去验了，这一只少称半斤。”萧铮问：“秤具你们封存过没有？”信贷员摇头：“封存不归我们，县里也没下这个权。”话没落，又查出信贷名单把一块地主田误列成了小农自耕地。这时银行电报到了，催着本周交担保，否则改向大商号放款。\n\n在中央经济会议上，大同党右派担心不用田契担保会使信贷合同难以追偿，萧铮改用合作社担保，即便赢得部分支持，还是会动用本派的信誉。公开利率和秤价给中派共同审查的依据，也为市场方向的办法留出空间；重新核实借款名单就要等一轮。按旧田契处理则保住右派的现成规则，未列入的农户仍要等下一次议程。\n\n萧铮把地籍图、贷款条款、抽检结果收拢：“只护着田契，秋粮还是会被低价收走；只盯着秤价，农具贷款照样落到地主名下；全交给合作社担保，坏账就都堆到合作社头上。”信贷员低声：“担保要是交不出，银行的时限就过了。”萧铮问女农户：“这秤，还有第二把吗？”她说：“有，另一把，我还没舍得拿出来。”"
 ROC_minister_agenda.52.a:0 "合作社担保放贷"
 ROC_minister_agenda.52.b:0 "公开利率与秤价"
 ROC_minister_agenda.52.c:0 "先按田契放款"
