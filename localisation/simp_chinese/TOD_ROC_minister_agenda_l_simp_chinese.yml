 ROC_ma_yu_1_decision:0 "于树德：合作社信用"
 ROC_ma_yu_1_decision_desc:0 "旧借粮还挂在大账上，春耕赊购被它绊着开不了张。先核销、暂缓收回，或叫合作社和商号共同重算，三派各有一本账，于树德要的是先把账目摆平。"
 ROC_ma_yu_2_decision:0 "于树德：城乡采购"
 ROC_ma_yu_2_decision_desc:0 "医院、工厂等着粮布，农户不肯照旧价交售。先按新价卸粮、延后签收，或分月结算，于树德把各方拉回采购单前，先把各自的责任摆明。"
 ROC_ma_yan_1_decision:0 "晏阳初：乡村调查"
 ROC_ma_yan_1_decision_desc:0 "县里报的是丰收，可田界、租约、灌渠样样对不上。冻结争议税、沿用旧图，或共同校正地籍，各派争不出结果，晏阳初要先下乡把底账摸清楚。"
 ROC_ma_yan_2_decision:0 "晏阳初：农技推广"
 ROC_ma_yan_2_decision_desc:0 "省里的统一播种表，跟各县水情差了半个月。先验种发放、暂缓修订公告，或分县试种复核，晏阳初要先拿县情说话，再谈推广从哪一县起，别拿一张表管全省。"
 ROC_ma_ruan_1_decision:0 "阮啸仙：预算稽核"
 ROC_ma_ruan_1_decision_desc:0 "同一笔石料款，赈灾修路和军需运输的账上都记着，县库却拿不出领据。公开票据追责、只追回重复款，或先封存账册，阮啸仙要先核到那一笔钱去了哪。"
 ROC_ma_ruan_2_decision:0 "阮啸仙：决算核查"
 ROC_ma_ruan_2_decision_desc:0 "决算写着工程验收完毕，工人手里还攥着欠薪条。先补欠薪、沿用验收章，或分项核销决算，阮啸仙要先让验收与欠薪两笔账对得上，才谈决算。"
 ROC_ma_chen_1_decision:0 "陈赞贤：工资核验"
 ROC_ma_chen_1_decision_desc:0 "工资册里多出一项折旧扣款，工人不认，厂方说钱已买了安全设备。补发工资、保住订单缓办复核，或联合核对凭证，陈赞贤要先让工资册经得起工人当面翻看。"
 ROC_ma_chen_2_decision:0 "陈赞贤：生产协定"
 ROC_ma_chen_2_decision_desc:0 "紧急订单催着夜班赶工，仓库却缺料，排产单上也没有工会的章。签夜班生产协定、暂缓复核，或分批排产会签，陈赞贤要先立一份人人认账的排产协定。"
 ROC_ma_xiao_1_decision:0 "萧铮：地籍复核"
 ROC_ma_xiao_1_decision_desc:0 "新地籍把灌溉沟划进祠产，实际耕作的小农反被列成无地户。暂缓催税、沿用县档，或由村社共同校图，各执一词，萧铮要先给农户留一个能申诉的凭据。"
 ROC_ma_xiao_2_decision:0 "萧铮：小农市场"
 ROC_ma_xiao_2_decision_desc:0 "信贷处只认田契放款，佃户和妇女却没有契上署名。合作社担保、按田契放款，或公开利率与秤价，萧铮要先让实耕的人也能借到本钱，别让一张田契卡住人。"
