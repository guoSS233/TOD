l_simp_chinese:
 ROC_ma_yu_1:0 "信用账簿"
 ROC_ma_yu_1_desc:0 "灾年那批借粮在信用簿上记了两处，县里算赈济、合作社算欠款，谁都不肯先把账抹平。于树德让合作社、农会与城里商户逐笔核对，把下一季赊购本钱一并写进责任表；会签拖一天，春耕赊购就少一天，各派都须在表上画押。"
 ROC_ma_yu_2:0 "城乡采买"
 ROC_ma_yu_2_desc:0 "省城医院和工厂催着要粮布，农户却不肯再按旧价交售。于树德把采购单与信用账并排摊开，运费、货价、付款期限一件件问到底，谁都不许把涨价的账只挂到农户头上，合同先把这几样钉死。"
 ROC_ma_yu_3:0 "供销核账"
 ROC_ma_yu_3_desc:0 "审计员对出合作社账与城里验收单差了两成，说法有三套：补贴、损耗、虚报。于树德让农户代表进来一起复核，赊欠与运输扣款摊在明处，坏账不许再往农户头上转，中央须在下一轮结算前定下由谁认。"
 ROC_ma_yan_1:0 "下乡问田"
 ROC_ma_yan_1_desc:0 "县里报的是丰收，下到村里，田界、租约、灌渠样样对不上。晏阳初带调查员下乡，把地租、缺水与农具逐项记下，农户口述也算可复查的材料；县情不能由哪一派拿去当现成证据，得让数字自己说话。"
 ROC_ma_yan_2:0 "县情地图"
 ROC_ma_yan_2_desc:0 "省里一张播种表只管一个日期，山地与河谷的水情却差出半个月。晏阳初请农技员拿县情地图作证，主张中央定目标时给各县留出调整农时的余地；统一报表是否改、由谁出复测费，还须各派在会上议定。"
 ROC_ma_yan_3:0 "农技示范"
 ROC_ma_yan_3_desc:0 "第一批耐旱稻种受了潮，农务厅照旧催各县按期报产量。晏阳初让农技员与农户同记发芽率、工时与收成，凭实测再定推广；若推广砸了，由哪一级担，也得先写进预算与试验表，别让县里拿丰收两个字交差。"
 ROC_ma_ruan_1:0 "预算稽核"
 ROC_ma_ruan_1_desc:0 "同一笔石料款，赈灾修路和军需运输的预算里都记着，县里却拿不出完整的领据。阮啸仙从拨款、到货、施工到签字人逐项核起，先把缺口堵住，不许它顺进下一期的公款里，谁花的钱谁画押。"
 ROC_ma_ruan_2:0 "决算过账"
 ROC_ma_ruan_2_desc:0 "工程报告写着已验收，工人手里还攥着两个月的欠薪条。阮啸仙把公共预算、现场进度与决算凭证并排对照，每笔付款都要追到责任人；决算若只保数字、不核工资，公共工程也就没人信了。"
 ROC_ma_ruan_3:0 "预算公开"
 ROC_ma_ruan_3_desc:0 "中央要公布下年度预算，财政处却把几项工程超支和没兑的工资悄悄删去。阮啸仙逐项核实拨款与验收，在各方各执一词时，立起一份基层也能翻看的责任清单，让数字背后有人名，谁签字谁认账。"
 ROC_ma_chen_1:0 "核看工资"
 ROC_ma_chen_1_desc:0 "机器厂的工资册多出一项折旧扣款，工人说从没同意过，厂方说钱已拿去添安全设备。陈赞贤让工会逐页翻工资册，欠薪、工时、工伤都核清了再排产；这账不能由厂方一方说了算，还得报中央复核。"
 ROC_ma_chen_2:0 "厂内协定"
 ROC_ma_chen_2_desc:0 "紧急订单催着夜班赶工，仓库却缺铜料，排产单上也没有工会的章。陈赞贤让工厂委员会把原料、工资、质量、交货日期写成同一份可查的承诺，谁也不许用赶工当借口少记一样，排产照旧，账也要全。"
 ROC_ma_chen_3:0 "工人验收"
 ROC_ma_chen_3_desc:0 "验收表把整批泵机都算合格，工人返工单上却记着轴承不合格，奖金也早按高产量发了。陈赞贤让工人代表核看交货与工资两本账，按大家共同确认的合格产量结算，别让废品也领奖金，合格不合格，得工人在场点得出来。"
 ROC_ma_xiao_1:0 "田界入册"
 ROC_ma_xiao_1_desc:0 "新地籍把一条灌溉沟划进了祠产，实际耕种的小农反被列成无地户。萧铮让测绘员逐户核对田界、租约与水费收据，给农户留足申诉凭据；把村社申诉一并送交中央核查，别让一张错图直接变成税令。"
 ROC_ma_xiao_2:0 "小农信贷"
 ROC_ma_xiao_2_desc:0 "县信贷处只认田契放款，许多实耕的佃户和妇女却没有契上署名。萧铮提出以实耕面积核定小农信贷，并让合作社登记还款、利息与地界纠纷；土地的风险，不能只让借款农户一个人扛，贷款条款得先摊开让各家看清楚。"
 ROC_ma_xiao_3:0 "集市比价"
 ROC_ma_xiao_3_desc:0 "秋收时收购商压谷价，还从账面扣掉称重折耗和运输费。萧铮把地籍、贷款与农产市场串在一起，让自耕户能比价、能追每一项扣费；称重口径和收购价得由中央一并公布，议价权别都攥在经纪手里。"
 ROC_ma_automatic_completion_tt:0 "经济部长按施政日程自动推进，每项基准半年，无需占用手动国策。"
 ROC_ma_yu_step2:0 "一社一本账"
 ROC_ma_yu_step2_desc:0 "合作社的借粮册、城里采购簿和码头运费单各用一套记法，同一批米在三处都像欠款。于树德让社员、商户与采购员逐项对账，把货物、价款、经手人与期限统一，先立起一社一本账，别社照抄。"
 ROC_ma_yu_step4:0 "货到款清"
 ROC_ma_yu_step4_desc:0 "医院收粮单盖了章，码头仍把货记作待验，运脚还被两头各扣一次。于树德带采购员逐袋复秤，把仓单、发票与付款日期钉成一份，有争议的批次另立复核，已交货的款不再悬着，账上也不许再替谁垫。"
 ROC_ma_yan_step2:0 "田亩有数"
 ROC_ma_yan_step2_desc:0 "县里报上来的地亩册把水田、旱地、荒坡混在一栏，复测经费却只够跑两个村。晏阳初让调查员分项登记田界、水源、租佃与耕作者，乡村凭证与县图互相核验，谁也不许凭一本混账下结论。"
 ROC_ma_yan_step4:0 "试田见真章"
 ROC_ma_yan_step4_desc:0 "两县试田用的是同一批耐旱稻种，出苗率却差了一倍：一边灌渠没通，一边种子受潮。晏阳初让农技员逐日记水量、发芽与工时，农户和县站都点头，才谈推广，别把试验表当成丰收报表。"
 ROC_ma_ruan_step2:0 "银钱有据"
 ROC_ma_ruan_step2_desc:0 "财政处把应付、已付、待验款挤在同一栏，工程队的欠薪条却没人认领。阮啸仙规定每笔拨款附凭证编号、经手人和验收日期，审计员交叉核对仓库与工地两本账，先让每笔钱追得到具体的人。"
 ROC_ma_ruan_step4:0 "到工地去"
 ROC_ma_ruan_step4_desc:0 "决算写着桥梁竣工，工地上却只剩半幅护栏，工人还攥着没兑的工资条。阮啸仙带审计员到现场逐项点料、问工头、核对签收章，未完工程与欠薪分别列册，再让财政处交代每笔款何时解付。"
 ROC_ma_chen_step2:0 "夜班的约定"
 ROC_ma_chen_step2_desc:0 "赶工通知只写交货日，夜班时数、补贴、停机条件一概没有，工会不肯在空白排班表上画押。陈赞贤把工头与工人代表叫到一起，轮班、加班费、工伤责任与到料写成一份短约，生产照旧、账也有据。"
 ROC_ma_chen_step4:0 "把次品拦下来"
 ROC_ma_chen_step4_desc:0 "泵机交货表全盖了合格章，返修台上却堆着尺寸不对的轴承，奖金照旧按纸面产量发。陈赞贤让工人代表与检验员逐台试机，不合格件封存、返工工时补记，验收、工资、交付三本账对得上才算数。"
 ROC_ma_xiao_step2:0 "耕者入册"
 ROC_ma_xiao_step2_desc:0 "县册只认田契上的名字，几户常年耕种的佃农和寡妇因此没能登记，连合作社担保都被拒。萧铮让测绘员入户核田界、租约与水费收据，所有权与实际耕作分栏记入，留出申诉与复核的凭据。"
 ROC_ma_xiao_step4:0 "借贷有章"
 ROC_ma_xiao_step4_desc:0 "秋耕前，农具贷款名单把地主田算成小农担保，利率和收购扣费却没张榜。萧铮让县信贷处写明资格、期限与担保，合作社公开借还账，集市巡查员再核秤，别让农户为看不懂的条款押上口粮田。"
 ROC_ma_yu_step6:0 "把账结到村口"
 ROC_ma_yu_step6_desc:0 "年终结账时，县仓说粮袋已发，合作社的收货簿却少了三页，冬种的肥料也等着付款。于树德请社员、仓管和采购员沿途核对票据，把损耗、垫款与交货日写清；县财政只肯先付一半，他便把争议款另列，催着各家先结清无异议的账。"
 ROC_ma_yan_step6:0 "试田的下一季"
 ROC_ma_yan_step6_desc:0 "试田收了稻，县站照表填了亩产，农户却说借来的水车和额外工时没算进去。晏阳初请农技员重记收成、用水和成本，再带农户代表到县里议推广经费；好种子要留种，也得先让隔壁缺水的村子知道要付多少力气。"
 ROC_ma_ruan_step6:0 "欠薪有回执"
 ROC_ma_ruan_step6_desc:0 "预算公开后，修渠队拿着旧工资条来问，账上写着已拨，工人却一分钱没见。阮啸仙把财政处、承包人和工人代表叫到桌前，核对领款章与实发名册；没查清的款项另列，已认定的欠薪须写明何日补发、由谁签收。"
 ROC_ma_chen_step6:0 "来年的机器"
 ROC_ma_chen_step6_desc:0 "机器厂年末换了订单，厂方拟抽掉维修班去赶工，工会担心老机床撑不过春天。陈赞贤请班组、厂方与采购员同看机时簿，先把检修、轮班和交货期议定；补件要的钱由谁出，也要写进下一季合同。"
 ROC_ma_xiao_step6:0 "春耕前的回音"
 ROC_ma_xiao_step6_desc:0 "冬闲时，几户农民拿着借据来县里续贷，旧地籍上却还画着洪水冲走的沟；银行照图核担保，合作社不敢替谁签字。萧铮请测绘员、借款人和信贷处会同复核，把地界、借款期限与争议记在同一份凭证上，春耕前给各户回音。"
