 ROC_ma_yu_appointed:0 "于树德"
 ROC_ma_yu_appointed_desc:0 "于树德接掌经济部，头一件事就是把合作社的信用账和城乡采购单摆在一起对上号，农货流通顺畅，账目也经得起上头随时来翻。"
 ROC_ma_yan_appointed:0 "晏阳初"
 ROC_ma_yan_appointed_desc:0 "晏阳初主张先下乡记账、再谈改良，把各县的田情与农事写进档案，让每一项办法底下都垫着一本查得到的地册。"
 ROC_ma_ruan_appointed:0 "阮啸仙"
 ROC_ma_ruan_appointed_desc:0 "阮啸仙上任先查账，公共拨款、工程进度与决算责任逐笔可追，钱是谁花的、字是谁签的，都要一笔一笔对得上，谁也赖不掉。"
 ROC_ma_chen_appointed:0 "陈赞贤"
 ROC_ma_chen_appointed_desc:0 "陈赞贤把工会请回谈判桌，工资、工时与生产协定都摊开来说，劳资两边凭一纸查得到的承诺开工，谁也不许赖账。"
 ROC_ma_xiao_appointed:0 "萧铮"
 ROC_ma_xiao_appointed_desc:0 "萧铮从地籍与田契下手，先把产权与耕作权分别记清楚，再给自耕农开一条能借到本钱、又不至于把口粮田押出去的门路。"
 ROC_ma_agriculture_collectivized_decision:0 "农业经营：推行集体化经营"
 ROC_ma_agriculture_collectivized_decision_desc:0 "地方合作社主张统一经营，好让灌溉和农具都派上大用场；小农却担心收成不再归自己支配，收益怎么分，成了会议桌上争来争去的正题。"
 ROC_ma_agriculture_household_decision:0 "农业经营：实行包产到户"
