### 南道山事件 ###
TOD_CHL.1.t:0 "刺杀事件"
TOD_CHL.1.d:0 "南道山煌原共和国的首都岭兰市，一处露天广场上人头攒动，市民们从四面八方汇聚而来。他们来此是为了参加总统武盘照的公众集会。广场上彩旗飘扬，乐队奏响欢快的乐曲。\n\n高台之上，武盘照身着深色大衣，胸前佩戴金色国徽，向民众讲述国家的历程与未来。正当演讲进入高潮，几声尖锐的枪声突然划破广场的喧闹。人群惊慌四散，保卫人员立刻冲向讲台，将总统护在中间。"
TOD_CHL.1.a:0 "总统阁下怎么样了？"
TOD_CHL.2.t:0 "总统没有受伤"
TOD_CHL.2.d:0 "武盘照身躯一震，但并未倒下。刺客的子弹没有击中他，而是在身旁石面上弹跳，发出清脆声响。一名身着黑色西装、头戴黑色礼帽的男子从人群中冲出，试图再次开枪。\n\n保卫人员和市民迅速将其制服。武盘照安全离开现场，并在短暂整顿后继续向民众挥手致意。这次袭击没有击垮他，反而使支持者更加相信总统的坚定与幸运。"
TOD_CHL.2.a:0 "谢天谢地"
TOD_CHL.3.t:0 "武盘照总统开始他的第三个任期"
TOD_CHL.3.d:0 "刺杀事件平息后，武盘照总统在民众的拥戴和支持下，正式开启他在南道山煌原共和国的第三个总统任期。他的连任标志着南道山政治路线的延续，也为泛道山体系的进一步整合奠定了领导基础。"
TOD_CHL.3.a:0 "共和国继续前进"
TOD_CHL.4.t:0 "种植园丑闻"
TOD_CHL.4.d:0 "一份来自联合果品公司内部的文件被泄露给《岭兰府每日新闻》。文件显示，该公司在巴拉圭和南道山北部的种植园长期压榨劳工、贿赂地方官员，甚至雇佣武装暴力驱赶抗议农民。\n\n舆论哗然，反对派尤其是致公派在资政院猛烈抨击政府与五大公司的勾结。武盘照总统表态，要求司法部门介入调查。"
TOD_CHL.4.a:0 "这帮公司狗该消停些了"
TOD_CHL.5.t:0 "针对公司调查"
TOD_CHL.5.d:0 "经济特别行动科和内务部联合组成调查组，突袭了联合果品公司总部及明道公司办事处。大量账册、合同和内部通讯被查封。\n\n在压力面前，公司高层同意进行内部整顿，承诺改善劳工待遇，并解雇涉案的几名地区经理。公众对政府的果断行动表示满意，但也有人担心这只是一场表演。"
TOD_CHL.5.a:0 "他们也有这一天"

### 南道山国家精神 ###
CHL_mingdao_company:0 "明道公司"
CHL_mingdao_company_desc:0 "明道公司与联合果品公司等大型资本深度介入南道山北部种植园经济。它们带来了资金、铁路和出口渠道，也把劳工问题、地方贿赂和公司自治带进共和国政治。"
### 泛道山协约 ###
pandoushan_pact:0 "泛道山协约"
TOD_CHL.100.t:0 "泛道山协约"
TOD_CHL.100.d:0 "岭兰峰会后的数月里，南道山煌原共和国、四方王国与巴拉圭联合王国围绕共同防务与外交协调进行了多轮磋商。今日，三国代表正式签署《泛道山协约》，将原本松散的经贸合作关系提升为正式军事政治同盟。任何成员遭受外部攻击时，其余成员将依据协约提供援助，并在共同指挥框架下协调行动。"
TOD_CHL.100.a:0 "胜利者的联盟"
TOD_CHL.101.t:0 "泛道山协约对复仇同盟宣战"
TOD_CHL.101.d:0 "哥伦比亚对四方王国边境的炮击终于撕破了南美大陆最后的和平假象。岭兰府内阁认定，复仇同盟已经把战争扩大到泛道山协约成员国领土，南道山不能再停留在外交抗议之中。\n\n武盘照总统宣布，南道山煌原共和国将依据《泛道山协约》的共同防务条款，对巴西及其盟友大哥伦比亚进入战争状态。四方王国与巴拉圭联合王国也将随协约共同参战。"
TOD_CHL.101.a:0 "和平已然彻底结束"