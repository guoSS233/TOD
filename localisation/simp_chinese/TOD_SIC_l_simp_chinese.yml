 ### 四川与四川红军共享企业 ###
 TOD_sichuan_minsheng_industry:0 "民生实业股份有限公司"
 TOD_sichuan_minsheng_industry_desc:0 "民生实业以长江航运起家，在战前已将四川的客货运输、码头调度与商业网络连接起来。支持它意味着优先恢复通航、道路与仓储；它能减少日常供给的摩擦，却仍依赖重庆及沿江航线的安全。"
 TOD_sichuan_huaxi_industry:0 "华西兴业股份有限公司"
 TOD_sichuan_huaxi_industry_desc:0 "华西兴业经营工程、机器与地方建设业务，能把分散的商办资本转化为道路、厂房和电力工程。它适合承担重建任务，但需要成都一带的行政许可、技术人员和稳定订单作为支撑。"
 TOD_sichuan_chongqing_electric:0 "重庆电力股份有限公司"
 TOD_sichuan_chongqing_electric_desc:0 "重庆电力在战前刚刚起步，却代表着城市照明、工厂动力与现代技术教育的共同需求。持续投资电网会改善研究和生产效率，但其收益建立在城市秩序与稳定燃料供应之上。"
 TOD_sichuan_tianfu_coal:0 "天府煤矿公司"
 TOD_sichuan_tianfu_coal_desc:0 "天府煤矿为川东工业、航运锅炉和城市电力提供煤炭。扩大矿区开发能提高资源利用与基础设施建设，却必须协调矿工、铁路和地方治安，不能把产量简单视为无代价的财富。"
 TOD_sichuan_chengdu_arsenal_organization:0 "成都兵工厂（四川兵工厂）"
 TOD_sichuan_chengdu_arsenal_organization_desc:0 "成都兵工厂是四川最重要的常备兵器生产基础之一。只有在省府或革命政府建立起稳定的军需体系后，分散的工匠、库房与检验标准才能被重新组织为可靠的步兵装备产能。"
 TOD_sichuan_chongqing_weapon_repair_organization:0 "重庆武器修理所"
 TOD_sichuan_chongqing_weapon_repair_organization_desc:0 "重庆的修造力量更擅长维护、翻新与改装，而非从零建立大型炮兵工业。将它纳入统一后勤系统，可以以较低的资源消耗提高火炮与零件的可靠性。"
 TOD_sichuan_chongqing_ammunition_organization:0 "川康绥靖公署重庆子弹厂"
 TOD_sichuan_chongqing_ammunition_organization_desc:0 "重庆子弹厂依靠稳定的订单、材料配给和检验制度运转。其价值不在于独立改变战局，而在于为前线提供持续、可追溯的弹药与军需品供应。"
 TOD_sichuan_huaxing_machine_organization:0 "华西兴业公司华兴机器厂"
 TOD_sichuan_huaxing_machine_organization_desc:0 "华兴机器厂把民用工程中的车床、维修与零件加工能力转为军需服务。它的产能有限，却可在步兵武器生产中改善零件一致性与火力部件的可靠性。"
 TOD_sichuan_beichuan_railway_organization:0 "北川铁路公司"
 TOD_sichuan_beichuan_railway_organization_desc:0 "北川铁路公司把煤矿、码头与沿线市场接入同一运输网络。其机车、维修与调度能力可转化为四川军队的车辆保障和战时后勤基础。"
 TOD_sichuan_mio_trait_wubei_signal_standard:0 "武备系铁路信号规格"
 TOD_sichuan_minsheng_machine_works_organization:0 "民生机器厂"
 TOD_sichuan_minsheng_machine_works_organization_desc:0 "民生机器厂为川江航运提供船舶修理与机件维护。将其纳入军需体系后，可提升内河舰艇和运输船只的修造与持续航行能力。"
 TOD_sichuan_zhonghua_shipyard_organization:0 "中华机器厂（中华造船厂）"
 TOD_sichuan_zhonghua_shipyard_organization_desc:0 "中华机器厂兼具机械加工与内河造船能力，适合在有限的川江水域内建造护航、巡逻与运输所需的轻型舰船。"
 TOD_sichuan_mio_trait_chengdu_standard:0 "川造标准化检验"
