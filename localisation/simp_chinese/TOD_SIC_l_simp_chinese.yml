### event ###
TODSIC.1.t:0 "大明陷入崩溃！"
TODSIC.1.d:0 "    昌德皇帝驾崩后的一系列连锁事件，引起了整个国家的动荡。虽然有关消息的发布严重滞后且混乱，但可以确定，在中华帝国的本土上，各方野心家和正统继承人都纷纷站出来追求自己的权力，并试图把对手从地图上彻底抹消。尽管有识之士一直在促成利益相近的一些势力坐下来和谈，不过他们的努力并没有取得理想的成果。\n    而在报刊的版面上和广播新闻节目中，应天、西安、镇东、广州、昆明、辽阳，这一串地面开始频繁出现。纷乱的报道中，每一方都有自己的政治理想和报复，每一方都承诺迅速重新恢复秩序或者建立一个全新的国家，五百多年的帝国又一次像三百年前那样陷入了迷茫。尽管如此，观察人士预测，内战将不会持续很长时间，因为明显有些方面准备的更加充分。"
TODSIC.1.a:0 "我们该怎么办？四川现在是个什么情况？"
TODSIC.2.t:0 "查看省内状况"
TODSIC.2.d:0 "    欢迎来到天府之国，这里肥沃的土地和丘陵集中了整个国家1/6的人口。在改革的风吹到这里之前，这里绝大多数人口，都依赖农业为生。直至19世纪80年代，这里虽然出现了一些工业，但仍然比较落后。\n    直到昌德皇帝即位之后，这里的情况才发生翻天覆地的变化。《西部开发案》使得这里获得了前所未有的优惠政策；更多的淘金者携带着生产资料和资本，以前所未有的速度从东部沿海地区流入这里。尤其是成都，其繁荣程度不亚于沿海的大都会。另外，重庆的分离让四川凭借《重庆都会案》中的附加条款，获得了大笔补偿资金。\n    由此，四川能够更加集中的把资源投入到成都的工业化建设当中，并且推进自贡等专门城市的发展而不必再因为成渝两地无休止的争吵分散精力。当然，在经济利益的驱使下，四川的农业也全面转型，经济作物种植成为了主流。\n    时间来到1936年，尽管严重不均的经济发展过程始终困扰着这个省份，但是四川依然取得了其他人难以想象的成就。只是那个曾经庇护它发展的人，目前已经离去，而四川显然没有做好准备。"
TODSIC.2.a:0 "四川是时候该做出决定了"
TODSIC.3.t:0 "四川的命运"
TODSIC.3.d:0 "四川省参政院里的氛围从未像今天这样压抑。每个人都知道，自从昌德皇帝驾崩，四川再也回不到以前了。而今，随着秦岭之北和三峡之东相继陷入战火，天府之国一下子陷入了迷茫。\n“诸位议郎，今天我谨遵流程，着急诸位紧急会议，不为别的，只为了四川一省的平安。现在岭北纷乱，峡东涂炭，我们过往的生活再也继续不下去了。我们四川地大民多，牢牢的嵌在全国的版图上，也有足够的能力选择我们自己的道路。现在，请诸位根据紧急议事章程即行投票，省政府会在稍后在密室进行短促闭门会，最终公布结果。”\n会场内，尽管有激进的议郎高声喊叫，试图传递自己的观点 但大多数一反常态，默默的遵照指令完成了投票。\n两刻钟后，拿着浸透着汗水稿纸的贺国光匆匆步入大堂。“一面是浩荡皇恩，一面是众民期盼，诸位作为皇恩之受众，民意之代表，也坚定了我做出选择的决心。\n最后，来自贺国光的声音陡然一变——"
TODSIC.3.a:0 "“明哲保身，静观其变，四川必须等待！”"
TODSIC.3.b:0 "“仗义死节，就在今日，四川奋力出战！”"
TODSIC.10.t:0 "一封密信"
TODSIC.10.d:0 "四川省省长致锦王，呈报四川归顺之事宜，万望审议。\n臣等谨启:\n今先帝崩殂，皇天受难，麒麟早出，圣人敢视，外夷奔走，内夏悲哀，大盗移国，帝都瓦解，民则窜身荒谷，宫则公私涂炭，将军一去，大树飘零，相如安在？藐是流离。西北则离石之将兵都尉，中原则辽人之安姓史子，百越有胥夫之鹰视，东北有北匈之狼顾，此诚危急存亡之秋也，愿锦王受臣投诚，归于一处。\n臣等伏念蜀中自武侯驭蜀以来，山川险固，民物殷阜，然屡经离乱，疮痍满目。今虽举土来归，然三巴父老，咸有私议；恐王师北顾，无暇南顾；恐节帅频更，政令苛扰；恐粮赋转输，尽为空竭。是以耆老百姓，遮臣等车驾而泣曰：“必得世牧其土，自择长吏，轻徭薄赋，专备西南，然后可固吾圉而纾国难。”臣等窃惟：蜀不固则江表不安，江表不安则中兴无期。敢昧死上陈，乞许蜀中暂行权宜之制：一曰蜀帅请以本土宿将充任،二曰税赋三分留一以实边备،三曰团练兵勇自保乡梓。如此，则剑阁可固،锦城可安،而朝廷无西顾之忧矣。\n蜀道之险،隔天听于万里；锦城虽乐،岂忘怀于九州。愿执棰拊以从王师之后،守剑门而为天子之屏。输粟转漕،不敢后于诸藩；扞境保民،庶几无愧于先武侯。若得苟全一方،以待中兴之业，则巴蜀幸甚،天下幸甚！"
TODSIC.10.a:0 "三顾频繁天下计，两朝开济老臣心"
TODSIC.10.b:0 "天下欲乱他先乱，天下已平他未平"
TODSIC.11.t:0 "舜天同意了"
TODSIC.11.d:0 "览奏。蜀道之险，隔天听于万里；锦城虽乐，岂忘怀于九州。尔等深明大义，审度时势，率土来归，孤心甚慰。\n先帝崩殂，社稷丘墟，豺狼当道，四海沸腾，此诚天崩地裂之秋。尔奏中言“大盗移国，帝都瓦解”，字字泣血，孤每览及此，未尝不掷笔长叹，北望而涕零也。\n今东南未靖，西北纷扰，强胡环伺，国步维艰。蜀中地险民殷，自古为王业之根基，高祖因之以成帝业。尔等能弃暗投明，使三巴之众，免遭兵燹；剑阁之险，复归王化，此不世之功也。\n所有归顺事宜，悉依所请。文武各官，照旧供职；黎民百姓，咸与维新。其有保境安民之策，御寇防边之谋，可逐次条陈，孤必虚怀以听。\n当此危难之秋，正忠臣效命之时。愿与诸公同心戮力，翦除凶逆，匡复神州，以慰先帝在天之灵。"
TODSIC.11.a:0 "勉之。勖之"
TODSIC.12.t:0 "舜天不同意"
TODSIC.12.d:0 "滚。"
TODSIC.12.a:0 "天下欲乱你先乱，天下已平你未平"

chinese_events_sic.1.t:0 "四川宣布在内战中保持中立"
chinese_events_sic.1.d:0 "今日，四川总督府对于目前的大明帝国局势发布了声明。\n总督府的发言人表示，鉴于帝国之局势及四川内部事务之综合考量，我总督府认为此混乱局势之下，贸然出兵非但不会有甚大作用，反而会使我总督府之局势更加混乱。有鉴于此，四川总督府决定不参与帝国内部任何事物，保持中立。\n尽管发言人一再强调仍忠于帝国皇帝，这一段声明还是被认为是总督府作壁上观的铁证。"
chinese_events_sic.1.a:0 "忠诚？可笑"
chinese_events_sic.2.t:0 "四川宣布在内战中支持庆王"
chinese_events_sic.2.d:0 "在大明帝国风雨飘摇之际，四川总督府今日宣布出兵勤王。\n发言人声明，在此社稷危难，宗庙难存之时刻，四川总督府“有出兵勤王，保社稷于危难之中”的义务。同时他也表示“我川军有相称实力，得使四川有救国于危难之间之可能”目前，四川军队已开始武备，先头部队即将出川。\n四川总督府能够在内外交困的局势下还能够出兵勤王自然引起了各界的疑问，有人指出这或许与武备派在背后的支持不无关系。"
chinese_events_sic.2.a:0 "胜负的天平会因此而改变吗？"

### 清政系宪政路线 ###
SIC_qingzhengxi_sichuan:0 "清政系的四川试验"
SIC_qingzhengxi_sichuan_desc:0 "天府经济已经恢复，但繁荣若仍依赖少数官员和军人的临时命令，下一场危机便会令一切重来。清政系将把四川建设成制度试验田，从县政调查、公开财政和军政分离入手，证明法治、责任政府与有限君权能够在中国土地上实际运行。"
SIC_diaocha_xianxing:0 "调查县政实况"
SIC_diaocha_xianxing_desc:0 "省府过去只能从层层粉饰的公文中了解地方，而失业、佃租、债务和基层摊派早已改变乡村面貌。我们将组织统计人员、学者和地方代表逐县调查，以可核验的数据取代官场猜测，并据此确立小民产权与基层行政改革的基础。"
SIC_gongkai_shengfu_yusuan:0 "公开省府预算"
SIC_gongkai_shengfu_yusuan_desc:0 "秘密账册、军费黑箱和层层截留使省府财政长期缺乏信用。今后税收、借款和重大支出必须按期公布，由审计人员与社会代表共同核验；公开预算或许会触怒既得利益，却能让纳税人第一次知道自己的钱被用在何处。"
SIC_xianzhi_jundui_canzheng:0 "限制军队参政"
SIC_xianzhi_jundui_canzheng_desc:0 "川军在危机中保卫了四川，却也习惯以军令干预人事、财政和地方行政。省府将冻结军队擅自改编，撤销军官兼任的民政职务，并把军费纳入公开预算；在新的国家化方案完成前，军队必须先学会服从文官政府和成文法律。"
SIC_huifu_shengzizhengju:0 "恢复省咨议局"
SIC_huifu_shengzizhengju_desc:0 "被战争和督军政治架空的省咨议局将重新开门。来自城市、县乡、商会和专业团体的代表可以质询官员、审议预算并公布会议记录；它还不是完整议会，却能让公开辩论取代密室交易，为责任政治积累必要的程序与习惯。"
SIC_sichuan_jibenfa:0 "《四川基本法》"
SIC_sichuan_jibenfa_desc:0 "调查、审计和军政改革已经提供了足够经验，现在必须把临时承诺写成不可任意撤销的规则。《四川基本法》将保障人身与财产权利，规定预算和立法程序，划清军队、内阁与议会的权限，并确认任何政府都必须在法律之下行使权力。"
SIC_zerenneige:0 "责任内阁"
SIC_zerenneige_desc:0 "省府不能再只是总督私人幕僚的扩大版本。行政各部将由内阁统一负责，施政纲领和年度预算必须取得咨议局信任；一旦失去多数支持，内阁就应辞职或重新接受表决，使政府真正对公开的政治责任而非个人恩威负责。"
SIC_junquan_guanyu_xianfa:0 "君权关于宪法"
SIC_junquan_guanyu_xianfa_desc:0 "君主可以维系历史连续与国家象征，却不能成为任何派系绕过宪法的工具。诏令须由责任大臣副署，财政与征兵须经议会同意，司法不得受宫廷随意干预；皇室因此获得稳定而尊崇的位置，日常权力则明确属于受监督的政府。"
SIC_sichuan_moshi:0 "四川模式"
SIC_sichuan_moshi_desc:0 "县政调查、公开财政、议会监督、责任内阁与有限君权已经不再是孤立试验，而是能够相互支撑的治理体系。四川模式既保护私人经营和小民产权，也保留国家协调建设的能力；它将作为一套可复制的制度方案，随统一进程推广至全国。"
SIC_xianzheng_jiuguo_xuanyan:0 "宪政救国宣言"
SIC_xianzheng_jiuguo_xuanyan_desc:0 "中国需要统一，但若统一只是把地方军阀替换成更大的军阀，战争迟早还会重演。我们将向全国宣布以宪法结束内战：保障基本权利，建立责任内阁，限制军队与君主的日常权力，并邀请所有认同这些原则的政治力量共同参与制宪。"
SIC_quanguo_zhixianpai_dahui:0 "全国制宪派大会"
SIC_quanguo_zhixianpai_dahui_desc:0 "各地的律师、议员、商人、学者和地方自治人士并不拥有统一组织，却共同反对无休止的军事独裁。四川将提供安全会场，让不同派别围绕权利保障、中央与地方权限、君主地位及责任政府形成最低共识，并建立覆盖全国的制宪联络网络。"
SIC_tongyi_bizhi_guanshui:0 "统一币制与关税"
SIC_tongyi_bizhi_guanshui_desc:0 "割据政权发行的纸币、重复征收的关税和层层设置的厘卡把全国市场切成碎片。我们将建立统一而可兑换的币制，取消省际关卡，公开中央税则，并以四川积累的财政信用稳定物价，让政治统一获得工商业和普通民众都能感受到的物质基础。"
SIC_guominjun_guojiahua:0 "国民军国家化"
SIC_guominjun_guojiahua_desc:0 "早期冻结编制是为了阻止军头继续扩张私兵，现在宪政制度已经能够承担军队改革。各部将统一番号、军饷、军法和军官教育，军人只向国家与宪法宣誓；文官政府恢复调整编制的权力，一支纪律严明的国民军将取代派系武装。"
SIC_quanguo_zhixian_huiyi:0 "全国制宪会议"
SIC_quanguo_zhixian_huiyi_desc:0 "主要割据政权已经结束，军事统一必须转化为获得全国承认的法律秩序。各省、各党派、行业团体、军队与皇室代表将在公开会议中审议权利法案、两院制度、内阁责任和君主权限，使新国家不再依赖胜利者的一纸命令。"
SIC_daming_lixian_guo:0 "大明君宪帝国"
SIC_daming_lixian_guo_desc:0 "全国宪法已经通过，君主保留为国家连续性与共同历史的象征，实际行政由对议会负责的内阁承担，军队、财政和司法都被置于成文规则之下。由四川开始的制度试验终于成为全国秩序，一个统一而受约束的大明君宪帝国由此诞生。"
SIC_daming_lixian_guo_DEF:0 "大明君宪帝国"
SIC_daming_lixian_guo_ADJ:0 "大明"
SIC_daming_lixian_guo_liberal_democracy:0 "大明君宪帝国"
SIC_daming_lixian_guo_liberal_democracy_DEF:0 "大明君宪帝国"
SIC_daming_lixian_guo_liberal_democracy_ADJ:0 "大明"

SIC_qingzhengxi_gaige_categories:0 "四川新政"
SIC_qingzhengxi_gaige_categories_desc:0 "四川新政不是完成一次国策就能自动成功的工程。社会调查、财政审计、司法巡察、议会表决与军政分离都需要持续投入政治资本；稳步累积§Y清政系影响§!和§Y宪政进程§!，才能把官员的临时承诺变成真正可执行的制度。\n\n清政系影响：[?SIC.qingzhengxi]\n宪政进程：[?SIC.xianzheng]"
SIC_xianzhengtongyi_categories:0 "宪政统一"
SIC_xianzhengtongyi_categories_desc:0 "四川必须先通过报刊、代表会议和临时法纲争取全国制宪力量，再以统一币制、行政整合与宪法国民军承接扩张成果。对共和军与东北红军优先提出双向合并邀请；只有谈判彻底破裂，战争才会成为最后手段。"
SIC_kaizhan_shehui_diaocha:0 "开展社会调查"
SIC_kaizhan_shehui_diaocha_desc:0 "组织大学、县署和地方团体共同登记人口、田产、佃租、失业与摊派情况。调查会暴露地方官绅不愿公开的问题，也会暂时增加行政负担，但它能为产权保障、救济和县政改革提供第一份可信依据。"
SIC_shengfu_yusuan_shenji:0 "举行省府预算审计"
SIC_shengfu_yusuan_shenji_desc:0 "邀请审计人员、商会和咨议代表逐项核查省府账册，公开军费、建设借款与特别支出。既得利益者会抵制这种检查，但财政透明能够提升政府信用，并为限制军队越权提供明确的预算依据。"
SIC_yu_junfang_xieshang:0 "与军方协商退让"
SIC_yu_junfang_xieshang_desc:0 "与主要将领谈判军官退出民政职务、军费接受审计和部队服从文官命令的过渡方案。作为交换，政府保障合法军饷和军官待遇；这会清除旧军队的混乱状态，但师级编制仍将冻结，直至国民军国家化完成。"
SIC_chongkai_shengziyi:0 "重开省咨议局"
SIC_chongkai_shengziyi_desc:0 "按照县政调查形成的名册重新推选地方代表，并赋予咨议局审议预算、质询官员与公布会议记录的权力。它仍不是主权议会，却会成为政府接受公开监督、社会矛盾通过程序解决的第一处制度场所。"
SIC_neige_xinren_toupiao:0 "内阁信任投票"
SIC_neige_xinren_toupiao_desc:0 "要求内阁公开提交施政纲领、财政方案和部长名单，并接受咨议局逐项质询与信任表决。投票结果将确立一项关键惯例：政府只有得到代表多数支持才能继续执政，而不是依靠总督或军方个人授权。"
SIC_jundui_xianfa_shiyan:0 "军队宪法誓言"
SIC_jundui_xianfa_shiyan_desc:0 "组织各级军官向基本法、国家和合法政府宣誓，废止以个人、派系或部队番号为效忠对象的旧式誓词。军队暂时仍受编制冻结约束，但这一仪式将为日后的统一军法、军饷和国民军国家化奠定政治基础。"
SIC_gongbu_xinzheng_baipishu:0 "公布四川新政白皮书"
SIC_gongbu_xinzheng_baipishu_desc:0 "定期汇总财政、司法、县政和军政改革的进度，公开承认未完成事项并接受社会质询。白皮书会让反对者看到政府弱点，却也能迫使官署兑现承诺，持续提高新政的组织能力与制度可信度。"
SIC_paichu_xianzheng_xunchaoshi:0 "派出宪政巡察使"
SIC_paichu_xianzheng_xunchaoshi_desc:0 "从司法界、咨议局和省府中抽调人员巡查各县，受理越权征税、侵占产权和军人干政案件。巡察会直接触动地方利益网络，但能把基本法从成都的文本变成基层实际可诉、可查、可纠正的规则。"
SIC_qingli_difang_loushui:0 "清理地方漏税与附加"
SIC_qingli_difang_loushui_desc:0 "取消没有法源的地方附加税，追查截留公款和重复征收，并把合法税目统一纳入公开预算。改革需要清政系消耗政治资本压制既得利益，却能扩大正规财政收入、降低交易成本并明显改善政府信用。"
SIC_zhaokai_laogong_ziben_xieshanghui:0 "召开劳工与资本协商会"
SIC_zhaokai_laogong_ziben_xieshanghui_desc:0 "邀请工会、商会、企业和政府代表讨论工资、工时、保险与停工争议，建立以谈判和仲裁代替街头冲突的程序。双方都不会完全满意，但稳定预期能够在一段时间内提高生产、减少消费负担并巩固社会秩序。"
SIC_zhichi_quanguo_zhixianpai:0 "资助全国制宪派"
SIC_zhichi_quanguo_zhixianpai_desc:0 "通过公开基金援助各地律师团体、自治组织、报刊和制宪派代表，使他们能够在军阀控制下继续活动。援助会消耗清政系的组织资源，却能逐步形成一张支持法治、责任内阁与有限君权的全国政治网络。"
SIC_zhaokai_quanguo_xianzheng_xuanchuan:0 "发动全国宪政宣传"
SIC_zhaokai_quanguo_xianzheng_xuanchuan_desc:0 "利用报刊、广播、演讲队和四川商路解释宪政统一纲领，强调权利保障、责任政府与结束军阀割据之间的联系。宣传将暂时强化全国动员和战争正当性，同时提升各地民众对四川方案的认知。"
SIC_shebao_quanguo_xianzheng_tongxunshe:0 "设立全国宪政通讯社"
SIC_shebao_quanguo_xianzheng_tongxunshe_desc:0 "建立跨省记者、律师和地方代表组成的通讯网络，报道各地议会活动、军政冲突与权利案件。持续的信息交换能让孤立的制宪团体彼此看见，并扩大清政系在全国政治议程中的影响力。"
SIC_jiedai_gepaifang_xianzheng_daibiao:0 "接待各派制宪代表"
SIC_jiedai_gepaifang_xianzheng_daibiao_desc:0 "邀请地方自治派、自由主义者、温和君宪派及其他愿意接受公开制宪的团体来川会谈。协调彼此分歧需要消耗组织资源，却能提高共同法纲的代表性，避免统一后只剩四川单方面宣布制度。"
SIC_bianzuan_quanguo_linshifagang:0 "编纂全国临时法纲"
SIC_bianzuan_quanguo_linshifagang_desc:0 "把四川基本法和各派会议决议整理成适用于新收复地区的临时法纲，明确基本权利、地方行政、税收和军队接管程序。它将为全国正式制宪之前的过渡治理提供统一尺度，降低兼并地区的抵抗。"
SIC_kaizhan_shehui_diaocha_xiaoguo:0 "缓解基层不满，但全面调查会短期增加行政与工业负担；§Y宪政进程§!§G+12§!"
SIC_shengfu_yusuan_shenji_xiaoguo:0 "§Y清政系宪政试验§!：每日政治点数获取§G+0.02§!；§Y宪政进程§!§G+12§!"
SIC_yu_junfang_xieshang_xiaoguo:0 "§Y清政系宪政试验§!：组织度§R-3.0%§!；移除§Y混乱的军队§!，但§R不会解除师级编制锁定§!"
SIC_qingli_difang_loushui_xiaoguo:0 "§Y清政系宪政试验§!：消费品需求§G-2.0%§!；§Y宪政进程§!§G+6§!"
SIC_xianzheng_taofa_MNG:0 "向大明中央发布制宪通牒"
SIC_xianzheng_taofa_MNG_desc:0 "要求大明中央接受全国制宪、责任内阁与军队国家化原则；若继续以旧式朝廷命令维持割据，四川将以武力结束其对共同国家的阻碍。"
SIC_xianzheng_taofa_GOS:0 "向两广发布制宪通牒"
SIC_xianzheng_taofa_GOS_desc:0 "要求两广开放政治谈判并承认共同法纲；若其地方政权拒绝参与全国制宪，四川将采取军事行动统一南方行政与市场。"
SIC_xianzheng_taofa_XBJ:0 "向西北军发布制宪通牒"
SIC_xianzheng_taofa_XBJ_desc:0 "向西北军提出接受文官统辖、统一税制与全国制宪的最后条件；拒绝者将被视为继续维持私人军队和地方割据。"
SIC_xianzheng_taofa_STG:0 "向顺天军发布制宪通牒"
SIC_xianzheng_taofa_STG_desc:0 "要求顺天军交出军人直接统治，参加全国代表会议；首都地区不能继续成为任何一支军队垄断国家名义的工具。"
SIC_xianzheng_taofa_XIN:0 "向西南军发布制宪通牒"
SIC_xianzheng_taofa_XIN_desc:0 "向西南军提出和平接受统一军法、财政和制宪程序的条件；若其坚持军头政治，四川将清除身后的割据威胁。"
SIC_xianzheng_taofa_GPS:0 "向七省军发布制宪通牒"
SIC_xianzheng_taofa_GPS_desc:0 "要求七省军停止以军事联合代替合法政府，派代表参加全国制宪；拒绝共同规则意味着选择在战场上解决统一问题。"
SIC_xianzheng_taofa_MOB:0 "向漠北发布制宪通牒"
SIC_xianzheng_taofa_MOB_desc:0 "要求漠北政权承认全国宪法、地方自治边界和统一关税；若其拒绝谈判，四川将以军事手段恢复共同国家的北方秩序。"

SIC_qingzhengxi_shiyan:0 "清政系宪政试验"
SIC_qingzhengxi_shiyan_desc:0 "四川正在以公开财政、基层调查、议会监督与军政分离试验一套新的治理秩序。试验初期会承受消费和稳定压力，后续改革将逐步改善其修正。"
SIC_gongkai_caizheng:0 "公开而有信用的财政"
SIC_gongkai_caizheng_desc:0 "预算、借款和军费接受社会审计，使政府能够以更低成本筹集资源，也迫使官署更加谨慎地使用纳税人的钱。"
SIC_jundui_tuichu_zhengzhi:0 "军队退出政治"
SIC_jundui_tuichu_zhengzhi_desc:0 "军官不再兼任民政职务，军费纳入审计，师级编制也暂时被冻结。政治秩序更加稳定，但军队在国家化完成前会承受组织和训练上的代价。"
SIC_sichuan_jibenfa_idea:0 "《四川基本法》"
SIC_sichuan_jibenfa_idea_desc:0 "人身与财产权、公开预算、议会监督和文官统军均获得成文保障，四川政府的权力第一次拥有清晰而可执行的边界。"
SIC_zeren_neige_idea:0 "向议会负责的内阁"
SIC_zeren_neige_idea_desc:0 "内阁必须维持代表多数的信任，施政和财政也要接受公开质询。这种责任机制提高了行政效率，也让社会更愿意配合长期建设。"
SIC_laogong_ziben_xieshang:0 "劳资协商机制"
SIC_laogong_ziben_xieshang_desc:0 "工会、企业与政府通过谈判和仲裁处理工资、工时及停工争议。稳定的规则降低了冲突成本，并在一段时间内改善生产与消费。"
SIC_xianzheng_tongyi_dongyuan:0 "宪政统一动员"
SIC_xianzheng_tongyi_dongyuan_desc:0 "四川把结束军阀割据与建立共同宪法联系起来。清晰的政治目标提高了动员效率，也让对拒绝制宪者采取行动更具正当性。"
SIC_quanguo_tongyi_shichang:0 "统一的币制与全国市场"
SIC_quanguo_tongyi_shichang_desc:0 "省际关卡、重复税目和割据纸币被逐步清理，全国商品与资本能够在同一套财政规则下流动，工业生产由此获得显著扩张。"
SIC_xianfa_guominjun:0 "宪法国民军"
SIC_xianfa_guominjun_desc:0 "统一番号、军饷、军法和军官教育使军队摆脱私人效忠。编制修改权回到文官政府手中，国民军的组织、士气和作战能力全面提高。"
SIC_quanguo_xianzheng_gangyao:0 "全国临时宪政法纲"
SIC_quanguo_xianzheng_gangyao_desc:0 "新接管地区依照统一法纲保障权利、征收税款并组织地方行政，减少占领中的任意行为，为最终的全国宪法提前建立政治信任。"
SIC_xianzheng_chenggong:0 "四川宪政模式"
SIC_xianzheng_chenggong_desc:0 "公开财政、产权保障、责任内阁、有限君权与文官统军已经相互衔接，四川不再依赖某一位强人的临时善意，而拥有一套能够承受危机并持续发展的制度。"
SIC_daming_lixian_guo_idea:0 "大明君宪帝国"
SIC_daming_lixian_guo_idea_desc:0 "统一国家以宪法为基础，以君主为国家连续性的象征，以议会与责任内阁行使政治权力。"

### 武备系西南路线 ###
SIC_wubei_xinan_judian:0 "武备系的西南据点"
SIC_wubei_xinan_judian_desc:0 "川渝不是一片等待命令的后方，而是拥有兵工、航运、军校与老军官网络的战略腹地。武备系主张先把这些资源重新置于同一套军政秩序之下，再以秩序、训练和军需取代地方派系的临时交易。此举能迅速集中力量，却也意味着文官、商会与旧派军头都将要求自己的位置。"
SIC_zhengdun_xinan_jungong:0 "整顿西南军工"
SIC_zhengdun_xinan_jungong_desc:0 "成都兵工厂、重庆修理所、子弹厂和零散机器车间不能再各自承接临时订单。我们将核对库存、统一验收、清理中间盘剥，并把能用的技术人员纳入军需名册。整顿会短期触动既得利益，却使真正的四川军工组织能够为同一支军队持续供货。"
SIC_qingdian_chuanjun_mensheng:0 "清点川军门生"
SIC_qingdian_chuanjun_mensheng_desc:0 "川军的师承、同乡与旧部关系既是动员资源，也是割据的温床。清点门生并非把所有旧人排斥在外，而是把军官履历、薪饷来源和部队指挥链逐一登记。只有让晋升、任用和奖惩可被查验，武备集团才不会只是换一批人继续占据旧体系。"
SIC_jiena_shuntian_liuwangzhe:0 "接纳顺天流亡者"
SIC_jiena_shuntian_liuwangzhe_desc:0 "顺天武备系失势后，携带档案、技术和人脉的流亡军官抵达西南。他们能够补足四川在军校、后勤与检验上的短板，却也会把北方的派系恩怨带入成都。接纳他们意味着建设一个独立的西南武备核心，并承担调和川军与保定门生的政治成本。"
SIC_nanbei_wubei_heliu:0 "南北武备合流"
SIC_nanbei_wubei_heliu_desc:0 "掌权的顺天武备系愿意与四川建立军官交流、装备标准和作战计划合作。合流不会让四川立刻成为附庸，而是以共同军需换取全国谈判中的位置。风险同样清楚：北方的命令、订单和人事意见会进入西南，双方必须先为领导权划出可以接受的边界。"
SIC_chongjian_xinan_wubei_zonghui:0 "重建西南武备总会"
SIC_chongjian_xinan_wubei_zonghui_desc:0 "无论来自流亡者还是南北合流的资源，都不能只靠私人交情维持。武备总会将统一军官登记、军需审核、企业合同与地方协调，令各派在公开规则下争取份额。总会的整合度决定它究竟是新的派系会馆，还是能够支撑全国军政方案的常设机构。"
SIC_junguan_zhuanren_zhengwu:0 "军官转任政务"
SIC_junguan_zhuanren_zhengwu_desc:0 "后方的交通、征发、仓储和治安离不开熟悉军队运转的人。我们会让部分军官转入省府与企业联络岗位，以压缩命令传递和采购拖延。这样能提高行政执行力，却也会引起文官团体对军人进入政务的警惕，必须用明确职责约束其权力。"
SIC_shiye_jianjun_gangling:0 "实业建军纲领"
SIC_shiye_jianjun_gangling_desc:0 "军队不能只靠临战摊派维持。纲领要求省营企业、商办机器厂与兵工单位依照长期订单扩充设备、培训工人并保留原料储备。它将把实业能力转化为可预期的军需供给，同时要求政府承担合同、价格和运输风险，不能把一切代价转嫁给民用社会。"
SIC_tongyi_chuanjun_renshi:0 "统一川军人事"
SIC_tongyi_chuanjun_renshi_desc:0 "各部番号、薪饷、升迁与退役制度若仍由私人决定，再完善的军工也只会为私兵服务。统一人事将建立共同档案、考核和军校资格，使部队效忠于一条可追溯的指挥链。改革会削弱地方将领的自主权，却能为跨省作战与全国统合准备可靠的干部体系。"
SIC_sichuan_junzheng_huiyi:0 "四川军政会议"
SIC_sichuan_junzheng_huiyi_desc:0 "军官、工程师、商界代表和省府官员将在成都讨论军政总会的权限。会议的价值不在于消除分歧，而在于把军需、预算和任命的争执带到可记录、可交换的桌面上。只有三条准备工作都完成，武备系才能以制度而不是口号要求各方接受共同的西南方案。"
SIC_tongyi_junxu_biaozhun:0 "统一军需标准"
SIC_tongyi_junxu_biaozhun_desc:0 "同一种步枪若口径、零件和检验法各不相同，前线的弹药与维修都会在最需要时失效。统一军需标准要求兵工厂、修理所和机器厂共享图纸与验收制度，短期会淘汰一批旧库存，却能让四川制造的装备获得更稳定的产量、可靠性与后勤兼容性。"
SIC_shengying_qiye_junxuhua:0 "省营企业军需化"
SIC_shengying_qiye_junxuhua_desc:0 "省府将以长期合同和信贷担保引导重点企业承担军需订单，而不是简单没收商办资产。此举可把煤炭、机械、运输和电力更快转入战备体系，也会挤占部分民用建设与市场空间。武备系必须证明，这一集中不是无休止的戒严，而是有目标、有期限的国家建设。"
SIC_junzheng_jiguan_yitihua:0 "军政机关一体化"
SIC_junzheng_jiguan_yitihua_desc:0 "战时行政最怕各厅局、各军和各企业各自发文。军政机关一体化会把动员、采购、运输和补给放进同一协调机制，使命令能沿着统一链条抵达前线。代价是政治程序被压缩，社会对军政权力边界的担忧上升；必须以明确责任和最终的代表会议加以平衡。"
SIC_quanguo_wubei_daibiao_huiyi:0 "全国武备代表会议"
SIC_quanguo_wubei_daibiao_huiyi_desc:0 "只有武备总会的整合度达到足以压住内部派系的程度，四川才有资格邀请全国军官、工程师、企业与地方代表讨论共同方案。会议将不再只是西南的自保宣言，而是提出统一军需、统一指挥与战后秩序的全国性承诺；未完成内部整合便强行召开，只会把分裂扩大到全国。"
SIC_wubei_tongguo:0 "武备统国"
SIC_wubei_tongguo_desc:0 "代表会议通过的不是一纸临时军令，而是一套把军队、工业和行政责任连接起来的统国纲领。四川将以此准备在全国统一后重组国家，但国名与最终建国必须等待大明内战的全国统一决议完成。武备系赢得的是建国资格，而不是绕过统一条件的捷径。"

SIC_wubei_categories:0 "西南武备总会"
SIC_wubei_categories_desc:0 "总会必须用实际行动换取川军、流亡者、企业和地方社会的信任。完成一次决议会提高§Y武备整合度§!；达到 80 后，才可召开全国武备代表会议。\n\n武备整合度：[?SIC.wubei_integration]"
SIC_wubei_exile_available_tt:0 "顺天武备系已失势流亡，或顺天政权已不复存在"
SIC_wubei_collaboration_available_tt:0 "顺天仍存在且武备系已在顺天掌权"
SIC_wubei_integration_80_tt:0 "武备整合度至少为 80"

SIC_anzhi_liuwang_junguan:0 "安置流亡军官"
SIC_anzhi_liuwang_junguan_desc:0 "为流亡军官划定驻地、薪饷与任职程序，避免他们以私人门生网络直接争夺四川部队。安置会消耗财政并带来短期社会压力，却能让北来人员开始服从总会的登记与调度。"
SIC_jieshou_jungong_dangan:0 "接收军工档案与图纸"
SIC_jieshou_jungong_dangan_desc:0 "由技术军官与四川工匠共同核验流亡者携来的图纸、工序与采购账册。合格资料将进入统一档案，既补充本地军工能力，也避免未经审查的旧合同和秘密承诺重新支配生产。"
SIC_shencha_beilai_mingce:0 "审查北来人员名册"
SIC_shencha_beilai_mingce_desc:0 "逐一复核北来人员的履历、旧部关系和政治债务。审查并不是为了制造新的清洗，而是让总会清楚哪些人适合技术岗位、哪些人需要监督，从而减少传言对整合的侵蚀。"
SIC_tiaohe_chuanjun_baoding:0 "调和川军与保定门生"
SIC_tiaohe_chuanjun_baoding_desc:0 "以共同军校课程、混合任职和公开升迁规则调和两套军官网络。双方都必须让出一部分私下提拔权，换取更稳定的指挥关系；成功后，流亡者带来的派系冲突将不再主宰四川政治。"
SIC_sheli_xinan_wubei_xuetang:0 "设立西南武备学堂"
SIC_sheli_xinan_wubei_xuetang_desc:0 "在成都设立面向各部的军官教育机构，把战术、后勤、工程与军政法规纳入同一课程。学堂不会立刻制造名将，却能使新一代军官不必依附旧门生，成为总会长期存在的制度基础。"
SIC_qingli_liuwang_zhengzhi_zhaiwu:0 "清理流亡集团的政治债务"
SIC_qingli_liuwang_zhengzhi_zhaiwu_desc:0 "流亡并未自动消除旧日的担保、恩怨和秘密任命。省府将以补偿、审计与公开撤销处理这些政治债务，避免北方派系借债权干预四川行政。代价高昂，但能换来更持久的内部稳定。"
SIC_paiqian_junguan_jiaoliutuan:0 "派遣军官交流团"
SIC_paiqian_junguan_jiaoliutuan_desc:0 "向顺天派出小规模军官与技术人员，观察训练、后勤和军需制度，同时让四川保留自己的指挥权。交流团能缩短南北信息差，却必须防止它演变为北方直接插手西南人事的通道。"
SIC_tongyi_buqiang_huopao_biaozhun:0 "统一步枪火炮标准"
SIC_tongyi_buqiang_huopao_biaozhun_desc:0 "南北两地的武器型号与补给习惯必须逐步靠拢。共同标准会让旧库存和地方偏好付出代价，却能让兵工厂获得更大的订单规模，令全国战场上的弹药、零件和维修不再彼此掣肘。"
SIC_huafen_nanbei_junxu_dingdan:0 "划分南北军需订单"
SIC_huafen_nanbei_junxu_dingdan_desc:0 "把能够由四川承担的煤炭、修理和轻武器订单，与由顺天承担的项目公开划分，避免双方企业为同一份合同互相抬价。清晰分工能提高效率，但也会让依赖旧合同的地方势力感到不安。"
SIC_jianli_lianhe_junshi_yanjiushi:0 "建立联合军事研究室"
SIC_jianli_lianhe_junshi_yanjiushi_desc:0 "研究室由两地军官、工程师和军需人员共同组成，负责检验战场经验和装备改良。它不替代四川的自主军政机关，而是将合作固定为可监督的专业机制，减少依靠私人电报和临时承诺的风险。"
SIC_xietiao_zhongyuan_zuozhan:0 "协调中原作战"
SIC_xietiao_zhongyuan_zuozhan_desc:0 "在全国战争的关键方向上交换部队调动、补给节奏与战略判断。协调会消耗指挥资源，却能让四川不再孤立规划远征；同时必须明确，这份合作服务于共同战局，而非让任何一方无条件接受另一方的命令。"
SIC_chuli_nanbei_lingdaoquan:0 "处理南北领导权争议"
SIC_chuli_nanbei_lingdaoquan_desc:0 "南北合流最危险的部分不在武器，而在谁有权决定人事、订单与战略。通过代表比例、轮值机制和公开仲裁处理争议，双方才能把竞争留在规则内。若回避这一问题，军需合作终会在领导权冲突中瓦解。"

SIC_wubei_zonghui:0 "西南武备总会"
SIC_wubei_zonghui_desc:0 "武备总会的收益随§Y武备整合度§!变化。低于 30 时派系冲突拖累政府与军队；达到 70 后获得组织、计划与工业收益；达到 80 后将进一步提高动员与军工组织资金获取。"
SIC_chuanjun_baoding_chongtu:0 "川军与保定门生之争"
SIC_chuanjun_baoding_chongtu_desc:0 "流亡军官的资历与四川旧部的地位发生冲突。若不以公开规则调和，军队将继续被彼此防备的门生网络分割。"
SIC_xinan_wubei_xuetang:0 "西南武备学堂"
SIC_xinan_wubei_xuetang_desc:0 "以统一课程和公开考核培养军官，使军队的人才来源不再完全依赖私人门生关系。"
SIC_nanbei_lingdaoquan_zhengyi:0 "南北领导权争议"
SIC_nanbei_lingdaoquan_zhengyi_desc:0 "与顺天合流带来了装备和信息，也带来了谁能决定军政事务的根本分歧。"
SIC_nanbei_junxu_xieding:0 "南北军需协定"
SIC_nanbei_junxu_xieding_desc:0 "公开划分的订单和验收制度使南北合作从临时情面变为可计算、可追责的军需安排。"
SIC_nanbei_junxu_tixi_bengkui:0 "南北军需体系崩溃"
SIC_nanbei_junxu_tixi_bengkui_desc:0 "若领导权争议失控，原本互补的订单、人员和技术网络将相互掣肘，拖累整个军政体系。"

SIC_daming_junzheng_guo:0 "大明军政国"
SIC_daming_junzheng_guo_DESC:0 "大明军政国"
SIC_daming_junzheng_guo_DEF:0 "大明军政国"
SIC_daming_junzheng_guo_ADJ:0 "大明"
SIC_daming_junzheng_guo_idea:0 "大明军政国"
SIC_daming_junzheng_guo_idea_desc:0 "全国统一后，军队、军需与行政被纳入以代表会议和军政总会为核心的秩序。其合法性来自战时统合与公共责任，而非任何一支地方部队的私有权。"

TODSIC.1030.t:0 "武备系的西南据点"
TODSIC.1030.d:0 "成都与重庆之间的电报线重新忙碌起来。兵工厂的清单、军校的名册和商会的运输账本被送往同一张长桌。武备系没有承诺立刻消除所有乱象，只提出一个更苛刻的要求：从今天起，军队、军需和行政必须能够被同一套规则追问责任。"
TODSIC.1030.a:0 "先把西南的底盘站稳"
TODSIC.1031.t:0 "北来者抵达成都"
TODSIC.1031.d:0 "携带箱笼与档案的北来军官在码头和车站出现。他们带来军校笔记、兵工图纸和难以说清的旧日承诺。四川需要这些经验，却不能让任何一批流亡者凭过去的头衔接管新体系；接纳从登记、安置和共同承担责任开始。"
TODSIC.1031.a:0 "让他们先进入总会名册"
TODSIC.1032.t:0 "南北武备合流"
TODSIC.1032.d:0 "顺天来电承认四川在西南军政中的独立地位，并提出以军官交流、统一规格和共同筹划换取长期合作。成都方面接受了谈判桌，而不是隶属关系：合作的每一步都要写进订单、会议记录和双方能够核验的规则。"
TODSIC.1032.a:0 "以规则而非私交合作"
TODSIC.1033.t:0 "一箱军工档案"
TODSIC.1033.d:0 "档案中既有有用的工序、旧式检验表和采购渠道，也夹杂着私人担保、欠款与人情条子。技术人员连夜挑拣能够公开使用的资料，剩余部分则进入封存审查。总会第一次意识到，真正可用的技术从来不能与旧政治债务一并照收。"
TODSIC.1033.a:0 "让图纸服务于新的制度"
TODSIC.1034.t:0 "川军与保定门生的争执"
TODSIC.1034.d:0 "一次例行的人事讨论很快变成对资历与功劳的互相指责。四川旧部担心被北来者架空，流亡军官则怀疑自己只是被当作技术雇员。若任由这场争执扩散，总会的每一项命令都会被当作派系报复；必须以共同规则给出可被双方接受的出路。"
TODSIC.1034.a:0 "职位必须服从共同制度"
TODSIC.1035.t:0 "兵工厂的督办"
TODSIC.1035.d:0 "车间里最缺的不是口号，而是能够判断机器、材料和工人去向的人。总会派出的督办被要求同时向军方、工程师和省府报告，不能只替某一部队截留产品。新的制度未必受欢迎，却让兵工厂第一次拥有了可追踪的交货责任。"
TODSIC.1035.a:0 "先把生产线接起来"
TODSIC.1036.t:0 "四川军政会议开幕"
TODSIC.1036.d:0 "会场中的军官、商人和文官都明白，谁来签字、谁来付款、谁来承担失败的后果，远比口号更难回答。会议没有许诺一致同意，而是决定把人事、军需和行政分别列入公开议程。武备系若要取得全国资格，就必须先证明自己能处理这种分歧。"
TODSIC.1036.a:0 "把争执写进制度"
TODSIC.1037.t:0 "同一种步枪"
TODSIC.1037.d:0 "检验台上的样枪来自不同厂房，枪机、瞄具和弹药习惯各不相同。工程师用最朴素的理由说服了与会者：前线士兵无法依靠派系称谓修理武器。统一规格意味着部分旧库存被淘汰，却也意味着未来的补给不必再为每一支部队重新计算。"
TODSIC.1037.a:0 "让标准跟着士兵走"
TODSIC.1038.t:0 "全国武备代表齐聚成都"
TODSIC.1038.d:0 "从各地赶来的代表带着不同口音、制服和政治主张，却不得不面对同一个事实：没有稳定的军需、明确的指挥责任和可监督的行政，统一只会制造更大的混乱。四川提出以总会经验为基础的统国纲领，要求所有参与者承诺让军政权力接受共同规则。"
TODSIC.1038.a:0 "提交统国纲领"
TODSIC.1039.t:0 "大明军政国成立"
TODSIC.1039.d:0 "全国统一完成后，西南接纳的流亡者、四川旧部和新一代军政人员共同走入新的国家机构。大明军政国并不把任何一支部队当作国家的主人；它以统一军需、公开责任和代表会议维持战后的秩序。曾经的流亡档案终于成为共同制度的一部分。"
TODSIC.1039.a:0 "以共同责任统合全国"
TODSIC.1040.t:0 "大明军政国成立"
TODSIC.1040.d:0 "南北武备体系在全国统一后被改组为共同的军政秩序。四川保留了西南的组织经验，顺天提供了北方的制度网络，双方则把最危险的领导权竞争交给代表会议和可核验的规则。大明军政国由此建立，国家不再只是任何一地的军队延伸。"
TODSIC.1040.a:0 "南北同责，军政一体"
TODSIC.1041.t:0 "大明军政国在西南成立"
TODSIC.1041.d:0 "随着全国统一完成，四川武备系接纳的流亡军官与本地军政力量共同建立大明军政国。新政权宣称将以统一军需、代表会议和行政责任处理战后秩序，而不再让旧日派系自行分割国家资源。"
TODSIC.1041.a:0 "新的军政秩序开始了"
TODSIC.1042.t:0 "大明军政国完成南北统合"
TODSIC.1042.d:0 "四川与顺天武备系的长期合作在全国统一后转化为大明军政国。双方以共同的装备标准、军需网络和代表机制约束彼此，宣称新的国家应当服务于全国秩序，而不是某一地区或军官集团。"
TODSIC.1042.a:0 "南北武备进入同一国家"
TODSIC.1043.a:0 "以共同仲裁结束争执"

SIC_xianzhi_jundui_canzheng_available_tt:0 "已完成决议§Y举行省府预算审计§!，取得限制军队干预财政与民政所需的公开账目"
SIC_huifu_shengzizhengju_available_tt:0 "已完成决议§Y开展社会调查§!，取得重新划分地方代表与选区所需的基层资料"
SIC_sichuan_jibenfa_available_tt:0 "已完成§Y开展社会调查§!、§Y举行省府预算审计§!和§Y与军方协商退让§!三项四川新政决议"
SIC_sichuan_moshi_available_tt:0 "已完成§Y重开省咨议局§!、§Y内阁信任投票§!和§Y军队宪法誓言§!三项制度决议"
SIC_qingzhengxi_sichuan_xiaoguo:0 "启动§Y清政系宪政试验§!并解锁§Y四川新政§!决议；初期稳定度§R-3.0%§!、消费品需求§R+2.0%§!，获得§G35§!点清政系影响，后续改革可逐步改善这些修正"
SIC_diaocha_xianxing_xiaoguo:0 "§Y清政系宪政试验§!：科研速度§G+1.0%§!；解锁决议§Y开展社会调查§!"
SIC_gongkai_shengfu_yusuan_xiaoguo:0 "§Y清政系宪政试验§!：每日政治点数获取§G+0.01§!；获得§Y公开而有信用的财政§!并解锁预算审计决议"
SIC_xianzhi_jundui_canzheng_xiaoguo:0 "§Y清政系宪政试验§!：组织度§R-1.0%§!；§R锁定师级编制修改§!并获得§Y军队退出政治§!，只有完成§Y国民军国家化§!后才能重新修改编制"
SIC_huifu_shengzizhengju_xiaoguo:0 "恢复省级代表政治并解锁§Y重开省咨议局§!决议，为《四川基本法》准备合法的审议机构"
SIC_sichuan_jibenfa_xiaoguo:0 "确立小民产权、公开财政与文官统军原则，获得§Y《四川基本法》§!并使§Y自由民主主义§!成为执政理念"
SIC_zerenneige_xiaoguo:0 "§Y清政系宪政试验§!：每日政治点数获取§G+0.03§!；获得§Y向议会负责的内阁§!并解锁内阁信任投票"
SIC_junquan_guanyu_xianfa_xiaoguo:0 "确立君主仅作为国家连续性象征、诏令须由责任大臣副署的原则，并解锁§Y军队宪法誓言§!"
SIC_xianzheng_jiuguo_xuanyan_xiaoguo:0 "获得为期§Y180日§!的§Y宪政统一动员§!，提高政治动员、战争支持和战争目标正当性"
SIC_quanguo_zhixianpai_dahui_xiaoguo:0 "解锁§Y宪政统一§!决议，可通过宣传、通讯、代表会议和临时法纲扩大全国制宪网络"
SIC_tongyi_bizhi_guanshui_xiaoguo:0 "获得§Y统一的币制与全国市场§!，显著降低消费品需求并提高工业产出、效率上限与建设速度"
SIC_sichuan_moshi_xiaoguo:0 "结束试验阶段并整合既有制度精神，获得强化后的§Y四川宪政模式§!，全面提升政治、科研、建设与社会稳定"
SIC_guominjun_guojiahua_xiaoguo:0 "§G解除师级编制锁定§!，移除§Y军队退出政治§!，获得大幅强化组织度、恢复率和攻防能力的§Y宪法国民军§!"

TODSIC.1010.t:0 "全国制宪会议闭幕"
TODSIC.1010.d:0 "经过长期战争与政治重建，来自全国各省、各党派、行业团体、军队与皇室的代表终于通过新的国家根本法。君主被保留为国家连续性与共同历史的象征，行政权则由向议会负责的内阁行使，军队、财政和司法都被置于成文规则之下。以四川试验为起点的清政系道路，已经成为全国制度现实。"
TODSIC.1010.a:0 "以宪法定国。"

TODSIC.1013.t:0 "秩序重新回到四川"
TODSIC.1013.d:0 "数月以来，省府官员第一次能够沿着恢复通行的道路抵达各县，粮船重新出现在长江码头，军队也开始依照统一命令领取补给。商铺仍保留着暴乱时钉上的木板，乡村仍有人担心下一次征发，但最危险的恐慌已经退去。四川并未从全国内战中得到真正安全，不过它终于重新拥有作出选择的能力：继续追随旧朝廷的命令，投入军阀竞争，或寻找一条属于自己的治理道路。"
TODSIC.1013.a:0 "先让四川重新站稳。"
TODSIC.1014.t:0 "天府再度富足"
TODSIC.1014.d:0 "成都市场恢复了来自川西的药材、川南的盐和重庆转运的外地机器，停工许久的厂房重新冒出烟气。省府统计显示，税收、粮价和铁路货运都已接近危机前水平。更重要的是，人们不再只讨论如何熬过明天，而开始询问今后的学校、道路和工厂应当如何建设。天府之治不只是经济数字的反弹，它让四川第一次相信，稳定的制度也许可以比某位强人的命令更加长久。"
TODSIC.1014.a:0 "繁荣应当有长久的根基。"
TODSIC.1015.t:0 "盆地没有屈服"
TODSIC.1015.d:0 "外部封锁、军费压力和战时配给都没能压垮四川。工厂按照统一计划保障军需，地方仓储维持城市供应，沿江炮台和山口部队也完成新的防御部署。报纸把这段经历与昔日钓鱼城的坚守相提并论，但军官们更清楚，单纯守住盆地无法结束威胁。川渝已经证明自己能够屹立，接下来必须决定如何把积累的工业、军队和政治意志投向更广阔的全国局势。"
TODSIC.1015.a:0 "四川不只能够防守。"
TODSIC.1016.t:0 "川军走向全国"
TODSIC.1016.d:0 "整训后的部队在车站和码头集结，统一军饷、补给和作战计划取代过去各部临时拼凑的安排。省府发表声明，川军出省并非为了让某位将领扩充地盘，而是为了结束持续吞噬交通、市场与百姓生活的全国战争。这样的承诺能否兑现仍无人知晓，但四川已经不愿再把国家未来交给别人决定。中原的战场将检验川军的力量，也将检验四川究竟代表怎样的秩序。"
TODSIC.1016.a:0 "让全国听见四川的主张。"
TODSIC.1017.t:0 "一场以四川为尺度的试验"
TODSIC.1017.d:0 "清政系成员、学者、商会代表和部分地方官员在成都举行联席会议。他们没有宣布一部凭空降临的完美宪法，而是提出从最具体的事情开始：调查县政、公开预算、恢复代表机关并迫使军队退出日常政治。反对者讥讽这只是书生议论，也有人担心改革会打破刚刚恢复的稳定。清政系回应说，四川正因为经历过危机，才更需要一套不依赖个人善意也能继续运行的规则。"
TODSIC.1017.a:0 "用实际治理回答质疑。"
TODSIC.1018.t:0 "军官离开省府会议室"
TODSIC.1018.d:0 "新的军政条例公布后，一批兼任县长、税务主管和厂矿监督的军官收到解除民职的命令。军方代表接受公开预算和文官命令，却要求政府保障军饷并避免借改革清洗旧部。作为过渡，省府冻结师级编制调整，防止任何派系借整顿之名扩张私兵。街头为军队退出政治而欢呼，军营中却弥漫着不满与不安；真正的国家化改革，必须在秩序和战斗力之间找到新的平衡。"
TODSIC.1018.a:0 "军队应保卫制度，而非支配制度。"
TODSIC.1019.t:0 "《四川基本法》公布"
TODSIC.1019.d:0 "咨议局大厅内，代表逐条表决通过《四川基本法》。文件保障人身、言论与财产权，规定税收和重大支出必须接受审议，确认内阁对代表机关负责，并将军队置于文官政府和成文军法之下。它并未解决四川所有矛盾，也无法阻止未来政府犯错，但从今天起，官员、将领和普通民众至少拥有同一套可以援引的规则。临时政治开始退场，宪政第一次成为能够约束权力的现实。"
TODSIC.1019.a:0 "让任何权力都不能凌驾于法。"
TODSIC.1020.t:0 "从成都发出的救国宣言"
TODSIC.1020.d:0 "电台和报纸同时刊出《宪政救国宣言》。宣言指出，如果统一只是让最强大的军队接管所有省份，中国仍会在下一次继承、财政或军权危机中重新分裂。四川提出以共同宪法结束战争：保障基本权利，建立责任内阁，限制君主与军队的日常权力，并邀请各地政治团体参加全国制宪。支持者把它视为超越军阀竞争的新旗帜，敌对政权则指责四川用漂亮文字包装扩张野心。"
TODSIC.1020.a:0 "统一必须有比胜利更牢固的基础。"
TODSIC.1021.t:0 "四川模式"
TODSIC.1021.d:0 "新政白皮书显示，公开财政、产权保障、议会监督、责任内阁、有限君权与文官统军已经形成相互支撑的制度链条。商人可以预期税制，普通人能够申诉权利，内阁必须解释政策，将领也不能随意改变行政命令。四川当然仍有腐败、派系和贫困，但这些问题开始通过公开程序处理，而不是依靠一次次政变解决。清政系终于能够向全国展示：所谓四川模式不是口号，而是一套可以复制的治理技术。"
TODSIC.1021.a:0 "把试验变成全国方案。"
