l_simp_chinese:
SIC_red_opportunity_category:0 "四川红军机会"
SIC_red_opportunity_category_desc:0 "省内指标与治理决议统一显示在川内局势。"
SIC_red_relief:0 "实施民生纾困"
SIC_red_relief_desc:0 "花费35政治点。拨出省府经费改善民生，降低工业危机5点、民众不满10点；两项指标最低降至0，并立即刷新状态。30天后可再次实施。"
SIC_red_negotiate:0 "协调工农诉求"
SIC_red_negotiate_desc:0 "已有组织活动时可用。花费40政治点，召集工农代表协商，使红军组织度降低12、民众不满降低5；数值最低降至0，并立即刷新状态。30天后可再次实施。"
SIC_red_raids:0 "搜捕地下网络"
SIC_red_raids_desc:0 "已有组织活动时可用。花费25政治点和10指挥点，动用治安力量搜查地下据点，使红军组织度降低20、民众不满增加8；组织度最低为0、不满最高为100，并立即刷新状态。30天后可再次实施。"
SIC_red_opportunity_conditions_tt:0 "起义须同时满足：民众不满至少60、红军组织度至少60、行动窗口开放、省府仍拥有并控制川中、四川革命政府尚未建立，且此前尚未发起起义。行动窗口：正在交战、稳定度低于35%，或军队陷入混乱。每月检查一次；不满再高也不会单独引发起义。"
SIC_red_relief_tt:0 "花费：£pol_power 35。工业危机降低5，民众不满降低10（最低为0）；立即刷新相关状态。30天后可再次实施。"
SIC_red_negotiate_tt:0 "花费：£pol_power 40。仅在已有组织活动时可用。红军组织度降低12，民众不满降低5（最低为0）；立即刷新相关状态。30天后可再次实施。"
SIC_red_raids_tt:0 "花费：£pol_power 25、£command_power 10。仅在已有组织活动时可用。红军组织度降低20，民众不满增加8（最高为100）；立即刷新相关状态。30天后可再次实施。"
SIC_red_raids_cp_cost:0 "£command_power 10"
SIC_red_raids_cp_cost_blocked:0 "£command_power §R10§!"
SIC_red_raids_cp_cost_tooltip:0 "实施搜捕需要25政治点和10指挥点。"
TODSICRED.1.t:0 "川中地下联络日益活跃"
TODSICRED.1.d:0 "红军的联络网络正在扩展，城乡之间的消息往来愈发频繁。只有民众不满和红军组织度均达到60，且正在交战、稳定度低于35%或军队仍陷入混乱时，才会出现起义机会。\n\n省府仍有时间实施民生纾困、协调工农诉求，或搜捕地下网络，缓解压力并削弱地下组织。若矛盾继续积累，战事与军队动荡可能令局势急转直下。"
TODSICRED.1.a:0 "继续处理省内局势"
SIC_red_monthly_rules_tt:0 "红军组织度范围0—100，起始为0。组织度每月变化：民众不满达到80或以上时增加12；60—79时增加8；低于40时降低6；其余情况不变。治理决议再次实施前需等待30天。"
