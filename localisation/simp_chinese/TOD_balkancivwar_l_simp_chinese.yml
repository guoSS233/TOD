l_simp_chinese:
balkancivwar.1.t:0 "游击队发现土耳其空投"
balkancivwar.1.d:0 "我们在塞浦路斯岛上的游击队近日发现了一些装有土耳其武器的空投物资。这可能是在我们封锁塞浦路斯后土耳其所做出的应对措施。"
balkancivwar.1.a:0 "他们这是在负隅顽抗，不过他们的武器值得我们一看。"
balkancivwar.2.t:0 "我们的空投被发现"
balkancivwar.2.d:0 "由于飞行员的疏忽，我们空投到塞浦路斯近日落到了希腊游击队的手中。这使得我们的游击队现在急需武器补充。"
balkancivwar.2.a:0 "等到下一次吧。"
balkancivwar.3.t:0 "我们成功夺取塞浦路斯"
balkancivwar.3.d:0 "在经过长久的作战后，土军最后的大本营沦陷。尽管还有小部分土军在顽强抵抗，但大局已定，塞浦路斯岛已然被我方控制。\n土耳其政府方面也宣布放弃对塞浦路斯的争夺。"
balkancivwar.3.a:0 "这是希腊民族的胜利。"
balkancivwar.4.t:0 "我们成功夺取塞浦路斯"
balkancivwar.4.d:0 "在经过长久的作战后，希腊军最后的大本营沦陷，尽管还有小部分希腊军在顽强抵抗，但大局已定，塞浦路斯岛已然被我方控制。\n希腊政府方面也解除了对塞浦路斯的封锁并宣布放弃对其的争夺。"
balkancivwar.4.a:0 "这是土耳其民族的胜利。"
balkancivwar.1001.t:0 "希腊宣布封锁塞浦路斯周围海域"
balkancivwar.1001.d:0 "随着塞浦路斯局势日益紧张，希腊政府宣布将派出舰队封锁塞浦路斯周围海域，将当地与外界的海上联系切断，土耳其政府方面强烈谴责希腊行为并开始采取反制措施。\n有专家指出：希腊方面的行为无疑是公然向土耳其方面挑衅，塞浦路斯局势已经进入了白热化阶段，并且随时都可能引发战争。"
balkancivwar.1001.a:0 "我们在保卫领土，难道不是吗？"
balkancivwar.1001.b:0 "可恶的希腊人！现在我们该怎么夺回领土呢？"
balkancivwar.1002.c:0 "不过是巴尔干的闹剧"
balkancivwar.1001.t:0 "希腊-土耳其战争爆发"
balkancivwar.1001.d:0 "自从希腊与土耳其就塞浦路斯岛屿的归属问题产生争议以来，两国关系长期处于紧张对峙之中。历史上，该岛的民族纷争与地缘战略价值屡次引发区域冲突，而近期由于一方在塞浦路斯问题上明显受挫，不甘接受现状的他们正试图以更强硬的姿态卷土重来。\n目前的最新动向是，军队已开始向君士坦丁堡非军事区推进。这一行为严重违反了过去数十年间维系的停火协议及相关国际共识，无疑进一步加剧了区域内的军事对抗风险。双方民族主义情绪持续高涨，外交渠道的沟通几近停滞，而军事部署和边境摩擦却不断升级。\n可以预见，如果局势继续沿着当前路径发展，一场全面战争将难以避免。国际社会对此高度关注，多方呼吁克制并重启谈判，但迄今仍未取得实质性进展。塞浦路斯问题牵涉历史、民族、宗教及大国利益等多重因素，其复杂性使得任何一方的军事冒进都可能引爆更大规模的冲突。未来局势令人忧虑，和平前景愈发渺茫。" 
balkancivwar.1001.a:0 "伊斯坦布尔必将属于我们！"
balkancivwar.1001.b:0 "君士坦丁堡必将属于我们！"
balkancivwar.1001.c:0 "不过是巴尔干的闹剧"
balkancivwar.1002.t:0 "君士坦丁堡解放"
balkancivwar.1002.d:0 "【本报[?global.date.GetDateStringNoHour]伊斯坦布尔电】\n在希腊海军迅速行动，全面封锁了土耳其至塞浦路斯之间的海上通道，并派出数百名士兵登陆塞浦路斯岛，迅速控制该岛主要交通枢纽和港口设施，宣布完全控制塞浦路斯岛后。今日凌晨，本报记着与君士坦丁堡目睹土耳其军队强行开入的场面。军车陆续驶入城区，与当地希腊裔民兵发生零星交火，战斗多在临时搭建的街垒处爆发，但迅速告一段落。至今天早晨，土耳其军队已基本控制君士坦丁堡全城。在城西郊外，土军与及时反应并增援而来的希腊军队形成紧张对峙，据传闻双方已发生数起流血冲突，气氛严峻。\n希腊裔聚居区在此期间遭受破坏，多处房屋与商铺遭到纵火或洗劫，仅一个早上便接连发生数起暴力事件。然而土耳其军队并未积极干预制止，城内陷入一片混乱：土耳其街区弥漫着胜利的狂欢，欢呼声与旗帜四处飞扬；而在希腊人居住区，居民则争相撤离，车辆拥堵道路，恐慌情绪持续蔓延。直至下午，骚乱才逐渐被强制平息。与此同时，随着希土两军交火的消息传回城内，整座城市渐渐陷入沉寂，民众屏息等待下一步局势发展。\n与此同时，希腊海军迅速行动，全面封锁了土耳其的地中海海域，所有岛屿上的希腊军队进入战备状态。土耳其方面未及时作出军事应对，而是选择向伊斯坦布尔地区增调更多部队。"
balkancivwar.1002.a:0 "她会在伊斯坦布尔等你到来。"
balkancivwar.1003.t:0 "希腊进入君士坦丁堡"
balkancivwar.1003.d:0 "【本报[?global.date.GetDateStringNoHour]雅典电】\n三小时前，希腊一支先遣部队以迅雷不及掩耳之势突入君士坦丁堡市区，并在圣索菲亚大教堂顶端升起了希腊国旗。这则消息迅速得到希腊军方正式确认，顷刻间，希腊各地民众自发涌上街头，展开热烈庆祝，长久以来笼罩全国的压抑气氛为之一扫而空。而在君士坦丁堡，景象却截然不同——随着更多希腊部队持续开入城区，当地土耳其居民明显表现出强烈不安与忧虑，街头巷尾弥漫紧张情绪；相反，希腊裔社区则洋溢着欢欣鼓舞的气氛，旗帜飞扬，歌声不绝。\n根据希腊军方消息人士透露，此次行动是对土耳其先前非法占领塞浦路斯地区的直接报复。该人士进一步表示，希腊军队将继续展开军事行动，目标是将土耳其力量彻底逐出塞浦路斯，恢复希腊对该地区的主权。君士坦丁堡的街道上已然出现两种现实的尖锐对立：一边是欢呼雀跃的希腊人群体，高呼历史正义得以伸张；另一边则是沉默警惕的土耳其人，凝视着不断增加的希军兵力与巡逻队伍，昔日平静的城市图景正在被重新分割。\n东正教教堂的钟声与军用车辆的轰鸣交织在一起，形成这座城市新的背景音。希腊士兵在关键路口设立检查点，重要机构已被接管，圣索菲亚大教堂四周更是部署了严密警戒。而在爱琴海另一侧，土耳其人很明显是被激怒了，军队正在开始迅速动员起来前往君士坦丁堡。"
balkancivwar.1003.a:0 "希腊，一点都不能少！"
balkancivwar.1004.t:0 "希腊-土耳其战争爆发"
balkancivwar.1004.d:0 "【本报[?global.date.GetDateStringNoHour]伊斯坦布尔电】\n近日，爱琴海地区局势急剧升级。土耳其社会主义共和国宣布，其武装力量已全面接管原国际共管的君士坦丁堡非军事区。这一行动被视为对希腊共和国此前完全控制塞浦路斯岛的强势回应，标志着两国长期争议正式演变为全面军事冲突。\n自二十世纪初以来，塞浦路斯岛的归属问题始终是希土两国关系中的核心争端。该岛民族构成复杂，地缘战略价值显著，历史上曾多次引发区域性军事对峙。今年希腊共和国通过一系列政治与军事行动巩固了对塞浦路斯的实际控制，此举引发土耳其方面强烈反弹。\n土耳其社会主义共和国领导人伊斯梅特·凯末尔在全民演说中称：“希腊的单方面行动破坏了东地中海的力量平衡，我们不得不采取必要措施维护国家安全与社会主义共和国的利益。”土方指责希腊违背了国际条约中关于塞浦路斯地位的国际共识，并强调军事行动是“对现状被迫作出的反应”。\n另一方面，希腊共和国总理米哈伊尔·维尼泽洛斯发表声明，强烈谴责土耳其“公然违反国际法”的行为，并宣称希腊武装力量已进入最高战备状态。“我们绝不会容忍祖国领土与主权受到挑战，”他在电视讲话中表示，“任何对塞浦路斯及爱琴海秩序的威胁都将遭到坚决回击。”\n据国际观察组织透露，两国已在马尔马拉海沿岸及色雷斯边境地带部署大量兵力，空中与海上交火事件频发。" 
balkancivwar.1004.a:0 "君士坦丁堡必将属于我们！"
balkancivwar.1004.b:0 "伊斯坦布尔必将属于我们！"
balkancivwar.1004.c:0 "火药桶，一点即爆"
balkancivwar.1005.t:0 "土耳其-希腊战争爆发"
balkancivwar.1005.d:0 "【本报[?global.date.GetDateStringNoHour]君士坦丁堡电】\n爱琴海局势于近日发生颠覆性变化。土耳其社会主义共和国近日宣布已完成对塞浦路斯岛的全境军事控制。作为回应，希腊共和国于次日凌晨发起代号为“遗产行动”的军事行动，出兵进入原由国际共管的君士坦丁堡非军事区，致使两国进入实质性战争状态。\n此次危机的直接导火索是土耳其方面于最近发起的“塞浦路斯回归行动”。土方声称该行动旨在“保护岛上土耳其族居民免受系统性压迫”，并重申塞浦路斯“历史上与安卡拉不可分割”。希腊政府则指责此举为“赤裸裸的扩张主义侵略”，违反多项战后国际协定。\n希腊总理在议会紧急会议上表示：“土耳其的军事冒险行为已彻底破坏东地中海安全架构。我们将不惜一切代价捍卫希腊的民族利益与历史权利。”希方称其控制君士坦丁堡非军事区是“为防止局势进一步恶化而采取的必要的防御性部署”。\n土耳其社会主义共和国领导人凯末尔则通过广播发表全国讲话，谴责希腊“利用殖民历史借口发动侵略”，并强调“土耳其人民绝不会在社会主义与民族尊严面前后退一步”。他同时宣布关闭博斯普鲁斯海峡一切非土方授权航行，直至“安全威胁解除”。\n有情报显示，两国陆军已在色雷斯边境东段发生多次交火，希腊海军则对达达尼尔海峡出口实施了监视封锁。" 
balkancivwar.1005.a:0 "君士坦丁堡必将属于我们！"
balkancivwar.1005.b:0 "伊斯坦布尔必将属于我们！"
balkancivwar.1005.c:0 "火药桶，一点即爆"





