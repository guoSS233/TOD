l_simp_chinese:
 CHL_overseas_haven:0 "世外桃源海外华邦"
 CHL_overseas_haven_desc:0 "共和国万岁！人民万岁！民主万岁！"
 CHL_final_term_program:0 "任期末施政纲领"
 CHL_final_term_program_desc:0 "1936年，作为伍盤照总统辉煌执政生涯中第二个任期的收官之年，他引领着国家稳步跨越了庚午年间的经济困境——钱荒阴霾。即便身处任期尾声，伍盤照总统仍展现出非凡的领导力与决心，不懈地推动着共和国的巨轮破浪前行，迈向更加繁荣与稳定的未来。"
 CHL_promote_xiaokang:0 "宣传小康思想"
 CHL_promote_xiaokang_desc:0 "以著其义，以考其信，著有过，刑仁讲让，示民有常。如有不由此者，在埶者去，众以为殃，是谓小康---《礼运大同篇》"
 CHL_resist_radicalism:0 "对抗激进思潮"
 CHL_resist_radicalism_desc:0 "南道山所亟需的，并非一场颠覆性的革命，更非向外界的盲目扩张，而是深刻的休养与内力的积聚，以期实现长远的繁荣与稳定。"
 CHL_coordinate_chambers:0 "协调“上下”院权益"
 CHL_coordinate_chambers_desc:0 "自从一九二五年军队还政于民以来，资政院与资议院之间的分歧与矛盾非但没有缓和，反而愈演愈烈，犹如一个蓄势待发的火药桶，其紧张态势亟待我们采取行动，在爆炸的临界点之前果断剪断那根危险的引线，以维护局势的稳定与和谐。"
 CHL_balance_party:0 "党内平衡手"
 CHL_balance_party_desc:0 "新民会是以原南殷大同会为基础并与其余民主会社组建的一个政治联盟，在会内不仅仅有对大同理念的分歧，更有各种思想之间的冲突，而伍盤照能以个人威望从中斡旋，使亲民会各派和衷共济。"
 CHL_political_stalwart:0 "政坛不倒翁"
 CHL_political_stalwart_desc:0 "自1929年亲民会成立以来，它在历次大选中均保持不败战绩，这一辉煌成就凝聚了我们全体成员的共同努力与精诚合作。展望未来，我们将坚定不移地维护并传承这一优良传统，继续携手并进，共创更加辉煌的明天。"
 CHL_centrist_politics:0 "中道政治"
 CHL_centrist_politics_desc:0 "“师也过，商也不及，过犹不及。”古训昭昭，警示我们过于激进的改革犹如偏离中道，恐将动摇国本之基。在南道山复杂的国内外情境之下，我们或许应当深思熟虑，寻求一条既能推动国家前行，又能兼顾各方利益，为众人所广泛接受与认同的道路。这样的道路，方能在稳健中不失活力，于和谐中促进发展，引领国家迈向更加繁荣稳定的未来。"
 CHL_moderate_reform:0 "温和改良"
 CHL_moderate_reform_desc:0 "长久以来，新民会内部一直受到激进大同主义思潮的困扰。在大同国际和内部激进分子的双重压力下，新民会的政治倾向日趋左倾。幸赖伍盤照总统的统合下，我们才能在“温和改良”的正途上稳步前进。如今伍总统的任期即将告终，新民会能否继续坚持自己的“初心”压制激进思潮呢？"
 CHL_prepare_next_election:0 "筹备下届大选"
 CHL_prepare_next_election_desc:0 "昌德五十年大选，启动！"
 CHL_military_self_strengthening:0 "军队“自强”计划"
 CHL_military_self_strengthening_desc:0 "在上次欧洲战争中，久疏战阵的我军暴露出了许多问题。正因如此，南道山在战后积极推行了一系列军事改革。遗憾的是，这些努力因庚午年的经济动荡而受阻，未能完全实现其初衷。如今，我们决心重拾未竟之志，全面完成军事改革，誓将共和国军队再次推向辉煌！"
 CHL_attract_ming_veterans:0 "吸引退伍明军"
 CHL_attract_ming_veterans_desc:0 "大明帝国的军队已经完成了现代化改革，而我们还在上一次欧战的水平停滞不前，中基层军官严重缺乏，我们可以利用丰厚的条件邀请退伍的大明军官，帮助我们现代化。"
 CHL_introduce_modern_tactics:0 "引进新式战法"
 CHL_introduce_modern_tactics_desc:0 "在过去几年，我们遭遇了资金短缺的严峻挑战，而与此同时，全球范围内，各式各样的创新战术与尖端装备如雨后春笋般涌现，不断重塑着军事领域的面貌。如今，正是我们迎头赶上，紧跟这一时代潮流，确保自身不落于后的重要时刻。"
 CHL_expand_arms_capacity:0 "强化军备产能"
 CHL_expand_arms_capacity_desc:0 "尽管在战前与战后的一段时间内，我们成功地实现了军备的自给自足，展现出强大的国防实力，但庚午钱荒的突然降临却如同寒冬般侵袭，使我们的军工产业陷入了前所未有的困境，资金短缺，生产难以维系。\n\n但随着我们的经济逐渐转暖。现在我们将采取有力措施，为军工产业注入新的活力，让它焕发第二春。通过优化资源配置、加强技术创新、拓宽融资渠道等多方面的努力，我们誓要重塑军工产业的辉煌，确保共和国的国防安全坚如磐石。"
 CHL_intensify_exercises:0 "增强军事演习"
 CHL_intensify_exercises_desc:0 "我们当前的军事演习模式显得过于儿戏，缺乏应有的威严与实战性，这无疑是令人遗憾的。因此，我们有必要策划并举办一场规模宏大、震撼人心的军事演习，旨在向我们的邻国及国际社会展示我们军事力量的真正实力与决心，给予他们一次深刻的“南道山式”震撼体验。"
 CHL_initial_military_reform:0 "实现初步改革"
 CHL_initial_military_reform_desc:0 "经过初步阶段的锐意改革，我军已踏上蜕变之路，即将迎来脱胎换骨的崭新面貌。这场改革不仅触及了组织结构的优化与升级，更深刻地影响了军事战略、训练模式及装备现代化的全方位提升，预示着军队即将以更加强大、灵活和高效的姿态，迎接未来的挑战与机遇。"
 CHL_expand_fiscal_spending:0 "财政支出扩张计划"
 CHL_expand_fiscal_spending_desc:0 "面对庚午年间由钱荒引发的剧烈经济动荡，我国在明国顾问团队睿智建议的指引下，毅然决然地采取了扩张财政支出的策略，以稳健而有力的姿态应对这场突如其来的危机。诚然，此举在短期内不可避免地导致了财政赤字的加剧，但我们坚信，这仅是经济复苏过程中的暂时性挑战。\n\n随着政策效应的逐步显现，我们预计经济将逐渐回暖，市场活力将进一步释放。届时，财政赤字问题将在经济增长的强劲动力下逐步得到缓解，直至最终迎刃而解。"
 CHL_daoshan_trade:0 "注重道山体系贸易"
 CHL_daoshan_trade_desc:0 "长久以来，我们与四方及巴拉圭之间维系着亲如家人的深厚情谊，我们的祖先来自五湖四海，但最终在道山的见证下彼此结为兄弟！这份情谊跨越了时间的长河，历经风雨而愈发坚固。此刻，正值我们伸出援手，助力兄弟国家共渡钱荒难关之时！"
 CHL_expand_production:0 "扩大生产规模"
 CHL_expand_production_desc:0 "随着经济的强劲复苏，现有的产能已难以满足日益增长的市场需求，这迫切要求我们迅速采取行动，积极扩大市场规模。通过优化资源配置、激发市场活力、吸引更多投资与合作伙伴，我们将为经济的持续繁荣奠定坚实基础，确保能够充分满足市场需求，并引领行业向更高水平发展。"
 CHL_strengthen_bank_reserves:0 "加强银行储备"
 CHL_strengthen_bank_reserves_desc:0 "庚午钱荒发生的重要原因之一，便是在银行业发生了挤兑风潮。尽管我们正在逐步走出危机，但过往的教训却不可不察。通过坚实地增强我们的银行储备体系，我们将构建起一道抵御外部经济冲击的坚固防线，守护国家经济的稳健增长，进而为广大人民群众铺设一条通往更加繁荣与稳定未来的康庄大道。"
 CHL_keep_distance:0 "保持一定距离"
 CHL_keep_distance_desc:0 "虽然长久我们以来一直依附着天朝体系，但是地理上的客观距离，使得我们相对于其他国家拥有更多的独立性。这为我们融入天朝贸易体系增加了许多困难，也使得我们的经济较为独立。如果我们想要进一步发展，也许与天朝保持一定距离是一个好的选择。"
 CHL_attract_ming_investment:0 "吸引大明投资"
 CHL_attract_ming_investment_desc:0 "大明所能提供的援助与支持，相较于四方与巴拉圭，无疑展现出更为显著的优势与潜力。鉴于此，我们理应审时度势，适时放宽对大明投资的准入要求，以更加开放和包容的姿态，吸引并汇聚大明的投资力量。这不仅有助于我们进一步拓宽融资渠道，增强经济活力，更是我们深入天朝体系，在政治经济等领域与大明加强合作的重要契机。"
 CHL_seek_technology_transfer:0 "谋求技术转让"
 CHL_seek_technology_transfer_desc:0 "大明的科技一直走在世界前列，其掌握的许多生产技术都令我们的企业眼红不已。随着经济合作展开，我们可以向大明申请转让部分其应用较少或已然落伍的技术，更好地推动我国工农业发展。"
 CHL_ming_bank_guarantee:0 "大明银行担保"
 CHL_ming_bank_guarantee_desc:0 "这些项目将作为“四年国家建设振兴计划”的核心驱动力，引领我国落后产业实现脱胎换骨的转型升级。此计划旨在通过科技创新与产业升级的双重引擎，加速我国经济的结构优化与高质量发展，为国家的长远繁荣奠定坚实基础。"
 CHL_deepen_celestial_trade:0 "深入天朝贸易体系"
 CHL_deepen_celestial_trade_desc:0 "天朝贸易体系，作为一个浩瀚无垠的市场蓝海，深度融入其中将为我们的产品开辟前所未有的广阔销路，极大地拓宽市场边界。在此体系内，我们不仅能够实现产品的多元化推广与国际化布局，还能促进与其他国家企业的深度合作，构建起优势互补、协同发展的产业链格局。"
 CHL_infrastructure_investment:0 "加大基建投资"
 CHL_infrastructure_investment_desc:0 "\"要致富，先修路\"，加大对基础设施建设的投入，完善交通网络、提升公共设施水平，是我们实现经济快速复苏、迈向繁荣发展的必由之路。"
 CHL_build_modern_factories:0 "修建新式工厂"
 CHL_build_modern_factories_desc:0 "庚午钱荒后，我们的工厂设施的技术革新便陷入了停滞之中，未能跟上时代的步伐进行必要的更新与升级。然而，为了支撑我们未来的宏伟蓝图与长远规划，对工厂设施的现代化改造与升级已成为当务之急，这笔投资是不可或缺、至关重要的。"
 CHL_secure_employment:0 "保障就业基础"
 CHL_secure_employment_desc:0 "社会上的无业群体长期以来一直是社会稳定的一个潜在挑战因素。为了积极应对这一挑战并促进社会的和谐稳定，引导他们融入工作体系，特别是通过提供就业机会将他们吸纳进工厂等生产领域，无疑是一个既切实可行又富有成效的选择。"
 CHL_end_gengwu_crisis:0 "走出庚午钱荒"
 CHL_end_gengwu_crisis_desc:0 "历经数年的不懈努力，通过一系列深远而有效的经济改革以及政府精准有力的干预措施，庚午年间那场波及甚广的钱荒危机已逐渐消散，仅余下一些微不足道的余波在时间的长河中渐行渐远。"
 CHL_first_stage_focus:0 "南道山第一阶段"
 CHL_first_stage_expanded_production:0 "扩大生产规模"
 CHL_first_stage_expanded_production_desc:0 "扩大产能以满足增长的市场需求，生活消费品需求降低3%。"
 CHL_first_stage_bank_reserves:0 "加强银行储备"
 CHL_first_stage_bank_reserves_desc:0 "强化银行储备体系，吸取挤兑风潮的教训，筑牢抵御经济冲击的防线；生活消费品需求降低5%。"
 CHL_first_stage_economic_distance:0 "保持一定距离"
 CHL_first_stage_economic_distance_desc:0 "保持一定距离，降低对天朝贸易体系的依附；生活消费品需求提高5%。"
 CHL_first_stage_ming_investment:0 "吸引大明投资"
 CHL_first_stage_ming_investment_desc:0 "放宽大明投资准入，拓宽融资渠道并深化合作；生活消费品需求提高5%。"
 CHL_first_stage_ming_bank_guarantee:0 "大明银行担保"
 CHL_first_stage_ming_bank_guarantee_desc:0 "依托大明银行担保支持国家建设与产业升级；生活消费品需求提高10%。"
 CHL_first_stage_celestial_trade:0 "深入天朝贸易体系"
 CHL_first_stage_celestial_trade_desc:0 "深入天朝贸易体系以拓宽产品销路、促进产业合作；生活消费品需求提高5%。"
 CHL_first_stage_daoshan_cooperation:0 "道山体系贸易合作"
 CHL_first_stage_ming_distance:0 "南道山保持距离"
 CHL_first_stage_industry_transfer_bonus:0 "大明工业技术转让"
 CHL_first_stage_technology_cost_tt:0 "首都由我国拥有并控制，且至少拥有两座完好的民用工厂。"
 CHL_first_stage_infrastructure_cap_tt:0 "基础设施最多提升至5级；已满级的地区不再增加。"
