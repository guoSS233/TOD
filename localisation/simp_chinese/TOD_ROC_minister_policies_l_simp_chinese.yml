l_simp_chinese:
 ROC_ma_policy_agriculture_collectivized:0 "集体化经营政策"
 ROC_ma_policy_agriculture_collectivized_desc:0 "统一统筹农业经营，基础设施建设速度提高6%，消费品工厂系数提高1%。"
 ROC_ma_policy_agriculture_household:0 "包产到户政策"
 ROC_ma_policy_agriculture_household_desc:0 "按户承包并核算产出，消费品工厂系数降低2%，基础设施建设速度降低2%。"
 ROC_ma_policy_cooperative_procurement:0 "合作采购政策"
 ROC_ma_policy_cooperative_procurement_desc:0 "由合作组织协调城乡采购，消费品工厂系数降低1%，贸易关系修正提高5%。"
 ROC_ma_policy_market_distribution:0 "市场流通政策"
 ROC_ma_policy_market_distribution_desc:0 "扩大城乡商品流通，民用工厂建设速度提高3%，贸易关系修正提高10%。"
 ROC_ma_policy_private_management:0 "民营经营政策"
 ROC_ma_policy_private_management_desc:0 "由民营企业承担更多经营活动，民用工厂建设速度提高5%。"
 ROC_ma_policy_public_holding:0 "公共控股政策"
 ROC_ma_policy_public_holding_desc:0 "由公共资本保持重点产业控制权，工厂产出提高4%。"
 ROC_ma_adopt_agriculture_collectivized_tt:0 "采纳集体化经营：基础设施建设速度+6%、消费品工厂系数+1%；撤销包产到户政策及其持续效果。"
 ROC_ma_adopt_agriculture_household_tt:0 "采纳包产到户：消费品工厂系数−2%、基础设施建设速度−2%；撤销集体化经营政策及其持续效果。"
 ROC_ma_adopt_cooperative_procurement_tt:0 "采纳合作采购：消费品工厂系数−1%、贸易关系修正+5%；撤销市场流通政策及其持续效果。"
 ROC_ma_adopt_market_distribution_tt:0 "采纳市场流通：民用工厂建设速度+3%、贸易关系修正+10%；撤销合作采购政策及其持续效果。"
 ROC_ma_adopt_private_management_tt:0 "采纳民营经营：民用工厂建设速度+5%；撤销公共控股政策及其持续效果。"
 ROC_ma_adopt_public_holding_tt:0 "采纳公共控股：工厂产出+4%；撤销民营经营政策及其持续效果。"
