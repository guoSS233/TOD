### 国策描述 ###
SRC_wuzhuangqilai:0"工人们武装起来"
SRC_wuzhuangqilai_desc:0"过去，朝廷对我们施行白色恐怖，现在，庞大的大明帝国已然倒塌。我们劳动者现在应当拿起武器，夺取属于我们 自己的权力，一切权力归于劳动者！"
SRC_shouwohuongzhang:0"手握红章"
SRC_shouwohuongzhang_desc:0"在我们夺取权力以后，我们要接管朝廷所掌控的工厂、军队等暴力机关，建立属于我们劳动者自己的暴力机关。"
SRC_liaodongteweichengli:0"成立辽东特委"
SRC_liaodongteweichengli_desc:0"为了应对目前的形势，我们应当成立一个特别行动委员会，用于组织工人革命等革命事务。"
SRC_chenglizhongguogongnonghongjun:0"成立工农红军"
SRC_chenglizhongguogongnonghongjun_desc:0"为了应对目前的形势，我们应当成立一个特别行动委员会，用于组织工人革命等革命事务。"
SRC_dongyuangongrenminbing:0"动员工人民兵"
SRC_dongyuangongrenminbing_desc:0"一部分工人自发的拿起武器，建立工人民兵，开始与朝廷的军队对峙。而我们应当将他们动员起来，促使他们更好地参与革命。"
SRC_gongnonggemingjunshiweiyuanhui:0"工农红军革命军事委员会"
SRC_gongnonggemingjunshiweiyuanhui_desc:0"我们的武装组织建立起来了，但是以目前形势来看，建立一支正规军对于我们打倒朝廷很有必要。而掌握正规军的关键，就在于建立一个军事委员会，以坐出各种各样的决策。"
SRC_zhengbiantouchengbudui:0"整编投诚部队"
SRC_zhengbiantouchengbudui_desc:0"在蓝天蔚等同志的努力下，一部分朝廷的军队向我们投诚，我们应当对他们进行整编，争取让他们成为我们革命的帮手。"
SRC_shiwanjingqizhanyanluo:0"旌旗十万斩阎罗"
SRC_shiwanjingqizhanyanluo_desc:0"如今面临围剿我该写些什么？身经百战才创立了这番革命事业，是多么的不容易。这次我要到阴间去召集已经牺牲过的同志，带领十万英灵击败反动派！"
SRC_dongbeilinshigemingzhengfu:0"东北临时革命政府"
SRC_dongbeilinshigemingzhengfu_desc:0"东北，现在是我们的囊中之物，我们应当建设它，把它作为我们击败朝廷的根据地。"
SRC_linshijunguanweiyuanhui:0"临时军管委员会"
SRC_linshijunguanweiyuanhui_desc:0"在目前的革命形势下，我们需要工人们恢复生产，为我们的革命生产武器、建设根据地等，而军事管制委员会正是一个恢复生产的好手段，它可以打击反动派对根据地的破坏，也可以建立新的革命秩序。"
SRC_junshiyouxian:0"军事优先"
SRC_junshiyouxian_desc:0"目前困扰我们最大的问题，还是军事问题。一支完备的无产阶级的军队对打倒朝廷，建立无产阶级专政还是很有必要的。"
SRC_zujiangongchangweiyuanhui:0"组建工厂委员会"
SRC_zujiangongchangweiyuanhui_desc:0"在我们起义以后，工厂就是成为工人阶级自己的了。为了管理工厂，我们应当像布尔塞维克那样建立工厂委员会。"
SRC_huifugongchangshengchan:0"恢复工厂生产"
SRC_huifugongchangshengchan_desc:0"我们不但善于打烂一个旧世界，还善于建立一个新世界。在夺厂运动以后，我们应该组织并恢复生产，为我们的革命提供武器保障。"
SRC_zhengfuzhengguihua:0"建立各地人民委员会"
SRC_zhengfuzhengguihua_desc:0"目前我们的行政单位是散漫的、杂乱无章的，我们应当建立各地人民委员会，便于我们打好我们自身的群众基础。"
SRC_tongchangonghuizhongyangdida:0"中央委员会的回归"
SRC_tongchangonghuizhongyangdida_desc:0"在白色恐怖期间，同产工会的中央委员会四散而逃，只有少部分人留了下来。而如今革命形势大好，我们应当重新召回这些同志，建立新的中央委员会。"

SRC_no_longer_a_slave:0 "起来，不愿做奴隶的人们"
SRC_no_longer_a_slave_desc:0 "在明廷白色恐怖的笼罩之下，无产阶级曾遭受着朝廷官僚与资本家的双重压迫。现在，庞大的明帝国正在崩塌，我们劳动者必须抓住机会，拿起武器，夺取属于我们自己的生存权利，起来，不愿做奴隶的人们！"
SRC_capture_key_points:0 "占领关键点"
SRC_capture_key_points_desc:0 "反动派被我们的起义打了一个措手不及，现在，我们必须趁他们未能从混乱中重整旗鼓的时机夺取各关键目标：衙门、兵工厂、电报局……控制这些地方，我们就能防止反动派从我们的背后重新组织起来。"
SRC_Liaodong_special_committee:0 "成立辽东特委"
SRC_Liaodong_special_committee_desc:0 "烈火已经燎原，同产工会必须牢牢把握住革命的方向舵，我们应当立即成立一个特别行动委员会，作为辽东起义的指挥中枢。"
SRC_workers_pickets:0 "动员工人纠察队"
SRC_workers_pickets_desc:0 "工人纠察队原本是我们为了保卫已经加入革命队伍的工厂设施，并肃清各厂内潜藏的反革命分子组织的工人民兵组织，但由于革命进程远超预期，我们必须紧急动员他们加入革命战争的前沿战斗序列，确保我们有足够的兵力推进这场伟大的革命。"
SRC_baoweigongrenzhengquan_categories:0 "保卫工人政权"
SRC_baoweigongrenzhengquan:0 "收集武器"
SRC_promote_military_officers:0 "提拔革命将领"
SRC_promote_military_officers_desc:0 "在辽东大起义的激战之中，一些起义部队的指挥员展现了格外亮眼的军事才能，我们应当把他们提拔为常任将领，更好地让他们的才能为革命发光发热。"
SRC_exchange_combat_experience:0 "交流战斗经验"
SRC_exchange_combat_experience_desc:0 "经过一段时间的战斗，我们各条战线上的起义部队各自总结了一些宝贵的实际作战经验，为了让这些经验能够更好地被运用于革命战争之中，我们决定抽调各部队的指战员与战士代表来一场别开生面的经验交流大会，让大家充分地互相学习交流一番。"
SRC_publicity_campaigne_outcome:0 "敌后宣传成果"
SRC_publicity_campaigne_outcome_desc:0 "一直以来，我们坚持在关东司军队中开展敌后革命宣传工作的努力终于得到了回报，一部分原本忠于明廷的军队决定响应我们的起义号召，加入革命行列，现在我们的革命力量更加壮大了。"
SRC_toucheng:0 "投诚部队"
SRC_look_forward_to_the_future:0 "向红军的未来眺望"
SRC_look_forward_to_the_future_desc:0 "随着革命战争的进行，我们的起义部队也逐渐有了正规化的雏形，在革命胜利以后，我们将会拥有一支属于人民的正规军队，为了那一天的到来，我们现在就应该开始准备工作。"
SRC_strengthen_the_system:0 "巩固临时行政体系"
SRC_strengthen_the_system_desc:0 "解放整个东北的目标现在已经近在咫尺，在那之后，我们的革命将以东北为根据地，迈向全中国，为了这一目标的成功，我们需要进一步发展辽东特委领导下的临时行政体系，将我们的政权从辽东扩展到整个东北。"
SRC_military_management:0 "建立军管委员会"
SRC_military_management_desc:0 "在目前的革命形势下，我们需要根据地工人尽快恢复生产，为我们的革命战争生产武器和其他必要物资，为了让根据地的生产恢复与物资调配工作更好地迎合战争需要，我们将建立一个军管委员会直接管理根据地的经济工作。"
SRC_weapons_first:0 "优先加强军备生产"
SRC_weapons_first_desc:0 "目前困扰我们最大的问题，还是军备供应不足。如果革命没有武装，那又怎么进行武装的革命呢？在军管委员会的敦促下，我们将优先组织力量，尽全力加强根据地内军工厂的生产能力。"
SRC_weapons_first_xiaoguo:0 "撕裂的社会： \n生产效率上限: §G+5.0%§! \n生产效率增长: §G+5.0%§! \n"
SRC_work_committee:0 "建立工厂委员会"
SRC_work_committee_desc:0 "如今，在起义军的红旗之下，工厂已经从过去的剥削工具变成了我们无产阶级自己的生产工具。为了更好地管理工厂，恢复生产秩序，我们应当像布尔塞维克那样建立工厂委员会来管理厂内事务。"
SRC_work_committee_xiaoguo:0 "撕裂的社会： \n工厂产出: §G+10.0%§! \n"
SRC_tno:0 "新秩序"
SRC_tno_desc:0 "我们不但应当砸烂一个旧世界，还应当努力建立一个新世界。在夺取工厂控制权并建立起新的工厂委员会以后，我们应该尽快恢复生产生活秩序，让工人群众看到新世界的曙光。"
SRC_tno_xiaoguo:0 "撕裂的社会： \n稳定度: §G+15.0%§! \n"
SRC_prepare_government:0 "筹备东北革命政府"
SRC_prepare_government_desc:0 "由于革命战争的紧迫性，目前我们根据地的行政体系充斥着杂乱无章的随意搭建，这严重影响了我们将革命继续推向高潮的步伐。现在，东北的战火已经接近尾声，是时候在同产工会的领导下，对全东北的行政体系进行统一整顿，并着手筹备一个稳定而高效的新东北革命政府了。"
SRC_comrades_return:0 "同产工会中央回归"
SRC_comrades_return_desc:0 "在白色恐怖期间，同产工会的中央委员会不得不分散转移，只有少部分成员留在东北继续斗争。如今革命形势已然天翻地覆，是时候重新召回离开的同志，恢复同产工会中央的活动，并且宣布全新的东北革命政府的成立了。"
SRC_dongbeigemingdahuizhaokai:0 "东北革命大会召开"
SRC_dongbeigemingdahuizhaokai_desc:0 "如今，我们已经夺下了东北，应当立即召开代表大会确立革命政府的领导人。"
SRC_renfuchenzhuxi:0 "任辅臣主席"
SRC_renfuchenzhuxi_desc:0 "任辅臣同志是俄国内战中红军华工营的领袖，拥有丰富的革命经验。他作为革命政府的领导人再合适不过了。"
SRC_zhongyangjihuaweiyuanhui:0 "中央计划委员会"
SRC_zhongyangjihuaweiyuanhui_desc:0 "根据党代会的最终决议，我们决定在东北革命根据地创立一个以劳动者为核心的经济体制。为此，我们将通过组建中央计划经济委员会，精心构建一套自中央至地方全面覆盖的计划经济体系。该体系旨在确保生产与各类资源得到科学、高效的统一调配，以充分适应未来革命工作的需求，并为同产主义社会的建设工作奠定基础。"
SRC_zhongyangjihuaweiyuanhui_xiaoguo:0 "计划生产 \n工厂产出: §G+5.0%§! \n"
SRC_gongyeguoyouhua:0 "工厂公有化"
SRC_gongyeguoyouhua_desc:0 "现在的东北，是人民的东北，是劳动者的东北，而掌握工业，对打倒朝廷余党，对我们夺取全国胜利更是一个重要的基石。"
SRC_gongyeguoyouhua_xiaoguo:0 "计划生产 \n建造速度: §G+10.0%§! \n"
SRC_nongyejitihua:0 "农业集体化"
SRC_nongyejitihua_desc:0 "有了之前农民运动打倒农村剥削阶级的基础，我们解决农民问题有了不少的便利，让农民协会开展对土地的公有化政策，是彻底打倒农村中的私有制的重要保障。"
SRC_nongyejitihua_xiaoguo:0 "计划生产 \n生活消费品: §G-10.0%§! \n"
SRC_yiwujihua:0 "一五计划"
SRC_yiwujihua_desc:0 "在党的代表大会上，经过慎重表决，由计划经济委员会精心筹备的第一个五年计划顺利获得批准。该宏伟蓝图旨在依托东北地区既有的十数个大型工业集群作为发展引擎，通过精心规划的170个大中型建设项目，奠定我国迈向同产主义工业化道路的初步基石。\n计划中明确提出，将积极推动部分集体所有制农业生产合作社的发展，以此作为对农业和手工业进行社会主义改造的稳固基石。同时，我们也致力于将资本主义工商业逐步引导至各种形式的国家资本主义轨道上，为私营工商业的社会主义改造奠定坚实基础。"
SRC_jianchilingdaoquan:0 "坚持革命领导权"
SRC_jianchilingdaoquan_desc:0 "“一切权力归于工人议会!”是在俄国革命中一句响亮的口号，这句口号在后来的德国革命也出现过，它代表着同产主义的革命事业，要掌握在革命者手里。面对当前纷乱复杂的革命形势，我们唯有坚定不移地坚持党的领导，方能确保同产主义革命事业沿着正确的道路稳步前行，最终实现其宏伟目标！"
SRC_zhengfengyundong:0 "整风运动"
SRC_zhengfengyundong_desc:0 "无论是在俄国同产工会当中，还是在德国同产工会当中，宗派主义与自由主义都是一个不可避免的话题，反对这些错误的思，建立正确的革命思想，对我们的革命来说是个十分重要的因素。因此，我们应当开展整风运动，整顿这写错误的思想。"
SRC_gongxieshidaxue:0 "工协是大学"
SRC_gongxieshidaxue_desc:0 "工人协会，是工人斗争的重要保障，在这里，可以学到朝廷的大学学不到的东西。在朝廷的大学里，青年们看不到工人们如果工作、如何斗争。因此，派遣青年们去工协学习，是我们培养革命青年的好场所。"
SRC_gongxieshidaxue_xiaoguo:0 "党的领导 \n政治点数: §G+15.0%§! \n"
SRC_qunzhong:0 "从群众中来到群众中去"
SRC_qunzhong_desc:0 "“从群众中来，到群众中去”，这是我们党一贯坚持的群众路线，意味着我们要从人民群众的实际生活中汲取智慧和力量，再将这些经验和成果返回到群众中去。作为人民群众的先锋队，我们将通过切实行动为他们解决实际问题，带领群众迎来真正的解放。"
SRC_dongbeirenmindaxue:0 "东北人民大学"
SRC_dongbeirenmindaxue_desc:0 "随着我们无产阶级政权建设的不断推进与日益成熟，构建与之相匹配的人才培养体系显得尤为重要且迫切。我们不能再容忍资产阶级学者长期占据学术殿堂的主导地位，现在是时候着手创立真正属于无产阶级、践行同产主义理念的大学了。"
SRC_dongbeigeminggezhiyuan:0 "东北革命格致院"
SRC_dongbeigeminggezhiyuan_desc:0 "格物致知出自宋代学者朱熹，自后明政权开国以来便取其中“格致”二字设立格致院，用以开展各类学术研究工作。但学术殿堂不应是官僚阶层或反动政府独享的禁地，而是应当成为启迪民智、探索真理的公共平台，我们也应该通过设立革命政权的格致院来争夺学术主导权。"
SRC_jianjuefanduigerenchongbai:0 "坚决反对个人崇拜"
SRC_jianjuefanduigerenchongbai_desc:0 "在革命工作的深入推进过程中，部分干部与党员在宣传策略上偏离了正确轨道，显现出了“个人崇拜”的不良倾向。他们试图将革命队伍的领导人塑造为神圣且完美的形象，以此来吸引并激发底层民众的崇拜情感，进而扩大革命队伍的影响力，增强党对于革命事业的领导。然而，在最近召开的党代会上，领导层对此类行为给予了严厉批评，明确指出这不仅是对领导人的过度美化，更是严重脱离了人民群众，背离了无产阶级民主的基本原则，是对革命精神的扭曲与误解。"
SRC_xinwenhuayundong:0 "同产主义新文化运动"
SRC_xinwenhuayundong_desc:0 "宣传和教育工作是党连接民众、传递主张与理论的重要桥梁。尽管我们已经通过武力革命，成功打破了束缚广大被剥削者的政治枷锁，但遗憾的是，封建主义和资本主义的余毒仍然深深植根于许多劳动者的精神世界之中。以同产主义的新文化取代这些反动的旧文化，无疑是一场持久而艰巨的战役。然而作为先锋党，我们有责任引领这一变革，首先便需通过一场轰轰烈烈的新文化运动，鲜明地亮出我们的立场与态度，为彻底清除旧文化的阴霾而奋力前行。"
SRC_hongxingzhaoyaodongfang:0 "红星照耀东方"
SRC_hongxingzhaoyaodongfang_desc:0 "我们的政党犹如一颗璀璨夺目的红星，正冉冉升起于天际，它凝聚着先锋队的凛然勇气与大无畏的牺牲精神，誓将引领万千民众挣脱束缚的锁链，迈向自由的彼岸，实现真正而彻底的解放。展望未来，一个赤旗飘扬、光明普照的世界正向我们大步走来，而那颗熠熠生辉的红星，已然照亮了东方的天际，预示着一个新时代的到来！"
SRC_lidazhaozhuxi:0 "李大钊主席"
SRC_lidazhaozhuxi_desc:0 "李大钊同志长期致力于我党的党务工作，以其卓越的领导力和坚定的信念，屡次引领我党安然度过重重危机与挑战。他不仅是党的中流砥柱，更是我们实现同产主义革命伟大胜利的坚强领航者，担任主席实至名归！"
SRC_dongbeigaoxiaozizhihui:0 "东北高校自治"
SRC_dongbeigaoxiaozizhihui_desc:0 "在此前的漫长革命岁月中，我党的许多宣传工作都与高校中的活动密不可分。正是借助了高校内庞大而活跃的自治组织，我党得以不断吸纳充满朝气与理想的新鲜血液。一代又一代满怀革命激情的青年学子，将他们宝贵的青春、满腔的心血乃至宝贵的生命，毫无保留地奉献给了伟大的革命事业。\n这种优秀的革命传统应该在我们的高校改革中进一步得到实践，让广大革命青年在更加自由、开放的环境中，不仅能够充分展现个人才华与创造力，更能深刻理解并践行党的理念与宗旨！"
SRC_dongbeigezhiyuanweiyuanhui:0 "东北格致院委员会"
SRC_dongbeigezhiyuanweiyuanhui_desc:0 "旧有的学术科研体系深受官僚主义与学阀垄断之困，其审核标准被少数人所把控，严重剥夺了广大基层科研人员的发言权和学术参与机会。这一现状，在新兴的革命政权之下，显然是无法容忍的弊端。为此，我们决心成立一个崭新的东北格致院委员会，旨在以无产阶级领导下的学术民主新体制，彻底颠覆旧有的科研官僚体制，从而构建出一个充满生机与活力的革命性科研新体系。"
SRC_xinwenhuasichao:0 "新文化思潮"
SRC_xinwenhuasichao_desc:0 "移风易俗乃是一项持久而深远的变革，无产阶级新文化的兴起并取代旧有文化的过程更是如此，它需要时间的积淀与不懈的努力。为此，我们将采取包括宣传、教育在内的多种手段，培养构建新文化的思潮，致力于将无产阶级新文化的精髓深深植根于民众的心田，使之真正成为引领社会进步的精神力量。"
SRC_jicengminzhu:0 "建立基层工农民主机制"
SRC_jicengminzhu_desc:0 "新生革命政权与旧有反动政权之间最为本质的区别之一，体现在无产阶级民主的构建与实施之上。我们致力于在工厂、农场、军队乃至城市与乡村的各个角落，广泛建立基层民主制度，确保广大劳动者能够切实参与到民主管理的实践之中，从而真正实现无产阶级民主生活的广泛参与和深入发展。"
SRC_gemingweiyuanhui:0 "革命委员会"
SRC_gemingweiyuanhui_desc:0 "中央革命委员会，作为革命政权的核心领导机构，其构成汇聚了同产工会与各大左翼革命政党的精英力量。该委员会的委员及候补委员，均经由各级民主选举机构严格遴选而产生，确保了其组成既广泛代表各方革命力量，又深植于民主程序之中。"
SRC_renmindaibiaodahui:0 "赋权人民代表大会"
SRC_renmindaibiaodahui_desc:0 "全国人民代表大会，作为革命政权的至高无上的权力殿堂，不仅是国家意志的集大成者，更是广大人民群众行使其民主权利的神圣舞台。与反动政权下徒有其表的咨议局截然不同，我们新生的人民代表大会将名副其实地赋予人民以至高无上的权力，确保每一个声音都能在国家治理中发挥实质性作用。"
SRC_zhengzhidaminzhu:0 "政治大民主"
SRC_zhengzhidaminzhu_desc:0 "政治民主不仅仅是口号上的响亮，更是行动上的落实，让民众的决策真正指引国家前行的道路。在“政治大民主”原则的引领下，人民不再是旁观者，而是社会、政府等各个决策环节的参与者。用监督维护公正，用智慧贡献国家发展。从基层社区的自治到国家政策的制定，努力做到把民主推向全过程。"
SRC_qunzhongzhijiejiandu:0 "群众直接监督"
SRC_qunzhongzhijiejiandu_desc:0 "群众直接监督，是确保权力始终为人民所用的重要保障。它让每一个普通民众都能成为监督的主体，用自己的眼睛去审视权力的运行，用自己的声音去揭露问题的存在。民众的直接监督让权力在阳光下运行，真正做到人民民主专政。"
SRC_qunzhongzhijiejiandu_xiaoguo:0 "人民民主 \n战争支持度: §G+10.0%§! \n工业企业花费: §G-50.0%§! \n"
SRC_guojiajingjiweiyuanhui:0 "国家经济委员会"
SRC_guojiajingjiweiyuanhui_desc:0 "在经济建设的持续推进过程中，部分经济管理部门出现了各自为政、资源分配不均、产业发展失衡等问题，严重影响了国家经济的整体发展效率与质量。为解决这些问题，国家经济委员会应运而生。它将打破部门与地区之间的壁垒，整合全国经济力量，协调各产业发展。\n通过科学的规划与高效的执行，国家经济委员会将推动我们的国家的生产力进一步解放，惠及更多人民。"
SRC_guanxizaipingheng:0 "会社、工协关系再平衡"
SRC_guanxizaipingheng_desc:0 "政治会社和工人协会之间的关系问题，一直以来就为各个革命政权所争论不休。对于我们而言，维护这两者间的微妙平衡至关重要，旨在确保生产任务的高效执行与工人合法权益的充分保障能够和谐共存、相互促进。"
SRC_guanxizaipingheng_xiaoguo:0 "经委会 \n生产效率增长: §G+10.0%§! \n"
SRC_nongyehezuohua:0 "农业合作化"
SRC_nongyehezuohua_desc:0 "在农业革命中，农业合作化是关键一步。它旨在将分散的个体农业经济整合为集约化的合作经济模式，通过互助合作提升农业生产效率与农民生活水平。在这一过程中，分散的个体经济将被逐步整合为集体经济，进而实现农业生产的社会化。"
SRC_nongyehezuohua_xiaoguo:0 "经委会 \n生活消费品: §G-20.0%§! \n"
SRC_zhaokaijingweidahui:0 "召开经委大会"
SRC_zhaokaijingweidahui_desc:0 "随着人民政权的稳固，各地的经济统筹建设已然提上日程。在通产工会中央和人民政府的组织下，第一届经济委员会大会顺利开幕。各地区经济专家和代表齐聚一堂，为新生的人民政权经济发展建言献策，会议将进一步决定国家经济发展的未来。"
SRC_zhaokaijingweidahui_xiaoguo:0 "经委会 \n工厂产出: §G+10.0%§! \n"
SRC_chiqizhiyinweilai:0 "赤旗指引未来"
SRC_chiqizhiyinweilai_desc:0 "人道的警钟响了！自由的曙光出现了！试看将来的环球，必是赤旗的天下。——《同产主义的胜利》李大钊。"
SRC_chenduxiuzhuxi:0 "陈独秀主席"
SRC_chenduxiuzhuxi_desc:0 "陈独秀主席以其深厚的学识，将引领革命政府走向一条充满挑战与希望的革命之路。早在革命发展时期，陈独秀主席便注重培养具有革命精神与创新能力的年轻一代，为同产主义革命的长远发展奠定坚实基础。他强调理论与实践的紧密结合，以较为温和的手段和广泛的统一战线来推动同产主义革命！"
SRC_xueshuwenhuageminghua:0 "学术、文化革命化"
SRC_xueshuwenhuageminghua_desc:0 "学术与文化的革命化是国家精神重塑的重要一环。我们将通过大鸣大放的方式彻底颠覆旧有的知识体系与价值观念，推广无产阶级文化，为国家的思想解放与科技进步奠定坚实基础。通过批判旧学、创立新学，培养具有革命精神与批判思维的新一代革命青年，为国家的文化建设注入新的活力。同时，加强与国际先进文化的交流与合作，吸收借鉴人类文明的优秀成果，推动革命文化的繁荣发展。"
SRC_xueshuwenhuageminghua_xiaoguo:0 "革命文化 \n科研速度: §G+10.0%§! \n"
SRC_dongbeilaodongdaxue:0 "东北劳动大学"
SRC_dongbeilaodongdaxue_desc:0 "青年是国家的未来与希望。我们将通过加强青年教育、组织与动员，培养新一代革命接班人。通过开设青年政治学校、组织青年生产活动等方式，加强青年的思想政治教育与实践锻炼，培养他们的革命精神与奉献精神。同时，加强青年团等组织建设，推动青年运动的发展壮大，为国家的稳定与发展注入新的活力。"
SRC_dongbeilaodongdaxue_xiaoguo:0 "革命文化 \n生产效率上限: §G+10.0%§! \n科研速度: §G+10.0%§! \n"
SRC_qianghuaqingniangongzuo:0 "强化青年工作"
SRC_qianghuaqingniangongzuo_desc:0 "青年是国家的未来与希望。我们将通过加强青年教育、组织与动员，培养新一代革命接班人。通过开设青年政治学校、组织青年生产活动等方式，加强青年的思想政治教育与实践锻炼，培养他们的革命精神与奉献精神。同时，加强青年团等组织建设，推动青年运动的发展壮大，为国家的稳定与发展注入新的活力。"
SRC_qianghuaqingniangongzuo_xiaoguo:0 "革命文化 \n稳定度: §G+10.0%§! \n"
SRC_shehuizhuyijiebanren:0 "同产主义接班人"
SRC_shehuizhuyijiebanren_desc:0 "“同产主义接班人”培养计划是革命教育事业的重要组成部分。革命政府通过全面培养青少年的思想品质、道德品质与实践能力，确保他们成为坚定的同产主义事业继承者。通过开设革命教育课程、组织社会实践活动等方式，加强青少年的思想政治教育与实践锻炼。"
SRC_shehuizhuyijiebanren_xiaoguo:0 "革命文化 \n政治点数获取: §G+10.0%§! \n"
SRC_gemingtongyizhanxian:0 "革命统一战线"
SRC_gemingtongyizhanxian_desc:0 "革命统一战线是我们同产工会团结一切可以团结的力量、共同对抗国内外反动势力的重要战略。此国策旨在通过广泛的政治动员与组织工作，将各阶层、各民族、各党派的力量凝聚在一起，形成强大的革命合力。同时，加强与国际先进革命力量的交流与合作，共同推动世界革命事业的发展。通过革命统一战线的建立，国家将能够更加有效地应对国内外挑战与危机，为人民政权的长远发展创造有利条件。"
SRC_goujianfanditongmeng:0 "构建反帝同盟"
SRC_goujianfanditongmeng_desc:0 "帝制长久以来是压迫在诸夏人民身上沉重的大山，官僚、地主、财阀通过依附在专制皇帝身边对于人民进行了惨无人道的剥削与压迫，也激起了无数仁人志士的反抗。尽管反抗者中的许多人与我们的革命理想并不一致，但我们依然可以与之开展合作结成反帝大同盟，共同推翻千年帝制这座大山！"
SRC_goujianfanditongmeng_xiaoguo:0 "革命同盟 \n法案花费: §G-33.0%§! \n"
SRC_gaizaozichanjieji:0 "改造资产阶级"
SRC_gaizaozichanjieji_desc:0 "改造资产阶级是国家实现同产主义事业顺利推进的重要一环。革命政府通过和平手段引导资产阶级支持社会主义事业，减少社会阶层矛盾与冲突。通过逐步公私合营、加强合作化、推动资产阶级参与国家建设等方式，逐步改造资产阶级，最终实现社会向同产主义进行过渡。"
SRC_datongshijieguodu:0 "逐步向大同世界过度"
SRC_datongshijieguodu_desc:0 "向大同世界过渡是国家我们同产工会革命行动的最终目标。人民政府将通过渐进式改革与制度建设，逐步消除社会不平等与贫富差距，实现生产资料公有化。并通过加强社会保障体系建设、推动教育公平与医疗资源优化配置等方式，提高民众的生活水平。"
SRC_datongshijieguodu_xiaoguo:0 "革命同盟 \n每日顺从度: §G+0.1%§! \n"
SRC_guojiagaigeweiyuanhui:0 "国家改革委员会"
SRC_guojiagaigeweiyuanhui_desc:0 "国家改革委员会是国家推动各项改革措施制定与实施的重要机构。政府通过成立国家改革委员会来加强改革的组织领导与统筹协调。委员会将负责研究制定国家改革战略与规划、推动重点领域与关键环节改革、监督评估改革成效等工作。同时，加强与地方政府、国营企业、社会组织的联系与合作，共同推动改革的深入开展。"
SRC_shumaiqiye:0 "赎买企业"
SRC_shumaiqiye_desc:0 "赎买企业是经济向同产主义过渡的重要措施。通过赎买方式将私营企业转变为国营企业，人民政府将实现对经济的全面控制与管理。通过赎买企业，人民政府可以更加有效地整合社会资源、优化产业结构、推进生产资料公有化进程，为同产主义经济发展建设添砖加瓦。"
SRC_shumaiqiye_xiaoguo:0 "改革委 \n基础设施建造速度: §G+10.0%§! \n"
SRC_tudigaige:0 "土地改革"
SRC_tudigaige_desc:0 "土地改革是国家实现农民解放与农业发展、推动社会公平与正义的重要措施我们将彻底废除封建土地所有制，实现“耕者有其田”，激发农民的生产积极性与创造力。通过土地改革，国家可以更加有效地解决农民的土地问题、提高农业生产效率。同时，加强农村基层组织建设与民主政治建设，逐步推动农业合作化进程以助力农村社会发展。"
SRC_tudigaige_xiaoguo:0 "改革委 \n地区最大工业值: §G+10.0%§! \n"
SRC_tieguodundae:0 "“铁锅炖大鹅”"
SRC_tieguodundae_desc:0 "“铁锅炖大鹅”虽然听起来有些幽默与诙谐，但实则寓意着国家对民生产业的高度重视与坚定决心。我们将通过优化资源配置、提高生产效率等方式，加速各类民生物资的生产与更新换代。诸夏人民的餐桌上，必将人人都可以品尝到美味的铁锅炖大鹅！"
SRC_tieguodundae_xiaoguo:0 "改革委 \n民转军花费: §G-20.0%§! \n"
SRC_zhumenhuanxintian:0 "朱门再换新天"
SRC_zhumenhuanxintian_desc:0 "“旧时王谢堂前燕，飞入寻常百姓家。”彼时达官显贵才有资格出入的朱楼，如今却承认为工农群众集会休闲的场所，朱门换新天的背后，是无数革命烈士用鲜血与性命实现社会的全面变革与进步！"
SRC_zhonghuagongnonghongjun:0 "中华工农红军"
SRC_zhonghuagongnonghongjun_desc:0 "随着革命在关东地区胜利，革命时期的各类军事武装将被整合进中华工农红军进行统一指挥。当关东绥靖公署的阴影不再笼罩，红军将成为捍卫国家独立与人民解放的中流砥柱，以铁的纪律和坚定的信念，点燃革命的烽火。"
SRC_qianghuajunduisixiangjianshe:0 "强化军队思想建设"
SRC_qianghuajunduisixiangjianshe_desc:0 "相较于旧时代的军队，我们军队的鲜明特质在于，广大士兵并非仅仅为领取军饷而从戎，他们是怀抱着坚定的革命理想，真心实意地为这一崇高事业而战。在当前军队的建设与发展进程中，我们应矢志不渝地坚持“政治建军”的光荣传统，深化军队思想政治工作，确保每位战士内心都充盈着崇高的革命信念，紧密团结，向着共同的胜利目标奋勇前行。"
SRC_qianghuajunduisixiangjianshe_xiaoguo:0 "红军 \n核心领土攻击: §R-10.0%§! \n核心领土防御: §R-10.0%§! \n组织度: §G+10.0%§! \n"
SRC_lizugongrenjiuchadui:0 "立足工人纠察队"
SRC_lizugongrenjiuchadui_desc:0 "工人纠察队作为革命浪潮中的中流砥柱，其成员构成了当今军事力量的坚实基石，大量精锐力量由此脱胎换骨。他们的革命信念，在无数次战火洗礼中愈发坚定，见证了革命战争的严峻考验。基于此，我们誓将以工人纠察队所铸就的武装力量为核心支柱，着手构建一支英勇无畏的工农红军。"
SRC_lizugongrenjiuchadui_xiaoguo:0 "红军 \n组织度恢复: §G+10.0%§! \n"
SRC_shelizhengwei:0 "设立政委"
SRC_shelizhengwei_desc:0 "为确保军队的政治方向正确，我们决定建立政委制度。政委不仅是军队的思想政治导师，更是连接士兵与党的桥梁。他们的存在，将确保军队始终保持正确的政治方向，为革命事业保驾护航。"
SRC_shelizhengwei_xiaoguo:0 "红军 \n组织度: §G+10.0%§! \n"
SRC_fuquanshibingweiyuanhui:0 "赋权士兵委员会"
SRC_fuquanshibingweiyuanhui_desc:0 "士兵委员会是军队民主管理的重要体现。我们决定赋权士兵委员会，让士兵参与到军队管理中来，共同决策，共同战斗，激发军队的凝聚力和战斗力。"
SRC_fuquanshibingweiyuanhui_xiaoguo:0 "红军 \n陆军损耗: §G-10.0%§! \n"
SRC_qianghuajunshiminzhu:0 "强化军事民主"
SRC_qianghuajunshiminzhu_desc:0 "军事民主是革命军队的优良传统。我们将进一步强化这一制度，鼓励士兵发表意见，提出建议，确保军队决策的科学性和民主性。 "
SRC_qianghuajunshiminzhu_xiaoguo:0 "红军 \n主动性: §G+2.0%§! \n"
SRC_quelidangweizhi:0 "确立党委制"
SRC_quelidangweizhi_desc:0 "党委制是确保军队党的领导核心作用的关键。我们将确立党委在军队中的领导地位，确保党的路线、方针、政策在军队中得到贯彻执行。"
SRC_quelidangweizhi_xiaoguo:0 "红军 \n陆军防御: §G+10.0%§! \n"
SRC_zhibujianzailianshang:0 "支部建在连队上"
SRC_zhibujianzailianshang_desc:0 "将党支部建在连队上，是加强军队基层党建工作的有力举措。这将确保党的声音能够直达基层，激发士兵的革命热情，提高军队的战斗力。"
SRC_zhibujianzailianshang_xiaoguo:0 "红军 \n协同性: §G+10.0%§! \n"
SRC_guanbingyilvpingdeng:0 "官兵一律平等"
SRC_guanbingyilvpingdeng_desc:0 "我们坚持官兵平等的原则，打破旧军队的等级观念。无论是军官还是士兵，都将在革命旗帜下团结一致，共同为革命事业奋斗。"
SRC_guanbingyilvpingdeng_xiaoguo:0 "红军 \nHP: §G+10.0%§! \n"
SRC_gemingjunxinzuofeng:0 "革命军，新作风"
SRC_gemingjunxinzuofeng_desc:0 "革命军将以全新的作风展现在世人面前。他们纪律严明，英勇善战，同时秉持着为人民服务的宗旨，成为真正的人民子弟兵。"
SRC_gemingjunxinzuofeng_xiaoguo:0 "红军 \n地形惩罚: §G-10.0%§! \n"
SRC_yilaizhiyejunguan:0 "依赖职业军官"
SRC_yilaizhiyejunguan_desc:0 "我们认识到职业军官在军队建设中的重要性。他们将凭借专业的军事素养和丰富的战斗经验，为军队提供稳定的领导力量。"
SRC_yilaizhiyejunguan_xiaoguo:0 "红军 \n计划加成上限: §G+20.0%§! \n"
SRC_junshiyizhangzhi:0 "军事一长制"
SRC_junshiyizhangzhi_desc:0 "军事一长制将确保军队指挥系统的高效运作。在统一领导下，各级指挥官将迅速做出决策，确保军队在战斗中保持高度协同和战斗力。"
SRC_gemingjunguanruhui:0 "革命军官入会"
SRC_gemingjunguanruhui_desc:0 "我们鼓励革命军官加入同产工会。通过吸纳这些优秀的军事人才加入同产工会，我们可以更好的强化对军队影响和掌控，并推动革命思想在军官和士兵中深入传播。"
SRC_gemingjunguanruhui_xiaoguo:0 "红军 \n计划速度: §G+20.0%§! \n"
SRC_qianghuajunweilingdao:0 "强化军委领导"
SRC_qianghuajunweilingdao_desc:0 "强化军委的领导地位，是确保军队始终保持正确政治方向的关键。我们将加强军委对军队各项工作的指导和监督，确保军队始终保持高度集中统一。"
SRC_qianghuajunweilingdao_xiaoguo:0 "红军 \n计划上限: §G+20.0%§! \n"
SRC_quelijunxianzhi:0 "建立军衔制"
SRC_quelijunxianzhi_desc:0 "军衔制的建立将规范军队的等级制度，明确各级军官的职责和权限。这将有助于提高军队的正规化水平，增强军队的战斗力。"
SRC_quelijunxianzhi_xiaoguo:0 "红军 \n陆军突破: §G+10.0%§! \n"
SRC_wuzhuangliliangzhengguihua:0 "武装力量正规化"
SRC_wuzhuangliliangzhengguihua_desc:0 "我们将致力于武装力量的正规化建设。通过完善组织架构、加强训练和管理等措施，确保军队始终保持高度战备状态，随时准备应对各种挑战。"
SRC_wuzhuangliliangzhengguihua_xiaoguo:0 "红军 \n陆战夜战攻击: §G+10.0%§! \n"
SRC_jianligemingjunshixueyuan:0 "建立革命军事学院"
SRC_jianligemingjunshixueyuan_desc:0 "革命军事学院的建立将为军队培养高素质的人才。这里将成为孕育未来军事领袖的摇篮，为革命事业输送源源不断的智力和人才支持。"
SRC_junshililungexin:0 "军事理论革新"
SRC_junshililungexin_desc:0 "我们深知军事理论的重要性。因此，我们将致力于军事理论的革新和创新，确保军队始终走在时代前列，掌握先进的军事思想和战略战术。"
SRC_hongjunhouqinbu:0 "红军后勤部"
SRC_hongjunhouqinbu_desc:0 "红军后勤部是确保军队正常运转的重要保障。我们将加强后勤部的建设和管理，提高后勤保障能力，确保军队在战斗中能够得到充分的物资和人员支持。"
SRC_goujianbujiwangluo:0 "构建补给网络"
SRC_goujianbujiwangluo_desc:0 "构建完善的补给网络是确保军队在广阔战场上持续作战的关键。我们将加强补给线的建设和维护，确保军队在任何时候都能得到及时的物资补给。"
SRC_goujianbujiwangluo_xiaoguo:0 "革命军事理论建设——逐渐成形 \n补给范围: §G+20.0%§! \n"
SRC_wanshanshengchantixi:0 "完善生产体系"
SRC_wanshanshengchantixi_desc:0 "完善生产体系是提升军队自给自足能力的重要举措。我们将加强军需品和武器装备的生产和研发，确保军队在战斗中拥有足够的物资和装备支持。"
SRC_wanshanshengchantixi_xiaoguo:0 "革命军事理论建设——逐渐成形 \n步枪花费: §G-10.0%§! \n"
SRC_shengchanyanjiugexin:0 "生产研究革命"
SRC_shengchanyanjiugexin_desc:0 "我们将把生产研究与革命实践相结合。通过不断的实践和创新，探索适合革命战争需要的生产方式和武器装备，为革命事业提供坚实的物质基础。"
SRC_shengchanyanjiugexin_xiaoguo:0 "革命军事理论建设——逐渐成形 \n科研速度: §G+5.0%§! \n"
SRC_shiyanxinshibianzhi:0 "实验新式编制"
SRC_shiyanxinshibianzhi_desc:0 "为了应对不断变化的战争形势，我们将实验新式编制。通过调整军队的组织架构和人员配置，提高军队的灵活性和战斗力，确保军队始终保持高度协同和战斗力。"
SRC_shiyanxinshibianzhi_xiaoguo:0 "革命军事理论建设——逐渐成形 \n步兵编制所需陆军经验花费: §G-50.0%§! \n炮兵编制所需陆军经验花费: §G-50.0%§! \n中型坦克编制所需陆军经验花费: §G-50.0%§! \n"
SRC_kuodahuopaochanye:0 "扩大火炮产业链"
SRC_kuodahuopaochanye_desc:0 "火炮是战争中的重要武器。我们将扩大火炮产业链的建设和发展，提高火炮的生产能力和技术水平，确保军队在战斗中拥有足够的火炮支援。"
SRC_qianghuazhuangjiayanjiu:0 "强化装甲研究"
SRC_qianghuazhuangjiayanjiu_desc:0 "装甲部队是现代战争中的重要力量。我们将加强装甲车辆的研究和开发，提高装甲部队的作战能力和防护水平，为军队提供强大的地面火力支援。"
SRC_xiandaigemingjundui:0 "现代革命军队"
SRC_xiandaigemingjundui_desc:0 "我们的目标是建立一支近世化的革命军队。这支军队将拥有先进的武器装备、高素质的军事人才和完善的组织体系，成为捍卫革命成果和人民解放的坚强后盾。"
SRC_chengligemingkongjun:0 "成立革命空军"
SRC_chengligemingkongjun_desc:0 "在革命精神的指引下，成立革命空军旨在打造一支忠诚勇敢、装备精良的空中力量。人民空军将肩负起保卫国家领空、支援地面作战的重任，成为国家安全的坚强后盾。"
SRC_jieshoujichangyufeiji:0 "接收机场与飞机"
SRC_jieshoujichangyufeiji_desc:0 "接收东北地区明军留下的的机场与飞机是提升空军实力的关键步骤。这些设施与装备的加入，为我们的空军力量组建打下了坚实的基础，更为未来的空中战略部署提供了有力支撑。"
SRC_xinageminghangkongdui:0 "吸纳革命航空队"
SRC_xinageminghangkongdui_desc:0 "吸纳革命航空队将进一步壮大空军的规模与实力。这些英勇善战的飞行员与机组人员将为空军注入新的活力与战斗力，为保卫人民政府领空贡献力量。"
SRC_xinageminghangkongdui_xiaoguo:0 "红空军 \n夺取制空权任务效率: §G+10.0%§! \n"
SRC_hanweitiankong:0 "捍卫天空"
SRC_hanweitiankong_desc:0 "捍卫天空是空军的神圣使命。我们将加强空军的防空与制空能力，确保人民的领空不受反动势力的侵犯。"
SRC_hanweitiankong_xiaoguo:0 "红空军 \n拦截任务探测: §G+10.0%§! \n"
SRC_jianliliaoyanghangxiao:0 "建立辽阳航校"
SRC_jianliliaoyanghangxiao_desc:0 "辽阳航校的建立将为空军培养更多优秀的飞行员与航空人才。这里将传授先进的飞行技术、战术与理念，为人民空军的持续发展提供人才保障。"
SRC_chenglidongbeikongtiandaxue:0 "成立东北空天大学"
SRC_chenglidongbeikongtiandaxue_desc:0 "    除了辽阳航校这类专业学校外，我们将整合境内的各类空天人才，成立东北空天大学。从学术研发和生产革新等方面，以更加近世化的方式助力我们的空天事业发展。"
SRC_changkongaoxiang:0 "在长空翱翔"
SRC_changkongaoxiang_desc:0 "在长空翱翔是空军官兵的共同梦想。我们将通过一系列政策激发空军官兵的斗志与创造力，推动空军装备的不断更新与战术的不断革新。在未来的天空中，人民空军必将展翅高飞、翱翔万里。"
SRC_changkongaoxiang_xiaoguo:0 "红空军 \n空优: §G+10.0%§! \n"
SRC_chenglihonghaijun:0 "成立红海军"
SRC_chenglihonghaijun_desc:0 "在国家的蓝色疆域上，成立红海军标志着人民海军力量的正式崛起。我们将通过整合现有海军资源，以红色革命精神为指引，打造一支忠诚勇敢、装备精良的海上力量，捍卫革命成果与人民的海洋利益。"
SRC_jieshoujianting:0 "接受舰艇"
SRC_jieshoujianting_desc:0 "面对复杂的海洋环境，接受国内外援助的舰艇成为增强海军实力的关键一步。这些舰艇不仅提升了海军的作战能力，更为未来的海上战略部署奠定了坚实基础。"
SRC_gaibianbeiyangjianduishiguan:0 "改编北洋舰队士官"
SRC_gaibianbeiyangjianduishiguan_desc:0 "通过对北洋舰队士官进行思想改造工作，我们旨在挖掘并保留这批宝贵的人才资源。北洋海军中同样也有一些思想没有那么顽固的将领，他们对于我们的思想改造工作表现出了配合的态度。沈鸿烈、温树德等杰出将领的加入，为革命海军带来了成体系的培训方式与作战经验，有助于增强我们的海上力量。"
SRC_yinrudatonghuihaijunrencai:0 "引进大同会海军人才"
SRC_yinrudatonghuihaijunrencai_desc:0 "大同会以其深厚的海军背景，为我们提供了众多杰出人才。萨师俊、邓兆祥等将领的引进，不仅增强了海军的领导力量，更为海军近世化建设带来了宝贵经验。这些将领的加入，将极大提升海军的作战指挥能力。"
SRC_baozhengguojibujixian:0 "保证国际补给线"
SRC_baozhengguojibujixian_desc:0 "为确保革命军队的持续作战能力，我们将致力于维护国际补给线的安全与畅通。通过外交手段与军事威慑，我们将确保海上生命线不受威胁，以获得来自德国等革命伙伴的援助，为革命事业提供稳定的物资保障。"
SRC_baozhengguojibujixian_xiaoguo:0 "红海军 \n舰队护航效率: §G+10.0%§! \n"
SRC_chenglihaijunxuexiao:0 "成立海军学校"
SRC_chenglihaijunxuexiao_desc:0 "成立海军学校是培养未来海军精英的摇篮。这里将传授先进的海军战术、技术与理念，为国家输送源源不断的海军人才，为海军的长远发展奠定基础。"
SRC_shelihaijunyanjiusuo:0 "设立海军研究所"
SRC_shelihaijunyanjiusuo_desc:0 "海军研究所的设立标志着革命政府在海军科研领域的正式起步。这里将聚焦舰艇设计、武器研发、海洋探测等前沿领域，推动海军装备与技术的不断革新。"
SRC_qianghuajianchuanyanjiu:0 "强化舰艇研究"
SRC_qianghuajianchuanyanjiu_desc:0 "通过深化舰艇研究，我们致力于持续精进舰艇的性能与作战效能。从高效动力系统到尖端武器装备，乃至创新的航母甲板设计等每一处细节，都凝聚着工人与设计师们的匠心独运与精益求精。这一系列的努力，旨在为我国海军打造坚不可摧的海上堡垒，提供坚实而有力的物质支撑。"
SRC_kuojiandaliangangkou:0 "扩建大连港口"
SRC_kuojiandaliangangkou_desc:0 "大连港口的扩建将极大提升海军的作战与补给能力。新扩建的码头、仓库与设施将为舰艇提供更加便捷、高效的停泊与补给服务，为海军的远洋作战提供有力支持。"
SRC_haijunlilungexin:0 "海军理论革新"
SRC_haijunlilungexin_desc:0 "海军理论的革新是推动海军近世化的关键。我们将摒弃过时的战术与理念，引入先进的海军作战理念与国际海军战略，为海军的长远发展提供理论支撑与指导。"
SRC_fazhanhaijunrencai:0 "发展海军人才"
SRC_fazhanhaijunrencai_desc:0 "人才是海军发展的核心。我们将在通过优化人才选拔、培养与激励机制，吸引更多优秀人才投身海军事业。同时，加强与其他革命政权海军的交流与合作，提升海军人才的整体素质与国际视野。"
SRC_xianqichiselangchao:0 "掀起赤色浪潮"
SRC_xianqichiselangchao_desc:0 "以革命精神为旗帜，人民海军将凭借自身非凡的战斗力，与各种反动势力进行英勇斗争，致力于在全国乃至更广阔的范围内掀起解放的浪潮，推动红色力量的蓬勃发展，形成一股不可阻挡的赤潮。"
SRC_xianqichiselangchao_xiaoguo:0 "红海军 \n舰队协同性: §G+10.0%§! \n"
SRC_fangyantianxia:0 "放眼天下"
SRC_fangyantianxia_desc:0 "如今东北的局势已然基本稳定，是时候将我们的注意力转到国土的其他地方，帮助更多的百姓迎来解放！"
SRC_yudisanguojijiaqianghezuo:0 "与第三国际加强合作"
SRC_yudisanguojijiaqianghezuo_desc:0 "作为第三国际的坚定成员，我们深知国际革命友谊的珍贵与深远。长久以来，来自世界各地的革命同志在我们的革命征程中倾注了心血，作出了不可磨灭的贡献，这些历史记忆我们永远铭记于心。为了进一步加强与国际革命力量的紧密联系和深度合作，我们决心深化与第三国际政党的关系。通过共享战略资源、交流革命经验、协同军事行动，我们的革命政府将为他们提供坚实的支持和援助，助力全球的同产主义革命事业。"
SRC_lianluoguanneigemingzhe:0 "联络关内革命者"
SRC_lianluoguanneigemingzhe_desc:0 "在我们推动关东革命期间，关内也相继爆发了一系列革命活动。通过与他们建立联系，我们粉碎旧政权的进程将被大大加快。"
SRC_huishiruguan:0 "挥师入关"
SRC_huishiruguan_desc:0 "批判的武器不能代替武器的批判，我们将通过军事手段推翻占据北京城的反动政府，实现国家的统一和革命的胜利，带领关内人民迎来真正的解放。"
SRC_zhiyuandongyanggeming:0 "支援东洋革命"
SRC_zhiyuandongyanggeming_desc:0 "除了关内外，东洋的革命同志同样也亟需我们的帮助。通过提供物资、资金、人员等方面的援助，我们将大力推动东洋地区的革命进程。通过加强与东洋革命力量的联系和合作，共同反对帝国主义和封建主义的压迫。"
SRC_zhaokaitongyidahui:0 "召开统一大会"
SRC_zhaokaitongyidahui_desc:0 "随着全国的革命力量逐渐壮大、局势逐渐明朗之际，召开统一大会成为了必要之举。我们将邀请各路革命同志前往顺天召开大会，进而整合革命力量，明确革命目标，为未来的革命行动提供有力的组织和领导。"
SRC_gemingjinxindaodi:0 "革命进行到底"
SRC_gemingjinxindaodi_desc:0 "道不同不相为谋，我们革命者必须坚定信念，将革命进行到底。因为只有同产主义，才能百姓真正摆脱剥削与压迫，迎来自由与解放的曙光！"



