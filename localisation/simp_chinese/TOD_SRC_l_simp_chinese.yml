SRCevents.8.d:0 "会议的最后一天，会议进行了新一届同产工会中央委员会主席的选举。经过激烈的竞选和投票，会议最终选出了......"
SRCevents.8.a:0 "陈独秀胜选！"
SRCevents.8.b:0 "任辅臣胜选！"
