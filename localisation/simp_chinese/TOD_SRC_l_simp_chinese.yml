SRCevents.1.t:0 "辽西起义胜利"
SRCevents.1.d:0 "    早在前些时间，辽西省多个地区在辽东大起义的号召下，掀起了声势浩大的工人起义。长期以来，辽西地区的工人群众在经济压迫和社会不公的重压下，生活陷入困境。许多工厂和企业岌岌可危，工人们的生存状况令人揪心。然而，在这乌云压顶的时刻，一群坚定的工人领袖和革命者挺身而出，他们不畏强权，积极组织工人，利用一切机会传播共产主义思想，鼓舞工人群众奋起抗争。\n    起义如火如荼。工人们以雷霆万钧之势，迅速占领了辽西多个重要城镇。他们的行动犹如一把锋利的剑，直指反动政府的心脏，给其带来了前所未有的恐慌。起义军的英勇和决心，让反动势力措手不及，明廷不得不紧急调动辽西残余的军力进行镇压。\n    在同产工会组织的严密组织下，当地工人武装表现除了极强的作战意志。面对兵力孱弱的辽西守军。经过艰苦卓绝的斗争，起义军成功地占领了辽西省的大部分地区，给反动政府造成了巨大的恐慌。"
SRCevents.1.a:0 "草原沃野升红旗"
SRCevents.2.t:0 "辽西起义失败"
SRCevents.2.d:0 "    早在前些时间，辽西省多个地区在辽东大起义的号召下，掀起了声势浩大的工人起义。长期以来，辽西地区的工人群众在经济压迫和社会不公的重压下，生活陷入困境。许多工厂和企业岌岌可危，工人们的生存状况令人揪心。然而，在这乌云压顶的时刻，一群坚定的工人领袖和革命者挺身而出，他们不畏强权，积极组织工人，利用一切机会传播共产主义思想，鼓舞工人群众奋起抗争。\n    起义如火如荼。工人们以雷霆万钧之势，迅速占领了辽西多个重要城镇。他们的行动犹如一把锋利的剑，直指反动政府的心脏，给其带来了前所未有的恐慌。起义军的英勇和决心，让反动势力措手不及，他们不得不紧急调动辽西残余的军力进行镇压。\n    然而，尽管起义军展现出了惊人的勇气和决心，但由于此前辽西地区遭遇了明庭的大规模搜捕，同产工会在当地的组织体系受到严重打击。在缺乏组织的情况下，最终还是未能颠覆反动政权。反动政府凭借其强大的军事力量和残酷的手段，逐渐削弱了起义军的斗志。在激战过后，起义军不得不选择撤退，而辽西地区再次回到了反动政府的控制之下。"
SRCevents.2.a:0 "不气不馁，筹划再战！"
SRCevents.3.t:0 "革命大会召开"
SRCevents.3.d:0 "随着同产工会起义在东北的全面胜利，同产工会于辽阳召开了第一次全国革命代表大会。这是同产工会成立以来的第一次全国性的代表大会，参加会议的不仅有来自东北各地已夺取政权的同产工会的代表，及来自工、农、学、兵、知识分子等阶层的代表人士，还有全国其他地区的同产工会派出的代表参与，共计千余人。会议的主题是“总结起义经验，巩固革命成果，准备全国大革命”。\n会议的第一天，同产工会中央委员会主席李大钊首先代表中央委员会全体致开幕词，他高度评价了东北工人起义的意义和影响，认为这是同产主义在中国的一次伟大胜利，也是全世界工人运动的一个重要事件。他指出，东北工人起义的成功，是同产工会的正确领导、工人阶级的英勇斗争和广大群众的有力支持的成果，是同产主义理论与实践相结合的体现，是对反动旧势力的有力打击。他号容全体同产主义革命者，继续高举同产主义旗帜，巩固和建设东北解放区，发展壮大同产革命力量，并奋力争取全国革命的最终胜利。"
SRCevents.3.a:0 "旧秩序的帮凶们，我们将埋葬你们！"
SRCevents.4.t:0 "基层组织议题："
SRCevents.4.d:0 "李大钊的开幕讲话获得全场热烈掌声，与会代表的革命热情被充分激发。会议随即进入第一个重要议题：新生政权的基层组织结构问题。这关系到同产工会在东北地区工作的巩固与发展，引发了与会代表的热烈讨论，会上形成了三种主要方案。\n一、钱望潮提出的“先锋队政党领导”方案：\n该方案强调新生政权基层组织必须接受同级党委监督，由具备高度纪律性的同产工会干部负责基层政府工作。各级基层组织的干部均由上级统一任命与调配，并建立严格的监督考核制度，确保中央政令高效执行。支持者认为，只有通过强有力的集中领导和组织纪律，才能保证新生政权不偏离革命总目标。\n二、何孟雄提出的“赋权基层民主”方案：\n该方案主张新生政权基层组织的核心力量应直接来源于工农群众，由同产工会发动并组织劳动者参与管理。建议赋予基层团体充分的自主权和民主决策空间，鼓励工农根据实际情况创新工作方法，重视并采纳他们的实践经验与合理建议。支持者相信，这种方式能有效激发工农建设新政权的主动性，为新生政权奠定坚实的群众基础。\n三、于方舟提出的“三三制”基层制度方案：\n该方案基于当前革命阶段的特点，主张新生政权基层组织应广泛联合社会各阶层进步力量。具体提议：各解放区基层机构成员构成中，同产工会会员占三成，其他革命党派或无党派进步人士占三成，工农群众代表占三成。实行集体领导、民主决策，干部通过定期选举产生，促进干部与群众结合。支持者认为，这种包容各方的制度有利于化解革命进程中的内部矛盾，维护社会稳定，并通过权力制衡防止政策偏离初衷。"
SRCevents.4.a:0 "钱望潮的想法利于集中革命力量"
SRCevents.4.b:0 "何孟雄的宣讲引发热烈反响"
SRCevents.4.c:0 "于方舟的想法更符合革命实际"
SRCevents.5.t:0 "经济模式议题："
SRCevents.5.d:0 "会议进入第二天，同产工会中央书记处书记任辅臣首先作了工作报告。他详细总结了同产工会在东北地区组织建设、宣传教育、武装斗争、群众工作等方面的进展与成绩，分析了当前面临的主要困难，并提出了未来的工作方针与任务。任辅臣强调，同产工会必须坚持无产阶级领导地位，加强自身的组织纪律性、内部团结与民主建设，同时注重联合其他革命力量，加强与国际同产主义运动的联系，为全国范围的大革命做好充分准备。\n随后，会议进入第二个核心议题：新生政权的经济政策问题。这直接关系到同产工会在东北地区的生存与发展空间，引发了代表们的深入讨论和不同观点的交锋。会上主要提出了三种经济方案：\n一、邓鹤皋提出彻底公有化方案。\n该方案主张新生政权必须坚持同产主义经济原则，对东北的工业和商业实行彻底国有化，对农业推行全面集体化，目标是彻底消灭私有制与剥削制度，建立完全的公有制和平等分配制度。支持者认为，这能确保新生政权的经济基础与上层建筑高度统一，实现经济独立自主，并提高经济发展效率。\n二、唐宏经提出渐进公有化方案。\n该方案主张新生政权应根据东北现实情况，对工业和商业采取逐步国有化的策略，对农业则推行渐进式的合作化。方案强调需尊重当前私有制与市场机制的存在，并加以引导转变。支持者认为，这种渐进方式能避免经济政策过于激进带来的风险，减少敌对和抵制，争取更广泛的经济支持与合作。\n三、辛培源提出有限私营过渡方案。\n该方案主张新生政权需考虑东北的历史与文化背景，在工业和商业领域暂时允许部分私营经济存在，在农业领域允许部分个体经营。方案提出应暂时保护部分行业、领域的私有财产与市场机制，并利用其积极作用。支持者认为，这有助于缓和经济领域的矛盾冲突，扩大新政权的经济基础与群众支持，丰富经济形态。"
SRCevents.5.a:0 "邓鹤皋的经济观点在辩论中占据上风"
SRCevents.5.b:0 "唐宏经的观点更具有可操作性"
SRCevents.5.c:0 "辛培源的理论得到的参会代表的支持"
SRCevents.6.t:0 "政府权力结构议题："
SRCevents.6.d:0 "会议进入第三天，同产工会中央宣传部长陈独秀首先作了工作报告。他深入阐述了同产主义基本原理与目标，揭露了封建王朝与帝国主义的罪恶及其危机，分析了中国的社会状况与阶级斗争形势，并提出了同产工会的政治主张与策略。陈独秀强调，同产工会必须坚持以工人阶级为领导、以农民阶级为基础，联合一切可联合的力量，推翻封建王朝，目标是建立一个民主、独立、统一、富强的同产主义中国。他呼吁同产工会加强对人民的政治教育和动员，提升其阶级觉悟与革命意志，使之成为同产主义的坚定拥护者和勇敢战士。\n随后，会议进入第三个核心议题：新生政权的中央权力架构问题。这关系到革命政府的领导核心与政治体制如何构建，引发了与会代表的不同主张和深入争论。会上主要形成了三种政治体制方案：\n一、任辅臣提出设立政治局方案。\n该方案主张新生政权应根据实际需要，在同产工会主导政府的基础上，设立专门的政治局负责政权运转。在全国革命形式尚不明朗的情况下，同产工会应当设立专门的政治局，并强化其决策与指导能力，确保其政府的权威性与统一性。支持者认为，这种高度集中的体制能保障新生政权的高效运转，从而调动更多资源以推动革命事业发展。\n二、李大钊提出中央执行委员会代议方案。\n该方案主张新生政权应坚持同产主义政治原则，在同产工会主导政府的同时，仍以同产工会中央执行委员会为最高权力机构。中执委成员由同产工会全体代表大会选举产生，由其主席团负责日常领导工作，各部门负责具体事务执行。支持者认为继续赋权同产工会中央执行委员会，能更好的体现民主原则和代表性，保障政府能够代表同产工会的意志，增强新政权的公信力与支持度。\n三、陈独秀提出人民代表大会主权方案。\n相较于前两者，该方案主张不再拘泥于同产工会内部的框架，而是直接将人民代表大会确立为最高权力机构。具体执行上，人民代表大会代表由基层工农团体选举产生，其常务委员会负责日常执行工作，各专门委员会负责审议具体事务。同产工会将在这一制度框架下开展工作，并引导革命政权继续向前。支持者认为，这种自下而上的体制能有效实现权力下放与制衡，容纳多元政治力量参与协调，丰富政权的组织形式。"
SRCevents.6.a:0 "任书记的观点更加合适"
SRCevents.6.b:0 "李主席的看法得到更多人认可"
SRCevents.6.c:0 "陈委员说的有道理呀"
SRCevents.7.t:0 "军事体系议题："
SRCevents.7.d:0 "会议的第四日，议程进入第四个重大议题——军事问题。这关系到同产工会武装力量的建设与军事战略的制定，引起了广泛而激烈的讨论。与会代表提出了三种不同的建军思路：\n徐向前首先发言，主张建立政治委员制度。该方案强调，同产工会的军队必须坚持同产主义的军事原则，在各级部队普遍设立政治委员，由其专职负责军队的政治工作与思想教育。军事行动须由政治委员与军事指挥官共同商议决定，确保政治委员拥有领导与监督之权。支持这一意见者认为，该制度能够实现军队的政治化和思想统一，保障队伍对革命的忠诚与纪律，从而提升战斗力与士气。\n关向应提出实行士兵委员会制度。该方案指出，同产工会应强调军事民主原则，在连以上单位成立由士兵选举产生的士兵委员会，参与军队的民主管理及士兵福利工作。日常训练等方面应由士兵委员会同指挥官协商决定，切实保障士兵的民主权利与切身利益。该思路的支持者认为，此举可推进军队的民主化与人本关怀，增强内部团结与信任，有助于争取更广泛的士兵支持与合作。\n蓝天蔚则提出确立军事主官领导制度。该方案认为，同产工会须考量东北地域的历史文化背景，建立以军事主官为核心的指挥体系。军事主官全权负责作战指挥与日常训练，政治工作人员应从旁协助，共同参与军事决策，同时必须树立并维护军事主官的权威与尊严。支持这一方案的代表认为，该制度有助于实现军队的专业化和作战效率，保证军事行动的能力与水准，推动同产工会武装力量的不断创新与发展。"
