### 决议 ###
### event ###
SRCevents.1.t:0 "辽西起义胜利"
SRCevents.1.d:0 "    早在前些时间，辽西省多个地区在辽东大起义的号召下，掀起了声势浩大的工人起义。长期以来，辽西地区的工人群众在经济压迫和社会不公的重压下，生活陷入困境。许多工厂和企业岌岌可危，工人们的生存状况令人揪心。然而，在这乌云压顶的时刻，一群坚定的工人领袖和革命者挺身而出，他们不畏强权，积极组织工人，利用一切机会传播共产主义思想，鼓舞工人群众奋起抗争。\n    起义如火如荼。工人们以雷霆万钧之势，迅速占领了辽西多个重要城镇。他们的行动犹如一把锋利的剑，直指反动政府的心脏，给其带来了前所未有的恐慌。起义军的英勇和决心，让反动势力措手不及，明廷不得不紧急调动辽西残余的军力进行镇压。\n    在同产工会组织的严密组织下，当地工人武装表现除了极强的作战意志。面对兵力孱弱的辽西守军。经过艰苦卓绝的斗争，起义军成功地占领了辽西省的大部分地区，给反动政府造成了巨大的恐慌。"
SRCevents.1.a:0 "草原沃野升红旗"
SRCevents.2.t:0 "辽西起义失败"
SRCevents.2.d:0 "    早在前些时间，辽西省多个地区在辽东大起义的号召下，掀起了声势浩大的工人起义。长期以来，辽西地区的工人群众在经济压迫和社会不公的重压下，生活陷入困境。许多工厂和企业岌岌可危，工人们的生存状况令人揪心。然而，在这乌云压顶的时刻，一群坚定的工人领袖和革命者挺身而出，他们不畏强权，积极组织工人，利用一切机会传播共产主义思想，鼓舞工人群众奋起抗争。\n    起义如火如荼。工人们以雷霆万钧之势，迅速占领了辽西多个重要城镇。他们的行动犹如一把锋利的剑，直指反动政府的心脏，给其带来了前所未有的恐慌。起义军的英勇和决心，让反动势力措手不及，他们不得不紧急调动辽西残余的军力进行镇压。\n    然而，尽管起义军展现出了惊人的勇气和决心，但由于此前辽西地区遭遇了明庭的大规模搜捕，同产工会在当地的组织体系受到严重打击。在缺乏组织的情况下，最终还是未能颠覆反动政权。反动政府凭借其强大的军事力量和残酷的手段，逐渐削弱了起义军的斗志。在激战过后，起义军不得不选择撤退，而辽西地区再次回到了反动政府的控制之下。"
SRCevents.2.a:0 "不气不馁，筹划再战！"
SRCevents.3.t:0 "革命大会召开"
SRCevents.3.d:0 "同产工会起义全面胜利并占据明帝国东北之后，同产工会于辽阳召开了东北第一次革命大会。这是同产工会成立以来的第一次全国性的代表大会，参加会议的有来自东北各地的同产工会的代表、工人、农民、士兵、学生、知识分子等各界人士，共计一千余人。会议的主题是“总结起义经验，巩固革命成果，准备全国大革命”。\n会议的第一天，同产工会中央委员会主席李大钊首先发表了开幕词，他高度评价了东北工人起义的历史意义和影响，认为这是同产主义在中国的第一次胜利，也是全世界工人运动的一个重要事件。他指出，东北工人起义的成功，是同产工会的正确领导、工人阶级的英勇斗争和广大人民的支持的结果，是同产主义理论和实践的结合的体现，是对封建王朝和帝国主义的有力打击。他号召全体与会者，继续高举同产主义的旗帜，巩固和扩大东北的解放区，争取全国的革命胜利。"
SRCevents.3.a:0 "旧秩序拥趸者不得入内！"
SRCevents.4.t:0 "基层组织议题："
SRCevents.4.d:0 "    李大钊的开幕词引起了全场的热烈掌声，也激发了与会者的革命热情。接着，会议进入了第一个议题：基层制度问题。这是一个关系到同产工会在东北的巩固和发展的重要问题，也是一个引起了不同意见和争论的问题。会议主要有三种思路：\n    钱望潮提出的依赖指派干部的思路。他认为，同产工会的基层组织要服从中央的统一领导，要由中央指派有经验和能力的干部到基层去领导工作，要加强对基层的监督和考核，要保证基层的执行力和效率。他认为，这样可以避免基层的混乱和腐败，可以保证同产工会的路线和方针的贯彻和落实，可以提高同产工会的威信和影响。\n    何孟雄提出的赋权基层工农团体的思路。他认为，同产工会的基层组织要依靠工人和农民的自我组织和自我管理，要赋予基层工农团体更多的权力和资源，要支持基层工农团体的民主和创新，要尊重基层工农团体的多样性和特色。他认为，这样可以调动工人和农民的积极性和主动性，可以培养工人和农民的革命意识和能力，可以增强同产工会的基础和活力。\n    于方舟提出于金州试点“三三制”干部制度的思路。他认为，基于目前的革命情况，革命政府的基层组织应当尽可能团结更多的革命力量。在各个地区的基层组织要由三成同产工会的干部、三成革命友党成员、党外进步人士和三成劳动群众组成。组织要实行集体领导和民主决策，要定期进行干部的轮换和评选，要保证干部的质量和数量。他认为，这样可以实现同产工会的干部和工农群众的密切结合，可以平衡同产工会的中央和基层的关系，可以促进同产工会的内部的和谐和团结。\n    会议对这三种思路进行了激烈的讨论和辩论，几派各抒己见。"
SRCevents.4.a:0 "钱望潮的想法利于集中革命力量"
SRCevents.4.b:0 "何孟雄的宣讲引发热烈反响"
SRCevents.4.c:0 "于方舟的想法更符合革命实际"
SRCevents.5.t:0 "经济模式议题："
SRCevents.5.d:0 "    会议的第二天，同产工会中央书记处书记任辅臣作了工作报告，他详细地总结了同产工会在东北的组织建设、宣传教育、武装斗争、群众工作等方面的情况和成绩，分析了同产工会面临的主要问题和困难，提出了今后的工作方针和任务。他强调，同产工会要坚持无产阶级的领导地位，加强同产工会的党性和纪律，加强同产工会的内部团结和民主，加强同产工会与其他革命力量的联合和合作，加强同产工会与国际同产主义运动的联系和学习，为全国大革命做好准备。\n    会议在这之后进入了第二个议题：经济问题。这是一个关系到同产工会在东北的生存和发展的重要问题，也是一个引起了不同观点和争论的问题。会议主要有三种思路：\n    邓鹤皋提出的激进国有化和农业集体化的思路。他们认为，同产工会要坚持同产主义的经济原则，要对东北的工业和商业进行彻底的国有化，要对东北的农业进行彻底的集体化，要消灭私有制和剥削制度，要建立公有制和平等制度。他认为，这样可以实现同产工会的经济基础和上层建筑的一致，可以保证同产工会的经济独立和自主，可以促进同产工会的经济发展和效率。\n    唐宏经提出的逐步国有化和农业合作化的思路。他们主张，同产工会要根据东北的实际情况，要对东北的工业和商业进行逐步的国有化，要对东北的农业进行逐步的合作化，要尊重私有制和市场机制的存在，要引导私有制和市场机制的转变。他认为，这样可以避免同产工会的经济过于激进和冒进，可以减少同产工会的经济敌对和抵制，可以增加同产工会的经济支持和合作。\n    辛培源提出了暂时允许部分私营的思路。他认为，同产工会要考虑东北的历史和文化，要对东北的工业和商业暂时允许部分私营，要对东北的农业暂时允许部分个体，要暂时性的保护私有制和市场机制的合法权益，要利用私有制和市场机制的积极作用。他认为，这样可以缓和同产工会的经济矛盾和冲突，可以扩大同产工会的经济基础和群众，可以丰富同产工会的经济形式和内容。\n    会议对这三种思路进行了激烈的讨论和辩论，各持己见，各有利弊，没有达成一致的意见。"
SRCevents.5.a:0 "邓鹤皋的经济观点在辩论中占据上风"
SRCevents.5.b:0 "唐宏经的观点更具有可操作性"
SRCevents.5.c:0 "辛培源的理论得到的参会代表的支持"
SRCevents.6.t:0 "政府权力结构议题："
SRCevents.6.d:0 "    会议的第三天，同产工会中央宣传处书记陈独秀作了政治报告，他深刻地阐述了同产主义的基本原理和目标，揭露了封建王朝和帝国主义的罪恶和危机，分析了中国的社会状况和阶级斗争的形势，提出了同产工会的政治主张和策略。他主张，同产工会要坚持以工人阶级为领导，以农民阶级为基础，联合一切可以联合的力量，推翻封建王朝，建立一个民主的、独立的、统一的、富强的同产主义的中国。他呼吁，同产工会要加强对广大人民的政治教育和动员，提高他们的阶级觉悟和革命意志，使他们成为同产主义的忠实拥护者和勇敢战士。\n    会议在之后进入了第三个议题：中央政治权力问题。这是一个关系到革命政府的领导核心和政治体制的重要问题，也是一个引起了不同主张和争论的问题。会议主要有三种思路：\n    任辅臣提出的中央书记处壮大的思路。他认为，同产工会要坚持同产主义的政治原则，要以中央书记处为最高权力机构，要扩大中央书记处的成员和职权，要加强中央书记处的决策和指导，要保证中央书记处的权威和统一。他认为，这样可以实现同产工会的中央集中和高效，可以保证同产工会的政治方向和路线，可以提高同产工会的政治领导和执行。\n    李大钊提出了中央执行委员会掌权的思路。他认为，同产工会要根据东北的实际需要，要以中央执行委员会为最高权力机构，要由中央执行委员会的成员由全体代表大会选举产生，要由中央执行委员会的主席团负责日常工作，要由中央执行委员会的各部门负责具体事务。他认为，这样可以实现同产工会的中央民主和代表，可以保证同产工会的政治参与和监督，可以增加同产工会的政治支持和信任。\n    陈独秀提出的一切权力属于人民代表大会的思路。他认为，同产工会要考虑东北的历史和文化，要以人民代表大会为最高权力机构，要由人民代表大会的成员由基层工农团体选举产生，要由人民代表大会的常务委员会负责执行工作，要由人民代表大会的各专门委员会负责审议工作。他认为，这样可以实现同产工会的中央下放和分权，可以保证同产工会的政治多元和协调，可以丰富同产工会的政治形式和内容。\n    会议对这三种思路进行了激烈的讨论和辩论，各持己见，各有利弊，没有达成一致的意见。"
SRCevents.6.a:0 "任书记的观点更加合适"
SRCevents.6.b:0 "李主席的看法得到更多人认可"
SRCevents.6.c:0 "陈委员说的有道理呀"
SRCevents.7.t:0 "军事体系议题："
SRCevents.7.d:0 "    会议的第四天，会议进入了第四个议题：军事问题。这是一个关系到同产工会的武装力量和军事战略的重要问题，也是一个引起了不同方案和争论的问题。会议主要有三种思路：\n    首先上台发言的徐向前提出了建立政治委员制度的思路。他认为，同产工会要坚持同产主义的军事原则，要在同产工会的军队中建立政治委员制度，要由政治委员负责军队的政治工作和思想教育，要由政治委员和军事指挥官共同决定军事行动，要保证政治委员的领导和监督。他认为，这样可以实现同产工会的军队的政治化和思想化，可以保证同产工会的军队的忠诚和纪律，可以提高同产工会的军队的战斗力和士气。\n    关向应则是提出的建立士兵委员会制度的思路。他认为，同产工会要根据东北的实际情况，要在同产工会的军队中建立士兵委员会制度，要由士兵委员会的成员由士兵自己选举产生，要由士兵委员会负责军队的民主管理和福利保障，要由士兵委员会和军事指挥官协商决定军事行动，要保证士兵委员会的参与和权益。他认为，这样可以实现同产工会的军队的民主化和人性化，可以保证同产工会的军队的团结和信任，可以增加同产工会的军队的支持和合作。\n    蓝天蔚提出的确立军事主官领导的思路。他认为，同产工会要考虑东北的历史和文化，要在同产工会的军队中确立军事主官领导的制度，要由军事主官负责军队的指挥和训练，要由军事主官和政治工作者协助决定军事行动，要保证军事主官的权威和尊重。他认为，这样可以实现同产工会的军队的专业化和效率化，可以保证同产工会的军队的能力和水平，可以促进同产工会的军队的创新和进步。"
