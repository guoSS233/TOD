SRCevents.9.t:0 "怒在烧"
SRCevents.9.d:0 "自太子遇刺案以来，关东招抚司在其辖内大肆搜捕所谓“同产分子”，疯狂镇压工人运动，关东招抚司辖内的各官私企业则借此机会，加大其对工人们本就已经相当过分的压榨力度，毕竟在这个节骨眼上，任何对他们的反抗活动都会被打为“同产分子暴乱”，继而召来招抚司差役们冰冷的警棍甚至子弹，最后变成地方官吏功劳簿上温暖的数字：今日又镇压同产分子XX人……\n漠视人命的关东官僚们以为工人们不过是匹夫之辈，在白色恐怖的镇压之下，只有潜身缩首，以全自身，然而，在目睹着一切的工人们心中，仇恨与愤怒正在一天天高涨，而这种愤怒在官方的引导之下，反而化作了工人们投向地下活动的同产工会的动力。\n终于，随着起义一声炮响传来，已经忍无可忍的关东工人群起相应，关东招抚司的死忠们瞬间发现自己已然陷入工人起义的汪洋大海之中。而在那些走上战场的工人之外，那些没有拿起武器的工人同样用自己的方式支持着反抗运动：现在，在关东境内，工厂停工，铁路停运，即便关东官军试图用皮鞭和子弹维持秩序，但他们仍然不得不承认，自己的后勤系统已经陷入完全的混乱与停滞之中，战争的天平已经发生严重的倾斜。"
SRCevents.9.a:0 "“匹夫之怒，亦可撼山岳”"
SRCevents.10.t:0 "接管（1）"
SRCevents.10.d:0 "在短暂的交火之后，辽东起义军迅速控制了东兴炼钢厂，实际上，就连他们自己也没想到，这处在辽东颇有名气的钢厂居然守备力量如此薄弱，厂区的护卫不仅人数不多，而且战斗意志也十分薄弱，原本在厂区大门和围墙巡逻的护卫队员只是和进攻部队交火了十几分钟，便迅速向起义军没来得及包围的西门逃窜，连带夹着尾巴逃跑的还有平日里耀武扬威的工厂老板和高管们。虽然起义军很想将他们全部逮起来，但奈何这些家伙似乎对起义军的到来早有预料，几乎可以称得上望风而逃，起义军战士们也只能对他们身后留下的一串卡车尾气无奈的叹息着。\n占领工厂之后，起义军自然是要赶快完成对工厂的正式接管工作，有些奇怪的是，虽然起义军已经与厂区护卫交过了火，并且也冲进了工厂，但是正在忙碌的工人们却只是抬起头朝着冲进来的人这边望了望。\n在看到进来的人是打着红旗的起义军之后，虽然工人们面带喜色，但手上的工作却没有要停下的意思，大家仍然各自忙着自己手头的活计，整个钢厂就像起义军没来一样继续运转着。\n面对这种奇怪的情况，负责指挥攻占钢厂的义军部队的指挥官有些摸不着头脑，他猜想也许是工人们并不认识起义军，但又凭直觉觉得不能简单粗暴地让战士阻拦人们，一时间不知道该怎么做的他最后只好找到工厂的广播室，打开广播，对着话筒大声说道：\n“工人同志们！你们好，我们是同产工会的辽东赤卫队！想必你们已经听说了我们起义的消息，我们已经打跑了反动的钢厂老板和他的狗腿子们，从现在开始，炼钢厂由我们辽东赤卫队接管，大家手上的活先停一停，我们有话……呃……要对大家说……”"
SRCevents.10.a:0 "大家安静了下来"
SRCevents.11.t:0 "接管（2）"
SRCevents.11.d:0 "指挥官越说越没底气，奇怪了，虽然有一部分人发出了欢呼声，但是整个钢厂除此之外还是几乎就像没听到他说话一样，人人手上都继续着自己的工作！就在他几乎开始怀疑，这里的工人是不是中了什么邪的时候，一个电工气喘吁吁地跑了过来，并在接近指挥官的时候被警卫员拦住。\n“怎么回事？让他过来。”本就一头雾水的指挥官见好不容易见到个似乎能了解情况的人，连忙招了招手，于是战士们把电工放了过来，或许是过于着急，这位电工神情紧张地大口喘着气，手里挥舞着，却一时间说不出话来。\n“别急，同志，慢慢说。”指挥官虽然着急，但还是从口袋里掏出水壶，递给跑过来的电工，“喝口水吧，先歇歇气。”\n“没，没事，老总，你快收着吧，我哪能喝你的水呢。”电工表情似乎还是有些紧张，但在倒了两口气之后，总算是能说出话了，“我就是替工友给您说一声，您别喊了，我们这是炼钢厂……炼钢厂是不能随便停工的。工人们的宿舍在后边，您要是想问话，去找后边歇着的轮班工人就好。”\n“不兴叫我老总，叫我同志就好。”指挥官纠正了对方的称呼，接着有些奇怪地问，“不过，为什么炼钢厂不能停工？有什么说法吗？”\n“炼钢的高炉，一旦停下来的话，里边的铁水就会凝固，闹不好炉子就废了！大伙是想要给工会保住这座厂子，所以才坚持不停工的。”电工拍着大腿解释道，“总之，我也就是个电工，详细的事，你去问倒班的高炉师傅吧，我也不能在这里多待，我得回去看着我那摊子去了。”\n望着扭头就走的电工师傅留下的背影，指挥官无奈地摇了摇头。"
SRCevents.11.a:0 "看来，接管工厂也不是那么简单的事情"
SRCevents.12.t:0 "争吵"
SRCevents.12.d:0 "在这些天举行的各部队经验交流大会上，各部队之间的讨论气氛虽然活跃，但却并没有想象中的那样融洽——出人意料的是，参加会议的各部队代表在许多战术的应用上意见不一，互不相让。起初特委的领导以为这种争吵只不过是出于争强好胜的心理，因此试图调解，但在充分了解了各方的观点之后，他们意识到其实代表们的争论并不是简单的各自逞能：\n出身农民的赤卫队代表积极提倡近距离的白刃战术，并且认真论述如何制造近身战的机会，可却被起义的正规部队代表斥为“浪费生命”、“徒增伤亡”，而在炮兵代表谈火炮阵地的布置时，又有来自工人纠察队的民兵代表提前退场，并声称“感觉听了没什么用”，结果又引起一阵吵闹。\n经过连夜的紧急讨论，大会组织者们一方面充分体谅了各部队代表的意见，尽可能的让他们各自分组讨论相对更有需求的技战术话题，另一方面也严厉批评了某些代表对于其他部队产生的战斗经验的轻视——毕竟，在很长一段时间内，我们不能只依赖正规军的正面作战来保卫革命，而在更远的未来，我们也不会永远都是一支缺枪少炮的“泥腿子”部队，谁也不能轻率地说，兄弟部队在血与火中积累下来的宝贵经验是对自己毫无意义的。"
SRCevents.12.a:0 "“我们的军队既要脚踏大地，也要眺望长空。”"
SRCevents.13.t:0 "这是什么鸟？"
SRCevents.13.d:0 "今天对于三营的战士们来说是个特别的日子——在经过许多天的筹备之后，三营的“图书室”终于对官兵们开放了大门。当营里那些爱看书的战士兴冲冲地在图书室里翻找自己喜欢的内容时，张贴在里间墙上的许多幅大张的影印照片吸引了他们的目光。\n航行在大海上的威武军舰、身管粗壮的重型火炮、造型奇特的新型战车等等现实中装备于中外军队的先进兵器自然让许多人忍不住看了又看，大家或是羡慕着那些装备先进兵器的军队，或是期待有朝一日自己也能用上这样的强大武装。而在照片墙的前边，摆放着一叠空白纸张，让大家一时间不知道其中用意。\b在询问图书管理员之后，对方答曰，这叠纸是给大家画图用的。按照特委的指示，为了鼓励大家建设先进军队的热情，最近特别开展了武器设计竞赛，只要能画出被军工厂采用的武器设计，不仅能获得全军通报奖励，还有机会得到特别晋升。\n听到有奖励，这些三营的战士们自然是纷纷摩拳擦掌地开始在纸上大展拳脚：有人在纸上画自己设想的新式战车，有人则设计起了根据经验改良的新式步枪。当大家画的差不多了，互相观看彼此的作品时，忽然有人看着二连的魏大春在纸上画的奇怪图画，发出了疑惑的声音：“大春，人家让设计新式武器，你怎么在纸上画个怪鸟出来啊，你别浪费公家的纸乱画好不好？”\n而听到这样的评价，魏大春自然是十分生气地同那人争辩起来：“你懂个屁，这是鸟吗？我设计的这是飞机！飞机你都不认识？”\n“飞机我是认识，可没见过翅膀曲里拐弯的，你这飞机怎么长得像个鸟一样？”\n魏大春的脸涨得通红：“飞机怎么就不能长得像鸟了，你想想，鸟飞的多快，要是飞机能做成像鸟一样的形状，肯定也能飞的更快！你不懂，就别瞎说，这叫科学！”"
SRCevents.13.a:0 "不懂什么是仿生学的战士们哄笑两声，没再和他争辩。"
SRCevents.14.t:0 "成立辽东特委"
SRCevents.14.d:0 "在度过了最初的混乱之后，随着东北同产工会掌握了这场源于必然而又成于偶然的起义的大致全貌，同产工会的领导者们立即意识到了掌握起义主导权的重要性。\n同产工会在基层留存下来的组织被发动起来，重新开始积极活动，而同产工会尚留守在东北的，以钱望潮为代表的一线领袖们也冒着风险重新聚集起来，决定组建辽东特别委员会来作为工人大起义的指挥中枢。\n许多分散在各处，久未相见的同志们如今难得重聚在一起，但大家来不及联络感情，而是立刻投入到了指挥和协调起义部队的紧张工作之中。"
SRCevents.14.a:0 "星星之火在东北大地渐烧渐旺"
SRCevents.15.t:0 "同产工会中央到了"
SRCevents.15.d:0 "“中央要回来了！”\n同产工会辽东特委的同志们在接到这个消息之后，除了最初的欣喜和激动，更多的则是在心中增添了一丝沉重：同产工会中央的到来，意味着同产工会未来将会以东北为首要根据地和领导中心，新生的东北革命政权能够肩负起重任吗？同产工会能稳定并掌控这片希望与危机并存的黑土地吗？革命的未来又将会如何？\n同产工会的内部并非毫无分别，随着形势的稳定和暂时安全，派系斗争的阴云也出现在地平线上，钱望潮会凭借在东北革命之中确立的核心地位继续领导革命吗，还是同产工会中央将会取而代之并推动自己的议程？革命前途未卜，不过至少目前来看，前路仍然充满希望，未来是属于劳动人民的。"
SRCevents.15.a:0 "领袖来来去去，但人民会留下来，人民是不朽的"
SRCevents.16.t:0 "任辅臣当选主席"
SRCevents.16.d:0 " 经过激烈的几轮投票，当结果公布的那一刻，会场响起了热烈的掌声。任辅臣缓缓从椅子上站起来，向会场的各位致敬。代表们用选票表明了他们的态度，他们的选择也证明了一个真理。革命不是在座谈会上发几个文件就能胜利的，不是妥协退让之人，沉迷于议会游戏之人所能领导的了的。它需要纪律严明的组织；民众需要引导，这又要求每一个同产主义干部要深入基层，发挥战斗堡垒的作用，动员广大工农积极主动地去参加红军，投入生产，服务于革命意志——为了同产主义的实现，奉献我们的一切！"
SRCevents.16.a:0 "跟着任主席在风雨中前进！"
SRCevents.17.t:0 "大学生当官"
SRCevents.17.d:0 "王有为看着眼前的一切，心里百感交集。文书资料胡乱的摆放在桌子，板凳，甚至地面上！电话铃声从他踏进大院的那一刻起就没停过，混杂着交谈的声响，吵得人心烦。不过他转念一想，毕竟计委才成立第二天，之前谁也没有搞过，谁也没有多少经验。想想半个月前，临时校党委找到他们经济系学生的时候，谁也没想到面对的会是这种类型的工作。他很早之前就读过那句著名的话：“举国生产之资材归公，将为自由平等之劳工联合团体所构成社会之全国基础。是团体中人，将依循共同合理之计划，协力而自发性地从事社会生产。”真没想到，他有一天能看到这个设想在黑土地上生根，而他和同学们来到这里的目的，就是让这个可爱的，目前还是“小东西”的玩意发芽，结果。当然对他自己而讲，还有另外一个意义，他那老爹，一个落魄破产乡绅，穷秀才。终于乐呵呵的，不再板着脸了，据说在老家逢人便讲："
SRCevents.17.a:0 "“我家那小子整了个官儿当，还是管钱匣子的！”"
SRCevents.18.t:0 "老熟人"
SRCevents.18.d:0 "八点钟的铃还是照常敲响了，不过今天不用着急去上工了。李芝山打了个哈切，慢慢吞吞的往大会场那集合。自从红军占了厂子，这学徒工好当多啦！再也不用每天慌慌张张的，觉也能睡个舒服了。更重要的是，原来那催命鬼——一个什么技术监工也见不到他人啦，每每想起他那一副臭脸和时不时紧盯手表的样子，李芝山也会多在心里面骂他两句，在以前，他可得管他叫师傅。\n不过今天这是哪一出？一大早就着急忙慌召开所有工人开大会。\n“工人同志们，我向大家宣布一个天大的好消息！今天咱们厂子，从杨扒皮手里彻底收回来啦！这厂子，今后是属于咱们工人的了！”\n欢呼和掌声一浪高过一浪，但代理厂长挥挥手，示意工人们先安静下来。\n“有一些厂子的旧管理人员，向组织递交了认罪书，积极反思了错误，本着团结一切能团结之人的原则。组织上决定吸纳他们，希望他们能在劳动中改造自己！为生产建设添砖加瓦！”\n李芝山细细打量着眼前的这一批人，当目光游离到一个人身上时，他不禁吓了一跳。那张脸还是如往常一般严肃。"
SRCevents.18.a:0 "“是你？老师傅？”"
SRCevents.19.t:0 "梁老汉的哲学"
SRCevents.19.d:0 "“啥叫同产主义，让你吃的上白面馍馍、高梁面那就是同产主义。让你整天拿烂树根充饥就不叫。”\n工作组的同志每每听到村东头梁老汉议论他的同产主义哲学观，不免会心一笑。\n欧罗巴的农民也不吃高粱面啊，他们也算不上什么同产主义！哎呀，只能说小资产阶级农民有这种错误观点也不稀奇。相比梁老汉的错误哲学认识，工作组的同志显然更在意集体农场的组建，村里面有不少人分了土地，就不愿意再参加集体农场了。还胡说什么“你们分了我们土地又抢回去”\n忙里忙外搞了半天，也就几户党员家庭加入了起来。一共两头牛，算作本钱，也怨不得别的村民笑这是穷“大社”，越忙活越穷。\n“穷大社咋哩？还笑话人家是鸡毛想上天，才吃上几顿白馍就忘本了，我看人家这鸡毛还非上天不可！”这是待人和善的梁老头少数几次发火，说罢便头也不回，坐在树旁的大石头上，一声不吭的抽着旱烟。\n夕阳西下，工作组照例开常会，上边催的越紧，会议的火药味就越浓。不少同志都做好动点武儿的打算了。\n“不行，绝对不能这么搞。”组长摇了摇头“我们初来乍到，不能一下子把群众对我们的信任一棒子打没了。”\n一阵叩门声不合时宜的打断了他们的争吵，靠门最近的组员嘴里嘟嘟囔囔的，跑去开了门。\n“首长们好，俺到哪里入伙？”梁老汉站在门外，手里还牵着一头牛，傻傻地笑着。"
SRCevents.19.a:0 "工农联盟在此刻不是一句空话。"
SRCevents.20.t:0 "第一个五年计划"
SRCevents.20.d:0 " 遵循“边打、边稳、边建”的方针，计划委员会组织力量着手第一个五年计划的编制工作。今后的五年，是东北长期建设的第一阶段，其基本任务是：推动东北工业进一步发展，以巩固国防，提高人民的物质与文化生活，并保证东北经济沿着社会主义道路前进，这需要快速完成广大农村的集体化和现有工商业的公有制改造，确保开足马力、集中力量保证重工业建设，同时也丝毫不忽视轻工业、农业等事业的发展，准确把握好“度”，避免出现畸轻畸重的现象，确保国民经济发展的协调和均衡。"
SRCevents.20.a:0 "热火朝天，力争上游！"
SRCevents.21.t:0 "风气糜烂？(1)"
SRCevents.21.d:0 "“老李，你看这也是个误入歧途的同志还是先教育......”\n“行了，不要再说了，这种坏分子，不深批哪能整顿风气？”\n崔钊源叹了口气，默默从李勇钟办公室退了出来，临走前往他那瞧一眼，还在闷头写资料呢。\n当第一次开碰头会的时候，他就嗅到一丝不对劲了 。“反击庸俗民主派” “打倒间谍，特务，机会主义者”等等字眼都快用烂了，对于广大基层党员干部，被李越叫去谈话更是一件值得被形容为“恐怖”的事情了。\n“在战场上被打死也好过被他们拷打一顿。”\n恐惧在人群中弥漫，人人都挣着抢着证明自己对革命的“忠诚”，装模作样的学习著作也好，检举揭发也罢。在崔钊源眼里看了，这谈不上什么正常现象。他总是觉得，这是欺骗群众而不是改造群众，他想起来前天听老宣传英雄干部交代给他俩的一段话\n“倘若现在要让猫吃掉一块辣椒，你们怎么办？”\n李勇钟漫不经心的回答“这简单，找人扒开它的嘴，直接灌进去就好。”\n“这怎么能行，你是在逼迫它。”\n“那您说怎么办？”\n“把辣椒捣碎，涂抹在它的爪子，它会很乐意去把辣椒舔干净的。”\n是啊，盲目的抓人整人表忠心，换来的真的是“整顿”风气吗？灵魂还是死的外表是光鲜的也没有用，应该让广大党员干部明白整风的意义，犯了错的，总是要发自内心的去治病啊！"
SRCevents.21.a:0 "“现在是时候让猫舔它的爪子了”"
SRCevents.22.t:0 "风气糜烂？(2)"
SRCevents.22.d:0 "下班铃一打，李芝山变高高兴兴地往工人借阅室跑。\n自从这免费的借阅室建成后，李芝山下班后便有了打发时间的好去处，虽然现在生产紧，但读点书的时间还是能挤出来的。这阅览室啊，啥都有：马恩著作啊，新文艺周刊啊，总之要啥有啥。有了这宝地，李芝山跟以前可是不一样了。终于不用当活瞎子了，宣传文件上的名词也变得好懂起来了，连讲话都文绉绉的。\n相较于以往，阅览室的气氛更活络一点。\n“唉，听说了没，内个什么崔钊源今晚要来咱们这办夜校，听说还是老大的官嘞！”\n“可不是吗，这么大的官跑来给咱们当教书先生来了.......”\n心砰砰地跳着。崔钊源？他在年轻工人里面老出名了，他要来我们厂子办夜校了......\n李芝山此时顾不上什么书不书的了，一溜烟窜到厂子里的宣传告示牌上。\n黄纸黑字，明明白白写着\n“工人不仅要掌握技术，也要学习理论，懂得如何去斗争，更要理解同产主义为了嘛！为了适应整风运动的需求，让广大工人理解进而积极参与其中，现决定开班东北第一钢铁厂工人夜校。\n老实讲，李芝山心里的问题还真不少。为什么厂子都归咱们工人了，可八小时工作制还只是空文，相反生产指标是越来越紧了。为什么隔壁产线的工人胡乱讲了几通话就被扣上了“污蔑干部，现行反革命”的帽子？干部，这些当官的真啥都办对了吗？每次心里有疑问总是被一堆所谓“同产主义”理论绕昏了头，最后的结果往往又回到“你不懂同产主义的运作方式”\n这些疑问，他希望崔钊源，崔教员能回答自己。"
SRCevents.22.a:0 "纪律不是盲从，干部不是圣贤"
SRCevents.23.t:0 "风气糜烂？我看好得很！(3)"
SRCevents.23.d:0 "茶杯砸烂在地板的声音把崔钊源拉的思绪了回来，他深呼一口气，抬起头直愣愣得盯着李勇钟看。\n“崔教员，你干的好啊！让一群反革命肆意发表危险的反动言论，我看已经有不少大间谍混进你那个工人夜校了，非好好查一波才行！我同时也警告你，你要注意自己的立场！不要滑到右派那边去了！不要退步到庸俗民主派那里去了！你那么喜欢李大钊的话追随他去好了，我提醒你,李大钊的错误全体同产工会的同志们上上下下都已经深刻反思了.......”\n“够了！”\n李钟勇呆愣在原地，他没想到在他眼里一向是“老好人”的崔钊源竟然突然情绪爆发。\n“钟勇同志，我已经无数次向你澄清了，工人夜校不是什么有职权的组织，只是让群众觉醒起来的一个小东西罢了！让你给这个可怜的小东西一点支持都这么难吗！工人学员我审查过，全部可靠！”\n死一般的寂静，若不是突然的电话铃声打破了沉寂，这死气沉沉的局面还不知道要持续多久呢。\n“我不跟你斗气，咱们听听书记处的老同志们怎么评价的，我告诉你，你那个汇报可是送到任书记那里了......”\n电话批示完后，又是相同的寂静。\n李钟勇上前一步，拍拍崔钊源的肩膀，略带颤抖的说\n“书记处的同志们说，任书记说你干得好，鼓励你把工人夜校办下去，还说让咱们抽空送几个工人干部到他那里汇报一下.......”"
SRCevents.23.a:0 "钢一厂有崔钊源，未来会有无数个"
SRCevents.24.t:0 "个人崇拜是个什么东西？"
SRCevents.24.d:0 "马克思认为，“历史演进之全程，其关键全在民众自身活泼泼之发展”。他论证了人民群众在历史发展中的作用，强调历史之事业，即是民众之运动。同时，我们也不否认杰出的个人在历史上所起的作用以及领袖人物对于革命的作用。领袖是在群众斗争中自然而然地产生的，而不能是自封的。同过去封建王朝的领袖“皇帝”相反，同产主义工会的领袖，不是在群众之上，而是在群众之中，不是在党之上，而是在党之中。正因为这样，同产主义工会的领袖，必须是密切联系群众的模范，必须是服从工会的组织、遵守工会的纪律的模范。对于领袖的爱护——本质上是表现对于工会的利益、阶级的利益、大众的利益的爱护，而不是对于个人的神化。我们不能一边压制批评和自我批评，一边鼓励表扬和自我表扬，这样吹捧的调子越来越高，与群众也渐行渐远，我们的作风也就日益恶化了。"
SRCevents.24.a:0 "戒骄戒躁，反对盲目崇拜！"
SRCevents.25.t:0 "文学再革命纲领"
SRCevents.25.d:0 "今天的中国的大患，还不仅是朱明封建王朝武力上的威胁，还表现在政治经济社会道德各方面的混乱。换句话说：一切思想上的意识上的零乱，有待于文艺工作者去清理，去纠正，文学需要同产主义，同产主义需要文学。文学再革命是号召树立先锋文学，同产主义文学，反对颓废文学，打倒反动文学。文学的彻底解放是同产主义实现的必经之路！\n这要求我们建立社会的文学：文学是社会的产物，也是社会的恩物，文学必须和大众结合在一起。第一，它不再是个人的英雄主义，而是为了大众，为大众歌唱，为大众创造，反应大众的需求。第二，它不再是“象牙之塔”和单纯的“风花雪月”了，而是为了未来而讴歌，这个未来就是同产主义之未来。第三，它不再是专门迎合一般的弱点而企图造成社会的不行以达到政治上的阴谋。它是忠实恳切地替人民创造幸福。我们需要大众化，通俗化，社会化的文学。文学再革命，再革一切反革命的命！\n我们的文学不是朱家皇室的“御用文学”，我们不屑于搞“曲线戡乱”那一套，我们反对这种黑色文艺，我们不仅大声疾呼，而且想代之以怒吼：\n御用，御用，第三个还是御用，\n今天你的元勋就是紫禁城的《小报》！\n鸦片，鸦片，第三个还是鸦片，"
SRCevents.25.a:0 "今天你的贡烟就是“尊皇讨匪”的布告！"
SRCevents.26.t:0 "一位普通记者的回忆"
SRCevents.26.d:0 "“1937年6月，我沿着铁路线北上，考察了中国称之为‘关内的北方’。当时，这一带正遭受特大旱灾，我目睹了成千上万的儿童死于饥荒，那场饥荒最终夺去了五百多万人的生命。一路上，满目凄凉，全无生机，就像刚刚发生过一场火山爆发。甚至树也被剥光了皮，村子里绝大多数泥砖盖的房子都坍塌了。屋子里仅有的一些木料也被拆去变卖几个铜板。奄奄一息的人东一个西一个地坐在或躺在自家门口的台阶上，神情呆滞。我看到一个光着身子、骨瘦如柴的小孩，由于吃树叶和锯末充饥的缘故，肚子胀得像只气球。当我想要继续北上到当地人口中称为‘关外’的地方，随行的军官劝我说‘那里还在打仗’‘哎呀，他们土匪杀外国人的’。这反而激起了我想要一探究竟的欲望，幸运的是，我碰见了一位王牧师，他能帮我联系红色工会的地下党，帮我转运到了关外。出乎我的意料，他们的领袖，许多人都亲自接见了我。包括任，他个子很高，不拘小节。如果说关外的中国，是一个死了的中国，那么这里还活着，活的中国！这里没有饿死的人，没有抢劫的士兵。这样一个苦难深重的民族，如何能够走向光明的未来？我想，这些平原上的马克思的信徒能办到，我祝福他们成功。”"
SRCevents.26.a:0 "埃德加.斯诺——1938年写于武昌，《北行漫记》前言"
SRCevents.27.t:0 "陈独秀同志担任主席"
SRCevents.27.d:0 "   革命是什么？换做别人可能会迟疑或给出不尽人意的回答，但陈独秀同志会回答“争取大多数，打击小部分”。历史终将证明，拥护朱明的只是一小部分反动至极的侩子手，而大部分中国人：上至实业兴国的实业家，下至最普通的劳动者，都是怀有赤诚之心的。如果要去求团结，求稳定。那么，陈独秀同志就是最合适的人选，他会将革命引导到一条充满着美好与希望的道路，一条自由，民主，从容不迫但又能捍卫自己的道路！每个在朱明专制下呻吟的人，都是我们解救的对象。只有坚定信念，为了革命，为了我们的革命，去战斗!去进攻，去夺取本属于我们的东西！"
SRCevents.27.a:0 "给予厚望之人，陈独秀同志"
SRCevents.28.t:0 "大小姐，别把鞋子弄脏啦！"
SRCevents.28.d:0 "春风吹过白桦林，林秀梅站在村口的土坡上，手指不自觉地捻着洋褂子的边角。她是镇上杂货铺老板的女儿，十八年来从未赤脚踩过泥土，五指不沾阳春水的典型，此刻却要跟着青年团的队员们一起，去老乡家里帮工割麦。\n带队的老张是本地农会干部，笑起来很爽朗。他递给秀梅一把镰刀，姑娘犹豫了一下才接过来，指尖还翘着，生怕沾上铁锈。麦田金浪翻滚，队员们早已散开干活，只有秀梅还愣在地头——她盯着自己的新布鞋，这姑娘，怕是不肯下地脏了她的鞋子哦。\n下工回来，秀梅躲在宿舍里偷偷擦鞋。同屋的小妮子看见了，咯咯笑：“城里来的大小姐，麦芒扎一下都要蹦个高！”秀梅涨红了脸，嘴硬道：“谁娇气了？明天我就割得比你们快！”\n第二天的骄阳似火，秀梅正笨拙地挥着镰刀，忽然看见房东家的媳妇，是个哑巴来着。背着麦捆往打谷场走，汗湿的褂子紧贴在脊梁上，形成深那媳妇不过二十出头，腰却似那老太太一样。她跟在后边，不再踮着脚尖走路，当麦芒刺在胳膊上痒痒的，泥土灌进鞋子里，但踏实感却增多了。\n在田垄上喝口水是难得的休息时间，哑巴媳妇直愣愣看着她那双鞋子，秀梅冲她笑笑"
SRCevents.28.a:0 "鞋子脏了没事，我又不是什么大小姐。"
SRCevents.29.t:0 "同产主义青年团的新同志"
SRCevents.29.d:0 "  站在队列中，张英的心跳得很快。她是十岁那年被卖到丈夫家当童养媳，后来他先当工人后当战士，自己小的可怜，在劝说下读了一所中学。说是丈夫——不过就比她年长一岁、总是带着憨厚笑容的小战士。他最后的家书上还是絮絮叨叨的，说些什么：“你是我没法做主的年纪招来的媳妇，这些年亏欠你很多，我一旦牺牲了你坚持读书，毕业找个好工作，找个好人家嫁了吧。”泪水曾浸透信纸，而如今，这份思念化为了更坚定的力量。\n闪亮的团徽别在她胸前时，冰凉的金属似乎也带着灼热的温度。她紧紧握着拳头，跟着领誓人一字一句地念出誓言，声音有些哽咽，但却异常清晰。她仿佛看到丈夫了，看到他似乎还在，想想也是讽刺，买卖婚姻买卖出来真感情。\n宣誓完毕，掌声如潮水般涌来。张英抬起头，她知道，她不仅是一名学生，一名烈士家属，更是一名肩负着责任青年团员。未来的路还很长，但她将带着两个人的信念，好好的活下去。为了同产主义？她还不太了解这个政治概念，她只知道丈夫为了这个死了，她要把“革命”守护下去，干些有意义的工作。"
SRCevents.29.a:0 "革命与个人密不可分。"
SRCevents.30.t:0 "老学究的宣言"
SRCevents.30.d:0 " 自从统一战线这个概念提出来后，报纸上就少不了奇怪玩意。什么人都能发表文章了，一个老秀才，写了篇宣言，算是个火爆文章，大模大样各种转载供诸位欣赏了：\n盖闻天地革而四时成，顺乎天而应乎人。今我同胞，承数千载专制之遗毒，受封建桎梏之深锢。王权巍巍，视民命如草芥；纲常凛凛，锢人心若牢笼。庙堂之上，独夫操生杀之权；闾阎之间，黎庶无喘息之地。此诚神州陆沉、华夏蒙尘之秋也！\n夫历史潮流，浩浩汤汤，顺之者昌，逆之者亡。帝制已堕，民主肇兴。然今有帝制之徒，阴结残馀，欲挽既倒之狂澜，实乃逆天悖理，冒天下之大不韪！吾辈须知：封建不除，则民权不立；专制不破，则自由不彰。\n结成统一战线，戮力同心，共讨封建馀孽。不论士农工商，无论南北西东，凡有抗志封建、向往光明者，皆我同志。当以笔锋为戈矛，以觉醒为甲胄，揭其伪饰，曝其昏暴，使复辟阴谋无所遁形。\n须知今日之抗争，非为一姓一代之更替，实为亿兆生灵争人格、为千秋万世开太平。愿我同胞摒除畛域之见，共举义旗，涤荡旧污，再造新民。让吾辈以热血浇自由之花，以铁骨铸平等之基，使中华大地永绝专制之根苗！\n时乎时乎，不再来！惟愿同心勠力，共襄斯义！"
SRCevents.30.a:0 "这也是统一战线的一部分嘛"
SRCevents.31.t:0 "一个手艺人的独白"
SRCevents.31.d:0 "“从农村走出来后，我托邻居中纺机厂的工人高鸣介绍，在康庄路 1772 号艺站光服装店拜师当学徒。说是学徒，实为童奴。老板叫刘逸彪，辽阳人。进店第一天要写契书，磕头烧香，契书规定学徒三年，其间患病生死与老板无关，而当学徒的月规钱只能买一块肥皂。那时虽说已解放，但对资本家还没有改造，店里和解放前一样。但工厂里气象不一样了，工人翻了身，积极性很高。直到后来搞改造运动，了不得啊，我们贫苦人可是扬眉吐气了工作队组织我们开会，上街刷大标语，给我们宣传改造的意义，启发我们觉悟。老板借口生活忙，不许我出去。但我这时也不知哪来的一股劲，就一个大胆，一点也不怕，照样出去刷标语。后来工作队发了布告，在改造期间不许扣发工资，不许开除工人，不许打人。我胆子更大了。在工作队启发下，我听到了从来没听到过的道理，懂得了只有同产工会才是我们这些被人看不起、被欺负的穷人的大救星！穷苦大众只有今天才能这样扬眉吐气！我平时从来不敢讲话，现在好像换了一个人似的，还揭发了老板大量偷税漏税的罪行呢。”"
SRCevents.31.a:0 "惩前毖后，治病救人"
SRCevents.32.t:0 "我没什么怕的啦！"
SRCevents.32.d:0 "康祖生躺在床上，艰难咽了口气。自打“解放”了，厂子的经营是一天比一天困难了。用工费在涨，工人就这还不满意，也在闹。虽然讨人嫌的朱家官员被赶跑了，但这日子还是没强到哪里去啊！直到这个改造来了，政府找上门的时候。康祖生差点以为遇上骗子。\n“啥？政府要接盘这个厂，有赎金拿，你们还愿意给我留个职务”\n政府好啊，改造好啊。终于不用操心这么多烂事情啦！儿子学业有成，女儿也进了政府当官，啥都好，啥都好哇。\n他挥挥手，一旁的儿子凑过来，带着哭腔说道：\n“爹......你还有啥话想说的”\n“没啥可说的啦，以前最怕厂子破产，现在政府解决了，我没啥怕的啦......”\n\n人山人海，康赛走在游行队伍最前面，后面跟着花车和牌匾。改造的完成，让她心里的一块大石头落了地，父亲平安落地了，没事啦，没事啦。\n直到一声声呼喊促使她扭过头，几个同事上气不接下气挤过拥挤的人群，凑到她耳边：\n“快回家吧，你父亲走啦！”"
SRCevents.32.a:0 "至少不带遗憾走了"
SRCevents.33.t:0 "同产主义是一锅炖鹅的好菜"
SRCevents.33.d:0 "“张三一天在野外抓到了一直大鹅，他高兴的跑回家叫他媳妇处理了。媳妇说咱们没有锅啊？张三讲那用火烤呗；媳妇说咱们也没有柴火，张三说先杀了也行。结果最后发现家里面穷的连菜刀都没有，一气之下把大鹅放了回去，这时大鹅扇动翅膀高喊‘陈独秀同志万岁！’”\n这则政治笑话固然为反革命提供了舆论支持，但我们也要反思我们的日常工作，物质丰富不一定是同产主义，物质不丰富一定不是同产主义。提高群众的生活待遇，使我们迫切要解决的事情。肉蛋奶的供应必须充足，必须扭转长期以来底层劳动者的营养不良问题。只有饭碗在手里放的稳，革命才会稳，才能一直稳下去！\n只有当铁锅炖大鹅随处可见，这种笑话才会消失，只有我们去改变，情况才能缓解。"
SRCevents.33.a:0 "嗯，优先把公共食堂建设提上日程吧"
SRCevents.34.t:0 "朱门再换新天"
SRCevents.34.d:0 " “旧时王谢堂前燕，飞入寻常百姓家。”刘禹锡的诗句预言了一场天翻地覆的社会变革。昔日的朱门高阁，曾是权贵专属的禁地，红漆大门隔绝出两个截然不同的世界。一个是劳工们的世界，一个是权贵大员们的世界。但无数同产主义志士的牺牲，砸开了这封建礼教的大门！他们的牺牲不是为了砸碎朱门再立新门，而是要彻底拆除那堵看不见的高墙。去创造一个崭新的，活泼的世界而不是一个死气沉沉的世界！朱门依旧，却已换了人间，但革命尚未成功，我们的努力不能停止，当然会有新牺牲的人，但我们要说：我们人人都愿意当那个为了崭新世界牺牲的人！”"
SRCevents.34.a:0 "何日桑田俱变了，不教伊水向东流"
SRCevents.35.t:0 "李大钊同志担任主席"
SRCevents.35.d:0 "李大钊同志，无人不知无人不晓的“人民之友”，在赞扬声中开始了他革命的又一个阶段。革命的爆发固然值得欢呼，可怎么保留这火种确实是一个不小的难题。但李大钊同志的胜选，标志着大部分为了同产主义事业奉献终生的战士们，做出了属于他们自己的选择。“守常同志不是一个严酷的大家长，而是我们亲爱的朋友！我们值得信赖的兄长！”黑土地上勤劳的人们不需要包办替代，他们将自己决定自己的命运，这是必要的。如果有人妄想不依赖他们就能取得更大的胜利，那么他一定是陷在空想中走不出来的人！"
SRCevents.35.a:0 "跟着守常同志！"
SRCevents.36.t:0 "自由的辩论"
SRCevents.36.d:0 " 辩论堂内，两名学生相对而立，剑拔弩张。围观的学生则屏息凝神。不用讲，又是一场唇枪舌战免不了。《学生自治试行条例》颁布以来，“德先生”就是大家口中的常客了。\n高个子学生扶了扶眼镜，有不少人认得他，王金洋嘛，那个“大独裁者”，可倒是他率先发了言：“大民主不是随便一个派对搞无节制的狂欢！根据革命的固有经验，民主必须与纪律原则相结合！这才是正道！若没有组织的政策引导，极易演变为派系斗争，或者纯粹人生攻击一类的，只会对革命有害处”之后就是指出战时环境下过度民主可能削弱集体行动力老一套了。\n对面站着的李文斌当即反驳：“金洋同志忽略了民主的教育意义，毕竟革命最后，咱们是要让大众自己解放自己的嘞！”\n“我们辩论的核心在于如何界定‘正确看待’。大民主也好，咱们现在搞自治也罢，就像大江大河也要修筑堤坝，防范泛滥。学生自治会也不能不接受组织一点领导啊，对很多封建思想存留较多，转变不及时的同学来说，这是助长错误蔓延！”\n两个小时的论战对于这样宏大的议题来说还是太渺小了，但出人意料的是，跟主旋律唱反调的王金洋得益于口才占上风，靠出色的表现反倒赢得了旁听同学的大量支持。\n“这场辩论毕竟有违上面政策的意思，我看不收录为好？”\n此时自治会的同志往往会笑笑说"
SRCevents.36.a:0 "不当紧，我们欢迎不同意见。"
SRCevents.37.t:0 "我才不要和他结婚嘞！"
SRCevents.37.d:0 "长白山下的小屯子如往常一般宁静，十七岁的秀兰在学班里听着工作队的什么“王同志”讲“婚姻自主”，听着怪高大上的词，其实对秀兰讲意思倒也很明确“自己可以不用嫁给隔壁刘老汉家”。\n她急急忙忙跑回家，对着炕上抽旱烟的父亲斩钉截铁道：“爹，老刘家的亲事我死也不从！”母亲手里的苞米粒惊落一地：“聘礼都过了一半，你想让全家丢尽脸面？”屋里油灯忽明忽暗，映着三道拉长的影子。\n“新社会不兴买卖婚姻！”秀兰的声音颤抖却有力，她从没有这么勇敢过，“王同志说了，政府给妇女撑腰！”咳嗽声猛地传来，烟杆敲得炕沿砰砰响：“反了天了！这什么狗屁工作队，才来几天就教你忤逆？”\n秀兰不语，整整一晚，她罕见的失眠，泪水不争气的从眼角流出来。第二天早上，似乎一切照旧，但秀兰出了家径直走进工作队驻的土坯房。王同志正给农会干部开会，见她眼圈乌青却脊梁笔挺，当即摘下钢笔起身：“走，咱们跟这姑娘一起去说道说道。”\n夕阳西下，秀兰家传来老刘家退婚的消息。屯子里第一桩自主退婚的事比北风刮得还快，就吹遍了大地，吹进了每个人的耳朵里。"
SRCevents.37.a:0 "新文化的意义，就在于此。"
SRCevents.38.t:0 "人民的声音"
SRCevents.38.d:0 " 老钳工张永年正踩着梯子悬挂红布横幅——“人民代表意见征集处”。晨雾还未散尽，不少年轻娃子都还在炕上打瞌睡呢，但他却早早起来开始布置了。\n作为纺织厂选出的首任工人代表，他天未亮就借来八仙桌，将稿纸端端正正摆好。茶杯用开水烫了好几遍遍，还特意借来一扩音喇叭，那是试了又试。同来布置的青年工友笑他太较真，老张却用沾着油污的手背抹了把脸：“咱们当家作主，那规矩可不就得立得堂堂正正。”\n日头渐高时，老张突然攥紧了手中的钢笔，着急的朝门口望着。但总归是到时候了。下班的纺织女工匆匆赶来，锅炉厂的汉子们工装还是像往常一样，早就被汗水打湿了，还有一老人家让孙子搀着颤巍巍走在最前头呢！人们手里攥着写好的建议稿，这次牢骚话可以放心大胆说啦！不用躲着厂长和他那帮狗腿子了，更何况，这问题还真能解决呢！\n老张突然说不出预备好的开场白。这一刻，他看见的不是前几年还被视作“贱骨头”的人了，现在，大家伙可都是————"
SRCevents.38.a:0 "国家的主人了！"
SRCevents.39.t:0 "回乡杂记.....?"
SRCevents.39.d:0 "腊月回四平老家探亲，竟见奇景，村公所垣外簇拥十余人，中有吾舅祖在焉。舅祖本不识字，此时竟执半截粉笔，与数老农共观墙上新张征粮簿册，时而俯身细辨数目，时而屈指掐算。余凑近笑问：“您老几时学了认数字？”舅祖嗓音亮得惊人：“冬学班里磨出来的！如今咱这政府说了，账簿就得晒日头底下！”言罢又指墙角答：“瞧见乎？意见箱！区长亲钉的，反映干部多吃多占直接投信！”不意同产匪徒竟有如此蛊惑民心之狡计，闻之骇然！若任其施为，非但潜入匪区搜集情报之图恐难施行，即他日反攻大业，亦恐失民心根基。呜呼！为之奈何？尚祈明公赐教，指点迷津！\n\n以上内容皆出自朱明匪徒近日往关外传递的信件，可以看出其积极谋划破坏举动，妄图制造混乱，破坏革命。"
SRCevents.39.a:0 "这帮朱明的孝子贤孙！该杀！"
SRCevents.40.t:0 "《关于成立国家经济委员会的决议》节选"
SRCevents.40.d:0 "成立国家经济委员会，这是一件具有重大意义的事情。这个委员会的成立，是为了更好地推进我们的经济建设，把各个经济部门的力量整合起来，统一筹划，统一安排。在过去，各经济部门虽然都在努力工作，但往往各自为政，缺乏统一的步调。步伐不一致，力量就难以集中，甚至可能互相牵制，造成不必要的浪费和损失。国家经济委员会的成立，就是要改变这种局面。它将负责制定全国性的经济计划，协调工业、农业、交通、贸易等各领域的工作，使我们的经济建设更有计划性，更有组织性，避免盲目性。\n这样一来，我们的有限资源就能得到最合理的配置，人力物力都能集中用到最需要的地方去。这对于我们这样一个刚刚起步、百废待兴的政权来说，是至关重要的。它能够有力地保障生产建设的顺利进行，加快我们国家工业化的步伐，逐步改善人民的生活。\n国家经济委员会的成立，标志着我们的经济建设工作进入了一个新的、更高级的阶段。它使我们能够在大的格局下，步调一致地向前迈进，为后续建设打下坚实的经济基础。"
SRCevents.40.a:0 "这是一项极其正确和必要的措施，我们务必全力支持其工作。"
SRCevents.41.t:0 " 头版头条"
SRCevents.41.d:0 "（本报讯）在无数劳动人民的艰苦奋斗下，我国经济建设事业又取得一项可喜成就。首届经济工作委员会会议于本月十五日在辽阳胜利开幕。此次大会由我国经济战线优秀工作者唐宏经同志主持，与会代表包括各工业部门负责同志、劳动模范及等百余人。\n会议在嘹亮的歌声中隆重开幕。唐宏经同志首先向大会作报告，指出：“我国国民经济发展势头良好。此次经委会的召开，必将进一步巩固国营经济领导地位，促进工农联盟加强，为实现进一步扩大生产，打出关外去奠定坚实基础。”会场气氛热烈庄重，代表们认真聆听了关于东工业建设的汇报。当听到超额完成生产计划时，全场爆发出雷鸣般的掌声。劳动模范张德贵同志激动地表示：“我们工人一定要以更大的激情，去迎接更辉煌的胜利！”\n会议期间，代表们深入参观了辽阳化工厂、机械厂等先进单位。\n此次会议历时三天，通过了《关于大力发展国民经济的决议》《关于开展增产节约运动的倡议书》等重要文件。大会胜利闭幕后，全体代表一致表示要将会议精神化为实际行动，为经济建设作和同产主义事业出更大贡献。\n“个人作用是有的，不过自己不要估计太大。任何人离开了人民离开了党，一件事也做不出来，应该这样估计。”"
SRCevents.41.a:0 "可喜可贺啊"
SRCevents.42.t:0 "赤旗指引未来"
SRCevents.42.d:0 "赤色的旗帜，是用烈士的献血染红的。只要这面旗帜还在，队伍就不会散，我们的理想距离实现就越近。这面旗帜注定不能只依靠几个人扛起来，那我们要问，我们要靠谁来扛起红旗呢？答案很简单，人民，只有人民！他们是我们的主心骨。只有解决人民的需求，改善群众的生活，做到幼有所育、学有所教、劳有多得、病有所医、老有所养、住有所居、弱有所扶，这面旗帜才能真正牢牢树立在土地之上，正所谓“个人作用是有的，不过自己不要估计太大。任何人离开了人民，一件事也做不出来。”在李大钊同志的领导下，我们不屈不挠的前进，向着更美好的明天，或是更遥远的未来，前进！"
SRCevents.42.a:0 "革命不死，革命万岁！"
