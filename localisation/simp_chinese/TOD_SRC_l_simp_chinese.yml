### 国策描述 ###
SRC_wuzhuangqilai:0"工人们武装起来"
SRC_wuzhuangqilai_desc:0"过去，朝廷对我们施行白色恐怖，现在，庞大的大明帝国已然倒塌。我们劳动者现在应当拿起武器，夺取属于我们 自己的权力，一切权力归于劳动者！"
SRC_shouwohuongzhang:0"手握红章"
SRC_shouwohuongzhang_desc:0"在我们夺取权力以后，我们要接管朝廷所掌控的工厂、军队等暴力机关，建立属于我们劳动者自己的暴力机关。"
SRC_liaodongteweichengli:0"成立辽东特委"
SRC_liaodongteweichengli_desc:0"为了应对目前的形势，我们应当成立一个特别行动委员会，用于组织工人革命等革命事务。"
SRC_chenglizhongguogongnonghongjun:0"成立工农红军"
SRC_chenglizhongguogongnonghongjun_desc:0"为了应对目前的形势，我们应当成立一个特别行动委员会，用于组织工人革命等革命事务。"
SRC_dongyuangongrenminbing:0"动员工人民兵"
SRC_dongyuangongrenminbing_desc:0"一部分工人自发的拿起武器，建立工人民兵，开始与朝廷的军队对峙。而我们应当将他们动员起来，促使他们更好地参与革命。"
SRC_gongnonggemingjunshiweiyuanhui:0"工农红军革命军事委员会"
SRC_gongnonggemingjunshiweiyuanhui_desc:0"我们的武装组织建立起来了，但是以目前形势来看，建立一支正规军对于我们打倒朝廷很有必要。而掌握正规军的关键，就在于建立一个军事委员会，以坐出各种各样的决策。"
SRC_zhengbiantouchengbudui:0"整编投诚部队"
SRC_zhengbiantouchengbudui_desc:0"在蓝天蔚等同志的努力下，一部分朝廷的军队向我们投诚，我们应当对他们进行整编，争取让他们成为我们革命的帮手。"
SRC_shiwanjingqizhanyanluo:0"旌旗十万斩阎罗"
SRC_shiwanjingqizhanyanluo_desc:0"如今面临围剿我该写些什么？身经百战才创立了这番革命事业，是多么的不容易。这次我要到阴间去召集已经牺牲过的同志，带领十万英灵击败反动派！"
SRC_dongbeilinshigemingzhengfu:0"东北临时革命政府"
SRC_dongbeilinshigemingzhengfu_desc:0"东北，现在是我们的囊中之物，我们应当建设它，把它作为我们击败朝廷的根据地。"
SRC_linshijunguanweiyuanhui:0"临时军管委员会"
SRC_linshijunguanweiyuanhui_desc:0"在目前的革命形势下，我们需要工人们恢复生产，为我们的革命生产武器、建设根据地等，而军事管制委员会正是一个恢复生产的好手段，它可以打击反动派对根据地的破坏，也可以建立新的革命秩序。"
SRC_junshiyouxian:0"军事优先"
SRC_junshiyouxian_desc:0"目前困扰我们最大的问题，还是军事问题。一支完备的无产阶级的军队对打倒朝廷，建立无产阶级专政还是很有必要的。"
SRC_zujiangongchangweiyuanhui:0"组建工厂委员会"
SRC_zujiangongchangweiyuanhui_desc:0"在我们起义以后，工厂就是成为工人阶级自己的了。为了管理工厂，我们应当像布尔塞维克那样建立工厂委员会。"
SRC_huifugongchangshengchan:0"恢复工厂生产"
SRC_huifugongchangshengchan_desc:0"我们不但善于打烂一个旧世界，还善于建立一个新世界。在夺厂运动以后，我们应该组织并恢复生产，为我们的革命提供武器保障。"
SRC_zhengfuzhengguihua:0"建立各地人民委员会"
SRC_zhengfuzhengguihua_desc:0"目前我们的行政单位是散漫的、杂乱无章的，我们应当建立各地人民委员会，便于我们打好我们自身的群众基础。"
SRC_tongchangonghuizhongyangdida:0"中央委员会的回归"
SRC_tongchangonghuizhongyangdida_desc:0"在白色恐怖期间，同产工会的中央委员会四散而逃，只有少部分人留了下来。而如今革命形势大好，我们应当重新召回这些同志，建立新的中央委员会。"

SRC_no_longer_a_slave:0 "起来，不愿做奴隶的人们"
SRC_no_longer_a_slave_desc:0 "在明廷白色恐怖的笼罩之下，无产阶级曾遭受着朝廷官僚与资本家的双重压迫。现在，庞大的明帝国正在崩塌，我们劳动者必须抓住机会，拿起武器，夺取属于我们自己的生存权利，起来，不愿做奴隶的人们！"
SRC_capture_key_points:0 "占领关键点"
SRC_capture_key_points_desc:0 "反动派被我们的起义打了一个措手不及，现在，我们必须趁他们未能从混乱中重整旗鼓的时机夺取各关键目标：衙门、兵工厂、电报局……控制这些地方，我们就能防止反动派从我们的背后重新组织起来。"
SRC_Liaodong_special_committee:0 "成立辽东特委"
SRC_Liaodong_special_committee_desc:0 "烈火已经燎原，同产工会必须牢牢把握住革命的方向舵，我们应当立即成立一个特别行动委员会，作为辽东起义的指挥中枢。"
SRC_workers_pickets:0 "动员工人纠察队"
SRC_workers_pickets_desc:0 "工人纠察队原本是我们为了保卫已经加入革命队伍的工厂设施，并肃清各厂内潜藏的反革命分子组织的工人民兵组织，但由于革命进程远超预期，我们必须紧急动员他们加入革命战争的前沿战斗序列，确保我们有足够的兵力推进这场伟大的革命。"
SRC_baoweigongrenzhengquan_categories:0 "保卫工人政权"
SRC_baoweigongrenzhengquan:0 "收集武器"
SRC_promote_military_officers:0 "提拔革命将领"
SRC_promote_military_officers_desc:0 "在辽东大起义的激战之中，一些起义部队的指挥员展现了格外亮眼的军事才能，我们应当把他们提拔为常任将领，更好地让他们的才能为革命发光发热。"
SRC_exchange_combat_experience:0 "交流战斗经验"
SRC_exchange_combat_experience_desc:0 "经过一段时间的战斗，我们各条战线上的起义部队各自总结了一些宝贵的实际作战经验，为了让这些经验能够更好地被运用于革命战争之中，我们决定抽调各部队的指战员与战士代表来一场别开生面的经验交流大会，让大家充分地互相学习交流一番。"
SRC_publicity_campaigne_outcome:0 "敌后宣传成果"
SRC_publicity_campaigne_outcome_desc:0 "一直以来，我们坚持在关东司军队中开展敌后革命宣传工作的努力终于得到了回报，一部分原本忠于明廷的军队决定响应我们的起义号召，加入革命行列，现在我们的革命力量更加壮大了。"
SRC_toucheng:0 "投诚部队"
SRC_look_forward_to_the_future:0 "向红军的未来眺望"
SRC_look_forward_to_the_future_desc:0 "随着革命战争的进行，我们的起义部队也逐渐有了正规化的雏形，在革命胜利以后，我们将会拥有一支属于人民的正规军队，为了那一天的到来，我们现在就应该开始准备工作。"
SRC_strengthen_the_system:0 "巩固临时行政体系"
SRC_strengthen_the_system_desc:0 "解放整个东北的目标现在已经近在咫尺，在那之后，我们的革命将以东北为根据地，迈向全中国，为了这一目标的成功，我们需要进一步发展辽东特委领导下的临时行政体系，将我们的政权从辽东扩展到整个东北。"
SRC_military_management:0 "建立军管委员会"
SRC_military_management_desc:0 "在目前的革命形势下，我们需要根据地工人尽快恢复生产，为我们的革命战争生产武器和其他必要物资，为了让根据地的生产恢复与物资调配工作更好地迎合战争需要，我们将建立一个军管委员会直接管理根据地的经济工作。"
SRC_weapons_first:0 "优先加强军备生产"
SRC_weapons_first_desc:0 "目前困扰我们最大的问题，还是军备供应不足。如果革命没有武装，那又怎么进行武装的革命呢？在军管委员会的敦促下，我们将优先组织力量，尽全力加强根据地内军工厂的生产能力。"
SRC_weapons_first_xiaoguo:0 "撕裂的社会： \n生产效率上限: §G+5.0%§! \n生产效率增长: §G+5.0%§! \n"
SRC_work_committee:0 "建立工厂委员会"
SRC_work_committee_desc:0 "如今，在起义军的红旗之下，工厂已经从过去的剥削工具变成了我们无产阶级自己的生产工具。为了更好地管理工厂，恢复生产秩序，我们应当像布尔塞维克那样建立工厂委员会来管理厂内事务。"
SRC_work_committee_xiaoguo:0 "撕裂的社会： \n工厂产出: §G+10.0%§! \n"
SRC_tno:0 "新秩序"
SRC_tno_desc:0 "我们不但应当砸烂一个旧世界，还应当努力建立一个新世界。在夺取工厂控制权并建立起新的工厂委员会以后，我们应该尽快恢复生产生活秩序，让工人群众看到新世界的曙光。"
SRC_tno_xiaoguo:0 "撕裂的社会： \n稳定度: §G+15.0%§! \n"
SRC_prepare_government:0 "筹备东北革命政府"
SRC_prepare_government_desc:0 "由于革命战争的紧迫性，目前我们根据地的行政体系充斥着杂乱无章的随意搭建，这严重影响了我们将革命继续推向高潮的步伐。现在，东北的战火已经接近尾声，是时候在同产工会的领导下，对全东北的行政体系进行统一整顿，并着手筹备一个稳定而高效的新东北革命政府了。"
SRC_comrades_return:0 "同产工会中央回归"
SRC_comrades_return_desc:0 "在白色恐怖期间，同产工会的中央委员会不得不分散转移，只有少部分成员留在东北继续斗争。如今革命形势已然天翻地覆，是时候重新召回离开的同志，恢复同产工会中央的活动，并且宣布全新的东北革命政府的成立了。"








#阶段性统一国策#
SRC_UN_focus:0 "东北统一国策"
SRC_dongbeigemingdahuizhaokai:0"东北革命大会召开"
SRC_dongbeigemingdahuizhaokai_desc:0"如今，我们已经夺下了东北，应当立即召开代表大会确立革命政府的领导人。"








