GPSevents.1.t:0 "关东招抚司通告"
GPSevents.1.d:0 "关东招抚司司长布告龙江、吉林、镇东、辽东、大宁诸省官吏：\n昌德四十九年腊月廿九日，本司奉旨成立，秉承朝廷与内务部之命，专司东北安抚、征辟、经略、绥靖诸务。遇非常之时势，得总揽东北军民政要，以维系地方安宁。\n本司首务，在彻查东宫遇刺元凶，为太子殿下昭雪复仇。据本司察访所得，此次逆案首恶，实有同产会党羽牵涉其间。同产会者，乃悖逆纲常之秘密团体，妄图颠覆君主政体，建立无君无天之同产社会。其徒众多出自工商农学各界底层，受德芬赤匪邪说蛊惑，对国朝典章制度心怀不满，暗中聚众结党，煽惑闾阎，扰乱纲常秩序，阻挠民生建设。且勾连内外反动势力，受其资饷密令，图谋暴乱颠覆，其心可诛，实为国朝心腹大患。\n奉皇命圣旨，谨此严饬诸省官吏，务须与本司通力合作，严遵侦案期间各项指令，加强地方弭盗防奸，保护良民生命财产，捍卫国家尊严利益。\n本司吁请东北各界忠良志士，同此大义，协力同心。凡知悉同产会踪迹或逆案相关线索者，即速向本司或地方官署禀报，切勿徇情庇护，以免身陷刑律。本司定当嘉奖提供真凭实据之人，严惩包庇滋事之辈，以彰国法之威。\n\n大明关东招抚司（钤印）\n昌德五十年正月初一"
GPSevents.1.a:0 "本司必将根除叛逆！"
GPSevents.2.t:0 "颁布紧急戒严令"
GPSevents.2.d:0 "关东招抚司司长告龙江、吉林、镇东、辽东、大宁诸省官员：\n本司于正月十五布告诸省，具陈同产工会为祸之迹。本司业已严饬诸属，扩大搜捕范围，凡涉同产会者，悉数拘捕归案，毋稍宽贷。\n讵料近日密探急报：自关内政局动荡以来，同产会残暴余孽已与海内奸宄、域外反贼暗通款曲，图谋借关东形势动荡之际，策动武装作乱。据密探所获情报，该党赤匪已潜伏于我军要塞险隘，伺机发动突袭，企图扰乱军心、动摇国本，趁国朝多事之秋颠覆政权，推行其极端邪说。\n为应对此严峻局势，本司特颁此令：自即日起，东北军区各镇军队一律进入戒备状态，严加警备，枕戈待旦。本司严饬诸省宪台，务必遵行本司战备谕令，不得稍存观望。侦得可疑人等或不轨活动，应即刻飞报本司，不得漏泄隐匿。若遇武力对抗，当机立断予以还击，毋得犹豫贻误军机！本司自当星夜调拨援军，策应诸省防务。\n关东招抚司司长（钤印）"
GPSevents.2.a:0 "那我们的生产生活怎么办呀？"
GPSevents.3.t:0 "《劳动界》海外特刊（头条内容）"
GPSevents.3.d:0 "本报采访了辽阳搜捕案中，被逮捕后经审讯释放的群众，以下是其自述：\n    昌德五十年正月十五，吾遭大祸。是日，吾如常往辽阳机器制造总厂铸钢车间作事，不意遇关东招抚司之大搜捕。吾见同事或被拖出，或被鞭挞，或被电刑，或被囚笼，吾心惶惶，怒不可遏。\n    吾不知，吾等平民，何以为关东司所疑为同产工会之人？ 吾等惟以劳力为生，未尝参与反朝之事，对太子遇刺案一无所知。吾等之罪，岂非以吾等为东北人乎？\n    吾忆被捕者，皆吾所识，皆吾作事之伴。有李大山者，年四十，为车间之领班，待吾等甚和，常解吾等之难。有王小花者，年二十二，为车间之女工，貌美如花，笑靥如春，其夫为军人，战于前线。又有张老头者，年六十，为车间之老工，已事此厂四十年，其子为学者，曾于京城大学讲书，后为关东司所执，以为同产分子。吾不知其生死，惟知其皆无辜，其皆善人。吾祈天佑之，使其无恙。\n    吾正思念，忽有手自后扼吾肩，将吾拽起，一声呼于吾耳曰：“吾观尔即为机器制造厂之同产分子！”吾顾之，乃关东司之郭继承也，此人恶名远扬，专司捕审同产工会之人，其手沾满鲜血。其目狂热，其口邪笑，其手执铁棍，对吾曰：“尔从吾来，吾将令尔知生不如死！”"
GPSevents.3.a:0 "欲加之罪，何患无辞？"
GPSevents.3.b:0 "防微杜渐，宁滥勿缺！"
GPSevents.4.t:0 "《周饶日报》关东戒严，民怨沸腾"
GPSevents.4.d:0 "    东北地区近日来局势动荡，多地相继爆发大规模抗议游行，民众集会要求关东司解除戒严，恢复民众自由。游行活动受到民众的广泛支持，但与多地戒严军队发生激烈冲突。\n据悉，辽阳、金州、长春、吉林、龙江、滨江等地之游行，多由同产工会成员或同情者发起组织。同产工会乃一非法地下组织，主张推翻大明君主制，建无神无君之同产主义社会。关东招抚司于正月十五日通令，将同产工会定性为与太子遇刺案关联之反动势力，宣布全面清剿打击。\n依关东司通令，各地大规模搜捕、逮捕行动展开，涉同产工会人员不论男女老幼、亲疏远近、职业身份，悉数拘捕。同时，关东司对抗议游行人群开枪驱散，不惜动用机枪、骑兵等重兵器，对付手无寸铁之平民。据不完全统计，正月十五日至二十五日短短十日间，已造成数百人死伤、近万人被捕，数百万人生活受不同程度影响。,关东司却对这些正义的抗议行动采取了残酷的镇压手段，造成了大量的人员伤亡和财产损失。\n    据悉,辽阳、金州、长春、吉林、龙江、滨江等地的抗议游行,都是由同产工会的成员或同情者发起或组织的。同产工会是一个非法的地下组织,主张推翻大明帝国的君主制度,建立无神无君的同产主义社会。关东司司长在正月十五日的通知中，已经将同产工会定性为与太子遇刺案有着密切联系的反动势力，宣布将对其进行全面的清剿和打击。\n    根据关东司的逮捕命令，关东司在各地展开了大规模的搜捕和逮捕行动，将所有涉嫌与同工会有关的人员一律拘捕归案，不分男女老幼，不论亲疏远近，不问职业身份，不论是否直接参与太子遇刺案。关东司还对抗议游行的人群进行了无差别的开枪和驱散,不惜使用机枪、骑兵等重兵器,对付手无寸铁的平民百姓。据不完全统计,仅在正月十五日至二十日的五天时间内，就有数百人被关东司杀害或重伤，近万人被关东司逮捕或拘留，数百万人生活受到不同程度影响。"
GPSevents.4.a:0 "这些南洋媒体又在胡咧咧了！"
GPSevents.5.t:0 "关内生变，局势不稳"
GPSevents.5.d:0 "关东招抚司司长告龙江、吉林、镇东、辽东、辽西诸省官员∶\n    由于本司在正月十五日发出的通知中，已经明确指出了同产工会的罪恶行径和本司的坚决态度。本司已经下令扩大逮捕范围，将所有涉嫌与同产工会有关的人员一律拘捕归案，不留任何余地、不容任何姑息。\n    然本司近日接到可靠情报。自关内生变以来，同产工会在东北地区的残余势力，已经与国内外的反动力量勾结，企图发动武装暴动，破坏我国的安全稳定。据悉，他们已经秘密潜入了一些重要的军事设施和要地，准备在某个时机发动突然袭击，制造混乱和恐慌。他们的目的是要瓦解我国的军事防御，挑战我国的主权和领土完整，妄图趁国朝处于危难之时，颠覆我国的政权，推行极端思想。\n    为了应对这一严峻的形势，本司决定，自即日起，东北军区所有军队进入战备状态，加强警戒和防范，随时准备应对任何可能的敌对行动。本司要求诸位官员，严格执行本司的战备命令，不得有任何迟疑或怠慢。如有发现任何可疑的人员或活动，应立即向本司报告,不得隐瞒或泄露。如有遇到任何敌对行动，应当果断反击，不得手软！本司将派遣援军，支持诸位官员的作战。"
GPSevents.5.a:0 "霹雳手段“菩萨心肠”"
GPSevents.6.t:0 "辽阳起义"
GPSevents.6.d:0 "    昌德五十年八月三十一日，同产工会在辽阳发动了一场震惊天下的工人起义。起义的领导者是同产工会东北局书记钱望潮，他号召工人阶级用武装斗争推翻压迫他们的封建统治，建立同产主义的新社会。起义的口号是“推翻明廷腐朽统治，权力属于无产阶级！”\n    起义开始于辽阳的一家军械所，工人们在钱望潮的带领下，夺取了厂内的武器，攻占了厂区的要害。然后，他们向城内的其他工厂和居民区发出了起义的信号，很快，成千上万的工人加入了起义的队伍，与官兵和地主武装展开了激烈的街头战斗。起义者以勇敢和坚决的斗志，打败了敌人的反攻，最终占领了辽阳的城门、衙门、兵营和仓库，宣布辽阳为同产主义的解放区。\n    起义的消息迅速传遍了东北各地，金州、长春、锦州、延吉、吉林、滨江、龙江等城市的工人也纷纷响应，发动了自己的起义，与官府和地主的武装进行了殊死的斗争。沈阳的军队也发生了哗变，部分士兵和军官背叛了朝廷，加入了同产工会的行列，向沈阳的统治者发起了进攻。东北各地的工人起义，形成了一个强大的同产主义的革命力量，对抗了封建王朝的残暴统治，为实现工人阶级的解放和幸福而奋斗。"
GPSevents.6.a:0 "这些该死的赤匪，速调大军围剿！"
GPSevents.7.t:0 "沈阳生变"
GPSevents.7.d:0 "    昌德五十年八月三十一日，明帝国东北军沈阳驻军长官王以哲接到了朝廷的紧急命令，要求他立即率领军队前往辽阳阳，平息同产工会的起义。王以哲知道，这是一场生死攸关的战役，如果不能尽快镇压起义，就可能引发全国的同产主义革命，动摇明帝国的根基。他决定不惜一切代价，消灭同产工会的武装力量，恢复辽阳的秩序。\n    然而，出乎所有人预料的是，当主力部队离开沈阳，集中力量对辽阳城发起猛烈攻击时，沈阳城内约的留守军队在老将蓝天蔚的领导下，竟然发动了“叛乱”。由于城内防御力量大幅削弱，面对近乎两个整编师的叛军铁蹄，守军显得捉襟见肘，难以抵御其凌厉攻势。受到赤色思想深刻影响的士兵们迅速夺取了沈阳的城防控制权，并且迅速武装了大量积极响应起义的工人和市民，使得整个沈阳城在短时间内便陷入了赤色力量的手中。\n    沈阳失守的消息不胫而走，关东司的整个围剿布局瞬间土崩瓦解。王以哲的部队陷入了进退维谷的境地，身处沈阳与辽阳之间，稍有不慎，便可能使局势急转直下，陷入万劫不复。尽管他提出了一个大胆的反击方案——趁叛军根基未稳，即刻挥师沈阳，但这一行动仍需等待汤大帅的最终裁决。此刻的王以哲，肩上扛着千斤重担，心急如焚地等待着招抚司的下一步指令。"
GPSevents.7.a:0 "汤大帅要求你部暂时转进，跳出辽沈之间的区域，汇合辽西援军后再合攻沈阳。"
GPSevents.7.b:0 "汤大帅同意了你的计划，趁敌立足未稳，即刻发兵沈阳！"
GPSevents.8.t:0 "分散攻击、主攻一方？"
GPSevents.8.d:0 "    在关东招抚司的议事大厅中，气氛异常紧张。如今大军云集沈阳城郊，但将领间却因进攻方式而产生了分歧。主攻派的官员们主张集中优势兵力，从某一方向全力进攻。他们认为这样可以迅速突破敌军的防线，减少我方的损失。\n    主攻派的代表人物是一位资历颇深的将军，名叫杨宇霆。他有着丰富的作战经验，对军事战略和战术有着深刻的理解。他坚信，只有通过快速而果断的行动，才能迅速平定叛乱，稳定局势。\n    “我们必须采取主动，集中兵力，迅速攻占沈阳。”杨宇霆站起来，眼神坚定地说，“这样可以避免战线的拉长，减少我方的兵力分散。同时，也可以打乱敌军的部署，使其无法组织有效的抵抗。”\n    然而，分散派的官员们对杨宇霆的主张提出了质疑。他们的代表人物是一位名叫马占山的文官，他主张采用多路进攻的方式，以分散敌军的注意力。\n    “我认为，分散兵力可以更好地利用地形的优势，同时分散敌军的防御力量。”马占山温和地反驳道，“通过多路进攻，我们可以从不同的方向对敌军施加压力，使其无法判断我们的主攻方向。这样可以提高我方的胜算。”他还进一步指出，“此外，分散进攻还可以减少对我方士兵的伤亡。在战争中，保护士兵的生命安全同样重要。我们应该尽量避免无谓的牺牲。”\n    杨宇霆听后立刻反驳道，“但是，如果我们分散兵力，可能会给敌军提供可乘之机。他们可能会集中优势兵力攻击我们的薄弱环节，导致我们失去对局势的控制。不要忘了，我们的物资并不充裕！一旦不能速克沈阳，就有可能出现更加不利的局面！”\n    马占山不以为然，“我们可以通过加强侦查和快速反应来应对这种可能性。通过密切关注敌军的动向，我们可以及时调整我们的策略和部署。战争不是赌博，如果不能极可能保证作战顺利，那就应该暂缓军事行动，而不是那将士的姓名去博你说的可能性！”\n    双方展开了激烈的争论，各有各的道理和理由。议事厅中的气氛越来越紧张，但最终没有达成一致意见。这时，主位上的汤玉麟缓缓开口道。"
GPSevents.8.a:0 "抽调更多地方部队，分进合击，合围沈阳"
GPSevents.8.b:0 "利用现有力量，集中兵力，主攻沈北"
GPSevents.9.t:0 "决战沈阳"
GPSevents.9.d:0 "    对于沈阳的总攻开始了。负责北线攻势的明军主攻部队，在杨宇霆的带领下利用夜幕的掩护，发动了对于沈阳北部防线的进攻。明军身穿现代军服，配备了明帝国新式的武器装备，包括步枪、机枪、火炮等。杨宇霆制定了详细的作战计划。他分析了起义军的防御工事和部署情况，制定了三路进攻的策略。一路从正面发起强攻，吸引敌军注意力；另两路从侧翼进行包抄，打起义军一个措手不及，一举穿透起义军沈被防线。而这套作战的关键，便在于沈阳北部火车站能否被迅速拿下，从而在起义军防线上撕开一个口子。\n    凌晨3点，明军炮兵开始炮击起义军阵地。炮弹呼啸着划破夜空，落在敌军阵地，爆炸声震耳欲聋。硝烟弥漫，起义军阵地一片狼藉。\n    在炮火掩护下，明军正面进攻部队发起了冲锋。他们利用烟雾弹的掩护，快速穿越开阔地，向敌军阵地逼近。起义军迅速作出反应，利用预先构筑的工事进行抵抗。双方展开了激烈的交火，步枪和机枪的响声交织在一起。\n    与此同时，明军侧翼部队展开了行动。他们穿越丛林和沟壑，绕过敌军的警戒线，对起义军的侧翼发起了突然袭击。起义军面临腹背受敌的困境，局势开始动摇。\n    在激烈的交战中，明军的战车部队也加入了战斗。战车冲锋陷阵，炮弹呼啸而出，摧毁了起义军的防御工事和火力点。起义军陷入了困境，开始节节败退。然而，起义军并未放弃抵抗。他们组织起最后的反击，试图夺回失去的阵地。双方在狭窄的战场上展开了白刃战，士兵们用刺刀和手榴弹进行搏斗。\n    黎明拂晓，围绕沈阳北部火车站的争夺也落下帷幕——"
GPSevents.9.a:0 "明军占领了沈北火车站，乱军的防线被我们撕开了！"
GPSevents.9.b:0 "关键时刻，辽阳义军的增援部队及时赶到，明军被迫暂时后撤"
GPSevents.10.t:0 "明军攻克沈阳"
GPSevents.10.d:0 "    历经一月左右的奋战，明军与起义军之间的较量达到了白热化的程度。这一个月的时间里，沈阳城内外战火连天，硝烟弥漫。明军士兵们日夜不停地发动攻击，他们的勇气和毅力得到了极大的考验。每一次冲锋都伴随着生死的较量，每一场战斗都凝聚着士兵们的血汗和泪水。\n    起义军同样展现出了顽强的抵抗精神。他们利用城防工事和地形优势，与明军展开了殊死搏斗。尽管面临着巨大的压力和困境，起义军士兵们仍然坚守阵地，不屈不挠地抵抗着明军的进攻。\n    最终，在明军持续的猛攻之下，起义军的防线逐渐崩溃。沈阳城内补给线被切断、后援无望，使得起义军陷入了绝境。伴随着赤底黄龙旗在沈阳的城头升起，明军顺利地夺回了沈阳城。"
GPSevents.10.a:0 "辽北克复，沈阳在握！"
GPSevents.10.b:0 "命令沈阳残军转进辽西，再觅胜机"
GPSevents.11.t:0 "明军攻势受阻"
GPSevents.11.d:0 "    历经一月左右的奋战，明军与起义军之间的较量达到了白热化的程度。这一个月的时间里，沈阳城内外战火连天，硝烟弥漫。明军士兵们日夜不停地发动攻击，他们的勇气和毅力得到了极大的考验。每一次冲锋都伴随着生死的较量，每一场战斗都凝聚着士兵们的血汗和泪水。\n    起义军同样展现出了顽强的抵抗精神。他们利用城防工事和地形优势，与明军展开了殊死搏斗。尽管面临着巨大的压力和困境，起义军士兵们仍然坚守阵地，不屈不挠地抵抗着明军的进攻。\n    最终，在无数起义部队前赴后继地牺牲之下，原本摇摇欲坠的防线最终稳固下来。攻势受阻的明军不得不选择暂时后撤，暂时休整以待局势发展。"
GPSevents.11.a:0 "暂时休整，以图再战"
GPSevents.11.b:0 "巩固防线，扩大战果"
GPSevents.12.t:0 "大宁省失守"
GPSevents.12.d:0 "    近日，大宁省多个地区在辽东暴乱的影响下陷入混乱。在同产逆党的煽动下，工人们掀起了规模庞大的暴乱浪潮。在轰轰烈烈的暴动行为中，许多城市一度陷入同产逆党的手中，给关东招抚司在该地区的统治带来了严重冲击。\n逆党武装受激进思潮蛊惑，肆意妄为。其无视法纪，公然藐视关东招抚司之威信，以暴力破坏地方秩序，严重危害民众生命财产安全。尽管我方军队已经努力弹压，但却仍难以挽回局面，大宁各大城镇均陷于贼手，短期之内难以光复。\n    乱党武装在极端思想的煽动下，展现出了极为恶劣的暴力和无序行为。他们无视法律，公然挑战关东招抚司的权威，以暴力手段破坏社会秩序，严重危害了当地民众的生命财产安全。尽管我方军队已经努力弹压，但却仍难以挽回局面，辽西各大城镇均陷于贼手，短期之内难以光复。"
GPSevents.12.a:0 "四面起火，为之奈何？"
GPSevents.13.t:0 "稳固大宁省局面"
GPSevents.13.d:0 "    近日，大宁省多个地区在辽东大暴乱的影响下陷入混乱。在同产逆党的煽动下，工人们掀起了规模庞大的暴乱浪潮。在轰轰烈烈的暴动行为中，许多城市一度陷入同产逆党的手中，给关东招抚司在该地区的统治带来了严重冲击。\n逆党武装受激进思潮蛊惑，肆意妄为。其无视法纪，公然藐视关东招抚司之威信，以暴力破坏地方秩序，严重危害民众生命财产安全。幸赖将士用命，乱党又经此前搜捕，于大宁地方结社已趋于涣散，在经过多轮殊死拼杀之后，我军基本已经克复大宁大部分城市，乱党扩大暴乱规模的阴谋被我军顺利镇压！\n    乱党武装在极端思想的煽动下，展现出了极为恶劣的暴力和无序行为。他们无视法律，公然挑战关东招抚司的权威，以暴力手段破坏社会秩序，严重危害了当地民众的生命财产安全。幸赖将士用命，乱党又经此前搜捕，辽西地方组织已趋于涣散，在经过多轮殊死拼杀之后，我军基本已经克复辽西大部分城市，乱党扩大暴乱规模的阴谋被我军顺利镇压！"
GPSevents.13.a:0 "大宁稳固，可待用兵！"
GPSevents.14.t:0 "研究战法："
GPSevents.14.d:0 "关东招抚司诸将近日会于帅帐，力图革新东北明军作战之法。此前与赤匪交锋，众将深知旧战术之弊，亟待变通。经数日研商，终成数策：\n一、炮队配置：后仗炮队当为火力后援之中坚。择地部署炮阵，务求精准，专攻敌之集结重地、指挥中枢等要津。炮队尚需与步队诸军缜密协同，以收火力合璧之效。\n二、战车部队之运用：战车部队当为迅捷反应之主力。侦敌虚实后，铁甲利刃直刺敌之脆弱处，借其高速驰突、远程轰击之能，迅猛揳入敌后，乱其阵脚。若战局不利，机械部队亦当殿后，掩护诸军有序撤退。\n三、侦敌与策反：为使战策有的放矢，情报搜集至为关键。派遣精干斥候深入敌后，刺探军情。另辟策反蹊径，以金帛、爵禄诱敌将，或以游说、离间惑其心，削弱敌阵。\n四、诸军协同：各部诸军之联络配合，关乎战局成败。战术实施时，各部队必须令出如山，动作协同，杜绝各行其是。后勤辎重部队亦需恪尽职守，确保粮秣军械及时输送前线。\n五、兵员操练与武备更新：提升士卒战力，端赖平素严谨训导。当定期组织操演，磨砺士兵技艺、体魄及心智。同时，注重兵器修葺与更新，使我军装备精良，以应复杂战局。\n关东招抚司高层将领们在会议中达成共识，将采取上述新式作战方法。这些策略旨在有效应对未来战争威胁，稳定关东局势。"
GPSevents.14.a:0 "面向未来，战法革新"
GPSevents.15.t:0 "关东招抚司通告"
GPSevents.15.d:0 "    自辽阳赤匪叛乱发生以来，辽东沦陷，战事蔓延，关东招抚司鉴于赤匪无止境之作乱，爰决定戒严平叛，全东北民众同仇敌忾，全体将士忠勇奋发；被据各省，均有极急剧之奋斗，极壮烈之牺牲。而沈阳城下，我军大败赤匪，关外将士，其在前线，以血肉之躯，攻克沈阳。赤匪倾其全力，我军功亏一篑。\n    迩者赤匪更肆贪黩，祸乱沈阳。察其用意，无非欲挟其暴力，要我不战而降。殊不知我司自决定戒严平叛之日，即已深知此为重要关头，为国家安全计，为社会稳定计，为世界免此极端思想之荼毒计，皆无屈服之余地。\n    关东招抚司兹为适应战况，统筹全局，长期平叛起见，本日移驻镇东，此后将以最坚定之决心，从事更高效之战斗，以东北工业之强，兵器之优，继续平叛，必能达到维护剿灭赤匪安定关东之目的，特此宣告，惟共勉之。"
GPSevents.15.a:0 "宣德xx年xx月xx日"
GPSevents.16.t:0 "汤玉麟突发恶疾"
GPSevents.16.d:0 "    在明军攻势受阻后，汤玉麟逐渐郁郁寡欢。尽管关东司很快在镇东站稳脚跟，但汤玉麟的身体每况愈下。在指挥之余，他总是“借酒消愁”。就算实在督军府里，他也时不时对手下大发雷霆。由于他的心狠手辣，不满情绪很快开始在关东将领中散步开来。\n    近日，镇东出现了汤总督被软禁的传闻。为了稳定舆情，防止赤匪趁机作乱，关东招抚司对外声明汤总督“因病卧床不起”。"
GPSevents.16.a:0 "汤总督可是皇上钦定的，竟然有人敢动他！"
GPSevents.16.b:0 "哼，他早该下去了"
GPSevents.17.t:0 "关东招抚司军政委员会成立"
GPSevents.17.d:0 "    在张作相、许兰州等人牵头下，关东将领将醉酒后的汤玉麟软禁在镇东的府邸之中，控制了他的亲信和家属。经过一个月左右的协商后，成立了由全体关东高级将领和部分高级行政官员组成的军政委员会。张景惠担任会长并负责组织委员会以制定作战安排和颁布行政条例。\n  在军政委员会中，会员先是各抒己见，最后投票表决。尽管官员们私下结成派系且各怀鬼胎，但这仍保证了委员会通过的决议得到了最大程度的执行，使关东招抚司没有土崩瓦解。"
GPSevents.17.a:0 "希望这能挽救关东的局势吧。"
GPSevents.17.b:0 "都什么时候了，居然还在内斗！"
GPSevents.18.t:0 "维护大明海外利益"
GPSevents.18.d:0 "如今关东战事已然平息，但原先臣服大明的朝鲜和东洋各国内部赤匪和乱党蠢蠢欲动，大明的力量在这些地区日渐式微。关东人力充足，重工业发达，为大明重新确立在朝鲜及东洋的统治义不容辞！"
GPSevents.18.a:0 "大明，天下无敌呀"
GPSevents.19.t:0 "朝鲜归附"
GPSevents.19.d:0 "自大明陷入内乱以来，张氏，赤匪，黑帮等势力开始在朝鲜明争暗斗，无视大明在朝鲜的宗主地位和利益。如今，作为大明忠心的臣子，我们再次利用外交和军事手段迫使朝鲜臣服。朝鲜会鼎力支持大明再次一统，永不再叛！"
GPSevents.19.a:0 "大明，天下无敌呀！"
GPSevents.20.t:0 "霞仪，日本归附"
GPSevents.20.d:0 "自大明陷入内乱以来，霞仪为赤匪所乱，日本日益不臣，东西不和，内部藩王，赤匪，军队等势力在日本兴风作浪，无视大明在东洋的宗主地位和利益。如今，作为大明忠心的臣子，我们再次利用外交和军事手段迫使霞仪和西日本联盟臣服。东洋各国会鼎力支持大明再次一统，绝无二心！"
GPSevents.20.a:0 "大明，天下无敌呀"
GPSevents.21.t:0 "戡平匪乱"
GPSevents.21.d:0 "随着赤底龙旗在远处的阵地上傲然升起，关东最后一座负隅顽抗的城池，终于重归大明麾下。硝烟尚未散尽，如血的残阳浸染着遍野的断壁残垣，与猎猎招展的旌旗交相映照。零星的枪声渐次沉寂，取而代之的，是明军将士响彻云霄的欢呼。\n当夜，沈阳便将这份期盼已久的捷报传遍天下。而关东招抚司所筹划的治理新策，也即将从这片染血的焦土之上，全面推行。"
GPSevents.21.a:0 "胜利属于大明！"
GPSevents.22.t:0 "汤都督打响关东剿匪第一枪"
GPSevents.22.d:0 "沈阳城头的烽火刚刚熄灭，残阳的余晖映照着遍布疮痍的城墙与广场。汤玉麟麾下的精锐部队手持都督府令牌，踏过满目残骸与焦土。百姓之中，有人伏地痛哭，也有人振臂欢呼——同产工会的旗帜已在城门下燃为灰烬，残余分子仓皇逃窜。\n面对这座残破的城市，汤玉麟一时恍若梦中。远处冉冉升起的赤底黄龙旗，宣告着沈阳重归关东招抚司掌控。这场胜利不仅彻底巩固了他作为都督的正当性与威望，更将关东大地上万千生灵的命运，牢牢握于他的掌中。"
GPSevents.22.a:0 "《为什么是这个东北人》"
GPSevents.23.t:0 "壶酒控军权"
GPSevents.23.d:0 "昨儿个黑里刷儿天儿刚蒙蒙亮，我就骑着马儿往铁岭那旮沓去瞅了瞅。你说这地方咋整的，辽东的张作相那伙人不服咱管，镇东的许兰州也是跟咱杠上了。大宁的老吴看不住场子，还有好几拨人头儿欺软怕硬，叛匪更是趁机就在山沟淌水似的往里钻，弄得百姓怨声载道。\n汤玉麟掂量着手里这把冷锋利剑，心里就琢磨——这地儿得整一整，咱关东要想团结一致，得把这些山头主义的搁到一边去。就今儿个，咱得想整哪样：是要端了他们的窝儿，还是摆个龙门阵招呼他们，抑或是把文武百官都召来喝一壶聊一聊，敲定个统一军令？"
GPSevents.23.a:0 "甭留一点儿山头主义！"
GPSevents.24.t:0 "都督的橄榄枝"
GPSevents.24.d:0 "我缪澂流啊，关东这穷山沟里混了大把年头，打仗、拉架都干过，偏就没人瞅得上。前两天，汤都督的亲信给我送信，说啥要重用我，军权也不再跟我过不去，让我当个心腹大员，还说到这东北要整他一套新玩法，我听了这话心里那叫一个痛快。"
GPSevents.24.a:0 "俺也想跟你拧成一股绳，把这地方整利索。"
GPSevents.25.t:0 "开府仪同三司"
GPSevents.25.d:0 "沈阳雪未化，来自顺天和应天的两封诏书便均送至了关东司的衙门处。虽措辞有别，然主旨如出一辙：汤玉麟剿抚有功、忠义可表，特加封‘开府仪同三司’之荣衔，准设行府，节制关东军政。\n汤玉麟望着两封诏书，心知关内各派势力正暗中角逐，欲借此拉拢关东势力。而此等局面，恰中其下怀。经汤玉麟刻意铺排之下，开府仪式隆重至极，仪仗齐整恢弘，号角声响彻长街。汤玉麟身着新制礼服，昂然立于府前石阶，军政要员咸集，皆着朝服，恭谨异常。\n开府仪式之后，汤都督即日便开始整编参谋署、设兵备处、重组情报科。伴随着一道道签发的手谕，针对关东各地的整军行动正有条不紊地展开。"
GPSevents.25.a:0 "军权归府，威加关东"
GPSevents.26.t:0 "维持军管"
GPSevents.26.d:0 "沈阳街头的铁皮喇叭又响起来了。天刚蒙蒙亮，几队新编的“巡卫大队”便扛着枪、举着“镇静、守序、听令”三字横幅开始沿街巡视。每条街口都立了新牌子：“入夜即静，违者枪决”。\n沈阳大捷后，部分咨议院代表在联席会议上提议后方可以尝试“缓一缓”，恢复部分民事管理，以抚慰民心。然而，招抚司代表在会上严正驳斥了这一说法：\n“今日非常之时，岂能言缓？谁妄言恢复常态，便是复乱之心不死！诸君当知，此非平日常议，实乃关乎生死存亡之战场！唯有维持军管，方能稳住局势。”"
GPSevents.26.a:0 "百姓苦点不要紧，乱了谁都活不成！"
GPSevents.27.t:0 "解散工协"
GPSevents.27.d:0 "沈阳铁路工会办事处的门口，一夜之间贴满了“暂时停止活动”的红纸公告，巡防队站岗如林。窗里，半截写到一半的工人代表提案还压在桌角——上头写着“希望发放冬季煤票”。可惜，没人再敢提这些事。\n都督府的命令下得很快，理由也很直白：\n“当前局势复杂，工协混乱，赤匪趁虚而入，必须雷霆手段，速战速决！”\n更狠的是，文件后头还补了一句：“不许聚众，不许请愿，不许上访。”\n不但“工人协会”作废，连厂里的“互助储金会”也被查了个底儿掉。\n某厂长偷偷嘀咕：“当初还是咱为稳住工人，照着西洋法子给建起来的，如今全砸咯……”\n却被值勤军官听了个正着，立刻摁下帽檐：“你要觉得现在不好使，可以去赤匪那边过！”\n自此之后，厂区静得出奇，连下班的脚步声都小了。有人说，早晚会有工人闹起来；也有人说，不敢了，谁闹谁消失。都督府倒是不慌，口风很硬：\n“想结社？先把叛匪打干净再说！”"
GPSevents.27.a:0 "要怪就怪赤匪太狡猾。"
GPSevents.28.t:0 "举报成风"
GPSevents.28.d:0 "为了方便群众参与维稳，地方保安队专门设立了“揭发箱”“耳目热线”“守望登记处”，还印了几千份“揭发有奖”宣传单，在大街小巷贴得比招工海报还密。\n老百姓一开始还有点疑惑，后来听说隔壁厂子的一个工人，因为“言辞消极”，被邻居写了张举报信送进去了——关了仨礼拜出来，脸都瘦了两圈。于是，这股风气就真刮起来了。\n小卖部大婶举报她家隔壁的中学生“半夜写乱七八糟的东西”；\n送水工揭发办公室有干部“总看外地报纸”；\n还有人举报自家老头“饭后不唱国歌”。"
GPSevents.28.a:0 "老百姓的眼睛是雪亮的！"
GPSevents.29.t:0 "追剿赤匪"
GPSevents.29.d:0 "天刚蒙蒙亮，汤都督身着戎装登上点将台，望着台下列队肃立的将士们，他紧了紧握拳，目光如电扫过每一张面孔。就在前阵子，赤匪在关东大地上烧杀掳掠，如狼似虎，而今虽被痛击，可他心里清楚，这些土匪如同被打散的野狼群，稍有喘息便会卷土重来。\n汤玉麟突然厉声高喝：“诸位将士，赤匪虽暂退，然其狼子野心不死！若不趁此良机一举歼灭，我关东百姓岂能安居乐业？此次‘猎狼行动’，定要干净利落！若任由那帮匪徒在庄稼地里横行，我等何以对关东父老？全军听令——给我把这帮赤匪连窝端了！”场下瞬间欢声雷动，将士们士气高昂，齐声高呼“万胜”，声震云霄。\n都督府旋即颁布严令：“奉朝廷之命，剿匪务尽！此次行动，三日后集结，七日后出发。各部务必严阵以待，若有退缩不前者，军法无情！”\n一时间，关东大地风声鹤唳，军威赫赫。"
GPSevents.29.a:0 "宜将剩勇追穷寇。"
GPSevents.30.t:0 "红祸肃清，东北解放！"
GPSevents.30.d:0 "晨曦微露，沈阳城头炮声早已停歇，硝烟被初春的风吹得一干二净。街道上的岗哨换上了整洁的新军装，沿街悬挂起“庆祝平乱胜利”的红绸横幅。老百姓三三两两站在街角，嘴里念叨着：“总算熬过来了，可把这帮赤匪给剿干净喽。”\n汤都督站在都督府前的高台上，神情肃穆，望着眼前聚集的人群。他没有高声呼号，只是缓缓举起右手。广播中传来沉稳的男声：\n“关东招抚司署令：赤匪肃清，战事已竣。自即日起，全境解除戒严，着各州县一体遵行，协力重建，以安民生。”\n人群爆发出雷鸣般的掌声与呼喊。军号响起，旗帜升起，孩子们奔跑着在旗杆下嬉闹，有人激动地落泪，有人捧出珍藏的鞭炮在胡同口点燃——这一刻，东北真的太久没有这般太平了。"
GPSevents.30.a:0 "赤祸既除，民心当归。"
GPSevents.31.t:0 "得饶人处且饶人"
GPSevents.31.d:0 "赤匪虽平，可那帮识字的也没少掺和。有些人是带头搞事的，有些人是图个热闹的，还有些人，纯粹是嘴快了点儿。以前整顿时候，抓了不少人，尤其是那些大学里头讲书的，嘴皮子溜得很，成天讲些“人民”“平权”“社会改造”，听着就让人犯嘀咕。\n可如今打完仗了，修路修桥要图纸，重建工业要会算账的，老百姓家里翻盖屋还得人画图纸画施工图。汤都督坐在沈阳的会议厅里，听着下面人念着各地重建计划书，听着听着，忽然冒出一句：\n“……哎你说，这事儿搁那些书呆子身上，兴许比我们还强点儿。”\n会议厅里一阵静，随即有人小声说：“是啊，都督，那些从前大学的先生，其实也有真本事。”\n就这样，汤都督一拍板，定了：凡曾被卷入、但未实参与暴乱的知识分子，一律予以审查后释放、分类使用。沈阳大学重新开门，关东科学馆重组，报馆也重新发刊，只是加了个都督府新闻审查处。\n不少教授被请回课堂讲课，也有被调去省里当顾问写规划书的。有人感慨：\n“都说东北只认拳头，今天我看，汤都督还真有点儿惜才。”"
GPSevents.31.a:0 "路线对了，知识越多越进步。"
GPSevents.32.t:0 "镇压叛逆"
GPSevents.32.d:0 "战事虽告一段落，阴霾却未彻底散去。仍有残余乱党潜伏城乡，煽动不满、破坏秩序、袭击运输、炸毁设施，企图以恐惧延缓东北复苏的脚步。他们如同疫病，不根除，则重建无宁日，民心无安定。\n招抚司决意以铁腕回应。我们不再视其仅为溃兵散寇，而是有组织、有意图、持续危害政权与民生的破坏运动。据此，“肃奸清逆”专项行动全面启动，旨在彻底清除这些寄生在东北肌体之上的毒瘤。\n行动首先倚赖精准情报。军警联合组成肃清别动队，在城乡建立密报网络，渗透残余组织，锁定头目与骨干。我们不强求大规模野战，而强调定点清除、夜间突袭、关键节点设伏——每一次行动皆快、准、狠，力求斩断指挥链，瓦解组织架构。\n对于捕获的破坏分子，一律依《战时特别治安法》予以严惩。主谋及实施纵火、爆破、袭击要害设施者，一经核实，立即公开处决，以儆效尤；协从及被煽动者，视情节轻重判处苦役或强制教化。刑场与监狱并非目的，秩序与威慑才是根本。\n我们同时强化基层管控。恢复保甲连坐之制，推行户籍重登记，实行宵禁与物资流通管制，切断乱党藏身与补给之源。城乡张贴告示：“窝逆同罪，报奸有赏”，动员百姓成为耳目，共建清靖之乡。\n军队不再仅仅驻防大据点，而是以排、班为单位下沉至村屯要道，设卡巡逻、验身份凭证、缉拿可疑。治安战虽无大战役之轰轰烈烈，却更考验耐心、纪律与意志。\n短短数月，百余股潜伏组织被连根拔起，千余名破坏分子落网，纵火炸轨案件锐减。百姓初时恐惧，继而安心，终踊跃配合。"
GPSevents.32.a:0 "群众的眼睛是雪亮的"
GPSevents.33.t:0 "关东人的情关东人的爱"
GPSevents.33.d:0 "东风拂面，厂区广播再次响起熟悉的旋律。往日紧闭的工协办公室，如今贴上了“欢迎回家”的标语，曾被监禁拷打的工人代表，被重新请上了座谈会的主桌。\n汤玉麟虽出身旧体制，但一路走来，他也明白了光靠铁腕终究压不住民心。过去那些闹事的“厂头”，有的现在成了车间调解员，有的被调去负责安全生产。不是他们变了，是我们终于懂得了：治理一地，靠的不是怕，是信。\n有人问汤都督：“您真信他们不再闹事了？”\n他笑了笑：“信人，比信枪管子顶着好。咱关东得有人心。”\n车间里的红布标语不再喊打喊杀，而是写着：“咱们一起把日子过好。”\n关东，终于不是一块战场，而是一块家园。"
GPSevents.33.a:0 "我从关东来，换你一身雪白——"
GPSevents.34.t:0 "厂里不出岔子，全靠这双铁拳"
GPSevents.34.d:0 "都督府这回当真是下了狠手，铁了心要整治工厂里的纪律问题。那些年月，工厂里不按章程干活、偷懒耍滑的情形屡见不鲜，直接拖累了军需供给的效率与质量。汤大都督决意，必得 “重拳出击”，整肃出一番规矩来。\n从厂长到工人，但凡有人敢触犯劳动纪律，立刻就要尝尝苦头。迟到早退、偷工减料、私自串岗…… 一概严查重处。工人们起初难免抱怨，毕竟管束骤然变严，但渐渐也明白这是为了确保前线 “枪杆子有弹药”。\n这段日子，厂子里哨声频响，监察员每日紧盯着机器与工人，不敢有半分懈怠。大伙儿都私下议论：“这纪律可不是摆样子，是真能管事！工厂不出乱子，咱们才能撑得起这场仗。”\n都督府还特意举办了几回劳动竞赛，鼓励众人争当生产标兵，力求多产多供，硬生生将铁腕管理化作了新风气。\n此番 “重拳出击”，虽说让大伙儿压力陡增，但整个军需系统倒是硬朗起来。众人心里都清楚：活儿干不好，这日子便难以安稳。"
GPSevents.34.a:0 "早该管管了！"
GPSevents.35.t:0 "开战"
GPSevents.35.d:0 "开战"
GPSevents.35.a:0 "开战"
GPSevents.36.t:0 "关东风云(1)——少年与梦"
GPSevents.36.d:0 "夜色沉下来，辽阳府的一处奢华宅邸中，20岁的王仲德在床上翻来覆去。室内的灯早熄了，屋里只剩窗外月亮投进来的一抹灰白。他迷迷糊糊地合上眼，却看见自己又回到了那条街。\n梦里，天色阴沉得像要滴下水来。街上店铺紧闭，门板上横七竖八贴着“招租”红纸，像一处处未愈的伤疤。失了业的工人倚着墙根，眼神空洞；小商人蹲在门槛上，怀里抱着算盘，却再也没有生意可算。王仲德想快步穿过人群，可每一步都像踩进泥潭，拔不动腿。他低头，看见自己仍穿着那身黑衣，腰间的手枪沉甸甸地坠着。\n拐进幽暗的巷子，阳光被高墙挡得一丝不剩。他闭上眼，指尖触到冰冷的枪柄，耳边忽然响起同学沈砚秋的声音——\n“仲德兄，你看透了没有？皇帝再改，也只是把锁头换把钥匙，门还是同一扇。同产，才是把门踹开的法子。”\n那句话在梦里像钟声一样回荡：“同产是中国的未来。”他胸口一阵发烫：只要扳机一扣，历史就会翻开新的一页，自己的名字也会写进将来的课本。\n画面一转，他又到了下关火车站。汽笛嘶鸣，人潮涌动，纸屑与欢呼齐飞。太子穿着浅色风衣，在随从簇拥下走出车厢，微笑着向人群挥手。王仲德混在人堆里，手心全是汗。梦里，他看见自己举起枪，却迟迟扣不下去——父亲的责骂、母亲的泪、少年时书房里被撕碎的策论，一幕幕叠在太子身上。\n枪声终究没有响起。梦境像被风吹散的烟，一下子碎成黑暗。王仲德猛地坐起，冷汗顺着脖颈往下淌。窗外，冬夜寂静，远处传来稀稀落落的犬吠。他摸到腰间的空枪匣，里面什么都没有"
GPSevents.36.a:0 "原来，原来是梦呀"
GPSevents.37.t:0 "关东风云(2)——会议与抉择"
GPSevents.37.d:0 "会议室内，众人沉默。良久，一位老者叹了一口气说道:“既然人都来齐了，会议就开始吧。”\n“太子于镇东遭暴徒袭击之事此前已然查明，与我们本无关系。但随着太子在开封遇刺身亡后，镇东一案被再度调查重审。通过对于当时所有在场人员的审问，专员们发现了镇东车站当时另一人意欲刺杀太子，那人……”那位老者故意顿了一下，看一下会议室内另外一人。那人双眼布满血丝，不敢抬头，双手止不住的颤抖。“就是老王家的儿子，那孩子不是当烈士的料。警卫几乎就是把老虎凳往他面前一放，他就把该说的不该说的全说了。还有那孩子提到了你。”老者指了指那个双手颤抖的人。老者突然大声说道:“那人是老王的孩子，而老王又是咱们武备系的人，现在咱们也牵扯其中了。”那人双手颤抖的更厉害了。\n “不过！”老者话锋一转“那孩子的证词里面还是有好东西的——他提到了另外一个带有同产思想的同学。这样就好办了。我们只需要和那孩子撇清关系，然后再说那孩子是受到同产会的蛊惑，我们就不仅能把损失压到最低，还能打压一下同产会的那帮人……”说到这里，老者似乎不愿再说下去，只是默默的注视着老王。\n 终于他开口了“但是老王，你的儿子是不可能保住了。意欲刺杀太子罪名很重的。”他将一张拟好的联名信放在老王桌前“这是我们的联合声明，只要签下这个，我们就能跟那孩子撇清关系了，当然，你也要按手印我们已经提前替你签好名了。”老王木讷地将大拇指按下印泥。却将要按下文件时迟疑了。\n 老者见状说道:“王先生，您得明白一点，要不是您那个宝贝儿子我们这些人完全不至于遭此劫难，我们完全可以与您也撇清关系。这样他们就完全没有借口对我们展开调查了，而我们并没有这么做，您得知好歹。”联名信上又多了一个鲜红的手印。\n随后，这场会议不知道持续了多久。老王一直盯着自己大拇指上残留的鲜红。他知道，他的手染血了……"
GPSevents.37.a:0 "染的还是他儿子的血"
GPSevents.38.t:0 "“成功”的搜捕？"
GPSevents.38.d:0 "随着“砰”地一声巨响，矿工王老二的家门被几个全副武装的关东招抚司差役猛地破开，随后这些差役不由分说便冲了进来，将正在与家人分享今天中午矿上多发的一点烤红薯的王老二挟制住。\n“你们干什么，凭什么抓我！”王老二大吼一声，挣扎着向这些凶神恶煞问道，“你们抓错人了吧！我什么都没干！”\n“什么都没干？我们抓住的同产分子少说两打了，各个都说自己什么都没干，给我带走！”\n领头的差头一挥手，王老二便在妻儿的哭叫声中被押上了囚车，在这个暗不见光的夜里，同样的事情还在许多地方上演着。\n王老二真是同产分子吗？就连逮捕他的差役自己也不知道，但是，至少他们完成了老爷们派下来的逮捕指标，至于这些无辜被逮捕的可怜人之后将会如何，谁在乎？"
GPSevents.38.a:0 "“冤枉你的人，比你还清楚你有多冤枉”"
GPSevents.39.t:0 "关东风云(3)——何去何从？"
GPSevents.39.d:0 "半夜，因事前往镇东府的老王迟迟无法入眠，烦闷难解，便动身前往他儿子当年刺杀太子的地点。\n他走过他儿子曾经穿行的街区。许多商铺仍贴着招租的告示，街上徘徊着不少无家可归的人。他想，他的儿子当年走在这里时，内心一定也很煎熬。这让他不禁回想起签署联名信之后的那一个月。\n\n政治人物往往身不由己。他为了与儿子彻底切割，不但自己不能去探监，也不准妻子前去。直到儿子当街被处决，他都没能见上最后一面。妻子得知消息后，就疯了。而就在他以为事情终于平息之时，各路媒体却没有放过他。采访、演讲、新闻发布会……每一次，他都必须把自己的儿子说成是千古罪人。他感觉内心的伤口一次次被撕开，又不得不一次次自己缝合。儿子的葬礼之后，他大病一场。\n他终于来到儿子被捕的火车站。这里早已封锁，调查取证结束后，只留了几名警察看守。他们见来者是宪政会的议员，也没有上前阻拦。\n站在这片寂静之地，他再一次想起儿子。他以前从不避讳和儿子讨论政治，或许出于某种傲慢，总觉得即便儿子有想法，也绝不会付诸行动。经历了这一切之后，他才终于开始认真思考儿子曾经说的话：“中国政治自古以来就是独裁政治，国家的一切都系于一人。一人之悲，便是帝国之悲；一人之怒，便是帝国之怒；一人之衰，便是帝国之衰。独裁政治，终是儿戏政治……”此时此刻，他似乎有些明白了。"
GPSevents.39.a:0 "只要如此，便不会变好么？"
GPSevents.40.t:0 "关东风云(4)——谈判"
GPSevents.40.d:0 "老王的客厅里，几名工人代表正气愤地盯着他和身旁的工厂老板。工人运动并未因大搜捕而停止，老王的副业——调解员，还得继续干下去。\n“小臧，您先出去一下，我跟这几位工友私下谈谈。”老王回头对工人代表们陪笑道：“真不好意思，我这人不太擅长见生人。要不这样：先请这位李先生留下来和我聊，其余几位稍等，我待会儿一个一个谈。够有诚意吧？”工人们面面相觑，最终同意了。\n“先生是姓李吧？”老王堆着笑说道，“我就喜欢和工人打交道，为啥？直爽、顾家。哪个工人不想把自家儿子养得肥肥胖胖的？”他边说边给对方倒酒，工人代表似乎有所触动。“这一点咱们是相通的，谁不想给孩子最好的呢？”工人接过酒，猛喝一口，别过脸沉默不语。\n“嗨，恕我直言，工人挣得就是比读书人少，这你我都懂。”老王凑近了些，压低声音：“孩子该上学了吧？我告诉你，公立学校那就是培养工人的地方，一辈子也教不出一个真正的读书人！我有个哥们儿办私立学校，最近经济不好，招不到人。要不……让你儿子去试试？”工人代表再次望向老王，眼中的敌意已消散不少。\n“就当交个朋友，你儿子的学费，我出！”工人抗拒地摇摇头。突然，老王眼神一变，语气锐利起来：“李先生，别以为他们整天‘工友、工友’地喊，就真把你当自己人。其实你不过是他们发声的喇叭；你不干了，他们随时可以换一个。你要真把他们当一家人，你自家人就得挨饿。这帮穷工人凑得出你儿子的学费吗？兄弟，认清现实吧。”他递出一封信，“这里面有个号码，打过去报我名字，一周内你儿子保证收到录取通知。”\n工人看着信封神色变了数次，颤抖地接过信，突然跪下磕了三个头：“谢谢王老板……我们一家愿为您做牛做马。”老王就用这个办法，逐个说服了其他工人代表。\n“小臧，进来吧！”工厂老板见状又惊又佩，忙问：“先生究竟是怎么摆平他们的？”老王淡淡回应：“工人跟你斗，无非两样：一是光脚不怕穿鞋，敢拼命；二是靠团结。一个个撬开他们的软肋，自然就怕了。用不着全部解决，把代表搞定了就行。”"
GPSevents.40.a:0 "老板千恩万谢地离去"
GPSevents.41.t:0 "关东风云(5)——情报"
GPSevents.41.d:0 "望着他远去的背影，老王脸上那副精于算计的表情渐渐消散，取而代之的是一种深切的疲惫。他缓缓从怀中取出一枚旧怀表，啪地一声打开表盖——里面藏的并非指针，而是一张少年模糊的相片。\n方才那一番威逼利诱、分化瓦解，不过是他借儿子生前留下的联络方式和暗号，演出的一场合情合理的戏。情报，就藏在那封所谓的“入学介绍信”里，顺利递了出去。\n可当客厅重归寂静，他却觉得比任何时候都要沉重。\n他想起了儿子最后一次回家时的眼神，清亮、执拗，像淬了火的刀，一字一句地说：“父亲，您永远不懂什么才是真正的大义。”\n而他拍案怒斥：“你所谓的大义，只会害死你自己，甚至牵连全家！”\n如今，一语成谶。\n是他亲手在联名信上按下血红的指印，亲自将儿子送上了绝路。可也是他，如今靠着儿子用命铺就的同产工会关系网，完成了这项秘密任务。\n窗外风声呜咽，仿佛是他内心纷杂的回响。\n他用自己最擅长的方式——分化、收买、威胁——去达成了儿子的理想；\n他背叛了自己的阶级、自己的立场，却赎不回那个少年的命；\n他按下手印时以为割舍的是软肋，如今才发现那早已成为刺进自己心头的一根毒刺，永无拔出之日。\n“我用你教我的方式，走了你坚持的路。可我每走一步，都踩在你的影子上。儿子啊……若你在天有灵，请告诉我，这究竟是救赎，还是自欺欺人？”\n怀表冰凉，贴着他的掌心。"
GPSevents.41.a:0 "而那个问题的答案，却再也没有人能够给他了。"
GPSevents.42.t:0 "加固松花江防线（1）"
GPSevents.42.d:0 "松花江上，工人们炸开了已经结起冰的河床。将松花江两岸的同胞彻底隔开，两岸的工人、士兵相互眺望，仿佛是在打量不同世界的人。\n监工看到河边有一位工人坐在石头上，同样也在呆滞的盯着那条裂开的河道。监工走了过去，坐在了那名工人旁边。\n“兄弟，最近过的还行不？”“你他妈这不废话吗？”虽然这个开场白似乎并不成功，那名工人有胳膊上缠着绷带，似乎还在往外渗血。意识到自己说错了话，监工沉默了一会儿。点了根香烟，又送给那名工人一根。“哥们，不好意思，我人有点眼拙。”“行吧，哥们，我看你也像是有话说的人。说吧，我再咋着也得对得起你这根烟。”监工开门见山的问“老哥，为啥搁这儿啊？”“你当我想啊，我本来就是个臭种地的，赶巧着农闲想着进城打打工，补贴点家用。结果刚一进城就听那喇叭喊‘共军来了，他们一来就把你们所有的东西都共产了’之类的话。我一听害怕呀，就跟着大部队跑。结果到这发现被骗了，这帮畜牲不比他们宣传的共军好到哪去，让我们修防线从早修到晚，也不给工钱。还不如留在城里，至少能跟家人死在一块。”工人说到这里，嘴巴抽了一下。指了指自己的右胳膊说:“知道这伤哪来的吗？今儿早上想家了，就想着从这跑走。结果被那帮丘八发现了，觉得把我打残了不值找不着人修防线，所以他们就拿刀给我右胳膊挖了个血窟窿。”那边工人很坦然，他的口气似乎在讲述他人的故事。监工沉默了一会儿问:“哥们，老家搁哪呢？”“搁着松花江对面了，那帮畜生宣传的共军根据地。”工人回头补充说“老实说，我感觉我现在在自己修防线，让自己回不了家。”"
GPSevents.42.a:0 "“会打回去的，一定会”"
GPSevents.43.t:0 "加固松江防线（2）——友人"
GPSevents.43.d:0 "松花江上，一条防线蜿蜒的分布在北岸。为了阻碍红军的进攻，明军特意将整个松花江的冰层炸开。明军的策略成功了，至少现在是这样的。红军的脚步终于暂时停在了松花江的南岸。就在刚刚，明军再次挫败了一次红军的攻势。开裂的松花江被鲜血染红，仿佛是一到伤疤破坏了两岸同胞血浓于水的深情。\n老白和老金坐在狭窄的战壕里，不敢站起身来，因为有红军的狙击手。“兄弟，老家搁哪儿？”老金打破了沉默“这南边的一个村子，红军的根据地。”老白问道:“那你呢，老弟？”“要靠北一点，反正沿着海。”双方的话题似乎聊完了，但老金不甘心问:“兄弟，你觉得那红军真是咱敌人吗？”“不好说”老白说道“今天早上有个红军闯进战壕，把我一个老乡给刺死了，我当时心劲一上来就开枪打了那个人。仔细一看才知道那人是我邻居老赵家的孩子，……”"
GPSevents.43.a:0 "老赵绝后了。"
GPSevents.44.t:0 "加固松江防线（3）——战场"
GPSevents.44.d:0 "冬去春来，温柔的暖流奔腾于冰层之下，不断冲击着寒冷的冰盖，希望给地面上的人们带来温暖的陪伴。但松花江上，战争仍在继续，松花江两岸的战壕中，士兵们为躲避狙击手的子弹，将点燃火光和将头探出战壕视为禁忌。老白和老金躺在防空洞里，伴着松花江北岸广播员半死不活的劝降，紧张的一天似乎终于要结束……“我日明军的祖宗！”松花江南岸的广播站中，传来了令人讨厌的声音。广播员明显被这突如其来的谩骂吓了一跳，但紧接着是他更激烈的还击。“你们红军都是王八蛋！”双方互骂，明显南岸的人不敌，就当北岸的广播员认为自己胜利之时，另外两声谩骂突然传来。双拳难敌四手，广播员的气势压不过三个人，最终，向指挥部呼叫了求援。指挥部并不认为这场失败是可以接受的。于是又抽调了更多的人加入了战场。\n松花江南北两岸的谩骂声打破了战场的寂静，寒冷的冰盖在暖流的冲击下逐渐开始融化。\n明军赢了，松花江南岸的红军再次陷入了沉寂。就当人们认为这次骂战结束时，松花江南岸传来了昂扬的歌声。明军继续反击，却发现怎样也无法盖住红军的歌唱。\n老金在防空洞里接到了意想不到的任务——编写一首痛骂红军的歌。因为他曾经系统性的读过书，还一直在军队里担任文书的职责，因为长期不需要进行文书工作，以至于老金都快忘了他曾经干过这个活。老金把自己曾写过的文章回想了一遍，想我从中摘抄写句子或者汲取一些灵感，却最终失败。于是军人老金担任了这个工作。在一开始它只是单薄的列了一些红军的罪证，可在后来，他心中压抑许久的情绪逐渐被激发了出来。他将心中所有的不满全部写了下来，以至于最后他连骂的是不是红军都要分不清了。最后，老金将这张纸交给了上司。\n松花江南北两岸，士兵们将自己长久以来压抑的情绪通过歌唱的方式传达了出来。慢慢地这场骂战的情绪逐渐开始有了转变，有的士兵点起了火光，有的士兵拿起了自己的乐器演奏，仿佛是一场盛大的欢庆。松花江南岸，有一名士兵甚至爬上了悬崖跳起舞来，南北两岸士兵有的戏谑地用手电筒照向了他。他成为了舞台上的主角。\n松花江，温暖的江水冲破了冰盖的束缚，仿佛要给人们新的开始……\n“啪！”枪声响起，那名跳舞的士兵缓缓的跪下，然后掉入了刚刚化开的冰窟窿中，鲜血染红了澄清的江水，士兵们终于闻到了死亡的腥臭味，火光被惊恐的士兵熄灭，也无人再敢歌唱。刚刚的一切，仿佛梦境一般，却又无比真实……\n老白趴在战壕的豁口上，眼神迷离，努力的想要分清楚刚刚的一切究竟是现实还是梦境。最终他看向了那个流尸的冰窟窿，他确信，刚刚发生的一切就是真的——…"
GPSevents.44.a:0 "因为这个才是战场上应有的“风景”"
GPSevents.45.t:0 "民营工厂军用化"
GPSevents.45.d:0 "看着粮食工厂重新运作起来，老杨打心里高兴:钱荒带来的经济危机不仅让他失去了大量的市场，还让他需要采购的原材料价格飙升。前一天预备能够购买500吨原材料的钱，后一天就连十吨都买不起。眼见着好不容易挺过了钱荒，却在他认为一切都能运营过来的时候，东北爆发了内乱。工人的罢工、高额的战争税收，以及原材料市场的大量流失，都对他的工厂造成了极大的打击。当时的老杨认为自己真的完了。\n转机出现了，随着民营工厂军用化，他的工厂也被列入了军用化名单。其他的工厂还有技术上的难题，而老杨的没有（军人也很喜欢用馒头做军粮），他只需要将自己的馒头直接销售给军队即可。为了保证粮食的生产，政府将粮食的原材料优先卖给老杨的工厂，解决老杨原材料不足的问题。又由于老杨可以直接将粮食销售给军队，又解决了他的市场不稳定问题。这使得他的工厂又周转了起来。"
GPSevents.45.a:0 "及时雨呀！"
GPSevents.46.t:0 "预备役"
GPSevents.46.d:0 "  松花江上，战争依然在持续。明军与红军的尸体横七竖八地倒在阵地上。士兵无法无视狙击手的压迫，不愿意因为死人再搭上几条人命。冬天封存了这些战争的罪恶，让人们可以无视过去的伤痛。但夏天不会惯着掩耳盗铃的士兵——尸体的恶臭被激发了出来，裹挟着瘟疫进入了战壕。军官团们无法无视这一敌人:他们决定要清理战壕外的尸体。\n老白从战壕中探出头来，看着浓厚的雾气遮住了他和敌方狙击手的视野，松了一口气——老白需要带领一支敢死队，趁着雾气将近岸的尸体倒入松花江中，以阻挡红军的进攻和防治战壕中的瘟疫。回头看去，这支敢死队的队员却让他放心不下——一群刚刚动员上来的预备役。这些人的年龄最大的相差可以达到十几岁，这都有一个特点:没有经历过战争。老白严肃的说:“听着到时候我让你们做什么你们就做什么。但有些事不需要我说你们也得做。那就是闭上你们的嘴，无论如何都给我保持安静。”敢死队员们点点头。这时老白突然说；“把你们的名字告诉我。”尽管众人疑惑，但还是纷纷照做。\n    当然，即使没有老白的告诫，这里的尸臭依然让那些敢死队员们不愿开口。为防止被狙击手发现，众人弯下腰将尸体堆上一辆小推车，再谨慎地沿着老白的步伐走过地雷区。到达岸边再倾斜小推车，让尸体自己滚进松花江里。众人慢不得，怕雾气消散；众人又怪不得，怕被狙击手发现。尸臭时刻刺激着他们的大脑，但死亡却逼着他们保持清醒。\n    最后一批尸体被倒入松花江，雾气将散。众人便赶紧向着战壕走去。“咔嚓！”排在队伍最后的士兵踩到了地雷，众人尚且记着老白的告诫不敢说话。老白看着那个士兵慌张的眼神说:“别怕！待会我找人帮你把这个地雷拆了，你不会死的。”老白坚定的眼神让那名士兵不由自主的点了点头。老白带着众人离去。\n     老白坐在战壕中，其余敢死队的队员围在他身旁。众人先是沉默，直到有一人突然催促的说出:“你想想办法救救他！”这句话打开了潘多拉魔盒一般引出了众人的乞求，催促声此起彼伏。老白依旧沉默，突然，老白似乎是想回忆起什么事情，却死活回忆不起来。老白的头开始疼了，此时，众人的催促声、枪炮声，以及阵阵耳鸣从他的耳朵涌入，刺痛他的大脑。他痛苦的捂住耳朵。却在此时，尸体腐烂的臭味涌进了他的鼻子。他从座椅上倒下，脸埋进土里，甚至于泥土都塞进了嘴里都毫无察觉。他紧紧抓住了身旁的木板，希望缓解些许疼痛。“轰！”一声爆炸声传来。众人惊恐的看向爆炸声传来处。终于，老白终于想起来他忘记的事情——"
GPSevents.46.a:0 "刚刚踩到地雷的士兵叫做张百岁……"
GPSevents.47.t:0 "反攻"
GPSevents.47.d:0 "反攻要开始了，明军正在用火炮不停的轰击着红军的阵地。李军趴在战壕的豁口上，默默的根据着火炮的声音来猜测这些火炮的口径和型号——这是他从军如此之长时间里为数不多的娱乐方式。一般来讲，这样的炮击要持续一两个月，且炮火声会积极的密集。可是如今他感到有些奇怪——他是前天接到了反攻的命令，可是炮火声昨天才开始。意识到这点。李军将头探出战壕，看到了让他惊讶的一幕:炮弹虽然稀疏，但几乎每一发都精准的落在了红军的碉堡上，红军阵地上惨叫声此起彼伏。李终于理解了他上司的话“此战我军准备良久，望诸位奋战！”确实啊，几个月来，明军虽然一直坚守在松花江北岸，却在不断准备着此次反攻，从军事装备的换新，到战壕中的新面孔，都是厚积薄发的体现。李军看了看手中的枪，指尖上的力度不仅增加了几分，他知道接下来就是他的任务了。\n随着一声尖锐的哨响，反攻终于开始了。李军飞速爬出战壕，向着红军阵地冲……"
GPSevents.47.a:0 "冲锋！"
GPSevents.48.t:0 "厂里又整幺蛾子了"
GPSevents.48.d:0 "近来，沈阳兵工厂接连出现设备失灵、工序混乱、物资短缺等问题。都督府最初以为是赤匪余孽捣乱，严查之下却发现，许多问题并非出自有组织破坏，而是基层工人缺乏沟通、劳资矛盾激化，甚至部分干部瞒报冒领物资，造成工人情绪激烈反弹。\n更严重的是，旧工协被解散之后，不少工人觉得“连个说理的地儿都没了”，私下组织“联络会”“互助组”，虽未明确反叛，但倾向危险。\n汤都督眉头紧锁，在会议桌前敲着烟锅，听完通报之后，沉声说道：\n“这事儿……不能光靠抓人。抓是得抓，但也不能光整狠的。要不，就两条道：要么咱重新整一个咱能管得住的工协，让工人有话说；要么，把劳动规矩一条条写死了——谁越线，撵出去！你们说说吧。”"
GPSevents.48.a:0 "给他们个能说话的地儿，咱重新搭个工协出来"
GPSevents.48.b:0 "人多嘴杂容易出事，规矩先立好，军纪往上靠。"
GPSevents.49.t:0 "关东重建"
GPSevents.49.d:0 "战争给了我们关东沉重的一击，但这并不能阻挡这片土地复苏的脚步。重建关东是一段熔铸信念与血汗的历程。硝烟虽散，疮痍仍遍布城乡——倒塌的墙垣、断毁的铁路、荒芜的田地，以及无数无家可归之人的眼神，无一不在诉说这场劫难的残酷。\n然而，苦难从不能压垮真正团结的人民。在招抚司的统一调度下，一场规模空后的重建事业如火如荼地展开。军队并未因战事结束而撤离，工兵部队带头清理废墟、修复桥梁道路；医疗队深入乡镇，建设临时医馆，救治伤员、防控疫病。大批原先支援前线的民夫队伍转身投入耕作与厂房修复，播下灾后第一茬粮食种子，抢修机械，誓要让烟囱再度冒烟。\n民间力量也以前所未有的热情响应号召。商人捐钱捐物，学子组织义学，妇女结成互助会照料孤儿、为工人备炊送粮。 “一切为了东北重生” —— 这样的标语贴满大街小巷，也烙在每个人心中。短时间内，七大主干铁路相继恢复通行，主要城际电报线路全线接通；随着时间的推移，奉天、辽阳、吉林三大机械厂已部分复产，制造出第一批战后农机具和重建物资。\n我们深知，战争创伤的愈合非一日之功，真正的复兴仍面临无数困难。但关东人民有能力、有意志在废墟中站起，并建设一个崭新的家园！招抚司已颁布“战后复兴三年方略”，接下来的每一步，都将以坚韧和智慧书写。凛冬已过，春芽正发，东北的明天，正在万千勤恳的双手中变得清晰起来。"
GPSevents.49.a:0 "关东复兴！"
GPSevents.50.t:0 "恢复工业产能"
GPSevents.50.d:0 "战争的创伤在厂房与车间之间留下了最深的疤痕。高耸的烟囱沉默，流水线锈迹斑斑，精密车床覆满尘埃——曾经轰鸣不息的东北工业心脏，几近停滞。然而我们深知，若无一流的工业，便没有自立的东北。机床不转，何来农机与机车？钢厂不红，何来铁轨与机械？工业，是东北命运的支点。\n复兴的第一步，是让沉睡的巨人重新站起。招抚司统筹设立“东北工务整顿委员会”，系统普查五省之内遭破坏的主要厂矿，按战略急需程度、复工难度与资源禀赋，分级制定重建时序。从机械制造、军械维修到矿产深加工、化工原料生产。\n大型国有工厂率先行动。奉天兵工厂、本溪钢铁厂、鞍山轧钢厂等核心企业，由军工单位与工程专家联合进驻，清废墟、修顶棚、校设备。许多精密仪器和专用机床短时间内难以补充，便组织技术骨干彻夜攻关，用土法改造、跨厂调件、手工仿制，硬是拼出一条复产之路。\n中小私营工厂也未遭忽视。招抚司推出“机具贷放”与“原料配给”制度，向民间厂主出借机床、发放煤炭与钢材配额，鼓励承接零部件外包与民生用品制造。一批曾被迫停产的老字号铁厂、棉纺厂、机车配件作坊，在政策扶持下陆续点火生烟。\n我们格外注重“技工归队”。通过登报寻访、厂区召集和技师登记，原产业工人被迅速组织回厂；同时设立多个速成技训班，招募前线退伍兵与城乡青年，传习车、钳、铆、焊诸艺。老师傅手把手带新人，灯火通明的夜校与彻夜轰响的车间，交织成东北重建最动人的夜曲。"
GPSevents.50.a:0 "机械的轰鸣声再度响彻关东！"
GPSevents.51.t:0 "大基建时代"
GPSevents.51.d:0 "战前的东北曾以纵横交错的铁路、高效运转的港口和遍布城乡的电报网络而自豪，它是帝国工业化和现代化的标杆。然而，同产工会逆党在溃败之际，对桥梁、铁轨、电厂、通讯设施进行了系统性的破坏，企图从根本上摧毁东北复兴的根基。\n战后，我们清醒地认识到：没有畅通的血脉，便没有强健的躯体。基础设施不仅是物资流动的通道，更是主权贯彻、民生恢复和经济重建的命脉。因而，“东北基础重建与现代化计划”被确立为招抚司战后治理的核心国策之一，这不是简单的修复，而是一次全面的升级与再创造。\n工程从主干交通线展开。工兵部队与民用工程队合力，一方面修复被炸毁的铁路桥、清理瘫痪的隧道，另一方面拓展原有线路，将战略铁路延伸至边境和资源产区，确保军事与经济的双重安全。主要城市之间重建双轨电气化铁路，提高运输效率与运力；港口码头设施进行疏浚和加固，重新开通营口、大连等深水港，恢复海上贸易通道。\n与此同时，电力与通讯网被列为优先重建项目。大型火电站与水电站得到修复和扩建，高压输电线跨区域架设，将电力送往偏远城镇与新建工厂，保证复产和民生用电。电报、电话线路全面更新，并开始试验性地建设城市间的无线电通讯网络，以加强各地信息的即时传递与招抚司的管控能力。\n此次重建，格外注重系统性与抗毁性。主要枢纽设施增设防护措施，关键节点预备备用线路，以防再度遭到破坏。我们不仅是在复原东北的“钢铁骨架”，更是在为将来三十年的发展打下坚实基础。"
GPSevents.51.a:0 "建设我们的家园"
GPSevents.52.t:0 "戡乱体制"
GPSevents.52.d:0 "近期持续发生的破坏活动表明，零星的清剿行动虽能一时打击乱党气焰，却难以从根本上遏止动荡蔓延。面对这一严峻挑战，招抚司决定突破常规应对模式，进行体制层面的彻底革新，建立一套系统化、常态化的戡乱体系。\n据此，《东北戡乱时期特别体制组织纲要》正式颁布，标志着戡乱工作从临时性军事行动向系统性治理的重大转变。该体制核心在于“事权统一、分层响应、教化兼施”，首先设立了东北戡乱总指挥部，全面统筹军队、警察、行政及民间力量，实现了跨部门情报即时共享和行动无缝协同。各地相应成立戡乱执行委员会，确保指挥链条直达基层村社。\n与此同时，《戡乱时期特别治安法》出台，明确定义了破坏活动的界限及其量刑标准，并设立特别法庭专司审理。这套法律体系强调程序合规和证据严谨，力求在严厉打击破坏活动的同时，最大限度避免冤错，维护政权公信力。\n戡乱体制建设不仅侧重于惩处，还注重疏导教化。针对情节较轻的协从者和受蒙蔽群众，惩教所内开设了技能工读班，通过劳动训练和思想矫正助其回归社会；另一方面，通过张贴告示、印发宣抚手册、组织观看教化剧等形式，公开揭露乱党煽动手段，广泛宣传重建政策及安定秩序的重要性。\n通过强化基层社会治理，关东全面恢复并严格实行户籍核查与连环互保制度，同时对旅店、铁匠铺、印刷所、粮行等关键行业实施登记和动态监察，鼓励民众检举异常并予以重奖，彻底压缩乱党的生存与活动空间。"
GPSevents.52.a:0 "郡县治，天下安"
GPSevents.53.t:0 "军事研发"
GPSevents.53.d:0 "日前，一批青年军官联名上书，痛陈技术落后之弊，强烈呼吁加快军事科研与装备更新步伐。这些声音引起招抚司高度重视，经过深入研讨，决定启动“军事研究与武备更新计划”，全面提升东北国防力量。\n该计划首先从重构军事科研体系入手，整合原分散于各兵种的研究单位，成立直属招抚司的“东北军事研究院”，集中力量攻关重点领域。研究院下设战车、火炮、通信、航空等多个研究所，广泛吸纳军工专家、工程师和具有实战经验的青年军官参与研发工作。为提高研发效率，招抚司特别批准研究院可直接调用各兵种试验场和军工生产线进行实测试制。\n此外，计划还强调军事理论与装备实践的紧密结合。定期组织研究院与一线部队交流研讨，确保研发方向紧贴实战需求；同时在主要军事院校开设现代化战争理论课程，培养具有创新思维的新型指挥人才。\n为确保计划顺利实施，招抚司大幅增加军研经费投入，建立专门的人才引进和激励机制，对关键技术突破给予重奖。此外，还建立了季度汇报和评估制度，由招抚司直接监督各项研发进度。\n一、炮队配置：后仗炮队当为火力后援之中坚。择地部署炮阵，务求精准，专攻敌之集结重地、指挥中枢等要津。炮队尚需与步队诸军缜密协同，以收火力合璧之效。\n二、战车部队之运用：战车部队当为迅捷反应之主力。侦敌虚实后，铁甲利刃直刺敌之脆弱处，借其高速驰突、远程轰击之能，迅猛揳入敌后，乱其阵脚。若战局不利，机械部队亦当殿后，掩护诸军有序撤退。\n三、侦敌与策反：为使战策有的放矢，情报搜集至为关键。派遣精干斥候深入敌后，刺探军情。另辟策反蹊径，以金帛、爵禄诱敌将，或以游说、离间惑其心，削弱敌阵。\n四、诸军协同：各部诸军之联络配合，关乎战局成败。战术实施时，各部队必须令出如山，动作协同，杜绝各行其是。后勤辎重部队亦需恪尽职守，确保粮秣军械及时输送前线。\n五、兵员操练与武备更新：提升士卒战力，端赖平素严谨训导。当定期组织操演，磨砺士兵技艺、体魄及心智。同时，注重兵器修葺与更新，使我军装备精良，以应复杂战局。\n关东招抚司高层将领们在会议中达成共识，将采取上述新式作战方法。这些策略旨在有效应对未来战争威胁，稳定关东局势。"
GPSevents.53.a:0 "武器技术是当代战争的关键"
GPSevents.54.t:0 "强化教育宣传"
GPSevents.54.d:0 "根据文化部门的社会调查发现，敌对意识形态此前在东北地区的渗透与传播，其深层原因在于本土文化教育的薄弱与缺失。民众思想若无人正确引导，便极易被虚妄之言所蛊惑。招抚司经深刻反思后认定，文化教育绝非软性点缀，而是关乎人心向背、政权稳固的根本大计，必须予以彻底重建。\n此项重建工程首重教育内容之根本革新。招抚司责令成立“教材编纂局”，全面废止原有充斥谬误的课本，重新编写国文、历史、地理及公民教育教材。新教材突出传统文化精髓、忠孝节义思想，着重阐释东北地域文化之独特性与重要性，并明确批判赤色思想的危害性与虚伪性，从根源上筑牢思想防线。\n师资队伍的建设被置于关键位置。招抚司设立“师范传习所”，对全东北现有教员进行集中轮训，灌输新的教育理念与政治要求；同时广泛招募爱国知识分子与德行高尚的宿儒，经过严格政审后充实教师队伍，确保教育主导权掌握在可靠之人手中。\n在教育体系拓展方面，计划不仅限于普通学校。一方面大力兴办民众夜校与识字班，强化对成年人的思想教育与文化普及；另一方面建立覆盖城乡的阅报处、宣讲所，定期组织宣讲队下乡，通过通俗易懂的方式传播正统文化，批驳异端邪说。\n除了教育领域外，关东司还资助创办《东北新报》等一批新报刊，开设“复兴副刊”宣传传统美德与重建成就；鼓励创作反映东北历史荣光与重建题材的文学作品、戏剧歌谣；恢复传统节庆与民间民俗活动，增强民众的文化认同与归属感。"
GPSevents.54.a:0 "文化防线！"
GPSevents.55.t:0 "构建新工协"
GPSevents.55.d:0 "工人群体的组织形态与动员效能，直接关系到东北工业血脉能否重新奔涌。旧有行会散漫无力，赤色工会更曾将生产引向对抗与混乱。招抚司深刻意识到，必须构建一套置于有效管理之下、真正服务于生产重建的新型工人组织体系。\n据此，“东北新工协”的组建被提上日程。新工协的各级架构与招抚司工业管理部门紧密对接，其总会设在奉天，之下按行业和行政区划设立分会与支会，形成一张覆盖全境、直通厂矿的垂直管理网络。\n新工协的核心职能被明确界定。首要任务是配合完成生产计划，组织劳动竞赛，推广先进操作法，协助解决原料调配与设备维修等生产难题。其次才是有限度地调解劳资纠纷、经办工友福利，且一切活动不得影响正常生产秩序。\n人员的选任至关重要。新工协各级负责人不再由简单选举产生，而是采取推荐与委派相结合的方式。多数干部从表现忠诚、技术过硬的老工人或退役军工中选拔，由招抚司进行统一培训后派驻各厂，他们既懂生产，也明大势，确保组织牢牢掌握在可靠者手中。\n为确保思想统一，新工协建立了常态化的学习制度。通过定期组织读报、宣讲政策、学习模范事迹，将“努力生产就是支援重建”的理念灌输给每位成员。同时，它也是招抚司在工人中的耳目，负责收集舆情、排查隐患、报告怠工或破坏行为，成为维护生产秩序的重要辅助力量。"
GPSevents.55.a:0 "有效管理"
GPSevents.56.t:0 "强化劳动纪律"
GPSevents.56.d:0 "生产线上屡屡发生的怠工、旷工与私自停工现象，已严重威胁东北工业复苏进程。部分工人视厂规为无物，将生产任务置于一旁，甚至沿袭旧工会恶习，动辄以罢工要挟。此种行径不仅破坏生产秩序，更助长不良风气，若任其蔓延，重建大业将无从谈起。\n招抚司决意彻底扭转这一局面，颁布《东北地区工矿企业劳动纪律整肃条例》，启动专项治理行动。此次行动超越一般劝诫，强调规则刚性、监督严密与惩处严厉，旨在重塑“劳有所纪、勤有所得、怠有所罚”的生产秩序。\n纪律重塑首重规则明晰。条例详细规定工时、岗位、操作、安全等各项规范，明确禁止无故怠工、旷工、私自离岗及煽动停工等行为，并将遵守纪律列为工人考评核心指标。同步推行“工岗配对”制度，每位工人均需签认岗位责任书，确保纪律要求落实到人。\n监督机制全面加强。各厂设立劳动纪律督察岗，由招抚司直接选派纪律督察员驻厂，实时巡查记录，兼受工人互相监督举报。屡有情况之厂矿甚至组建由退伍军士组成的厂内纠察队，维护生产现场秩序，快速制止违规行为。\n严格执行阶梯惩处。初犯者予以教育警示，再犯扣减工资配给，累犯或情节严重者则送交劳动教化营进行强制改造，直至吊销工籍、列入用工黑名单。同时，对恶意煽动破坏生产、组织非法罢工者，一律按戡乱法规移送特别法庭审理，重者可处苦役乃至极刑。\n该行动亦重视正向引导，定期评选“劳动模范班组”与“纪律标兵”，给予额外粮食奖励与公开表彰，树立“守纪律、促生产”风气。厂区遍布“纪律即忠诚”、“效率即贡献”等标语，广播早晚播报纪律提醒，强化集体意识与责任伦理。"
GPSevents.56.a:0 "管理生产"
GPSevents.57.t:0 "会见武备系官僚"
GPSevents.57.d:0 "顺天政府的旌旗已插遍江北，其势如破竹，俨然已具新朝气象。而在这股洪流之中，真正掌握核心权柄的，绝不仅是台面上的元帅督抚，同样包括了群深谙组织、补给、谋略的武备系官僚。他们虽不轻言于众，却实际影响着着兵工厂的产出、铁路的调度、军饷的发放与人事的任免，在顺天政府中有着不可小觑的力量。而作为内战前大明咨议院的第二大派系，武备系同样在关东地区有着不小的影响力。\n招抚司的特使正是在此微妙时节，于深夜密会了武备系的核心人物。会谈之地不在帅府，而选于一间不起眼的商会俱乐部，窗外是沉寂的市街，室内只留一盏台灯，映照双方晦明不定的神情。\n对方并无寒暄之意，开门见山：“关东的底细，我们清楚。你们能支撑至今，不易。但天下将定，你们是愿作壁上观，待日后被清算；还是及早筹谋，在新朝中占一席之地？” 其言辞冷静，不带威胁，却字字千钧，透出对实力的绝对自信与对大局的掌控欲。\n我方代表亦早有准备，不卑不亢回应：“东北所求，非苟全，而在共治。武备系诸位大人既掌实务，当知关东之工业、资源、人力，非但不是负担，反倒是逐鹿中原后，重建社稷最亟需之本钱。然硬弓易折，纵是顺天，想平稳接收这片土地，也需合作而非征服。” 谈话核心旋即转向具体筹码：东北的兵工产能如何整合、交通命脉如何共管、现有官员如何安置，以及——最关键的是——在未来权力架构中，关东集团能获得何种保证。\n一场冰冷的利益交换与政治谈判正稳步进行着。武备系官僚看重的是关东庞大的工业体系和未遭战火彻底摧毁的熟练工人，他们需要这套系统为其全国政权服务；而我们则需借其渠道，将我们的实力转化为在新朝中的制度性权力。"
GPSevents.57.a:0 "各取所需罢了"
GPSevents.58.t:0 "密会交通系"
GPSevents.58.d:0 "西北军的铁蹄已踏破数省，兵锋所向，势不可挡。然而，真正维系这支庞大军团命脉、决定其能走多远的，并非仅是前线的悍将，而是深处后方、掌控着铁路调度、物资输送与金融动脉的交通系集团。他们无声无息，却已凭此乱世积攒下足以左右王朝未来的实力。\n招抚司的密使于子夜时分，悄然抵达约定的地点——一列停靠在昏暗侧线、守卫森严的豪华专列客厅中。窗外万籁俱寂，唯有蒸汽管道偶尔嘶鸣，车内水晶吊灯的光晕下，对方主事者神色莫測。\n没有虚礼，对方径直开口，指节轻叩铺着地图的桃木桌面：“天下的局势，已经愈发明朗。锦逆负隅顽抗，败亡不过是时间问题。关东的朋友是聪明人，当知顺势而为的道理。倘若执意与大势相悖，待天兵犁庭扫穴之时，再想转圜，只怕为时已晚。” 此言并非简单的威胁，更像是一份基于冷静实力评估的、不容拒绝的合作邀约。\n我方代表敛容应答：“东北的价值，绝非等待接收的残破产业。我们拥有完整的工业体系、训练有素的劳工与稳定的后方，这一切正是任何一个新朝奠定根基所急需的基石。然基石若安置不当，再高的台阁亦有倾覆之危。我们所求，不过是一个公允的安置。”\n话题迅速越过寒暄，直指核心：如何将关东的实体力量转化为新朝中的结构性权力。西北需要我们的资源来巩固胜利，我们需要他们的渠道来确保政治生存与延续。"
GPSevents.58.a:0 "识时务者为俊杰嘛"
GPSevents.59.t:0 "谁主沉浮？"
GPSevents.59.d:0 "东北的重建已初见成效，机器重新轰鸣，街道恢复秩序，学堂再度书声琅琅。然而，一个根本性问题日益紧迫地摆在所有关东人面前：我们浴血奋战重塑的东北，究竟将走向何方？是偏安一隅，自成天地？还是挥师向西，去争夺那早已混乱不堪的关内主导权？这场关乎命运的辩论，在招抚司高层、军中将领乃至民间智士间激烈展开，逐渐形成两条清晰对立的路线。\n第一条路线：联合自强，固本以待时。\n持此论者多为务实派官员与部分本土商绅。他们认为，东北历经战乱，元气初复，当务之急是巩固根基，消化成果。主张承认关内现存政治势力的事实存在，与其建立正式联络渠道，尝试以对等地位商讨联合事宜，共组一个包容性的全国政权。他们强调，关内情势复杂，各派人马混战不休，贸然卷入非但难以掌控全局，反可能拖累东北建设，耗尽我们辛苦积累的财力兵力。不如选择静待关内局势稳定，再行加入锦、庆二藩中的胜利一方。\n第二条路线：入主中原，鼎定天下。\n此路线以军中少壮将领与激进派文官为主力。他们慷慨激昂地指出，东北的复兴绝非为了偏安，历史的机遇窗口稍纵即逝。当前关内政权腐化无能，无力结束割据混乱，正亟待一股强大的新生力量去重整河山。他们主张，东北应迅速集结精锐，打着“清君侧、靖国难”的旗号挥师入关，以强大的军事力量和高效的组织体系为后盾，夺取中央政权，将东北的成功模式推广至全国。他们认为，唯有掌握中枢，才能真正保障东北的长远安全，实现“东北主导的大明复兴”。"
GPSevents.59.a:0 "联合自强，静待关内决出胜者"
GPSevents.59.b:0 "挥师入关，我们也要奉天靖难！"
