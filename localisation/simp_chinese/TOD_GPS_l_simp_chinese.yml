GPS_fenhuadangdijiangling:0 "分化当地将领"
GPS_fenhuadangdijiangling_desc:0 "汤都督虽出身于警察-检察系统，后期转至军中任职，但其早年的履历使他在军中的认可度不高。加之汤玉麟与前任东北军区都督的失势有着千丝万缕的联系，导致许多东北军将领对他持保留态度。然而，世事无绝对，只要我们展现出足够的诚意，相信在东北军区本土将领中，定有不少识时务的俊杰愿意与我们携手合作，共同为东北的安定和繁荣贡献力量。"
GPS_qianghuazhihuiquan:0 "强化都督府指挥权"
GPS_qianghuazhihuiquan_desc:0 "此前，东北军区的多位中高层军官在朝廷的严密审查中相继落马，导致了中枢指挥体系的极度混乱，这在镇压东北赤匪的军事行动中显现出了诸多棘手问题。鉴于此，当前的首要任务是重新巩固中枢的军事指挥权，构建以都督府为主导的军事指挥体系。"
GPS_junlingzaitonghe:0 "军令再统合"
GPS_junlingzaitonghe_desc:0 "除了亟需强化中枢指挥体系外，我们还必须实现军事指令的统合，彻底消除令出多门的混乱局面。为此汤玉麟大都督已下定决心，将精力集中到军事上来，以重振东北军区的军事指挥能力。"
GPS_zhenglingguiyi:0 "政令归一"
GPS_zhenglingguiyi_desc:0 "除了军事方面，政治同样是汤玉麟大都督密切关注的重要领域，因为军事作为政治的延伸，两者紧密相连。虽然汤大都督会亲自专注于军事指挥，但我们也会委派他的亲信参与东北地区的政务管理，以实现军政合一的目标。这样，都督府便能真正发挥其在东北地区的最高军政机关的作用，确保军事和政治的协调与统一，为东北的安定与发展提供坚实的保障。"
GPS_weichijunguan:0 "维持军管"
GPS_weichijunguan_desc:0 "尽管政府系统中有部分官员提出，在后方地区适度放宽军管、恢复常规社会秩序的建议，但汤玉麟大都督对此持有坚定而明确的反对立场。他认为，这种看法过于短视，缺乏长远考虑。当前，各地的赤匪活动依然频繁，一旦放松监管，势必会导致本已受到压制的叛乱再度抬头。因此，必须继续实施严格的军管措施。为今之计，只有苦一苦百姓，骂名由都督府来担了！"
GPS_jiesangongxie:0 "解散工协"
GPS_jiesangongxie_desc:0 "工人协会是赤匪发展的重要渠道，尽管许多工协是企业为对抗激进思潮而设立，但在当前的复杂局势下，要清晰界定哪些工协已被渗透，哪些仍坚定支持朝廷，已变得异常困难。现今最好的办法，先停止一切工协活动，扼制工人串联。"
GPS_shengchanjunshihua:0 "生产军事化"
GPS_shengchanjunshihua_desc:0 "在强制终止工协活动之后，我们将对部分工厂的生产实行严格的军事化管理，以确保生产纪律的严格执行，并保障前线军需的稳定供给。"
GPS_dongbeianminling:0 "东北安民令"
GPS_dongbeianminling_desc:0 "东北安民令的颁布，旨在通过强化管理与规范行为的方式，确保东北地区的社会稳定与民众安宁。同时，法令鼓励民众积极检举揭发不法行为，共同维护社会的公平正义。我们呼吁广大民众擦亮双眼，明辨是非，自发对抗极端思潮下的暴乱，共同守护家园的安宁与和谐。"
GPS_zhuijiaochifei:0 "追剿赤匪"
GPS_zhuijiaochifei_desc:0 "尽管我们在正面刚战场上一度取得优势，但是万万不可掉以轻心，我们必须集中全军力，尽快追缴扫平赤匪！"
GPS_gongshishoucuo:0 "攻势受挫"
GPS_gongshishoucuo_desc:0 "面对辽阳沈阳的相继丢失，我们的军队最终受挫于坚城之下，几乎丢失了整个辽东地区。"
GPS_zhuanzhanzhengdong:0 "转战镇东"
GPS_zhuanzhanzhengdong_desc:0 "随着辽阳、沈阳的沦陷，吉林长春地区作为我们的军事指挥所，其安全性已显著降低，显然已不再稳妥。经过都督府内部的深入商讨与审慎考虑，决定将治所迁移至镇东地区，这无疑是一个明智且富有远见的决策。此举旨在确保指挥所的安全与稳定，以便我们能够继续有效地指挥作战，保卫国家的安全与利益。"
GPS_jiakongtangdudu:0 "架空汤都督"
GPS_jiakongtangdudu_desc:0 "汤玉麟原本是警察与检察系统的出身，对于军务确实缺乏深入的了解与经验，此前辽沈一战的失利便充分暴露了他在这方面的不足。如今，经过军方各位将领的慎重协商与权衡，大家一致认为，是时候让汤都督暂时“退居二线”，将指挥权交给那些具备丰富军事经验的专业人员了！"
GPS_jianglingjitilingdao:0 "将领集体领导"
GPS_jianglingjitilingdao_desc:0 "在“恳请”汤都督暂时退居二线后，我们迅速在军事领域构建起了“将领集体领导”的指挥体系。通过精心划分各自防区，实现权责明确，确保在日常军事事务中，将领们能够迅速作出决策，有效应对各种情况。而在面临重大军事决策时，我们则采取集体商议的方式，汇聚众智，确保决策的正确性。以保证在战争局面不利的当下，在军事上更好的防御来自敌人的袭击。"
GPS_minyonggongchangjunyonghua:0 "民营工厂军用化"
GPS_minyonggongchangjunyonghua_desc:0 "随着辽东地区丢失，我们手中的军工产能已然大幅降低。为了保证前线作战的军备供给，我们必须将现有的工业产能进一步像军事倾斜。在危机情况下，我们将征调自己控制区的各类民营企业来从事军工生产，以实现民营工厂军用化。"
GPS_kuodawuqichanneng:0 "扩大武器产能"
GPS_kuodawuqichanneng_desc:0 "在一系列军用生产中，武器装备无疑是最重要的。尽管我们丢失了作为军工重地的辽沈地区，但好在我们及时撤离除了部分技术人员。在他们的指导下，我们将快速扩大自身的武器产能，以适应愈发不利的作战局面。"
GPS_jinjishengchanfaan:0 "紧急生产法案"
GPS_jinjishengchanfaan_desc:0 "在当前的工厂规模限制下，满足百姓日常生活需求以及前线紧迫的军需物资，无疑是一项艰巨的任务。为了显著提升产能，我们决定颁布紧急生产法案，以“合理”的方式延长工人们的工时。东北的军民将齐心协力，共同面对这一艰难时刻，共克时艰！。"
GPS_jiagusujiangfangxian:0 "加固松花江防线"
GPS_jiagusujiangfangxian_desc:0 "在现有形势下，快速消灭赤匪已经成为一个可望不可及的事情。我们将依托松花江重整防线，积极整备军队以待反击。"
GPS_dongyuanyubeiyi:0 "动员预备役"
GPS_dongyuanyubeiyi_desc:0 "在同产逆党的渗透影响下，我们的军队损失十分严重。如果要想稳住摇摇欲坠的防线乃至发动反攻，就必须将现有的人力动员起来！"
GPS_xunqiuhaiwaizhiyuan:0 "寻求海外援助"
GPS_xunqiuhaiwaizhiyuan_desc:0 "相较于关内的混乱局面，天朝体系的海外各邦有许多依旧保持了稳定。如果我们想要得到援助，那么寻求他们的帮助也许是个不错的选择。"
GPS_fangshouyibo:0 "放手一搏"
GPS_fangshouyibo_desc:0 "挥师出击，放手一搏！"
GPS_xuangaopingluanshengli:0 "宣告平乱胜利"
GPS_xuangaopingluanshengli_desc:0 "历经东北的大混乱后，终于肃清了那些该死的赤匪，和平与稳定再次降临在我们的土地上，欢呼吧，迎接一个没有赤匪的新东北！"
GPS_huifuzhanzhengchuangshang:0 "恢复战争创伤"
GPS_huifuzhanzhengchuangshang_desc:0 "战争给了我们东北沉重的一击，但这并不能阻挡东北的发展。军民同心沆瀣一气，为东北的战后重建而奋斗。"
GPS_goujianxingongxie:0 "构建新工协"
GPS_goujianxingongxie_desc:0 "通过构建受政府管理的工人协会体系，我们能够实现对工人群体的有效组织与管理，从而有力地推动工业生产的恢复和发展。"
GPS_gongrenbaozhangfangan:0 "“工人保障方案”"
GPS_gongrenbaozhangfangan_desc:0 "过去有些工厂太不人道了，对工人的压迫和剥削令人发指，这才让赤匪们有机可乘，蛊惑了一大批可怜的的工人给他们卖命。政府是时候要管管那些吸血的资本家了。"
GPS_fenhuagongrenqunti:0 "分化工人群体"
GPS_fenhuagongrenqunti_desc:0 "表面上团结的工人其实内部有很多矛盾，我们必须利用这些矛盾分化他们，让他们忙于内斗而不是反对政府。先给那些老实工人点好处，让他们不要瞎掺和激进工人和政府之间的事。"
GPS_wenqingmomo:0 "温情脉脉"
GPS_wenqingmomo_desc:0 "是谁说只有赤色政权才能让老百姓过上好日子？我们一样能给予老百姓幸福美满的生活！跟着政府走，有肉还有酒！"
GPS_qianghualaodongjilv:0 "强化劳动纪律"
GPS_qianghualaodongjilv_desc:0 "一些工人太无法无天了，想罢工就罢工，这怎么能行？政府必须要强化劳动纪律，让那帮不懂事的工人明白明白，听话才有饭吃。"
GPS_channengdiyi:0 "产能第一"
GPS_channengdiyi_desc:0 "一切都要为战后重建让路，现在的辛苦是为了以后的幸福，工人们好好加油干，等战后重建工作结束了，你们就是头一号功臣！"
GPS_jinjuejiduansixiang:0 "禁绝极端思想"
GPS_jinjuejiduansixiang_desc:0 "一直以来，政府对极端思想的管控都太不严厉了，社会上思想混乱，各种极端思想大行其道，是时候彻底肃清这些极端思想了，把那帮妖言惑众的人都抓起来处死！"
GPS_zhongquanchuji:0 "重拳出击"
GPS_zhongquanchuji_desc:0 "对于不听话的人和群体，必须采取强制的措施，只有重拳出击，才能保证社会的稳定，才能保证战后重建的有序进行"
GPS_xiufugongchang:0 "修复工厂"
GPS_xiufugongchang_desc:0 "战后并不是一切的结束，而是重建和振兴的开始，我们必须在废墟之上重建东北，就先从修复工厂开始吧！"
GPS_wanshanjijian:0 "完善基建"
GPS_wanshanjijian_desc:0 "战前东北先进发达的基建一直是我们的骄傲，但那些卑鄙阴暗的赤匪竟然敢大肆破坏。东北的发展与繁荣，离不开完善的基建。战后完善基建，是我们对东北未来复兴的承诺。"
GPS_zhenyapohuaiyundong:0 "镇压破坏运动"
GPS_zhenyapohuaiyundong_desc:0 "什么竟然还有破坏运动？这些祸害东北人民的乱党什么时候才能从东北滚出去啊，派军队去镇压，所有参与破坏活动的人，全部处决，一个都不能放走。"
GPS_goujiankanluantizhi:0 "构建戡乱体制"
GPS_goujiankanluantizhi_desc:0 "不断出现的破坏运动让我们不得不思考现有体制的合理性，或许我们的体制需要适当地变一变了。"
GPS_jiasujunshiyanjiu:0 "加速军事研究"
GPS_jiasujunshiyanjiu_desc:0 "如此落后的军事怎么能保护我们的东北？前段时间的调查显示将近六成的群众对于东北的军事实力表示担忧，最近不断地有军队青壮年军官要求政府加速军事研究，或许他们是对的，东北想要复兴离不开强大的东北军。"
GPS_xuanzeweilaizhanfa:0 "选择未来战法"
GPS_xuanzeweilaizhanfa_desc:0 "过去战争的经验告诉我们，我军的战法已经非常落后了，最近，留洋归来的部分青壮年军官向军部提交了他们关于未来战法的构想，让参谋们好好研究研究。"
GPS_zunzhongzhishifenzi:0 "尊重知识分子"
GPS_zunzhongzhishifenzi_desc:0 "知识就是力量，东北的发展需要知识分子的贡献。对于知识分子，我们要使用他们，并对他们进行教育和改造。"
GPS_qianghuawenhuajiaoyu:0 "加强文化教育"
GPS_qianghuawenhuajiaoyu_desc:0 "文化教育对我们是重中之重，过去正是因为文化教育的欠缺，才使得赤色文化得以传播，我们必须要用我们自己的文化武装自己，将赤色文化驱逐出我们的家园。"
GPS_huijianwubeixi:0 "会见武备系官僚"
GPS_huijianwubeixi_desc:0 "帝国的未来属于谁？武备系官僚如今强大的实力似乎已经给出了答案，不管未来如何，我们现在必须采取行动了。"
GPS_baozhangguoqiliyi:0 "保障国企利益"
GPS_baozhangguoqiliyi_desc:0 "国企是东北的经济重要支柱，最近有私企不断侵犯国企利益，挑战国企权威，政府必须采取行动保护国企利益，为国企站台。"
GPS_mihuijiaotongxi:0 "密会交通系"
GPS_mihuijiaotongxi_desc:0 "帝国的未来属于谁？实力不断膨胀的交通系似乎也给出了一份答案，不管未来如何，我们现在必须采取行动了。"
GPS_fuyuguotietequan:0 "授予国铁特权"
GPS_fuyuguotietequan_desc:0 "铁路是东北工业的命脉，必须牢牢掌握在咱们自己人手里，给国铁特权，让他们放心去干吧。"
GPS_jiajinguanneilianluo:0 "加紧关内联络"
GPS_jiajinguanneilianluo_desc:0 "一直以来，东北地区政权都十分关心关内局势，如今关内形势紧张，我们更需要加紧和关内联络，在非常时刻入关采取非常措施。"
GPS_xingchengtongzhijingji:0 "形成统制经济"
GPS_xingchengtongzhijingji_desc:0 "经济是政治的基础，东北的发展离不开经济的复苏，经济的发展是东北繁荣和稳定的基础，形成统制经济正是我们经济复苏的第一步。"
GPS_sheizhuchenfu:0 "谁主沉浮？"
GPS_sheizhuchenfu_desc:0 "东北的未来究竟在哪里？大明的将来由谁来主导？我们关外人不能像过去一样不稳关内，圈地自萌，更不能束手就擒地将关内政权让给无能鼠辈。历史我们无法改变，但未来我们势必要主导！"
GPS_jieruzhoubianjushi:0 "介入周边局势"
GPS_jieruzhoubianjushi_desc:0 "为了维护自身利益和促进地区的和平与稳定，我们必须采取措施以介入周边的局势，东北绝对不允许周边有不听话的孩子，孩子不听话，就要打屁股了！"
GPS_quebaochaoxianwangguo:0 "确保朝鲜王国"
GPS_quebaochaoxianwangguo_desc:0 "朝鲜王国是我们重要的兄弟，维护和确保朝鲜的安全与稳定，是关东司的重要任务。在如今混乱的局势下，我们必须照顾好朝鲜。"
GPS_weihudongyangliyi:0 "维护东洋利益"
GPS_weihudongyangliyi_desc:0 "霞仪与我们一衣带水，自古以来我们两国的人民便有着深厚的情谊，因此照顾好霞仪人民也是我们理所应当的分内之事。"



### ideas ###
GPS_diguogongyexinzang:0 "帝国工业心脏"
GPS_diguogongyexinzang_desc:0 "关外是明帝国产业跃进以来发展最快、成就最引人瞩目的地区，这里土地辽阔、资源富饶，是明帝国着重开发的工业心脏。如果开发得当，关外的前景必然令帝国其他地区难望项背。"
GPS_fengzhaojiaofei:0 "奉诏剿匪"
GPS_fengzhaojiaofei_desc:0 "如今国乱岁凶，四方扰攘，皇帝命令关东司采取果断措施，平息关外的赤匪骚乱。东北军这柄利剑，必将刺进叛匪的心脏！"
GPS_fengyupiaodang:0 "风雨飘荡"
GPS_fengyupiaodang_desc:0 "受少部分激进分子的煽动，关外已经陷入了全面的骚乱与动荡，局势正在失去控制。各地的秩序摇摇欲坠，不断有叛匪袭击驻军、破坏设施的报告传来。现在是生死攸关之际，我们必须妥善处理这场危机。§R（如果我们不尽快解决这一切的话，我们将被赤匪的洪流淹没！）§"
GPS_tongzhijingji:0 "统制经济"
GPS_tongzhijingji_desc:0 "统制经济是自中祖（圣祖）中兴以来，大明经济政策的核心。历经多代经济与计然学者持续完善，其已发展为一套纷繁复杂的经济理论体系，关东地区正是这一体系下最璀璨的明珠。尽管庚午钱荒后学界对统制模式的争议渐趋激烈，但其仍是重建关东经济秩序的不二选择。"
GPS_kaifuyitongsansi:0 "开府仪同三司"
GPS_kaifuyitongsansi_desc:0 "既有的东北军政格局已不足以支撑对赤匪之征剿。为整饬力量、靖平叛乱，汤帅在军政各界公推之下正式开府，全权统筹关外军政一切事务。以非常之策应非常之势，确保征剿行动号令归一、进止有度。"
GPS_zhanhouchongjian:0 "战后重建"
GPS_zhanhouchongjian_desc:0 "在以雷霆手段敉平暴乱后，我们下一步将重新整饬地方秩序。通过持续的战后重建工作，既恢复工商百业生机，更以文教肃正重塑社会风尚，使白山黑水间重焕礼义之邦本色！"
GPS_kanluantizhi:0 "戡乱体制"
GPS_kanluantizhi_desc:0 "鉴于乱党势力盘根错节远超事前预判，为维系地方秩序，部分戡乱整肃举措需纳入制度化、常态化轨道。兹拟颁行《关东治安条例》，以"渐进式净化"策略将清乡肃奸、要塞管控及思想甄别等戒严手段转化为常设机制。"
GPS_laodongzhengce:0 "劳动政策"
GPS_laodongzhengce_desc:0 "工人亦是我大明字面，此前部分工商业资本确有剥削过甚之举，此隙被乱党利用以煽惑人心。本司将通过制订《关东劳工权益保障章程》，从工时规制、安全保障等方面着手，改善工人生活情况。此举旨在祛除社会动荡之病灶，以制度化保障工人群体合法权益，从根本上断绝乱党惑众根基。"
GPS_junshiguanli:0 "军事管理"
GPS_junshiguanli_desc:0 "生产劳动是关东经济恢复的基础，针对战略物资生产领域，本司将推行军事化生产管理机制，对关键生产环节实施规范化统筹。通过强化劳动纪律、优化生产流程及建立战时激励体系，确保战略产业产能迅速恢复，为经济复苏奠定坚实物质基础。"
GPS_junzhengtuanjie:0 "军政团结"
GPS_junzhengtuanjie_desc:0 "经各方勠力同心，征剿行动终获全胜，成功廓清极端思潮对关东之荼毒。此役之捷，实乃关东军政各界精诚合作、共御危局之明证。"
GPS_zhengyaluandang:0 "镇压乱党"
GPS_zhengyaluandang_desc:0 "尽管明面上的反抗已被我们扑灭，但此起彼伏的抵抗运动依旧在关东地区蔓延。为了彻底恢复社会秩序，我们需要采取多种手段，彻底镇压乱党。"
