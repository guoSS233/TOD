 GPS_governance.22.d_a:0 "重议后的同意程序送回签收；地方承认本次任命，张作相仍须跟进未清账册；协商为委员会留出处理其他事务的余力。"
 GPS_governance.22.d_b:0 "限期签署的文书收到回执；地方承认此次任命，但对仓促签署的保留意见留在案中；传令加快，但地方的不满也被记下。"
 GPS_governance.22.d_c:0 "代理人交回印信和账册的清单，地方签收了本次临时安排；代理期后仍需决定继任，临时交接节省了一部分协调工作。"
 GPS_governance.22.d_invalid:0 "原定地区已无法核验，控制、道路或委员会状态变化使本次承诺不能记作履行。委员会保留名单并归档，条件恢复后可重新提交。"
 GPS_governance.24.t:0 "军饷回访"
 GPS_governance.24.d:0 "书记员等待核验原定地区和签收记录。"
 GPS_governance.24.a:0 "收存回执"
 GPS_governance.24.invalid:0 "条件已变，归档此案"
 GPS_governance.24.d_a:0 "集中预算的签收单已送回，核对人员标出本次付款与尚待清理的欠项，账目得到改善，但仍须继续查核。"
 GPS_governance.24.d_b:0 "各军分担的账册交回，各部签认自己的份额；未付差额仍须另议，各部得以调度已确认的份额。"
 GPS_governance.24.d_c:0 "限额预支的领款单交回，先领到款的人在册上签名，其余欠项继续保留，临时调度有所加快，尚未领款者的不满也留在记录里。"
 GPS_governance.24.d_invalid:0 "原定地区已无法核验，控制、道路或委员会状态变化使本次承诺不能记作履行。委员会保留名单并归档，条件恢复后可重新提交。"
 GPS_governance.26.t:0 "防区回访"
 GPS_governance.26.d:0 "书记员等待核验原定地区和签收记录。"
 GPS_governance.26.a:0 "收存回执"
 GPS_governance.26.invalid:0 "条件已变，归档此案"
 GPS_governance.26.d_a:0 "共同轮换表收到签收，许兰州登记了本次交接；这次交接积累了轮换经验，下一次仍须重查交通。"
 GPS_governance.26.d_b:0 "原防区的负责人确认留守，张作相收到各部签名；留守安排暂时安定了地方，共同调遣仍须另行商议。"
 GPS_governance.26.d_c:0 "限期轮换的回执送回，接防人确认本次交接，仓促安排的意见附在名册后；部队支持行动，但交接压力引起不满。"
