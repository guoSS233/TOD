 GPS_governance.55.t:0 "霞仪政策档案"
 GPS_governance.56.t:0 "西日本政策档案"
 GPS_governance.54.d:0 "边境集市散场后，商人带来一张写满货价的纸。纸上有人参、布匹和药材，也有被雨水洇开的过路费。沿河的住户希望日后往来更便利，驻防军官却担心有人借商队打探哨所。\n\n负责起草的人把两种意见记在同一页，又留出一栏询问对岸商人的需要。纸页只能表达关东司愿意讨论的事；如何回应，还得由朝鲜方面自己决定。有人提议先把模糊的字迹重新抄清。"
 GPS_governance.55.d:0 "港务员将一只空鱼箱搬进屋，箱盖上还残留着盐渍。渔民说海上天气变化快，希望遇险时能找到避风的地方；船主更关心货物抵港后如何登记，莫让船在码头白等。\n\n有人建议先拟一份关于航路和商贸的意见，也有人提醒，海面上任何安排都需要对岸愿意共同商量。书记员写下有关霞仪的备忘，把渔民提到的避风地点附在末页。港口的钟声从窗外传来，提醒船主潮水将退。"
 GPS_governance.56.d:0 "一份西日本报纸被送到办公室，刊着港口工人卸货的照片。负责贸易的人指着照片询问煤和机械是否有销路，军官却问起海上船只的识别办法。两人都承认，凭一张报纸看不清对方的真实打算。\n\n会议决定先整理各部门希望提出的问题：商船如何通行，遇到争议怎样联络，彼此的立场又应如何表述。稿子写完后仍放在桌上，等待进一步商议。"
