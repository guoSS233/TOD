GPS_yanchataiziyuci:0 "严查太子遇刺事件"
GPS_yanchataiziyuci_desc:0 "根据我们所获得的各类情报和线索，此次太子遇刺事件中明显有同产分子的身影。东北地区作为这些不法分子长期盘踞的根据地，其活动频繁，势力强大，对国家的安全与稳定构成了严重威胁。作为关东招抚司，我们深感责任重大，必须迅速、果断地采取行动，全力以赴展开调查。务必将所有暴乱分子绳之以法，为太子殿下讨回公道！"
GPS_soubutongchangonghui:0 "搜捕同产工会"
GPS_soubutongchangonghui_desc:0 "在得知同产工会可能参与了太子遇刺事件后，关东招抚司立即启动了最高级别的搜捕行动。除了调动警方力量外，许多军队也已经开入城市开展戒严，势必彻底铲除同产毒瘤。"
GPS_daibukuodahua:0 "逮捕扩大化"
GPS_daibukuodahua_desc:0 "随着搜捕同产工会的深入，关东招抚司逐渐发现了这一非法组织背后的更大阴谋和更为广泛的联系网络。考虑到同产工会可能对国家安全和稳定构成的严重威胁，我们决定采取更为果断和全面的措施，将逮捕行动扩大化。在逮捕过程中，我们坚决贯彻“宁可错杀一千，不可放过一个”的原则，对任何涉嫌与同产工会有牵连的人员进行严格的审查和调查。"
GPS_zhenyashiweiyouxing:0 "镇压游行示威"
GPS_zhenyashiweiyouxing_desc:0 "随着搜捕活动的持续深入，同产工会的残余势力开始组织大规模的游行示威活动，试图通过抗议和示威来反抗政府的镇压行动。这些游行示威活动不仅扰乱了社会秩序，还煽动了不明真相的群众，对国家安全和稳定构成了严重威胁。面对这一紧急而严峻的局面，我们必须以零容忍的态度，出重拳、下重手，坚决镇压这些游行示威活动，以维护国家的安全和稳定！"
GPS_youbeiwuhuan:0 "有备无患"
GPS_youbeiwuhuan_desc:0 "内地生变，我们也应该早日筹备起来了！"
GPS_tanyaqiyi:0 "紧急弹压辽阳起义"
GPS_tanyaqiyi_desc:0 "军队必须立刻行动起来！这已经不是一般的乱民了，必须出重拳！"
GPS_gongqushenyang:0 "攻取沈阳"
GPS_gongqushenyang_desc:0 "在军队的刻苦奋战之下，我们重新收复的沈阳，保证了辽北的安全。"
GPS_quelitangdudushiquan:0 "确立汤都督实权"
GPS_quelitangdudushiquan_desc:0 "身为朝廷所册封的大都督，汤玉麟自然应成为关东招抚司无可争议的核心。其地位之正统，职责之重大，无可替代，必将引领招抚司走向成功，为朝廷稳定关东局势立下赫赫战功。"
GPS_quelitangdudushiquan_xiaoguo:0 "风雨飘摇: \n生活消费品工厂: §G-10.0%§! \n"
GPS_yazhidifangshantou:0 "压制地方山头"
GPS_yazhidifangshantou_desc:0 "东北军区内部派系众多，地域色彩浓厚，这在一定程度上影响了军区的统一行动。如今，随着平叛事务的深入进行，我们必须坚决压制这些地方山头主义，打破派系壁垒，统一思想和行动。只有这样，我们才能调集全部力量，形成合力，彻底剿灭叛匪。"
