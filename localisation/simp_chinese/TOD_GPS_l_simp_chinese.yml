 GPS_governance.2.d_b:0 "保留防区的回报送到。地方守军交来兵力数字，前线参谋仍催促补充；书记员将两份要求一并存档，等待下一次调度。"
 GPS_governance.2.d_c:0 "轮换经费已拨出，原防区的签收人交回轮换表。参谋核对了接替时间，并提醒都督府以后仍须为类似安排留出经费。"
