### 决议 ###
### event ###
GPSevents.1.t:0 "关东招抚司通告"
GPSevents.1.d:0 "(昌德五十年正月初一)关东招抚司司长告龙江、吉林、镇东、辽东、辽西诸省官员:\n    昌德四十九年十二月二十九日，本司成立，奉皇帝陛下及内务部部长之命，招抚、安抚、开发、维稳东北地区，在特殊情况下可全权负责东北军民政务。\n    本司首务，严查太子遇刺案凶手，为太子殿下报仇雪恨，为国家和人民伸张正义。本司初步调查，此次刺杀事件，直接执行者，有同产工会之成员。同产工会，非法地下组织，推翻我国君主制度，建立无神无君之同产主义社会。其成员，多为工农学等社会底层人士，受德芬同产主义思想蛊惑，对我国政府社会制度不满敌意，秘密宣传组织活动，煽动群众造反，扰乱社会秩序，妨碍国家建设。其还与国内外反动势力勾结，接受其资助指示支持，进行暴力破坏恐怖袭击颠覆阴谋，危害国家安全利益。其为我国一大祸害，一大隐患，一大敌人。\n    本司已掌握一些同产工会线索，初步确定一些嫌疑人，但需进一步证据追踪。奉皇帝陛下最高级别通缉命令，本司将不惜一切代价，务必将此次刺杀事件所有涉案人员尽皆惩办。无论直接执行者，幕后指使者，国内分子，国外势力，个人行为，集团组织，一律缉拿归案，严惩不贷，绝不姑息,绝不手软，绝不让其逍遥法外,绝不让其得逞。奉朝廷旨意，要求诸位官员，积极配合本司工作，全力支持本司行动，密切关注本司通报，严格执行案件调查期间各项指令，加强地方治安，防范骚乱,保护人民安全,维护国家利益，维护国家尊严。\n    本司呼吁东北地区爱国人士，积极协助案件调查工作，主动提供线索。如发现同产工会成员或活动，或任何与太子遇刺案有关情况，应立即向本司或当地官员报告，不得隐瞒或包庇，以免受法律惩罚。本司将奖励保护提供有价值线索者，处罚打击妨碍调查或掩护罪犯者。\n    本司相信，在皇帝陛下英明领导下，在内务部部长坚强指挥下，在全国各省各级官员积极配合下，在东北地区各族各界爱国人士热情支持下，必能查清太子遇刺案真相，必能缉拿太子遇刺案凶手，必能为太子殿下报仇雪恨，必能维护我国尊严利益，必能保障我国安全稳定。\n\n大明关东招抚司\n昌德五十年正月初一"
GPSevents.1.a:0 "本司必将根除叛逆！"
GPSevents.2.t:0 "颁布紧急戒严令"
GPSevents.2.d:0 "关东招抚司司长告龙江、吉林、镇东、辽东、大宁诸省官员：\n本司于正月十五布告诸省，具陈同产工会为祸之迹。本司业已严饬诸属，扩大搜捕范围，凡涉同产会者，悉数拘捕归案，毋稍宽贷。\n讵料近日密探急报：自关内政局动荡以来，同产会残暴余孽已与海内奸宄、域外反贼暗通款曲，图谋借关东形势动荡之际，策动武装作乱。据密探所获情报，该党赤匪已潜伏于我军要塞险隘，伺机发动突袭，企图扰乱军心、动摇国本，趁国朝多事之秋颠覆政权，推行其极端邪说。\n为应对此严峻局势，本司特颁此令：自即日起，东北军区各镇军队一律进入戒备状态，严加警备，枕戈待旦。本司严饬诸省宪台，务必遵行本司战备谕令，不得稍存观望。侦得可疑人等或不轨活动，应即刻飞报本司，不得漏泄隐匿。若遇武力对抗，当机立断予以还击，毋得犹豫贻误军机！本司自当星夜调拨援军，策应诸省防务。\n关东招抚司司长（钤印）"
GPSevents.2.a:0 "那我们的生产生活怎么办呀？"
GPSevents.3.t:0 "《劳动界》海外特刊（头条内容）"
GPSevents.3.d:0 "本报采访了辽阳搜捕案中，被逮捕后经审讯释放的群众，以下是其自述：\n    昌德五十年正月十五，吾遭大祸。是日，吾如常往辽阳机器制造总厂铸钢车间作事，不意遇关东招抚司之大搜捕。吾见同事或被拖出，或被鞭挞，或被电刑，或被囚笼，吾心惶惶，怒不可遏。\n    吾不知，吾等平民，何以为关东司所疑为同产工会之人？ 吾等惟以劳力为生，未尝参与反朝之事，对太子遇刺案一无所知。吾等之罪，岂非以吾等为东北人乎？\n    吾忆被捕者，皆吾所识，皆吾作事之伴。有李大山者，年四十，为车间之领班，待吾等甚和，常解吾等之难。有王小花者，年二十二，为车间之女工，貌美如花，笑靥如春，其夫为军人，战于前线。又有张老头者，年六十，为车间之老工，已事此厂四十年，其子为学者，曾于京城大学讲书，后为关东司所执，以为同产分子。吾不知其生死，惟知其皆无辜，其皆善人。吾祈天佑之，使其无恙。\n    吾正思念，忽有手自后扼吾肩，将吾拽起，一声呼于吾耳曰：“吾观尔即为机器制造厂之同产分子！”吾顾之，乃关东司之郭继承也，此人恶名远扬，专司捕审同产工会之人，其手沾满鲜血。其目狂热，其口邪笑，其手执铁棍，对吾曰：“尔从吾来，吾将令尔知生不如死！”"
GPSevents.3.a:0 "欲加之罪，何患无辞？"
GPSevents.3.b:0 "防微杜渐，宁滥勿缺！"
GPSevents.4.t:0 "《周饶日报》关东司镇压东北各地抗议游行"
GPSevents.4.d:0 "    据可靠消息，近日东北各地爆发了大规模的抗议游行，要求大明帝国关东司停止戒严，还东北人民以自由。这些游行活动得到了东北人民的广泛支持和参与，并与关东军发生激烈的冲突。然而,关东司却对这些正义的抗议行动采取了残酷的镇压手段，造成了大量的人员伤亡和财产损失。\n    据悉,辽阳、金州、长春、吉林、龙江、滨江等地的抗议游行,都是由同产工会的成员或同情者发起或组织的。同产工会是一个非法的地下组织,主张推翻大明帝国的君主制度,建立无神无君的同产主义社会。关东司司长在正月十五日的通知中，已经将同产工会定性为与太子遇刺案有着密切联系的反动势力，宣布将对其进行全面的清剿和打击。\n    根据关东司的逮捕命令，关东司在各地展开了大规模的搜捕和逮捕行动，将所有涉嫌与同工会有关的人员一律拘捕归案，不分男女老幼，不论亲疏远近，不问职业身份，不论是否直接参与太子遇刺案。关东司还对抗议游行的人群进行了无差别的开枪和驱散,不惜使用机枪、骑兵等重兵器,对付手无寸铁的平民百姓。据不完全统计,仅在正月十五日至二十日的五天时间内，就有数百人被关东司杀害或重伤，近万人被关东司逮捕或拘留，数百万人生活受到不同程度影响。"
GPSevents.4.a:0 "这些南洋媒体又在胡咧咧了！"
GPSevents.5.t:0 "关内生变，局势不稳"
GPSevents.5.d:0 "关东招抚司司长告龙江、吉林、镇东、辽东、辽西诸省官员∶\n    由于本司在正月十五日发出的通知中，已经明确指出了同产工会的罪恶行径和本司的坚决态度。本司已经下令扩大逮捕范围，将所有涉嫌与同产工会有关的人员一律拘捕归案，不留任何余地、不容任何姑息。\n    然本司近日接到可靠情报。自关内生变以来，同产工会在东北地区的残余势力，已经与国内外的反动力量勾结，企图发动武装暴动，破坏我国的安全稳定。据悉，他们已经秘密潜入了一些重要的军事设施和要地，准备在某个时机发动突然袭击，制造混乱和恐慌。他们的目的是要瓦解我国的军事防御，挑战我国的主权和领土完整，妄图趁国朝处于危难之时，颠覆我国的政权，推行极端思想。\n    为了应对这一严峻的形势，本司决定，自即日起，东北军区所有军队进入战备状态，加强警戒和防范，随时准备应对任何可能的敌对行动。本司要求诸位官员，严格执行本司的战备命令，不得有任何迟疑或怠慢。如有发现任何可疑的人员或活动，应立即向本司报告,不得隐瞒或泄露。如有遇到任何敌对行动，应当果断反击，不得手软！本司将派遣援军，支持诸位官员的作战。"
GPSevents.5.a:0 "霹雳手段“菩萨心肠”"
GPSevents.6.t:0 "辽阳起义"
GPSevents.6.d:0 "    昌德五十年八月三十一日，同产工会在辽阳发动了一场震惊天下的工人起义。起义的领导者是同产工会东北局书记钱望潮，他号召工人阶级用武装斗争推翻压迫他们的封建统治，建立同产主义的新社会。起义的口号是“推翻明廷腐朽统治，权力属于无产阶级！”\n    起义开始于辽阳的一家军械所，工人们在钱望潮的带领下，夺取了厂内的武器，攻占了厂区的要害。然后，他们向城内的其他工厂和居民区发出了起义的信号，很快，成千上万的工人加入了起义的队伍，与官兵和地主武装展开了激烈的街头战斗。起义者以勇敢和坚决的斗志，打败了敌人的反攻，最终占领了辽阳的城门、衙门、兵营和仓库，宣布辽阳为同产主义的解放区。\n    起义的消息迅速传遍了东北各地，金州、长春、锦州、延吉、吉林、滨江、龙江等城市的工人也纷纷响应，发动了自己的起义，与官府和地主的武装进行了殊死的斗争。沈阳的军队也发生了哗变，部分士兵和军官背叛了朝廷，加入了同产工会的行列，向沈阳的统治者发起了进攻。东北各地的工人起义，形成了一个强大的同产主义的革命力量，对抗了封建王朝的残暴统治，为实现工人阶级的解放和幸福而奋斗。"
GPSevents.6.a:0 "这些该死的赤匪，速调大军围剿！"
GPSevents.7.t:0 "沈阳生变"
GPSevents.7.d:0 "    昌德五十年八月三十一日，明帝国东北军沈阳驻军长官王以哲接到了朝廷的紧急命令，要求他立即率领军队前往辽阳阳，平息同产工会的起义。王以哲知道，这是一场生死攸关的战役，如果不能尽快镇压起义，就可能引发全国的同产主义革命，动摇明帝国的根基。他决定不惜一切代价，消灭同产工会的武装力量，恢复辽阳的秩序。\n    然而，出乎所有人预料的是，当主力部队离开沈阳，集中力量对辽阳城发起猛烈攻击时，沈阳城内约的留守军队在老将蓝天蔚的领导下，竟然发动了“叛乱”。由于城内防御力量大幅削弱，面对近乎两个整编师的叛军铁蹄，守军显得捉襟见肘，难以抵御其凌厉攻势。受到赤色思想深刻影响的士兵们迅速夺取了沈阳的城防控制权，并且迅速武装了大量积极响应起义的工人和市民，使得整个沈阳城在短时间内便陷入了赤色力量的手中。\n    沈阳失守的消息不胫而走，关东司的整个围剿布局瞬间土崩瓦解。王以哲的部队陷入了进退维谷的境地，身处沈阳与辽阳之间，稍有不慎，便可能使局势急转直下，陷入万劫不复。尽管他提出了一个大胆的反击方案——趁叛军根基未稳，即刻挥师沈阳，但这一行动仍需等待汤大帅的最终裁决。此刻的王以哲，肩上扛着千斤重担，心急如焚地等待着招抚司的下一步指令。"
GPSevents.7.a:0 "汤大帅要求你部暂时转进，跳出辽沈之间的区域，汇合辽西援军后再合攻沈阳。"
GPSevents.7.b:0 "汤大帅同意了你的计划，趁敌立足未稳，即刻发兵沈阳！"
GPSevents.8.t:0 "分散攻击、主攻一方？"
GPSevents.8.d:0 "    在关东招抚司的议事大厅中，气氛异常紧张。如今大军云集沈阳城郊，但将领间却因进攻方式而产生了分歧。主攻派的官员们主张集中优势兵力，从某一方向全力进攻。他们认为这样可以迅速突破敌军的防线，减少我方的损失。\n    主攻派的代表人物是一位资历颇深的将军，名叫杨宇霆。他有着丰富的作战经验，对军事战略和战术有着深刻的理解。他坚信，只有通过快速而果断的行动，才能迅速平定叛乱，稳定局势。\n    “我们必须采取主动，集中兵力，迅速攻占沈阳。”杨宇霆站起来，眼神坚定地说，“这样可以避免战线的拉长，减少我方的兵力分散。同时，也可以打乱敌军的部署，使其无法组织有效的抵抗。”\n    然而，分散派的官员们对杨宇霆的主张提出了质疑。他们的代表人物是一位名叫马占山的文官，他主张采用多路进攻的方式，以分散敌军的注意力。\n    “我认为，分散兵力可以更好地利用地形的优势，同时分散敌军的防御力量。”马占山温和地反驳道，“通过多路进攻，我们可以从不同的方向对敌军施加压力，使其无法判断我们的主攻方向。这样可以提高我方的胜算。”他还进一步指出，“此外，分散进攻还可以减少对我方士兵的伤亡。在战争中，保护士兵的生命安全同样重要。我们应该尽量避免无谓的牺牲。”\n    杨宇霆听后立刻反驳道，“但是，如果我们分散兵力，可能会给敌军提供可乘之机。他们可能会集中优势兵力攻击我们的薄弱环节，导致我们失去对局势的控制。不要忘了，我们的物资并不充裕！一旦不能速克沈阳，就有可能出现更加不利的局面！”\n    马占山不以为然，“我们可以通过加强侦查和快速反应来应对这种可能性。通过密切关注敌军的动向，我们可以及时调整我们的策略和部署。战争不是赌博，如果不能极可能保证作战顺利，那就应该暂缓军事行动，而不是那将士的姓名去博你说的可能性！”\n    双方展开了激烈的争论，各有各的道理和理由。议事厅中的气氛越来越紧张，但最终没有达成一致意见。这时，主位上的汤玉麟缓缓开口道。"
GPSevents.8.a:0 "抽调更多地方部队，分进合击，合围沈阳"
GPSevents.8.b:0 "利用现有力量，集中兵力，主攻沈北"
GPSevents.9.t:0 "决战沈阳"
GPSevents.9.d:0 "    对于沈阳的总攻开始了。负责北线攻势的明军主攻部队，在杨宇霆的带领下利用夜幕的掩护，发动了对于沈阳北部防线的进攻。明军身穿现代军服，配备了明帝国新式的武器装备，包括步枪、机枪、火炮等。杨宇霆制定了详细的作战计划。他分析了起义军的防御工事和部署情况，制定了三路进攻的策略。一路从正面发起强攻，吸引敌军注意力；另两路从侧翼进行包抄，打起义军一个措手不及，一举穿透起义军沈被防线。而这套作战的关键，便在于沈阳北部火车站能否被迅速拿下，从而在起义军防线上撕开一个口子。\n    凌晨3点，明军炮兵开始炮击起义军阵地。炮弹呼啸着划破夜空，落在敌军阵地，爆炸声震耳欲聋。硝烟弥漫，起义军阵地一片狼藉。\n    在炮火掩护下，明军正面进攻部队发起了冲锋。他们利用烟雾弹的掩护，快速穿越开阔地，向敌军阵地逼近。起义军迅速作出反应，利用预先构筑的工事进行抵抗。双方展开了激烈的交火，步枪和机枪的响声交织在一起。\n    与此同时，明军侧翼部队展开了行动。他们穿越丛林和沟壑，绕过敌军的警戒线，对起义军的侧翼发起了突然袭击。起义军面临腹背受敌的困境，局势开始动摇。\n    在激烈的交战中，明军的战车部队也加入了战斗。战车冲锋陷阵，炮弹呼啸而出，摧毁了起义军的防御工事和火力点。起义军陷入了困境，开始节节败退。然而，起义军并未放弃抵抗。他们组织起最后的反击，试图夺回失去的阵地。双方在狭窄的战场上展开了白刃战，士兵们用刺刀和手榴弹进行搏斗。\n    黎明拂晓，围绕沈阳北部火车站的争夺也落下帷幕——"
GPSevents.9.a:0 "明军占领了沈北火车站，乱军的防线被我们撕开了！"
GPSevents.9.b:0 "关键时刻，辽阳义军的增援部队及时赶到，明军被迫暂时后撤"
GPSevents.10.t:0 "明军攻克沈阳"
GPSevents.10.d:0 "    历经一月左右的奋战，明军与起义军之间的较量达到了白热化的程度。这一个月的时间里，沈阳城内外战火连天，硝烟弥漫。明军士兵们日夜不停地发动攻击，他们的勇气和毅力得到了极大的考验。每一次冲锋都伴随着生死的较量，每一场战斗都凝聚着士兵们的血汗和泪水。\n    起义军同样展现出了顽强的抵抗精神。他们利用城防工事和地形优势，与明军展开了殊死搏斗。尽管面临着巨大的压力和困境，起义军士兵们仍然坚守阵地，不屈不挠地抵抗着明军的进攻。\n    最终，在明军持续的猛攻之下，起义军的防线逐渐崩溃。沈阳城内补给线被切断、后援无望，使得起义军陷入了绝境。伴随着赤底黄龙旗在沈阳的城头升起，明军顺利地夺回了沈阳城。"
GPSevents.10.a:0 "辽北克复，沈阳在握！"
GPSevents.10.b:0 "命令沈阳残军转进辽西，再觅胜机"
GPSevents.11.t:0 "明军攻势受阻"
GPSevents.11.d:0 "    历经一月左右的奋战，明军与起义军之间的较量达到了白热化的程度。这一个月的时间里，沈阳城内外战火连天，硝烟弥漫。明军士兵们日夜不停地发动攻击，他们的勇气和毅力得到了极大的考验。每一次冲锋都伴随着生死的较量，每一场战斗都凝聚着士兵们的血汗和泪水。\n    起义军同样展现出了顽强的抵抗精神。他们利用城防工事和地形优势，与明军展开了殊死搏斗。尽管面临着巨大的压力和困境，起义军士兵们仍然坚守阵地，不屈不挠地抵抗着明军的进攻。\n    最终，在无数起义部队前赴后继地牺牲之下，原本摇摇欲坠的防线最终稳固下来。攻势受阻的明军不得不选择暂时后撤，暂时休整以待局势发展。"
GPSevents.11.a:0 "暂时休整，以图再战"
GPSevents.11.b:0 "巩固防线，扩大战果"
GPSevents.12.t:0 "辽西失守"
GPSevents.12.d:0 "    近日，辽西省多个地区在辽东大暴乱的影响下，工人群体纷纷响应，掀起了规模庞大的暴乱浪潮。这群被称为乱党的工人，以雷霆万钧之势迅速占领了辽西的多个重要城镇，给关东招抚司在该地区的统治带来了严重冲击。\n    乱党武装在极端思想的煽动下，展现出了极为恶劣的暴力和无序行为。他们无视法律，公然挑战关东招抚司的权威，以暴力手段破坏社会秩序，严重危害了当地民众的生命财产安全。尽管我方军队已经努力弹压，但却仍难以挽回局面，辽西各大城镇均陷于贼手，短期之内难以光复。"
GPSevents.12.a:0 "四面起火，为之奈何？"
GPSevents.13.t:0 "稳固辽西局面"
GPSevents.13.d:0 "    近日，辽西省多个地区在辽东大暴乱的影响下，工人群体纷纷响应，掀起了规模庞大的暴乱浪潮。这群被称为乱党的工人，以雷霆万钧之势迅速占领了辽西的多个重要城镇，给关东招抚司在该地区的统治带来了严重冲击。\n    乱党武装在极端思想的煽动下，展现出了极为恶劣的暴力和无序行为。他们无视法律，公然挑战关东招抚司的权威，以暴力手段破坏社会秩序，严重危害了当地民众的生命财产安全。幸赖将士用命，乱党又经此前搜捕，辽西地方组织已趋于涣散，在经过多轮殊死拼杀之后，我军基本已经克复辽西大部分城市，乱党扩大暴乱规模的阴谋被我军顺利镇压！"
GPSevents.13.a:0 "辽西稳固，可待用兵！"
GPSevents.14.t:0 "《辽阳军报》（专刊：关东招抚司高层制定新式作战策略）"
GPSevents.14.d:0 "军报讯：\n    关东招抚司高层近日召开军事会议，针对东北明军如何适应新式作战进行了深入讨论。经历与赤色叛匪的激战后，将领们意识到必须调整战术。经过会议的集中讨论，达成了以下共识：\n1.炮兵部署调整\n    在未来的战斗中，炮兵将发挥关键的火力支援作用。为了更精确地打击起义军，将合理部署炮兵阵地，集中火力打击起义军的集结地、指挥所和其他关键目标。同时，炮兵将与步兵和其他部队紧密配合，确保协同作战的效果最大化。\n2.机械化部队的新角色\n    机械化部队将被作为快速反应力量使用。它们将针对敌军的薄弱环节进行突击，通过高速机动和远程打击，迅速穿插至敌后，对敌方造成重大威胁。此外，在必要时，机械化部队还将执行战略撤退任务，为其他部队提供必要的掩护。\n3.情报与策反工作强化\n    为了更好地指导作战行动，加强情报收集工作至关重要。专业的情报人员将被派遣至敌后，以获取起义军的最新动态和意图。同时，策反工作也将被重视，目标是通过收买、说服等方式，从内部削弱起义军的战斗力。\n4.协同作战的重视\n    各部门和军队之间的沟通与协调被强调。战术层面上，各部队之间的配合与协同至关重要，以避免作战行动出现混乱。此外，后勤保障部门需确保前线部队的物资供应，保障作战行动的持续进行。\n5.士兵训练与装备更新\n    加强对士兵的训练和教育工作被认为是提高战斗力的关键。定期的训练和演练活动将得以组织，以提高士兵的技能、体能和心理素质。同时，重视装备的更新和维护工作，确保部队的装备始终处于良好状态。通过引进先进的装备和技术，提高部队的战斗力和应对复杂战场环境的能力。\n\n    关东招抚司的高层将领们在会议中达成共识，将采取倚重炮兵、灵活运用机械化部队、加强情报收集和策反工作、注重协同作战以及重视士兵训练和装备更新的作战方法。这些策略旨在有效应对未来战争的威胁，稳定关东地区的局势。"
GPSevents.14.a:0 "面向未来，战法革新"
GPSevents.15.t:0 "关东招抚司通告"
GPSevents.15.d:0 "    自辽阳赤匪叛乱发生以来，辽东沦陷，战事蔓延，关东招抚司鉴于赤匪无止境之作乱，爰决定戒严平叛，全东北民众同仇敌忾，全体将士忠勇奋发；被据各省，均有极急剧之奋斗，极壮烈之牺牲。而沈阳城下，我军大败赤匪，关外将士，其在前线，以血肉之躯，攻克沈阳。赤匪倾其全力，我军功亏一篑。\n    迩者赤匪更肆贪黩，祸乱沈阳。察其用意，无非欲挟其暴力，要我不战而降。殊不知我司自决定戒严平叛之日，即已深知此为重要关头，为国家安全计，为社会稳定计，为世界免此极端思想之荼毒计，皆无屈服之余地。\n    关东招抚司兹为适应战况，统筹全局，长期平叛起见，本日移驻镇东，此后将以最坚定之决心，从事更高效之战斗，以东北工业之强，兵器之优，继续平叛，必能达到维护剿灭赤匪安定关东之目的，特此宣告，惟共勉之。"
GPSevents.15.a:0 "宣德xx年xx月xx日"
GPSevents.16.t:0 "汤玉麟突发恶疾"
GPSevents.16.d:0 "    在明军攻势受阻后，汤玉麟逐渐郁郁寡欢。尽管关东司很快在镇东站稳脚跟，但汤玉麟的身体每况愈下。在指挥之余，他总是“借酒消愁”。就算实在督军府里，他也时不时对手下大发雷霆。由于他的心狠手辣，不满情绪很快开始在关东将领中散步开来。\n    近日，镇东出现了汤总督被软禁的传闻。为了稳定舆情，防止赤匪趁机作乱，关东招抚司对外声明汤总督“因病卧床不起”。"
GPSevents.16.a:0 "汤总督可是皇上钦定的，竟然有人敢动他！"
GPSevents.16.b:0 "哼，他早该下去了"
GPSevents.17.t:0 "关东招抚司军政委员会成立"
GPSevents.17.d:0 "    在马占山、张景惠等人牵头下，关东将领将醉酒后的汤玉麟软禁在督军府的一个密室中，控制了他的亲信和家属。经过一个月左右的协商后，成立了由全体关东高级将领和部分高级行政官员组成的军政委员会。张景惠担任会长并负责组织委员会以制定作战安排和颁布行政条例。\n    在军政委员会中，会员先是各抒己见，最后投票表决。尽管官员们私下结成派系且各怀鬼胎，但这仍保证了委员会通过的决议得到了最大程度的执行，使关东招抚司没有土崩瓦解。"
GPSevents.17.a:0 "希望这能挽救关东的局势吧。"
GPSevents.17.b:0 "都什么时候了，居然还在内斗！"
GPSevents.18.t:0 "维护大明海外利益"
GPSevents.18.d:0 "如今关东战事已然平息，但原先臣服大明的朝鲜和东洋各国内部赤匪和乱党蠢蠢欲动，大明的力量在这些地区日渐式微。关东人力充足，重工业发达，为大明重新确立在朝鲜及东洋的统治义不容辞！"
GPSevents.18.a:0 "大明，天下无敌呀"
GPSevents.19.t:0 "朝鲜归附"
GPSevents.19.d:0 "自大明陷入内乱以来，张氏，赤匪，黑帮等势力开始在朝鲜明争暗斗，无视大明在朝鲜的宗主地位和利益。如今，作为大明忠心的臣子，我们再次利用外交和军事手段迫使朝鲜臣服。朝鲜会鼎力支持大明再次一统，永不再叛！"
GPSevents.19.a:0 "大明，天下无敌呀！"
GPSevents.20.t:0 "霞仪，日本归附"
GPSevents.20.d:0 "自大明陷入内乱以来，霞仪为赤匪所乱，日本日益不臣，东西不和，内部藩王，赤匪，军队等势力在日本兴风作浪，无视大明在东洋的宗主地位和利益。如今，作为大明忠心的臣子，我们再次利用外交和军事手段迫使霞仪和西日本联盟臣服。东洋各国会鼎力支持大明再次一统，绝无二心！"
GPSevents.20.a:0 "大明，天下无敌呀"

