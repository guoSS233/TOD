 GPS_governance.21.t:0 "会长未签的任命"
 GPS_governance.21.d:0 "任命书在张景惠桌上放了三天，印泥已换过一盒，纸上仍没有会长签字。候选人熟悉当地仓库，也有处理欠饷的经验；但一位防区军官拒绝承认由别处推举的人接管印信，另一位则要求先划清运输与军费责任。书记员拿来的名单上，负责交接的名字和收到电报的人并不相同。\n\n张作相把旧军代表请到桌边，逐个确认哪些部队愿意承认新负责人。“我能去说服他们，”他说，“可不能替他们签收一张从没见过的命令。”许兰州担心等待影响共同防务，请求至少派人临时接管仓库。张景惠则指出，限期签署可以让事务继续，却不能让会长承担各军没有答应的义务。\n\n重新商议需要政治资源，若议事桌上曾约定任命同意程序，已有的准备可以减少费用；也可要求限期签署，承受地方的不满，或花费较少款项安排代理。三十日后必须核对原地区是否仍在控制之下，再看地方回执；失去立足地时，这份任命不能算作已获承认。\n\n传令官把空白签收栏留在文书末尾。会长拿起笔，却先问各方：若代理人只收到钥匙而拿不到账册，谁负责下一步？没有人替地方官作答，书记员便将问题记入附页，待回访时一并核验。"
 GPS_governance.21.a:0 "重新商议同意程序"
 GPS_governance.21.b:0 "限期签署"
 GPS_governance.21.c:0 "拨款暂派代理"
