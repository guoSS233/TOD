 GPS_gov_tang_orders:0 "两份军令"
 GPS_gov_tang_orders_desc:0 "沈阳战后的调遣与地方防务发生冲突。都督府须确定哪一道命令先行，并留下可核对的回执。"
 GPS_gov_tang_appointments:0 "防区上的任命"
 GPS_gov_tang_appointments_desc:0 "地方军官的去留不仅是一纸任命，也关系到旧部、欠饷和当地防务。先听取账目，再决定由谁负责。"
 GPS_gov_tang_register:0 "都督府授权簿"
 GPS_gov_tang_register_desc:0 "一切都等都督亲笔批示，公文便会在桌上越积越高。副署、授权和继任责任至少要有一项写入簿册。"
 GPS_gov_tang_settlement:0 "保境之约"
 GPS_gov_tang_settlement_desc:0 "战事平息后，关东司需要说明有限自治由谁担保、如何交接。个人声望与成文程序各有持续的代价。"
 GPS_gov_committee_table:0 "委员会议事桌"
 GPS_gov_committee_table_desc:0 "张作相、许兰州与会长张景惠须先约定如何处理军饷、防区和任命，让议事桌上的决定有人执行。"
 GPS_gov_recovery_desk:0 "恢复事务处"
 GPS_gov_recovery_desk_desc:0 "在实际控制的地区设立事务处，登记煤车和复工请求；战事未结束，也可以先做力所能及的工作。"
 GPS_gov_repair_roster:0 "维修与回执"
 GPS_gov_repair_roster_desc:0 "收到煤车与复工的有效回执后，整理道路、设备和维修人员的清单，让下一次调度有据可查。"
 GPS_gov_workers_record:0 "工人申诉簿"
 GPS_gov_workers_record_desc:0 "将工资兑现与工人代表的申诉记入档案，留下答复责任，同时保留既有劳动政策的不同安排。"
 GPS_governance.1.t:0 "两份军令"
 GPS_governance.1.d:0 "参谋把两份急电摊在汤玉麟面前。一份要求抽调地方守军，补足前线缺口；另一份来自防区，报告桥头兵力不足，要求原队留守。两份命令都盖过章，按期执行却要用同一批人。\n\n“军令不能有两个声音。”汤用铅笔划掉重复的番号，问传令官：“车走以后，谁守粮库？”传令官只带回一张没有签名的兵力表。地方军官愿意交出人数，却不肯为缺口担保；前线参谋则警告，等各地商妥，补充可能已经太迟。\n\n都督府可以集中调遣，也可以暂留防区，要求各部重新报数；若拨出额外经费，还能安排轮换。无论批哪一份，都须把原防区和接令人的名字留在案卷上，三十日后查验。盖章能解决眼前的冲突，不能代替地方回执。\n\n守备官在附页上写道，抽调之后仓库夜间只剩一排人，若有替换兵力，应先告知他的副官。前线参谋则要求注明出发期限，免得同一辆车重复列入两份计划。汤让书记员把两人的签名并排列在令末，等回报时逐项核验。"
 GPS_governance.1.a:0 "集中调遣，留下防区回执"
 GPS_governance.1.b:0 "保留原防区，重新核对兵力"
 GPS_governance.1.c:0 "拨款安排轮换（25政治点数）"
 GPS_governance.1.invalid:0 "条件已变，将此案归档"
 GPS_governance.3.t:0 "最后一趟煤车"
 GPS_governance.3.d:0 "调度员带来一张磨破的运力表：前线要煤维持军需，厂区要煤生火，附近居民也等着供应。现有库存和道路只能支撑有限调度，表上的数字并不保证每一段路都能照常使用。\n\n“把这批全拨给军需，炉子就得再停几天。”厂方代表指着清单说。军需官反驳，缺煤的部队同样无法等待。调度员没有替任何一方作保证，只在图上圈出目前仍由关东司掌握的地方：“这里的道路还能走，但我需要一张明确的签单。”\n\n负责签署的人可以先保前线、先保厂区，或另拨人力与经费分配有限库存。后一种安排不是凭空增加运力，双方仍可能不满。请在三十日后核对原定地点和交通，向没有得到优先供应的一方解释缺口；若控制或道路改变，原安排也必须重新核实。\n\n厂区代表还带来供暖站的存量记录，军需官则摊开部队的燃料请求。两张清单上的日期不同，谁也不能只凭总数断定对方有余粮。事务处先把各自的签收人和可运数量记下，避免下一次查账时只剩口头说法。"
 GPS_governance.3.a:0 "先供前线"
 GPS_governance.3.b:0 "先供厂区"
 GPS_governance.3.c:0 "拨款组织有限分配（25政治点数）"
 GPS_governance.3.invalid:0 "条件已变，将此案归档"
 GPS_governance.5.t:0 "第一次复工会议"
 GPS_governance.5.d:0 "厂房的玻璃还缺了几块，工人代表把一份欠薪单放在会议桌上。厂方急着恢复生产，称再不点火，备用零件也会被搬走；工人则问，上次答应的工资由谁签收，锅炉旁损坏的护栏又由谁修。\n\n负责官员拿出拟好的开工令：“命令今天就能发，但这张单子也得有人管。”一名老钳工翻开本子，指出学徒和装卸工没有列进名单。厂方说账册在撤离时散失，只能先核对一部分；工人代表要求至少留下答复日期，不愿再接受一句“以后再议”。\n\n可以先开工、先筹款补发工资，或安排安全检查与代表协商。各项都有成本，签字也不等于全部问题已经解决。三十日后，事务处将按原地点是否仍受控制、当时选择和既有劳动政策登记回执；未能核验的承诺不能当成已经兑现。\n\n会场外还有等着领回工具的工人。厂方希望先把熟练工编进首批名单，代表提醒他，若装卸人员没有工资，原料到了也未必有人卸。官员遂让双方在名单背面写下负责核对的人，而不是把未决事项藏进开工命令。"
 GPS_governance.5.a:0 "先开工，登记争议"
 GPS_governance.5.b:0 "先筹款补发工资（25政治点数）"
 GPS_governance.5.c:0 "安排安全与代表协商（10政治点数）"
 GPS_governance.5.invalid:0 "条件已变，将此案归档"
 GPS_governance.7.t:0 "未决的防区任命"
 GPS_governance.7.d:0 "一份地方任命呈到汤玉麟桌前，附页却夹着两封互相矛盾的报告。参谋说原负责人迟迟不交兵力账，建议撤换；随附的地方回电则称部队仍在守备，只是欠饷未清，无法按新编制造册。\n\n汤曾在宪兵任上习惯从供词与案卷寻找矛盾，如今这两张纸却都没有足够的签收凭据。“换一个人，未必立刻有人听他的；留下他，也不能让账永远空着。”他要求书记员把印信、军饷和防区三栏分开登记。\n\n都督府可以撤换地方负责人，也可以让其留任并限期交账；若另拨经费，可以暂派代理，等账目核对后再决定。这里处理的是行政任命，并不凭一纸命令让某位将领或部队消失。一个月后还须核查原地是否仍受控制，以及新安排能否取得当地的回执。\n\n参谋担心迟疑会让其他防区仿效，地方信使则解释，原来的出纳已经随伤员撤走，许多凭证尚未找回。汤让两人各自写下能核实的日期，并要求接手者先点验仓库。谁签收了印信，谁就要答复当地官兵的询问。"
 GPS_governance.7.a:0 "撤换地方负责人"
 GPS_governance.7.b:0 "留任并要求交账"
 GPS_governance.7.c:0 "拨款暂派代理（25政治点数）"
 GPS_governance.7.invalid:0 "条件已变，将此案归档"
 GPS_governance.9.t:0 "谁来副署"
 GPS_governance.9.d:0 "夜已深，都督府的公文仍堆在汤玉麟手边。军饷、调防与仓库领用都等着同一支笔，书记员连着两日不敢离开，生怕一封急电找不到签发的人。\n\n“要是都督出城，印信放在哪儿？”一名参谋试探着问。汤没有立即回答。他知道地方将领对自己的戒心，也知道一张空白授权书可能被解释成让权；可是每件小事都等亲笔，命令抵达时往往已经过期。书记员把旧案卷翻到一页没有副署的支出单，数字旁只留下一串无法核实的缩写。\n\n可以先规定副署者对经手公文负责，可以编一本列明范围与期限的授权簿，也可以先指定负责人处理都督不能到场时的继任事务。三种办法都不能使争议消失，但至少会留下一个可追问的名字。汤要决定，下一次公文不在自己手中时，关东司凭什么继续运转。\n\n军需处长补充说，上周一批药品只因等待签字便错过了出发的车队；他不要求得到无限权力，只请求在限额内先行处理并事后报账。汤让他写明限额与核验办法，留待决定由谁承担这份责任。"
 GPS_governance.9.a:0 "规定副署责任"
 GPS_governance.9.b:0 "编制限期授权簿"
 GPS_governance.9.c:0 "指定继任事务负责人"
 GPS_governance.9.invalid:0 "条件已变，将此案归档"
 GPS_governance.10.t:0 "保境与交接"
 GPS_governance.10.d:0 "战争告一段落，地图上留下的铅笔线还没有擦去。地方官送来下一季预算，要求说明军费、道路和欠薪由谁担保；军官们则问，一旦都督不在，哪一份命令仍然有效。\n\n汤玉麟翻开授权簿，看到自己过去亲笔写下的批语。他可以凭个人威望向各地担保，继续以都督府协调军政；也可以把权限、印信和账册的交接写成条文，让接手的人受同一套约束。前一种办法决断迅速，却把稳定系在个人身上；后一种办法需要官署持续核对，也会限制临时调度。\n\n“我们能守住的，才是能负责的。”他让书记员把这句话写在预算封面，而不是写成对外的承诺。会议还可以暂缓定案，待账册更清楚后再议；但暂缓并不自动建立交接制度。今天的签署，只决定关东司如何承担自己控制范围内的责任。\n\n预算官提醒，与地方约定的款项要逐期清算，不能把一张担保书当成现钱。守备军官也提出，若负责人更替，部队需要知道印信由谁保管。两人的意见都被记入会议纪要，成为签署之后仍须处理的事务。"
 GPS_governance.10.a:0 "由都督个人担保"
 GPS_governance.10.b:0 "写明成文交接"
 GPS_governance.10.c:0 "暂缓定案"
 GPS_governance.10.invalid:0 "条件已变，将此案归档"
 GPS_governance.20.t:0 "委员会的议事桌"
 GPS_governance.20.d:0 "镇东的会议室里，张景惠把三份待签文件排成一列：军饷、防区和地方任命。沈阳攻势受挫后，张作相与许兰州牵头协调诸军，委员会已经成立；汤玉麟仍受软禁，他的旧部却还在等着知道自己的待遇。会长的印章放在桌角，谁都没有先去碰。\n\n张作相主张先让地方部队认账：“他们认得自己的军官，也得认得这张共同账单。”许兰州拿出镇东整备表，指出轮换防区之前必须知道哪些队伍还有补给。张景惠听完，要求每项决定写清谁签、谁办、谁负责回报；否则会长即使签了字，公文也可能停在半路。\n\n委员会可以先承诺整理军饷账，也可以先确定防区责任，或先约定任命须经必要人员同意。这不是一次包办所有问题的表决。书记员将在选定的一栏记下责任，未选的两栏仍留在桌上，等各方带着可执行的数字回来。\n\n门外等候的旧部联络员递来一份军饷清单，要求委员会至少确认领取人的安全和待遇。张作相请书记员收下名单，许兰州表示会核对编制；张景惠则要求把答复期限写入记录，不能让来人带着一句含糊的安慰离开。"
