 GPS_gov_recovery_desk_tt:0 "解锁煤车调度与复工会议决议。议题须在实际控制且具备道路条件的地区开展。"
 GPS_governance.3.d_rail:0 "调度员带来一张磨破的运力表：前线要煤维持军需，厂区要煤生火，附近居民也等着供应。现有库存和道路只能支撑有限调度，表上的数字并不保证每一段路都能照常使用。\n\n“把这批全拨给军需，炉子就得再停几天。”厂方代表指着清单说。军需官反驳，缺煤的部队同样无法等待。调度员没有替任何一方作保证，只在图上圈出目前仍由关东司掌握的地方：“这里的道路还能走，但我需要一张明确的签单。”\n\n负责签署的人可以先保前线、先保厂区，或另拨人力与经费分配有限库存。后一种安排不是凭空增加运力，双方仍可能不满。请在三十日后核对原定地点和交通，向没有得到优先供应的一方解释缺口；若控制或道路改变，原安排也必须重新核实。\n\n厂区代表还带来供暖站的存量记录，军需官则摊开部队的燃料请求。两张清单上的日期不同，谁也不能只凭总数断定对方有余粮。事务处先把各自的签收人和可运数量记下，避免下一次查账时只剩口头说法。\n\n调度员指向已核验的受控铁路区段：本次可依托现有线路调车；实际控制和通路仍须在回访时复核。"
 GPS_governance.3.d_road:0 "调度员带来一张磨破的运力表：前线要煤维持军需，厂区要煤生火，附近居民也等着供应。现有库存和道路只能支撑有限调度，表上的数字并不保证每一段路都能照常使用。\n\n“把这批全拨给军需，炉子就得再停几天。”厂方代表指着清单说。军需官反驳，缺煤的部队同样无法等待。调度员没有替任何一方作保证，只在图上圈出目前仍由关东司掌握的地方：“这里的道路还能走，但我需要一张明确的签单。”\n\n负责签署的人可以先保前线、先保厂区，或另拨人力与经费分配有限库存。后一种安排不是凭空增加运力，双方仍可能不满。请在三十日后核对原定地点和交通，向没有得到优先供应的一方解释缺口；若控制或道路改变，原安排也必须重新核实。\n\n厂区代表还带来供暖站的存量记录，军需官则摊开部队的燃料请求。两张清单上的日期不同，谁也不能只凭总数断定对方有余粮。事务处先把各自的签收人和可运数量记下，避免下一次查账时只剩口头说法。\n\n现有铁路条件不足，调度员只能从煤源安排公路车队。道路备用方案的临时收益减半；它不代表铁路已建成或畅通。"
