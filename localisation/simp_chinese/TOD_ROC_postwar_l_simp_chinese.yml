l_simp_chinese:
 ROC_pw_assembly:0 "咨议院参政大会"
 ROC_pw_assembly_desc:0 "召集各地咨议代表，商定统一后的国家议程与战后重建次序。"
 ROC_pw_royalism:0 "尊皇攘夷"
 ROC_pw_royalism_desc:0 "尊皇团体要求在战后议程中维护皇统与国家尊严。容纳这一政治主张，可以为共同的复兴事业争取传统力量的支持；国家制度仍须由后续议程议定。"
 ROC_pw_progressives:0 "进步会"
 ROC_pw_progressives_desc:0 "进步会以国家建设与渐进改革为纲，争取在新议会中组织多数。"
 ROC_pw_constitutionalists:0 "宪政会"
 ROC_pw_constitutionalists_desc:0 "宪政会承诺以成文规则约束行政权，并在咨议院内协调施政。"
 ROC_pw_liberals:0 "自民盟"
 ROC_pw_liberals_desc:0 "自民盟推动扩大公民政治空间，以地方自治和公开竞争重建秩序。"
 ROC_pw_datong:0 "大同会"
 ROC_pw_datong_desc:0 "大同会提出以社会平等和共同责任为核心的共和国方向。"
 ROC_pw_guild_participation:0 "工协参政"
 ROC_pw_guild_participation_desc:0 "允许工协代表进入公共议程，使劳动者参与战后制度协商。"
 ROC_pw_veteran_privileges:0 "军人优待"
 ROC_pw_veteran_privileges_desc:0 "承认退伍军人的服役贡献，规划其安置、保障与就业优先次序。"
 ROC_pw_mixed_economy:0 "混合制经济"
 ROC_pw_mixed_economy_desc:0 "兼顾公共服务与私人经营，先确定战后经济重建的混合框架。"
 ROC_pw_crown_responsibility:0 "首辅对陛下负责"
 ROC_pw_crown_responsibility_desc:0 "明确首辅向陛下负责的宪制关系，并以咨议院监督补足程序。"
 ROC_pw_split_guilds:0 "拆分工协"
 ROC_pw_split_guilds_desc:0 "厘清工协的政治倡议与行业职能，避免组织垄断劳动代表权。"
 ROC_pw_provincial_democracy:0 "省级民主"
 ROC_pw_provincial_democracy_desc:0 "建立省级选举和议事程序，让地方社会参与公共决策。"
 ROC_pw_assembly_responsibility:0 "首辅对咨议院负责"
 ROC_pw_assembly_responsibility_desc:0 "将首辅施政责任交由咨议院追问，形成稳定的议会问责。"
 ROC_pw_national_guild_federation:0 "成立全国工协联合会"
 ROC_pw_national_guild_federation_desc:0 "联结地方工协并建立全国协调机构，统一劳资协商与行业标准。"
 ROC_pw_limit_provinces:0 "限制省级权力"
 ROC_pw_limit_provinces_desc:0 "界定中央与省级权限，减少战后行政摩擦并维持国家统一。"
 ROC_pw_individual_investment:0 "鼓励个体投资"
 ROC_pw_individual_investment_desc:0 "为小业主与个人储蓄进入生产经营提供清晰政策预期。"
 ROC_pw_demobilization:0 "战后军队复员"
 ROC_pw_demobilization_desc:0 "分批遣散战时部队，兼顾财政承受力、边防需求与退伍安置。"
 ROC_pw_equality_before_law:0 "法不阿贵"
 ROC_pw_equality_before_law_desc:0 "以统一司法原则约束身份特权，确保法律适用于所有公民。"
 ROC_pw_farm_associations:0 "发挥农协组织作用"
 ROC_pw_farm_associations_desc:0 "扶助农协参与乡村生产、灌溉和基层互助网络的恢复。"
 ROC_pw_veteran_aid:0 "成立军人互助会"
 ROC_pw_veteran_aid_desc:0 "设立退伍军人互助组织，协助寻找工作并缓解家庭生活压力。"
 ROC_pw_merit_land:0 "军功与土地"
 ROC_pw_merit_land_desc:0 "以服役功绩和复员安排为依据讨论土地安置，避免无序分配。"
 ROC_pw_state_guilds:0 "国有工协"
 ROC_pw_state_guilds_desc:0 "建立公共所有的行业组织，优先恢复基础生产和关键供应链。"
 ROC_pw_cabinet_governance:0 "内阁理政、咨议院议政"
 ROC_pw_cabinet_governance_desc:0 "由内阁承担日常行政，咨议院负责审议预算与公共法案。"
 ROC_pw_formal_appointments:0 "人事任命请示形式化"
 ROC_pw_formal_appointments_desc:0 "重要人事任命向陛下请示备案，确立可预期的任命程序。"
 ROC_pw_impeachment_power:0 "授予咨议院弹劾权"
 ROC_pw_impeachment_power_desc:0 "赋予咨议院依法弹劾的权力，使严重失职可以接受公开审查。"
 ROC_pw_privatization:0 "以官改私"
 ROC_pw_privatization_desc:0 "将适合竞争经营的官营资产转为私人经营，同时保留公共监管。"
 ROC_pw_prudent_enforcement:0 "审慎执法"
 ROC_pw_prudent_enforcement_desc:0 "要求执法依据明确、程序可查，防止战后整顿演变为任意惩罚。"
 ROC_pw_local_policy:0 "地方咨议院参与决策"
 ROC_pw_local_policy_desc:0 "让地方咨议院参与本省民政、教育和建设政策的制定。"
 ROC_pw_local_appointments:0 "地方咨议院参与人事任免"
 ROC_pw_local_appointments_desc:0 "由地方议事机构参与重要人事讨论，提升基层行政问责。"
 ROC_pw_market_order:0 "规范市场秩序"
 ROC_pw_market_order_desc:0 "整顿合同、账册和反垄断规则，为生产者公平进入市场提供保障。"
 ROC_pw_universal_suffrage:0 "推行普选权"
 ROC_pw_universal_suffrage_desc:0 "逐步建立普选制度，让成年公民以选票决定代表席位。"
 ROC_pw_attack_privilege:0 "打击特权阶级"
 ROC_pw_attack_privilege_desc:0 "清理妨碍司法和公共财政的特权安排，扩大机会平等。"
 ROC_pw_moderate_line:0 "宣扬温和路线"
 ROC_pw_moderate_line_desc:0 "以协商改革和法治竞争维护温和政治路线，避免激烈报复循环。"
 ROC_pw_private_investment:0 "鼓励民间投资"
 ROC_pw_private_investment_desc:0 "改善融资与产权预期，鼓励民间资本投入工商业恢复。"
 ROC_pw_public_foundations:0 "维持国有化基础"
 ROC_pw_public_foundations_desc:0 "保留国有化基础和战略公共资产，确保重建资源服务全国。"
 ROC_pw_direct_elections:0 "全民直接选举"
 ROC_pw_direct_elections_desc:0 "扩大代表的直接选举范围，提升公共权力的民意基础。"
 ROC_pw_industrial_democracy:0 "产业民主"
 ROC_pw_industrial_democracy_desc:0 "让工人代表参与企业协商和安全管理，推动产业内部共同治理。"
 ROC_pw_loyalty:0 "誓死效忠"
 ROC_pw_loyalty_desc:0 "组织军中宣誓与复员教育，将将士的效忠落实到守护国家秩序、履行军人职责与服从统一指挥。"
 ROC_pw_assembly_permits:0 "规范群众行动审批流程"
 ROC_pw_assembly_permits_desc:0 "为群众集会设定透明、统一的申请流程，兼顾表达与公共秩序。"
 ROC_pw_monopoly_control:0 "管控垄断企业"
 ROC_pw_monopoly_control_desc:0 "依法限制垄断企业滥用市场力量，保护新兴经营者和消费者。"
 ROC_pw_association_permits:0 "会社审批制度"
 ROC_pw_association_permits_desc:0 "规范会社登记与活动备案，使社会组织能够在公开规则下运作。"
 ROC_pw_association_politics:0 "会社政治时代"
 ROC_pw_association_politics_desc:0 "允许会社依法参与政治倡议，明确组织责任与议会监督渠道。"
 ROC_pw_tenancy:0 "永佃与转租"
 ROC_pw_tenancy_desc:0 "保障佃户稳定耕作和合理转租，减少土地关系变动带来的冲突。"
 ROC_pw_simplify_administration:0 "简化行政审批"
 ROC_pw_simplify_administration_desc:0 "合并重复审批并公开办事时限，减少重建项目的行政成本。"
 ROC_pw_regional_development:0 "维持区域协调发展"
 ROC_pw_regional_development_desc:0 "在省际交通、教育和投资上保持协调，避免资源只流向沿海中心。"
 ROC_pw_school_education:0 "注重学校思想教育"
 ROC_pw_school_education_desc:0 "恢复学校教学与公民教育，培养具备公共责任的新一代。"
 ROC_pw_local_finances:0 "地方财政松绑"
 ROC_pw_local_finances_desc:0 "扩大地方预算的自主安排空间，同时要求账目公开并接受审计。"
 ROC_pw_civil_service:0 "改革吏员选拔"
 ROC_pw_civil_service_desc:0 "以考试和履历改进吏员选拔，逐步削弱任人唯亲的旧习。"
 ROC_pw_clean_government:0 "廉洁奉公"
 ROC_pw_clean_government_desc:0 "建立采购披露和财产审查惯例，惩治侵吞复兴资金的行为。"
 ROC_pw_selection_trials:0 "选官制度试点"
 ROC_pw_selection_trials_desc:0 "先在若干地区试行公开选官，比较考核标准后再推广。"
 ROC_pw_open_petitions:0 "广开言路"
 ROC_pw_open_petitions_desc:0 "保障公民向议会递交请愿，使政策争议能够进入正式审议。"
 ROC_pw_redistribution:0 "扩大二次分配"
 ROC_pw_redistribution_desc:0 "通过税制、公共服务和社会救济缓和战后收入差距。"
 ROC_pw_civil_rights:0 "鼓励民权运动"
 ROC_pw_civil_rights_desc:0 "扩大结社、表达与平等保护，使个人权利有明确制度支撑。"
 ROC_pw_employment:0 "保障就业"
 ROC_pw_employment_desc:0 "以公共工程和产业恢复创造岗位，减少退伍与战后失业压力。"
 ROC_pw_student_branches:0 "发展学生支部"
 ROC_pw_student_branches_desc:0 "支持学生在校内组织公共服务和政策讨论，拓宽社会参与渠道。"
 ROC_pw_heavenly_order:0 "“天行有常”"
 ROC_pw_heavenly_order_desc:0 "以“天行有常”为政治伦理，形成尊皇、法度与公共责任相结合的秩序。"
 ROC_pw_wise_ruler:0 "致君尧舜"
 ROC_pw_wise_ruler_desc:0 "确立贤能政治与咨议监督并行的治理原则，约束行政权力的边界。"
 ROC_pw_gentlemen:0 "君子党人"
 ROC_pw_gentlemen_desc:0 "以廉洁选任、开放议会和地方自治塑造负责任的公民政治。"
 ROC_pw_commonwealth:0 "天下为公"
 ROC_pw_commonwealth_desc:0 "以天下为公为目标，把平等权利、就业保障和社会互助纳入共和国建设。"
 ROC_pw_ending_heavenly_order:0 "天行有常"
 ROC_pw_ending_heavenly_order_desc:0 "尊皇秩序与依法施政并行，巩固战后社会的公共信任。"
 ROC_pw_ending_wise_ruler:0 "致君尧舜"
 ROC_pw_ending_wise_ruler_desc:0 "贤能政府接受咨议监督，提高决策稳定性与施政效率。"
 ROC_pw_ending_gentlemen:0 "君子党人"
 ROC_pw_ending_gentlemen_desc:0 "公开选任与地方自治改善行政质量，鼓励合法的产业建设。"
 ROC_pw_ending_commonwealth:0 "天下为公"
 ROC_pw_ending_commonwealth_desc:0 "提升研究与工厂效率，以平等权利、就业保障和社会互助支撑全国发展。"
 ROC_pw_construction_bonus:0 "战后建设技术计划"
 ROC_pw_public_shift_tt:0 "将向公有化方向的变化加入现有待落实计划；经济权力平衡机制有效时，沿用每月推进规则与区间上限。"
 ROC_pw_private_shift_tt:0 "将向自由化方向的变化加入现有待落实计划；经济权力平衡机制有效时，沿用每月推进规则与区间上限。"

 ROC_pw_regional_build_tt:0 "优先在本国控制的核心省份、且仍有基础设施槽位的地区建设1级基础设施；没有合适地区时补偿政治点。"
 ROC_pw_employment_build_tt:0 "优先在本国控制的核心省份、且仍有民用工厂槽位的地区建设1座民用工厂；没有合适地区时补偿政治点。"
 ROC_pw_timed_investment:0 "私营投资环境"
 ROC_pw_timed_investment_desc:0 "持续365日：建筑建造速度+5%，工厂产出+2%。同名精神的修正不重复叠加。"
 ROC_pw_timed_rural_recovery:0 "乡村建设恢复"
 ROC_pw_timed_rural_recovery_desc:0 "持续270日：基础设施建造速度+5%，稳定度+1%。同名精神的修正不重复叠加。"
 ROC_pw_timed_research:0 "教育与研究协作"
 ROC_pw_timed_research_desc:0 "持续270日：研究速度+2%。"
 ROC_pw_timed_administration:0 "行政程序改进"
 ROC_pw_timed_administration_desc:0 "持续180日：建筑建造速度+3%，每日政治点+0.01。"
 ROC_pw_mixed_economy_construction_bonus:0 "战后建设技术计划"
 ROC_pw_national_guild_federation_construction_bonus:0 "战后建设技术计划"
 ROC_pw_market_order_construction_bonus:0 "战后建设技术计划"
 ROC_pw_private_investment_construction_bonus:0 "战后建设技术计划"
