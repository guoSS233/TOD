 GPS_governance.23.t:0 "各军的饷册"
 GPS_governance.23.d:0 "军需官将几本饷册搬进会议室，封面上分别写着各部番号。相同月份的数字对不上：一册记的是应发数，一册只列实际领款，还有一册把运输沿途垫付的费用算入欠饷。各军都希望委员会补足缺口，却不愿让别人的账先于自己结算。\n\n张作相请旧军代表把签名补在原始单据上，好让地方相信这不是借查账削减编制。许兰州则拿出轮换计划，提醒诸人：无论哪个防区承担任务，士兵都得按时吃饭。张景惠要在预算上签字，他要求书记员注明拨款来源和复核人，而不是把一笔无法核实的总数当作已经结清。\n\n集中预算须先拨政治资源整理账册；若此前已承诺优先整理军饷，准备工作可减轻这笔费用。各军分担能省下眼前支出，却会留下不满，也增加地方对经费的控制；限额预支需要较少款项，只能先照顾一部分人。三十日后再核原地与签收，地点失控便必须重新登记。\n\n门外的领饷人等着副官抄回结果。张景惠请他们知道今日决定的是如何核账和拨付，不是保证所有旧欠一次付清。账房把空出的复核栏留给各部签名，谁先收到款、谁还在等待，都应在回访时写明。"
 GPS_governance.23.a:0 "集中预算并复核"
 GPS_governance.23.b:0 "由各军分担缺口"
 GPS_governance.23.c:0 "限额预支"
 GPS_governance.23.invalid:0 "条件已变，归档此案"
 GPS_governance.25.t:0 "防区与轮换表"
 GPS_governance.25.d:0 "许兰州把地图铺在长桌上，用红蓝铅笔标出各军目前的防区。几条线穿过同一处车站：一部说自己负责守卫，另一部则把那里算作轮换时的集结点。若两份计划同时执行，运输会互相占用；若谁也不肯动，另一处哨所就没有替换的人。\n\n“共同作战要有共同的时刻表。”许兰州指着名册，提出按期交接防区。张作相带来旧军的保留意见：将领们愿意商量轮换，却不愿在未收到补给和明确命令时让原部离开。张景惠要求两人把接防人、路线和经费列清，再由会长签署送各部确认。\n\n委员会可出资安排共同轮换；先前承诺明确防区责任，能够减少协调费用。也可以保留现有防区，获得地方支持但让统一调度更难；限期轮换花费较少，却要承受匆促交接带来的不满。无论采取哪一种，三十日后都须检查原地控制和地方回执。\n\n一名参谋问，若途中丢掉集结地，名册还算不算执行。许兰州划去地图上的一支箭头，答道：“那就送回来重排，不能说人已经到了。”张作相把这句话写在附页，准备带给仍在犹豫的旧军军官。"
 GPS_governance.25.a:0 "拨款共同轮换"
 GPS_governance.25.b:0 "保留各军防区"
 GPS_governance.25.c:0 "限期轮换"
 GPS_governance.25.invalid:0 "条件已变，归档此案"
 GPS_governance.27.t:0 "旧军装的去处"
 GPS_governance.27.d:0 "汤玉麟被软禁后，门外的警卫每天更换，旧部送来的请示却仍堆在值班室。有人担心家属受到牵连，有人询问被扣下的军饷，还有人要求知道自己能否留在原驻地。名单上既有曾在都督府办事的军官，也有只按旧命令值勤的士兵。\n\n张作相请各部约束追究和报复，提出先核查身份、保障人身安全，再商量待遇；他说，不能要旧军相信委员会的签字，同时让他们不敢来递交名单。许兰州关心警戒和共同防务，要求限制未经登记的武装行动，但反对把所有等待审查的人都当成敌人。张景惠要在处理单上签字，问清拨款从何处出、由谁接收申诉。\n\n委员会可以拨出较多政治资源，处理安全与待遇登记；也可用较少资源安排有限安置，并保留必要限制，承受由此产生的不满。若眼下无力办理，也可延期，先释放议事位置，等资源允许时重提。无论怎样选择，都不能把一张名单写成人人已经得到安置。\n\n一位旧军副官把家属地址交给书记员，请求至少回一张收条。张景惠在收条上签名，并注明只是受理，不代表待遇已经结算。"
 GPS_governance.27.a:0 "拨款处理待遇与安全"
 GPS_governance.27.b:0 "有限安置并保留限制"
 GPS_governance.27.c:0 "延期办理"
 GPS_governance.27.invalid:0 "条件已变，归档此案"
 GPS_governance.28.t:0 "执行回执"
 GPS_governance.28.d:0 "书记员把三摞回执放到会长面前：军饷、共同防区和任命。每摞都有签名，也有附在背面的保留意见。领款人承认收到的一部分饷银，并未抹掉旧欠；防区军官签收轮换表，并不保证下一次运输仍能照常；代理人的回报则说明印信和账册并非同日交到。\n\n张作相逐一核对旧军的署名，指出有的部队愿意继续合作，却要求将原先的失效记录附在新回执后面。许兰州把已确认的防区标上日期，提醒委员会不可把当时的控制情况当成永远不变。张景惠拿笔准备签署总册，问会计：重新核查与补做单据的费用，是否已经列入预算？\n\n委员会可以拨款归档并承担复核责任。若已签承诺未能兑现，补核需要更多政治资源；若三项均按重议、集中预算和共同轮换履行，则复核费用较低；也可免费保留各方异议，承受不满，或者暂缓归档，日后重新提交。成功回执说明有关安排在回访时得到核验，不代表所有欠款和未来防务都已解决。\n\n会长让书记员在总册首页留下各项签收日期和承办人的名字。张作相收起那份带有异议的副本，准备交还相关军官；许兰州则保留地图，供下一次轮换前重新核对。"
 GPS_governance.28.a:0 "拨款复核归档"
 GPS_governance.28.b:0 "保留异议并归档"
 GPS_governance.28.c:0 "延期归档"
 GPS_governance.28.invalid:0 "条件已变，归档此案"
 GPS_governance.29.t:0 "委员会的保境安排"
 GPS_governance.29.d:0 "战事平息后，委员会终于有机会讨论超出下一次调遣的安排。桌上摊着军饷、防区和任命回执，汤旧部的处理单也已登记。它们证明有人承担过具体事务，却不能替未来每一次会议做决定。窗口传来车站报点声，铁路仍要运送军需与地方物资，账房也仍在等待各军下月的开支。\n\n许兰州主张为共同任务准备清楚的授权与经费，使不同部队接到同一份可执行的命令。张作相希望保留防区军官的责任，否则那些刚刚交回签收单的旧军可能再次拒绝合作。张景惠说，会长可以在集体决定上签字，却不能替各部保证没有列入预算的支出。三人都要求把签署人、经费和保留意见写进文书。\n\n共同授权需要拨款，并持续承担共同军令的财政负担；保留防区自主会维持地方权限，也要接受共同调遣较难的代价。集体交接准备同样需要经费，留下成文程序和持续行政负担，但它只是关东司内部准备，不能代表任何外方已经同意。\n\n书记员收起三份草案，请会长选择一份签署。张作相将要把决定带给各军，许兰州负责按所选授权重排计划。谁签下责任，谁便须在下一次预算争论时解释它。"
