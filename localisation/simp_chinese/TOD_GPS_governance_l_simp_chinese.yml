 GPS_governance.40.t:0 "两封诏书与一张空白纸"
 GPS_governance.40.d:0 "参谋把两封旧信放在地图两侧，纸边被手指磨得发白。顺天的信提到共同防务，应天的信问及交通；如今两封信的送达人都已离开，沿线驻军却仍等着命令。有人主张守住眼前的地方，先把粮饷送到哨所；有人希望派人探听各方意向，也有人要求尽快整顿部队，为入关做好准备。\n\n军需官没有参加争论，只把运力表推到地图中央。表上最远的车站旁画着一个圈：桥梁尚须修理，雨季过后能否通车还不知道。年轻参谋建议把计划写得慷慨一些，军需官便问他，若车皮不足，先送弹药还是粮食。窗外传来换班的脚步声，会议桌边静了一会儿，等着有人在三份提案上落笔。"
 GPS_governance.41.t:0 "关内联络草案"
 GPS_governance.41.d:0 "联络员在灯下摊开一张旧路条，印泥已淡得看不清日期。上次往西去的信使在途中换过两次马，他记得山口的茶棚，却不敢断言那里现在由谁守着。参谋请他沿地图画出走过的路，又让书记员把沿途可供投递的地点逐一记下。\n\n接下来该准备什么，屋里意见不一。军官想先谈编制与指挥，账房认为应当先理清饷银和税款，地方代表则关心任命文书由谁签发。联络员听完，把三只空信封并排放在桌上：“信里写什么，我可以照办；可收信的人愿不愿意答，还得看他们自己。”灯油快尽时，笔尖悬在第一页纸上，等候会议确定先写哪一项。他将帽檐上的尘土拍落，静静等着下一次出发。"
 GPS_governance.44.t:0 "把桌子搬回地方"
 GPS_governance.44.d:0 "车站值班室墙上留着拆地图的钉孔。地方官抱来一摞账簿，最上面记着尚未结清的车皮费；军官则要求把警备、粮仓和伤员转运列入交接。窗外几名搬运工正在卸箱，听说驻员可能减少，便来询问往后找谁签收。\n\n县官从账簿里抽出一张发黄的收据，指着上面模糊的印章说，仓库钥匙能交，欠下的运费却不会跟着钥匙一起消失。军官答应留下清单，却担心人手撤走后无人护送下一批伤员。两人逐项商量，争到天色暗下来，仍有几处空格没有填上名字。站长把钥匙搁在桌角，等候他们决定哪些事务由县署接办，哪些人还须留在这里。搬运工在门外蹲着，怕漏听自己的名字。"
 GPS_governance.45.t:0 "退伍名册"
 GPS_governance.45.d:0 "车站长椅上放着三本名册：一本记欠饷，一本记求职，另一本夹着伤残证明和无法送达的寻人信。一名退伍兵在三本册子里都找到了自己的名字。他问经办员，若先领到工作介绍，欠饷收据是不是就没用了。经办员摇头，让他把收据收好。\n\n厂区代表愿意先登记手艺，却不敢保证人人都能进厂；军官说欠饷拖得太久，至少应该先把数目核实；医务人员则指着一封寻人信，提醒大家有些家属连亲人去了哪里都不知道。三人谁也说服不了谁。站长走进来，告诉他们候车室已经坐满，等候的人希望今天能听到一个先后次序。经办员翻开空白页，准备记下会议的决定。窗外有人轻声叫号，长椅上的人纷纷抬起头。"
 GPS_governance.47.t:0 "新军服与旧番号"
 GPS_governance.47.d:0 "裁缝把一件新军服挂在椅背上，旧番号还缝在袖口。他问来量尺寸的军官，布牌要不要立刻拆掉；军官看了看身后的同僚，说先留着，免得回营时认不出彼此。另一名军官却担心各部仍按旧习惯行事，遇到紧急调动时谁也不肯听谁的。\n\n军需官把一串钥匙放在桌上：仓库可以改名，但弹药由谁核发、饷银由谁领取，还得写清楚。地方代表希望保留熟悉的人手，便于照看驻地；参谋则提出统一训练和传令，避免部队各自为政。裁缝在一旁收起剪刀，等他们商量好新的领章和旧番号怎样共处。桌上的钥匙被推来推去，始终没有人先拿起来。裁缝望着那件军服，重新铺平了袖口。"
 GPS_governance.48.t:0 "两本账合成一本"
 GPS_governance.48.d:0 "预算员把东北煤车的运费写在左栏，把各地请求的维修经费写在右栏。煤车承运人带来一叠沾灰的收据，说去年垫付的油料至今没有结清；修桥匠却指着河上的断梁，问若不尽快备料，今年的煤又该怎么运出去。\n\n地方代表拿起算盘核对旧款，拨到一半发现其中一张收据缺了日期。承运人着急地解释，那天夜里车队赶路，账房是在车厢里盖的章。另一名代表提议先拨款修桥，等路通后再议欠款，立刻招来反对：垫钱的人已经等了一年。窗边的账房默默把两份清单誊好，准备交给主持会议的人裁定先后。算盘珠停在半途，谁都没有把它拨回原位。走廊上的承运人望着门缝，等着听里面的动静。"
 GPS_governance.49.t:0 "县署里的授权书"
 GPS_governance.49.d:0 "县署告示板上留着旧命令的纸角。检查员钉上新的报账表格，差役看了一眼便说，填写栏太窄，写不下村民关于重复收费的申诉。县官从抽屉里取出一摞旧纸，最下面压着印章：“表格可以换，可收下的事总得有人答复。”\n\n检查员认为统一格式便于查账，县官却担心每一件小事都要等远方回文，耽误农时。差役站在门边，手里还攥着一位老人刚送来的申请；老人要修通通往田地的水渠，正等着知道该找谁签字。争论渐渐低下来，检查员拿笔在表格背面划出几行空白，请县官先写事情经过。至于印章今后放在谁手里，屋里的人还没有定论。老人没有催促，只把湿透的帽子放在膝上。"
 GPS_governance.50.t:0 "最后一张返乡车票"
 GPS_governance.50.d:0 "清晨的站台上，退伍兵将新证件和旧军饷收据叠在一起，怕挤车时弄丢。售票员问他去哪里，他迟疑片刻才报出家乡；旁边有人仍在等伤残证明，也有人不知道厂里是否有空位。站长把未领票名单交到窗口，请经办员趁开车前再核一次。\n\n一名退伍兵发现同乡的名字漏在单上，急忙跑回候车室寻找。医务人员查看后说，那人需要担架，普通车厢不易上下；搬运工听见，主动找来两块木板帮忙。站长同列车员商量腾出的位置，又让人把空缺的住址补上。汽笛响起时，仍有几个人站在窗口前，等着路费、证明和下一趟车的消息。站长合上名单，没有把他们的名字划掉。"
 GPS_governance.51.t:0 "粮仓门前的留种袋"
 GPS_governance.51.d:0 "县署粮仓门口堆着麻袋，袋口分别系红线和白线。红线是可供征购的粮食，白线是农户为下季留下的种子。经办员报出军需缺口，农户便把一只白线袋往后拖：“这袋运走，明年拿什么种？”车夫站在旁边，算着自己的牲口还能走几趟。\n\n仓管员提议先称红线袋，称完才发现其中一袋受潮，比账上轻了许多。农户说连日下雨，路上耽搁不得已；经办员则担心照这个数目收购，车队凑不齐需要的粮食。有人提出提高价格另雇车夫，有人坚持留足种子再说。天黑之前，县官必须决定先把哪一笔写进收购簿，仓库门口的人都等着他的回答。车夫解开缰绳，让牲口先在檐下歇一会儿。"
 GPS_governance.42.t:0 "草案归档"
 GPS_governance.43.t:0 "联络中断"
 GPS_governance.46.t:0 "退伍回执"
 GPS_governance.52.t:0 "粮仓回执"
 GPS_governance.53.t:0 "地方项目失效"
 GPS_governance.54.t:0 "朝鲜政策档案"
 GPS_governance.55.t:0 "霞仪政策档案"
 GPS_governance.56.t:0 "西日本政策档案"
 GPS_governance.54.d:0 "边境集市散场后，商人带来一张写满货价的纸。纸上有人参、布匹和药材，也有被雨水洇开的过路费。沿河的住户希望日后往来更便利，驻防军官却担心有人借商队打探哨所。\n\n负责起草的人把两种意见记在同一页，又留出一栏询问对岸商人的需要。纸页只能表达关东司愿意讨论的事；如何回应，还得由朝鲜方面自己决定。有人提议先把模糊的字迹重新抄清。"
 GPS_governance.55.d:0 "港务员将一只空鱼箱搬进屋，箱盖上还残留着盐渍。渔民说海上天气变化快，希望遇险时能找到避风的地方；船主更关心货物抵港后如何登记，莫让船在码头白等。\n\n有人建议先拟一份关于航路和商贸的意见，也有人提醒，海面上任何安排都需要对岸愿意共同商量。书记员写下有关霞仪的备忘，把渔民提到的避风地点附在末页。港口的钟声从窗外传来，提醒船主潮水将退。"
 GPS_governance.56.d:0 "一份西日本报纸被送到办公室，刊着港口工人卸货的照片。负责贸易的人指着照片询问煤和机械是否有销路，军官却问起海上船只的识别办法。两人都承认，凭一张报纸看不清对方的真实打算。\n\n会议决定先整理各部门希望提出的问题：商船如何通行，遇到争议怎样联络，彼此的立场又应如何表述。稿子写完后仍放在桌上，等待进一步商议。"
